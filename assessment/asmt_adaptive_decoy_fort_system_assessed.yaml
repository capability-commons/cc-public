title:                  Adaptive decoy forts for glide bomb disruption assessed
verdict:                feasible_now
summary:                |
                        Adaptive_Decoy_Fort_System is feasible to
                        field now because all of its elements already
                        exist in some form: physical fortifications
                        and decoys, heaters and emitters for
                        signatures, rugged laptops with tactical C2
                        software, wired and wireless links,
                        pre-planned artillery and obstacle control,
                        and organic UAVs and FPV drones. The concept
                        is a systems-integration and doctrine problem
                        rather than a technology invention problem,
                        and the candidate requirements mostly call for
                        straightforward configuration and software
                        development on top of current practices.
                        Effectiveness against Russian
                        glide-bomb-enabled infiltrations will vary by
                        terrain, engineering and fire support density,
                        and by how quickly Russian forces adapt their
                        targeting and ISR fusion to discriminate
                        decoys. The verdict would shift to
                        feasible_with_development or speculative only
                        if key assumptions fail, for example if
                        plausible decoy signatures at low power and
                        cost prove insufficient to draw strikes, or if
                        EW and logistical constraints prevent reliable
                        C2 and UAV tasking, in which case more
                        advanced low-probability-of-intercept
                        communications, better signature generators,
                        or operational-level changes in air defence
                        posture would be needed.

dimension:

  maturity:
    id_self:            dim_adaptive_decoy_fort_system_assessed.maturity
    guid_self:          dim_eb09d9ac26a94f5babd5fd67dc97c37b
    rating:             adequate
    rationale:          |
                        Each subsystem in Adaptive_Decoy_Fort_System
                        has precedent: field fortifications and
                        hardened bunkers are routine; visual and
                        thermal decoys are widely used; tablet-based
                        C2 tools, pre-planned fire control, remote
                        obstacle actuation, and UAV-based
                        reconnaissance and attack are all mature in
                        Ukrainian service. What is less mature is a
                        combined, doctrine-backed package that treats
                        decoys, glide-bomb damage footprints, and
                        kill-zones as one managed system. This would
                        move to strong as units accumulate field
                        experience with integrated decoy-kill-zone
                        schemes and refine TTPs backed by after-action
                        data.
    relation:           []

  off_the_shelf:
    id_self:            dim_adaptive_decoy_fort_system_assessed.off_the_shelf
    guid_self:          dim_a3a4e0dbf1974f1d8f2c0b2250c715ce
    rating:             strong
    rationale:          |
                        The concept can draw on off-the-shelf items:
                        prefabricated shelters and building materials
                        for decoys, commercial heaters and RF
                        emitters, existing Ukrainian or NATO-standard
                        fire control interfaces, ruggedized laptops
                        and tablets, COTS networking gear, and
                        commercial quadcopters and FPV drones. No
                        component demands new physics or exotic
                        hardware. The rating would only drop if a
                        requirement emerges for highly specialized
                        signature generators or classified
                        low-probability-of-intercept radios that are
                        not already in inventory or on the market.
    relation:           []

  integration:
    id_self:            dim_adaptive_decoy_fort_system_assessed.integration
    guid_self:          dim_a8dafc6d3dec4b549660bb520cf91af9
    rating:             adequate
    rationale:          |
                        Integration requires connecting decoy
                        signature controllers, sensor inputs,
                        artillery fire control, obstacle systems, and
                        UAV tasking into a single software tool with
                        resilient comms. These integrations are
                        technically straightforward, using known
                        protocols and data formats, but must be
                        hardened for EW and kept simple for operators,
                        and must align with national doctrine. This
                        would become strong once a reference
                        implementation is proven in a few sectors and
                        standard interfaces to national fire control
                        and UAV control systems are validated and
                        documented.
    relation:           []

  logistics:
    id_self:            dim_adaptive_decoy_fort_system_assessed.logistics
    guid_self:          dim_0d14a45843da442b964f4081a7912ca7
    rating:             adequate
    rationale:          |
                        The system needs engineering effort to build
                        hardened hides and decoy forts, plus ongoing
                        supply of power (generators, fuel, or
                        batteries), spare parts for heaters and
                        emitters, and munitions and drones for
                        kill-zones. Ukrainian forces already sustain
                        similar assets, so this is an incremental
                        load, but density targets like three decoys
                        per real position can strain manpower and
                        materials in high-tempo sectors. The rating
                        would improve to strong if modular decoy kits,
                        standardized power solutions, and simplified
                        emplacement procedures reduce engineer time
                        and resupply burden per decoy.
    relation:           []

  cost:
    id_self:            dim_adaptive_decoy_fort_system_assessed.cost
    guid_self:          dim_8e8b1c8556b8494ea6fdc236f4bd509c
    rating:             strong
    rationale:          |
                        Most costs are in low-tech materials, simple
                        electronics, and software integration on
                        existing hardware. Decoys can use cheap
                        structures and surplus or commercial
                        components; software can run on current rugged
                        tablets; no high-end air defence interceptors
                        are required. Compared with the cost of losing
                        hardened command posts or artillery to glide
                        bombs, the cost-benefit is favorable. This
                        rating could weaken if operational experience
                        shows that decoys must be much more elaborate,
                        or if large numbers of expendable UAVs and
                        loitering munitions are required to make
                        kill-zones effective.
    relation:           []

  time_to_field:
    id_self:            dim_adaptive_decoy_fort_system_assessed.time_to_field
    guid_self:          dim_82ad8b9db8014676ad3166984deda7e5
    rating:             strong
    rationale:          |
                        Given that all components are available, an
                        initial capability could be fielded in months
                        by packaging TTPs, simple decoy kits, and a
                        basic planning tool that overlays bomb lethal
                        radii, decoy locations, and pre-planned fires
                        on existing digital maps. Progressive
                        refinement can follow. Time-to-field would
                        lengthen, and the rating shift to adequate,
                        only if national-level certification, safety
                        reviews for remote obstacles, or security
                        vetting for C2 software introduce long
                        bureaucratic delays.
    relation:           []

  operational_fit:
    id_self:            dim_adaptive_decoy_fort_system_assessed.operational_fit
    guid_self:          dim_c7017c838d184caa80def72764e022e7
    rating:             adequate
    rationale:          |
                        The concept fits Ukrainian defensive doctrine
                        that already emphasizes dispersion, deception,
                        pre-registered fires, and UAV integration, and
                        it directly addresses glide-bomb-enabled
                        infiltration described in the need. However,
                        it depends on sectors having enough artillery,
                        drones, and engineering capacity, and on
                        commanders accepting added planning
                        complexity. It may be less suited to open
                        terrain or highly fluid offensive operations.
                        The rating would rise to strong if doctrinal
                        publications, training pipelines, and
                        exercises formally incorporate adaptive decoy
                        fort networks and show that units can manage
                        them without overload.
    relation:           []

product:

  rugged_c2_tablet_software:
    id_self:            prd_adaptive_decoy_fort_system_assessed.rugged_c2_tablet_software
    guid_self:          prd_d6fe0493c8c741289b5ef7026e769844
    name:               Ruggedized tactical C2 tablets with map-based fire planning software
    role:               |
                        Hosts the Adaptive_Decoy_Fort_System software,
                        maintains the live operational picture,
                        overlays bomb lethal radii, geofences, decoys,
                        and kill-zones, and interfaces with artillery
                        and UAV control systems
    maturity:           fielded
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        documentation or field reports of existing
                        Ukrainian or NATO digital fire control and C2
                        systems such as Kropyva or similar tools in
                        current use.
    relation:           []

  artillery_fire_control_interface:
    id_self:            prd_adaptive_decoy_fort_system_assessed.artillery_fire_control_interface
    guid_self:          prd_7025344dcb0c4747b738d216d3a227db
    name:               Digital artillery fire control systems using standardized fire request messages
    role:               |
                        Receives fire missions generated by the system
                        for pre-planned and on-call fires in defined
                        kill-zones around decoy impact areas
    maturity:           fielded
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        technical specifications and operational
                        manuals of Ukrainian artillery C2 systems
                        indicating support for external digital fire
                        request formats.
    relation:           []

  prefabricated_shelter_kits:
    id_self:            prd_adaptive_decoy_fort_system_assessed.prefabricated_shelter_kits
    guid_self:          prd_4fd50cdc00b44cf4a3eb6e03295ef608
    name:               Modular prefabricated shelters and construction materials
    role:               |
                        Provide physical structures for hardened
                        positions and visually convincing decoy forts
                        that resemble command posts or firing points
                        from aerial and satellite views
    maturity:           commercial
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        vendor catalogs and procurement records
                        showing availability of modular shelter
                        systems and building supplies used for field
                        fortifications.
    relation:           []

  thermal_and_visual_decoy_kits:
    id_self:            prd_adaptive_decoy_fort_system_assessed.thermal_and_visual_decoy_kits
    guid_self:          prd_94cc3e5e11784e85be1c5b2bbdb1d139
    name:               Thermal, visual, and RF decoy systems (heaters, lights, dummy antennas, RF emitters)
    role:               |
                        Generate controllable signatures at decoy
                        forts to mimic active high-value positions to
                        glide bomb targeting ISR
    maturity:           demonstrated
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        open reporting or technical data on decoy
                        systems such as inflatable or heated mock-ups
                        used for SAMs, artillery, and vehicles in
                        current conflicts.
    relation:           []

  short_range_tactical_radios:
    id_self:            prd_adaptive_decoy_fort_system_assessed.short_range_tactical_radios
    guid_self:          prd_ce9173afa8d6493e8beb1d6a896fd508
    name:               Short-dwell, low-power VHF/UHF tactical radios with LPI modes
    role:               |
                        Provide intermittent wireless control and
                        coordination links between decoy controllers,
                        C2 nodes, UAV teams, and forward observers
                        within each defended sector
    maturity:           fielded
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        equipment lists and specifications for
                        Ukrainian and allied tactical radios
                        supporting burst or LPI communication modes.
    relation:           []

  field_cable_and_optical_links:
    id_self:            prd_adaptive_decoy_fort_system_assessed.field_cable_and_optical_links
    guid_self:          prd_f5e7d65e888e407ebcac4fbacdec9644
    name:               Field telephone cable and short-range point-to-point optical or laser links
    role:               |
                        Provide wired and directional communication
                        channels resilient to EW for core C2, decoy
                        scheduling, and remote obstacle control in
                        degraded conditions
    maturity:           fielded
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        doctrine and equipment inventories describing
                        use of field telephones, fiber runs, and laser
                        comms in Ukrainian defensive positions.
    relation:           []

  scatterable_mine_and_obstacle_systems:
    id_self:            prd_adaptive_decoy_fort_system_assessed.scatterable_mine_and_obstacle_systems
    guid_self:          prd_1c8e305e085d44129d10ab9a3b143768
    name:               Remote-controlled mines and scatterable obstacle systems
    role:               |
                        Create and arm or disarm obstacles that shape
                        infiltration routes into pre-defined
                        kill-zones once glide bombs have struck decoys
                        or terrain
    maturity:           demonstrated
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        technical documentation and legal policy on
                        remote mine systems and command-detonated
                        obstacles in Ukrainian or allied service.
    relation:           []

  uav_and_fpv_fleet:
    id_self:            prd_adaptive_decoy_fort_system_assessed.uav_and_fpv_fleet
    guid_self:          prd_f7057270c75e495b9d5561bf01b11b00
    name:               Small reconnaissance quadcopters and FPV attack drones with ground control stations
    role:               |
                        Provide ISR to detect glide bomb releases and
                        infiltrating infantry and deliver precision
                        attacks on reconnaissance teams and infantry
                        in kill-zones
    maturity:           fielded
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        extensive media and operational reporting of
                        Ukrainian use of commercial and improvised
                        UAVs and FPV drones at scale.
    relation:           []

  acoustic_or_counter_battery_sensors:
    id_self:            prd_adaptive_decoy_fort_system_assessed.acoustic_or_counter_battery_sensors
    guid_self:          prd_bb91aa691a2e4d60a49e46203f22adfc
    name:               Acoustic, radar, or EO sensors for detecting aircraft and munitions trajectories
    role:               |
                        Detect glide bomb releases, impacts, and
                        movement of enemy ISR drones and infantry to
                        cue decoy activation and fire plan execution
    maturity:           demonstrated
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone; confirmation would come from
                        technical descriptions of battlefield acoustic
                        sensor arrays, counter-battery radars, and EO
                        observation systems already used to cue fires.
    relation:           []

