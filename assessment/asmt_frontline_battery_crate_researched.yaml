  time_to_field:
    id_self:            dim_frontline_battery_crate_researched.time_to_field
    guid_self:          dim_aa7506baeaf24279ac91d8d7f038fddd
    rating:             strong
    rationale:          |
                        Commercial units ship in two to five business
                        days, so a first tranche of crates in
                        commercial casings could be in the field in
                        weeks, and a ruggedised case is months of
                        packaging work. The rating would fall if EMC
                        or safety certification had to precede first
                        use.

