  operational_fit:
    id_self:            dim_frontline_battery_crate_researched.operational_fit
    guid_self:          dim_ede9d5200d8d401dbe2fc169657caeaf
    rating:             strong
    rationale:          |
                        Reporting from Ukraine shows 2500 W portable
                        power stations already chosen by mobile
                        air-defence teams for drones, thermal cameras
                        and radios because they make no engine noise,
                        no exhaust and less heat than generators,
                        which is the crate's use; and the front's
                        dependence on powered terminals is documented
                        by the effect of a two-and-a-half-hour
                        Starlink outage on drone operations. The
                        rating would fall if positions routinely lose
                        resupply for longer than a crate's stored
                        energy lasts, which nothing read establishes.

