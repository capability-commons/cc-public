  logistics:
    id_self:            dim_frontline_battery_crate_researched.logistics
    guid_self:          dim_d0c1859d7c834f9b9907847a967c2b50
    rating:             adequate
    rationale:          |
                        Swapping charged crates through the supply
                        chain parallels how batteries and water
                        already move, and portable stations of this
                        class are already delivered to and used by
                        mobile air-defence teams in Ukraine; how many
                        crates a position needs and how often they can
                        be swapped under fire is not established by
                        anything read. The rating would rise with a
                        field trial that records swap intervals.

    relation:

