title:                  Ruggedised multiday battery crate, researched
verdict:                feasible_now
summary:                |
                        The crate can be assembled now from commercial
                        lithium iron phosphate power station cores in
                        a rugged case. Two commercial units in the 2.8
                        to 3.6 kWh class are on sale for $1,200 to
                        $1,899 with 3000 to 6000 cycles, delivered in
                        days, and 2500 W portable stations of this
                        kind are already powering Ukrainian mobile
                        air-defence teams because they are silent and
                        cool. What the shelf does not give is the
                        concept's own envelope: 4 kWh in one crate
                        under 40 kg is not met by any single unit
                        read, since a 3.6 kWh station weighs about 45
                        kg and a 2.76 kWh module 29.5 kg, so either
                        two modules or a relaxed mass limit is needed;
                        and consumer casings are not rated to IP65,
                        shock or MIL-STD-461G, which is packaging and
                        qualification work rather than invention.
                        Fielded military packs are two orders of
                        magnitude smaller and show the standards a
                        militarised pack meets. The verdict would fall
                        to feasible with development if the mass limit
                        stands with 4 kWh in one crate, or if EMC
                        qualification to MIL-STD-461G is required
                        before first use.

dimension:

  maturity:
    id_self:            dim_frontline_battery_crate_researched.maturity
    guid_self:          dim_4ea1173065624a9f9133b9cb015fdc28
    rating:             strong
    rationale:          |
                        Lithium iron phosphate portable power stations
                        of 2.8 to 3.6 kWh are mass-market products
                        with 3000 to 6000 rated cycles, and
                        lithium-ion military packs have been fielded
                        for years under MIL-PRF-32052/1; the cell,
                        management and conversion technology the crate
                        needs is mature. The rating would fall if a
                        chemistry beyond lithium iron phosphate were
                        required.

