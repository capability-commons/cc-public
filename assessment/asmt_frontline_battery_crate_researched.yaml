    id_self:            dim_frontline_battery_crate_researched.off_the_shelf
    guid_self:          dim_bca5786b73a24eb5857c6c1f6cbf314a
    rating:             adequate
    rationale:          |
                        Commercial cores exist for the energy and
                        outputs, but no single unit read meets 4 kWh
                        under 40 kg: the 3.6 kWh station is about 45
                        kg and the 2.76 kWh module 29.5 kg, so the
                        envelope needs two modules or a relaxed limit,
                        and consumer casings carry no IP65, shock or
                        EMC rating. The rating would rise to strong if
                        the mass limit were relaxed to about 45 kg or
                        a ruggedised 4 kWh unit were found.

