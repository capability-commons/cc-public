  cost:
    id_self:            dim_frontline_battery_crate_researched.cost
    guid_self:          dim_ce480b8499b34800b30b05207931db99
    rating:             strong
    rationale:          |
                        Commercial units of 2.8 to 3.6 kWh sell for
                        $1,200 to $1,899, so the energy core of a
                        crate costs about $500 per kWh before
                        ruggedisation; a militarised pack would cost
                        more per kWh, but the price read shows the
                        floor. The rating would fall if military
                        qualification were required for every unit.

