  integration:
    id_self:            dim_frontline_battery_crate_researched.integration
    guid_self:          dim_74c5732fe0e049d5bce0c890e77b8581
    rating:             adequate
    rationale:          |
                        Regulated 12 and 24 V DC and 230 V AC outputs,
                        state-of-charge display and multi-source
                        charging are standard on commercial units;
                        military connectors, output isolation and EMC
                        to MIL-STD-461G are engineering on top, not
                        research. The rating would rise if a supplier
                        offered a militarised variant with those
                        interfaces.

