    guid_self:          prd_85a2621a1a244d04b4fc877e45872632
    name:               Galvion Nerv Centr Squad Power Manager SPM-622
    role:               |
                        The power management core: scavenges any
                        source, powers loads and charges batteries at
                        once, to MIL-STD-810G and MIL-STD-461F; the
                        pod's fixed logic would be built on such a
                        manager.
    maturity:           fielded
    support:            |
                        The manufacturer page read gives simultaneous
                        charging of five batteries, over 200 supported
                        devices, 1.0 lb, -30 to 70°C, submersion to
                        more than a metre, MIL-STD-810G and
                        MIL-STD-461F and an NSN.

