  integration:
    id_self:            dim_silent_power_pod_researched.integration
    guid_self:          dim_9117bf17cc7748cd93744b50ddfbc7b1
    rating:             adequate
    rationale:          |
                        A priority bus and a shed-first bus with fixed
                        logic is firmware and wiring on a standard
                        power manager and battery management system; a
                        stealth baseline means an enclosure with no
                        fans, no indicator light brighter than needed
                        and radiated emissions held to MIL-STD-461G,
                        which is design and test rather than research.
                        The rating would rise if a power manager with
                        lockable firmware were found.

