        id_target:      obs_keystone_mil_std_810h
        guid_target:    obs_6a079cfea2d24a36b71b3fc2dda01ad1

  operational_fit:
    id_self:            dim_silent_power_pod_researched.operational_fit
    guid_self:          dim_7a86b348cc0f42ae887f896579e5f1ed
    rating:             strong
    rationale:          |
                        The adversary framing's concerns, detection by
                        sound and heat and misuse by stressed
                        operators, are the reasons units already
                        prefer battery stations to generators:
                        reporting from Ukraine names silence, no
                        exhaust and low thermal signature as what
                        keeps positions concealed, and a fielded
                        station advertises zero thermal signature and
                        absolute silence. A pod with no configuration
                        to get wrong fits personnel who already
                        operate such stations. The rating would fall
                        if the fixed logic shed a load that turned out
                        to be critical, which a trial would show.

    relation:

