  strumko_modular_station:
    id_self:            prd_silent_power_pod_researched.strumko_modular_station
    guid_self:          prd_6d40fe64e22c4506a4242fc968187424
    name:               STRUMKO ENERGY modular power station and STRUMKO XXL, Ukraine
    role:               |
                        A fielded Ukrainian silent battery station
                        with battery, inverter and charging modules:
                        the closest existing product to the pod, and a
                        candidate maker.
    maturity:           fielded
    support:            |
                        Ukrinform, 15 May 2026, reports 16 kWh and 5
                        kW for the XXL, IP65, operation to -20°C,
                        charging of 6 to 8 UAV batteries at once, zero
                        thermal signature and absolute silence, and
                        use by units for over a year.

    relation:

