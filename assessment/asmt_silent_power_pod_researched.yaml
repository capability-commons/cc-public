  logistics:
    id_self:            dim_silent_power_pod_researched.logistics
    guid_self:          dim_5e8852f5c19b4c78abe08f60351be27a
    rating:             adequate
    rationale:          |
                        A single sealed pod recharged from a vehicle
                        or grid moves like a battery and needs no
                        fuel; the fielded power manager accepts 4 to
                        34 V from any source and the Ukrainian station
                        recharges 15 to 30 drone packs per charge. How
                        often a pod can be swapped or recharged at a
                        position under fire is not established by
                        anything read. The rating would rise with
                        recorded swap intervals from units using such
                        stations.

    relation:

