  time_to_field:
    id_self:            dim_silent_power_pod_researched.time_to_field
    guid_self:          dim_3a20a083563943b193e43593264aeed7
    rating:             adequate
    rationale:          |
                        A Ukrainian manufacturer designed, built and
                        fielded modular power stations within about a
                        year, and the pod's parts exist; firmware for
                        fixed priority logic, a signature-controlled
                        enclosure and MIL-STD-461G and MIL-STD-810H
                        testing put a qualified pod at months to a
                        year. The rating would rise if an existing
                        station were adapted rather than a new pack
                        built.

    relation:

      - id_relation:    r_cites
        guid_relation:  r_283cc2237b924df080e77ffae68a7f9e
        id_target:      obs_ukrinform_strumko_2026
