  cost:
    id_self:            dim_silent_power_pod_researched.cost
    guid_self:          dim_746dad73081e46b1858b269e1153594d
    rating:             adequate
    rationale:          |
                        Consumer lithium iron phosphate storage costs
                        about $500 per kWh before ruggedisation, which
                        sets the floor; a pod with high-energy cells,
                        a sealed low-signature enclosure and military
                        qualification will cost several times that per
                        unit, and no price for a comparable military
                        unit was read. The rating would rise if a
                        Ukrainian maker's pricing for a fielded
                        station were obtained.

