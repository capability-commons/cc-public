  off_the_shelf:
    id_self:            dim_silent_power_pod_researched.off_the_shelf
    guid_self:          dim_eef59bbe38244aa28fce462ca23b51a8
    rating:             weak
    rationale:          |
                        No unit read meets 2.5 kWh at 18 kg: the
                        six-battery military system gives 1.8 kWh at
                        18 kg, the commercial 2.76 kWh module weighs
                        29.5 kg, and the 4.2 kWh NCA 6T battery is a
                        vehicle battery whose weight the page read
                        does not give. Fixed, non-configurable
                        priority logic is not a product either; the
                        fielded power manager is general-purpose. The
                        rating would rise to adequate if the mass
                        limit were relaxed to about 30 kg.

