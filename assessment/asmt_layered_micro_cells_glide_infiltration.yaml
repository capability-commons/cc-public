    id_self:            prd_layered_micro_cells_glide_infiltration.lightweight_blast_blanket_or_mat
    guid_self:          prd_d88fa169f2b44d2a9656948e59bfb8b5
    name:               Ballistic or blast blankets for military/LE use
    role:               |
                        Provides the foldable blast mat and forms part
                        of the low-profile shelter to reduce
                        fragmentation and some blast effects from
                        near-miss explosions
    maturity:           commercial
    support:            |
                        No reference is cited and this is the model's
                        knowledge alone, based on known vendors of
                        ballistic and blast blankets; confirmation
                        would come from identifying specific products
                        that meet the required protection metric,
                        weight, and packability in testing.
    relation:           []

