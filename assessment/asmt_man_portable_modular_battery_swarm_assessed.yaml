title:                  Man-portable modular battery swarm assessed
verdict:                feasible_now
summary:                |
                        The modular battery swarm can be built now
                        from existing commercial and military-grade
                        components: rugged 300–500 Wh lithium battery
                        modules around 4.5 kg, a lightweight DC power
                        hub capable of accepting multiple
                        hot-swappable inputs, and standard DC output
                        and protection circuitry are all
                        well-established. Meeting the specific
                        requirements for power level, IP65 enclosure,
                        drop resistance, EMC, safety and thermal
                        limits is an engineering and qualification
                        task, not invention, and similar soldier power
                        managers and multi-pack power stations
                        demonstrate the architecture. The main
                        uncertainties are not technical but logistical
                        and doctrinal: ensuring enough modules are
                        procured, distributed, tracked and rotated to
                        truly give multi-day autonomy under fire, and
                        mitigating the hub as a single point of
                        failure, for example by fielding spares. These
                        factors affect whether the system will
                        consistently meet the need’s operational
                        outcome, but they do not prevent building and
                        deploying the hardware now; further user
                        trials and logistics experiments would refine
                        sizing, interfaces and procedures and could
                        shift the practical effectiveness from
                        adequate to strong.

dimension:

  maturity:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.maturity
    guid_self:          dim_a8b42db508774ca3a4e7afe11415496a
    rating:             strong
    rationale:          |
                        All key elements—rugged lithium battery
                        modules of 300–500 Wh, DC-DC aggregation hubs,
                        hot-swap capability, prioritised load
                        management, and military-qualified
                        enclosures—exist today in soldier power
                        managers, commercial power stations, and
                        industrial battery systems. The concept
                        combines them without requiring new physics or
                        unproven architectures. The rating would
                        change to adequate if higher-voltage,
                        higher-power operation or extreme environments
                        forced use of less-proven chemistries or
                        packaging.
    relation:           []

  off_the_shelf:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.off_the_shelf
    guid_self:          dim_5391fd61ef9b4196bb644603773c77f7
    rating:             adequate
    rationale:          |
                        Commercial and military products already
                        provide multi-pack DC hubs, stackable
                        batteries, IP65–67 enclosures, and
                        MIL-STD-461-compliant power conditioners, but
                        there is no single COTS product that exactly
                        matches the specified hub plus 12-port swarm
                        modules and interfaces. Off-the-shelf units
                        could cover much of the need with modest
                        adaptation. The rating would become strong if
                        a current product line explicitly supported
                        10–15 hot-swappable backpack-sized modules
                        with the required environmental and safety
                        compliance out of the box.
    relation:           []

  integration:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.integration
    guid_self:          dim_f79dc67261f6485583e38e49354efc76
    rating:             adequate
    rationale:          |
                        Integrating modules, hub, connectors, and
                        trickle harvesters is straightforward power
                        electronics and mechanical design, but careful
                        work is needed on EMC, thermal management,
                        status estimation accuracy, and compatibility
                        with existing field power interfaces. None of
                        these are novel, but they require system
                        engineering and test. The rating would move to
                        strong if reference designs and interface
                        standards from the target force (for DC
                        connectors, voltage levels, and load
                        priorities) were already in place and proven
                        with similar gear.
    relation:           []

  logistics:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.logistics
    guid_self:          dim_d1ca7920d2c243769e24134121342ae7
    rating:             weak
    rationale:          |
                        The hardware is easy to move as 4.5 kg modules
                        and a 6 kg hub, but the concept’s success
                        depends on disciplined allocation, tracking,
                        charging and rotation of many modules under
                        contested logistics, which is not yet
                        demonstrated. Without changes to doctrine,
                        inventory systems and training, units may
                        under-procure modules or mismanage rotation,
                        limiting real autonomy. The rating would
                        improve to adequate or strong if field trials
                        showed that formations can reliably sustain
                        multi-day power using defined module scales
                        and resupply patterns under realistic
                        constraints.
    relation:           []

  cost:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.cost
    guid_self:          dim_0a1486e3734e4b54a17127ed2d4e45f7
    rating:             adequate
    rationale:          |
                        Using mature lithium cells, standard power
                        electronics, and rugged enclosures keeps unit
                        cost in the range of existing military battery
                        and soldier power systems; however, the
                        concept requires many modules per position, so
                        fleet cost is material. There is no exotic
                        material or manufacturing process. The rating
                        would become strong if economies of scale were
                        confirmed through vendor quotes and if reuse
                        of existing battery families or chargers
                        further reduced NRE and per-unit costs.
    relation:           []

  time_to_field:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.time_to_field
    guid_self:          dim_24a6045a1e554b099a93b27511a6f58c
    rating:             strong
    rationale:          |
                        A first-generation system could be fielded
                        within 1–2 years using existing suppliers of
                        rugged battery modules and power hubs, with
                        parallel environmental and EMC qualification,
                        given focused funding and programme
                        management. No long-lead technology maturation
                        is required. The rating would regress to
                        adequate if regulatory approvals, safety
                        certification, or custom connector
                        standardisation created longer than expected
                        lead times.
    relation:           []

  operational_fit:
    id_self:            dim_man_portable_modular_battery_swarm_assessed.operational_fit
    guid_self:          dim_ddc235fe39654027bab5306a17d64ecf
    rating:             adequate
    rationale:          |
                        The swarm aligns with known patterns of
                        soldiers carrying additional batteries and
                        with the need for quiet, fuel-independent
                        power over several days, but it adds weight to
                        already heavy loads and depends on personnel
                        and small-vehicle movement that can be
                        degraded in exactly the scenarios of concern.
                        It also centralises management in a hub that
                        must be protected and backed up. The rating
                        would become strong if user trials showed that
                        units accept the weight trade-offs and can
                        integrate module handling into drills without
                        degrading combat effectiveness, or would fall
                        to weak if units reject the added load or
                        logistics cannot support sufficient module
                        circulation.
    relation:           []

