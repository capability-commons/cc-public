  logistics:
    id_self:            dim_modular_battery_swarm_researched.logistics
    guid_self:          dim_78c58bdb12204478a1efc9ad20378764
    rating:             strong
    rationale:          |
                        Magazine-sized batteries of 550 g to 1.4 kg
                        already flow through military supply as
                        consumables, the Army standardises them for
                        interoperability and backward compatibility,
                        and Ukraine has its own battery makers
                        supplying the front; a swarm of such modules
                        is carried and rotated in pieces as the
                        concept intends. The rating would fall if the
                        swarm demanded a module type outside existing
                        supply.

