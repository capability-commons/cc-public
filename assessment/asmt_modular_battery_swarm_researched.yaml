  time_to_field:
    id_self:            dim_modular_battery_swarm_researched.time_to_field
    guid_self:          dim_81c66a6599c04b8cab0d10a692142a93
    rating:             adequate
    rationale:          |
                        A swarm assembled from fielded modules, the
                        fielded power manager and the six-battery
                        container could be trialled in weeks; the open
                        hot-swap hub is months of development and
                        qualification. The rating would rise if the
                        trial showed fixed slots suffice.

