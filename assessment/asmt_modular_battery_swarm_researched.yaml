    id_self:            dim_modular_battery_swarm_researched.off_the_shelf
    guid_self:          dim_d863638c06c5495ebe324b1554df6b76
    rating:             adequate
    rationale:          |
                        The modules, the power manager and the
                        harvester can be bought as they are, and the
                        six-battery container is a fixed-slot hub with
                        12 and 24 V outputs and solar input; a hub
                        that hot-swaps an open number of modules and
                        tracks each is not on the shelf. The rating
                        would rise to strong if six fixed slots were
                        accepted as the hub design.

