title:                  Man-portable modular battery swarm, researched
verdict:                feasible_with_development
summary:                |
                        The swarm's parts are fielded: magazine-sized
                        military batteries of 140 to 251 Wh move
                        through supply chains in their thousands, the
                        US Army fields a modular battery family in
                        eight sizes with one interface, a squad power
                        manager charges five batteries at once from
                        any source, and a rugged six-battery container
                        already parallels BB-2590 batteries into a 1.8
                        kWh unit with UPS behaviour. A foldable 120 W
                        solar panel at 2.9 kg is the harvester the
                        concept names. What does not exist is the hub:
                        hot-swapping modules in and out of one virtual
                        pack while it powers a terminal, with
                        per-module state tracked and the pack
                        surviving the loss of any module, is a
                        controller and connector design that no
                        product read offers beyond six fixed slots.
                        That is engineering on existing cells and
                        standard bus communication, so the verdict is
                        feasible with development. It would rise to
                        feasible now if the six-battery container's
                        fixed slots were accepted as the hub, and
                        would fall to speculative if modules had to be
                        shared between positions on foot under fire
                        faster than the swarm can be recharged, which
                        nothing read measures.

dimension:

  maturity:
    id_self:            dim_modular_battery_swarm_researched.maturity
    guid_self:          dim_37875992e7fb48a4b7b4c2e935ecd764
    rating:             strong
    rationale:          |
                        Modular soldier batteries with one interface
                        are fielded by the US Army in eight sizes,
                        BB-2590 batteries are certified and used in
                        over 71 devices, a squad power manager
                        combines sources and charges five batteries at
                        once, and a rugged container parallels six
                        batteries with power management: every element
                        of a battery swarm exists in service. The
                        rating would fall only if the hub demanded
                        cell-level control the modules' SMBus does not
                        give.

