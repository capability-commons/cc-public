  integration:
    id_self:            dim_modular_battery_swarm_researched.integration
    guid_self:          dim_8ed68cc7b3794f8b87046abdafea5eeb
    rating:             adequate
    rationale:          |
                        Modules speak SMBus and the power manager
                        already manages several at once, so
                        paralleling them behind one regulated bus is
                        standard electronics; hot swap under load and
                        the drop resistance the candidates ask of
                        module and hub need connector and enclosure
                        design and MIL-STD-810H testing. The rating
                        would rise with a hub reference design from a
                        battery maker.

