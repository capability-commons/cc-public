  cost:
    id_self:            dim_modular_battery_swarm_researched.cost
    guid_self:          dim_a60bb1d7880e4895b443cb5d62a9da2f
    rating:             adequate
    rationale:          |
                        Many small military modules cost more per
                        kilowatt-hour than one commercial lithium iron
                        phosphate unit, whose price sets a floor of
                        about $500 per kWh; no price for the military
                        modules or the container was read. The rating
                        would rise if commercial modules with a
                        standard bus were used for the bulk of the
                        energy.

