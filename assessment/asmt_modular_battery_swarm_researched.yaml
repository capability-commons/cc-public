  operational_fit:
    id_self:            dim_modular_battery_swarm_researched.operational_fit
    guid_self:          dim_b676d433f0ee45eebaa01f74794bab4b
    rating:             strong
    rationale:          |
                        The dependency framing wants no single heavy
                        store and no fuel: a swarm of modules carried
                        in on foot, topped up by a foldable panel that
                        is military tested at 2.9 kg, and combined by
                        a manager that scavenges any source removes
                        the single point of failure the need
                        describes; Ukrainian units already operate
                        battery stations for the same loads. The
                        rating would fall if positions could not spare
                        the hands to rotate modules, which a trial
                        would show.

