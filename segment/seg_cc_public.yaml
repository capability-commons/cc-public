title:                  The capability commons core
brief:                  |
                        The core repository: the checks, the tool, and
                        the schemas, types, relations, registers and
                        evals every other segment consumes.
description:            |
                        This repository governs everything beneath it
                        and consumes nothing. Its own needs,
                        requirements, decisions and evidence are about
                        the tool, so its gate sees only itself and its
                        trace speaks only for what it is accountable
                        for. A segment that consumes it may name
                        anything here; nothing here may name anything
                        of a segment that consumes it, which the
                        segment check holds to.
