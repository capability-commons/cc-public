protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Local Glide Bomb Threat Picture and Micro-Posture Coach
brief:                  |
                        A lightweight, local threat picture tool fuses
                        what a Ukrainian unit already sees and hears
                        about aircraft, drones and recent strikes into
                        a simple, continuously updated glide bomb and
                        infiltration risk view. It gives leaders and
                        small teams a few concrete, micro‑scale
                        posture choices at any moment, but also
                        surfaces when there is no meaningful
                        protective move, so information improves
                        decisions without promising safety where none
                        is possible.
entity:                 Glide_Bomb_Local_Threat_Coach
operation:              |
                        A company command post runs the
                        Glide_Bomb_Local_Threat_Coach on a laptop or
                        tablet, entering short observations such as
                        “Su‑34 sound NW 5–10 min,” “Orlan drone
                        overhead,” “recent FAB strikes 3 km east,” and
                        “FPV activity low/medium/high,” while squad
                        leaders and observers submit quick, coded
                        updates by radio, messenger, or pre‑set device
                        buttons when they can. The coach turns these
                        inputs plus any available higher-echelon feeds
                        into a simple local map and status line that
                        show current glide bomb and infiltration risk
                        bands (for example, “air threat high,
                        infiltration low”) and, for each squad or
                        vehicle, a small menu of micro‑posture options
                        such as “stay,” “shift 5–10 m to alternate
                        prone,” or “pull back to pre‑marked
                        micro‑shelter,” with explicit tags like “small
                        benefit only” or “no safe move.” Leaders
                        choose whether to act, informed by the
                        estimated gain and cost, while the system logs
                        what was chosen and, after engagements,
                        supports a short review that ties observed
                        damage, infiltration routes and timing back to
                        the earlier information and posture decisions.
architecture:           |
                        Glide_Bomb_Local_Threat_Coach has four main
                        parts: a local data intake layer that accepts
                        structured low‑bandwidth inputs from
                        observers, radios, and any connected sensors;
                        a compact, on‑device inference engine that
                        turns this sparse event stream and recent
                        strike history into a rolling estimate of
                        glide bomb and infiltration risk over the
                        unit’s area of operations; a posture advisor
                        that, for each sub‑element, computes and
                        presents a bounded list of context‑appropriate
                        micro‑posture options, including an explicit
                        “no meaningful improvement” state; and a
                        review and learning module that records
                        events, postures and outcomes in a compressed
                        format and periodically suggests adjustments
                        to posture options or thresholds, subject to
                        human approval. The system runs fully offline
                        at the edge, with optional, intermittent
                        synchronisation to brigade or higher nodes
                        that can refine inference rules and share
                        anonymised patterns without dictating local
                        decisions.
effect:                 |
                        The concept turns fragmented, noisy cues about
                        aircraft, drones and recent strikes into an
                        explicit, local picture of glide bomb and
                        infiltration risk and into modest, clearly
                        labelled posture options, which helps units
                        avoid pointless or dangerous movement, focus
                        protective actions where they matter, and
                        understand when they are simply exposed. It
                        does not intercept glide bombs, rebuild
                        fortifications, provide guaranteed warning, or
                        substitute for deeper measures such as
                        hardened construction, integrated air defence,
                        or offensive action against enemy aircraft and
                        logistics.
risk:                   |
                        The coach can misestimate local risk, either
                        understating danger and encouraging static
                        postures before strikes, or overstating it and
                        prompting unnecessary movement that increases
                        exposure or fatigue. If micro-posture benefits
                        are smaller than assumed in many real
                        engagements, the tool may still suggest shifts
                        or sheltering that cost time and focus without
                        reducing casualties, leading to
                        disillusionment or ritualised behaviour. The
                        inference rules may overfit to limited or
                        biased feedback, degrading relevance when
                        enemy tactics or terrain differ. Presenting
                        explicit “no meaningful improvement”
                        assessments could be misread as fatalistic,
                        undermining morale or discouraging independent
                        protective action. If devices or logs are
                        captured, adversaries might partially
                        reconstruct how Ukrainian units read local
                        risk and time feints or infiltrations to
                        exploit likely reactions. Over-reliance on the
                        coach’s view could erode commanders’
                        willingness to override it based on fresh,
                        unmodelled information, especially in novel or
                        rapidly changing situations.

candidate_requirement:

  ingest_structured_observations:
    id_self:            crq_glide_bomb_infiltration_alert.ingest_structured_observations
    guid_self:          crq_6e700ab00b3546ba84dcdff67de88884
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall ingest
                        structured local observations of aircraft
                        presence, reconnaissance drone activity, and
                        recent explosive impacts as timestamped
                        events.
    rationale:          |
                        Capturing key local cues as events is
                        necessary to form a local threat picture from
                        sparse information.
    category:           function
    relation:           []

  support_manual_entry:
    id_self:            crq_glide_bomb_infiltration_alert.support_manual_entry
    guid_self:          crq_3d8716eeb3db44bfa48113f92b2de875
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall allow
                        manual entry of observations using at most
                        five predefined event types and three free
                        numeric fields per event.
    rationale:          |
                        Constrained manual inputs reduce operator
                        workload and ambiguity while still capturing
                        essential variation.
    category:           fit
    relation:           []

  edge_only_processing:
    id_self:            crq_glide_bomb_infiltration_alert.edge_only_processing
    guid_self:          crq_9cec3e68c4fe4bc48d5d4acbb5e0ebc6
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        compute glide bomb and infiltration risk
                        estimates entirely on the local device without
                        requiring network connectivity.
    rationale:          |
                        Edge-only inference ensures the tool remains
                        usable under denied or intermittent
                        communications.
    category:           fit
    relation:           []

  risk_band_output:
    id_self:            crq_glide_bomb_infiltration_alert.risk_band_output
    guid_self:          crq_661c7ea4be2e4eb6900c92ad9293a211
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        express glide bomb and infiltration risk for
                        the unit area as three-level ordinal bands of
                        low, medium, or high.
    rationale:          |
                        Simple ordinal bands are easier to interpret
                        quickly than detailed numerical probabilities
                        under stress.
    category:           function
    relation:           []

  update_frequency_limit:
    id_self:            crq_glide_bomb_infiltration_alert.update_frequency_limit
    guid_self:          crq_8cd3b1d895dd4484b49f688d5aa5c1f2
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall update
                        its risk estimates at least once per minute
                        when new observations are available.
    rationale:          |
                        Frequent updates keep the threat picture
                        responsive to rapidly changing cue patterns.
    category:           quality
    relation:           []

  associate_risk_to_subunits:
    id_self:            crq_glide_bomb_infiltration_alert.associate_risk_to_subunits
    guid_self:          crq_63ba102a9c084304acdc34f97156b79b
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        maintain separate risk assessments for at
                        least ten subordinate elements such as squads
                        or vehicles.
    rationale:          |
                        Subunit-level views allow posture decisions
                        tailored to differing exposures within a
                        company area.
    category:           function
    relation:           []

  posture_option_generation:
    id_self:            crq_glide_bomb_infiltration_alert.posture_option_generation
    guid_self:          crq_83cbb0340bba4d919d008c4b997e0507
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        generate for each subordinate element at most
                        three micro-posture options plus a stay option
                        based on current risk and stored
                        micro-position data.
    rationale:          |
                        Limiting options keeps decisions manageable
                        while still offering meaningful alternatives
                        when they exist.
    category:           function
    relation:           []

  benefit_label_assignment:
    id_self:            crq_glide_bomb_infiltration_alert.benefit_label_assignment
    guid_self:          crq_c0175668b31647b896c7bedc4d41b635
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall label
                        each suggested posture option with one of
                        three benefit levels: no meaningful
                        improvement, small improvement, or moderate
                        improvement.
    rationale:          |
                        Explicit benefit labelling helps leaders judge
                        when movement is worth the cost and risk.
    category:           quality
    relation:           []

  explicit_no_option_state:
    id_self:            crq_glide_bomb_infiltration_alert.explicit_no_option_state
    guid_self:          crq_6be79c4698df486bae459d035349efd7
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        display an explicit state when no posture
                        option offers more than small improvement over
                        the current posture.
    rationale:          |
                        Stating when no good action exists prevents
                        ritualised movement that does not improve
                        protection.
    category:           function
    relation:           []

  simple_visual_interface:
    id_self:            crq_glide_bomb_infiltration_alert.simple_visual_interface
    guid_self:          crq_8b48aab420994d4eab143f9a56333ee9
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        present risk bands and posture options on a
                        single primary screen with no more than 200
                        words of text.
    rationale:          |
                        A compact visual interface reduces cognitive
                        load and speeds comprehension in combat.
    category:           quality
    relation:           []

  offline_log_recording:
    id_self:            crq_glide_bomb_infiltration_alert.offline_log_recording
    guid_self:          crq_f631002f83364bc7a6a3b8bc28747b63
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall record
                        posture decisions and key risk estimates in an
                        on-device log sized not more than 10 kilobytes
                        per day of operation.
    rationale:          |
                        Compact logging preserves outcome data for
                        later review without straining storage or
                        transfer.
    category:           form
    relation:           []

  after_action_summary:
    id_self:            crq_glide_bomb_infiltration_alert.after_action_summary
    guid_self:          crq_38c46e40e58a43188950a0c4fc11cbde
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        generate an after-action summary of one
                        engagement in a report no larger than 5
                        kilobytes containing time-aligned
                        observations, risk bands, posture choices, and
                        observed damage.
    rationale:          |
                        Concise summaries support human review and
                        model refinement under constrained
                        communications.
    category:           function
    relation:           []

  rule_update_import:
    id_self:            crq_glide_bomb_infiltration_alert.rule_update_import
    guid_self:          crq_999aec1b53004b18b291b5d92b0e0518
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall import
                        updated inference rules and posture templates
                        from removable media such as microSD cards
                        without requiring a network connection.
    rationale:          |
                        Physical media updates avoid dependence on
                        contested networks for model evolution.
    category:           fit
    relation:           []

  anonymised_log_export:
    id_self:            crq_glide_bomb_infiltration_alert.anonymised_log_export
    guid_self:          crq_b24c73b33cf24291bc357e3823a5eb55
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall export
                        logs and summaries without unit identifiers or
                        grid locations finer than 1 kilometer
                        resolution.
    rationale:          |
                        Anonymisation limits the operational damage if
                        exported data is intercepted or captured.
    category:           compliance
    relation:           []

  data_at_rest_encryption:
    id_self:            crq_glide_bomb_infiltration_alert.data_at_rest_encryption
    guid_self:          crq_248421141b8c42c4b1cc7c33d935990a
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        encrypt all stored logs, rules, and
                        configuration data using Ukrainian-approved
                        cryptographic standards.
    rationale:          |
                        Strong encryption mitigates the intelligence
                        value of captured devices.
    category:           compliance
    relation:           []

  low_power_client:
    id_self:            crq_glide_bomb_infiltration_alert.low_power_client
    guid_self:          crq_2a82f86c57c242c5911dae08b484b941
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        operate on an Android 10 or later device with
                        2 gigabytes of RAM for at least 8 hours on a
                        3000 milliampere-hour battery during
                        continuous display use.
    rationale:          |
                        Power-efficient operation aligns with typical
                        frontline device constraints.
    category:           form
    relation:           []

  role_specific_views:
    id_self:            crq_glide_bomb_infiltration_alert.role_specific_views
    guid_self:          crq_793230e7d68a40279cdb9808c53350b6
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        provide at least two interface configurations,
                        one for company-level users and one for
                        squad-level users, each showing only their
                        relevant subunit information.
    rationale:          |
                        Role-specific views reduce clutter and help
                        each level focus on its decisions.
    category:           fit
    relation:           []

  input_latency_bound:
    id_self:            crq_glide_bomb_infiltration_alert.input_latency_bound
    guid_self:          crq_3bca9196af714b9bacb199aa92968111
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        incorporate a new observation into displayed
                        risk estimates within 5 seconds of entry.
    rationale:          |
                        Low processing latency keeps the displayed
                        threat picture aligned with current cues.
    category:           quality
    relation:           []

  operator_training_aid:
    id_self:            crq_glide_bomb_infiltration_alert.operator_training_aid
    guid_self:          crq_85531dad90a04343a7f6333f99a80988
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        include a built-in tutorial scenario that can
                        be completed in no more than 20 minutes to
                        train operators on input and interpretation.
    rationale:          |
                        Short, embedded training helps units adopt the
                        tool without extensive external instruction.
    category:           fit
    relation:           []

  audit_rule_changes:
    id_self:            crq_glide_bomb_infiltration_alert.audit_rule_changes
    guid_self:          crq_19839dc86dc34398a4ff185b265066d3
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        maintain an audit record of all imported rule
                        updates including version identifier, date,
                        and approving authority identifier.
    rationale:          |
                        Auditability of rule changes supports trust,
                        traceability, and doctrinal oversight.
    category:           compliance
    relation:           []

  emission_control_mode:
    id_self:            crq_glide_bomb_infiltration_alert.emission_control_mode
    guid_self:          crq_e84ea3d17054403fa96c069ee12a4476
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        support a mode in which all wireless network
                        interfaces are disabled while local processing
                        and logging remain available.
    rationale:          |
                        Controlling emissions reduces the risk of
                        adversary detection or geolocation from device
                        activity.
    category:           compliance
    relation:           []

  map_overlay_support:
    id_self:            crq_glide_bomb_infiltration_alert.map_overlay_support
    guid_self:          crq_c5ba08b71d3d464db1341d106da5d36b
    statement:          |
                        The Glide_Bomb_Local_Threat_Coach shall
                        optionally display risk bands and subunit
                        positions on a static local map image loaded
                        from file without requiring external map
                        services.
    rationale:          |
                        Map overlays help leaders spatially interpret
                        threat and posture while avoiding dependence
                        on live map feeds.
    category:           form
    relation:           []

status:                 proposed

assumption:

  cues_partially_predictive:
    id_self:            asm_glide_bomb_infiltration_alert.cues_partially_predictive
    guid_self:          asm_04837bba2898495fad0d651ab9472623
    statement:          |
                        Patterns of local aircraft presence,
                        reconnaissance drone activity and recent
                        strike locations have some predictive value
                        for short-term glide bomb and infiltration
                        risk at company scale, even if they do not
                        yield precise strike warnings.
    evidence:           |
                        Inferred from the observation that Russian
                        glide bomb use relies on reconnaissance drones
                        and aircraft sorties against high-value
                        targets; consistent with general operational
                        practice, but no quantified predictive
                        performance is provided here.
    relation:           []

  local_observation_channels_exist:
    id_self:            asm_glide_bomb_infiltration_alert.local_observation_channels_exist
    guid_self:          asm_7f3588eff5a24582ba921aaf4d146d50
    statement:          |
                        Frontline units can capture and transmit
                        short, structured observations about aircraft
                        noises, drone sighting, and impacts through
                        existing radios, runners, or simple digital
                        buttons without adding unsustainable workload.
    evidence:           |
                        Assumed based on widespread radio use and ad
                        hoc reporting in combat; not evidenced in the
                        supplied observation.
    relation:           []

  micro_posture_can_change_outcome:
    id_self:            asm_glide_bomb_infiltration_alert.micro_posture_can_change_outcome
    guid_self:          asm_fe2a35239c5b40e98fa2ecaa871cd388
    statement:          |
                        In some, but not all, glide bomb and
                        infiltration scenarios, small changes in
                        soldier posture, position over a few meters,
                        or use of pre-identified micro-shelter
                        measurably reduce casualties or complicate
                        enemy infiltration.
    evidence:           |
                        Supported by general blast and fragmentation
                        effects research and infantry fieldcraft
                        doctrine, but no specific data from glide bomb
                        engagements is supplied here.
    relation:           []

  no_safe_move_cases_exist:
    id_self:            asm_glide_bomb_infiltration_alert.no_safe_move_cases_exist
    guid_self:          asm_9e7b32210b3c487ca9bd6f9931fda3e9
    statement:          |
                        There are scenarios in which no feasible
                        micro-posture decision available to a unit
                        within the time and terrain constraints offers
                        a meaningful reduction in risk from glide
                        bombs or infiltration.
    evidence:           |
                        Logical consequence of high-yield munitions,
                        lack of cover, and very short time to impact;
                        no explicit case is documented in the
                        observation but is widely recognised in combat
                        accounts.
    relation:           []

  leaders_can_use_simple_scores:
    id_self:            asm_glide_bomb_infiltration_alert.leaders_can_use_simple_scores
    guid_self:          asm_7b35f54bbdb847bcba159e9843be6295
    statement:          |
                        Company and platoon leaders can incorporate
                        very simple, ordinal risk bands and benefit
                        labels into their decisions under stress
                        without needing detailed probabilities or long
                        instructions.
    evidence:           |
                        Inferred from routine military use of colour
                        codes and stoplight charts for rapid
                        decisions; not documented in the observation.
    relation:           []

  on_device_inference_viable:
    id_self:            asm_glide_bomb_infiltration_alert.on_device_inference_viable
    guid_self:          asm_9b089a9b651540d3b99c20f80c03e709
    statement:          |
                        A compact rule-based or lightweight
                        statistical model for local glide bomb and
                        infiltration risk can run on modest hardware
                        without external compute or continuous
                        connectivity.
    evidence:           |
                        Assumption grounded in the low data volume and
                        relatively simple pattern structures
                        described; no benchmark data is provided.
    relation:           []

  limited_sync_to_higher_possible:
    id_self:            asm_glide_bomb_infiltration_alert.limited_sync_to_higher_possible
    guid_self:          asm_f71976344e524f6babdce9dbcc05bd7e
    statement:          |
                        Units will occasionally have enough
                        connectivity or physical media exchange to
                        upload compressed outcome logs and download
                        updated inference rules from higher echelons.
    evidence:           |
                        Assumed from general practice of periodic data
                        exfiltration and update in contested
                        environments; not evidenced here.
    relation:           []

  human_review_of_rule_changes:
    id_self:            asm_glide_bomb_infiltration_alert.human_review_of_rule_changes
    guid_self:          asm_ff89e2ae50e04a04a1f76503cdf9bef4
    statement:          |
                        Higher-echelon staff or designated officers
                        are available to review and approve proposed
                        changes to inference rules and posture option
                        sets before wide distribution.
    evidence:           |
                        Assumption based on existing doctrinal and
                        analysis structures; the observation does not
                        mention such roles.
    relation:           []

  adversary_does_not_see_internal_state:
    id_self:            asm_glide_bomb_infiltration_alert.adversary_does_not_see_internal_state
    guid_self:          asm_a897933ee75446ea970e9a23fc825e40
    statement:          |
                        Russian forces cannot routinely observe the
                        internal risk estimates or posture option
                        menus of the Glide_Bomb_Local_Threat_Coach,
                        though they may infer some reaction patterns
                        from behaviour over time.
    evidence:           |
                        Based on the system’s local, offline design
                        and lack of emissions, but capture of devices
                        or long-term observation could partially
                        reveal behaviour; no direct evidence on
                        Russian intelligence capabilities is provided.
    relation:           []

  units_accept_explicit_limits:
    id_self:            asm_glide_bomb_infiltration_alert.units_accept_explicit_limits
    guid_self:          asm_4803d41cd8b0457e98fdd42c53e833c1
    statement:          |
                        Ukrainian commanders can tolerate and act upon
                        a tool that sometimes tells them there is no
                        meaningful protective move, rather than
                        demanding prescriptive action in all cases.
    evidence:           |
                        Assumption; the observation notes Ukrainian
                        appreciation of glide bomb effectiveness but
                        does not describe attitudes to
                        decision-support tools.
    relation:           []

  training_for_use_is_feasible:
    id_self:            asm_glide_bomb_infiltration_alert.training_for_use_is_feasible
    guid_self:          asm_f413438fb8a045eb8c4d3c6203377203
    statement:          |
                        Units can allocate at least brief instruction
                        time to learn how to encode observations, read
                        the risk view, and interpret posture
                        suggestions from the coach.
    evidence:           |
                        Inferred from ongoing adaptation and training
                        under fire reported more generally for
                        Ukrainian forces; not substantiated in this
                        specific observation.
    relation:           []

challenge:              |
                        The concept’s claim that “explicit, local
                        picture[s] of glide bomb and infiltration risk
                        and … modest, clearly labelled posture
                        options” offer a “plausible and testable way
                        to deliver some measure of protection” depends
                        on the assumption that the underlying
                        predictor—patterns of aircraft, drones, and
                        recent strikes—remains stable and robustly
                        predictive as Russian tactics change and
                        adaptation proceeds. There is no evidence
                        presented that the inference logic based on
                        these cues (as stated in
                        cues_partially_predictive) can withstand
                        adversary evolution. If Russian forces change
                        sequencing, use decoys, compress timelines, or
                        deliberately create deceptive cue clusters
                        (knowing that Ukrainians are now integrating
                        these into a threat coach), the inference
                        engine may begin suggesting postures that are
                        not relevant, are out-of-date, or even
                        increase risk. The candidate requirement for
                        local, on-device adaptation (through log
                        review and human-approved rule updates) is
                        limited by connectivity, the pace of tactical
                        change, and the difficulty of distinguishing
                        effective versus self-defeating patterns from
                        sparse data. In the worst case, the system
                        could institutionalise false confidence in
                        misleading cues, causing leaders to trust the
                        tool when adversaries are already exploiting
                        or bypassing its logic. If the unit’s posture
                        options and risk bands drift out of alignment
                        with reality, commanders may be slower to
                        notice this than if no such system were
                        present, leaving units exposed or caught in
                        predictable transitions. The effect would be a
                        brittle doctrine enforced by technology, which
                        could break catastrophically under adversary
                        pressure, negating the stated outcome of
                        maintaining combat effectiveness under glide
                        bomb-enabled infiltration.
resolution:             |
                        The earlier challenge questioned whether
                        sparse local cues offer enough time and
                        predictive value for posture changes to
                        matter, whether cue-action mappings risk
                        becoming empty ritual, whether feedback can
                        fix timing limits, whether omitting deeper
                        protective measures undermines effectiveness,
                        and whether standardised reactions invite
                        adversary exploitation, all while demanding
                        clarity about what “effective protection”
                        means in this context. This concept answers by
                        narrowing its claim: it does not promise
                        intercept, precise warning, or guaranteed
                        survival, and it explicitly models and
                        displays cases where no meaningful protective
                        move exists, so the tool cannot prescribe
                        empty action when there is no time or cover.
                        Instead of fixed drills bound to named cue
                        patterns, it uses a local, continuously
                        updated risk estimate and dynamically
                        generated micro-posture options tagged with
                        benefit levels, so commanders see both when a
                        small positional change could plausibly help
                        and when remaining still is as good as moving.

                        On the time-window concern, the coach only
                        suggests micro-postures that can be executed
                        within the short intervals typically
                        available, such as small shifts, posture
                        changes, or moving to already-known
                        micro-shelters; when even these are unlikely
                        to complete before impact, the explicit “no
                        meaningful improvement” state appears and logs
                        that limitation, acknowledging that
                        information cannot conjure non-existent
                        options. Regarding ritualisation and lack of
                        evidence, the system’s logging and
                        after-action summaries are designed to let
                        human reviewers correlate suggested postures
                        with actual damage and infiltration patterns;
                        if certain categories of suggestion repeatedly
                        show no benefit or harm, higher echelons can
                        remove or adjust them through audited rule
                        updates, so feedback directly trims
                        ineffective behaviours rather than smoothing
                        around them. The entity boundary remains
                        focused on information and decision support,
                        and it concedes that hardened construction,
                        air defence, and offensive measures are
                        separate, necessary lines of effort; this
                        coach is scoped to help units use what they
                        already know and can do, and to avoid
                        unnecessary exposure or futile manoeuvre, not
                        to substitute for those deeper protections.

                        On adversary adaptation, the concept mitigates
                        rather than eliminates the risk: inference
                        rules and posture templates are distributed as
                        opaque parameters, decisions are made locally
                        and can diverge by unit, and logs are
                        anonymised and encrypted, so Russians may
                        infer some tendencies but cannot trivially
                        reconstruct internal logic. Because posture
                        options are context-dependent and
                        benefit-labelled, doctrinal standardisation is
                        less rigid than fixed drills; if enemy
                        behaviour changes in a sector, risk estimates
                        and suggested options can change with the next
                        rule update, and commanders can always
                        override them. Finally, on “effective
                        protection,” this concept stands on a modest,
                        explicit definition: it aims to improve the
                        odds that units avoid needless movement,
                        exploit such micro-protection as terrain
                        allows, and understand when they are simply
                        exposed, while making its own limits visible.
                        It concedes that in many high-intensity
                        strikes no decision-support system can prevent
                        severe losses, but argues that turning
                        fragmentary information into transparent,
                        bounded choices and recorded learning is a
                        plausible and testable way to deliver some
                        measure of protection in engagements where
                        options still exist, rather than promising
                        comprehensive safety it cannot provide.

