    statement:          |
                        The force can standardise a simple DC charging
                        interface so that vehicle alternators, small
                        generators and stationary chargers can
                        recharge modules without bespoke equipment per
                        platform.
    evidence:           |
                        Many militaries are moving towards standard 24
                        V vehicle systems and NATO-standard power
                        connectors; commercial ecosystems for 18–60 V
                        DC tool packs also exist. The observation is
                        silent on this, so it remains a design and
                        policy choice rather than a confirmed fact.
