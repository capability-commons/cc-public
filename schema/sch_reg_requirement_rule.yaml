title:                  Requirement rule register schema
brief:                  |
                        The requirement rule register specifically: a
                        register whose entries are additionally
                        writing style rules.
description:            |
                        Composes the general register schema with the
                        writing style rule entry schema, since a rule
                        for writing a requirement has the shape of a
                        writing rule: the rule, its reasoning, and an
                        example each way.

