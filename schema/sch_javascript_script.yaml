title:                  JavaScript script schema
brief:                  |
                        Schema for a script written in JavaScript data
                        item.
description:            |
                        A script written in JavaScript is a data item.
                        Its identifier names the file by the path of
                        the package that holds it. This schema adds
                        nothing to sch_source.yaml.
usage:                  |
                        Selected for a script written in JavaScript by
                        the type register, which maps the js prefix to
                        that type.
