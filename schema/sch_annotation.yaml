title:                  Annotation schema
brief:                  |
                        The shape of an annotation: one assertion
                        about something in the graph.
description:            |
                        Identity, rights, the descriptive fields and
                        edges come from sch_base and sch_relation, and
                        an annotation carries nothing beyond them.
                        title names the assertion, brief states it,
                        and description carries the reasoning or the
                        qualification where one is wanted.

                        What an annotation is about, what it rests on,
                        and what it argues with are edges rather than
                        fields. There is no status, severity,
                        category, author, time, confidence or verdict.
                        ddr_annotation decides both.
usage:                  |
                        Named by t_annotation as the schema of every
                        item in annotation/.
