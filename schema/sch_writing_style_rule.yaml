protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Writing style rule entry schema
brief:                  |
                        What a writing style rule register entry
                        carries beyond the general register entry.
description:            |
                        One example sentence that follows the rule and
                        one that breaks it. The rule itself is the
                        brief and its reasoning is the description,
                        both from the general entry shape.
type:                   object

required:
  - follows
  - breaks

properties:

  follows:
    type:               string
    minLength:          1
    description:        "A sentence that follows the rule.\n"

  breaks:
    type:               string
    minLength:          1
    description:        "The same sentence written so that it breaks the rule.\n"
