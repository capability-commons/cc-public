title:                  Decision schema
brief:                  |
                        Schema for decision data items: an
                        attributable act by a person or an
                        organisation over exact content.
description:            |
                        Composes identity, rights and outgoing
                        relations. A decision names who decided, in
                        what role and under what authority, what was
                        decided, and over which items at which
                        digests, so that a later edit to any of them
                        makes the decision visibly stale. The brief
                        says why. A condition narrows what the
                        decision permits and an expiry bounds it in
                        time.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_decision.yaml
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_identity.yaml
  - $ref:               https://capability-commons.org/schema/sch_rights.yaml
  - $ref:               https://capability-commons.org/schema/sch_relation.yaml

  - type:               object

    required:
      - title
      - brief
      - actor
      - role
      - authority
      - outcome
      - subject

    properties:

      title:
        type:           string
        minLength:      1
        maxLength:      80
        pattern:        ^[^\n]+$
        description:    |
                        The unique name of the decision, one line.

      brief:
        type:           string
        minLength:      1
        description:    |
                        Why it was decided so: the reasons, and what
                        was weighed.

      actor:
        type:           string
        minLength:      1
        maxLength:      200
        pattern:        ^[^\n]+$
        description:    |
                        Who decided: a person, an organisation, or a
                        tool and its version.

      role:
        type:           string
        minLength:      1
        maxLength:      200
        pattern:        ^[^\n]+$
        description:    |
                        In what role the actor decided: engineering
                        authority, need owner, demonstration
                        performer.

      authority:
        type:           string
        minLength:      1
        maxLength:      200
        pattern:        ^[^\n]+$
        description:    |
                        What gives the actor the right to decide this,
                        or that nothing does: none, demonstration
                        only.

      outcome:
        type:           string

        enum:
          - waive
          - select
          - accept
          - lead

        description:    |
                        What was decided. waive: a concept whose
                        challenge did not conclude may be promoted, as
                        a named risk. select: a concept is chosen
                        among its alternatives. accept: a requirement
                        is accepted. lead: an assessment is the one a
                        report leads with.

      condition:
        type:           string
        minLength:      1
        description:    |
                        Optional. What the decision permits and no
                        more: the scope of a waiver, the experiment a
                        selection authorises.

      expiry:
        type:           string
        pattern:        ^\d{4}-\d{2}-\d{2}$
        description:    |
                        Optional. The day after which the decision no
                        longer holds.

      subject:
        type:           array
        minItems:       1

        items:
          type:         object
          additionalProperties:  false

          required:
            - id_item
            - guid_item
            - digest

          properties:

            id_item:
              type:     string
              minLength:  1

            guid_item:
              type:     string
              minLength:  1

            digest:
              type:     string
              pattern:  ^[0-9a-f]{8}$

        description:    |
                        The items decided over, each with the digest
                        of its content as it was: the decision holds
                        for that content and is stale for any other.

unevaluatedProperties:  false
