title:                  View schema
brief:                  |
                        The shape of a view: what sits at the root of
                        a tree, and which edges are followed to find
                        the children of a row.
description:            |
                        Composes the base envelope and outgoing
                        relations. The root says which types appear at
                        the first level and in what order. The
                        traversal list says which relations are
                        followed, in which direction, and its order is
                        the order the groups of children appear in.
                        The list is applied at every row, so a
                        relation that does not apply to an item yields
                        nothing.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_view.yaml
unevaluatedProperties:  false

allOf:
  - $ref:               https://capability-commons.org/schema/sch_base.yaml
  - $ref:               https://capability-commons.org/schema/sch_relation.yaml

  - type:               object

    required:
      - root
      - traversal
      - relation

    properties:

      root:
        type:           object
        additionalProperties:  false

        required:
          - type
          - sort

        description:    |
                        What sits at the first level of the tree.

        properties:

          type:
            type:       array
            minItems:   1
            description:  |
                        The types whose items appear at the root, each
                        named by both of its identifiers.

            items:
              type:     object
              additionalProperties:  false

              required:
                - id_type
                - guid_type

              properties:

                id_type:
                  type:  string
                  minLength:  1

                guid_type:
                  type:  string
                  minLength:  1

          sort:
            type:       string
            description:  |
                        The order the root items are listed in.

            enum:
              - identifier
              - title

      traversal:
        type:           array
        description:    |
                        The relations followed to find the children of
                        any row, in the order their groups appear.

        items:
          type:         object
          additionalProperties:  false

          required:
            - id_relation
            - guid_relation
            - direction

          properties:

            id_relation:
              type:     string
              minLength:  1

            guid_relation:
              type:     string
              minLength:  1

            direction:
              type:     string
              description:  |
                        holds follows the edges an item carries.
                        pointed_at_by follows the edges that name it.

              enum:
                - holds
                - pointed_at_by

usage:                  |
                        Selected for a view by the type register,
                        which maps the vw prefix to that type. Read by
                        cctool serve, which renders the tree a view
                        describes.
note:                   |
                        A view reads the graph and writes nothing. An
                        item already on the path from the root is not
                        entered again. See ddr_view.
