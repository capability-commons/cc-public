title:                  Manual case schema
brief:                  |
                        The configuration a case supplies to a method
                        a person carries out, which is nothing.
description:            |
                        A manual method carries its own procedure in
                        its instruction, and the case carries what it
                        is given and what is expected of it in its own
                        fields. There is nothing left for the
                        configuration to say, so it declares no
                        property and is closed.

                        Closed rather than absent, because a method
                        must name the schema governing what a case
                        supplies to it, and a case that wrote an
                        ungoverned mapping here would be the payload
                        ddr_test_case refuses.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_case_manual.yaml
type:                   object
usage:                  |
                        Named by every method whose execution form is
                        manual.
