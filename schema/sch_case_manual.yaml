title:                  Manual case schema
brief:                  |
                        The configuration a case supplies to a method
                        a person carries out, which is nothing.
description:            |
                        A manual method carries its own procedure in
                        its instruction, and the case carries what it
                        is given and what is expected of it in its own
                        fields, so there is nothing left for the
                        configuration to say. It declares no property
                        and is closed rather than absent, which
                        ddr_test_case decides.
