title:                  Gate tool register schema
brief:                  |
                        The shape of the register whose entries are
                        gate tools.
description:            |
                        Composes sch_register with sch_entry_gate_tool
                        in the pattern every register schema uses.
                        Each entry is the common register entry shape
                        and the gate tool shape together, closed to
                        anything neither declares.
