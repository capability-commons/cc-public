title:                  Test method register schema
brief:                  |
                        The shape of the register whose entries are
                        test methods.
description:            |
                        This schema composes sch_register with
                        sch_entry_test_method, in the pattern every
                        register schema uses. Each entry is the common
                        register entry shape and the test method shape
                        together. An entry is closed to any field that
                        is not declared by one of those two shapes.
$schema:                https://json-schema.org/draft/2020-12/schema
