$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_textual_requirement.yaml
id_self:                sch_textual_requirement
guid_self:              sch_862714ff65444283903e39f653c067af
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Textual requirement schema
brief:                  |
                        Schema for textual requirement data items: the
                        slots of a requirement statement, the claim it
                        makes, and the attributes that make it a
                        requirement expression.
description:            |
                        Composes identity, rights and outgoing
                        relations, and adds the slots of the statement
                        with the attributes the INCOSE guide names as
                        those that aid definition and management.
                        Title is the unique name. The statement is not
                        stored: it is composed from the slots, in the
                        SOPHIST template, wherever the requirement is
                        shown, so that it cannot drift from them. The
                        slots are the condition with its kind, the
                        entity, the obligation, the activity with its
                        actor, the process, the object and the
                        qualifier. Claim says whether the obligation
                        is evidential or a design choice. Rationale
                        says why, so that the statement need not.
                        Category classifies for grouping and for
                        finding gaps. Priority, verification method
                        and success criteria are optional until the
                        set is managed. Trace to what the requirement
                        derives from is an r_is_derived_from edge.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_identity.yaml
  - $ref:               https://capability-commons.org/schema/sch_rights.yaml
  - $ref:               https://capability-commons.org/schema/sch_relation.yaml

  - type:               object

    required:
      - title
      - entity
      - obligation
      - activity
      - process
      - object
      - claim
      - rationale
      - category

    properties:

      title:
        type:           string
        minLength:      1
        maxLength:      80
        pattern:        ^[^\n]+$
        description:    |
                        The unique name of the requirement, one line.

      condition_kind:
        type:           string

        enum:
          - logic
          - event
          - time

        description:    |
                        Optional, with condition. logic: the condition
                        is a state of affairs, written If. event: a
                        moment, written As soon as. time: a period,
                        written As long as.

      condition:
        type:           string
        minLength:      1
        maxLength:      200
        pattern:        ^[^\n]+$
        description:    |
                        Optional. The condition under which the
                        obligation holds, as a clause without its
                        keyword: the Checker has run over the
                        Directory_Tree. Given with condition_kind.

      entity:
        type:           string
        pattern:        ^[A-Z][A-Za-z0-9]*(_[A-Z0-9][A-Za-z0-9]*)*$
        maxLength:      80
        description:    |
                        The entity the obligation is on, in
                        Capitalised_Snake_Case, the subject of the
                        statement.

      obligation:
        type:           string

        enum:
          - shall
          - should
          - will
          - may

        description:    |
                        The degree of obligation: shall is mandatory,
                        should a wish, will a statement of what is to
                        come, may a permission.

      activity:
        type:           string

        enum:
          - autonomous
          - interaction
          - interface

        description:    |
                        The kind of activity. autonomous: the entity
                        does it by itself. interaction: the entity
                        provides the actor with the ability to do it.
                        interface: the entity is able to do it on what
                        a third party gives it.

      actor:
        type:           string
        pattern:        ^[A-Z][A-Za-z0-9]*(_[A-Z0-9][A-Za-z0-9]*)*$
        maxLength:      80
        description:    |
                        The actor the entity provides the ability to,
                        in Capitalised_Snake_Case. Given with activity
                        interaction and not otherwise.

      process:
        type:           string
        pattern:        ^[a-z]+( [a-z]+)*$
        maxLength:      40
        description:    |
                        The process word: one main verb in the
                        infinitive without to, such as report, display
                        or back up, defined once in the glossary of
                        the entity.

      object:
        type:           string
        minLength:      1
        maxLength:      200
        pattern:        ^[^\n]+$
        description:    |
                        What the process acts on, with the details
                        that complete it: the Location of each
                        Nonconformity in the Directory_Tree.

      qualifier:
        type:           string
        minLength:      1
        maxLength:      200
        pattern:        ^[^\n]+$
        description:    |
                        Optional. The performance or manner, as a
                        clause after the object: within 3 seconds of
                        the request.

      claim:
        type:           string

        enum:
          - evidential
          - design

        description:    |
                        What kind of claim the obligation is.
                        evidential: it restates what a source says
                        must hold, and is defended by citing the
                        source. design: it is a choice, and is
                        defended by argument, a decision with its
                        challenge on record.

      rationale:
        type:           string
        minLength:      1
        description:    |
                        Why the requirement exists: what it is for,
                        and anything a reader needs that the statement
                        must not carry.

      category:
        type:           string

        enum:
          - function
          - fit
          - form
          - quality
          - compliance

        description:    |
                        The kind of thing the requirement addresses:
                        function and performance; fit, the
                        interactions with what is outside; form, the
                        physical; quality, the ilities; compliance
                        with a standard or regulation.

      priority:
        type:           string

        enum:
          - high
          - medium
          - low

        description:    |
                        Optional. How the requirement ranks when the
                        set must be cut.

      verification:
        type:           string

        enum:
          - test
          - demonstration
          - inspection
          - analysis

        description:    |
                        Optional. The method by which the entity will
                        be verified to meet it.

      success_criteria:
        type:           string
        minLength:      1
        description:    |
                        Optional. What verification must show for the
                        requirement to be met.

      status:
        type:           string

        enum:
          - proposed
          - accepted
          - deprecated

        description:    |
                        Optional. Lifecycle status of the requirement.

unevaluatedProperties:  false
