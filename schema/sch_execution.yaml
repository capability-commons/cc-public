$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_execution.yaml
id_self:                sch_execution
guid_self:              sch_1030485e4a494715ba5afaf52c44779b
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Execution schema
brief:                  |
                        The shape of an execution: a deployment it ran
                        under, and a table of bindings.
description:            |
                        Composes the base envelope and outgoing
                        relations. Names the deployment by an
                        r_ran_under edge, which is required. Bindings
                        are sch_binding entries keyed by local name,
                        one per port per pass.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_base.yaml
  - $ref:               https://capability-commons.org/schema/sch_relation.yaml

  - type:               object

    required:
      - binding
      - relation

    properties:

      binding:
        minProperties:  1
        type:           object

        propertyNames:
          pattern:      ^[a-z][a-z0-9_]*$

        additionalProperties:
          $ref:         https://capability-commons.org/schema/sch_binding.yaml

      outcome:
        type:           string

        enum:
          - completed
          - exhausted
          - waiting

        description:    |
                        How the run ended. completed: every back edge
                        that fired was followed and the run reached
                        the end of its order with nothing left undone.
                        exhausted: at least one back edge was met when
                        its target had no budget left, so what the run
                        settled on is what the budget allowed, not
                        what the guards would have chosen. A run that
                        stopped removes its execution, unless it
                        committed after every node. Absent on
                        executions recorded before this field.
                        waiting: the run parked at an agent node and
                        holds its state; cctool resume continues it.

      relation:
        type:           array

        contains:
          type:         object

          properties:

            id_relation:
              const:    r_ran_under

      state:
        type:           object
        additionalProperties:  false

        required:
          - queue
          - pass
          - bound

        properties:

          queue:
            type:       array

            items:
              type:     string

          pass:
            type:       object

            additionalProperties:
              type:     integer
              minimum:  0

          bound:
            type:       array

            items:
              type:     object
              additionalProperties:  false

              required:
                - port
                - id_item
                - guid_item

              properties:

                port:
                  type:  string

                id_item:
                  $ref:  https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

                guid_item:
                  $ref:  https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid

        description:    "The state of a parked run: the nodes still queued, in order, the passes each node has taken, and what is bound on every port, as node.side.port. Present while the outcome is waiting.\n"

      waiting:
        type:           object
        additionalProperties:  false

        required:
          - node
          - brief

        properties:

          node:
            type:       string

          brief:
            type:       string
            minLength:  1

        description:    "The node the run waits at and the brief for whoever performs it, rendered from the node's ports and bound items. Present while the outcome is waiting.\n"

unevaluatedProperties:  false
