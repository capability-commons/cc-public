title:                  Process word entry schema
brief:                  |
                        What a process word register entry carries
                        beyond the general register entry.
description:            |
                        A process word entry holds the verb as it is
                        written in the process slot of a requirement,
                        and the verbs that are not to be used for the
                        same process. The brief is the definition of
                        the verb: what the entity does when it does
                        this. The description says what the object of
                        the verb must supply for the process to be
                        complete, such as on what, for whom, or from
                        where. Title, brief, description and alias
                        come from the general entry shape.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_entry_process_word.yaml
type:                   object

required:
  - term

properties:

  term:
    type:               string
    minLength:          1
    maxLength:          40
    pattern:            ^[a-z]+( [a-z]+)*$
    description:        |
                        The verb, in the infinitive without to, lower
                        case, one word or a phrasal verb: report, back
                        up. What the process slot of a requirement
                        holds.

  avoid:
    type:               array
    minItems:           1

    items:
      type:             string
      minLength:        1
      maxLength:        40
      pattern:          ^[a-z]+( [a-z]+)*$

    description:        |
                        Optional. Verbs that name the same process and
                        are not to be used, so that one process has
                        one word.

  kind:
    type:               string

    enum:
      - process
      - state
      - permission
      - management

    description:        |
                        Optional; process where absent. What the verb
                        names: process, an observable thing the entity
                        does; state, a condition it is in, be, have,
                        meet, comply; permission, a possibility it
                        grants, allow, permit, enable; management, a
                        word no performance can be verified against,
                        support, handle, manage. The statement check
                        reports a verb whose kind is not process, as
                        SOPHIST's second rule asks what the entity
                        does.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_entry.yaml
