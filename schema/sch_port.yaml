$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_port.yaml
id_self:                sch_port
guid_self:              sch_e73720cf21904fed82cb7941bfb9cdbe
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Port schema
brief:                  |
                        What a port is: one place on a component where
                        one item is consumed or produced.
description:            |
                        An entry on a component, under input or under
                        output. Names the type of the item it carries.
                        An input may be optional. An output carries
                        the prompt that produces its item. An eval is
                        anchored here by an r_is_judged_by edge.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_identity.yaml
  - $ref:               https://capability-commons.org/schema/sch_descriptive.yaml

required:
  - id_type
  - guid_type

properties:

  id_type:
    $ref:               https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

  guid_type:
    $ref:               https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid

  optional:
    type:               boolean

  revises:
    type:               string
    pattern:            ^[a-z][a-z0-9_]*$

  prompt:
    type:               string
    minLength:          1

  link:
    type:               object

    propertyNames:
      pattern:          ^r_[a-z][a-z0-9_]*$

    additionalProperties:
      type:             array
      minItems:         1
      uniqueItems:      true

      items:
        type:           string
        pattern:        ^[a-z][a-z0-9_]*$

    description:        "Optional. The edges the produced item carries: for each relation, the input ports whose bound items it points at. The executor adds one edge per port named, from what it makes to what was bound there; a port not bound stops the run. So a decision decides its subject by r_decides, and a concept derives from its need and is framed by its framing.\n"

  field:
    type:               array
    minItems:           1

    items:
      type:             string
      pattern:          ^[a-z][a-z0-9_]*$

    description:        |
                        Optional. The fields the model fills on this
                        port's item. Absent, every required prose
                        field that is empty. A table field is filled
                        from a list the model returns, one entry per
                        element.

  relation:
    type:               array

    items:
      $ref:             https://capability-commons.org/schema/sch_relation.yaml#/$defs/edge

  found:
    type:               object
    additionalProperties:  false

    required:
      - port
      - relation
      - direction

    properties:

      port:
        type:           string
        pattern:        ^[a-z][a-z0-9_]*$

      relation:
        type:           string
        pattern:        ^r_[a-z][a-z0-9_]*$

      direction:
        type:           string

        enum:
          - out
          - in

    description:        "Optional, on an output of an agent component. How the item on this port is found once the performer has finished: from the item bound on the named input port, by an edge of the relation, out from it or in to it, keeping items of this port's type. Where several are found the first by identifier is bound.\n"

unevaluatedProperties:  false
