$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_entry_term.yaml
id_self:                sch_entry_term
guid_self:              sch_62e63ec5ebe24650856fe2d275be3b4b
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Term entry schema
brief:                  |
                        What a term register entry carries beyond the
                        general register entry.
description:            |
                        The surface form of the term as it appears in
                        prose, and the forms that are not to be used
                        for it. Title, brief, description and alias
                        come from the general entry shape.
type:                   object
additionalProperties:   true

required:
  - term

properties:

  also:
    type:               array
    minItems:           1

    items:
      type:             string
      minLength:        1

  term:
    type:               string
    pattern:            ^[a-z][a-z0-9 ]*$
    minLength:          1

  avoid:
    type:               array
    minItems:           1

    items:
      type:             string
      minLength:        1
