$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_deployment.yaml
id_self:                sch_deployment
guid_self:              sch_17ba23d4628842b19533d1ab38fb67c0
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Deployment schema
brief:                  |
                        The shape of a deployment: a workflow, a
                        model, and a budget.
description:            |
                        Composes the base envelope and outgoing
                        relations. Names the workflow by an r_deploys
                        edge, which is required. The model is an
                        identifier the runner understands. The budget
                        is the most passes any one node may take.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_base.yaml
  - $ref:               https://capability-commons.org/schema/sch_relation.yaml

  - type:               object

    required:
      - model
      - budget
      - relation

    properties:

      model:
        type:           string
        minLength:      1
        maxLength:      120

      budget:
        type:           integer
        minimum:        1

      judge:
        type:           string

        enum:
          - always
          - guards
          - never

        description:    |
                        Which evals run as a node produces. guards
                        runs only those a guard depends on; always
                        runs every anchored eval; never runs none, and
                        a guard that needs a verdict then cannot fire.
                        Absent means always.

      confirm:
        type:           integer
        minimum:        1
        description:    |
                        Over how many fresh judgements an adverse
                        verdict is confirmed. Absent means the
                        runner's default. Odd, so that a majority
                        exists.

        not:
          multipleOf:   2

      commit:
        type:           string

        enum:
          - run
          - node
          - never

        description:    |
                        When a run commits. run commits once, at the
                        end, after the checks pass; node commits after
                        every node; never leaves the tree uncommitted,
                        which a dry run wants. Absent means run.

      model_challenge:
        type:           string
        minLength:      1
        description:    |
                        Optional. The model a challenging node runs
                        on. Must differ from model, since a challenge
                        built by the process that made the claim is
                        the claim restated. Required where the
                        workflow has a challenging node.
        maxLength:      120

      budget_by_priority:
        type:           object
        additionalProperties:  false

        properties:

          high:
            type:       integer
            minimum:    1

          medium:
            type:       integer
            minimum:    1

          low:
            type:       integer
            minimum:    1

        description:    |
                        Optional. The budget by the priority of what
                        is bound: the most passes a node may take when
                        an input item of that priority is bound.
                        Absent, or where nothing bound carries a
                        priority, budget applies.

      admit_unmeasured:
        type:           boolean
        description:    |
                        Whether an eval carrying no current confidence
                        for the judge in use may guard an edge. Absent
                        means not: a guard decides what happens next,
                        and a judge whose error rates on this
                        criterion are unknown is refused that.

      relation:
        type:           array

        contains:
          type:         object

          properties:

            id_relation:
              const:    r_deploys

unevaluatedProperties:  false
