title:                  Source trait
brief:                  |
                        Trait carried by a data item embedded in
                        source code.
description:            |
                        This schema is the shape shared by every data
                        item that names a piece of source code and
                        does not occupy a file of its own. Such an
                        item carries the fields every data item
                        carries, and no others. A source item differs
                        from other items in where it lives and in what
                        its identifier names. Those two things are not
                        fields.
usage:                  |
                        Composed by the schema for each kind of source
                        item: package, module, class and function.
note:                   |
                        A source item lives in the docstring of the
                        thing it names, as a YAML document opened by
                        --- and closed by three full stops.

                        description is required here, though
                        sch_descriptive leaves it optional.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_base.yaml

  - type:               object

    required:
      - description
