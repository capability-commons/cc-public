title:                  Source trait
brief:                  |
                        Trait carried by a data item embedded in
                        source code.
description:            |
                        The shape shared by every data item that names
                        a piece of source code rather than occupying a
                        file of its own.

                        Everything such an item carries, it carries
                        because every data item does. What
                        distinguishes it is where it lives and what
                        its identifier names, neither of which is a
                        field.
usage:                  |
                        Composed by the schema for each kind of source
                        item: package, module, class and function.
note:                   |
                        A source item lives in the docstring of the
                        thing it names, as a YAML document opened by
                        --- and closed by three full stops.

                        description is required here, though
                        sch_descriptive leaves it optional.
type:                   object
additionalProperties:   true

allOf:
  - $ref:               https://capability-commons.org/schema/sch_base.yaml

  - type:               object

    required:
      - description
