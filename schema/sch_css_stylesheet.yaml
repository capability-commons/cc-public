title:                  CSS stylesheet schema
brief:                  |
                        Schema for a cascading style sheet data item.
description:            |
                        A cascading style sheet is a data item. Its
                        identifier names the file by the path of the
                        package that holds it. This schema adds
                        nothing to sch_source.yaml.
usage:                  |
                        Selected for a cascading style sheet by the
                        type register, which maps the css prefix to
                        that type.
