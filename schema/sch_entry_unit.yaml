title:                  Unit entry schema
brief:                  |
                        What a unit register entry carries beyond the
                        general register entry.
description:            |
                        The symbol a quantity is written with, the
                        names it is also written by, and the kind of
                        quantity it measures. Title, brief and
                        description come from the general entry shape.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_entry_unit.yaml
type:                   object

required:
  - symbol
  - quantity

properties:

  symbol:
    type:               string
    minLength:          1
    maxLength:          40
    pattern:            ^[^\n]+$
    description:        |
                        The symbol, as written after a number: kg,
                        kWh, dBA.

  also:
    type:               array
    minItems:           1

    items:
      type:             string
      minLength:        1
      maxLength:        40
      pattern:          ^[^\n]+$

    description:        |
                        Optional. Other spellings a statement may use:
                        kilogram, kilograms.

  quantity:
    type:               string
    minLength:          1
    maxLength:          40
    pattern:            ^[^\n]+$
    description:        |
                        The kind of quantity the unit measures: mass,
                        length, time, power.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_entry.yaml
