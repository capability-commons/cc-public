title:                  Base trait
brief:                  |
                        Trait carried by every standalone data item.
description:            |
                        The envelope common to every data item held in
                        a file of its own: an identity, a prose
                        envelope, and rights. Composing this is what
                        distinguishes a standalone item from a
                        fragment of one.

                        Nothing is asserted here that the composed
                        traits do not assert.
usage:                  |
                        Composed via allOf by each concrete item type,
                        which then adds whatever else that type
                        requires.
note:                   |
                        sch_relation.yaml is not composed here. A type
                        whose items carry outgoing edges composes that
                        trait alongside this one.
type:                   object
additionalProperties:   true

allOf:
  - $ref:               https://capability-commons.org/schema/sch_identity.yaml
  - $ref:               https://capability-commons.org/schema/sch_descriptive.yaml
  - $ref:               https://capability-commons.org/schema/sch_rights.yaml
