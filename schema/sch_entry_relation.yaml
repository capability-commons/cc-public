title:                  Relation entry schema
brief:                  |
                        What a relation register entry carries beyond
                        the general register entry.
description:            |
                        The kinds of item an edge of this relation may
                        run from and to, and whether its edges may
                        form a cycle. Each is optional, and an absent
                        constraint says nothing rather than permitting
                        nothing: a relation that plainly ends at one
                        kind of thing says so, and one that ends at
                        anything a decision can settle does not. The
                        relation check reads these and reports an edge
                        that breaks them.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_entry_relation.yaml
type:                   object
additionalProperties:   true

properties:

  domain:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The types, by readable id, of the items an
                        edge of this relation may run from. Absent
                        means any.

  range:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The types, by readable id, of the items an
                        edge of this relation may run to. Absent means
                        any.

  acyclic:
    type:               boolean
    description:        |
                        Whether the edges of this relation must form
                        no cycle, an edge from an item to itself
                        included. Absent means cycles are not checked.
