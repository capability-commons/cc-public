title:                  Relation entry schema
brief:                  |
                        What a relation register entry carries beyond
                        the general register entry.
description:            |
                        A relation entry holds the constraints on the
                        edges of that relation. It says which kinds of
                        item an edge may run from and to, whether the
                        edges may form a cycle, whether a chain of
                        edges counts as one edge, which relations may
                        not hold between the same pair of items, and
                        how many edges of the relation one item may
                        hold. Each constraint is optional. An absent
                        constraint says nothing, rather than
                        permitting nothing. The relation check reads
                        these constraints and reports an edge or an
                        item that breaks them.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_entry_relation.yaml
type:                   object

properties:

  domain:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The types, by readable id, of the items an
                        edge of this relation may run from. Absent
                        means any.

  range:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The types, by readable id, of the items an
                        edge of this relation may run to. Absent means
                        any.

  acyclic:
    type:               boolean
    description:        |
                        Whether the edges of this relation must form
                        no cycle, an edge from an item to itself
                        included. Absent means cycles are not checked.

  transitive:
    type:               boolean
    description:        |
                        Whether a chain of edges of this relation is
                        one edge of it. A check or a query may follow
                        the chain as far as it runs. Absent means a
                        chain is a chain and nothing more.

  incompatible:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The relations, by readable id, that may not
                        hold between the same pair of items as this
                        one. The constraint means the same read from
                        either end, so one entry of a pair carries it.
                        Absent means no relation is excluded.

  cardinality:
    type:               object
    additionalProperties:  false
    minProperties:      1

    properties:

      minimum:
        type:           integer
        minimum:        0
        description:    |
                        How many edges of this relation an item in its
                        domain holds at least. Checked only where
                        domain says which items those are.

      maximum:
        type:           integer
        minimum:        1
        description:    |
                        How many edges of this relation one item may
                        hold at most.

    description:        |
                        How many edges of this relation one item
                        holds. Absent means any number. A minimum is a
                        claim about every item in the domain, so it
                        needs one.

  describes:
    type:               boolean
    description:        |
                        Whether an edge of this relation means the
                        item at its source talks about the item at its
                        target, so that a change to the target makes
                        the source suspect. Weaker than dependency: a
                        digest reads dependency and a report reads
                        this, so an evidence row does not stop
                        standing because somebody edited a rationale.
                        Absent means the source says nothing about the
                        target.

  dependency:
    type:               boolean
    description:        |
                        Whether an edge of this relation means the
                        item at its source rests on the item at its
                        target, so that a change to the target changes
                        what the source claims. A closure follows
                        every such edge, of this relation or another,
                        as far as they run. Absent means a closure
                        passes this relation over.

  responsibility:
    type:               boolean
    description:        |
                        Whether an edge of this relation means the
                        item at its target is responsible for meeting
                        the item at its source, so that the target
                        takes the criticality of the source. The
                        derivation follows every such edge, of this
                        relation or another, as far as they run, and
                        an item takes the greatest criticality
                        reaching it on each dimension. Absent means
                        the derivation passes this relation over.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_entry.yaml
