title:                  Relation entry schema
brief:                  |
                        What a relation register entry carries beyond
                        the general register entry.
description:            |
                        The kinds of item an edge of this relation may
                        run from and to, whether its edges may form a
                        cycle, whether a chain of them is one edge,
                        which relations may not hold between the same
                        pair, and how many edges of it one item holds.
                        Each is optional, and an absent constraint
                        says nothing rather than permitting nothing.
                        The relation check reads these and reports an
                        edge or an item that breaks them.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_entry_relation.yaml
type:                   object

properties:

  domain:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The types, by readable id, of the items an
                        edge of this relation may run from. Absent
                        means any.

  range:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The types, by readable id, of the items an
                        edge of this relation may run to. Absent means
                        any.

  acyclic:
    type:               boolean
    description:        |
                        Whether the edges of this relation must form
                        no cycle, an edge from an item to itself
                        included. Absent means cycles are not checked.

  transitive:
    type:               boolean
    description:        |
                        Whether a chain of edges of this relation is
                        one edge of it. A check or a query may follow
                        the chain as far as it runs. Absent means a
                        chain is a chain and nothing more.

  incompatible:
    type:               array
    minItems:           1
    uniqueItems:        true

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id

    description:        |
                        The relations, by readable id, that may not
                        hold between the same pair of items as this
                        one. The constraint means the same read from
                        either end, so one entry of a pair carries it.
                        Absent means no relation is excluded.

  cardinality:
    type:               object
    additionalProperties:  false
    minProperties:      1

    properties:

      minimum:
        type:           integer
        minimum:        0
        description:    |
                        How many edges of this relation an item in its
                        domain holds at least. Checked only where
                        domain says which items those are.

      maximum:
        type:           integer
        minimum:        1
        description:    |
                        How many edges of this relation one item may
                        hold at most.

    description:        |
                        How many edges of this relation one item
                        holds. Absent means any number. A minimum is a
                        claim about every item in the domain, so it
                        needs one.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_entry.yaml
