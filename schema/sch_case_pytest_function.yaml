title:                  Pytest function case configuration schema
brief:                  |
                        What a test case supplies to the pytest
                        function method: the identity of the test
                        function to run.
description:            |
                        One field, and it is an identity. The adapter
                        derives the pytest node id from the item it
                        names, so a case cannot supply a path or a
                        command and cannot ask for anything but a test
                        this tree holds to be run.
$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_case_pytest_function.yaml
usage:                  |
                        Named by tm_pytest_function as the schema of
                        the configuration its cases supply.
type:                   object

required:
  - id_test
  - guid_test

additionalProperties:   false

properties:

  id_test:
    $ref:               https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
    description:        |
                        Readable id of the python function item that
                        is the test to run. What the adapter resolves,
                        since a node id is the file and the definition
                        names and both are read from the item this
                        names.

  guid_test:
    $ref:               https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid
    description:        |
                        Guid of that item, which the reference check
                        holds to the id beside it. Required so the
                        pair cannot drift, and not what the adapter
                        reads.
