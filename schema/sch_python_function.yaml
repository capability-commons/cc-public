title:                  Python function schema
brief:                  |
                        Schema for a python function data item.
description:            |
                        A python function, as a data item. Its
                        identifier names the function, method or
                        generator it names, qualified by its module
                        and any enclosing class.

                        Adds nothing to sch_source.yaml.
usage:                  |
                        Selected for a python function by the type
                        register, which maps the pyf prefix to that
                        type.
type:                   object
additionalProperties:   true

