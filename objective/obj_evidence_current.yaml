status:                 accepted
title:                  Evidence is invalid once what it observed has changed
brief:                  |
                        Evidence stands only against the requirement,
                        implementation and procedure it was taken
                        from.
statement:              |
                        Evidence that a requirement is met ceases to
                        stand once the requirement, what implements
                        it, or the procedure that observed it has
                        changed.
description:            |
                        Evidence carries a digest of the closure of
                        what a verdict rests on, so a change to the
                        requirement, to what implements it or to the
                        procedure stops the evidence standing. The
                        evidence check reports a row whose digest is
                        not what the tree computes now.

