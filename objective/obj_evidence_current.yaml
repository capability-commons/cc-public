status:                 accepted
title:                  Evidence is invalid once what it observed has changed
brief:                  |
                        Evidence stands only against the requirement,
                        implementation and procedure it was taken
                        from.
statement:              |
                        Evidence that a requirement is met ceases to
                        stand once the requirement, what implements
                        it, or the procedure that observed it has
                        changed.
description:            |
                        Adopted by ddr_verification_standard, which
                        claims conformance for an objective and never
                        for a standard as a whole. What satisfies this
                        points at it; nothing pointing at it means it
                        is not yet satisfied.

