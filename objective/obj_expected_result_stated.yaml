                        What verification must show for a requirement
                        to be met is stated on the requirement, before
                        the verification is run.
description:            |
                        What verification must show is the success
                        criteria of the requirement, written before
                        anything runs and part of what an acceptance
                        rests on. The trace check reports an accepted
                        requirement with none.

