status:                 accepted
title:                  Inspection and analysis are recorded as test is
brief:                  |
                        A requirement verified without running code is
                        recorded by the same means as one verified by
                        running it.
statement:              |
                        A requirement verified by inspection, analysis
                        or demonstration carries a method, a case, an
                        execution and evidence, by the same means as
                        one verified by test.
description:            |
                        Adopted by ddr_verification_standard, which
                        claims conformance for an objective and never
                        for a standard as a whole. What satisfies this
                        points at it; nothing pointing at it means it
                        is not yet satisfied.

