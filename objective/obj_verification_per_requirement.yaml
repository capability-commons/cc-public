status:                 accepted
title:                  Verification is recorded for each requirement
brief:                  |
                        Each requirement has a record of how it is
                        verified, whatever activity produced it.
statement:              |
                        Verification is recorded for each requirement
                        separately, whether or not the activity that
                        produced it was shared with another
                        requirement.
description:            |
                        Two requirements verified by one activity each
                        get a row of their own, naming the case and
                        the outcome. Adopted from DO-178C, the INCOSE
                        handbook and ISO/IEC/IEEE 29119 by
                        ddr_verification_standard. The trace check and
                        the evidence check report a requirement that
                        lacks one.

