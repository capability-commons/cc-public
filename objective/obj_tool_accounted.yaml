status:                 accepted
title:                  A tool relied on is itself verified
brief:                  |
                        A tool whose verdict nothing corroborates is
                        verified against what it is required to do.
statement:              |
                        A tool whose verdict is relied on without
                        independent corroboration is itself verified
                        against what it is required to do, under the
                        conditions it is used in.
description:            |
                        A tool whose verdict is relied on without
                        independent corroboration is itself verified
                        against what it is required to do, under the
                        conditions it is used in. Adopted from DO-330
                        by ddr_tool_verification. Required from
                        criticality level sixty. reg_gate_tool holds
                        what the gate relies on and
                        qry_gate_tool_control says which of them is
                        shown to fail.

