title:                  Coverage of the requirements is analysed
brief:                  |
                        That a test exercises what its requirement
                        requires is shown, not assumed.
statement:              |
                        That the verification of a requirement
                        exercises what that requirement requires is
                        analysed and recorded, rather than inferred
                        from the verification existing.
description:            |
                        A judge reads a test against the success
                        criteria of what it verifies and the reading
                        is recorded, rather than adequacy being
                        inferred from a verifier existing. Claimed by
                        nothing while nothing writes a coverage
                        analysis.

