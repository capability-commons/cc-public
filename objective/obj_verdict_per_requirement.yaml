status:                 accepted
title:                  A verdict stands for one requirement
brief:                  |
                        A recorded verdict says which requirement it
                        is about.
statement:              |
                        A verdict recorded for a requirement stands
                        for that requirement alone, so that a failure
                        says which obligation was not met and a pass
                        cannot be inherited by another.
description:            |
                        Adopted by ddr_verification_standard, which
                        claims conformance for an objective and never
                        for a standard as a whole. What satisfies this
                        points at it; nothing pointing at it means it
                        is not yet satisfied.

