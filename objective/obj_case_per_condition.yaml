status:                 accepted
title:                  Each condition is expected separately
brief:                  |
                        A normal, a boundary and an error condition
                        are each expected in their own right.
statement:              |
                        Where a requirement admits a normal, a
                        boundary and an error condition, what is
                        expected of each is stated separately.
description:            |
                        Where a requirement admits a normal, a
                        boundary and an error condition, what is
                        expected of each is stated separately rather
                        than in one expectation covering all three.
                        Nothing points at it and no check reads it.

