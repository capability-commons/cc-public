title:                  GPS-denied unmanned swarm coordination
subject:                |
                        Drone and UGV unit operators, swarm autonomy
                        developers, and units fielding multi-platform
                        unmanned missions in GNSS-contested urban or
                        built-up terrain
outcome:                |
                        Reliable coordinated navigation for five or
                        more unmanned aerial or ground platforms at
                        once, keeping the intended formation, avoiding
                        collisions with teammates and obstacles, and
                        operating on local peer-to-peer communication
                        alone without continuous GNSS or external
                        command links
purpose:                |
                        Enable multi-platform unmanned missions when
                        satellite navigation and operator links are
                        contested, reduce collision risk in dense or
                        urban terrain, preserve formation cohesion for
                        coordinated effects, and limit dependence on
                        centralised control that fails under jamming
context:                |
                        GNSS-denied or degraded environments,
                        especially urban and built-up areas with
                        obstacles, multipath and limited radio reach;
                        operations needing several UAVs or UGVs to
                        move together; and conditions where only
                        short-range peer links remain because uplinks
                        and mesh relays are jammed, blocked or out of
                        range
evidence:               |
                        Swarmer's public releases, carried by Army
                        Technology and Business Wire in September
                        2025, state that its coordination software has
                        supported more than 100,000 missions in
                        Ukraine since April 2024 across some fifty
                        units, in GNSS-denied and jamming-heavy
                        environments, with swarms of up to twenty-five
                        platforms demonstrated; the software takes
                        position from GNSS, inertial or visual sources
                        and shares it across the swarm. Reporting on
                        the December 2024 Lyptsi operation describes
                        dozens of ground vehicles and FPV drones
                        acting together without infantry. Open
                        research on GNSS-denied swarms, including
                        SwarmRaft in 2025, shows distributed
                        localisation, formation keeping and obstacle
                        avoidance on peer communication and onboard
                        sensing alone.
