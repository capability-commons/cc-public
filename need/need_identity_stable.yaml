title:                  References that survive a rename
subject:                |
                        The cc-public maintainer renaming items as the
                        vocabulary settles
outcome:                |
                        A reference that keeps resolving when the item
                        it names is renamed
purpose:                |
                        Rename freely as understanding improves,
                        without breaking the graph of references
context:                |
                        A repository whose readable names change as
                        its terms settle, shared across federated
                        copies that hold references into it
evidence:               |
                        The record family was renamed to the design
                        decision family across four files on
                        2026-09-04 and every reference followed by
                        guid; the term itself changed twice before
                        that.
