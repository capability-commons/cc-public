title:                  Reliable UAV icing status assessment
subject:                |
                        Drone operators, unmanned-aircraft
                        maintainers, interceptor and reconnaissance
                        unit leaders, and developers integrating
                        environmental awareness into tactical UAV
                        platforms
outcome:                |
                        Reliable onboard assessment of
                        unmanned-aircraft icing risk and ice-accretion
                        status across varied operating conditions,
                        sufficient to inform launch, continue-flight,
                        mitigation or abort decisions before icing
                        causes sensor failure or vehicle loss
purpose:                |
                        Reduce winter and humid-weather sortie losses
                        from undetected icing, preserve airspeed,
                        control and sensor integrity, let operators
                        tell icing from other failures, and extend the
                        usable weather envelope of unmanned systems
                        that now stay grounded in marginal conditions
context:                |
                        Multi-season unmanned operations from freezing
                        continental winters to fog, rain and snow, on
                        small platforms without the icing protection
                        of manned aircraft, with pitot and camera
                        vulnerability on low-cost airframes and a
                        lightweight, low-power sensing budget
evidence:               |
                        The Kyiv Independent and Kyiv Post reported in
                        early 2026 that fronts of minus twenty degrees
                        Celsius grounded interceptor drones, froze
                        cameras and wiring, and left surface-to-air
                        missiles as the all-weather layer while
                        interceptors work best in clear conditions.
                        Business Insider quoted a Ukrainian drone
                        commander describing winter sorties as
                        unpredictable, with frost on chassis and
                        propellers and condensation in wiring and
                        lenses. NTNU and IEEE research on small-UAV
                        icing protection shows temperature and
                        humidity thresholds feeding microcontroller
                        control of electro-thermal de-icing, flight
                        tested in Arctic conditions. A 2023 survey of
                        UAV icing detection identifies atmospheric,
                        direct and performance-based methods as
                        prerequisites for ice protection on platforms
                        too small for conventional boots.
status:                 proposed
