title:                  The maintainer sees the graph drawn
subject:                |
                        The maintainer reviewing the tree
outcome:                |
                        A drawing of a chosen part of the graph of
                        relations, items as nodes and edges labelled
                        by relation
purpose:                |
                        Reason about the shape of the graph, its
                        clusters, its hubs and its gaps, rather than
                        infer it from files one at a time
context:                |
                        The graph of relations is the system, and it
                        has only ever been read one file at a time or
                        one item at a time
evidence:               |
                        Nobody has seen the graph drawn. The decisions
                        that decide the most items, the items nothing
                        decides, and the shape of the derivation from
                        need to evidence are all facts a drawing would
                        show and a listing hides.
priority:               medium
status:                 proposed
entity:                 |
                        Tool
