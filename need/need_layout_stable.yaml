title:                  Layout that does not drift
subject:                |
                        Maintainers of a repository of data items
                        edited by people and by models
outcome:                |
                        Every YAML document and every docstring
                        document laid out one way, checkable by
                        machine, with no hand alignment
purpose:                |
                        Read and review documents without the noise of
                        layout drift, and let tools edit them without
                        churning diffs
context:                |
                        A repository of hundreds of files receiving
                        many small writes a day, where gutter
                        indentation and wrap columns drifted within
                        weeks
evidence:               |
                        Gutter indentation and wrap columns drifted
                        across dozens of files in the first weeks of
                        hand editing, recorded in
                        ddr_layout_convention; a mechanical comparison
                        found them and a printer removed them. Since
                        the printer, the layout check has stayed clean
                        over every commit.
status:                 proposed
