title:                  Findings a person can act on
subject:                |
                        People and models fixing what a check or an
                        eval found
outcome:                |
                        Each finding located to the file that holds it
                        and the path within that file
purpose:                |
                        Fix findings without searching for them, and
                        key control cases and suppressions on where a
                        finding lies
context:                |
                        Checks run after every edit and every workflow
                        node, over hundreds of files, and findings are
                        answered by people and by models
evidence:               |
                        Early findings reported by message alone were
                        searched for by hand. Control cases and
                        suppressions needed a stable key, decided in
                        ddr_eval_measurement, and the location of a
                        finding is that key.
