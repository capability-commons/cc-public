title:                  The agent asks the graph a question
subject:                |
                        The agent maintaining the tree
outcome:                |
                        An answer to a question about the graph of
                        relations that the tool did not anticipate,
                        and the question kept where it can be asked
                        again
purpose:                |
                        Answer what the fixed reports do not, without
                        a script, and find what the graph has
                        forgotten
context:                |
                        The reports the tool gives are fixed in shape,
                        and the questions the graph raises are not:
                        which decision decides the most, what nothing
                        points at, which relation nobody uses
evidence:               |
                        Every such question this week was answered by
                        a script written against a private index and
                        thrown away; two were wrong the first time,
                        and none can be asked again by anyone else.
