title:                  The agent sees the reach of a change
subject:                |
                        The agent editing the tree, before a change to
                        an item
outcome:                |
                        Every item the change may reach, across
                        several hops of relation edges in either
                        direction, with the edges that reach it
purpose:                |
                        Judge the reach of a change before making it,
                        and name what will need to follow
context:                |
                        Edits to the tree are made by an agent working
                        unattended, over a graph of a thousand items
                        and fifteen hundred edges under twenty
                        relations, where an edge two hops away is as
                        binding as one
evidence:               |
                        In one week the agent asked what decides a
                        schema, what snapshots a specimen, what an
                        unlinked edge would strand and what a moved
                        file would break, and answered each by
                        grepping the tree for a guid or by a script
                        against a private index; two of those scripts
                        were wrong the first time.
priority:               high
status:                 proposed
