title:                  A corpus a person can work in
subject:                |
                        An engineer, a reviewer or a maintainer
                        working on what a corpus holds
outcome:                |
                        What the corpus says, what rests on what, and
                        what has been said about it, reached by
                        reading the records themselves rather than the
                        files they are stored in
purpose:                |
                        Judge a record against the records around it,
                        see what a change reaches, and decide, without
                        holding the shape of the corpus in memory or
                        opening a file to find it
context:                |
                        A corpus grows past what one person holds in
                        mind, and most of what it holds is written by
                        a machine. The records are documents in a
                        directory tree, and the tool reports one item
                        at a time. Design work is continuous, so the
                        reading is done many times a day and not once.
evidence:               |
                        The Axair camera simulator holds ten records,
                        and one claim about the envelope the models
                        are adequate in is stated three times: in the
                        operational concept as an assumption, in the
                        characterisation campaign as a precondition,
                        and in the interpolation measure as a
                        population. Noticing that the three could
                        drift apart took three files open at once.

                        The command line serves a coding agent well
                        and shows a person one item at a time, so the
                        shape of even ten records is assembled in the
                        head. Nothing in this tree has been read any
                        other way.
priority:               high
