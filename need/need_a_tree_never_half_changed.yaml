title:                  A tree that is never half changed
subject:                |
                        A coding agent writing to the repository, and
                        the maintainer who reads what it wrote
outcome:                |
                        A repository that is either what it was or
                        what it was asked to be, and never part of one
                        and part of the other
purpose:                |
                        Read a tree and know that what is in it was
                        put there by an act that finished, so that a
                        check, a commit or a review is about a state
                        somebody chose rather than about where a
                        command stopped
context:                |
                        Most writes to this repository are made by an
                        agent running many small commands one after
                        another, unattended. A command that stops
                        partway leaves a state nobody chose and nobody
                        sees, because the next command reads the tree
                        as it finds it and reports what is there
                        rather than what was meant.

                        The tool already refuses in several places,
                        and the decisions say why in each. Nothing
                        says what a person or an agent is entitled to
                        assume across all of them.
evidence:               |
                        The tool refuses in at least four places and
                        each refusal was decided separately: a commit
                        refuses a critical finding, a tree that could
                        not be read entirely refuses to be edited, a
                        write goes to a hidden file and is moved over
                        its target in one step, and acceptance refuses
                        a requirement whose trace or evidence is
                        lacking.

                        Three callers once held three copies of the
                        refusal policy and disagreed, which
                        ddr_fail_closed records: the command line
                        reported an error in its exit status and the
                        committer and the executor did not.
