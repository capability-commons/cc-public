title:                  Findings worth acting on
subject:                |
                        The cc-public maintainer acting on eval
                        findings
outcome:                |
                        An adverse finding worth acting on, with a
                        known error rate
purpose:                |
                        Act on findings without re-reading every
                        subject by hand, and know how often the judge
                        is wrong
context:                |
                        Model judges that are wrong about one time in
                        ten on a single judgement, over corpora too
                        large to read
