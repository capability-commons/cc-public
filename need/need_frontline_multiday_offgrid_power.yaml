title:                  Sustained off-grid power for frontline terminal and chargers
subject:                |
                        personnel at a frontline position without grid
                        power or fuel resupply
outcome:                |
                        a source of electrical power for the terminal
                        and chargers that can operate for several days
                        without a fuel delivery
purpose:                |
                        keep their communications and drone operations
                        running during periods when fuel cannot be
                        brought in
context:                |
                        a frontline position where grid power has been
                        unavailable for multiple nights, fuel for a
                        generator has been exhausted, and road access
                        for resupply is blocked by incoming fire
evidence:               |
                        obs_frontline_power_post reports that a poster
                        at a frontline position describes three nights
                        without grid power, a generator that ran out
                        of fuel the previous day, blocked fuel runs
                        due to a road under fire, and loss of terminal
                        and drone battery power by evening, leading
                        them to state a need for power for the
                        terminal and chargers that lasts days without
                        a fuel run. It does not establish how often
                        this happens, how many positions are affected,
                        who the poster is, or whether this account is
                        accurate. Corroboration would come from
                        independent reports or records confirming the
                        same power loss, fuel shortage, road
                        conditions, and operational impact at that
                        time and place.
status:                 proposed

