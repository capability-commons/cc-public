title:                  The reason kept with the commit
subject:                |
                        The cc-public maintainer reading the
                        repository's history
outcome:                |
                        The reason for each commit kept with the
                        commit itself
purpose:                |
                        Understand a change months later without the
                        person who made it, and audit what a workflow
                        run did to the repository
context:                |
                        A repository whose commits are made by people
                        and by workflow runs, read back by a tool
evidence:               |
                        Commit records as files were considered and
                        rejected in ddr_commit_record, since a file
                        drifts from the commit it describes; cctool
                        log reads the message form back over the whole
                        history.
