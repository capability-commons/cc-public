title:                  Countering glide bomb–enabled infiltration attacks
subject:                |
                        Ukrainian ground units under Russian glide
                        bomb attack
outcome:                |
                        effective protection against glide bomb
                        strikes and follow-on infantry infiltration
purpose:                |
                        preserve combat effectiveness and limit losses
                        during high-value targeting
context:                |
                        engagements where Russian forces use glide
                        bombs to destroy cover and then infiltrate
                        through the ruins with drone support
evidence:               |
                        obs_rubizh_glide_bombs_post reports one
                        account that Russian forces use glide bombs
                        against high-value targets, that these
                        munitions are hard to intercept and can
                        destroy fortifications and urban areas, and
                        that infantry then infiltrate through the
                        damaged ground with support from
                        reconnaissance and FPV drones, while claiming
                        that countering aircraft, reconnaissance
                        crews, and concentrating less can reduce the
                        threat. It does not establish how often or
                        where this pattern occurs, how many units face
                        it, how effective the described counters are,
                        or who operates the account. Corroboration
                        would need independent reports or records from
                        other units or observers that describe the
                        same tactics and effects, and operational data
                        on the success of different countermeasures.
status:                 proposed

