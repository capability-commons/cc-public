status:                 draft
title:                  Type register
brief:                  |
                        Register of types.
description:            |
                        The type register provides a comprehensive
                        list of types together with associated
                        metadata for each type.
usage:                  |
                        The type register is used to enable
                        type-specific system functions such as
                        automated data item validation.
note:                   |
                        Types are analogous to programming language
                        types, and describe the kinds of things that
                        the system can handle. The system is primarily
                        intended to process data items. Data items can
                        be any sort of digital asset, but most
                        typically consist of an engineering document
                        such as a requirements specification or a test
                        report, encoded in a defined structure,
                        serialized as a YAML string and stored in a
                        file system as a text file. A requirements
                        specification is the canonical example of a
                        data item, and the requirements specification
                        type defines the metadata common to all
                        requirements specification data items.

relation:

  - id_relation:        r_is_specified_by_schema
    guid_relation:      r_d70024bd40444f93b4fc1903379ded81
    id_target:          sch_reg_type
    guid_target:        sch_8fe14a82efa7444383ba95a9ca55b4c5

table:

  # ---------------------------------------------------------------------------
  # t_type — Type type
  #
  t_type:
    id_self:            t_type
    guid_self:          t_2a196326eaf84759b37d43d5b1f0b118
    title:              Type type
    brief:              |
                        Type of type data items
    description:        |
                        Each type data item describes one type of
                        thing that can be held and processed by the
                        system.
    usage:              |
                        Type data items are used to hold type-specific
                        metadata, such as a list of schemas that may
                        be used to validate data items of that type.
    note:               |
                        Each entry in this register is a type data
                        item. Most types are data item types, but
                        other specialised types can also exist.

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_type
        guid_target:    reg_c377bd8e87ec4b1ca2bd398488392a3d

    status:             proposed
    alias:              []
    prefix:             t
    regex_id:           ^t_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_schema - Schema type
  #
  t_schema:
    id_self:            t_schema
    guid_self:          t_a4fb6d3ae5ff4452a45804e2f57b06a2
    title:              Schema type
    brief:              |
                        Type of schema data items
    description:        |
                        Each schema data item defines the structure of
                        a data item type, either in part of in whole.
    usage:              |
                        Schema data items are used to validate the
                        structure of data items, improving the
                        reliability of data item generation.
    note:               |
                        A number of trait schemas exist to hold common
                        elements such as data primitives. This means
                        that there is not a simple one-to-one
                        relationship between data item types and
                        schema, but none-the-less most data item types
                        are expected to have at least one
                        corresponding schema, and most schema data
                        items are expected to validate at most one
                        data item type. The schema for a data item
                        type can be inferred either from the schema
                        filename or by looking it up in the type
                        register (this document).

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_schema
        guid_target:    sch_19b746511dc84ae1b822a98afa81a196

    status:             proposed
    alias:              []
    prefix:             sch
    regex_id:           ^sch_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_eval - Eval type
  #
  t_eval:
    id_self:            t_eval
    guid_self:          t_33c451d43a2748ddba39060ecc7c013e
    title:              Eval type
    brief:              |
                        Type of eval data items
    description:        |
                        Each eval data item defines how a data item
                        type should be evaluated by a language model.
    usage:              |
                        Eval data items are used to evaluate the
                        content of data items, improving the quality
                        of data item generation.
    note:               |
                        Not every data item will have a corresponding
                        eval, but some may have more than one.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_eval
        guid_target:    sch_a7edf040404f4294bcbcc2294955775f

    status:             proposed
    alias:              []
    prefix:             evl
    regex_id:           ^evl_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_register — Register type
  #
  t_register:
    id_self:            t_register
    guid_self:          t_dcd4c5f697c945829094914ff868a43b
    title:              Register type
    brief:              |
                        Type of register data items
    description:        |
                        Each register data item provides a controlled
                        list of register-entry data items.
    usage:              |
                        Register data items are used whenever a
                        controlled set of identifiers is needed by an
                        automated process.
    note:               |
                        This document as a whole is an instance of a
                        register data item, and it provides a
                        controlled set of data item types as well as a
                        means of looking up metadata associated with
                        each type.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_register
        guid_target:    sch_a4620d79fab546b3be6c756f0325e069

    status:             proposed
    alias:              []
    prefix:             reg
    regex_id:           ^reg_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_relation — Relation type
  #
  t_relation:
    id_self:            t_relation
    guid_self:          t_250febd9728346e98029ef9b587304f1
    title:              Relation type
    brief:              |
                        Type of relation data items
    description:        |
                        Each relation data item defines a formal
                        meaning for a set of directed edges between
                        identifiable items.
    usage:              |
                        Relation data items are used to control the
                        way that edges are interpreted. Labelling
                        edges with different relation ids results in
                        them being treated differently.
    note:               |
                        Relations are directional. Where a relation is
                        invertible, the inverse is considered to be a
                        distinct relation.

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_relation
        guid_target:    reg_512fbf5c51be4efaa4517b52310ddf80

    status:             proposed
    alias:              []
    prefix:             r
    regex_id:           ^r_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_ddr — Design decision type
  #
  t_ddr:
    id_self:            t_ddr
    guid_self:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    title:              Design decision type
    brief:              |
                        Type of design decision data items
    description:        |
                        Each design decision data item holds the
                        reasoning behind one design decision.
    usage:              |
                        Design decision data items are used to hold
                        the reasoning that produced an artifact, so
                        that the artifact itself need not carry it.
    note:               |
                        One record per decision, where a decision is
                        one thing that could later be revised on its
                        own. Records live in ddr/ rather than beside
                        what they decide, since a decision commonly
                        settles matters across several directories at
                        once.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_ddr
        guid_target:    sch_d801523ec4814494be182b54dd62e8e3

    status:             proposed
    alias:              []
    prefix:             ddr
    regex_id:           ^ddr_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_protective_mark — Protective mark type
  #
  t_protective_mark:
    id_self:            t_protective_mark
    guid_self:          t_d0fe8b855eb4467fb00f238fe180225b
    title:              Protective mark type
    brief:              |
                        Type of protective mark data items
    description:        |
                        Each protective mark data item names an
                        authority and a level, and states what may be
                        done with an item bearing it.
    usage:              |
                        Protective mark data items are used to decide
                        what may be disclosed, to whom, and under
                        whose rules.
    note:               |
                        Marks exist only as entries in the protective
                        mark register, never as documents of their
                        own, so this type names no schema. The
                        register names one, and that schema governs
                        its entries.

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_protective_mark
        guid_target:    reg_0653174dda274015aa95754a37073797

    status:             proposed
    alias:              []
    prefix:             mark
    regex_id:           ^mark_[a-z][a-z0-9_]*$

  # ---------------------------------------------------------------------------
  # t_python_package — Python package type
  #
  t_python_package:
    id_self:            t_python_package
    guid_self:          t_8d37421f029f4e13a7d99ee80028d6fb
    title:              Python package type
    brief:              |
                        Type of python package data items
    description:        |
                        Each python package data item names a python
                        package, which is a directory of modules and
                        holds its metadata in the docstring of its
                        __init__.py.
    usage:              |
                        Required of every package.
    note:               |
                        The identifier carries the fully qualified
                        name, so that the thing it names can be found
                        by that name -- imported for introspection, or
                        located by walking the source tree.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_python_package
        guid_target:    sch_87d9bd39240144e88ed06cc43b680bff

    status:             proposed
    alias:              []
    prefix:             pyp
    regex_id:           ^pyp_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$

  # ---------------------------------------------------------------------------
  # t_python_module — Python module type
  #
  t_python_module:
    id_self:            t_python_module
    guid_self:          t_186408f897d541588a1bb9c495fcec71
    title:              Python module type
    brief:              |
                        Type of python module data items
    description:        |
                        Each python module data item names a python
                        module, which is one source file and holds its
                        metadata in its own module docstring.
    usage:              |
                        Required of every module.
    note:               |
                        The identifier carries the fully qualified
                        name, so that the thing it names can be found
                        by that name -- imported for introspection, or
                        located by walking the source tree.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_python_module
        guid_target:    sch_a20d9cb1c7b547019069e2277d375500

    status:             proposed
    alias:              []
    prefix:             pym
    regex_id:           ^pym_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$

  # ---------------------------------------------------------------------------
  # t_python_class — Python class type
  #
  t_python_class:
    id_self:            t_python_class
    guid_self:          t_47a7dfb0248642d589333f5d5298bdf2
    title:              Python class type
    brief:              |
                        Type of python class data items
    description:        |
                        Each python class data item names a python
                        class, which holds its metadata in its own
                        docstring.
    usage:              |
                        Optional. Written only where something needs
                        to name the class -- a design decision
                        deciding it, or an eval judging it. Requiring
                        one of every class would cost more in header
                        than the code is worth.
    note:               |
                        The identifier carries the fully qualified
                        name, so that the thing it names can be found
                        by that name -- imported for introspection, or
                        located by walking the source tree.

                        Lowercased, though a python class name is not.
                        Resolving the identifier back to the class
                        needs a case insensitive lookup, which nothing
                        provides yet because nothing needs it.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_python_class
        guid_target:    sch_d77b33d22fd84c70bbf797b2abc49517

    status:             proposed
    alias:              []
    prefix:             pyc
    regex_id:           ^pyc_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$

  # ---------------------------------------------------------------------------
  # t_python_function — Python function type
  #
  t_python_function:
    id_self:            t_python_function
    guid_self:          t_92b7b832d3c7419f9252f7eb3339f94b
    title:              Python function type
    brief:              |
                        Type of python function data items
    description:        |
                        Each python function data item names a python
                        function, method or generator, which holds its
                        metadata in its own docstring.
    usage:              |
                        Optional, on the same terms as a python class.
    note:               |
                        The identifier carries the fully qualified
                        name, so that the thing it names can be found
                        by that name -- imported for introspection, or
                        located by walking the source tree.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_python_function
        guid_target:    sch_cea99c1b69374a8baf2fc9909b058e78

    status:             proposed
    alias:              []
    prefix:             pyf
    regex_id:           ^pyf_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$

  t_component:
    id_self:            t_component
    guid_self:          t_f4187ed188c44f199786b7b46edc9720
    title:              Component type
    brief:              |
                        Type of component data items
    description:        |
                        Each component data item is one unit of
                        transformation: named input and output ports,
                        and either a prompt on each output or a source
                        item that implements it.
    usage:              |
                        A component is what a node in a workflow
                        instantiates. The same component may be
                        instantiated by many nodes in many workflows.
    note:               |
                        The atomic form of component. Composite forms
                        -- workflows -- say they are component forms
                        by r_is_a_form_of, and their ports are derived
                        from their nodes.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_component
        guid_target:    sch_f1095fd235ef479085522c2373b9c6c6

    status:             proposed
    alias:              []
    prefix:             cmp
    regex_id:           ^cmp_[a-z][a-z0-9_]*$

  t_port:
    id_self:            t_port
    guid_self:          t_7780d8581bef435bb6fbd70c87d00091
    title:              Port type
    brief:              |
                        Type of port data items
    description:        |
                        Each port data item is one place on a
                        component where exactly one item is consumed
                        or produced. A port names the type of the item
                        it carries.
    usage:              |
                        Ports are entries held on a component under
                        input and output, keyed by a short local name.
                        Edges in a workflow name them by path through
                        the node.
    note:               |
                        Held in a component rather than standing
                        alone, and validated by the schema of the
                        component holding it. The identifier carries
                        the component name and the port name, so that
                        two components may each have a port with the
                        same local name.
    relation:           []
    status:             proposed
    alias:              []
    prefix:             prt
    regex_id:           ^prt_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$

  t_workflow_dataflow:
    id_self:            t_workflow_dataflow
    guid_self:          t_ac29e6ddbcca4c339d3cf592b9da4ba1
    title:              Dataflow workflow type
    brief:              |
                        Type of dataflow workflow data items
    description:        |
                        Each dataflow workflow data item holds a
                        graph: nodes instantiating components, and
                        edges wiring one output port to one input
                        port, with back edges held apart and guards on
                        destinations.
    usage:              |
                        A dataflow workflow is run under a deployment,
                        and every run leaves an execution.
    note:               |
                        A composite form of component. Its ports are
                        the unbound ports of its nodes: inputs with no
                        incoming forward edge and outputs with no
                        outgoing forward edge. Back edges do not bind
                        a port.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_workflow_dataflow
        guid_target:    sch_1eb527db75de470b8cec8605179f3221

      - id_relation:    r_is_a_form_of
        guid_relation:  r_20f5b5423123410cb63b0ef9cffc906f
        id_target:      t_component
        guid_target:    t_f4187ed188c44f199786b7b46edc9720

    status:             proposed
    alias:              []
    prefix:             wf
    regex_id:           ^wf_[a-z][a-z0-9_]*$

  t_node:
    id_self:            t_node
    guid_self:          t_ee3244960dcf435ea9f7c46d70626ab9
    title:              Node type
    brief:              |
                        Type of node data items
    description:        |
                        Each node data item is one instance of a
                        component within one workflow, carrying
                        whatever configuration that instance needs.
    usage:              |
                        Nodes are entries held on a workflow under
                        node, keyed by a short local name. Edge paths
                        begin with that name.
    note:               |
                        Held in a workflow rather than standing alone,
                        and validated by the schema of the workflow
                        holding it.
    relation:           []
    status:             proposed
    alias:              []
    prefix:             node
    regex_id:           ^node_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$

  t_deployment:
    id_self:            t_deployment
    guid_self:          t_c94163a5cf8a4a2986f94b696065b8f6
    title:              Deployment type
    brief:              |
                        Type of deployment data items
    description:        |
                        Each deployment data item names a workflow and
                        the machinery it is run under: which model,
                        what budget of passes a cycle may take, and
                        whatever else a run needs that the definition
                        must not say.
    usage:              |
                        An execution names exactly one deployment, and
                        reads its machinery from there.
    note:               |
                        Reusable. A hundred runs under one
                        configuration are a hundred edges to one
                        deployment.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_deployment
        guid_target:    sch_17ba23d4628842b19533d1ab38fb67c0

    status:             proposed
    alias:              []
    prefix:             dep
    regex_id:           ^dep_[a-z][a-z0-9_]*$

  t_execution:
    id_self:            t_execution
    guid_self:          t_ccc73856470a4003bb7b899c2139cd8c
    title:              Execution type
    brief:              |
                        Type of execution data items
    description:        |
                        Each execution data item records one run of a
                        workflow under one deployment, as a table of
                        bindings: which item filled which port on
                        which pass.
    usage:              |
                        An execution is written once and not edited.
                        Where an item came from is read from the
                        bindings that name it.
    note:               |
                        The derivation record. Everything an item owes
                        to a workflow is here and nowhere else. The
                        identifier sorts by time, as a commit record's
                        does: the prefix, a UTC timestamp, and six
                        characters of the guid.
    status:             proposed
    alias:              []
    prefix:             exe
    regex_id:           ^exe_[0-9]{14}_[0-9a-f]{6}$

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_execution
        guid_target:    sch_1030485e4a494715ba5afaf52c44779b

  t_binding:
    id_self:            t_binding
    guid_self:          t_77bea970bdfb407d9ad740aa7ad2ee1b
    title:              Binding type
    brief:              |
                        Type of binding data items
    description:        |
                        Each binding data item names the node and port
                        that were filled, the pass on which they were
                        filled, and by an edge the item that filled
                        them.
    usage:              |
                        Bindings are entries held on an execution
                        under binding, keyed by a short local name.
    note:               |
                        A reified reference, per
                        ddr_qualified_reference: a relation edge is
                        four fields and a binding needs more, so the
                        binding is a thing that carries an edge.
    status:             proposed
    alias:              []
    prefix:             bnd
    regex_id:           ^bnd_[a-z0-9][a-z0-9_]*(\.[a-z0-9_][a-z0-9_]*)*$
    relation:           []

  t_term:
    id_self:            t_term
    guid_self:          t_e0d624b5a7a6406581eda544e5213cb1
    title:              Term type
    brief:              |
                        Type of term data items
    description:        |
                        Each term data item defines one word the
                        repository uses for one of its concepts, with
                        the forms it is also known by and any forms to
                        be avoided.
    usage:              |
                        Term data items are used to keep vocabulary
                        consistent, and to judge prose against the
                        glossary.
    note:               |
                        Terms exist only as entries in a term
                        register, never as documents of their own, so
                        this type names no schema. The register names
                        one, and that schema governs its entries.

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_term
        guid_target:    reg_bcba1ab65d824ac2b2f7af2ded66835a

    status:             proposed
    alias:              []
    prefix:             term
    regex_id:           ^term_[a-z][a-z0-9_]*$

  t_control_set:
    id_self:            t_control_set
    guid_self:          t_7d1ac066f3e049f383b100340374a80a
    title:              Control set type
    brief:              |
                        Type of control set data items
    description:        |
                        Each control set data item holds cases with
                        known verdicts for one eval, so that the eval
                        can be measured and a finding it raises can be
                        answered.
    prefix:             ctl
    regex_id:           ^ctl_[a-z][a-z0-9_]*$
    usage:              |
                        A control set names the eval it measures by an
                        r_measures edge. cctool measure judges its
                        cases; cctool case adds one from a live
                        finding.
    note:               |
                        Cases are never shown to the judge. They are
                        held apart from an eval's examples so that an
                        eval cannot be measured against its own
                        prompt.
    status:             proposed

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_control_set
        guid_target:    sch_b31d6cf715dc47c28869fd81dd8a65d0

  t_control_case:
    id_self:            t_control_case
    guid_self:          t_dba50c07f45d4beabb4d94123c9241f2
    title:              Control case type
    brief:              |
                        Type of control case data items
    description:        |
                        Each control case data item is one subject
                        with a known verdict: the text as the judge
                        would see it, the verdict a person holds it
                        to, why, and where the case came from.
    prefix:             case
    regex_id:           ^case_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
    usage:              |
                        Cases are entries held on a control set. A
                        case whose text matches an item's rendering,
                        with a verdict of met, answers a finding on
                        that item.
    note:               |
                        Held in a control set rather than standing
                        alone, and validated by the set's schema.
                        Origin says where a case came from, because
                        cases from different origins answer different
                        questions and must not be pooled without
                        saying so.
    status:             proposed
    relation:           []

  t_question:
    id_self:            t_question
    guid_self:          t_2b6805c1903b47da90a29725affb36f1
    title:              Question type
    brief:              |
                        Type of question data items
    description:        |
                        Each question data item is one thing a design
                        decision does not settle, held on that record
                        with an identity of its own so that whatever
                        later settles it can say so.
    prefix:             qst
    regex_id:           ^qst_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
    usage:              |
                        Questions are entries held on a decision
                        record under question. A record or item
                        answers one by an r_answers edge. cctool
                        questions lists them, open or answered.
    note:               |
                        Held in a record rather than standing alone,
                        and validated by the record's schema. A
                        question has no date, because nothing here
                        has; when it was asked is known to the
                        repository's history.
    status:             proposed
    relation:           []

  t_commit:
    id_self:            t_commit
    guid_self:          t_ffa64d0aef394e38af2acfc4cf2f6c5f
    title:              Commit type
    brief:              |
                        Type of commit record data items
    description:        |
                        Each commit record data item describes one
                        commit to the repository: what it was for,
                        what state the checks were in, and which items
                        it changed.
    prefix:             cmt
    regex_id:           ^cmt_[0-9]{14}_[0-9a-f]{6}$
    usage:              |
                        A commit record lives in the message of the
                        commit it describes, after a plain first line,
                        inside the same markers a docstring uses.
                        cctool commit writes one; cctool log reads
                        them back.
    note:               |
                        Never a file in the tree. Validated once, when
                        made, and again on demand from history.
                        Nothing in the tree refers to a commit record,
                        so it need not be loaded to resolve anything.
                        The identifier sorts by time: the prefix, a
                        UTC timestamp, and six characters of the guid.
    status:             proposed

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_commit
        guid_target:    sch_46065f16926a43b586804bdacca29cd2

  t_writing_style_rule:
    id_self:            t_writing_style_rule
    guid_self:          t_854481855e61404ab53d2766077cb2f9
    title:              Writing style rule type
    brief:              |
                        Type of writing style rule data items
    description:        |
                        Each writing style rule data item states one
                        rule that prose in the repository follows,
                        with its reasoning and an example sentence
                        each way.
    prefix:             style
    regex_id:           ^style_[a-z][a-z0-9_]*$
    usage:              |
                        Writing style rule data items are bound into
                        writing prompts as context, and cited by the
                        evals that judge prose.
    note:               |
                        Writing style rules exist only as entries in a
                        writing style rule register, never as
                        documents of their own, so this type names no
                        schema. The register names one, and that
                        schema governs its entries.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_writing_style_rule
        guid_target:    reg_6efc4d246c3d4097ac0010bc004b12ee

  t_textual_requirement:
    id_self:            t_textual_requirement
    guid_self:          t_ca3efb2ddd534838844c500aa92c848c
    title:              Textual requirement type
    brief:              |
                        Type of textual requirement data items
    description:        |
                        Each textual requirement data item holds one
                        requirement statement, a shall statement on
                        one entity, with the attributes that make it a
                        requirement expression: its rationale, its
                        category, and where it came from.
    prefix:             req
    regex_id:           ^req_[a-z][a-z0-9_]*$
    usage:              |
                        Textual requirement data items are written for
                        an entity under specification, judged by the
                        evals that implement the INCOSE rules, and
                        traced to what they derive from.
    note:               |
                        Requirements live in requirement/. The type is
                        textual because a requirement may one day be
                        held as a model as well; this type holds the
                        sentence.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_textual_requirement
        guid_target:    sch_862714ff65444283903e39f653c067af

  t_requirement_rule:
    id_self:            t_requirement_rule
    guid_self:          t_e6f6d4afca8348faa1a05dbcbefeb6ac
    title:              Requirement rule type
    brief:              |
                        Type of requirement rule data items
    description:        |
                        Each requirement rule data item states one
                        rule for writing a requirement statement, with
                        its reasoning and an example that follows it
                        beside one that breaks it. The rules are those
                        of the INCOSE guide to writing requirements
                        and of the SOPHIST set of regulations,
                        numbered as there with R and S, and each names
                        the document it is taken from.
    prefix:             rule
    regex_id:           ^rule_[a-z][a-z0-9_]*$
    usage:              |
                        Requirement rules are cited by the evals that
                        implement them, and their examples are the
                        first control cases of those evals.
    note:               |
                        Requirement rules exist only as entries in a
                        requirement rule register, never as documents
                        of their own, so this type names no schema.
                        The register names one, and that schema
                        governs its entries; the entry shape is the
                        writing style rule shape, since a rule for
                        writing a requirement is a writing rule.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_requirement_rule
        guid_target:    reg_26928fc355f440bb8c569a701fda4a25

  t_requirement_characteristic:
    id_self:            t_requirement_characteristic
    guid_self:          t_4cde0a92d42c42e497cea394ce4df2bf
    title:              Requirement characteristic type
    brief:              |
                        Type of requirement characteristic data items
    description:        |
                        Each requirement characteristic data item
                        names one quality a well formed requirement
                        statement or set has, as the INCOSE guide
                        defines them: nine of a statement and six of a
                        set.
    prefix:             char
    regex_id:           ^char_[a-z][a-z0-9_]*$
    usage:              |
                        Requirement characteristics are what the rules
                        contribute to, by r_contributes_to edges, and
                        what an eval on requirements is ultimately
                        measuring toward.
    note:               |
                        Requirement characteristics exist only as
                        entries in a requirement characteristic
                        register, never as documents of their own, so
                        this type names no schema.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_requirement_characteristic
        guid_target:    reg_64a1c0971df64615b170905fd3a46b21

  t_need:
    id_self:            t_need
    guid_self:          t_e2252072b81d4aac8ee8f267b42d34be
    title:              Need type
    brief:              |
                        Type of need data items
    description:        |
                        Each need data item holds one need: who needs
                        what, why, in what circumstances, and on what
                        evidence. It names no entity and no solution;
                        a requirement derived from it names the
                        entity.
    prefix:             need
    regex_id:           ^need_[a-z][a-z0-9_]*$
    usage:              |
                        Needs are the demand side of the repository. A
                        requirement traces to a need by an
                        r_is_derived_from edge, and so does a need
                        refined from a broader one. Needs live in
                        need/.
    note:               |
                        The statement of a need is composed from its
                        slots when the need is rendered, never stored.
                        See ddr_need.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_need
        guid_target:    sch_09b2a0d969794594914cd39d563c9261

  t_assumption:
    id_self:            t_assumption
    guid_self:          t_3cf8aba2d173418e8279c51d29426648
    title:              Assumption type
    brief:              |
                        Type of assumption data items
    description:        |
                        Each assumption data item holds one claim
                        about the world that a design decision relies
                        on, with the evidence for it, so that the
                        evidential half of a decision is checked as
                        evidence and the design half as argument.
    prefix:             asm
    regex_id:           ^asm_[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
    usage:              |
                        Assumptions are entries under assumption on a
                        design decision, and are what an eval on a
                        decomposition reads before judging whether the
                        children deliver the parent.
    note:               |
                        Assumptions exist only as entries on a design
                        decision, never as documents of their own; the
                        decision's schema governs them through
                        sch_assumption. See ddr_need_to_requirement.
    status:             proposed
    alias:              []
    relation:           []

  t_framing:
    id_self:            t_framing
    guid_self:          t_1fa09aca323b45b0bac385a34f96886c
    title:              Framing type
    brief:              |
                        Type of framing data items
    description:        |
                        Each framing data item names one way of
                        looking at a need for analysis: what it treats
                        as in scope, what it makes salient, and what
                        kinds of response it admits. A framing is
                        reusable; its application to a need is a
                        decomposition.
    prefix:             frame
    regex_id:           ^frame_[a-z][a-z0-9_]*$
    usage:              |
                        A decomposition names its framing by binding
                        one to the analysis component, and records it
                        in its context. Alternatives are explored by
                        decomposing the same need under different
                        framings.
    note:               |
                        Framings exist only as entries in the framing
                        register. The register is the catalogue the
                        analysis draws on rather than inventing a lens
                        each time, on the precedent of problem frames.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_framing
        guid_target:    reg_742219baff0943e084a11895a8f3f897

  t_methodology:
    id_self:            t_methodology
    guid_self:          t_c82040ae2986457182ad376a9d04dde2
    title:              Methodology type
    brief:              |
                        Type of methodology data items
    description:        |
                        Each methodology data item names one
                        established way of analysing needs or writing
                        requirements, with its source and what it
                        contributes.
    prefix:             method
    regex_id:           ^method_[a-z][a-z0-9_]*$
    usage:              |
                        A component that implements a methodology
                        names it; the decision record of an analysis
                        says which was followed.
    note:               |
                        Methodologies exist only as entries in the
                        methodology register.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_methodology
        guid_target:    reg_3dce4c8b7d784b02897940ee1f37bb61

  t_verification_evidence:
    id_self:            t_verification_evidence
    guid_self:          t_b84cb711e3d444a0a44962e748cef7e2
    title:              Verification evidence type
    brief:              |
                        Type of verification evidence data items
    description:        |
                        Each verification evidence data item records
                        what one observer found about the requirements
                        verified by one method: a row per case and
                        requirement, with an outcome and the digest of
                        what it was observed against.
    prefix:             evd
    regex_id:           ^evd_[a-z][a-z0-9_]*$
    usage:              |
                        Written by an observer, the pytest adapter or
                        cctool attest, and rewritten by the next
                        observation. Read by the evidence check, which
                        reports an accepted requirement whose evidence
                        is absent, not a pass, or stale.
    note:               |
                        Observed, not authored: a claim about the
                        past, replaced rather than edited, with its
                        history in git. Evidence is not a verification
                        declaration; r_verifies says what is meant to
                        verify, and a row says what did.
    status:             proposed

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_evidence
        guid_target:    sch_f51af4d59bd0417f86850e9fc35c0638

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_type
        guid_target:    reg_c377bd8e87ec4b1ca2bd398488392a3d

  t_query:
    id_self:            t_query
    guid_self:          t_2ada9ea7fcbe400497020013ada412e1
    title:              Query type
    brief:              |
                        Type of query data items
    description:        |
                        Each query data item holds SQL over the facts
                        of the tree, the items, the edges and the
                        containments, and says what a row of its
                        result means.
    prefix:             qry
    regex_id:           ^qry_[a-z][a-z0-9_]*$
    usage:              |
                        A question about the graph worth asking twice
                        is kept as a query and run by cctool query;
                        the useful questions accumulate in the tree
                        rather than in scripts.
    note:               |
                        Reads the facts and writes nothing. See
                        ddr_graph_query.
    status:             proposed

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_query
        guid_target:    sch_fa663f02c767447b87019d05ccaee9c9

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_type
        guid_target:    reg_c377bd8e87ec4b1ca2bd398488392a3d

  t_observation:
    id_self:            t_observation
    guid_self:          t_74fdbf3d18d3449ca8d263c2b369da47
    title:              Observation type
    brief:              |
                        Type of observation data items
    description:        |
                        Each observation data item holds what was
                        captured from one public source, unchanged:
                        the content, its locator, its attribution as
                        the source gives it, when it was published and
                        observed, how it was captured, and a digest
                        naming that exact content. It interprets
                        nothing; a need derived from it says in its
                        evidence what the observation supports.
    prefix:             obs
    regex_id:           ^obs_[a-z][a-z0-9_]*$
    usage:              |
                        Made by cctool observe from a capture file,
                        never by hand and never by a model. A need
                        traces to an observation by an
                        r_is_derived_from edge. Observations live in
                        observation/. An observation has no status: it
                        happened and was captured; a changed source is
                        a new observation.
    home:               observation

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_observation
        guid_target:    sch_d48d2c9c6a924df6a7c2bc3266c296d9

  t_concept:
    id_self:            t_concept
    guid_self:          t_cf7be428e5bb442b90cc501d5b59a61d
    title:              Concept type
    brief:              |
                        Type of candidate solution concept data items
    description:        |
                        Each concept data item holds one candidate
                        solution to a need under a framing: the entity
                        it proposes, how it is used and made, what it
                        does for the need, its assumptions, its risks
                        and the candidate requirements on its entity.
                        It is a hypothesis, proposed until a recorded
                        selection.
    prefix:             cpt
    regex_id:           ^cpt_[a-z][a-z0-9_]*$
    usage:              |
                        Made by the concept workflow from a need and a
                        framing, and challenged. A concept derives
                        from its need by r_is_derived_from and names
                        its lens by r_is_framed_by. Concepts live in
                        concept/. Several concepts for one need are
                        the alternatives; selecting one is a recorded
                        decision.
    home:               concept

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_concept
        guid_target:    sch_64222042ae3a4f2f982be45425c5c835

  t_candidate_requirement:
    id_self:            t_candidate_requirement
    guid_self:          t_528ccc3af5ad4265ad0b608e42b415d4
    title:              Candidate requirement type
    brief:              |
                        Type of candidate requirement entries embedded
                        in a concept
    description:        |
                        Each candidate requirement is one obligation
                        proposed on a concept's entity, with its
                        rationale and category, held in the concept's
                        candidate_requirement table with an identity
                        of its own. Promotion makes a textual
                        requirement item from it.
    prefix:             crq
    regex_id:           ^crq_[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
    usage:              |
                        Never a top-level item. Its id is the
                        concept's name and the entry's key. The
                        requirement evals judge the textual
                        requirement promoted from it, not the entry.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_candidate_requirement
        guid_target:    sch_f1b1a233919545fc8c26de0f93c6ad86

  t_assessment:
    id_self:            t_assessment
    guid_self:          t_f17bb0f6fb6347e38eb8fabf6a1b7eed
    title:              Assessment type
    brief:              |
                        Type of feasibility assessment data items
    description:        |
                        Each assessment data item holds one assessor's
                        judgement of one concept's feasibility: a
                        verdict, seven rated dimensions with their
                        rationale, and the off-the-shelf products,
                        standards or component classes the concept
                        could use, with what supports each claim.
    prefix:             asmt
    regex_id:           ^asmt_[a-z][a-z0-9_]*$
    usage:              |
                        Made by the assess workflow, by a model or by
                        an agent with tools, or written by a person.
                        An assessment points at its concept by
                        r_assesses and at its references by r_cites.
                        Assessments live in assessment/. The run that
                        made one names its model; an agent or a person
                        names themselves in assessor.
    home:               assessment

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_assessment
        guid_target:    sch_5b8be2436aa24a509762a44a51c831e4

  t_dimension:
    id_self:            t_dimension
    guid_self:          t_0576d263e84a44ffb3f3a0e11b98d0bd
    title:              Assessment dimension type
    brief:              |
                        Type of dimension entries embedded in an
                        assessment
    description:        |
                        Each dimension entry rates one aspect of a
                        concept's feasibility and says why. Never a
                        top-level item.
    prefix:             dim
    regex_id:           ^dim_[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
    usage:              |
                        Held in an assessment's dimension table under
                        one of the seven fixed keys.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_dimension
        guid_target:    sch_1a2141660c8f4beb92bdfb1adc42363f

  t_product:
    id_self:            t_product
    guid_self:          t_4f818a5d1df642219d5494c99c0368ff
    title:              Off-the-shelf product type
    brief:              |
                        Type of off-the-shelf candidate entries
                        embedded in an assessment
    description:        |
                        Each product entry names a product, standard
                        or component class a concept could use as it
                        is, with its role, maturity and support. Never
                        a top-level item.
    prefix:             prd
    regex_id:           ^prd_[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
    usage:              |
                        Held in an assessment's product table. Cites
                        its references by r_cites edges to
                        observations.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_product
        guid_target:    sch_4a9c9fd8eccc43289b3423350b0115f9

  t_segment:
    id_self:            t_segment
    guid_self:          t_ea7ae026558f44718988cacbcad360b4
    title:              Segment type
    brief:              |
                        Type of segment data items
    description:        |
                        Each segment data item declares one repository
                        of the commons and the segments it consumes.
                        The repository it governs is the directory
                        holding the directory the item sits in, so a
                        repository declares itself by holding one.
    prefix:             seg
    regex_id:           ^seg_[a-z][a-z0-9_]*$
    home:               segment
    usage:              |
                        One per repository, in segment/. The segment
                        check holds every reference to the direction
                        the r_consumes edges declare. A repository
                        that declares none is passed over, so segments
                        can be adopted one repository at a time.

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_segment
        guid_target:    sch_52c08f6a29094a64b49706d0303008c8

  t_document:
    id_self:            t_document
    guid_self:          t_5571ffde1b304460a83fa33d0a9bb453
    title:              Document type
    brief:              |
                        Type of external document data items
    description:        |
                        Each document data item names one external
                        document, a standard, a guide, a paper or a
                        book, with the particulars that let a reader
                        find it, and what the repository takes from
                        it.
    prefix:             doc
    regex_id:           ^doc_[a-z][a-z0-9_]*$
    usage:              |
                        Documents are the targets of r_is_taken_from
                        edges from the rules, characteristics and
                        methodologies that draw on them.
    note:               |
                        Documents exist only as entries in a document
                        register, never as documents of their own, so
                        this type names no schema. The register names
                        one, and that schema governs its entries.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_document
        guid_target:    reg_0954469dcdb84c5b8c84639845bea81c

  t_process_word:
    id_self:            t_process_word
    guid_self:          t_efb7706620654cd4bdf5f8b26597c20b
    title:              Process word type
    brief:              |
                        Type of process word data items
    description:        |
                        Each process word data item defines one verb a
                        requirement may oblige an entity to perform:
                        what the entity does, what the object must
                        supply, and the verbs not to be used for the
                        same process.
    prefix:             verb
    regex_id:           ^verb_[a-z][a-z0-9_]*$
    usage:              |
                        The process slot of a requirement or a
                        candidate requirement is resolved against the
                        process words its segment can see.
    note:               |
                        Process words exist only as entries in a
                        process word register, never as documents of
                        their own, so this type names no schema. The
                        register names one, and that schema governs
                        its entries. A consumer segment may hold a
                        register of the same type.
    status:             proposed
    alias:              []

    relation:

      - id_relation:    r_is_held_in_registry
        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_process_word
        guid_target:    reg_14b9e34d84da45fc8d3f2385252ef9b1
