status:                 draft
title:                  Type register
brief:                  |
                        Register of types.
description:            |
                        The type register provides a comprehensive
                        list of types together with associated
                        metadata for each type.
usage:                  |
                        The type register is used to enable
                        type-specific system functions such as
                        automated data item validation.
note:                   |
                        Types are analogous to programming language
                        types, and describe the kinds of things that
                        the system can handle. The system is primarily
                        intended to process data items. Data items can
                        be any sort of digital asset, but most
                        typically consist of an engineering document
                        such as a requirements specification or a test
                        report, encoded in a defined structure,
                        serialized as a YAML string and stored in a
                        file system as a text file. A requirements
                        specification is the canonical example of a
                        data item, and the requirements specification
                        type defines the metadata common to all
                        requirements specification data items.

