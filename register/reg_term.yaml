status:                 draft
title:                  Term register
brief:                  |
                        Register of the terms used in the cc-public
                        repository: the glossary.
description:            |
                        The term register provides a controlled list
                        of the words this repository uses for its own
                        concepts, each with a definition, the forms it
                        is also known by, and any forms that are not
                        to be used for it.
usage:                  |
                        The term register is used to keep the
                        vocabulary of the repository consistent. A
                        record introducing a concept enters its term
                        here. Prose is judged against it: a defined
                        term is used in its defined sense, and a form
                        listed under avoid is not used for it.

                        A partner may hold a glossary of their own, as
                        a register of the same type. A term arriving
                        from a partner names an entry there and not
                        here.
note:                   |
                        A term is a word for a concept, whether or not
                        the concept is an item. Anchor, scope and
                        guard have entries; so do component and port.
                        What has a type is a subset of what has a
                        name.

                        Two words are defined here because they would
                        otherwise be one. A relation edge links items
                        and is always four fields. A dataflow edge
                        wires ports inside a workflow and has no
                        identity. Bare edge is ambiguous, and prose
                        should say which.

relation:

  - id_relation:        r_is_specified_by_schema
    guid_relation:      r_d70024bd40444f93b4fc1903379ded81
    id_target:          sch_reg_term
    guid_target:        sch_9c44fa0e85434706a25fb5a892955069

table:

  term_item:
    id_self:            term_item
    guid_self:          term_8713eb9216bb43f19c946a9bfa9edbdc
    title:              Item
    brief:              |
                        An addressable unit of data: anything that
                        carries an identity.
    description:        |
                        The thing this system holds. A standalone
                        document, or an entry embedded in one, that
                        carries a guid and a readable id and can
                        therefore be the target of a relation edge.
    term:               item

    also:
      - data item

    alias:              []
    status:             proposed
    relation:           []

  term_identity:
    id_self:            term_identity
    guid_self:          term_9be684086ca54f1599177ebd2fe2ffcc
    title:              Identity
    brief:              |
                        The pair of identifiers an item declares:
                        guid_self and id_self.
    description:        |
                        An identity is declared by the two fields
                        whose names end in self. Every other
                        identifier field refers to an identity
                        declared somewhere else.
    term:               identity
    alias:              []
    status:             proposed
    relation:           []

  term_guid:
    id_self:            term_guid
    guid_self:          term_5c5250503e5744a6b74fa13db46f2a80
    title:              Guid
    brief:              |
                        The opaque identifier of an item: its type
                        prefix and thirty two hexadecimal digits.
    description:        |
                        A guid is minted once and never changed. It is
                        what resolves a reference, and it is what
                        tells two items apart when their readable ids
                        collide.
    term:               guid
    alias:              []

    avoid:
      - uuid

    status:             proposed
    relation:           []

  term_readable_id:
    id_self:            term_readable_id
    guid_self:          term_e1e3898ecab2446bab3305f971b78bf7
    title:              Readable id
    brief:              |
                        The human readable identifier of an item,
                        carrying its type prefix.
    description:        |
                        A readable id is chosen by an author and not
                        minted. An advisory copy of the readable id
                        travels beside every guid, so that a reference
                        carries both identifiers.
    term:               readable id

    also:
      - id

    alias:              []
    status:             proposed
    relation:           []

  term_prefix:
    id_self:            term_prefix
    guid_self:          term_d1eecee9353f40a8b5d50ce9490f0171
    title:              Prefix
    brief:              |
                        The one to eight lowercase letters before the
                        first underscore of an identifier, naming its
                        type.
    description:        |
                        A prefix identifies exactly one type. It is
                        the single thing a federation must coordinate.
    term:               prefix
    alias:              []
    status:             proposed
    relation:           []

  term_type:
    id_self:            term_type
    guid_self:          term_0d0e04ed926841818a9ef3a06243a4fa
    title:              Type
    brief:              |
                        A kind of item, declared as an entry in the
                        type register and owning one prefix.
    description:        |
                        A type names the schema its items are
                        validated against. An item is never retyped.
    term:               type
    alias:              []

    avoid:
      - kind
      - class

    status:             proposed
    relation:           []

  term_register:
    id_self:            term_register
    guid_self:          term_374dca1dc078449f89c61caae71611e1
    title:              Register
    brief:              |
                        An item holding a keyed table of entries, and
                        the source of truth for a vocabulary.
    description:        |
                        Entries are keyed by readable id, so a key
                        appears once. A register may name a schema of
                        its own for its entries.
    term:               register
    alias:              []

    avoid:
      - registry
      - list
      - table

    status:             proposed
    relation:           []

  term_entry:
    id_self:            term_entry
    guid_self:          term_b51daaeae7054f529e34ae0a53b84efd
    title:              Entry
    brief:              |
                        A keyed, addressable member of a table held on
                        an item.
    description:        |
                        An entry carries an identity of its own.
                        Register entries are the first case; ports,
                        nodes and bindings are others.
    term:               entry
    alias:              []

    avoid:
      - row
      - record

    status:             proposed

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_register
        guid_target:    term_374dca1dc078449f89c61caae71611e1

  term_schema:
    id_self:            term_schema
    guid_self:          term_3ce8de2f2d6f422fb6b31309884e798d
    title:              Schema
    brief:              |
                        A JSON Schema, held as an item, against which
                        items of a type are validated.
    description:        |
                        A schema is itself an item with an identity,
                        and validates itself.
    term:               schema
    alias:              []
    status:             proposed
    relation:           []

  term_trait:
    id_self:            term_trait
    guid_self:          term_e896210c139149b8bbbf100f27f80e47
    title:              Trait
    brief:              |
                        A schema composed into others by allOf,
                        declaring one property every composer shares.
    description:        |
                        There are three traits: identity, the prose
                        envelope, and rights. A schema that composes a
                        trait requires the fields the trait requires,
                        and may require more.
    term:               trait
    alias:              []

    avoid:
      - mixin
      - base class

    status:             proposed
    relation:           []

  term_relation:
    id_self:            term_relation
    guid_self:          term_58ca7869cf9443168d8d96d8d70b972c
    title:              Relation
    brief:              |
                        A kind of directed edge between items,
                        declared as an entry in the relation register.
    description:        |
                        A relation is directional. Where an inverse is
                        wanted, the inverse is a separate relation.
                        The vocabulary of relations is open.
    term:               relation

    also:
      - relation type

    alias:              []
    status:             proposed
    relation:           []

  term_relation_edge:
    id_self:            term_relation_edge
    guid_self:          term_d862079f22e04991bc6d15cf53c98a2b
    title:              Relation edge
    brief:              |
                        One directed link from an item to another,
                        naming its relation and its target by guid and
                        by readable id.
    description:        |
                        A relation edge always has exactly four
                        fields. It is held in the item's relation
                        array. A relation edge is a different thing
                        from a dataflow edge, which wires ports inside
                        a workflow.
    term:               relation edge
    alias:              []
    status:             proposed
    relation:           []

  term_design_decision:
    id_self:            term_design_decision
    guid_self:          term_f05757bd13f84c77adfda058c67b0eb5
    title:              Design decision
    brief:              |
                        An item holding the reasoning behind one
                        design decision, so that the artifact need
                        not.
    description:        |
                        A design decision holds the context, the
                        decision, the rationale, the alternatives, the
                        consequences, and what is left open. It
                        decides items by r_decides edges. Its type
                        prefix is ddr, and the item is called a design
                        decision and not a design decision record.
    term:               design decision

    also:
      - DDR

    alias:              []

    avoid:
      - design decision record
      - decision record
      - ADR

    status:             proposed
    relation:           []

  term_eval:
    id_self:            term_eval
    guid_self:          term_e98ae195f05e4f678ad8e3995b56cbf0
    title:              Eval
    brief:              |
                        An item holding one criterion that a language
                        model judges an item against.
    description:        |
                        An eval is anchored to what it applies to,
                        scoped to what the judge is shown, and given
                        examples with feedback. A verdict is either
                        met or unmet.
    term:               eval
    alias:              []

    avoid:
      - evaluation
      - test

    status:             proposed
    relation:           []

  term_criterion:
    id_self:            term_criterion
    guid_self:          term_dbba9370f3254c66acbba6b34fb05d27
    title:              Criterion
    brief:              |
                        The question an eval puts to a judge, with
                        what met and unmet mean.
    description:        |
                        Atomic and binary: one thing, answered yes or
                        no. Written by a person and not optimised by a
                        machine.
    term:               criterion
    alias:              []

    avoid:
      - rubric
      - prompt

    status:             proposed
    relation:           []

  term_judge:
    id_self:            term_judge
    guid_self:          term_83c2dbba03c34b42925b178cd3deb922
    title:              Judge
    brief:              |
                        The language model that answers a criterion.
    description:        |
                        The judge is named at run time and never in an
                        eval. The judge should not be of the same
                        family as the model that wrote the item being
                        judged.
    term:               judge
    alias:              []

    avoid:
      - evaluator
      - grader

    status:             proposed
    relation:           []

  term_verdict:
    id_self:            term_verdict
    guid_self:          term_a9521c74cb544a35a79af1bf6a241f2d
    title:              Verdict
    brief:              |
                        What a judge returns: met, unmet, or unknown
                        where nothing judged.
    description:        |
                        Not an item. A verdict is consumed where it is
                        reached and never travels on a port.
    term:               verdict
    alias:              []

    avoid:
      - score
      - grade

    status:             proposed
    relation:           []

  term_anchor:
    id_self:            term_anchor
    guid_self:          term_a458046c786a4349a5b0327098fc7078
    title:              Anchor
    brief:              |
                        What an eval applies to: a type, a schema, a
                        relation, or a port.
    description:        |
                        An anchor is expressed by a relation edge. For
                        a type, a schema or a relation, the edge runs
                        from the eval. For a port, the edge runs from
                        the port. The anchor is different from the
                        scope, which says what the judge is shown.
    term:               anchor
    alias:              []

    avoid:
      - target

    status:             proposed
    relation:           []

  term_scope:
    id_self:            term_scope
    guid_self:          term_7a8c0dff42a7444bbeefdd460e5b736d
    title:              Scope
    brief:              |
                        Which parts of a subject a judge is shown, as
                        include and exclude lists of dot paths.
    description:        |
                        A judge shown more than the criterion asks
                        about answers less reliably. Distinct from
                        anchor, which says what the eval applies to.
    term:               scope
    alias:              []

    avoid:
      - filter
      - view

    status:             proposed
    relation:           []

  term_subject:
    id_self:            term_subject
    guid_self:          term_0b8ab0f21ba54ff687f73c5901a96e9a
    title:              Subject
    brief:              |
                        The text a judge is given: the scoped parts of
                        one item, or of two joined by a relation.
    description:        |
                        A subject is rendered as prose where the
                        fields are prose. An item with nothing in
                        scope is not judged.
    term:               subject
    alias:              []

    avoid:
      - input
      - sample

    status:             proposed
    relation:           []

  term_severity:
    id_self:            term_severity
    guid_self:          term_3699a451d7564bcba0fa4d4476a4e67a
    title:              Severity
    brief:              |
                        What a finding demands: critical must be
                        fixed, advisory must be known.
    description:        |
                        Names consequence, not cause and not
                        certainty. The confidence of the check that
                        raised a finding is a separate matter.
    term:               severity
    alias:              []

    avoid:
      - priority
      - level

    status:             proposed
    relation:           []

  term_finding:
    id_self:            term_finding
    guid_self:          term_7136f27377c54b0cacbaaf5c719de1f3
    title:              Finding
    brief:              |
                        A way in which an item fails a rule, reported
                        with a severity.
    description:        |
                        One of three outcomes a check produces. The
                        others are an error, where the analysis
                        failed, and a note.
    term:               finding

    also:
      - nonconformity

    alias:              []

    avoid:
      - error
      - bug
      - issue

    status:             proposed
    relation:           []

  term_note:
    id_self:            term_note
    guid_self:          term_3ba50c77ee464736bd3ae3a5884da036
    title:              Note
    brief:              |
                        Something a check reports that is not a fault:
                        coverage made visible.
    description:        |
                        A check that examined nothing must not be
                        mistaken for one that passed. A node with no
                        evals is reported this way.
    term:               note
    alias:              []

    avoid:
      - warning

    status:             proposed
    relation:           []

  term_check:
    id_self:            term_check
    guid_self:          term_661ab7ef95ea47b58357d7977ef96595
    title:              Check
    brief:              |
                        A mechanical rule run by cctool, deterministic
                        and exact.
    description:        |
                        A check is code and runs in the tool. An eval
                        is data and holds a criterion a model judges.
                        A check travels with the tool; an eval travels
                        with the vocabulary.
    term:               check
    alias:              []

    avoid:
      - lint
      - validator
      - test

    status:             proposed
    relation:           []

  term_protective_mark:
    id_self:            term_protective_mark
    guid_self:          term_547c4fe6a53547e98ed177520f3f6968
    title:              Protective mark
    brief:              |
                        An entry in the mark register that says how an
                        item may be handled and with whom it may be
                        shared.
    description:        |
                        An item names one or more marks by reference.
                        Several are conjunctive: the most restrictive
                        governs.
    term:               protective mark

    also:
      - mark

    alias:              []

    avoid:
      - classification
      - label

    status:             proposed
    relation:           []

  term_layout:
    id_self:            term_layout
    guid_self:          term_28dc3f2bf2d044b5835982efbebaec86
    title:              Layout
    brief:              |
                        The convention every YAML document and
                        docstring metadata block is written to.
    description:        |
                        The layout convention puts values at column 24
                        and fills prose to seventy columns. A check
                        enforces the convention, and the format
                        command produces it.
    term:               layout
    alias:              []

    avoid:
      - format
      - style

    status:             proposed
    relation:           []

  term_component:
    id_self:            term_component
    guid_self:          term_ef2b95714f5045a4950f10109ceba743
    title:              Component
    brief:              |
                        Anything with ports. The family of which every
                        form of workflow is a member, and the only
                        thing a node ever names.
    description:        |
                        An atomic component names a prompt or code. A
                        composite component is a graph of components.
                        The word is the composite pattern's own, and
                        stableflow's.
    term:               component
    alias:              []

    avoid:
      - work
      - functionality
      - block

    status:             proposed
    relation:           []

  term_atomic_component:
    id_self:            term_atomic_component
    guid_self:          term_684e8b3a067a44b29a1de322f2353c42
    title:              Atomic component
    brief:              |
                        A component that declares its ports and names
                        a prompt on each output, or code that
                        implements it.
    description:        |
                        The atomic component is the base form of a
                        component. An eval is anchored either to one
                        of the component's ports, or to the component
                        itself when the eval reads an input and an
                        output together.
    term:               atomic component
    alias:              []

    avoid:
      - leaf
      - task
      - step

    status:             proposed

    relation:

      - id_relation:    r_is_narrower_than
        guid_relation:  r_3963b47d6a7149cca3271a23b3612441
        id_target:      term_component
        guid_target:    term_ef2b95714f5045a4950f10109ceba743

  term_composite_component:
    id_self:            term_composite_component
    guid_self:          term_5b96a8d782474dcf89864be2e0ee25dc
    title:              Composite component
    brief:              |
                        A component whose ports are derived from the
                        components within it.
    description:        |
                        Every form of workflow is one. Its ports are
                        the unbound ports of its nodes.
    term:               composite component
    alias:              []

    avoid:
      - subgraph
      - group

    status:             proposed

    relation:

      - id_relation:    r_is_narrower_than
        guid_relation:  r_3963b47d6a7149cca3271a23b3612441
        id_target:      term_component
        guid_target:    term_ef2b95714f5045a4950f10109ceba743

  term_port:
    id_self:            term_port
    guid_self:          term_74e84886ebe44148a73cf6328af05ee8
    title:              Port
    brief:              |
                        One place on a component where exactly one
                        item is consumed or produced.
    description:        |
                        An entry with identity, keyed by a short local
                        name, naming the type it carries. An input may
                        be optional.
    term:               port
    alias:              []

    avoid:
      - pin
      - socket
      - channel

    status:             proposed

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_component
        guid_target:    term_ef2b95714f5045a4950f10109ceba743

  term_node:
    id_self:            term_node
    guid_self:          term_e469c67fe5d44ecc846f4614ef92e673
    title:              Node
    brief:              |
                        One instance of a component within one
                        workflow.
    description:        |
                        Names the component by an r_instantiates edge
                        and carries configuration for this instance.
                        Edge paths begin with the node's local name.
    term:               node
    alias:              []

    avoid:
      - step
      - stage
      - task

    status:             proposed

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_workflow
        guid_target:    term_7e24b23fa3cf46989c3d11325c664319

  term_dataflow_edge:
    id_self:            term_dataflow_edge
    guid_self:          term_f56457546bf04a0fbc1bfcb71dd49ffd
    title:              Dataflow edge
    brief:              |
                        Wiring from one output port to one input port
                        within a dataflow workflow.
    description:        |
                        A dataflow edge is named by a short local key,
                        in the same way as a port or a node, and it
                        carries its two endpoints as fields. It has no
                        identity of its own: the edge is its
                        endpoints, whatever it is called. A dataflow
                        edge is a different thing from a relation
                        edge.
    term:               dataflow edge
    alias:              []

    avoid:
      - link
      - connection
      - wire

    status:             proposed
    relation:           []

  term_back_edge:
    id_self:            term_back_edge
    guid_self:          term_c2316f5a6d2f413ab18322c6fe11f85e
    title:              Back edge
    brief:              |
                        A dataflow edge whose destination precedes its
                        source, declared as such.
    description:        |
                        A back edge is set aside when the graph is put
                        in order. Ordinarily a back edge feeds an
                        optional input and is guarded on an unmet
                        verdict. This is how a cycle revises its own
                        output.
    term:               back edge
    alias:              []

    avoid:
      - feedback
      - loop

    status:             proposed
    relation:           []

  term_guard:
    id_self:            term_guard
    guid_self:          term_0d9da624d6df41f88a00e0dfd1eaa8af
    title:              Guard
    brief:              |
                        A verdict named on a destination, without
                        which the edge fires always.
    description:        |
                        A guard consults the evals anchored to the
                        source port. The guard is met when all of
                        those evals are met, and unmet when any of
                        them is unmet. The verdict is consumed at the
                        guard and never travels further.
    term:               guard
    alias:              []

    avoid:
      - condition
      - gate

    status:             proposed
    relation:           []

  term_workflow:
    id_self:            term_workflow
    guid_self:          term_7e24b23fa3cf46989c3d11325c664319
    title:              Workflow
    brief:              |
                        A composite component of some declared form.
    description:        |
                        A workflow is a family of types and not one
                        type. The dataflow workflow is the first form.
                        A workflow item is meaningful to a reader who
                        cannot execute it.
    term:               workflow
    alias:              []

    avoid:
      - pipeline
      - process

    status:             proposed
    relation:           []

  term_execution:
    id_self:            term_execution
    guid_self:          term_36b127f301794d37866e735218e0ab38
    title:              Execution
    brief:              |
                        An item recording one run of a workflow under
                        one deployment, as a table of bindings.
    description:        |
                        An execution is written once and never edited.
                        Where an item came from is read from the
                        execution.
    term:               execution
    alias:              []

    avoid:
      - run
      - job
      - instance

    status:             proposed
    relation:           []

  term_binding:
    id_self:            term_binding
    guid_self:          term_1b2812b241404a77a3f516087081c0ff
    title:              Binding
    brief:              |
                        An entry on an execution naming the node and
                        port that were filled, the pass, and by an
                        edge the item that filled them.
    description:        |
                        A binding is a reified reference. A relation
                        edge has four fields, and a binding needs more
                        than four, so a binding is an item of its own
                        that carries an edge.
    term:               binding
    alias:              []

    avoid:
      - assignment
      - mapping

    status:             proposed
    relation:           []

  term_deployment:
    id_self:            term_deployment
    guid_self:          term_d0991e776f3942e3b4566ca907296d8b
    title:              Deployment
    brief:              |
                        An item naming a workflow and the machinery it
                        is run under: the model, the budget, and
                        whatever else the definition must not say.
    description:        |
                        An execution runs under exactly one
                        deployment. A workflow definition names no
                        machinery of its own.
    term:               deployment
    alias:              []

    avoid:
      - config
      - environment
      - profile

    status:             proposed
    relation:           []

  term_transform:
    id_self:            term_transform
    guid_self:          term_079c0cd3faad42be81006fbe1fda9fee
    title:              Transform
    brief:              |
                        A component whose ports carry workflows.
    description:        |
                        A derived workflow is materialised as an item,
                        and the execution that derived it is its
                        provenance.
    term:               transform
    alias:              []

    avoid:
      - generator
      - template

    status:             proposed
    relation:           []

  term_provenance:
    id_self:            term_provenance
    guid_self:          term_6b717deb08ec44fa8620407e8218c6ee
    title:              Provenance
    brief:              |
                        Where an item came from: which node, port,
                        pass and deployment produced it, from what.
    description:        |
                        Provenance is a walk over bindings and
                        relation edges, and it needs no engine.
                        Provenance cannot yet say whether an input has
                        changed since the item was produced.
    term:               provenance
    alias:              []

    avoid:
      - lineage
      - history

    status:             proposed
    relation:           []

  term_printer:
    id_self:            term_printer
    guid_self:          term_8fe15da65be94a1aa940559eefdb99e0
    title:              Printer
    brief:              |
                        The tool that parses a document and writes it
                        again to the layout convention.
    description:        |
                        The printer is run by the format command, and
                        by every edit command on every write. The
                        layout check asks whether a file matches its
                        own printing.
    term:               printer

    avoid:
      - formatter
      - pretty printer

    status:             proposed
    relation:           []

  term_pass:
    id_self:            term_pass
    guid_self:          term_de5f9c7873bf4b05825285dd5f6697af
    title:              Pass
    brief:              |
                        One traversal of a cycle in a dataflow
                        workflow.
    description:        |
                        A port on a cycle is bound once per pass, and
                        an execution records each. A deployment's
                        budget is the most passes a cycle may take.
    term:               pass

    avoid:
      - iteration
      - round

    status:             proposed
    relation:           []

  term_budget:
    id_self:            term_budget
    guid_self:          term_f5b6dfd189684fa5a312f0da39dc45e4
    title:              Budget
    brief:              |
                        The most passes a cycle may take before it
                        stops, held on the deployment.
    description:        |
                        The budget bounds a cycle that a false unmet
                        verdict would otherwise spin forever. Nothing
                        bounds a cycle spun by a false met verdict.
    term:               budget

    avoid:
      - limit
      - timeout

    status:             proposed
    relation:           []

  term_control_set:
    id_self:            term_control_set
    guid_self:          term_c7943c02fb304bec967413e44a2acd64
    title:              Control set
    brief:              |
                        Cases with known verdicts against which an
                        eval is measured.
    description:        |
                        A control set is what turns an eval's
                        reliability from an assertion into a number.
                        Discrimination and stability are measured over
                        the control set.
    term:               control set

    avoid:
      - test set
      - gold set

    status:             proposed
    relation:           []

  term_block_scalar:
    id_self:            term_block_scalar
    guid_self:          term_8dfe91a692904935bea065ec2eed34c4
    title:              Block scalar
    brief:              |
                        A YAML string written beneath its key after a
                        vertical bar, one line per line.
    description:        |
                        A block scalar is how prose is written in this
                        repository. The printer refills block scalars
                        and nothing else, because a block scalar is
                        what the author marked as prose.
    term:               block scalar

    avoid:
      - multiline string
      - text block

    status:             proposed
    relation:           []

  term_plain_scalar:
    id_self:            term_plain_scalar
    guid_self:          term_54344a7f7f064def9974fdf4f2794cf4
    title:              Plain scalar
    brief:              |
                        A YAML value written on the line with its key.
    description:        |
                        A datum. The printer never breaks one, however
                        long: a regex or a URI with spaces in it is
                        still one value.
    term:               plain scalar
    status:             proposed
    relation:           []

  term_dot_path:
    id_self:            term_dot_path
    guid_self:          term_301aab2391f74f479d7d14437e87c526
    title:              Dot path
    brief:              |
                        A location inside a document, as steps joined
                        by full stops: table.t_eval.brief,
                        relation.0.guid_target.
    description:        |
                        A dot path is one notation for naming a place
                        in a document. With glob wildcards it also
                        matches many places. The scope of an eval, the
                        set command and the insert command all use dot
                        paths.
    term:               dot path

    also:
      - path

    avoid:
      - xpath
      - pointer

    status:             proposed
    relation:           []

  term_source_item:
    id_self:            term_source_item
    guid_self:          term_0b31b23df3724eae89485ea807b93111
    title:              Source item
    brief:              |
                        An item that lives in the docstring of a
                        python package, module, class or function.
    description:        |
                        A source item is found by walking the syntax
                        tree. A package and a module always carry one.
                        A class and a function carry one where
                        something needs to name them. Each source item
                        is an item of its own, at a location that
                        names the file and the definition.
    term:               source item

    avoid:
      - code item

    status:             proposed
    relation:           []

  term_term:
    id_self:            term_term
    guid_self:          term_820f9604e6134b9fbefd5a75146d4c40
    title:              Term
    brief:              |
                        A word the repository uses for one of its
                        concepts, held as an entry in a term register.
    description:        |
                        Carries the surface form, the forms it is also
                        known by, and any forms not to be used for it.
                        A concept need not have a type to have a term.
    term:               term

    avoid:
      - keyword
      - tag

    status:             proposed
    relation:           []

  term_also:
    id_self:            term_also
    guid_self:          term_7369ae52624a45d28e0343be1186e0c3
    title:              Also
    brief:              |
                        On a term, the forms the word is also known
                        by.
    description:        |
                        The also field on a term entry lists the other
                        forms the word is known by. It is different
                        from the alias field, which on a register
                        entry is an alternative identifier and not a
                        word.
    term:               also

    avoid:
      - synonym
      - alias

    status:             proposed
    relation:           []

  term_avoid:
    id_self:            term_avoid
    guid_self:          term_84020a0b7de3478c9fbaa1c51c11cab3
    title:              Avoid
    brief:              |
                        On a term, the forms not to be used for the
                        concept.
    description:        |
                        The forms listed in the avoid field are not
                        always wrong words. The word work, for
                        example, is an ordinary word. Judging prose
                        against the avoid list is therefore a job for
                        an eval and not for a check.
    term:               avoid

    avoid:
      - deprecated
      - forbidden

    status:             proposed
    relation:           []

  term_control_case:
    id_self:            term_control_case
    guid_self:          term_55af5cf2c12d4a94883248fcc0bcd223
    title:              Control case
    brief:              |
                        One subject with a known verdict, held on a
                        control set.
    description:        |
                        The subject exactly as the judge would be
                        shown it, the verdict a person holds it to,
                        why, and an origin. Never shown to the judge,
                        which is what keeps it apart from an example.
    term:               control case

    avoid:
      - test case
      - example

    status:             proposed

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_control_set
        guid_target:    term_c7943c02fb304bec967413e44a2acd64

  term_origin:
    id_self:            term_origin
    guid_self:          term_251feddc5419443caf48c0c25cc7211e
    title:              Origin
    brief:              |
                        Where a control case came from: written,
                        mutated, suppressed or confirmed.
    description:        |
                        Cases from different origins answer different
                        questions and are measured apart. A suppressed
                        case is one the judge got wrong by
                        construction; a mutated one is unmet by
                        construction.
    term:               origin

    avoid:
      - source
      - provenance

    status:             proposed
    relation:           []

  term_suppression:
    id_self:            term_suppression
    guid_self:          term_04e079c2d00b437eb8aedfc1af457dbe
    title:              Suppression
    brief:              |
                        A person's judgement that a finding is wrong,
                        held as a control case with a verdict of met.
    description:        |
                        Matched by the words of what was judged, so it
                        answers the finding whenever the same text
                        recurs and silences nothing else. Reported as
                        a note naming the case.
    term:               suppression

    also:
      - suppressed case

    avoid:
      - noqa
      - ignore
      - whitelist
      - exception

    status:             proposed
    relation:           []

  term_confidence:
    id_self:            term_confidence
    guid_self:          term_0ec3e5327c1745349538ddd6b2d49609
    title:              Confidence
    brief:              |
                        What has been measured about an eval, recorded
                        on it: the two error rates and the unanimity,
                        per origin, for a judge model.
    description:        |
                        Confidence is the partner that severity
                        lacked. What to do about a finding depends on
                        its severity together with the confidence of
                        the eval that raised it.
    term:               confidence

    avoid:
      - accuracy
      - score

    status:             proposed
    relation:           []

  term_snapshot:
    id_self:            term_snapshot
    guid_self:          term_ba691d18014d4b5f9bf1562744af6c40
    title:              Snapshot
    brief:              |
                        The text an item rendered to when a control
                        case was taken from it.
    description:        |
                        A snapshot is held on the control case as its
                        subject. Where the item later renders to the
                        same words, the case applies. Where it renders
                        to different words, the case does not apply.
    term:               snapshot

    avoid:
      - copy
      - cache

    status:             proposed
    relation:           []

  term_question:
    id_self:            term_question
    guid_self:          term_d558794250a74c32a77bd29ae9ef1059
    title:              Question
    brief:              |
                        One thing a design decision does not settle,
                        held on the record as an entry with an
                        identity.
    description:        |
                        A question is answered by an r_answers edge
                        from whatever settles it, and never by editing
                        the question's text. A question with no such
                        edge is open. The questions command lists
                        them.
    term:               question

    avoid:
      - todo
      - issue
      - open point

    status:             proposed
    relation:           []

  term_commit_record:
    id_self:            term_commit_record
    guid_self:          term_9821bcb3e39c4731bcbc0ece24cf5235
    title:              Commit record
    brief:              |
                        The data item held in a commit message,
                        describing that commit.
    description:        |
                        A commit record has a plain first line, and
                        then the record between the docstring markers.
                        The record says what the commit was for, the
                        state of the checks, and what the commit
                        relates to on purpose. The record does not say
                        what the commit changed, because the diff says
                        that. The commit command makes the record, the
                        log command reads it, and it is never a file
                        in the tree.
    term:               commit record

    avoid:
      - changelog entry
      - commit message

    status:             proposed
    relation:           []

  term_writing_style_rule:
    id_self:            term_writing_style_rule
    guid_self:          term_4c23b1dfc6974fadb122852cdbe5093c
    title:              Writing style rule
    brief:              |
                        One rule that prose in the repository follows,
                        stated in a sentence with its reasoning and an
                        example each way.
    description:        |
                        An entry in a writing style rule register. A
                        prompt binds the register; an eval cites the
                        rule.
    term:               writing style rule
    alias:              []

    also:
      - style rule

    status:             proposed
    relation:           []

  term_writing_style_guide:
    id_self:            term_writing_style_guide
    guid_self:          term_c33d44c0c98d49c58ae4a3dab80bc7e1
    title:              Writing style guide
    brief:              |
                        A register of writing style rules. The
                        cc-public guide is reg_writing_style_rule.
    description:        |
                        The writing style guide is the one source that
                        both a writing prompt and a prose eval draw
                        on. House style is the publishing word for the
                        same thing.
    term:               writing style guide
    alias:              []

    also:
      - style guide
      - house style

    status:             proposed
    relation:           []

  term_judgement:
    id_self:            term_judgement
    guid_self:          term_34135277ccf24e4fabb2f7a5114c2064
    title:              Judgement
    brief:              |
                        What judging a port produces: for each eval
                        anchored there, the verdict and the judge's
                        reasons.
    description:        |
                        A judgement is held on the binding of the port
                        at that pass, so that a judgement is a fact
                        about one item on one port on one pass. The
                        verdict is one word of the judgement, and the
                        reasons are the remainder.
    term:               judgement
    alias:              []

    also:
      - judgment

    status:             proposed

    avoid:
      - feedback
      - critique
      - review comments

    relation:           []

  term_requirement:
    id_self:            term_requirement
    guid_self:          term_eb9fe7b16976457d975b6fd1dbefb6c8
    title:              Requirement
    brief:              |
                        A textual requirement: one shall statement on
                        one entity, with the attributes that make it
                        an expression.
    description:        |
                        A requirement is what an entity must do or be
                        in order to realise a need. It is held as a
                        textual requirement item in the requirement
                        directory.
    term:               requirement
    alias:              []
    status:             proposed

    also:
      - textual requirement
      - requirement expression

    avoid:
      - spec
      - req

    relation:           []

  term_requirement_statement:
    id_self:            term_requirement_statement
    guid_self:          term_6f839b747e3b4885b9ddca983ebae428
    title:              Requirement statement
    brief:              |
                        The sentence itself: the entity as subject,
                        shall, the action, its object, any condition
                        and performance.
    description:        |
                        The requirement statement is the statement
                        field of a requirement. The expression is the
                        statement together with its attributes.
    term:               requirement statement
    alias:              []
    status:             proposed

    avoid:
      - shall statement

    relation:           []

  term_requirement_rule:
    id_self:            term_requirement_rule
    guid_self:          term_f2a5edb807e94c95a17cb41818987866
    title:              Requirement rule
    brief:              |
                        One rule for writing a requirement statement,
                        from the INCOSE guide, numbered as there.
    description:        |
                        An entry in the requirement rule register.
                        Evals implement rules; rules contribute to
                        characteristics.
    term:               requirement rule
    alias:              []
    status:             proposed

    also:
      - INCOSE rule

    relation:           []

  term_requirement_characteristic:
    id_self:            term_requirement_characteristic
    guid_self:          term_2971c81557f54d9dba4830f79b5583cc
    title:              Requirement characteristic
    brief:              |
                        One quality a well formed requirement
                        statement or set has, from the INCOSE guide.
    description:        |
                        A requirement characteristic is an entry in
                        the requirement characteristic register. Nine
                        characteristics apply to a statement and six
                        apply to a set. A rule contributes to a
                        characteristic, and an eval measures toward
                        one.
    term:               requirement characteristic
    alias:              []
    status:             proposed

    also:
      - characteristic

    avoid:
      - quality attribute

    relation:           []

  term_need:
    id_self:            term_need
    guid_self:          term_0e437e13ce67461a86a5fcccf107ce8f
    title:              Need
    brief:              |
                        What a subject needs: an outcome, for a
                        purpose, in a context, on evidence. Names no
                        entity and no solution.
    description:        |
                        A need is a need data item, held in the need
                        directory. Its statement is composed from its
                        slots. A requirement derives from a need by an
                        r_is_derived_from edge. The need names no
                        entity, and the requirement supplies the
                        entity.
    term:               need
    alias:              []
    status:             proposed

    also:
      - stakeholder need

    avoid:
      - user requirement

    relation:           []

  term_framing:
    id_self:            term_framing
    guid_self:          term_cbdb5c8991d04c0fb84ceac521cac9ad
    title:              Framing
    brief:              |
                        A way of looking at a need that decides how it
                        is analysed and broken into smaller problems.
    description:        |
                        A framing is an entry of reg_framing. The
                        entry says what the framing treats as the
                        problem, what it makes salient, and what
                        responses it admits. One need decomposed under
                        two framings gives two decision items to
                        compare.
    term:               framing
    alias:              []

    also:
      - problem framing

    status:             proposed

    avoid:
      - perspective
      - lens

    relation:           []

  term_assumption:
    id_self:            term_assumption
    guid_self:          term_7c0412f1bc0b44bcb1186f7deb01a49d
    title:              Assumption
    brief:              |
                        A claim about the world a design decision
                        relies on, with its evidence.
    description:        |
                        An entry under assumption on a design
                        decision. Checked as evidence; a claim of
                        design among the assumptions is a
                        misclassification.
    term:               assumption
    alias:              []
    status:             proposed

    also:
      - domain assumption
      - domain property

    avoid:
      - premise
      - given

    relation:           []

  term_challenge:
    id_self:            term_challenge
    guid_self:          term_a79c6abfc47f49829bc156c854a83703
    title:              Challenge
    brief:              |
                        The strongest case against a design decision,
                        constructed from a stance independent of the
                        one that proposed it.
    description:        |
                        A field on a design decision, written by a
                        challenging node on a second model or by a
                        person. Answered by a resolution. Together
                        they are the defense of a design claim.
    term:               challenge
    alias:              []
    status:             proposed

    also:
      - counter-case

    avoid:
      - critique
      - review
      - feedback

    relation:           []

  term_methodology:
    id_self:            term_methodology
    guid_self:          term_4fa9f7162b4e4ef18d3b58bc445d9118
    title:              Methodology
    brief:              |
                        An established way of analysing needs or
                        writing requirements, named so that a
                        component can say it follows one.
    description:        |
                        A methodology is an entry of reg_methodology.
                        A component names the methodology it follows.
    term:               methodology
    alias:              []
    status:             proposed

    also:
      - method

    avoid:
      - approach
      - framework

    relation:           []

  term_location:
    id_self:            term_location
    guid_self:          term_c9fcb5a05e3e4781b19a09931769ad80
    title:              Location
    brief:              |
                        Where a document sits: a file, and beneath it
                        the run of definition names down to a
                        docstring.
    description:        |
                        A location is written the way pytest writes a
                        test's place: the file, then each definition
                        name after two colons, as in
                        run.py::State::generator_for. The document of
                        the file itself has no names after the file.
                        Findings, tasks and cases name locations.
    term:               location

    also:
      - anchor

    relation:           []

  term_tier:
    id_self:            term_tier
    guid_self:          term_8c1ff39f610a42fe8bceff58629e6b30
    title:              Tier
    brief:              |
                        One of the seven layers of the tool, each
                        importing only from the tiers below it.
    description:        |
                        There are seven tiers. From the bottom up they
                        are the foundations, the layout, the checks,
                        the edits, then one tier holding the
                        committer, the judgement package and the
                        evidence side by side, then the workflow, and
                        then the command line. A layers contract,
                        enforced by the lint, holds the tiers apart.
                        See ddr_layered_architecture.
    term:               tier

    also:
      - layer

    relation:           []

  term_evidence:
    id_self:            term_evidence
    guid_self:          term_283a168e6be842b38c23a1d44def37ea
    title:              Evidence
    brief:              |
                        What an observer found about a requirement: an
                        outcome, stamped with a digest of what it was
                        observed against.
    description:        |
                        Evidence is observed and not authored, and the
                        next observation rewrites it. A row of
                        evidence names the requirement, the case where
                        the method has one, the outcome and the
                        digest. Evidence is different from a
                        verification declaration. The declaration says
                        what is meant to verify a requirement, and the
                        evidence says what did. See
                        ddr_verification_evidence.
    term:               evidence

    also:
      - verification evidence

    avoid:
      - test result
      - proof

    relation:           []

  term_attestation:
    id_self:            term_attestation
    guid_self:          term_481203aceda849d3a32434c6ac903eb7
    title:              Attestation
    brief:              |
                        Evidence a person or a tool gives for a
                        requirement verified by inspection,
                        demonstration or analysis.
    description:        |
                        An attestation is recorded by the attest
                        command. It names the observer and the
                        outcome, and it is stamped in the same way as
                        every other piece of evidence. A requirement
                        verified by test is not attested, because its
                        test observes it.
    term:               attestation

    avoid:
      - sign-off
      - approval

    relation:           []

  term_observer:
    id_self:            term_observer
    guid_self:          term_9f4e7595d668483fbf56a83f41c0a7eb
    title:              Observer
    brief:              |
                        What produced a piece of evidence: a tool and
                        its version, or the person attesting.
    description:        |
                        An observer is named on every evidence item,
                        and on a row where the row's observer differs
                        from the item's. pytest 9.1.1 is an observer,
                        and so is the agent that inspected the log.
    term:               observer

    avoid:
      - runner
      - tester

    relation:           []

  term_implementation:
    id_self:            term_implementation
    guid_self:          term_36b13c69ec354c47b0a6d54fbd8bb05a
    title:              Implementation
    brief:              |
                        The source item responsible for a requirement
                        or a component, named by an
                        r_is_implemented_by edge.
    description:        |
                        An implementation places responsibility, and
                        it shows nothing about whether the requirement
                        is met. The implementation is the narrowest
                        stable item that carries the behaviour: a
                        module where the behaviour is spread over
                        helpers, and a function where one function
                        carries it. See ddr_implementation_trace.
    term:               implementation

    avoid:
      - realisation

    relation:           []

  term_trace_projection:
    id_self:            term_trace_projection
    guid_self:          term_ef81afa1b6df4ab69800cb003a169637
    title:              Trace projection
    brief:              |
                        What one requirement derives from, what
                        derives from it, what implements it, what
                        verifies it, and what it lacks, computed from
                        the tree.
    description:        |
                        One module in the foundations computes the
                        trace projection, and the trace check and the
                        trace command both read it. The impact of a
                        change to one item is the same projection
                        asked in the other direction.
    term:               trace projection

    also:
      - trace

    relation:           []

  term_fact_table:
    id_self:            term_fact_table
    guid_self:          term_3343229bff67464d99e827e4c90bc36e
    title:              Fact table
    brief:              |
                        The three tables the tree states: every
                        identity, every relation edge, every
                        containment.
    description:        |
                        The fact table is derived from the documents
                        on every use, by the facts module, and loaded
                        into a database that lives for one command. An
                        item fact carries the type prefix, the status
                        and the location of an item. An edge fact
                        carries the source, the relation and the
                        target of an edge. A containment fact carries
                        the holder and the held item.
    term:               fact table

    also:
      - facts

    relation:           []

  term_neighbourhood:
    id_self:            term_neighbourhood
    guid_self:          term_9ea23abc28f14b4eb0e48034b4dc7109
    title:              Neighbourhood
    brief:              |
                        Every item within some depth of relation edges
                        of one item, in either direction, with the
                        edge that reaches each.
    description:        |
                        The neighbourhood is what the walk command
                        reports and what a drawing draws. Depth one is
                        what the show command gives. Further depths
                        show where a change reaches.
    term:               neighbourhood
    relation:           []

  term_query:
    id_self:            term_query
    guid_self:          term_1365de6bc47f45e693ec7022251df2f0
    title:              Query
    brief:              |
                        A question put to the fact table in SQL, kept
                        as an item with what a row of its result
                        means.
    description:        |
                        A query is run by the query command, which
                        loads the facts and reports the rows. A
                        question asked twice is kept as a qry_ item in
                        the query directory.
    term:               query

    also:
      - named query

    relation:           []

  term_performer:
    id_self:            term_performer
    guid_self:          term_461ec7ef7f95432d9c29a6213b14e2e5
    title:              Performer
    brief:              |
                        Who does the work of a node: a function, a
                        model or an agent.
    description:        |
                        Performer is the standard word, from workflow
                        and human task standards, for the party that
                        carries out a task. Here a component declares
                        one of three performers. A function is called
                        in process. A model is asked a prompt. An
                        agent, which may be a person or a coding tool,
                        works in a session of its own while the run
                        waits.
    alias:              []

    avoid:
      - executor
      - actor
      - worker

    term:               performer
    relation:           []

  term_python_package:
    id_self:            term_python_package
    guid_self:          term_957d65850c47476f8382b08e78fe05b0
    title:              Python package
    brief:              |
                        A directory of python modules, documented by
                        an item in the docstring of its __init__.py.
    description:        |
                        One kind of source item. Its readable id is
                        the dotted import path of the package.
    term:               python package

    relation:

      - id_relation:    r_is_narrower_than
        guid_relation:  r_3963b47d6a7149cca3271a23b3612441
        id_target:      term_source_item
        guid_target:    term_0b31b23df3724eae89485ea807b93111

  term_python_module:
    id_self:            term_python_module
    guid_self:          term_899d419b66244448b3f3ae39632e9c65
    title:              Python module
    brief:              |
                        A python file, documented by an item in its
                        module docstring.
    description:        |
                        One kind of source item. Its readable id is
                        the dotted import path of the module.
    term:               python module

    relation:

      - id_relation:    r_is_narrower_than
        guid_relation:  r_3963b47d6a7149cca3271a23b3612441
        id_target:      term_source_item
        guid_target:    term_0b31b23df3724eae89485ea807b93111

  term_python_class:
    id_self:            term_python_class
    guid_self:          term_870016fb75cc4b309b2bc3685ca775a1
    title:              Python class
    brief:              |
                        A class definition, documented by an item in
                        its docstring.
    description:        |
                        One kind of source item. Its readable id is
                        the module id followed by the class name in
                        lower case.
    term:               python class

    relation:

      - id_relation:    r_is_narrower_than
        guid_relation:  r_3963b47d6a7149cca3271a23b3612441
        id_target:      term_source_item
        guid_target:    term_0b31b23df3724eae89485ea807b93111

  term_python_function:
    id_self:            term_python_function
    guid_self:          term_005be146b2f2498c9c1c29af7e14471b
    title:              Python function
    brief:              |
                        A function or a method definition, documented
                        by an item in its docstring.
    description:        |
                        One kind of source item. Its readable id is
                        the module id followed by the definition names
                        in lower case.
    term:               python function

    relation:

      - id_relation:    r_is_narrower_than
        guid_relation:  r_3963b47d6a7149cca3271a23b3612441
        id_target:      term_source_item
        guid_target:    term_0b31b23df3724eae89485ea807b93111

  term_observation:
    id_self:            term_observation
    guid_self:          term_e1ebd54e1d7f4df4a12416524e9044be
    title:              Observation
    brief:              |
                        A capture of a public source, held as an item
                        with its content, locator, attribution, times
                        and digest.
    description:        |
                        Content as captured, canonicalised to words
                        and paragraphs. The same capture is reused and
                        a changed one is a new item. A need derives
                        from an observation. The content is data, and
                        never an instruction.
    term:               observation

    avoid:
      - source
      - citation
      - scrape

    relation:           []

  term_solution_concept:
    id_self:            term_solution_concept
    guid_self:          term_21724b912e974b47a230c02099bd4cd3
    title:              Concept
    brief:              |
                        A candidate solution to a need under a
                        framing, with its assumptions, risks and
                        candidate requirements.
    description:        |
                        A solution concept is an item of t_concept,
                        held in the concept directory. One need under
                        one framing yields one concept. A decision
                        selects, waives or rejects a concept, and
                        promotion makes a proposed requirement from
                        each of its candidates. The unit of meaning
                        that a term entry identifies is a different
                        concept, held as term_ontology_concept.
    term:               concept

    also:
      - solution concept

    avoid:
      - idea
      - option
      - proposal

    relation:           []

  term_ontology_concept:
    id_self:            term_ontology_concept
    guid_self:          term_92b926acd1da4360bbd315ee8fc9a742
    title:              Concept
    brief:              |
                        A unit of meaning, identified by one term
                        entry.
    description:        |
                        The guid of the entry is the identity used to
                        ground the concept within and across
                        repositories. Several accepted words for one
                        concept stay on one entry. Two concepts named
                        by the same word are two entries.

                        A candidate solution to a need is a different
                        concept, held as term_solution_concept.
    term:               concept

    also:
      - sense

    avoid:
      - term
      - word
      - definition

    relation:           []

  term_candidate_requirement:
    id_self:            term_candidate_requirement
    guid_self:          term_abb127cde9224d73b3ba238324e70047
    title:              Candidate requirement
    brief:              |
                        A requirement in a concept, written in slots,
                        before promotion makes an item of it.
    description:        |
                        A candidate requirement is an entry embedded
                        in a concept. The schema allows ten to thirty
                        candidates in one concept. Promotion makes a
                        proposed requirement item from each candidate,
                        and that item derives from the concept and
                        from its need.
    term:               candidate requirement

    avoid:
      - draft requirement
      - proto-requirement

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_solution_concept
        guid_target:    term_21724b912e974b47a230c02099bd4cd3

  term_assessment:
    id_self:            term_assessment
    guid_self:          term_445c548660bd45c1bbbdef2a9e83afe1
    title:              Assessment
    brief:              |
                        A judgement of a concept's feasibility, held
                        as an item that assesses it.
    description:        |
                        An item of t_assessment in assessment/,
                        holding a dimension for each aspect judged and
                        each off-the-shelf product considered. A model
                        makes one without references, or an agent
                        makes one citing observations.
    term:               assessment

    avoid:
      - evaluation
      - appraisal
      - review

    relation:           []

  term_assessment_dimension:
    id_self:            term_assessment_dimension
    guid_self:          term_98ae34a967a34679b65e76dc935d595b
    title:              Assessment dimension
    brief:              |
                        One aspect of a concept an assessment judges,
                        with the finding it reached.
    description:        |
                        An assessment dimension is an entry embedded
                        in an assessment. There is one entry for each
                        aspect the assessment judges.
    term:               dimension

    also:
      - assessment dimension

    avoid:
      - axis
      - factor
      - criterion

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_assessment
        guid_target:    term_445c548660bd45c1bbbdef2a9e83afe1

  term_product:
    id_self:            term_product
    guid_self:          term_67e963f60c9641618950a77bb715caa7
    title:              Off-the-shelf product
    brief:              |
                        An existing product an assessment weighs as a
                        way of meeting the need.
    description:        |
                        A product is an entry embedded in an
                        assessment.
    term:               product

    also:
      - off-the-shelf product

    avoid:
      - tool
      - solution
      - package

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_assessment
        guid_target:    term_445c548660bd45c1bbbdef2a9e83afe1

  term_segment:
    id_self:            term_segment
    guid_self:          term_14fdc790c68648719825199774e3ba1d
    title:              Segment
    brief:              |
                        A repository's declaration of itself: the
                        directory it governs, and the segments its
                        items may refer into.
    description:        |
                        One item of t_segment in segment/. A reference
                        may run within its segment or into one the
                        segment consumes, never the other way. This
                        repository is seg_cc_public, the core, which
                        consumes nothing.
    term:               segment

    avoid:
      - project
      - workspace
      - partition

    relation:           []

  term_document:
    id_self:            term_document
    guid_self:          term_0e8117dd34c24e21ae2f5e389bac0ed4
    title:              Document
    brief:              |
                        An external work that something here is taken
                        from, held as an entry so that it can be
                        cited.
    description:        |
                        A document is an entry of reg_document. A
                        requirement rule, a requirement
                        characteristic, a methodology, a design
                        decision and an objective each name the
                        document they are taken from by an
                        r_is_taken_from edge. A requirement does not
                        name a document. A claim in a requirement
                        rests on an observation, by an r_cites edge,
                        and ddr_document_register keeps that apart
                        from citing a standard.
    term:               document

    avoid:
      - reference
      - source
      - standard

    relation:           []

  term_process_word:
    id_self:            term_process_word
    guid_self:          term_b1bfc66fca904cf19934e65a7b44e9e8
    title:              Process word
    brief:              |
                        A verb a requirement's process slot may name,
                        with the kind of thing it denotes.
    description:        |
                        A process word is an entry of
                        reg_process_word. The requirement check reads
                        the process slot of every requirement. Where
                        the slot names a verb that no process word
                        register visible from the item's segment
                        defines, the check reports it.
    term:               process word

    avoid:
      - action word
      - doing word

    relation:           []

  term_decision:
    id_self:            term_decision
    guid_self:          term_0f7ef6ed690342fea945ca60a12f6481
    title:              Decision
    brief:              |
                        A record of a choice a person made, naming the
                        actor, the role, the authority and the items
                        it is made on.
    description:        |
                        A decision is an item of t_decision, held in
                        the decision directory. Its outcomes are
                        waive, select, accept and lead. Each subject
                        of a decision is stamped with the digest of
                        that subject's whole document, and the
                        decision check reports a subject that has
                        changed since, or an expiry that has passed. A
                        design decision is a different concept, held
                        as term_design_decision.
    term:               decision

    avoid:
      - approval
      - sign-off
      - ruling

    relation:           []

  term_requirement_set:
    id_self:            term_requirement_set
    guid_self:          term_d6fcaa6275934178b325ee44971d8e64
    title:              Requirement set
    brief:              |
                        The requirements gathered from one concept,
                        reviewed for coverage as a whole.
    description:        |
                        A requirement set is an item of
                        t_requirement_set, held in the requirement_set
                        directory. It includes each member by an
                        r_includes edge. When a set is shown to a
                        judge or to a model, its members are projected
                        as composed statements.
    term:               requirement set

    avoid:
      - requirements list
      - collection
      - group

    relation:           []

  term_scenario_coverage:
    id_self:            term_scenario_coverage
    guid_self:          term_f90ac4f5f9874863ad98853d0007123e
    title:              Scenario coverage
    brief:              |
                        A scenario class a requirement set is reviewed
                        against, and what in the set covers it.
    description:        |
                        A scenario coverage is an entry embedded in a
                        requirement set, with one entry for each
                        scenario class. The requirement check reports
                        a set that has not been reviewed, and each
                        class that is not covered.
    term:               coverage

    also:
      - scenario coverage

    avoid:
      - code coverage
      - test coverage
      - completeness

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_requirement_set
        guid_target:    term_d6fcaa6275934178b325ee44971d8e64

  term_finding_group:
    id_self:            term_finding_group
    guid_self:          term_3265f2d09a394050ae7d981e3f511dbd
    title:              Finding group
    brief:              |
                        The findings of one eval and rule in a sweep,
                        with their count, the items they fell on and
                        sample messages.
    description:        |
                        A finding group is an entry embedded in a
                        sweep, and the groups are ordered largest
                        first. A finding that names a rule the
                        register lacks is grouped under its eval
                        alone, because the rule name is the judge's
                        invention.
    term:               finding group

    avoid:
      - cluster
      - bucket

    relation:

      - id_relation:    r_is_part_of
        guid_relation:  r_27e63aad1a0d4f349396478498d8f511
        id_target:      term_sweep
        guid_target:    term_06bac932cfd84fd29b263e3b84ba8f1a

  term_sweep:
    id_self:            term_sweep
    guid_self:          term_06bac932cfd84fd29b263e3b84ba8f1a
    title:              Sweep
    brief:              |
                        What the evals found in one run, grouped by
                        eval and by rule.
    description:        |
                        An item of t_sweep in sweep/, made by cctool
                        sweep from a check report. A rule proposal
                        derives from a sweep.
    term:               sweep

    avoid:
      - scan
      - survey

    relation:           []

  term_rule_proposal:
    id_self:            term_rule_proposal
    guid_self:          term_60f36aea570f47f1bd6ad428711af8d8
    title:              Rule proposal
    brief:              |
                        A rule a model proposes from a sweep, for a
                        person to enter in the register or to reject.
    description:        |
                        A rule proposal is an item of t_rule_proposal,
                        held in the proposal directory, and it derives
                        from the sweep it answers. It states the rule
                        in the way a register entry states one, names
                        the finding groups it answers, and gives a
                        statement that follows the rule and one that
                        breaks it. Only a person writes to the
                        register.
    term:               rule proposal

    avoid:
      - suggestion
      - recommendation

    relation:           []

  term_unit:
    id_self:            term_unit
    guid_self:          term_9cd287e3e8ae4d2b96334e95c54ccc63
    title:              Unit
    brief:              |
                        A unit of measure a requirement's quantities
                        are stated in.
    description:        |
                        A unit is an entry of reg_unit, and it carries
                        the symbol and the other spellings the unit is
                        known by. The statement check reports a number
                        that no unit follows, and a unit that the
                        register lacks.
    term:               unit

    avoid:
      - unit of measure
      - dimension
      - metric

    relation:           []

  term_test_method:
    id_self:            term_test_method
    guid_self:          term_bca4066c614f47169af58509b9255f0f
    title:              Test method
    brief:              |
                        A reusable procedure concrete enough to run,
                        held as an entry of the test method register.
    description:        |
                        It settles what to do, what to observe and how
                        to read a verdict, and takes one of three
                        execution forms. A check is mechanical and
                        exact. An eval is a criterion a model judges.
                        A test method is the procedure a person or an
                        adapter follows to observe an item under test.
    term:               test method

    avoid:
      - test procedure
      - test technique
      - methodology

    relation:           []

  term_execution_form:
    id_self:            term_execution_form
    guid_self:          term_8b8a463a9c6d49c6b2e636cb4461690b
    title:              Execution form
    brief:              |
                        Which of the three ways a test method is
                        carried out: automated, evaluated inspection,
                        or manual.
    description:        |
                        The forms are closed, and a method takes
                        exactly one. A manual and an automated
                        realisation of one technique are two methods.
    term:               execution form

    avoid:
      - execution type
      - method kind

    relation:           []

  term_adapter:
    id_self:            term_adapter
    guid_self:          term_17c486d9a1b84e5e82e8b120bd435aff
    title:              Adapter
    brief:              |
                        Installed code that carries out an automated
                        test method, named by identity from the
                        method.
    description:        |
                        An adapter resolves a method and a case into
                        something it runs, and returns a normalised
                        result. A method names an adapter and never a
                        command, so no data item is a way to run
                        arbitrary code.
    term:               adapter

    avoid:
      - driver
      - plugin
      - runner

    relation:           []

  term_test_case:
    id_self:            term_test_case
    guid_self:          term_be402ef769c34db9a96ac41bd7a147d7
    title:              Test case
    brief:              |
                        The particular configuration, inputs and
                        expected observations used with a test method.
    description:        |
                        A test case is an item of t_test_case, held in
                        the test_case directory. It names exactly one
                        test method, and one or more requirements or
                        interface members. It binds no item under
                        test, so one case applies to several
                        implementations. A test case is different from
                        a control case: a control case holds an item
                        to a verdict for an eval, and a test case is
                        the logical case a test method is run with.
    term:               test case

    avoid:
      - test
      - test script
      - test vector

    relation:           []

  term_case_configuration:
    id_self:            term_case_configuration
    guid_self:          term_c2e18b96478745cbbb139aeca95488db
    title:              Case configuration
    brief:              |
                        The parameters a test case supplies to its
                        test method, governed by a schema the method
                        names.
    description:        |
                        The method names the schema; a check resolves
                        the method and validates the case payload
                        against it. A method-specific schema may be
                        shared by methods whose contracts are the
                        same.
    term:               case configuration

    avoid:
      - parameters
      - settings
      - options

    relation:           []

  term_item_under_test:
    id_self:            term_item_under_test
    guid_self:          term_0f974577538d41f4b5df52997a7f1d41
    title:              Item under test
    brief:              |
                        The item a test execution observes, bound at
                        execution rather than by the case.
    description:        |
                        A source item, a candidate revision, or
                        anything else a method can observe. The
                        binding is made at execution and not on the
                        test case, so one case is applied to several
                        implementations and revisions.
    term:               item under test

    avoid:
      - subject
      - target
      - unit under test

    relation:           []

  term_test_execution:
    id_self:            term_test_execution
    guid_self:          term_66db9e1ef2374b53840bf69fb06e4cba
    title:              Test execution
    brief:              |
                        One binding of a test method, a test case and
                        an item under test, with what came back.
    description:        |
                        An item of t_test_execution in execution/. It
                        records the digests of the method and the case
                        it observed, so a reader can tell a current
                        result from a stale one. A completed record
                        does not change.

                        An execution of a dataflow workflow is a
                        different concept, held as term_execution.
    term:               test execution

    avoid:
      - test run
      - test job

    relation:           []

  term_test_result:
    id_self:            term_test_result
    guid_self:          term_a72c61356c62435d90b0e88762fa6f51
    title:              Test result
    brief:              |
                        What one test execution found, as an embedded
                        addressable item.
    description:        |
                        It carries the conformance result and the
                        observations behind it. A result has no
                        meaning apart from the execution that produced
                        it.
    term:               test result

    avoid:
      - outcome
      - verdict

    relation:           []

  term_execution_outcome:
    id_self:            term_execution_outcome
    guid_self:          term_26ee9089dafc4d0c83917daf183129d5
    title:              Execution outcome
    brief:              |
                        Whether a test execution ran: completed,
                        error, not_run or cancelled.
    description:        |
                        It says nothing about what the procedure
                        found. An execution that did not complete
                        holds no passing conformance result.
    term:               execution outcome

    avoid:
      - status
      - result

    relation:           []

  term_conformance_result:
    id_self:            term_conformance_result
    guid_self:          term_e73fde3b5a4b403cb5fe6ac2857d01b5
    title:              Conformance result
    brief:              |
                        What a test execution found: passed, failed,
                        inconclusive or not_applicable.
    description:        |
                        It says nothing about whether the procedure
                        ran. A completed execution may hold a failed
                        conformance result.
    term:               conformance result

    avoid:
      - outcome
      - pass or fail

    relation:           []

  term_nonconformity_report:
    id_self:            term_nonconformity_report
    guid_self:          term_d503cfc624e34d18b1bb903a03f0fd1a
    title:              Nonconformity report
    brief:              |
                        One observed failure to meet one applicable
                        expectation, stated in a shape a check, a test
                        and an eval all produce.
    description:        |
                        A nonconformity report carries the
                        expectation, the observation, what produced
                        the observation, what the observation affects,
                        and the content identities the report depends
                        on. The report is returned to the caller,
                        serialised, or written outside the tree. It
                        becomes an item only when a process or a
                        person asks for the report to be kept. What a
                        check reports is a finding, which term_finding
                        holds, and a finding also carries the word
                        nonconformity.
    term:               nonconformity report

    avoid:
      - defect
      - ticket
      - issue
      - finding

    relation:           []

  term_interface_control_document:
    id_self:            term_interface_control_document
    guid_self:          term_c7337b38a470424d97b6851d3e881b47
    title:              Interface control document
    brief:              |
                        A versioned controlled contract for one
                        interface, made of keyed surfaces with
                        addressable members.
    description:        |
                        An item of t_interface_control_document in
                        interface/. A proposed version may be edited;
                        a materially changed baselined contract is a
                        new item with a new version.
    term:               interface control document

    also:
      - ICD

    avoid:
      - interface spec
      - API document

    relation:           []

  term_interface_member:
    id_self:            term_interface_member
    guid_self:          term_7aad4561c84d487f8fdb978913a3aa7c
    title:              Interface member
    brief:              |
                        One addressable declaration within an
                        interface surface, such as a function, a
                        class, a parameter or a port.
    description:        |
                        An embedded item of t_interface_member. It
                        carries an identity so that a requirement, a
                        test case or an execution can name one
                        declaration rather than the whole document.
    term:               interface member

    avoid:
      - element
      - entry
      - symbol

    relation:           []

  term_interface_surface:
    id_self:            term_interface_surface
    guid_self:          term_c60a768dab0847b2abdad87ba4a42d53
    title:              Interface surface
    brief:              |
                        One presentation of an interface in one
                        language or runtime form, held within an
                        interface control document.
    description:        |
                        A native API surface names exactly one
                        implementation language. A dataflow step
                        surface declares its input, output and state
                        ports, and the execution semantics that
                        compatibility depends on. One document may
                        hold several surfaces of one boundary.
    term:               interface surface

    avoid:
      - binding
      - facade

    relation:           []

  term_objective:
    id_self:            term_objective
    guid_self:          term_b91a896a899e4aca89f79c4cb8cf0065
    title:              Objective
    brief:              |
                        One thing an external standard requires,
                        stated in the words of this repository.
    description:        |
                        An item of t_objective in objective/, naming
                        the document it is taken from and, where the
                        process mapping has been done, the clause.
                        Whatever satisfies it points at it, and may be
                        of any kind: a check, an eval, a workflow, a
                        register, a design decision, a procedure or
                        the recorded activity of a person.

                        An objective is what a standard asks of this
                        system and its process. A requirement is what
                        this system asks of a product. A criticality
                        level requires objectives; a requirement does
                        not.
    term:               objective

    avoid:
      - goal
      - requirement of the standard

    relation:           []

  term_criticality:
    id_self:            term_criticality
    guid_self:          term_caba9c4c66b44b0abddbf4b8f11809af
    title:              Criticality
    brief:              |
                        How bad it is if an obligation is not met, on
                        one dimension.
    description:        |
                        A criticality is an entry of reg_criticality,
                        and it names a dimension and a level. A
                        requirement declares one criticality for each
                        dimension. A data item or a source item
                        declares none, and instead takes the greatest
                        criticality that reaches it, in a closed
                        world, along the relations that declare
                        responsibility. Criticality says how bad
                        failure would be. Maturity says how far
                        through its lifecycle a thing is. The two are
                        different questions, and they run in opposite
                        directions.
    term:               criticality

    avoid:
      - severity
      - priority
      - integrity level

    relation:           []

  term_gate_tool:
    id_self:            term_gate_tool
    guid_self:          term_1cae6e4ea04b4fa29e45c6a44fd316eb
    title:              Gate tool
    brief:              |
                        A tool whose exit status is relied on to
                        decide whether work may proceed.
    description:        |
                        An entry of reg_gate_tool, saying what the
                        tool examines, what its exit status means,
                        what it cannot see, and what demonstrates that
                        a defect it is meant to catch makes it fail. A
                        gate tool is one whose failure stops the work.
                        Gate is the decision to let work proceed, here
                        or in a pipeline, and not only the pixi task
                        of that name.
    term:               gate tool

    avoid:
      - verdict producer
      - quality tool

    relation:           []

  term_tool_control:
    id_self:            term_tool_control
    guid_self:          term_5d10d724e4414dfe8ad0af38353419dc
    title:              Control
    brief:              |
                        A known defect given to a tool, with what the
                        tool must do about it.
    description:        |
                        A tool control answers whether a tool would
                        say anything if there were something to say,
                        which a run that exits zero does not answer.
                        The control is built outside the tree and
                        given to the tool, and the tool is required to
                        fail on it. Where a tool could plausibly fail
                        everything, a companion of the same shape
                        without the defect is written, and the tool
                        must pass that companion. ddr_gate_tool
                        decides when a companion is worth having. A
                        gate tool names its controls by
                        r_is_controlled_by edges, and
                        qry_gate_tool_control reports a tool that
                        names none.
    term:               control

    also:
      - positive control
      - negative control

    avoid:
      - control case
      - control set
      - smoke test

    relation:           []

  term_annotation:
    id_self:            term_annotation
    guid_self:          term_b0fd9a9d0569454ebccd4b5fc1721029
    title:              Annotation
    brief:              |
                        An independently addressable assertion about
                        something in the graph, offered for
                        consideration.
    description:        |
                        One assertion, held as an item of its own so
                        that it can be cited, supported or challenged.
                        Its role is carried by its edges and not by a
                        field: what it is about, what it rests on, and
                        what it argues with. An annotation is not a
                        finding, is not evidence, and is not true for
                        want of an answer. A note is what a check
                        reports where it found nothing at fault, and
                        the tool writes it. An annotation is written
                        by whoever has something to say.
    term:               annotation
    status:             proposed
    alias:              []
    relation:           []

  term_annotation_challenge:
    id_self:            term_annotation_challenge
    guid_self:          term_9bca40428b5a4dd094eb2f516a944850
    title:              Challenge (of an annotation)
    brief:              |
                        A reason not to accept an assertion another
                        annotation makes.
    description:        |
                        The word challenge has two senses here, and
                        this is the wider one. A challenge held on a
                        design decision is the strongest case against
                        that one decision, and a resolution answers
                        it. A challenge between annotations is one
                        assertion giving a reason not to accept
                        another, and nothing settles which one
                        prevails. A challenge between annotations is
                        carried by an r_challenges edge and not by a
                        field. That means an annotation may be
                        challenged by several others, and each
                        challenge is itself an assertion that can be
                        answered.
    term:               challenge
    status:             proposed
    alias:              []
    relation:           []

  term_criteria_coverage:
    id_self:            term_criteria_coverage
    guid_self:          term_0495a7f0683347e7b8851ea9ef6fc186
    title:              Criteria coverage
    brief:              |
                        Whether the verification of a requirement
                        exercises what that requirement requires.
    description:        |
                        A judged reading of a test against the success
                        criteria of the requirement it verifies: for
                        each thing the criteria say verification must
                        show, would the test fail if that thing were
                        untrue. It is not line coverage, which counts
                        the statements a run executed and says nothing
                        about what was asserted about them, and it is
                        not scenario coverage, which is about the
                        members of a requirement set. A coverage
                        analysis item records one such reading.
    term:               coverage
    status:             proposed
    relation:           []

  term_language_model:
    id_self:            term_language_model
    guid_self:          term_5e2b29fa4c9b4ec0a7922ef1d806bbcf
    title:              Language model
    brief:              |
                        A language model as a named party: what wrote,
                        judged or asserted an item.
    description:        |
                        A language model entry holds the identity of
                        one model, in the model register, so that an
                        annotation, a deployment or a confidence row
                        can name the model rather than spell it out. A
                        performer is a kind of party, and a performer
                        may be a function, a model or an agent. A
                        judge is the role a model plays over a
                        criterion. A language model entry is the model
                        itself, whichever role it plays.
    term:               language model

    also:
      - model

    status:             proposed
    relation:           []

  term_coverage_analysis:
    id_self:            term_coverage_analysis
    guid_self:          term_32c5f294b07a461092821068cb8bf222
    title:              Coverage analysis
    brief:              |
                        A recorded reading of a test against the
                        success criteria of the requirement it
                        verifies.
    description:        |
                        A coverage analysis holds one item per judge.
                        Each item holds a row for each reading, and
                        the row names the requirement, the verifier
                        that was read against it, the verdict, and a
                        digest of what was read. The analysis records
                        how far the criteria are covered. It is a
                        record of coverage, not the coverage itself.
                        The error rates the judge was measured at are
                        on the record, because a judge is not a check.
    term:               coverage analysis
    status:             proposed
    relation:           []

  term_operational_concept:
    id_self:            term_operational_concept
    guid_self:          term_a92959fcf2c9453284f8f467e826e509
    title:              Operational concept
    brief:              |
                        How the system of interest is intended to be
                        used and what crosses its boundary, before
                        anything specifies how it is built.
    description:        |
                        An operational concept is an operational
                        concept data item, held in the
                        operational_concept directory. It derives from
                        a need. Its scenarios point back at it by
                        r_is_scenario_of edges, and the requirements
                        on the system derive from the operational
                        concept and from its scenarios. The
                        operational concept is different from the
                        solution concept, which proposes a candidate
                        solution to a need.
    term:               operational concept

    also:
      - operations concept
      - concept of operations

    avoid:
      - use case

    relation:           []

  term_operational_scenario:
    id_self:            term_operational_scenario
    guid_self:          term_b25df13086fd41068b31683247b6cd37
    title:              Operational scenario
    brief:              |
                        One coherent episode of operation: what starts
                        it, what happens in order, and what is
                        observably true when it ends.
    description:        |
                        An operational scenario data item in
                        operational_scenario/. Its kind is an entry of
                        reg_operational_scenario_kind. A requirement,
                        a measure and a validation case each point at
                        a particular scenario, which is why it is an
                        item rather than prose inside an operational
                        concept.
    term:               operational scenario

    also:
      - scenario

    avoid:
      - story
      - flow

    relation:           []

  term_measure:
    id_self:            term_measure
    guid_self:          term_232035785dae4f8abd72c2509b7bb09f
    title:              Measure
    brief:              |
                        How success or performance is quantified: what
                        is measured, over what population, by what
                        statistic, and against what threshold.
    description:        |
                        A measure data item in measure/. Its kind is
                        an entry of reg_measure_kind, which holds the
                        measure of effectiveness, the measure of
                        performance and the technical performance
                        measure. A measure quantifies a need, a
                        scenario or a requirement by r_quantifies. The
                        unit a quantity is stated in is a unit and not
                        a measure.
    term:               measure

    also:
      - measure of effectiveness
      - measure of performance
      - technical performance measure

    avoid:
      - metric
      - kpi

    relation:           []

  term_operational_scenario_kind:
    id_self:            term_operational_scenario_kind
    guid_self:          term_1e24db7e7e5f45a6a71932aaae2ea431
    title:              Operational scenario kind
    brief:              |
                        Which sort of episode a scenario is: intended,
                        alternative, degraded, failed, misuse,
                        maintenance or deployment.
    description:        |
                        An operational scenario kind is an entry of
                        reg_operational_scenario_kind. A scenario
                        names one kind in its kind field. The scenario
                        classes that a requirement set is reviewed for
                        cover the same ground under different names,
                        and ddr_operational_concept reconciles the
                        two.
    term:               operational scenario kind
    relation:           []

  term_measure_kind:
    id_self:            term_measure_kind
    guid_self:          term_27a310d56f2547a08ffb90b06bcc2baf
    title:              Measure kind
    brief:              |
                        Which sort of measure a measure is: of
                        effectiveness, of performance, or a technical
                        performance measure tracked over time.
    description:        |
                        An entry of reg_measure_kind, taken from the
                        INCOSE systems engineering handbook. A measure
                        names one by its kind field.
    term:               measure kind
    relation:           []

  term_requirement_level:
    id_self:            term_requirement_level
    guid_self:          term_5a0b436cf4ac42eabe02cab81971a7f1
    title:              Requirement level
    brief:              |
                        Which rung of a decomposition a set of
                        requirements sits on: on the stakeholders, on
                        the system, or on one of its parts.
    description:        |
                        An entry of reg_requirement_level. A
                        requirement set names one; an individual
                        requirement does not, and keeps one shape at
                        every level. The level is written rather than
                        worked out from the graph, because a set on a
                        part is a set on a part whether or not
                        anything has yet derived from it.
    term:               requirement level

    avoid:
      - tier
      - layer

    relation:           []
