status:                 draft
title:                  Gate tool register
brief:                  |
                        The tools whose exit status is relied on to
                        decide whether work may proceed.
description:            |
                        One entry per tool whose failure stops the
                        work, keyed by readable id. An entry says what
                        the tool examines, what its exit status means,
                        what it cannot see, and, by
                        r_is_controlled_by, what demonstrates that a
                        defect it is meant to catch does make it fail.
usage:                  |
                        Read before trusting a green run. A tool run
                        for information is not entered here; one whose
                        failure stops the work is.
note:                   |
                        A tool with no r_is_controlled_by edge is
                        relied on without that reliance having been
                        shown. The absent edge is the statement.

table:

  gt_cctool_check:
    id_self:            gt_cctool_check
    guid_self:          gt_d497ae22a0b0464a9961ca8ea9866921
    title:              The repository check
    brief:              |
                        Eighteen mechanical checks over the data
                        items, run with the world closed and failing
                        on a nonconformity.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            this repository
    scope:              |
                        Every data item the segment governs: identity,
                        references, schema, layout, relations,
                        registers, trace, evidence, statements,
                        interfaces, testing and workflows. It reads
                        what is written and does not run anything the
                        items describe.
    exit_status:        |
                        Zero where no finding is critical. Non zero on
                        a critical finding, and with the world closed,
                        on a reference that resolves to nothing. An
                        advisory finding does not stop it.
    blind_spot:         |
                        It judges what the items say, not whether what
                        they say is true of the code. A requirement
                        whose implementation does the opposite of what
                        it claims passes every one of these checks.
                        Nor does it read python beyond the documents
                        held in docstrings.

                        Each of the eighteen checks is shown a defect
                        it exists to find and is required to report
                        it, at a severity the control names, so that
                        layout, decision and confidence reporting
                        rather than stopping the gate is held to
                        rather than assumed. One control is one defect
                        per check: a check that stopped finding some
                        other defect would still pass.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_gate_tool
        guid_target:    pym_3d0d3c58d6514d829598e79a51cc1c77

  gt_ruff:
    id_self:            gt_ruff
    guid_self:          gt_f6de11aca9ab42fb826e4426cd2369e2
    title:              Ruff
    brief:              |
                        The python linter, over src and test, in the
                        house rule set.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            0.16.6
    scope:              |
                        Every python file under src and test, less the
                        execution directory and the pixi cache.
                        Fifteen rule families are selected and seven
                        rules are ignored for reasons written beside
                        them.
    exit_status:        |
                        Zero where no selected rule fires. Non zero on
                        any finding. It says nothing about rules that
                        are not selected.
    blind_spot:         |
                        Rules that are not selected, and everything
                        that needs types to see. It does not format:
                        the house layout is not enforced, and a
                        formatter run would rewrite most of the tree.

                        What controls it shows a selected rule firing,
                        a clean file passing, and the house
                        configuration being read rather than a default
                        one, which is how a linter passes while
                        looking at the wrong rules.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_gate_tool
        guid_target:    pym_3d0d3c58d6514d829598e79a51cc1c77

  gt_lint_imports:
    id_self:            gt_lint_imports
    guid_self:          gt_6925d1ac52bb4ca0b988a117d7f7eba7
    title:              Import linter
    brief:              |
                        The seven tier layering contract: a package
                        imports downward only.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            '2.15'
    scope:              |
                        The import graph of cc_public against the
                        layers contract in pyproject. Tests are
                        outside it.
    exit_status:        |
                        Zero where the contract is kept. Non zero
                        where a package imports upward or a sibling
                        imports a sibling.
    blind_spot:         |
                        A lazy import inside a function is still an
                        import and is seen, but an import reached
                        through importlib by a computed name is not.
                        It says nothing about whether the layering is
                        the right one.

                        What controls it is a package of two tiers
                        where the lower imports the upper, which is
                        the one thing a layers contract exists to
                        refuse. It does not exercise this repository
                        own seven tier contract.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_gate_tool
        guid_target:    pym_3d0d3c58d6514d829598e79a51cc1c77

  gt_pytest:
    id_self:            gt_pytest
    guid_self:          gt_8719b27a6cac41a9a45d5450546c18ff
    title:              pytest
    brief:              |
                        The test runner, over test/, in parallel.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            9.1.1
    scope:              |
                        Files under test/ whose names match
                        test_something, as testpaths and the default
                        pattern say. Files that do not match are
                        collected only when named explicitly, which is
                        how the adapter controls are reached without
                        the suite running them. An ini key pytest does
                        not know, a marker nobody registered and an
                        expected failure that passed are each refused
                        rather than ignored.
    exit_status:        |
                        Zero where every collected test passed or was
                        skipped. Non zero on a failure, an error, or a
                        collection error. A test that was never
                        collected cannot fail, so a green run says
                        nothing about a file the pattern did not
                        match.
    blind_spot:         |
                        What was not written. It also writes: the
                        session hook rewrites the pytest evidence
                        item, so a test run is not read only and the
                        working tree may change under it. A test that
                        runs longer than the timeout is stopped at 600
                        seconds, which is a hang guard and not a
                        budget: a test that grows past it is marked
                        and explained, not accommodated.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_adapter_control
        guid_target:    pym_52c63e1d68b54a2b80d73b9b3719431d

  gt_pytest_cov:
    id_self:            gt_pytest_cov
    guid_self:          gt_a9090112b7144acba6a5f104259bf067
    title:              Coverage floor
    brief:              |
                        Branch aware coverage of cc_public, failing
                        under a floor of 87 per cent.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            pytest-cov 7.1.0, coverage 7.16.0
    scope:              |
                        Statements in cc_public executed during the
                        suite, and the branch exits taken. Measured
                        twice on f4d1e58 with identical results: 7638
                        statements, 797 missed, 2812 branches, 309
                        partial, 87.12 per cent.
    exit_status:        |
                        Zero where the measured percentage is at or
                        above the floor. Non zero below it. The floor
                        is a floor and not a target, and there is 0.12
                        of a point between the two: roughly thirteen
                        statements or branch exits of regression will
                        fail it.
    blind_spot:         |
                        A statement that ran is not a statement that
                        was asserted about, and a branch that was
                        taken is not a branch whose outcome anything
                        checked. It says nothing about whether a test
                        exercises what its requirement requires, which
                        is what evl_test_exercises_criteria is for,
                        and the two must not be read as the same
                        measure.

                        It measures what the suite ran. Code reached
                        only by a command nobody tests is simply
                        absent from the numerator and the denominator
                        alike, so cli/report.py sitting at 39 per cent
                        lowers the total rather than failing anything
                        by itself.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_gate_tool
        guid_target:    pym_3d0d3c58d6514d829598e79a51cc1c77

  gt_pytest_adapter:
    id_self:            gt_pytest_adapter
    guid_self:          gt_afafc1804b154b9f96fb523ea717674c
    title:              The pytest adapter
    brief:              |
                        Reads a conformance result for one test case
                        from what pytest reported.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            this repository
    scope:              |
                        One test function named by a case, run in a
                        subprocess whose path holds the tree own src,
                        so what runs is the code that tree holds.
    exit_status:        |
                        It returns an execution outcome and a
                        conformance result rather than an exit status.
                        An execution that did not complete carries no
                        result at all, so an error cannot become a
                        failure and neither can become a pass. A run
                        stopped at its timeout is one of those: pytest
                        reports it as an ordinary call failure, and
                        reading it as one would name the item under
                        test in a report for something the run never
                        observed.
    blind_spot:         |
                        A node that could not be collected is told
                        apart from the rest only against a report
                        written by hand: a file with a syntax error
                        cannot live in this tree, so that one path is
                        unobserved against a real run. A timeout is
                        recognised by the words pytest-timeout writes
                        into the report, so a change in that wording
                        would make a stopped run read as a failure
                        again.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_adapter_control
        guid_target:    pym_52c63e1d68b54a2b80d73b9b3719431d

  gt_mypy:
    id_self:            gt_mypy
    guid_self:          gt_4613c475e96843349236cca2a464290a
    title:              Mypy
    brief:              |
                        The static type checker, over the typed
                        island, at full strictness.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            1.20.2
    scope:              |
                        Three modules named by files in the mypy
                        configuration: question, need and control.
                        Every strictness flag applies to those and to
                        nothing else. The rest of the package is
                        unchecked by this task, and reported 63 errors
                        in 31 of 92 files when asked, which is the
                        size of widening the island and not a claim
                        about it.
    exit_status:        |
                        Zero where the island type checks. Non zero on
                        any error in it. A zero says nothing whatever
                        about the other 89 modules.
    blind_spot:         |
                        Everything outside the island, which is most
                        of the package. Types are checked and not
                        enforced: nothing here runs, so a value that
                        arrives at runtime with the wrong type is not
                        caught by this.

                        Its cache is incremental and was observed to
                        disagree with the tree: after a file was
                        restored, mypy reported the errors of the
                        version before it until the cache was removed.
                        The control runs with no-incremental for that
                        reason, and a doubtful local result is worth
                        repeating after deleting .mypy_cache.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_gate_tool
        guid_target:    pym_3d0d3c58d6514d829598e79a51cc1c77

  gt_package_check:
    id_self:            gt_package_check
    guid_self:          gt_f168358a13804590b74d47fd8a701c24
    title:              Packaging check
    brief:              |
                        Builds both distributions, checks their
                        metadata, and uses the wheel from an
                        environment of its own.
    description:        |
                        One of the tools whose exit status the gate
                        believes. What is written here is what a green
                        run is worth, and no more.
    version:            build 1.6.0, twine 7.0.0
    scope:              |
                        The source distribution and the wheel as built
                        from a clean checkout, their metadata, and the
                        tool that comes out of the wheel: it must
                        import from the environment the wheel was
                        installed into, run --help, and run one read
                        only command. It blocks in the pipeline and
                        not in the local gate, since it builds and
                        reaches the network.
    exit_status:        |
                        Zero where both artifacts build, both pass
                        metadata validation, and the installed tool
                        runs. Non zero on any of the three.
    blind_spot:         |
                        It exercises two commands. A command it does
                        not run can still be broken in the wheel, and
                        the first defect it found was exactly that
                        shape: cctool would not start at all because
                        the adapter imported pytest at module scope,
                        and only running the installed binary showed
                        it.

                        It says nothing about whether the package
                        works on a platform it was not run on, and
                        twine validates metadata against its own list
                        of versions: twine 6 rejected this wheel by
                        monkeypatching that list back to a version
                        older than the one packaging accepts.
    status:             proposed

    relation:

      - id_relation:    r_is_controlled_by
        guid_relation:  r_8929d2017dec4d0cba84cf7904e94c8d
        id_target:      pym_test.test_gate_tool
        guid_target:    pym_3d0d3c58d6514d829598e79a51cc1c77

