status:                 draft
title:                  Methodology register
brief:                  |
                        Register of the established methodologies for
                        analysing needs and writing requirements that
                        the repository draws on.
description:            |
                        Each entry names a methodology, its source,
                        and what of it the repository takes.
usage:                  |
                        A component that implements a methodology
                        names it in its description; a decomposition
                        says which it followed.
note:                   |
                        Entered so that a method is named rather than
                        implied. What each contributes is in
                        ddr_need_to_requirement.

table:

  method_incose_gtwr:
    id_self:            method_incose_gtwr
    guid_self:          method_171813b33c7d4097a868a17436b8da43
    title:              INCOSE guide to writing requirements
    brief:              |
                        The characteristics and rules of well formed
                        needs and requirements, and their attributes.
    description:        |
                        INCOSE, Guide to Writing Requirements,
                        revision 4, 2023. Taken: C1 to C15, R1 to R42,
                        the need to requirement transformation, the
                        attribute scheme. Held in reg_requirement_rule
                        and reg_requirement_characteristic.
    alias:              []
    status:             proposed
    relation:           []

  method_sophist:
    id_self:            method_sophist
    guid_self:          method_bc8facdc84ac4e1cb3f276dd5f5a3a07
    title:              SOPHIST requirements templates
    brief:              |
                        Restricted natural language templates and
                        rules that make form defects mechanically
                        visible.
    description:        |
                        Chris Rupp and SOPHIST GmbH, the requirements
                        template and rules. Taken: the sentence
                        grammar and the defect rules; composition of
                        the requirement statement from slots is the
                        intended use.
    alias:              []
    status:             proposed
    relation:           []

  method_kaos:
    id_self:            method_kaos
    guid_self:          method_776d73f001fa4d6d87c1ef36a98526b1
    title:              KAOS goal oriented requirements engineering
    brief:              |
                        Goals refined by AND and OR into subgoals,
                        with obstacles analysed and resolved.
    description:        |
                        van Lamsweerde and Letier. Taken: alternative
                        refinements as first class, sufficiency of an
                        AND refinement given domain properties,
                        obstacle analysis before a refinement is
                        accepted.
    alias:              []
    status:             proposed
    relation:           []

  method_problem_frames:
    id_self:            method_problem_frames
    guid_self:          method_61faed82e4814d2b9061ec301699ec4a
    title:              Problem frames
    brief:              |
                        A catalogue of classes of subproblem, each
                        with a known concern, that a problem is
                        decomposed into.
    description:        |
                        Michael Jackson, Problem Frames, 2001, and the
                        Zave and Jackson reference model: the
                        specification satisfies the requirement only
                        with the domain assumptions. Taken: the
                        framing register, and assumptions as a part of
                        every decomposition.
    alias:              []
    status:             proposed
    relation:           []

  method_scenario:
    id_self:            method_scenario
    guid_self:          method_ff5aaef512ca426fa9263a636c4a84a7
    title:              Scenario based requirements engineering
    brief:              |
                        Goals and requirements grounded and tested
                        against scenarios of use, normal and abnormal.
    description:        |
                        Sutcliffe, scenario based requirements
                        engineering. Taken: the abnormal and degraded
                        cases as a coverage question on a
                        decomposition.
    alias:              []
    status:             proposed
    relation:           []

  method_admissible_claims:
    id_self:            method_admissible_claims
    guid_self:          method_34265ee8c5914250a89deebb64a26d2d
    title:              Requirements engineering by admissible claims
    brief:              |
                        A claim enters a specification only with a
                        defense another party can check: evidence for
                        a claim about the world, argument for a claim
                        of design.
    description:        |
                        The repository's own position, developed from
                        SOPHIST and INCOSE. Taken: assumptions as
                        evidential claims beside a decision, the
                        challenge from an independent stance, the
                        decomposition rule, risk tiering, and the
                        person as auditor.
    alias:              []
    status:             proposed
    relation:           []

