    guid_self:          doc_a5ab43ed09a748eaa158cebbf6a867bf
    title:              INCOSE systems engineering handbook
    brief:              |
                        The systems engineering processes, including
                        verification and the matrix that records it.
    description:        |
                        Taken: that verification is recorded for each
                        requirement in a matrix naming the method and
                        the stage, while the activity that produces it
                        may be shared; and the four verification
                        methods, test, analysis, inspection and
                        demonstration, which reg_test_method must be
                        able to hold.
    publisher:          International Council on Systems Engineering
    author:             INCOSE
    id_external:        INCOSE-TP-2003-002-05
    revision:           '5'
    date:               '2023'
    status:             proposed
    relation:           []

  doc_iso_29119:
    id_self:            doc_iso_29119
    guid_self:          doc_dbb0b02b21814a9f88c7d0c8db14096d
    title:              ISO/IEC/IEEE 29119 Software testing
    brief:              |
                        The software testing standard: processes,
                        documentation, design techniques and the
                        vocabulary they use.
    description:        |
                        Taken: the separation of a test condition from
                        a test case from a test procedure, which is
                        the shape ddr_test_case and ddr_test_method
                        give them; that traceability from a case to
                        the test basis is many to many; that a case
                        carries expected results; and the design
                        techniques, equivalence partitioning and
                        boundary analysis among them, that ask for
                        more than one case for one requirement. Parts
                        one to four.
    publisher:          ISO, IEC and IEEE
    id_external:        ISO/IEC/IEEE 29119
    date:               '2022'
    status:             proposed
    relation:           []

  doc_iso_21434:
    id_self:            doc_iso_21434
    guid_self:          doc_eed00a6740b745c394e68e282d972026
    title:              ISO/SAE 21434 Road vehicles cybersecurity engineering
    brief:              |
                        Cybersecurity engineering for road vehicles,
                        with cybersecurity assurance levels.
    description:        |
                        Taken: that a cybersecurity assurance level is
                        held beside a safety integrity level and not
                        folded into it, which is why ddr_criticality
                        has two dimensions; and the four assurance
                        levels the security dimension corresponds to.
    publisher:          ISO and SAE International
    id_external:        ISO/SAE 21434:2021
    date:               '2021'
    status:             proposed
    relation:           []

  doc_iec_62443:
    id_self:            doc_iec_62443
    guid_self:          doc_d29c2a608d404db8be5e7a79bb30a799
    title:              IEC 62443 Security for industrial automation and control
    brief:              |
                        The security series for industrial automation
                        and control systems, with security levels one
                        to four.
    description:        |
                        Taken: the four security levels the security
                        dimension of ddr_criticality corresponds to,
                        and the practice of stating a security level
                        for a component separately from any safety
                        integrity it carries. A series; the levels are
                        defined in the system and component parts.
    publisher:          International Electrotechnical Commission
    id_external:        IEC 62443
    status:             proposed
    relation:           []

  doc_iso_26262:
    id_self:            doc_iso_26262
    guid_self:          doc_7ea3871bbda84bdd82e14a1e10f58cb5
    title:              ISO 26262 Road vehicles functional safety
    brief:              |
                        Functional safety for road vehicles, with
                        automotive safety integrity levels and
                        requirements based testing.
    description:        |
                        Taken: that requirements based testing is
                        expected at every integrity level and that
                        coverage of the requirements measures the
                        completeness of the test cases; and that an
                        automotive safety integrity level is held
                        beside a cybersecurity assurance level, which
                        is one of the three domains that told
                        ddr_criticality to split its dimensions.
    publisher:          International Organization for Standardization
    id_external:        ISO 26262:2018
    revision:           '2'
    date:               '2018'
    status:             proposed
    relation:           []

  doc_jarus_sora:
    id_self:            doc_jarus_sora
    guid_self:          doc_b71279fd97b84f15bda8a7ef3ce4ccfe
    title:              JARUS specific operations risk assessment
    brief:              |
                        The operational risk assessment for unmanned
                        aircraft, yielding a specific assurance and
                        integrity level.
    description:        |
                        Taken: that the risk an unmanned vehicle
                        presents is reasoned about as harm to third
                        parties on the ground and in the air, not as
                        harm to occupants, which is why the safety
                        dimension of ddr_criticality is written about
                        third parties. It informs how a level is
                        arrived at for an operation and is not a
                        source of verification objectives. The edition
                        is not pinned here and must be when the
                        process mapping is done.
    publisher:          JARUS
    author:             Joint Authorities for Rulemaking on Unmanned Systems
    id_external:        JARUS SORA
    status:             proposed
    relation:           []

