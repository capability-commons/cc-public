  doc_iso_26262:
    id_self:            doc_iso_26262
    guid_self:          doc_7ea3871bbda84bdd82e14a1e10f58cb5
    title:              ISO 26262 Road vehicles functional safety
    brief:              |
                        Functional safety for road vehicles, with
                        automotive safety integrity levels and
                        requirements based testing.
    description:        |
                        Taken: that requirements based testing is
                        expected at every integrity level and that
                        coverage of the requirements measures the
                        completeness of the test cases; and that an
                        automotive safety integrity level is held
                        beside a cybersecurity assurance level, which
                        is one of the three domains that told
                        ddr_criticality to split its dimensions.
    publisher:          International Organization for Standardization
    id_external:        ISO 26262:2018
    revision:           '2'
    date:               '2018'
    status:             proposed
    relation:           []

  doc_jarus_sora:
    id_self:            doc_jarus_sora
    guid_self:          doc_b71279fd97b84f15bda8a7ef3ce4ccfe
    title:              JARUS specific operations risk assessment
    brief:              |
                        The operational risk assessment for unmanned
                        aircraft, yielding a specific assurance and
                        integrity level.
    description:        |
                        Taken: that the risk an unmanned vehicle
                        presents is reasoned about as harm to third
                        parties on the ground and in the air rather
                        than as harm to occupants. It informs how a
                        level is arrived at for an operation and is
                        not a source of verification objectives. The
                        edition is not pinned here and must be when
                        the process mapping is done.
    publisher:          JARUS
    author:             Joint Authorities for Rulemaking on Unmanned Systems
    id_external:        JARUS SORA
    status:             proposed
    relation:           []

