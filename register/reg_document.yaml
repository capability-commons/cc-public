    title:              INCOSE systems engineering handbook
    brief:              |
                        The systems engineering processes, including
                        verification and the matrix that records it.
    description:        |
                        Taken: the system-lifecycle process structure;
                        the distinction between stakeholder needs and
                        requirements, system requirements and
                        architecture; that verification is recorded
                        for each requirement in a matrix naming the
                        method and the stage, while the activity that
                        produces it may be shared; and the four
                        verification methods, test, analysis,
                        inspection and demonstration, which
                        reg_test_method must be able to hold.
    publisher:          International Council on Systems Engineering
    author:             INCOSE
    id_external:        INCOSE-TP-2003-002-05
    revision:           '5'
    date:               '2023'
    status:             proposed
