  doc_rtca_do_178c:
    id_self:            doc_rtca_do_178c
    guid_self:          doc_176ee89e05a64b588d9125fb8b8f15df
    title:              DO-178C Software considerations in airborne systems
    brief:              |
                        The objectives for software in certified
                        airborne systems, selected by design assurance
                        level.
    description:        |
                        Taken: the objectives of software
                        verification, which ddr_verification_standard
                        puts first; that verification is recorded for
                        each requirement while the activity may be
                        shared; that coverage of the requirements is
                        analysed rather than assumed; and the design
                        assurance levels the safety dimension of
                        ddr_criticality corresponds to.
    publisher:          RTCA
    author:             SC-205, RTCA and WG-71, EUROCAE
    id_external:        RTCA/DO-178C
    revision:           C
    date:               '2011'
    status:             proposed
    relation:           []

  doc_rtca_do_330:
    id_self:            doc_rtca_do_330
    guid_self:          doc_31d1b53f0829486ca2a797ae874734fb
    title:              DO-330 Software tool qualification considerations
    brief:              |
                        What is required of a tool relied on in place
                        of a process, graded by tool qualification
                        level.
    description:        |
                        Taken: that a verification tool which could
                        fail to detect an error, and is not relied on
                        to remove other verification, is qualified at
                        the lowest level, which asks for the tool's
                        requirements and tests of them under normal
                        operating conditions. That is the shape of the
                        control set the pytest adapter is given.
    publisher:          RTCA
    author:             SC-205, RTCA and WG-71, EUROCAE
    id_external:        RTCA/DO-330
    date:               '2011'
    status:             proposed
    relation:           []

  doc_incose_seh:
