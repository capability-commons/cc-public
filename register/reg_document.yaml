    brief:              |
                        The objectives for software in certified
                        airborne systems, selected by design assurance
                        level.
    description:        |
                        Taken: the objectives of software
                        verification, which ddr_verification_standard
                        puts first; that verification is recorded for
                        each requirement while the activity may be
                        shared; that coverage of the requirements is
                        analysed rather than assumed; and the design
                        assurance levels the safety dimension of
                        ddr_criticality corresponds to.
