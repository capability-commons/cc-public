    brief:              |
                        Cybersecurity engineering for road vehicles,
                        with cybersecurity assurance levels.
    description:        |
                        Taken: that a cybersecurity assurance level is
                        held beside a safety integrity level rather
                        than folded into it, and the four assurance
                        levels the security dimension corresponds to.
    publisher:          ISO and SAE International
    id_external:        ISO/SAE 21434:2021
    date:               '2021'
