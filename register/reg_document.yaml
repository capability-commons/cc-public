status:                 draft
title:                  Document register
brief:                  |
                        Register of the external documents the
                        repository takes material from: standards,
                        guides, papers and books.
description:            |
                        Each entry names one document as its publisher
                        names it, with the particulars that let a
                        reader find it, and says what the repository
                        takes from it. A document is a pointer, not a
                        capture: its content is not held here and
                        nothing is digested. A captured public source
                        is an observation.
usage:                  |
                        An item that paraphrases or adopts material
                        from a document, a rule, a characteristic or a
                        methodology, names the document by an
                        r_is_taken_from edge, so that provenance is an
                        edge and not a mention in prose.
note:                   |
                        A locator is a path within a reference library
                        outside this tree, and is given only where one
                        exists; the tree does not hold the document.

