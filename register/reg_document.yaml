  doc_rtca_do_330:
    id_self:            doc_rtca_do_330
    guid_self:          doc_31d1b53f0829486ca2a797ae874734fb
    title:              DO-330 Software tool qualification considerations
    brief:              |
                        What is required of a tool relied on in place
                        of a process, graded by tool qualification
                        level.
    description:        |
                        Taken: that a verification tool which could
                        fail to detect an error, and is not relied on
                        to remove other verification, is qualified at
                        the lowest level, which asks for the tool's
                        requirements and tests of them under normal
                        operating conditions. That is the shape of the
                        control set the pytest adapter is given.
    publisher:          RTCA
    author:             SC-205, RTCA and WG-71, EUROCAE
    id_external:        RTCA/DO-330
    date:               '2011'
    status:             proposed
    relation:           []

