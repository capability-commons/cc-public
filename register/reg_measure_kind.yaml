status:                 draft
title:                  Measure kind register
brief:                  |
                        Register of the sorts of measure, taken from
                        the INCOSE systems engineering handbook.
description:            |
                        Each entry names one sort of measure. The
                        three are the ones the INCOSE systems
                        engineering handbook distinguishes, and they
                        differ in who the measure answers to and when
                        it is read.
usage:                  |
                        A measure names one entry in its kind field.
note:                   |
                        The three kinds are the ones the INCOSE
                        systems engineering handbook distinguishes. A
                        key performance parameter is not a fourth: it
                        is a designation put on a measure that matters
                        most, and whether this register should hold it
                        is left open in ddr_operational_concept.

table:

  mkind_effectiveness:
    id_self:            mkind_effectiveness
    guid_self:          mkind_c5a8f00cb9d647e2939615e9d7b47253
    title:              Measure of effectiveness
    brief:              |
                        How well the outcome a stakeholder wanted is
                        achieved, stated in the stakeholder's terms
                        and not the system's.
    description:        |
                        Independent of any solution: two materially
                        different systems can be compared by it. It
                        quantifies a need or an operational scenario,
                        and it is what an acceptance decision reads.
    relation:           []

  mkind_performance:
    id_self:            mkind_performance
    guid_self:          mkind_708adbafc5b44263b34f7be8fbedb8fd
    title:              Measure of performance
    brief:              |
                        How well the system does a thing it is
                        required to do, stated in the system's terms.
    description:        |
                        Bound to a particular system and its
                        requirements. Several measures of performance
                        usually stand behind one measure of
                        effectiveness, and how they combine is an
                        analysis and not an assumption.
    relation:           []

  mkind_technical:
    id_self:            mkind_technical
    guid_self:          mkind_fc2530953c4e4115a9c66df46250e9bc
    title:              Technical performance measure
    brief:              |
                        A measure of performance tracked over time
                        against a planned profile, so that a shortfall
                        is seen while there is still time to act.
    description:        |
                        Distinguished from a measure of performance by
                        being read repeatedly during development
                        rather than once at acceptance. It carries a
                        threshold and the profile it is expected to
                        follow.
    relation:           []

