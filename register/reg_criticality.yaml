status:                 draft
title:                  Criticality register
brief:                  |
                        The controlled criticality levels: how bad it
                        is if an obligation is not met, on each of two
                        dimensions.
description:            |
                        Ten entries, five levels on each of two
                        dimensions, keyed by readable id. An entry
                        says what consequence of failure it stands
                        for, which level of an external scale it
                        corresponds to, and which objectives it
                        requires.

                        The safety dimension is written about harm to
                        a third party, because the vehicles this
                        serves are unmanned and the people at risk are
                        outside them. The security dimension is
                        written about compromise of control and of
                        information.
usage:                  |
                        A requirement declares a level for each
                        dimension. A data item or a source item
                        declares none: its effective criticality is
                        the greatest reaching it, in a closed world,
                        along the relations that declare
                        responsibility.
note:                   |
                        A level is a multiple of ten and the levels in
                        use are spaced, widest apart at the low end,
                        so that one may be put between two that exist
                        without renaming either.

