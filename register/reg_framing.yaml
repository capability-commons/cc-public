status:                 draft
title:                  Framing register
brief:                  |
                        Register of the framings under which a need is
                        analysed and decomposed.
description:            |
                        Each entry is a lens: its brief says what the
                        lens treats as the problem, its description
                        what it makes salient and what kinds of
                        response it admits.
usage:                  |
                        Bound to the analysis component as its framing
                        input; named in a decomposition's context. The
                        same need decomposed under two framings gives
                        two decision items to compare.
note:                   |
                        The catalogue is small on purpose and grows
                        only when a decomposition needed a lens it
                        lacked.

table:

  frame_supply:
    id_self:            frame_supply
    guid_self:          frame_08a4855abf0c47b7b8f744f6ed1ba3ba
    title:              As a supply problem
    brief:              |
                        The outcome is a resource that must reach the
                        subject: how it is sourced, stored, moved and
                        consumed.
    description:        |
                        Makes salient the sources, stocks, transport
                        and rate of consumption. Admits procurement,
                        stockpiling, local generation, rationing and
                        substitution.
    alias:              []
    status:             proposed
    relation:           []

  frame_dependency:
    id_self:            frame_dependency
    guid_self:          frame_ee2dea2f9dd24e8d93ef54e8dde5c83d
    title:              As a dependency problem
    brief:              |
                        The outcome fails when something it depends on
                        fails: what it depends on, and how the
                        dependency is removed or survived.
    description:        |
                        Makes salient single points of failure, shared
                        services and their failure modes. Admits
                        redundancy, diversity of provider, degraded
                        modes and graceful fallback.
    alias:              []
    status:             proposed
    relation:           []

  frame_information:
    id_self:            frame_information
    guid_self:          frame_45a9a910013148b6a6d73d2d7685af53
    title:              As an information problem
    brief:              |
                        The outcome turns on what the subject knows,
                        and when.
    description:        |
                        Makes salient sensing, communication,
                        timeliness and decision. Admits sensors,
                        warnings, reporting, decision aids and
                        training in interpretation.
    alias:              []
    status:             proposed
    relation:           []

  frame_human:
    id_self:            frame_human
    guid_self:          frame_bbc9bc9e25ef476a8e9b909a6b3fa7d4
    title:              As a human factors problem
    brief:              |
                        The outcome turns on what people must do under
                        the conditions, and whether they can.
    description:        |
                        Makes salient workload, fatigue, skill, error
                        and ergonomics. Admits procedures, training,
                        interfaces, staffing and automation of the
                        routine.
    alias:              []
    status:             proposed
    relation:           []

  frame_adversary:
    id_self:            frame_adversary
    guid_self:          frame_e23cafbd7b4846029ba4d34642861ac3
    title:              As an adversary problem
    brief:              |
                        Someone acts against the outcome, and adapts.
    description:        |
                        Makes salient the threat, its means, its cycle
                        of adaptation, and the countermeasure. Admits
                        hardening, deception, denial, counter-action
                        and resilience under attack.
    alias:              []
    status:             proposed
    relation:           []

  frame_sustainment:
    id_self:            frame_sustainment
    guid_self:          frame_870b0a103ef04aaf8be4463091b7b50d
    title:              As a sustainment problem
    brief:              |
                        The outcome must hold over time, through wear,
                        damage and change.
    description:        |
                        Makes salient maintenance, repair, spares,
                        obsolescence and skills retention. Admits
                        maintainability, repair at the point of use,
                        spares and simplification.
    alias:              []
    status:             proposed
    relation:           []

