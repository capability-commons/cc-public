                        Deployment_Budget times.
    term:               run

    avoid:
      - execute

    status:             proposed
    alias:              []
    relation:           []

  verb_produce:
    id_self:            verb_produce
    guid_self:          verb_4f0d7c5709dc43dc81a21cfade91eb88
    title:              Produce
    brief:              |
                        Make an artefact from what is given, as a pure
                        function of it.
    description:        |
                        The object says what is produced and from
                        what: the Fact_Table of the Directory_Tree.
    term:               produce

    avoid:
