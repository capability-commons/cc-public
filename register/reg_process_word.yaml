      - derive
      - build

    status:             proposed
    alias:              []
    relation:           []

  verb_leave:
    id_self:            verb_leave
    guid_self:          verb_d26b2435990547bca08f8c9dc84b29b9
    title:              Leave
    brief:              |
                        Not change something that an action might have
                        changed.
    description:        |
                        The object says what is left and in what
                        state: the Guid of the Item unchanged.
    term:               leave

    avoid:
      - preserve
      - keep
      - retain

    status:             proposed
    alias:              []
    relation:           []

