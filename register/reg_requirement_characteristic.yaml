status:                 draft
title:                  Requirement characteristic register
brief:                  |
                        Register of the characteristics a well formed
                        requirement has, from the INCOSE guide.
description:            |
                        Nine characteristics of an individual
                        statement, C1 to C9, and six of a set, C10 to
                        C15. Each entry paraphrases the guide's
                        definition in its brief and its rationale in
                        its description.
usage:                  |
                        A requirement rule contributes to one or more
                        characteristics by r_contributes_to edges. An
                        eval on requirements implements rules, and
                        through them reaches characteristics; the
                        register is where coverage is read.
note:                   |
                        The characteristics of a set are entered so
                        that the map is whole, though no eval reaches
                        them until a requirement set is an item.

table:

  char_c01_necessary:
    id_self:            char_c01_necessary
    guid_self:          char_f8ba5e4d0cd64b85a6c2ad3a4f8177a3
    title:              C1 Necessary
    brief:              |
                        The statement defines a capability,
                        characteristic, constraint or quality factor
                        needed to satisfy a need, source or higher
                        level requirement.
    description:        |
                        A requirement that could be removed with the
                        rest still sufficient, that other requirements
                        already meet, that traces to nothing, or whose
                        author can give no reason, is not necessary.
                        Every requirement costs development,
                        verification and maintenance, and an
                        unnecessary one constrains the solution for
                        nothing.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c02_appropriate:
    id_self:            char_c02_appropriate
    guid_self:          char_cad5884710504ab383f07b2a9b073b4d
    title:              C2 Appropriate
    brief:              |
                        The intent and amount of detail suit the level
                        of the entity the statement refers to.
    description:        |
                        A requirement stated at the wrong level, more
                        abstract than its entity or prescribing a
                        lower level's design, cannot be verified at
                        the level it sits and constrains what it
                        should not.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c03_unambiguous:
    id_self:            char_c03_unambiguous
    guid_self:          char_ae950089b9cf415b85b080872e2cf9b6
    title:              C3 Unambiguous
    brief:              |
                        The statement can be read in only one way by
                        every intended reader.
    description:        |
                        A requirement is an agreement between two
                        parties and the basis of verification. An
                        agreement neither side can pin down is not
                        one.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c04_complete:
    id_self:            char_c04_complete
    guid_self:          char_e88f829e9bec4efda6125efe7a43c798
    title:              C4 Complete
    brief:              |
                        The statement describes what is required
                        sufficiently to need no further explanation.
    description:        |
                        A statement that needs amplification to
                        implement or to define its verification is not
                        yet a requirement. A functional requirement
                        carries its performance; a conditional one
                        carries its condition.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c05_singular:
    id_self:            char_c05_singular
    guid_self:          char_a26b4bb78b2a4d72b99b4bd1f5dcd914
    title:              C5 Singular
    brief:              |
                        The statement states one capability,
                        characteristic, constraint or quality factor.
    description:        |
                        One thought can be traced, allocated, verified
                        and validated on its own. Two thoughts in one
                        sentence share one verdict and one allocation
                        whether or not they should.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c06_feasible:
    id_self:            char_c06_feasible
    guid_self:          char_656a8a10c8544e38bd0bda601b18dd70
    title:              C6 Feasible
    brief:              |
                        The requirement can be realised within the
                        entity's constraints with acceptable risk.
    description:        |
                        Agreeing to what cannot be done breaks laws of
                        physics, exceeds the budget, or is not
                        verifiable, and costs the project either way.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c07_verifiable:
    id_self:            char_c07_verifiable
    guid_self:          char_1e4360079c474091884e07eb4ad7f27c
    title:              C7 Verifiable
    brief:              |
                        The statement is structured and worded so that
                        its realisation can be verified to the
                        approving authority's satisfaction.
    description:        |
                        A requirement is written to be checked. What
                        cannot be shown met or unmet, in finite time
                        with available means, is a wish.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c08_correct:
    id_self:            char_c08_correct
    guid_self:          char_54d72753a61e4d5b8722326a08cba5bb
    title:              C8 Correct
    brief:              |
                        The statement accurately represents the need,
                        source or higher level requirement it was
                        transformed from.
    description:        |
                        Wrong values, functions or conditions, and
                        omissions, are errors in the agreement itself,
                        and are found late if not here.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c09_conforming:
    id_self:            char_c09_conforming
    guid_self:          char_c15bb106c2a2408ca4192c98250b0f3d
    title:              C9 Conforming
    brief:              |
                        The statement conforms to an approved pattern
                        and style guide.
    description:        |
                        Statements with one look are easier to write,
                        read and review, and a pattern enforces most
                        of the other characteristics by construction.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c10_set_complete:
    id_self:            char_c10_set_complete
    guid_self:          char_6873e7d00f8f45aca2536304920c5412
    title:              C10 Complete, of a set
    brief:              |
                        The set contains every requirement needed and
                        no placeholders.
    description:        |
                        A set with gaps leaves the entity
                        underspecified; a set with TBDs is not yet
                        agreed.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c11_set_consistent:
    id_self:            char_c11_set_consistent
    guid_self:          char_66a03e289b3f49ceb5351f4ff30c3209
    title:              C11 Consistent, of a set
    brief:              |
                        No requirement in the set conflicts with
                        another, and terms and units are used the same
                        way throughout.
    description:        |
                        Two requirements that cannot both be met, or
                        that name one thing two ways, cannot be
                        verified together.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c12_set_feasible:
    id_self:            char_c12_set_feasible
    guid_self:          char_7c47ef27b3cb40fd8ce224839c83ce63
    title:              C12 Feasible, of a set
    brief:              |
                        The set as a whole can be realised within
                        constraints with acceptable risk.
    description:        |
                        Requirements feasible alone may not be
                        feasible together.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c13_set_comprehensible:
    id_self:            char_c13_set_comprehensible
    guid_self:          char_3c6c6ea311fa449e9aa3885b62e11d5e
    title:              C13 Comprehensible, of a set
    brief:              |
                        The set is written so that a reader can
                        understand what is required of the entity as a
                        whole.
    description:        |
                        A set is read by many; its organisation
                        carries meaning the statements alone do not.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c14_set_validatable:
    id_self:            char_c14_set_validatable
    guid_self:          char_506a8cd607f74837b70b2cc3af08eacb
    title:              C14 Able to be validated, of a set
    brief:              |
                        The set can be shown to satisfy the needs it
                        was transformed from.
    description:        |
                        A set is validated against its needs as a
                        statement is verified against itself.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

  char_c15_set_correct:
    id_self:            char_c15_set_correct
    guid_self:          char_be4656101f7b4e17b129b6efcf959210
    title:              C15 Correct, of a set
    brief:              |
                        The set accurately represents the needs and
                        sources it was transformed from, together.
    description:        |
                        Correct statements can still, together,
                        misrepresent what was needed.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_is_taken_from
        guid_relation:  r_63d66fa822d04128823be90fa6daee1e
        id_target:      doc_incose_gtwr
        guid_target:    doc_fd38b7ccd8e941ba8a7cc8073d1b6dcb

