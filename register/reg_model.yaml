status:                 draft
title:                  Model register
brief:                  |
                        The controlled language models: each one that
                        an annotation, a deployment or a confidence
                        row may name.
description:            |
                        One entry per model, keyed by readable id. An
                        entry says the name a runtime resolves the
                        model by and the family it belongs to.
usage:                  |
                        An annotation names the model that asserted it
                        by r_is_asserted_by. A deployment and a
                        confidence row spell the same name in a field,
                        and are not yet held to an entry.
note:                   |
                        Entered when something in the tree names it,
                        and kept after nothing does: a confidence row
                        measured under a model no longer offered still
                        names it.

