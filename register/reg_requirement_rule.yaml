  rule_s08_measurable_comparison:
    id_self:            rule_s08_measurable_comparison
    guid_self:          rule_afa2d9ba89614beb87752ee57fe74edb
    title:              S8 Measurable comparison
    brief:              |
                        Give every comparative and superlative a point
                        of reference and a measure.
    description:        |
                        Faster, better, easier and the biggest compare
                        to something, and the sentence deletes what.
                        Ask compared with what, by how much, and how
                        fulfilment is measured at acceptance, and
                        state the value and the means of measuring it.
    follows:            |
                        The Library_System shall complete the printing
                        of a Library_Card within 3 seconds of the
                        Librarian starting it.
    breaks:             |
                        The Library_System shall print the
                        Library_Card quickly.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
