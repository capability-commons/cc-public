  rule_s12_vague_nouns:
    id_self:            rule_s12_vague_nouns
    guid_self:          rule_05345b8a8cb448e0b1da7086d1ac2a9a
    title:              S12 Vague nouns
    brief:              |
                        Question each noun that names its objects or
                        actors without a clear reference.
    description:        |
                        The data, the user, the message and the
                        functionality name a set that cannot be told.
                        Ask which data, which user, and replace the
                        noun with the one that says exactly which
                        objects or actors the requirement is on.
    follows:            |
                        After the Librarian has started the
                        Statistics_Calculation, the Library_System
                        shall display the Item_Statistics to the
                        Librarian as a chart.
    breaks:             |
                        The data has to be graphically displayed to
                        the user.
    alias:              []
    status:             proposed

    relation:

