  rule_r30_unique_expression:
    id_self:            rule_r30_unique_expression
    guid_self:          rule_7e0d6454ed5e4b44903075d282af4ee5
    title:              R30 Unique expression
    brief:              |
                        Express each requirement once.
    description:        |
                        Duplicates and near duplicates are allocated
                        and verified twice and drift apart. Defined
                        terms and classification make them findable.
    follows:            |
                        The Reporter shall generate a Financial_Report
                        containing the information defined in Standard
                        xyz.
    breaks:             |
                        Two statements in one set: the Reporter shall
                        generate a financial report; the Reporter
                        shall generate a report of financial
                        transactions containing the information
                        defined in Standard xyz.
