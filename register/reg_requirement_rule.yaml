  rule_s16_exceptions:
    id_self:            rule_s16_exceptions
    guid_self:          rule_86eb6687695c41b6be2b0736294c5ac6
    title:              S16 Exceptions
    brief:              |
                        Ask whether the entity can always give the
                        behaviour, and write what it does when it
                        cannot.
    description:        |
                        Shall, must and it is necessary that describe
                        the usual case. A neighbouring system fails to
                        answer, data fails to arrive, a connection
                        drops: ask which situations stop the behaviour
                        and what the entity does then, and write each
                        as a further requirement or an extension of
                        this one.
    follows:            |
                        If the Library_System cannot connect to the
                        Dispatch_System, the Library_System shall
                        display the message Connection_Failed to the
                        Librarian.
    breaks:             |
                        The Library_System shall send each Order for a
                        new Library_Item to the Dispatch_System.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c04_complete
