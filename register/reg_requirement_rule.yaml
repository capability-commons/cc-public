  rule_r14_correct_punctuation:
    id_self:            rule_r14_correct_punctuation
    guid_self:          rule_4123675536c64ced88a17aeb99b8319c
    title:              R14 Correct punctuation
    brief:              |
                        Use correct punctuation, and as little as the
                        sentence needs.
    description:        |
                        A comma in the wrong place attaches a
                        performance to the wrong clause. More
                        punctuation is more places to misread.
    follows:            |
                        The Navigation_Beacon shall provide
                        Augmentation_Data to each Maritime_User in
                        Harbor_Approach, at an accuracy of less than
                        20 meters.
    breaks:             |
                        The Navigation_Beacon shall provide
                        Augmentation_Data to each Maritime_User, in
                        Harbor_Approach at an accuracy of less than 20
                        meters.
    alias:              []
