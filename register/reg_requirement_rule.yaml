    guid_self:          rule_9e9a0e75ed48436692ed23ae3dc78cba
    title:              R25 Headings
    brief:              |
                        Do not rely on a heading for the statement to
                        make sense.
    description:        |
                        A requirement in a tool has no heading. The
                        statement carries its own subject and context.
    follows:            |
                        When the Alert_Trigger occurs, the Aircraft
                        shall sound an alert having the
                        characteristics defined in Alert_Standard xyz
                        for greater than 20 minutes.
    breaks:             |
                        4.1 The Aircraft shall sound it for greater
                        than 20 minutes.
