  rule_r40_decimal_format:
    id_self:            rule_r40_decimal_format
    guid_self:          rule_672b7110c447408b94d27ac9baf9fb39
    title:              R40 Decimal format
    brief:              |
                        Use one decimal format and one number of
                        significant digits throughout.
    description:        |
                        9.499,99 and 0.99 in one set are two
                        conventions; .99 without its zero is a third.
                        Precision beyond need costs design and
                        verification.
    follows:            |
                        The Radio shall have an MTBF of greater than
                        or equal to 9,499.99 hours, and the Radio
                        shall consume less than or equal to 0.99
                        watts.
    breaks:             |
                        The Radio shall have an MTBF of greater than
                        or equal to 9.499,99 hours, and the Radio
                        shall consume less than or equal to .99 watts.
    alias:              []
    status:             proposed

