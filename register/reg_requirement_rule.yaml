  rule_s07_adjective_questions:
    id_self:            rule_s07_adjective_questions
    guid_self:          rule_a24a0d9e156b409aa1d819a55e316ae5
    title:              S7 Questions on the adjective or adverb
    brief:              |
                        Ask of each adjective or adverb for whom, for
                        what and under which condition the
                        characteristic holds.
    description:        |
                        A characteristic such as secure, intuitive or
                        quick is stated by an adjective or adverb and
                        needs more: what is to have the quality, for
                        whom, against what, under which conditions.
                        Ask, and add what is relevant; where the
                        answer is a quality of its own, write it as a
                        separate requirement.
    follows:            |
                        The User_Interface of the Library_System shall
                        be operable by the Librarian without training.
    breaks:             |
                        The Library_System shall be intuitively
                        operable.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
