  rule_r17_oblique_symbol:
    id_self:            rule_r17_oblique_symbol
    guid_self:          rule_17d35a34227b4ed5bd792781a1b5106b
    title:              R17 Oblique symbol
    brief:              |
                        Avoid the slash. Open/close means open, close,
                        or both, and the reader chooses.
    description:        |
                        A slash has too many meanings. A unit like
                        km/h and a ratio are the exceptions.
    follows:            |
                        When the Close_Command is received, the
                        User_Management_System shall close the
                        User_Account in less than 1 second.
    breaks:             |
                        The User_Management_System shall open/close
                        the User_Account in less than 1 second.
    alias:              []
    status:             proposed

