  rule_r28_multiple_conditions:
    id_self:            rule_r28_multiple_conditions
    guid_self:          rule_290d3f1f02c04f959278e56a073029c6
    title:              R28 Multiple conditions
    brief:              |
                        Where several conditions govern one action,
                        say whether all must hold or any one, or write
                        one statement per condition.
    description:        |
                        A list of conditions before an action does not
                        say whether it is a conjunction or a
                        disjunction, and one failing condition fails
                        the whole.
    follows:            |
                        The Audit_System shall change the Action_Item
                        status requested by the Audit_Clerk when the
                        Audit_Clerk originated the Action_Item.
    breaks:             |
                        The Audit_Clerk shall be able to change the
                        status of the action item when: the
                        Audit_Clerk originated the item; the
                        Audit_Clerk is the actionee; and the
                        Audit_Clerk is the reviewer.
    alias:              []
    status:             proposed

