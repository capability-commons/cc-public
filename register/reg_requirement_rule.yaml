  rule_r28_multiple_conditions:
    id_self:            rule_r28_multiple_conditions
    guid_self:          rule_290d3f1f02c04f959278e56a073029c6
    title:              R28 Multiple conditions
    brief:              |
                        Where several conditions govern one action,
                        say whether all must hold or any one, or write
                        one statement per condition.
    description:        |
                        A list of conditions before an action does not
                        say whether it is a conjunction or a
                        disjunction, and one failing condition fails
                        the whole.
    follows:            |
                        The Audit_System shall change the Action_Item
                        status requested by the Audit_Clerk when the
                        Audit_Clerk originated the Action_Item.
    breaks:             |
                        The Audit_Clerk shall be able to change the
                        status of the action item when: the
                        Audit_Clerk originated the item; the
                        Audit_Clerk is the actionee; and the
                        Audit_Clerk is the reviewer.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
        guid_target:    char_a26b4bb78b2a4d72b99b4bd1f5dcd914

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
        guid_target:    char_1e4360079c474091884e07eb4ad7f27c

  rule_r29_classification:
    id_self:            rule_r29_classification
    guid_self:          rule_63309db84828481f8897e231613ea604
    title:              R29 Classification
    brief:              |
                        Classify each requirement by the aspect of the
                        system it addresses.
    description:        |
                        A category lets a set be sorted, filtered and
                        read by those who need part of it, and shows
                        where a kind of requirement is missing or
                        doubled.
    follows:            |
                        A requirement carrying category function,
                        beside others carrying fit, form, quality or
                        compliance.
    breaks:             |
                        A set of requirements with no category on any
                        of them.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c10_set_complete
        guid_target:    char_6873e7d00f8f45aca2536304920c5412

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c11_set_consistent
        guid_target:    char_66a03e289b3f49ceb5351f4ff30c3209

  rule_r30_unique_expression:
    id_self:            rule_r30_unique_expression
    guid_self:          rule_7e0d6454ed5e4b44903075d282af4ee5
    title:              R30 Unique expression
    brief:              |
                        Express each requirement once.
    description:        |
                        Duplicates and near duplicates are allocated
                        and verified twice and drift apart. Defined
                        terms and classification make them findable.
    follows:            |
                        The Reporter shall generate a Financial_Report
                        containing the information defined in Standard
                        xyz.
    breaks:             |
                        Two statements in one set: the Reporter shall
                        generate a financial report; the Reporter
                        shall generate a report of financial
                        transactions containing the information
                        defined in Standard xyz.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c11_set_consistent
        guid_target:    char_66a03e289b3f49ceb5351f4ff30c3209

  rule_r31_solution_free:
    id_self:            rule_r31_solution_free
    guid_self:          rule_5afd2828117949b0b2977edfb779e214
    title:              R31 Solution free
    brief:              |
                        State what is required, not how it is to be
                        done, unless the constraint is itself
                        required.
    description:        |
                        Traffic lights are a solution; the requirement
                        is that traffic stop when a pedestrian
                        crosses. Asking for what purpose reveals the
                        requirement and leaves the design free. A
                        mandated engine or report template is a real
                        constraint and belongs.
    follows:            |
                        When a Pedestrian signals intent to cross at
                        the Intersection, the Traffic_Control_System
                        shall issue a Traffic_Stop_Signal for
                        Average_Pedestrian_Crossing_Time.
    breaks:             |
                        Traffic lights shall be used to control
                        traffic at the intersection.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c02_appropriate
        guid_target:    char_cad5884710504ab383f07b2a9b073b4d

  rule_r32_universal_qualification:
    id_self:            rule_r32_universal_qualification
    guid_self:          rule_7e25e8a165ec4f1b93035f3f092cf93a
    title:              R32 Universal qualification
    brief:              |
                        Say each, not all, any or both.
    description:        |
                        All may mean the set or every member, and is
                        hard to verify as a closed set. Each names
                        every member and is verified one at a time.
    follows:            |
                        The Operation_Logger shall record each
                        Warning_Message.
    breaks:             |
                        The Operation_Logger shall record any (or all)
                        warning messages.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
        guid_target:    char_1e4360079c474091884e07eb4ad7f27c

  rule_r33_range_of_values:
    id_self:            rule_r33_range_of_values
    guid_self:          rule_0d71a023cd66466aad9d31e15023579f
    title:              R33 Range of values
    brief:              |
                        Give each quantity a range or a limit, with a
                        tolerance the entity can be verified against.
    description:        |
                        A single point value cannot be met exactly or
                        measured exactly. A range says what is
                        acceptable and describes the trade space; no
                        tighter than needed, since tolerance costs.
    follows:            |
                        When in operations, the Pumping_Station shall
                        maintain Water_Flow at 100 plus or minus 10
                        liters per second for greater than 30 minutes.
    breaks:             |
                        The Pumping_Station shall maintain the flow of
                        water at 100 liters per second for 30 minutes.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c06_feasible
        guid_target:    char_656a8a10c8544e38bd0bda601b18dd70

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
        guid_target:    char_1e4360079c474091884e07eb4ad7f27c

  rule_r34_measurable_performance:
    id_self:            rule_r34_measurable_performance
    guid_self:          rule_a998bbc89e7c44a9b2732bd7a3770bb2
    title:              R34 Measurable performance
    brief:              |
                        Give a specific, measurable performance target
                        rather than a word for it.
    description:        |
                        Fast, minimum, prompt, user friendly and best
                        practice are not measured and not verifiable.
                        A number in a feasible range is.
    follows:            |
                        The Radio shall consume less than or equal to
                        50 watts of mains power.
    breaks:             |
                        The Radio shall use minimum power.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
        guid_target:    char_1e4360079c474091884e07eb4ad7f27c

  rule_r35_temporal_dependencies:
    id_self:            rule_r35_temporal_dependencies
    guid_self:          rule_c04fd033f9a845b4bca99e7ab486a387
    title:              R35 Temporal dependencies
    brief:              |
                        State timing explicitly rather than with
                        eventually, until, before, after, once,
                        simultaneous.
    description:        |
                        An indefinite temporal word is non specific
                        timing, and non specific timing is not
                        verifiable.
    follows:            |
                        The Pump shall remove greater than 99 percent
                        of the Fluid from the Tank in less than 3 days
                        of continuous operation.
    breaks:             |
                        Continual operation of the pump shall
                        eventually result in the tank being empty.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
        guid_target:    char_1e4360079c474091884e07eb4ad7f27c

  rule_r36_consistent_terms_and_units:
    id_self:            rule_r36_consistent_terms_and_units
    guid_self:          rule_13082bf7ae2d4f66a21af07f7a2227e4
    title:              R36 Consistent terms and units
    brief:              |
                        Use one term and one unit for each thing,
                        throughout the set and its models.
    description:        |
                        Radio, Receiver and Terminal for one subject
                        read as three subjects. A glossary defines the
                        term once; the set uses it every time.
                        Synonyms are not accepted.
    follows:            |
                        When the Inlet_Valve is connected to the
                        Water_Source, the Control_Subsystem shall open
                        the Inlet_Valve.
    breaks:             |
                        When the Input_Valve is connected to the
                        Water_Source, the Control_Subsystem shall open
                        the Inlet_Valve.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c11_set_consistent
        guid_target:    char_66a03e289b3f49ceb5351f4ff30c3209

  rule_r37_acronyms:
    id_self:            rule_r37_acronyms
    guid_self:          rule_248f53da518f428ab5ade65f7285c77f
    title:              R37 Acronyms
    brief:              |
                        Use one form of each acronym, defined in the
                        glossary, or none.
    description:        |
                        CP and CMDP for one command post read as two.
                        In a tool there is no first use to define at,
                        so the glossary defines it.
    follows:            |
                        Every statement in the set that names the
                        command post writes CMDP.
    breaks:             |
                        One statement writes CP and another CMDP for
                        the same command post.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c11_set_consistent
        guid_target:    char_66a03e289b3f49ceb5351f4ff30c3209

  rule_r38_abbreviations:
    id_self:            rule_r38_abbreviations
    guid_self:          rule_6d0ee45ded694f76b5a51b1cc7145589
    title:              R38 Abbreviations
    brief:              |
                        Avoid abbreviations unless defined and single
                        in meaning.
    description:        |
                        An abbreviation with two meanings, op for
                        operation and for operator, is ambiguous in
                        the sentence that uses it.
    follows:            |
                        The Operator shall confirm the Operation.
    breaks:             |
                        The op shall confirm the op.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
