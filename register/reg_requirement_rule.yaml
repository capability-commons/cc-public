  rule_r39_style_guide:
    id_self:            rule_r39_style_guide
    guid_self:          rule_d52befb0aba9457795103b3a453590f3
    title:              R39 Style guide
    brief:              |
                        Write to a project wide style guide that fixes
                        the patterns, attributes and terms.
    description:        |
                        A style guide is what makes statements alike
                        enough to read, review and manage as a set,
                        and is the schema of the tool that holds them.
    follows:            |
                        A set written to one style guide, its patterns
                        and attributes as the guide fixes them.
    breaks:             |
                        A set in which each author chose a form.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c09_conforming
        guid_target:    char_c15bb106c2a2408ca4192c98250b0f3d

  rule_r40_decimal_format:
    id_self:            rule_r40_decimal_format
    guid_self:          rule_672b7110c447408b94d27ac9baf9fb39
    title:              R40 Decimal format
    brief:              |
                        Use one decimal format and one number of
                        significant digits throughout.
    description:        |
                        9.499,99 and 0.99 in one set are two
                        conventions; .99 without its zero is a third.
                        Precision beyond need costs design and
                        verification.
    follows:            |
                        The Radio shall have an MTBF of greater than
                        or equal to 9,499.99 hours, and the Radio
                        shall consume less than or equal to 0.99
                        watts.
    breaks:             |
                        The Radio shall have an MTBF of greater than
                        or equal to 9.499,99 hours, and the Radio
                        shall consume less than or equal to .99 watts.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c11_set_consistent
        guid_target:    char_66a03e289b3f49ceb5351f4ff30c3209

  rule_r41_related_requirements:
    id_self:            rule_r41_related_requirements
    guid_self:          rule_eca8986386d743c8bbe16291241763d7
    title:              R41 Related requirements
    brief:              |
                        Group related requirements together.
    description:        |
                        Requirements grouped by type, function,
                        scenario or interface show what is missing,
                        doubled or in conflict, which scattered ones
                        hide.
    follows:            |
                        Requirements held by category, and within a
                        category by the function they address.
    breaks:             |
                        Requirements held in the order they were
                        written.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c13_set_comprehensible
        guid_target:    char_3c6c6ea311fa449e9aa3885b62e11d5e

  rule_r42_structured_sets:
    id_self:            rule_r42_structured_sets
    guid_self:          rule_70d5fe532ae346a3b5476b067e3f9fde
    title:              R42 Structured sets
    brief:              |
                        Organise a set of requirements to a defined
                        structure.
    description:        |
                        A whole set is understood only when its
                        organisation carries meaning, and traceability
                        across a structured set finds repetition and
                        conflict.
    follows:            |
                        A set organised by function, fit, form,
                        quality and compliance.
    breaks:             |
                        A set with no structure beyond its order.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c13_set_comprehensible
        guid_target:    char_3c6c6ea311fa449e9aa3885b62e11d5e

