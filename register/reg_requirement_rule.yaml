  rule_s18_implicit_assumptions:
    id_self:            rule_s18_implicit_assumptions
    guid_self:          rule_ae5805e311234b2ebd7c2f3e7c3b9d94
    title:              S18 Implicit assumptions
    brief:              |
                        Find what the requirement takes for granted,
                        and write it as a requirement where none
                        exists.
    description:        |
                        A temporal or logical sequence, or a noun
                        qualified by a word such as entered, saved or
                        checked, refers to a functionality the
                        sentence assumes. Find the signal, name the
                        functionality it refers to, check whether a
                        requirement describes it, and write one where
                        none does.
    follows:            |
                        The Library_System shall provide the Librarian
                        with the ability to enter the
                        Registration_Data of a new Library_User.
    breaks:             |
                        After the Library_System has saved the entered
                        Registration_Data of a new Library_User, the
