  rule_r15_logical_expressions:
    id_self:            rule_r15_logical_expressions
    guid_self:          rule_b4a4acfb48164100a34dd7d544fe5582
    title:              R15 Logical expressions
    brief:              |
                        Write a logical condition with a convention:
                        [X AND Y], [X OR Y], NOT [X], the operator in
                        capitals.
    description:        |
                        A lower case and joins two thoughts as often
                        as two conditions. A marked operator says
                        which, and and/or says neither.
    follows:            |
                        When [the Cruise_Control is Engaged] AND [the
                        Accelerator is Applied], the
                        Engine_Management_System shall disengage the
                        Speed_Control_Subsystem within 500
                        milliseconds.
    breaks:             |
                        The Engine_Management_System shall disengage
                        the Speed_Control_Subsystem when the
                        Cruise_Control is engaged, and the Driver
                        applies the Accelerator.
    alias:              []
    status:             proposed

    relation:

