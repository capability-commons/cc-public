  rule_s05_one_sentence_per_verb:
    id_self:            rule_s05_one_sentence_per_verb
    guid_self:          rule_3008b45932734c659cecd2589504399d
    title:              S5 One sentence per process verb
    brief:              |
                        Write exactly one requirement sentence for
                        each process verb.
    description:        |
                        Two verbs in one sentence are two obligations
                        that need different information, are
                        prioritised differently and are verified
                        separately. Split the sentence so that each
                        has one main verb, and analyse each on its
                        own.
    follows:            |
                        The Library_System shall provide the Librarian
                        with the ability to enter the Customer_Data of
                        a new Customer.
    breaks:             |
                        The Library_System shall provide the Librarian
                        with the ability to enter and save the
                        Customer_Data of a new Customer.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
