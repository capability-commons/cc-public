  rule_r39_style_guide:
    id_self:            rule_r39_style_guide
    guid_self:          rule_d52befb0aba9457795103b3a453590f3
    title:              R39 Style guide
    brief:              |
                        Write to a project wide style guide that fixes
                        the patterns, attributes and terms.
    description:        |
                        A style guide is what makes statements alike
                        enough to read, review and manage as a set,
                        and is the schema of the tool that holds them.
    follows:            |
                        A set written to one style guide, its patterns
                        and attributes as the guide fixes them.
    breaks:             |
                        A set in which each author chose a form.
    alias:              []
    status:             proposed

    relation:

