  rule_r10_superfluous_infinitives:
    id_self:            rule_r10_superfluous_infinitives
    guid_self:          rule_c6fcff07a7fe42d3ac1b3a67431fc555
    title:              R10 Superfluous infinitives
    brief:              |
                        Drop be able to, be capable of, be designed
                        to. Say what the entity shall do, and when.
    description:        |
                        Able to is met by one success in a hundred
                        tries. If the action applies only under a
                        condition, state the condition rather than
                        hedging the verb.
    follows:            |
                        When the Launch_Command is received, the
                        Weapon_System shall store the Location of each
                        Ordnance.
    breaks:             |
                        The Weapon_System shall be able to store the
                        location of each Ordnance.
    alias:              []
    status:             proposed

    relation:

