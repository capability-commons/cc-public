  rule_r33_range_of_values:
    id_self:            rule_r33_range_of_values
    guid_self:          rule_0d71a023cd66466aad9d31e15023579f
    title:              R33 Range of values
    brief:              |
                        Give each quantity a range or a limit, with a
                        tolerance the entity can be verified against.
    description:        |
                        A single point value cannot be met exactly or
                        measured exactly. A range says what is
                        acceptable and describes the trade space; no
                        tighter than needed, since tolerance costs.
    follows:            |
                        When in operations, the Pumping_Station shall
                        maintain Water_Flow at 100 plus or minus 10
                        liters per second for greater than 30 minutes.
    breaks:             |
                        The Pumping_Station shall maintain the flow of
                        water at 100 liters per second for 30 minutes.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
