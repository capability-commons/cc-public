  rule_r18_single_thought:
    id_self:            rule_r18_single_thought
    guid_self:          rule_0d723449138e42b1aa2851878dad2638
    title:              R18 Single thought sentence
    brief:              |
                        One sentence, one subject, one main verb, one
                        object, qualified by its clauses.
    description:        |
                        A thought is what can be traced, allocated and
                        verified on its own. Two verbs share one
                        verdict whether or not they should, and a
                        qualification on the first may not apply to
                        the second.
    follows:            |
                        When in the Active_State, the Record_Subsystem
                        shall record the Location of each Line_Item.
    breaks:             |
                        When in the Active_State, the Record_Subsystem
                        shall display the Name of each Line_Item and
                        shall record the Location of each Line_Item,
                        without obscuring the User_ID.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
        guid_target:    char_a26b4bb78b2a4d72b99b4bd1f5dcd914

  rule_r19_combinators:
    id_self:            rule_r19_combinators
    guid_self:          rule_3a0c9e1fd28d4442b8b242e94d25dede
    title:              R19 Combinators
    brief:              |
                        Avoid words that join thoughts: and, or, then,
                        unless, but, as well as, however, otherwise.
    description:        |
                        A combinator almost always marks two thoughts
                        in one statement. Split them, or if they are
                        conditions, write a logical expression.
    follows:            |
                        The Vehicle shall display the Location of the
                        Lead_Vehicle per Display_Standard xyz.
    breaks:             |
                        The Vehicle shall display the Location and
                        Identity of the Lead_Vehicle.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
        guid_target:    char_a26b4bb78b2a4d72b99b4bd1f5dcd914

  rule_r20_purpose_phrases:
    id_self:            rule_r20_purpose_phrases
    guid_self:          rule_d19a53bf228d43259f7799301a5185cd
    title:              R20 Purpose phrases
    brief:              |
                        Leave out so that, in order to, thus allowing.
                        Purpose goes in the rationale.
    description:        |
                        Purpose is worth recording and is not part of
                        the obligation. In the statement it adds words
                        that cannot be verified and may be read as a
                        condition.
    follows:            |
                        The Record_Subsystem shall display the Name of
                        each Line_Item per Display_Standard xyz.
    breaks:             |
                        The Record_Subsystem shall display the Name of
                        each Line_Item so that the Operator can
                        confirm that it is the correct Item.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

  rule_r21_parentheses:
    id_self:            rule_r21_parentheses
    guid_self:          rule_318c2838992c40038af063ea2de2f5be
    title:              R21 Parentheses
    brief:              |
                        Avoid parentheses and brackets holding
                        subordinate text.
    description:        |
                        What sits in brackets is usually either
                        superfluous or rationale, and sometimes a
                        second requirement. Brackets used by
                        convention for a logical expression are the
                        exception.
    follows:            |
                        If the Water_Temperature increases to greater
                        than 85 degrees Celsius, the Control_Unit
                        shall disconnect power from the Boiler within
                        100 milliseconds.
    breaks:             |
                        When the Water_Temperature exceeds 85 degrees
                        Celsius (usually towards the end of the
                        boiling cycle), the Control_Unit shall
                        disconnect power from the Boiler.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

  rule_r22_enumeration:
    id_self:            rule_r22_enumeration
    guid_self:          rule_480c680978204212a1d88256de145d90
    title:              R22 Enumeration
    brief:              |
                        Name each member of a set in its own statement
                        rather than a group noun for the set.
    description:        |
                        Temperature related functions leaves
                        membership in doubt, and each member would be
                        allocated and verified differently. A glossary
                        term that defines the set is the exception.
    follows:            |
                        The Thermal_Control_System shall maintain the
                        System_Temperature between 95 and 98 degrees
                        Celsius.
    breaks:             |
                        The Thermal_Control_System shall manage
                        temperature related functions.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
        guid_target:    char_a26b4bb78b2a4d72b99b4bd1f5dcd914

  rule_r23_supporting_diagram:
    id_self:            rule_r23_supporting_diagram
    guid_self:          rule_8e02a59269ac4980b8088b8c3431eafd
    title:              R23 Supporting diagram, model or ICD
    brief:              |
                        Where behaviour is complex, refer to a
                        diagram, model or interface control document
                        rather than describing it in words.
    description:        |
                        Four timing values in one sentence read as
                        four thoughts. A drawing shows them as one,
                        and the statement stays singular.
    follows:            |
                        Upon turn on, the Power_Supply shall supply
                        the initial voltage with the characteristics
                        shown in Drawing xxxx.
    breaks:             |
                        The Control_System shall close Valves A AND B
                        within 5 seconds of the temperature exceeding
                        95 degrees Celsius AND within 2 seconds of
                        each other.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
        guid_target:    char_a26b4bb78b2a4d72b99b4bd1f5dcd914

  rule_r24_pronouns:
    id_self:            rule_r24_pronouns
    guid_self:          rule_647c41588f6d465d9dc324ed8794b183
    title:              R24 Pronouns
    brief:              |
                        Avoid pronouns, personal and indefinite.
                        Repeat the noun.
    description:        |
                        It, this and his point at something in another
                        sentence, and sentences are reordered. Some,
                        any and several point at nothing in
                        particular.
    follows:            |
                        At least 8 hours before the Driver_Shift, the
                        Controller shall send the Driver_Itinerary to
                        the Driver.
    breaks:             |
                        The controller shall send the driver his
                        itinerary. It shall be delivered at least 8
                        hours prior to his shift.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c04_complete
        guid_target:    char_e88f829e9bec4efda6125efe7a43c798

  rule_r25_headings:
    id_self:            rule_r25_headings
    guid_self:          rule_9e9a0e75ed48436692ed23ae3dc78cba
    title:              R25 Headings
    brief:              |
                        Do not rely on a heading for the statement to
                        make sense.
    description:        |
                        A requirement in a tool has no heading. The
                        statement carries its own subject and context.
    follows:            |
                        When the Alert_Trigger occurs, the Aircraft
                        shall sound an alert having the
                        characteristics defined in Alert_Standard xyz
                        for greater than 20 minutes.
    breaks:             |
                        4.1 The Aircraft shall sound it for greater
                        than 20 minutes.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c04_complete
        guid_target:    char_e88f829e9bec4efda6125efe7a43c798

  rule_r26_absolutes:
    id_self:            rule_r26_absolutes
    guid_self:          rule_85be3b32edeb48b4acd4783e89421877
    title:              R26 Absolutes
    brief:              |
                        Avoid unachievable absolutes: 100 percent,
                        always, never, all.
    description:        |
                        An absolute cannot be built or verified in
                        finite time. A bound with a period can.
    follows:            |
                        The Aircraft shall have an Availability of
                        greater than or equal to 98 percent during
                        Operating_Hours.
    breaks:             |
                        The Aircraft shall have 100 percent
                        availability.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c06_feasible
        guid_target:    char_656a8a10c8544e38bd0bda601b18dd70

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c07_verifiable
        guid_target:    char_1e4360079c474091884e07eb4ad7f27c

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c08_correct
        guid_target:    char_54d72753a61e4d5b8722326a08cba5bb

  rule_r27_explicit_conditions:
    id_self:            rule_r27_explicit_conditions
    guid_self:          rule_548a28937366472ea9d40eac1094811a
    title:              R27 Explicit conditions
    brief:              |
                        State the condition under which the
                        requirement applies, in the statement, every
                        time.
    description:        |
                        A condition left to context is lost when the
                        statement moves. Repeat it in each statement
                        it governs rather than stating it once over a
                        list.
    follows:            |
                        In the event of Fire_Detection, the
                        Fire_Control_Subsystem shall set the
                        Free_Access_Mode to ON within 500
                        milliseconds.
    breaks:             |
                        The Free_Access_Mode shall be set to ON within
                        500 milliseconds.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c04_complete
        guid_target:    char_e88f829e9bec4efda6125efe7a43c798

