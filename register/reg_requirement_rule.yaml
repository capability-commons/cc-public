  rule_r12_correct_grammar:
    id_self:            rule_r12_correct_grammar
    guid_self:          rule_d7dd3f0bbf40495192bda73975df6492
    title:              R12 Correct grammar
    brief:              |
                        Use correct grammar.
    description:        |
                        Grammar is how a reader parses intent, and a
                        reader working in a second language relies on
                        it. A misplaced only or each changes what is
                        required.
    follows:            |
                        The Weapon_System shall store the Location of
                        each Ordnance.
    breaks:             |
                        The Weapon_System shall storing the location
                        of all ordnance.
    alias:              []
    status:             proposed

