    id_self:            rule_r13_correct_spelling
    guid_self:          rule_3d4a2bc9531246a3b46014f74fe18a2f
    title:              R13 Correct spelling
    brief:              |
                        Use correct spelling, and one spelling and
                        capitalisation for each term.
    description:        |
                        Ordinance is law; ordnance is ammunition. A
                        checker does not know which was meant.
    follows:            |
