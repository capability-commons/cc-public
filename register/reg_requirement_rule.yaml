  rule_r02_active_voice:
    id_self:            rule_r02_active_voice
    guid_self:          rule_4216ddff3237431b8d508d6c6ad0fb3a
    title:              R2 Active voice
    brief:              |
                        Use the active voice with the responsible
                        entity as the subject of the sentence.
    description:        |
                        The entity that must act is the one verified.
                        A passive statement leaves the actor unnamed
                        or at the end, and a reader cannot tell what
                        to verify.
    follows:            |
                        The Accounting_System shall confirm the
                        Customer_Identity.
    breaks:             |
                        The Identity of the Customer shall be
                        confirmed.
    alias:              []
    status:             proposed

    relation:

