  rule_r41_related_requirements:
    id_self:            rule_r41_related_requirements
    guid_self:          rule_eca8986386d743c8bbe16291241763d7
    title:              R41 Related requirements
    brief:              |
                        Group related requirements together.
    description:        |
                        Requirements grouped by type, function,
                        scenario or interface show what is missing,
                        doubled or in conflict, which scattered ones
                        hide.
    follows:            |
                        Requirements held by category, and within a
                        category by the function they address.
    breaks:             |
                        Requirements held in the order they were
                        written.
    alias:              []
    status:             proposed

