  rule_r35_temporal_dependencies:
    id_self:            rule_r35_temporal_dependencies
    guid_self:          rule_c04fd033f9a845b4bca99e7ab486a387
    title:              R35 Temporal dependencies
    brief:              |
                        State timing explicitly rather than with
                        eventually, until, before, after, once,
                        simultaneous.
    description:        |
                        An indefinite temporal word is non specific
                        timing, and non specific timing is not
                        verifiable.
    follows:            |
                        The Pump shall remove greater than 99 percent
                        of the Fluid from the Tank in less than 3 days
                        of continuous operation.
    breaks:             |
                        Continual operation of the pump shall
                        eventually result in the tank being empty.
    alias:              []
    status:             proposed

