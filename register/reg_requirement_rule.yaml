  rule_r38_abbreviations:
    id_self:            rule_r38_abbreviations
    guid_self:          rule_6d0ee45ded694f76b5a51b1cc7145589
    title:              R38 Abbreviations
    brief:              |
                        Avoid abbreviations unless defined and single
                        in meaning.
    description:        |
                        An abbreviation with two meanings, op for
                        operation and for operator, is ambiguous in
                        the sentence that uses it.
    follows:            |
                        The Operator shall confirm the Operation.
    breaks:             |
                        The op shall confirm the op.
    alias:              []
    status:             proposed

