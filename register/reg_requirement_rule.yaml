  rule_r29_classification:
    id_self:            rule_r29_classification
    guid_self:          rule_63309db84828481f8897e231613ea604
    title:              R29 Classification
    brief:              |
                        Classify each requirement by the aspect of the
                        system it addresses.
    description:        |
                        A category lets a set be sorted, filtered and
                        read by those who need part of it, and shows
                        where a kind of requirement is missing or
                        doubled.
    follows:            |
                        A requirement carrying category function,
                        beside others carrying fit, form, quality or
                        compliance.
    breaks:             |
                        A set of requirements with no category on any
                        of them.
    alias:              []
    status:             proposed

