  rule_r32_universal_qualification:
    id_self:            rule_r32_universal_qualification
    guid_self:          rule_7e25e8a165ec4f1b93035f3f092cf93a
    title:              R32 Universal qualification
    brief:              |
                        Say each, not all, any or both.
    description:        |
                        All may mean the set or every member, and is
                        hard to verify as a closed set. Each names
                        every member and is verified one at a time.
    follows:            |
                        The Operation_Logger shall record each
                        Warning_Message.
    breaks:             |
                        The Operation_Logger shall record any (or all)
                        warning messages.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
