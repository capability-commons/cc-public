  rule_s03_nominalisation:
    id_self:            rule_s03_nominalisation
    guid_self:          rule_90e0abaa12eb429aa63aa873c4e0de3a
    title:              S3 Nominalisation
    brief:              |
                        Resolve each nominalisation: a noun that
                        stands for a process.
    description:        |
                        A noun such as registration, return or
                        notification folds a whole process into one
                        word and drops its steps, its actor and its
                        exceptions. Ask what process the noun stands
                        for and write it with a main verb, in one or
                        more requirements, or define the noun in the
                        glossary where the process is already
                        specified elsewhere. A noun that names an
                        object rather than a process may stay.
    follows:            |
                        The Library_System shall archive the Item_Data
                        of each Library_Item that the Librarian has
                        withdrawn.
    breaks:             |
                        The Library_System shall allow for archiving.
    alias:              []
    status:             proposed

