  rule_r04_defined_terms:
    id_self:            rule_r04_defined_terms
    guid_self:          rule_4bb4646e17664dec914ab549183ec930
    title:              R4 Defined terms
    brief:              |
                        Use terms that are defined in the glossary,
                        written in the form the glossary gives them.
    description:        |
                        A word has shades of meaning; a defined term
                        has one. Writing a term as Current_Time marks
                        that it is defined and that its accuracy,
                        format and zone are in the glossary rather
                        than in the reader.
    follows:            |
                        The Aircraft shall display the Current_Time as
                        defined in Display_Standard xyz.
    breaks:             |
                        The Aircraft shall display the current time.
    alias:              []
    status:             proposed

    relation:

