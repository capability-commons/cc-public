  rule_r09_open_ended_clauses:
    id_self:            rule_r09_open_ended_clauses
    guid_self:          rule_94650c0b234f49d79d46ec6722b6298f
    title:              R9 Open ended clauses
    brief:              |
                        Avoid including but not limited to, etc., and
                        so on. Say what is required.
    description:        |
                        An open list implies more without saying what.
                        Each item in it is a requirement of its own,
                        to be allocated and verified on its own.
    follows:            |
                        The ATM shall display the Customer
                        Account_Balance in accordance with
                        Display_Standard xyz.
    breaks:             |
                        The ATM shall display the Customer
                        Account_Number, Account_Balance, and so on.
    alias:              []
    status:             proposed

