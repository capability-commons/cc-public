  rule_s10_question_quantifiers:
    id_self:            rule_s10_question_quantifiers
    guid_self:          rule_0a0083a1a0ec4b13ba18f29f84262fca
    title:              S10 Question the quantifiers
    brief:              |
                        Question each numeral and quantifier: does the
                        behaviour hold for all of the set, and only
                        the set?
    description:        |
                        All, each, every, never and none group
                        objects, and the group is often wrong: it
                        holds exceptions for which the behaviour is
                        false, or leaves out objects it should cover.
                        Ask whether really every member is meant,
                        narrow or widen the set, and write the
                        exceptions found.
    follows:            |
                        The Library_System shall provide each
                        Library_User with the ability to change the
                        Registration_Data held about that
                        Library_User.
    breaks:             |
                        The Library_System shall provide each
                        Library_User with the ability to change all
                        Customer_Data.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

