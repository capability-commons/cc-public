  rule_r16_use_of_not:
    id_self:            rule_r16_use_of_not
    guid_self:          rule_10752ad8c1cc47ccaa05409de9a8ffb9
    title:              R16 Use of not
    brief:              |
                        Avoid not. Say what the entity shall do rather
                        than what it shall never do.
    description:        |
                        Shall not fail means never, which takes
                        infinite time to verify. Restated as a bound
                        it can be checked. A not that can be verified,
                        such as a colour excluded by a stated range,
                        is allowed.
    follows:            |
                        The Pump shall have an Availability of greater
                        than or equal to 95 percent during
                        Operating_Hours.
    breaks:             |
                        The Pump shall not fail.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
