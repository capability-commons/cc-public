  rule_s06_process_verb_questions:
    id_self:            rule_s06_process_verb_questions
    guid_self:          rule_fad2174c8f354f57a374de59f7bad065
    title:              S6 Questions on the process verb
    brief:              |
                        Ask the wh questions of the process verb:
                        what, to whom, when, how often, how.
    description:        |
                        A main verb the requirement does not fully
                        describe has had information deleted. For each
                        main verb ask on what object the process acts,
                        for whom, under which condition, how often and
                        in what manner within the domain, and add each
                        answer that matters. The answers often become
                        further requirements.
    follows:            |
                        After the Library_System has checked the
                        Customer_Record and the Customer is not
                        authorised to borrow, the Library_System shall
                        display the message Customer_Not_Authorised to
                        the Librarian.
    breaks:             |
                        Customers who are not authorised are displayed
                        by the Library_System.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
