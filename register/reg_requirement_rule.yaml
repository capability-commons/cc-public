  rule_s02_main_verb:
    id_self:            rule_s02_main_verb
    guid_self:          rule_f70368f6d2c7454297d80dfb9206cc2a
    title:              S2 Main verb
    brief:              |
                        Express the process with a main verb that
                        names what the entity does.
    description:        |
                        A vague process word such as indicate, handle
                        or manage blurs the functionality demanded.
                        Asking what the entity really does yields the
                        main verb, display, save, print, and the main
                        verb then shows what else must be said: what
                        is displayed, to whom, and when. Each main
                        verb is defined once in the list of process
                        words.
    follows:            |
                        After the Library_System has completed a
                        Search, the Library_System shall display the
                        Master_Data of each Library_Item found to the
                        Librarian.
    breaks:             |
                        In a search, the Library_System shall indicate
                        comprehensive information on the Library_Item
                        found.
    alias:              []
    status:             proposed

    relation:

