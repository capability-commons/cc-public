  rule_r24_pronouns:
    id_self:            rule_r24_pronouns
    guid_self:          rule_647c41588f6d465d9dc324ed8794b183
    title:              R24 Pronouns
    brief:              |
                        Avoid pronouns, personal and indefinite.
                        Repeat the noun.
    description:        |
                        It, this and his point at something in another
                        sentence, and sentences are reordered. Some,
                        any and several point at nothing in
                        particular.
    follows:            |
                        At least 8 hours before the Driver_Shift, the
                        Controller shall send the Driver_Itinerary to
                        the Driver.
    breaks:             |
                        The controller shall send the driver his
                        itinerary. It shall be delivered at least 8
                        hours prior to his shift.
    alias:              []
    status:             proposed

