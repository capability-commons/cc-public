  rule_r07_vague_terms:
    id_self:            rule_r07_vague_terms
    guid_self:          rule_33604260a14b42809dbe3538ef0a453a
    title:              R7 Vague terms
    brief:              |
                        Avoid vague quantifiers, adjectives and
                        adverbs: some, several, about, appropriate,
                        sufficient, relevant, usually, typically.
    description:        |
                        A vague word leaves the decision to whoever
                        reads it, and the developer will decide
                        differently from the customer. Words ending in
                        ly are the usual suspects.
    follows:            |
                        The Flight_Information_System shall display
                        the Tracking_Information of each Aircraft
                        within 20 kilometers of the Airfield within 2
                        seconds of detection.
    breaks:             |
                        The Flight_Information_System shall display
                        the Tracking_Information for relevant
                        aircraft.
    alias:              []
    status:             proposed

    relation:

