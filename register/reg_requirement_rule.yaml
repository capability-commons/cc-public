  rule_r03_appropriate_subject_verb:
    id_self:            rule_r03_appropriate_subject_verb
    guid_self:          rule_c887bbab1c0541f98be3178af4f0a56d
    title:              R3 Appropriate subject and verb
    brief:              |
                        Make the subject the entity the requirement is
                        on, and the verb one that entity can be
                        verified to do.
    description:        |
                        A requirement on the user is not a requirement
                        on the system. Verbs like support, handle,
                        manage and process suit a need; a requirement
                        needs a verb whose performance can be
                        measured.
    follows:            |
                        The Aircraft shall display the Current_Time
                        per Display_Standard xyz.
    breaks:             |
                        The User shall enter the current time.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c02_appropriate
