status:                 draft
title:                  Requirement rule register
brief:                  |
                        Register of the rules for writing a
                        requirement statement: the forty two rules of
                        the INCOSE guide to writing requirements,
                        revision 4.
description:            |
                        Each entry states one rule in its brief, its
                        reasoning in its description, and holds a
                        statement that follows the rule beside one
                        that breaks it, drawn from or modelled on the
                        guide's examples. Entries carry
                        r_contributes_to edges to the characteristics
                        they serve.
usage:                  |
                        An eval that judges requirements cites the
                        rules it implements by id, and the example
                        pair on a rule is a written control case for
                        that eval. A person writing a requirement
                        reads the register as a guide.
note:                   |
                        The wording is a paraphrase in the house
                        voice, not the guide's text; the examples are
                        the guide's, shortened. Rules R29, R30 and R36
                        to R42 are about a set of requirements and are
                        entered for completeness; no eval implements
                        them until a requirement set is an item.

table:

  rule_r01_structured_statements:
    id_self:            rule_r01_structured_statements
    guid_self:          rule_2bff923e4da64c16aa24cb2cc25d9134
    title:              R1 Structured statements
    brief:              |
                        Write every statement to one agreed pattern,
                        so that it is whole.
    description:        |
                        A pattern fixes the slots: an optional
                        condition, the entity as subject, shall, the
                        action, its object, and the performance. One
                        pattern per kind of requirement makes similar
                        requirements read alike, and a statement that
                        fills its pattern is complete, singular and
                        verifiable by construction.
    follows:            |
                        When in the Operations_Mode, the Recorder
                        shall record Audio having the characteristics
                        defined in ICD xxxx.
    breaks:             |
                        Audio recording is required during operations.
    alias:              []
    status:             proposed

    relation:

