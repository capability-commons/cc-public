  rule_s17_incomplete_conditions:
    id_self:            rule_s17_incomplete_conditions
    guid_self:          rule_8f49d3126f7048728986c47c0eb3f003
    title:              S17 Incomplete conditions
    brief:              |
                        For every condition, say what the entity does
                        when the condition does not hold.
    description:        |
                        If, in case and depending on state the
                        behaviour when the condition holds and are
                        silent on the other case. Ask what happens
                        otherwise, find every case where there are
                        more than two, and write a requirement for
                        each; a decision table shows the cases a
                        sentence hides.
    follows:            |
                        If the Library_Item is reserved, the
                        Library_System shall display the message
                        Item_Reserved to the Librarian.
    breaks:             |
                        If a Library_Item is not reserved, the
                        Library_System shall provide the Librarian
                        with the ability to continue the Loan.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
