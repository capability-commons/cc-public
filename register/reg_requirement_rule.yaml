  rule_s15_redundancy:
    id_self:            rule_s15_redundancy
    guid_self:          rule_928a0a2c5be441038907400e2a46c92f
    title:              S15 Redundancy
    brief:              |
                        Remove every part of the sentence that can go
                        without loss of meaning.
    description:        |
                        Repeated information and flowery phrases make
                        a requirement longer and no clearer, and give
                        a reader two wordings to reconcile. Shorten
                        until nothing more can be taken away.
    follows:            |
                        As long as the Library_System is connected to
                        the Ordering_Server, the Library_System shall
                        provide the User with every Function.
    breaks:             |
                        In the case that the Library_System cooperates
                        together with the Ordering_Server, the
                        functioning of the Library_System shall
                        persist for the User with the same
                        functionality as before.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
