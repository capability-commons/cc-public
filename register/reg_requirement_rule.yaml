  rule_r05_definite_articles:
    id_self:            rule_r05_definite_articles
    guid_self:          rule_b66062ae083948f5bbd0defa7986286e
    title:              R5 Definite articles
    brief:              |
                        Say the, not a, when naming an entity.
    description:        |
                        A user means any one of; the User means the
                        one defined. Verification against any one of
                        anything is not verification. An indefinite
                        article is fine where no ambiguity follows, as
                        in an accuracy of.
    follows:            |
                        The Aircraft shall display the Current_Time as
                        defined in Display_Standard xyz.
    breaks:             |
                        The Aircraft shall provide a time display.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c03_unambiguous
        guid_target:    char_ae950089b9cf415b85b080872e2cf9b6

  rule_r06_common_units:
    id_self:            rule_r06_common_units
    guid_self:          rule_c6d9febf60ab44658e84998c74d6023f
    title:              R6 Common units of measure
    brief:              |
                        Give every number its unit, in one measurement
                        system used consistently.
    description:        |
                        Thirty degrees of what? Four of what? A number
                        without a unit is not a quantity, and units
                        mixed across a set cannot be compared or
                        verified together.
    follows:            |
                        With power applied, the Circuit_Board shall
                        stay below a temperature of 30 degrees
                        Celsius.
    breaks:             |
                        With power applied, the Circuit_Board shall
                        stay below a temperature of 30 degrees.
    alias:              []
    status:             proposed

    relation:

