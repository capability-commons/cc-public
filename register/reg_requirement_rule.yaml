  rule_s09_separate_non_functional:
    id_self:            rule_s09_separate_non_functional
    guid_self:          rule_50abd57510de4a36b44b7e6a804b1bc6
    title:              S9 Separate non functional aspects
    brief:              |
                        Write a non functional aspect as a requirement
                        of its own where it can be verified on its own
                        or constrains several functions.
    description:        |
                        A quality folded into a functional statement
                        is verified with it, which is right only where
                        the quality holds for that function alone.
                        Where the quality is verified independently,
                        or is a constraint on several functions, it is
                        its own requirement; otherwise it stays with
                        the function.
    follows:            |
                        The Library_System shall complete each Save
                        within 1 second.
    breaks:             |
                        The Library_System shall save the
                        Customer_Data of a new Customer within 1
                        second, as it shall every other write.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
