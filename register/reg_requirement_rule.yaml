  rule_r08_escape_clauses:
    id_self:            rule_r08_escape_clauses
    guid_self:          rule_b717980d5e984a3694982f283c95e6d2
    title:              R8 Escape clauses
    brief:              |
                        Avoid clauses that let the obligation lapse:
                        where possible, as appropriate, if
                        practicable, as required.
    description:        |
                        An escape clause makes a shall statement
                        optional in the reading of whoever must meet
                        it, and nothing about it can be verified.
    follows:            |
                        The GPS shall display the User_Location in
                        accordance with Display_Standard xyz.
    breaks:             |
                        The GPS shall, where there is sufficient
                        space, display the User_Location.
    alias:              []
    status:             proposed

    relation:

