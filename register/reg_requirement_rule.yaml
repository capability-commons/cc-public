  rule_s04_light_verb:
    id_self:            rule_s04_light_verb
    guid_self:          rule_0db32b4392104a518448b833f5a84b3a
    title:              S4 Light verb
    brief:              |
                        Resolve each light verb construction: a verb
                        without substance bound to a noun.
    description:        |
                        To experience a change, to put at disposal, to
                        make available hide the process behind a verb
                        that says nothing. Ask which processes the
                        construction stands for and write one
                        requirement for each, with a main verb. Where
                        the stakeholder does not yet know, the
                        question is the elicitation.
    follows:            |
                        The Library_System shall provide the Librarian
                        with the ability to print the Statistics.
    breaks:             |
                        Statistics shall be put at the disposal of the
                        Librarian.
    alias:              []
    status:             proposed

