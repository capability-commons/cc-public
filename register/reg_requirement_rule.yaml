  rule_r37_acronyms:
    id_self:            rule_r37_acronyms
    guid_self:          rule_248f53da518f428ab5ade65f7285c77f
    title:              R37 Acronyms
    brief:              |
                        Use one form of each acronym, defined in the
                        glossary, or none.
    description:        |
                        CP and CMDP for one command post read as two.
                        In a tool there is no first use to define at,
                        so the glossary defines it.
    follows:            |
                        Every statement in the set that names the
                        command post writes CMDP.
    breaks:             |
                        One statement writes CP and another CMDP for
                        the same command post.
    alias:              []
    status:             proposed

