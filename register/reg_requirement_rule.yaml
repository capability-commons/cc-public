  rule_s13_possibility:
    id_self:            rule_s13_possibility
    guid_self:          rule_346fd31203f94cbaba65b7b378d79c91
    title:              S13 Possible and impossible
    brief:              |
                        Where a requirement says something can or
                        cannot happen, state what makes it possible or
                        prevents it.
    description:        |
                        Can, may, it is possible and it must not be
                        possible delete the business logic: the
                        precondition, the source of the information,
                        the thing that prevents. Ask what makes the
                        behaviour possible or impossible and where the
                        entity gets what it needs to know, and write
                        the condition and the requirements it rests
                        on. The logic of the domain, not the technical
                        solution.
    follows:            |
                        After the Librarian has started a Loan for a
                        Library_User and the Dunning_History of that
                        Library_User holds at least two overdue
                        Library_Items, the Library_System shall
                        display the message Overdue_Items to the
                        Librarian.
    breaks:             |
                        A Library_User who has at least two overdue
                        Library_Items should not be lent any further
                        Library_Item.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c04_complete
