  rule_r20_purpose_phrases:
    id_self:            rule_r20_purpose_phrases
    guid_self:          rule_d19a53bf228d43259f7799301a5185cd
    title:              R20 Purpose phrases
    brief:              |
                        Leave out so that, in order to, thus allowing.
                        Purpose goes in the rationale.
    description:        |
                        Purpose is worth recording and is not part of
                        the obligation. In the statement it adds words
                        that cannot be verified and may be read as a
                        condition.
    follows:            |
                        The Record_Subsystem shall display the Name of
                        each Line_Item per Display_Standard xyz.
    breaks:             |
                        The Record_Subsystem shall display the Name of
                        each Line_Item so that the Operator can
                        confirm that it is the correct Item.
    alias:              []
    status:             proposed

