  rule_s11_missing_quantifiers:
    id_self:            rule_s11_missing_quantifiers
    guid_self:          rule_e33be1586334444992760d5aac8d8c0b
    title:              S11 Missing quantifiers
    brief:              |
                        State the set of objects each behaviour and
                        characteristic applies to.
    description:        |
                        A sentence with no quantifier is read as
                        applying to every object at all times, and the
                        reading is often wrong. Ask for which objects
                        exactly the requirement holds, who may act, on
                        what, and when, and add the numeral or
                        quantifier from a small defined set.
    follows:            |
                        The Library_System shall provide each
                        Librarian with the ability to back up all
                        Customer_Data and Item_Data to Tape at any
                        time.
    breaks:             |
                        The Library_System shall provide the User with
                        the ability to archive the stored data via
                        tape backup.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
