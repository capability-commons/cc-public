  rule_s14_irrelevant_clauses:
    id_self:            rule_s14_irrelevant_clauses
    guid_self:          rule_c3cdc42a4715498db1870303afad06b8
    title:              S14 Irrelevant clauses
    brief:              |
                        Take a subordinate clause that gives a reason,
                        an intention or a consequence out of the
                        statement and into a comment.
    description:        |
                        The only subordinate clauses a requirement
                        needs are its logical and temporal conditions.
                        A clause that says why belongs beside the
                        requirement, not in it; a clause that says
                        something the entity must do is a requirement
                        of its own.
    follows:            |
                        The Library_System shall provide the Librarian
                        with the ability to create the Item_Statistics
                        with the Statistics_Wizard.
    breaks:             |
                        As it makes the creation of statistics easier
                        for the Librarian, the Library_System shall
                        offer a wizard.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
        id_target:      char_c05_singular
