  rule_r36_consistent_terms_and_units:
    id_self:            rule_r36_consistent_terms_and_units
    guid_self:          rule_13082bf7ae2d4f66a21af07f7a2227e4
    title:              R36 Consistent terms and units
    brief:              |
                        Use one term and one unit for each thing,
                        throughout the set and its models.
    description:        |
                        Radio, Receiver and Terminal for one subject
                        read as three subjects. A glossary defines the
                        term once; the set uses it every time.
                        Synonyms are not accepted.
    follows:            |
                        When the Inlet_Valve is connected to the
                        Water_Source, the Control_Subsystem shall open
                        the Inlet_Valve.
    breaks:             |
                        When the Input_Valve is connected to the
                        Water_Source, the Control_Subsystem shall open
                        the Inlet_Valve.
    alias:              []
    status:             proposed

