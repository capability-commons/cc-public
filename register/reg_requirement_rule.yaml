  rule_r05_definite_articles:
    id_self:            rule_r05_definite_articles
    guid_self:          rule_b66062ae083948f5bbd0defa7986286e
    title:              R5 Definite articles
    brief:              |
                        Say the, not a, when naming an entity.
    description:        |
                        A user means any one of; the User means the
                        one defined. Verification against any one of
                        anything is not verification. An indefinite
                        article is fine where no ambiguity follows, as
                        in an accuracy of.
    follows:            |
                        The Aircraft shall display the Current_Time as
                        defined in Display_Standard xyz.
    breaks:             |
                        The Aircraft shall provide a time display.
    alias:              []
    status:             proposed

