  rule_r11_separate_clauses:
    id_self:            rule_r11_separate_clauses
    guid_self:          rule_7f983490b2ce4cd2b8f7610145960072
    title:              R11 Separate clauses
    brief:              |
                        Give each condition and each qualification a
                        clause of its own, and keep the verb beside
                        its object.
    description:        |
                        A qualifying phrase wedged between verb and
                        object obscures which it qualifies. One clause
                        per condition, one per performance, keeps each
                        verifiable on its own.
    follows:            |
                        The Navigation_Beacon shall provide
                        Augmentation_Data to each Maritime_User in
                        Harbor_Approach, at an accuracy of less than
                        or equal to 20 meters.
    breaks:             |
                        The Navigation_Beacon shall provide
                        Augmentation_Data at an accuracy of less than
                        or equal to 20 meters to each Maritime_User
                        during Harbor_Approach.
    alias:              []
    status:             proposed

