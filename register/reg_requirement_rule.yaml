  rule_s01_active_voice:
    id_self:            rule_s01_active_voice
    guid_self:          rule_600932d2e77a4f159774a6ca4821bd2f
    title:              S1 Active voice
    brief:              |
                        Write every requirement in the active voice,
                        with the actor as its subject.
    description:        |
                        A passive sentence deletes the actor. Asking
                        who performs the process names the actor, and
                        whether it is the entity, a user or a
                        neighbouring system decides which form the
                        statement takes. A requirement on the user is
                        then turned into the requirement on the entity
                        that lets the user act.
    follows:            |
                        The Library_System shall provide the
                        Library_User with the ability to enter the
                        User_Password at a Terminal.
    breaks:             |
                        The User_Password shall be entered at a
                        Terminal.
    alias:              []
    status:             proposed

    relation:

      - id_relation:    r_contributes_to
        guid_relation:  r_34334c91012d4a3b86cdf38b1762bf21
