status:                 draft
title:                  Unit register
brief:                  |
                        Register of the units a quantity in a
                        requirement is written in.
description:            |
                        Each entry is one unit: its symbol, the names
                        a statement may write it by, and the kind of
                        quantity it measures. The statement check
                        reads a number in a requirement and asks
                        whether what follows it is a unit here; a
                        number followed by a word that is not, and is
                        not the thing counted, is a finding, and a
                        unit the register lacks is a question.
usage:                  |
                        Extend it when a requirement needs a unit it
                        lacks; a consumer segment may hold a register
                        of the same type for the units of its domain.
note:                   |
                        A count has its unit in what it counts, two
                        people, twelve modules, and is not here. The
                        SI units and the few the demonstration met; a
                        unit is spelled as it is written after a
                        number.

