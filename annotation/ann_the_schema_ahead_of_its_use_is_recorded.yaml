title:                  The schema settling more than anything uses is recorded, not undone
brief:                  |
                        Accepted. The consequence says the ontology
                        was settled before a use could test it, which
                        is the order ddr_annotation refuses, and this
                        record took the other way without saying so.
description:            |
                        The judgement holds. One python surface of six
                        members exercises a schema declaring C and C++
                        surfaces, dataflow step surfaces with their
                        tables and execution semantics, parameter
                        modes, ownership and lifetime.

                        Not undone, because narrowing a closed schema
                        a partner may already read costs more than the
                        unused declarations do, and what a second
                        language or a dataflow step needs is still
                        unknown, which is the finding's own point.
                        qst_interface_control_document.surfaces asks
                        whether to narrow it, so the question is open
                        rather than settled by inertia.

