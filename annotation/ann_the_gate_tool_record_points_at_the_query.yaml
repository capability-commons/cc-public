title:                  The gate tool record now points at the query rather than counting
brief:                  |
                        Amended. The consequence says every entry is
                        shown to fail by something and names
                        qry_gate_tool_control for which they are.
description:            |
                        The record said the register holds six entries
                        of which one is shown to fail. The query
                        returns eight, each shown to fail by one
                        thing; two tools and every control landed
                        after the record was written.

                        A count written in prose goes stale as the
                        register grows, and the sentence the record
                        used to say why the register was worth writing
                        was the one a reader could disprove. The query
                        is now what answers it.

