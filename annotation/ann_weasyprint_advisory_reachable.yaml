title:                  The audit finds a fixable advisory the environment record says cannot exist
brief:                  |
                        pip-audit reports two packages: diskcache with
                        no fix, and weasyprint 69.0 with a fix at 70.0
                        that both pins exclude, while
                        ddr_environment_shape says the one dependency
                        finding lives in the model stack and is
                        unreachable, and its own context says the
                        suite loads weasyprint.
description:            |
                        The pins are weasyprint>=69,<70 in the render
                        extra and >=69.0,<70 in the pixi dependencies;
                        Dependabot watches github-actions only; the
                        triage the record says is recorded is in the
                        record alone. The report-only audit tells
                        nobody.

