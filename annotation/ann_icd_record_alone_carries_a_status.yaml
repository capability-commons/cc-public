title:                  One design decision carries a lifecycle status set by hand
brief:                  |
                        ddr_interface_control_document alone among the
                        records carries status accepted, written at
                        a65c36a, while the note of sch_ddr says a
                        record carries no number and no lifecycle
                        status and the schema offers one whose
                        description says a person accepts it, and
                        nothing records who did.
description:            |
                        grep over ddr/ finds one status field. The
                        accept command admits requirements and not
                        records, and no decision item names this
                        record. Either the note is wrong or the field
                        is, and a reader of the one record that
                        carries it cannot tell what accepted means
                        there.

