title:                  The slow marker is carried by forty tests, thirty five under a minute
brief:                  |
                        The marker is registered as costing a minute
                        or more, and its comment counts seventeen such
                        tests, while forty carry it and only five run
                        sixty seconds, so quick drops the controls of
                        the repository check, which are not slow.
description:            |
                        Collecting -m slow gives forty of 877 tests;
                        joined with junit.xml, five are at or over
                        sixty seconds and twenty one under thirty, all
                        in test_gate_tool.py: the nineteen check
                        controls at seven to fifteen seconds and two
                        whole-tree checks near ten. No unmarked test
                        reaches sixty seconds. The loop a developer
                        trusts omits the tests showing the repository
                        check can fail.

