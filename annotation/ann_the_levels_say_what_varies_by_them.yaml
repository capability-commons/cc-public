title:                  Every criticality entry now says what varies by it
brief:                  |
                        Amended. All ten entries and ddr_criticality
                        say the trace check reads a level in two
                        places, and which three objectives are still
                        read by nothing.
description:            |
                        Every entry ended with the sentence that
                        nothing varies by it yet, and ddr_criticality
                        said the levels are inert until a check varies
                        by them. A verdict shared between requirements
                        is critical from level sixty and a requirement
                        with no current coverage analysis is reported
                        from level forty.

                        Someone reading a level before declaring it
                        was told it changes nothing, which would have
                        made the declaration look free. Case per
                        condition, method not code and tool accounted
                        are read by no check, and the record now names
                        those three rather than claiming the whole
                        lever is inert.

