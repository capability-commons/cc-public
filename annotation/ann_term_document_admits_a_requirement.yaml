title:                  term_document admits a requirement the relation refuses
brief:                  |
                        term_document defines a document as an
                        external work a rule or a requirement is taken
                        from, while r_is_taken_from admits rules,
                        characteristics, methodologies, decisions and
                        objectives and not a requirement, which
                        ddr_document_register keeps apart from
                        evidence on purpose.
description:            |
                        The relation check refuses the edge the term
                        invites. A requirement claim rests on an
                        observation by r_cites, not on a document.

