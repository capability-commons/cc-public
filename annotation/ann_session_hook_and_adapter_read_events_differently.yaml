title:                  The session hook and the adapter read one pytest event differently
brief:                  |
                        pytest_runtest_logreport in the conftest
                        ignores the teardown phase and reads every
                        call failure as failed, so a teardown error is
                        recorded passed and a timeout failed, where
                        the adapter records error and no result for
                        both.
description:            |
                        Fed setup passed, call passed, teardown
                        failed, the hook recorded passed; fed a call
                        failure it recorded failed. The hook has
                        branches for setup and call only. The adapter
                        controls hold that a teardown error and a
                        timeout are errors with no result, and
                        _of_failed_call reads the timeout text. Two
                        readers of one event, and the whole-session
                        reader is the one the gate uses, so evd_pytest
                        can hold passed for a function whose run did
                        not complete.

