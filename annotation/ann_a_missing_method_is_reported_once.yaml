title:                  A case naming no method is now reported once
brief:                  |
                        Fixed. r_uses_test_method declares a maximum
                        alone, as r_instantiates does, and the testing
                        check reports the fault.
description:            |
                        The relation declared a minimum and a maximum
                        of one and testing.resolve refuses a case
                        naming other than one method, so one fault
                        gave two critical findings, which
                        ddr_relation_cardinality forbids in the same
                        paragraph that gives r_instantiates a maximum
                        alone for exactly this reason.

                        The testing check is kept as the reporter
                        because it says more: it names the case and
                        the count, and it is where a case that cannot
                        be resolved is reported anyway.
                        test_a_case_naming_no_method_is_reported_once
                        asserts the testing check reports and the
                        relation check does not. The decision now
                        names both relations and why.

