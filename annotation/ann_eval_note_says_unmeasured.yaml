title:                  The eval note says it is unmeasured while it carries three confidence rows
brief:                  |
                        evl_test_exercises_criteria says it is
                        advisory and unmeasured and reports without
                        gating until someone runs measure, and the
                        same file holds three rows for openai/gpt-5.1
                        that the check reports current.
description:            |
                        The note is also a run log, recording what a
                        judge returned and why, which argues where an
                        item should describe and which the commits and
                        ddr_coverage_analysis already hold.

