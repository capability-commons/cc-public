title:                  Two suppressed cases were never findings
brief:                  |
                        c99fd1eca and c4b59ab12 carry origin
                        suppressed while their notes say no finding
                        was raised on them, which is the written
                        origin, so the suppressed stratum measures
                        hand-held met cases and not overridden
                        findings.
description:            |
                        ddr_eval_measurement holds that a suppressed
                        case is by construction one the judge got
                        wrong, and reports the strata apart; CLAUDE.md
                        gives --origin written for a hand-written
                        item. The recorded suppressed row is three
                        cases at a false positive of zero. A reader
                        comparing strata across evals compares unlike
                        things under one name.

