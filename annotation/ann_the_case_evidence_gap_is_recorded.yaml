title:                  What the gate does not refresh is now written where a reader meets it
brief:                  |
                        Accepted and recorded, not fixed. No step of
                        the gate runs a case, so the seven case rows
                        are hand written and go stale on a change to
                        the adapter or a method.
description:            |
                        The claim in CLAUDE.md that the tests refresh
                        the evidence the check reads is true of the
                        rows a test function establishes and false of
                        the rows a case does, because a session is
                        keyed by test function items.

                        CLAUDE.md, the pytest entry's blind spot and
                        qst_verification_evidence.cases now say so.
                        Not fixed here because what should run a case
                        in the gate is a design question: which item
                        each case binds is a choice, no command runs
                        them all, and seven subprocess runs is a cost
                        the gate would carry on every push.

