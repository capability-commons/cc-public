title:                  The criterion is narrowed and the printer case flipped to met
brief:                  |
                        Fixed. The criterion says to take the
                        repository's helpers as doing what they say,
                        and the case is re-made as met with a note
                        saying why it moved.
description:            |
                        The case was flipped to unmet because the file
                        enumerator might under enumerate, and
                        ddr_tool_verification then decided that
                        whether a helper a verdict rests on is itself
                        verified is a fact about the graph and belongs
                        to a check. The criterion was never narrowed,
                        so the measured rates included a case whose
                        verdict the governing decision says the judge
                        should not be asked for.

                        The criterion now says a test is not unmet
                        because something it calls might be wrong. By
                        that criterion the test asserts both halves of
                        what the requirement requires, so the case is
                        met and suppressed. The reliance on an
                        unverified helper stands as a finding and is
                        ddr_tool_verification's, not this eval's.

                        ddr_eval_migration says a narrowed criterion
                        makes the confidence stale and the eval is
                        measured again before it guards anything. The
                        digest has moved and the measurement is taken
                        once when this work settles.

