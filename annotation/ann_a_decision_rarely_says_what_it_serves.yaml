title:                  Two design decisions in the tree say what need they serve
brief:                  |
                        Of the design decisions here, two carry an
                        r_is_derived_from edge. The rest name what
                        they decide and not what they are for.
description:            |
                        So there is no bounded set of records
                        answering one question, and a bounded set is
                        what every affordable check in this repository
                        is built on. It also means a reader cannot ask
                        what a need cost in decisions, or which
                        decisions would have to be revisited if a need
                        changed. Some decisions serve the tool rather
                        than anything a need states, and what those
                        derive from is not obvious, which is the
                        reason this is an assertion about the tree
                        rather than a defect in any one record.

