title:                  The migration decision describes a comparison nothing implements
brief:                  |
                        ddr_eval_migration says in the present tense
                        that the comparison runs the check, reads the
                        cases and reports two lists, and no code reads
                        a control set against a check, no criterion
                        was narrowed under it, and its r_decides edges
                        to t_control_set and t_eval decide nothing
                        about either.
description:            |
                        No module under src compares a check to a
                        control set; the eval and control set schemas
                        and the two type entries are unchanged since
                        the baseline. The open question asks only
                        whether the comparison is a command or an
                        option on measure, presupposing it exists.

