title:                  Ten types, six relations, three registers and fifteen schemas have no decider
brief:                  |
                        Of the twelve types added since the baseline
                        only t_annotation and t_coverage_analysis are
                        decided by an r_decides edge; the decisions
                        that introduce the rest name them in prose and
                        hold edges to their terms alone, and two
                        decisions hold no r_decides edge at all.
description:            |
                        cctool query qry_undecided lists
                        r_is_controlled_by, r_is_narrower_than,
                        r_is_part_of, r_satisfies, r_tests,
                        r_uses_test_method, every schema of the test
                        model, the interface documents, the objective
                        and the three new registers, and
                        t_criticality, t_gate_tool,
                        t_interface_control_document among others;
                        orphans lists reg_criticality, reg_gate_tool
                        and reg_test_method. ddr_criticality and
                        ddr_objective decide nothing by edge, so
                        term_criticality and term_objective are the
                        only two of forty two new terms without a
                        decider; ddr_interface_control_document
                        decides reg_type as a whole. sch_ddr says a
                        record names what it decides by an r_decides
                        edge to each item concerned, and
                        ddr_annotation, ddr_document_register and
                        ddr_source_identifier do; cctool show
                        t_test_case gives a reader no path to the
                        reasoning.

