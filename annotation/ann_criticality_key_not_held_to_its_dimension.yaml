title:                  A criticality key is never held to the dimension of the entry it names
brief:                  |
                        The schema keys a declared criticality by
                        dimension and says the entry names the same
                        dimension as the key, but nothing checks it,
                        and the derivation reads the entry and ignores
                        the key.
description:            |
                        Declaring safety: crit_security_60 on a
                        requirement in a copy gave no finding, and
                        trace --criticality reported its function at
                        safety 10 and security 60. The key is a second
                        place for the dimension to be written and the
                        second place is never read.

