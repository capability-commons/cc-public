title:                  A row is operated but is not a control
brief:                  |
                        A row of the workbench is a focusable div
                        carrying click, Enter, Space and r behaviour,
                        and exposes no role, no expanded state and no
                        name for the act of reading.
description:            |
                        WCAG 2.2 requires the name, role and value of
                        a scripted component, and changes to them, to
                        be determinable by a program. A reader using
                        assistive technology is told that a div has
                        focus and is told nothing about what it does
                        or whether it is open. A browser driven by an
                        agent is in the same position, and both are
                        the interface that matters here. A native
                        control would bring keyboard and accessibility
                        behaviour from the platform rather than from
                        the script.

