title:                  The annotation test for impact asserts the closure from the annotation
brief:                  |
                        The brief twelfth item asked that impact
                        analysis follow r_is_about from a changed
                        subject to the annotation; the test asserts
                        that the closure of the annotation contains
                        its subject, which is the forward direction
                        and passes whether or not impact reaches the
                        annotation.
description:            |
                        test_an_annotation_rests_on_what_it_is_about
                        asserts r_is_about is a dependency and that
                        the subject is in closure of the annotation;
                        nothing in the file calls trace.impact or
                        impact_of_files. The gate was green while the
                        property ddr_annotation relied on was absent;
                        the changed command now supplies it.

