title:                  The unmeasured eval is recorded
brief:                  |
                        Accepted and recorded. The control set was
                        retired with the population it was about and
                        none replaced it, so the eval sweeps every
                        standalone item on the strength of nothing
                        measured.
description:            |
                        ddr_eval_admission refuses an unmeasured eval
                        as a guard, and a sweep is not a guard, so
                        nothing stops this one. Every finding it makes
                        carries no confidence, and a reader has no way
                        to know how often it is wrong.

                        Not fixed here. Writing a control set means
                        judging and paying for it, and choosing the
                        cases is the work: the population it once
                        measured is gone, so the new set must be drawn
                        from what the anchor now reaches. The decision
                        says none replaced the retired one, which it
                        did not say before, and
                        qst_eval_anchor_and_population.replacement
                        asks what measures it.

