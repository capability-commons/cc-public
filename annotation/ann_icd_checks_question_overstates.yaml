title:                  The interface document record says two checks exist that do not
brief:                  |
                        Its consequence lists unique member names
                        within a language scope and non-conflicting
                        dataflow roles among the companion checks, and
                        its checks question says every such fact but
                        baselining is settled in check/interface;
                        _duplicate compares names within one table and
                        nothing reads the role tables together.
description:            |
                        A class and a free function of one python
                        surface both named the same gave no finding in
                        a copy, and a port under input, output and
                        state at once gave none. The check description
                        says honestly two members of one table.

