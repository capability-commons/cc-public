title:                  A test run reads the working copy at three moments and writes to it at the end
brief:                  |
                        Collection imports the test modules from the
                        working copy, every tree fixture copies from
                        it at the moment its test runs, and the
                        session end writes the evidence into it and
                        digests the source it finds there.
description:            |
                        So a run and an edit cannot proceed at once,
                        and the reason is not a lock. Two tests in one
                        run can see two different trees, and the
                        evidence written at the end can digest code
                        that no test in the run exercised. The
                        convention is to leave the tree alone for the
                        length of a run, which on this suite is
                        fifteen minutes, and that is what makes a gate
                        feel like it blocks the work rather than
                        merely takes time. A run against a fixed
                        revision in a worktree of its own would touch
                        none of the three.

