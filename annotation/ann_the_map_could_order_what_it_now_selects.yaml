title:                  The map selects tests where it could order them
brief:                  |
                        test-changed runs the tests a change can reach
                        and skips the rest, and says of itself that a
                        green result decides nothing. The same map
                        could instead put those tests first in a full
                        run.
description:            |
                        Selecting trades a verdict for speed and the
                        trade is recorded honestly. Ordering does not
                        trade: the first minute runs exactly what
                        selecting would have run, and the run then
                        continues through everything else, so one run
                        gives both the early finding and the complete
                        verdict. What makes this worth saying now is
                        that the map is measured and built already,
                        and that ordering has no failure mode where
                        selecting has one. It pays only if the run
                        reports as it goes, since ordering what nobody
                        is watching changes nothing.

