title:                  The working guide and the readme do not know four homes and two registers
brief:                  |
                        CLAUDE.md lists trace without --criticality,
                        the registers without criticality or gate
                        tool, and the homes without objective/, and
                        README has no row for objective/, interface/
                        or test_case/.
description:            |
                        grep criticality over both files finds nothing
                        while trace --help offers it; objective/ holds
                        nine items. An agent following the guide, the
                        document that tells it what exists, cannot
                        find the lever or the objectives, and a
                        newcomer is not told where a contract or a
                        test case lives.

