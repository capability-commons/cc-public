title:                  Fourteen decisions argue for the choice inside the decision field
brief:                  |
                        evl_decision_decides held the decision field
                        of fourteen changed records unmet, thirteen
                        unanimously, for sentences that give the
                        reason for a choice where the field should
                        state the choice and what follows from it and
                        leave the reason to the rationale.
description:            |
                        The sentences quoted are of the form so that a
                        level may be put between two that exist, or a
                        tool whose limits are unwritten will have its
                        exit status read as saying more than it does,
                        each of which the same record repeats in its
                        rationale. The reviewer read five of the
                        fourteen and agrees; the eval is measured on
                        fifteen written cases at no false positive. A
                        decision field that argues is longer to read
                        and cannot be told from its rationale.

