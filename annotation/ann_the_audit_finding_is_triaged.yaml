title:                  The environment record now says what the audit reports
brief:                  |
                        Fixed as a record, not as a pin. There are two
                        findings, one of them in the rendering stack
                        and reached, and its fix is not in this
                        channel.
description:            |
                        The record said the one dependency finding
                        lives in the model stack and is unreachable,
                        while its own context says the suite loads the
                        rendering stack.

                        I raised both pins to weasyprint 70 and the
                        environment would not solve: conda-forge
                        carries 69.0 as its latest, with nothing above
                        it. The pins are back where they were, because
                        moving them breaks the environment and does
                        not fix anything.

                        The record now says there are two findings,
                        that one of them is in the rendering stack and
                        is reached, that its fix is released and not
                        carried here, and that the audit blocks
                        nothing. qst_environment_shape.audit asks what
                        holds an advisory whose fix the channel does
                        not carry, which is the part nothing answers.

