title:                  The layers contract is no longer named for a count it outgrew
brief:                  |
                        Amended. The contract, its comment, the guide
                        and the register entry drop the count, and the
                        decision says what each tier is for and that
                        the list is the contract.
description:            |
                        The contract grew from eight layers to twelve
                        while four places said seven tiers, and
                        ddr_layered_architecture enumerated seven with
                        no adapter, testing, nonconformity or item
                        tier.

                        The decision no longer enumerates them: the
                        contract in pyproject.toml is the list, and
                        the decision says what each tier is for, which
                        is the part a reader needs and the part that
                        does not go stale on a split. It says plainly
                        that the contract grew from seven to twelve by
                        splitting what was one tier rather than by
                        loosening the rule.

