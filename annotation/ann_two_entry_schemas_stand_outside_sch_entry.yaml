title:                  Two entry schemas skip sch_entry, so eighteen entries escape every prose eval
brief:                  |
                        sch_entry_criticality and sch_entry_gate_tool
                        carry no allOf to sch_entry, so the ten
                        criticality and eight gate tool entries are
                        reached by no eval anchored on
                        sch_descriptive.
description:            |
                        The other eight entry schemas name sch_entry;
                        these two are closed by their registers naming
                        sch_entry beside them instead. Selecting for
                        evl_plain_text yields term 124, t 62, unit 48
                        and crit 0, gt 0. The defect
                        ddr_embedded_item_schema exists to remove
                        persists for two registers and nothing records
                        that as a choice.

