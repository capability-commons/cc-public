title:                  Every named query is now run by a test
brief:                  |
                        Addressed by the review itself:
                        test_every_named_query_runs exercises each
                        query item, so a query that no longer parses
                        is a failing test.
description:            |
                        Recorded as done rather than fixed here. A
                        named query was data nothing executed, so one
                        that stopped parsing against the fact tables
                        would have been found by the next person to
                        run it.

                        Nothing in this answer changes the tree.

