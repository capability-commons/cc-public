title:                  A member identity is held to its first and last steps only
brief:                  |
                        The interface check requires an id to start
                        with the document stem and end with the key or
                        name, so a method whose id names the wrong
                        holder passes.
description:            |
                        Setting the id of the path method to
                        icm_cc_public_query.other.path in a copy gave
                        no finding from any check. The run of keys
                        between is how an embedded item says where it
                        sits and what rename carries, and here it is
                        never compared.

