title:                  The widened measurement is taken again
brief:                  |
                        Fixed. The eval is measured over the nine
                        re-rendered cases, and the rates
                        ddr_coverage_analysis cites are amended to
                        what was measured.
description:            |
                        The scope and the criterion gained module and
                        the cases were not rendered anew, so the rates
                        were measured on seven subjects with no
                        module, one with no source and two with a
                        refilled module.

                        Measured after the re-render, nine cases at
                        five samples: false positive 0.0, false
                        negative 0.333, unanimity 1.0.
                        ddr_coverage_analysis cited 0.167 as the
                        reason an unmet reading is reported and not
                        blocked on; the figure is now 0.333, which
                        strengthens that reason rather than weakening
                        it, and the record says so.

