title:                  Every comment header in the type register now names the entry below it
brief:                  |
                        Fixed. Ten headers moved out of the previous
                        entry to sit above the entry they name.
description:            |
                        The printer moved status, alias, prefix,
                        regex_id and id_term above each relation list,
                        so hand written headers that had preceded the
                        next key ended up inside the previous entry,
                        between its regex_id and its id_term. A reader
                        scanning by the headers read the term of one
                        entry as another's.

                        All ten are moved and checked: every header is
                        followed by the entry it names, asserted by
                        reading the file back.

