title:                  The test command refuses a guid where its help accepts one
brief:                  |
                        --under-test is documented as taking a
                        readable id or a guid, but testing.resolve and
                        adapter.execute index items by readable id
                        only, so a guid is reported as an item the
                        tree does not hold.
description:            |
                        cctool test tc_path_reported --under-test
                        pyf_2d6ec8ed72c84bb785b8536d7712b4f4 exits 2
                        with no item in this tree is named, and the
                        same for the case given by its guid. Both are
                        the items own guids and tree.resolve accepts
                        them everywhere else.

