title:                  The dependency flag now serves both readers
brief:                  |
                        Addressed by the review itself:
                        trace.dependency is the one reader of the
                        flag, and the changed command and the evidence
                        closure both ask it.
description:            |
                        Recorded as done rather than fixed here. The
                        review that raised it also built the changed
                        command, which reads the flag through
                        trace.dependency, so the evidence closure and
                        the impact walk no longer each have their own
                        idea of which relations carry dependence.

                        Nothing in this answer changes the tree. It is
                        here so that the finding is answered rather
                        than left open against work that has landed.

