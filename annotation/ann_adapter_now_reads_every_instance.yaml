title:                  The adapter now reads every instance of a parametrised function
brief:                  |
                        Fixed. _observation ranks every report of the
                        node rather than returning at the first that
                        passed, so a function whose second instance
                        fails reads failed.
description:            |
                        Reproduced by feeding _observation a call
                        passed followed by a call failed, which
                        returned completed passed. The reports are now
                        read through
                        cc_public.evidence.outcome_of_event and ranked
                        by evidence.RANK, so an error beats a failure,
                        a failure beats a skip and a skip beats a
                        pass, which is how evidence.outcome_of already
                        ranked the instances of one case.

                        test_parameterised_one_fails in
                        test/control_adapter.py is a control run twice
                        whose second instance fails, and
                        test_a_control_run_twice_that_fails_once_is_one_failure
                        asserts the adapter reads failed. Before the
                        change that control read passed.

