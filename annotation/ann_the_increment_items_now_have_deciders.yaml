title:                  Every item this increment introduced now names the record that decides it
brief:                  |
                        Fixed. Thirty one r_decides edges added, and
                        the nine objectives too; qry_undecided falls
                        from fifty four to twenty three, all of them
                        predating the review.
description:            |
                        sch_ddr says a record names what it decides by
                        an r_decides edge to each item concerned, and
                        the records introducing the test model, the
                        interface documents, the objectives, the
                        criticality levels and the gate tools named
                        them in prose alone, so cctool show on any of
                        them gave a reader no path to the reasoning.

                        Each item was attributed by finding the record
                        whose prose introduces it, which is the
                        mechanical half of ddr_prose_reference doing
                        the work it was written for. Where more than
                        one record named an item, the introducing one
                        was taken.

                        Twenty three remain undecided and every one
                        predates this increment: t_type, t_schema,
                        t_register, r_verifies and the workflow types
                        among them. Attributing those by reading is
                        guesswork, so they are
                        qst_design_decision.deciders rather than
                        guessed at. qry_decides_nothing falls from
                        fourteen records to twelve, the rest being
                        records that decide a practice rather than an
                        item, several of which say they are not built.

