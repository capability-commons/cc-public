title:                  The two cases that were never findings now carry the written origin
brief:                  |
                        Fixed. c99fd1eca and c4b59ab12 are re-made
                        with origin written, which is what a hand-held
                        met case is.
description:            |
                        Both notes say no finding was raised on them,
                        and a suppressed case is by construction one
                        the judge got wrong. Under one name the strata
                        compared unlike things: the recorded
                        suppressed row was three cases where one was a
                        suppression.

                        Re-made through the case command with --origin
                        written. The measurement afterwards reports
                        them apart: written two cases at a false
                        positive of zero, suppressed one case at zero.

