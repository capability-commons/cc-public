title:                  The layout check is a third of every check, and everything multiplies it
brief:                  |
                        Measured on 14 September 2026: a check of this
                        tree is 5.77 seconds of checking over 1.44
                        seconds of loading, and layout is 2.43 of the
                        5.77, with schema at 1.44 and evidence at 1.19
                        and the other fifteen checks 0.71 between
                        them.
description:            |
                        Laying out is a round trip parse of every
                        document, and the result is already remembered
                        on the text and the suffix. The memo lives in
                        the process, so it is built afresh by every
                        command and by every check a test runs, and a
                        suite that runs the checks hundreds of times
                        pays for it hundreds of times. A cache keyed
                        on the digest of the file and kept outside the
                        process would survive, and would reach both
                        the command a person runs and the checks a
                        test runs inside it. Whether the saving is
                        worth a cache on disk is not measured; the
                        cost it would attack is.

