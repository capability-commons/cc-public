title:                  The code quality record gives a floor of 86 and a gate without the type checker
brief:                  |
                        ddr_code_quality says the floor is 86 now and
                        gate is the checks, the lint and the tests,
                        while the tree has 87 branch-aware and gate
                        depends on lint, type and test.
description:            |
                        The floor was already 87 at the baseline; the
                        type step was added at f4d1e58 without
                        touching the record. The decision governing
                        the gate names a gate the pipeline no longer
                        runs.

