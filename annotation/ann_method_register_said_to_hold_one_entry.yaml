title:                  Two decisions say the method register holds one entry; it holds four
brief:                  |
                        ddr_test_method and ddr_test_case_adoption say
                        in their consequences that reg_test_method
                        holds one entry and that until it holds a
                        method that is not code a requirement verified
                        by inspection has no case to carry it, while
                        the register holds four and
                        tc_committer_writes_record uses
                        tm_manual_inspection.
description:            |
                        tm_manual_inspection, tm_manual_analysis and
                        tm_manual_demonstration were added at ee00105,
                        after both records. The constraint
                        ddr_test_case_adoption calls the one that
                        binds is reported open when the tree has
                        closed it.

