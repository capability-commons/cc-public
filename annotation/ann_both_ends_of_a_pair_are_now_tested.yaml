title:                  Both ends of a pair, and the text measure sends, are now tested
brief:                  |
                        Fixed. A test asserts the requirement end
                        carries no source, and the measurement tests
                        key the scripted judge by what measure sends
                        rather than by what is stored.
description:            |
                        The selector tests checked the test end of a
                        pair and nothing of the other, so a projection
                        widening the wrong end passed; the measurement
                        tests keyed by normalised stored text, so a
                        printer change altering what measure sends
                        passed too.

                        test_a_requirement_is_not_shown_the_code_that_implements_it
                        asserts the requirement end carries one source
                        section and not the implementation, and
                        test_only_a_case_follows_what_implements_it
                        holds the predicate that decides. In
                        test_measure the scripted judge and the per
                        origin table now key by the subject as
                        written, which is what measure sends, and
                        test_a_stored_subject_survives_the_printer_as_it_was_rendered
                        holds the round trip through the printer.

