title:                  The entry envelope is named two ways
brief:                  |
                        sch_register keeps register_entry as a bare
                        alias of sch_entry, and ten register schemas
                        name the alias while three name sch_entry, so
                        one shape has two names.
description:            |
                        document, plain, process word, protective
                        mark, relation, requirement rule, term, type,
                        unit and writing style rule compose the alias;
                        criticality, gate tool and test method compose
                        sch_entry. The next register schema copied
                        from a neighbour will carry whichever it
                        copied.

