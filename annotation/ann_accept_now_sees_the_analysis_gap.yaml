title:                  accept now reads the projection with the analyses
brief:                  |
                        Fixed. edit.accept passes check.trace.analysed
                        to the projection, so the gap it could not see
                        now refuses the acceptance.
description:            |
                        accept promised never to admit what the checks
                        would refuse, and called the projection with
                        two arguments where the check calls it with
                        three, so the coverage analysis gap could not
                        fire there at all.

                        test_accept_refuses_a_requirement_whose_level_wants_an_analysis
                        declares safety forty on a proposed
                        requirement in a copy, calls accept, and
                        asserts it raises naming the analysis and
                        leaves the status proposed. Before the change
                        it returned the accepted requirement and the
                        next closed-world check reported one critical.

