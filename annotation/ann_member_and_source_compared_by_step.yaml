title:                  A member and its source are now compared at a step boundary
brief:                  |
                        Fixed. The identifier must end with the
                        member's name at a step, with the case taken
                        off, so a class member may name its class and
                        a bare suffix is refused.
description:            |
                        Comparing a lower-cased identifier against a
                        language-cased name meant a member called
                        Database could never carry the edge to
                        pyc_cc_public.query.database, and comparing by
                        bare suffix let rawing pass for drawing.

                        _ends_with_step admits an identifier that is
                        the name or ends with a step of that name,
                        which covers a module member named by its
                        whole dotted path and a class or function
                        member named by its last step.

                        Three tests hold it: a member whose source
                        does not carry its name, a bare suffix of a
                        step, and a class member naming the class that
                        presents it, which is made in a copy and then
                        linked.

