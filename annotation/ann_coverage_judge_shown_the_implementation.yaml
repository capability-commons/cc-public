title:                  The coverage judge is shown the implementation of the requirement
brief:                  |
                        render applies _with_source to every item of a
                        pair, so the requirement end of an r_verifies
                        pair follows its own r_is_implemented_by edge
                        and the judge is handed the implementation
                        beside the test, a whole module where the
                        implementer is one, and for a manual case the
                        implementation alone.
description:            |
                        Twenty three of the twenty four coverage pairs
                        carry two source sections; the pair for
                        req_executor_honours_budget is 37468
                        characters, 34168 of them the whole of
                        cc_public/workflow/run.py. For
                        tc_committer_writes_record the test side holds
                        title and brief and the requirement side holds
                        the source of pyf_cc_public.commit.message, so
                        the only code shown is the code under test.
                        The criterion promises the source of the test
                        that verifies it and nothing says which source
                        is the test; a judge asked whether a test
                        would fail can answer from the implementation,
                        which is what ddr_eval_reach exists to
                        prevent.

