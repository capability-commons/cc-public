title:                  The document record says three types cite a document; the relation admits five
brief:                  |
                        ddr_document_register says the domain of
                        r_is_taken_from is those three types, rule,
                        characteristic and methodology, and counts
                        nine documents, while the entry admits a
                        design decision and an objective, thirty one
                        such edges exist and the register holds
                        seventeen documents.
description:            |
                        The widening is argued only in the
                        consequences of ddr_verification_standard and
                        ddr_objective, neither of which decides the
                        relation; the only r_decides edge to
                        r_is_taken_from is from ddr_document_register.
                        A reader following the rule, find the
                        reasoning by what decides it, reaches a
                        decision that contradicts the entry.

