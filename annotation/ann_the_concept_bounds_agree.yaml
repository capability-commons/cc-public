title:                  The concept record now gives the bounds the schema validates
brief:                  |
                        Amended. Three places said three to twelve
                        where the schema has bounded the collection at
                        ten to thirty all along, and the prompt asks
                        for twelve to twenty-five inside that.
description:            |
                        The record, the term entry and the guide all
                        said three to twelve, and the schema has said
                        ten to thirty since before the baseline, so
                        the prose was the stale side rather than the
                        mechanism. The prompt that makes a concept
                        asks for twelve to twenty-five, which sits
                        inside the schema's range, so the working
                        system has used the wider bound throughout.

                        The record keeps its reason, that what is
                        explicit guides an implementation and the
                        small things stay implicit, and now says the
                        prompt narrows the band because a model given
                        the schema's room tends to the top of it.

