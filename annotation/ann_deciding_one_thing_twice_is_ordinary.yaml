title:                  Two records deciding one target is not a sign that they disagree
brief:                  |
                        Sixty eight targets are decided by more than
                        one design decision. The common case is one
                        record deciding a module's architecture and
                        another deciding a detail of it.
description:            |
                        Recorded because it is the obvious mechanical
                        signal for contradiction and it does not work.
                        Anything built on it would report sixty eight
                        places to look, almost all of them fine, which
                        is the shape of a check nobody runs twice. The
                        measurement is worth keeping so that the next
                        person to have the idea can see it has been
                        had and costed.

