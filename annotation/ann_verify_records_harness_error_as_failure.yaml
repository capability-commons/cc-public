title:                  The verify component records a harness error as a failure of the product
brief:                  |
                        evidence._junit maps a JUnit error element to
                        failed, so a test whose fixture could not be
                        made is written as failed rather than error.
description:            |
                        evidence.observe over the three controls in
                        test/control_adapter.py returned failed for
                        test_errors_in_setup and
                        test_errors_in_teardown and skipped for
                        test_skips. The mapping is OUTCOME_FAILED
                        where the tags hold failure or error. The
                        evidence outcomes include error, and the
                        adapter control set holds that a setup error
                        is an error and no result. The subprocess
                        observe launches runs the conftest with
                        neither CCTOOL_ADAPTER nor CCTOOL_PARTIAL_RUN
                        set, so the conftest writes error first and
                        from_pytest overwrites it.
                        wf_implement_requirement then reports did not
                        pass for a broken fixture as though the
                        implementation failed, which is the conflation
                        ddr_test_execution exists to prevent.

