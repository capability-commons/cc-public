title:                  A harness error read from a JUnit report is now an error
brief:                  |
                        Fixed. evidence._junit reads an error element
                        as error and a failure element as failed, and
                        the observing run no longer writes
                        whole-session evidence.
description:            |
                        The mapping was OUTCOME_FAILED where the tags
                        held failure or error. It now returns error,
                        failed, skipped or passed, one per element
                        kind, and
                        test_a_junit_error_is_an_error_and_a_junit_failure_is_a_failure
                        holds each against a report written for it.

                        The verify component names each node with the
                        outcome read for it, so a fixture that could
                        not be built now stops the run saying error
                        rather than failed.

                        The second half of the finding is fixed too:
                        evidence.observe sets CCTOOL_PARTIAL_RUN in
                        the environment of the run it launches, so the
                        conftest of the tree being read declines to
                        write evidence from a session that ran the
                        tests of one requirement. Which of the two
                        writers stood was previously an ordering. The
                        variable is named once, in cc_public.evidence,
                        and the conftest reads it from there.

