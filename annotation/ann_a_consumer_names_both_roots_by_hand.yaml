title:                  A consumer names both roots by hand on every writing command
brief:                  |
                        The tasks a consumer is given cover checking,
                        formatting and committing. Making and editing
                        items are not among them, so both roots are
                        typed each time or forgotten.
description:            |
                        A consumer segment reads its own items and the
                        core's together. The tasks it is given cover
                        that for the commands that read everything:
                        check, gate, format and commit each name both
                        trees.

                        The commands that make and edit items are not
                        among them. new, set, link, insert, unlink,
                        rename and show have no task, so each is run
                        as cctool with both roots typed out, or run
                        without them.

                        Observed on 2026-09-14 in the Axair camera
                        simulator, whose task list holds check, gate,
                        format, commit and a bare cctool. Running
                        cctool show through that bare task resolves
                        nothing from the core, because it carries no
                        roots.

                        Typing both roots each time is the kind of
                        thing that is done correctly for a week. What
                        makes it more than tedium is what happens when
                        it is forgotten: an edit that cannot see the
                        core fails loudly and is corrected, but a new
                        item written without --root is given the wrong
                        rights and says nothing, which is
                        ann_new_gives_another_tree_the_core_rights.

                        This is not a fault in the tool. It is that
                        what a consumer needs to set up is written
                        nowhere, and was arrived at once, by hand, for
                        one repository. A consumer that is started by
                        copying that one inherits whatever it got
                        right and whatever it did not.

