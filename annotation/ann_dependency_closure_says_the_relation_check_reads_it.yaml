title:                  The closure decision says the relation check reads dependency, and it does not
brief:                  |
                        The consequence says the relation check reads
                        it beside domain, range, acyclic, transitive,
                        incompatible and cardinality;
                        check/relation.py has no key for dependency.
description:            |
                        The keys of the relation check run from domain
                        to maximum; dependency is read by the closure
                        and by the changed projection. A reader of the
                        decision looks for a relation finding that
                        cannot exist.

