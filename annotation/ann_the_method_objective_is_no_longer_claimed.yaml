title:                  The method objective is no longer claimed by anything
brief:                  |
                        Fixed by withdrawing. The one inspection case
                        has a method, a case and an attestation and no
                        execution, and by the same means is what the
                        objective asks.
description:            |
                        The tree holds tm_manual_inspection,
                        tc_committer_writes_record and one attestation
                        row, and no execution names either. A test's
                        evidence comes from a run and a manual
                        method's comes from cctool attest, so the
                        means differ exactly where ddr_test_execution
                        made the point of the model.

                        Both claims are withdrawn and the objective
                        says why. qst_test_execution.carrying_out asks
                        what records the carrying out of a method a
                        person performs, which is the missing piece
                        rather than a wording problem.

