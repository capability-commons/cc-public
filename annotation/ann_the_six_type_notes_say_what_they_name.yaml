title:                  Six type notes now say what schema the type names
brief:                  |
                        Amended. Each says the schema it names is the
                        shape of one entry, and the register names the
                        schema of the whole table.
description:            |
                        The notes of the six said the type names no
                        schema while the same change gave each an
                        r_is_specified_by_schema edge to its entry
                        schema, so a reader of the entry was told the
                        opposite of what the edge beneath it said.
                        Three sibling notes had been rewritten in that
                        change and these six were not.

