title:                  The tree is now walked one way
brief:                  |
                        Fixed. The facts, the trace projection and the
                        identifier check all read
                        cc_public.item.iter_item; three walks are
                        deleted.
description:            |
                        item.py said every module that needs an item
                        by name reads it, so the tree is walked one
                        way, while facts, trace and the identifier
                        check each kept a walk with a different
                        predicate: item and identifier accepted an id
                        or a guid, facts and trace a guid alone.

                        Measured before changing anything: all three
                        walks found 1881 items on this tree, so the
                        predicates had not diverged yet. After the
                        change the facts are identical, 1881 items,
                        1979 edges and 1158 containments, and the
                        query and source tests pass.

                        The tree loader walks through the identifier
                        check, so it follows. item.py now names the
                        four readers rather than claiming the property
                        in the abstract.

