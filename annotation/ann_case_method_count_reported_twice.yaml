title:                  A case with zero or two methods is reported by two checks
brief:                  |
                        r_uses_test_method declares a minimum and a
                        maximum of one and testing.resolve refuses a
                        case naming other than one method, so one
                        fault gives two critical findings, which
                        ddr_relation_cardinality forbids.
description:            |
                        Unlinking the method from tc_named_query_run
                        in a copy gave a relation finding, holds 0
                        r_uses_test_method edges, and a testing
                        finding, names 0 test methods; a second method
                        gave both again. The decision says one fault
                        is not reported twice and gives r_instantiates
                        a maximum alone because the workflow check
                        already reports the missing component; the
                        case it names as the reason for the property
                        is the one that breaks its rule.

