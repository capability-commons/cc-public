title:                  The projection answers differently by an argument one caller supplies
brief:                  |
                        Whether an analysis is current is computed in
                        the check layer and handed to the projection
                        as an optional set, so the one projection the
                        check and the command read gives two answers
                        depending on who calls it, and silently.
description:            |
                        is_analysed is None where the set is absent
                        and the gap fires only where it is False;
                        accept, the evidence check and impact call
                        without it. The reason given is that reading
                        an analysis means reading source, which the
                        foundation cannot; the evidence digests
                        already live in a check for the same reason,
                        so the split is not new, but degrading rather
                        than refusing is.

