title:                  The analysis digest leaves out the module context the judge read
brief:                  |
                        A coverage analysis row is digested over the
                        criteria and the source of the verifier, while
                        the judge reads the module context as well,
                        added because unstable verdicts turned on a
                        constant outside the definition, so a change
                        to that constant leaves a reading current.
description:            |
                        _source_of returns source_of alone and never
                        context_of; the eval scope includes module;
                        the coverage analysis tests hold staleness on
                        a change inside the definition only. A reading
                        stands while the value its verdict turned on
                        has changed, which is the undermining the
                        decision warns of.

