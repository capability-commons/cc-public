title:                  Contrast alone has too little room left to carry position
brief:                  |
                        If every level carrying text must clear 4.5 to
                        1, the three levels have to fit between 4.5
                        and 21 to 1, and the faintest of them is no
                        longer far from the middle one.
description:            |
                        The finding is right and its consequence
                        reaches further than the remedy it proposes. A
                        redundant cue is necessary, and the reason is
                        not only that colour should never be the sole
                        carrier of meaning. It is that the legible
                        range is not wide enough to hold three steps a
                        reader can tell apart at a glance. That is
                        evidence bearing on the orientation question,
                        and it argues for an account of structure
                        rather than for a better choice of greys.

