title:                  Six verifiers are judged not to exercise the criteria they verify
brief:                  |
                        evl_test_exercises_criteria held six verifier
                        and requirement pairs unmet, each unanimously,
                        for a success criterion the test never
                        asserts: the file and path of a finding
                        resolving, the guids of qualified items
                        surviving a rename, a typed count matching the
                        edge facts, a pass number never exceeding the
                        budget, and each edge of a reported path being
                        named.
description:            |
                        The pairs are the two edit tests with
                        req_checker_locates_each_finding and
                        req_renamer_keeps_guid, the named query test
                        with req_typed_query_run, the budget test and
                        tc_executor_honours_budget with
                        req_executor_honours_budget, and
                        tc_path_reported with req_path_reported. The
                        tests predate the baseline; the cases and the
                        eval do not. No coverage analysis item records
                        any of the six readings, which is the
                        objective obj_coverage_analysed asks for and
                        two items claim to satisfy. The judge is shown
                        the implementation beside the test on every
                        pair, which
                        ann_coverage_judge_shown_the_implementation
                        records, so the reviewer reads these as
                        advisory and worth a person reading each pair.

