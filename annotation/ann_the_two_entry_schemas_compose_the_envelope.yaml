title:                  The two entry schemas now compose the entry envelope
brief:                  |
                        Fixed. sch_entry_criticality and
                        sch_entry_gate_tool carry the allOf the other
                        eight have, and the eighteen entries are now
                        reached by the prose evals.
description:            |
                        The registers closed the entries by naming
                        sch_entry beside the specific schema, so
                        validation was right and the eval selector,
                        which anchors on the schemas an item composes,
                        never reached them.

                        Measured before: selecting for evl_plain_text
                        gave term 124, t 62, unit 48 and crit 0, gt 0.
                        After: crit 10 and gt 8. That is the defect
                        ddr_embedded_item_schema exists to remove,
                        persisting for two registers, and nothing had
                        recorded it as a choice because it was not
                        one.

