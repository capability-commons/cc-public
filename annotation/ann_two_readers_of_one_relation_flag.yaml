title:                  Responsibility and dependency were read by two functions of one shape
brief:                  |
                        trace.responsibility and testing.dependency
                        each walked the relation register for one
                        boolean, in two modules, so a third flag would
                        have brought a third walker.
description:            |
                        This review added trace.dependency for the
                        changed projection and made testing.dependency
                        read it, so one reader serves both; the record
                        of the shape is kept here so that the next
                        flag, and a partner reading the register,
                        follows the same path.

