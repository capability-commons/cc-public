title:                  An execution may carry three digests and name nothing
brief:                  |
                        sch_test_execution requires digest_method,
                        digest_case and digest_under_test and none of
                        the identity pairs beside them, so a valid
                        execution need not say what it bound.
description:            |
                        Deleting the six identity fields and the
                        adapter pair from the execution in
                        test_test_execution and validating against
                        sch_test_execution returned no error.
                        ddr_test_execution says an execution records
                        what was bound, and write_execution_test reads
                        id_case unconditionally, so such an item is
                        valid and unusable.

