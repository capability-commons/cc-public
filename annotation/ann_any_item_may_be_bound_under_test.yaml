title:                  Any item may be bound as the item under test
brief:                  |
                        The binding of the item under test is a free
                        assertion: the runner checks only that the
                        item exists, r_tests declares no range, and
                        nothing relates the bound item to what the
                        test function exercises.
description:            |
                        cctool test tc_path_reported --under-test
                        mark_public printed completed, result passed,
                        exit 0, and with --evidence would write a
                        passing row naming mark_public. The adapter
                        guards against reading one tree and running
                        another, and not against this. ddr_test_case
                        leaves the item under test to the execution,
                        and nothing decides what may be bound, so the
                        immutable record of what was bound can say
                        anything the caller typed.

