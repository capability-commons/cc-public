title:                  The closure record now points at the register for what declares dependency
brief:                  |
                        Amended. The three it named are kept as the
                        reasoning, the three ddr_annotation added are
                        named, and which relations declare it is read
                        from the register.
description:            |
                        The record argued that declaring more would
                        widen every closure on an argument nobody had
                        made, and ddr_annotation declared it on three
                        more two days later without either record
                        being amended. A reader trusting the list
                        would mis-predict what an evidence digest
                        covers once an annotation is about an
                        implementing function.

                        The decision now says what an assertion rests
                        on, and says that the list is the register's
                        rather than the record's.

