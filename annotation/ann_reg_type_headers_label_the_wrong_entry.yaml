title:                  Comment headers in the type register label the entry above the one they name
brief:                  |
                        The printer moved status, alias, prefix,
                        regex_id and the new id_term above each entry
                        relation list, so the hand-written headers
                        that preceded the next key now sit inside the
                        previous entry between its regex_id and its
                        id_term.
description:            |
                        Lines 76 to 82 of reg_type.yaml hold the
                        prefix and regex_id of t_type, then the header
                        for t_schema, then the id_term of t_type; ten
                        headers sit so. A reader scanning by the
                        headers reads the term of t_type as that of
                        t_schema.

