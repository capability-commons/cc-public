title:                  A criticality key is now held to the dimension of the entry it names
brief:                  |
                        Fixed. The requirement check reports a
                        criticality declared under one dimension
                        naming a level of another.
description:            |
                        Declaring safety naming crit_security_60 gave
                        no finding, and the derivation read the entry
                        and gave the item a security level under a
                        safety key.

                        check.requirement._check_criticality reads the
                        dimension of every criticality entry from the
                        register and compares it with the key the
                        requirement declared under. The finding says
                        which dimension the level is on and why the
                        key matters: a level of another dimension is
                        declared on neither.

                        Two tests hold it, one each way: a key naming
                        a level of another dimension is reported, and
                        a key naming a level of its own dimension is
                        not.

