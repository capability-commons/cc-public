title:                  The trace check docstring now describes what the check does
brief:                  |
                        Amended. The brief and the description cover
                        the projection's rules, the severity by
                        status, and what the check reads of a coverage
                        analysis.
description:            |
                        The docstring described the one rule check the
                        module was: that a requirement derives from
                        something, advisory. It reads six rules from
                        the projection, reports an unmet analysis, and
                        claimed five objectives.

                        evl_record_and_code_agree, and any reader
                        judging whether the module satisfies what it
                        claims, was shown something narrower than what
                        is there. The description now says where the
                        rules live and why, which is that the check
                        and the trace command read one projection so
                        they cannot differ.

