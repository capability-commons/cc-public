title:                  The verification standard record now describes the tree that exists
brief:                  |
                        Amended. Three paragraphs: what selects the
                        objectives, what the coverage objective lacks,
                        and what the adapter control set accounts for.
description:            |
                        The consequence said this model carries no
                        criticality so nothing says which objectives
                        apply, and that the adapter is verified by
                        nothing. The register says what each level
                        requires, the trace check reads it in two
                        places, and the adapter control set shows it
                        reading seven kinds of outcome.

                        It also said the coverage objective is not
                        met, which is still true and for a sharper
                        reason: the analysing happens and the
                        recording does not, because nothing writes a
                        coverage analysis. The paragraph says that
                        now, and obj_coverage_analysed is claimed by
                        nothing.

