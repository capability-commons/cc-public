title:                  The pipeline now compares the tree after the gate
brief:                  |
                        Fixed. A step after the gate refuses a push
                        whose committed evidence is not what the run
                        observed.
description:            |
                        The gate runs the tests before the
                        closed-world check, and the tests rewrite the
                        evidence item when they observe something new,
                        so a green pipeline said the evidence can be
                        current and not that the committed record is.
                        A commit runs no tests, so committing stale
                        evidence was ordinary.

                        git diff --exit-code over evidence/ after the
                        gate says the second thing. It is clean unless
                        a run observed something new, since the writer
                        leaves the item alone when it observes what
                        the last run did. The pytest entry says what a
                        green gate does and does not say.

