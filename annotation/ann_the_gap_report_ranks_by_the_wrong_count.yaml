title:                  The glossary gap report buries the words that matter
brief:                  |
                        It ranks a word by how many times it appears,
                        so written at four hundred and twenty two
                        leads and travel at twenty five never
                        surfaces. The number that matters is how many
                        records use the word, not how often.
description:            |
                        A word used four hundred times in one record
                        is that record's habit. A word used once each
                        in twenty five records is a distinction the
                        repository is relying on and has not defined,
                        and it is the second that a glossary is for.
                        Counting records rather than occurrences would
                        put the load bearing words at the top, which
                        is where somebody looking for what to define
                        would find them. The pair report has the same
                        shape and probably the same fault.

