title:                  Both method records now say what the register holds
brief:                  |
                        Amended. The register holds a pytest function
                        and one method each for inspection, analysis
                        and demonstration, and a requirement verified
                        by one of those carries a case.
description:            |
                        Both consequences said the register holds one
                        entry and that until it holds a method that is
                        not code the requirements that most need a
                        case cannot be given one. Three manual methods
                        landed after both records, and
                        tc_committer_writes_record uses one of them.

                        ddr_test_case_adoption called that the
                        constraint that binds, and reported it open
                        while the tree had closed it. Both now say
                        what is there, and ddr_test_case_adoption says
                        what a case adds to an attestation, which is
                        what was expected stated before anyone
                        observed.

