title:                  The interface document schema settles surfaces nothing uses
brief:                  |
                        sch_interface_control_document declares C and
                        C++ surfaces, dataflow-step surfaces with
                        input, output and state tables and their
                        execution semantics, parameter modes,
                        ownership and lifetime, and one python surface
                        of six members uses it, so the ontology was
                        settled before any use could test it, which is
                        the order ddr_annotation refuses for its own
                        increment.
description:            |
                        The record is written in a voice unlike the
                        others, imperative and with was considered,
                        and carries the plan it came from. This is a
                        judgement and not a measurement: the cost is a
                        large closed schema and companion checks that
                        hold facts no item exercises, and the question
                        of what a second language or a dataflow step
                        needs is answered without an instance.

