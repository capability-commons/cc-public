title:                  The coverage analysis type names the measure as its concept, not the record
brief:                  |
                        t_coverage_analysis names
                        term_criteria_coverage, which defines the
                        property read rather than the reading, while
                        every other type names the concept its items
                        are.
description:            |
                        The term says whether the verification of a
                        requirement exercises what it requires and
                        adds that a coverage analysis item records one
                        such reading; no term names the record.
                        t_assessment names term_assessment and t_sweep
                        term_sweep. Walking from the type to its
                        concept lands on the measure.

