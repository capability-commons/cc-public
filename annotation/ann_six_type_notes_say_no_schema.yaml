title:                  Six type entries say the type names no schema while each now names one
brief:                  |
                        The notes of t_protective_mark, t_term,
                        t_requirement_characteristic, t_document,
                        t_process_word and t_unit say the type names
                        no schema and the register schema governs its
                        entries, and the same change gave each an
                        r_is_specified_by_schema edge to its entry
                        schema.
description:            |
                        grep names no schema over reg_type finds the
                        six; the notes of t_writing_style_rule,
                        t_requirement_rule and t_framing were
                        rewritten in the same change. A reader of the
                        entry is told the opposite of what the edge
                        beneath it says.

