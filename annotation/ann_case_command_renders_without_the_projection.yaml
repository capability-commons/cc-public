title:                  cctool case renders a subject without the projection a sweep uses
brief:                  |
                        case.case calls render with neither
                        map_location nor map_guid, so a case for a
                        test case, or for any item whose source comes
                        by r_is_implemented_by, holds a subject
                        without the source a sweep shows, against
                        ddr_eval_measurement.
description:            |
                        Rendering tc_executor_honours_budget with
                        req_executor_honours_budget through the case
                        signature gives 315 characters and no source;
                        through select it gives 37401 with source and
                        module. The baseline call was the same and
                        4c9422e added map_location to render and
                        select without touching case.py; run.py
                        renders a third way, with map_guid and no
                        map_location. A person who suppresses or
                        confirms a finding on a test case records a
                        verdict on text the judge never saw.

