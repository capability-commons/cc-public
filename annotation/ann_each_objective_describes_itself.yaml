title:                  Each objective now describes itself
brief:                  |
                        Fixed. Nine identical paragraphs replaced by
                        nine descriptions, each saying what the
                        objective asks, which document it is taken
                        from, which record adopted it, which level
                        requires it, and what reads it.
description:            |
                        The nine descriptions were one distinct string
                        restating the mechanism of ddr_objective, and
                        it said adopted by ddr_verification_standard,
                        which was wrong for obj_tool_accounted, taken
                        from DO-330 by ddr_tool_verification, and for
                        obj_rigour_selected_by_level, adopted by
                        ddr_criticality. A description deletable from
                        all nine without loss is one nobody reads.

                        Each now says what a reader of that objective
                        needs, and the two misattributions are
                        corrected in the prose and in the r_decides
                        edges added beside them.

