title:                  Every criticality entry says nothing varies by it, and the trace does
brief:                  |
                        All ten register entries say nothing varies by
                        the level yet and ddr_criticality says the
                        levels are inert until a check varies by them,
                        while the trace makes a shared verdict
                        critical and demands a coverage analysis from
                        level forty upward.
description:            |
                        Declaring crit_safety_60 on an accepted
                        requirement in a copy produced one critical
                        finding; ddr_coverage_analysis says levels
                        forty and above require the objective. Someone
                        reading a level before declaring it is told it
                        changes nothing.

