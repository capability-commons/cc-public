title:                  The trace check docstring describes the one-rule check it was
brief:                  |
                        The module brief and description say it checks
                        that every requirement derives from something
                        and that the finding is advisory, while it
                        reads six rules from the projection with
                        severity by status, reports unmet analyses and
                        claims five objectives by r_satisfies.
description:            |
                        The title constant is broader than the
                        docstring above it, and the r_satisfies edges
                        were added without touching the prose.
                        evl_record_and_code_agree and any reader
                        judging whether the module satisfies the
                        objectives it claims are shown something
                        narrower than what is there.

