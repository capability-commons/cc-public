title:                  The document restates a signature nothing holds to the code
brief:                  |
                        The parameters, defaults and returns a member
                        states duplicate the definition, and the check
                        holds a member to its source by name alone, so
                        the stated signature drifts silently while the
                        edge still resolves.
description:            |
                        Renaming the parameters of Database.path in a
                        copy produced no interface finding; the
                        members still said name_from and name_to.
                        Deleting the source item is caught by the
                        reference check, so absence is held and drift
                        is not. ddr_source_item rejected a second copy
                        of a definition for the same reason.

