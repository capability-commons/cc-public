title:                  The execution does not record whether the tree was dirty
brief:                  |
                        ddr_test_execution asks the adapter to report
                        whether the tree was dirty, and evidence.head
                        already computes it, but _environment writes
                        the revision alone.
description:            |
                        An execution written in a copy reads the tree
                        was at a revision and nothing of cleanliness;
                        sch_test_execution has no such field. A reader
                        comparing an execution to its commit cannot
                        tell whether the observation was of that
                        commit or of an edited tree.

