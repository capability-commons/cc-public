title:                  The coverage control cases are re-rendered and the eval measured again
brief:                  |
                        Fixed. All nine cases were re-made through the
                        current projection and the eval measured once;
                        the rates moved and the recorded row now
                        describes what a sweep shows.
description:            |
                        All nine differed from the live render of the
                        pair each snapshotted, and the confidence
                        check read every row current, because the
                        digest covers the stored subjects and not what
                        the projection makes of the items they name.

                        Each case was re-made through cctool case from
                        the items its r_is_snapshot_of edges name,
                        keeping its verdict, its origin and its note.
                        Measured afterwards, over nine cases at five
                        samples: false positive 0.0, false negative
                        0.333, unanimity 1.0, where the recorded row
                        had said 0.167 and 1.0. The rate is worse and
                        it is the rate on the input a sweep now
                        produces.

                        Two confirmed cases the judge had called unmet
                        now read met, which is what moved the false
                        negative rate. Both are held to their verdicts
                        by reading, which is recorded on each case.

                        Twelve snapshots across nine other control
                        sets have drifted too, for a different reason:
                        the case command and the projection render an
                        embedded item differently. That is recorded as
                        qst_eval_measurement.rendered and
                        qst_eval_measurement.embedded, and the test
                        counts them rather than passing over them.

