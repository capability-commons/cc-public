title:                  An execution now says whether the tree was dirty
brief:                  |
                        Fixed. The environment reads evidence.head,
                        which already computed it, so an execution
                        says the revision and whether anything had
                        changed since.
description:            |
                        ddr_test_execution asked the adapter to report
                        it and the environment wrote the revision
                        alone, so a reader comparing an execution to
                        its commit could not tell whether the
                        observation was of that commit or of an edited
                        tree.

