title:                  Four new relation entries argue where an entry describes
brief:                  |
                        The descriptions of r_satisfies,
                        r_is_controlled_by, r_is_about and r_supports
                        explain why the relation is as it is, while
                        the same change rewrote older entries from
                        argument to statement and each argument is
                        already made in the deciding record.
description:            |
                        r_satisfies says its open domain is deliberate
                        rather than an omission and why;
                        r_is_controlled_by why an absent edge is left
                        absent; r_is_about why the minimum is one and
                        there is no maximum; r_supports why support
                        and challenge are not incompatible, calling
                        that a question for use rather than for this
                        entry. ddr_objective, ddr_gate_tool and
                        ddr_annotation make each argument. The
                        register copy cannot be revised as a decision
                        can, and the two will drift.

