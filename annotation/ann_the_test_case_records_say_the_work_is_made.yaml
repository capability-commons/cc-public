title:                  The test case record now says the work is made
brief:                  |
                        Amended. The configuration check is named as
                        the testing check, and the schema is said not
                        to require an expectation.
description:            |
                        The record said the check does not yet exist
                        and that the schema does not yet allow an
                        absent expectation, while cctool check lists
                        testing, sch_test_case does not require
                        expectation, and testing.expectation reads the
                        success criteria where a case states none. A
                        reader planning from the record would schedule
                        the work again.

