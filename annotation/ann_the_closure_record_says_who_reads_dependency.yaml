title:                  The closure record now says what reads dependency
brief:                  |
                        Amended. The relation check does not read it,
                        because it constrains no edge; the closure and
                        cctool changed read it in opposite directions.
description:            |
                        The consequence listed dependency among the
                        constraints the relation check reads, and the
                        check has no key for it, so a reader looked
                        for a finding that cannot exist.

