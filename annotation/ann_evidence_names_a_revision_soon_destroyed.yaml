title:                  Evidence names a revision the next gate run destroys
brief:                  |
                        The snapshot a run is observed on is held
                        alive only by the gate worktree. The next run
                        points that worktree elsewhere, and the
                        revision the evidence names becomes
                        collectable.
description:            |
                        The snapshot the gate runs on is made with
                        commit-tree and is a child of HEAD, so no
                        branch reaches it. One thing keeps it alive:
                        the gate worktree, whose detached HEAD is at
                        it. The next run points that worktree at a new
                        snapshot, and from that moment nothing reaches
                        the old one.

                        This is observed. The run committed at
                        79214798ea wrote revision 6c1487337a into the
                        evidence, and that commit is reachable today
                        from the gate worktree HEAD alone. The
                        snapshot of the run before it, 5e65e53aac, is
                        reachable from nothing: git rev-list over
                        every ref does not list it. A git gc will drop
                        it.

                        So each run orphans its predecessor, and
                        evidence committed to the history names a
                        revision that the next run makes collectable.
                        The evidence outlives what it points at.

                        The consequence is stated by the code that
                        writes the field.
                        cc_public.adapter._environment says it returns
                        what a later reader needs in order to run this
                        again. A revision that has been collected
                        cannot be checked out, so the field does not
                        do the one thing its own docstring gives as
                        its purpose. An agent that reads evidence and
                        tries to reproduce an observation will find a
                        commit that is not there, and the failure will
                        look like a broken repository rather than a
                        design that did not keep what it named.

                        Nothing depends on it today, which is why this
                        is an annotation and not a defect report. The
                        evidence check reads digests of the
                        requirement, its implementation and the test,
                        and those are content and do not need the
                        commit. The revision is provenance, and it is
                        provenance that expires.

                        qst_test_in_a_worktree.stale asks a
                        neighbouring question, what stops a worktree
                        and its snapshot outliving the work they were
                        made for. This is the other failure: the
                        snapshot is destroyed while something still
                        points at it. The two want answering together,
                        since a rule that keeps snapshots longer
                        answers one and worsens the other.

                        Three repairs suggest themselves and this
                        annotation chooses none. The snapshot could be
                        given a ref, which keeps it and raises the
                        question of when the ref goes. The thing
                        tested could be a tentative commit on a
                        branch, which qst_test_in_a_worktree.staged
                        already contemplates and which gives the
                        revision a name that survives. Or the evidence
                        could name what the snapshot was taken from, a
                        commit that does persist, together with the
                        fact that uncommitted work was included.

