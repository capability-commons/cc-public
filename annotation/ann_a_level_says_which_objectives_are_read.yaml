title:                  Every level now says which of the objectives it requires are read
brief:                  |
                        Fixed as prose. All ten entries say two of the
                        objectives below are read and the rest are
                        declared and read by nothing.
description:            |
                        A level's requires list was read for two
                        objective ids held in the projection, so the
                        other objectives changed nothing when a level
                        was declared, and requires meant different
                        things for different rows. A reader of
                        crit_safety_60 believed three cases per
                        condition were demanded and none was.

                        The list is kept, because it is what a check
                        will read as each objective is made
                        mechanical, and each entry now says plainly
                        how far that has got. obj_case_per_condition,
                        obj_method_not_code and obj_tool_accounted are
                        the three a level names and nothing reads.

