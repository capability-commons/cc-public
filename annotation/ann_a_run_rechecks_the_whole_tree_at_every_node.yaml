title:                  A workflow rechecks the whole tree after every node
brief:                  |
                        A run checks after each node so that a
                        critical finding restores the tree, and each
                        of those is a check of every document, not of
                        what the node wrote.
description:            |
                        The tests that drive workflows are the
                        heaviest in the suite: the six heaviest
                        modules are forty two per cent of it by
                        contended time and five of them run workflows.
                        A node writes a handful of items and the check
                        that follows reads eight hundred and eighteen
                        documents. Checking what the run touched, or
                        only the checks that what it touched can
                        reach, would cut the heaviest tests
                        severalfold. It is a change to what fail
                        closed means after a node, so it wants a
                        decision rather than an optimisation.

