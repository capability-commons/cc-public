title:                  The conftest says a partial session would drop rows, and record keeps them
brief:                  |
                        The comment justifying CCTOOL_PARTIAL_RUN says
                        a partial session would drop the rows for
                        every case it did not run, while
                        evidence.record replaces only the rows it
                        observed and keeps the rest, as its docstring
                        and the pruning question of
                        ddr_verification_evidence say.
description:            |
                        The real effect of a partial run is a
                        rewritten time, revision, dirtiness and any
                        re-stamped digest, which is a reason but not
                        the one written. A reader deciding whether to
                        set the variable for a new pytest path is
                        given a false reason.

