title:                  The packaging entry now says what its control shows
brief:                  |
                        Accepted and recorded. The control exercises
                        the predicate the smoke test rests on and not
                        the task, which the blind spot now says.
description:            |
                        Every other control runs its tool in a
                        subprocess and watches it exit non zero. This
                        one asserts a path comparison answers both
                        ways, so nothing shows package-check failing,
                        and the register said the tool is shown to
                        fail.

                        Not fixed, because a control that built and
                        installed would reach the network on every
                        run, which is the reason the task is out of
                        the local gate in the first place.
                        qst_gate_tool.packaging asks what shows it
                        failing. The register now says what is shown
                        rather than implying more.

