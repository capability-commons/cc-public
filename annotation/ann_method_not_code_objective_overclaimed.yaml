title:                  obj_method_not_code is claimed, and the one inspection case has no execution
brief:                  |
                        The objective says a non-code verification
                        carries a method, a case, an execution and
                        evidence by the same means as one verified by
                        test; the tree holds a method, a case and an
                        attestation row for
                        tc_committer_writes_record, no execution, and
                        evidence written by attest rather than by the
                        path a test takes.
description:            |
                        No execution names the case or a manual
                        method; evd_attestation holds one row; two
                        items claim the objective. The claim reads as
                        same means where the means differ in the
                        execution record ddr_test_execution made the
                        point of the model.

