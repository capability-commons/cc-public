title:                  The case schema calls the guid the reference; the adapter resolves the id
brief:                  |
                        sch_case_pytest_function requires guid_test
                        and describes it as the resolvable reference,
                        while specify reads id_test only and never the
                        guid.
description:            |
                        The reference check keeps the pair consistent,
                        so nothing runs wrong today; a future adapter
                        copying the pattern would resolve by the id it
                        was told is not the reference.

