title:                  The layers contract has twelve entries and four places say seven
brief:                  |
                        This work grew the import linter contract from
                        eight layers to twelve while restating seven
                        tiers in the contract name, its comment,
                        CLAUDE.md and the new register entry, and
                        ddr_layered_architecture enumerates seven with
                        no adapter, testing, nonconformity or item
                        tier.
description:            |
                        The baseline contract listed cli, workflow,
                        commit and its siblings, edit, check, layout,
                        query and the foundations; HEAD adds adapter,
                        nonconformity, testing and item. The decision
                        no longer describes the architecture the lint
                        enforces.

