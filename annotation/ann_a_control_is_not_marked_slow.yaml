title:                  A control is no longer marked slow, however long it runs
brief:                  |
                        Fixed. The three gate tool controls lose the
                        marker, and the marker says what it now
                        selects, measured.
description:            |
                        Measured on this tree, counting each function
                        at its slowest instance: twenty three tests
                        carried the marker and the three in
                        test_gate_tool.py ran twelve to sixteen
                        seconds, where the rest run forty to a hundred
                        and thirty three. The reviewer counted forty
                        marked and thirty five under a minute, which
                        is the same finding counted by instance rather
                        than by function.

                        The loop a developer trusts was omitting the
                        tests that show the repository check can fail,
                        which is the part that matters. The marker's
                        description now says a control is not marked
                        however long it runs, and gives the
                        measurement and its date rather than a claim
                        of a minute that no longer held.

