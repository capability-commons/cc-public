title:                  The semantics record now says the declaration is carried once
brief:                  |
                        Amended. r_is_narrower_than names the other
                        and r_is_part_of names nothing, which is what
                        carrying it once looks like.
description:            |
                        The decision said the declaration means the
                        same from either end so one entry of a pair
                        carries it, and then said each of the pair
                        names the other. A later author adding a pair
                        could not tell whether to declare it once or
                        twice.

                        The register carries one declaration and the
                        relation test asserts r_is_part_of declares
                        nothing, so the record now describes that.

