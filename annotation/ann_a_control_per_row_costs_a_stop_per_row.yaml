title:                  A control for each row costs a tab stop for each row
brief:                  |
                        Giving every row a disclosure button and every
                        opened row a read control puts one or two tab
                        stops in front of each record, and the
                        Decisions view roots on a hundred and twenty
                        design decisions today.
description:            |
                        The recommendation to begin as nested
                        disclosures rather than as a tree widget is
                        argued from the interaction model, that many
                        rows stay open, that opening is the primary
                        act and that selection is not an operation.
                        All three are accurate and none of them is
                        about the cost of traversal. The tree widget
                        exists to answer exactly that cost, by holding
                        one tab stop for the whole tree and moving
                        within it by arrow key, and it supports many
                        open rows and no selection perfectly well. The
                        choice should be made with the cost in view
                        and measured on a realistic root rather than
                        on the thirteen needs the Design view happens
                        to show.

