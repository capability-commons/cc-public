title:                  The arguing prose is accepted, two items fixed and the rest deferred
brief:                  |
                        Accepted. sch_annotation and sch_case_manual
                        now describe and point at the record that
                        argues; the other thirty two are recorded as
                        qst_writing_style.backlog.
description:            |
                        I read a sample and agree with the judge where
                        the sentence appends a reason or an avoided
                        alternative to a description, which is the
                        shape the finding names. sch_annotation
                        carried why there is no severity and no
                        verdict; sch_case_manual carried why the
                        schema is closed rather than absent. Both
                        arguments are already in the records that
                        decide those items, so the descriptions now
                        name the record instead.

                        The remaining thirty two are deferred rather
                        than rebutted. Each is one or two sentences to
                        move, the argument is already made in a record
                        in every case the finding quotes, and the
                        class is exactly what ddr_eval_schedule
                        decides is found periodically and fixed
                        opportunistically. Deferring it silently is
                        what would be wrong, so it is
                        qst_writing_style.backlog on the record that
                        governs the rule.

