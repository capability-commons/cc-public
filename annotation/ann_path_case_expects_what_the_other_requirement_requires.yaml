title:                  tc_path_reported expects what req_no_path_reported requires
brief:                  |
                        The case verifies req_path_reported only, and
                        its expectation adds an empty list where no
                        path joins them, which is the success
                        criterion of req_no_path_reported, the second
                        requirement the shared function verifies.
description:            |
                        ddr_test_case_adoption keeps an expectation on
                        a case over an undivided function so that the
                        case says which obligation its verdict is
                        about; this one says both while naming one,
                        and a failure of the no-path branch would be
                        reported as this case not meeting an
                        expectation about the wrong requirement.

