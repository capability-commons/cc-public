title:                  The entity a requirement is on is an unchecked word
brief:                  |
                        Five requirements say entity Workbench and
                        twenty one say entity Tool, and the field is a
                        string that nothing resolves, so a typo makes
                        a second entity and nothing reports it.
description:            |
                        The need schema has the same weakness, with
                        entity optional and prose, and a consumer
                        segment names its system of interest in prose
                        too. Making an entity an item would let a
                        requirement name one by both identifiers as
                        everything else does, and would give the rung
                        the need schema already describes, where a
                        need on an entity sits between a need and a
                        requirement. Nothing existing fits: component
                        means a workflow component with ports, and
                        product means an off the shelf thing an
                        assessment weighs. It is systems engineering
                        work with a consumer segment as its proper
                        test, and not something to add while doing
                        something else.

