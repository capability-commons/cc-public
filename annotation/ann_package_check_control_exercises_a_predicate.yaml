title:                  The control named for the packaging check exercises a predicate
brief:                  |
                        test_the_packaging_smoke_tells_the_wheel_from_the_checkout
                        asserts package_smoke.is_inside both ways and
                        never builds, installs or runs package-check,
                        so nothing shows that task exiting non zero,
                        unlike every other control.
description:            |
                        The other controls run their tool in a
                        subprocess: mypy, ruff, lint-imports,
                        pytest-cov and cctool check. gt_package_check
                        says in its blind spot nothing of stopping at
                        the predicate. The register says the packaging
                        tool is shown to fail when what is shown is
                        that a path comparison can return False.

