title:                  The arguing decision fields are accepted and deferred
brief:                  |
                        Accepted and not fixed here. Fourteen decision
                        fields give the reason for a choice where the
                        field should state the choice, and each reason
                        is repeated in the same record's rationale.
description:            |
                        I read several and agree. The sentences are of
                        the shape the finding names, and in each the
                        same record makes the argument again in its
                        rationale, so moving the sentence loses
                        nothing.

                        Deferred as a body rather than fixed one at a
                        time now, with qst_writing_style.backlog
                        recording it. A decision field that argues is
                        longer to read and cannot be told from its
                        rationale, which is a real cost and not an
                        urgent one.

