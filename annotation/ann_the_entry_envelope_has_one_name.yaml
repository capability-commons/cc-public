title:                  The entry envelope now has one name
brief:                  |
                        Fixed. The register_entry alias is gone and
                        all thirteen register schemas compose
                        sch_entry directly.
description:            |
                        sch_register kept register_entry as a bare
                        alias of sch_entry, ten schemas composed the
                        alias and three composed sch_entry, so the
                        next register schema copied from a neighbour
                        would carry whichever it copied.

