title:                  A run of words inside a term is no longer a gap
brief:                  |
                        Fixed. Every run of words inside a term a
                        glossary holds counts as known.
description:            |
                        The report listed writing style thirty one
                        times while the register holds writing style
                        rule and writing style guide, and listed
                        interface control and control document while
                        it holds interface control document. The pair
                        list presented the glossary's own terms back
                        as candidates.

                        _within returns every window of every known
                        term, and _is_known consults it.
                        test_a_run_of_words_inside_a_term_is_not_a_gap
                        asserts all three phrases are absent. A
                        candidate list is read by a person, and one
                        that returns their own terms is a list they
                        stop reading, which is in ddr_glossary.

