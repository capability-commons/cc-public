title:                  The reporting decision fields are accepted and deferred
brief:                  |
                        Accepted and not fixed here. Four decision
                        fields summarise what an artefact does where a
                        decision would make sense before the artefact
                        existed.
description:            |
                        The test is a good one: a decision that could
                        not be written before the thing it decides is
                        a report of the thing.
                        ddr_implementation_trace gained such a
                        paragraph in this range; the other three
                        changed by edges alone and their prose
                        predates the baseline, which the finding says.

                        Deferred with the other two prose findings
                        under qst_writing_style.backlog, rather than
                        rebutted. The judge was unanimous on two of
                        the four and split on the others, so this is
                        the part of the finding I would want a person
                        to read before rewriting a decision field.

