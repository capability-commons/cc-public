title:                  Each of the six pairs was read, and each reading stands
brief:                  |
                        Read individually rather than taken from the
                        verdict. All six verifiers leave a stated
                        criterion unasserted, and the two the judge
                        now calls met are false negatives the measured
                        rate counts.
description:            |
                        Read with the implementation no longer shown
                        beside the test, which was the reviewer's own
                        caution.

                        The checker pair asserts the reported paths
                        are the right strings and asserts nothing
                        about the file existing or the path resolving
                        to a node in it. The renamer pair asserts the
                        renamed component keeps its guid and asserts
                        nothing about the guid of the port it
                        qualifies, which is the second half of the
                        criteria. The typed query pair asserts an exit
                        status and a column header, not the count and
                        not the reason for a refusal. The budget pair,
                        and the case standing for it, assert the run
                        stopped and the edges are exhausted, and read
                        no binding and no pass number. The path pair
                        asserts the length of the steps and the ends,
                        and asserts nothing about each edge being
                        named.

                        Measured again after the re-render, the judge
                        calls the renamer pair met five of five. On
                        reading it is unmet, so that is a false
                        negative, and the recorded rate of 0.333 is
                        what counts it. The judge is not the
                        adjudicator here and the rate says how often
                        it should not be.

                        No coverage analysis item records any of the
                        six. The type, its schema and the check exist
                        and the command that runs the eval and writes
                        what it answered does not, which is
                        qst_coverage_analysis.writer. The readings are
                        on the control cases as notes until there is a
                        writer.

