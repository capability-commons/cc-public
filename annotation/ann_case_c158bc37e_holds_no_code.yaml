title:                  Case c158bc37e holds the source-less subject the eval note calls a defect
brief:                  |
                        The confirmed unmet case for
                        tc_executor_honours_budget holds the case
                        title and brief and the requirement and no
                        code, so its verdict is unmet for the reason
                        the eval note rejects.
description:            |
                        Its subject has no source section; the eval
                        note records that judging a case from prose
                        alone returned unmet five of five and was a
                        defect in what the judge was shown. The case
                        was made after 4c9422e through the case
                        command. One of the six confirmed cases behind
                        the false negative rate measures whether the
                        judge says unmet when shown nothing.

