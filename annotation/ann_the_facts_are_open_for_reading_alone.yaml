title:                  The facts database is now open for reading alone
brief:                  |
                        Fixed. The connection is set to query only
                        once the facts are loaded, so a statement that
                        would write raises.
description:            |
                        An obligation is what a provider must do, and
                        DELETE FROM item returned an empty result and
                        emptied the table.

                        PRAGMA query_only is set after the facts are
                        inserted. edges_among wrote a temporary table
                        to hold the guids it was matching, which query
                        only refuses too, so it binds them instead.

                        test_the_facts_are_open_for_reading_alone
                        asserts the delete raises and the count is
                        unchanged. The obligation now says what the
                        provider does rather than what a caller should
                        refrain from.

