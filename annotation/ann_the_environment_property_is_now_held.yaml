title:                  The property the environment decision keeps is now held by a test
brief:                  |
                        Fixed. A test parses every module of the tool
                        and asserts none imports the model stack as it
                        loads.
description:            |
                        ddr_environment_shape decides that the split
                        stays available only while every import of the
                        model stack sits inside the function that
                        needs it, and nothing held it. A module level
                        import anywhere the gate reaches would have
                        closed the option, and the record says so.

                        test_the_model_stack_is_imported_inside_the_function_that_needs_it
                        reads the top level statements of each of the
                        ninety one modules and asserts none imports
                        dspy, litellm or openai. Parsed rather than
                        grepped, so an import inside a function is not
                        a false alarm and an import at the top of a
                        module cannot hide behind formatting.

