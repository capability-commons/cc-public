title:                  The case for the budget requirement now holds the code it stands for
brief:                  |
                        Fixed. Re-made through the projection, the
                        case shows the source of the function it names
                        by r_is_implemented_by, so its unmet verdict
                        no longer rests on being shown nothing.
description:            |
                        The case held the case title and brief and the
                        requirement and no code, and the eval note
                        records that judging a case from prose alone
                        returned unmet five of five and was a defect
                        in what the judge was shown.

                        Re-made, it is
                        case_test_exercises_criteria.cd7e3e1e8 and
                        holds the source of
                        pyf_test.test_run.test_back_edge_is_exhausted_when_the_budget_is_spent
                        and its module. The judge read it unmet five
                        of five with the code in front of it, and the
                        reading holds: no assertion reads a binding or
                        its pass number, which is what the criteria
                        are about. The note is unchanged because the
                        reason was always that, and now the subject
                        shows it.

