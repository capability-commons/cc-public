title:                  The type entry schema no longer calls a required field optional
brief:                  |
                        Amended. The description says required, as
                        ddr_concept_reference decides, and keeps the
                        sense in which a readable id is advisory.
description:            |
                        The description of id_term opened with
                        Optional while required lists it, so a bare
                        entry reports it as a required property. A
                        schema is what travels to a partner, and this
                        one told them the opposite of what the
                        validator enforces.

                        The two senses were being confused: a readable
                        id is advisory in that the guid beside it
                        resolves, and that is not the same as the
                        field being optional. The description now
                        separates them.

