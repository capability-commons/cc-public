title:                  The verification standard record describes a tree that no longer exists
brief:                  |
                        Its consequence says this model carries no
                        criticality so nothing says which objectives
                        apply, and that the pytest adapter is verified
                        by nothing, while reg_criticality requires
                        objectives the trace reads and the adapter has
                        a control set claiming obj_tool_accounted.
description:            |
                        trace._demands reads the requires lists;
                        test_adapter_control was added at 9a95aa5,
                        after the record, and satisfies
                        obj_tool_accounted; gt_pytest_adapter is shown
                        to fail. A reader sent here by ddr_objective
                        is told two objectives are unmet that the tree
                        claims.

