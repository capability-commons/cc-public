title:                  The sweep counts now say they cannot be run again
brief:                  |
                        Amended in five records. Each says the sweep
                        was not kept as an item, and the counts that
                        had moved are replaced by what a reader can
                        run.
description:            |
                        Ten advisories in three hundred and six
                        judgements, eighty three then eighty nine
                        records for one sweep, forty five items where
                        sixty two were, and four hundred and four
                        findings where five hundred and two were: none
                        reproducible, because sweep/ holds no item
                        although cctool sweep and t_sweep exist for
                        exactly that.

                        Where a count justified a decision it is kept
                        and labelled as what was seen at the time.
                        Where it was a fact about the tree that has
                        since moved, it is replaced by the command
                        that answers it. qst_improvement_loop.kept
                        asks what keeps a sweep, which is the cause
                        rather than the symptom.

