title:                  The annotation record points at the command rather than counting senses
brief:                  |
                        Amended. cctool glossary --senses names them,
                        and it reports four: anchor, challenge,
                        concept and coverage.
description:            |
                        The rationale offered eleven as the precedent
                        for taking a collision, and the number is
                        wrong by nearly three times. It was probably a
                        count of words appearing in more than one
                        entry id rather than of words two entries
                        claim.

                        A count in prose about a register goes stale
                        as the register grows, so the record names the
                        command instead. That is the same remedy
                        applied to the gate tool record.

