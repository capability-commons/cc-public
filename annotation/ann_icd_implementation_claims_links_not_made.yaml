title:                  The implementation record claims links the specimen does not carry
brief:                  |
                        ddr_icd_implementation says each member of
                        icd_cc_public_query is linked to the source
                        item that implements it and to the accepted
                        requirement it serves; no member holds an edge
                        to a requirement, nothing points at any
                        member, and the class member holds no edge at
                        all.
description:            |
                        The document holds five r_is_implemented_by
                        edges and no requirement target; the four
                        accepted query requirements point at functions
                        only; r_verifies was widened to admit an
                        interface member and no edge uses it. The half
                        of the chain the specimen was built to show
                        was never built.

