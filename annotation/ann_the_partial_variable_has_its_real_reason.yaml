title:                  The partial run variable now carries its real reason, in three places
brief:                  |
                        Amended. record keeps the rows a partial run
                        did not observe; what a partial session
                        rewrites is the time, the revision and the
                        dirtiness of the whole item.
description:            |
                        The reason given was that a partial session
                        would drop the rows for every case it did not
                        run. record replaces only the rows it observed
                        and keeps the rest, which its own docstring
                        says.

                        The finding is worth more than the wording,
                        because I wrote the same false reason again
                        this week in ddr_test_selection and in
                        cc_public.evidence while answering other
                        findings. All three now say what a partial run
                        actually does, which is still a reason not to
                        write evidence from one: the item would claim
                        as of now over rows most of which are older.

