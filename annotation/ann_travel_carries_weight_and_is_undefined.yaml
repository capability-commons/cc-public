title:                  The word two records disagreed about is in no glossary
brief:                  |
                        Travel appears in the prose of twenty five
                        records and decides what a federated partner
                        receives. No glossary entry holds it.
description:            |
                        ddr_segment and ddr_check_architecture both
                        reached for it and meant opposite things by
                        it, and nothing could notice, because nothing
                        said what it meant. A word that carries a
                        distinction across twenty five records is
                        doing the work of a term while escaping
                        everything a term is held to: a definition,
                        the synonyms it admits, the forms it rejects,
                        and a record that decides it. It is not alone.
                        What makes a word one that needs defining is
                        the question ddr_records_that_disagree leaves
                        open, and this is the clearest instance of the
                        answer being yes.

