title:                  accept admits a requirement whose level requires an absent analysis
brief:                  |
                        accept calls trace.projection without the set
                        of current analyses, so the coverage analysis
                        gap can never fire there, while the check
                        computes it and reports it critical once the
                        requirement is accepted.
description:            |
                        In a copy, req_path_reported at safety level
                        60 and proposed drew an advisory that its
                        criticality requires an analysis; cctool
                        accept printed accepted and exited 0; the next
                        closed-world check reported one critical, the
                        same message. Only the trace check and the
                        trace command pass the third argument. accept
                        promises never to admit what the checks would
                        refuse, and the gate goes red the moment the
                        command succeeds.

