title:                  A consumer making an item can write it into the core, with its own rights
brief:                  |
                        Where a type names no home, new puts the item
                        wherever items of that prefix are most
                        numerous, which is the core. A consumer item
                        lands there carrying the consumer licence.
description:            |
                        new decides where an item goes in one of two
                        ways. Where the type register entry names a
                        home, the item goes to that directory under
                        the first root, which is the tree being
                        written to and is right. Where it names none,
                        the item goes wherever items of that prefix
                        already are, by majority across every root.

                        The majority is the core. The core holds the
                        most items of nearly every prefix, because it
                        is the oldest and the largest tree, and a
                        consumer that has just started holds one or
                        two. So the fallback resolves to the core
                        whatever tree the writer meant.

                        Fifty three of the seventy one types in the
                        register name no home, so the fallback governs
                        three quarters of what a consumer can make.

                        Observed on 2026-09-14. cctool new for a need
                        type, given the consumer tree as its first
                        root and this repository as its second, which
                        is the invocation the segment record
                        prescribes, wrote the file into this
                        repository. The file carried Copyright 2026
                        Axair Systems UG and
                        LicenseRef-Axair-Proprietary, because the
                        rights come from the first root and the
                        location does not. A proprietary licence on a
                        file in the public repository is the same
                        fault as
                        ann_new_gives_another_tree_the_core_rights and
                        it runs the other way, which is the worse way.

                        Nothing reports it. The item is well formed,
                        its rights are well formed, and the segment
                        check reads the directory a file sits in to
                        decide which segment governs it, so the file
                        simply becomes an item of the core with
                        somebody else's licence on it. The only sign
                        is the path the command prints.

                        The rule that would fit is the one the rest of
                        the command already follows: the tree being
                        written to is the first root, so the majority
                        should be counted within that tree alone, and
                        where it holds no item of the prefix the
                        command should ask for --out rather than reach
                        into another tree. That changes nothing for
                        the core, where the first root is the only
                        root that matters.

