title:                  The migration record now says nothing is built
brief:                  |
                        Amended. The decision opens by saying no
                        module compares a check against a control set,
                        and the open question asks what would build
                        one.
description:            |
                        The decision described the comparison in the
                        present tense, and no module reads a control
                        set against a check, no criterion has been
                        narrowed under it, and the question asked only
                        whether the comparison is a command or an
                        option on measure, presupposing it exists.

                        The rule it states is still the rule a
                        migration would have to satisfy, so it is kept
                        and labelled as recorded before anyone needs
                        it, which is what ddr_tool_verification does
                        with its own unbuilt decision.

