title:                  The default run compares to HEAD, so a committed change runs nothing
brief:                  |
                        changed diffs the working tree against HEAD
                        and ignores the commit the map records, so
                        once a change is committed test-changed says
                        nothing has changed and exits 0 although the
                        map predates the commit.
description:            |
                        The commit the map was measured at is written
                        by _map_of and read nowhere. Against the tree,
                        git diff from the map commit to HEAD touches
                        trace.py, check/trace.py, cli/assurance.py and
                        three test files, and the dry run says nothing
                        has changed, 0 nodes would run. cctool commit
                        runs the checks and the lint and no tests, so
                        commit then test-changed is the ordinary loop.

