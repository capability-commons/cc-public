title:                  The mypy entry confines strictness to the island and miscounts the rest
brief:                  |
                        files in the mypy section chooses the default
                        target only, so every strictness flag applies
                        to whatever mypy is pointed at, and the
                        documented command for the whole package gives
                        1918 errors in 79 files, not the 63 in 31 that
                        gt_mypy and CLAUDE.md state.
description:            |
                        pixi run mypy passes over three files; mypy -p
                        cc_public reports 1918 errors, among them
                        no-untyped-call in cli/assurance.py, a strict
                        flag firing outside the island. The 63 was
                        measured under check_untyped_defs alone, which
                        the configuration no longer expresses.
                        Following the guide to size the widening job
                        yields a number contradicting it.

