title:                  The semantics record says incompatible is carried once, and by each of a pair
brief:                  |
                        The decision says the declaration means the
                        same from either end so one entry of a pair
                        carries it, and that r_is_narrower_than and
                        r_is_part_of each name the other under
                        incompatible; the register carries it on
                        r_is_narrower_than alone.
description:            |
                        One incompatible declaration exists, at
                        r_is_narrower_than; the relation test says
                        r_is_part_of declares nothing. A later author
                        adding a pair does not know whether to declare
                        it once or twice.

