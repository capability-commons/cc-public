title:                  Nothing tests the requirement end of a pair or the text measure sends
brief:                  |
                        The selector tests assert only that the test
                        end of a coverage pair carries source, and the
                        measurement tests script the judge by
                        normalised text, so the implementation shown
                        under the requirement and the refilled code
                        sent by measure pass every test.
description:            |
                        test_a_case_shows_the_source_of_what_implements_it
                        checks the test end and nothing of the other;
                        the scripted judge and the per-origin table
                        key by normalise. A projection that widens the
                        wrong end, or a printer change that alters
                        what measure sends, is caught by nobody.

