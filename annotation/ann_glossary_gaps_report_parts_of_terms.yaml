title:                  A pair inside a longer glossary term is reported as a gap
brief:                  |
                        _is_known matches a phrase whole or in the
                        singular, so the two-word windows of a
                        three-word term are counted as words no
                        glossary holds.
description:            |
                        The report lists writing style thirty one
                        times while the register holds writing style
                        rule and writing style guide, and interface
                        control and control document while it holds
                        interface control document. The pair list
                        presents the glossary own terms back as
                        candidates.

