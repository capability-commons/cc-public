title:                  The four relation entries now describe and name what decides them
brief:                  |
                        Fixed. Each keeps what the edge means and what
                        follows from its constraints, and names the
                        record that argues for them.
description:            |
                        r_satisfies argued that its open domain is
                        deliberate, r_is_controlled_by why an absent
                        edge is left absent, r_is_about why the
                        minimum is one, and r_supports why support and
                        challenge are not incompatible, calling that a
                        question for use rather than for the entry.

                        Each argument is made in the deciding record,
                        and a register copy cannot be revised as a
                        decision can, so the two would drift. What a
                        reader needs from an entry is what the edge
                        means; each now ends by naming the record.

