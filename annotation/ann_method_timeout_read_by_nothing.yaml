title:                  The method timeout and capability are read by nothing
brief:                  |
                        timeout_second and capability on
                        tm_pytest_function have no reader; the run is
                        bounded by pytest-timeout in pyproject.toml,
                        so the method states a bound it does not
                        impose and the number is written twice.
description:            |
                        No module under src reads either field; the
                        adapter passes -q --no-header -p
                        no:cacheprovider and the node id. The schema
                        describes timeout_second as how long a run may
                        take before it is an execution error. A second
                        adapter, or a consumer tree without that
                        pytest option, would run unbounded while the
                        register says six hundred.

