title:                  The reading a case projects to is written once
brief:                  |
                        Fixed. testing.source_at is the one reading,
                        and the selector and the trace check both call
                        it; the check's own copy is gone.
description:            |
                        Both followed the first r_is_implemented_by
                        edge to a python location and called
                        source_of, so what a judge is shown and what a
                        reading is digested against were computed
                        twice and could diverge, which would digest
                        text the judge did not read.

                        The reading is shared and the lookup is not,
                        because the two genuinely differ: the selector
                        has a map of guid to location and the check
                        has the documents. What must not diverge is
                        what is read from a location, and that is now
                        one function. testing.source_of follows the
                        edge for a caller holding the documents; the
                        selector follows it with the map it has and
                        hands the location to the same reader.

