title:                  The walk contract now admits absent
brief:                  |
                        Fixed. The member returns list[Step] | None,
                        as its sibling path already did, and the
                        obligation says what a name the tree does not
                        hold is answered with.
description:            |
                        The member said list[Step] while the code
                        returned None for an unknown name, so a caller
                        iterating the result as the contract says
                        raised on a typo. The sibling member documents
                        exactly this case, so the omission was not a
                        convention.

                        test_a_walk_of_a_name_the_tree_does_not_hold_is_absent
                        holds both ends: an unknown name is absent and
                        a known one is not.

