title:                  A record's status is decided to be what a workflow wrote
brief:                  |
                        Decided and fixed. The hand-set accepted is
                        removed, and sch_ddr says a drafted record
                        carries proposed while one a person wrote
                        carries none.
description:            |
                        The note said a record carries no lifecycle
                        status and the schema offered one whose
                        description said a person accepts it, and one
                        record carried accepted with nothing recording
                        who.

                        The note was the stale side: the specimens a
                        workflow drafted do carry proposed, so the
                        field is real. What is not real is a person
                        accepting a record, since writing it is the
                        deciding and there is no second step to
                        record. The one hand-set status is removed and
                        both halves of sch_ddr now say the same thing.

