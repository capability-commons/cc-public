title:                  Four decisions report on artefacts rather than state a decision
brief:                  |
                        evl_decision_stated held four changed records
                        unmet for decision fields that summarise what
                        an artefact does, in reporting verbs with the
                        artefact as subject, where a decision would
                        make sense before the artefact existed.
description:            |
                        ddr_implementation_trace gained a paragraph in
                        this range that says the projection reads both
                        kinds of verifier and reports a shared
                        function, in the voice of a summary;
                        ddr_concept, ddr_process_word and
                        ddr_requirement_set changed in this range by
                        edges alone, so their prose predates the
                        baseline and is reported here because the
                        files changed. The judge was unanimous on two
                        and at three or four of five on the others.

