title:                  The document record now points at the entry for what may cite a document
brief:                  |
                        Amended. The domain was three types and was
                        widened twice, and the record names what
                        widened it rather than listing it again.
description:            |
                        The record said the domain of r_is_taken_from
                        is a rule, a characteristic and a methodology,
                        and the entry admits a design decision and an
                        objective too. The widening was argued in the
                        consequences of two records, neither of which
                        decides the relation, and the only deciding
                        edge is from this one, so a reader following
                        the rule that reasoning lives in what decides
                        an item reached a decision contradicting the
                        entry.

                        The record names both widenings and says the
                        entry is the list.

