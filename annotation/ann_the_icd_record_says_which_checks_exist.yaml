title:                  The interface record now says which companion checks exist
brief:                  |
                        Amended. Four are held by check/interface and
                        three are not, and the open question names the
                        three.
description:            |
                        The consequence listed seven facts as
                        companion checks and the question said the
                        others are settled and check/interface holds
                        them. A class and a free function of one
                        surface sharing a name gave no finding, and a
                        port under input, output and state at once
                        gave none.

                        Reproduced both. The consequence now names the
                        four that exist and the three that do not, and
                        the question asks for those three rather than
                        for one.

