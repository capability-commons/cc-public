title:                  Two named queries are run by nothing
brief:                  |
                        qry_objective_conformance and
                        qry_gate_tool_control are named by no test and
                        no source, and no check executes a query SQL,
                        so a change to the fact tables would break
                        them without a finding.
description:            |
                        Both run today; qry_objective_conformance
                        selects by LIKE obj_% where the underscore is
                        a wildcard, its sibling by prefix. CLAUDE.md
                        sends a reader to qry_gate_tool_control to
                        learn what the gate believes; the day the
                        facts change shape that answer is an SQL error
                        found by the reader.

