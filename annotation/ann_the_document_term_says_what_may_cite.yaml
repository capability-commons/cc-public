title:                  term_document no longer invites an edge the relation refuses
brief:                  |
                        Amended. The term names what may be taken from
                        a document and says a requirement rests on an
                        observation instead.
description:            |
                        The term defined a document as an external
                        work a rule or a requirement is taken from,
                        and r_is_taken_from admits a rule, a
                        characteristic, a methodology, a decision and
                        an objective. The relation check refused the
                        edge the term invited.

                        ddr_document_register keeps a claim resting on
                        an observation apart from an entry citing a
                        standard, on purpose, and the term now says
                        so.

