title:                  A commit records what the checks found and not what the tests did
brief:                  |
                        The commit record holds the count of checks
                        and of critical and advisory findings, and
                        says nothing about whether the suite ran or
                        passed, because the suite runs before the
                        commit and its result is not carried into the
                        message.
description:            |
                        That is tolerable while there is one gate and
                        it always runs. It stops being tolerable as
                        soon as there are gates of different cost,
                        because a commit may then have survived the
                        cheap one and not the dear one, and nothing
                        distinguishes them. A person asking which
                        commits on a branch are trustworthy would be
                        reading the shape of the history rather than a
                        fact about each commit. Either the record
                        grows a notion of what has passed, or each
                        stage attaches a note to the revision, which
                        has the advantage that a later stage can add
                        one without making a new commit.

