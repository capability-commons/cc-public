title:                  The checks come after the tests, and only one of them needs the tests
brief:                  |
                        The gate runs the linter, the type checker,
                        the suite, then the closed world check. Of the
                        eighteen checks only evidence reads what the
                        suite writes; the other seventeen cost 4.6
                        seconds between them and are held behind
                        fifteen minutes of tests.
description:            |
                        Measured on 14 September 2026: loading the
                        tree is 1.44 seconds, the checks 5.77, of
                        which layout is 2.43, schema 1.44 and evidence
                        1.19. A reference that does not resolve, a
                        schema breached, a relation run where it may
                        not, an identifier wrong: each of those is
                        knowable in about five seconds and is reported
                        after about fifteen minutes. Running what does
                        not read evidence first, and the evidence
                        check after the suite as now, would change
                        nothing about what the gate decides and would
                        move the first mechanical finding from the end
                        to the beginning. The order is stated in one
                        place, the task's depends-on, and the reason
                        it is as it is written down: the suite
                        refreshes what the evidence check reads.

