title:                  An execution must now say what it bound
brief:                  |
                        Fixed. Every identity pair beside the three
                        digests is required, and the adapter pair with
                        them.
description:            |
                        The schema required digest_method, digest_case
                        and digest_under_test and none of the names,
                        so an execution could carry a digest of
                        something it did not name, and
                        write_execution_test reads id_case
                        unconditionally: valid and unusable.

                        A parametrised test deletes each of the eight
                        identity fields in turn and asserts the schema
                        refuses it.

