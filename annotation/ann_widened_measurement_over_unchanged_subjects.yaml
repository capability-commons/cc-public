title:                  The measurement on the widened input was over unchanged subjects
brief:                  |
                        0a3923d added module to the scope and
                        criterion and measured again without rendering
                        any case anew, so the rates
                        ddr_coverage_analysis gives as the reason an
                        unmet reading is reported and not blocked on
                        were measured on seven subjects with no
                        module, one with no source and two with a
                        refilled module.
description:            |
                        The commit touches the eval, the selector, the
                        loader and tests and not the control set; its
                        diff moves the digest by criterion and scope
                        and leaves cases at seven. The eval note says
                        measured at a false negative of a fifth and
                        unanimity of 0.857; the rows say 0.167 and 1.0
                        and the check says current. A reader takes the
                        zero false positive rate as a property of the
                        judge on what a sweep shows.

