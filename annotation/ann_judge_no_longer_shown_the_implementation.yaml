title:                  Only a case follows what implements it, so the judge sees the test alone
brief:                  |
                        Fixed. _with_source follows
                        r_is_implemented_by for a test case and for
                        nothing else, so the requirement end of a pair
                        carries no source.
description:            |
                        A requirement names what implements it by the
                        same relation a case names the function that
                        automates it, and the projection followed it
                        for both. Twenty three of twenty four pairs
                        carried two source sections and the longest
                        was 37468 characters.

                        Measured after the change over the twenty five
                        pairs the eval selects: none carries two
                        source sections, and the longest is 4758
                        characters. The pair for
                        req_executor_honours_budget shows the test
                        function and no longer shows
                        cc_public/workflow/run.py.

                        Two tests hold it: a requirement is not shown
                        the code that implements it, and the predicate
                        that decides admits a case and refuses a
                        requirement.

                        This changes what the judge is shown, so the
                        control cases are re-rendered and the eval
                        measured again before its confidence is relied
                        on.

