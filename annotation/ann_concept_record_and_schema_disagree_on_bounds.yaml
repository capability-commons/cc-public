title:                  The concept record and its schema disagree on the candidate bounds
brief:                  |
                        ddr_concept decides that a concept holds at
                        least three and at most twelve candidate
                        requirements by schema, and sch_concept bounds
                        the collection at ten to thirty, so the record
                        and the item it decides disagree on the one
                        number the record gives.
description:            |
                        evl_record_and_item_agree held the pair unmet
                        five of five; the schema bounds the candidate
                        collection with minProperties ten and
                        maxProperties thirty and its own description
                        says ten to thirty. The record changed in this
                        range by edges alone and the schema not at
                        all, so the disagreement predates the baseline
                        and is reported here because the judge reached
                        it. One of the two is wrong and nothing in the
                        tree says which.

