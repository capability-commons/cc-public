title:                  The tree is walked four ways under a docstring that says one
brief:                  |
                        item.py says every module that needs an item
                        by name reads it, so the tree is walked one
                        way, while facts, trace and the tree loader
                        each keep a walk of their own with a predicate
                        that differs.
description:            |
                        facts._iter_identified, trace._iter_item with
                        _index, and Tree.__init__ through
                        check.identifier.iter_identity recurse the
                        same way; item and identifier accept an id or
                        a guid, facts and trace a guid only. The
                        commit that made item.py kept the facts walk
                        for pairing an item with its holder, which
                        item.Held.guid_holder already carries. Four
                        definitions of what an item is can diverge.

