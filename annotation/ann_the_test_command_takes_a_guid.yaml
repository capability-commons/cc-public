title:                  The test command now takes a guid where its help says it does
brief:                  |
                        Fixed. Both the case and the item under test
                        are resolved in the command, so a guid names
                        what a readable id names.
description:            |
                        What runs the case indexes by readable id
                        alone, so a guid was reported as an item the
                        tree does not hold, although tree.resolve
                        accepts one everywhere else.

                        Both names are resolved in the command and the
                        readable id is passed on, which leaves what
                        runs the case as it was.
                        test_a_guid_names_what_a_readable_id_names
                        runs the case and the item under test by their
                        guids and asserts the run reports the readable
                        id.

