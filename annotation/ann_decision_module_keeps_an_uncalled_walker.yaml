title:                  decision.py keeps a walker nothing calls
brief:                  |
                        index was rewritten to read
                        cc_public.item.index and the private _declare
                        it replaced was left behind with no caller.
description:            |
                        grep finds _declare at its definition and its
                        own two recursive calls only. The stamp and
                        its detection are unchanged and tested; the
                        module carries a second walk for the next
                        reader to wonder about.

