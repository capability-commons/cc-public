title:                  Three records and a type note now name the lookup that exists
brief:                  |
                        Amended. cc_public.edit.new provides the case
                        insensitive lookup by comparing the lower
                        cased path of each definition it walks.
description:            |
                        Three places said nothing provides a lookup
                        resolving an identifier back to a class, and
                        new depends on one: it is what lets new make
                        an item from the docstring of a class or a
                        method.

                        What is genuinely absent is resolving in that
                        direction from outside a tree, with no file to
                        walk, and the records now draw that line
                        rather than saying the capability is missing.

