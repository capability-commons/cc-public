title:                  The coverage analysis type now names the record as its concept
brief:                  |
                        Fixed. term_coverage_analysis names the
                        reading; term_criteria_coverage keeps the
                        property read.
description:            |
                        The type named the term for the measure, so
                        walking from the type to its concept landed on
                        the property rather than on what the items
                        are, where every other type names the concept
                        its items are.

                        The new term says what one item holds, that it
                        records criteria coverage and is not that
                        property, and that the rates the judge was
                        measured at are on the record because a judge
                        is not a check.

