title:                  The path case now expects only what the requirement it names requires
brief:                  |
                        Fixed. The expectation drops the empty list
                        where no path joins them, which is
                        req_no_path_reported's criterion, and the
                        description says the function observes both.
description:            |
                        The case verifies req_path_reported alone and
                        expected both halves, so a failure of the
                        no-path branch would have been reported as
                        this case not meeting an expectation about the
                        wrong requirement.

                        ddr_test_case_adoption keeps an expectation on
                        a case over an undivided function precisely so
                        the case says which obligation its verdict is
                        about. The description now says what the
                        function also observes and which obligation
                        this case is for.

