title:                  Nothing in the gate refreshes the evidence a test case establishes
brief:                  |
                        The evidence check wants a passing current row
                        per verifier, a test case included, but the
                        pytest session writes rows keyed by test
                        function items only, so the seven case rows
                        are written by hand and go stale on any change
                        to the adapter or the method without the gate
                        observing again.
description:            |
                        evd_pytest holds sixteen session rows and
                        seven rows written by cctool test --evidence
                        on 2026-09-09. Appending a constant to the
                        adapter module in a copy, or changing the
                        procedure of tm_pytest_function, gave seven
                        advisories, one per case, and none for the
                        function rows. gate is lint, type, test and
                        check; no step runs a case, and CLAUDE.md says
                        the tests refresh the evidence the check
                        reads.

