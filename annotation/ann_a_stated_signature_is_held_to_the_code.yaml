title:                  A stated signature is now held to the definition presenting it
brief:                  |
                        Fixed. The interface check compares the
                        parameters a member states with the parameters
                        of the definition it names, read from the
                        syntax tree.
description:            |
                        Renaming the parameters of a definition gave
                        no finding while the member still said the old
                        names, so absence was held and drift was not.

                        load.python.parameter_of reads the parameter
                        names of a definition, leaving out the
                        receiver, which is how a language spells
                        itself rather than part of what a surface
                        presents.
                        test_a_stated_signature_is_held_to_the_definition
                        renames a definition's parameters and asserts
                        the finding names both sides.

                        Decided rather than dropped: a member restates
                        what the code holds, which is the second copy
                        ddr_source_item rejected, and dropping it
                        would make the document useless to a partner
                        with no access to the code. So the copy is
                        kept and held to its original, which the
                        record now says.

