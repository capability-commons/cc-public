title:                  One fault on a register entry is now reported once
brief:                  |
                        Fixed. Identical findings are collapsed before
                        they are reported, so the three validations of
                        an entry no longer say the same thing three
                        times.
description:            |
                        An entry is validated against the generic
                        entry shape by the register schema, by its own
                        register's schema and by the entry schema
                        composing sch_entry. An empty brief on
                        term_anchor gave three identical findings.

                        The three validations are kept, because each
                        asks a real question and only their agreement
                        is uninteresting; it is the report that should
                        say a thing once.
                        test_one_fault_on_a_register_entry_is_reported_once
                        empties a brief and asserts no two findings on
                        the register share a path and a message.

