title:                  A kept execution is now exercised by a test
brief:                  |
                        Fixed. A test runs the case for real, keeps
                        the execution, writes the evidence and asserts
                        the check recomputes the same digest.
description:            |
                        Every test in the file handed from_execution
                        an execution the tree does not hold, with a
                        guid of zeros, so the digest dropped it and
                        the row and the check agreed over a closure
                        the execution was never in.

                        test_a_kept_execution_is_in_the_closure_the_check_recomputes
                        copies the tests into the tree, runs the case,
                        records the execution, writes the evidence,
                        and asserts the row names the execution and
                        that the check's recomputed digest equals the
                        one the row carries. It would have failed
                        before the row and the check were made to ask
                        one function what a row rests on.

