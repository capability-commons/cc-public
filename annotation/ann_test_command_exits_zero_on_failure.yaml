title:                  The test command exits zero whatever the conformance result
brief:                  |
                        cctool test exits non zero only where the case
                        cannot be run at all; a completed execution
                        with a failed result, or one that errored,
                        exits zero, so a caller cannot tell pass from
                        fail without parsing the output.
description:            |
                        In a copy with Database.path broken, cctool
                        test tc_path_reported --under-test
                        pyf_cc_public.query.database.path printed
                        result failed and exited 0, with and without
                        --report; a missing item exits 2. run and
                        resume in the same module exit
                        EXIT_NONCONFORMITY when the run stopped.
                        test_keeping_a_report_keeps_the_execution_it_names
                        asserts exit_code == 0 on the failing run, so
                        the behaviour is held by a test.

