title:                  The annotation record says eleven words carry two senses; four do
brief:                  |
                        The rationale says the vocabulary can carry
                        two senses of a word and does for eleven of
                        them; glossary --senses reports anchor,
                        challenge, concept and coverage.
description:            |
                        A script over term and also of every entry
                        gives the same four. A number offered as the
                        precedent for taking a collision is wrong by
                        nearly three times.

