title:                  The python loader still says class and function documents are not items
brief:                  |
                        from_bytes says documents in the docstrings of
                        classes and functions are not yet items of
                        their own, and the module description says the
                        item lives in the module docstring, while
                        iter_document in the same file says each is an
                        item and the tree holds fifteen.
description:            |
                        The change to this file added context_of and
                        carried the sentence past the decision that
                        made it stale. The loader own description
                        contradicts itself and its governing decision.

