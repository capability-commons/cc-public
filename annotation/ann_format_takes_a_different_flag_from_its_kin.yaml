title:                  format writes like new and set but takes a different flag
brief:                  |
                        new, set and link take --root. format writes
                        too and takes --path. A consumer task written
                        to the rule its neighbours follow exits two.
description:            |
                        The writing commands take --root, repeatable,
                        naming the trees that hold the items. new,
                        set, link, show, trace, walk and questions all
                        take it. check takes --path. format writes to
                        every file it touches and takes --path.

                        Observed on 2026-09-14 by asking each command
                        for its help. cctool format --root DIR
                        answers: no such option --root.

                        The consequence is already sitting in a
                        consumer repository. The Axair camera
                        simulator declares a format task as cctool
                        format --root . --root ../cc-public, which is
                        the rule its neighbouring tasks follow, and
                        pixi run format there exits two having laid
                        out nothing. That task has never worked. It
                        will be copied into the next consumer, because
                        the way to start a consumer is to copy one.

                        Whether format should take --root like the
                        other writers, or whether the split should be
                        by what a command reads rather than by whether
                        it writes, is the question. check and format
                        are alike in one way the others are not: each
                        runs over a union of paths and neither
                        resolves an item by name. That is an argument
                        for the flags being right and the rule being
                        described wrongly, which is
                        ann_the_flag_rule_is_written_down_wrong.

