title:                  The gate is the test step and eight seconds
brief:                  |
                        Measured on 2026-09-14: lint two tenths of a
                        second, type two tenths, eighteen checks under
                        eight, the tests fourteen minutes and twenty
                        five seconds. The tests are ninety nine per
                        cent of the gate.
description:            |
                        Measured on 2026-09-14 on the machine this
                        repository is developed on, each step run on
                        its own against the tree at 2bcdcfb7fa.

                        Lint is two tenths of a second. Type is two
                        tenths warm and four tenths with its cache
                        thrown away. The eighteen checks with the
                        world asserted closed are seven and seven
                        tenths, of which one and nine tenths is
                        loading the tree, a cost every command that
                        reads the tree pays once. The tests are eight
                        hundred and sixty five seconds, which is
                        fourteen minutes and twenty five seconds, over
                        about eight cores, five thousand two hundred
                        and sixty nine seconds of processor time.

                        The whole gate measured fourteen minutes and
                        thirty four seconds, so the snapshot and the
                        worktree cost about nine seconds between them.

                        The tests are ninety nine point one per cent
                        of the gate. Everything the gate does apart
                        from running the tests takes eight seconds.

                        Three things follow. Any argument about the
                        order of lint and type is worth two tenths of
                        a second and is not worth having. Moving work
                        from after the tests to before them is worth
                        up to a whole run, which is the only
                        reordering with anything in it. And making the
                        gate faster means making the tests faster or
                        running fewer of them, because there is
                        nothing else left to take.

                        The load cost bears on one particular choice.
                        Splitting the checks into a group that runs
                        before the tests and a group that runs after
                        means loading the tree twice, which is one and
                        nine tenths of a second added to every run.
                        That is the price of any split and it should
                        be paid knowingly.

                        These are one measurement on one machine on
                        one day, not a budget and not a threshold. The
                        figure worth rechecking is the tests, since it
                        is the only one large enough for a change to
                        matter.

