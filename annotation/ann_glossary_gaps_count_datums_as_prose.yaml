title:                  The gap report counts control subjects, SQL and code as prose
brief:                  |
                        _iter_prose treats every block scalar as
                        prose, so the leading gap candidates are the
                        headers of control case subjects, query SQL
                        and code held in cases.
description:            |
                        glossary --gaps --min 3 opens with 100 x
                        statement, the header of every subject in the
                        ten requirement control sets; def, select,
                        join, return, import and assert are counted. A
                        subject, a sql field and a rule example are
                        datums written as block scalars because they
                        hold line breaks. The list CLAUDE.md offers as
                        a candidate for a person is headed by a token
                        no person should consider.

