title:                  The projection now answers one way for every caller
brief:                  |
                        Fixed. The analysis gap is made by the trace
                        check, which can read source, and the optional
                        argument is gone from the projection.
description:            |
                        is_analysed was None where the set was absent
                        and the gap fired only where it was False, so
                        accept, the evidence check and the impact walk
                        got a different answer from the check and the
                        command, silently.

                        check.trace.missing_analysis makes the gap and
                        the three callers that want it ask for it: the
                        check, the trace command and accept. The
                        projection reads documents and has one
                        behaviour. The unmet reading already lived in
                        the check for the same reason, so the split is
                        the one that was there, without the degrading.

                        ddr_coverage_analysis says where the gap is
                        made and why.

