title:                  The closure tests never exercise a kept execution
brief:                  |
                        The two evidence closure tests pass is_kept
                        with an execution guid the tree does not hold,
                        so the digest drops it and the assertion that
                        the row and the check agree never meets the
                        case where they diverge.
description:            |
                        _execution uses a guid of zeros and
                        check.evidence.digest keeps only guids in the
                        index; a real kept execution in a copy made
                        the check report stale at once, which no test
                        in the file sees, and the command test runs
                        the command without running the check
                        afterwards. The one path the decisions call
                        the governed run is the path the tests do not
                        cover.

