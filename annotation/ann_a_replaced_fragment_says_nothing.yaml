title:                  A replaced fragment announces neither its progress nor its outcome
brief:                  |
                        Filtering replaces the root rows and opening
                        and reading replace regions beneath a row, and
                        none of the three says that it is working,
                        that it finished, that it found nothing, or
                        that it failed.
description:            |
                        A change of content without a change of
                        context is what the status message guidance
                        covers, and a reader who is not watching the
                        place that changed is told nothing. Each
                        replacement also leaves the focus position
                        unstated, so where a reader continues from is
                        whatever the browser happens to do.

