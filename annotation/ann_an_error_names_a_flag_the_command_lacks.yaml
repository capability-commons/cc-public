title:                  The register error names a flag the command it stops does not have
brief:                  |
                        A writing command that cannot find the type
                        register says to add it to --path. Those
                        commands accept --root alone, so the advice
                        cannot be followed as given.
description:            |
                        A command that resolves a type and cannot find
                        the type register raises: no data item with
                        id_self reg_type was found among the paths
                        given, so no type can be resolved. Add the
                        type register to --path.

                        Observed on 2026-09-14. cctool set, naming an
                        item held in a tree outside this repository
                        and given --root for that tree alone, raised
                        it once for each of the four fields written.
                        set has one flag for naming trees and it is
                        --root; it has no --path at all. The advice as
                        given cannot be followed, and the reader is
                        left to guess that the flag meant is the other
                        one.

                        The message is raised from the register
                        module, which is below the command line and
                        cannot know which flag the command above it
                        took. That is why it names one: it was written
                        where only one was in view.

                        The error is otherwise good. It says what was
                        looked for, that nothing answered to it, and
                        what that prevents. Only the last clause is
                        wrong, and it is wrong for every writing
                        command, which is where a consumer meets it,
                        since a consumer that forgets the core root
                        meets it on its first edit.

