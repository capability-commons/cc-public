title:                  The printer case is held unmet on a question a decision gives to a check
brief:                  |
                        case c2c05810f was flipped to unmet because
                        the file enumerator may under enumerate, and
                        ddr_tool_verification then decided that
                        whether a test examines everything the
                        requirement speaks of belongs to a check and
                        not to the judge, without narrowing the
                        criterion or the case.
description:            |
                        The flip at b6cdcbc carries the note that by
                        the criterion as written the judge was right;
                        the criterion at HEAD is unchanged;
                        ddr_eval_migration says a criterion is
                        narrowed and then measured again. The measured
                        rates include a case whose verdict the
                        governing decision says the judge should not
                        be asked for.

