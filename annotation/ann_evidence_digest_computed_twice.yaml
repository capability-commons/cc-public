title:                  The row digest and the check digest are two computations
brief:                  |
                        evidence.row stamps a row with the closure of
                        the requirement, the case and every item the
                        row names, while check.evidence recomputes it
                        from the requirement and the case alone, so a
                        row a governed run writes is stale the moment
                        it is written.
description:            |
                        For req_named_query_run and tc_named_query_run
                        the check digest is 64b365ca and the row
                        digest with the item under test and the method
                        added is dc0d7841. In a copy, cctool test
                        tc_path_reported --under-test
                        pyf_cc_public.query.database.path --record
                        --evidence wrote digest 8965ceb0 naming the
                        kept execution, and cctool check reported the
                        evidence stale at once, because the execution
                        enters the row closure by r_tests and never
                        the check closure. The seven committed case
                        rows are current only because each names an
                        implementing function of its requirement as
                        the item under test, which adds nothing to the
                        closure.

