title:                  The term for a tool control states a pairing rule no decision decides
brief:                  |
                        term_tool_control says controls come in pairs,
                        one the tool must fail and one it must pass,
                        and argues why, while ddr_gate_tool, which
                        decides the term, decides only that what shows
                        a tool can fail is named by
                        r_is_controlled_by.
description:            |
                        The word pair does not appear in the decision;
                        some register entries describe a passing
                        control and some do not. A rule about what a
                        control must be lives where nothing checks it
                        and no alternative was weighed.

