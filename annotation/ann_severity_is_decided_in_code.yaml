title:                  Whether a finding is critical is decided in code, not in data
brief:                  |
                        Thirteen of the check modules name a severity
                        themselves, and the two severities are
                        constants in the result module. Nothing in any
                        register says which conditions are critical
                        and which advisory.
description:            |
                        So a partner writing their own checks from the
                        registers can learn what a relation permits
                        and what a schema requires, and cannot learn
                        what the core would refuse a commit for. That
                        matters because refusal is the part with
                        consequences: ddr_fail_closed puts the policy
                        in one function so that three callers cannot
                        disagree, and a fourth caller in another
                        segment is outside that function altogether.
                        The registers are what ddr_tooling_travels
                        claims a segment can build from, and this is
                        the largest thing they do not say.

