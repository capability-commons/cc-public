title:                  The pipeline rewrites the evidence before the check reads it
brief:                  |
                        The gate runs test before the closed-world
                        check, and test rewrites the evidence item
                        when it observes something new, so the
                        pipeline cannot fail on committed evidence
                        that is stale, absent or partial.
description:            |
                        The order and its purpose are stated in
                        pyproject.toml and gate.yml; the conftest
                        writes on every full session; nothing in the
                        workflow compares the tree afterwards. cctool
                        commit runs no tests, so a commit with stale
                        evidence is ordinary. A green pipeline says
                        the evidence can be current, not that the
                        committed record is; a git diff --exit-code
                        over evidence/ after the gate would say the
                        second.

