title:                  Two detached gates would fight over one worktree
brief:                  |
                        There is one worktree and nothing holds it. A
                        second run started while the first is going
                        would point the worktree at its own snapshot,
                        and the first would then be testing files that
                        changed under it.
description:            |
                        The failure is quiet, which is the worst kind.
                        The first run would keep going and would be
                        reading a tree it did not ask for, so it could
                        pass or fail for reasons belonging to somebody
                        else's snapshot, and the evidence it wrote and
                        copied back would describe neither.

                        It has not happened because one person has
                        been running one gate. It becomes likely the
                        moment the reason for detaching the gate is
                        honoured, which is that a person starts one
                        and goes back to work, and then starts
                        another.

                        What is wanted is not obvious. A lock that
                        refuses the second run is the smallest thing
                        and makes the gate serial, which may be right.
                        A worktree for each run costs six hundred
                        megabytes an environment. A worktree named for
                        its snapshot, kept and reused, sits between
                        the two.

