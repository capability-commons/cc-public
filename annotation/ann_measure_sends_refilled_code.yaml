title:                  measure sends the printer-refilled subject, not the code a sweep shows
brief:                  |
                        A subject is stored as prose and the printer
                        joins and re-wraps every unindented line of a
                        paragraph, so measure judges a definition line
                        broken across lines and a module joined into
                        one paragraph, where a sweep judges the code
                        as written.
description:            |
                        The stored subjects hold source: def on one
                        line and the function name on the next, and
                        module imports joined into one paragraph; no
                        snapshot case in any control set equals its
                        live render before whitespace is collapsed.
                        test_measure keys its scripted judge by
                        normalise, so no test sees it. The fault
                        predates this work in
                        ctl_record_and_code_agree; the coverage eval
                        is the first whose rates rest on a module
                        section the refill reduces to one paragraph.

