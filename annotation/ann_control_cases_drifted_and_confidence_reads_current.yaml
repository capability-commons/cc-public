title:                  Every coverage control case holds text no sweep renders
brief:                  |
                        The confidence digest covers the criterion,
                        the examples, the scope and the stored
                        subjects, not what the projection renders for
                        the snapshotted items, so all nine cases hold
                        text a sweep no longer produces while the
                        check reports every row current.
description:            |
                        All nine cases differ from the live render of
                        the pair each snapshots: seven lack the module
                        section, the case for
                        tc_executor_honours_budget lacks source, and
                        the two with a module end where the live
                        render continues into the implementation. The
                        control set was touched at 6b516d0 and
                        b6cdcbc; the projection changed at 4c9422e and
                        0a3923d; cctool check reports the rows
                        current. The sweep word match therefore meets
                        no case, so a met case suppresses nothing and
                        an unmet case confirms nothing, and the rates
                        describe a projection that no longer exists.

