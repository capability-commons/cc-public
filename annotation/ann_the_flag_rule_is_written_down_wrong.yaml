title:                  The written rule for which command takes which flag is wrong
brief:                  |
                        The tool guide says the writing commands take
                        --root and check takes --path. format writes
                        and takes --path, so the rule fails on the one
                        command a consumer runs most.
description:            |
                        The tool guide states the rule as: the writing
                        commands take --root, repeatable, and check
                        takes --path. A reader given that rule and
                        asked to point format at two trees will write
                        --root and be wrong.

                        Measured on 2026-09-14 by reading the help of
                        each command. --root is taken by new, set,
                        link, show, trace, walk and questions. --path
                        is taken by check and format. commit takes
                        both, and they mean different things there:
                        --root is the repository committed and --path
                        is a further tree the checks read.

                        So the rule as written is wrong about format,
                        and silent about the one command where both
                        flags appear and differ in meaning. Those are
                        the two places a consumer meets first, since a
                        consumer formats and commits across two trees
                        from its first day.

                        The rule that fits what is there is about what
                        a command does with the trees rather than
                        whether it writes. A command that resolves an
                        item by name takes --root. A command that runs
                        over a union of paths takes --path. commit
                        does both and says so. Whether to write that
                        rule down or to change the flags to fit the
                        simpler one is a decision, and this annotation
                        makes neither.

