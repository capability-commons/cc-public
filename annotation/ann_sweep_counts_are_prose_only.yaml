title:                  The sweep counts in the decisions are held by nothing, and one has moved
brief:                  |
                        Ten advisories in three hundred and six
                        judgements, eighty three and then eighty nine
                        hand-written records, forty five items where
                        sixty two were, and four hundred and four
                        findings where five hundred and two were, are
                        reproducible from nothing in the tree, and the
                        one count a dry run can repeat, three hundred
                        and sixty eight standalone items, is four
                        hundred and sixty eight today.
description:            |
                        sweep/ holds no item and no report was kept,
                        though cctool sweep and t_sweep exist for
                        that. ddr_challenge_is_a_guard gives eighty
                        three in its context and eighty nine in its
                        consequence for one sweep. The numbers that
                        justify moving an anchor, removing one and
                        rewriting criteria cannot be checked.

