title:                  A test module the map has never seen is never selected
brief:                  |
                        Every rule in the selector reads the map, so a
                        test module committed after the map was
                        measured is invisible to all of them, and a
                        change to a source module it exercises selects
                        the map tests, runs green, and never runs it.
description:            |
                        The map records commit 7096f62;
                        test_coverage_analysis.py was added at
                        61a532b, has no data file under
                        .test_map_data, and calls trace.projection.
                        Planning for a change to trace.py selects 152
                        of 818 tests across twenty-seven modules and
                        not that one. The never-seen rule exists for a
                        source module and not for a test module on
                        disk absent from the map, which measure
                        already globs. ddr_test_selection says the
                        only guard is that a module it has never seen
                        runs everything, which is true of source
                        alone.

