title:                  The walk member returns None where its contract says a list
brief:                  |
                        The member states returns list[Step] and its
                        obligation never mentions an unknown name,
                        while the code returns None where the name
                        resolves to nothing.
description:            |
                        db.walk with an unknown name returns None; the
                        sibling member path documents exactly this
                        case as list[Step] | None, so the omission is
                        not a convention. A caller iterating the
                        result as the contract says raises on a typo.

