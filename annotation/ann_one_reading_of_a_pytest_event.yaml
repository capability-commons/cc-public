title:                  One reader now turns a pytest event into an outcome
brief:                  |
                        Fixed. evidence.outcome_of_event is the one
                        reading, and the session hook and the adapter
                        both call it.
description:            |
                        Reproduced: fed setup passed, call passed and
                        teardown failed, the hook recorded passed,
                        because it had a branch for setup and a branch
                        for call and nothing else.

                        outcome_of_event returns what one report event
                        says about the item under test, or nothing
                        where it says nothing. Only the call phase
                        says anything; a failure in setup or teardown
                        is a fault in the harness, and a call failure
                        carrying the pytest-timeout mark is a run that
                        never finished. The hook keeps the worst of
                        what the phases said, ranked by evidence.RANK,
                        rather than the last of them.

                        Four tests in test/test_evidence.py hold it:
                        the reading itself over the seven events the
                        two disagreed about, expected failures both
                        ways, the hook keeping an error in teardown
                        over a pass in call, and the hook reading a
                        timeout as a run that did not finish.

