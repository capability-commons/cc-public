title:                  The type entry schema calls id_term optional while requiring it
brief:                  |
                        The description of id_term opens Optional
                        while required lists id_term and guid_term,
                        and ddr_concept_reference decides the field is
                        required.
description:            |
                        A bare entry validated against sch_entry_type
                        reports id_term is a required property. A
                        partner reading the schema, which is what
                        travels, is told the opposite of what the
                        validator enforces.

