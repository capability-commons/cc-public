title:                  The guide and the readme now know the homes and the registers
brief:                  |
                        Amended. Both list objective/, the readme
                        lists interface/ and test_case/, both name the
                        criticality and gate tool registers, and the
                        guide documents trace --criticality.
description:            |
                        An agent following CLAUDE.md, which is the
                        document telling it what exists, could not
                        find the criticality lever or the objectives,
                        and a newcomer reading the readme was not told
                        where a contract or a test case lives.

                        The guide's entry for trace now says what
                        --criticality shows, that only a requirement
                        declares one, and where what a level requires
                        is written.

