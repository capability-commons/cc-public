title:                  The code quality record now names the gate the pipeline runs
brief:                  |
                        Amended. The gate is the lint, the type
                        checker, the tests and then the closed-world
                        checks, and the floor is 87 and branch aware.
description:            |
                        The record said the floor is 86 and that the
                        gate is the checks, the lint and the tests.
                        The floor was 87 at the baseline and the type
                        step was added without touching the record, so
                        the decision governing the gate named a gate
                        the pipeline no longer runs.

                        The order is now stated as the task's
                        depends-on and as written nowhere else, which
                        is why the tests refresh the evidence the
                        closed-world check reads. The same paragraph
                        said a test names its requirement on the test
                        module's document, which moved to the function
                        some time ago.

