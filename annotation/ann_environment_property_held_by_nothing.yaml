title:                  The property the environment decision asks to keep is held by nothing
brief:                  |
                        ddr_environment_shape decides that nothing the
                        gate runs imports dspy at module scope and
                        calls it a property to keep rather than a
                        detail, and no test, lint rule or check holds
                        it.
description:            |
                        grep dspy over test/ finds nothing; the import
                        linter contract names packages and not third
                        party imports. A module level import of dspy
                        in anything the gate reaches would close the
                        split the decision keeps open, and the
                        decision says so, and nothing would notice.

