title:                  A helper under test/ now runs the whole suite
brief:                  |
                        Fixed. is_test admits test/test_*.py alone,
                        which is what pytest collects and what the
                        measurement globs, and a helper is a reason to
                        run everything.
description:            |
                        is_test accepted any python file under test/,
                        so a change to selection.py named that file as
                        the node, ran one file and exited zero, and
                        never ran the module that tests it. The module
                        disagreed with itself: measure globs
                        test_*.py.

                        is_test now requires the test_ prefix,
                        is_helper names the rest, and a changed helper
                        is a reason to run the whole suite, because
                        nothing records which modules import it.

                        test_a_helper_under_test_runs_everything
                        asserts a change to test/selection.py runs
                        everything and says so, and holds both
                        predicates against a helper and a test module.

