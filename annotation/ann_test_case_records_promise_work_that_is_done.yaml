title:                  The test case records say work is not made yet that is made
brief:                  |
                        ddr_test_case says the configuration check
                        does not yet exist and sch_test_case does not
                        yet allow an absent expectation, and
                        ddr_test_case_adoption says neither change is
                        made yet, while the testing check runs, the
                        schema does not require expectation and
                        testing.expectation reads the success criteria
                        where a case states none.
description:            |
                        cctool check --help lists testing;
                        sch_test_case requires version, input and
                        status; test_a_case_may_state_no_expectation
                        and
                        test_a_case_that_states_none_expects_the_criteria_of_what_it_verifies
                        pass. A reader planning the next milestone
                        from the records would schedule the work
                        again.

