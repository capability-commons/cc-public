title:                  The analysis digest now covers the surroundings the judge read
brief:                  |
                        Fixed. _source_of returns the definition and
                        the module context, joined, so a change to a
                        constant outside the definition stales the
                        reading.
description:            |
                        The judge is shown the module context because
                        verdicts turned on a constant outside the
                        definition, and the digest covered the
                        definition alone.

                        test_an_analysis_stops_standing_when_the_module_around_the_test_changes
                        appends a module level constant beside the
                        verifier and asserts the gap returns. The
                        three earlier staleness tests still hold for
                        changes to the criteria, to the definition,
                        and to a verifier the tree does not hold.

