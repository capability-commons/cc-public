title:                  One fault on a register entry is reported three times
brief:                  |
                        An entry is validated against the envelope by
                        sch_register, by the register schema and by
                        the entry schema composing sch_entry, and
                        validate does not collapse identical findings,
                        so every envelope fault appears three times
                        and six where sch_entry and sch_descriptive
                        both state it.
description:            |
                        An empty brief on term_anchor gives three
                        identical findings at HEAD and two at the
                        baseline; a fresh term entry gives seventeen
                        for four empty fields. The test that guards
                        the datum rule holds only that message to
                        once. The composition ddr_embedded_item_schema
                        added made an existing duplication worse
                        unnoticed.

