title:                  obj_coverage_analysed is claimed met while nothing records an analysis
brief:                  |
                        Two items claim the objective by r_satisfies,
                        its statement is that coverage is analysed and
                        recorded, no coverage analysis item exists,
                        and two decisions say the repository does not
                        meet it.
description:            |
                        qry_objective_conformance gives two
                        satisfiers; no cva_ item exists;
                        ddr_coverage_analysis says nothing writes one
                        yet and ddr_verification_standard says the
                        objective is not met. An auditor running the
                        query takes the objective as met while the
                        decisions beside it say it is not.

