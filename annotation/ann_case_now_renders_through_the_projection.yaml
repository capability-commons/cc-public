title:                  The case command now renders through the projection a sweep uses
brief:                  |
                        Fixed. case.case passes map_guid and
                        map_location to render, so a case for a test
                        case holds the source a sweep shows.
description:            |
                        Rendering tc_executor_honours_budget through
                        the case signature gave 315 characters and no
                        source where the sweep gave the source and the
                        module. A person suppressing or confirming a
                        finding on a test case recorded a verdict on
                        text the judge never saw.

                        Every one of the nine coverage cases was
                        re-made through the command afterwards, and
                        each stored subject now equals what the
                        projection renders for the items it snapshots,
                        asserted by
                        test_every_control_case_holds_what_the_projection_renders_now.

