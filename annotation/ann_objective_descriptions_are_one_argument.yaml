title:                  Nine objectives carry one identical paragraph that argues
brief:                  |
                        Every objective description is the same four
                        lines about how conformance is claimed and
                        what an absent edge means, which restates the
                        mechanism of ddr_objective and says nothing
                        about the objective it sits on.
description:            |
                        The nine descriptions are one distinct string.
                        It says adopted by ddr_verification_standard,
                        which is loose for obj_tool_accounted, taken
                        from DO-330 by ddr_tool_verification, and
                        obj_rigour_selected_by_level, by
                        ddr_criticality. A description deletable from
                        all nine without loss is one nobody reads.

