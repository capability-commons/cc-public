title:                  The row and the check now compute one digest
brief:                  |
                        Fixed. check.evidence.rests_on reads what a
                        row names from the finished row, and both the
                        writer and the check ask it.
description:            |
                        The row was stamped over the closure of
                        everything it named and the check recomputed
                        the digest from the requirement and the case
                        alone, so a row naming the execution it came
                        from was stale as written.

                        evidence.row now builds the row first and
                        digests it last, asking
                        check.evidence.rests_on what the finished row
                        names; the check asks the same function about
                        the same row. Neither carries its own idea of
                        what the digest covers.

                        test_a_row_and_the_check_compute_one_digest_over_what_the_row_names
                        asserts the two agree, and that naming an item
                        the closure does not already reach changes the
                        digest, so the agreement is not the agreement
                        of two computations that cover nothing.

