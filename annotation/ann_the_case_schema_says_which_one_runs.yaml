title:                  The case schema now says which of the pair the adapter reads
brief:                  |
                        Amended. The id is what the adapter resolves,
                        and the guid is what the reference check holds
                        it to.
description:            |
                        The schema called the guid the resolvable
                        reference while specify reads the id and never
                        the guid. Nothing runs wrong today because the
                        reference check keeps the pair consistent, and
                        a future adapter copying the pattern would
                        resolve by the field it was told is not the
                        reference.

