title:                  What may be bound as the item under test is now decided and refused
brief:                  |
                        Fixed. r_tests declares a range of the source
                        types, and the runner refuses a binding the
                        relation does not admit before anything runs.
description:            |
                        cctool test with a protective mark bound
                        printed completed, passed, exit zero, and with
                        the evidence option would have written a
                        passing row naming it. The adapter guarded
                        against reading one tree and running another
                        and not against this.

                        The range is read from the relation register
                        rather than listed in the runner, so widening
                        what may be bound is editing the entry.
                        test_an_item_the_relation_does_not_admit_cannot_be_bound
                        holds both ways, and ddr_test_execution now
                        decides it.

