title:                  The gate tool record counts six entries and one control; the register has eight
brief:                  |
                        The consequence of ddr_gate_tool says
                        reg_gate_tool holds six entries of which one
                        is shown to fail, and the sentence the record
                        uses to say why the register was worth writing
                        is the one a reader can disprove.
description:            |
                        cctool query qry_gate_tool_control returns
                        eight rows, each shown to fail by one thing;
                        gt_mypy and gt_package_check were added at
                        f4d1e58 and 770359e and the controls at
                        1ad8b3e, after the record.

