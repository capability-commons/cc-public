title:                  A test module the map never saw now runs whenever anything runs
brief:                  |
                        Fixed. selection.unseen globs the test modules
                        on disk, and every one the measurement did not
                        see joins the modules it could not account
                        for.
description:            |
                        Every rule read the map, so a module committed
                        after the map was measured was invisible to
                        all of them. test_coverage_analysis.py was on
                        disk, absent from the map, and a change to
                        trace.py selected 152 tests across twenty
                        seven modules and not that one.

                        The map now carries the node ids it saw rather
                        than a count, and load globs test/test_*.py to
                        find what it never saw. Those run alongside
                        the modules the measurement could not account
                        for, and the reason line counts both.

                        test_a_test_module_the_map_never_saw_always_runs
                        builds a tree holding a seen module, an unseen
                        one and a helper, and asserts the unseen one
                        is in the selection. ddr_test_selection said
                        the only guard was a module it had never seen,
                        which was true of source alone; the decision
                        and the consequence now say which guards there
                        are and which gap none of them closes.

