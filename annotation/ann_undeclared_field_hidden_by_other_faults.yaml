title:                  An undeclared field is hidden while the item has any other fault
brief:                  |
                        validate drops every unevaluatedProperties
                        error at a path that has another error beneath
                        it, and the document root is such a path, so a
                        field nobody declared is not reported until
                        every other fault on the item is fixed.
description:            |
                        Setting a bogus field on need_agent_asks_graph
                        alone was reported; adding an empty title left
                        only the title finding. On an inserted term
                        entry with four empty fields, seventeen
                        findings named none of the bogus field. The
                        filter was meant for an embedded entry failing
                        its closure, and the root path matches every
                        error. It predates the baseline and was kept
                        through a rework of the function; a skeleton
                        made by new fails its checks until every field
                        is written, which is exactly when a misspelled
                        field is accepted.

