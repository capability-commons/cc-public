title:                  The impact direction the record relies on is now asserted
brief:                  |
                        Fixed. A test changes a subject's file and
                        asserts the annotation is among what rests on
                        it.
description:            |
                        The existing test asserts the closure of the
                        annotation holds its subject, which is the
                        forward direction and passes whether or not
                        anything walks back. ddr_annotation relies on
                        the other direction.

                        test_a_change_to_a_subject_reaches_the_annotation
                        names the subject's file to trace.changed and
                        asserts the subject is among what changed and
                        the annotation among what depends on it. The
                        earlier test is kept: the two directions are
                        two properties.

