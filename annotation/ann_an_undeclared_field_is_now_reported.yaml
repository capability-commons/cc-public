title:                  An undeclared field is now reported beside any other fault
brief:                  |
                        Fixed. A closure error is dropped only where
                        every field it names is declared somewhere in
                        the composition.
description:            |
                        Every error lies beneath the root, so the rule
                        that suppressed a closure error wherever
                        anything deeper failed hid a field nobody
                        declared behind any other fault the item had.
                        A skeleton made by new fails its checks until
                        every field is written, which is exactly when
                        a misspelled field was accepted.

                        What is declared is computed from the
                        composition, through allOf and through the
                        references a schema makes, which is where
                        closure is decided. Which fields went
                        unevaluated is read from the message, since
                        the error carries it nowhere else.

                        test_an_undeclared_field_is_reported_beside_any_other_fault
                        writes a bogus field, then empties the title,
                        and asserts the closure finding survives
                        beside the other. ddr_schema_closure carries
                        the reasoning.

