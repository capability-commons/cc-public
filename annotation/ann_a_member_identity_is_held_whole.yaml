title:                  A member identity is now held whole
brief:                  |
                        Fixed. The identity must be the document, then
                        every member it sits within, then its own
                        name.
description:            |
                        The check held the first and last steps, so a
                        method whose id named the wrong holder passed
                        every check. The run between is how an
                        embedded item says where it sits and what a
                        rename carries.

                        _iter_member now carries the local names of
                        the members a member sits within, and the
                        comparison is against the whole expected
                        identity.
                        test_an_identity_naming_the_wrong_holder_is_reported
                        sets the wrong holder and asserts the finding.

