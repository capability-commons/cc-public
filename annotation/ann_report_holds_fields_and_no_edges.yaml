title:                  A kept report names its execution in fields and holds no edge
brief:                  |
                        nonconformity.from_execution writes
                        id_execution, id_case and id_method as fields
                        with an empty relation list and no
                        id_requirement, so a kept report cannot be
                        walked to the run it came from and does not
                        say which requirement the failure is against.
description:            |
                        A report written by cctool test --report in a
                        copy carried id_execution, id_method, id_case,
                        id_subject and relation: [], and no
                        requirement, though the case verifies
                        req_path_reported. cctool walk on it found one
                        item and cctool path to its execution found no
                        path. ddr_nonconformity_report says a report
                        states the requirement or interface member
                        affected, and the house rule is that a field
                        does not carry what an edge should.

