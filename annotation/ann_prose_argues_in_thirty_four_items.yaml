title:                  Thirty four changed items argue in prose that should describe
brief:                  |
                        evl_prose_describes, measured at no false
                        positive on its control cases, held thirty
                        four items changed since the baseline unmet,
                        thirty three of them unanimously, each for a
                        sentence that justifies a choice or contrasts
                        an alternative where the item should say what
                        it is and how it is used.
description:            |
                        The items are schemas, register entries,
                        documents, tool modules and test modules of
                        this increment; the sentences quoted are of
                        one shape, a reason or an avoided alternative
                        appended to a description, such as an
                        annotation that carried a severity would be a
                        finding, or so the tree is walked one way. The
                        house rule is that prose in an item describes
                        and argument goes in a design decision, and
                        each argument quoted is already made in one.
                        The reviewer read eight of the thirty four and
                        agrees with the judge on each; the rest are
                        asserted on the judge and its measured rates.

