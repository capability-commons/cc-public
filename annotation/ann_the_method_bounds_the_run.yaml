title:                  The method's timeout now bounds the run
brief:                  |
                        Fixed. The specification carries
                        timeout_second and the adapter passes it, so
                        the register is where the bound is written.
description:            |
                        The field had no reader: the run was bounded
                        by this repository's pytest configuration, so
                        the method stated a bound it did not impose
                        and the number was written twice. A second
                        adapter, or a consumer tree without that
                        option, would have run unbounded while the
                        register said six hundred.

                        test_the_method_says_what_bounds_a_run asserts
                        the specification carries what the entry says
                        and follows it when the entry changes.
                        capability is still read by nothing, which is
                        a smaller thing: it describes what a runner
                        must have rather than what a run must do.

