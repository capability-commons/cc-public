title:                  The eval note now describes the eval rather than logging its runs
brief:                  |
                        Amended. The note says what the subject is and
                        how it is projected; what the judge was
                        measured at is the confidence rows, and why is
                        in the commits and the decision.
description:            |
                        The note said the eval is unmeasured and
                        reports without gating until someone runs
                        measure, while three confidence rows sat in
                        the same file and the check read them current.

                        It was also a run log: what a judge returned
                        on which kind of subject and why the
                        projection changed. That is argument and
                        history, which the commits and
                        ddr_coverage_analysis hold. The note keeps the
                        two facts a reader needs, that the subject is
                        a pair and that a case is followed to the
                        function that automates it, and says the eval
                        is advisory whatever it is measured at,
                        because a judge is not a check.

