title:                  The annotation record now names the command that reaches an annotation
brief:                  |
                        Amended. Both paragraphs say cctool changed,
                        which walks the edges that declare dependency,
                        rather than an impact analysis the tree did
                        not compute.
description:            |
                        The claim was made twice, in the rationale and
                        in the consequence, and rested on nothing: the
                        projection reported only what implements or
                        verifies a requirement, and dependency was
                        read by the evidence closure alone.

                        The command the review added does what the
                        record described, so the record now names it.
                        test_a_change_to_a_subject_reaches_the_annotation
                        holds the property the record relies on.

