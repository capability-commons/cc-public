title:                  The tests establish the projection and the markup and stop below the browser
brief:                  |
                        The web tests run through a test client and
                        never start a browser, so nothing observes the
                        script, the focus, the accessible state, the
                        stylesheet or the replacement of a fragment.
description:            |
                        They are good tests of what they reach: the
                        projections, the traversal invariants, the
                        routes and the strings the page emits. What
                        they cannot reach is everything the reader
                        actually meets. The moment to add a layer that
                        observes a real browser is before more
                        interaction is built on top, because each
                        further act adds transitions that nothing is
                        watching.

