title:                  The run member promises a read-only query the provider does not keep
brief:                  |
                        The obligation of
                        icm_cc_public_query.database.run opens with
                        the query is read only, and
                        sch_interface_member defines an obligation as
                        what a provider must do, but Database.run
                        executes whatever SQL it is given.
description:            |
                        Over the tree, run with DELETE FROM item
                        returned an empty result and the item count
                        fell to zero. The sentence can be read as a
                        constraint on the caller; the schema says an
                        obligation is not that. cctool query --sql
                        hands the same method arbitrary text.

