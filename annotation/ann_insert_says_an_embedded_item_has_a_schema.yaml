title:                  insert now says an embedded item has a schema
brief:                  |
                        Amended. The docstring says the type names a
                        schema, that this reads the container, and
                        where the two disagree.
description:            |
                        The docstring gave the model
                        ddr_embedded_item_schema reversed. The two
                        resolutions agree for a register, whose schema
                        composes the entry schema the type names, and
                        differ for a criticality or a gate tool entry,
                        where the container shape carries sch_entry
                        and the type schema does not.

                        That difference is now
                        qst_embedded_item_schema.shape rather than a
                        contradiction a reader has to notice.

