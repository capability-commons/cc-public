title:                  A stored subject now survives the printer as it was rendered
brief:                  |
                        Fixed. control.verbatim marks a subject with a
                        heading and an indent under it, which the
                        printer and the loader both keep, and measure
                        reads it back with control.as_written.
description:            |
                        The printer refills the paragraphs of a block
                        scalar, so a stored subject held a definition
                        line broken across lines and a module joined
                        into one paragraph. Nothing noticed because a
                        case is matched to a finding by normalised
                        text, and the scripted judge in test_measure
                        is keyed the same way.

                        A block scalar's indentation is read from its
                        first line, so indenting every line without a
                        heading was eaten by the loader. The heading
                        fixes the base indent and the indent under it
                        survives both.

                        test_a_stored_subject_survives_the_printer_as_it_was_rendered
                        lays out a subject holding a definition and
                        asserts the definition line is still whole,
                        and
                        test_every_control_case_holds_what_the_projection_renders_now
                        asserts every coverage case equals the live
                        render exactly, which it now does for all
                        nine.

