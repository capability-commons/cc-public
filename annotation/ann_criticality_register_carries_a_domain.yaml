title:                  The core criticality register is written for unmanned vehicles
brief:                  |
                        reg_criticality writes its safety consequences
                        about harm to a third party because the
                        vehicles this serves are unmanned, in the core
                        repository that consumes nothing and is meant
                        to hold what travels, while ddr_criticality
                        itself says the lever is for the segments that
                        hold what is built with the tool.
description:            |
                        The entries name death or serious injury to a
                        third party, loss of control over a populated
                        area and command and control; the security
                        dimension names protected personal data at
                        scale. A consumer in another domain inherits
                        these words or must shadow the register. The
                        mechanism, a dimension, a level and the
                        objectives it requires, is domain neutral; the
                        consequences are not, and could live in the
                        segment that has them. A judgement, offered
                        for the argument.

