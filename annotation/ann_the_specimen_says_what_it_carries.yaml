title:                  The implementation record now says which half of the chain is built
brief:                  |
                        Amended. Each member that carries an edge
                        names the source presenting it; no member
                        names a requirement and nothing verifies one.
description:            |
                        The record said each member is linked to the
                        source item that implements it and to the
                        accepted requirement it serves. The document
                        holds five implementation edges and no
                        requirement target, and r_verifies was widened
                        to admit a member with no edge using it.

                        The half the specimen was built to show is
                        declared and not built, and the record says
                        that now. qst_icd_implementation.chain asks
                        what links a member to the requirement it
                        serves and to what verifies it.

