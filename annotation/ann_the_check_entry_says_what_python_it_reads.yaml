title:                  The repository check entry now says what python it reads
brief:                  |
                        Amended. The blind spot names the two purposes
                        it reads python for, and says neither judges
                        whether the python is right.
description:            |
                        The entry said the check does not read python
                        beyond the documents held in docstrings. The
                        evidence check digests the syntax tree of each
                        test function and implementation with the
                        docstrings removed, and the trace check reads
                        the source of a verifier and the module around
                        it.

                        The blind spot is the one field ddr_gate_tool
                        makes mandatory, so understating what the tool
                        sees is the worst place to understate it: a
                        reader could not learn from the register what
                        a source edit stales. It now says what each
                        purpose is, and keeps the sentence that
                        matters, that neither reads python to judge
                        whether it is right.

