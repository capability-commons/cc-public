title:                  The repository check entry says it reads no python, and two checks read source
brief:                  |
                        gt_cctool_check says the check does not read
                        python beyond the documents held in
                        docstrings, while the evidence check reads the
                        code of each test function and implementation
                        to digest it and the trace check reads a
                        verifier source to decide whether an analysis
                        is current.
description:            |
                        check/evidence.py calls code_of over the file
                        text; check/trace.py calls source_of. The one
                        field ddr_gate_tool makes mandatory
                        understates what the tool sees, so a reader
                        cannot learn from the register what a source
                        edit stales.

