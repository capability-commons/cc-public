title:                  An annotation that was acted on still reads as outstanding
brief:                  |
                        r_answers has a range of t_question alone, so
                        nothing but another annotation can answer an
                        annotation, and the unanswered query counts
                        only what challenges or supports one.
description:            |
                        So the queue drains by argument and never by
                        action. The clearest case is from 13
                        September: the contrast finding was fixed the
                        same day, and it reads as answered only
                        because a second annotation happened to
                        support it. Had the fix been made and nothing
                        written, the assertion would have sat
                        outstanding for good. There are a hundred and
                        nine unanswered annotations in this tree.
                        Widening the range so that a requirement, a
                        decision or a commit can answer one would cost
                        a line in the register, and would touch what
                        ddr_annotation decided when it declined
                        settlement, so it wants that record amended
                        rather than worked around.

