title:                  The python loader now says a definition carries an item
brief:                  |
                        Amended. The module description and from_bytes
                        both say a class or a function carries an item
                        of its own.
description:            |
                        from_bytes said documents in the docstrings of
                        classes and functions are not yet items of
                        their own, and the module description said the
                        item lives in the module docstring, while
                        iter_document in the same file yields each one
                        and the tree holds fifteen. The loader's own
                        description contradicted itself and its
                        governing decision.

