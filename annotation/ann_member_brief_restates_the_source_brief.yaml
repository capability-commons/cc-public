title:                  A member brief restates the source item brief, and the two differ
brief:                  |
                        sch_interface_member requires a brief of every
                        member, so a member linked to a source item
                        carries a second description of one
                        definition, and for path the two have already
                        diverged.
description:            |
                        The brief of pyf_cc_public.query.database.path
                        ends with the empty list and None cases; the
                        brief of the member stops earlier and moves
                        those clauses to its obligation. Nothing says
                        which description a reader believes when they
                        differ, which is the shape ddr_source_item
                        rejected.

