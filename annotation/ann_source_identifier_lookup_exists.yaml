title:                  Three records say nothing resolves an identifier back to a class; new does
brief:                  |
                        ddr_source_identifier says a case insensitive
                        lookup is what nothing provides because
                        nothing has needed it,
                        ddr_source_addressability and the note of
                        t_python_class say the same, and
                        new._definition resolves
                        pyc_cc_public.query.database to class Database
                        by lower-casing every definition path.
description:            |
                        new.py compares the lower-cased path of each
                        definition to the anchor, and test_source
                        asserts Tree.resolve is found that way. The
                        open question is scoped to outside a tree; the
                        decision and its consequence are not. A reader
                        is told a capability is absent that the tool
                        own new depends on.

