title:                  The annotation record claims an impact analysis the tree did not compute
brief:                  |
                        ddr_annotation says a change to the subject
                        reaches the annotation through the impact
                        analysis this repository computes, because
                        r_is_about declares dependency; at 61a532b no
                        projection followed dependency edges, and
                        trace --changed-since read implementers and
                        verifiers alone.
description:            |
                        trace.impact_of_files reported only items that
                        implement or verify a requirement, and
                        dependency was read by the evidence closure
                        alone. The claim is made twice, in the
                        rationale and in the consequence, and rested
                        on nothing; the changed command added by this
                        review now follows the edges the record names,
                        and the record should say which command.

