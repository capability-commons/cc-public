title:                  The cursor and the focus are two things, and nothing says which
brief:                  |
                        The first row is made the cursor without being
                        given focus, and afterwards focus makes a row
                        the cursor, so the two agree only until
                        something moves one of them.
description:            |
                        Nothing states whether the cursor follows
                        focus, whether it persists on its own, or what
                        current means to a program reading the page.
                        The contrast levels are computed from the
                        cursor and the keyboard acts on the focus, so
                        a divergence is visible and operable at once
                        in two places. It should not be settled by
                        adding aria-selected, since selection is not
                        an act the workbench performs.

