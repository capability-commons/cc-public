title:                  The pairing rule is now decided, and narrower than the term claimed
brief:                  |
                        Decided in ddr_gate_tool: a control that fails
                        is required, and a passing companion is
                        written where a tool could plausibly fail
                        everything.
description:            |
                        The term said controls come in pairs and
                        argued why, and the decision said only that
                        what shows a tool can fail is named by
                        r_is_controlled_by. The word pair did not
                        appear in it, and the register bore that out:
                        mypy, the coverage floor and ruff carry both
                        sides, and the eighteen checks carry only the
                        failing one.

                        Decided rather than dropped, because the risk
                        the rule guards against is real: a tool that
                        failed everything would satisfy a failing
                        control alone. It is real only where a tool is
                        configured rather than installed. For the
                        checks the gate runs many times a day, a clean
                        tree passing is observed constantly and a
                        second control would restate it. The term now
                        describes that rule instead of arguing for a
                        stricter one.

