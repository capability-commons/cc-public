title:                  A check cannot be added without forking the tool
brief:                  |
                        The driver holds its checks as a tuple of
                        eighteen modules in python. A consuming
                        segment that wants a check of its own has
                        nowhere to declare it, so it forks the tool or
                        goes without.
description:            |
                        Types, relations, registers and schemas all
                        travel as data and a segment may add its own.
                        Checks do not, so the claim that a segment may
                        extend the tool is truer of what it may say
                        than of what it may enforce. What a registered
                        check would need is not obvious: an identity,
                        an order among the others, and code to run,
                        and the last of those is the part that cannot
                        be data. An entry naming an installed
                        callable, as a test method names an installed
                        adapter, is the shape the tree already uses
                        for exactly this problem.

