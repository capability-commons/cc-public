title:                  The trace check re-implements the projection that follows a case to its function
brief:                  |
                        _source_of and _implementing in the trace
                        check duplicate _with_source and
                        _location_implementing in the selector, with a
                        second location lookup, so what a judge is
                        shown and what a reading is digested against
                        are computed twice and already disagree.
description:            |
                        Both follow the first r_is_implemented_by edge
                        to a python location and call source_of; the
                        trace docstring says following the edge here
                        is the same reason the projection follows it.
                        A change to how a case is projected must be
                        made twice or the analysis digests text the
                        judge did not read.

