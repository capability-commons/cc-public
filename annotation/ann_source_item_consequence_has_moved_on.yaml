title:                  The source item record counts eleven checks and six module edges to move
brief:                  |
                        ddr_source_item says eleven checks and that
                        the second step waits on moving the six module
                        edges down; there are eighteen checks and no
                        test module holds an r_verifies edge at module
                        grain.
description:            |
                        cctool check --help lists eighteen; the trace
                        names function verifiers and the eight cases
                        name functions. The change added r_decides
                        edges to this record without touching the
                        prose.

