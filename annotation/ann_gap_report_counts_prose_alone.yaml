title:                  The gap report now counts prose alone
brief:                  |
                        Fixed. A control case subject, a query's sql
                        and a rule's example hold line breaks for
                        another reason and are not counted.
description:            |
                        The report opened with the header of every
                        stored subject in the ten requirement control
                        sets, and counted def, select, join, return,
                        import and assert. The list CLAUDE.md offers a
                        person was headed by a token no person should
                        consider.

                        _iter_prose skips the three fields that hold a
                        block scalar for line breaks rather than for
                        prose. After the change the words are gone
                        from the head of the list; select, import and
                        return remain where the prose of an item
                        actually uses them, which is what the report
                        is for.

                        test_a_datum_written_as_a_block_scalar_is_not_counted_as_prose
                        asserts nothing a subject or a query holds
                        reaches the count. ddr_glossary carries the
                        reasoning, including why the fields are named
                        rather than inferred.

