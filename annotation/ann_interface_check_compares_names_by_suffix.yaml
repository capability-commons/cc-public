title:                  The interface check compares a member to its source by suffix
brief:                  |
                        _source refuses a member whose lower-cased
                        source identifier does not end with its
                        language-cased name, so a class member named
                        Database can never carry the edge to
                        pyc_cc_public.query.database, while a bare
                        suffix such as rawing passes for drawing.
description:            |
                        In a copy, linking
                        icm_cc_public_query.database by
                        r_is_implemented_by to a new
                        pyc_cc_public.query.database gave the
                        interface finding that
                        pyc_cc_public.query.database does not end with
                        Database, and the relation check accepted the
                        edge; setting a function member name to rawing
                        gave no finding. In the tree the class member
                        holds no edge at all. Comparing the last step
                        of the identifier to the lower-cased name
                        would close both.

