title:                  A helper module under test/ selects itself instead of its tests
brief:                  |
                        is_test accepts any python file under test/,
                        so a change to selection.py,
                        control_adapter.py or package_smoke.py names
                        that file as the node and never selects the
                        module that tests it.
description:            |
                        Planning for a change to test/selection.py
                        selects test/selection.py and
                        test/test_gate_tool.py, not test_selection.py
                        which imports it; running the plan as pytest
                        gives 1 passed, exit 0. measure globs
                        test_*.py, so the module disagrees with itself
                        about what a test module is.

