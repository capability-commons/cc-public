title:                  The closure decision names three dependency relations; the register declares six
brief:                  |
                        ddr_dependency_closure says
                        r_is_implemented_by, r_uses_test_method and
                        r_tests declare it and argues that declaring
                        more would widen every closure on an argument
                        nobody has made, while ddr_annotation declared
                        it on r_is_about, r_supports and r_challenges
                        two days later and neither record was amended.
description:            |
                        testing.dependency returns six relations.
                        Nothing is affected today, since no annotation
                        is in an evidence closure, but the closure
                        computed from declared semantics now follows
                        three relations the deciding record says it
                        does not, and a reader who trusts it
                        mis-predicts what an evidence digest covers
                        once an annotation is about an implementing
                        function.

