title:                  insert says an embedded item has no schema of its own
brief:                  |
                        The module docstring says an embedded item has
                        no schema of its own and its shape is read
                        from the container, which
                        ddr_embedded_item_schema reversed; shape_at
                        still walks the container schema while the
                        check selects the type schema, so two
                        resolutions exist for one question.
description:            |
                        For registers the two agree because every
                        register schema composes the entry schema the
                        type names; for t_criticality and t_gate_tool
                        they differ, since the container shape carries
                        sch_entry and the type schema does not. The
                        next reader of insert is told the pre-decision
                        model.

