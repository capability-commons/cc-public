title:                  The workbench shows assertions and cannot make one
brief:                  |
                        The workbench serves the Argument view, which
                        reads annotations and the edges between them,
                        and offers no way to write one.
description:            |
                        Feedback about what is on a page arrives while
                        looking at the page, and the cost of leaving
                        to record it is why it goes unrecorded. An
                        annotation is also the safest thing the
                        workbench could ever write: ddr_annotation
                        gave it no status, no lifecycle and no
                        authority, it creates a new item and changes
                        nothing existing, and a person's annotation
                        names no model, so nothing has to know who is
                        using it. What a click means is the open part,
                        since the same click may assert about the
                        record shown or about the way it is shown, and
                        the subject is better refined later than
                        chosen in the moment.

