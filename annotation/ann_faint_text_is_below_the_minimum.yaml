title:                  Two of the three contrast levels carried text below the legible minimum
brief:                  |
                        Measured from the tokens as committed, the far
                        level was 2.83 to 1 in the light theme and
                        2.98 in the dark, and the label level 3.47 and
                        3.88, against a minimum of 4.5 for normal
                        text.
description:            |
                        Both levels carry ordinary content and not
                        decoration, so the exception for inactive or
                        purely decorative text does not reach them.
                        The adjacent levels also differed by only 2.17
                        to 2.65 to 1, which is below the 3 to 1 that
                        the colour guidance allows a distinction to
                        rest on. The scheme was legible at its
                        faintest level only in the sense that the text
                        was present.

