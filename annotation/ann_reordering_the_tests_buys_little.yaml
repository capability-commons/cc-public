title:                  Reordering within the tests buys little, and the slow tests are the lever
brief:                  |
                        Of the three orderings the question names, one
                        cannot be used here at all, one helps only a
                        re-run, and one is unrecorded. Fifty nine
                        tests hold half the runtime, and that is worth
                        more than any order.
description:            |
                        Measured on 2026-09-14 against the run at
                        802d537eb9, from the junit report of the last
                        full run and from the last forty commits.

                        What a change reaches cannot be used here. The
                        selection rule runs the whole suite for a
                        change to anything that is not a module or a
                        test, because what reads a data item is not
                        something a map of executed lines can say. Of
                        the last forty commits, forty would run the
                        whole suite. Twenty four touch code and data
                        together and sixteen touch data alone. None
                        touches code alone. This is not a fault in the
                        map. It is that this repository is mostly
                        data.

                        Ordering buys nothing on its own. The suite
                        does not stop at a failure, so the verdict
                        arrives at the end whatever order the tests
                        ran in. Reordering moves where a failure
                        appears in the log and not when anybody learns
                        of it. Any gain needs the run to stop, and
                        then the ordering only decides how soon it
                        stops.

                        Stopping at the first failure is itself a poor
                        trade at this length. Three independent
                        failures become three runs of fourteen
                        minutes, where one run finds all three in
                        fourteen. Fail fast pays where failures
                        cascade and costs where they do not.

                        Running the quick tests first looked better
                        than it is. One thousand and fifty seven
                        tests, seventy three per cent of them, take
                        under a second and come to twenty two seconds
                        together, about three seconds of wall on the
                        workers available. A phase over those would
                        need no map and would serve a data only
                        change. But both failures observed during the
                        work that produced this note were tests of
                        twelve and twenty five seconds, and neither
                        would have been caught. That is two
                        observations and it is the only failure
                        evidence there is.

                        What the distribution does say is that fifty
                        nine tests, four per cent of them, hold half
                        of all test seconds, and that the longest
                        single test is two hundred and twenty six
                        seconds, which is the floor under any wall
                        time however many workers run. The suite is
                        eight hundred and sixty five seconds. Halving
                        those fifty nine would put it near six hundred
                        and fifty, on every run, passing or failing,
                        without anybody guessing where a fault will
                        be.

                        The slowest are workflow and subprocess tests.
                        ann_a_run_rechecks_the_whole_tree_at_every_node
                        and
                        ann_the_layout_check_is_paid_for_many_times
                        both name causes that would explain them, and
                        both are recorded as worth doing.

                        So qst_gate_order.within_tests is better left
                        open than answered now. The question is easier
                        to answer against a suite of six hundred and
                        fifty seconds than one of eight hundred and
                        sixty five, and part of it may not survive
                        that change.

