title:                  The adapter reads a parametrised function by its first passing instance
brief:                  |
                        The pytest adapter returns completed and
                        passed at the first call report that passed,
                        so a parametrised test function whose second
                        or later instance failed is recorded as a
                        pass.
description:            |
                        In _observation the loop over call reports
                        returns at the first passed outcome before
                        reading the next report. With
                        test_parameterised in test/control_adapter.py
                        changed to assert number == 1, the adapter
                        printed completed passed while pytest on the
                        same node printed 1 failed, 1 passed. One
                        skipped and one passed instance read as passed
                        by the same order, where evidence.outcome_of
                        ranks skipped above passed.
                        ddr_verification_evidence decides that a case
                        with several collected instances passes only
                        where every instance did;
                        tc_printer_idempotent runs four hundred and
                        ninety two.

