title:                  The quick loop writes evidence as though it were the whole suite
brief:                  |
                        pixi run quick excludes the slow tests and
                        sets no CCTOOL_PARTIAL_RUN, so the loop
                        CLAUDE.md says decides nothing re-stamps and
                        re-times the rows it ran.
description:            |
                        The quick task is pytest -q -n auto test -m
                        not slow with no environment; test-changed and
                        test-map both pass the partial variable. The
                        effect is bounded by evidence.record keeping
                        unobserved rows, so what quick can do is
                        rewrite time, revision, dirtiness and any
                        re-stamped digest, and the commit that follows
                        carries them.

