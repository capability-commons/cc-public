title:                  The member brief is decided to be the contract
brief:                  |
                        Decided. A member's brief and obligation
                        govern what a caller may rely on; the source
                        brief describes the definition for a reader of
                        the code.
description:            |
                        The two describe one definition and divide it
                        differently: the member's brief states the
                        main case and moves the empty and unknown
                        cases to its obligation, while the source
                        brief packs all three into one sentence. They
                        do not contradict and nothing said which a
                        reader believes.

                        Decided rather than dropped, because a partner
                        reading the document may have no access to the
                        code. The record says the member governs, says
                        plainly that this is the second description
                        ddr_source_item rejected, and that the
                        audiences differ where those did not.
                        qst_interface_control_document.brief asks what
                        compares them.

