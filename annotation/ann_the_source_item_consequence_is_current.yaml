title:                  The source item consequence now says what is done
brief:                  |
                        Amended. The count is replaced by the command
                        that lists the checks, and both things it
                        called pending are done.
description:            |
                        The consequence opened with eleven checks
                        where there are eighteen, and said a test
                        naming the requirement it verifies at function
                        grain waits on moving six module edges down.
                        No test module holds an r_verifies edge at
                        module grain and every case names a function.

