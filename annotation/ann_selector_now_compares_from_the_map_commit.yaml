title:                  The comparison now runs from the commit the map was measured at
brief:                  |
                        Fixed. changed compares from the map's commit
                        as well as from the last commit, so a
                        committed change is still a change until the
                        map is remeasured.
description:            |
                        The commit was written by _map_of and read
                        nowhere, so once a change was committed the
                        selector said nothing had changed and exited
                        zero, although the map predated the commit. A
                        commit runs the checks and the lint and no
                        tests, so commit then run is the ordinary
                        loop.

                        changed now unions three sets: what differs
                        from the commit the map records, what differs
                        from the last commit, and what is untracked.
                        Where there is no map it falls back to the
                        last commit alone.

                        test_the_comparison_runs_from_the_commit_the_map_was_measured_at
                        builds a repository, commits twice, and
                        asserts that a change committed since the
                        map's commit is still seen while nothing
                        differs from HEAD. The decision now says what
                        the comparison runs from and why.

