title:                  The domain the criticality consequences carry is recorded
brief:                  |
                        Accepted and recorded, not moved. The
                        mechanism is domain neutral and the
                        consequences are of one domain, sitting in the
                        core that holds what travels.
description:            |
                        The judgement holds. The levels name death or
                        serious injury to a third party, loss of
                        control over a populated area, command and
                        control, and protected personal data at scale,
                        and the core consumes nothing.

                        Not moved, because moving them means the core
                        holds levels with no consequence and every
                        consumer shadows the register, and no consumer
                        yet needs different words.
                        qst_criticality.domain asks whether the
                        consequence belongs in the segment whose
                        domain it describes, so the argument stays
                        open rather than being settled by what was
                        convenient.

