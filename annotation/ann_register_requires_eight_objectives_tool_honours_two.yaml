title:                  A level requires eight objectives and the tool honours two
brief:                  |
                        The requires list of a level is read for two
                        objective ids held in trace.py, so the other
                        objectives a level names change nothing when
                        declared and requires means different things
                        for different rows.
description:            |
                        Only obj_verdict_per_requirement and
                        obj_coverage_analysed appear in the
                        projection. crit_safety_60 requires
                        obj_case_per_condition, which nothing
                        satisfies and no rule reads, though
                        ddr_criticality claims to answer the partition
                        question of ddr_test_case_adoption by this
                        register. A reader of crit_safety_60 believes
                        three cases are demanded and none is.

