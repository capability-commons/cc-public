title:                  The coverage objective is no longer claimed by anything
brief:                  |
                        Fixed by withdrawing. Both r_satisfies edges
                        are removed, and the objective says why: the
                        analysing happens and the recording does not.
description:            |
                        The eval that analyses and the check that
                        demands a record both pointed at the
                        objective, whose statement is that coverage is
                        analysed and recorded. No coverage analysis
                        item exists, and two decisions beside it said
                        the repository does not meet it, so an auditor
                        running qry_objective_conformance was told the
                        opposite of what the records said.

                        Withdrawn rather than explained away. Nothing
                        claims more than it demonstrated, which is the
                        discipline the whole objective set was written
                        under. It becomes claimable the day something
                        writes a coverage analysis, which is
                        qst_coverage_analysis.writer.

