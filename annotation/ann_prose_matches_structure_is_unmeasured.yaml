title:                  evl_prose_matches_structure sweeps with no control set and no confidence
brief:                  |
                        The anchor decision retired the control set
                        with the population it was about and recorded
                        no other, so the eval reaches four hundred and
                        sixty eight standalone items in every sweep,
                        carries no confidence for any judge, and every
                        finding it makes carries none.
description:            |
                        The judged run over the changed items noted
                        that the eval carries no current confidence
                        for openai/gpt-5.1; eval/ holds no control set
                        for it; ddr_eval_anchor_and_population says
                        the set is retired and says nothing of a
                        replacement. ddr_eval_admission refuses such
                        an eval as a guard, and a sweep is not a
                        guard, so it runs and reports on the strength
                        of nothing measured.

