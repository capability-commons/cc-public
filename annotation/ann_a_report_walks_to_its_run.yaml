title:                  A kept report can now be walked to the run it came from
brief:                  |
                        Fixed in part. r_results_from admits a report
                        and a test execution, and the edge is written
                        where the execution is kept; what carries the
                        obligation is left open.
description:            |
                        The report held id_execution in a field with
                        an empty relation list, so nothing could walk
                        from it to the run, which is the house rule
                        that a field does not carry what an edge
                        should.

                        The edge is added only where the execution is
                        kept, because one naming a run the tree does
                        not hold would dangle, and a development run
                        leaves none. A test holds both cases.

                        The other half is not fixed and not rebutted.
                        A report should say which obligation the
                        failure is against, and r_is_about is the
                        annotation's relation whose minimum of one
                        would oblige every report to name a
                        requirement, while a report from a check is
                        against none. Inventing a relation is a
                        decision with alternatives, so it is
                        qst_nonconformity_report.obligation.

