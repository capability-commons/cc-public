title:                  The test command now reports the result in its exit status
brief:                  |
                        Fixed. An execution that did not complete, or
                        any result that is not passed or not
                        applicable, exits with the nonconformity
                        status, as run and resume do.
description:            |
                        A completed execution with a failed result
                        exited zero, so a caller could not tell pass
                        from fail without parsing the output, and
                        test_keeping_a_report_keeps_the_execution_it_names
                        asserted zero on a deliberately broken
                        candidate.

                        That assertion now expects the nonconformity
                        status, and the reading is over every result
                        the execution holds rather than over the
                        first.

