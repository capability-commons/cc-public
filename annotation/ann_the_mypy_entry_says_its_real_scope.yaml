title:                  The mypy entry now says what files chooses and what the package costs
brief:                  |
                        Amended in three places. files chooses the
                        default target and not the reach of the flags,
                        and the whole package at this strictness is
                        1970 errors in 79 of 92 files.
description:            |
                        The entry and the guide both said every
                        strictness flag applies to the island and to
                        nothing else. files chooses what mypy is
                        pointed at by default; pointing it elsewhere
                        points the whole configuration elsewhere,
                        which is why a strict flag fires outside the
                        island.

                        The 63 in 31 of 92 was measured under
                        check_untyped_defs alone, which the
                        configuration no longer expresses. Measured
                        today with mypy -p cc_public under the
                        configuration as it stands: 1970 errors in 79
                        of 92 files. The earlier figure is kept beside
                        it and labelled, since a reader following the
                        guide to size the widening job was getting a
                        number thirty times too small.

