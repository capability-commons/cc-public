status:                 proposed
title:                  A commit message carries a record
brief:                  |
                        A commit message the tool wrote is read, and
                        shown to hold a record.
version:                '1.0'
input:                  |
                        The message of one commit made by cctool
                        commit, taken from the history of the
                        repository under test.
expectation:            |
                        The message reads as a title line, then a
                        blank line, then one YAML document opened by
                        three hyphens and closed by three dots, then
                        the trailers. The document parses, and what it
                        holds is the commit record.
description:            |
                        Read rather than run. What the requirement
                        asks is a property of the text a person can
                        see in the message itself, and reading it is
                        the whole of the method.

                        The case exists because the method is carried
                        out by a person and not because a runner needs
                        configuring. It names the item under test, the
                        method and what the reader is given, and
                        states what is expected before anyone looks.

