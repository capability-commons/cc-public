status:                 proposed
title:                  A walk follows only the relations it is given
brief:                  |
                        Where a relation is named, no item reached by
                        another relation is reported.
version:                '1.0'
input:                  |
                        A tree, the readable id of an item in it, a
                        depth, and one relation to follow.
expectation:            |
                        No reported item is reached by an edge
                        labelled with another relation, and an item
                        reachable only by other relations is absent.
description:            |
                        The case that observes which items a walk
                        reports when it is given a relation to follow.
                        It runs the same test function as
                        tc_walk_reports_neighbourhood, and expects
                        something else of it.

