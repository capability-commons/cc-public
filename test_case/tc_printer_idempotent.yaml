status:                 proposed
title:                  The printer is a fixpoint
brief:                  |
                        A document laid out twice is byte identical
                        after the first pass.
version:                '1.0'
input:                  |
                        Every yaml file and every docstring document
                        in the tree.
expectation:            |
                        The second pass writes each byte of the first
                        pass unchanged, and the content the document
                        carried is preserved.
description:            |
                        The case that observes the printer over every
                        yaml file and every docstring document the
                        repository holds.

