status:                 proposed
title:                  A run stops at its budget
brief:                  |
                        No node runs more times than the deployment
                        allows.
version:                '1.0'
input:                  |
                        A workflow holding a back edge, and a
                        deployment with a budget.
expectation:            |
                        No node in the execution record carries a
                        binding with a pass number greater than the
                        budget, and the run stops rather than
                        continuing.
description:            |
                        The case that observes what the executor does
                        when a back edge would take a node past the
                        budget of its deployment.

