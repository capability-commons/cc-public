status:                 proposed
title:                  A neighbourhood is reported to a depth
brief:                  |
                        Every item within a depth of the start is
                        reported, with the edge that reached it.
version:                '1.0'
input:                  |
                        A tree, the readable id of an item in it, and
                        a depth.
expectation:            |
                        Each item within that many relation edges of
                        the start, in either direction, once, at the
                        depth it is first reached, and each carrying
                        the relation edge that reached it.
description:            |
                        The case that observes what cc_public.query
                        reports for a walk over a graph of known
                        shape.

