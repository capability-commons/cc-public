status:                 proposed
title:                  A shortest path is reported
brief:                  |
                        The path between two items is reported as the
                        steps along it.
version:                '1.0'
input:                  |
                        A tree, and the readable ids of two items in
                        it.
expectation:            |
                        The steps of a shortest path, in order from
                        the first item; an empty list where no path
                        joins them.
description:            |
                        The case that observes what cc_public.query
                        reports for a pair of items joined by a path,
                        and for a pair joined by none.

