title:                  Need from observation
brief:                  |
                        Draft the need a captured public source
                        supports, and redraft it on its own judgement
                        until every need eval is met or the budget is
                        spent.
description:            |
                        One node. It takes an observation and the
                        writing style guide, writes the need, and is
                        judged by the need evals. While any is unmet,
                        two back edges return the need and its
                        judgement to the node's own optional inputs
                        for another pass, within the deployment's
                        budget. The need that leaves derives from the
                        observation and is proposed. The first step of
                        the observation-to-engineering demonstration.

