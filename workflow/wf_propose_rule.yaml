title:                  Propose a rule from a sweep
brief:                  |
                        A model reads what a sweep found and proposes
                        one rule a check could apply.
description:            |
                        One node, on a model. It takes a sweep, the
                        rule register and the guide, and writes a rule
                        proposal deriving from the sweep. Run once per
                        sweep; run again for the next shape once a
                        proposal is accepted or rejected. The
                        improvement loop: a defect found downstream of
                        a gate is evidence the gate is too weak, and a
                        shape found repeatedly is evidence a rule is
                        missing.

