title:                  Propose a decomposition
brief:                  |
                        Break a need into narrower needs under a
                        framing, as a design decision with its
                        assumptions.
description:            |
                        Given a need, a framing and the writing style
                        guide, and on a later pass its own prior
                        decision with the judgement and challenge it
                        drew, produce the design decision that
                        decomposes the need: the children it proposes,
                        the assumptions about the world it relies on,
                        the alternatives it rejected, and, where a
                        challenge was made, its resolution. Follows
                        method_kaos for refinement and obstacles and
                        method_admissible_claims for what the record
                        must carry.

output:

  decision:
    id_self:            prt_propose_decomposition.decision
    guid_self:          prt_0c1f90d40b80460bbdd762b6a54d29f3
    title:              Decomposition decision
    brief:              |
                        The design decision decomposing the need.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    revises:            prior

    field:
      - title
      - brief
      - context
      - decision
      - rationale
      - alternative
      - consequence
      - assumption
      - resolution

    prompt:             |
                        Decompose the need on need into narrower
                        needs, looking at it the way the framing on
                        framing says. Say in context which need and
                        which framing, in one sentence each. In
                        decision, name each child need as one sentence
                        in the form the parent uses: in a context, a
                        subject needs an outcome, in order to a
                        purpose; where the decomposition chooses the
                        entity the outcome is needed from, name it.
                        State in assumption every claim about the
                        world the decomposition relies on, as a JSON
                        list of objects with a key, a statement and
                        its evidence; an assumption with no evidence
                        says so. In alternative say what other ways of
                        cutting the need were considered and why not.
                        In consequence say what follows, including
                        which threats or degraded conditions in the
                        need's context the children answer and which
                        they do not. Where judgement or prior is
                        bound, revise the prior: answer every unmet
                        finding. Where the prior carries a challenge,
                        write in resolution how the position answers
                        it, standing, revising or conceding, point by
                        point; otherwise leave resolution empty. The
                        rules on guide say how to write; follow them
                        and do not mention them. Write the decision as
                        the act of deciding, not as a report.

    link:

      r_is_derived_from:
        - need

    relation:

