title:                  Accept a requirement
brief:                  |
                        Accept one requirement whose derivation, code,
                        verification and evidence are in place.
description:            |
                        One node, implemented in code. It takes a
                        requirement on its input and accepts it, or
                        stops. No eval guards it: acceptance is
                        decided by the mechanical checks and the
                        trace, which the accept path runs. The last
                        step of the requirements loop, kept as a
                        workflow of its own so that the loop can end
                        in it.

