title:                  Accept a requirement
brief:                  |
                        Accept the requirement on its input, where its
                        assurance is complete.
description:            |
                        Implemented in code by the accept function of
                        the component module. The requirement is
                        accepted through the same path as the accept
                        command, which refuses unless the requirement
                        is judged as accepted in a closed world, its
                        trace shows no gap and its evidence is a pass
                        and current. A refusal stops the run, and the
                        tree is restored. The output carries the same
                        requirement, revised.

