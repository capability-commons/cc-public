title:                  Record from schema
brief:                  |
                        Draft a design decision about a schema, and
                        redraft it on its own judgement until every
                        eval is met or the budget is spent.
description:            |
                        One node. It takes a schema on its subject
                        port and the writing style guide, makes the
                        design decision, and is judged. While any eval
                        is unmet, two back edges return the record and
                        its judgement to the node's own optional
                        inputs for another pass, within the
                        deployment's budget. The record that leaves is
                        as good as the budget allowed.

node:

  draft:
    id_self:            node_design_decision_from_schema.draft
    guid_self:          node_bdc1f08f93604873ad08b4659269812d
    title:              Draft
    brief:              |
                        Drafts the record.

    relation:

      - id_relation:    r_instantiates
        guid_relation:  r_335c008f9bea4580ba63e4d6def980d3
        id_target:      cmp_draft_design_decision
        guid_target:    cmp_ccb3fedf29b74807be9cef5e5b702e63

    config:             {}

edge:                   {}

edge_back:

  draft_to_draft:
    from:               draft.output.decision
    to:                 draft.input.prior
    guard:              unmet

  draft_to_draft_judgement:
    from:               draft.output.decision
    to:                 draft.input.judgement
    guard:              unmet
    carries:            judgement

relation:               []
