title:                  Record from schema
brief:                  |
                        Draft a design decision about a schema, review
                        it, and revise until the review is satisfied.
description:            |
                        Two nodes and one cycle. The draft node writes
                        a record about the schema on its subject port.
                        The review node revises it. Where the eval on
                        the reviewed record is unmet, the back edge
                        returns it to the draft node's prior port and
                        the draft is revised; where it is met, the
                        reviewed record is the workflow's output.

node:

  draft:
    id_self:            node_design_decision_from_schema.draft
    guid_self:          node_bdc1f08f93604873ad08b4659269812d
    title:              Draft
    brief:              |
                        Drafts the record.

    relation:

      - id_relation:    r_instantiates
        guid_relation:  r_335c008f9bea4580ba63e4d6def980d3
        id_target:      cmp_draft_design_decision
        guid_target:    cmp_ccb3fedf29b74807be9cef5e5b702e63

    config:             {}

  review:
    id_self:            node_design_decision_from_schema.review
    guid_self:          node_9c5b0ef1f02d41bea0f10c113d7affd0
    title:              Review
    brief:              |
                        Reviews and revises the draft.

    relation:

      - id_relation:    r_instantiates
        guid_relation:  r_335c008f9bea4580ba63e4d6def980d3
        id_target:      cmp_review_design_decision
        guid_target:    cmp_28a45941ac7647f392e2c56ba749edd5

    config:             {}

edge:

  draft_to_review:
    from:               draft.output.decision
    to:                 review.input.draft

edge_back:

  review_to_draft:
    from:               review.output.decision
    to:                 draft.input.prior
    guard:              unmet

  review_to_draft_judgement:
    from:               review.output.decision
    to:                 draft.input.judgement
    guard:              unmet
    carries:            judgement

relation:               []
