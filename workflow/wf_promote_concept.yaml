title:                  Promote a concept
brief:                  |
                        Turn a concept's candidate requirements into
                        proposed requirement items.
description:            |
                        One node, in code. It takes a concept and
                        makes a proposed textual requirement item from
                        each of its candidate requirements, each
                        deriving from the concept and its need. The
                        third step of the observation-to-engineering
                        demonstration, and the boundary at which a
                        proposal enters the assurance machinery: from
                        here the requirement evals, the trace and
                        acceptance apply.

