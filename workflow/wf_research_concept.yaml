title:                  Research a concept
brief:                  |
                        An agent with tools assesses the feasibility
                        of a concept with real references.
description:            |
                        One node, performed by an agent. The run parks
                        with a brief that asks for real off-the-shelf
                        options, each source captured as an
                        observation and cited, and resumes when an
                        assessment pointing at the concept exists. Run
                        once per concept. Where no agent is at hand,
                        the assess workflow is the fallback, and the
                        document marks the difference.

