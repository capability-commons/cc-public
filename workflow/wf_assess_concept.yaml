title:                  Assess a concept
brief:                  |
                        A model judges the feasibility of a concept,
                        without references.
description:            |
                        One node, on a model. It takes a concept and
                        its need and writes the feasibility
                        assessment: verdict, seven rated dimensions,
                        off-the-shelf candidates with no reference
                        cited. Run once per concept. The fallback
                        where no agent performs the research workflow;
                        the document marks an assessment by how it was
                        made.

