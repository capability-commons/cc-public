title:                  Draft a record
brief:                  |
                        Write a design decision record about a schema.
description:            |
                        Given a schema, and where there is one an
                        earlier draft, produce the decision record
                        that explains the decisions the schema
                        embodies.

input:

  subject:
    id_self:            prt_draft_record.subject
    guid_self:          prt_3487d4e416e64437a153bbca5f9c082b
    title:              Subject
    brief:              |
                        The schema the record is about.
    id_type:            t_schema
    guid_type:          t_a4fb6d3ae5ff4452a45804e2f57b06a2

  prior:
    id_self:            prt_draft_record.prior
    guid_self:          prt_37bc5736c7f542ee9d0eb665449ada3c
    title:              Prior draft
    brief:              |
                        The previous draft of the record, where a
                        review sent it back.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    optional:           true

output:

  record:
    id_self:            prt_draft_record.record
    guid_self:          prt_abdfbd81030744be839042c7bd79719d
    title:              Record
    brief:              |
                        The decision record produced.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    prompt:             |
                        Write a design decision record for the schema
                        on subject. Where prior is bound, revise it
                        rather than starting again: keep what was
                        right and change what was found wanting. Say
                        what was decided, why, what else was
                        considered, and what follows. Put no reasoning
                        in the schema itself.

    relation:

      - id_relation:    r_is_judged_by
        guid_relation:  r_2ad95cd22e3e45beb317f3e082386a96
        id_target:      evl_prose_matches_structure
        guid_target:    evl_243e02e2af83439c93c24b394ed89803

