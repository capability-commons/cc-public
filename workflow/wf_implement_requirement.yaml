title:                  Implement and accept a requirement
brief:                  |
                        An agent implements and tests a requirement;
                        then it is accepted, or the run says what it
                        lacks.
description:            |
                        Two nodes. The first is performed by an agent
                        and parks the run with a brief: write the code
                        and the test, link both, record evidence. On
                        resume the second accepts the requirement
                        through the same path as the accept command,
                        or stops saying what is lacking, which is the
                        brief for the next attempt. The
                        per-requirement half of the requirements loop.

