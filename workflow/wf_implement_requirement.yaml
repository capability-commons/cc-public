title:                  Implement and accept a requirement
brief:                  |
                        An agent implements and tests a requirement;
                        the tests are run and their evidence recorded;
                        then it is accepted, or the run says what it
                        lacks.
description:            |
                        Three nodes. The first is performed by an
                        agent and parks the run with a brief: write
                        the code and the test, link both. On resume
                        the second runs the tests that verify the
                        requirement and records the evidence, stopping
                        on a failure. The third accepts the
                        requirement through the same path as the
                        accept command, or stops saying what is
                        lacking, which is the brief for the next
                        attempt. The per-requirement half of the
                        requirements loop.

