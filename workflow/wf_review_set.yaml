title:                  Review a requirement set
brief:                  |
                        A model reads a requirement set and writes
                        what it covers.
description:            |
                        One node, on a model. It takes a requirement
                        set and writes its coverage table, one entry
                        per scenario class. Run once per set, and
                        again after the set changes; the requirement
                        check reports the classes it leaves uncovered
                        and a set not yet reviewed.

