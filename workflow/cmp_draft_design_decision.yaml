title:                  Draft a record
brief:                  |
                        Write a design decision about a schema.
description:            |
                        Given a schema, and where there is one an
                        earlier draft, produce the design decision
                        that explains the decisions the schema
                        embodies.

input:

  subject:
    id_self:            prt_draft_design_decision.subject
    guid_self:          prt_3487d4e416e64437a153bbca5f9c082b
    title:              Subject
    brief:              |
                        The schema the record is about.
    id_type:            t_schema
    guid_type:          t_a4fb6d3ae5ff4452a45804e2f57b06a2

  prior:
    id_self:            prt_draft_design_decision.prior
    guid_self:          prt_37bc5736c7f542ee9d0eb665449ada3c
    title:              Prior draft
    brief:              |
                        The previous draft of the record, where a
                        review sent it back.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    optional:           true

  guide:
    id_self:            prt_draft_design_decision.guide
    guid_self:          prt_1f1b108a083b411a82ec0b16a4587bb7
    title:              Writing style guide
    brief:              |
                        The register of writing style rules the prose
                        follows.
    id_type:            t_register
    guid_type:          t_dcd4c5f697c945829094914ff868a43b
    relation:           []

output:

  decision:
    id_self:            prt_draft_design_decision.decision
    guid_self:          prt_abdfbd81030744be839042c7bd79719d
    title:              Record
    brief:              |
                        The design decision produced.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    prompt:             |
                        Write a design decision for the schema on
                        subject. Where prior is bound, revise it
                        rather than starting again: keep what was
                        right and change what was found wanting. Say
                        what was decided, why, what else was
                        considered, and what follows. Put no reasoning
                        in the schema itself. The rules on guide say
                        how to write; follow them, and do not mention
                        them, the guide, or style in what you write.
                        Write the decision as the act of deciding,
                        before the schema existed, not as a report on
                        what the schema does.
    decides:            subject

