  decision:
    id_self:            prt_review_design_decision.decision
    guid_self:          prt_1a414b79d6534b739e35741950a7af22
    title:              Record
    brief:              |
                        The reviewed record.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    prompt:             |
                        Review the design decision on draft against
                        its own claims and against the rules on guide.
                        Return it revised so that every claim it makes
                        about its structure is true of that structure,
                        so that its decision, rationale, alternative
                        and consequence each say one thing, and so
                        that it follows every rule on guide. The rules
                        say how to write; do not mention them, the
                        guide, or style in what you return. Write the
                        decision as the act of deciding, not as a
                        report on what the schema does.
    revises:            draft

