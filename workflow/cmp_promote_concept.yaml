title:                  Promote a concept
brief:                  |
                        Make a proposed requirement item from each
                        candidate requirement of the concept on its
                        input.
description:            |
                        Implemented in code by the promote function of
                        the component module. Each candidate
                        requirement entry of the concept becomes a
                        textual requirement item, proposed, with the
                        entry's statement, rationale and category,
                        deriving from the concept and from its need;
                        the entries stay in the concept as the record
                        of what was proposed. The items are what the
                        requirement evals judge and what the trace and
                        acceptance hold to account. A concept promoted
                        before is refused.

