title:                  Verify a requirement
brief:                  |
                        Run the tests that verify the requirement on
                        its input and record the evidence.
description:            |
                        Implemented in code by the verify function of
                        the component module. The tests named by
                        r_verifies edges to the requirement are run
                        under pytest, and what they observed is
                        written into the pytest evidence, one row per
                        test and requirement, stamped as the test
                        session stamps it. A requirement nothing
                        verifies by test runs nothing and passes
                        through; the accept node says what it lacks. A
                        test that did not pass stops the run, which
                        restores the evidence to what it was, the
                        failure being in the report.

