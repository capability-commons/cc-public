title:                  Challenge a decomposition
brief:                  |
                        Construct the strongest case against a
                        decomposition, from a stance independent of
                        the one that proposed it.
description:            |
                        Given a decomposition decision and the need it
                        decomposes, write the challenge: the strongest
                        specific case that the children do not deliver
                        the outcome, that an assumption is false or
                        unevidenced, that a threat in the context is
                        unanswered, or that a rejected alternative was
                        better. Runs on the deployment's challenge
                        model, never the proposer's. Where a
                        resolution already answers a prior challenge,
                        either raise what it leaves open or concede
                        that the position stands. Follows
                        method_admissible_claims.

output:

  decision:
    id_self:            prt_challenge_decomposition.decision
    guid_self:          prt_1724f78cf9d9448d82a64fd01703408d
    title:              Challenged decision
    brief:              |
                        The same decision, carrying its challenge.
    id_type:            t_ddr
    guid_type:          t_5751ab6c7b0c44e8b4ed8f6c882192d8
    revises:            proposal

    field:
      - challenge

    prompt:             |
                        Read the decision on proposal and the need on
                        need. Write in challenge the strongest case
                        against the decision: be specific, quote the
                        child, assumption or alternative you attack,
                        and say what would happen if you are right.
                        Attack on these grounds where they apply: a
                        child that does not serve the need; the
                        children together leaving part of the outcome
                        uncovered; an assumption that is false,
                        unevidenced or contradicted by the need's
                        evidence; a threat or degraded condition in
                        the context that no child answers; a rejected
                        alternative that was better. Where a
                        resolution already answers an earlier
                        challenge, raise only what it leaves open, or
                        if it leaves nothing open, say that the
                        position stands and why. Do not repeat the
                        decision, do not praise it, and do not mention
                        rules or style.

    relation:

      - id_relation:    r_is_judged_by
        guid_relation:  r_2ad95cd22e3e45beb317f3e082386a96
        id_target:      evl_challenge_answered
        guid_target:    evl_63a94938fe014899b093e1ed560d599a

