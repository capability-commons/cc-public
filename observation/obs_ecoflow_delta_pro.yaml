content:                |
                        DELTA Pro Portable Power Station. 3.6 to 25
                        kWh capacity, expandable with Smart Extra
                        Battery. Long-lasting LFP battery supports up
                        to 10 years; 3000+ charging cycles enabled by
                        the LFP battery chemistry. 3600W output; 3600W
                        to 7200W AC output for 99% of appliances. 2.7
                        hours AC charging via 6500W MultiCharge; solar
                        about 10.2 hours with a 440W panel or about
                        11.3 hours with a 400W panel; recharge at EV
                        stations. Price shown $1,899, marked down from
                        $2,799; bundles $2,399 to $3,479.
