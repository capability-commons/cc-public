content:                |
                        Supplying the military with rugged and
                        reliable battery systems for over 20 years.
                        Products named: Lithium-ion 6T; Soldier
                        Portable Charger (SPC); M1 Battery, the M1
                        Family Single-Use Lithium Thionyl Chloride
                        Battery. Denchi utilises a broad range of
                        chemistries including lithium manganese
                        dioxide, lithium thionyl chloride, alkaline
                        and silver oxide primary cells, and
                        lithium-ion variants, nickel metal hydride,
                        nickel cadmium and lead-acid secondary cells.
                        The page names no IP rating, temperature or
                        shock specification, certification, customer
                        or prime.
