content:                |
                        Russian infiltration tactics are more
                        efficient than we give them credit for🇷🇺

                        Any time Russian command spot a high-value
                        target - they get their Su-34 in the air.
                        These bastards then launch glide bombs.

                        Glide bombs hurt - they really do. It's about
                        200kg of explosives flying your way. And you
                        can't really shoot them down like you can
                        shoot down drones. They can collapse fortified
                        buildings, bunkers and entire urban blocks
                        much more effectively than artillery.

                        And THEN Russian infantry infiltrate through
                        the damaged areas, using the ruins for cover
                        and concealment. FPV drones observe Ukrainian
                        movements, attack reinforcements and interfere
                        with evacuation and resupply.

                        However, glide bombs have plenty of
                        weaknesses. They are very innacurate, rely
                        heavily on reconnaissance drones, which can be
                        shot down or jammed and on satellite guidance.

                        Thus, best countermeasure is to destroy the
                        aircraft itself, hunt reconnaissance crews and
                        always conceal and disperse your positions.
                        #Rubizh brigade does just that and that's why
                        we're doing a good job.
