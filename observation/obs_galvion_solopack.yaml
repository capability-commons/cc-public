content:                |
                        SOLOPACK. Field-proven, energy-dense
                        rechargeable lithium-ion battery. 98 Wh.
                        Weight 1.2 lbs (550 g). Dimensions 1.2 x 3 x
                        7.1 in. Nominal capacity 6.8 Ah; voltage range
                        11.0 to 16.8 VDC; max discharge 5.0 A
                        continuous; energy density 178 Wh/kg; cycles
                        greater than 500. Connector Nett Warrior
                        6-pin; communication SMBus v1.1.
