content:                |
                        BTE-70791A-T1B, 6-PACK Portable Power System.
                        1.2kWh to 1.8kWh Portable Power System with
                        the ability to increase as higher capacity
                        BB-2590/U batteries become available. SMBus
                        v1.1 and SBData v1.1 compliant; RS-485
                        communication interface. Capable of acting as
                        a UPS, power supply or standalone battery
                        unit. The 6-PACK can hold one to six BB-2590/U
                        batteries packed into a rugged, watertight
                        container (batteries not included). Contains
                        an integrated power management system; DC
                        input protection prevents over-discharge
                        damage to vehicle battery; maximum power point
                        tracking (MPPT). National Stock Number
                        6130-01-588-5188. Dimensions 12.8 x 10.8 x
                        11.3 in (325 x 274 x 287 mm). Weight 39 lbs
                        (18 kg) with batteries, 21 lbs (9.5 kg)
                        without. Capacity 81.6Ah to 118.8Ah at 14.4V;
                        40.8Ah to 59.4Ah at 28.8V depending on battery
                        used. Outputs 12Vdc: 12-16.8Vdc, 24Vdc:
                        24-33.6Vdc. Continuous power 60A max at
                        14.4Vdc; 30A max at 28.8Vdc. Inputs 11-18Vdc
                        20A; 20-33Vdc 15A; 90-264Vac 250VA 47-440Hz;
                        12-36Vdc solar 20A. Charge times 24Vdc 7-10
                        hrs, 12Vdc 11-16 hrs, AC 11-16 hrs, solar 7-10
                        hrs. Operating temperature -20°C to +50°C;
                        storage -40°C to +70°C. Heavy duty aluminum,
                        tan.
