content:                |
                        IEC 62133 is an international standard for the
                        safety of rechargeable lithium ion batteries,
                        covering electrical, mechanical, and chemical
                        safety, and addressing overcharging,
                        over-discharging, short-circuiting, and
                        thermal runaway. It applies to portable,
                        sealed secondary cells and batteries made from
                        them; IEC 62133-2 1st Edition expanded the
                        scope to coin cells if internal AC impedance
                        is below 3.0 Ohm. Tests are electrical
                        (overcharge, external short circuit),
                        mechanical (crush, vibration and shock) and
                        environmental or thermal (thermal abuse). IEC
                        62133 is one of the most important standards
                        for exporting lithium ion batteries into
                        global markets. Intertek holds Certification
                        Body Testing Laboratory (CBTL) status for
                        Category BATT.
