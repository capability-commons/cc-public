content:                |
                        COMBATT 6T Li-Ion vehicle batteries for the
                        longest silent watch missions, for modern
                        combat vehicles requiring extensive continuous
                        electric power for manned and unmanned
                        turrets, missile launchers, radars and active
                        protection systems. Variants: ELP-02426-M,
                        LFP, 2,560 Wh, 100 Ah, MIL-PRF-32565C;
                        ELI-52526-DM, Li-Ion NCA, 3,630 Wh, 144 Ah,
                        MIL-PRF-32565C Type 2; ELI-52526-C, Li-Ion
                        NCA, 4,200 Wh, 166 Ah, robotics and storage
                        applications; ELP-02426, LFP, 2,560 Wh, 100
                        Ah. Compliant with the US Army MIL-PRF-32565C
                        safety and performance requirements; tested
                        and selected by military users on five
                        continents. Brochure dated January 2025.
