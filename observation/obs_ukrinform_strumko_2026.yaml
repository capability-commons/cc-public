content:                |
                        Ukraine develops frontline power modules
                        designed for extreme conditions, manufacturer
                        STRUMKO ENERGY, director Illia Liudvik. The
                        STRUMKO system is modular, with battery,
                        inverter and charging modules, operating down
                        to -20°C; a special module allows voltage
                        conversion and simultaneously charges 6 to 8
                        UAV batteries depending on the configuration,
                        and a full charge is enough to power 15 to 30
                        drone battery packs. The STRUMKO XXL mobile
                        backup station has a capacity of 16 kWh and
                        inverter power of 5 kW, designed to power
                        command posts, electronic warfare systems,
                        Starlink terminals and other equipment for 6
                        to 8 hours. IP65 dust and water protection;
                        withstands drops from height or even being run
                        over by a vehicle. The absence of an internal
                        combustion engine means zero thermal signature
                        and absolute silence, invisible to enemy
                        thermal imaging and acoustic reconnaissance
                        systems. STRUMKO systems have been used by
                        various units on the battlefield for over a
                        year.
