content:                |
                        BB-2590/U, 251 Wh. 7.5 Ah, Rechargeable
                        Lithium-Ion Battery. Nominal voltage 14.4V,
                        28.8V. Capacity 7.5 Ah in 24V mode, 15 Ah in
                        12V mode. Energy 251 Wh. Weight 3.1 lbs.
                        Dimensions 4.4 x 2.4 x 5 in. Operating
                        temperature -20°C to +60°C; storage -40°C to
                        +40°C. Certified by US Army to
                        MIL-PRF-32052/1. Complies with SMBus v1.1 and
                        SBData v1.1. UN/DOT 38.3 rating 225 Wh. CE
                        compliant. Typically used in over 71 different
                        devices such as communications gear (SINCGARS,
                        AN/PRC-117, etc.), robots, and jammers.
