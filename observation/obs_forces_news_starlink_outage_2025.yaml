content:                |
                        Starlink outage cuts off Ukrainian frontline
                        drone units during overnight global
                        disruption. The disruption lasted around
                        two-and-a-half hours overnight from Thursday
                        into Friday, caused by an internal software
                        failure affecting tens of thousands of users
                        worldwide. Robert Brovdi, commander of
                        Ukraine's drone forces, wrote that Starlink is
                        down across the entire front, and reported
                        that combat missions continued during the
                        outage, but drone strikes were carried out
                        without video feed, and battlefield
                        reconnaissance had to adapt accordingly.
                        Oleksandr Dmitriev, founder of OCHI: if
                        connection to the internet is lost, the
                        ability to conduct combat operations is
                        practically gone; he advocated local
                        communication systems. Ukrainian forces have
                        relied heavily on thousands of Starlink
                        terminals for secure communications and drone
                        operations since the early months of Russia's
                        full-scale invasion in 2022.
