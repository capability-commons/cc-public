content:                |
                        SOLOPACK II. Next-generation li-ion
                        rechargeable battery with more power in the
                        familiar SoloPack form factor. 140 Wh. Weight
                        1.65 lbs (750 g). Dimensions 1.6 x 3.1 x 7.4
                        in. Nominal capacity 9.6 Ah; voltage range
                        11.0 to 16.8 VDC; max discharge 7.5 A
                        continuous; cycles greater than 1000.
                        Communication SMBus v1.1; connector Amphenol
                        (NW Comp). Designed to support operational
                        power needs on missions of up to 24 hours.
                        State-of-charge display; compact form factor.
