capture_method:         manual_transcription
content:                |
                        Army R&D delivers more powerful standardized
                        battery for additional equipment types. The
                        Small Tactical Universal Battery (STUB)
                        delivers eight sizes of batteries to provide
                        tailorable amounts of energy depending on
                        Soldiers' mission needs, and powers
                        Soldier-worn or -carried equipment, such as
                        night-vision goggles, GPS devices and weapon
                        sights. Standardized batteries help streamline
                        research and development, reduce costs by
                        leveraging existing battery platforms and
                        ensure backward compatibility; the Army
                        adheres to standards like MIL-STD-3078 for
                        interoperability across Army equipment.
