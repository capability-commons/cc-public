content:                |
                        Third night without grid power at our
                        position. The generator ran dry yesterday and
                        the fuel run cannot get through while the road
                        is under fire. By evening the terminal is down
                        and the drone batteries are flat. We need
                        power for the terminal and the chargers that
                        lasts days without a fuel run.
