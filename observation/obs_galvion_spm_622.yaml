content:                |
                        Nerv Centr Squad Power Manager (SPM-622).
                        Built around a suite of intelligent power
                        management algorithms, the Squad Power Manager
                        can power equipment and recharge batteries
                        simultaneously, scavenging from any available
                        source, anywhere in the world, and
                        automatically converting that power to
                        reliably run critical equipment and devices.
                        Manages up to five battery charges
                        simultaneously without reconfiguration; powers
                        over 200 types of electronic devices;
                        compatible with standard military batteries
                        (BB-2557, BB-2590, BB-2600, BB-2800, CWB,
                        CSEL, 12V/24V vehicle batteries). Dimensions
                        4.4 x 3.2 x 1.35 in; weight 1.0 lb. Operating
                        temperature -30 to 70°C; can operate when
                        fully submerged in more than a meter of water.
                        Meets MIL-STD-810G and MIL-STD-461F; RoHS
                        compliant; CE certified; NSN 6130-01-626-9656.
                        Price not listed.
