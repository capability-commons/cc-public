content:                |
                        MIL-STD-461G is the military test standard
                        that establishes requirements for the
                        electromagnetic compatibility (EMC) of devices
                        and systems created for and used by the United
                        States Department of Defense (DoD). This
                        version superseded MIL-STD-461F; changes
                        include the removal of CS106 and the addition
                        of CS117 and CS118. The requirement matrix
                        lists applicability across surface ships,
                        submarines, aircraft (Army, Navy, Air Force),
                        space systems, and ground systems (Army, Navy,
                        Air Force). Test procedures fall into four
                        groups: radiated emissions (RE), conducted
                        emissions (CE), radiated susceptibility (RS)
                        and conducted susceptibility (CS); for example
                        RE103, a radiation emissions test procedure
                        specific to antenna spurious and harmonic
                        outputs.
