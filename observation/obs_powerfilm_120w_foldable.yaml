content:                |
                        120W Foldable Solar Panel (F16-7200). The 120W
                        Foldable Solar Panel is designed to charge
                        small to medium electronic devices using DC
                        power or one of many available accessories.
                        Rated power 120W; operating voltage 15.4V;
                        current 7.2A. Folded 14.5 x 14.0 x 3.0 in
                        (368.3 x 355.6 x 76.2 mm); unfolded 86.5 x
                        55.0 in (2,197.1 x 1,397.0 mm). Weight 6.3 lb
                        / 2.9 kg. Durable: marine-grade connectors,
                        weather-resistant fabric, military tested. No
                        price shown.
