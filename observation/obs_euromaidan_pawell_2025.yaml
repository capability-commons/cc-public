attribution:            Igor Kossov, Euromaidan Press
observed_at:            '2026-09-06T16:29:27Z'
capture_method:         manual_transcription
content:                |
                        Wow, send us another: the battery tech
                        Ukrainian troops are raving about. Pawell
                        Power, a Ukrainian drone battery manufacturer,
                        makes Vampir batteries combining solid-state
                        power cells with lithium-ion batteries in
                        3D-printed polymer casings, with a 77 percent
                        efficiency gain without adding weight. Drones
                        previously managing 3 to 5 km now reliably
                        achieve 15 to 30 km; current record 38 km,
                        target 60 km. Supplies cover over 80 percent
                        of Zaporizhzhia Front needs. Founder Pavlo
                        Esyp: the guys drop feedback and say wow,
                        cool, send us another. Range also depends on
                        control system reliability, electronic
                        countermeasures, terrain and geography.
                        Specific unit numbers not disclosed.
