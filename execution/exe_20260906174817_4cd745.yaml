    id_self:            bnd_20260906174817_4cd745.challenge_output_concept_2
    guid_self:          bnd_ec390386c2154790b100af358a5cf0e5
    id_node:            node_concept_from_need.challenge
    guid_node:          node_91f5bac73173401590a844735d2f7274
