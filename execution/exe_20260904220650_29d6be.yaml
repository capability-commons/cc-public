        guid_eval:      evl_095873b6012d43069725006433b2fff3
        verdict:        unmet
        reason:         |
                        Unmet on 5 of 5 judgements. Most of the
                        passage specifies the schema’s shape and
                        fields, which is acceptable. But the last two
                        sentences argue for choices by giving reasons
                        (“to ensure…”), which makes it UNMET. Quoted
                        passages that argue: “Additional properties
                        are allowed to ensure extensibility.” “The
                        schema uses allOf to include identity and
                        descriptive traits to ensure consistent
                        identity and metadata.”

      - id_eval:        evl_decision_stated
        guid_eval:      evl_59bc0d987435402bb368cff27332a4f4
        verdict:        unmet
        reason:         |
                        Unmet on 5 of 5 judgements. Multiple sentences
                        report on what “the schema” does, using it as
                        the subject and verbs like defines, requires,
                        supports, are captured, are allowed, uses.
                        These are after-the-fact summaries, not acts
                        of deciding. Examples: - “The schema defines a
                        port as a single entry on a component, either
                        input or output, that specifies one type of
                        item it carries.” - “It requires identity
                        fields for the type, including both guid_type
                        and id_type.” - “The schema supports relating
                        ports via decides, linking outputs to the
                        input port whose item they determine.” -
                        “Edges representing evaluations anchored on
                        the port are captured in a relation array.” -
                        “Additional properties are allowed to ensure
                        extensibility.” - “The schema uses allOf to
                        include identity and descriptive traits to
                        ensure consistent identity and metadata.”
                        These sentences would not be written before
                        the artefact exists; they describe what the
                        schema “defines”, “requires”, “supports”,
                        etc., rather than directly stating what is
                        decided.

