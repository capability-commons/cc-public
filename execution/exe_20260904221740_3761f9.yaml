    judgement:

      - id_eval:        evl_prose_matches_structure
        guid_eval:      evl_243e02e2af83439c93c24b394ed89803
        verdict:        met
        criterion:      |
                        MET when nothing the prose says about THIS
                        item is contradicted by the fields shown
                        beside it.

                        UNMET when a passage states something about
                        this item -- what it names, how many things it
                        names, what it does not have -- that the
                        fields present show to be false.

                        Only claims about this item count. A claim
                        about another item, about a type, or about the
                        system in general is out of scope and cannot
                        make this UNMET.

                        When UNMET, quote the passage and name the
                        field that contradicts it.
        reason:         |
                        Nothing in the prose about this item
                        (ddr_draft_080f20) is contradicted by the
                        fields shown beside it. The only structured
                        field present is a single `relation` entry
                        pointing to `sch_port` via `r_decides`, and
                        the prose does not make any claim about how
                        many relations there are, what specific
                        targets are present, or the absence of such
                        relations. All other statements concern the
                        intended schema design and style, which are
                        not contradicted by the provided fields.

      - id_eval:        evl_plain_text
        guid_eval:      evl_2fbf3ae91e6b45f2b1d9753c1ae2b573
        verdict:        met
        criterion:      |
                        MET when every passage is plain prose:
                        sentences and paragraphs, with names written
                        as they are declared.

                        UNMET when any passage carries markup: a
                        heading marker, a bullet or numbered list
                        marker at the start of a line, emphasis marks
                        such as asterisks or underscores around words,
                        backticks or a code fence, a table, or a link
                        written in markdown form.

                        A full stop, a colon, a comma, parentheses or
                        a numeral inside a sentence are punctuation,
                        not markup, and are MET. A name containing an
                        underscore, such as guid_self, is a name and
                        is MET.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the name of its
                        first field. Field names followed by a colon
                        label the passages that follow. Labels are how
                        the subject is presented and are never markup.

                        When UNMET, quote the marked passage.
        reason:         |
                        All passages are plain prose: sentences and
                        paragraphs with names such as id_type and
                        guid_type written as declared. There are no
                        headings, list markers, emphasis marks,
                        backticks, tables, or markdown links.

      - id_eval:        evl_records_the_decision
        guid_eval:      evl_d1c939981d7c44eaa252f4f61d212441
        verdict:        met
        criterion:      |
                        MET when the decision names a choice that
                        could have gone another way, and the
                        alternative names at least one other way it
                        could have gone and why that way was not
                        taken.

                        UNMET when the decision describes the artefact
                        instead: lists its fields, restates its
                        constraints, or paraphrases its structure,
                        with no choice a reader could disagree with.
                        UNMET also when the alternative is absent in
                        substance: none, not applicable, or an option
                        so weak nobody would have taken it.

                        A decision may name the fields it settles; the
                        test is whether it says why those and not
                        others.

                        When UNMET, quote the passage that describes
                        rather than decides.
        reason:         |
                        The subject does more than restate structure:
                        it names specific choices that could have gone
                        another way and explains why the alternatives
                        were not taken. The decision commits to
                        including `decides`, `relation`, allowing
                        additional properties, and using separate
                        identity schemas “to support extensibility”
                        and to “balance[] clarity, expressiveness, and
                        extensibility.” The alternative then
                        explicitly proposes omitting `decides` and
                        `relations`, adding richer typing/constraints
                        into the item type, and enforcing stricter
                        property controls, and rejects these because
                        “these alternatives reduce expressiveness or
                        impede flexibility and extension, conflicting
                        with design objectives.” That is a real set of
                        alternatives and a reasoned rejection, so the
                        criterion is met.

      - id_eval:        evl_decision_decides
        guid_eval:      evl_095873b6012d43069725006433b2fff3
        verdict:        unmet
        criterion:      |
                        MET when the decision states choices and their
                        terms: what is done, what is named, what shape
                        a thing takes, what is refused, and what
                        follows mechanically from a choice.

                        UNMET when a passage argues for a choice: says
                        what it balances, ensures, enables, clarifies
                        or avoids; what would be infeasible,
                        impractical or costly otherwise; what is
                        recommended; or that the choice is right,
                        natural or simple. Argument belongs in the
                        rationale, where a reader expects it.

                        Stating what a thing is, holds, carries or is
                        validated by is the decision specifying its
                        artefact, and is MET however detailed. A
                        reason given as the term of a choice, such as
                        an id being kept short so that it reads, is
                        MET; a paragraph weighing the choice is not.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose.

                        When UNMET, quote the passage that argues.
        reason:         |
                        Unmet on 5 of 5 judgements. The final sentence
                        argues for the choice instead of stating
                        terms. It should be in the rationale. Quote:
                        “This structure balances clarity,
                        expressiveness, and extensibility without
                        overcomplicating the representation or
                        introducing ambiguous or filler text.”

      - id_eval:        evl_decision_stated
        guid_eval:      evl_59bc0d987435402bb368cff27332a4f4
        verdict:        unmet
        criterion:      |
                        MET when the decision is written as the act of
                        deciding: what is done, kept, named, refused
                        or held, said directly. The four field edge is
                        kept. A glossary is a register whose entries
                        are terms. Edges are held in a keyed table.

                        UNMET when the decision is written as a report
                        on the artefact: the artefact is the subject
                        of the sentence and the verb tells what it
                        defines, requires, includes, permits,
                        specifies, provides or establishes, as a
                        reader summarising it would write. The schema
                        defines identity by requiring two fields. The
                        schema explicitly permits additional
                        properties. Such a sentence records nothing:
                        it says what is there, not what was chosen.

                        A sentence naming an artefact as the thing
                        that carries or validates something is stated,
                        not reported: a term register is validated by
                        sch_reg_term. The test is whether the sentence
                        would still make sense if the artefact did not
                        yet exist. A decision is written before its
                        artefact; a report is written after.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose.

                        When UNMET, quote the sentences that report.
        reason:         |
                        Unmet on 5 of 5 judgements. This is written as
                        a report on the artefact. The schema/structure
                        is the subject, and the verbs describe what it
                        defines, includes, represents, allows, etc.,
                        as a reader’s summary would. Reporting
                        sentences include: - "The port schema defines
                        a port as a JSON object with required identity
                        fields id_type and guid_type representing the
                        item type carried by the port." - "An optional
                        boolean optional field marks whether an input
                        port’s item is optional." - "Outputs include a
                        prompt string indicating the action to produce
                        an item." - "The decides field optionally
                        references the id of an input port whose item
                        this port’s produced item determines,
                        supporting execution semantics." - "The
                        relation field captures edges linking to
                        evaluations anchored at the port." - "The
                        schema allows additional unspecified
                        properties to support extensibility." - "This
                        structure balances clarity, expressiveness,
                        and extensibility without overcomplicating the
                        representation or introducing ambiguous or
                        filler text." These all describe what the
                        schema/structure does or includes, rather than
                        stating decisions as acts (what is kept,
                        named, refused, or held). They would not read
                        as decisions written before the artefact
                        exists.

