        guid_eval:      evl_2fbf3ae91e6b45f2b1d9753c1ae2b573
        verdict:        met
        criterion:      |
                        MET when every passage is plain prose:
                        sentences and paragraphs, with names written
                        as they are declared.

                        UNMET when any passage carries markup: a
                        heading marker, a bullet or numbered list
                        marker at the start of a line, emphasis marks
                        such as asterisks or underscores around words,
                        backticks or a code fence, a table, or a link
                        written in markdown form.

                        A full stop, a colon, a comma, parentheses or
                        a numeral inside a sentence are punctuation,
                        not markup, and are MET. A name containing an
                        underscore, such as guid_self, is a name and
                        is MET.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the name of its
                        first field. Field names followed by a colon
                        label the passages that follow. Labels are how
                        the subject is presented and are never markup.

                        When UNMET, quote the marked passage.
        reason:         |
                        All content is plain prose: sentences and
                        paragraphs with names written as declared.
                        There are no headings, list markers, emphasis
                        marks, backticks, tables, or markdown links.

      - id_eval:        evl_decision_stated
        guid_eval:      evl_59bc0d987435402bb368cff27332a4f4
        verdict:        unmet
        criterion:      |
                        MET when the decision is written as the act of
                        deciding: what is done, kept, named, refused
                        or held, said directly. The four field edge is
                        kept. A glossary is a register whose entries
                        are terms. Edges are held in a keyed table.

                        UNMET when the decision is written as a report
                        on the artefact: the artefact is the subject
                        of the sentence and the verb tells what it
                        defines, requires, includes, permits,
                        specifies, provides or establishes, as a
                        reader summarising it would write. The schema
                        defines identity by requiring two fields. The
                        schema explicitly permits additional
                        properties. Such a sentence records nothing:
                        it says what is there, not what was chosen.

                        A sentence naming an artefact as the thing
                        that carries or validates something is stated,
                        not reported: a term register is validated by
                        sch_reg_term. The test is whether the sentence
                        would still make sense if the artefact did not
                        yet exist. A decision is written before its
                        artefact; a report is written after.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose.

                        When UNMET, quote the sentences that report.
        reason:         |
                        Unmet on 5 of 5 judgements. The sentences
                        describe needs and conditions, not a decision
                        stated as what is done, kept, named, refused
                        or held. They read as problem statements
                        rather than choices about an artefact’s shape
                        or a register’s terms. There is no reporting
                        on an artefact either, but the criterion for
                        MET requires explicit deciding language (e.g.
                        “X is kept”, “X is an entry”, “X is refused”),
                        which is absent here, so the decision is not
                        written in the required form.

      - id_eval:        evl_decision_decides
        guid_eval:      evl_095873b6012d43069725006433b2fff3
        verdict:        unmet
        criterion:      |
                        MET when the decision states choices and their
                        terms: what is done, what is named, what shape
                        a thing takes, what is refused, and what
                        follows mechanically from a choice.

                        UNMET when a passage argues for a choice: says
                        what it balances, ensures, enables, clarifies
                        or avoids; what would be infeasible,
                        impractical or costly otherwise; what is
                        recommended; or that the choice is right,
                        natural or simple. Argument belongs in the
                        rationale, where a reader expects it.

                        Stating what a thing is, holds, carries or is
                        validated by is the decision specifying its
                        artefact, and is MET however detailed. A
                        reason given as the term of a choice, such as
                        an id being kept short so that it reads, is
                        MET; a paragraph weighing the choice is not.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose.

                        When UNMET, quote the passage that argues.
        reason:         |
                        Unmet on 5 of 5 judgements. The passage argues
                        for the needs by giving purposes introduced
                        with “in order to”. These are rationales, not
                        just terms of the choice. For example: “in
                        order to keep essential capabilities
                        operational under attack”, “in order to ensure
                        continuous use of drones and electronic
                        warfare systems”, and “in order to keep
                        command, reconnaissance, targeting, repair,
                        counter-drone activity, and remote-system use
                        operating.”

      - id_eval:        evl_records_the_decision
        guid_eval:      evl_d1c939981d7c44eaa252f4f61d212441
        verdict:        met
        criterion:      |
                        MET when the decision names a choice that
                        could have gone another way, and the
                        alternative names at least one other way it
                        could have gone and why that way was not
                        taken.

                        UNMET when the decision describes the artefact
                        instead: lists its fields, restates its
                        constraints, or paraphrases its structure,
                        with no choice a reader could disagree with.
                        UNMET also when the alternative is absent in
                        substance: none, not applicable, or an option
                        so weak nobody would have taken it.

                        A decision may name the fields it settles; the
                        test is whether it says why those and not
                        others.

                        When UNMET, quote the passage that describes
                        rather than decides.
        reason:         |
                        The subject names a specific
                        choice—decomposing needs by underlying
                        dependencies (power and communication) for
                        distributed frontline teams—and contrasts it
                        with real alternatives: splitting by
                        functional activity (command vs. targeting) or
                        by system type (drones vs. EW). It also
                        explains why those alternatives were not
                        taken: resilience is driven more by robustness
                        of shared power/communication dependencies
                        than by particular functions or platforms, and
                        partitioning by dependency better aligns with
                        the framing and shared vulnerabilities. This
                        matches the criterion of a decision that could
                        have gone another way, with a substantive
                        alternative and rationale.

