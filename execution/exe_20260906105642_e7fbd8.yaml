    judgement:

      - id_eval:        evl_need_subject_specific
        guid_eval:      evl_843d0edc97534487b504d4e3c813583b
        verdict:        met
        criterion:      |
                        MET when the subject is a concrete group,
                        role, organisation or unit that experiences
                        the need or is accountable for the outcome,
                        specific enough to validate the need with and
                        to engage.

                        UNMET when the subject is a category so broad
                        it names no one, such as users, the military,
                        Europe, stakeholders, everyone, the public;
                        when it lumps parties whose needs differ; or
                        when it names a supplier, product, technology
                        or proposed solution rather than who needs it.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
        reason:         |
                        A concrete group defined by role and
                        situation, specific enough to validate the
                        need with and to engage.

      - id_eval:        evl_need_outcome_solution_free
        guid_eval:      evl_6c1605acb7484a3ebe9680866e827f48
        verdict:        met
        criterion:      |
                        MET when the outcome is an effect, condition
                        or capability, stated so that materially
                        different solutions could satisfy it.

                        UNMET when the outcome names a purchase, a
                        product, a platform, a technology or an
                        architecture as the thing needed, such as buy
                        more radars, deploy Product X, build a mobile
                        application, use artificial intelligence to
                        detect drones. A means named as an externally
                        imposed constraint, and said to be one, is
                        MET.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
        reason:         |
                        This is a condition/capability: having
                        electrical power for terminals and chargers
                        that can operate for several days without fuel
                        delivery. It does not prescribe a specific
                        product, technology, or architecture, and
                        could be satisfied by materially different
                        solutions (e.g., batteries, generators,
                        renewables).

      - id_eval:        evl_need_purpose_is_consequence
        guid_eval:      evl_10f4de8f0dca45fc92eae8566faac2cf
        verdict:        met
        criterion:      |
                        MET when the purpose expresses what follows
                        from achieving the outcome, a harm reduced or
                        an opportunity or objective served, so that
                        someone outside the domain sees why the need
                        matters.

                        UNMET when the purpose repeats the outcome in
                        other words; or when it is a justification
                        that could attach to anything, such as improve
                        capability, support the mission, increase
                        effectiveness, because it is important.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
        reason:         |
                        States the consequence of having multiday
                        off‑grid power: “Their communications and
                        drone operations can continue during periods
                        when fuel cannot be brought in.”

      - id_eval:        evl_need_context_discriminates
        guid_eval:      evl_f7704c28331a4d2b91720f7c7f5153df
        verdict:        met
        criterion:      |
                        MET when the context names conditions, place,
                        phase, threat or constraints under which the
                        need arises or matters, such that changing
                        them would change the need or the candidate
                        responses; or is general where the need is
                        genuinely unrestricted.

                        UNMET when the context is so broad it excludes
                        nothing, such as in wartime, in Europe, during
                        operations, in the field; or when it embeds
                        solution details that are not genuine
                        constraints.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
        reason:         |
                        Specifies frontline position, multi-night grid
                        outage, exhausted generator fuel, and blocked
                        road resupply by incoming fire—concrete
                        conditions and constraints that would change
                        the need or responses if altered.

      - id_eval:        evl_need_evidence_described
        guid_eval:      evl_6cf24cea780e477b8de29950670a5e74
        verdict:        met
        criterion:      |
                        MET when the evidence says who observed or
                        reported what, when, and how it bears on the
                        subject, outcome, purpose and context; or says
                        plainly that evidence is lacking and what
                        would substantiate the need.

                        UNMET when the evidence asserts instead of
                        describing, such as this is widely known, the
                        need is obvious, strong evidence exists, many
                        people say so, it is urgently needed; or when
                        the popularity of a product stands in for
                        evidence of the gap.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
        reason:         |
                        Names a specific observer/report
                        (obs_frontline_power_post), what was observed
                        (three nights without grid power, generator
                        out of fuel, blocked fuel runs, loss of
                        battery power), how it bears on the need
                        (stated need for power lasting days without
                        fuel runs), and explicitly notes what is
                        missing and what corroboration would
                        substantiate the need.

      - id_eval:        evl_plain_text
        guid_eval:      evl_2fbf3ae91e6b45f2b1d9753c1ae2b573
        verdict:        met
        criterion:      |
                        MET when every passage is plain prose:
                        sentences and paragraphs, with names written
                        as they are declared.

                        UNMET when any passage carries markup: a
                        heading marker, a bullet or numbered list
                        marker at the start of a line, emphasis marks
                        such as asterisks or underscores around words,
                        backticks or a code fence, a table, or a link
                        written in markdown form.

                        A full stop, a colon, a comma, parentheses or
                        a numeral inside a sentence are punctuation,
                        not markup, and are MET. A name containing an
                        underscore, such as guid_self, is a name and
                        is MET.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the name of its
                        first field. Field names followed by a colon
                        label the passages that follow. Labels are how
                        the subject is presented and are never markup.

                        When UNMET, quote the marked passage.
        reason:         |
                        Plain prose in sentences and a paragraph, with
                        names written as declared. No headings, list
                        markers, emphasis marks, backticks, tables, or
                        markdown links appear.

