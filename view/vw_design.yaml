description:            |
                        The view for reading a design in the order it
                        was arrived at. It roots on needs because a
                        need is what everything else answers to, and
                        it follows derivation, scenarios and measures
                        outward. Annotations appear wherever they were
                        made, so what has been said about a record
                        sits beside the record and not in a list of
                        its own.
