[project]
authors                 = [{name = "William Payne", email = "wtpayne@gmail.com"}]
name                    = "cc-public"
version                 = "0.1.0"
description             = "Capability commons: a document-oriented engineering system in which every artifact is a checked data item."
readme                  = "README.md"
license                 = "Apache-2.0"
license-files           = ["LICENSE", "NOTICE"]
requires-python         = ">= 3.14"
classifiers             = ["Development Status :: 3 - Alpha",
                           "Intended Audience :: Developers",
                           "Programming Language :: Python :: 3.14",
                           "Topic :: Software Development :: Documentation"]
dependencies            = ["ruamel-yaml>=0.19.1,<0.20",
                           "click>=8.5.0,<9",
                           "defusedxml>=0.7.1,<0.8",
                           "jstyleson>=0.0.2,<0.0.3",
                           "xmltodict>=1.0.4,<2",
                           "jsonschema>=4.26.0,<5",
                           "rich>=15.0.0,<16",
                           "python-dotenv>=1.2.3,<2"]

# The mechanical checks need none of the model stack. A judge does, and
# is installed by asking for the eval extra; the tests by the test extra;
# the layers contract by the lint extra.
#
[project.optional-dependencies]
eval                    = ["dspy==3.3.1"]
render                  = ["jinja2>=3.1,<4", "weasyprint>=69,<70"]
test                    = ["pytest>=9.1.1,<10", "pytest-xdist>=3.8.0,<4",
                           "pytest-timeout>=2.4.0,<3", "diff-cover>=10,<11"]
lint                    = ["import-linter>=2.15,<3", "mypy>=1.18,<2"]

[project.urls]
Repository              = "https://github.com/capability-commons/cc-public"

[project.scripts]
cctool                  = "cc_public.cli.command:main"

[build-system]
build-backend           = "hatchling.build"
requires                = ["hatchling"]

[tool.pixi.workspace]
channels                = ["conda-forge"]
platforms               = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
cc_public               = { path = ".", editable = true, extras = ["eval", "test", "lint"] }

[tool.cctool.new]
copyright               = "Copyright 2026 William Payne"
license                 = "Apache-2.0"
id_mark                 = "mark_public"

# Tasks. check reports and never fails on a finding, which is what an
# agent reading the report wants; gate is what a pipeline wants, and
# fails on a critical finding, an unresolved reference, a lint finding,
# a failing test or coverage below the floor.
#
# The coverage floor is branch aware from 2026-09-09. Two runs on
# f4d1e58 agreed exactly: 7638 statements, 797 missed, 2812 branches,
# 309 partial, 87.12 per cent.
#
# The number beside --cov-fail-under did not move and the gate got much
# tighter. Statement coverage was 89.55 against a floor of 87, which is
# 2.55 points of room. Branch aware coverage is 87.12 against the same
# 87, which is 0.12. Roughly thirteen statements or branch exits of
# regression will now fail it, where before it took two hundred and
# fifty. Read the floor as what it constrains, not as what it says.
#
# The obvious room is cli/report.py at 39 per cent, 173 of 307
# statements unexecuted. That is the code rendering every report a
# person reads, and it is worth testing on its merits rather than for
# the number.
#
# Changed line coverage. The floor above governs the whole package and
# says nothing about whether a change carried its own tests: 0.12 of a
# point of headroom can absorb a small change that tests nothing at all.
# This asks the narrower question, of the lines a change touched.
#
# The comparison branch is a default and not an assumption. Override it
# by appending another --compare-branch, which is what a pipeline does
# with the base of a pull request; the later flag wins.
#
# It reports and does not block. Ninety is a conservative number with no
# observation behind it, so it is watched over real changes before
# anything is made to depend on it.
#
# The test task writes coverage.xml so that nothing has to run a
# nine minute suite twice to answer this.
#
# The gate is what a pipeline runs and is the only aggregate. Its
# depends-on is where the order lives: pixi runs lint and test before the
# command, so the tests refresh the evidence that the closed-world check
# then reads. Naming that order anywhere else would give it a second
# place to drift from.
#
# quick is the loop, gate is the judgement. Leaving coverage out saved
# nothing, so quick leaves out the slow tests instead: those are what the
# suite costs. It is never what CI runs and never a reason to skip gate.
#
# The typed island. files is the island itself, so every flag below
# applies to it and to nothing else, and growing the island is adding a
# path here rather than remembering which overrides govern what.
#
# Measured 2026-09-09: the whole package under check_untyped_defs alone
# reports 63 errors in 31 of 92 files, 36 of them missing annotations on
# empty collections and 10 third-party imports without stubs. That is
# the size of the job if the island is ever widened to everything; it is
# not a reason to widen it today.
#
# `mypy -p cc_public` reads the whole package when someone wants that
# number again. `pixi run type` reads the island and is what gates.
#
[tool.mypy]
python_version           = "3.14"
mypy_path                = "src"

files = ["src/cc_public/question.py",
         "src/cc_public/need.py",
         "src/cc_public/control.py"]

warn_unused_configs      = true
show_column_numbers      = true
check_untyped_defs       = true
disallow_untyped_defs    = true
disallow_incomplete_defs = true
disallow_untyped_calls   = true
disallow_any_generics    = true
warn_return_any          = true
warn_unused_ignores      = true
no_implicit_optional     = true
strict_equality          = true

# What pytest is allowed to assume. strict_config refuses an ini key it
# does not know, strict_markers a marker nobody registered, and
# xfail_strict an expected failure that passed: each of the three is a
# way for a test to stop meaning what it says without anybody noticing.
#
# slow is measured, not felt. The seventeen tests carrying it cost sixty
# seconds or more each on the baseline run, 1501 seconds of the suite's
# cpu between them, and every one of them drives a workflow or a
# subprocess chain. The number will drift; re-read it with
# `pixi run test-durations` rather than trusting this comment.
#
[tool.pytest.ini_options]
minversion              = "9.1"
testpaths               = ["test"]
strict_config           = true
strict_markers          = true
xfail_strict            = true

# A hang, not a budget. The slowest test measured 175 s, so 600 gives it
# more than three times its room while still catching a run that will
# never end long before it doubles the suite. Raising this because a test
# grew is the wrong move: mark that test and say why.
#
timeout                 = 600

markers = [
  "slow: drives a workflow or a subprocess chain and costs a minute or more; excluded from `pixi run quick` and never from `gate`",
]

[tool.pixi.tasks]
check                   = "cctool check"
check-closed-world      = "cctool check --closed-world --fail-on-nonconformity"
format                  = "cctool format"
format-items            = "cctool format"
test                    = "pytest -q -n auto test --cov=cc_public --cov-branch --cov-report=xml --cov-fail-under=87"
test-durations          = "pytest -q -n auto test --cov=cc_public --cov-branch --cov-report= --cov-fail-under=87 --durations=25"
coverage                = "pytest -q -n auto test --cov=cc_public --cov-report=term-missing"
code-coverage-branch    = "pytest -q -n auto test --cov=cc_public --cov-branch --cov-report=term-missing"
code-coverage-diff      = "diff-cover coverage.xml --compare-branch=origin/main --fail-under=90"
lint                    = "ruff check src test && lint-imports"
type                    = "mypy"
quick                   = { cmd = "pytest -q -n auto test -m 'not slow'", depends-on = ["lint"] }
gate                    = { cmd = "cctool check --closed-world --fail-on-nonconformity", depends-on = ["lint", "type", "test"] }

[tool.pixi.dependencies]
ruff                    = ">=0.16.6,<0.17"
pytest-cov              = ">=7.1.0,<8"
weasyprint = ">=69.0,<70"
graphviz = ">=14.1.2,<15"
jinja2 = ">=3.1.6,<4"

# Lint. The house style aligns values in columns and formats strings
# with format rather than f-strings, so the rules that would fight it
# are off. Complexity and size thresholds are the maxima as measured on
# 2026-09-05 once the executor and the edit commands were decomposed, a
# baseline to ratchet down, not a target. The coverage floor in the
# test task is the coverage as measured the same day, a baseline to
# ratchet up.
#
[tool.ruff]
line-length             = 100
target-version          = "py314"
extend-exclude          = ["execution", ".pixi"]

[tool.ruff.lint]
select                  = ["E", "W", "F", "B", "C90", "N", "PL", "UP", "SIM", "RET",
                           "ARG", "S", "DTZ", "PIE", "FURB",
                           "SLF"]     # an underscore name is its module's (ddr_layered_architecture)
ignore                  = ["UP032",   # format() is the house form
                           "PLC0415", # a lazy import keeps an optional dependency optional
                           "PLR2004", # a literal beside its comparison reads
                           "N818",    # exceptions are named Error<Thing>
                           "ARG002",  # a protocol method takes what the protocol says
                           "S603",
                           "S607"]    # subprocess runs git, by name, on purpose

[tool.ruff.lint.mccabe]
max-complexity          = 11

[tool.ruff.lint.pylint]
max-args                = 9
max-positional-args     = 9
max-branches            = 10
max-statements          = 40

# Layers. The tool is seven tiers importing downward only, with the
# committer and the judgement package as independent siblings, and the
# foundations independent of one another (ddr_layered_architecture).
# lint-imports refuses an upward import; the lint task runs it.
#
[tool.importlinter]
root_package            = "cc_public"

[[tool.importlinter.contracts]]
name                    = "seven tiers, importing downward only"
type                    = "layers"
layers                  = ["cc_public.cli",
                           "cc_public.workflow",
                           "cc_public.adapter",
                           "cc_public.commit | cc_public.eval | cc_public.evidence | cc_public.render",
                           "cc_public.edit",
                           "cc_public.check",
                           "cc_public.layout",
                           "cc_public.query",
                           "cc_public.nonconformity",
                           "cc_public.testing",
                           "cc_public.load | cc_public.path | cc_public.need | cc_public.requirement | cc_public.decision | cc_public.question | cc_public.control | cc_public.trace | cc_public.facts",
                           "cc_public.item"]

[tool.ruff.lint.per-file-ignores]
"test/*"                = ["S101", "E501", "PLR0913", "PLR0917", "PLR0915", "ARG001",
                           "SLF001"]  # a test may be long, and reach the internals of what it tests
"src/cc_public/cli/*.py" = ["PLR0913", "PLR0917"]   # a click command takes one argument per option

# The demonstration's temporary user interface: a Streamlit app beside the
# captures in ../demo, outside the tree. Its own environment, so that the
# kernel's environment carries nothing for it.
#
[tool.pixi.feature.demo.pypi-dependencies]
streamlit               = ">=1.40"

[tool.pixi.feature.demo.tasks]
ui                      = "streamlit run ../demo/ui/app.py --server.headless true --server.port 8501"

[tool.pixi.environments]
demo                    = { features = ["demo"], solve-group = "default" }
