#
# title:                  cc-public pyproject.toml
# brief:                  |
#                         Project configuration for cc-public: the pixi
#                         environment, its tasks, and the settings of
#                         the linter and the test runner.
# description:            |
#                         pixi install builds the environment, and
#                         installs cc-public into it in editable mode:
#                         the package cctool, with cctool as its command
#                         line entry point. pixi run check runs the
#                         checker over the repository, pixi run test
#                         runs the tests, and pixi run lint runs the
#                         linter. pixi run hooks points git at the hooks
#                         in .githooks, so that pixi run gate and the
#                         commit message check run before each commit.
#                         pixi run browsers fetches the Chromium that
#                         the browser tests of the review pages drive;
#                         they are slow, so only pixi run test and pixi
#                         run slow run them. The environment tool holds
#                         what cctool needs to run and nothing used only
#                         to develop it, so its part of pixi.lock is the
#                         lock a release publishes for the tool. The
#                         wheel holds the package and, under
#                         cctool/_data, the data items of the tree.
# edge:                   []
#
# ...

[project]
authors                 = [{name = "William Payne", email = "wtpayne@gmail.com"}]
name                    = "cc-public"
dynamic                 = ["version"]
description             = "Capability Commons: an engineering system built on one graph of data items, checked before each commit."
license                 = "Apache-2.0"
requires-python         = ">= 3.12"
dependencies            = ["click>=8.2,<9",
                           "clingo>=5.8,<6",
                           "htpy>=25.10,<27",
                           "jsonschema>=4.23,<5",
                           "pyoxigraph>=0.5.12,<0.6",
                           "referencing>=0.36,<1",
                           "ruamel.yaml>=0.19.1,<0.20"]

[project.scripts]
cctool                  = "cctool.cli.command:main"

# The build hook reads the tree with the extractor of cctool, to find
# the items that the wheel leaves behind, so a build needs what the
# extractor imports.
#
[build-system]
build-backend           = "hatchling.build"
requires                = ["hatchling", "click>=8.2,<9", "ruamel.yaml>=0.19.1,<0.20"]

# The package that the wheel holds. Its name differs from that of the
# project, so hatchling cannot find it by itself.
#
# The version is read from the version module, which the release step
# writes, so that a release edits no line of this file and needs no
# relock.
#
[tool.hatch.version]
path                    = "src/cctool/version.py"

[tool.hatch.build.targets.wheel]
packages                = ["src/cctool"]
exclude                 = ["src/cctool/**/_test", "src/cctool/conftest.py",
                           "src/cctool/release/hook.py"]

# The build hook adds a shadow of each item that the wheel leaves behind
# but a shipped item names, as ruling_what_data_a_release_ships says.
#
[tool.hatch.build.targets.wheel.hooks.custom]
path                    = "src/cctool/release/hook.py"

# The wheel carries the data items of the tree, under cctool/_data, so
# that a release of the tool also carries the graph it was released
# with. This is provisional: if the graph comes to be served, such as
# by an API, it may stay out of the wheel. The check of a peer reads it
# from the installed package as the tree that the peer consumes.
#
[tool.hatch.build.targets.wheel.force-include]
"_data"                 = "cctool/_data"

[tool.pixi.workspace]
channels                = ["conda-forge"]
platforms               = ["osx-arm64", "osx-64", "linux-64"]

# What only development needs: the test runner, the linter, the
# browser driver, and the build backend that the wheel tests call. The
# environment tool leaves these out.
#
[tool.pixi.pypi-dependencies]
hatchling               = ">=1.32,<2"
playwright              = ">=1.48,<2"

[tool.pixi.dependencies]
pytest                  = ">=9.1.1,<10"
pytest-xdist            = ">=3.8,<4"
ruff                    = ">=0.16.6,<0.17"

[tool.pixi.tasks]
check                   = "cctool check"
test                    = "pytest -n auto --dist worksteal"
lint                    = "ruff check src"
gate                    = "cctool gate"
hooks                   = "git config core.hooksPath .githooks"
browsers                = "playwright install chromium"

# The slow run: the tests on every Python that requires-python admits,
# each in an environment of its own. It is too slow for the gate, so it
# is run on its own, such as overnight: pixi run slow.
#
slow                    = { depends-on = [{ task = "test", environment = "py312" },
                                          { task = "test", environment = "py313" },
                                          { task = "test", environment = "py314" }] }

# What cctool needs to run: python, clingo, the jq program that cctool
# query jq runs, and cc-public itself, which brings the libraries that
# its project dependencies name. jq is a program, not a python
# package, so the project dependencies cannot name it; an install
# with pip alone learns that it is needed when cctool query jq says
# there is no jq to run.
#
[tool.pixi.feature.tool.pypi-dependencies]
cc_public               = { path = ".", editable = true }

[tool.pixi.feature.tool.dependencies]
clingo                  = ">=5.8.2,<6"
jq                      = ">=1.7.1,<2"
python                  = ">=3.12"

[tool.pixi.feature.py312.dependencies]
python                  = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python                  = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python                  = "3.14.*"

# The default environment is the one to develop in: the tool and what
# only development needs. The environment tool is the runtime alone,
# the lock a release publishes. The two are solved together, so that
# the tool runs the very versions that the tests of the default
# environment pass with.
#
[tool.pixi.environments]
default                 = { features = ["tool"], solve-group = "default" }
tool                    = { features = ["tool"], solve-group = "default", no-default-feature = true }
py312                   = ["py312", "tool"]
py313                   = ["py313", "tool"]
py314                   = ["py314", "tool"]

# What pytest is allowed to assume. strict_config refuses an ini key it
# does not know, strict_markers a marker nobody registered, and
# xfail_strict an expected failure that passed. A test marked slow
# grows with the data or repeats a stage of the gate, so the gate leaves
# it out; pixi run test and pixi run slow run it. A test marked prepush
# tests the commit and history machinery, so the pre-commit gate leaves
# it out and the pre-push gate runs it. A test marked reads_data reads
# the data of the repository or a copy of it, so the pre-commit gate
# runs it when data is staged with no code; a test that copies the
# repository is marked so when it is collected.
#
[tool.pytest.ini_options]
minversion              = "9.1"
testpaths               = ["src"]
pythonpath              = ["src"]
addopts                 = "-q"
strict_config           = true
strict_markers          = true
xfail_strict            = true
markers                 = ["slow: left out by the gate; it grows with the data or repeats a stage",
                           "prepush: left out of the pre-commit gate, which the pre-push gate is not; it tests the commit and history machinery",
                           "reads_data: run by the pre-commit gate when data is staged with no code; it reads the data of the repository or a copy of it"]

# Lint. The house style aligns values in columns and formats strings
# with format rather than f-strings, so the rules that would fight it
# are off. The complexity and size thresholds are those of the legacy
# tool.
#
[tool.ruff]
line-length             = 100
target-version          = "py312"

[tool.ruff.lint]
select                  = ["E", "W", "F", "B", "C90", "N", "PL", "UP", "SIM", "RET",
                           "ARG", "S", "DTZ", "PIE", "FURB",
                           "SLF",     # an underscore name is its module's
                           "RUF100",  # a suppression that suppresses nothing
                           "PTH119"]  # basename(str(p)) is a roundabout p.name
ignore                  = ["UP032",   # format() is the house form
                           "PLC0415", # a lazy import keeps an optional dependency optional
                           "PLR2004", # a literal beside its comparison reads
                           "N818",    # exceptions are named Error<Thing>
                           "S603",    # subprocess runs git, by name, on purpose
                           "S607"]

[tool.ruff.lint.mccabe]
max-complexity          = 11

[tool.ruff.lint.pylint]
max-args                = 9
max-positional-args     = 9
max-branches            = 10
max-statements          = 40

[tool.ruff.lint.per-file-ignores]
"src/**/_test/*.py"     = ["S101", "E501", "PLR0913", "PLR0917", "ARG001",
                           "SLF001"]  # a test may be long, and reach the internals of what it tests
"src/**/conftest.py"    = ["ARG001"]  # a fixture may take another only to depend on it
