title:                  Misspelled-relation warning now an error
brief:                  |
                        Commit 627e2b5 "Fix datalog.run so that clingo
                        warnings and no answer set are errors" drops
                        --warn=none and treats every clingo message as
                        an error, and 2b74bfe "Add a test of
                        supersession_across_issues" gives that check a
                        test. At 360ec14 a misspelled relation stops
                        the run instead of passing.
description:            |
                        run() collects every message clingo logs and
                        raises ErrorDatalog if there is any, so "atom
                        does not occur in any rule head" now stops the
                        check; each input relation is declared defined
                        so that an empty one gives no message
                        (src/cctool/graph/datalog.py lines 296-314 at
                        360ec14). The test of that check, now named
                        supersession_across_types, is
                        src/cctool/check/_test/test_check.py within
                        test_an_argument_across_two_decisions_is_reported.
                        A relation still needs no declaration in the
                        clingo path, so the difference from Souffle is
                        now when the misspelling is found, not
                        whether.

