title:                  Fixed cost paid on every evaluation
brief:                  |
                        Every evaluation writes all facts and the
                        whole program to a new directory and starts
                        the Souffle interpreter, each edit evaluates
                        twice, and 132 of 151 test functions need it.
                        How much of the gate this costs has not been
                        measured.

