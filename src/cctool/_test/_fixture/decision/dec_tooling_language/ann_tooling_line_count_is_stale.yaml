title:                  Python tooling now about 19,000 lines
brief:                  |
                        The annotation says a port would rewrite about
                        5,300 lines of tooling and 2,200 lines of
                        tests. Now the Python under src is about
                        19,000 lines outside the tests and 6,900 in
                        them.
description:            |
                        wc -l over the .py files under src gives
                        19,027 lines outside the _test folders and
                        conftest.py, and 6,925 lines in the _test
                        folders (2026-10-23). The logic programs in
                        src/cc_public (six .lp files, 4,991 lines) are
                        not counted. Found in the review of
                        2026-10-22.

