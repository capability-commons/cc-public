title:                  Present tests that cannot vouch for a port
brief:                  |
                        Most tests call Python functions directly, not
                        cctool, and the rules call string functions
                        that follow Python semantics. A Rust port has
                        no evidence that it gives the same results
                        until new checks are written against it.
description:            |
                        472 test functions in 23 files (count of def
                        test_ under src/**/_test/, 2026-10-23).
                        test_check.py (149), test_edit.py (63) and
                        test_graph.py (27) hold 239 of them and import
                        cc_public modules rather than drive cctool.
                        The rest run in the same Python process too,
                        through click.testing or by calling modules.
                        The programs they start are git, small Python
                        stages in test_gate.py and Chromium in
                        test_browser.py, so no present test runs
                        cctool as a separate program. The rules call
                        @match, @strlen, @substr, @prefix and @cat
                        (src/cctool/graph/logic.py lines 120-172; for
                        example check.lp lines 106, 147, 321 and 740,
                        change.lp lines 81-87). @match uses
                        re.fullmatch, @strlen and @substr count code
                        points, while Rust str::len counts bytes and
                        the Rust regex crate has no lookaround or
                        backreferences. The regexes the rules use
                        today have no lookaround or backreference and
                        the strings measured are ASCII ids and guids,
                        so no present result is known to differ; the
                        point is the missing evidence. ASSUMPTION:
                        tests rewritten to run cctool as a separate
                        program could serve both languages.

