title:                  Small, license-clean dependency set
brief:                  |
                        The tooling takes seven runtime libraries,
                        click, clingo, htpy, jsonschema, pyoxigraph,
                        referencing and ruamel.yaml, and five
                        development tools, jq, pytest, pytest-xdist,
                        ruff and playwright, all under permissive
                        licenses that Apache-2.0 can carry and all
                        pinned by pixi.

