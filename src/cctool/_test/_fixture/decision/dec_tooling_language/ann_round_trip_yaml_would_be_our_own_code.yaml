title:                  Round-trip YAML as our own code
brief:                  |
                        The tooling reads and writes YAML round-trip
                        through ruamel.yaml, keeping comments and
                        layout. The Rust crates that attempt this are
                        all at version 0.x, so a port would rely on
                        young code or keep its own.
description:            |
                        serde_yaml, once the usual Rust YAML library,
                        was deprecated by its author in 2024 and never
                        kept comments. yaml-edit, yaml-rt and noyalib
                        keep comments and layout, and all were at
                        version 0.x on 2026-10-14.

