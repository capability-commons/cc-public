title:                  The decisions that decide the most
brief:                  |
                        Each decision with the count of items it
                        decides, most first.
sql:                    |
                        SELECT s.id_self AS decision, COUNT(*) AS
                        decided FROM edge e JOIN item s ON s.guid =
                        e.guid_source WHERE e.id_relation =
                        'r_decides' GROUP BY s.id_self ORDER BY
                        decided DESC, decision
meaning:                |
                        One decision and how many items it decides; a
                        decision near the top settles much and is read
                        first.
