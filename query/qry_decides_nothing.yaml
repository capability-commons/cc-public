title:                  Decisions that decide nothing
brief:                  |
                        Each design decision holding no r_decides
                        edge.
sql:                    |
                        SELECT i.id_self AS decision
                          FROM item i
                         WHERE i.prefix = 'ddr'
                           AND i.guid NOT IN (SELECT guid_source FROM edge
                                               WHERE id_relation = 'r_decides')
                         ORDER BY i.id_self
meaning:                |
                        One decision that names what it decides in
                        prose alone, or that argues for a policy
                        nothing in the tree carries. qry_undecided
                        sees the same gap from the other end, the
                        items no decision decides.
