title:                  Which gate tools are shown to fail
brief:                  |
                        One row per gate tool, with the number of
                        things demonstrating that a defect it is meant
                        to catch makes it fail.
sql:                    |
                        SELECT i.id_self AS gate_tool,
                               COUNT(e.guid_target) AS shown_to_fail
                          FROM item i
                          LEFT JOIN edge e
                            ON e.guid_source = i.guid
                           AND e.id_relation = 'r_is_controlled_by'
                         WHERE i.prefix = 'gt'
                         GROUP BY i.id_self
                         ORDER BY shown_to_fail DESC, i.id_self
meaning:                |
                        A zero says the tool is believed on the
                        strength of having run. That is not nothing,
                        but it is not what a green run is usually
                        taken to mean, and the difference is what this
                        register exists to hold.
