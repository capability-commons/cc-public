title:                  Items no decision decides
brief:                  |
                        Each schema, type and relation that no
                        decision decides.
sql:                    |
                        SELECT id_self FROM item WHERE prefix IN
                        ('sch', 't', 'r') AND guid NOT IN (SELECT
                        guid_target FROM edge WHERE id_relation =
                        'r_decides') ORDER BY id_self
meaning:                |
                        One item whose shape or meaning nothing
                        recorded decides; its reasoning, if any, is in
                        prose or in nobody's head.
