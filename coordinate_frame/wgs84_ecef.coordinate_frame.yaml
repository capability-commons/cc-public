title:                        WGS 84 ECEF Cartesian
brief:                        Earth-centred, Earth-fixed Cartesian metres on the WGS 84 ellipsoid.
description:                  |
                              Geocentric Cartesian frame aligned with WGS 84.
                              Origin at the Earth centre of mass (WGS 84
                              conventional). Companion geodetic frame:
                              wgs84_geodetic.

relation:                     []

workflow:                     {}

kind:                         cartesian
dimension:                    3
unit:                         metre

origin:
  policy:                     earth_fixed
  statement:                  |
                              Earth centre as defined by WGS 84 / ECEF
                              (EPSG:4978).

axis:
  - id_axis:                  x
    label:                    X
    sense:                    |
                              Through the equator at latitude 0°, longitude
                              0° (Greenwich).
  - id_axis:                  y
    label:                    Y
    sense:                    |
                              Through the equator at latitude 0°, longitude
                              90° E.
  - id_axis:                  z
    label:                    Z
    sense:                    |
                              Along the conventional Earth rotation axis,
                              positive toward the north pole.

handedness:                   right

status:                       draft

statement:                    |
                              WGS 84 Earth-centred Earth-fixed Cartesian
                              frame in metres for absolute 3D positions and
                              transforms to local NED frames.
