id_schema:                    coordinate_frame
ver_schema:                   0.1.0

guid_item:                    8e88b9f6-338b-4cc3-9621-eb9a9472f3fa
id_item:                      wgs84_geodetic

protective_mark:              public
copyright:                    Copyright holders of the axair-geoengine project
license:                      License-Ref-TBD

title:                        WGS 84 geodetic
brief:                        Ellipsoidal latitude, longitude, and height above the WGS 84 ellipsoid.
description:                  |
                              Earth-fixed geodetic coordinates on the World
                              Geodetic System 1984 ellipsoid. Use for absolute
                              geographic positions. Companion Cartesian frame:
                              wgs84_ecef.

relation:                     []

workflow:                     {}

kind:                         geodetic
dimension:                    3
unit:                         mixed

origin:
  policy:                     earth_fixed
  statement:                  |
                              Geodetic coordinates are referred to the WGS 84
                              reference ellipsoid (NIMA TR8350.2 / EPSG:4326
                              geographic 3D when height is ellipsoidal).

axis:
  - id_axis:                  latitude
    label:                    Latitude
    sense:                    |
                              Geodetic latitude; positive north of the
                              equator.
    unit:                     degree
  - id_axis:                  longitude
    label:                    Longitude
    sense:                    |
                              Geodetic longitude; positive east of the
                              Greenwich meridian.
    unit:                     degree
  - id_axis:                  height
    label:                    Ellipsoidal height
    sense:                    |
                              Height above the WGS 84 ellipsoid; positive
                              outward along the ellipsoid normal.
    unit:                     metre

handedness:                   not_applicable

status:                       draft

statement:                    |
                              WGS 84 geodetic frame (latitude, longitude,
                              ellipsoidal height) for absolute geographic
                              positions in sensor-simulation and fusion work.
