id_schema:                    coordinate_frame
ver_schema:                   0.1.0

guid_item:                    e69fe7b0-69c9-405c-b980-a1f7ea4506c7
id_item:                      target_ned

protective_mark:              public
copyright:                    Copyright holders of the axair-geoengine project
license:                      License-Ref-TBD

title:                        Target-centric NED
brief:                        North-East-Down metres with origin at the target-of-interest centre of mass.
description:                  |
                              Target-centred, world-aligned frame for tracking
                              and multi-sensor association. Origin at the
                              geometric centre of mass of the nominated
                              target-of-interest. Axes are local NED at that
                              origin (do not rotate with target body attitude).
                              Which object is the target-of-interest is a
                              runtime choice (per track / hypothesis).

relation:                     []

workflow:                     {}

kind:                         cartesian
dimension:                    3
unit:                         metre

origin:
  policy:                     target_instance
  statement:                  |
                              Centre of mass of the nominated
                              target-of-interest at the sample time
                              (same CoM convention as capture metadata).

axis:
  - id_axis:                  north
    label:                    North
    sense:                    Local geodetic north at the target CoM.
  - id_axis:                  east
    label:                    East
    sense:                    Local geodetic east at the target CoM.
  - id_axis:                  down
    label:                    Down
    sense:                    Local vertical positive down at the target CoM.

handedness:                   right

status:                       draft

statement:                    |
                              Per-target NED frame at the target CoM for
                              tracking and fusion quantities that should stay
                              world-aligned rather than body- or LOS-aligned.
