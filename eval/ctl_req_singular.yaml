    note:               |
                        Follows rule_r28_multiple_conditions, from the
                        register.
    relation:           []

  c2ce096aa:
    id_self:            case_req_singular.c2ce096aa
    guid_self:          case_ccae3283092d4ac78800a5fc7246ac4a
    verdict:            met
    subject:            |
                        --- x statement: The Audit_Clerk shall be able
                        to change the status of the action item when:
                        the Audit_Clerk originated the item; the
                        Audit_Clerk is the actionee; and the
                        Audit_Clerk is the reviewer.
    origin:             written
    note:               |
                        Guide example under R28, held unmet at first.
                        The list ends with and, which says that all
                        three conditions must hold, so on this
                        criterion the propositional nature is stated;
                        the judge held it met four times in five. What
                        is wrong with the statement is be able to and
                        its subject, which evl_req_concise and
                        evl_req_entity_shall judge.
    relation:           []

