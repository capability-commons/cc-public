title:                  Record and code agree
brief:                  |
                        A design decision and the code it decides do
                        the same thing.
note:                   |
                        Anchored on r_decides, and reaches a pair only
                        where the decided item is a class or function:
                        the judge is shown the decision and the source
                        of the definition, which ddr_source_item made
                        an item and the renderer projects when an eval
                        names source in its scope. Modules and
                        packages are left out for now, since a
                        module's source runs to seventeen thousand
                        characters and a claim about a module is met
                        by its functions.

                        Before it was anchored, three record and code
                        pairs given a decision the code plainly
                        contradicted went undetected, because the
                        judge saw prose about the code and never the
                        code.
criterion:              |
                        You are given a design decision and the source
                        of one code item it decides.

                        MET when the code embodies the decision the
                        record states.

                        UNMET when the two disagree: the code does
                        something the record rules out, or the record
                        states something the code does not do.

                        Silence is not disagreement. A record settles
                        one matter and is entitled to say nothing
                        about the rest of the code.

                        When UNMET, say which of the two appears to
                        have moved.

subject:

  include_type:
    - t_ddr
    - t_python_class
    - t_python_function

severity:               advisory

example:

  - input:              |
                        RECORD ddr_loader_design, decision: "One
                        module per format, each exposing the same
                        entry point: from_bytes(data, encoding)." CODE
                        pym_cc_public.load.yaml: "def from_bytes(data,
                        encoding = None): ..."
    verdict:            met
    feedback:           |
                        The code exposes the entry point the record
                        names, with the signature it names.

  - input:              |
                        RECORD ddr_loader_design, decision: "One
                        module per format, each exposing the same
                        entry point: from_bytes(data, encoding)." CODE
                        pym_cc_public.load.yaml: "class Loader: def
                        read(self, path): ..."
    verdict:            unmet
    feedback:           |
                        The record names a function and the code
                        offers a class with a different method. The
                        code appears to have moved.

  - input:              |
                        RECORD ddr_check_architecture, decision: "A
                        check is a module exposing check(context)."
                        CODE pym_cc_public.check.parse: "def
                        check(context): ... ID_CHECK = 'parse'"
    verdict:            met
    feedback:           |
                        The module exposes check(context). That it
                        also carries an ID_CHECK constant is something
                        the record says nothing about, and silence is
                        not disagreement.

scope:

  include:
    - decision
    - source

