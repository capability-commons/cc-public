title:                  Measurable performance
brief:                  |
                        Performance is stated as a measurable target
                        with explicit timing. Rules
                        rule_r34_measurable_performance,
                        rule_r35_temporal_dependencies.
criterion:              |
                        MET when the performance the statement
                        requires is a specific quantity or a named
                        standard a verification can measure against,
                        and any timing is a stated bound.

                        UNMET when performance is a word instead of a
                        measure, such as fast, prompt, minimum,
                        maximum, optimum, user friendly, best
                        practice, class leading; or when timing is
                        indefinite, such as eventually, until, before,
                        after, once, simultaneously, without a bound.

                        A statement whose action has no performance
                        dimension, such as recording a message, is MET
                        on this criterion; whether it is complete is
                        another eval's question.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the field name
                        statement. Labels are presentation, not prose.

                        When UNMET, quote the words at fault and name
                        the rule.
severity:               advisory

example:

  - input:              |
                        statement: The Radio shall consume less than
                        or equal to 50 watts of mains power.
    verdict:            met
    feedback:           |
                        A measurable target.

  - input:              |
                        statement: The Radio shall use minimum power.
    verdict:            unmet
    feedback:           |
                        Minimum is not a measure.
                        rule_r34_measurable_performance.

  - input:              |
                        statement: Continual operation of the pump
                        shall eventually result in the tank being
                        empty.
    verdict:            unmet
    feedback:           |
                        Eventually. rule_r35_temporal_dependencies.

  - input:              |
                        statement: The Pump shall remove greater than
                        99 percent of the Fluid from the Tank in less
                        than 3 days of continuous operation.
    verdict:            met
    feedback:           |
                        A measure and a time bound.

