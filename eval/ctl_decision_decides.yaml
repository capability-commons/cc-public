title:                  Control set for evl_decision_decides
brief:                  |
                        Cases with known verdicts for
                        evl_decision_decides.
description:            |
                        Each case holds a subject as the judge is
                        shown it, the verdict a person holds it to,
                        and where the case came from.

case:

  cfff16d46:
    id_self:            case_decision_decides.cfff16d46
    guid_self:          case_5a7ceb92625f485fbae71fe9c0bd88e8
    verdict:            met
    subject:            |
                        --- ddr_glossary decision: A glossary is a
                        register whose entries are terms. The type
                        t_term, held in a term register, carries the
                        surface form of the term, the forms it is also
                        known by, and the forms that are not to be
                        used for it.

                        reg_term is the glossary of the cc-public
                        repository. It holds a term for each concept
                        the repository names, whether or not that
                        concept has a type of its own.

                        A record that introduces or settles a concept
                        decides its term, by an r_decides edge to the
                        entry.

                        A term register is validated by sch_reg_term,
                        which composes the general register schema
                        with the term entry schema in the pattern the
                        type register uses.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_glossary
        guid_target:    ddr_52a6615a99714b17bbc1e839ebdba531

  cf026beed:
    id_self:            case_decision_decides.cf026beed
    guid_self:          case_6b84ac927848416cb4942e6d5b1b07a1
    verdict:            met
    subject:            |
                        --- ddr_qualified_reference decision: The four
                        field edge is kept. Nothing is added to it.

                        A link needing qualification is REIFIED. It
                        becomes an entry in a keyed table, carrying an
                        identity of its own, and holding a plain
                        relation edge to its target beside the fields
                        that qualify it. The entry is a thing; the
                        edge on it is an edge like any other.

                        A link needing no qualification and no
                        identity is neither an edge nor an entry, and
                        is held however reads best. A dataflow edge is
                        a map from a source port path to destinations.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_qualified_reference
        guid_target:    ddr_b642be8c694543dc839df692c4e43154

  c63553a78:
    id_self:            case_decision_decides.c63553a78
    guid_self:          case_f08564b36dbf425f854a76bc5466c0fe
    verdict:            met
    subject:            |
                        --- ddr_path_notation decision: A path is a
                        sequence of steps joined by full stops. A step
                        names a mapping key or, for a sequence, an
                        index: relation.0.guid_target.

                        A key a path crosses holds no full stop. A
                        value may: a port address such as
                        draft.output.record is a datum, not a key. So
                        a step is whatever lies between two full
                        stops, and nothing is quoted or escaped.

                        A pattern is written in the same notation. A
                        step of one asterisk matches any single step.
                        A step of two matches any run of steps,
                        including none.

                        A scope carries an include list and an exclude
                        list, either of which may be empty.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_path_notation
        guid_target:    ddr_901f2778f7cc43389a8eeb10f2384665

  c255c2132:
    id_self:            case_decision_decides.c255c2132
    guid_self:          case_c050850d03a64a12ab3bc3a0626a5efb
    verdict:            met
    subject:            |
                        --- ddr_writing_style decision: A writing
                        style guide is a register whose entries are
                        writing style rules. The type
                        t_writing_style_rule, held in a writing style
                        rule register, carries the rule as a one line
                        brief, its reasoning as a description, and one
                        sentence that follows the rule beside the same
                        sentence written so that it breaks it.

                        reg_writing_style_rule is the guide of the
                        cc-public repository. Its first entries are
                        the seven rules the produced record broke.

                        A prompt that writes prose takes the guide as
                        context through an input port, as it takes a
                        schema. An eval that judges prose cites the
                        rules it checks by id. The example pair on a
                        rule is the smallest written control case for
                        that eval.

                        A writing style rule register is validated by
                        sch_reg_writing_style_rule, which composes the
                        general register schema with
                        sch_writing_style_rule, in the pattern the
                        type register uses.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_writing_style
        guid_target:    ddr_0c73da014285401bbe762d25def81add

  c04c10a46:
    id_self:            case_decision_decides.c04c10a46
    guid_self:          case_cd535b76682e4ef3911e3e134e1bc664
    verdict:            met
    subject:            |
                        --- ddr_dataflow_workflow decision: A dataflow
                        workflow is one data item holding a graph. It
                        is a composite component, and its ports are
                        the unbound ports of its nodes.

                        A NODE instantiates a component, by an
                        r_instantiates edge, and carries whatever
                        configuration that instance needs. Nodes are
                        held in a keyed table and each carries an
                        identity of its own.

                        An EDGE connects one output port to one input
                        port, each named by a dot path through the
                        node: node.output.name and node.input.name.
                        Edges are held in a keyed table under a short
                        local name, as ports and nodes are, and each
                        carries its two endpoints as fields. An edge
                        carries no identity: it is its endpoints,
                        whatever it is called, and two edges joining
                        the same ports are a fault.

                        A BACK EDGE is an edge whose destination
                        precedes its source. Back edges are held in a
                        second map of the same shape, and are set
                        aside when the graph is ordered. They are a
                        kind, not a flag on a forward edge.

                        A destination may carry a GUARD naming a
                        verdict, met or unmet. A guarded edge fires
                        only when the evals anchored to its source
                        port reach that verdict: met when all of them
                        are met, unmet when any is. An unguarded edge
                        fires always.

                        The item that travels an edge is the item on
                        its source port, whatever the guard. A verdict
                        never travels.

                        Iteration is a back edge guarded unmet,
                        ordinarily into an optional input of the node
                        it came from, alongside a forward edge guarded
                        met. Branching is two forward edges with
                        complementary guards. An output that may go
                        unproduced is an edge that may not fire.

                        The graph names no model and no budget. See
                        ddr_workflow_deployment.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_dataflow_workflow
        guid_target:    ddr_31507fbecaf44db09f332d227aa90943

  c76a1e258:
    id_self:            case_decision_decides.c76a1e258
    guid_self:          case_806565414f3244fa91e48866f8a25fc6
    verdict:            met
    subject:            |
                        --- ddr_terminology decision: A concept is
                        named by the term the nearest established
                        vocabulary already uses for it: the
                        literature, stableflow, the domain the reader
                        comes from.

                        A departure from that term needs a reason, and
                        the reason is recorded in the glossary entry
                        or in a design decision.

                        A term is entered in the glossary when it is
                        introduced, together with the forms it
                        displaces.

                        A name that reads two ways is not chosen,
                        however apt one of the readings is.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_terminology
        guid_target:    ddr_9513f3fd01d8465ab77ca993f60dd975

  cfef60c1f:
    id_self:            case_decision_decides.cfef60c1f
    guid_self:          case_3bfa7fc2265647a1b274539053263997
    verdict:            met
    subject:            |
                        --- ddr_register_entries_are_keyed decision:
                        The table field of a register is a mapping,
                        keyed by each entry's readable id.

                        Each entry additionally carries id_self, whose
                        value must equal the key it sits under.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_register_entries_are_keyed
        guid_target:    ddr_1c85014313d543a086c9f9db6c71f925

  c9629d25d:
    id_self:            case_decision_decides.c9629d25d
    guid_self:          case_63e6a3e2dc81420d86b6ff2fd5c10905
    verdict:            met
    subject:            |
                        --- ddr_commit_record decision: A commit
                        record is a data item that lives in the
                        message of the commit it describes, and
                        nowhere else. The first line of the message is
                        plain text, for tools that read only the first
                        line; a blank line follows; then the record
                        between a line of three dashes and a line of
                        three full stops.

                        The record composes identity and nothing else
                        of the envelope. It carries title, brief,
                        description, a status of clean or checkpoint,
                        the counts the checks reported, and edges for
                        what the commit relates to on purpose: an
                        r_results_from edge to the execution where a
                        workflow made it, and whatever else is linked
                        when it is made. What the commit changed is
                        not in the record.

                        The title appears twice, on the first line and
                        in the record.

                        The readable id sorts by time: the prefix, a
                        UTC timestamp to the second, and six
                        characters of the guid. The identifier grammar
                        was widened to allow a digit to begin an id's
                        body for it, and an execution's id takes the
                        same form.

                        cctool commit runs the checks, refuses on a
                        critical finding unless a checkpoint is asked
                        for, names the changed items, mints the
                        record, validates it, stages what changed and
                        commits. cctool log reads the records back and
                        validates them again.

                        A commit record is never referred to by
                        anything in the tree. It is validated when
                        made and on demand, and never loaded to
                        resolve anything.

                        When a workflow commits is machinery, held on
                        the deployment: once at the end of a run,
                        after every node, or never.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_commit_record
        guid_target:    ddr_ba74e917b48842d0a3fd33711f0fa932

  cef847282:
    id_self:            case_decision_decides.cef847282
    guid_self:          case_7f1438282d2f40a2b1a8f519948b70e7
    verdict:            met
    subject:            |
                        --- ddr_layout_convention decision: A document
                        is laid out by a PRINTER. It is parsed, and
                        written again from the parse: structure
                        indented two per level; a value at column 24,
                        or two past its key where the key reaches that
                        far; the first key of a sequence item on the
                        line with its dash; block scalar bodies at the
                        common column, filled to 70.

                        Only what the author wrote as a block scalar
                        is prose, and only prose is refilled. A plain
                        scalar is a datum and stays on its line
                        however long it runs.

                        Every sequence is written in block form. Flow
                        form is kept only for the empty list and the
                        empty mapping.

                        Blank lines are placed by rule and not read
                        from the source: one separates anything
                        written on several lines from what is beside
                        it, and one precedes a comment block. Scalars,
                        block scalars among them, pack. Inside a
                        docstring the document sits one blank line
                        inside its markers.

                        Comments are kept, each before the key it
                        preceded, at that key's indent. Quoting is
                        kept as written.

                        The layout check is one comparison: a file
                        against its own printing, reported at the
                        first line that differs.

                        A document outside the subset the printer
                        handles -- anchors, tags, folded scalars, a
                        sequence directly in a sequence -- is refused
                        with a reason, not laid out by guesswork.

                        A python file is governed across every
                        document held in a docstring, found by walking
                        the syntax tree: the module's, and any class's
                        or function's. The code is not touched.

                        The printer is run after any edit to a
                        document. Then the checks.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_layout_convention
        guid_target:    ddr_6604af5f4b854ba485fbf15b16e39cf1

  ce1aab894:
    id_self:            case_decision_decides.ce1aab894
    guid_self:          case_d32b5a1796214da2b5ed89b9eae2b09e
    verdict:            met
    subject:            |
                        --- ddr_question decision: A question is an
                        entry on its record, under question, with an
                        identity of its own and its text. It is made
                        with cctool insert, keyed by the content of
                        its text as a control case is.

                        A question is answered by an r_answers edge
                        from the item that settles it, which may be a
                        later record, a schema, or a module. It is
                        never answered by editing its text.

                        A question with no incoming r_answers edge is
                        open. cctool questions lists them, and --open
                        lists only those.

                        The prose field open_question is refused by
                        the record schema, so that no record keeps
                        one.

                        cctool unset removes a field, which the
                        migration needed and which the edit commands
                        had left open.
    origin:             written
    note:               |
                        Hand written: the decision and only the
                        decision.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_question
        guid_target:    ddr_caa0d0bfef1c4d158462de542c8b0532

  c77a6e289:
    id_self:            case_decision_decides.c77a6e289
    guid_self:          case_502fe03fcfb24457bcaf8060330bfb42
    verdict:            met
    subject:            |
                        --- ddr_sch_identity_design_decision decision:
                        The sch_identity schema defines identity by
                        requiring two identifier fields: (1)
                        **guid_self**, an opaque, immutable GUID that
                        includes a type prefix followed by 32
                        lowercase hexadecimal digits; this serves as
                        the canonical globally unique identifier
                        assigned once at creation, and (2)
                        **id_self**, a human-readable identifier that
                        shares the same type prefix but does not
                        guarantee uniqueness or immutability, intended
                        for readability, tooling, and file naming in
                        standalone item files. Every data item that
                        needs to be addressable composes the
                        sch_identity trait to establish its identity.
                        Items that are describable or have rights
                        composition include additional schemas. The
                        presence of either id_self or guid_self
                        anywhere in a document declares the identity;
                        other identifier fields elsewhere refer only
                        to these declared identities. The schema
                        explicitly permits additional properties
                        alongside these identifiers.
    origin:             suppressed
    note:               |
                        The first workflow run. Held unmet while the
                        criterion reached description. Its decision
                        field argues nothing; the argument sits in its
                        rationale, where it belongs. What is wrong
                        with it, a decision that is the schema read
                        aloud, is judged beside the schema by
                        evl_decision_adds_to_item.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_sch_identity_design_decision
        guid_target:    ddr_47219c063336401dbc083277e047e212

