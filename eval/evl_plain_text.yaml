title:                  Plain text
brief:                  |
                        Prose in a field is plain text: no markup of
                        any kind. The rule is style_plain_text.
criterion:              |
                        MET when every passage is plain prose:
                        sentences and paragraphs, with names written
                        as they are declared.

                        UNMET when any passage carries markup: a
                        heading marker, a bullet or numbered list
                        marker at the start of a line, emphasis marks
                        such as asterisks or underscores around words,
                        backticks or a code fence, a table, or a link
                        written in markdown form.

                        A full stop, a colon, a comma, parentheses or
                        a numeral inside a sentence are punctuation,
                        not markup, and are MET. A name containing an
                        underscore, such as guid_self, is a name and
                        is MET.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the name of its
                        first field. Field names followed by a colon
                        label the passages that follow. Labels are how
                        the subject is presented and are never markup.

                        When UNMET, quote the marked passage.
severity:               advisory

example:

  - input:              |
                        guid_self is minted once at creation and never
                        changes. id_self is readable and may change.
    verdict:            met
    feedback:           |
                        Names written as declared, in sentences. The
                        underscores are part of the names.

  - input:              |
                        **guid_self**: minted once at creation;
                        *never* changes.
    verdict:            unmet
    feedback:           |
                        Asterisks around words are emphasis marks.
                        Quote: **guid_self** and *never*.

  - input:              |
                        The register holds three things: the status,
                        the entries, and the relation edges. Each
                        entry is keyed by its id.
    verdict:            met
    feedback:           |
                        A list written as a sentence, with a colon and
                        commas, is prose.

  - input:              |
                        ## Fields

                        - status - table

                        See `sch_register` for the shape.
    verdict:            unmet
    feedback:           |
                        A heading marker, bullet markers and
                        backticks. Quote all three.

