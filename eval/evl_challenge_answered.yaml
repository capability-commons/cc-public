title:                  Challenge answered
brief:                  |
                        A design decision carries a specific challenge
                        and a resolution that answers it. The defense
                        of a design claim is argument, and argument
                        means a counter-case constructed and met.
criterion:              |
                        You are given a design decision with its
                        challenge and its resolution.

                        MET when the challenge is a specific case
                        against the decision, naming what it attacks
                        and what follows if it is right, and the
                        resolution answers it point by point: the
                        position stood with reasons, was revised in a
                        stated way, or conceded. Also MET when the
                        challenge itself finds nothing left open and
                        says the position stands, with reasons.

                        UNMET when the challenge is absent; when it is
                        generic, a list of risks or cautions that
                        could attach to any decision; when the
                        resolution is absent though the challenge
                        raises something; or when the resolution
                        restates the decision or dismisses the
                        challenge without engaging what it says.

                        Read the challenge first and list what it
                        raises. Then check that the resolution answers
                        each of those points. A resolution that
                        answers some earlier challenge, however well,
                        and leaves what this challenge raises
                        unanswered, is UNMET: the loop is not done
                        until the challenger concedes or the
                        resolution meets the challenge in front of it.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, say which of the two is wanting
                        and quote it.
severity:               advisory

example:

  - input:              |
                        decision: Power is decomposed into local
                        generation, stored energy and diversified
                        links. challenge: Local generation at the
                        front is audible and thermal; the evidence
                        names generators being targeted. A child that
                        adds generators without concealment makes the
                        subject more exposed, not less. resolution:
                        The child on local generation is revised to
                        require concealed operation, and a fourth
                        child on signature management is added. The
                        challenge stands on its facts and the position
                        is revised.
    verdict:            met
    feedback:           |
                        A specific attack with a consequence, and a
                        resolution that changes the position in a
                        stated way.

  - input:              |
                        decision: Power is decomposed into local
                        generation, stored energy and diversified
                        links. challenge: There may be risks with any
                        of these; costs could be high and adoption
                        uncertain. resolution: The decision is sound
                        and the risks are manageable.
    verdict:            unmet
    feedback:           |
                        The challenge attaches to any decision and the
                        resolution engages nothing. Quote: There may
                        be risks with any of these.

  - input:              |
                        decision: Power is decomposed into local
                        generation, stored energy and diversified
                        links. challenge: The resolution now requires
                        concealed generation and adds signature
                        management, which meets the case made; nothing
                        is left open and the position stands.
    verdict:            met
    feedback:           |
                        The challenger concedes with reasons; no
                        resolution is needed.

