  cdb7bb6c4:
    id_self:            case_records_the_decision.cdb7bb6c4
    guid_self:          case_a3bc72724f9947559f9e7b9fcfff2146
    verdict:            unmet
    subject:            |
                        --- x decision: A commit record holds a title,
                        a brief, a description, a status, the check
                        fields and the relation fields. The title is
                        one line. The brief is one sentence. The
                        description is as long as it needs to be.
                        These fields are used by cctool log to show
                        the history.
    origin:             mutated
    note:               |
                        Only description: what the fields are and how
                        they are used, no choice and no alternative.
    relation:           []

