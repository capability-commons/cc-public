title:                  Reads on its own
brief:                  |
                        A description can be read once, on its own, by
                        a competent engineer who has read nothing
                        else. The rule is style_write_for_the_reader.
criterion:              |
                        MET when a competent engineer who has read
                        nothing else in the repository could read the
                        passage once, at an ordinary pace, and say
                        what it says. Each sentence has a subject and
                        a verb. Whatever a word such as it, this, that
                        or these points at is named in the same
                        passage, in the same sentence or the one
                        before. A list is short enough to hold in
                        mind, or is written as sentences. Nothing has
                        to be reconstructed from words left out.

                        UNMET when the reader has to do work the
                        writer could have done: a sentence with no
                        main verb, or a verb with no subject of its
                        own, so that the reader supplies what does the
                        thing; a pointer whose referent is outside the
                        passage or several sentences back; one clause
                        carrying a colon and a list of more than a few
                        things; a run of nouns that has to be unpacked
                        to be understood; or words left out so that
                        the reader supplies them.

                        Length is not the question. A longer passage
                        that reads once is MET. A shorter passage that
                        has to be read twice is UNMET. Technical names
                        from the glossary, such as r_cites or
                        guid_self, are ordinary words to this reader
                        and are never a fault.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the name of its
                        first field. Field names followed by a colon
                        label the passages that follow. Labels are how
                        the subject is presented and are never a
                        fault.

                        When UNMET, quote the passage that costs the
                        effort and say what the reader has to supply.
severity:               advisory

example:

  - input:              |
                        --- t_question description: A question data
                        item records one thing that a design decision
                        leaves unsettled. The question is held on the
                        design decision itself and has an identity of
                        its own, so that whatever settles the question
                        later can name it.
    verdict:            met
    feedback:           |
                        Two sentences, each with a subject and a verb.
                        The question, the design decision and the
                        identity are named again rather than pointed
                        at. Reads once.

  - input:              |
                        --- t_question description: Each question data
                        item is one thing a design decision does not
                        settle, held on that record with an identity
                        of its own so that whatever later settles it
                        can say so.
    verdict:            unmet
    feedback:           |
                        One sentence of thirty two words. That record
                        and it point back across the sentence;
                        whatever later settles it makes the reader
                        work out what it is. Quote: held on that
                        record with an identity of its own so that
                        whatever later settles it can say so.

  - input:              |
                        --- sch_port description: An entry on a
                        component, under input or under output. Names
                        the type of the item it carries. An input may
                        be optional. An output carries the prompt that
                        produces its item. An eval is anchored here by
                        an r_is_judged_by edge.
    verdict:            met
    feedback:           |
                        Short sentences that each say one thing. The
                        second has no subject of its own, but the
                        entry is named in the sentence before and
                        nothing has to be supplied. r_is_judged_by is
                        a glossary name. Reads once.

  - input:              |
                        --- pyf_cc_public.facts.facts description: One
                        Item per identity with its prefix, status and
                        location, one Edge per relation edge, one
                        Containment per embedded item and its holder,
                        derived from the documents on every use.
    verdict:            unmet
    feedback:           |
                        A list of thirty words with no main verb. The
                        reader has to supply what returns these, and
                        what derived attaches to. Quote the whole
                        passage.

