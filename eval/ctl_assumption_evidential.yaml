  c827ffe96:
    id_self:            case_assumption_evidential.c827ffe96
    guid_self:          case_719dcbad9c9d40059cd1d8775e4813bc
    verdict:            met
    subject:            |
                        --- ddr_decompose_frontline_power_dependency
                        assumption: grid_cut:
                          evidence: |
                            The February 2026 procurement report shows
                            repeated deliveries of generators and power
                            banks to brigades.
                          guid_self: asm_69016c2290b645279655611c6db9fd66
                          id_self: asm_decompose_frontline_power_dependency.grid_cut
                          relation: []
                          statement: |
                            Grid power near the front is cut for days at a
                            time.
                        jamming_persistent:
                          evidence: |
                            The March 2026 US Army paper on frontline
                            power notes jammers needing continuous supply.
                          guid_self: asm_7120bc93b11540f48426f99cccdf69ec
                          id_self: asm_decompose_frontline_power_dependency.jamming_persistent
                          relation: []
                          statement: |
                            Electronic warfare on the front is continuous,
                            not episodic.
                        single_provider:
                          evidence: |
                            Reuters, July 2025: the Starlink outage
                            disrupted communications across the whole
                            front.
                          guid_self: asm_695f2d9339154aa9b29c0efd63eeca69
                          id_self: asm_decompose_frontline_power_dependency.single_provider
                          relation: []
                          statement: |
                            Most frontline traffic runs over one satellite
                            service.
    origin:             written
    note:               |
                        The specimen: three claims about the world,
                        each with a source.

