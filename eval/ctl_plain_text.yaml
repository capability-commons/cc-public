  ccc77c3e4:
    id_self:            case_plain_text.ccc77c3e4
    guid_self:          case_30294d760c2445d1925e2147f3952aea
    verdict:            met
    subject:            |
                        --- reg_term brief: Register of the terms used
                        in the cc-public repository: the glossary.

                        description: The term register provides a
                        controlled list of the words this repository
                        uses for its own concepts, each with a
                        definition, the forms it is also known by, and
                        any forms that are not to be used for it.

                        usage: The term register is used to keep the
                        vocabulary of the repository consistent. A
                        record introducing a concept enters its term
                        here. Prose is judged against it: a defined
                        term is used in its defined sense, and a form
                        listed under avoid is not used for it.

                        A partner may hold a glossary of their own, as
                        a register of the same type. A term arriving
                        from a partner names an entry there and not
                        here.

                        note: A term is a word for a concept, whether
                        or not the concept is an item. Anchor, scope
                        and guard have entries; so do component and
                        port. What has a type is a subset of what has
                        a name.

                        Two words are defined here because they would
                        otherwise be one. A relation edge links items
                        and is always four fields. A dataflow edge
                        wires ports inside a workflow and has no
                        identity. Bare edge is ambiguous, and prose
                        should say which.
    origin:             written
    note:               |
                        Hand written prose, no markup.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      reg_term
        guid_target:    reg_bcba1ab65d824ac2b2f7af2ded66835a

