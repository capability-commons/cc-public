case:

  c6358c845:
    id_self:            case_plain_text.c6358c845
    guid_self:          case_0d98e18faaa94587ac70083e5128609b
    verdict:            met
    subject:            |
                        --- ddr_glossary brief: A glossary is a
                        register of terms. The cc-public glossary is
                        reg_term, and a partner's is a register of the
                        same type.

                        context: ddr_terminology decides that concepts
                        take standard names and that departures are
                        recorded. That needs somewhere for the names
                        to live, findable and checkable, or it is a
                        hope.

                        The repository already has a mechanism for a
                        controlled vocabulary with addressable
                        entries: the register.

                        This is a federated system. Different
                        repositories will want different glossaries,
                        and a term arriving from a partner will name
                        an entry held there.

                        decision: A glossary is a register whose
                        entries are terms. The type t_term, held in a
                        term register, carries the surface form of the
                        term, the forms it is also known by, and the
                        forms that are not to be used for it.

                        reg_term is the glossary of the cc-public
                        repository. It holds a term for each concept
                        the repository names, whether or not that
                        concept has a type of its own.

                        A record that introduces or settles a concept
                        decides its term, by an r_decides edge to the
                        entry.

                        A term register is validated by sch_reg_term,
                        which composes the general register schema
                        with the term entry schema in the pattern the
                        type register uses.

                        rationale: A register rather than a new
                        mechanism, because a register is exactly a
                        keyed table of addressable entries that is the
                        source of truth for a vocabulary, which is
                        what a glossary is. Keying makes duplicate
                        terms impossible. Identity makes a term
                        something an item can point at. Per register
                        entry schemas make a term entry shape cheap to
                        declare. Supersession and status come for
                        nothing.

                        The federation story is the register's own. A
                        partner brings a glossary the way they bring
                        any register, and two glossaries coexist
                        without either knowing the other exists.

                        A term for every concept and not only for
                        every type, because most of what needs a
                        consistent name has no type: anchor, scope,
                        guard, trait. What has a type is a subset of
                        what has a name.

                        Forms to avoid recorded on the entry, because
                        that is what would have caught the word this
                        record exists to answer for. A form to avoid
                        is not always wrong -- work is an ordinary
                        word -- so the judgement is an eval's and not
                        a check's.

                        alternative: A glossary as a document of its
                        own, with a type and schema unlike a register.
                        Rejected: it would reinvent keyed entries,
                        identity, status and supersession, and its
                        terms could not be pointed at without further
                        work.

                        A glossary as a section of each decision
                        record, defining the terms that record
                        introduces. Rejected: terms would be
                        scattered, and a reader looking one up would
                        have to know which record introduced it.

                        Terms only for things that have types, read
                        from the type register. Rejected: it leaves
                        the concepts most in need of a stable name
                        without one.

                        consequence: Readable ids of terms collide
                        across a federation -- term_component in two
                        glossaries -- while guids do not. That is the
                        issue ddr_protective_marking already records
                        for marks, and is not new.

                        An eval can be written that judges prose
                        against the glossary: that a defined term is
                        used in its defined sense, and that a form
                        under avoid is not used for it. That eval does
                        not yet exist.

                        A term entry has to be written for each
                        concept, which is a cost paid once and read
                        many times.

                        Two words that were one -- relation edge and
                        dataflow edge -- now have entries, and prose
                        that says bare edge is ambiguous.
    origin:             written
    note:               |
                        Hand written prose, no markup.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_glossary
        guid_target:    ddr_52a6615a99714b17bbc1e839ebdba531

  ca0473640:
    id_self:            case_plain_text.ca0473640
    guid_self:          case_e47c09c98cc14938b3a614edd3628870
    verdict:            met
    subject:            |
                        --- ddr_path_notation brief: One notation
                        names a location inside a document and, with
                        glob wildcards, a set of them.

                        context: An eval needs to say which parts of
                        an item its criterion concerns, because a
                        judge given a whole item where the criterion
                        concerns a few fields answers unreliably.

                        A flat list of field names was the first idea.
                        It cannot reach anything nested, and the
                        fields that wanted excluding -- the guids
                        scattered through a register's entries -- are
                        nested by nature.

                        Four shapes were considered: a list of field
                        names; dotted paths; dotted paths matched by
                        regular expression; and dotted paths with glob
                        wildcards.

                        decision: A path is a sequence of steps joined
                        by full stops. A step names a mapping key or,
                        for a sequence, an index:
                        relation.0.guid_target.

                        A key a path crosses holds no full stop. A
                        value may: a port address such as
                        draft.output.record is a datum, not a key. So
                        a step is whatever lies between two full
                        stops, and nothing is quoted or escaped.

                        A pattern is written in the same notation. A
                        step of one asterisk matches any single step.
                        A step of two matches any run of steps,
                        including none.

                        A scope carries an include list and an exclude
                        list, either of which may be empty.

                        rationale: The notation that names one
                        location and the notation that matches many
                        are the same notation. Someone who can write a
                        path can read a pattern, and a pattern with no
                        wildcard in it is a path.

                        A regular expression over the dotted form was
                        the alternative worth taking seriously, and
                        the full stop is what settles it. The
                        separator is a metacharacter, so every path
                        written as a regex has to escape the very
                        characters doing the naming, and a rule
                        meaning what it appears to mean is worth more
                        here than one able to express more.

                        Two lists rather than one because some scopes
                        are naturally stated the other way round. The
                        prose eval names three fields it wants. The
                        agreement eval wants an entire register except
                        its guids, which is one exclusion against an
                        enumeration that would have to be revised
                        whenever an entry gained a field.

                        alternative: A flat list of field names.
                        Rejected: it reaches only the top level.

                        Regular expressions over the dotted path.
                        Rejected for the escaping above, and because a
                        regex admits far more than any scope has
                        wanted, which makes a pattern harder to read
                        and harder to be sure of.

                        An include list only. Rejected: an exclusion
                        stated as an enumeration of everything else
                        goes stale as soon as a field is added.

                        A step wrapped in double quotes, so that a key
                        holding full stops could be named. Adopted for
                        the one such key, an edge table keyed by
                        source port, and withdrawn when edges took
                        names: two grammars in one string, for a key
                        that need not have had a full stop in it.

                        consequence: Two asterisks reach a long way. A
                        pattern selecting more than its author
                        expected shows up as a judge weighing material
                        the criterion did not ask about, which is
                        exactly the failure the scope mechanism exists
                        to prevent.

                        A pattern matching nothing is silent. Nothing
                        distinguishes a scope naming a field no item
                        carries from one naming a field every item
                        carries but this one.

                        A step naming a sequence index is positional,
                        so a path into a list stops meaning what it
                        meant when the list is reordered.
    origin:             written
    note:               |
                        Hand written prose, no markup.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_path_notation
        guid_target:    ddr_901f2778f7cc43389a8eeb10f2384665

  c4f9e3a71:
    id_self:            case_plain_text.c4f9e3a71
    guid_self:          case_6dd784cafb724f68af175c848bd066ae
    verdict:            met
    subject:            |
                        --- ddr_terminology brief: A concept is called
                        by the standard, least surprising name for it
                        unless there is a recorded reason not to.

                        context: The unit of transformation in a
                        workflow was called a work. The word came from
                        a phrase in conversation and was kept because
                        workflow contains it. It confused the one
                        reader it had, and it was replaced by
                        component -- the composite pattern's own name
                        for that role, and stableflow's.

                        Renaming it touched a hundred and ten places
                        in prose and seven files by identifier. A word
                        chosen carelessly is expensive to unchoose.

                        decision: A concept is named by the term the
                        nearest established vocabulary already uses
                        for it: the literature, stableflow, the domain
                        the reader comes from.

                        A departure from that term needs a reason, and
                        the reason is recorded in the glossary entry
                        or in a design decision.

                        A term is entered in the glossary when it is
                        introduced, together with the forms it
                        displaces.

                        A name that reads two ways is not chosen,
                        however apt one of the readings is.

                        rationale: A name has one job, which is to be
                        understood by its reader without explanation.
                        A standard term is understood by anyone who
                        knows the standard, and a reader of this
                        repository is more likely to know the
                        composite pattern or stableflow than to know a
                        coinage.

                        A pun is not a reason. That workflow contains
                        work was pleasing and told the reader nothing.

                        Recording the reason for a departure is what
                        separates a considered choice from a careless
                        one, and is what lets a later reader decide
                        whether the reason still holds.

                        alternative: Coining terms for precision, on
                        the ground that a standard word carries
                        baggage from its standard meaning. Rejected as
                        the default: the baggage is usually the point,
                        since it is what the reader already knows, and
                        where a standard word genuinely misleads, that
                        is the recorded reason for departing from it.

                        Letting names emerge and settling them later.
                        Rejected: the cost of unchoosing a name grows
                        with every use of it.

                        consequence: Some terms carry meanings from
                        their standard use that do not all apply here.
                        Component in SysML suggests a deployable unit;
                        here it need not be. The glossary entry is
                        where the difference is stated.

                        Naming a concept now takes a lookup before a
                        choice.

                        The glossary, in ddr_glossary, is what makes
                        the decision checkable rather than
                        aspirational.
    origin:             written
    note:               |
                        Hand written prose, no markup.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_terminology
        guid_target:    ddr_9513f3fd01d8465ab77ca993f60dd975

  cee6c5e95:
    id_self:            case_plain_text.cee6c5e95
    guid_self:          case_3ce573362f764abb98282661684dfcd3
    verdict:            met
    subject:            |
                        --- sch_register brief: Schema for register
                        data items.

                        description: The shape shared by every
                        register. Registers differ in what their
                        entries say, not in how they are structured.
                        Each concrete register is a data item
                        conforming to this schema.

                        A register is a first class data item. It has
                        identity, it can be the endpoint of relation
                        edges, and it can be superseded by a successor
                        register. Its entries are a controlled
                        vocabulary, and the source of truth for the
                        stable join keys used across other items.

                        usage: Selected for a register by the type
                        register, which maps the reg prefix to the
                        register type and carries the
                        r_is_specified_by_schema edge naming this
                        schema.

                        note: ENTRIES ARE KEYED, NOT LISTED

                        The table is a map keyed by each entry's
                        readable id, rather than an array of entries.

                        Entries nonetheless repeat their id as a
                        field, so that an entry lifted out of its
                        table still says what it is. The key and the
                        id field must agree; a companion check
                        enforces that.

                        ENTRY SHAPE IS OPEN

                        This schema fixes only the fields that every
                        entry in every register carries, and leaves
                        the rest open so that each register may add
                        its own. The type register adds prefix and
                        regex.
    origin:             written
    note:               |
                        Hand written prose, no markup.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      sch_register
        guid_target:    sch_a4620d79fab546b3be6c756f0325e069

