title:                  Entity, shall, active
brief:                  |
                        The statement is on the entity: the entity is
                        the subject, the verb is active and one the
                        entity performs, and the modal is shall. Rules
                        rule_r01_structured_statements,
                        rule_r02_active_voice,
                        rule_r03_appropriate_subject_verb.
criterion:              |
                        MET when the grammatical subject of the main
                        clause is the entity under specification, the
                        modal is shall, and the main verb is an action
                        that entity performs, in the active voice. A
                        condition clause may precede the subject.

                        UNMET when the statement is passive, shall be
                        followed by a past participle with the actor
                        absent or trailing; when the subject is a
                        user, operator, characteristic or activity
                        rather than the entity; or when the modal is
                        will, should, must, may or is absent.

                        UNMET also when the main verb is one no
                        performance can be verified against: support,
                        handle, manage, process, track, monitor, flag,
                        and their like. Such a verb suits a need; a
                        requirement names the function the entity
                        performs.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the field name
                        statement. Labels are presentation, not prose.

                        When UNMET, quote the words at fault and name
                        the rule.
severity:               advisory

example:

  - input:              |
                        statement: The Accounting_System shall confirm
                        the Customer_Identity.
    verdict:            met
    feedback:           |
                        Entity as subject, shall, active verb.

  - input:              |
                        statement: The Identity of the Customer shall
                        be confirmed.
    verdict:            unmet
    feedback:           |
                        Passive; the actor is absent.
                        rule_r02_active_voice.

  - input:              |
                        statement: While in the Operations_Mode, the
                        Recorder shall record Audio having the
                        characteristics defined in ICD xxxx.
    verdict:            met
    feedback:           |
                        A condition clause precedes the entity; the
                        main clause is active.

  - input:              |
                        statement: The User shall enter the current
                        time.
    verdict:            unmet
    feedback:           |
                        The subject is the user, not the entity.
                        rule_r03_appropriate_subject_verb.

