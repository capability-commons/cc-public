title:                  Entity, shall, active
brief:                  |
                        The main verb names a process the entity
                        performs and can be verified to perform: not a
                        state it is in, not a permission it grants,
                        not a management word. Rules
                        rule_r03_appropriate_subject_verb,
                        rule_s02_main_verb, rule_s13_possibility,
                        rule_r02_active_voice.
criterion:              |
                        MET when the main verb names an observable
                        process the entity performs on the object,
                        such as display, report, store, disconnect,
                        isolate, withstand, and the actor of every
                        verb in the statement is named.

                        UNMET when the main verb names a state or a
                        fulfilment rather than a process: meet, have,
                        be, comply with, achieve, ensure, satisfy;
                        when it grants a possibility and hides what
                        makes it possible: allow, permit, enable, let;
                        when it is a management word no performance
                        can be verified against: support, handle,
                        manage, process, track, monitor, flag; or when
                        a verb inside the object is passive with its
                        actor absent, such as to be recharged.

                        The entity as subject, the modal and the
                        active main clause are given by the template
                        and are not in question. Provide with an
                        object of its own is a process; provide the
                        <Actor> with the ability to <verb> is the
                        interaction form and the verb to judge is the
                        one after to.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose. The
                        statement is composed from the slots shown
                        beside it; where no slots are shown, judge the
                        statement alone.

                        When UNMET, quote the verb at fault, say what
                        the entity does in its place if that can be
                        told, and name the rule by one of the ids
                        above.
severity:               advisory

example:

  - input:              |
                        statement: The Accounting_System shall confirm
                        the Customer_Identity.
    verdict:            met
    feedback:           |
                        Entity as subject, shall, active verb.

  - input:              |
                        statement: The Identity of the Customer shall
                        be confirmed.
    verdict:            unmet
    feedback:           |
                        Passive; the actor is absent.
                        rule_r02_active_voice.

  - input:              |
                        statement: While in the Operations_Mode, the
                        Recorder shall record Audio having the
                        characteristics defined in ICD xxxx.
    verdict:            met
    feedback:           |
                        A condition clause precedes the entity; the
                        main clause is active.

  - input:              |
                        statement: The User shall enter the current
                        time.
    verdict:            unmet
    feedback:           |
                        The subject is the user, not the entity.
                        rule_r03_appropriate_subject_verb.

  - input:              |
                        statement: The Power_Pod shall support full
                        basic operation using no more than one primary
                        control. process: support activity: autonomous
    verdict:            unmet
    feedback:           |
                        Support names no process the entity performs;
                        what does the entity do, power loads, show
                        energy status. rule_s02_main_verb.

  - input:              |
                        statement: The Battery_Hub shall allow each
                        Battery_Module to be recharged from an
                        external DC source. process: allow activity:
                        autonomous
    verdict:            unmet
    feedback:           |
                        Allow hides what makes recharging possible,
                        and to be recharged has no actor.
                        rule_s13_possibility, rule_r02_active_voice.

  - input:              |
                        statement: The Library_System shall provide
                        the Librarian with the ability to print the
                        Statistics. process: print activity:
                        interaction
    verdict:            met
    feedback:           |
                        The interaction form; print is a process the
                        entity performs for the actor.

