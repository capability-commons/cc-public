title:                  Entity, shall, active
brief:                  |
                        Every verb in the statement is active with its
                        actor named: the main verb, and any verb
                        inside the object. Rules
                        rule_r02_active_voice, rule_s01_active_voice.
                        The subject and the modal are the template's;
                        the kind of the process word is the statement
                        check's.
criterion:              |
                        MET when every verb in the statement is in the
                        active voice with its actor named: the main
                        verb, which the template gives the entity as
                        its subject, and any verb inside the object or
                        the condition.

                        UNMET when a verb is passive with its actor
                        absent or trailing, shall be confirmed, to be
                        recharged, is required, are displayed by; or
                        when the object turns the obligation on a
                        person rather than the entity, so that what
                        the entity does is not said.

                        Whether the main verb names a process, a
                        state, a permission or a management word is
                        settled by the process word register and the
                        statement check, not here: a statement whose
                        main verb is support or allow is MET here
                        where its voice is active.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose. The
                        statement is composed from the slots shown
                        beside it; where no slots are shown, judge the
                        statement alone.

                        When UNMET, quote the verb at fault and name
                        the rule by one of the ids above.
severity:               advisory

example:

  - input:              |
                        statement: The Accounting_System shall confirm
                        the Customer_Identity.
    verdict:            met
    feedback:           |
                        Entity as subject, shall, active verb.

  - input:              |
                        statement: The Identity of the Customer shall
                        be confirmed.
    verdict:            unmet
    feedback:           |
                        Passive; the actor is absent.
                        rule_r02_active_voice.

  - input:              |
                        statement: While in the Operations_Mode, the
                        Recorder shall record Audio having the
                        characteristics defined in ICD xxxx.
    verdict:            met
    feedback:           |
                        A condition clause precedes the entity; the
                        main clause is active.

  - input:              |
                        statement: The User shall enter the current
                        time.
    verdict:            unmet
    feedback:           |
                        The subject is the user, not the entity.
                        rule_r03_appropriate_subject_verb.

  - input:              |
                        statement: The Library_System shall provide
                        the Librarian with the ability to print the
                        Statistics. process: print activity:
                        interaction
    verdict:            met
    feedback:           |
                        The interaction form; print is a process the
                        entity performs for the actor.

scope:

  include:
    - statement
    - activity

