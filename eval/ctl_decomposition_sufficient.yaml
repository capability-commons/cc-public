case:

  ca1ecc205:
    id_self:            case_decomposition_sufficient.ca1ecc205
    guid_self:          case_e871ada8688e4681bc2772e68a492324
    verdict:            met
    subject:            |
                        --- ddr_decompose_frontline_power_dependency
                        context: The need is
                        need_resilient_frontline_power_connectivity.
                        The framing is frame_dependency: the outcome
                        fails when something it depends on fails, so
                        the cut follows the dependencies the evidence
                        names.

                        decision: The need is decomposed into three
                        children. In frontline operations with
                        repeated attacks on infrastructure,
                        distributed frontline teams need local power
                        and charging that continues when grid power is
                        cut, in order to keep drones, jammers and
                        radios running. In frontline operations where
                        one satellite service carries most traffic,
                        the same teams need a second communications
                        path independent of that service, in order to
                        keep command and reconnaissance going through
                        an outage of the first. In frontline
                        operations under electronic warfare, the same
                        teams need control links to drones and remote
                        systems that hold under jamming, in order to
                        keep those systems in use. No entity is
                        chosen; each child is a need, not a
                        requirement.

                        consequence: The children answer the grid
                        outage, the single provider outage and jamming
                        the context names. They do not answer physical
                        attack on the equipment itself, which the
                        context implies and which is left to a later
                        decomposition under frame_adversary.

                        assumption: grid_cut:
                          evidence: |
                            The February 2026 procurement report shows
                            repeated deliveries of generators and power
                            banks to brigades.
                          guid_self: asm_69016c2290b645279655611c6db9fd66
                          id_self: asm_decompose_frontline_power_dependency.grid_cut
                          relation: []
                          statement: |
                            Grid power near the front is cut for days at a
                            time.
                        jamming_persistent:
                          evidence: |
                            The March 2026 US Army paper on frontline
                            power notes jammers needing continuous supply.
                          guid_self: asm_7120bc93b11540f48426f99cccdf69ec
                          id_self: asm_decompose_frontline_power_dependency.jamming_persistent
                          relation: []
                          statement: |
                            Electronic warfare on the front is continuous,
                            not episodic.
                        single_provider:
                          evidence: |
                            Reuters, July 2025: the Starlink outage
                            disrupted communications across the whole
                            front.
                          guid_self: asm_695f2d9339154aa9b29c0efd63eeca69
                          id_self: asm_decompose_frontline_power_dependency.single_provider
                          relation: []
                          statement: |
                            Most frontline traffic runs over one satellite
                            service.

                        challenge: The third child, control links that
                        hold under jamming, is not a need but a
                        solution direction: the need is to keep remote
                        systems in use under electronic warfare, and
                        control links are one way. A fibre tethered
                        system needs no link that jamming can reach.
                        If the child stands as written, the
                        decomposition forecloses the tether. The
                        assumption that jamming is continuous is also
                        taken from a paper on power, which says
                        jammers need power, not that jamming never
                        stops.

                        resolution: The first point stands and the
                        child is revised: the same teams need to keep
                        drones and remote systems in use under
                        electronic warfare, with the means open. The
                        second point is conceded in part: the
                        assumption is reworded to what the evidence
                        supports, that jammers run continuously on the
                        friendly side, and its evidence for the
                        hostile side is marked as lacking.

                        ---
                        need_resilient_frontline_power_connectivity
                        statement: In Frontline and near-frontline
                        operations with heavy dependence on drones and
                        networked systems, repeated attacks on
                        infrastructure, and frequent electronic
                        warfare or service disruption, Distributed
                        frontline teams operating drones, electronic
                        warfare, communications and remote systems
                        need Reliable local power, charging,
                        communications and control links sufficient to
                        continue operations when grid power, central
                        internet access, GNSS integrity or a single
                        communications service is degraded or denied,
                        in order to Keep command, reconnaissance,
                        targeting, repair, counter-drone activity and
                        remote-system use functioning under attack,
                        and reduce mission loss from communications or
                        power failure.

                        subject: Distributed frontline teams operating
                        drones, electronic warfare, communications and
                        remote systems

                        outcome: Reliable local power, charging,
                        communications and control links sufficient to
                        continue operations when grid power, central
                        internet access, GNSS integrity or a single
                        communications service is degraded or denied

                        purpose: Keep command, reconnaissance,
                        targeting, repair, counter-drone activity and
                        remote-system use functioning under attack,
                        and reduce mission loss from communications or
                        power failure

                        context: Frontline and near-frontline
                        operations with heavy dependence on drones and
                        networked systems, repeated attacks on
                        infrastructure, and frequent electronic
                        warfare or service disruption

                        evidence: Reuters reported in July 2025 that a
                        global Starlink outage disrupted Ukrainian
                        military communications across the front for
                        about two and a half hours, postponed some
                        combat operations, and led commanders to call
                        for diversified communications. A charity
                        procurement report published on 19 February
                        2026 showed repeated deliveries of satellite
                        terminals, generators, power equipment, power
                        banks, batteries and satellite modems to
                        brigades in the Kherson, Donetsk and Kharkiv
                        directions. A March 2026 US Army paper on
                        frontline power lessons from Ukraine notes
                        that electronic warfare and counter-drone
                        measures consume large amounts of energy, with
                        portable and vehicle-mounted jammers needing
                        continuous supply.
    origin:             written
    note:               |
                        The specimen against its need: three children
                        cover power, communications and control;
                        assumptions evidenced; the unanswered threat
                        is named in consequence.
    relation:           []

