title:                  Prose describes
brief:                  |
                        An item's prose describes the item; it does
                        not argue for it.
criterion:              |
                        MET when every passage of prose says what the
                        item is or how it is used.

                        UNMET when any passage argues FOR the design:
                        alternatives weighed, costs accepted, history,
                        or a case made for a choice.

                        Saying why a constraint takes the form it
                        does, beside that constraint, is description
                        and is MET. The test is whether a reader of
                        THIS item needs the passage.

                        When UNMET, quote the passage.

scope:

  include:
    - description
    - usage
    - note

severity:               advisory

example:

  - input:              |
                        These defs say what an identifier looks like
                        and nothing about what an occurrence of one
                        means. Meaning is carried by the name of the
                        field holding it.
    verdict:            met
    feedback:           |
                        Describes what the defs hold, and points at
                        where the rest is said. No case is made for
                        the design.

  - input:              |
                        The prefix serves three purposes, in order of
                        importance: 1. It makes an identifier
                        self-identifying with zero surrounding context
                        [...] This is the requirement that motivates
                        prefixing at all.
    verdict:            unmet
    feedback:           |
                        Argues for the design. A reader using $defs/id
                        does not need it. Belongs in the rationale
                        channel of a design decision.

  - input:              |
                        Type prefix: one to eight lowercase letters,
                        no digits and no underscore. Because the
                        prefix contains no underscore, the first
                        underscore in a prefixed identifier is always
                        the separator.
    verdict:            met
    feedback:           |
                        Says why the constraint takes the form it
                        does, beside that constraint. A reader of this
                        field needs it, so it is description rather
                        than argument.

  - input:              |
                        The docstring is read without importing
                        anything: importing would run the code being
                        examined, which is a poor bargain for a tool
                        whose job is to examine it.
    verdict:            unmet
    feedback:           |
                        Justifies the choice rather than describing
                        it. That the docstring is read without
                        importing is description. Why that is the
                        better bargain argues for it, by naming the
                        alternative it avoids, and belongs in the
                        rationale channel of a design decision.

                        Compare the passage above about the prefix
                        separator, which is MET. That one DERIVES a
                        property a reader needs in order to use the
                        field. This one JUSTIFIES a choice a reader
                        does not need at all.

