  c076617b4:
    id_self:            case_need_evidence_described.c076617b4
    guid_self:          case_2d65ea27642f41de917614298b4232b2
    verdict:            met
    subject:            |
                        --- need_reliable_uav_icing_status_assessment
                        evidence: The Kyiv Independent and Kyiv Post
                        reported in early 2026 that fronts of minus
                        twenty degrees Celsius grounded interceptor
                        drones, froze cameras and wiring, and left
                        surface-to-air missiles as the all-weather
                        layer while interceptors work best in clear
                        conditions. Business Insider quoted a
                        Ukrainian drone commander describing winter
                        sorties as unpredictable, with frost on
                        chassis and propellers and condensation in
                        wiring and lenses. NTNU and IEEE research on
                        small-UAV icing protection shows temperature
                        and humidity thresholds feeding
                        microcontroller control of electro-thermal
                        de-icing, flight tested in Arctic conditions.
                        A 2023 survey of UAV icing detection
                        identifies atmospheric, direct and
                        performance-based methods as prerequisites for
                        ice protection on platforms too small for
                        conventional boots.
    origin:             written
    note:               |
                        A need written to the schema; evidence as it
                        stands.
    relation:           []

  c27564ac0:
    id_self:            case_need_evidence_described.c27564ac0
    guid_self:          case_656e4422e2f649858f329eecbe446a7b
    verdict:            met
    subject:            |
                        ---
                        need_resilient_frontline_power_connectivity
                        evidence: Reuters reported in July 2025 that a
                        global Starlink outage disrupted Ukrainian
                        military communications across the front for
                        about two and a half hours, postponed some
                        combat operations, and led commanders to call
                        for diversified communications. A charity
                        procurement report published on 19 February
                        2026 showed repeated deliveries of satellite
                        terminals, generators, power equipment, power
                        banks, batteries and satellite modems to
                        brigades in the Kherson, Donetsk and Kharkiv
                        directions. A March 2026 US Army paper on
                        frontline power lessons from Ukraine notes
                        that electronic warfare and counter-drone
                        measures consume large amounts of energy, with
                        portable and vehicle-mounted jammers needing
                        continuous supply.
    origin:             written
    note:               |
                        A need written to the schema; evidence as it
                        stands.
    relation:           []

