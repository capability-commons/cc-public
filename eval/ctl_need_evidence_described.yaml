  c7fb082ca:
    id_self:            case_need_evidence_described.c7fb082ca
    guid_self:          case_87982b6db5f2486ba2035e02b5c64dec
    verdict:            met
    subject:            |
                        ---
                        need_gps_denied_unmanned_swarm_coordination
                        evidence: Swarmer's public releases, carried
                        by Army Technology and Business Wire in
                        September 2025, state that its coordination
                        software has supported more than 100,000
                        missions in Ukraine since April 2024 across
                        some fifty units, in GNSS-denied and
                        jamming-heavy environments, with swarms of up
                        to twenty-five platforms demonstrated; the
                        software takes position from GNSS, inertial or
                        visual sources and shares it across the swarm.
                        Reporting on the December 2024 Lyptsi
                        operation describes dozens of ground vehicles
                        and FPV drones acting together without
                        infantry. Open research on GNSS-denied swarms,
                        including SwarmRaft in 2025, shows distributed
                        localisation, formation keeping and obstacle
                        avoidance on peer communication and onboard
                        sensing alone.
    origin:             written
    note:               |
                        A need written to the schema; evidence as it
                        stands.
    relation:           []

