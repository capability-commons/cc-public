title:                  Outcome is an effect
brief:                  |
                        The outcome of a need describes what must
                        become possible or different, not the
                        equipment or product expected to produce it.
criterion:              |
                        MET when the outcome is an effect, condition
                        or capability, stated so that materially
                        different solutions could satisfy it.

                        UNMET when the outcome names a purchase, a
                        product, a platform, a technology or an
                        architecture as the thing needed, such as buy
                        more radars, deploy Product X, build a mobile
                        application, use artificial intelligence to
                        detect drones. A means named as an externally
                        imposed constraint, and said to be one, is
                        MET.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
severity:               advisory

example:

  - input:              |
                        outcome: Timely warning of incoming one-way
                        attack drones
    verdict:            met
    feedback:           |
                        An effect; radar, acoustics or observers could
                        give it.

  - input:              |
                        outcome: Purchase additional radars
    verdict:            unmet
    feedback:           |
                        A purchase is one means. Quote: Purchase
                        additional radars.

  - input:              |
                        outcome: Sustained ability to repair damaged
                        power-distribution equipment
    verdict:            met
    feedback:           |
                        A capability, however achieved.

  - input:              |
                        outcome: Use artificial intelligence to detect
                        drones
    verdict:            unmet
    feedback:           |
                        A technology named as the outcome.

scope:

  include:
    - outcome

