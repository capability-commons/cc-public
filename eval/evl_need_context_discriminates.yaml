title:                  Context discriminates
brief:                  |
                        The context of a need names the circumstances
                        that change the need, its priority or the
                        range of responses, and nothing so broad it
                        discriminates nothing.
criterion:              |
                        MET when the context names conditions, place,
                        phase, threat or constraints under which the
                        need arises or matters, such that changing
                        them would change the need or the candidate
                        responses; or is general where the need is
                        genuinely unrestricted.

                        UNMET when the context is so broad it excludes
                        nothing, such as in wartime, in Europe, during
                        operations, in the field; or when it embeds
                        solution details that are not genuine
                        constraints.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
severity:               advisory

example:

  - input:              |
                        context: Front-line operations within range of
                        hostile electronic warfare and indirect fire
    verdict:            met
    feedback:           |
                        Conditions that change the responses.

  - input:              |
                        context: In wartime
    verdict:            unmet
    feedback:           |
                        Excludes nothing. Quote: In wartime.

  - input:              |
                        context: Prolonged winter attacks on
                        geographically dispersed civilian energy
                        infrastructure
    verdict:            met
    feedback:           |
                        Place, season and threat.

  - input:              |
                        context: Operations using the Model 7 jammer
    verdict:            unmet
    feedback:           |
                        A solution detail standing as context.

scope:

  include:
    - context

