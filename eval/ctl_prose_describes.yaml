    guid_self:          case_13f2c0c4282b4b4ba6a6bad667ceb4be
    verdict:            met
    subject:            |
                        note: Use this register where the entries are
                        types. Use the relation register where they
                        are edges.
    origin:             written
    note:               |
                        Guidance on choosing between neighbours.
    relation:           []

