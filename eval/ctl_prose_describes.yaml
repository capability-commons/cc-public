    verdict:            unmet
    subject:            |
                        description: An earlier form of this design
                        avoided the difficulty by making the prefix
                        name something coarser than a type, within
                        which an item could be retyped without its
                        guid becoming wrong.
    origin:             written
    note:               |
                        Recounts history.
    relation:           []

  c55bf1cf0:
    id_self:            case_prose_describes.c55bf1cf0
    guid_self:          case_95e36433b3b94520aa6fecbfbdef7c36
    verdict:            unmet
    subject:            |
                        description: The table is keyed by readable id
                        rather than listed as an array, because a
                        separate id field could drift out of step with
                        the key.
    origin:             written
    note:               |
                        Justification beside the constraint.
    relation:           []

  ce4a67e7d:
    id_self:            case_prose_describes.ce4a67e7d
    guid_self:          case_93b83f22f0e64c27bcbc75d98dca802c
    verdict:            met
    subject:            |
                        description: A guid is thirty two hexadecimal
                        digits. Because a readable id must begin with
                        a letter, the two forms can never be confused.
    origin:             written
    note:               |
                        Derivation beside the constraint. The fact the
                        passage derives -- that a readable id must
                        begin with a letter -- stopped being true when
                        the identifier grammar was widened for commit
                        records. The case stands: it measures whether
                        a derivation reads as description, not whether
                        the derivation is right. A written case can be
                        wrong about the world and still be a case.
    relation:           []

  cf02033c7:
