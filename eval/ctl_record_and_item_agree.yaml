                        --- reg_type id_self: reg_type

                        status: draft

                        title: Type register

                        brief: Register of types.

                        description: The type register provides a
                        comprehensive list of types together with
                        associated metadata for each type.

                        usage: The type register is used to enable
                        type-specific system functions such as
                        automated data item validation.

                        note: Types are analogous to programming
                        language types, and describe the kinds of
                        things that the system can handle. The system
                        is primarily intended to process data items.
                        Data items can be any sort of digital asset,
                        but most typically consist of an engineering
                        document such as a requirements specification
                        or a test report, encoded in a defined
                        structure, serialized as a YAML string and
                        stored in a file system as a text file. A
                        requirements specification is the canonical
                        example of a data item, and the requirements
                        specification type defines the metadata common
                        to all requirements specification data items.

                        relation: - id_relation:
                        r_is_specified_by_schema
                          id_target: sch_reg_type

                        table: t_binding:
                          alias: []
                          brief: |
                            Type of binding data items
                          description: |
                            Each binding data item names the node and port
                            that were filled, the pass on which they were
                            filled, and by an edge the item that filled
                            them.
                          id_self: t_binding
                          note: |
                            A reified reference, per
                            ddr_qualified_reference: a relation edge is
                            four fields and a binding needs more, so the
                            binding is a thing that carries an edge.
                          prefix: bnd
                          regex_id: ^bnd_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
                          relation: []
                          status: proposed
                          title: Binding type
                          usage: |
                            Bindings are entries held on an execution
                            under binding, keyed by a short local name.
                        t_component:
                          alias: []
                          brief: |
                            Type of component data items
                          description: |
                            Each component data item is one unit of
                            transformation: named input and output ports,
                            and either a prompt on each output or a source
                            item that implements it.
                          id_self: t_component
                          note: |
                            The atomic form of component. Composite forms
                            -- workflows -- say they are component forms
                            by r_is_a_form_of, and their ports are derived
                            from their nodes.
                          prefix: cmp
                          regex_id: ^cmp_[a-z][a-z0-9_]*$
                          relation:
                          - id_relation: r_is_specified_by_schema
                            id_target: sch_component
                          status: proposed
                          title: Component type
                          usage: |
                            A component is what a node in a workflow
                            instantiates. The same component may be
                            instantiated by many nodes in many workflows.
                        t_control_case:
                          brief: |
                            Type of control case data items
                          description: |
                            Each control case data item is one subject
                            with a known verdict: the text as the judge
                            would see it, the verdict a person holds it
                            to, why, and where the case came from.
                          id_self: t_control_case
                          note: |
                            Held in a control set rather than standing
                            alone, and validated by the set's schema.
                            Origin says where a case came from, because
                            cases from different origins answer different
                            questions and must not be pooled without
                            saying so.
                          prefix: case
                          regex_id: ^case_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
                          relation: []
                          status: proposed
                          title: Control case type
                          usage: |
                            Cases are entries held on a control set. A
                            case whose text matches an item's rendering,
                            with a verdict of met, answers a finding on
                            that item.
                        t_control_set:
                          brief: |
                            Type of control set data items
                          description: |
                            Each control set data item holds cases with
                            known verdicts for one eval, so that the eval
                            can be measured and a finding it raises can be
                            answered.
                          id_self: t_control_set
                          note: |
                            Cases are never shown to the judge. They are
                            held apart from an eval's examples so that an
                            eval cannot be measured against its own
                            prompt.
                          prefix: ctl
                          regex_id: ^ctl_[a-z][a-z0-9_]*$
                          relation:
                          - id_relation: r_is_specified_by_schema
                            id_target: sch_control_set
                          status: proposed
                          title: Control set type
                          usage: |
                            A control set names the eval it measures by an
                            r_measures edge. cctool measure judges its
                            cases; cctool case adds one from a live
                            finding.
                        t_ddr:
                          alias: []
                          brief: |
                            Type of design decision data items
                          description: |
                            Each design decision data item holds
                            the reasoning behind one design decision.
                          id_self: t_ddr
                          note: |
                            One record per decision, where a decision is
                            one thing that could later be revised on its
                            own. Records live in ddr/ rather than beside
                            what they decide, since a decision commonly
                            settles matters across several directories at
                            once.
                          prefix: ddr
                          regex_id: ^ddr_[a-z][a-z0-9_]*$
                          relation:
                          - id_relation: r_is_specified_by_schema
                            id_target: sch_ddr
                          status: proposed
                          title: Design decision type
                          usage: |
                            Design decision data items are used to
                            hold the reasoning that produced an artifact,
                            so that the artifact itself need not carry it.
                        t_deployment:
                          alias: []
                          brief: |
                            Type of deployment data items
                          description: |
                            Each deployment data item names a workflow and
                            the machinery it is run under: which model,
                            what budget of passes a cycle may take, and
                            whatever else a run needs that the definition
                            must not say.
                          id_self: t_deployment
                          note: |
                            Reusable. A hundred runs under one
                            configuration are a hundred edges to one
                            deployment.
                          prefix: dep
                          regex_id: ^dep_[a-z][a-z0-9_]*$
                          relation:
                          - id_relation: r_is_specified_by_schema
                            id_target: sch_deployment
                          status: proposed
                          title: Deployment type
                          usage: |
                            An execution names exactly one deployment, and
                            reads its machinery from there.
                        t_eval:
                          alias: []
                          brief: |
                            Type of eval data items
                          description: |
                            Each eval data item defines how a data item
                            type should be evaluated by a language model.
                          id_self: t_eval
                          note: |
                            Not every data item will have a corresponding
                            eval, but some may have more than one.
                          prefix: evl
                          regex_id: ^evl_[a-z][a-z0-9_]*$
                          relation:
                          - id_relation: r_is_specified_by_schema
                            id_target: sch_eval
                          status: proposed
                          title: Eval type
                          usage: |
                            Eval data items are used to evaluate the
                            content of data items, improving the quality
                            of data item generation.
                        t_execution:
                          alias: []
                          brief: |
                            Type of execution data items
                          description: |
                            Each execution data item records one run of a
                            workflow under one deployment, as a table of
                            bindings: which item filled which port on
                            which pass.
                          id_self: t_execution
                          note: |
                            The derivation record. Everything an item owes
                            to a workflow is here and nowhere else.
                          prefix: exe
                          regex_id: ^exe_[a-z][a-z0-9_]*$
                          relation:
                          - id_relation: r_is_specified_by_schema
                            id_target: sch_execution
                          status: proposed
                          title: Execution type
                          usage: |
                            An execution is written once and not edited.
                            Where an item came from is read from the
                            bindings that name it.
                        t_node:
                          alias: []
                          brief: |
                            Type of node data items
                          description: |
                            Each node data item is one instance of a
                            component within one workflow, carrying
                            whatever configuration that instance needs.
                          id_self: t_node
                          note: |
                            Held in a workflow rather than standing alone,
                            and validated by the schema of the workflow
                            holding it.
                          prefix: node
                          regex_id: ^node_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
                          relation: []
                          status: proposed
                          title: Node type
                          usage: |
                            Nodes are entries held on a workflow under
                            node, keyed by a short local name. Edge paths
                            begin with that name.
                        t_port:
                          alias: []
                          brief: |
                            Type of port data items
                          description: |
                            Each port data item is one place on a
                            component where exactly one item is consumed
                            or produced. A port names the type of the item
                            it carries.
                          id_self: t_port
                          note: |
                            Held in a component rather than standing
                            alone, and validated by the schema of the
                            component holding it. The identifier carries
                            the component name and the port name, so that
                            two components may each have a port with the
                            same local name.
                          prefix: prt
                          regex_id: ^prt_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
                          relation: []
                          status: proposed
                          title: Port type
                          usage: |
                            Ports are entries held on a component under
                            input and output, keyed by a short local name.
                            Edges in a workflow name them by path through
                            the node.
                        t_protective_mark:
                          alias: []
                          brief: |
                            Type of protective mark data items
                          description: |
                            Each protective mark data item names an
                            authority and a level, and states what may be
                            done with an item bearing it.
                          id_self: t_protective_mark
                          note: |
                            Marks exist only as entries in the protective
