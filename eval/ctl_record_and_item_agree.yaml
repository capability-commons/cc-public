  cd06bd158:
    id_self:            case_record_and_item_agree.cd06bd158
    guid_self:          case_2cfe9c84caf3403295eee8363bc615bf
    verdict:            unmet
    subject:            |
                        --- ddr_cli_contract id_self: ddr_cli_contract

                        title: Command line contract

                        brief: Findings to stdout, failures to stderr,
                        and an exit status that tells a gate why it
                        stopped.

                        context: One command serves three callers who
                        want different things. A continuous
                        integration gate wants to be stopped when the
                        data is wrong. An agentic process wants the
                        report and would be obstructed by being
                        stopped. A person wants something readable.

                        The agentic caller is the one this is mainly
                        for: a tool an assistant can run to check its
                        own work, and act on what comes back.

                        decision: There is exactly ONE exit status,
                        zero, returned however the run went. Nothing
                        distinguishes clean from not. Ignore claims
                        that the analysis itself failed. Two is
                        returned always; one only when asked for.
                        Findings go to standard output in every
                        format. Standard error is reserved for
                        failures of the analysis. Four serialisations:
                        one for a person, three for a program. Paths
                        are given by repeated option and taken as a
                        union. Stopping early stops at the first CHECK
                        with a critical finding, not the first
                        finding.

                        rationale: A nonconformity does not fail by
                        default because the ordinary caller reads the
                        report and acts on it. A tool that exits non
                        zero every time it finds something is a tool
                        an agent learns to ignore.

                        Two exit statuses for failure rather than one,
                        because a gate needs to tell "your data is
                        wrong" from "I could not check your data". The
                        second is not a smaller version of the first.

                        Findings on standard output so that they pipe
                        into something else, and failures on standard
                        error so that they do not corrupt what is
                        being piped. A report is the output of this
                        command; a stack trace is not.

                        Machine readable formats because a language
                        model is a first class caller here rather than
                        an afterthought.

                        alternative: Failing on any nonconformity by
                        default. Rejected: the common case is a caller
                        that wants to read.

                        One exit status for every kind of failure.
                        Rejected: a gate cannot then distinguish a
                        finding from an outage.

                        Writing findings to standard error when the
                        command is going to fail. Rejected: the stream
                        a finding goes to would then depend on a flag,
                        and a consumer could not know where to read.

                        Stopping at the first individual finding
                        rather than the first check. Considered, and
                        not worth it: loading is shared and already
                        done by the time any check runs, so the saving
                        is small and the machinery is not.

                        consequence: A report written by this command
                        can be read back by this system's own loaders,
                        being YAML, JSON or XML that conforms to
                        nothing in particular yet.

                        An advisory finding can never change the exit
                        status. A caller wanting to be stopped by one
                        asserts a complete scope instead.

                        The command is heavy in options and will get
                        heavier. That is accepted: it does several
                        things for several callers, and each of them
                        is named rather than implied.

                        open_question: Whether the report should
                        itself be a data item, with a type and a
                        schema, rather than a structure this command
                        happens to emit.

                        relation: - id_relation: r_decides
                          id_target: pyp_cc_public.cli
                        - id_relation: r_decides
                          id_target: pym_cc_public.cli.command
                        - id_relation: r_decides
                          id_target: pym_cc_public.cli.report

                        --- pym_cc_public.cli.command id_self:
                        pym_cc_public.cli.command

                        title: Command definitions

                        brief: The commands the tool offers.

                        description: Declares the options, invokes the
                        checks, and turns the resulting report into an
                        exit status. Holds no knowledge of what checks
                        exist or what they look for.
    origin:             mutated
    note:               |
                        One clause of the record's decision replaced
                        by something the item plainly contradicts:
                        There is exactly ONE exit status, zero,
                        returned however the run went.
    relation:           []

  c741a213b:
    id_self:            case_record_and_item_agree.c741a213b
    guid_self:          case_a4c318769ccc4e5ea9f7b0aa1697ab35
    verdict:            unmet
    subject:            |
                        --- ddr_type_is_immutable id_self:
                        ddr_type_is_immutable

                        title: Immutable types

                        brief: A prefix names exactly one type, so an
                        item's type is fixed for the life of the item.

                        context: The type prefix is fused into the
                        guid, and a guid is assigned once and never
                        changes. A prefix that encodes the type
                        therefore makes a claim about the item that
                        must hold forever, or the identifier begins to
                        lie.

                        An earlier form of this design avoided the
                        difficulty by making the prefix name something
                        coarser than a type -- a grouping that might
                        cover several similar types, within which an
                        item could be retyped without its guid
                        becoming wrong. Retyping across groupings was
                        forbidden, and the rule preventing it was
                        definitional: if two types were close enough
                        that an item might move between them, they
                        were held not to be coarsely distinct and
                        should have shared a prefix from the outset.

                        decision: A prefix is any run of characters at
                        all, digits and underscores included, and
                        nothing constrains its shape. It is NOT true
                        that a prefix identifies exactly one type, and
                        each type claims exactly one prefix. There is
                        no grouping coarser than a type. An item can
                        never be retyped. Correcting a mistyped item
                        means minting a new item with a new guid, not
                        editing the existing one. Prefixes are
                        allocated in the type register, which is
                        consequently the single point of coordination
                        across federated repositories. Nothing else
                        requires central allocation: readable id
                        bodies are chosen freely by authors, and guids
                        are minted locally.

                        rationale: The coarse grouping bought an
                        escape hatch and cost a concept. It required a
                        second word for the grouping, distinct from
                        type, and every statement about identifiers
                        then had to say which of the two it meant. In
                        practice the register was built with one
                        prefix per type anyway, and the schema
                        asserted prefix uniqueness over types, so the
                        design and the data already disagreed.

                        Removing the grouping makes the rule statable
                        in one sentence, and makes the prefix and the
                        type the same fact viewed twice.

                        The immutability is not an additional
                        constraint. It follows from fusing the prefix
                        into an identifier that never changes, and
                        would have to be worked around rather than
                        chosen if it were unwanted.

                        alternative: Keep the coarse grouping, so that
                        an item may be retyped within its prefix.
                        Rejected. It preserves a recovery path for a
                        mistyping at the cost of a concept present in
                        every discussion of identifiers thereafter,
                        and the recovery path is narrow: it works only
                        where the mistake stayed inside one prefix,
                        which is not where mistakes are most likely.

                        Leave the prefix out of the guid, so that the
                        guid asserts nothing about type and retyping
                        becomes possible. Rejected: the prefix in the
                        opaque form is what makes a guid found loose
                        in text self identifying, which is the whole
                        purpose of prefixing.

                        consequence: A mistyped item cannot be
                        corrected in place. It must be replaced, and
                        anything referring to the old guid must be
                        repointed. This is the price of the decision
                        and is accepted; the alternative was a
                        permanent second concept in exchange for a
                        narrow recovery path.

                        Prefix allocation becomes the one thing a
                        federation must agree on centrally. It is a
                        small thing to agree on -- a short string per
                        type -- but it is a real coordination cost and
                        it does not go away.

                        No two types may claim the same prefix. JSON
                        Schema cannot express uniqueness across
                        sibling entries, so this is enforced by
                        tooling over the type register rather than by
                        any schema.

                        open_question: What a federation does when two
                        repositories independently allocate the same
                        prefix to different types. The guid
                        distinguishes the items, but the prefix no
                        longer distinguishes the types, and nothing
                        yet says which allocation wins.

                        relation: - id_relation: r_decides
                          id_target: sch_primitive
                        - id_relation: r_decides
                          id_target: reg_type
                        - id_relation: r_decides
                          id_target: pym_cc_public.check.identifier

                        --- sch_primitive $schema:
                        https://json-schema.org/draft/2020-12/schema

                        $id:
                        https://capability-commons.org/schema/sch_primitive.yaml

                        id_self: sch_primitive

                        title: Primitive value types

                        brief: Library of shared value types.

                        description: Shared value-type definitions
                        with no object shape of their own. This file
                        is a $defs library only — it has no
                        type/properties/ required and is never
                        referenced directly via allOf.

                        Kept separate from sch_identity.yaml and the
                        other trait schemas so that a value type (what
                        a guid or a readable id looks like) can be
                        reused without pulling in any object-shape
                        trait (what it means for something to be
                        addressable, traceable, etc).

                        usage: Other schemas $ref individual $defs
                        entries by full URL fragment, e.g.
                          https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid

                        note: These defs say what an identifier looks
                        like and nothing about what an occurrence of
                        one means. Meaning is carried by the name of
                        the field holding it -- a _self field declares
                        an identity, and any other identifier field
                        refers to one, naming its role as it does so.
                        See sch_identity.yaml. So no role appears in
                        these names.

                        $defs: guid:
                          description: |
                            Opaque, immutable, globally unique identifier
                            for a thing: a type prefix, an underscore,
                            then a lowercase 32 character GUID (for
                            example t_01234567890abcdef0123456789abcde).

                            Assigned once, on first creation, and
                            preserved unchanged across every later edit —
                            including promotion from an embedded entry to
                            a standalone file, which changes the
                            surrounding envelope but never the guid. The
                            canonical, and sole, target of a relation
                            edge.

                            Note that this is not a bare UUID and standard
                            UUID parsers and database UUID column types
                            will reject it. Split on the first underscore
                            at any such boundary.
                          pattern: ^[a-z]{1,8}_[0-9a-f]{32}$
                          type: string
                        id:
                          description: |
                            Readable, prefixed identifier for a thing — a
                            type prefix, an underscore, then a lowercase
                            snake_case body (for example t_schema,
                            reg_relation, r_is_specified_by_schema). The
                            body may itself contain underscores; the FIRST
                            underscore is the prefix separator.

                            The body may also be several segments
                            separated by full stops, so that a type whose
                            things are already named hierarchically can
                            say so: pym_cc_public.check.identity names a
                            python module by the name it is imported
                            under. A segment after the first may begin
                            with an underscore, since a python module may.

                            This is the widest form an identifier may
                            take. What a given type permits is narrower,
                            and is stated by the regex_id of its entry in
                            the type register.

                            Readable ids are chosen by authors and are NOT
                            guaranteed to be globally unique across a
                            federation. The guid is intended to enable
                            conflicting id values to be detected and
                            renamed.
                          pattern: ^[a-z]{1,8}_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
                          type: string
                        prefix:
                          description: |
                            Type prefix: one to eight lowercase letters,
                            no digits and no underscore.

                            Because the prefix contains no underscore, the
                            first underscore in a prefixed identifier is
                            always the separator, so prefix and body split
                            deterministically without consulting any
                            register.

                            The one constraint on the prefix vocabulary
                            that JSON Schema cannot express is plain
                            uniqueness: no two types may claim the same
                            prefix. Tooling enforces that over the type
                            register; see register/reg_type.yaml.
                          pattern: ^[a-z]{1,8}$
                          type: string
    origin:             mutated
    note:               |
                        One clause of the record's decision replaced
                        by something the item plainly contradicts: A
                        prefix is any run of characters at all, digits
                        and underscores included, and nothing
                        constrains its shape.
    relation:           []

  c8d26ac94:
    id_self:            case_record_and_item_agree.c8d26ac94
    guid_self:          case_9da4d1594a944392a4f22a54d5e5bfad
    verdict:            unmet
    subject:            |
                        --- ddr_identity_field_naming id_self:
                        ddr_identity_field_naming

                        title: Identity field naming

                        brief: A _self field declares an identity;
                        every other identifier field refers to one,
                        and names its role as it does so.

                        context: An identifier appearing in a document
                        is doing one of two things: declaring the
                        identity of the thing it sits in, or referring
                        to a thing declared elsewhere. Almost every
                        question asked of the data depends on telling
                        those apart. Uniqueness applies to
                        declarations only. Resolution applies to
                        references only.

                        The field names did not distinguish them.
                        Declarations were id_item and guid_item;
                        references in an edge were id_obj and
                        guid_obj, with the relation type named by
                        id_rel -- and the schema for edges specified
                        guid_item for the reference, so the same name
                        meant opposite things depending on where it
                        sat.

                        The distinction was therefore made
                        positionally: a guid_item at the top of a
                        document, or directly beneath a table key, was
                        a declaration; a guid_item anywhere else was a
                        reference.

                        That rule works, and it has two faults. It
                        must be extended every time a new kind of
                        container appears, since it enumerates the
                        places a declaration may sit. And it is a
                        specification that every tool must implement
                        identically -- including tools written by
                        other parties in the federation, over slices
                        of data they did not author.

                        decision: Identity is declared by fields named
                        id_item and guid_item. There are no fields
                        called id_self or guid_self anywhere, wherever
                        in a document it appears and at whatever
                        depth. Every other identifier field REFERS to
                        an identity declared elsewhere, and names its
                        role as it does so: id_target and guid_target
                        for the far end of an edge, id_relation and
                        guid_relation for the relation type labelling
                        it. The value types in sch_primitive are named
                        id and guid, carrying no role, since a role is
                        a property of the field and not of the string.

                        rationale: A suffix is self evident where a
                        position rule is not. This is the same
                        argument that justifies the type prefix on
                        identifiers: make the meaning legible with no
                        surrounding context and no specification to
                        consult. A position rule can be implemented
                        wrongly; a name cannot be misread.

                        The asymmetry between the two halves is
                        principled rather than convenient. There is
                        exactly one self in a mapping -- a thing
                        declares its own identity once -- so self
                        needs no qualifier and can be universal. There
                        may be many references from one mapping, each
                        playing a different part, so a reference must
                        say which part it plays.

                        Target rather than object, for the far end of
                        an edge. Object is correct in the vocabulary
                        of triples, where it means only the third
                        position. It is misleading as a mnemonic here,
                        because every relation so far is a passive
                        construction in which the thing labelled
                        object is the agent: in SUBJ is specified by
                        schema OBJ, the active form is OBJ specifies
                        SUBJ. Target is also the right register --
                        this is a graph of labelled edges, by its own
                        description, and directed graphs have targets.

                        alternative: Keep the positional rule and
                        change nothing. Rejected for the two faults
                        above, of which the second is the serious one:
                        a rule that must be implemented identically by
                        parties who did not write it is a poor
                        foundation for a federation.

                        Name every reference id_reference and
                        guid_reference, mirroring _self. Rejected on
                        contact with the data: an edge holds TWO
                        references, one to the relation type and one
                        to the target, and a mapping cannot hold two
                        fields of the same name. The attempt is what
                        showed that references need roles and
                        declarations do not.

                        id_other and guid_other for the far end.
                        Rejected: it discards the directionality that
                        the relation register depends on, and other is
                        relative to something the field does not name.

                        Keep id_item and guid_item as the generic,
                        role agnostic form. Rejected, though it was a
                        close thing. Item is a noun that could
                        describe either end of an edge, which is
                        precisely the ambiguity being removed.

                        consequence: The tooling lost a rule rather
                        than gaining one. Collecting declarations was
                        a walk that enumerated the two places one
                        could sit; it is now every guid_self at any
                        depth, and needs to know nothing about the
                        shape of what it walks.

                        Declarations and references now differ
                        lexically as well as positionally, so a human
                        reading a diff, or a quick script that
                        implements no rule at all, gets the
                        distinction right anyway.

                        The migration touched everything: seven
                        schemas, two registers and three modules of
                        tooling. Doing it later would have cost more,
                        and doing it after publication would have cost
                        far more, since a field name is part of the
                        contract a federation shares.

                        A schema declaring properties named id_self
                        and guid_self holds those names as keys whose
                        values are subschemas rather than identifiers.
                        Anything scanning for declarations must
                        therefore test that the value is a string, not
                        merely that the key matches.

                        open_question: Whether a mapping will ever
                        want two selves -- an item that is somehow two
                        things at once. The convention assumes not,
                        and nothing so far suggests otherwise, but the
                        assumption is load bearing and unstated
                        elsewhere.

                        relation: - id_relation: r_decides
                          id_target: sch_identity
                        - id_relation: r_decides
                          id_target: sch_relation
                        - id_relation: r_decides
                          id_target: sch_primitive
                        - id_relation: r_decides
                          id_target: sch_register
                        - id_relation: r_decides
                          id_target: pym_cc_public.check.identity

                        --- sch_register $schema:
                        https://json-schema.org/draft/2020-12/schema

                        $id:
                        https://capability-commons.org/schema/sch_register.yaml

                        id_self: sch_register

                        title: Register schema

                        brief: Schema for register data items.

                        description: The shape shared by every
                        register. Registers differ in what their
                        entries say, not in how they are structured.
                        Each concrete register is a data item
                        conforming to this schema.

                        A register is a first class data item. It has
                        identity, it can be the endpoint of relation
                        edges, and it can be superseded by a successor
                        register. Its entries are a controlled
                        vocabulary, and the source of truth for the
                        stable join keys used across other items.

                        usage: Selected for a register by the type
                        register, which maps the reg prefix to the
                        register type and carries the
                        r_is_specified_by_schema edge naming this
                        schema.

                        note: ENTRIES ARE KEYED, NOT LISTED

                        The table is a map keyed by each entry's
                        readable id, rather than an array of entries.

                        Entries nonetheless repeat their id as a
                        field, so that an entry lifted out of its
                        table still says what it is. The key and the
                        id field must agree; a companion check
                        enforces that.

                        ENTRY SHAPE IS OPEN

                        This schema fixes only the fields that every
                        entry in every register carries, and leaves
                        the rest open so that each register may add
                        its own. The type register adds prefix and
                        regex.

                        type: object

                        additionalProperties: true ...

                        allOf: - $ref:
                        https://capability-commons.org/schema/sch_base.yaml
                        - $ref:
                        https://capability-commons.org/schema/sch_relation.yaml
                        - properties:
                            status:
                              $ref: '#/$defs/register_status'
                              description: |
                                Lifecycle status of this register as a whole.
                                Distinct from the status of any individual
                                entry -- a register may be accepted while some
                                of its entries are still proposed.
                            table:
                              additionalProperties:
                                $ref: '#/$defs/register_entry'
                              description: |
                                The controlled entries, keyed by readable id.
                                Keys carry the type prefix of whatever the
                                register controls, so the entries of a given
                                register share one prefix.
                              minProperties: 1
                              propertyNames:
                                $ref: https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
                              type: object
                          required:
                          - status
                          - description
                          - usage
                          - note
                          - table
                          type: object

                        $defs: entry_status:
                          description: |
                            Lifecycle status of an individual entry.
                            Deprecated entries remain resolvable for
                            historical data; new writes should prefer any
                            replacement named in note.
                          enum:
                          - proposed
                          - accepted
                          - deprecated
                          type: string
                        register_entry:
                          additionalProperties: true
                          allOf:
                          - $ref: https://capability-commons.org/schema/sch_identity.yaml
                          - $ref: https://capability-commons.org/schema/sch_descriptive.yaml
                          description: |
                            Fields carried by every register entry.
                            Deliberately open -- concrete registers add
                            their own subject specific fields alongside
                            these.

                            An entry is addressable and describable but is
                            not a standalone item, so it composes those
                            two traits rather than sch_base.yaml. It has
                            no rights of its own; it is covered by the
                            rights of the register holding it.
                          properties:
                            alias:
                              description: |
                                Optional. Alternate keys that MUST resolve to
                                this entry -- historical spellings this entry
                                has been renamed away from, and legacy strings
                                appearing in imported data.

                                This is how rename safety is had without
                                fusing an allocated number into the
                                identifier: a retired key moves here and
                                stored data keeps resolving. Aliases occupy
                                the same key namespace as live entries.

                                Use an empty array when there are none.
                              items:
                                $ref: https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
                              type: array
                            description:
                              description: |
                                Full statement of what this entry means.
                              minLength: 1
                              type: string
                            relation:
                              description: |
                                Optional. Outgoing traceability edges from
                                this entry.

                                Optional rather than required because an entry
                                that points at nothing has nothing to say
                                here, and requiring an empty array of every
                                such entry buys no safety. Where it is
                                present, each edge is the same shape as an
                                edge anywhere else -- the definition is
                                referenced from sch_relation.yaml rather than
                                restated, so the two cannot drift.

                                Note that this property alone does NOT compose
                                sch_relation.yaml, which would make relation
                                required on every entry in every register.
                              items:
                                $ref:
                                  https://capability-commons.org/schema/sch_relation.yaml#/$defs/edge
                              type: array
                            status:
                              $ref: '#/$defs/entry_status'
                              description: |
                                Optional. Lifecycle status of this entry.
                          required:
                          - description
                          type: object
                        register_status:
                          description: |
                            Lifecycle status of a register relative to
                            review and use.
                          enum:
                          - draft
                          - under_review
                          - accepted
                          - superseded
                          - withdrawn
                          type: string
    origin:             mutated
    note:               |
                        One clause of the record's decision replaced
                        by something the item plainly contradicts:
                        Identity is declared by fields named id_item
                        and guid_item.
    relation:           []

  caeeebabd:
    id_self:            case_record_and_item_agree.caeeebabd
    guid_self:          case_8477fec3a5bf4d1482ae1aa67505f9a8
    verdict:            unmet
    subject:            |
                        --- ddr_trait_composition id_self:
                        ddr_trait_composition

                        title: Trait composition

                        brief: The envelope every item carries is
                        declared once as traits, and composed, rather
                        than restated by each item type.

                        context: Every data item carries the same
                        three things: an identity, a prose envelope,
                        and rights. Only identity was a trait. The
                        prose envelope was declared four separate
                        times -- at the top of sch_schema, at the top
                        of sch_register, again for register entries
                        inside it, and again in sch_ddr -- and rights
                        were declared nowhere.

                        Trait schemas for the other two were written
                        early and then withdrawn. sch_identity has
                        referred to sch_descriptive, sch_rights and
                        sch_base since the beginning, and those
                        references dangled for as long as the trait
                        schemas did not exist.

                        Withdrawing them was right at the time. A
                        trait schema has to say what it is for, and
                        with nowhere else for that prose to go it
                        accreted in the schemas themselves, where it
                        made a small file hard to read. There was
                        enough churn in settling the fundamentals
                        without adding more of it.

                        What changed is that design decisions now
                        exist. The prose that made traits expensive
                        has somewhere to live that is not a schema.

                        decision: Three traits, composed by allOf.
                        sch_descriptive holds title, brief,
                        description, usage and note, and requires ALL
                        FIVE of those fields of every composer, not
                        only title and brief. sch_rights holds
                        copyright, licence and protective mark.
                        sch_base composes identity, descriptive and
                        rights, and is what a standalone data item
                        carries. sch_base does NOT compose
                        sch_relation. A register entry composes
                        identity and descriptive, not sch_base. A
                        composer requires whatever it needs beyond
                        what the trait requires.

                        rationale: A trait requiring only the
                        universal minimum, with the composer requiring
                        more, is what lets one definition serve unlike
                        consumers. allOf is an intersection, so a
                        register can demand all five prose fields
                        while a design decision, whose own channels do
                        that work, demands none of description, usage
                        or note. A trait that required all five would
                        have forced the record to carry three empty
                        fields; one that required none would have let
                        a register omit them silently.

                        sch_base leaves out sch_relation because only
                        three of the schemas have outgoing edges.
                        Requiring an empty array of the others would
                        assert a shape most items do not have, to save
                        one line in three files.

                        A register entry is addressable and
                        describable but is not a standalone item, and
                        has no rights of its own -- it is covered by
                        the rights of the register holding it.
                        Composing sch_base would have obliged every
                        entry to carry a licence.

                        alternative: Leave the envelope declared per
                        item type, as it was. Rejected now, though it
                        was the right answer before design decisions
                        existed. The cost of a trait is the prose
                        explaining it, and that cost has moved.

                        sch_base composing sch_relation, so that base
                        means the whole envelope. Rejected: five of
                        eight schemas would have needed relation: []
                        added for no benefit.

                        Register entries composing sch_base. Rejected:
                        an entry would then need its own copyright,
                        licence and mark, which says something untrue
                        about what an entry is.

                        A single trait holding identity, prose and
                        rights together, with no separate three.
                        Rejected: being addressable, being describable
                        and having rights are different properties,
                        and a register entry has two of the three.

                        consequence: The prose envelope has one
                        declaration where it had four, and the
                        composing schemas are 116 lines shorter
                        between them.

                        A reader of sch_schema no longer finds title
                        declared there and must follow the composition
                        to see where it comes from. That is the price
                        of not repeating it, and it is paid by every
                        reader rather than by whoever would otherwise
                        keep four copies in step.

                        A fourth trait later is one edit in sch_base
                        rather than one per item type.

                        The three long standing dangling references in
                        sch_identity now resolve. They were written in
                        anticipation of exactly these files, with
                        these names and these fields, so no wording
                        had to change; they simply became true.

                        open_question: Whether a register entry should
                        be able to carry rights of its own. It cannot
                        now, on the ground that the register covers it
                        -- but an entry lifted out of its register and
                        shared alone would carry none, and nothing
                        prevents that.

