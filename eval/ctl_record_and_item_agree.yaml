  c2ef9d81c:
    id_self:            case_record_and_item_agree.c2ef9d81c
    guid_self:          case_fe5c4ca117914b5bb8102c14d8f70c7a
    verdict:            unmet
    subject:            |
                        --- ddr_protective_marking id_self:
                        ddr_protective_marking

                        title: Protective marking

                        brief: An item names one or more marks from a
                        register, each pairing an authority with a
                        level, and several marks apply at once.

                        context: This system is meant to federate
                        across bodies with incompatible rules: open
                        source projects, startups, defence
                        contractors, and government bodies in several
                        states, some holding data under statutory
                        protection regimes. Deciding what may be
                        disclosed, to whom, is the point of the
                        exercise rather than a detail of it.

                        An earlier attempt marked items with a single
                        free string, dtu_internal. That string is
                        already an authority and a level joined by an
                        underscore, which is the shape wanted, but as
                        free text it could not be validated, compared,
                        or reasoned about by anything.

                        A level alone will not do. CONFIDENTIAL means
                        different things under NATO, under United
                        States executive order, and in a commercial
                        non disclosure agreement. AMBER means nothing
                        without knowing it is Traffic Light Protocol.
                        Whose scheme it is cannot be dropped.

                        decision: A protective mark is an entry in
                        reg_protective_mark, carrying only a level and
                        NOT the authority governing it, since a level
                        is meaningful on its own. Disregard any
                        mention of the authority whose rules govern it
                        and the level it names within that authority's
                        scheme. An item names one or more marks by
                        reference, in a required protective_mark array
                        of at least one element. Several marks are
                        CONJUNCTIVE. Every constraint implied by every
                        mark applies at once, and the most restrictive
                        governs. Violating any one of them exposes the
                        violator to sanction under that mark's
                        authority. There is no permissive default. An
                        item that may be disclosed to anyone says so,
                        by naming mark_public. A mark lives in the
                        public register by default, and in an
                        authority specific register only where the
                        existence of the mark is itself protected.

                        rationale: The pair belongs on the mark and
                        not at each use. A level is not independently
                        meaningful, so splitting it from its authority
                        at every marked item would put a join in each
                        of them and validate neither half. Held once
                        on the mark, both become fields of a register
                        entry and are checked like any other.

                        Referencing rather than restating also gets
                        the rest of the register machinery for
                        nothing: a guid that survives a rename, a
                        description in which the handling instruction
                        can be written in plain words, and a new
                        scheme added by adding entries rather than by
                        changing a schema.

                        Conjunctive because no other reading is safe.
                        If several marks could ever mean a choice
                        between them, the failure mode is disclosure
                        rather than inconvenience, and the cost of
                        being wrong is not borne by whoever made the
                        mistake.

                        Marking made mandatory, and public made
                        affirmative, because some of this material is
                        sensitive enough to be worth the friction. An
                        author obliged to name a mark has to think
                        about who may see the thing. An author allowed
                        to omit one does not.

                        alternative: An array of free strings.
                        Rejected: it cannot be validated, compared, or
                        resolved, and it loses the authority, which is
                        what makes a level mean anything.

                        An array of authority and level pairs written
                        at each item. Rejected: the halves are not
                        independently meaningful, so this validates
                        nothing that a single string does not, and
                        repeats the pair in every item that bears it.

                        A relation edge rather than a field, reusing
                        the traceability machinery. Rejected, though
                        it is tempting. A mark is a governing property
                        rather than incidental metadata, and burying
                        it among an item's other edges makes it
                        something every tool must filter for rather
                        than read. JSON Schema can also require a
                        field but cannot require an edge of a
                        particular relation to be present, and marking
                        has to be mandatory.

                        A single mark rather than an array. Rejected:
                        orthogonal schemes coexist routinely -- a
                        Traffic Light Protocol marking and a national
                        classification say different things about the
                        same item, and neither replaces the other.

                        consequence: Every item must name a mark,
                        including every item that is simply public.
                        That is friction, and it is intended.

                        A mark arriving from a federated partner may
                        name an entry held in a register this
                        repository cannot see. Such a reference is
                        reported as advisory, since an unresolved
                        reference is ordinary in a federated slice --
                        but an unresolvable MARK is not ordinary in
                        the same way, and must be treated as more
                        restrictive than anything resolvable rather
                        than as absent. Tooling that assumes otherwise
                        would leak by default.

                        Most marks can be held publicly, so most
                        partners can resolve most marks. That is worth
                        having: a mark nobody can resolve is a mark
                        nobody can act on correctly, and the default
                        should not be secrecy where secrecy is not
                        required.

                        An item bearing a mark held outside this
                        register does disclose, to anyone it reaches,
                        that it bears a mark they cannot resolve --
                        which is itself a signal about the item. That
                        is unavoidable rather than acceptable: an item
                        cannot be shared without saying how it may be
                        handled. The answer is not to conceal the mark
                        but to withhold the item from anyone unable to
                        resolve it.

                        Nothing enforces that a mark is honoured. The
                        register says what a mark means and the schema
                        says an item must bear one; whether an item is
                        actually disclosed only where its mark permits
                        is beyond anything checkable here.

                        open_question: Caveats and releasability have
                        no representation. Real markings carry them --
                        SECRET//REL TO GBR, USA qualifies a level with
                        a list of parties it may go to -- and neither
                        the register nor the reference has anywhere to
                        put one. Adding them means either an explosion
                        of marks, one per combination, or a further
                        field naming a register of parties. Deferred
                        until there is a case to be right about.

                        The authority is a plain string and should
                        eventually be a reference to an entry in a
                        register of authorities, for the same reasons
                        the mark itself is one. Deferred while there
                        is only one authority, since a register with a
                        single entry settles nothing and constrains
                        the design of the register that eventually
                        matters.

                        Where an authority specific mark register
                        lives and what it is called. A second register
                        also called reg_protective_mark, in another
                        repository, would collide by readable id
                        though not by guid. Deferred until there is a
                        mark that must be held apart.

                        Whether cc is the right authority for
                        mark_public. A public mark is scheme
                        independent in effect, and naming an authority
                        for it says only who declared it.

                        relation: - id_relation: r_decides
                          id_target: reg_protective_mark
                        - id_relation: r_decides
                          id_target: sch_entry_protective_mark
                        - id_relation: r_decides
                          id_target: sch_reg_protective_mark
                        - id_relation: r_decides
                          id_target: sch_rights

                        --- reg_protective_mark id_self:
                        reg_protective_mark

                        status: draft

                        title: Protective mark register

                        brief: Register of protective marks.

                        description: The protective mark register
                        provides a controlled list of the marks an
                        item may carry, each naming the authority
                        whose rules govern it and the level it names
                        within that authority's scheme.

                        usage: The protective mark register is used to
                        decide what may be done with an item and with
                        whom it may be shared. Every item names one or
                        more of these marks.

                        Where an item names several, they are
                        CONJUNCTIVE. Every constraint implied by every
                        mark applies, and the most restrictive
                        governs. A violation of any one of them is a
                        violation, and exposes the violator to
                        sanction under that mark's authority.

                        note: WHERE A MARK LIVES

                        A mark belongs in this register by default.

                        A mark is held in an authority specific
                        register only where the EXISTENCE of the mark
                        is itself protected. That is unusual, and it
                        is normally a compartment rather than a level
                        that is protected in this way.

                        MARKS HELD ELSEWHERE

                        A mark arriving from a federated partner may
                        name an entry held in that partner's register
                        and not in this one. Such a reference does not
                        resolve here, which is reported as advisory
                        rather than as a fault.

                        An unresolvable mark must be treated as MORE
                        restrictive than any resolvable one, never as
                        absent.

                        relation: - id_relation:
                        r_is_specified_by_schema
                          id_target: sch_reg_protective_mark

                        table: mark_public:
                          alias: []
                          authority: cc
                          brief: |
                            May be disclosed to anyone.
                          description: |
                            The item carries no handling restriction
                            beyond the terms of its licence. It may be
                            published, forwarded and quoted without
                            further permission.
                          id_self: mark_public
                          level: public
                          note: |
                            Being public is a property of the item and not
                            of the repository holding it. A public item in
                            a restricted repository is still public.
                          status: proposed
                          title: Public
                          usage: |
                            Applied to an item that has been considered
                            and found to need no protection.

                            This mark is affirmative and is not a default.
                            An item is public because somebody decided it
                            was, and said so; absence of a mark is an
                            unanswered question rather than a permissive
                            answer, which is why a mark is required rather
                            than optional.
    origin:             mutated
    note:               |
                        One clause of the record's decision replaced
                        by something the item plainly contradicts:
                        carrying only a level and NOT the authority
                        governing it, since a level is meaningful on
                        its own.
    relation:           []

  c8e831f9e:
    id_self:            case_record_and_item_agree.c8e831f9e
    guid_self:          case_4a9c9ece55d24c1d99e57d5ea4d7066b
    verdict:            unmet
    subject:            |
                        --- ddr_relation_register id_self:
                        ddr_relation_register

                        title: Relation register

                        brief: Edge meanings are held in a register,
                        so a new kind of edge needs no change to any
                        schema or any tool.

                        context: Traceability is one mechanism: an
                        edge from one item to another, labelled. What
                        labels are permitted, and what each means, had
                        to live somewhere.

                        Putting them in a schema as an enumeration
                        would mean a schema change for every new kind
                        of edge, and would put the meaning of an edge
                        in a file that cannot hold prose about it.

                        decision: Relation types are entries in a
                        register. A relation type is an item with an
                        identity of its own, and an edge names it by
                        guid as well as by readable id, for the same
                        reason it names its target by both. Each
                        relation entry records its own inverse, in a
                        required inverse field, so that a graph can be
                        walked in either direction from one entry. It
                        is NOT a separate relation, not a direction
                        flag. The vocabulary is open. Recording a new
                        kind of edge is an entry in the register and
                        nothing else.

                        rationale: A register because this is a
                        controlled vocabulary, which is what registers
                        are for, and because an entry can carry prose
                        saying what the edge means. An enumeration in
                        a schema can carry a list of permitted strings
                        and nothing more.

                        Relation types are addressable because they
                        are items, and an edge that named its label
                        only by readable id would be resolving across
                        a federation by the one form that is not
                        guaranteed to resolve.

                        Directional, with inverses as separate
                        relations, because an inverse usually reads
                        differently rather than merely backwards, and
                        deserves its own description.

                        alternative: An enumeration in the relation
                        trait schema. Rejected: a schema change for
                        every new kind of edge, and nowhere to say
                        what one means.

                        Relation types as labels rather than items,
                        carrying a readable id and no guid. That was
                        the original position, and the schema still
                        said so after the register had begun giving
                        them guids. Rejected once the contradiction
                        was noticed: a label that has to resolve
                        across a federation is an item whether or not
                        it is called one.

                        A single relation with a direction flag.
                        Rejected: it halves the vocabulary and doubles
                        the reading effort.

                        consequence: An edge carries four fields where
                        two would identify it, because both ends are
                        named twice. That is the cost of the readable
                        half being advisory everywhere.

                        Nothing infers an inverse. Tooling that wants
                        one has to be told, and the register does not
                        yet say which relations have inverses or what
                        they are.

                        open_question: Whether a relation entry should
                        name its inverse, so that a graph can be
                        walked in either direction without a second
                        edge.

                        Whether a relation should constrain the types
                        of its ends. Nothing prevents an edge saying
                        that a schema is held in a registry.

                        Note that the answer is unlikely to be the
                        same for every relation.
                        r_is_specified_by_schema plainly ends at a
                        schema and could say so. r_decides ends at
                        anything a decision can settle, which is
                        everything, and constraining it would assert a
                        boundary that does not exist. So the
                        constraint would have to be optional, and a
                        relation declining to constrain its ends would
                        have to be read as saying nothing rather than
                        as permitting nothing.

                        relation: - id_relation: r_decides
                          id_target: reg_relation

                        --- reg_relation id_self: reg_relation

                        status: draft

                        title: Relation register

                        brief: Register of relations.

                        description: The relation register provides a
                        comprehensive list of relations together with
                        associated metadata for each.

                        usage: The relation register is used to enable
                        general purpose processing of networks of
                        items. Any item with an identifier may
                        participate in a networks as a node. Any pair
                        of such items may be connected with a labelled
                        edge, where the edge label is drawn from this
                        register. The content of this register defines
                        the semantics of that edge.

                        note: The relation register gives us a single
                        mechanism for taking any pair of items that
                        have identifiers

                        relation: []

                        table: r_binds:
                          brief: SUBJ binds OBJ
                          description: |
                            The binding identified by SUBJ names the item
                            identified by OBJ as the one that filled a
                            port on one pass of an execution. The port and
                            the node are named on the binding itself.
                          id_self: r_binds
                          title: Binds relation
                        r_decides:
                          brief: SUBJ decides OBJ
                          description: |
                            It is intended that the design of the item
                            identified by OBJ be settled by the design
                            design decision identified by SUBJ.

                            Recorded on the record rather than on the
                            item, so that an item need not point back at
                            the reasoning behind it. A reader of the item
                            finds that reasoning by looking for what
                            decides it.
                          id_self: r_decides
                          title: Decides relation
                        r_deploys:
                          brief: SUBJ deploys OBJ
                          description: |
                            The deployment identified by SUBJ supplies the
                            machinery under which the workflow identified
                            by OBJ is run: which model, what budget, and
                            whatever else the definition must not say.
                          id_self: r_deploys
                          title: Deploys relation
                        r_evaluates_items_joined_by_relation:
                          brief: SUBJ evaluates items joined by relation OBJ
                          description: |
                            It is intended that the eval identified by
                            SUBJ be applied to every PAIR of data items
                            joined by an edge labelled with the relation
                            identified by OBJ.

                            For a criterion that is not about an item at
                            all but about the fit between two of them --
                            whether a design decision and the thing it
                            decides actually agree, say. Such a criterion
                            has no single item to anchor to.
                          id_self: r_evaluates_items_joined_by_relation
                          title: Evaluates items joined by relation relation
                        r_evaluates_items_of_type:
                          brief: SUBJ evaluates items of type OBJ
                          description: |
                            It is intended that the eval identified by
                            SUBJ be applied to every data item whose type
                            is the type identified by OBJ.

                            The narrowest of the three anchors, and the
                            one to reach for where a criterion is
                            genuinely particular to one kind of thing.
                          id_self: r_evaluates_items_of_type
                          title: Evaluates items of type relation
                        r_evaluates_items_specified_by_schema:
                          brief: SUBJ evaluates items specified by schema OBJ
                          description: |
                            It is intended that the eval identified by
                            SUBJ be applied to every data item specified
                            by the schema identified by OBJ.

                            SPECIFIED BY is transitive, as it already is
                            in r_is_specified_by_schema: a schema
                            specifies an item through everything it
                            composes, which is what validation does. So an
                            item specified by sch_ddr is equally specified
                            by sch_base and sch_descriptive, and an eval
                            anchored on a trait reaches everything
                            carrying that trait -- including item types
                            not yet invented -- without being restated for
                            each.
                          id_self: r_evaluates_items_specified_by_schema
                          title: Evaluates items specified by schema relation
                        r_instantiates:
                          brief: SUBJ instantiates OBJ
                          description: |
                            The node identified by SUBJ is an instance,
                            within one workflow, of the component
                            identified by OBJ. The node supplies
                            configuration; the component supplies ports,
                            prompts and evals.
                          id_self: r_instantiates
                          title: Instantiates relation
                        r_is_a_form_of:
                          brief: SUBJ is a form of OBJ
                          description: |
                            The type identified by SUBJ shares the
                            interface of the type identified by OBJ. Used
                            from a composite component type to the atomic
                            component type, so that the component forms
                            can be enumerated and a policy binding all of
                            them can be checked.
                          id_self: r_is_a_form_of
                          title: Is a form of relation
                        r_is_held_in_registry:
                          brief: SUBJ is held in registry OBJ
                          description: |
                            It is intended that the metadata of the item
                            identified by SUBJ be recorded within the
                            registry data item identified by OBJ.
                          id_self: r_is_held_in_registry
                          title: Is held in registry relation
                        r_is_implemented_by:
                          brief: SUBJ is implemented by OBJ
                          description: |
                            The component identified by SUBJ is carried
                            out by the source item identified by OBJ,
                            rather than by a prompt. A component names one
                            or the other.
                          id_self: r_is_implemented_by
                          title: Is implemented by relation
                        r_is_judged_by:
                          brief: SUBJ is judged by OBJ
                          description: |
                            The item on the port identified by SUBJ is
                            judged by the eval identified by OBJ. Where
                            SUBJ is a component rather than a port, the
                            eval judges an input and an output of that
                            component together.

                            This is how an eval is anchored to a port. The
                            eval keeps its own criterion and examples; the
                            edge says only where it applies.
                          id_self: r_is_judged_by
                          title: Is judged by relation
                        r_is_snapshot_of:
                          brief: |
                            SUBJ is snapshot of OBJ
                          description: |
                            The control case identified by SUBJ holds, as
                            its subject, the text the item identified by
                            OBJ rendered to when the case was made.
                            Informational: what suppresses a finding is
                            the text matching, not this edge.
                          id_self: r_is_snapshot_of
                          relation: []
                          title: Is snapshot of relation
                        r_is_specified_by_schema:
                          brief: SUBJ is specified by schema OBJ
                          description: |
                            It is intended that the structure of the data
                            item identified by SUBJ be specified by the
                            schema data item identified by OBJ.
                          id_self: r_is_specified_by_schema
                          title: Is specified by schema relation
                        r_measures:
                          brief: |
                            SUBJ measures OBJ
                          description: |
                            The control set identified by SUBJ holds cases
                            with known verdicts against which the eval
                            identified by OBJ is measured. Several sets
                            may measure one eval, and a partner brings
                            their own.
                          id_self: r_measures
                          relation: []
                          title: Measures relation
                        r_ran_under:
                          brief: SUBJ ran under OBJ
                          description: |
                            The execution identified by SUBJ was run under
                            the deployment identified by OBJ. The workflow
                            that ran is reached through the deployment,
                            and machinery is recorded nowhere else.
                          id_self: r_ran_under
                          title: Ran under relation
    origin:             mutated
    note:               |
                        One clause of the record's decision replaced
                        by something the item plainly contradicts:
                        Each relation entry records its own inverse,
                        in a required inverse field, so that a graph
                        can be walked in either direction from one
                        entry.
    relation:           []

  c08c84fac:
    id_self:            case_record_and_item_agree.c08c84fac
    guid_self:          case_ecd71bc2b4754bb7836b0aba86a64712
    verdict:            unmet
    subject:            |
                        --- ddr_loader_design id_self:
                        ddr_loader_design

                        title: Loader design

                        brief: Each format is loaded from bytes by its
                        own module, and a null encoding means apply
                        that format's own convention.

                        context: Data items are YAML today, but the
                        system is meant to hold whatever an
                        engineering process produces, and JSON and XML
                        are already recognised.

                        The three formats disagree about encoding, and
                        each disagreement is written into its own
                        specification. XML declares its encoding in
                        the document. YAML 1.2 announces it with a
                        byte order mark and is UTF-8 without one. JSON
                        is required to be UTF-8 by RFC 8259 and makes
                        no allowance for a mark at all, though editors
                        emit one anyway.

                        Reading everything as text in one assumed
                        encoding discards what each format knows about
                        itself.

                        decision: One module per format, each exposing
                        a class named Loader with a read() method.
                        There is no function called from_bytes(data,
                        encoding). Bytes rather than decoded text, so
                        that a document able to declare its own
                        encoding still can. A null encoding means
                        apply the format's own convention. XML reads
                        its declaration and REFUSES an explicit
                        encoding outright. YAML resolves one from the
                        byte order mark, falling back to UTF-8. JSON
                        assumes UTF-8 and tolerates a mark. Selection
                        by suffix through a table rather than a
                        branch, which the uniform signature allows. An
                        XML document must be shaped like a tree. Mixed
                        content is refused. Each loader declares the
                        exceptions it can raise, and the package
                        composes them.

                        rationale: A uniform signature makes dispatch
                        a lookup and makes adding a format one line in
                        one table.

                        Bytes preserve self description. Decoding
                        before the parser sees the document throws
                        away the encoding declaration, and there is no
                        way to get it back.

                        XML refuses an explicit encoding rather than
                        ignoring one because the parser's encoding
                        parameter OVERRIDES the declaration rather
                        than supplying a default. Honouring a caller's
                        default would silently corrupt exactly the
                        documents it appears to help.

                        Mixed content is refused because every XML to
                        dictionary conversion loses it silently. An
                        element holding both text and children has no
                        faithful mapping, and the conversion produces
                        a plausible result rather than an error.

                        alternative: A text interface taking an open
                        file object. Written, and then withdrawn: it
                        cost XML its self description, since the
                        caller had to choose an encoding before the
                        parser could read the declaration.

                        One encoding for everything, configured once.
                        Rejected: it makes two of the three formats
                        wrong, and silently.

                        Accepting mixed content and losing the
                        position of the text. Rejected: a lossy
                        conversion that reports success is worse than
                        a refusal.

                        A hand written comment stripper for JSONC.
                        Written first, then replaced by a library
                        after a survey of five candidates: only one
                        was correct on all of comments, trailing
                        commas, and the JSON5 syntax that JSONC does
                        not permit.

                        consequence: A byte order mark fails a .json
                        file, which is what RFC 8259 requires and what
                        a Windows editor will produce. The error names
                        the cause.

                        The JSONC library is at version 0.0.2 and was
                        last released years ago. That is the price of
                        choosing correctness over maintenance; it is a
                        single file with no dependencies, and
                        vendoring it is a copy if it ever breaks.

                        XML is parsed twice, once as a security gate
                        that refuses document type definitions and
                        entity declarations, and once to convert. The
                        second parser permits an external doctype that
                        the first does not.

                        Whole files are read into memory. Nothing
                        streams, which is fine for data items and
                        would not be for anything large.

                        open_question: Whether the encoding
                        conventions should themselves be data rather
                        than code. They are facts about formats, which
                        is the kind of thing this system holds in
                        registers, and holding them in Python means a
                        federated partner running their own tooling
                        does not get them.

                        relation: - id_relation: r_decides
                          id_target: pyp_cc_public.load
                        - id_relation: r_decides
                          id_target: pym_cc_public.load.json
                        - id_relation: r_decides
                          id_target: pym_cc_public.load.jsonc
                        - id_relation: r_decides
                          id_target: pym_cc_public.load.xml
                        - id_relation: r_decides
                          id_target: pym_cc_public.load.yaml

                        --- pym_cc_public.load.yaml id_self:
                        pym_cc_public.load.yaml

                        title: YAML loader

                        brief: Load YAML documents.

                        description: The safe loader, so that tags
                        naming arbitrary python types are refused and
                        duplicate mapping keys are an error. A YAML
                        stream announces its encoding with a byte
                        order mark and is UTF-8 where it carries none.
    origin:             mutated
    note:               |
                        One clause of the record's decision replaced
                        by something the item plainly contradicts: One
                        module per format, each exposing a class named
                        Loader with a read() method.
    relation:           []

  c4dc39937:
    id_self:            case_record_and_item_agree.c4dc39937
    guid_self:          case_8f75678034c4428da9fa844a09272368
    verdict:            unmet
    subject:            |
                        --- ddr_check_architecture id_self:
                        ddr_check_architecture

                        title: Check architecture

                        brief: Three kinds of outcome, one loading
                        pass, and a check is a module with one
                        function.

                        context: The checks answer questions no schema
                        can, for the plain reason that a schema sees
                        one document at a time and these questions
                        span several: whether identifiers are
                        distinct, whether references resolve, whether
                        two types claim one prefix.

                        They are also consumed by unlike callers. A
                        gate wants to be stopped. An agent wants to
                        read and act. Both need to tell three
                        different things apart, and conflating any two
                        of them makes the report untrustworthy: the
                        data being wrong, the tool being broken, and
                        the tool not having looked.

                        decision: A check is a CLASS exposing run(),
                        constructed with the context. There is no
                        module level check function anywhere. An ERROR
                        is the analysis failing -- a path that does
                        not exist, a register that cannot be found, a
                        defect in a check. A NONCONFORMITY is the data
                        failing a rule. It carries a severity. A NOTE
                        is something a check wants reported that is
                        not a fault, and is used to make coverage
                        visible. Files are discovered from the union
                        of the paths given and loaded ONCE into a
                        shared context, which every check reads. A
                        check is a module exposing check(context) and
                        three constants naming it. A check that raises
                        is caught, recorded as an error, and the
                        remaining checks still run.

                        rationale: The note exists because a check
                        that silently examined nothing must not be
                        mistaken for one that passed. Reporting five
                        files as not examined is the difference
                        between a clean run and a vacuous one, and the
                        distinction is invisible without somewhere to
                        say it.

                        Errors are separated from nonconformities
                        because they want different treatment
                        everywhere: a different exit status, a
                        different stream, and a different response
                        from whoever reads them. A tool that reports
                        its own failure as a finding about the data is
                        lying.

                        One loading pass because three checks reading
                        the same tree three times is waste, and
                        because a file that failed to load should be
                        reported once rather than three times.

                        A raising check is caught so that a defect in
                        one check cannot hide the findings of the
                        others. The defect is reported as what it is.

                        alternative: Checks as classes. Rejected: the
                        interface is one function and a module is the
                        smaller thing that provides it.

                        One flat list of findings, without the three
                        kinds. Rejected: it conflates the data being
                        wrong with the tool being broken, which is the
                        distinction a caller most needs.

                        Each check discovering and loading what it
                        needs. Rejected for the repeated work, and
                        because load failures would then be reported
                        by whichever checks happened to touch the
                        file.

                        Letting a raising check abort the run.
                        Rejected: the findings already gathered are
                        worth having.

                        consequence: Adding a check is one module and
                        one line in the list that names them.

                        The context is loosely typed where it carries
                        eval configuration, because the eval package
                        depends on the checks and naming its types
                        would close an import cycle.

                        These rules live in Python and therefore do
                        NOT travel. A federated partner running their
                        own tooling over a slice of this repository
                        gets the schemas and the evals, which are
                        data, and none of the checks. That is an
                        argument for putting as much judgement as
                        possible into evals rather than here.

                        This record names the package and the modules
                        it decides. It could not when it was written,
