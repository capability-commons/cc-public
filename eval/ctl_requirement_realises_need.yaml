                        Cases with known verdicts for
                        evl_requirement_realises_need.
description:            |
                        Each case holds a subject as the judge is
                        shown it, the verdict a person holds it to,
                        and where the case came from.

case:

  c026ea1e0:
    id_self:            case_requirement_realises_need.c026ea1e0
    guid_self:          case_e7ec2568e9c2407eb10505e4f9719c7b
    verdict:            met
    subject:            |
                        --- req_printer_idempotent statement: When the
                        Printer receives a Laid_Out_Document, the
                        Printer shall write the Laid_Out_Document with
                        each byte unchanged.

                        --- need_layout_stable statement: In A
                        repository of hundreds of files receiving many
                        small writes a day, where gutter indentation
                        and wrap columns drifted within weeks,
                        Maintainers of a repository of data items
                        edited by people and by models need Every YAML
                        document and every docstring document laid out
                        one way, checkable by machine, with no hand
                        alignment, in order to Read and review
                        documents without the noise of layout drift,
                        and let tools edit them without churning
                        diffs.

                        subject: Maintainers of a repository of data
                        items edited by people and by models

                        outcome: Every YAML document and every
                        docstring document laid out one way, checkable
                        by machine, with no hand alignment

                        purpose: Read and review documents without the
                        noise of layout drift, and let tools edit them
                        without churning diffs

                        context: A repository of hundreds of files
                        receiving many small writes a day, where
                        gutter indentation and wrap columns drifted
                        within weeks
    origin:             written
    note:               |
                        A requirement of cctool and the need it was
                        written from.
    relation:           []

  c09e5c841:
    id_self:            case_requirement_realises_need.c09e5c841
    guid_self:          case_828b7835ec944c1bb28d5504280f6058
    verdict:            met
    subject:            |
                        --- req_checker_locates_each_finding
                        statement: When run over the Directory_Tree,
                        the Checker shall report the Location of each
                        Nonconformity in the Directory_Tree.

                        --- need_findings_actionable statement: In
                        Checks run after every edit and every workflow
                        node, over hundreds of files, and findings are
                        answered by people and by models, People and
                        models fixing what a check or an eval found
                        need Each finding located to the file that
                        holds it and the path within that file, in
                        order to Fix findings without searching for
                        them, and key control cases and suppressions
                        on where a finding lies.

                        subject: People and models fixing what a check
                        or an eval found

                        outcome: Each finding located to the file that
                        holds it and the path within that file

                        purpose: Fix findings without searching for
                        them, and key control cases and suppressions
                        on where a finding lies

                        context: Checks run after every edit and every
                        workflow node, over hundreds of files, and
                        findings are answered by people and by models
    origin:             written
    note:               |
                        A requirement of cctool and the need it was
                        written from.
    relation:           []

