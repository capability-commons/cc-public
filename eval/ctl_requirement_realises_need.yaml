    verdict:            met
    subject:            |
                        --- req_committer_writes_record statement:
                        When committing, the Commit_Command shall
                        write the Commit_Record into the
                        Commit_Message in the Record_Format.

                        --- need_history_with_commit statement: In A
                        repository whose commits are made by people
                        and by workflow runs, read back by a tool,
                        Readers of the repository's history need The
                        reason for each commit kept with the commit
                        itself, in order to Read why a change was made
                        where git keeps it, with nothing that can
                        drift from the commit.

                        subject: Readers of the repository's history

                        outcome: The reason for each commit kept with
