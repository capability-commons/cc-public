    subject:            |
                        --- req_judge_confirms_unmet statement: When
                        the Screening_Judgement of the Subject is
                        unmet, the Judge shall judge the Subject
                        Confirm_Count times.

                        --- need_trustworthy_judgement statement: In
                        Model judges that are wrong about one time in
                        ten on a single judgement, over corpora too
                        large to read, People acting on an eval's
                        finding need An adverse finding worth acting
                        on, with a known error rate, in order to Act
                        on findings without re-reading every subject
                        by hand, and know how often the judge is
                        wrong.

                        subject: People acting on an eval's finding

                        outcome: An adverse finding worth acting on,
                        with a known error rate

                        purpose: Act on findings without re-reading
                        every subject by hand, and know how often the
                        judge is wrong

                        context: Model judges that are wrong about one
                        time in ten on a single judgement, over
                        corpora too large to read
