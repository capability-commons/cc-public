  ced2ce240:
    id_self:            case_requirement_realises_need.ced2ce240
    guid_self:          case_9d712ef2b9574ce89026c6a6a0561479
    verdict:            met
    subject:            |
                        --- req_renamer_keeps_guid statement: When the
                        Renamer renames the Item, the Renamer shall
                        leave the Guid of the Item unchanged.

                        --- need_identity_stable statement: In A
                        federated repository where readable ids change
                        as terms settle and guids never do, per
                        ddr_qualified_reference, Every item that
                        refers to another item need A reference that
                        keeps resolving when the item it names is
                        renamed, in order to Rename freely as
                        understanding improves, without breaking the
                        graph of references.

                        subject: Every item that refers to another
                        item

                        outcome: A reference that keeps resolving when
                        the item it names is renamed

                        purpose: Rename freely as understanding
                        improves, without breaking the graph of
                        references

                        context: A federated repository where readable
                        ids change as terms settle and guids never do,
                        per ddr_qualified_reference
