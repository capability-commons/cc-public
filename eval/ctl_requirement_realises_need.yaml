  c408470be:
    id_self:            case_requirement_realises_need.c408470be
    guid_self:          case_3103d056278841b5810b367f0720eca0
    verdict:            met
    subject:            |
                        --- req_typed_query_run statement: When given
                        the Query_Text at the command line, the Tool
                        shall report each Row of the Result of the
                        Query_Text over the Fact_Table.

                        --- need_agent_asks_graph statement: In The
                        reports the tool gives are fixed in shape, and
                        the questions the graph raises are not: which
                        decision decides the most, what nothing points
                        at, which relation nobody uses, The agent
                        maintaining the tree need An answer to a
                        question about the graph of relations that the
                        tool did not anticipate, and the question kept
                        where it can be asked again from the Tool, in
                        order to Answer what the fixed reports do not,
                        without a script, and find what the graph has
                        forgotten.

                        subject: The agent maintaining the tree

                        outcome: An answer to a question about the
                        graph of relations that the tool did not
                        anticipate, and the question kept where it can
                        be asked again

                        purpose: Answer what the fixed reports do not,
                        without a script, and find what the graph has
                        forgotten

                        context: The reports the tool gives are fixed
                        in shape, and the questions the graph raises
                        are not: which decision decides the most, what
                        nothing points at, which relation nobody uses
    origin:             suppressed
    note:               |
                        The judge held the requirement to the whole
                        outcome of the need, whose second half, the
                        question kept, another requirement covers. The
                        criterion says a requirement may cover part of
                        the outcome and that a need is usually met by
                        several; answering a typed question about the
                        graph is a step toward the outcome the need
                        would want taken.

