title:                  Singular
brief:                  |
                        The statement is one thought: one subject, one
                        main verb, one object, and its conditions
                        stated as conditions. Rules
                        rule_r18_single_thought, rule_r19_combinators,
                        rule_r22_enumeration,
                        rule_r28_multiple_conditions.
criterion:              |
                        MET when the statement has one main clause
                        with one subject, one action verb and one
                        object, qualified by clauses that could not be
                        verified on their own.

                        UNMET when two actions or two objects are
                        joined by and, or, then, as well as or similar
                        so that they could be allocated or verified
                        separately; when a group noun stands for a set
                        of functions or things that should each be
                        named; or when several conditions are listed
                        for one action without saying whether all must
                        hold or any one.

                        A logical expression over conditions, written
                        as [X AND Y] or [X OR Y], is one condition and
                        is MET.

                        The subject opens with a label line: three
                        hyphens, the item's id, and the field name
                        statement. Labels are presentation, not prose.

                        When UNMET, quote the words at fault and name
                        the rule.
severity:               advisory

example:

  - input:              |
                        statement: When in the Active_State, the
                        Record_Subsystem shall record the Location of
                        each Line_Item.
    verdict:            met
    feedback:           |
                        One subject, one verb, one object.

  - input:              |
                        statement: When in the Active_State, the
                        Record_Subsystem shall display the Name of
                        each Line_Item and shall record the Location
                        of each Line_Item, without obscuring the
                        User_ID.
    verdict:            unmet
    feedback:           |
                        Two verbs, and a qualification that applies to
                        one. rule_r18_single_thought.

  - input:              |
                        statement: The Vehicle shall display the
                        Location and Identity of the Lead_Vehicle.
    verdict:            unmet
    feedback:           |
                        Two objects joined by and.
                        rule_r19_combinators.

  - input:              |
                        statement: When [the Cruise_Control is
                        Engaged] AND [the Accelerator is Applied], the
                        Engine_Management_System shall disengage the
                        Speed_Control_Subsystem within 500
                        milliseconds.
    verdict:            met
    feedback:           |
                        A logical condition on one action.

