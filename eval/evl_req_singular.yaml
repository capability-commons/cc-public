title:                  Singular
brief:                  |
                        The statement is one obligation: one main verb
                        on one object, whose parts could not be
                        allocated, implemented or verified apart.
                        Rules rule_r18_single_thought,
                        rule_r19_combinators, rule_r22_enumeration,
                        rule_r28_multiple_conditions,
                        rule_s05_one_sentence_per_verb.
criterion:              |
                        MET when the statement has one main verb on
                        one object, and any and, or or list within the
                        object joins parts of one thing that would be
                        allocated to one element, implemented together
                        and verified by one test.

                        UNMET when two verbs are joined so that each
                        is its own obligation, such as enter and save,
                        ingest and display; when two objects are
                        joined that could be allocated, implemented or
                        verified separately, such as the operational
                        picture and the controls, a blast mat and a
                        shelter shell; when a group noun such as
                        functions, features, related capabilities or
                        all aspects stands for a set of obligations
                        that should each be written, so that the
                        sentence is many obligations in one word; or
                        when several conditions are listed for one
                        action without saying whether all must hold or
                        any one.

                        One thing with several named parts is one
                        object: overcurrent, overvoltage,
                        short-circuit and thermal protection on one
                        output is one protection; audible and
                        vibration alert modes of one alarm are one
                        alerting; armed or safe state of one indicator
                        is one state. The test is whether the parts
                        could be verified apart, not whether the word
                        and appears. Or between two objects is
                        different: an audible or visual alarm leaves
                        which alarm undecided, and is UNMET unless the
                        statement says either satisfies it. Several
                        conditions on one action joined by and, or, or
                        a list that says and, are one condition and
                        are MET; the fault is a list of conditions
                        that does not say how they join. A logical
                        expression over conditions, written as [X AND
                        Y] or [X OR Y], is one condition and is MET.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose. The
                        statement is composed from the slots shown
                        beside it; where no slots are shown, judge the
                        statement alone.

                        When UNMET, quote the words at fault, say what
                        the separate obligations would be, and name
                        the rule by one of the ids above.
severity:               advisory

example:

  - input:              |
                        statement: When in the Active_State, the
                        Record_Subsystem shall record the Location of
                        each Line_Item.
    verdict:            met
    feedback:           |
                        One subject, one verb, one object.

  - input:              |
                        statement: When in the Active_State, the
                        Record_Subsystem shall display the Name of
                        each Line_Item and shall record the Location
                        of each Line_Item, without obscuring the
                        User_ID.
    verdict:            unmet
    feedback:           |
                        Two verbs, and a qualification that applies to
                        one. rule_r18_single_thought.

  - input:              |
                        statement: The Vehicle shall display the
                        Location and Identity of the Lead_Vehicle.
    verdict:            unmet
    feedback:           |
                        Two objects joined by and.
                        rule_r19_combinators.

  - input:              |
                        statement: When [the Cruise_Control is
                        Engaged] AND [the Accelerator is Applied], the
                        Engine_Management_System shall disengage the
                        Speed_Control_Subsystem within 500
                        milliseconds.
    verdict:            met
    feedback:           |
                        A logical condition on one action.

  - input:              |
                        statement: The Battery_Hub shall provide
                        overcurrent, overvoltage and thermal
                        protection on each Output.
    verdict:            met
    feedback:           |
                        One protection with named parts, allocated to
                        one element and verified by one test.

  - input:              |
                        statement: The Library_System shall provide
                        the Librarian with the ability to enter and
                        save the Customer_Data.
    verdict:            unmet
    feedback:           |
                        Enter and save are two processes, each its own
                        obligation. rule_s05_one_sentence_per_verb.

  - input:              |
                        statement: The Vehicle shall show a red or
                        amber Warning_Light.
    verdict:            unmet
    feedback:           |
                        Or leaves which light undecided.
                        rule_r19_combinators.

  - input:              |
                        statement: When the Audit_Clerk originated the
                        Action_Item; the Audit_Clerk is the Actionee;
                        and the Audit_Clerk is the Reviewer, the
                        Audit_System shall provide the Audit_Clerk
                        with the ability to change the Status of the
                        Action_Item.
    verdict:            met
    feedback:           |
                        Three conditions joined by and are one
                        condition on one action.

  - input:              |
                        statement: The Cabin_Controller shall control
                        the comfort related functions of the Cabin.
    verdict:            unmet
    feedback:           |
                        Comfort related functions is a group noun for
                        several obligations; write each.
                        rule_r22_enumeration.

