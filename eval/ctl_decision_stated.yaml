  cfff16d46:
    id_self:            case_decision_stated.cfff16d46
    guid_self:          case_9f212c3bf9f8420f99a82b8ed7f9a76c
    verdict:            met
    subject:            |
                        --- ddr_glossary decision: A glossary is a
                        register whose entries are terms. The type
                        t_term, held in a term register, carries the
                        surface form of the term, the forms it is also
                        known by, and the forms that are not to be
                        used for it.

                        reg_term is the glossary of the cc-public
                        repository. It holds a term for each concept
                        the repository names, whether or not that
                        concept has a type of its own.

                        A record that introduces or settles a concept
                        decides its term, by an r_decides edge to the
                        entry.

                        A term register is validated by sch_reg_term,
                        which composes the general register schema
                        with the term entry schema in the pattern the
                        type register uses.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_glossary
        guid_target:    ddr_52a6615a99714b17bbc1e839ebdba531

  cf026beed:
    id_self:            case_decision_stated.cf026beed
    guid_self:          case_c6041b0e4119479e86d9c94c5b43a544
    verdict:            met
    subject:            |
                        --- ddr_qualified_reference decision: The four
                        field edge is kept. Nothing is added to it.

                        A link needing qualification is REIFIED. It
                        becomes an entry in a keyed table, carrying an
                        identity of its own, and holding a plain
                        relation edge to its target beside the fields
                        that qualify it. The entry is a thing; the
                        edge on it is an edge like any other.

                        A link needing no qualification and no
                        identity is neither an edge nor an entry, and
                        is held however reads best. A dataflow edge is
                        a map from a source port path to destinations.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_qualified_reference
        guid_target:    ddr_b642be8c694543dc839df692c4e43154

  c63553a78:
    id_self:            case_decision_stated.c63553a78
    guid_self:          case_ef052df899944d419d594c91765d8b7d
    verdict:            met
    subject:            |
                        --- ddr_path_notation decision: A path is a
                        sequence of steps joined by full stops. A step
                        names a mapping key or, for a sequence, an
                        index: relation.0.guid_target.

                        A key a path crosses holds no full stop. A
                        value may: a port address such as
                        draft.output.record is a datum, not a key. So
                        a step is whatever lies between two full
                        stops, and nothing is quoted or escaped.

                        A pattern is written in the same notation. A
                        step of one asterisk matches any single step.
                        A step of two matches any run of steps,
                        including none.

                        A scope carries an include list and an exclude
                        list, either of which may be empty.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_path_notation
        guid_target:    ddr_901f2778f7cc43389a8eeb10f2384665

  c255c2132:
    id_self:            case_decision_stated.c255c2132
    guid_self:          case_37be93f35313493db1ae3a167e4d82b5
    verdict:            met
    subject:            |
                        --- ddr_writing_style decision: A writing
                        style guide is a register whose entries are
                        writing style rules. The type
                        t_writing_style_rule, held in a writing style
                        rule register, carries the rule as a one line
                        brief, its reasoning as a description, and one
                        sentence that follows the rule beside the same
                        sentence written so that it breaks it.

                        reg_writing_style_rule is the guide of the
                        cc-public repository. Its first entries are
                        the seven rules the produced record broke.

                        A prompt that writes prose takes the guide as
                        context through an input port, as it takes a
                        schema. An eval that judges prose cites the
                        rules it checks by id. The example pair on a
                        rule is the smallest written control case for
                        that eval.

                        A writing style rule register is validated by
                        sch_reg_writing_style_rule, which composes the
                        general register schema with
                        sch_writing_style_rule, in the pattern the
                        type register uses.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_writing_style
        guid_target:    ddr_0c73da014285401bbe762d25def81add

  c04c10a46:
    id_self:            case_decision_stated.c04c10a46
    guid_self:          case_8091725b2ae148d6b937dbb8c5bb2dc9
    verdict:            met
    subject:            |
                        --- ddr_dataflow_workflow decision: A dataflow
                        workflow is one data item holding a graph. It
                        is a composite component, and its ports are
                        the unbound ports of its nodes.

                        A NODE instantiates a component, by an
                        r_instantiates edge, and carries whatever
                        configuration that instance needs. Nodes are
                        held in a keyed table and each carries an
                        identity of its own.

                        An EDGE connects one output port to one input
                        port, each named by a dot path through the
                        node: node.output.name and node.input.name.
                        Edges are held in a keyed table under a short
                        local name, as ports and nodes are, and each
                        carries its two endpoints as fields. An edge
                        carries no identity: it is its endpoints,
                        whatever it is called, and two edges joining
                        the same ports are a fault.

                        A BACK EDGE is an edge whose destination
                        precedes its source. Back edges are held in a
                        second map of the same shape, and are set
                        aside when the graph is ordered. They are a
                        kind, not a flag on a forward edge.

                        A destination may carry a GUARD naming a
                        verdict, met or unmet. A guarded edge fires
                        only when the evals anchored to its source
                        port reach that verdict: met when all of them
                        are met, unmet when any is. An unguarded edge
                        fires always.

                        The item that travels an edge is the item on
                        its source port, whatever the guard. A verdict
                        never travels.

                        Iteration is a back edge guarded unmet,
                        ordinarily into an optional input of the node
                        it came from, alongside a forward edge guarded
                        met. Branching is two forward edges with
                        complementary guards. An output that may go
                        unproduced is an edge that may not fire.

                        The graph names no model and no budget. See
                        ddr_workflow_deployment.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_dataflow_workflow
        guid_target:    ddr_31507fbecaf44db09f332d227aa90943

  c76a1e258:
    id_self:            case_decision_stated.c76a1e258
    guid_self:          case_69757ba439b842b8b8e46927f52e0279
    verdict:            met
    subject:            |
                        --- ddr_terminology decision: A concept is
                        named by the term the nearest established
                        vocabulary already uses for it: the
                        literature, stableflow, the domain the reader
                        comes from.

                        A departure from that term needs a reason, and
                        the reason is recorded in the glossary entry
                        or in a design decision.

                        A term is entered in the glossary when it is
                        introduced, together with the forms it
                        displaces.

                        A name that reads two ways is not chosen,
                        however apt one of the readings is.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_terminology
        guid_target:    ddr_9513f3fd01d8465ab77ca993f60dd975

  cfef60c1f:
    id_self:            case_decision_stated.cfef60c1f
    guid_self:          case_b5eab9cdba174d9b9ef3a507f2a95ecc
    verdict:            met
    subject:            |
                        --- ddr_register_entries_are_keyed decision:
                        The table field of a register is a mapping,
                        keyed by each entry's readable id.

                        Each entry additionally carries id_self, whose
                        value must equal the key it sits under.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_register_entries_are_keyed
