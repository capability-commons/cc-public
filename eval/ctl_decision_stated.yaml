  c9629d25d:
    id_self:            case_decision_stated.c9629d25d
    guid_self:          case_46e0c98799fe4269823decf32fca7cb5
    verdict:            met
    subject:            |
                        --- ddr_commit_record decision: A commit
                        record is a data item that lives in the
                        message of the commit it describes, and
                        nowhere else. The first line of the message is
                        plain text, for tools that read only the first
                        line; a blank line follows; then the record
                        between a line of three dashes and a line of
                        three full stops.

                        The record composes identity and nothing else
                        of the envelope. It carries title, brief,
                        description, a status of clean or checkpoint,
                        the counts the checks reported, and edges for
                        what the commit relates to on purpose: an
                        r_results_from edge to the execution where a
                        workflow made it, and whatever else is linked
                        when it is made. What the commit changed is
                        not in the record.

                        The title appears twice, on the first line and
                        in the record.

                        The readable id sorts by time: the prefix, a
                        UTC timestamp to the second, and six
                        characters of the guid. The identifier grammar
                        was widened to allow a digit to begin an id's
                        body for it, and an execution's id takes the
                        same form.

                        cctool commit runs the checks, refuses on a
                        critical finding unless a checkpoint is asked
                        for, names the changed items, mints the
                        record, validates it, stages what changed and
                        commits. cctool log reads the records back and
                        validates them again.

                        A commit record is never referred to by
                        anything in the tree. It is validated when
                        made and on demand, and never loaded to
                        resolve anything.

                        When a workflow commits is machinery, held on
                        the deployment: once at the end of a run,
                        after every node, or never.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_commit_record
        guid_target:    ddr_ba74e917b48842d0a3fd33711f0fa932

  cef847282:
    id_self:            case_decision_stated.cef847282
    guid_self:          case_738f67e87d304bdc9a797083f9a0ae42
    verdict:            met
    subject:            |
                        --- ddr_layout_convention decision: A document
                        is laid out by a PRINTER. It is parsed, and
                        written again from the parse: structure
                        indented two per level; a value at column 24,
                        or two past its key where the key reaches that
                        far; the first key of a sequence item on the
                        line with its dash; block scalar bodies at the
                        common column, filled to 70.

                        Only what the author wrote as a block scalar
                        is prose, and only prose is refilled. A plain
                        scalar is a datum and stays on its line
                        however long it runs.

                        Every sequence is written in block form. Flow
                        form is kept only for the empty list and the
                        empty mapping.

                        Blank lines are placed by rule and not read
                        from the source: one separates anything
                        written on several lines from what is beside
                        it, and one precedes a comment block. Scalars,
                        block scalars among them, pack. Inside a
                        docstring the document sits one blank line
                        inside its markers.

                        Comments are kept, each before the key it
                        preceded, at that key's indent. Quoting is
                        kept as written.

                        The layout check is one comparison: a file
                        against its own printing, reported at the
                        first line that differs.

                        A document outside the subset the printer
                        handles -- anchors, tags, folded scalars, a
                        sequence directly in a sequence -- is refused
                        with a reason, not laid out by guesswork.

                        A python file is governed across every
                        document held in a docstring, found by walking
                        the syntax tree: the module's, and any class's
                        or function's. The code is not touched.

                        The printer is run after any edit to a
                        document. Then the checks.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_layout_convention
        guid_target:    ddr_6604af5f4b854ba485fbf15b16e39cf1

  ce1aab894:
    id_self:            case_decision_stated.ce1aab894
    guid_self:          case_9e94f26279974c20ae5409a8bd9614a7
    verdict:            met
    subject:            |
                        --- ddr_question decision: A question is an
                        entry on its record, under question, with an
                        identity of its own and its text. It is made
                        with cctool insert, keyed by the content of
                        its text as a control case is.

                        A question is answered by an r_answers edge
                        from the item that settles it, which may be a
                        later record, a schema, or a module. It is
                        never answered by editing its text.

                        A question with no incoming r_answers edge is
                        open. cctool questions lists them, and --open
                        lists only those.

                        The prose field open_question is refused by
                        the record schema, so that no record keeps
                        one.

                        cctool unset removes a field, which the
                        migration needed and which the edit commands
                        had left open.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_question
        guid_target:    ddr_caa0d0bfef1c4d158462de542c8b0532

  cb682e509:
    id_self:            case_decision_stated.cb682e509
    guid_self:          case_a8d8a9b84735422296149f6cbc11f809
    verdict:            met
    subject:            |
                        --- ddr_component decision: A COMPONENT is
                        anything with ports. It is the family of which
                        every form of workflow is a member, and the
                        only thing a node ever names.

                        An ATOMIC component is a data item declaring
                        its ports. It names either a prompt, written
                        on each output port, or code, by an
                        r_is_implemented_by edge to a source item.

                        A COMPOSITE component is a form of workflow.
                        Its ports are the unbound ports of the nodes
                        within it -- an input with no incoming forward
                        edge, an output with no outgoing forward edge
                        -- and are derived rather than declared. A
                        back edge binds nothing: it returns an item
                        for another pass and does not deliver it. The
                        dataflow workflow of ddr_dataflow_workflow is
                        one composite form. A type that is a composite
                        component says so by an r_is_a_form_of edge
                        from its type register entry to the atomic
                        component type.

                        A PORT is an entry held in a keyed table on an
                        atomic component, under input or under output,
                        keyed by a short local name and carrying an
                        identity of its own exactly as a register
                        entry does. A port names the type of item it
                        carries. It carries exactly one item.

                        An input port may be declared optional. A
                        component runs whether or not an optional
                        input is bound.

                        An output port may say what its item is to an
                        input: REVISES names the input whose item it
                        returns, changed in place, so that the item
                        that leaves is the item that arrived; DECIDES
                        names the input whose item the produced item
                        decides, and the executor adds an r_decides
                        edge from what it makes to what was bound
                        there. Both name a port of the same component
                        by its local name.

                        An eval is ANCHORED to a port by an
                        r_is_judged_by edge on that port, and judges
                        the item there. An eval is anchored to the
                        component itself by the same edge on the
                        component, and judges an input and an output
                        together; that is the join eval the eval
                        design already provides. Either kind is a
                        reference to an eval item, never a definition
                        inline.

                        A component carrying no anchored eval of
                        either kind is reported, not refused.

                        A component does not name a model, a budget,
                        or anything else about the machinery that runs
                        it. See ddr_workflow_deployment.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_component
        guid_target:    ddr_c7a6ab9679684d62a11062679706be0d

  c12d94225:
    id_self:            case_decision_stated.c12d94225
    guid_self:          case_9e4c9608ce5e405da8d46daa2b65e09d
    verdict:            met
    subject:            |
                        --- ddr_severity decision: Two values.
                        Critical means the finding must be fixed.
                        Advisory means it must be known about but need
                        not be acted on.

                        Severity names the CONSEQUENCE of a finding.
                        Not its cause, not how certain it is, and not
                        whether it was reached deterministically or by
                        judgement.

                        An eval uses the same two values, saying what
                        follows from a verdict of UNMET.

                        Where the consequence genuinely changes with
                        something the caller asserts, the severity
                        changes with it. A caller asserting that the
                        paths given are complete turns an unresolved
                        reference from advisory into critical.
    origin:             written
    note:               |
                        Hand written: the decision stated.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_severity
        guid_target:    ddr_07bdf1fc22a842f7930f3e6bc2a10f30

  c77a6e289:
    id_self:            case_decision_stated.c77a6e289
    guid_self:          case_2880670b4c454a14897187fab175136e
    verdict:            unmet
    subject:            |
                        --- ddr_sch_identity_design_decision decision:
                        The sch_identity schema defines identity by
                        requiring two identifier fields: (1)
                        **guid_self**, an opaque, immutable GUID that
                        includes a type prefix followed by 32
                        lowercase hexadecimal digits; this serves as
                        the canonical globally unique identifier
                        assigned once at creation, and (2)
                        **id_self**, a human-readable identifier that
                        shares the same type prefix but does not
                        guarantee uniqueness or immutability, intended
                        for readability, tooling, and file naming in
                        standalone item files. Every data item that
                        needs to be addressable composes the
                        sch_identity trait to establish its identity.
                        Items that are describable or have rights
                        composition include additional schemas. The
                        presence of either id_self or guid_self
                        anywhere in a document declares the identity;
                        other identifier fields elsewhere refer only
                        to these declared identities. The schema
                        explicitly permits additional properties
                        alongside these identifiers.
    origin:             confirmed
    note:               |
                        The first workflow run: the schema reported
                        on.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      ddr_sch_identity_design_decision
        guid_target:    ddr_47219c063336401dbc083277e047e212

