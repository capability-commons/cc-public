title:                  Self contained
brief:                  |
                        Every noun in the statement names one definite
                        thing: no pronoun, no vague noun, the definite
                        article on what is defined, and no reliance on
                        a heading. Rules rule_s12_vague_nouns,
                        rule_r04_defined_terms,
                        rule_r05_definite_articles, rule_r24_pronouns,
                        rule_r25_headings.
criterion:              |
                        MET when every noun names one definite set of
                        things a reader can tell: which data, which
                        user, which output, and nothing in the
                        statement points outside it.

                        UNMET when a pronoun such as it, this, they,
                        its stands for a noun; when a noun names a set
                        that cannot be told, such as the data, the
                        user, the information, values, appropriate
                        resources, relevant systems, without saying
                        which; when an indefinite article makes any
                        one of what is meant where one definite thing
                        is meant, a user, a time display; or when a
                        section number or heading is needed to know
                        what the statement is about.

                        A word in Capitalised_Snake_Case, such as the
                        Subject or the Confirmed_Verdict, is a defined
                        term and is never vague. A noun written in
                        ordinary words is not at fault for being
                        ordinary: the enclosure of the hub, all
                        outputs, the primary power control name
                        definite things. The fault is a noun whose set
                        a reader cannot tell, not a noun that is not
                        in Capitalised_Snake_Case. An indefinite
                        article is not a fault where what follows
                        defines the thing: an accuracy of 1 meter, a
                        mass not exceeding 8 kilograms, an alert
                        having the characteristics defined in a named
                        standard, an Audible_Alarm. A named standard
                        or document, Alert_Standard xyz, ICD 12, is a
                        definite reference and not a fault.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose. The
                        statement is composed from the slots shown
                        beside it; where no slots are shown, judge the
                        statement alone.

                        When UNMET, quote the words at fault, ask the
                        question that would define them, and name the
                        rule by one of the ids above.
severity:               advisory

example:

  - input:              |
                        statement: At least 8 hours before the
                        Driver_Shift, the Controller shall send the
                        Driver_Itinerary to the Driver.
    verdict:            met
    feedback:           |
                        Every noun in full, in glossary form.

  - input:              |
                        statement: The controller shall send the
                        driver his itinerary. It shall be delivered at
                        least 8 hours prior to his shift.
    verdict:            unmet
    feedback:           |
                        His and it. rule_r24_pronouns.

  - input:              |
                        statement: The Aircraft shall provide a time
                        display.
    verdict:            unmet
    feedback:           |
                        A time display: any one.
                        rule_r05_definite_articles.

  - input:              |
                        statement: 4.1 The Aircraft shall sound it for
                        greater than 20 minutes.
    verdict:            unmet
    feedback:           |
                        It needs the heading. rule_r25_headings.

  - input:              |
                        statement: The Battery_Hub shall limit the
                        mass of the enclosure and electronics to no
                        more than 8 kilograms.
    verdict:            met
    feedback:           |
                        Ordinary words naming definite things: the
                        enclosure, the electronics, one mass.

  - input:              |
                        statement: The Library_System shall display
                        the data to the user.
    verdict:            unmet
    feedback:           |
                        Which data, which user. rule_s12_vague_nouns.

  - input:              |
                        statement: If the Screening_Judgement of the
                        Subject is unmet, the Judge shall report the
                        Confirmed_Verdict of the Subject.
    verdict:            met
    feedback:           |
                        Every noun is a defined term; the Subject is
                        the one under judgement.

