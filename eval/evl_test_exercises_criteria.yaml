title:                  A test exercises the criteria
brief:                  |
                        The test that verifies a requirement would
                        fail if what the requirement requires were
                        untrue.
criterion:              |
                        You are given the success criteria of a
                        requirement, the source of the test that
                        verifies it, and under module the imports and
                        module level values that source refers to.

                        Read the module before deciding that a name is
                        unknown. A constant or a table built as the
                        module loads is there and not in the test.

                        MET when the test exercises what the criteria
                        require: for each thing the criteria say
                        verification must show, the test would fail if
                        that thing were untrue.

                        UNMET when the test could pass while something
                        the criteria require is untrue. Say which part
                        of the criteria nothing in the test would
                        catch.

                        A test may do more than the criteria ask, and
                        that is not a fault. It is the other direction
                        that matters: a criterion nothing in the test
                        would catch.

                        Judge what the test would catch, not how it is
                        written. A test that reaches the same thing by
                        a different route than the criteria describe
                        still catches it.
severity:               advisory

example:

  - input:              "CRITERIA \"A path is reported between two items where one exists, and its absence is reported where none does.\" TEST \"def test_path(...): assert db.path('a', 'd') == ['a', 'b', 'd']; assert db.path('a', 'z') is None\""
    verdict:            met
    feedback:           'Both halves of the criteria are caught: a path where one exists, and the absence where none does.'

  - input:              "CRITERIA \"A path is reported between two items where one exists, and its absence is reported where none does.\" TEST \"def test_path(...): assert db.path('a', 'd') == ['a', 'b', 'd']\""
    verdict:            unmet
    feedback:           Nothing in the test would catch the second half. Were the absence of a path reported as an empty list, or as a path of length zero, this test would still pass.

  - input:              'CRITERIA "The printer writes each byte of the first pass unchanged on the second." TEST "def test_printer(...): once = layout(text); twice = layout(once); assert once == twice"'
    verdict:            met
    feedback:           The fixpoint the criteria describe is exactly what the assertion catches.

note:                   |
                        Anchored on r_verifies, so the judge is shown
                        the requirement it points at and the source of
                        the test that points at it. Without the source
                        it would judge prose about a test rather than
                        the test, which is the mistake
                        evl_record_and_code_agree was anchored to
                        avoid.

                        This is the coverage analysis DO-178C asks for
                        and nothing here did: that verification
                        exercises the requirement was inferred from
                        the verification existing. It is advisory and
                        unmeasured, so it reports and does not gate
                        until someone runs cctool measure against it.

                        Narrowed to a python test function after the
                        first run, then widened again once a case
                        could show the code it stands for. A test case
                        carries no source of its own, so the first run
                        gave the judge the case prose and no code, and
                        every one of the six such pairs came back
                        unmet on five judgements of five. Two said so
                        outright: no information about the actual test
                        is given. A hundred per cent unmet on one kind
                        of subject was a defect in what the judge was
                        shown, not a finding about the tests. The
                        projection now follows r_is_implemented_by
                        from a case to the function that automates it.

                        Measured at a false negative of a fifth and
                        unanimity of 0.857, and both unstable cases
                        turned on something outside the definition:
                        FILES at module level for the printer, a
                        fixture for the walk. The projection now
                        carries the module level statements beside the
                        definition, so the digest has moved and the
                        confidence recorded before it is stale.

