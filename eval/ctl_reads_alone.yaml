    verdict:            met
    subject:            |
                        as rendered:
                          --- t_observation
                          description:
                          An observation data item is a record of one
                          public source, kept as it was captured. The
                          record holds the content of the source, a
                          locator that finds the source, and the
                          attribution as the source gives it. It also
                          holds the date the source was published, the
                          date it was observed, the method of capture,
                          and a digest that names the exact content
                          captured. An observation does not interpret
                          the source. Interpretation belongs to a need
                          derived from the observation, and the evidence
                          field of that need says what the observation
                          supports.
    origin:             written
    note:               |
                        Accepted by the user in the round 4 / batch 1
                        loop of 2026-09-12.

    relation:

      - id_relation:    r_is_snapshot_of
