                        pyf_test.test_query.test_a_named_query_runs_over_the_facts
                        title: A named query runs over the facts

                        brief: A named query runs over the facts.

                        source: def
                        test_a_named_query_runs_over_the_facts(tree,
                        tmp_path):
                            """
                            ---

                            id_self:                pyf_test.test_query.test_a_named_query_runs_over_the_facts
                            guid_self:              pyf_20cb93a9f39946938572d2a437f82758
