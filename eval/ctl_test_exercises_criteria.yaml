    subject:            |
                        as rendered:
                          --- pyf_test.test_layout.test_printer_preserves_and_is_fixpoint
                          title:
                          The printer preserves content and is a fixpoint

                          brief:
                          The printer preserves content and is a
                          fixpoint.

                          source:
                          @pytest.mark.parametrize('filepath', FILES, ids = lambda p: p.name)
                          def test_printer_preserves_and_is_fixpoint(filepath):
                              """
                              ---

                              id_self:                pyf_test.test_layout.test_printer_preserves_and_is_fixpoint
                              guid_self:              pyf_8b8d9a067006402c93ea0f801153b299
                              copyright:              Copyright 2026 William Payne
                              license:                Apache-2.0

                              protective_mark:

                                - id_mark:            mark_public
                                  guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

                              title:                  The printer preserves content and is a fixpoint
                              brief:                  |
                                                      The printer preserves content and is a
                                                      fixpoint.
                              description:            |
                                                      For every structured file in the tree, lays it
                                                      out and asserts the content is unchanged
                                                      scalar for scalar and that laying the result
                                                      out again changes nothing.

                              relation:

                                - id_relation:        r_verifies
                                  guid_relation:      r_490096e908d1444cb0defb530fcf7786
                                  id_target:          req_printer_idempotent
                                  guid_target:        req_28a87e8cfef7443f90fb70372e7c47e8

                              ...
                              """

                              source = filepath.read_text(encoding = 'utf-8')
                              out    = cc_public.layout.format_source(source, filepath.suffix)

                              assert cc_public.layout.format_source(out, filepath.suffix) == out

                              if filepath.suffix == '.yaml':
                                  assert shape(RT.load(out)) == shape(RT.load(source))
                              else:
                                  assert code_of(out) == code_of(source)
                                  assert documents_of(out) == documents_of(source)

                              def count_comment(text):
                                  return sum(line.lstrip().startswith('#') for line in text.splitlines())
                              assert count_comment(out) == count_comment(source)

                          module:
                          import ast
                          import pathlib
                          import pytest
                          import ruamel.yaml
                          import ruamel.yaml.scalarstring
                          import cc_public.check
                          import cc_public.layout
                          import cc_public.load.python
                          ROOT = pathlib.Path(__file__).resolve().parent.parent
                          RT   = ruamel.yaml.YAML(typ = 'rt')
                          FILES = sorted(p for p in set(cc_public.check.iter_filepath_all([ROOT]))
                                           if p.suffix in ('.yaml', '.py'))

                          --- req_printer_idempotent
                          title:
                          Printer is idempotent

                          success_criteria:
                          Every YAML file and every docstring document
                          in the repository, laid out twice, is byte
                          identical after the first pass.
    origin:             confirmed
    note:               |
                        Held unmet, flipped to met while narrowing the
                        criterion, and flipped back on reading the
                        criteria again. The criteria say every YAML
                        file and every docstring document in the
                        repository. The test is parametrised over what
                        iter_filepath_all finds, so the helper
                        supplies the word every, and what the test
                        asserts is every file the helper found. That
                        is not a helper called for convenience, which
                        the narrowed criterion excuses; it is the
                        quantifier. The judge read it unmet five of
                        five with the narrowing in place, and it was
                        right. ddr_tool_verification records what
                        follows.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      pyf_test.test_layout.test_printer_preserves_and_is_fixpoint
        guid_target:    pyf_8b8d9a067006402c93ea0f801153b299

      - id_relation:    r_is_snapshot_of
