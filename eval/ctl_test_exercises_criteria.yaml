                          import cc_public.facts
                          import cc_public.query
                          import cc_public.testing
                          from conftest import DEFAULTS

                          --- req_unreferenced_items_listed
                          title:
                          Items nothing points at are listed

                          success_criteria:
                          An Item made with no Relation_Edge pointing at
                          it and no holder appears in the list, and
                          disappears from it once one Relation_Edge
                          points at it.
    origin:             written
    note:               |
                        Read the test against the criteria. It makes
                        an item nothing points at, asserts it is
                        listed and was not before, points at it, and
                        asserts it is gone. That is both halves of the
                        criteria, appearance and disappearance, and no
                        finding was raised on it. Held met so that a
                        false positive is measured against more than
                        one case.

