title:                  Evidence is described
brief:                  |
                        The evidence of a need describes what was
                        observed, reported, requested or measured,
                        with sources named and quantities where known,
                        rather than asserting that evidence exists.
criterion:              |
                        MET when the evidence says who observed or
                        reported what, when, and how it bears on the
                        subject, outcome, purpose and context; or says
                        plainly that evidence is lacking and what
                        would substantiate the need.

                        UNMET when the evidence asserts instead of
                        describing, such as this is widely known, the
                        need is obvious, strong evidence exists, many
                        people say so, it is urgently needed; or when
                        the popularity of a product stands in for
                        evidence of the gap.

                        Each subject opens with a label line: three
                        hyphens and the item's id, then the fields by
                        name. Labels are presentation, not prose.

                        When UNMET, quote the words at fault.
severity:               advisory

example:

  - input:              |
                        evidence: Ministry reporting shows rapid
                        growth in unmanned ground vehicle missions,
                        while separate frontline reporting repeatedly
                        describes personnel exposure during resupply
                        and casualty evacuation.
    verdict:            met
    feedback:           |
                        Sources, what they show, and how it bears.

  - input:              |
                        evidence: This is widely known and urgently
                        needed.
    verdict:            unmet
    feedback:           |
                        An assertion. Quote: widely known.

  - input:              |
                        evidence: Direct evidence is lacking; a survey
                        of evacuation teams in two brigades would
                        substantiate the need.
    verdict:            met
    feedback:           |
                        Says what is missing and what would do.

  - input:              |
                        evidence: Thousands of units have asked for
                        Product X.
    verdict:            unmet
    feedback:           |
                        Popularity of a product, not the gap behind
                        it.

