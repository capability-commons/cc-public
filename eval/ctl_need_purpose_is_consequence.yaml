    verdict:            met
    subject:            |
                        ---
                        need_gps_denied_unmanned_swarm_coordination
                        outcome: Reliable coordinated navigation for
                        five or more unmanned aerial or ground
                        platforms at once, keeping the intended
                        formation, avoiding collisions with teammates
                        and obstacles, and operating on local
                        peer-to-peer communication alone without
                        continuous GNSS or external command links

                        purpose: Enable multi-platform unmanned
                        missions when satellite navigation and
                        operator links are contested, reduce collision
                        risk in dense or urban terrain, preserve
                        formation cohesion for coordinated effects,
                        and limit dependence on centralised control
                        that fails under jamming
    origin:             written
    note:               |
                        A need written to the schema; purpose as it
                        stands.
