    verdict:            met
    subject:            |
                        --- need_reliable_uav_icing_status_assessment
                        outcome: Reliable onboard assessment of
                        unmanned-aircraft icing risk and ice-accretion
                        status across varied operating conditions,
                        sufficient to inform launch, continue-flight,
                        mitigation or abort decisions before icing
                        causes sensor failure or vehicle loss

                        purpose: Reduce winter and humid-weather
                        sortie losses from undetected icing, preserve
                        airspeed, control and sensor integrity, let
                        operators tell icing from other failures, and
                        extend the usable weather envelope of unmanned
                        systems that now stay grounded in marginal
                        conditions
    origin:             written
    note:               |
                        A need written to the schema; purpose as it
