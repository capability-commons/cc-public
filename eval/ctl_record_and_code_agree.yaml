  c4ca446cd:
    id_self:            case_record_and_code_agree.c4ca446cd
    guid_self:          case_d77324bf628f4d899ea9d0dea79009ef
    verdict:            met
    subject:            |
                        --- ddr_fail_closed decision: One function,
                        refusal in the check package, says why a
                        report cannot be acted on: an error in the
                        analysis always, a critical finding unless a
                        checkpoint is asked for, an advisory never.
                        The committer and the executor's gate after
                        every node ask it and nothing else. A refusal
                        for an error is not overridden by a
                        checkpoint, because a checkpoint records a
                        known state and an incomplete analysis is not
                        one.

                        An editable tree refuses to be built where any
                        root is missing or any file failed to load,
                        naming the files. A file that loads and fails
                        its schema is still editable: a skeleton made
                        by new is meant to be filled over several
                        commands.

                        What a new item is given is read from the
                        pyproject.toml at or above the tree's root,
                        asked of the tree. The first root given owns
                        new files. Where the command is run from says
                        nothing.

                        --- pyf_cc_public.check.refusal source: def
                        refusal(report, is_checkpoint = False):
                            """
                            ---

                            id_self:                pyf_cc_public.check.refusal
                            guid_self:              pyf_1837aeb3fd5340beb2dbceb63ff0c537
                            copyright:              Copyright 2026 William Payne
                            license:                Apache-2.0

                            protective_mark:

                              - id_mark:            mark_public
                                guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

                            title:                  Refusal
                            brief:                  |
                                                    Return the Refusal a caller acting on this
                                                    report must stop for, or None where the report
                                                    may be acted on.
                            description:            |
                                                    The one place the policy lives, so that the
                                                    committer, the executor and the gate cannot
                                                    disagree about it. An analysis that failed to
                                                    run refuses always: no claim about the data
                                                    can be made from a report that did not look at
                                                    all of it, and a checkpoint, which records a
                                                    known nonconformity, does not cover an unknown
                                                    one. A critical finding refuses unless a
                                                    checkpoint is asked for. Advisories never
                                                    refuse.
                            relation:               []

                            ...
                            """

                            inner = report['report']

                            if inner['error']:
                                return Refusal(STATUS_ERR, len(inner['error']),
                                               '{id_check}: {message}'.format(
                                                            id_check = inner['error'][0]['id_check'],
                                                            message  = inner['error'][0]['message']))

                            if inner['summary']['count_critical'] and not is_checkpoint:
                                first = next(n['message'] for c in inner['check']
                                                          for n in c['nonconformity']
                                                          if n['severity'] == check_result.SEVERITY_CRITICAL)
                                return Refusal(STATUS_BAD, inner['summary']['count_critical'], first)

                            return None
    origin:             written
    note:               |
                        The decision and the function as they are:
                        errors refuse always, critical findings refuse
                        unless a checkpoint, advisories never.

    relation:

      - id_relation:    r_is_snapshot_of
        guid_relation:  r_b4a1513442114ceca64daf2d1090c5fb
        id_target:      pyf_cc_public.check.refusal
        guid_target:    pyf_1837aeb3fd5340beb2dbceb63ff0c537

