title:                  Conditions explicit
brief:                  |
                        The condition under which the obligation
                        applies is stated as the opening clause, and
                        what follows the object is performance or
                        manner in its own place. Rules
                        rule_r11_separate_clauses,
                        rule_r27_explicit_conditions,
                        rule_s17_incomplete_conditions.
criterion:              |
                        MET when the statement either applies at all
                        times and says nothing conditional, or opens
                        with the trigger, state or period under which
                        the obligation applies, with the main verb
                        beside its object and the performance after.

                        UNMET when the obligation plainly applies only
                        under a trigger or state the statement does
                        not open with, as an unlock, an alarm or a
                        message that waits on an event does; when a
                        condition is wedged between the verb and its
                        object so that it is unclear what it
                        qualifies; or when a condition is stated and
                        the statement leaves the other case, the
                        condition not holding, to another requirement
                        that would need writing.

                        A condition decides whether the obligation
                        applies at all. A phrase after the object that
                        says how well, how, by what means or to what
                        measure, within 5 minutes, without tools, for
                        the current load, at 10 000 lux, is
                        performance or manner, is in its own place,
                        and is not a condition. A place or a recipient
                        after the object, to each Maritime_User, in
                        Harbor_Approach, says to whom or where, not
                        when, and is not a condition either.

                        Wedged means standing between the verb and the
                        noun it acts on.

                        The subject opens with a label line: three
                        hyphens, the item's id, and a field name.
                        Labels are presentation, not prose. The
                        statement is composed from the slots shown
                        beside it; where no slots are shown, judge the
                        statement alone.

                        When UNMET, quote the words at fault and name
                        the rule by one of the ids above.
severity:               advisory

example:

  - input:              |
                        statement: In the event of Fire_Detection, the
                        Fire_Control_Subsystem shall set the
                        Free_Access_Mode to ON within 500
                        milliseconds.
    verdict:            met
    feedback:           |
                        Trigger stated first, action, then
                        performance.

  - input:              |
                        statement: The Free_Access_Mode shall be set
                        to ON within 500 milliseconds.
    verdict:            unmet
    feedback:           |
                        Set when. rule_r27_explicit_conditions.

  - input:              |
                        statement: The Navigation_Beacon shall provide
                        Augmentation_Data at an accuracy of less than
                        or equal to 20 meters to each Maritime_User
                        during Harbor_Approach.
    verdict:            unmet
    feedback:           |
                        Accuracy wedged between verb and object.
                        rule_r11_separate_clauses.

  - input:              |
                        statement: The Operation_Logger shall record
                        each Warning_Message.
    verdict:            met
    feedback:           |
                        Applies at all times; nothing conditional is
                        implied.

  - input:              |
                        statement: The Battery_Hub shall connect up to
                        eight Battery_Modules within 5 minutes without
                        tools. qualifier: within 5 minutes without
                        tools
    verdict:            met
    feedback:           |
                        Performance and manner after the object, in
                        their own place; nothing conditional is
                        implied.

  - input:              |
                        statement: If a Library_Item is not reserved,
                        the Library_System shall continue the Loan.
                        condition_kind: logic condition: a
                        Library_Item is not reserved
    verdict:            unmet
    feedback:           |
                        The other case, the item reserved, is left
                        unwritten. rule_s17_incomplete_conditions.

  - input:              |
                        statement: The Alarm_Unit shall sound the
                        Evacuation_Tone for 30 seconds.
    verdict:            unmet
    feedback:           |
                        Sounded when? An evacuation tone waits on an
                        event, and the trigger is missing.
                        rule_r27_explicit_conditions.

  - input:              |
                        statement: The Beacon shall send the
                        Position_Report to each Vessel in the
                        Approach_Zone at an interval of 10 seconds.
    verdict:            met
    feedback:           |
                        To whom, where and how often follow the
                        object; nothing conditional is implied.

