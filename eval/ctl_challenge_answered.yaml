  ca3d79413:
    id_self:            case_challenge_answered.ca3d79413
    guid_self:          case_e89e62d4ec294562b408951f4a3b9164
    verdict:            met
    subject:            |
                        --- ddr_decompose_frontline_power_dependency
                        decision: The need is decomposed into three
                        children. In frontline operations with
                        repeated attacks on infrastructure,
                        distributed frontline teams need local power
                        and charging that continues when grid power is
                        cut, in order to keep drones, jammers and
                        radios running. In frontline operations where
                        one satellite service carries most traffic,
                        the same teams need a second communications
                        path independent of that service, in order to
                        keep command and reconnaissance going through
                        an outage of the first. In frontline
                        operations under electronic warfare, the same
                        teams need control links to drones and remote
                        systems that hold under jamming, in order to
                        keep those systems in use. No entity is
                        chosen; each child is a need, not a
                        requirement.

                        challenge: The third child, control links that
                        hold under jamming, is not a need but a
                        solution direction: the need is to keep remote
                        systems in use under electronic warfare, and
                        control links are one way. A fibre tethered
                        system needs no link that jamming can reach.
                        If the child stands as written, the
                        decomposition forecloses the tether. The
                        assumption that jamming is continuous is also
                        taken from a paper on power, which says
                        jammers need power, not that jamming never
                        stops.

                        resolution: The first point stands and the
                        child is revised: the same teams need to keep
                        drones and remote systems in use under
                        electronic warfare, with the means open. The
                        second point is conceded in part: the
                        assumption is reworded to what the evidence
                        supports, that jammers run continuously on the
                        friendly side, and its evidence for the
                        hostile side is marked as lacking.
    origin:             written
    note:               |
                        The specimen: a specific challenge and a point
                        by point resolution. Both written by one
                        person, which the note records; a workflow run
                        has them from two models.
    relation:           []

