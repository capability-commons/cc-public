title:                  Three levels of disclosure, and navigation before inspection
brief:                  |
                        An item shows as a title, opens to its brief
                        beside what hangs off it, and is read in full
                        only when a reader asks. Navigating and
                        inspecting are different acts and do not share
                        a gesture.
context:                |
                        Every item inherits the same descriptive
                        envelope from sch_base: a title of one line, a
                        brief that states the thing, and a description
                        that gives the full account. The fields were
                        written to be read at different depths and
                        nothing yet reads them that way.

                        A surface that shows a whole record the moment
                        it opens makes the first step a wall. The
                        operational concept in the camera simulator
                        carries eight prose fields of a paragraph
                        each, five participants and three modes.
                        Anything hanging off it sits below all of
                        that, so the act of travelling through the
                        graph costs a page of reading each time.

                        The alternative usually reached for is a page
                        per item, which solves the wall and loses the
                        reader's place instead.
decision:               |
                        An item discloses at three levels.

                        As a ROW it shows its title. One line, which
                        never wraps, and is what a reader scans.

                        OPENED it shows its brief and whatever the
                        view hangs beneath it. This is enough to judge
                        whether to go further and no more.

                        READ it shows its description and the fields
                        its own type adds. This is a deliberate act
                        and not a step on the way to anywhere.

                        Travelling and reading are therefore separate.
                        Opening a row is cheap, shallow and
                        reversible, and a reader may pass through many
                        rows without reading one. Reading is where a
                        reader stops.

                        A position in the navigation tree is an item
                        and a level, not an item. The same item read
                        at its brief and read in full are two places,
                        and a reader may be at either.

                        An item whose type gives it no brief degrades
                        to what it has. Nothing here handles that case
                        and nothing needs to until a type arrives
                        without one.
rationale:              |
                        The three levels are the envelope rather than
                        an invention. title, brief and description
                        were written for progressive disclosure and
                        this is the first thing to use them as such,
                        so the rule needs no vocabulary of its own and
                        applies to every type including one a
                        federation adds later.

                        Opening shows the brief and the children
                        together because the reason to open is usually
                        to get somewhere. Putting the full record on
                        that path taxes every traversal for the
                        benefit of the few that end there.

                        Reading is a separate act because it is a
                        different intention. A reader who has arrived
                        wants the whole record and will not mind a
                        second gesture to get it, and a reader passing
                        through wants never to be given it.

                        A position is an item and a level because the
                        cursor has to be somewhere while a record is
                        being read, and because it is what makes the
                        navigation tree larger than the graph it is
                        drawn from.
alternative:            |
                        The whole record at the first expansion.
                        Rejected: the first step becomes a wall and
                        everything hanging off the item is pushed out
                        of sight, which is the fault this is here to
                        avoid.

                        A page for each item, reached by following a
                        link. Rejected: every inspection becomes a
                        navigation, and the reader loses the place
                        they were reading from. It is also what a text
                        editor already does by opening a file, and the
                        point is to do better than that.

                        Disclosure defined per type, so that each says
                        which of its fields belong at which level.
                        Rejected: every type then needs a rule, and a
                        type contributed by a federation member would
                        arrive without one. The envelope is common
                        ground and nothing else is.

                        Two levels, a row and the whole record.
                        Rejected: the brief is then either never shown
                        or shown in the row, and a row that carries a
                        paragraph stops being scannable.
consequence:            |
                        The brief carries more weight than it did. It
                        is what a reader sees while deciding whether
                        to go on, so a brief that restates the title
                        wastes the level.

                        An item with no brief, or with a description
                        and no title, reads poorly. That is accepted
                        rather than solved.

                        Embedded items such as the participants and
                        modes of an operational concept sit inside the
                        full record. Whether they are rows of their
                        own, with levels of their own, is not decided
                        here.

                        A reader who wants the whole of a long record
                        still gets the whole of it, in one piece,
                        which is what reading it means.
