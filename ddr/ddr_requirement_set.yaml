title:                  A requirement set is an item, and what a sentence cannot show is judged on it
brief:                  |
                        The requirements on one entity are gathered
                        into a requirement set item that includes them
                        by edge and is shown to a judge or a model
                        with its members as their composed statements.
                        A review workflow writes what the set covers,
                        class by class; the requirement check reports
                        a member on another entity, a duplicated
                        obligation, an unreviewed set and an uncovered
                        class; and a set eval judges consistency and
                        uniqueness across the members.
context:                |
                        Every check and eval so far judged one
                        requirement, and the faults the outside review
                        and the admissible claims position weigh most
                        are set faults: missing coverage of abnormal,
                        misuse, maintenance and deployment cases,
                        duplicates, contradictions, budgets that do
                        not close. INCOSE C10 to C14 and R30 and R36
                        are entered in the rule register and
                        implemented by nothing, since no set was an
                        item. SOPHIST S16 and S18, exceptions and
                        implicit assumptions, ask what other
                        requirement exists, which is a question on the
                        set. The demonstration holds a hundred and
                        forty-two requirements in six concepts and
                        nothing says what any six of them cover
                        together. A judge is shown one item, and a set
                        item holding only edges would show a judge a
                        list of ids.
decision:               |
                        A REQUIREMENT SET is a data item of type
                        t_requirement_set, held in requirement_set/,
                        naming its entity and including each member by
                        an r_includes edge. cctool gather makes one
                        from the requirements derived from a concept,
                        and adds to it what is new on a second gather.
                        Wherever a set is shown, to a judge by the
                        eval renderer or to a model by the producer,
                        its members are projected under member, one
                        line each, the id and the statement composed
                        from the member's slots; nothing of the
                        members is stored on the set.

                        COVERAGE is a table on the set with one entry
                        per scenario class, normal, abnormal, misuse,
                        maintenance, deployment, safety and budget,
                        each covered, uncovered or not applicable with
                        a note naming the members or the missing
                        obligation. wf_review_set, one model node,
                        writes it from the members. The requirement
                        check reports, as advisory, a member on
                        another entity, two members with one process
                        and one object, a set not yet reviewed, a
                        class the review passed over, and each class
                        left uncovered with the note the review wrote.

                        evl_set_consistent judges the set for
                        conflict, repetition and a thing under two
                        names, anchored on the set schema with entity
                        and member in its scope.
rationale:              |
                        Membership as edges rather than a query over
                        derivation, because what a decision baselines
                        is exactly these members at their digests, and
                        because a set may leave a derived requirement
                        out or take one from elsewhere.

                        Members projected rather than stored, on the
                        precedent of the composed statement and the
                        projected source: a copy drifts, a projection
                        cannot.

                        Coverage written by a model and reported by a
                        check, rather than judged by an eval, because
                        a class left uncovered is a question to the
                        author and the note is the question; the check
                        makes it a finding without a judgement, and
                        the seven classes are SOPHIST's and the
                        position's checklist.

                        Consistency judged by an eval, because a
                        conflict between two sentences is a reading no
                        substring finds; the duplicate of one process
                        and one object is found mechanically first so
                        that the judge is not asked what a comparison
                        can tell.
alternative:            |
                        The set as the concept, with the set-level
                        evals anchored on the candidate table.
                        Rejected: a concept is a proposal and a set is
                        what was admitted, and a set may span
                        concepts.

                        Members listed on the set as statements.
                        Rejected: a stored statement drifts from its
                        slots.

                        A coverage eval, MET or UNMET on the whole
                        checklist. Rejected: a binary verdict over
                        seven classes says which not, and the note is
                        the finding.

                        S16 and S18 as evals on the set. Deferred: the
                        coverage note asks the same questions, what
                        happens when the entity cannot and what is
                        assumed, and the answers are new requirements,
                        which is the review loop.
consequence:            |
                        The gather command, the review workflow, the
                        set checks and the set eval exist and are
                        tested with a scripted model: a set of ten
                        members gathered once, the members shown to
                        the judge and the producer as statements, the
                        checks reporting another entity and a
                        duplicate, and the review filling seven
                        entries of which one uncovered is reported
                        with its note.

                        The set eval carries examples and no control
                        cases yet; its cases are written from the
                        demonstration's sets and it is measured before
                        its findings are weighed.

                        The improvement loop, a sweep item aggregating
                        findings across runs and a proposal of a rule
                        from the recurring shapes, is the next step
                        and is not part of this decision.

