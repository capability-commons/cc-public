title:                  A case is written where a test is ambiguous, not everywhere
brief:                  |
                        A test case is written where one test function
                        verifies more than one requirement, and not
                        for every requirement; a case that states no
                        expectation is read as expecting the success
                        criteria of what it verifies.
context:                |
                        The test method, case, execution,
                        nonconformity report and evidence closure were
                        built to be tried, not kept unexamined. Seven
                        cases were written over a subset chosen to
                        spread across the tool: a shortest path, a
                        neighbourhood walk, a named query, the
                        printer's fixpoint and a run against its
                        budget. What they measured decides whether the
                        model is extended.

                        The conversion found what the direct trace
                        could not say. Five of the eleven test
                        functions that verify anything verify two
                        requirements each, so each stood as one
                        verifier for two obligations and recorded one
                        verdict for both. Two of the seven cases run
                        the same test function and expect different
                        things of it, which is the ambiguity made
                        visible.

                        It also found what the model charges for. A
                        case is forty six to fifty lines. Against the
                        success criteria of what it verifies, the
                        expectation a case states measured between a
                        quarter and two thirds the same words, so most
                        of a case that verifies an unambiguous
                        function is already written elsewhere. What is
                        not written elsewhere is the input and the
                        configuration.

                        Two representations of verification trace have
                        stood side by side while the model was tried,
                        and ddr_test_case left open which would be
                        kept.
decision:               |
                        The model is kept. A test method, a test case,
                        a test execution, a nonconformity report and
                        an evidence digest over the dependency closure
                        stay as they are.

                        A case is written where the content of the
                        verification must be read, reused or approved
                        outside the code that runs it. That is the
                        rule. The instances it covers are a method
                        that is not code, since inspection, analysis
                        and demonstration have no python function to
                        carry them; more than one case for one
                        requirement, where a normal, a boundary and an
                        error condition are separately expected, at
                        the criticalities whose register entry
                        requires it; reuse against more than one
                        implementation, which is why a case does not
                        name what it is run against; review by someone
                        who does not read the code; a tolerance, or a
                        vector held outside the repository; and a test
                        function that verifies more than one
                        requirement and is not divided.

                        A test function that verifies more than one
                        requirement is divided where dividing it is
                        trivial. Where it is not trivial, whether it
                        is divided, and whether a case is written for
                        each requirement it verifies, is what the
                        criticality register requires of the
                        criticality of those requirements. This record
                        does not restate what that register says, so
                        that the two cannot come to disagree.

                        Where one test function verifies one
                        requirement and nothing above applies, the
                        function's own trace stands and no case is
                        written. The success criteria of the
                        requirement are the expected result, so the
                        requirement and the function already state
                        between them what a case would state.

                        Both representations stand, and neither
                        outranks the other. A requirement is verified
                        where a case names it or a test function names
                        it. The projection reports what verifies a
                        requirement, of either kind, and reports a
                        requirement verified by both as verified by
                        both.

                        The expectation of a case is optional. A case
                        that states none expects the success criteria
                        of what it verifies, read when it is run.

                        A requirement is not refused acceptance
                        because the function verifying it verifies
                        another. The trace reports the pair, advisory
                        where the claim of the requirement is a design
                        choice and critical where it is evidential.
rationale:              |
                        Kept, because the ambiguity it exposes is the
                        failure it exists to prevent. Four functions
                        record one verdict against two requirements,
                        and no reading of the code shows which
                        requirement a pass was about.

                        The success criteria taken as the expected
                        result, because that is where every standard
                        consulted puts it and where this repository
                        already writes it: all seventeen requirements
                        carry them. A requirement and the one function
                        that verifies it are therefore a complete
                        specification of a case already, spread over
                        two items, and a case that adds only a
                        restatement of the criteria adds a second
                        thing to keep current and a second thing to
                        disagree with the first.

                        Division where it is trivial and not
                        otherwise, because the gain is small and
                        local: it localises a failure to one
                        obligation and no more. The orphans test
                        divides at its fifth statement for about six
                        lines, which is worth taking. A function whose
                        obligations are entangled costs far more to
                        divide and returns the same small thing, so
                        the criticality of what it verifies decides
                        whether that is worth paying.

                        The rule stated as the content that must leave
                        the code, because a shared function is one
                        instance of it and the narrowest. The seven
                        cases measured all ran the one method that
                        exists, so that evidence could not see a
                        method that is not code, several cases for one
                        requirement, or reuse against a second
                        implementation. A rule drawn only from what
                        the sample could see would be narrower than
                        the practice it governs.

                        Acceptance not refused, because every standard
                        consulted permits a shared activity and asks
                        only that the record and the expected result
                        be held for each requirement, which they are.
                        What a shared verdict costs lies elsewhere: an
                        assertion deleted from a shared function
                        leaves both requirements verified, passing and
                        current, and nothing here notices. The
                        advisory is for that.

                        Both representations kept, because choosing
                        one forces the other's work. Keeping only
                        cases means writing forty eight lines for
                        every requirement to say what its function
                        already says. Keeping only functions means the
                        ambiguity stays and a method that is not code
                        has nothing to carry it.

                        The expectation made optional rather than
                        removed, because a case over a function that
                        could not be divided has something of its own
                        to say and must be able to say it.

                        A case reaches further than a function into
                        what its verdict rests on. The closure of a
                        case covers the method and the adapter that
                        ran it; the closure of a function covers
                        neither, so evidence from a direct trace is
                        blind to a change in the harness that produced
                        it.

                        The method register carries its weight either
                        way: one method serves all seven cases, and
                        the adapter, the verdict rule and the version
                        discipline are written once rather than seven
                        times.
alternative:            |
                        Convert every requirement to a case. Rejected:
                        it costs about fifty lines each to restate
                        success criteria the requirement already
                        carries, and resolves no ambiguity where none
                        exists.

                        State the rule as an ambiguous function alone.
                        Rejected: that is one instance of it, and the
                        four instances the sample could not see are
                        the ones a case is least replaceable for.

                        Divide every function that verifies more than
                        one requirement. Rejected: the gain is the
                        localisation of a failure, which is small
                        where the function is intricate, and paying
                        for it everywhere is the undifferentiated
                        rigour ddr_criticality exists to end.

                        Refuse acceptance where a function verifies
                        more than one requirement. Rejected: no
                        standard consulted requires it, the pass is
                        sound because the function asserts both, and a
                        gate that refuses sound work is learned around
                        rather than satisfied.

                        Keep only part of the model, such as the case
                        without the method. Rejected: the method is
                        what the measurement most clearly justified,
                        since it is written once and read seven times.

                        Drop the direct trace from a test function, so
                        that a case is the only verifier. Rejected: it
                        is conversion of every requirement by another
                        route.

                        Keep the expectation required. Rejected: it is
                        measurably a restatement where one function
                        verifies one requirement.

                        Let a case outrank a function where both
                        verify a requirement. Rejected: it would make
                        adding a case silently withdraw evidence a
                        function had established, and there is no
                        reading under which one is the better
                        observation of the same run.
consequence:            |
                        sch_test_case must stop requiring expectation,
                        and the projection that composes what a case
                        expects must read the success criteria of what
                        it verifies where the case states none.
                        Neither change is made yet.

                        The trace projection and the evidence check
                        must each read a requirement verified by a
                        case and by a function at once, and report
                        both. That answers what ddr_icd_implementation
                        left open.

                        The trace must report a requirement whose
                        verifying function verifies another, advisory
                        by default and critical where the claim is
                        evidential. No such check exists, and every
                        requirement here claims a design choice today,
                        so the critical case is unreachable until an
                        evidential requirement is written.

                        Four test functions verify two requirements
                        each: an unmet screen confirmed a number of
                        times, a named query over the facts, a
                        shortest path or its absence, and what nothing
                        points at. Each is divided where that is
                        trivial, and otherwise left as it is until the
                        criticality register asks for more.

                        reg_test_method holds one entry, for a pytest
                        function. Until it holds a method that is not
                        code, the requirements that most need a case
                        cannot be given one, and inspection, analysis
                        and demonstration rest on an attestation by a
                        person.

                        A test that observes what a requirement lacks
                        must say what verifies it rather than infer it
                        from the shape of the tree it runs in. A test
                        tree holds no test/ and so holds no test
                        function, but it holds test_case/, because a
                        case is data. Five tests assumed the first and
                        were repaired by conftest.unverify.

                        Nothing here selects which objectives of an
                        external standard apply, because the model
                        carries no criticality.
                        ddr_verification_standard takes that up.

