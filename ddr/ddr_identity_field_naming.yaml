question:

  c2d539b51:
    id_self:            qst_identity_field_naming.c2d539b51
    guid_self:          qst_ab0a18a4614d430bbb62f2d06859271f
    question:           |
                        Whether a mapping will ever want two selves --
                        an item that is somehow two things at once.
                        The convention assumes not, and nothing so far
                        suggests otherwise, but the assumption is load
                        bearing and unstated elsewhere.
    relation:           []
