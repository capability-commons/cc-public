question:

  exemption:
    id_self:            qst_reader_burden.exemption
    guid_self:          qst_feaeae8ff3264e588498977d2b79c720
    question:           |
                        Where an exemption for a type lives when a
                        style rule binds to a field in a trait schema.
                        Composition can only narrow, so the design
                        decision and annotation types cannot relax it
                        in their own schema. Either the eval's scope
                        excludes them, or the binding is an annotation
                        the eval resolves with type precedence.
    relation:           []
