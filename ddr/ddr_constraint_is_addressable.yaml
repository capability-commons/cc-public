    guid_self:          qst_d81ac14bbc9d4335b366c480ae6eef8f
    question:           |
                        What records that a constraint has been
                        revisited and still holds, given that a
                        constraint lapses when its source changes, and
                        whether that is the decision stamp mechanism
                        or something of its own.
    relation:           []

