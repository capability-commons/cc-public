  unsourced:
    id_self:            qst_constraint_is_addressable.unsourced
    guid_self:          qst_ee3e8746f92541af8ebffc66872668b3
    question:           |
                        Whether a check should report a constraint
                        whose source names nothing a reader can reach,
                        inside the corpus or outside it, and whether
                        that is a check on the field or a judgement an
                        eval makes.
    relation:           []

