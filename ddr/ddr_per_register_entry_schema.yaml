  cbba08ad3:
    id_self:            qst_per_register_entry_schema.cbba08ad3
    guid_self:          qst_b44c5915e76944759f086c003214c95e
    question:           |
                        Whether an item naming its own schema should
                        be obliged to name one that composes the
                        schema its type names. Nothing checks that
                        today, so an item can escape its type's shape
                        entirely rather than narrow it.
