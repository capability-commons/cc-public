question:

  criterion:
    id_self:            qst_feedback.criterion
    guid_self:          qst_8e67445fa2c848d69057ea54cea50723
    question:           |
                        Whether a judgement carries the eval's
                        criterion text as well as the verdict and
                        reason, so that a node reading it knows the
                        rule and not only the finding, or whether
                        naming the eval is enough.
    relation:           []
