    question:           |
                        Whether a failed execution is recorded. A run
                        that exhausted its budget is a fact about the
                        workflow worth having, and is also the kind of
                        record that accumulates fastest.
    relation:           []

  cf062d06b:
    id_self:            qst_workflow_execution.cf062d06b
    guid_self:          qst_ecda6a638006405984fcf1629a4b2ec5
    question:           |
                        Whether an execution is where the verdicts
                        reached by evals belong, which is the question
                        ddr_eval_design leaves open about writing a
                        verdict back. A binding per pass gives each
                        verdict something to attach to.
    relation:           []

