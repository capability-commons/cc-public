title:                  Definition and execution
brief:                  |
                        A workflow definition names ports and does not
                        change. An execution runs it under one
                        deployment and binds each port, on each pass,
                        to the item that filled it. The bindings are
                        where an item's provenance is read.
context:                |
                        A graph whose ports name particular items can
                        be run once. Running it again means editing
                        it, and a definition edited for every run is
                        not a definition.

                        Separately, nothing in the system records
                        where an item came from. r_decides says which
                        record settles an item. Nothing says which
                        process produced it, or from what.

                        ddr_eval_design leaves open how a stale
                        verdict is told from a current one, and
                        observes that it wants a content identifier
                        that does not yet exist. Staleness of anything
                        derived wants the same thing.

                        An earlier draft bound ports by dot path
                        alone. A path is not stable under rename, and
                        a renamed node would have broken the
                        provenance of everything it ever produced.
                        This draft supersedes it.
decision:               |
                        A workflow definition names PORTS. A port says
                        what kind of item belongs there, not which
                        item.

                        An EXECUTION is a data item. It names the
                        deployment it ran under, by an r_ran_under
                        edge, and through that deployment the
                        definition. It records nothing about machinery
                        itself.

                        A BINDING is a reified reference, per
                        ddr_qualified_reference: an entry with an
                        identity of its own, naming the node and the
                        port by guid and readable id, carrying the
                        pass number, and holding an r_binds edge to
                        the item that filled the port. Bindings are
                        held in a keyed table on the execution.

                        A port bound on several passes of a cycle has
                        several bindings, one per pass. The last is
                        what the run settled on. The bindings are the
                        derivation record. Where an item came from is
                        read from the bindings that name it on an
                        output port.

                        A PASS of a node is one run of it. A back edge
                        whose guard is met by the verdicts on its
                        source port binds what it carries to its
                        target and puts the nodes from the target to
                        the source back on the queue. The budget on
                        the deployment is the most passes any one node
                        may take, so each node does its one task as
                        well as the budget allows before what it made
                        goes on. A back edge met when its target has
                        no budget left is exhausted: the run goes on
                        without it and the execution says so. An
                        output port that revises an optional input
                        finds nothing there on the first pass and
                        makes an item; on later passes it revises that
                        item in place, so a loop carries one item
                        round, not one per pass.

                        An execution records what happened and is not
                        edited afterwards.
rationale:              |
                        Ports rather than items is what makes a
                        definition reusable, which is the whole reason
                        for writing one down.

                        A binding as a reified entry rather than a
                        path and a guid, because provenance is the one
                        record that must not dangle. The node and the
                        port are named by guid, so a rename changes
                        nothing that the binding depends on. The item
                        is named by an edge, so the reference check
                        confirms it exists and the walk from item to
                        execution is a walk over edges like any other.
                        That costs an identity per binding, and
                        ddr_qualified_reference records why that is
                        the right price.

                        One binding per pass rather than one per port,
                        because a record of the last pass explains
                        nothing about how it was reached, and a
                        cycle's whole purpose is the passes. The
                        growth is bounded by the deployment's budget,
                        so it cannot run away.

                        Machinery read from the deployment rather than
                        repeated, because one fact in two places is
                        one more than can be kept in step. An
                        execution that runs under a deployment has
                        said everything about machinery that there is
                        to say.

                        Making an execution an item rather than engine
                        state is what lets provenance cross the
                        federation. A partner who cannot run a
                        workflow type can still read that an item was
                        produced at a named port of a named node, on a
                        named pass, from named inputs, under a named
                        deployment, and can hold that against their
                        own records.

                        Provenance is also what incremental work
                        needs. An item is stale when something it
                        derives from has changed, and derivation is
                        exactly what a binding records. That the
                        change itself cannot yet be detected, for want
                        of a content identifier, is a gap somewhere
                        else and not a reason to leave derivation
                        unrecorded.

                        Not edited afterwards, because an execution is
                        a claim about the past. A record of what
                        happened that can be revised afterwards is a
                        record of nothing.
alternative:            |
                        Definitions naming items directly. Rejected:
                        the definition is then good for one run.

                        Bindings by dot path alone, which was the
                        decision here before this draft. Rejected: it
                        dangles on rename, and nothing checks that the
                        item exists.

                        Binding edges rather than ports. Rejected: an
                        edge carries no identity, by
                        ddr_dataflow_workflow, so there is nothing to
                        bind against.

                        One binding per port recording the final item
                        only. Rejected: it discards the passes, which
                        are what a cycle is.

                        Machinery recorded on the execution as well as
                        on the deployment. Rejected: two records of
                        one fact.

                        Execution held as engine state rather than as
                        an item. Rejected: provenance would not travel
                        and could not be checked.

                        An execution amended as a cycle iterates.
                        Rejected: iteration is not a change to what
                        happened, and a record rewritten in place
                        cannot be trusted about anything.
consequence:            |
                        Three item types where a naive design has one
                        -- definition, deployment, execution -- and
                        every run leaves a record. A repository that
                        runs workflows accumulates executions faster
                        than it accumulates anything else, and each
                        execution carries a binding per port per pass.

                        Provenance is queryable without an engine.
                        What produced this, at which port, on which
                        pass, from what, under what deployment, is a
                        walk over items and edges, and every step of
                        it is checked by the reference check.

                        Whether an input has changed since a binding
                        named it is a question for the history: the
                        input's last changing commit against the
                        commit that holds the execution, as
                        ddr_commit_record records. Nothing yet asks
                        it.

                        A binding is addressable. Where a verdict is
                        eventually written back as an item, the
                        binding it judged is something it can point
                        at.

                        Because an execution is not edited afterwards,
                        what it names may go: a node deleted from its
                        workflow, a port renamed away. The reference
                        check reports a reference from an execution
                        that no longer resolves as a note, not a
                        nonconformity. History is allowed to name what
                        has gone.

