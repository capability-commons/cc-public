  c1e5cc548:
    id_self:            qst_workflow_transform.c1e5cc548
    guid_self:          qst_987faa4d51f24510befc810f3706909d
    question:           |
                        Whether a derived workflow should name the
                        base it came from directly, by a relation of
                        its own, or only through the execution that
                        derived it. The second is sufficient and the
                        first is faster to read.
    relation:           []

