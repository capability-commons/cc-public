  cbb3d4e12:
    id_self:            qst_type_is_immutable.cbb3d4e12
    guid_self:          qst_2726f3458c104d588ae2bf59c19cb54a
    question:           |
                        What a federation does when two repositories
                        independently allocate the same prefix to
                        different types. The guid distinguishes the
                        items, but the prefix no longer distinguishes
                        the types, and nothing yet says which
                        allocation wins.
    relation:           []
