    guid_self:          qst_a6ef65ff56e34a7190d9d0f5571e9342
    question:           |
                        What a commit record should say when a schema
                        it was validated against has since changed,
                        and whether cctool log should report a record
                        that was valid when made and is not now as a
                        fault or as history.
