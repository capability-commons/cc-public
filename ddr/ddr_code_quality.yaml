title:                  Code quality gates
brief:                  |
                        The tool's code is held to a linter now, with
                        complexity and size thresholds recorded as a
                        baseline to ratchet down, and coverage and
                        traceability to requirements to follow.
context:                |
                        The tool has grown to nine thousand lines
                        across forty five modules, written quickly and
                        checked only by its tests and by the data
                        checks it runs on the repository. A review by
                        another model found faults in it. The first
                        run of a linter found two real defects: a
                        function naming two identifiers that did not
                        exist, unreachable until it was not, and
                        closures in the executor capturing loop
                        variables. The rest was style, unused names,
                        and size.
decision:               |
                        Ruff is the linter, run by pixi run lint over
                        src and test, configured in pyproject.toml.
                        The rule families are errors, warnings,
                        pyflakes, bugbear, mccabe, naming, pylint,
                        pyupgrade, simplify, return, arguments,
                        security, datetime and the modern idiom sets.
                        Rules that would fight the house style are
                        off: format rather than f-strings, lazy
                        imports that keep an optional dependency
                        optional, literals beside their comparisons,
                        exceptions named Error and a thing, protocol
                        methods that take what the protocol says, and
                        subprocess running git by name. Tests may
                        assert and may run long.

                        The complexity and size thresholds are set to
                        the maxima measured on 2026-09-05 once the
                        executor and the edit commands had been
                        decomposed: cyclomatic complexity 11, nine
                        arguments, twelve branches, fifty statements.
                        They began the day at 21, 11, 23 and 64. They
                        are a baseline, not a target. Each is
                        ratcheted down as the functions above it are
                        simplified, never raised.

                        cctool commit runs the linter where the tree
                        configures one, which this tree does, and
                        refuses on a finding as it does on a critical
                        one: unless a checkpoint is asked for. A
                        configured linter that cannot be run refuses
                        always. A tree with no linter configured is
                        data alone and is not linted.

                        Two tasks say what passing means. pixi run
                        check reports and never fails on a finding,
                        which is what an agent reading the report
                        wants. pixi run gate is what a pipeline wants:
                        the checks with the world closed and failing
                        on a critical finding, the lint, and the tests
                        with a coverage floor. The floor is the
                        coverage as measured when it was set, in
                        pyproject.toml, and is ratcheted up as the
                        thresholds are ratcheted down, never lowered.
                        A workflow on GitHub runs the gate on every
                        push, on macOS and on Linux.

                        A test names the requirement it verifies by an
                        r_verifies edge on the test module's document,
                        which every test module carries as any item
                        does; the relation runs from a python module
                        to a requirement. The trace check reports, as
                        advisory, a requirement verified by test that
                        no test names. A function will name its own
                        requirement when functions are items.
rationale:              |
                        One linter rather than several, because ruff
                        carries the rule sets of the others and runs
                        in a second. Configured against the house
                        style rather than the house style bent to it,
                        because the style is decided and the layout of
                        YAML and code is meant to read the same.
                        Thresholds at the measured maxima, because a
                        gate that fails on day one is switched off; a
                        gate that passes and tightens is kept.

                        The commit refuses on lint now rather than
                        later, because the thresholds sit at the
                        measured maxima: every function already
                        passes, so a refusal today can only be about a
                        new fault, which is the condition the earlier
                        draft of this record waited for. Two tasks
                        rather than one flag, because a command named
                        as a gate must not return success on a
                        critical finding, and the report-oriented
                        default is worth keeping for the agent.

                        An edge on the module's document rather than a
                        pytest marker or a naming convention, because
                        the module is already an item and an edge is
                        what the trace check and the relation check
                        already read; a marker would be a second
                        traceability mechanism, checkable only by
                        importing the tests. Module grain for now,
                        because a function is not yet an item; the
                        edge moves down when it is.
alternative:            |
                        Reformatting the code with ruff format.
                        Rejected: the house style aligns values in
                        columns, which the formatter would undo, and
                        the layout decision says code beneath a
                        docstring is not mechanised.

                        Thresholds at the conventional defaults with
                        the offenders marked as exceptions. Rejected:
                        a marked exception is a fault made permanent;
                        a baseline that ratchets is a fault with a
                        date.
consequence:            |
                        The executor is two modules, one that
                        schedules and one that materialises, with what
                        a run carries from node to node held in one
                        state rather than passed as eleven arguments.
                        insert, rename, new and the run report writer
                        are each split into the steps they take. Three
                        functions sit at complexity 11, one above the
                        conventional ten; the next ratchet is theirs.

                        Coverage is next after that: measured,
                        recorded, and a floor set at what it is. Then
                        traceability from tests to requirements: a
                        test names the requirement it verifies, and
                        the trace check reports a requirement no test
                        verifies.

