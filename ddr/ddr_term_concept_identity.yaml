    guid_self:          qst_9cafd7db00b54cbc998fd0065d8773bd
    question:           |
                        How a grounded occurrence records its
                        location, literal surface form, selected term
                        identity and provenance without making
                        ordinary prose hard to read or making
                        annotations fail after an edit.
