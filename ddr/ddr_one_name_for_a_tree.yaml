question:

  scope:
    id_self:            qst_one_name_for_a_tree.scope
    guid_self:          qst_42318947fd89436e8632a0015f4d0c5d
    question:           |
                        Whether the first root should bound what check
                        and format act on, as it bounds what new
                        writes and what commit commits, given that a
                        consumer's gate today reports the core's
                        findings beside its own and that format given
                        both trees would lay out a tree the consumer
                        does not own.
    relation:           []
