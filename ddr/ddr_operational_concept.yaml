question:

  participant:
    id_self:            qst_operational_concept.participant
    guid_self:          qst_aaccbdc646c34818828061538ff5eb76
    question:           |
                        Whether an operational participant carries an
                        identity of its own, which would let a
                        scenario name one by reference instead of in
                        prose, and whether that is worth a type and a
                        prefix before anything asks for it.
    relation:           []

  step:
    id_self:            qst_operational_concept.step
    guid_self:          qst_d5b3ceb8dfa94052ba242af2cdf14fc9
    question:           |
                        Whether a scenario step carries an identity,
                        which would let a requirement derive from one
                        step rather than from the whole episode, and
                        whether an actor and an action written apart
                        would be worth more than one line.
    relation:           []

  unit_or_counts:
    id_self:            qst_operational_concept.unit_or_counts
    guid_self:          qst_dda73c321e014872b07ed70b225304fd
    question:           |
                        Whether a check should hold a measure to
                        naming either a unit or the thing it counts,
                        as the requirement statement check already
                        holds a number, and where that check belongs.
    relation:           []

  coverage_class:
    id_self:            qst_operational_concept.coverage_class
    guid_self:          qst_4443beafc36c444fa9824fe34b6c8846
    question:           |
                        How the scenario kinds here and the coverage
                        classes a requirement set is reviewed for are
                        reconciled: whether the classes become the
                        kinds, whether safety and budget become a
                        separate cross-cutting dimension, and what
                        happens to the sets already reviewed.
    relation:           []

  key_performance_parameter:
    id_self:            qst_operational_concept.key_performance_parameter
    guid_self:          qst_c00dd972fe8a43cdb2fdfccf9e87e621
    question:           |
                        Whether a key performance parameter is a
                        fourth kind of measure or a designation put on
                        a measure of effectiveness that matters most,
                        and which the register should hold.
    relation:           []

  validation:
    id_self:            qst_operational_concept.validation
    guid_self:          qst_f891665cd43d44fbb3fe8dfeac73cb55
    question:           |
                        What points at a scenario or a measure to say
                        it has been validated, given that r_verifies
                        runs from a test to a requirement and
                        validation asks a different question of a
                        different thing.
    relation:           []
