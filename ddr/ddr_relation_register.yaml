                        of its ends. Nothing prevents an edge saying
                        that a schema is held in a registry.
    relation:           []

  c9f58ac59:
    id_self:            qst_relation_register.c9f58ac59
    guid_self:          qst_477d676fa8534d75be4f348bf273e477
    question:           |
                        Note that the answer is unlikely to be the
                        same for every relation.
                        r_is_specified_by_schema plainly ends at a
                        schema and could say so. r_decides ends at
                        anything a decision can settle, which is
                        everything, and constraining it would assert a
                        boundary that does not exist. So the
                        constraint would have to be optional, and a
                        relation declining to constrain its ends would
                        have to be read as saying nothing rather than
                        as permitting nothing.
    relation:           []
