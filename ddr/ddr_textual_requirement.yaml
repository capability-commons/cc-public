title:                  Textual requirement
brief:                  |
                        A requirement is an item holding one shall
                        statement with the INCOSE attributes. The
                        guide's rules and characteristics are
                        registers, and evals implement the rules a
                        judge can apply to one statement.
context:                |
                        The repository holds design decisions and the
                        items they decide, and nothing yet that says
                        what an entity must do. The INCOSE guide to
                        writing requirements, revision 4, defines a
                        requirement expression as a statement with
                        attributes, gives fifteen characteristics a
                        good requirement or set has, and forty two
                        rules for writing one, each with examples of a
                        statement that breaks it and one that follows
                        it.

                        The writing style guide already showed the
                        shape: rules as register entries with an
                        example each way, evals that cite rules, and
                        the examples as the first control cases.
decision:               |
                        A TEXTUAL REQUIREMENT is a data item of type
                        t_textual_requirement, held in requirement/,
                        with a title as its unique name, a statement,
                        a rationale and a category, and optionally a
                        priority, a verification method, success
                        criteria and a status. It composes identity,
                        rights and relations and not the descriptive
                        trait, since the statement is what it says and
                        a brief would repeat it. What it derives from
                        is an r_is_derived_from edge to a need, source
                        or higher level requirement.

                        The forty two rules are entries of
                        reg_requirement_rule, of type
                        t_requirement_rule, shaped as writing style
                        rules: the rule as brief, the reasoning as
                        description, a statement that follows it and
                        one that breaks it. The fifteen
                        characteristics are entries of
                        reg_requirement_characteristic. Each rule
                        contributes to the characteristics the guide's
                        cross reference gives it, by r_contributes_to
                        edges.

                        The rules a judge can apply to one statement
                        are implemented by evals anchored on the
                        requirement schema, grouped so that each eval
                        has one criterion, each citing the rules it
                        implements. The rules about a set are entered
                        and not implemented until a set is an item.

                        The wording of rules and characteristics is a
                        paraphrase in the house voice. The examples
                        are the guide's, shortened.
rationale:              |
                        Fields from the guide's attributes, because
                        they are the ones the guide ties to the
                        characteristics: rationale keeps purpose out
                        of the statement, category is what R29 asks
                        for, trace is how a requirement shows it is
                        necessary. The other forty attributes are
                        management attributes a set needs and a
                        statement does not.

                        No brief, because a requirement is its
                        statement. A second sentence saying what the
                        first says would be judged against the first
                        and found redundant or wrong.

                        Registers for rules and characteristics, on
                        the glossary's and the style guide's
                        precedent, so that an eval names the rule it
                        implements and a control case names the rule
                        it exercises. The characteristics are entered
                        so that coverage can be read: which
                        characteristics the evals reach and which they
                        do not.

                        Evals per group of rules rather than per rule,
                        because forty two evals of one criterion each
                        would cost forty two judgements per statement,
                        and several rules are one thought said from
                        different sides: vague terms, escape clauses
                        and open ended clauses are all words that
                        leave the decision to the reader.

                        Paraphrase rather than transcription, because
                        the guide is INCOSE's and the repository is
                        public, and because the house voice is
                        shorter.
alternative:            |
                        A requirement as a design decision with a
                        shall statement in it. Rejected: a decision
                        records why; a requirement is an obligation
                        with a verification, and they are traced
                        differently.

                        The statement broken into slots as fields,
                        condition, subject, action, object,
                        performance, with the sentence derived.
                        Rejected for now: it enforces the pattern by
                        construction, which is R1, but the sentence is
                        what people read and judges judge, and slots
                        would need a pattern catalogue first. It is
                        the natural next step if the evals on
                        structure prove weak.

                        The rules held in the writing style register
                        beside the prose rules. Rejected: they are
                        rules for a different kind of text, judged by
                        different evals, and numbered by their source.

                        One eval per rule. Rejected on cost, above.
                        One eval for all rules. Rejected: a verdict on
                        forty two things at once says nothing about
                        which.
consequence:            |
                        Ten evals implement the statement rules, each
                        anchored on the requirement schema and citing
                        its rules by id, and each was measured against
                        the guide's own examples over five fresh
                        judgements per case. Eight are at zero false
                        alarms and zero misses. Two carry a recorded
                        miss the judge makes consistently and the
                        criterion is not changed to hide: a comma that
                        attaches a performance to the wrong clause,
                        R14, and a lower case and over two conditions,
                        R15, both of which read as ordinary English to
                        a judge. The set rules wait for a requirement
                        set item, which is also where C10 to C15
                        become checkable.

                        Measuring changed the criteria three times and
                        the cases three times, always toward the guide
                        rather than away from it: a capitalised
                        glossary term is not a spelling fault, an
                        indefinite article on a defined thing is the
                        guide's own exception, wedged means between
                        the verb and the noun it acts on, a count has
                        its unit in what it counts, and the solution
                        free eval reads the rationale, since the guide
                        makes the constraint acceptable only where the
                        rationale requires it. Two of the guide's
                        unacceptable examples were held met on the
                        criterion they were filed under and their
                        fault assigned to the eval that judges it.

                        Every requirement needs an r_is_derived_from
                        edge to show it is necessary, and nothing yet
                        holds a need. Needs are the next type, or a
                        source item is.

                        R4 asks that terms be defined in a glossary.
                        The repository glossary defines the
                        repository's own concepts, not an entity's. A
                        project glossary for the entity under
                        specification is a register of the term type,
                        on the glossary decision's federation
                        precedent, and does not exist yet.

                        Requirements written about cctool itself are
                        the first real ones and the first specimens.

question:

  slots:
    id_self:            qst_textual_requirement.slots
    guid_self:          qst_7b31fc7f329a4872818d6e1a4ffbd1a5
    question:           |
                        Whether the statement should be held as
                        pattern slots, condition, subject, action,
                        object and performance, with the sentence
                        derived, so that R1 holds by construction.
    relation:           []

  need:
    id_self:            qst_textual_requirement.need
    guid_self:          qst_59e630f0ff854f50ba21744462caa295
    question:           |
                        Whether a need is an item of its own type, or
                        a textual requirement with a category, given
                        that the guide separates them by voice and by
                        what they derive from.
    relation:           []

