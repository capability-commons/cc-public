title:                  Decision support moves to multi-agent multi-concern argumentation
brief:                  |
                        A decision across cc-public is to be supported
                        by several agents arguing several concerns,
                        each argument gathering the evidence it needs,
                        rather than by one proposal answered by one
                        challenge.
context:                |
                        Two workflows pair a proposal with a
                        challenge: wf_decomposition_from_need and
                        wf_concept_from_need. Each runs a proposing
                        node on one model and a challenging node on a
                        second, and the challenge is answered by a
                        resolution the proposer writes. A design
                        decision may carry the same pair.

                        The pair does one thing well. It puts an
                        independent stance against a position and
                        records the answer, which is more than an
                        unopposed proposal offers.

                        It is also narrow in three ways. There is one
                        challenger, so one stance stands for every way
                        a position could be wrong. There is one
                        concern, unnamed, so a challenge about cost
                        and a challenge about feasibility are the same
                        kind of thing and cannot be weighed against
                        each other. And a challenge is argued from
                        what the model already holds; nothing in the
                        pair gathers evidence.

                        The repository already gathers evidence for
                        one purpose. wf_research_concept parks for an
                        agent with tools, which captures what it finds
                        as observations and cites them from an
                        assessment by r_cites. That is one argument,
                        on one concern, doing what every argument
                        should be able to do.
decision:               |
                        Decision support across cc-public moves to a
                        framework in which several agents argue
                        several named concerns, and the argument is
                        the recorded thing.

                        An argument stands for or against a position
                        on one named concern. It carries its own
                        evidence, and gathering that evidence is part
                        of making it: reading a public source and
                        capturing it as an observation, building and
                        running a simulation, deriving a result, or
                        citing what the repository already holds.

                        A concern is named. Arguments are grouped,
                        weighed and reported by concern, and a
                        position holds a standing on each concern
                        rather than one standing overall.

                        The framework applies to decomposing a need,
                        choosing a concept, admitting a requirement,
                        selecting an off-the-shelf product and
                        accepting a design decision.

                        The output states which concerns were argued,
                        what was said on each, what evidence was
                        gathered, and what stood unanswered when the
                        decision was taken. It is not a score.

                        The propose and challenge pair remains until
                        the framework replaces it.
                        ddr_challenge_is_a_guard settles how its eval
                        behaves meanwhile.
rationale:              |
                        Several concerns rather than one, because the
                        interesting decisions are not won or lost on a
                        single axis, and a framework reporting one
                        verdict throws away what the reader needs in
                        order to disagree with it. Naming the concern
                        is what lets a position be strong on one and
                        weak on another without the two cancelling.

                        Several agents rather than one challenger,
                        because one stance is one sample of the ways a
                        position can be wrong, and the ways worth
                        knowing about are the ones the proposer did
                        not think of.

                        Evidence gathered as part of arguing, because
                        an argument from what a model already holds is
                        bounded by that model, and the questions worth
                        deciding are the ones where somebody has to go
                        and find out. The research assessment shows
                        the shape already, working for one argument at
                        a time.

                        An output that can be read rather than a
                        score, because the purpose is to support a
                        person deciding, and a person cannot be
                        supported by a conclusion they cannot inspect.
                        It is also what makes a decision auditable
                        when it is questioned later.

                        One framework across the five uses, because
                        each is a position, the concerns it must
                        answer, the arguments made on each and the
                        evidence behind them. Whether that shape
                        survives contact with all five is this
                        record's question.
alternative:            |
                        Keeping the propose and challenge pair and
                        adding concerns to it. Rejected as the
                        direction, though it may be a step: with one
                        challenger the concerns compete for one
                        stance's attention, and the pair has no place
                        to put evidence.

                        A formal argumentation calculus, where
                        arguments attack one another and an extension
                        is computed. Not rejected, and not adopted
                        here. It may serve as the way arguments are
                        related and settled, but adopting a calculus
                        before there are arguments to relate would fix
                        the semantics before the content is
                        understood.

                        Scoring each concern and combining the scores.
                        Rejected: it produces a number that cannot be
                        argued with, and the reason for the framework
                        is to be argued with.

                        Leaving decision support to the person alone.
                        Rejected: it is what the repository does today
                        for everything the two workflows do not cover,
                        and the reasoning is then lost the moment it
                        is finished.
consequence:            |
                        The types this needs do not exist. An
                        argument, a concern, and the relation between
                        an argument and the position it bears on are
                        all to be designed, and none is designed here.

                        wf_decomposition_from_need and
                        wf_concept_from_need will be revised or
                        replaced. Their components, ports and evals
                        are the working example of what the framework
                        must do at least as well.

                        An agent that argues needs tools and a way to
                        bring back what it found. observe and r_cites
                        are how the repository does that now, and
                        whether they suffice is not known.

                        A decision item already records what a person
                        chose, with an actor, a role and an authority.
                        The framework produces what that decision
                        rests on and does not replace it.

                        The cost is not yet estimable. Several agents
                        arguing several concerns with evidence
                        gathering is more expensive per decision than
                        one challenge by a large factor, and which
                        decisions are worth it is a question the first
                        use has to answer.

question:

  concerns:
    id_self:            qst_argumentation_framework.concerns
    guid_self:          qst_fe862f52ef3245888122762c95741460
    question:           |
                        Whether concerns are a controlled register
                        like the requirement characteristics, chosen
                        per decision, or derived from the position
                        being argued.
    relation:           []

  settling:
    id_self:            qst_argumentation_framework.settling
    guid_self:          qst_cd5c5ecb664c4cb2824560ab2be70b09
    question:           |
                        How a set of arguments settles a position, and
                        whether that is a calculus over attack and
                        support edges, a person reading them, or a
                        judge with a criterion.
    relation:           []

  evidence:
    id_self:            qst_argumentation_framework.evidence
    guid_self:          qst_ea14d730d45e4d45a3464920b27ac813
    question:           |
                        Whether an argument cites an observation as an
                        assessment does, and what an argument from a
                        simulation cites when the simulation is built
                        for the argument.
    relation:           []

  cost:
    id_self:            qst_argumentation_framework.cost
    guid_self:          qst_2fbe3aa825454d8680a2c1724fca20dd
    question:           |
                        Which decisions are worth several agents
                        arguing several concerns, and what a cheaper
                        form looks like for the decisions that are
                        not.
    relation:           []

  scope:
    id_self:            qst_argumentation_framework.scope
    guid_self:          qst_69b191d1a14f489cad60d9f1b72408b5
    question:           |
                        Whether one framework serves decomposition,
                        concept selection, requirement admission and
                        product selection, or whether the shape only
                        appears common until each is tried.
    relation:           []

