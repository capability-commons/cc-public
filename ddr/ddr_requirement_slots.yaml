title:                  A requirement is its slots, and the sentence is composed
brief:                  |
                        A textual requirement and a candidate
                        requirement hold the slots of the SOPHIST
                        template, condition, entity, obligation,
                        activity, actor, process, object and
                        qualifier, and the statement is composed from
                        them wherever it is shown, never stored. Each
                        says whether it is an evidential claim or a
                        design claim.
context:                |
                        The requirement held one free sentence, and
                        ten evals judged it against the INCOSE rules.
                        Two demonstration runs produced four hundred
                        and sixty-nine advisory findings on their
                        requirements, and over half fell on rules a
                        template makes true by construction: the
                        definite article rule alone gave a hundred and
                        twenty-seven, then combinators, subject and
                        verb, and explicit conditions. The textual
                        requirement decision had rejected slots for
                        the time being and named them the natural next
                        step if the evals on structure proved weak.
                        The need already composes its statement from
                        slots and stores none. SOPHIST gives the
                        template: an optional condition, the entity,
                        the obligation, and one of three activities,
                        the entity acting by itself, providing an
                        actor with the ability, or being able to serve
                        an interface; the condition opens with If, As
                        soon as or As long as by its kind. The
                        admissible claims position says a claim enters
                        a specification only classified as evidential
                        or design, each with its own defense.
decision:               |
                        The statement is not a field. A textual
                        requirement holds the SLOTS: condition with
                        its condition_kind, logic, event or time;
                        entity, in Capitalised_Snake_Case; obligation,
                        shall, should, will or may; activity,
                        autonomous, interaction or interface; actor,
                        with an interaction and not otherwise;
                        process, one main verb in the infinitive;
                        object; and qualifier. cc_public.requirement
                        composes the statement from them in the
                        SOPHIST English form, If, As soon as or As
                        long as the condition, the entity, the
                        obligation, then the process and object,
                        provide the actor with the ability to, or be
                        able to, then the qualifier, and it is
                        composed wherever the requirement is shown: to
                        a judge, in the dossier, and in the evidence
                        digest. Slots that do not compose, an
                        interaction without an actor or a condition
                        without its kind, are refused.

                        A candidate requirement holds the same slots,
                        so that the model that proposes a concept
                        writes slots and never a sentence, and
                        promotion copies the slots. Each holds a
                        CLAIM, evidential or design: evidential where
                        the obligation restates what a source says
                        must hold, defended by citing it; design where
                        it is a choice, defended by argument.
rationale:              |
                        Slots canonical and the sentence derived, on
                        the need precedent, because a sentence beside
                        its slots can say what the slots do not, and
                        because the statement is then well formed by
                        construction: an unnamed actor, a missing
                        entity, a verb that is not a verb or two
                        obligations in one sentence cannot be written,
                        which is what SOPHIST compiled a class of
                        defects down to. The evals on those rules
                        become redundant, and what remains for a judge
                        is what a template cannot see.

                        The SOPHIST template rather than the INCOSE
                        form alone, because the three activities name
                        who acts, which the INCOSE form leaves to the
                        verb, and because the three condition kinds
                        name what the condition is, which When does
                        not.

                        The claim on the requirement itself rather
                        than on the decision that promotes it, because
                        the classification is the first fork for every
                        claim and the highest value audit target: a
                        misclassified claim is routed past the wrong
                        check, and a person auditing the set reads it
                        off the item.
alternative:            |
                        The statement stored beside the slots, with a
                        check that they agree. Rejected: two things to
                        keep the same, and the need showed that one
                        suffices.

                        Slots as a nested object under one field.
                        Rejected: the need holds its slots flat, a
                        model returns a flat row for a table, and a
                        dot path is shorter.

                        Only the INCOSE pattern, condition, entity,
                        shall, action, object, performance. Rejected:
                        it does not say who acts.

                        The claim classification carried by the
                        promotion decision. Rejected: the item is what
                        a reader and an auditor see.
consequence:            |
                        The seventeen requirements of the tool are
                        migrated by hand, each a design claim; their
                        statements now open with As soon as, If or As
                        long as where they opened with When, and their
                        evidence is stale until the tests observe
                        again. The demonstration segment holds a
                        hundred and forty-two requirements and six
                        concepts written as sentences, which a model
                        pass must migrate into slots, and its gate is
                        red until it does.

                        The propose prompt asks for slots and a claim.
                        The promote component copies the slots, the
                        claim and the category and writes no
                        statement. The evidence digest covers the
                        composed statement, so a changed slot stales
                        the evidence as a changed sentence did.

                        The written control cases of the requirement
                        evals still hold a statement, since a case is
                        the subject as the judge is shown it, and the
                        judge is shown the composed statement.

                        Sources: the SOPHIST MASTER templates and set
                        of regulations, held in reg_document; the
                        textual requirement and need decisions; the
                        admissible claims position.

