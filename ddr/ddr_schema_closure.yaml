title:                  Schema closure
brief:                  |
                        A trait declares its fields and says nothing
                        about others; a concrete schema, for an item
                        or an embedded entry, refuses a field no
                        composed schema declares. An item naming its
                        own schema names one that composes the schema
                        its type names.
context:                |
                        ddr_trait_composition builds every item schema
                        from traits by allOf, and every schema was
                        open: additionalProperties true at the top of
                        each. Composition needs a trait to tolerate
                        the fields other traits bring, but an open
                        concrete schema lets a misspelled field pass,
                        and a field written to the wrong item is then
                        a field nobody reads. A review of the
                        foundation found that a concrete schema could
                        not tell a typo from a field.

                        ddr_per_register_entry_schema left open
                        whether an item naming its own schema should
                        be obliged to name one composing the schema
                        its type names. Nothing obliged it, so an item
                        could name a weaker schema and leave its
                        type's contract behind.
decision:               |
                        A trait declares its fields and carries no
                        additionalProperties at all, so that it
                        neither refuses nor claims the fields it does
                        not declare. A concrete schema, one selected
                        for a document by a type or named by an item,
                        carries unevaluatedProperties false at its
                        top, and so does the schema of an embedded
                        entry that is the one schema validating it: a
                        port, a node, a binding, a question, an
                        assumption, a control case. A field is then
                        accepted where some composed schema declares
                        it and refused anywhere else, at the path
                        where it was written.

                        A register entry is validated twice, by the
                        general entry shape in sch_register and by the
                        register's own entry schema, from two branches
                        that cannot see each other's annotations. So
                        the general entry stays open, and a per
                        register schema closes its entries by
                        composing the general entry with its own in
                        one place: an allOf of the two with
                        unevaluatedProperties false, at the table's
                        entries.

                        sch_schema stays open, because a schema
                        carries whatever keywords the draft allows and
                        enumerating them would be a copy of the draft.

                        An item naming its own schema names the schema
                        its type names or one that composes it,
                        transitively through allOf. The schema check
                        refuses any other. Naming a schema narrows a
                        type's contract; it cannot replace it.

                        When an embedded entry fails its closure, the
                        branch validating it yields no annotations and
                        its parent reports every field as unevaluated.
                        The schema check drops a closure error at a
                        path beneath which another error was reported,
                        so that the fault is reported once, where it
                        is.
rationale:              |
                        unevaluatedProperties rather than
                        additionalProperties false, because the latter
                        sees only the properties declared beside it
                        and would refuse every field a composed trait
                        brings. The draft made the former for this
                        case, and the validator in use honours it
                        through allOf and through a reference.

                        Traits with no additionalProperties keyword
                        rather than false, because true is the default
                        and a trait saying so explicitly claims every
                        field as evaluated, which defeats the closure
                        above it; the keyword absent, the trait says
                        nothing.

                        The general register entry open, because the
                        alternative was every per register schema
                        restating the general shape, and the per
                        register schema is where the entry is known in
                        full. The cost is that a register with no
                        schema of its own has open entries, which is
                        recorded below as a question.

                        Composition required of an override, because
                        the type register's edge to a schema is the
                        type's contract and an item that could point
                        elsewhere would make that edge advisory.
alternative:            |
                        Closing every schema with additionalProperties
                        false and repeating every trait's fields in
                        every concrete schema. Rejected: the traits
                        would then be documentation.

                        A dynamic reference from the general register
                        entry to whatever entry schema the outermost
                        register schema declares. Not taken: it would
                        close every register's entries in one move,
                        and it rests on the least used corner of the
                        draft; worth trying when the three registers
                        without a schema of their own want closing.

                        Leaving concrete schemas open and catching
                        typos with an eval. Rejected: a misspelled
                        field is exactly what a schema is for.
consequence:            |
                        Every item, register, component, workflow,
                        deployment, execution, eval, need,
                        requirement, control set, python package and
                        module, and every port, node, binding,
                        question, assumption and control case refuses
                        a field it does not declare. The tree as it
                        stood conformed entirely.

                        A new field is added to the schema before it
                        is written to an item, which is the order the
                        tool already imposes through new.

                        The entries of a register with no schema of
                        its own stay open: the framing, methodology
                        and requirement characteristic registers.

