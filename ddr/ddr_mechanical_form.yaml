title:                  What a check can tell of a statement, a check tells
brief:                  |
                        Units, bounds, acronyms, the kind of the
                        process word, light verbs and nominalisations
                        are found by a statement check over the slots,
                        against a unit register, the glossaries and
                        the process words, and the two evals that
                        judged them are narrowed to what a check
                        cannot tell.
context:                |
                        Ten evals judged every requirement statement,
                        eleven calls per requirement, and several of
                        their rules are decidable from the slots:
                        whether a number is followed by a unit,
                        whether a bound precedes it, whether an
                        acronym is defined, whether the verb names a
                        process. The admissible claims position says
                        the efficiency of the system is how far down
                        the cost hierarchy each check has been pushed,
                        from judge to rule, and the assessment of the
                        quality system found these the rules most
                        worth moving. A judge asked these questions
                        answers variably and at a cost; a check
                        answers the same way every time for nothing.
decision:               |
                        A UNIT REGISTER, reg_unit of type t_unit,
                        holds each unit by its symbol, the spellings a
                        statement may use, and the kind of quantity; a
                        consumer may hold one of its own. A process
                        word entry may carry a KIND, process, state,
                        permission or management, process where
                        absent.

                        The STATEMENT CHECK, the sixteenth, reads the
                        object and qualifier of every requirement and
                        candidate. A number is a quantity unless it
                        names something, a standard's number after its
                        initials or a hyphenated compound. A quantity
                        followed by a unit the register holds is well
                        formed; by the thing it counts, a count; by
                        nothing, a finding under R6. A quantity with a
                        unit and no bound around it, no more than, at
                        least, within, or less, plus or minus, is a
                        point value and a question under R33. A word
                        shaped like a unit the register lacks is a
                        question. An acronym no term, document or unit
                        defines is a finding under R37. A process word
                        whose kind is not process is SOPHIST's second
                        question, or its thirteenth for a permission;
                        a light verb, perform, carry out, make, is its
                        fourth; an object opening with a noun made
                        from a defined verb, the judgement of, is its
                        third. Advisory while proposed, critical once
                        accepted, as the process word check is.

                        The quantities eval keeps absolutes and
                        decimal format; the verb eval keeps the
                        passive voice inside the statement. Their
                        control cases on what the check now finds are
                        held met with a note saying so, and both are
                        measured again.
rationale:              |
                        A register for units rather than a list in
                        code, because a unit a domain needs is data a
                        consumer adds, and because a unit the register
                        lacks is a question the check can ask by name.

                        The kind on the process word rather than a
                        list of weak verbs in the check, because which
                        verbs name no process is a judgement a person
                        makes once per verb, in the glossary, and the
                        check then applies it; the demonstration
                        marked nineteen of its fifty-four verbs.

                        Nominalisations from the defined verbs rather
                        than from a suffix, because location and
                        relation end in the same letters as
                        registration and mean no process; the first
                        version flagged both and was wrong.

                        Point values as questions rather than faults,
                        because a nominal with an implied tolerance is
                        common and the question is what the tolerance
                        is.

                        Cases re-labelled rather than deleted, because
                        they are the record of what the eval once
                        judged and why it no longer does.
alternative:            |
                        A number parser that also reads ranges and
                        tolerances into structure. Deferred: the slots
                        do not hold quantities as data yet, and the
                        budget question on the set decision is where
                        that belongs.

                        Retiring the two evals entirely. Rejected:
                        absolutes, decimal format and a passive inside
                        the object are readings.

                        A suffix heuristic for nominalisation.
                        Rejected on the first run.
consequence:            |
                        On the demonstration the statement check
                        raises a hundred and seventy-six findings on
                        three hundred and one statements: eighty-six
                        verbs of a kind that names no process, forty
                        acronyms no glossary defines, DC most of them,
                        twenty-two point values, ten numbers with no
                        unit, sixteen permissions and two
                        nominalisations. Each is a question a judge
                        was asked before and is now asked for nothing.

                        The demonstration has no glossary of its own,
                        so every acronym is a finding until it has
                        one; the first consumer-held term register is
                        the next thing the check asks for.

