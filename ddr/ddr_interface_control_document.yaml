    guid_self:          qst_c3fa38d435e4476594d57be2efb93583
    question:           |
                        What tells a reader that a baselined interface
                        control document has changed since it was
                        baselined, what holds a member name unique
                        across a language scope rather than within one
                        table, and what refuses a port under two
                        dataflow roles at once. check/interface holds
                        the other four.
    relation:           []

  brief:
    id_self:            qst_interface_control_document.brief
    guid_self:          qst_d576d9f82cea41e38db9bcee4e92b81d
    question:           |
                        What compares a member's brief with the brief
                        of the source item presenting it, given that
                        the two describe one definition for different
                        readers and have already diverged.
    relation:           []

  surfaces:
