question:

  within_tests:
    id_self:            qst_gate_order.within_tests
    guid_self:          qst_311a7ad4d0a24af9897dcbe8204f00da
    question:           |
                        What orders the tests, given that they are
                        ninety nine per cent of the gate and this
                        decision does not touch them: what a change
                        reaches, which a measured map already knows,
                        what failed last, which the cache in the
                        persistent worktree would remember, or what
                        has told nobody anything for a long time,
                        which nothing records. And whether the gate
                        should stop at the first test that fails at
                        all, since finishing soonest and finding
                        soonest ask for opposite things.
    relation:           []
