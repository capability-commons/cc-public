  c2b840136:
    id_self:            qst_cost_of_checking.c2b840136
    guid_self:          qst_5a844531b18844efa11dac215ce6d91b
    question:           |
                        Whether the cost side can be observed rather
                        than declared. The tool knows what a run cost
                        in calls and in time. It does not know what an
                        investigation cost, and that is the term the
                        false alarm side turns on.
    relation:           []

