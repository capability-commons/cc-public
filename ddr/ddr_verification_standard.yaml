title:                  Verification takes DO-178C first, INCOSE next, ISO last
brief:                  |
                        Verification practice here is answerable to
                        named external standards in a stated order of
                        precedence, and a record that takes material
                        from one of them cites it.
context:                |
                        How a requirement is written here is already
                        answerable to documents outside it: the INCOSE
                        guide to writing requirements, the SOPHIST
                        templates and ISO/IEC/IEEE 29148 are entries
                        in the document register, and the rules a
                        statement is judged by cite them. How a
                        requirement is verified has had no such
                        footing. The test method, case, execution and
                        evidence items were designed from first
                        principles and then checked against practice
                        after the fact.

                        The standards agree more than they differ.
                        Each records verification for each
                        requirement, permits the activity that
                        produces it to be shared, and asks that the
                        expected result be stated. They differ in
                        emphasis, in what they make an objective
                        rather than a recommendation, and occasionally
                        in a word. Where they differ, something must
                        say which is followed.

                        This repository is not a certification project
                        and seeks no certification credit. What it
                        wants is that an engineer who works to one of
                        these standards can read what is here and
                        recognise it.
decision:               |
                        Software verification here takes its
                        objectives from DO-178C first, from the INCOSE
                        systems engineering handbook and the INCOSE
                        guide to writing requirements next, and from
                        the ISO, IEC and IEEE standards, chiefly 29119
                        and 29148, last. Where two conflict, the
                        earlier in that order is followed and the
                        departure is recorded.

                        The order governs objectives and definitions,
                        not vocabulary. Where a standard's word would
                        displace a term already decided here, the term
                        register decides, as it always has.

                        A design decision that takes material from one
                        of these documents cites it, as a requirement
                        rule already does. The document register holds
                        the entry; the record holds the edge.

                        Conformance is claimed for an objective, never
                        for a standard as a whole. A claim says which
                        objective, what satisfies it, and what does
                        not yet.

                        That order governs the objectives of software
                        verification, which is one question among
                        several, and it does not reach every
                        dimension. The security dimension of
                        ddr_criticality takes its objectives from ISO
                        and SAE 21434 and from IEC 62443, on which
                        DO-178C is silent, so the order has nothing to
                        arbitrate there. The operational risk
                        assessment for unmanned aircraft published by
                        JARUS and adopted by EASA informs how a safety
                        level is arrived at for an operation, and is
                        not a source of verification objectives at
                        all.
rationale:              |
                        DO-178C first, because it is the most
                        prescriptive of the three about what
                        verification must produce rather than how it
                        should be organised: that test cases exist for
                        each requirement, that coverage of the
                        requirements is analysed rather than assumed,
                        and that the tools relied on are themselves
                        accounted for. Those are the objectives this
                        repository is least able to reason itself into
                        and most able to be audited against.

                        INCOSE next, because the requirement model
                        here is already taken from it, so its
                        definitions are the ones already in use, and a
                        second source for the same idea should not
                        outrank the one the repository was built on.

                        ISO last, because 29119 describes a process
                        and a set of documents more than it sets
                        objectives, so where it differs from DO-178C
                        it is usually the less demanding and the less
                        checkable of the two.

                        Objectives rather than the whole standard,
                        because a claim to conform to DO-178C entire
                        would be false: its objectives are selected by
                        design assurance level, and nothing here
                        carries one.

                        Citation by an edge rather than by prose,
                        because a conformance claim that cannot be
                        queried cannot be reviewed, and prose naming a
                        document is not a reference the tool can
                        follow.

                        The order scoped to software verification,
                        because it was chosen for that and holds only
                        there. DO-178C says nothing about information
                        security, and the vehicles this repository
                        serves make security a dimension of its own
                        rather than a corner of safety, so a
                        precedence that put DO-178C first over a
                        question it does not address would resolve
                        nothing and read as though it had.
alternative:            |
                        One standard alone. Rejected: none of them
                        covers what this repository needs. DO-178C
                        says little about how requirements are
                        written, and the INCOSE guide says little
                        about verification evidence.

                        No order of precedence, resolving conflicts
                        case by case. Rejected: it makes every
                        conflict a fresh argument and leaves no record
                        of which way it went.

                        ISO first, as the most general and the most
                        widely held. Rejected: it is the least
                        prescriptive about evidence, which is the part
                        of verification this repository is building.

                        Conformance claimed for a standard as a whole.
                        Rejected: it would be untrue, and an untrue
                        conformance claim is worse than none.

                        Citation in prose only. Rejected: see the
                        rationale.

                        Extend the order to cover every dimension,
                        putting DO-178C first throughout. Rejected: it
                        is silent on information security, and an
                        order whose head has no opinion is not an
                        order.
consequence:            |
                        The document register holds DO-178C, DO-330,
                        the INCOSE systems engineering handbook,
                        ISO/IEC/IEEE 29119, ISO and SAE 21434, IEC
                        62443, ISO 26262 and the JARUS operational
                        risk assessment for unmanned aircraft. ISO
                        26262 is cited because ddr_criticality takes
                        from it. The ECSS verification standard is
                        consulted and not cited, because nothing here
                        takes material from it.

                        r_is_taken_from runs today from a requirement
                        rule, a requirement characteristic or a
                        methodology to a document. Its domain must
                        admit a design decision before any record here
                        can cite a standard.

                        DO-178C selects its objectives by design
                        assurance level and reg_criticality now says
                        which objectives each level requires. The
                        trace check reads it in two places, so a level
                        declared on a requirement decides what is
                        asked of it. Three of the five objectives a
                        level can add are still read by no check.

                        Requirements-based coverage analysis is an
                        objective this repository does not meet.
                        evl_test_exercises_criteria asks whether a
                        test would fail if the criteria were untrue,
                        and t_coverage_analysis is the record of what
                        it answered, and nothing writes one, so the
                        analysing happens and the recording does not.
                        obj_coverage_analysed is claimed by nothing
                        for that reason. The coverage floor measures
                        lines of the tool, not requirements.

                        The pytest adapter decides every conformance
                        result, and a control set now shows it reading
                        a pass, a failure, an error in setup and in
                        teardown, a skip, a timeout, and a function
                        run twice that fails once. That is what
                        satisfies obj_tool_accounted. What the tests
                        rely on beyond it, the helpers deciding which
                        files a claim of completeness covers, is
                        unaccounted for still, which
                        ddr_tool_verification decides and nothing has
                        built.

                        Tracing the parts of this system and this
                        process to the clauses of the cited standards
                        is a process mapping exercise that has not
                        been done. Until it is, a claim names a
                        document and not a clause, and ddr_objective
                        is written so that a clause can be added later
                        without the objectives being rewritten.

