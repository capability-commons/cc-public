title:                  A decision is an act over exact content, and promotion is an admission
brief:                  |
                        A decision is an item recording who decided
                        what, in which role and under what authority,
                        over which items at which digests, why, under
                        what condition and until when. Promotion
                        admits a concept's candidates only where the
                        concept's challenge concluded or a decision
                        that still holds waives it, and admits an
                        evidential candidate only with a quote a
                        captured observation holds. Every promoted
                        requirement names what admitted it.
context:                |
                        Every requirement carried a claim, evidential
                        or design, and nothing backed it. Promotion
                        turned every candidate of a concept into a
                        requirement item whether or not the challenge
                        had concluded: of the six demonstration
                        concepts, four ended with their challenge
                        budget exhausted and objections unresolved,
                        and all hundred and forty-two candidates
                        became requirements. The admissible claims
                        position says a claim enters the specification
                        only with a defense someone other than its
                        author can check, evidence for a claim about
                        the world and argument for a claim of design,
                        and the outside review asked that an
                        unresolved challenge block ordinary promotion
                        or require a recorded waiver, that acceptance
                        be an attributable act over exact content, and
                        that a report lead with an assessment by
                        policy rather than by a string. The eval
                        confidence rows already bind a measurement to
                        a digest of what was measured; a decision
                        needs the same binding.
decision:               |
                        A DECISION is a data item of type t_decision,
                        held in decision/, made only by cctool decide:
                        an outcome, waive, select, accept or lead; the
                        actor, the role and the authority, or that
                        there is none; the reasons as its brief; an
                        optional condition and expiry; and one subject
                        per item decided over, each with the digest of
                        that item's whole document as it stood. The
                        decision check reports a subject changed
                        since, or gone, and an expiry passed, as
                        advisory: the decision stays as the record of
                        what was decided then, and admits nothing now.

                        PROMOTION is an admission. The promote
                        component finds the latest run of the concept
                        workflow that bound the concept: where its
                        outcome is completed, the challenger conceded
                        and the concept's argument is its candidates'
                        defense. Otherwise it looks for the latest
                        waiver decision that still holds over the
                        concept. With neither it refuses, naming what
                        is lacking and the command that records a
                        waiver. Every requirement it makes carries
                        r_is_admitted_by to the execution or the
                        decision.

                        An EVIDENTIAL candidate is defended by a
                        quote: the span of a captured observation,
                        word for word, in its quote slot. Promotion
                        finds the quote in an observation the
                        candidate cites, or failing an edge, in the
                        observations behind the concept's need, and
                        refuses a quote none holds. The requirement it
                        makes carries the quote and r_cites to the
                        observation found. A design candidate needs no
                        quote; its defense is the concept's argument.
rationale:              |
                        The concept as the unit of argument for design
                        claims, because a concept is proposed by one
                        model and challenged from an independent
                        stance by another, with the challenge and the
                        resolution on record, which is the defense the
                        position asks for; a challenge per candidate
                        would cost far more and defend no better.

                        Blocking rather than admitting in an
                        experimental status, because a status nobody
                        reads is how overclaiming returns; the waiver
                        is the deliberate exception, and it names who
                        takes the risk and until when.

                        One decision type for waiver, selection,
                        acceptance and report policy, because the
                        attributable act over exact content is the
                        same shape in each, and one type lets the
                        graph be asked what a person decided.

                        The whole document digested, because a
                        decision over a concept is over everything the
                        concept says, and any edit after the decision
                        is a different concept; the evidence digest
                        covers code alone for the opposite reason,
                        that prose and layout change what is claimed
                        not at all.

                        The quote searched in the observations behind
                        the need where the candidate names none,
                        because the proposer writes text and not
                        edges, and the source of a concept's evidence
                        is the source of its need.
alternative:            |
                        A defense record per candidate, position,
                        counter-case and resolution. Rejected: the
                        concept is the unit of argument.

                        Promotion into a requirement with status
                        experimental where the challenge did not
                        conclude. Rejected: the gap would be a word in
                        a field rather than a refusal.

                        Separate types for waiver, selection,
                        acceptance and lead. Rejected: one shape, one
                        command, one check.

                        The digest over fields that carry meaning,
                        prose excluded. Rejected: for a decision the
                        prose is the meaning.
consequence:            |
                        The decide command, the decision check as the
                        fifteenth, and the promotion gate exist and
                        are tested: a concluded challenge admits and
                        the requirement names the run; an exhausted
                        one refuses until a waiver admits it and the
                        requirement names the waiver; an evidential
                        candidate is refused without a quote, refused
                        with a quote no observation holds, and
                        admitted with one the observation holds,
                        citing it.

                        The demonstration records four waivers, one
                        per exhausted concept, by the demonstration
                        performer under no authority and expiring with
                        the next run, and every requirement it holds
                        names the run or the waiver that admits it.
                        Its requirements are all design claims as the
                        migration left them; the first evidential
                        candidate with a quote will come from a fresh
                        run under the revised prompt.

                        Acceptance is still the status the accept
                        command sets after its checks; recording it as
                        a decision, and reading a lead decision in the
                        report, are the next uses of the type. The
                        fidelity of an evidential requirement to its
                        quote, that the composed statement says what
                        the quote says, is a judgement no substring
                        finds, and is an eval to write and measure.

