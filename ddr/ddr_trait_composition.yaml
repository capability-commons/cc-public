  c59898dab:
    id_self:            qst_trait_composition.c59898dab
    guid_self:          qst_0bb7b52253974de5a9288e6b12dbe075
    question:           |
                        Whether a register entry should be able to
                        carry rights of its own. It cannot now, on the
                        ground that the register covers it -- but an
                        entry lifted out of its register and shared
                        alone would carry none, and nothing prevents
                        that.
