title:                  Prose by persona, not by constraint
brief:                  |
                        A writer of prose is told who is reading and
                        what the prose sounds like, in two sentences,
                        and nothing else. Evals measure whether that
                        lands. Improvement goes through the persona,
                        never through a rule that counts or forbids.
context:                |
                        ddr_reader_burden measured the tree and found
                        the load in pointers, participial clauses and
                        a tail of dense fields, with sentence length
                        already in the reference band. The question
                        was how to move a writer, given that the
                        writer is a language model whose prior style
                        is the fault.

                        Rules were the obvious answer, and the
                        register already holds seven. But constraints
                        on a generator are not additive. Two that pull
                        apart give text that satisfies both by the
                        letter, and a list of many is followed only
                        where it can be counted. The no filler rule as
                        written licensed dropping articles, subjects
                        and verbs, which is the fault itself.

                        A loop was run on one field of one item, the
                        description of t_observation, one change per
                        round, the user rating each. Round one gave a
                        persona and an exemplar passage and no rule:
                        pointers fell from four and a half a sentence
                        to two. Round two swapped the exemplar:
                        nothing measurable moved. Round three added a
                        register line: the forty eight word list
                        sentence split without a rule about lists.
                        Round four dropped the exemplar and cut the
                        prompt to two sentences: nothing measurable
                        was lost. Five more descriptions of four kinds
                        under the two sentences held, and the user
                        accepted all six.
decision:               |
                        The whole instruction to a writer of prose is
                        the brief of style_write_for_the_reader: who
                        is reading, and what the prose sounds like. It
                        is an entry in the writing style register,
                        bound first, so that it reaches a writer by
                        the mechanism the other rules use.

                        The prompt suggests; it does not constrain. No
                        rule carries a number. A rule that stays in
                        the register is advice with a follows and
                        breaks pair, which is the form a model
                        imitates.

                        evl_reads_alone judges the result from the
                        reader's side: whether the passage reads once,
                        on its own. Its control set holds the six
                        accepted rewrites as written cases and their
                        originals as mutated cases, so that the eval
                        is measured against what a person accepted. It
                        is advisory and anchored by type, on the kinds
                        whose descriptions were in the loop and their
                        neighbours, and not on design decisions or
                        annotations.

                        Improvement, when the eval or the burden
                        command says a field misses, goes through the
                        persona and the register line, or through an
                        exemplar if one is ever needed again. It does
                        not go through a new rule until a round has
                        shown the persona cannot carry it.

                        The no filler rule now says an article, a
                        repeated subject and a finite verb are never
                        filler. The short sentences rule now says a
                        short sentence is still a sentence.
rationale:              |
                        Measurement chose the prompt. Each round
                        changed one thing and measured, and the two
                        sentence prompt was the smallest that held. An
                        exemplar was tried and earned nothing.

                        A persona generalises where a rule does not. A
                        rule anticipates a case; a reader in mind
                        covers the cases nobody wrote a rule for. That
                        is why the criterion of the eval is written as
                        a reader's experience with symptoms as
                        evidence, and not as a list of countable
                        faults, which would bring rules back through
                        the judge.

                        The two rules were reworded rather than
                        countered, so that the count of rules did not
                        rise. A constraint added to cancel another is
                        two constraints.

                        Design decisions and annotations stay outside
                        the anchors on purpose. They carry the model's
                        own voice, and the pressure to say more has to
                        have somewhere to go. Constraining them would
                        leak density into the fields this decision is
                        trying to clear.
alternative:            |
                        A list of rules for referents, fragments,
                        lists and nominalisations, each with a limit.
                        Rejected: constraints interact, the limits
                        become targets, and the compliance voice they
                        produce is the register of a maintenance
                        manual, which the intended reader does not
                        want.

                        An exemplar passage in every prompt. Tried and
                        dropped: swapping it moved nothing, and
                        removing it lost nothing.

                        A judged eval whose criterion cites the
                        countable rules. Rejected: it would reward
                        what is counted and the writer would learn the
                        count.

                        Anchoring the eval on the descriptive trait so
                        that every description is judged. Deferred:
                        that reaches design decisions and annotations,
                        which are exempt, and the exemption has
                        nowhere to live yet, which
                        qst_reader_burden.exemption holds open.
consequence:            |
                        Descriptions grow by a fifth to a half. That
                        is the reader's load moved onto the page, and
                        it is paid.

                        The writer in the loop was the session's own
                        model, holding the prompt in mind, with its
                        own harness instructions also present. A clean
                        measurement of the two sentences on a model
                        with nothing else in context is still to be
                        made, and a non Anthropic model drafting is a
                        live option the user named.

                        The persona is not in the eval's confidence
                        digest, since the digest covers criterion,
                        examples, scope and cases. A change to the
                        persona changes what was measured without the
                        confidence row going stale. Open.

                        The eval reaches ten types. Widening to the
                        rest, and to brief and the argued fields,
                        follows the plan in ddr_reader_burden one
                        field kind at a time.

                        The control set is thinner on the unmet side
                        than it was meant to be. Of the six originals,
                        the judge read three once, unanimously across
                        repeated runs, and each was held to met rather
                        than the criterion tightened, since the bar is
                        reads once and not reads best. Two originals
                        remain unmet. A sweep over the anchored types
                        is the way to more unmet cases, each confirmed
                        by a person, and is the next step.

                        The first sweep with gpt-4.1 as judge found
                        293 of 597 descriptions unmet. Eight were
                        reviewed by a person: six confirmed, one
                        confirmed for a reason the judge did not give,
                        one suppressed because three things after a
                        colon is a short list. Two attempts were made
                        to teach the judge that distinction, first as
                        a sentence in the criterion and then as an
                        example, and each loosened the judge on long
                        colon lists as well, flipping cases that had
                        been unanimous. Both were withdrawn. The
                        criterion stands as first measured, the
                        over-fire on short colon lists is accepted at
                        one case in nine, and a suppressed case is how
                        each such finding is retired.

                        The second sweep's 293 findings were rewritten
                        under the persona, by class, and the third
                        sweep found 31, none new. A second pass left
                        four, three of them rules whose sentences name
                        the words they govern, which the judge reads
                        as pointers with no referent; those are
                        suppressed as cases, since mention of a word
                        is not use of it. Rewriting the docstrings of
                        tests had a side effect on another eval: the
                        coverage judge, which reads the docstring as
                        evidence of what a test does, read one test as
                        covering its criteria once its docstring was
                        plain and complete, though the test itself had
                        not changed. The verdict on that case was
                        held, its confidence row records the
                        disagreement, and the lesson is that a judge
                        reading prose about code is moved by the
                        prose.

