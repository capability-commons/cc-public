  eval:
    id_self:            qst_assessment.eval
    guid_self:          qst_6e314d2b107d4ecc86eb811b8dc31f47
    question:           |
                        What an eval over an assessment would judge:
                        that each rating's rationale supports it, that
                        a product's support names its references, that
                        unknown is not used for weak; and whether such
                        an eval should guard the model assessor.
    relation:           []

