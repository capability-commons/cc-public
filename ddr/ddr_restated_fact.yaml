title:                  Where one fact is written twice, the two are declared and compared
brief:                  |
                        A second place holding a fact is declared as
                        restating the first, and a check reports the
                        two disagreeing, so a copy cannot drift in
                        silence.
context:                |
                        About ten of a hundred and four review
                        findings are one fact written in two places
                        that nothing compared.

                        A criticality was keyed by dimension and the
                        entry it named carried the dimension too, and
                        a requirement could declare safety while
                        naming a security level. An interface member
                        declared a return spelling and the function
                        returned something else. A row was stamped
                        with the closure of everything it named and
                        the check recomputed it from two of those
                        things. A gate tool entry wrote the version by
                        hand and nothing read what was installed. A
                        layers contract was named seven tiers and
                        listed twelve. A session hook and an adapter
                        each turned a pytest event into an outcome,
                        and disagreed about teardown.

                        Each was found by a reader comparing two
                        places. None was found by the tree, although
                        in every case both places were in it.
decision:               |
                        Where a fact is written in a second place, the
                        second declares that it restates the first,
                        and a check reports the two disagreeing.

                        What can be declared is what the tree holds: a
                        field of an item against a field of another
                        item, a field against the key it sits under, a
                        field against a count of a collection. What
                        cannot is a fact held only in code, which is
                        where the deepest of these findings lived.

                        The declaration says how to read each side and
                        nothing more. A reader asking why the two
                        exist is answered by the record that decided
                        them, not here.

                        A fact restated in code is covered by a
                        fingerprint of the syntax tree of each
                        function body, with the names normalised,
                        reporting pairs above a similarity threshold.
                        Two case projections, four walks of the tree,
                        two readings of one pytest event and two
                        computations of one digest are what it is for,
                        and a review found all four by reading. The
                        answer in each case was to write the thing
                        once and have both callers ask it, which the
                        report does not do and cannot suggest.

                        Two further shapes are restatements the tree
                        already holds and nothing compared. A property
                        description saying a field is optional while
                        the schema requires it, and a definition that
                        is a bare reference to another item schema,
                        which gives one shape two names. Both are a
                        few lines to check. A bare reference to a
                        primitive is not one of these: it names a role
                        for a type, and six of those are legitimate.

                        The two smaller checks are built, in the
                        schema check, and find nothing today because
                        the instances that prompted them are fixed:
                        their value is a ratchet rather than a
                        discovery. Each has a test that breaks the
                        tree the way the review found it broken, and
                        one that holds the case which looks the same
                        and is not: a bare reference to a primitive
                        names a role for a type.

                        The fingerprint is built, as cctool restated.
                        It reports and blocks nothing, because the
                        answer in each case is to write the thing once
                        and have both callers ask it, and the report
                        does not know which side should go. The
                        declared restatement is not built, its shape
                        being undecided. Nor is the rule that one
                        fault is reported by one check: it was tried
                        and does not work, which ddr_gate_tool
                        records.
rationale:              |
                        Declared rather than inferred, because a field
                        that happens to equal another is not a
                        restatement, and a check guessing at it would
                        report every identifier that appears twice.

                        Limited to what the tree holds, because that
                        is what a check can read. Saying so is better
                        than a rule that pretends to cover the code
                        and catches a third of it.

                        The practice named beside the check, because
                        the largest instances were in code and the fix
                        there was one function two callers ask. A
                        record that offered only the check would leave
                        a reader thinking the class was covered.
alternative:            |
                        Write each comparison as its own check.
                        Rejected: that is what happened for the
                        criticality key, and it is a check per pair,
                        each of which somebody has to think to write.
                        The one written today took an hour and found a
                        defect that had been there since the field was
                        added.

                        Forbid a second place entirely, so that every
                        fact is held once. Rejected: a key that names
                        a dimension and an entry that names its own
                        dimension are both worth having, one for
                        reading and one for the register, and the same
                        is true of an interface contract beside the
                        code it describes.

                        Have an eval compare the two. Rejected: the
                        comparison is exact and mechanical wherever it
                        can be declared.
consequence:            |
                        A restatement nobody declares is not covered,
                        so the class is closed only as far as somebody
                        thinks to declare a pair. That is weaker than
                        it sounds: the pairs are found by exactly the
                        review that found these.

                        A declaration is a third thing on an item,
                        beside its fields and its edges, and the shape
                        of it is not settled here.

                        The two smaller checks and the fingerprint are
                        built and the declared restatement is not, so
                        the class is closed over code and over what
                        the tree already held both sides of, and open
                        where a pair must be declared. The fingerprint
                        reported sixteen pairs over the tool's own
                        source at a similarity of eight tenths, and
                        every one of them is a fact written twice.
                        They are six things: one nonconformity
                        constructor copied into six check modules, the
                        rule that an item's type is its identifier up
                        to the first separator written in a dozen
                        places, one walk of register entries written
                        twice, one projection of what points at an
                        item written twice, three walks of an edge map
                        differing by direction, and two command bodies
                        resolving an edge the same way. Sixteen of
                        sixteen, against seven false alarms of twelve
                        for the tool ddr_gate_tool withdrew. Sixteen
                        is the count to hold. Nothing enforces it, so
                        a reader running the report sees whether it
                        has grown.

