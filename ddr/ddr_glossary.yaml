title:                  Glossary
brief:                  |
                        A glossary is a register of terms. The
                        cc-public glossary is reg_term, and a
                        partner's is a register of the same type.
context:                |
                        ddr_terminology decides that concepts take
                        standard names and that departures are
                        recorded. That needs somewhere for the names
                        to live, findable and checkable, or it is a
                        hope.

                        The repository already has a mechanism for a
                        controlled vocabulary with addressable
                        entries: the register.

                        This is a federated system. Different
                        repositories will want different glossaries,
                        and a term arriving from a partner will name
                        an entry held there.
decision:               |
                        A glossary is a register whose entries are
                        terms. The type t_term, held in a term
                        register, carries the surface form of the
                        term, the forms it is also known by, and the
                        forms that are not to be used for it.

                        reg_term is the glossary of the cc-public
                        repository. It holds a term for each concept
                        the repository names, whether or not that
                        concept has a type of its own.

                        A record that introduces or settles a concept
                        decides its term, by an r_decides edge to the
                        entry.

                        A term register is validated by sch_reg_term,
                        which composes the general register schema
                        with the term entry schema in the pattern the
                        type register uses.
rationale:              |
                        A register rather than a new mechanism,
                        because a register is exactly a keyed table of
                        addressable entries that is the source of
                        truth for a vocabulary, which is what a
                        glossary is. Keying makes duplicate terms
                        impossible. Identity makes a term something an
                        item can point at. Per register entry schemas
                        make a term entry shape cheap to declare.
                        Supersession and status come for nothing.

                        The federation story is the register's own. A
                        partner brings a glossary the way they bring
                        any register, and two glossaries coexist
                        without either knowing the other exists.

                        A term for every concept and not only for
                        every type, because most of what needs a
                        consistent name has no type: anchor, scope,
                        guard, trait. What has a type is a subset of
                        what has a name.

                        Forms to avoid recorded on the entry, because
                        that is what would have caught the word this
                        record exists to answer for. A form to avoid
                        is not always wrong -- work is an ordinary
                        word -- so the judgement is an eval's and not
                        a check's.
alternative:            |
                        A glossary as a document of its own, with a
                        type and schema unlike a register. Rejected:
                        it would reinvent keyed entries, identity,
                        status and supersession, and its terms could
                        not be pointed at without further work.

                        A glossary as a section of each decision
                        record, defining the terms that record
                        introduces. Rejected: terms would be
                        scattered, and a reader looking one up would
                        have to know which record introduced it.

                        Terms only for things that have types, read
                        from the type register. Rejected: it leaves
                        the concepts most in need of a stable name
                        without one.
consequence:            |
                        Readable ids of terms collide across a
                        federation -- term_component in two glossaries
                        -- while guids do not. That is the issue
                        ddr_protective_marking already records for
                        marks, and is not new.

                        An eval can be written that judges prose
                        against the glossary: that a defined term is
                        used in its defined sense, and that a form
                        under avoid is not used for it. That eval does
                        not yet exist.

                        A term entry has to be written for each
                        concept, which is a cost paid once and read
                        many times.

                        Two words that were one -- relation edge and
                        dataflow edge -- now have entries, and prose
                        that says bare edge is ambiguous.

