title:                  The gate runs on a snapshot, in a worktree of its own
brief:                  |
                        Running the tests takes a worktree at a
                        snapshot of the working copy and runs them
                        there, so that the working copy is free while
                        they run. A flag runs them in place instead.
context:                |
                        A run reads the working copy at three moments
                        and writes to it at the end, which
                        ann_a_run_is_coupled_to_the_working_copy sets
                        out. So nothing may be edited for the fifteen
                        minutes a run takes, and the reason is a
                        coupling rather than a lock: two tests in one
                        run can otherwise see two different trees, and
                        the evidence written at the end can digest
                        code no test exercised.

                        Most writes here are made by an agent running
                        many commands unattended, so fifteen minutes
                        of not writing is paid several times a day.
                        Making the tests faster shortens that and does
                        not remove it.

                        The hiai project solved the neighbouring
                        problem a decade ago by committing everything
                        before building and resetting the head
                        afterwards if anything raised, leaving the
                        working copy untouched. What that bought was a
                        build that ran against a configuration with a
                        name.
decision:               |
                        Running the tests takes a SNAPSHOT of the
                        working copy, adds a detached worktree at it,
                        and runs there. That is what happens by
                        default; a flag runs them in the working copy
                        instead, for the times when that is what is
                        wanted.

                        The snapshot is made through a temporary
                        index, so the real index and the working copy
                        are untouched and UNTRACKED FILES ARE
                        INCLUDED. A new item here is untracked until
                        it is added, and a gate that quietly skipped
                        new records would be worse than no gate.

                        THE WORKTREE HAS AN ENVIRONMENT OF ITS OWN.
                        Pixi rewrites the pointer of its editable
                        install on every invocation, so an environment
                        shared with the working copy is pointed at
                        whichever tree ran last, and a run then tests
                        one tree's code against another tree's data.
                        An environment of its own gives the worktree
                        an editable install that points at the
                        worktree, and that is what makes the code the
                        run exercises the code the snapshot holds.

                        The evidence the run writes is brought back to
                        the working copy, which is the one thread left
                        between them.

                        WHAT THE RUN SAID IS KEPT, AND IS ASKED FOR.
                        The run writes its output to a log as the
                        output is said, and writes what it is doing to
                        a status document beside it. cctool gate
                        --status reads both and says which state the
                        run is in, how long it has been going or how
                        long it took, and how the log ends. Nothing is
                        sent to anybody.
rationale:              |
                        Decoupling rather than speed, because the
                        block is not the duration. A gate that took
                        two minutes would still stop two minutes of
                        work, and the whole complaint is that work
                        stops.

                        Git rather than a copy into a temporary
                        directory, because a snapshot has an identity
                        and a copy has none. Sharing the object store
                        also makes it cheap: the files of a worktree
                        measured seven megabytes, which is nothing
                        beside the environment that has to stand next
                        to them. The identity is what later allows the
                        thing tested to be a commit rather than a
                        moment.

                        Untracked files included, because of what this
                        repository is. Items arrive as new files, and
                        the ones most worth testing are the ones just
                        written.

                        An environment for each worktree, because the
                        alternative was built first and it broke. A
                        shared environment held until two runs
                        overlapped: pixi rewrote the editable install
                        on each invocation, so the environment pointed
                        at whichever tree went last and a run quietly
                        tested the wrong source. The worktree's own
                        environment holds the default feature alone
                        and measured 584 megabytes and five seconds,
                        against the two gigabytes the working copy's
                        holds for every feature together. That is the
                        whole cost of the scheme and it is paid once.

                        The source found through the editable install
                        rather than through a path set for the run,
                        because the install is how the environment
                        already finds the package and a path beside it
                        would be a second answer to one question. With
                        neither, a run started in the worktree imports
                        the code of the working copy and tests the
                        wrong source against the right data. That was
                        measured rather than feared, and it is the one
                        failure this arrangement can have that the old
                        one could not.

                        The report asked for rather than sent, because
                        whoever reads it is nearly always the agent
                        that will work out what went wrong and propose
                        the fix, and an agent reads when it comes back
                        rather than being interrupted. A person who
                        wants to watch has the log, which is written
                        as the run speaks.
alternative:            |
                        Run in place and accept the wait. Rejected: it
                        is what is done now and it is what prompted
                        this.

                        Copy the tree to a temporary directory.
                        Rejected: git shares the object store and so
                        does it more cheaply, and a copy has no name,
                        so nothing can later be said about what was
                        tested.

                        Lock the working copy for the length of a run.
                        Rejected: it makes the block explicit rather
                        than removing it, which is worse than the
                        convention it replaces.

                        Make the tests faster and leave the coupling
                        alone. Rejected as the answer and kept as
                        work:
                        ann_the_layout_check_is_paid_for_many_times
                        and
                        ann_a_run_rechecks_the_whole_tree_at_every_node
                        are both worth doing and neither frees the
                        working copy.

                        One environment shared by the working copy and
                        the worktree. Rejected after it was built:
                        pixi rewrites where the editable install
                        points on every invocation, so the environment
                        pointed at whichever tree ran last. The
                        measurement that first argued for sharing was
                        of the working copy's environment, which holds
                        every feature at once; an environment holding
                        the default feature alone is 584 megabytes.

                        A notification when a detached run ends.
                        Rejected: whoever reads a finding is nearly
                        always the agent that will act on it, and it
                        reads when it comes back. A notification would
                        interrupt the person who detached the run
                        precisely so as not to be interrupted.
consequence:            |
                        A worktree costs about seven megabytes of
                        files and 584 megabytes of environment, the
                        environment paid once. A third would cost the
                        same again, which is among the reasons the
                        worktrees are bounded and few
                        (ddr_gate_worktrees_are_few).

                        What revision is tested becomes an explicit
                        thing rather than an implicit one. Today it is
                        a snapshot made for the run and thrown away. A
                        tentative commit would make it a revision with
                        a name that survives, which is what hiai did,
                        and that is a further decision rather than
                        this one.

                        Nobody watches a run that does not block. So a
                        finding at five seconds and a finding at
                        fifteen minutes are read at the same moment,
                        which takes away most of the value of finding
                        things early. Sequencing the gate to reach its
                        first finding soonest is what would give that
                        back, and it is
                        qst_test_in_a_worktree.objective.

                        The tests are coupled to git, which they were
                        not. Git is present wherever this repository
                        is, so the cost is a dependency named rather
                        than a dependency felt.

                        A run that stopped without recording how it
                        ended is reported as stopped rather than as
                        running, since the process it named is gone. A
                        status that called a dead run live would have
                        whoever read it wait for nothing.

question:

  staged:
    id_self:            qst_test_in_a_worktree.staged
    guid_self:          qst_96416c8c873d4c87994c4eb1bd2919b9
    question:           |
                        Whether the gate becomes several gates of
                        rising cost, with a branch for each unit of
                        work and a tentative commit as the thing each
                        one tests, as hiai did, or whether one gate
                        off the critical path is enough.
    relation:           []

  objective:
    id_self:            qst_test_in_a_worktree.objective
    guid_self:          qst_730a8b063ba1417388a018d9df8d4957
    question:           |
                        Whether a gate that no longer blocks should be
                        sequenced to reach its first finding soonest
                        rather than to finish soonest, and what would
                        order it: what a change reaches, what failed
                        last, or what has told nobody anything for a
                        long time.
    relation:           []

  report:
    id_self:            qst_test_in_a_worktree.report
    guid_self:          qst_a8edb89c30ec4bbdafcc40fd51c53713
    question:           |
                        What tells a person that a detached run has
                        found something, given that the reason for
                        detaching it is that they are doing something
                        else.
    relation:           []

  stale:
    id_self:            qst_test_in_a_worktree.stale
    guid_self:          qst_5d7b0d4173524bf2b6168be4b911820c
    question:           |
                        What stops a worktree and its snapshot
                        outliving the work they were made for, and
                        what happens to the evidence of a run whose
                        working copy has moved on since.
    relation:           []

