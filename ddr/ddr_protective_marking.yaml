question:

  c6accd419:
    id_self:            qst_protective_marking.c6accd419
    guid_self:          qst_876f606f86de4c8788ccd98033e32099
    question:           |
                        Caveats and releasability have no
                        representation. Real markings carry them --
                        SECRET//REL TO GBR, USA qualifies a level with
                        a list of parties it may go to -- and neither
                        the register nor the reference has anywhere to
                        put one. Adding them means either an explosion
                        of marks, one per combination, or a further
                        field naming a register of parties. Deferred
                        until there is a case to be right about.
    relation:           []

  ce752f836:
    id_self:            qst_protective_marking.ce752f836
    guid_self:          qst_550409b64180416ea1ff6c3e945e6eb1
    question:           |
                        The authority is a plain string and should
                        eventually be a reference to an entry in a
                        register of authorities, for the same reasons
                        the mark itself is one. Deferred while there
                        is only one authority, since a register with a
                        single entry settles nothing and constrains
                        the design of the register that eventually
                        matters.
    relation:           []

  cec1b108c:
    id_self:            qst_protective_marking.cec1b108c
    guid_self:          qst_08e86953c17647f6be252f23fa5400dd
    question:           |
                        Where an authority specific mark register
                        lives and what it is called. A second register
                        also called reg_protective_mark, in another
                        repository, would collide by readable id
                        though not by guid. Deferred until there is a
                        mark that must be held apart.
    relation:           []

  c23866364:
    id_self:            qst_protective_marking.c23866364
    guid_self:          qst_cf3dac8ecbb544efb06c042f5aea291c
    question:           |
                        Whether cc is the right authority for
                        mark_public. A public mark is scheme
                        independent in effect, and naming an authority
                        for it says only who declared it.
    relation:           []
