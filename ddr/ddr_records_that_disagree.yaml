title:                  Contradiction is made hard to write before it is made easy to find
brief:                  |
                        Define the words that carry weight, tie a
                        decision to what it serves, and only then
                        judge a bounded set. Judging every pair of
                        records is not attempted.
context:                |
                        Two records disagreed and nobody noticed.
                        ddr_segment said the core holds what travels
                        and named the tool among them;
                        ddr_check_architecture said in its consequence
                        that the rules live in python and therefore do
                        not travel. It was found when a person held an
                        intent against the documents, which is not a
                        thing that happens on a schedule.

                        Three measurements taken on 14 September 2026
                        shape what can be done about it.

                        The word they disagreed about, travel, appears
                        in the prose of twenty five records and is in
                        no glossary. Both reached for the same word
                        and meant opposite things by it, and nothing
                        could notice, because nothing said what it
                        meant.

                        Sixty eight targets are decided by more than
                        one record. So two records deciding one thing
                        is the normal case, one for the architecture
                        and another for a detail, and it cannot serve
                        as the signal that they disagree.

                        Two of the design decisions in this tree say
                        what need they serve. The rest are untethered,
                        so there is no bounded set of records
                        answering one question.

                        The general problem is pairwise. A hundred and
                        twenty records is about seven thousand pairs,
                        almost none of which disagree.
decision:               |
                        Contradiction between records is made HARDER
                        TO WRITE before it is made easier to find, in
                        three steps taken in this order.

                        FIRST, a word that carries weight across
                        records is a term. The glossary is where two
                        records are made to mean the same thing, and a
                        disagreement about a word nothing defines
                        cannot be seen by anything.

                        SECOND, a decision says what it serves.
                        Records answering one question are the ones
                        that can disagree, and the derivation is what
                        makes that set bounded.

                        THIRD, and only then, a judge over a bounded
                        set: the records sharing a term, or the
                        records under one need. evl_set_consistent
                        already does this across the members of a
                        requirement set, so the shape exists.

                        JUDGING EVERY PAIR OF RECORDS IS NOT
                        ATTEMPTED.
rationale:              |
                        Prevention before detection, because a
                        contradiction about a defined term is visible
                        to whoever writes the second record, and one
                        about an undefined word is invisible for ever.
                        The case that prompted this lived in a word
                        used in twenty five records and defined in
                        none.

                        Derivation second, because it is what bounds a
                        set, and every affordable thing in this
                        repository is done over a bounded set. It is
                        also the cheaper of the two to be wrong about:
                        a decision tied to the wrong need is a bad
                        edge, where a word defined wrongly is a bad
                        meaning.

                        A judge last, because it is the only one of
                        the three that costs money each time it runs,
                        and because nothing here admits a judge that
                        has not been measured on control cases.
                        Control cases need a population to be drawn
                        from, and a population is what the first two
                        steps produce.

                        Pairwise judging is rejected on arithmetic
                        rather than on taste. Seven thousand pairs, a
                        base rate near zero, and nothing to measure a
                        judge against, so the false alarms would swamp
                        the findings and there would be no way to say
                        by how much.
alternative:            |
                        Judge every pair of records. Rejected above,
                        on arithmetic.

                        Treat two records deciding one target as the
                        signal. Rejected on measurement: sixty eight
                        targets are decided twice and that is
                        ordinary.

                        Rely on a person noticing. Rejected as the
                        only route and kept as one, since it is what
                        found this contradiction. What it cannot be is
                        a mechanism, because it happened when somebody
                        held an intent against the documents and
                        nothing schedules that.

                        A formal language for the claims a record
                        makes, so that contradiction is decidable.
                        Rejected: it would make a record checkable by
                        a machine by making it unreadable to a person,
                        and the reason a record is prose is that a
                        person is who it is for.

                        Forbid a record from repeating what another
                        says, so that nothing can disagree. Rejected:
                        a consequence that mentions what another
                        record decides is how a reader is told where
                        to look, and the aside that was wrong here was
                        useful when it was written.
consequence:            |
                        The glossary gains work. Words carrying weight
                        across records have to be found and defined,
                        and the gap report ranks by how often a word
                        appears rather than by how many records use
                        it, which buries the ones that matter under
                        the ones that are merely common.

                        Decisions gain a derivation, and two of them
                        have one today. Where a decision serves the
                        tool rather than any stated need, what it
                        derives from is not obvious and is a question
                        below.

                        Nothing is built. The three steps are an order
                        of effort, not a mechanism, and each is a
                        piece of work of its own.

                        A contradiction can still be written and can
                        still last. What changes is that the common
                        kind, two records meaning different things by
                        one word, becomes visible to whoever writes
                        the second.
