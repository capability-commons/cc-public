    question:           |
                        Whether a deployment should record enough
                        about the model to reproduce a run, given the
                        point above, and whether that is possible at
                        all for a model served remotely.
    relation:           []

  cf409ed2c:
    id_self:            qst_workflow_deployment.cf409ed2c
    guid_self:          qst_bd1061fa17624c319b0f35285c114039
    question:           |
                        Whether a workflow may state requirements on
                        its deployment without naming one -- a minimum
                        capability, a maximum cost -- so that a
                        definition can decline to run rather than run
                        badly.
    relation:           []

  c9cdc06ee:
