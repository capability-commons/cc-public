    guid_self:          qst_faae664b8cc140908f6e709d099ad024
    question:           |
                        Whether transitivity licenses a structured
                        item check to hold a concept-valued field
                        within a subtree of the concept hierarchy, and
                        what computing that closure costs on every
                        check.
