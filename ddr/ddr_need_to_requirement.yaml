title:                  From need to requirement
brief:                  |
                        A requirement derives from a need through
                        analysis under a framing. The decomposition is
                        a design decision that separates what it
                        assumes about the world from what it chooses,
                        is challenged from a second model, and is
                        judged for sufficiency as a set. Framings and
                        methodologies are registers.
context:                |
                        A need is a demand with no entity; a
                        requirement is an obligation on one. Only the
                        broadest requirements follow from a need in
                        one step. A need such as resilient frontline
                        power is first broken into smaller problems,
                        and how it is broken down depends on how it is
                        looked at: as a logistics problem, an
                        electronic warfare problem, a power problem.
                        The legacy work explored framings for this,
                        and assessments of a need under a framing.
                        Different analysis methodologies may apply,
                        and the whole is to be driven by a workflow.
decision:               |
                        Derivation is by ANALYSIS. A need is refined
                        into narrower needs, and a narrow enough need
                        into requirements on an entity, each step
                        recorded by r_is_derived_from edges from what
                        was produced to what it came from. The first
                        decomposition that chooses the entity records
                        it on the child need's entity slot, so the
                        chain runs need, need on an entity,
                        requirement, as ISO 29148 runs stakeholder
                        need, stakeholder requirement, system
                        requirement.

                        The DECOMPOSITION is a design decision item, a
                        t_ddr deriving from the need, whose context
                        names the need and the framing, whose decision
                        names the children, whose alternative names
                        the other cuts considered, and whose
                        ASSUMPTIONS, entries with identities of their
                        own, state each claim about the world the cut
                        relies on with its evidence. The assumptions
                        are the evidential half of the decision and
                        the decision is the design half; they are
                        checked differently, by evidence and by
                        argument, and the assumption eval refuses a
                        claim of design among them.

                        The decision is CHALLENGED. A second node, on
                        a second model the deployment names and
                        refuses to be the first, writes the strongest
                        case against it: a child that does not serve
                        the need, an uncovered part of the outcome, an
                        assumption that is false or unevidenced, a
                        threat the context names that no child
                        answers, a rejected alternative that was
                        better. The proposer answers it in a
                        resolution, standing, revising or conceding,
                        and the loop runs until the challenger
                        concedes or the budget is spent. The challenge
                        and the resolution stay on the record as its
                        defense.

                        A decomposition is judged as a SET: given the
                        parent, the assumptions and the children, do
                        the children together deliver the outcome for
                        the subject in the context, and are the
                        threats the context implies answered or named
                        as not. That is evl_decomposition_sufficient,
                        on the derivation edge.

                        A FRAMING is an entry of reg_framing: what it
                        treats as the problem, what it makes salient,
                        what responses it admits. The analysis binds
                        one; competing decompositions of one need are
                        the same need under different framings, each
                        its own decision item. A METHODOLOGY is an
                        entry of reg_methodology; a component that
                        follows one names it.

                        The priority of the need bound sets the budget
                        of the run, through budget_by_priority on the
                        deployment. A decomposition a workflow makes
                        is proposed until a person accepts it.
rationale:              |
                        Assumptions beside the decision, because a
                        requirement realises a need only together with
                        what is true of the environment, which is Zave
                        and Jackson's reference model, and because the
                        admissible claims position says a claim
                        needing both evidence and argument is two
                        claims. A decomposition that carries its
                        assumptions can be wrong in a way that is
                        findable; one that does not hides its false
                        premise in a polished cut.

                        A challenge from a second model, because a
                        defense built by the process that made the
                        claim is the claim restated. The first
                        decomposition run showed the mechanism: the
                        challenger found two gaps the proposer had
                        called closed.

                        Sufficiency as a set, because KAOS defines a
                        refinement as complete when the children
                        together entail the parent given the domain
                        properties, INCOSE asks that children be
                        necessary and sufficient, and the LLM
                        literature finds that local quality is not
                        system quality: models produce well formed
                        children that together miss the parent.

                        Framings as a register, on the precedent of
                        problem frames: a catalogue of ways to cut a
                        problem, each with a known concern, is what
                        makes exploring alternatives systematic rather
                        than a fresh invention each time. A framing is
                        reusable; its application is the
                        decomposition.

                        The entity as a slot on the need rather than a
                        type, because the rung between a need and a
                        requirement differs from a need only in naming
                        the entity, and 29148 treats it as a
                        stakeholder requirement, still in the
                        stakeholder's voice.

                        Priority driving the budget, because uniform
                        rigour spends the scarce passes where they
                        change nothing.
alternative:            |
                        Direct derivation only. Rejected: it works for
                        the broadest requirements and hides the
                        decomposition that produced the rest.

                        A decomposition as one design claim,
                        assumptions folded into its rationale.
                        Rejected: the evidential and the design halves
                        have opposite failure modes, fabrication and
                        timidity, and one check cannot serve both.

                        The proposer generating its own counter-case.
                        Rejected: the same blind spots produce the
                        appearance of scrutiny; independence is what
                        makes an argument a defense.

                        Framings as items per need, as the legacy
                        chain had, and assessment items between
                        framing and decomposition. Rejected and
                        deferred: the reusable thing is the lens, and
                        the decision item's context and questions
                        carry what an assessment carried, until
                        evidence says otherwise.

                        A separate type for a need on an entity.
                        Rejected: one optional slot does the work.
consequence:            |
                        The first run of wf_decomposition_from_need,
                        on the frontline power need under the
                        dependency framing with a small proposer and a
                        strong challenger, converged in two passes and
                        exposed three faults, each now answered: the
                        loop ended on a false met because the eval let
                        a resolution to an earlier challenge pass for
                        the new one; a later pass inserted the
                        assumption table on top of itself; and one
                        assumption was a claim of design. The record
                        is a confirmed case on three evals.

                        The children of a decomposition are named in
                        its decision and are not yet items.
                        Materialising them, one child need per element
                        of a list the model returns with the
                        derivation edges made by the executor, is the
                        next executor feature, the same mechanism that
                        fills a table.

                        evl_decomposition_sufficient is anchored on a
                        relation and so is not consulted by a guard,
                        which judges one item; it runs after. Making a
                        guard consult a relation eval, or the executor
                        judge a pair, is open.

                        The deployment refuses one model for both
                        nodes. Nothing yet refuses the judge being the
                        challenger's model; a third independence,
                        judge from challenger, is worth a rule when
                        the evidence shows it matters.

                        Sources: Zave and Jackson, Four dark corners
                        of requirements engineering; van Lamsweerde,
                        goal oriented requirements engineering;
                        Jackson, Problem frames; ISO/IEC/IEEE 29148;
                        the INCOSE guide to writing requirements; the
                        Continental ADAS requirements method; the
                        admissible claims position in the reference
                        library.

question:

  framing:
    id_self:            qst_need_to_requirement.framing
    guid_self:          qst_510c6333669a415c94f99b2fd7483663
    question:           |
                        What a framing item carries beyond a name: the
                        scope it asserts, the sub-problems it makes
                        salient, the solution kinds it admits, and
                        whether it also carries the questions an
                        assessment answers.
    relation:           []

  methodology:
    id_self:            qst_need_to_requirement.methodology
    guid_self:          qst_8584982e5bcd45e3ae6aeb68c5011be8
    question:           |
                        Whether analysis methodologies are a register
                        of named methods that a component declares it
                        follows, or are simply what a component is.
    relation:           []

  compare:
    id_self:            qst_need_to_requirement.compare
    guid_self:          qst_18204dd8f7a348d58d7fe0fd324aa4ff
    question:           |
                        How competing decompositions of one need are
                        compared: by the evals on their children, by a
                        judgement over the two decision items, or by a
                        person.
    relation:           []

  guard:
    id_self:            qst_need_to_requirement.guard
    guid_self:          qst_46d6871ca8d14ec6bac1a1cde5208c22
    question:           |
                        Whether a guard should be able to consult an
                        eval anchored on a relation, so that
                        sufficiency can send a decomposition round,
                        given that the executor judges one item at a
                        time.
    relation:           []

  children:
    id_self:            qst_need_to_requirement.children
    guid_self:          qst_6cf86534914c4170b7ed88dcb9dc767a
    question:           |
                        Whether the children of a decomposition should
                        be made as need items by the executor from a
                        list the model returns, with derivation edges,
                        and how a later pass revises rather than
                        remakes them.
    relation:           []

