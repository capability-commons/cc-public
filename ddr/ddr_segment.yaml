question:

  ignore:
    id_self:            qst_segment.ignore
    guid_self:          qst_21476e98b5774116bb0c856c105d97d2
    question:           |
                        Whether a segment should declare what is not
                        an item, so that a repository can hold its
                        captures, scripts and rendered documents in
                        visible directories instead of a hidden one.
    relation:           []

  publish:
    id_self:            qst_segment.publish
    guid_self:          qst_e36aeb9367cf4733871a26cff0213b0f
    question:           |
                        What a segment publishes as against what it
                        merely holds, when a third segment consumes a
                        second: whether everything of a consumed
                        segment is visible, or only what it declares
                        public.
    relation:           []

  lifecycle:
    id_self:            qst_segment.lifecycle
    guid_self:          qst_a73b65611cdd43448dccf7e181eb190d
    question:           |
                        What a status claims once segments exist: who
                        asserted it, against which revision of the
                        content, under what authority, and what a
                        reader of another segment may conclude from
                        it. The vocabularies differ by type today, and
                        differ for good reasons; what must travel
                        between segments is the contract, not the
                        vocabulary.
    relation:           []
