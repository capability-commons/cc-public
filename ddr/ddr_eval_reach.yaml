title:                  What an eval can be asked
brief:                  |
                        An eval names the types of item it applies to,
                        because an anchor reaches further than a
                        criterion can answer.
context:                |
                        evl_record_and_item_agree is anchored on
                        r_decides and holds a record against an item
                        it decides. It had never been run. Its
                        subjects ran from 3.3k to 13.4k characters,
                        and the suspicion was that they were too large
                        to judge reliably.

                        It was measured against nine pairs, each
                        judged as it stands and again with one clause
                        of the record's decision replaced by something
                        the item plainly contradicts. Size was not the
                        problem. The three largest pairs, to 13.4k,
                        discriminated five out of five both ways.

                        What separated the cases was whether the
                        item's document holds the substance the record
                        decides about. A register holds its table. A
                        schema holds its properties. A code item holds
                        five lines of prose about code kept in a file
                        the judge is never shown.

                        Of three record and code pairs, none was
                        detected. One returned unmet unmutated,
                        reading the code item's silence as
                        disagreement though the criterion forbids
                        exactly that. Half of the 58 pairs the eval
                        reached were code.
decision:               |
                        An eval may name the types of the items it
                        applies to, in subject.include_type. Every
                        item shown to a judge must be of a named type,
                        both ends of a join included. An eval naming
                        none applies to everything its anchor reaches.

                        Coverage is named. Exclusions are not.

                        evl_record_and_item_agree names t_ddr,
                        t_register and t_schema, and reaches 29 pairs
                        where it reached 58.

                        evl_record_and_code_agree holds the criterion
                        for the other half. It names no relation, so
                        it reaches nothing and never runs. It gains an
                        anchor when a source item carries its source.
rationale:              |
                        An anchor is a relation, and a relation is not
                        obliged to join one kind of thing. r_decides
                        ends at whatever a decision can settle, which
                        ddr_relation_register already observes is
                        everything. So an eval anchored on a relation
                        reaches further than its criterion can answer,
                        and until now nothing let it say so.

                        Coverage is named rather than exclusions
                        because the two fail differently. A type added
                        later falls outside an eval that names
                        coverage, which leaves a gap. It would fall
                        inside an eval that names exclusions, which
                        produces findings that are wrong. A gap is
                        cheaper than a falsehood, and
                        ddr_judge_subject already records that a
                        silent gap is the standing cost of this
                        design.

                        Two evals rather than one criterion covering
                        both, because the two differ in what the judge
                        must be shown. One reads a document. The other
                        must read source. That is not a detail of
                        scope; it is what makes the second impossible
                        today.
alternative:            |
                        Narrowing by scope, as evl_prose_describes was
                        narrowed. Not available. The substance is both
                        what makes a subject large and what the
                        criterion needs, and for a code item it is not
                        in the document at any size.

                        Giving code items their source, so the eval
                        could judge them. Deferred rather than
                        rejected. It is what evl_record_and_code_agree
                        waits on, and it changes what a source data
                        item is.

                        Naming excluded types instead of included
                        ones. Rejected above.

                        Leaving the eval as it stood. Rejected: half
                        of what it reached was unjudgeable, and since
                        it had never been run nobody would have found
                        out from using it.
consequence:            |
                        Source addressability made code addressable
                        and not examinable. ddr_source_addressability
                        was taken partly on the ground that it would
                        let evals judge code. It does not, and cannot
                        until a source item carries more than
                        metadata. That is recorded here rather than
                        left standing as a claim nobody checked.

                        Composition hides substance the same way, at
                        one remove. sch_register inherits id_self
                        through a $ref and never declares it, so a
                        claim about those fields meets nothing in the
                        document. Sixteen of the nineteen schemas this
                        eval judges compose by $ref, so the blind spot
                        is present wherever a record's claim concerns
                        a composed field rather than a declared one.
                        One of the nine control pairs failed for this
                        reason and not for the code one.

                        An eval naming a type no item carries reaches
                        nothing, and says nothing about it.

                        ddr_source_item gave source items their source
                        as a projection an eval asks for, and
                        evl_record_and_code_agree gained its anchor on
                        r_decides, reaching the pairs where the
                        decided item is a class or a function.

