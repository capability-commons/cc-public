title:                  Terminology
brief:                  |
                        A concept is called by the standard, least
                        surprising name for it unless there is a
                        recorded reason not to.
context:                |
                        The unit of transformation in a workflow was
                        called a work. The word came from a phrase in
                        conversation and was kept because workflow
                        contains it. It confused the one reader it
                        had, and it was replaced by component -- the
                        composite pattern's own name for that role,
                        and stableflow's.

                        Renaming it touched a hundred and ten places
                        in prose and seven files by identifier. A word
                        chosen carelessly is expensive to unchoose.
decision:               |
                        A concept is named by the term the nearest
                        established vocabulary already uses for it:
                        the literature, stableflow, the domain the
                        reader comes from.

                        A departure from that term needs a reason, and
                        the reason is recorded in the glossary entry
                        or in a design decision.

                        A term is entered in the glossary when it is
                        introduced, together with the forms it
                        displaces.

                        A name that reads two ways is not chosen,
                        however apt one of the readings is.
rationale:              |
                        A name has one job, which is to be understood
                        by its reader without explanation. A standard
                        term is understood by anyone who knows the
                        standard, and a reader of this repository is
                        more likely to know the composite pattern or
                        stableflow than to know a coinage.

                        A pun is not a reason. That workflow contains
                        work was pleasing and told the reader nothing.

                        Recording the reason for a departure is what
                        separates a considered choice from a careless
                        one, and is what lets a later reader decide
                        whether the reason still holds.
alternative:            |
                        Coining terms for precision, on the ground
                        that a standard word carries baggage from its
                        standard meaning. Rejected as the default: the
                        baggage is usually the point, since it is what
                        the reader already knows, and where a standard
                        word genuinely misleads, that is the recorded
                        reason for departing from it.

                        Letting names emerge and settling them later.
                        Rejected: the cost of unchoosing a name grows
                        with every use of it.
consequence:            |
                        Some terms carry meanings from their standard
                        use that do not all apply here. Component in
                        SysML suggests a deployable unit; here it need
                        not be. The glossary entry is where the
                        difference is stated.

                        Naming a concept now takes a lookup before a
                        choice.

                        The glossary, in ddr_glossary, is what makes
                        the decision checkable rather than
                        aspirational.

