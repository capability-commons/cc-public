title:                  Checking the term ontology
brief:                  |
                        Explicit ontology semantics make referential,
                        logical and conformance faults mechanical
                        while evidence and judgement remain
                        responsible for truth.
context:                |
                        ddr_term_concept_identity makes each term
                        entry the identity of one concept. It permits
                        semantic edges between those entries and
                        closes each grounding operation over the term
                        identities visible at one revision.

                        A graph of named edges improves navigation but
                        does not alone define correctness. A checker
                        must know which endpoints a relation permits
                        and whether the relation is acyclic,
                        transitive, symmetric, inverse to another or
                        incompatible with another. The current
                        relation register expresses domain, range and
                        acyclic, and the relation check enforces them.

                        Language model evals presently judge
                        distinctions that range from interpretation to
                        stable categorical rules. The ontology creates
                        an opportunity to move the stable rules into
                        deterministic checks without claiming that
                        every meaning or fact has become formal.
decision:               |
                        Correctness expressed by the term ontology is
                        checked mechanically in layers.

                        Ontology integrity checks validate references,
                        permitted endpoints, cycles and every other
                        semantic property explicitly declared for a
                        relation. A checker derives no property from
                        the readable name of a relation or from its
                        descriptive prose. Semantics that support
                        inference are data in the relation register
                        and travel with the vocabulary.

                        Grounding integrity checks require a decorated
                        occurrence to select an accepted term identity
                        from the vocabulary visible in its scope and
                        revision. The literal form must be a form
                        recorded for that concept. An absent candidate
                        remains ungrounded and several viable
                        candidates remain ambiguous; neither condition
                        is resolved by register order.

                        Structured item checks may constrain
                        concept-valued fields and relation targets by
                        concept hierarchy or other declared ontology
                        semantics. They compute only the closure
                        licensed by those semantics. Decorating a word
                        identifies its concept but does not turn the
                        proposition containing it into a formal
                        assertion. A check does not infer subject,
                        predicate or object structure from prose
                        unless another design gives that prose a
                        controlled grammar or a structured
                        representation.

                        A mechanical result establishes referential
                        correctness, logical consistency or
                        conformance to recorded constraints. It does
                        not establish that the ontology, the selected
                        grounding or a claim about the world is true.
                        Evidence, human decisions and evals continue
                        to establish what the formal data cannot.

                        When an eval repeatedly judges a stable
                        distinction that can be stated as an ontology
                        relation or constraint, its deterministic part
                        moves to a mechanical check. Any part that
                        still requires interpretation remains in the
                        eval.
rationale:              |
                        A finite vocabulary at a known revision makes
                        grounding and closure bounded and
                        reproducible. A failure can name the identity,
                        edge or constraint that caused it rather than
                        report a probabilistic judgement.

                        Declaring inference semantics in the relation
                        register keeps the relation vocabulary
                        self-describing across a federation.
                        Hard-coded knowledge of selected relation
                        names would give the local tool rules that a
                        partner could neither discover nor reproduce
                        from the shared data.

                        The layers keep unlike assurances apart.
                        Resolving an identity, proving that a graph
                        has no forbidden cycle and deciding that a
                        sentence refers to the world accurately are
                        different claims. Reporting them as different
                        checks prevents internal consistency from
                        being mistaken for truth.

                        Moving formal distinctions out of evals
                        reduces cost and variance while leaving
                        interpretive questions where an eval or a
                        person can answer them.
alternative:            |
                        Using ontology edges only for search and
                        display was rejected. It would leave
                        constraints that are already deterministic to
                        repeated interpretation and would not prevent
                        inconsistent graphs.

                        Implementing one Python rule for each relation
                        was rejected as the default. The rule would
                        not travel with the relation and code and
                        vocabulary could drift. A general checker over
                        declared semantics is preferred; a special
                        check remains appropriate only where the rule
                        cannot be expressed by the shared ontology
                        contract.

                        Treating a grounded occurrence as a formal
                        assertion was rejected. A noun sense does not
                        encode what a sentence predicates of it, and
                        pretending otherwise would create confident
                        but unsupported conclusions.

                        Replacing evals and evidence with ontology
                        checks was rejected. Formal consistency cannot
                        show that the formalization is complete, that
                        a grounding matches authorial intent or that a
                        claim matches the world.
consequence:            |
                        The first ontology checks need no inference
                        engine beyond the existing reference and
                        relation checks: identity resolution, domain,
                        range and acyclicity already have
                        deterministic meanings. Additional inference
                        becomes checkable only after its semantics are
                        represented in the relation register.

                        The lexical index used for grounding retains
                        every matching term identity. Grounding checks
                        report ambiguity and absence as states with
                        locations, rather than choosing a fallback
                        concept.

                        Structured schemas and items can progressively
                        replace unconstrained strings with concept
                        references where the stronger contract earns
                        its cost. Unstructured prose remains readable
                        and may be decorated without being treated as
                        a structured claim.

                        An ontology can be internally valid and wrong.
                        Changes to its concepts, groundings and
                        semantic relations therefore need review and,
                        where they make claims about the world,
                        evidence. Mechanical checks narrow the work
                        left to judgement; they do not remove it.

                        Whether inferred edges are materialized or
                        computed for each query, the schema for
                        relation properties beyond domain, range and
                        acyclic, and the acceptance criterion for
                        migrating a rule from an eval remain open.

