title:                  'Observations: captured sources as items'
brief:                  |
                        A captured public source is an item with a
                        digest, imported deterministically, that needs
                        derive from.
context:                |
                        The demonstration for Brave1 begins with
                        public information, a social media post, and
                        ends with proposed engineering items. Needs
                        carry evidence as prose, and nothing in the
                        tree stood for the captured source itself, so
                        a need's derivation began at the model's
                        interpretation rather than at what was seen.
                        The opportunity-formation proposal
                        distinguishes source, observation, claim,
                        evidence relation and provenance; the
                        demonstrator design proposes one small
                        observation item for now.
decision:               |
                        An observation is an item of type
                        t_observation, prefix obs, living in
                        observation/. It holds what was captured,
                        unchanged: the content as a block scalar, the
                        source kind, the locator, the attribution as
                        the source attributes itself, the publication
                        time where the source gives one, the
                        observation time, the capture method, and a
                        digest over the canonical content. It is
                        imported by cctool observe from a capture file
                        in a platform-neutral form; no model takes
                        part in capture, digest, time or marking. The
                        content is canonicalised before it is digested
                        and stored, to its words and paragraphs:
                        Unicode NFC, a run of whitespace within a
                        paragraph, newlines included, made one space,
                        paragraphs kept apart by a blank line; that is
                        what the printer preserves, so the stored
                        content digests as the capture did. A capture
                        whose digest an observation already carries is
                        reused, not duplicated; a changed source is a
                        new observation. A need derives from an
                        observation by r_is_derived_from, whose range
                        grows to include the type. An observation has
                        no status. The content is data: the importer
                        does nothing the content says, and a prompt
                        that reads an observation says it is untrusted
                        material to analyse.
rationale:              |
                        The graph should begin at what was captured,
                        so that anyone can ask what exactly was seen,
                        where and when, and which parts of the
                        engineering interpretation came from it. A
                        digest makes the observation an exact revision
                        that later claims can bind to. Reuse by digest
                        keeps a retried import from looking like
                        independent corroboration. Combining source
                        and observation in one item is the smallest
                        shape that serves the demonstration; the cases
                        that would split them, several passages from
                        one source or a source that cannot be copied,
                        have not arisen. Recording attribution as
                        observed, and saying so in the schema, keeps a
                        handle from being read as a verified identity
                        or an authority to speak.
alternative:            |
                        Keeping the post in the need's evidence prose:
                        rejected, since the source then has no
                        identity, no digest and no neighbourhood in
                        the graph. Separate source, observation, claim
                        and provenance items: deferred until a case
                        needs them. Letting the importer fetch the
                        post: rejected, since scraping is
                        platform-specific and a fetched page is not a
                        reviewed capture. A status on observations:
                        rejected; a correction is a new observation.
consequence:            |
                        A new type, schema and directory; the
                        derivation relation's range grows; a command
                        that writes one item from a file; a test that
                        the digest is stable under whitespace and
                        newline variation and that stored content
                        canonicalises to the capture. A hard line
                        break inside a paragraph is not kept, which a
                        post that is a poem would notice. A need's
                        evidence still says in prose what the
                        observation supports, which the observation
                        cannot say for itself.

