title:                  Eval design
brief:                  |
                        An eval holds one criterion, answered MET or
                        UNMET by a language model, anchored by an edge
                        on the eval itself.
context:                |
                        Every check up to this point is structural:
                        that a file parses, that identifiers are well
                        formed and distinct, that references resolve,
                        that a document matches its schema. All of
                        them are deterministic, cost nothing, and
                        answer questions about shape.

                        The qualities that matter most in a data item
                        are not structural, and most of these items
                        will be written by a language model. Whether a
                        brief actually states the decision, whether an
                        alternative names something genuinely
                        rejected, whether prose has drifted into
                        argument -- none of that is reachable by a
                        schema.

                        A type and a relation for evals existed as
                        vocabulary from the outset with nothing behind
                        them.

                        The first attempt at an eval was rubric
                        shaped: a graded score from zero to one, a
                        threshold, and prose explaining what the
                        endpoints meant. It ran to 103 lines to
                        express twelve lines of criterion, and roughly
                        half of it was prose arguing for its own shape
                        -- the very fault it was written to detect.
decision:               |
                        One eval holds one criterion, answered MET or
                        UNMET. Not a score, not a grade, and not
                        several criteria at once.

                        An eval carries examples, at least one MET and
                        at least one UNMET, each being an input, the
                        verdict it should receive, and the feedback a
                        judge should give.

                        An eval names what it applies to by an edge on
                        ITSELF, through one of three anchors: items of
                        a type, items a schema specifies, or pairs of
                        items joined by a relation. The schema anchor
                        is transitive through composition.

                        An eval declares a severity, drawn from the
                        same two values the structural checks use.

                        An eval declares what it is given of each
                        subject, as paths to include and paths to
                        exclude. A judge sees that and nothing else.

                        Evals do not run unless asked for. Selecting
                        what would be judged is separated from judging
                        it.
rationale:              |
                        Binary rather than graded, on the evidence.
                        Reducing a criterion to a minimal proposition,
                        so that the judge answers whether rather than
                        how much, yields the highest agreement between
                        judges. A single opaque score across several
                        criteria is the least reliable arrangement
                        available.

                        One criterion per eval, and so one per call,
                        because a verdict reached on one criterion
                        colours a verdict reached on another in the
                        same call.

                        Both a MET and an UNMET example are required
                        because a judge shown only what passes tends
                        to accept, and one shown only what fails tends
                        to reject.

                        The edge sits on the eval for the reason it
                        sits on a design decision: adding an eval is
                        then one new file rather than an edit to
                        everything it judges, and nothing carries a
                        reference to the machinery that judges it.

                        The schema anchor is transitive because
                        specification already is. An eval anchored on
                        a trait reaches every item carrying that
                        trait, including item types not yet invented,
                        without being restated for each.

                        Feedback rather than a number, because a
                        reflective optimiser consumes textual
                        feedback, and because a developer reading a
                        report wants the critique rather than the
                        score.

                        An eval says what it is given because a judge
                        given more than the criterion concerns answers
                        unreliably. Measured: on four near identical
                        schemas, a judge given whole items disagreed
                        with itself on two of the four across repeated
                        calls at temperature zero, while the same
                        criterion on the same subjects narrowed to
                        their prose was correct and stable on fifteen
                        cases of known answer over ten runs each. The
                        verdict had been resting on weighing
                        everything present rather than on the passage
                        in question.

                        Off by default because a command that
                        sometimes costs nothing and sometimes costs
                        money and a minute is a command people stop
                        running.

                        Selection separated from running because
                        selection is useful alone: it answers what
                        would be judged and at what cost, with no
                        model, credentials or network, and it is the
                        same step that hands an optimiser its dataset.
alternative:            |
                        A graded score with a threshold, which was the
                        first design. Rejected on the evidence: the
                        graded score is the less reliable primitive,
                        and an optimiser wants feedback text rather
                        than a scalar in any case. The threshold and
                        the prose explaining the scale both
                        disappeared with it.

                        Several criteria in one eval. Rejected for the
                        halo effect.

                        Pairwise comparison of two candidate items.
                        Not so much rejected as inapplicable: pairwise
                        is the primitive for relative quality, and
                        these are absolute gates.

                        Anchoring evals on types alone. Rejected: a
                        criterion about prose applies to everything
                        with prose, and binding it to a type would
                        mean restating it for each type and letting
                        the copies drift.

                        The edge on the item being evaluated, which is
                        what the original r_is_evaluated_by_eval
                        assumed. Rejected, and that relation removed.

                        A scope field declaring what the judge is
                        given. Rejected: the criterion already says
                        so, in words the judge reads, and a second
                        statement of it is a second thing to keep in
                        step.
consequence:            |
                        The eval is the objective function. What gets
                        optimised is the generator, or the item under
                        evaluation, and never the criterion -- which
                        is hand written and stays so.

                        Judging costs real money and real time. Two
                        evals over twenty four items is thirty four
                        judgements and some fifty thousand tokens of
                        input.

                        Much of that is because a judge is given whole
                        items rather than the fields a criterion cares
                        about. That is the price of having no scope
                        field, it is known, and it is the first thing
                        to narrow when the cost is felt.

                        The judge must not be the same model family as
                        the generator, which means model configuration
                        belongs outside the eval and the verdict has
                        to record which model reached it.

                        Nothing checks that an eval is well
                        calibrated. A badly written criterion produces
                        confident nonsense, and only its examples
                        stand between it and that.

