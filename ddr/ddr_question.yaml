title:                  Questions are items
brief:                  |
                        What a design decision leaves open is held as
                        entries with identities, and answered by an
                        edge from whatever settles it, so that what is
                        still open is a query and not a reading.
context:                |
                        Seventy eight open questions stood across
                        thirty four records, as prose. Two of them
                        said in their own text that they had since
                        been answered, and both sentences had been
                        written by editing the paragraph. That is the
                        stale claim pattern in reverse: a fact about
                        the system recorded where nothing can check
                        it.

                        Nothing in the data says when a record was
                        written. The only date anywhere is the one on
                        an eval's confidence. Whether a question had
                        ever been revisited could not be asked.
decision:               |
                        A question is an entry on its record, under
                        question, with an identity of its own and its
                        text. It is made with cctool insert, keyed by
                        the content of its text as a control case is.

                        A question is answered by an r_answers edge
                        from the item that settles it, which may be a
                        later record, a schema, or a module. It is
                        never answered by editing its text.

                        A question with no incoming r_answers edge is
                        open. cctool questions lists them, and --open
                        lists only those.

                        The prose field open_question is refused by
                        the record schema, so that no record keeps
                        one.

                        cctool unset removes a field, which the
                        migration needed and which the edit commands
                        had left open.
rationale:              |
                        The same move that answered suppression:
                        something that was prose becomes an item, and
                        what was a sentence becomes an edge. An entry
                        can be pointed at; a paragraph cannot. Whether
                        a question is open is then a fact about the
                        graph, read by a query, and not a judgement
                        made by reading.

                        An edge from the answerer rather than a mark
                        on the question, for the reason r_decides goes
                        on the record and not on the item: the thing
                        that settles a matter is what changed, and the
                        question need not be touched to be answered.
                        It also lets a question be answered from
                        anywhere, which is how they were being
                        answered in practice, by records written
                        later.

                        No date on a question, because nothing here
                        has one and one field on one type would decide
                        by accident a question that belongs with
                        staleness generally. The repository's history
                        knows when a question was asked.

                        Keyed by content rather than by number, so
                        that the same question is the same entry and
                        inserting one does not renumber the rest.
alternative:            |
                        Leaving questions as prose and adding an eval
                        that asks whether each is still open.
                        Rejected: the answer may be anywhere in the
                        repository, and an eval's subject is one item
                        or two.

                        Marking a question answered by editing it, as
                        was being done. Rejected: it is a claim
                        nothing checks, and it is exactly what this
                        repository exists to stop.

                        Migrating gradually, keeping both forms while
                        records were revisited. Rejected: two forms of
                        one thing is what the migration was for.

                        A date on each question. Deferred, with the
                        staleness question generally.
consequence:            |
                        What is open is one command. What answered a
                        question is an edge that the reference check
                        verifies exists.

                        Seventy eight questions became seventy eight
                        entries in one migration, reviewable as one
                        diff. Two carry answers already, from the
                        record that settled them.

                        An answer that only partly settles a question
                        has the same edge as one that settles it
                        entirely. The answerer's own prose is where
                        the difference is said.

                        Every question carries a guid, and every
                        record grew by an identity per question.

                        Nothing yet reports a question that has been
                        open for long, because nothing says how long.
                        That waits on staleness.

