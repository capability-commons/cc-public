title:                  An interface member is verified by a test case through the relations that exist
brief:                  |
                        The interface control document is implemented
                        as its accepted record describes, its members
                        are addressable, and verification reaches a
                        member through r_verifies rather than through
                        a relation of its own.
context:                |
                        ddr_interface_control_document is accepted and
                        settles the type, the prefix icd, the schema,
                        versioning, the surface model and addressable
                        members. It leaves three things open, which
                        are now its questions: the relation connecting
                        successive versions, the vocabulary
                        specification and conformance may need, and
                        the facts a check establishes rather than the
                        schema.

                        The repository already holds r_verifies, from
                        a python test function to a textual
                        requirement, and r_is_implemented_by, from a
                        requirement or a component to source. A test
                        case and an interface member are new ends for
                        both.
decision:               |
                        t_interface_control_document takes the prefix
                        icd, is held in interface/ and names
                        sch_interface_control_document. An interface
                        member is an embedded addressable item of
                        t_interface_member with prefix icm, shaped by
                        sch_interface_member, which t_interface_member
                        names by r_is_specified_by_schema.

                        r_verifies is extended rather than joined by a
                        conformance relation of its own. A test case
                        verifies a textual requirement or an interface
                        member. The meaning is unchanged: the subject
                        establishes that the object holds. A python
                        test function keeps its place in the domain
                        while both representations of trace are read.

                        r_is_implemented_by is extended so that a test
                        method, a test case and an interface member
                        may name what implements them.

                        Two relations are added because nothing
                        existing means what they mean.
                        r_uses_test_method runs from a test case or a
                        test execution to the method it is run with.
                        r_tests runs from a test execution to the item
                        under test it observed.

                        The first specimen is icd_cc_public_query,
                        covering the bounded python surface the plan
                        names, with each member linked to the source
                        item that implements it and to the accepted
                        requirement it serves.
rationale:              |
                        r_verifies extended rather than a conformance
                        relation added, because the sentence is the
                        same one. A test case establishes that an
                        interface member holds, exactly as it
                        establishes that a requirement holds, and a
                        second relation would divide one meaning by
                        the type at its far end. The relation check
                        already holds the ends to their declared
                        types, so the extension is stated where it is
                        enforced.

                        Two relations added, because neither existing
                        relation says which procedure a case is run
                        with, nor what an execution observed. Both are
                        bindings a reader must follow and neither is a
                        form of verification.

                        A prefix of its own for a member, because a
                        requirement, a test case and an execution all
                        point at one, and a thing that is pointed at
                        needs an identity that is not its position in
                        a document.

                        The first specimen bounded to one python
                        surface, because the risk the plan names first
                        is stalling in ontology work, and one surface
                        with four accepted requirements is enough to
                        show whether a reader can walk the chain.
alternative:            |
                        A conformance relation of its own, such as
                        r_conforms_to. Rejected: see the rationale. It
                        would be added only if r_verifies could not
                        honestly describe member level verification,
                        and it can.

                        An interface member identified by its key
                        within its surface. Rejected: a key is a
                        presentation name, and a reference to a member
                        would then have to name the document and walk
                        into it.

                        A specimen covering every surface form the
                        record permits. Rejected: the record itself
                        scopes the first schema to software APIs and
                        dataflow steps, and a specimen that exercised
                        all of them would take longer than it would
                        teach.

                        Deferring the two new relations until an
                        execution exists. Rejected: a case names its
                        method before anything runs, and the check
                        that resolves a case needs the edge to follow.
consequence:            |
                        reg_relation gains r_uses_test_method and
                        r_tests, each declaring the types at its ends.
                        r_verifies and r_is_implemented_by gain ends.

                        t_interface_control_document and
                        t_interface_member are added, claiming icd and
                        icm.

                        A requirement may be verified by a python test
                        function and by a test case at once, and both
                        are kept. The trace projection must accept
                        both, and a requirement verified by both is
                        reported as verified by both.
                        ddr_test_case_adoption settles it.

                        Which relation connects an interface control
                        document to the version it supersedes is still
                        open, and is that record's question.

