  reach:
    id_self:            qst_criticality.reach
    guid_self:          qst_3d536853a5a6403f97390fdf12cd5cdb
    question:           |
                        Whether a need, a segment or an interface
                        control document carries a criticality of its
                        own or takes one from the requirements that
                        derive from it, and what gives one to the
                        verification tooling, which no requirement
                        implements and which the derivation therefore
                        does not reach.
    relation:           []

