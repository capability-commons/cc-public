title:                  Criticality is declared on a requirement and derived everywhere else
brief:                  |
                        A requirement carries a criticality level; a
                        source item does not, and takes the greatest
                        criticality of the requirements it implements.
                        What a level requires is written in a
                        register, not in a check.
context:                |
                        DO-178C selects which of its objectives apply
                        by design assurance level. Nothing here
                        carries a level, so every objective is taken
                        up by argument, and every item is held to one
                        standard of rigour. That standard is at once
                        too much for something being sketched and too
                        little for something that matters, and there
                        is no lever between them.

                        Earlier work of this author used a maturity
                        value on the metadata of each module. Software
                        could be written in a low maturity form and
                        ratcheted up, gaining test coverage and lint
                        rules as it went, so that a prototype became a
                        product by degrees rather than being required
                        to be finished at its inception.

                        Two levers are wanted in the end and they
                        answer different questions. Criticality asks
                        how bad it is if the obligation is unmet.
                        Maturity asks how far through its lifecycle
                        the thing is. Only criticality is decided
                        here, because maturity needs a lifecycle with
                        named stages and there is none.
decision:               |
                        A criticality has a dimension and a level.
                        There are two dimensions, safety and security,
                        and five levels in each, so the register holds
                        ten entries: crit_safety_10 through
                        crit_safety_90 and crit_security_10 through
                        crit_security_90.

                        A requirement may declare a criticality for
                        each dimension. A dimension it does not
                        declare is at the base level of that
                        dimension, so nothing already written changes.

                        The levels are named by their place on a scale
                        from zero to one hundred. The numbers are
                        spaced rather than consecutive, so that a
                        level may be put between two that exist
                        without renaming either, and the widest spaces
                        are at the low end, where most of what is
                        built here will sit and where the finer
                        distinctions will therefore be wanted. A name
                        that is a number also carries its own order,
                        so the greatest of several criticalities is
                        well defined without a rank written beside it.

                        The lowest level of each dimension is a null
                        level: it stands for a consequence of no
                        effect and requires nothing beyond the base.
                        It corresponds to design assurance level E on
                        the safety dimension and to no assurance level
                        at all on the security dimension.

                        On the safety dimension the consequence is
                        harm to a third party, because these are
                        unmanned vehicles and the people at risk are
                        outside them. crit_safety_90 is death or
                        serious injury to a third party;
                        crit_safety_80 serious injury to one person,
                        major environmental or asset loss, or loss of
                        control over a populated area; crit_safety_60
                        minor injury, significant asset loss, or a
                        mission failure with commercial consequence;
                        crit_safety_40 no injury and a recoverable
                        operational disruption; crit_safety_10 no
                        safety consequence. They correspond to design
                        assurance levels A, B, C, D and E by the
                        strength of what they require, not by the
                        words, which DO-178C writes about the
                        occupants of an aircraft.

                        On the security dimension crit_security_90 is
                        a compromise that enables loss of control or
                        physical harm; crit_security_80 a compromise
                        of command and control, or of protected
                        personal data at scale; crit_security_60
                        disclosure of protected or commercially
                        sensitive information; crit_security_40
                        disclosure with no protected content;
                        crit_security_10 no security consequence. The
                        four above the null level correspond to
                        security levels 1 to 4 of IEC 62443 and to
                        cybersecurity assurance levels 1 to 4 of ISO
                        and SAE 21434.

                        Each entry says what consequence of failure it
                        stands for, which level of which external
                        scale it corresponds to, and which objectives
                        it requires. An objective is an item of its
                        own, and ddr_objective decides it.

                        A data item or a source item declares no
                        criticality. Its effective criticality is
                        derived, one level for each dimension, and
                        each is the greatest among the requirements
                        that reach it in a closed world along the
                        relations that declare responsibility.

                        Responsibility is declared on a relation in
                        the relation register, beside domain, range
                        and dependency, and the derivation is computed
                        from what the register declares rather than
                        from a list held in code. r_is_implemented_by
                        declares it, and nothing else does yet.

                        A check that varies by criticality reads what
                        the level requires from the register. No check
                        carries a level in its code.

                        The base level requires what is required
                        today. Every item here is at the base level of
                        both dimensions, so the lever changes nothing
                        on the day it is installed.

                        This repository is a tool and not vehicle
                        software. It takes no level from this rule,
                        and what accounts for it is tool
                        qualification, which DO-178C treats separately
                        and for its own reasons. The lever is for the
                        segments that hold what is built with the
                        tool.

                        Maturity is decided separately, in
                        ddr_maturity, and is not built yet.
rationale:              |
                        Declared on the requirement, because
                        consequence of failure is a property of the
                        obligation and not of the code that happens to
                        meet it. It is also where both governing
                        standards put it: DO-178C assigns a level to a
                        function from the system safety assessment and
                        has the software implementing it inherit that
                        level, and INCOSE does the same through the
                        verification matrix.

                        Two dimensions rather than one, because every
                        neighbouring domain has found one number
                        insufficient and split them the same way:
                        automotive holds an automotive safety
                        integrity level beside a cybersecurity
                        assurance level, aviation holds a design
                        assurance level beside an airworthiness
                        security process, and industrial and maritime
                        practice holds a safety integrity level beside
                        a security level. The vehicles this repository
                        serves make the reason concrete. A survey
                        vessel far offshore has no third party near it
                        and carries commercially sensitive data. A
                        policing aircraft has people beneath it and
                        carries protected personal data. One number
                        puts those at the same level for opposite
                        reasons, and each then attracts the objectives
                        the other needed.

                        Two and not more, because operational safety
                        is safety, and a dimension earns its place by
                        requiring objectives the others do not. A
                        third is cheap to add once the register holds
                        what a dimension means.

                        The consequences written about third parties,
                        because these vehicles are unmanned. The harm
                        is to people outside them, which is what an
                        operational risk assessment for an unmanned
                        aircraft reasons about and what a design
                        assurance level, written for the occupants of
                        an aircraft, does not.

                        A null level at the bottom of each dimension,
                        because both scales this model corresponds to
                        have one: design assurance level E requires no
                        objectives, and an item with no security
                        consequence attracts no security level. Making
                        it explicit keeps the five slots aligned
                        across both dimensions and gives the base
                        something to be.

                        Derived on everything else rather than
                        declared there, because a level written by
                        hand on each module drifts from the
                        requirements it serves, and the edges that
                        decide it are already in the graph. This
                        repository already computes a dependency
                        closure rather than listing one, for the same
                        reason.

                        The greatest rather than the least or the
                        nearest, and taken for each dimension
                        separately, because an item that serves a
                        critical requirement and a trivial one is as
                        critical as the work it does for the first,
                        and because a high safety level says nothing
                        about what security asks of it.

                        In a closed world, because in an open one a
                        consuming segment's critical requirement is
                        invisible from here, and an item would appear
                        less critical than it is. The effective
                        criticality of a shared item is a question
                        only the union can answer.

                        Responsibility as something a relation
                        declares, because the same reasoning already
                        governs dependency: which edges the derivation
                        follows is a fact about the relations, and
                        putting it in code makes the tool the place
                        people go to learn what the model means.

                        Five levels in each dimension, because a
                        smaller set cannot be joined to the external
                        tables without losing rows, and the tables are
                        the reason for having levels at all.

                        Numbered rather than lettered, because a
                        number carries its order, leaves room between
                        the levels for one that is not needed yet, and
                        does not claim the design assurance level that
                        the letter names.

                        Spaces widest at the bottom, because most of
                        what will be built here is not critical, and
                        the distinctions that will actually be wanted
                        are between one kind of ordinary work and
                        another.

                        Absent meaning the base, because a lever that
                        changes nothing on the day it is installed can
                        be installed without a migration, and every
                        ratchet after that is deliberate and local.
alternative:            |
                        One dimension, taking the greater of what
                        safety and security ask. Rejected: it applies
                        each dimension's objectives to items that only
                        the other made critical, which is the
                        undifferentiated rigour this record exists to
                        end.

                        Three dimensions or more, separating
                        operational safety from safety. Rejected for
                        now: operational safety requires no objective
                        that safety does not, and a dimension that
                        changes nothing is a field to maintain.

                        Adopt the specific assurance level of an
                        operational risk assessment directly as the
                        safety dimension. Rejected: that level is the
                        output of an assessment of one operation, not
                        a property of a requirement. It informs which
                        level a requirement is given and is not itself
                        the level.

                        Declare criticality on each module, as earlier
                        work declared maturity. Rejected for
                        criticality: it duplicates what the trace
                        already knows and drifts from it. Noted for
                        maturity: maturity is a property of the code
                        and not of the obligation, so it is declared
                        where criticality is derived, and that
                        opposition is the point rather than an
                        inconsistency. ddr_maturity holds it.

                        Use the DO-178C letters directly. Rejected: a
                        design assurance level is the output of a
                        safety assessment, and writing the letter
                        without the assessment claims something
                        untrue.

                        Number the levels consecutively, one to five.
                        Rejected: a level put between two others
                        renames every level above it, and every item
                        that named one.

                        Space the levels evenly, ten to ninety.
                        Rejected: it spends as much room at the top,
                        where another level is least likely to be
                        wanted, as at the bottom where it is most.

                        Declare criticality on a source item as well
                        and take the greater of the two. Rejected: two
                        places to write it is two places for it to be
                        wrong, and no rule says which wins when they
                        disagree.

                        Take the least, or an average, where several
                        requirements reach an item. Rejected: it lets
                        a trivial requirement dilute a critical one.

                        Hold the relations the derivation follows as a
                        list in code. Rejected: see the rationale.

                        Take the highest rigour everywhere and drop
                        the idea of a level. Rejected: it is where the
                        repository is now, and it is why a sketch
                        cannot be written here.
consequence:            |
                        A criticality register, its type, its entry
                        schema and the crit prefix are added, holding
                        ten entries: five levels in each of two
                        dimensions.

                        sch_textual_requirement gains an optional
                        criticality, which is a level for each
                        dimension rather than a single value, and a
                        dimension left out is at its base level.

                        reg_relation gains a responsibility
                        declaration beside domain, range and
                        dependency, and r_is_implemented_by declares
                        it. The relation check must read it, as it
                        reads the others.

                        The trace projection must compute the
                        effective criticality of every data item and
                        source item, one level for each dimension, in
                        a closed world, and report it.

                        An objective is an item of its own type, so a
                        register entry requires objectives by naming
                        them. ddr_objective decides what an objective
                        is and must land with this.

                        The trace check varies by criticality in two
                        places. A verdict shared between requirements
                        is critical from level sixty, and a
                        requirement with no current coverage analysis
                        is reported from level forty. Both read what a
                        level requires from this register, so raising
                        what a level demands is editing an entry.

                        The objectives a level requires and no check
                        reads are case per condition, method not code
                        and tool accounted, so three of the five a
                        level can add are still inert.
                        ddr_test_case_adoption defers both to this
                        register rather than stating them itself.

                        What a level requires must be able to say when
                        it becomes required, so that maturity can
                        phase it in later without the register being
                        rewritten. ddr_maturity depends on that and
                        nothing else here does.

                        Nothing already written changes, because
                        everything already written is at the base
                        level of both dimensions.

                        The verification tooling is not reached by the
                        derivation, since no requirement is
                        implemented by the adapter, and this
                        repository is tooling throughout. A tool takes
                        no criticality from this rule and needs its
                        own account, which is what DO-178C says about
                        tools and why it says it separately.

