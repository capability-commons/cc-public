    id_self:            qst_criticality.assurance
    guid_self:          qst_d3d716b48cd149b591a1bd220d767ad6
    question:           |
                        Which verification methods give the assurance
                        a criticality level asks for, given that any
                        method may be used at any level and that a
                        higher level asks for more assurance rather
                        than for a named technique.
    relation:           []

