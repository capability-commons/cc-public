question:

  layout:
    id_self:            qst_source_in_a_comment.layout
    guid_self:          qst_c32fbc6a06e14a71ab1920eadcc504d6
    question:           |
                        Whether the layout check should examine a
                        document held in a comment, given that it is
                        written through the printer and can be edited
                        by hand afterwards, as a docstring can.
    relation:           []

  vendored:
    id_self:            qst_source_in_a_comment.vendored
    guid_self:          qst_60a3574518ec4d0c9aedf68915893153
    question:           |
                        What marks a file as vendored, now that
                        carrying no document is the only sign, and
                        whether a repository wants to say so rather
                        than leave it to be inferred.
    relation:           []

  other:
    id_self:            qst_source_in_a_comment.other
    guid_self:          qst_cc121fb585904c0fb2fdb9612a40d309
    question:           |
                        Which other languages carry items this way,
                        and whether a language whose comments open
                        differently is worth a loader of its own or is
                        better served by a convention shared with
                        these two.
    relation:           []
