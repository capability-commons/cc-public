question:

  c56ca5b96:
    id_self:            qst_loader_design.c56ca5b96
    guid_self:          qst_bbe3ada902f5414f9d5cceaf9bb0a7fb
    question:           |
                        Whether the encoding conventions should
                        themselves be data rather than code. They are
                        facts about formats, which is the kind of
                        thing this system holds in registers, and
                        holding them in Python means a federated
                        partner running their own tooling does not get
                        them.
    relation:           []
