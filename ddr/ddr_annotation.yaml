title:                  An annotation is one assertion, and its role is its edges
brief:                  |
                        A person or a model may assert something about
                        an item in the graph, and the assertion is an
                        item of its own so that it can be answered.
context:                |
                        Review here has nowhere to put what it finds.
                        A reviewer who sees a possible vulnerability,
                        an efficiency worth taking, an architectural
                        worry, a gap in evidence, or a reason to leave
                        a design exactly as it is, has a nonconformity
                        report and nothing else. A nonconformity
                        report asserts an observed failure against an
                        applicable expectation, which is stronger than
                        any of those and wrong for most of them.

                        What is missing is smaller than any of the
                        things this repository already holds. It is
                        one assertion, offered for consideration, that
                        somebody else can answer. Without an identity
                        it cannot be answered, because there is
                        nothing to point at.

                        This is a step towards adversarial review and,
                        later, argumentation mediated decision
                        support. Designing the argumentation framework
                        now would settle an ontology before there is
                        any experience to settle it from.
decision:               |
                        An annotation is one assertion about one or
                        more items in the graph, held as a data item
                        of its own. It is called an annotation, its
                        items live in annotation/, and its identity
                        carries the prefix ann.

                        It carries no fields beyond the descriptive
                        envelope every item has. title names the
                        assertion, brief states it, and description
                        carries the reasoning or the qualification
                        where one is wanted. There is no status,
                        resolution, severity, priority, category,
                        author, stance, time, revision, confidence or
                        verdict.

                        Its role is carried by its edges. r_is_about
                        says what it asserts about, and every
                        annotation holds at least one, so no assertion
                        floats free of a subject. r_challenges gives a
                        reason not to accept another annotation.
                        r_supports gives a reason to accept one.
                        r_cites, which already runs to an observation,
                        is widened to admit an annotation, so an
                        assertion may rest on a captured source.

                        Nothing computes which assertion prevails. A
                        challenge does not defeat its target, support
                        does not establish one, and an assertion
                        nothing answers is not thereby true. No
                        annotation refuses a commit, stops a run or
                        blocks an acceptance.

                        Where an assertion establishes an observed
                        failure against an applicable expectation, a
                        nonconformity report says it better. Where it
                        becomes an obligation, a decision, or a design
                        question that is open, the item type for that
                        carries the result, and the annotation remains
                        as part of the trace by which it arose.

                        An annotation is current against the tree as
                        it stood in the commit that last changed it,
                        which the history already records. Nothing is
                        stamped on the item.

                        The word challenge already names the strongest
                        case against one design decision, answered by
                        a resolution. r_challenges is a second and
                        wider sense, and the term register holds
                        senses of a word separately.
rationale:              |
                        Annotation rather than note, because note is
                        already what a check reports where it found
                        nothing at fault. The vocabulary can carry two
                        senses of a word and does for eleven of them,
                        but a collision is worth taking for a reason,
                        and there is none here.

                        Annotation rather than comment, because
                        comment invites threads and ordering, which
                        are conversation machinery nothing needs yet.
                        Rather than review comment, because the same
                        assertion is wanted for a security concern or
                        a design worry outside any review. Rather than
                        argument, because that names the framework
                        this is deliberately not designing.

                        One assertion per item, because supporting or
                        challenging half of an item is not
                        expressible. Two assertions that could be
                        answered separately are two annotations, and
                        the edges are what makes that cheap.

                        The role in the edges rather than in a field,
                        because a category field would have to be
                        enumerated before anyone knows the categories,
                        and because an edge is walkable while a field
                        is not. What an annotation is doing is then
                        read from the graph rather than from a word
                        somebody chose.

                        No settlement, because the semantics of
                        settlement are the argumentation framework,
                        and adopting one now would fix an ontology
                        before any use has tested it. Preserving the
                        assertions and their subjects is what lets a
                        person, an eval or a later decision look at
                        them.

                        No lifecycle and no authority, because an
                        annotation that carried a status would need
                        someone entitled to change it, and that is a
                        governance question this does not raise. An
                        annotation is answered by another annotation
                        or by the item that arose from it.

                        Currency from the history rather than from a
                        digest on the item, because the repository
                        already knows what the tree held at each
                        commit, and because r_is_about is a
                        dependency, so a change to the subject already
                        reaches the annotation through the impact
                        analysis this repository computes.

                        At least one subject and no maximum, because
                        an assertion about nothing cannot be read,
                        while one about how two items meet is one
                        assertion and not two.

                        No mechanical incompatibility between support
                        and challenge, because an annotation may
                        qualify another in both directions at once and
                        no use has yet shown otherwise. It is cheap to
                        add later and expensive to withdraw.

                        No annotation specific check, because the
                        relation register already expresses every rule
                        here: the domain, the range, the minimum of
                        one subject, and the dependency. A check would
                        put in code what the register says in data.
alternative:            |
                        Wait for a complete argumentation framework
                        and introduce nothing until then. Rejected:
                        the framework would be designed from nothing,
                        and the assertions made in the meantime would
                        be lost or scattered through prose fields
                        where nothing can point at them.

                        Use a nonconformity report for all of it.
                        Rejected: a nonconformity report asserts an
                        observed failure against an applicable
                        expectation. A possible vulnerability, an
                        opportunity, a worry and a defence of the
                        design as it stands are none of those, and
                        reporting them as nonconformities would make
                        the report mean less each time.

                        Use a review comment type. Rejected: it binds
                        the primitive to one process, and the same
                        assertion is wanted outside any review.

                        Carry the role in a category or severity
                        field. Rejected: the categories are not known,
                        and a severity would make an annotation a
                        finding by another name.

                        Stamp the subject digest or a timestamp on the
                        annotation. Rejected for now: the history
                        already holds what the subject was, and a
                        field that must be maintained by hand drifts
                        from what it describes.
consequence:            |
                        Annotations may accumulate and never be
                        answered or acted on. Nothing marks one
                        resolved, so the pile is visible and grows,
                        and reading it is somebody's judgement rather
                        than a query. That is accepted as the cost of
                        not inventing a lifecycle before knowing what
                        one would be for.

                        An assertion may go stale silently. Its
                        subject may change under it while the
                        annotation reads as though it still applies.
                        The impact analysis reaches it, since
                        r_is_about declares dependency, but nothing
                        revalidates it.

                        The word challenge now carries two senses, and
                        a reader who meets one may take it for the
                        other. The glossary reports words that two
                        entries claim, so the collision is visible
                        rather than hidden.

                        An annotation that ought to have become a
                        requirement, a decision or a nonconformity
                        report may sit as an annotation instead,
                        because nothing converts it and nothing asks.

