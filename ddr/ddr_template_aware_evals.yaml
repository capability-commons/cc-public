title:                  The requirement evals see the slots and credit the form
brief:                  |
                        The five requirement evals whose criteria
                        conflicted with the SOPHIST template are
                        rewritten: the judge is shown the slots beside
                        the composed statement, the forms the template
                        gives an activity are not padding, a qualifier
                        after the object is not an unstated condition,
                        a noun is faulted for being vague and not for
                        being ordinary, and a conjunction is faulted
                        only where its parts could be verified apart.
                        A finding that names a rule the register lacks
                        says so.
context:                |
                        Migrating the demonstration into slots changed
                        the count of eval findings on its hundred and
                        forty-two requirements from four hundred and
                        sixty-nine to five hundred and two, screen
                        judgements only. The template makes R1 and R2
                        true by construction, yet the eval on them
                        found seventy-six; reading a sample showed
                        why. The concise eval called provide the Actor
                        with the ability to and be able to padding,
                        which are the interaction and interface forms.
                        The conditions eval called within 5 minutes,
                        without tools and for the current load
                        unstated conditions, which are the qualifier
                        slot. The self contained eval, a hundred and
                        twenty-eight findings, demanded
                        Capitalised_Snake_Case for every ordinary
                        noun, hub, enclosure, all outputs, citing the
                        definite article rule for what is the defined
                        term rule read as typography, as the outside
                        review had said. The singular eval faulted
                        overcurrent, overvoltage and thermal
                        protection as three objects. The entity eval
                        found what SOPHIST finds: meet, have, support,
                        allow, and a passive inside the object. Across
                        both sweeps the judge named twenty rule ids
                        that do not exist, rule_r06_undefined_terms
                        and its kin.
decision:               |
                        The five evals, evl_req_concise,
                        evl_req_conditions, evl_req_entity_shall,
                        evl_req_self_contained and evl_req_singular,
                        keep their ids, their binary verdicts and
                        their control cases, and take new criteria,
                        briefs, examples and scope. The scope of
                        concise, conditions and the entity eval
                        includes the slots the criterion turns on,
                        activity, process, condition and qualifier,
                        beside the composed statement, and the
                        criterion says that where no slots are shown
                        the statement is judged alone, so that the
                        written control cases still apply. Each
                        criterion names the SOPHIST rules it now
                        implements beside the INCOSE ones, and asks
                        the judge to name the rule by one of the ids
                        in the brief.

                        Concise: the interaction and interface forms
                        are the form, and provide with an object of
                        its own is the obligation. Conditions: a
                        condition decides whether the obligation
                        applies and opens the statement; what follows
                        the object says how well or how and is not a
                        condition; a stated condition whose other case
                        is left unwritten is S17. The entity eval
                        becomes the verb eval: subject, modal and
                        voice are given by the template; the verb must
                        name an observable process, not a state, a
                        permission or a management word, S2 and S13,
                        and a passive inside the object is R2. Self
                        contained: a noun is at fault when its set
                        cannot be told, S12, not when it is written in
                        ordinary words; the indefinite article is at
                        fault on a defined thing, R5. Singular: parts
                        of one object that would be allocated,
                        implemented and verified together are one
                        object, R19 read as separability.

                        The eval check appends to a finding a sentence
                        for every rule id it names that no register
                        declares, so that an invented rule is read as
                        such.
rationale:              |
                        Binary verdicts kept, because the eval design
                        decision rests on the evidence that binary
                        criteria give the highest agreement between
                        judges, and the faults found were in what the
                        criteria asked, not in their form. A not
                        applicable or indeterminate verdict is the
                        review's proposal and is left as a question.

                        Slots in the scope, because the judge cannot
                        tell the interface form from padding, or a
                        qualifier from a condition, by the sentence
                        alone, and the slots are what says which is
                        which. The written control cases carry no
                        slots, so the criterion says how to judge
                        without them.

                        Vagueness rather than typography, because R4
                        asks that terms be defined, which a glossary
                        of the entity would show and no eval on one
                        sentence can, and because the demand for
                        Capitalised_Snake_Case on every noun was the
                        single largest source of findings and said
                        nothing a reader could act on.

                        Separability rather than the word and, because
                        INCOSE's own test for singularity is whether
                        the parts can be verified apart, and the
                        review found the categorical reading faulting
                        inseparable pairs.
alternative:            |
                        A third and fourth verdict, not applicable and
                        indeterminate. Deferred: it changes the eval
                        framework, the measurement and the confidence
                        rows, and the faults found did not need it.

                        Retiring the entity eval, since R1 and R2 hold
                        by construction. Rejected: the verb is what
                        remains to judge and the eval is where the
                        verb rules live.

                        A mechanical check on the criterion text for
                        rule ids. Rejected for now: the judge invents
                        ids in its feedback, not the criterion; the
                        note on the finding is where the invention is
                        seen.
consequence:            |
                        Measured over five samples per control case,
                        the five evals reached zero false alarms and
                        zero misses, in three rounds. The first round
                        moved five cases the wrong way and each taught
                        the criterion something: an unlock command
                        sent within 500 milliseconds waits on an event
                        the statement must open with; a place or a
                        recipient after the object, in
                        Harbor_Approach, says where and not when; a
                        word in Capitalised_Snake_Case is a defined
                        term and never vague, and an alert having the
                        characteristics defined in a named standard is
                        defined; or between two objects leaves the
                        choice undecided where and joins parts of one
                        thing; a group noun, comfort related
                        functions, is many obligations in one word.
                        One written case, will rather than shall, is
                        held met by the verb eval now, since the modal
                        is an enumerated slot the schema holds.

                        Swept over the same hundred and forty-two
                        demonstration requirements, screen judgements
                        only, the eleven evals raise four hundred and
                        four findings where the old criteria raised
                        five hundred and two on the same slots:
                        conditions from fifty-one to fifteen, concise
                        from forty-two to fourteen, self contained
                        from a hundred and twenty-eight to
                        ninety-seven, and citations of the definite
                        article rule from a hundred and thirty-one to
                        thirty-nine. The verb eval rises from
                        seventy-six to seventy-seven, and its findings
                        are now SOPHIST's questions, support, enforce,
                        provide in the management sense, what does the
                        entity do. Seventeen findings still name a
                        rule the register lacks, and now say so.

                        Eleven examples were added across the five
                        evals, then five more in the rounds, which the
                        digest covers. The demonstration item whose
                        negation the migration moved into the
                        qualifier, no intentional radio frequency
                        signal, is written positively. A condition the
                        migration left inside an object, when
                        operating without connected external
                        generators, beside a time condition, is the
                        concise eval's finding and the next repair.

