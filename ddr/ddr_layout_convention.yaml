question:

  c94b701c3:
    id_self:            qst_layout_convention.c94b701c3
    guid_self:          qst_9985e15fd41a4c63b1e67e93b5123108
    question:           |
                        Whether quoting should be systematic rather
                        than preserved. Most text is unquoted to keep
                        the noise down, and where a value is quoted it
                        is usually because its content requires it;
                        whether the printer should decide that instead
                        of the author is open.
    relation:           []

  c89f12031:
    id_self:            qst_layout_convention.c89f12031
    guid_self:          qst_6f7763488df648a99b50bf326dac344c
    question:           |
                        Whether comments should be systematic rather
                        than preserved. The preference is for content
                        that a tool can read over content it cannot,
                        but a horizontal rule between the fields of a
                        large document earns its place, and no rule
                        for that has been written.
    relation:           []

  cdc180169:
    id_self:            qst_layout_convention.cdc180169
    guid_self:          qst_52b73caf4c0b4f7b915bff7b1ff307d5
    question:           |
                        Whether the convention should be data rather
                        than code, which is the question
                        ddr_loader_design leaves open for encoding
                        conventions and ddr_check_architecture for
                        checks generally.
    relation:           []
