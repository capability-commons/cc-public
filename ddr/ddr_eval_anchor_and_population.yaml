title:                  An eval anchors to the population its criterion holds for
brief:                  |
                        evl_prose_matches_structure anchors to
                        sch_base, the standalone items, because its
                        criterion reads an item's own fields and an
                        entry's prose describes a concept.
context:                |
                        ddr_embedded_item_schema made a register entry
                        a subject of the three evals anchored to
                        sch_descriptive. The first judged run over the
                        glossary raised ten advisories in three
                        hundred and six judgements. That sweep was not
                        kept as an item, so the figure is what was
                        seen and not something a reader can run. Eight
                        were prose that argues rather than describes.
                        Two came from evl_prose_matches_structure,
                        which compares what an item says about itself
                        against the fields shown beside it.

                        A term entry says what the concept it
                        identifies names and does. Its fields identify
                        the entry and hold the words used for the
                        concept. The two are about different things,
                        so the comparison has nothing to compare.

                        The criterion already excludes this. It says
                        that a claim about another item, about a type,
                        or about the system in general cannot make the
                        verdict unmet. The judge did not apply the
                        exclusion.

                        sch_base is composed by every standalone item
                        and by no entry. An entry composes identity
                        and the descriptive fields through sch_entry
                        and has no rights of its own.
decision:               |
                        evl_prose_matches_structure is evaluated over
                        the items specified by sch_base rather than by
                        sch_descriptive. It reaches three hundred and
                        sixty eight standalone items and no embedded
                        item.

                        evl_prose_describes and evl_plain_text keep
                        the sch_descriptive anchor. Their criteria
                        read the prose alone, which an entry carries
                        like any other item.

                        An eval whose criterion reads an item's own
                        fields anchors to sch_base. An eval whose
                        criterion reads only prose anchors to
                        sch_descriptive.

                        The control set written to hold the two
                        entries to a verdict is retired with the
                        population it was about, and none replaces it.

                        So the eval sweeps every standalone item with
                        no confidence for any judge, and every finding
                        it makes carries none. ddr_eval_admission
                        refuses such an eval as a guard, and a sweep
                        is not a guard, so nothing stops it.
                        qst_eval_anchor_and_population.replacement
                        asks what measures it.
rationale:              |
                        The anchor rather than the criterion, because
                        the criterion was sharpened first and
                        measured. A sentence saying that an entry's
                        prose describes its concept, and an example of
                        a term entry held to met, left the judge at
                        unmet five times out of five on the same case.
                        A criterion a judge will not apply is not a
                        narrower scope.

                        sch_base rather than a list of the types to
                        include, because the distinction is already in
                        the schemas. A standalone item composes
                        sch_base and an entry does not, so the anchor
                        names the population exactly and needs no list
                        to be kept in step with the type register.

                        The control set retired rather than kept,
                        because a case holds an item to a verdict for
                        an eval that judges it. An eval that no longer
                        reaches the item cannot be measured by it, and
                        a confidence rate over a population an eval
                        never meets describes nothing.
alternative:            |
                        Sharpening the criterion. Rejected on
                        evidence: the judge returned unmet five of
                        five on case_prose_matches_structure.cdf53e681
                        both before and after a clause and an example
                        were added for exactly that case.

                        Naming the types the eval includes, as
                        ddr_eval_reach provides. Rejected: coverage is
                        named, so keeping the eval would mean naming
                        every standalone type in order to leave out
                        twelve entry types, and the list would need a
                        line whenever a type was added.

                        Holding each entry to a verdict with a control
                        case. Rejected: three hundred and forty cases
                        to say one thing about a population, and the
                        eval would go on judging what it cannot judge.

                        Leaving the two advisories standing. Rejected:
                        an advisory a reader must learn to ignore
                        teaches that the findings need not be read.
consequence:            |
                        A full run judges two thousand four hundred
                        and six subjects, from one thousand seven
                        hundred and fifteen before an embedded item
                        was reached, and two thousand seven hundred
                        and thirty five with this eval reaching
                        entries.

                        An entry whose prose does contradict its own
                        fields is no longer found. Nothing found one,
                        and the eval's two findings on entries were
                        both wrong.

                        sch_base is now an anchor with a meaning: the
                        items that stand alone. An eval reading an
                        item's fields has somewhere to point.

                        A judge that will not apply a written
                        exclusion is a fact about this judge and this
                        criterion. Another model may apply it, and the
                        anchor would then be narrower than it needs to
                        be.

