title:                  Command line contract
brief:                  |
                        Findings to stdout, failures to stderr, and an
                        exit status that tells a gate why it stopped.
context:                |
                        One command serves three callers who want
                        different things. A continuous integration
                        gate wants to be stopped when the data is
                        wrong. An agentic process wants the report and
                        would be obstructed by being stopped. A person
                        wants something readable.

                        The agentic caller is the one this is mainly
                        for: a tool an assistant can run to check its
                        own work, and act on what comes back.
decision:               |
                        Exit zero when clean, one when the data does
                        not conform, two when the analysis itself
                        failed. Two is returned always; one only when
                        asked for.

                        Findings go to standard output in every
                        format. Standard error is reserved for
                        failures of the analysis.

                        Four serialisations: one for a person, three
                        for a program.

                        Paths are given by repeated option and taken
                        as a union. Stopping early stops at the first
                        CHECK with a critical finding, not the first
                        finding.

                        The command line is a package of modules by
                        kind, checking, editing, judging, assurance,
                        committing and running, each registering its
                        commands on one group that holds what they
                        share: the root option, the odd count type,
                        the exit statuses, and the two helpers that
                        open a tree and report a failure. The entry
                        point imports them and exposes the group. A
                        command adapts what was typed into one call on
                        the tiers below and renders what comes back
                        through the report module; it holds no policy.
rationale:              |
                        A nonconformity does not fail by default
                        because the ordinary caller reads the report
                        and acts on it. A tool that exits non zero
                        every time it finds something is a tool an
                        agent learns to ignore.

                        Two exit statuses for failure rather than one,
                        because a gate needs to tell "your data is
                        wrong" from "I could not check your data". The
                        second is not a smaller version of the first.

                        Findings on standard output so that they pipe
                        into something else, and failures on standard
                        error so that they do not corrupt what is
                        being piped. A report is the output of this
                        command; a stack trace is not.

                        Machine readable formats because a language
                        model is a first class caller here rather than
                        an afterthought.
alternative:            |
                        Failing on any nonconformity by default.
                        Rejected: the common case is a caller that
                        wants to read.

                        One exit status for every kind of failure.
                        Rejected: a gate cannot then distinguish a
                        finding from an outage.

                        Writing findings to standard error when the
                        command is going to fail. Rejected: the stream
                        a finding goes to would then depend on a flag,
                        and a consumer could not know where to read.

                        Stopping at the first individual finding
                        rather than the first check. Considered, and
                        not worth it: loading is shared and already
                        done by the time any check runs, so the saving
                        is small and the machinery is not.
consequence:            |
                        A report written by this command can be read
                        back by this system's own loaders, being YAML,
                        JSON or XML that conforms to nothing in
                        particular yet.

                        An advisory finding can never change the exit
                        status. A caller wanting to be stopped by one
                        asserts a complete scope instead.

                        The command is heavy in options and will get
                        heavier. That is accepted: it does several
                        things for several callers, and each of them
                        is named rather than implied.

