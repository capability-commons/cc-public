title:                  A test case is what a method is run with, and binds no implementation
brief:                  |
                        A test case supplies the configuration, inputs
                        and expected observations for one test method,
                        names what it verifies, and leaves the item
                        under test to the execution.
context:                |
                        A python test function points at the
                        requirement it verifies. The function is the
                        only statement of what is tried and what is
                        expected, so both live in code, and neither
                        can be reused against a second implementation
                        or read by anyone who does not read python.

                        A test method settles the procedure. What a
                        run of that procedure is given, and what it
                        should produce, is what the method leaves
                        open.

                        The glossary already holds control case, which
                        is an item held to a verdict for an eval. The
                        two are different concepts sharing a word.
decision:               |
                        A test case is an item of t_test_case with
                        prefix tc, held in test_case/ and shaped by
                        sch_test_case.

                        A case names exactly one test method, and one
                        or more textual requirements or interface
                        members that it verifies. It carries its own
                        configuration, its inputs, the observations
                        expected of them, and the tolerances by which
                        an observation is compared.

                        A case does not name the item under test. That
                        binding belongs to the execution, so one case
                        applies to several implementations and to
                        several revisions of one.

                        The configuration a case supplies is governed
                        by a schema its method names. A check resolves
                        the method, reads the schema and validates the
                        payload against it. Neither the case nor the
                        method carries an ungoverned mapping.

                        A case may refer to a vector held outside the
                        repository. The reference carries its locator,
                        its digest and the algorithm, its media type,
                        its size, where it came from and how long it
                        is kept. The repository does not become a
                        store of binary artifacts.

                        An executable case names the python test
                        function that automates it by
                        r_is_implemented_by. The function is how the
                        case is run and is not the case.
rationale:              |
                        The item under test bound at execution and not
                        on the case, because what is tried is
                        independent of what it is tried against. A
                        case that named its implementation would be
                        copied once per implementation, and the copies
                        would drift.

                        Exactly one method, because a case is the
                        configuration of a procedure. Two procedures
                        with one configuration is two cases, and
                        saying so keeps the pair resolvable without a
                        rule for which method wins.

                        A schema named by the method rather than
                        fields on the case, because what a case must
                        supply depends on the procedure. A common
                        shape would be either too wide to check or too
                        narrow to use.

                        A digest on an external vector, because a
                        vector that changes silently makes every
                        result that cited it wrong, and nothing in the
                        repository would show it.
alternative:            |
                        The python test function as the case.
                        Rejected: it cannot be applied to a second
                        implementation, it states its expectation in
                        code, and it cannot be read by a reviewer who
                        does not read python. The function remains, as
                        what implements the case.

                        A case that names its item under test.
                        Rejected: see the rationale.

                        An open configuration mapping validated by
                        nothing. Rejected: it is the ungoverned
                        payload the plan warns against.

                        Holding external vectors in the repository.
                        Rejected: it makes the core a binary store,
                        which is out of scope, and a digest gives the
                        same assurance.
consequence:            |
                        t_test_case, sch_test_case and the test_case/
                        home are added in the next milestone, and tc
                        is claimed as a prefix. case is already the
                        prefix of a control case, which is why the
                        case is tc.

                        A check must resolve a method from a case,
                        read the schema the method names and validate
                        the payload. That check does not yet exist.

                        Two representations of verification trace
                        exist while the model is tried: a python test
                        function pointing at a requirement, and a case
                        pointing at a requirement with a function
                        implementing it. Both are read until one is
                        chosen.

                        Whether a case may name a second method for a
                        different verification class, such as an
                        inspection of the same requirement, is not
                        settled here.

