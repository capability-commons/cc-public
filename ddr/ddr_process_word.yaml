title:                  Process words are a register, and the verb must resolve
brief:                  |
                        The verbs the requirements of a segment oblige
                        an entity to perform are entries of a process
                        word register, one per process, and a check
                        resolves the process slot of every requirement
                        and candidate against the registers its
                        segment can see, reporting a verb none
                        defines.
context:                |
                        The process slot of a requirement holds one
                        main verb, and nothing said which verbs there
                        are. SOPHIST asks that every process be named
                        by a main verb defined once in the glossary,
                        so that enter, insert and input do not name
                        three processes or one, and its second rule
                        asks of a vague verb what the entity really
                        does. The repository glossary defines the
                        nouns of the repository, not the verbs of the
                        entities under specification, and the textual
                        requirement decision left a project glossary
                        for the entity to be made on the federation
                        precedent. The demonstration, migrated into
                        slots, uses fifty-seven distinct verbs,
                        provide fifty-two times, support fourteen, and
                        be and electrically once each as the migration
                        left them.
decision:               |
                        A PROCESS WORD is an entry of a process word
                        register, of type t_process_word, prefix verb,
                        holding the verb as the process slot writes
                        it, what the entity does when it does this as
                        its brief, what the object must supply as its
                        description, and under avoid the verbs not to
                        be used for the same process. The core holds
                        reg_process_word for the verbs its own
                        requirements use. A consumer segment holds a
                        register of the same type for the entities its
                        requirements are on, and nothing above it sees
                        it.

                        The REQUIREMENT CHECK, the fourteenth,
                        composes the statement of every textual
                        requirement and every candidate requirement in
                        a concept and reports slots that do not
                        compose as critical; and resolves the process
                        slot against the process words visible from
                        the item's segment, its own and those it
                        consumes, reporting a verb none defines as
                        advisory while the item is a candidate or
                        proposed and critical once accepted. Where no
                        segment is declared, every register is seen.
rationale:              |
                        A register rather than a free slot, because a
                        verb defined once is what makes two
                        requirements on one process say the same word,
                        and what lets a reader ask which processes an
                        entity performs.

                        Advisory while proposed, because the finding
                        is the elicitation: SOPHIST's question, what
                        does the entity do, is put to the source or
                        becomes a design claim, and refusing the item
                        would hide the question rather than ask it.
                        Critical once accepted, because acceptance is
                        the claim that the obligation is defined.

                        Seen by segment, on the segment decision: a
                        consumer's verbs are its own, and the core
                        must not resolve a verb through a register
                        beneath it.

                        A type of its own rather than a kind of term,
                        because a term defines a noun of the
                        repository and a process word a verb of an
                        entity, and the two are judged by different
                        rules and held by different segments.
alternative:            |
                        Process words as terms in reg_term with a
                        kind. Rejected: the repository's glossary
                        would fill with the verbs of every entity a
                        concept proposes.

                        A process word table on each concept, for the
                        entity it proposes. Rejected: report, display
                        and provide are the same process on every
                        entity, and a register per concept says each
                        many times.

                        Refusing an undefined verb outright. Rejected:
                        it hides the question the finding asks.
consequence:            |
                        The core defines its seven verbs. The
                        demonstration defines its own in a register of
                        its own, the first register a consumer segment
                        holds, and the verbs the migration left that
                        name no process, be and electrically, stand as
                        findings until their requirements are
                        rewritten.

                        The propose prompt does not yet see the
                        register; a proposer that reads the defined
                        verbs and prefers them is the next step, and
                        until then a new concept's undefined verbs are
                        the advisories that ask for their definitions.

                        The segment check's helpers, the segments
                        declared, what each can see, and the segment
                        governing a file, are public for the
                        requirement check's use.

