title:                  Findings become data, and a recurring shape proposes a rule
brief:                  |
                        A sweep item holds what one run of the evals
                        found, grouped by eval and rule with counts,
                        items and sample messages; a workflow on a
                        model reads the groups and proposes one rule a
                        mechanical check over the slots could apply,
                        as a rule proposal item deriving from the
                        sweep; a person accepts it by entering the
                        rule in the register, or rejects it.
context:                |
                        The admissible claims position says process
                        improvement is the migration of checks down
                        the cost hierarchy, from a judge to a rule,
                        and that a defect shape found repeatedly is
                        evidence a rule is missing, which needs a step
                        whose input is findings aggregated across
                        items and runs and whose output is a change to
                        the rule set and never to a claim. Findings
                        were a report a command wrote and a person
                        read once: the two demonstration sweeps raised
                        four hundred and sixty-nine and four hundred
                        and four, and the shapes in them, a hundred
                        and twenty-seven citations of one rule, twenty
                        invented rule ids, the template forms faulted
                        as padding, were found by reading samples by
                        hand. The register of rules is written only by
                        a person, on the position's third human duty,
                        ratifying rule changes.
decision:               |
                        A SWEEP is a data item of type t_sweep, held
                        in sweep/, made by cctool sweep from a check
                        report: the judge, the counts of judgements
                        and findings, and under group one finding
                        group per eval and rule, largest first, each
                        with its count, the ids of the items it fell
                        on and up to three messages as the judge wrote
                        them. A finding naming a rule the register
                        lacks groups under its eval alone, since the
                        name is the judge's invention.

                        wf_propose_rule, one node on a model, takes a
                        sweep, the rule register and the guide, and
                        writes a RULE PROPOSAL of type
                        t_rule_proposal, held in proposal/, deriving
                        from the sweep: the rule as a register entry
                        states it, the groups it answers, a statement
                        that follows it and one that breaks it, and in
                        check how a check over the slots would find
                        the defect or that only a judge can. It is
                        proposed until a person enters the rule in the
                        register and marks it accepted, or marks it
                        rejected. Nothing writes to the register but a
                        person.
rationale:              |
                        Findings as an item rather than a report,
                        because a report is read once and a shape is
                        seen only across items and runs; the sweep is
                        the aggregate the position asks for, and a
                        sweep of a later run beside an earlier one is
                        how a rule is seen to have worked.

                        Groups rather than findings, because a group
                        is what the loop reads: a count, the items, a
                        sample; the findings stay in the report the
                        sweep names.

                        A proposal item rather than a register entry
                        written by the model, because the register is
                        the gate for every future claim, and the
                        position gives ratifying its changes to a
                        person; the proposal is the model's draft in
                        the register's shape, so that accepting it is
                        an insert and a status.

                        The prompt asks for a shape a check over the
                        slots could find, because the loop's purpose
                        is to move a judgement down to a rule, and a
                        rule a judge must apply moves nothing.
alternative:            |
                        The model inserting the rule into the register
                        with status proposed. Rejected: a proposed
                        entry in the register is still an entry an
                        eval may cite.

                        Findings kept as items, one each. Rejected:
                        hundreds of items that say one thing each,
                        where the loop reads shapes.

                        A mechanical proposal, the largest group named
                        as a rule to write. Rejected as the whole: the
                        aggregation is mechanical and is the sweep;
                        what the shape is, and how a check would find
                        it, is a reading.
consequence:            |
                        The sweep command and the proposing workflow
                        exist and are tested with a scripted model: a
                        report of four findings becomes three groups,
                        the invented rule grouping under its eval, and
                        the workflow writes a proposal deriving from
                        the sweep.

                        The demonstration's sweep after the eval
                        rewrite is an item, and the first proposal is
                        run on it; what it proposes, and whether a
                        check over the slots can find it, is the first
                        turn of the loop and is read before anything
                        enters the register.

                        Accepting a proposal is an insert into the
                        register and a status by hand; a command that
                        does both, and links the rule to the proposal
                        it came from, is the next step.

