question:

  rise:
    id_self:            qst_python_version.rise
    guid_self:          qst_9b98e060095c4b128e9226aad4206c00
    question:           |
                        What would say the floor should rise, given
                        that where it sits follows from what
                        distributions ship rather than from anything
                        this tree needs.
    relation:           []

