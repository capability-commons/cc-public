title:                  An annotation names the model that asserted it
brief:                  |
                        A language model is an entry of a register of
                        its own, and an annotation a model asserts
                        names that entry, so that the graph can say
                        which model said what.
context:                |
                        A review of the tree by a model other than the
                        one that did the work is to recur: at a
                        release, when a more capable model appears, or
                        for a second perspective. Its findings are
                        annotations, and the rebuttals are annotations
                        too. Nothing on an annotation says which model
                        asserted it. The history records who
                        committed, and a person commits what a model
                        wrote, so a model is named only in the trailer
                        of a commit, and the graph cannot be asked
                        which assertions one model made or whether a
                        rebuttal came from the model whose work was
                        challenged.

                        A model is already named in the tree, by
                        string. The model field of a deployment and
                        the model field of a confidence row both spell
                        one as dspy resolves it. Nothing holds either
                        to an entry, so one model may be spelled two
                        ways and nothing notices. The actor of a
                        decision by a person is free text for the same
                        want of an entry.
decision:               |
                        A language model is an entry of reg_model, of
                        type t_model with prefix mdl, shaped by
                        sch_entry_model composed with sch_entry, which
                        t_model names by r_is_specified_by_schema. An
                        entry carries the name a runtime resolves the
                        model by, spelled as a deployment and a
                        confidence row already spell it, and the
                        family the model belongs to.

                        An annotation a model asserts names that model
                        by r_is_asserted_by, at most one. An
                        annotation with no such edge was asserted by a
                        person, whom the history names.

                        A deployment and a confidence row go on
                        spelling the model in a field. Neither is held
                        to an entry here.
rationale:              |
                        A register rather than a field on the
                        annotation, because a field spells and an
                        entry is pointed at. Every annotation one
                        model made is then a walk from the entry, and
                        two spellings of one model cannot arise. It is
                        also how every other controlled vocabulary
                        here is held.

                        Rather than the actor of a decision, which is
                        free text, because a decision names a person
                        acting under an authority and an annotation
                        names what wrote it. The two are not one fact,
                        and free text is what this record exists to
                        end.

                        Rather than an execution record, because a
                        review is not yet a run of a workflow. The
                        machinery is young and little tried, and
                        provenance should not wait on it. An execution
                        may later name the same entry.

                        The family on the entry, because the rule this
                        repository already states of a judge, and now
                        applies to a reviewer, is a rule about family:
                        a judge should not be of the family that wrote
                        what it judges. A rule is read only where the
                        property it reads is written.

                        At most one model per annotation, because one
                        assertion has one author. Two models agreeing
                        is two annotations, one supporting the other.

                        The name spelled as dspy spells it, because
                        that is the spelling eleven deployments and
                        every confidence row carry, and a join is
                        possible over one spelling only.
alternative:            |
                        An author field on the annotation, a string.
                        Rejected: it cannot be walked, it can be
                        misspelled, and it would be a third place a
                        model is spelled by hand.

                        Holding the annotations of a review as a
                        workflow execution, with the reviewing model
                        as its performer. Rejected for now: the
                        workflow machinery is immature, and the first
                        review is made by hand so that what a review
                        workflow would need can be seen. The question
                        is kept.

                        Admitting a person as an entry, so that every
                        annotation names its author. Rejected for now:
                        the history names the person who committed, an
                        annotation by a person is the ordinary case,
                        and an entry per person asks who maintains it.

                        Naming the model by the performer of a
                        component. Rejected: a performer is a kind,
                        function, model or agent, and not an identity.
consequence:            |
                        reg_model, t_model, sch_entry_model,
                        sch_reg_model, term_language_model and
                        r_is_asserted_by are added, and mdl is claimed
                        as a prefix. The register holds four entries:
                        the two models that have edited this tree as
                        agents, the judge every confidence row names,
                        and the model the local deployments run under.

                        The model field of a deployment and of a
                        confidence row still spells a name that
                        nothing holds to an entry. Whether each should
                        name one instead is open.

                        Nothing checks that the model an annotation
                        names differs in family from whatever wrote
                        the item it is about. The family of the writer
                        is in the trailer of a commit and not in the
                        graph.

                        The annotations of one review are grouped by
                        nothing but the model that asserted them and
                        the commit that brought them. What a review
                        is, as an item or as a run, is open.

