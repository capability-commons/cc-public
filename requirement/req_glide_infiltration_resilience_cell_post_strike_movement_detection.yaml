title:                  Post strike movement detection
statement:              |
                        The Glide_Infiltration_MicroCell_System shall
                        enable each alarm puck to signal distinct
                        post-strike proximate movement when sustained
                        acoustic or vibration activity is detected
                        within 50 meters for more than 5 seconds.
rationale:              |
                        Detecting nearby post-strike movement offers a
                        simple cue for possible infiltrators moving
                        through rubble or close cover.
category:               function
status:                 proposed

