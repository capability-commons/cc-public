title:                  Acoustic signature limit
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall,
                        when operating without connected external
                        generators or vehicles, produce a continuous
                        noise level not exceeding 25 dBA at a distance
                        of 5 metres in still air.
rationale:              |
                        A very low acoustic signature reduces
                        detection risk compared to combustion
                        generators in quiet environments.
category:               quality
status:                 proposed

