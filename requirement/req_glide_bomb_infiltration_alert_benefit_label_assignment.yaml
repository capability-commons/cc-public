title:                  Benefit label assignment
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall label
                        each suggested posture option with one of
                        three benefit levels: no meaningful
                        improvement, small improvement, or moderate
                        improvement.
rationale:              |
                        Explicit benefit labelling helps leaders judge
                        when movement is worth the cost and risk.
category:               quality
status:                 proposed

