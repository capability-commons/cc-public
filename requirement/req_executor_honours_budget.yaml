title:                  Executor honours the budget
rationale:              |
                        A loop that cannot end is a run that cannot be
                        paid for. The budget on the deployment is the
                        bound, and it is per node so that a later node
                        is not starved by an earlier one's passes.
category:               function
verification:           test
success_criteria:       |
                        In the execution record, no node has a binding
                        with a pass number greater than the
                        deployment's budget.
status:                 accepted
condition_kind:         time
condition:              the Execution runs
entity:                 Executor
obligation:             shall
activity:               autonomous
process:                run
object:                 each Node
qualifier:              no more than Deployment_Budget times
claim:                  design

