title:                  Drop resistance hub
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        withstand a drop of the hub unit from 0.5
                        metres onto concrete on any face without loss
                        of safety or function.
rationale:              |
                        The hub is a critical component and must
                        resist common handling shocks to avoid
                        system-wide failure.
category:               quality
status:                 proposed

