title:                  Role based access
statement:              |
                        The Adaptive_Decoy_Fort_System shall enforce
                        role-based access control for fire plan
                        modification, decoy signature changes and
                        obstacle activation.
rationale:              |
                        Limiting critical actions to authorized roles
                        reduces the risk of accidental or malicious
                        misuse.
category:               quality
status:                 proposed

