title:                  The reader can read every text the workbench presents
entity:                 Workbench
obligation:             shall
activity:               interaction
process:                read
object:                 each Text the Workbench presents
claim:                  design
rationale:              |
                        The Workbench shows position by contrast, so
                        the faintest level it uses is the one a reader
                        most often has to read and the one most easily
                        made illegible. A level faint enough to be
                        unreadable is not a quieter level, it is an
                        absent one, and the reader cannot tell which
                        of the two the design intended.
category:               compliance
actor:                  Reader
qualifier:              at a Contrast_Ratio of at least 4.5 to 1 against the Surface it is presented on
verification:           test
success_criteria:       |
                        Each Text the Workbench presents, in each
                        theme it offers, stands at a Contrast_Ratio of
                        at least 4.5 to 1 against the Surface behind
                        it, measured from the tokens the stylesheet
                        declares.

