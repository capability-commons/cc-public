title:                  A write that fails leaves the tree as it was
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                leave
object:                 each File a failed write would have changed
claim:                  design
rationale:              |
                        A write made by an agent is one of many in a
                        run nobody is watching. A write that stops
                        partway leaves a file holding neither what it
                        held nor what it was meant to hold, and the
                        next command reads it as though somebody meant
                        it.
category:               quality
qualifier:              as it was before the write began
verification:           test
success_criteria:       |
                        A write interrupted at any point leaves every
                        file it would have changed holding exactly
                        what it held before, and the tree loads and
                        checks as it did.

