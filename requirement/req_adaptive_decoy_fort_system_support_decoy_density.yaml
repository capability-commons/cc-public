title:                  Support decoy density
statement:              |
                        The Adaptive_Decoy_Fort_System shall support
                        planning and management of at least three
                        decoy forts for every hardened high-value
                        position in a defended company sector.
rationale:              |
                        A higher number of decoys than real positions
                        is needed to dilute enemy targeting.
category:               fit
status:                 proposed

