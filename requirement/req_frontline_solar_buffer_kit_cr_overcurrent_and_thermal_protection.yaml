title:                  Overcurrent and thermal protection
statement:              |
                        The Frontline_Battery_Crate shall disconnect
                        charging or discharging automatically when
                        measured cell currents or temperatures exceed
                        limits specified by the cell manufacturer.
rationale:              |
                        Overcurrent and thermal protection reduce the
                        risk of battery damage and fire under abusive
                        conditions.
category:               quality
status:                 proposed

