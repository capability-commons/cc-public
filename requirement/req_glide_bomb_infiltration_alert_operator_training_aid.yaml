title:                  Operator training aid
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall
                        include a built-in tutorial scenario that can
                        be completed in no more than 20 minutes to
                        train operators on input and interpretation.
rationale:              |
                        Short, embedded training helps units adopt the
                        tool without extensive external instruction.
