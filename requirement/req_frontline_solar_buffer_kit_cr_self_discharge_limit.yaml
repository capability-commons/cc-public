title:                  Self discharge limit
statement:              |
                        The Frontline_Battery_Crate shall limit
                        self-discharge and standby consumption to no
                        more than 5% of state of charge per month at
                        25 °C when stored.
rationale:              |
                        Low self-discharge allows crates to be stored
                        for extended periods and still be ready for
                        use when needed.
category:               quality
status:                 proposed

