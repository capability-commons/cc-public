title:                  Input latency bound
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall
                        incorporate a new observation into displayed
                        risk estimates within 5 seconds of entry.
rationale:              |
                        Low processing latency keeps the displayed
                        threat picture aligned with current cues.
