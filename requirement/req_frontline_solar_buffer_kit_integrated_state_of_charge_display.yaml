title:                  Integrated state of charge display
statement:              |
                        The Frontline_Flyin_Power_Cache shall present
                        a clear indication of remaining energy and
                        estimated runtime under current load on the
                        unit.
rationale:              |
                        Operators need simple feedback to ration power
                        and avoid unexpected shutdowns over several
                        days.
category:               function
status:                 proposed

