title:                  State of charge accuracy
statement:              |
                        The Frontline_Battery_Crate shall display
                        state of charge as a percentage with an
                        accuracy of ±5% over the full range.
rationale:              |
                        Accurate feedback enables users to plan energy
                        use and avoid unexpected shutdowns.
