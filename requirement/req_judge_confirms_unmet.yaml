title:                  Judge confirms an unmet verdict
statement:              |
                        When the Screening_Judgement of the Subject is
                        unmet, the Judge shall judge the Subject
                        Confirm_Count times.
rationale:              |
                        A single judgement is wrong about one time in
                        ten, and ddr_eval_measurement decides that an
                        adverse finding is confirmed over
                        Confirm_Count fresh judgements before it is
                        reported. The count is the deployment's
                        confirm, five by default; it is mandated by
                        that decision, not chosen here. Screening once
                        keeps a clean corpus cheap.
category:               quality
verification:           test
success_criteria:       |
                        For each Subject whose Screening_Judgement is
                        unmet, the report shows Confirm_Count
                        judgements after the screen.
