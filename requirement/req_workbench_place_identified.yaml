title:                  The reader knows what a disclosed group hangs from
entity:                 Workbench
obligation:             shall
activity:               interaction
process:                identify
object:                 the Item a disclosed Group of Items hangs from
claim:                  design
rationale:              |
                        Nothing is indented, so the shape of the page
                        does not say which Item a Group belongs to.
                        The label on a Group names the relation it was
                        reached by and not the Item it was reached
                        from, and the two are not the same fact. A
                        reader following a derivation who loses the
                        Item is reading a list of records rather than
                        a design.
category:               function
actor:                  Reader
qualifier:              without disclosing any further Item and without acting
verification:           demonstration
success_criteria:       |
                        Shown a page in which one Item is disclosed
                        beneath another, a reader who has not seen it
                        before states which Item each disclosed Group
                        hangs from, and is right.

