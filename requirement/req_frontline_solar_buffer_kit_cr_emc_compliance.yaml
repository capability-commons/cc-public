title:                  Emc compliance
statement:              |
                        The Frontline_Battery_Crate shall meet
                        electromagnetic compatibility limits specified
                        in MIL-STD-461 or a designated equivalent
                        standard.
rationale:              |
                        The crate must not interfere with sensitive
                        communications and must resist external
                        electromagnetic interference.
category:               compliance
status:                 proposed

