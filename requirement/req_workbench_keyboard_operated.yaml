title:                  The reader works by keyboard alone
entity:                 Workbench
obligation:             shall
activity:               interaction
process:                operate
object:                 each Act the Workbench offers
claim:                  design
rationale:              |
                        An act reachable only by pointer is
                        unavailable to a reader who does not use one,
                        and an act that hides the element holding the
                        focus loses the reader's place whether or not
                        they use a pointer. Both are the same
                        obligation seen from two sides: what the
                        workbench offers, it offers through the
                        keyboard, and what it offers does not strand
                        the reader who takes it.
category:               quality
actor:                  Reader
qualifier:              by Keyboard alone, and with the Element that holds the focus still shown after each Act
verification:           test
success_criteria:       |
                        Each Act the Workbench offers is reachable and
                        performed by Keyboard alone, each is named
                        where a program can read the name, and after
                        each the Element holding the focus is still
                        shown.

