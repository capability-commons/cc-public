title:                  Mass limit main unit
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall have
                        a total mass, including integrated battery,
                        buffering and control electronics but
                        excluding external recharge modules, not
                        exceeding 18 kilograms.
rationale:              |
                        Limiting main unit mass to 18 kg keeps it
                        man_portable as a shared load or for short
                        individual moves.
category:               fit
status:                 proposed

