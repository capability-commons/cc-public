title:                  Scavenger dc input range
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        allow each battery module to be recharged from
                        an external DC source over a voltage range
                        from 18 volts to 32 volts at up to 250 watts.
rationale:              |
                        This range covers common 24 V vehicle and
                        generator accessory outputs, enabling flexible
                        recharging away from the hub.
category:               function
status:                 proposed

