title:                  Rugged hardware
statement:              |
                        The Adaptive_Decoy_Fort_System shall operate
                        on hardware tolerant of ambient temperatures
                        from minus 20 degrees Celsius to plus 40
                        degrees Celsius and resistant to IP65 dust and
                        water ingress.
rationale:              |
                        Frontline equipment must function reliably in
                        harsh environmental conditions.
