title:                  Partial deployment tolerance
statement:              |
                        The Glide_Infiltration_MicroCell_System shall
                        ensure that shelters and alarm pucks each
                        provide standalone benefit when used alone
                        without the other component deployed.
rationale:              |
                        Designing each component to be independently
                        useful mitigates the risk that incomplete
                        setup yields no meaningful protection or
                        cueing.
category:               function
status:                 proposed

