title:                  Shock resistance
statement:              |
                        The Frontline_Battery_Crate shall withstand
                        mechanical shocks of 30 g for 11 ms in each
                        axis without loss of function.
rationale:              |
                        Rough handling and nearby blasts can impart
                        high shocks that the equipment must survive.
category:               quality
status:                 proposed

