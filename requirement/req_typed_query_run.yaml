title:                  A typed question is answered
rationale:              |
                        The questions the graph raises are not the
                        ones the fixed reports answer, and the first
                        form of a question is typed, not kept. A
                        question worth keeping becomes a Query item,
                        which the kept-query requirement covers.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        For Query_Text that counts the Edge_Facts, the
                        Result has one Row holding the count of
                        Edge_Facts in the Fact_Table, and Query_Text
                        that names no table of the Fact_Table is
                        refused with the reason.
condition_kind:         event
condition:              the Tool is given the Query_Text at the command line
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                report
object:                 each Row of the Result of the Query_Text over the Fact_Table
claim:                  design

