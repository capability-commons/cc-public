title:                  Portable energy capacity
statement:              |
                        The Frontline_Flyin_Power_Cache shall supply a
                        specified typical terminal or charger load for
                        at least 72 hours when fully charged.
rationale:              |
                        The need describes three nights without power,
                        so a three‑day endurance without resupply is a
                        relevant design point for the stored energy
                        capacity of each kit.
category:               function
status:                 proposed

