title:                  Manage signatures
statement:              |
                        The Adaptive_Decoy_Fort_System shall schedule
                        visual, thermal and radio signatures on decoy
                        forts with a configurable duty cycle between
                        10 percent and 90 percent per 24-hour period.
rationale:              |
                        Variable signatures prevent adversaries from
                        easily classifying decoys while allowing power
                        management.
category:               function
status:                 proposed

