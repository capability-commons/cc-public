title:                  Low power client
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall
                        operate on an Android 10 or later device with
                        2 gigabytes of RAM for at least 8 hours on a
                        3000 milliampere-hour battery during
                        continuous display use.
rationale:              |
                        Power-efficient operation aligns with typical
                        frontline device constraints.
category:               form
status:                 proposed

