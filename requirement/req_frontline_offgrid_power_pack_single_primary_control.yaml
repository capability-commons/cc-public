title:                  Single primary control
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall
                        provide a single primary power control that
                        enables or disables all output ports without
                        presenting any configuration menu.
rationale:              |
                        A single obvious control simplifies operation
                        under stress and reduces the chance of
                        incorrect mode selection.
category:               fit
status:                 proposed

