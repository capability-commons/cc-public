title:                  Printer is idempotent
statement:              |
                        When the Printer receives a Laid_Out_Document,
                        the Printer shall write the Laid_Out_Document
                        with each byte unchanged.
rationale:              |
                        A Laid_Out_Document is a document the Printer
                        has already written. The layout check is that
                        the Printer's output equals its input, and
                        that check means nothing unless a second pass
                        changes nothing.
category:               quality
verification:           test
success_criteria:       |
                        Every YAML file and every docstring document
                        in the repository, laid out twice, is byte
                        identical after the first pass.
status:                 proposed

