title:                  Dc output connectors
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        provide DC output connectors using the
                        standard agreed field power interface type for
                        the force with at least three independent
                        output circuits.
rationale:              |
                        Standard connectors and multiple circuits
                        improve interoperability and allow separation
                        of critical and non-critical loads.
category:               fit
status:                 proposed

