title:                  Opportunistic solar charging
statement:              |
                        The Frontline_Flyin_Power_Cache shall accept
                        recharge from its supplied folding solar
                        panels to extend runtime beyond the initial
                        stored energy.
rationale:              |
                        Opportunistic solar input allows endurance to
                        stretch when short safe exposure windows
                        exist, improving resilience without relying
                        solely on prediction.
category:               function
status:                 proposed

