title:                  Short dwell comms
statement:              |
                        The Adaptive_Decoy_Fort_System shall support
                        radio communication protocols that limit
                        individual transmission bursts to a maximum of
                        two seconds for routine control messages.
rationale:              |
                        Short transmissions reduce probability of
                        detection and geolocation by enemy EW.
category:               quality
status:                 proposed

