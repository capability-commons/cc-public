title:                  A commit refuses what the checks call critical
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                report
object:                 the finding that refuses the Commit
claim:                  design
rationale:              |
                        History is what a later reader trusts. A
                        commit made over a critical finding puts a
                        state nobody would have chosen into the
                        record, and the record is the thing that
                        cannot be corrected afterwards without a
                        second commit saying so.
category:               quality
qualifier:              and make no Commit
verification:           test
success_criteria:       |
                        Where a check reports a critical finding, the
                        Tool refuses the commit and says which finding
                        refused it. Where a checkpoint is asked for,
                        it commits and records that it did. An error
                        in the analysis refuses the commit whether or
                        not a checkpoint is asked for.
condition_kind:         logic
condition:              a check reports a critical finding and no checkpoint is asked for

