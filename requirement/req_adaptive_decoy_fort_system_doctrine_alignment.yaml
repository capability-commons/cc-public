title:                  Doctrine alignment
statement:              |
                        The Adaptive_Decoy_Fort_System shall align its
                        planning workflows with existing Ukrainian
                        defensive doctrine as specified in current
                        national field manuals.
rationale:              |
                        Alignment with doctrine eases adoption and
                        reduces training overhead.
category:               compliance
status:                 proposed

