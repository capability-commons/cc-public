title:                  Charging interface standard
statement:              |
                        The Frontline_Battery_Crate shall use a
                        charging interface compatible with a
                        designated rear-area charger standard selected
                        by the procuring authority.
rationale:              |
                        A standard charging interface enables
                        efficient rear-area recharging and simplifies
                        logistics support.
category:               compliance
status:                 proposed

