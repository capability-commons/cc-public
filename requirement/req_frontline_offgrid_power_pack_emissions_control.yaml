title:                  Emissions control
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall meet
                        the radiated and conducted emissions limits of
                        MIL_STD_461G for applicable power and control
                        ports in low_signature mode.
rationale:              |
                        Compliance with strict EMC limits bounds
                        unintentional RF emissions that could be
                        exploited by enemy SIGINT.
category:               compliance
status:                 proposed

