title:                  Thermal signature limit
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        limit external surface temperature of the hub
                        and modules to no more than 15 degrees Celsius
                        above ambient during steady-state operation at
                        300 watts output.
rationale:              |
                        Constraining surface temperature rise reduces
                        thermal signature and risk of burns to users.
category:               quality
status:                 proposed

