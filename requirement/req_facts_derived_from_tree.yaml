title:                  The fact table agrees with the tree
rationale:              |
                        The Fact_Table is three tables: one Item_Fact
                        for each Identity, carrying its type, status
                        and location; one Edge_Fact for each
                        Relation_Edge; one Containment_Fact for each
                        Embedded_Item and its holder. That it is
                        derived from the Directory_Tree on every use
                        and stored nowhere is decided in
                        ddr_graph_query, not here; what is required is
                        that it agrees with the Directory_Tree.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        For the Directory_Tree, the count of
                        Item_Facts equals the count of Identities the
                        guid check counts, the count of Edge_Facts
                        equals the count of Relation_Edges held by
                        identified items in the Directory_Tree, and
                        every Embedded_Item appears in exactly one
                        Containment_Fact naming its holder.
condition_kind:         event
condition:              the Tool is asked for the Fact_Table
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                produce
object:                 the Fact_Table of the Directory_Tree
claim:                  design

