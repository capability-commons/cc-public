title:                  A neighbourhood is drawn
statement:              |
                        When asked to draw the Neighbourhood, the Tool
                        shall write the Neighbourhood as the Drawing
                        in the Drawing_Format asked for.
rationale:              |
                        The Drawing has one node for each Item of the
                        Neighbourhood and one edge labelled with its
                        Relation for each Relation_Edge of it. A
                        drawing shows clusters, hubs and gaps that a
                        listing hides. The Drawing_Format is Graphviz
                        DOT, the standard for graphs, or Mermaid,
                        which a repository page renders without a
                        tool.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        The Drawing names every Item of the
                        Neighbourhood as a Node and every
                        Relation_Edge of the Neighbourhood as an Edge
                        labelled with its Relation, in the syntax of
                        the Drawing_Format asked for.

