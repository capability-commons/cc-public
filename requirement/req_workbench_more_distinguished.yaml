title:                  The reader sees which rows have more beneath them
entity:                 Workbench
obligation:             shall
activity:               interaction
process:                distinguish
object:                 an Item that discloses more beneath it from an Item that does not
claim:                  design
rationale:              |
                        A reader who cannot tell a leaf from a branch
                        finds out by acting, and acting costs a
                        request and a redraw for nothing. Over a list
                        the length of this corpus the cost is paid
                        many times, and the reader learns to stop
                        trying.
category:               function
actor:                  Reader
qualifier:              before disclosing either
verification:           test
success_criteria:       |
                        For each row the Workbench presents, the row
                        states whether disclosing it would find
                        anything, and that statement agrees with what
                        disclosing it does find.

