title:                  Traffic light indicator
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall
                        provide a three_state visual indicator showing
                        green for more than 12 hours, amber for 6 to
                        12 hours and red for less than 6 hours of
                        estimated remaining runtime at the current
                        load.
rationale:              |
                        A simple traffic_light style cue is easily
                        understood under stress and in low_light,
                        guiding immediate behaviour without detailed
                        reading.
category:               fit
status:                 proposed

