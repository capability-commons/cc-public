title:                  Support manual entry
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall allow
                        manual entry of observations using at most
                        five predefined event types and three free
                        numeric fields per event.
rationale:              |
                        Constrained manual inputs reduce operator
                        workload and ambiguity while still capturing
                        essential variation.
category:               fit
status:                 proposed

