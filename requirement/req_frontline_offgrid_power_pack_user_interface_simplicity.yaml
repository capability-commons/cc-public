title:                  User interface simplicity
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall
                        support full basic operation, including
                        powering loads and interpreting energy status,
                        using no more than one primary control, one
                        recessed override switch and three status
                        indicators.
rationale:              |
                        Explicitly limiting interface elements keeps
                        cognitive load low and addresses the risk of
                        confusion under battlefield stress.
category:               fit
status:                 proposed

