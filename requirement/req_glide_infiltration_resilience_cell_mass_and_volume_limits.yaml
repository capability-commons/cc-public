title:                  Mass and volume limits
statement:              |
                        The Glide_Infiltration_MicroCell_System shall
                        limit the total mass of one micro-cell pack to
                        no more than 25 kg and its packed volume to no
                        more than 0.1 cubic meters.
rationale:              |
                        Compact and lightweight packs are necessary to
                        avoid displacing critical supplies and to
                        support permanent vehicle or on-person
                        carriage.
category:               form
status:                 proposed

