title:                  Simple status indication
statement:              |
                        The Glide_Infiltration_MicroCell_System shall
                        provide a clear visual indicator on each alarm
                        puck showing armed or safe state that can be
                        read in low light within 1 second at 1 meter
                        distance.
rationale:              |
                        Obvious status indication reduces errors where
                        pucks are believed to be armed but are not, or
                        vice versa.
category:               quality
status:                 proposed

