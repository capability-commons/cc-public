title:                  Walk follows only the relations named
statement:              |
                        When given the Relation, the Tool shall report
                        only the Items reached from the Start_Item by
                        Relation_Edges labelled with the Relation.
rationale:              |
                        Most questions are about one relation: what a
                        decision decides, what derives from a need. A
                        walk over every relation at depth two reaches
                        most of the tree.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        With the Relation given, no reported Item is
                        reached by a Relation_Edge labelled with
                        another Relation, and an Item reachable only
                        by Relation_Edges labelled with other
                        Relations is absent from the report.

