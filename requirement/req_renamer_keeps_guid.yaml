title:                  Renamer keeps the guid
rationale:              |
                        The guid is the truth and every reference
                        resolves by it. A rename that touched it would
                        orphan every reference at once.
category:               function
verification:           test
success_criteria:       |
                        After a rename, the guid of the renamed item
                        and of every item it qualifies is the guid
                        before the rename.
status:                 accepted
condition_kind:         event
condition:              the Renamer renames the Item
entity:                 Renamer
obligation:             shall
activity:               autonomous
process:                leave
object:                 the Guid of the Item unchanged
claim:                  design

