title:                  Checker locates each finding
rationale:              |
                        A Location is the file that holds the
                        Nonconformity and the dot path within that
                        file. A finding a person cannot navigate to is
                        a finding they will not fix, and the Location
                        is what a control case and a suppression key
                        on.
category:               function
verification:           test
success_criteria:       |
                        For each nonconformity in the report, the file
                        exists and the path resolves to a node in it.
status:                 accepted
condition_kind:         event
condition:              the Checker has run over the Directory_Tree
entity:                 Checker
obligation:             shall
activity:               autonomous
process:                report
object:                 the Location of each Nonconformity in the Directory_Tree
