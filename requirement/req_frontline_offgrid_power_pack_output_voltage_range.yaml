title:                  Output voltage range
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall
                        provide regulated DC outputs selectable
                        between 12 volts and 24 volts with a tolerance
                        of plus or minus 5 percent at the output
                        terminals.
rationale:              |
                        Standard 12 V and 24 V rails with defined
                        tolerance accommodate common terminals and
                        chargers and simplify adapter design.
category:               function
status:                 proposed

