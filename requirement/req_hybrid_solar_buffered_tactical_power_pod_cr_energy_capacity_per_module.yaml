title:                  Energy capacity per module
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        provide at least 400 watt-hours of usable
                        electrical energy per battery module at full
                        charge.
rationale:              |
                        This design point balances mass and capacity
                        so that each module is worth carrying yet
                        remains man-portable while allowing several
                        modules to cover multi-day needs when pooled.
category:               function
status:                 proposed

