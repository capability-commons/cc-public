title:                  Storage life
statement:              |
                        The Frontline_Battery_Crate shall retain at
                        least 80% of its original usable energy
                        capacity after 3 years of storage under
                        manufacturer-recommended conditions.
rationale:              |
                        Crates may remain in storage for extended
                        periods before use; adequate capacity
                        retention ensures readiness.
category:               quality
status:                 proposed

