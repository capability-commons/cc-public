title:                  Ingest structured observations
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall ingest
                        structured local observations of aircraft
                        presence, reconnaissance drone activity, and
                        recent explosive impacts as timestamped
                        events.
rationale:              |
                        Capturing key local cues as events is
                        necessary to form a local threat picture from
                        sparse information.
category:               function
status:                 proposed

