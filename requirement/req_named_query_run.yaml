title:                  A named query is run over the facts
rationale:              |
                        The Query is an item kept in the
                        Directory_Tree, holding the Query_Text and
                        what a Row of its Result means, so that a
                        question about the graph asked once can be
                        asked again by anyone, and read, judged and
                        traced like anything else here rather than
                        living in a script.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        For the Query whose Query_Text counts the
                        Item_Facts, the Result has one Row holding the
                        count of Item_Facts in the Fact_Table.
condition_kind:         event
condition:              the Tool is given the Query kept in the Directory_Tree
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                report
object:                 each Row of the Result of the Query_Text of the Query over the Fact_Table
claim:                  design

