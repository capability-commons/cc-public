title:                  Automatic low energy shedding
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall,
                        when remaining usable aggregated energy falls
                        below 20 percent, automatically disconnect the
                        lowest-priority output circuit while
                        maintaining power to higher-priority circuits.
rationale:              |
                        Automatic shedding near depletion provides
                        graceful degradation and avoids sudden loss of
                        all systems.
category:               function
status:                 proposed

