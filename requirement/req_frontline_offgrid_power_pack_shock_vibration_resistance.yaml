title:                  Shock vibration resistance
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall
                        withstand mechanical shock and vibration
                        levels defined in MIL_STD_810H procedures for
                        ground tactical vehicles and handling without
                        loss of function.
rationale:              |
                        Shock and vibration resistance is necessary
                        for survival during transport, emplacement and
                        nearby explosions.
category:               compliance
status:                 proposed

