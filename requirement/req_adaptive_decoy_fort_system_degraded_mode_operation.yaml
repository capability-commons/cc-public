title:                  Degraded mode operation
statement:              |
                        The Adaptive_Decoy_Fort_System shall maintain
                        core decoy scheduling and pre-planned fire
                        triggering when external network links are
                        unavailable for up to 72 hours.
rationale:              |
                        Defensive sectors may be isolated by fires and
                        EW but must still apply deception and fires.
category:               quality
status:                 proposed

