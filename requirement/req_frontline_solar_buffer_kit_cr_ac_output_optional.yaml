title:                  Ac output optional
statement:              |
                        The Frontline_Battery_Crate shall provide an
                        optional 230 V AC output rated for 300 W
                        continuous power where required by local
                        equipment.
rationale:              |
                        Some existing chargers and terminals accept
                        only mains-equivalent AC and must be supported
                        without external inverters.
category:               fit
status:                 proposed

