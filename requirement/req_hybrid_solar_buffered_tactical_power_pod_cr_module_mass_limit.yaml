title:                  Module mass limit
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        limit the mass of each battery module to no
                        more than 4.5 kilograms including enclosure
                        and electronics.
rationale:              |
                        A mass under 4.5 kg per module allows one or
                        two modules to be carried by a soldier as
                        additional load without excessive impact on
                        mobility.
category:               form
status:                 proposed

