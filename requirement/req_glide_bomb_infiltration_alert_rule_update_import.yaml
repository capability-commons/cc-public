title:                  Rule update import
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall import
                        updated inference rules and posture templates
                        from removable media such as microSD cards
                        without requiring a network connection.
rationale:              |
                        Physical media updates avoid dependence on
                        contested networks for model evolution.
category:               fit
status:                 proposed

