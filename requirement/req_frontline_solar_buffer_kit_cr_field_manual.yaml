title:                  Field manual
statement:              |
                        The Frontline_Battery_Crate shall be supplied
                        with a field manual that describes setup,
                        operation, basic troubleshooting and energy
                        rationing strategies in fewer than 20 pages.
rationale:              |
                        Concise training material supports rapid
                        familiarisation by frontline personnel and
                        promotes correct use.
category:               fit
