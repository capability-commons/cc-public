title:                  Rapid decoy activation
statement:              |
                        The Adaptive_Decoy_Fort_System shall activate
                        or deactivate all signatures at a selected
                        decoy fort within 30 seconds of an operator
                        command.
rationale:              |
                        Rapid control allows last-minute adjustments
                        as enemy aircraft approach or depart.
category:               function
status:                 proposed

