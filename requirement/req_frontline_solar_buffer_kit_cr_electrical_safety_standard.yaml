title:                  Electrical safety standard
statement:              |
                        The Frontline_Battery_Crate shall comply with
                        the electrical safety requirements of IEC
                        62133-2 or a designated equivalent military
                        standard.
rationale:              |
                        Compliance with recognised safety standards
                        reduces the risk of shock, fire or equipment
                        damage.
category:               compliance
status:                 proposed

