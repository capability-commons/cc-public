title:                  Ew resilience
statement:              |
                        The Adaptive_Decoy_Fort_System shall support
                        at least two independent communication
                        channels, including wired and wireless, for
                        internal coordination within each defended
                        sector.
rationale:              |
                        Redundant communications improve resilience
                        against electronic warfare and physical
                        damage.
category:               quality
status:                 proposed

