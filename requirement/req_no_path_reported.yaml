title:                  The absence of a path is reported
statement:              |
                        When no Path of Relation_Edges joins the two
                        given Items, the Tool shall report that no
                        Path exists.
rationale:              |
                        Silence would read as a path of nothing; the
                        absence is a finding in its own right, since
                        two items that ought to be joined and are not
                        is exactly what the agent is looking for.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        For two Items in different connected parts of
                        the graph, the Tool reports that no Path
                        exists, and reports no Path.

