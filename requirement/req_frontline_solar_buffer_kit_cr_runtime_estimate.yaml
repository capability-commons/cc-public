title:                  Runtime estimate
statement:              |
                        The Frontline_Battery_Crate shall estimate
                        remaining runtime in hours for the current
                        load and update this estimate at least every
                        60 seconds.
rationale:              |
                        A clear runtime estimate helps personnel
                        decide which loads to prioritise and when to
                        reduce usage.
category:               function
status:                 proposed

