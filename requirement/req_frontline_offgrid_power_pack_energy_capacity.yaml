title:                  Energy capacity
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall store
                        at least 2500 watt_hours of usable electrical
                        energy at beginning of life.
rationale:              |
                        A 2500 Wh minimum, as a chosen design point,
                        supports several days of moderate terminal and
                        drone charging loads with some margin for
                        high-demand periods.
category:               function
status:                 proposed

