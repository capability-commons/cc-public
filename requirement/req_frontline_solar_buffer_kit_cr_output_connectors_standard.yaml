title:                  Output connectors standard
statement:              |
                        The Frontline_Battery_Crate shall use DC
                        output connectors conforming to a specified
                        military or industrial standard selected by
                        the procuring authority.
rationale:              |
                        Standard connectors simplify integration with
                        existing equipment and facilitate stocking of
                        spares and cables.
category:               compliance
status:                 proposed

