title:                  Preplan killzones
statement:              |
                        The Adaptive_Decoy_Fort_System shall allow
                        operators to define at least twenty distinct
                        kill-zones per battalion sector with
                        associated fire plans and obstacle activation
                        conditions.
rationale:              |
                        Multiple potential infiltration routes through
                        rubble must be covered with pre-planned
                        effects.
category:               function
status:                 proposed

