title:                  Judge reports the confirmed verdict
statement:              |
                        When the Screening_Judgement of the Subject is
                        unmet, the Judge shall report the
                        Confirmed_Verdict of the Subject.
rationale:              |
                        The Confirmed_Verdict is the verdict the
                        confirming judgements reach, not the screening
                        one. Reporting the screen would report the one
                        in ten.
category:               quality
verification:           test
status:                 proposed
success_criteria:       |
                        For each Subject whose Screening_Judgement is
                        unmet, the verdict reported is the verdict of
                        the confirming judgements.
