title:                  What rests on a change is reported
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                report
object:                 each Item held in a File changed since the Commit, and each Item resting on one of them by a chain of Relation_Edges declaring Dependency, with the Relation_Edge it holds
claim:                  design
rationale:              |
                        A change to an item changes what every item
                        resting on it claims, and the relations that
                        say so declare it in the register. A reviewer
                        reading a change wants that list before
                        reading, not after.
category:               function
verification:           test
status:                 proposed
success_criteria:       |
                        On a tree of known shape with one File changed
                        since the Commit, the Items reported as
                        changed equal the Items that File holds, and
                        the Items reported as resting on them equal
                        the Items reached by hand along Relation_Edges
                        declaring Dependency, read from target to
                        source, each with the Relation_Edge it holds
                        and the changed Item its chain ends at.
condition_kind:         event
condition:              the Tool is given the Commit

