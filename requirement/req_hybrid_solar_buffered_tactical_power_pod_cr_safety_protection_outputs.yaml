title:                  Safety protection outputs
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        provide overcurrent, overvoltage,
                        short-circuit and thermal protection on all
                        user-accessible power outputs in accordance
                        with IEC 60950-1 or successor standard.
rationale:              |
                        Comprehensive protection prevents equipment
                        damage and reduces risk of fire or injury.
category:               compliance
status:                 proposed

