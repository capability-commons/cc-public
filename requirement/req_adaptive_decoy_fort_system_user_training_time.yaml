title:                  User training time
statement:              |
                        The Adaptive_Decoy_Fort_System shall be usable
                        by a trained platoon or company staff member
                        after no more than 24 hours of classroom and
                        field instruction.
rationale:              |
                        Training time for frontline personnel is
                        scarce and must be minimized.
category:               quality
status:                 proposed

