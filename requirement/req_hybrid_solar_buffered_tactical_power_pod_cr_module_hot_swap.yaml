title:                  Module hot swap
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall,
                        while powering loads, permit any single
                        battery module to be disconnected or connected
                        without interrupting power to the DC outputs.
rationale:              |
                        Hot-swapping modules allows continuous
                        operation while rotating charged and depleted
                        modules to and from the position.
category:               function
status:                 proposed

