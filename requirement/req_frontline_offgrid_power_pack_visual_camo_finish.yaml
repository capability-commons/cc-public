title:                  Visual camo finish
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall use
                        non_reflective external surfaces with a gloss
                        value not exceeding 10 gloss units at 60
                        degrees.
rationale:              |
                        Low_gloss finishes reduce specular reflections
                        that can reveal equipment to visual and
                        electro_optical sensors.
category:               form
status:                 proposed

