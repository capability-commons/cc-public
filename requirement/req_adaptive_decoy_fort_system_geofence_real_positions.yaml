title:                  Geofence real positions
statement:              |
                        The Adaptive_Decoy_Fort_System shall define
                        and display a 3D geofenced exclusion volume of
                        at least 150 meters radius around each real
                        high-value position for all planned fires and
                        obstacles.
rationale:              |
                        Clear geofencing helps avoid friendly effects
                        impacting protected positions.
category:               fit
status:                 proposed

