title:                  Operating temperature range
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        operate within specified performance limits
                        over an ambient temperature range from minus
                        20 degrees Celsius to plus 45 degrees Celsius.
rationale:              |
                        This range aligns with common requirements for
                        deployed military electronics and many
                        operational theatres.
category:               quality
status:                 proposed

