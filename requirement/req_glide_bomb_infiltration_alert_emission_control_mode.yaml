title:                  Emission control mode
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall
                        support a mode in which all wireless network
                        interfaces are disabled while local processing
                        and logging remain available.
rationale:              |
                        Controlling emissions reduces the risk of
                        adversary detection or geolocation from device
                        activity.
category:               compliance
status:                 proposed

