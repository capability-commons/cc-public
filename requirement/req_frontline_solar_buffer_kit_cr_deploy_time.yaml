title:                  Deploy time
statement:              |
                        The Frontline_Battery_Crate shall allow a
                        trained two-person team to connect the crate
                        from packed state to powering loads within 5
                        minutes.
rationale:              |
                        Rapid deployment reduces downtime when primary
                        power fails and limits exposure while handling
                        equipment.
