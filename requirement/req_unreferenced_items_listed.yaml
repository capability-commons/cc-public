title:                  Items nothing points at are listed
rationale:              |
                        An Unreferenced_Item is an Item that no
                        Relation_Edge points at and that no Item
                        holds: either a root of the graph or
                        forgotten, and a listing by file cannot tell
                        which. The list is where the agent looks for
                        what the graph has lost.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        An Item made with no Relation_Edge pointing at
                        it and no holder appears in the list, and
                        disappears from it once one Relation_Edge
                        points at it.
condition_kind:         event
condition:              the Tool is asked for the Unreferenced_Items
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                list
object:                 each Unreferenced_Item in the Directory_Tree
claim:                  design

