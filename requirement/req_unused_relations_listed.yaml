title:                  Relations no edge uses are listed
rationale:              |
                        A relation nothing uses is vocabulary nobody
                        speaks, kept in the register at the cost of a
                        reader learning it; a listing by file never
                        shows it.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        A Relation entry that no Relation_Edge is
                        labelled with appears in the list, and
                        disappears from it once one Relation_Edge is
                        labelled with it.
condition_kind:         event
condition:              the Tool is asked for the Unused_Relations
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                list
object:                 each Relation that no Relation_Edge in the Directory_Tree is labelled with
claim:                  design

