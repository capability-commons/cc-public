title:                  Walk reports the neighbourhood to a depth
statement:              |
                        When given the Start_Item and the Depth, the
                        Tool shall report each Item within the Depth
                        in Relation_Edges of the Start_Item, in either
                        direction, with the Relation_Edge that reaches
                        it.
rationale:              |
                        An edge two hops away binds as tightly as one,
                        and the agent judging the reach of a change
                        needs the whole neighbourhood, not the first
                        hop. Either direction, because what points at
                        an item is as much its neighbourhood as what
                        it points at.
category:               function
verification:           test
status:                 accepted
success_criteria:       |
                        On a graph of known shape, the Items reported
                        at each Depth equal the Items within that many
                        Relation_Edges by hand, and each reported Item
                        carries the Relation_Edge it was reached by.

