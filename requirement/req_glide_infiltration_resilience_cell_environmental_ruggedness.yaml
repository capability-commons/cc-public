title:                  Environmental ruggedness
statement:              |
                        The Glide_Infiltration_MicroCell_System shall
                        operate its shelters and alarm pucks within
                        temperature and dust ranges defined by STANAG
                        2895 climatic categories A1 through C2.
rationale:              |
                        Environmental robustness avoids hidden
                        dependency on benign weather for core
                        protection and alert functions.
category:               compliance
status:                 proposed

