title:                  Priority load profiles
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        enforce at least three user-selectable load
                        priority profiles that allocate available
                        power between terminal, communications
                        equipment and drone chargers.
rationale:              |
                        Configurable priorities allow operators to
                        preserve communications by curtailing less
                        critical loads during shortages.
category:               function
status:                 proposed

