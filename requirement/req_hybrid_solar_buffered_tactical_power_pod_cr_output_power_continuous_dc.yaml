title:                  Output power continuous dc
statement:              |
                        The Man_Portable_Modular_Battery_Swarm shall
                        provide at least 500 watts continuous DC
                        output power at 24 volts nominal for connected
                        loads.
rationale:              |
                        A 500 W continuous output supports
                        simultaneous operation of a terminal, radios
                        and multiple drone chargers at the expected
                        duty cycle.
category:               function
status:                 proposed

