title:                  Data at rest encryption
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall
                        encrypt all stored logs, rules, and
                        configuration data using Ukrainian-approved
                        cryptographic standards.
rationale:              |
                        Strong encryption mitigates the intelligence
                        value of captured devices.
