title:                  Infrared temperature limit
statement:              |
                        The Low_Cognition_Silent_Power_Pod shall limit
                        its external surface temperature to no more
                        than 5 degrees Celsius above ambient during
                        continuous operation at 250 watts.
rationale:              |
                        Constraining surface temperature rise reduces
                        thermal contrast in IR imagery, making the pod
                        harder to detect.
category:               quality
status:                 proposed

