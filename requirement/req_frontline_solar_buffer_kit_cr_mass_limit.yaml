title:                  Mass limit
statement:              |
                        The Frontline_Battery_Crate shall limit the
                        mass of the complete crate to no more than 40
                        kg.
rationale:              |
                        A 40 kg limit allows a two-person lift while
                        accommodating several kilowatt-hours of
                        storage; this is a chosen design point
                        balancing endurance and mobility.
category:               form
status:                 proposed

