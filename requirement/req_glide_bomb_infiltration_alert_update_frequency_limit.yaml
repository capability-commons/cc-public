title:                  Update frequency limit
statement:              |
                        The Glide_Bomb_Local_Threat_Coach shall update
                        its risk estimates at least once per minute
                        when new observations are available.
rationale:              |
                        Frequent updates keep the threat picture
                        responsive to rapidly changing cue patterns.
category:               quality
status:                 proposed

