title:                  Tactical mobility support
statement:              |
                        The Adaptive_Decoy_Fort_System shall support
                        planning of at least two alternate hardened
                        positions per high-value element and visualize
                        recommended displacement routes.
rationale:              |
                        Mobility between hides complements deception
                        to reduce vulnerability to repeated strikes.
category:               fit
status:                 proposed

