title:                  A tree that cannot be read entirely refuses to be written to
entity:                 Tool
obligation:             shall
activity:               autonomous
process:                report
object:                 each File that failed to load
claim:                  design
rationale:              |
                        An edit over part of a tree can collide with
                        an item it cannot see or break a reference it
                        cannot read. The collision and the breakage
                        are both silent, and both are found later by
                        somebody who did not make them.
category:               quality
qualifier:              and change nothing
verification:           test
success_criteria:       |
                        Asked to edit a tree in which any root is
                        missing or any file failed to load, the Tool
                        names each such file and changes nothing. A
                        file that loads and fails its schema is not
                        such a file, since a skeleton is meant to be
                        filled over several commands.
condition_kind:         event
condition:              an edit is asked of a tree that could not be read entirely

