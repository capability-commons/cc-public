title:                  The reader reaches the whole of what is shown
entity:                 Workbench
obligation:             shall
activity:               interaction
process:                reach
object:                 the complete Record of each Item shown as a Row
claim:                  design
rationale:              |
                        A row carries a title and a brief, and a title
                        and a brief are a compression. The reader who
                        has to judge cannot be left with the
                        compression alone, and must not have to leave
                        the place they are reading in order to see
                        past it, because the place is what tells them
                        what they are looking at.
category:               function
actor:                  Reader
qualifier:              from that Row, and without losing the place the Row sits in
verification:           test
success_criteria:       |
                        Every Item the Workbench presents as a row has
                        its complete Record available from that row,
                        and the Record holds each field the Item's
                        type adds beyond the identity and the rights
                        the heading already shows.

