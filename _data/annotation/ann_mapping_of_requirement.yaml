title:                  Broad match of requirement to CCO Prescriptive Information Content Entity
brief:                  |
                        A requirement prescribes what a design entity
                        must do or be, so it is prescriptive content.
                        CCO has no class for a requirement as such, so
                        its prescriptive class is broader.

