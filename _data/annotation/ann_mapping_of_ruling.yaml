title:                  Broad match of ruling to CCO Act
brief:                  |
                        A ruling is the act of the maintainer settling
                        a decision, a process in which an agent plays
                        the causative part, which is what CCO means by
                        an act. The CCO class covers every act, so it
                        is broader.

