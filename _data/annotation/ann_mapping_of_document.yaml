title:                  Close match of document to CCO Document Content Entity
brief:                  |
                        Both are content meant for people to read and
                        handled as a unit. The CCO class is defined by
                        paragraphs of text and diagrams meant for
                        pages, while a document here may take other
                        forms, so the match is close rather than
                        exact.

