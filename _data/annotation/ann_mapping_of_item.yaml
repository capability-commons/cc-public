title:                  Close match of item to BFO entity
brief:                  |
                        An item is anything that can be told apart and
                        talked about. A BFO entity is anything that
                        exists, has existed or will exist. The two
                        cover nearly the same things, but an item may
                        be something only planned or imagined, which a
                        realist ontology does not count as an entity,
                        so the match is close rather than exact.

