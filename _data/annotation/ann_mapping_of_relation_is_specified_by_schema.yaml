title:                  Broad match of relation_is_specified_by_schema to CCO prescribed by
brief:                  |
                        A schema serves as a rule for the shape of a
                        register, which is what CCO means by
                        prescribed by. The CCO relation holds between
                        anything and any prescriptive information that
                        guides it, so it is broader.

