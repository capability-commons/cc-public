title:                  Close match of relation_is_about to CCO is about
brief:                  |
                        Both relate something that carries information
                        to what that information is about. Ours
                        relates an item that makes an assertion, such
                        as an annotation or a decision, which need not
                        be an information content entity in the sense
                        of CCO, so the match is close rather than
                        exact.

