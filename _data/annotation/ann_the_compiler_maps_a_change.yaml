title:                  The compiler maps how far a change reaches
brief:                  |
                        When a shared structure changes, a Rust
                        compiler lists every place that must change
                        before anything runs. In Python the reach of a
                        change is found only by tests and reading,
                        since no type checker runs in the gate.

