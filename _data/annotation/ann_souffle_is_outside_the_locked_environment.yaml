title:                  Souffle sits outside the locked environment
brief:                  |
                        pixi cannot install Souffle, yet checking,
                        editing, querying, the commit check and the
                        gate all need it, so a lost or broken binary
                        stops all work until it is copied back by
                        hand.
description:            |
                        Souffle is not on conda-forge, and the PyPI
                        name souffle belongs to an unrelated package.
                        The binary, version 2.4, is kept in a
                        gitignored _tools folder with a libffi copied
                        from Ubuntu 20.04, whose standard support
                        ended in May 2025. The gate refuses to run
                        without it, the tests that need it are
                        skipped, and the SOUFFLE variable is read in
                        three places. Souffle 2.5 is in Homebrew.

