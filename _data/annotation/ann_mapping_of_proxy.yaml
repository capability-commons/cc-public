title:                  Close match of proxy to CCO Designative Information Content Entity
brief:                  |
                        A proxy is content whose job is to designate
                        something outside the graph, which is what a
                        designative information content entity does. A
                        proxy also carries descriptive fields, such as
                        a brief, which designation alone does not
                        need, so the match is close rather than exact.

