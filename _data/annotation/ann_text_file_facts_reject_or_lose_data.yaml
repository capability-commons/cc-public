title:                  Text-file fact boundary rejects or loses data
brief:                  |
                        A fact holding a tab or a newline raises an
                        exception that the check does not catch, and
                        an output file missing after Souffle succeeds
                        is read as no failures.
description:            |
                        See datalog.py, where facts are written as
                        tab-separated files and missing outputs are
                        read as empty, and checking.py, which catches
                        no exception around the check.

