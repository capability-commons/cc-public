title:                  Related match of relation_realizes to BFO realizes
brief:                  |
                        The two share a word but not a sense. Ours is
                        the realization of Arcadia, in which an
                        implementation realizes a design entity at a
                        more abstract level. The BFO relation holds
                        between a process and a realizable entity,
                        such as a role or a disposition, that the
                        process brings about. The match is only
                        related.

