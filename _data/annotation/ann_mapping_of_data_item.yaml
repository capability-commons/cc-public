title:                  Close match of data item to CCO Information Content Entity
brief:                  |
                        Both are content that many copies can carry,
                        and both are about something. A data item also
                        covers the form it is held in, such as a file
                        or a drawing, while CCO keeps the carrier
                        apart as an information bearing entity, so the
                        match is close rather than exact.

