title:                  Related match of role to BFO role
brief:                  |
                        The two share a word and little else. A role
                        here is what an item is cast as at one end of
                        a relation. A BFO role is a realizable entity
                        that inheres in a bearer because of its
                        circumstances, such as being a student.
                        Neither is broader than the other, so the
                        match is only related: a false friend.

