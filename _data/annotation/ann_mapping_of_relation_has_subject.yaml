title:                  Broad match of relation_has_subject to CCO prescribes
brief:                  |
                        A requirement serves as a rule for its
                        subject, which is what CCO means by
                        prescribes. The CCO relation holds for any
                        prescriptive information and anything it
                        guides, so it is broader.

