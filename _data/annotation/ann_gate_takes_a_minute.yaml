title:                  Gate takes about a minute
brief:                  |
                        On 2026-10-14 the gate took about a minute on
                        the development VM, over 47 source files and
                        about 170 tests.
description:            |
                        This is a condition, not a principle. It holds
                        for the tree as it was on that date, and a
                        later measurement that finds the gate much
                        slower challenges it.

