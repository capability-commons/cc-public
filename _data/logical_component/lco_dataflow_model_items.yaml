title:                  Dataflow items
brief:                  |
                        The part of the dataflow model that defines
                        the items an author writes: dataflow graphs,
                        dataflow variants, delta modules, sweeps, the
                        register of dataflow tags, and the records of
                        runs and deployments.
description:            |
                        To be realized by a package
                        cctool.dataflow.items. It owns the schemas of
                        those items, with a merge key on every list,
                        so that every other part reads one shape. It
                        answers the question: what did the author
                        write?

