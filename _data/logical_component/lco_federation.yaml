title:                  Federation
brief:                  |
                        How segments relate: the segment type, the
                        consumes edge, what crosses between segments,
                        checks across segments, and the commands a
                        peer uses to take up and upgrade a release.
description:            |
                        Security and privacy drive federation as
                        enabling concerns. Some segments hold
                        information that must meet security or privacy
                        requirements, such as personal data of members
                        under the GDPR. Federation is not itself held
                        to those requirements in every case, but it
                        must let a segment meet them.

