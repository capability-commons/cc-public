title:                  Lowering
brief:                  |
                        The part of the dataflow model that turns a
                        resolved dataflow graph into the lowered graph
                        the engine receives, by generated variant
                        operations.
description:            |
                        To be realized by a package
                        cctool.dataflow.lower. It inserts transport
                        nodes where an edge crosses execution units,
                        delivery adapters for delivery policies,
                        control blocks for each execution unit and
                        host, and recording taps, and sets each
                        capacity from the maximum rates of the
                        producers. Its operations are applied by the
                        same interpreter as authored ones, as ruled on
                        2026-10-29. It answers the question: what must
                        be added so that the graph can run there?

