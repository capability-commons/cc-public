title:                  Step executor
brief:                  |
                        The part of the dataflow engine that runs the
                        Kahn nodes of one execution unit, once each in
                        dependency order at each local step, and
                        applies the fail-safe of a port that
                        overflows.
description:            |
                        It never looks past its own execution unit: a
                        value bound for another one leaves through a
                        transport node. It answers the question: who
                        runs the Kahn nodes, and when?

