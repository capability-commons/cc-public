title:                  Generator
brief:                  |
                        The part of the dataflow engine, written in
                        python, that turns a lowered graph into C++17:
                        the static schedule of each execution unit,
                        the declarations of buffers and state, the
                        structs and upgrade functions of the data
                        dictionary, the C entry points and a fuzz
                        harness for each node type.
description:            |
                        Shipped with the engine, as ruled on
                        2026-10-23, although it runs before the engine
                        does. It answers the question: what C++ does
                        the graph become?

