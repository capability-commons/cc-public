title:                  Platform layer
brief:                  |
                        The part of the dataflow engine that hides
                        what differs from one host to the next:
                        threads, the pinning of execution units to
                        cores, clocks, shared memory, and readings
                        such as processor temperature.
description:            |
                        An execution unit may be an OS process, a
                        thread or a core with no operating system, as
                        ruled on 2026-10-26. Only the engine core and
                        the control blocks call it. It answers the
                        question: what differs from one host to the
                        next?

