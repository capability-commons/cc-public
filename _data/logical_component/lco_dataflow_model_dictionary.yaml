title:                  Data dictionary
brief:                  |
                        The part of the dataflow model that holds the
                        versioned types of ports and node state, and
                        the mapping from each version to the next.
description:            |
                        To be realized by a package
                        cctool.dataflow.dictionary. The generator
                        makes the C++ structs and the state upgrade
                        functions from it, and the checks compare port
                        types through it, as ruled on 2026-10-24. It
                        answers the question: what does each value
                        look like?

