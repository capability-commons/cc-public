title:                  Transport nodes
brief:                  |
                        The sender and receiver nodes that carry
                        values between execution units and between
                        hosts, over a shared-memory queue, ZeroMQ or
                        TCP.
description:            |
                        They are the only nodes that depend on a
                        transport library. They answer the question:
                        what carries a value between execution units?

