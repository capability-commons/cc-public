title:                  Standard nodes
brief:                  |
                        The nodes that ship with the dataflow engine.
                        Each is an ordinary node, kept out of the
                        engine core because the engine does nothing a
                        node could do, and most are inserted by
                        lowering.
description:            |
                        Broken down into control blocks, transport
                        nodes, delivery adapters, and recording and
                        replay nodes, each with an interface control
                        document of its own (WTP, 2026-10-29).

