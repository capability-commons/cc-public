title:                  Control blocks
brief:                  |
                        The nodes that alone may read time and runtime
                        services, one for each execution unit and one
                        for each host, which write the control message
                        every other node receives, and pass on the
                        events the engine reports.
description:            |
                        The mode controller that raises degraded mode
                        is one of them. The engine reports its own
                        events to them as runtime service readings,
                        and they pass them to recording nodes, so that
                        the engine records nothing itself (WTP,
                        2026-10-29). They answer the question: who may
                        look at the outside world?

