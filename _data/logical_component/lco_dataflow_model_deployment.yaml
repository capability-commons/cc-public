title:                  Deployment
brief:                  |
                        The part of the dataflow model that sends a
                        built engine and a lowered graph to a host,
                        computes and sends the change set between two
                        resolved graphs, and writes the records of
                        deployments and runs.
description:            |
                        To be realized by a package
                        cctool.dataflow.deploy. It is one end of the
                        interface whose other end is runtime control.
                        It answers the question: how does the graph
                        get onto a host, and how is it changed later?

