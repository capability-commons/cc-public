title:                  Dataflow engine
brief:                  |
                        The C++ engine that runs dataflow graphs, and
                        the generator that turns a resolved dataflow
                        graph into what the engine runs.
description:            |
                        Safety and security drive the engine as
                        enabling concerns. The engine will sometimes
                        run systems that must meet safety or security
                        requirements. It has none of its own to meet,
                        but it must let the systems it runs meet
                        theirs, to a reasonable degree.

