title:                  Variant resolver
brief:                  |
                        The part of the dataflow model that applies
                        the variant operations of a dataflow variant
                        to its base and gives the resolved dataflow
                        graph, with its digests and its origin trace.
description:            |
                        To be realized by a package
                        cctool.dataflow.resolve. Only cctool
                        interprets variant operations, as ruled on
                        2026-10-26. The resolver knows nothing of
                        transports or of the engine; that knowledge is
                        kept in lowering. It answers the question:
                        which graph does this variant mean?

