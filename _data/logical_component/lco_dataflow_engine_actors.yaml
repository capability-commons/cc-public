title:                  Actor gaps
brief:                  |
                        The part of the dataflow engine that runs
                        actors in the gap between two local steps,
                        admitting only the messages waiting when the
                        gap opens, in a fixed order.
description:            |
                        On replay it admits each outside message at
                        the gap the recording names. It answers the
                        question: who runs the actors, and when?

