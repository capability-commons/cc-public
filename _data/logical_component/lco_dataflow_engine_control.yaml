title:                  Runtime control
brief:                  |
                        The part of the dataflow engine that answers
                        deployment on a host: it loads a lowered
                        graph, starts and stops execution units,
                        receives a change set, and reports the state
                        of the engine.
description:            |
                        It is the other end of the interface that
                        deployment uses. It answers the question: how
                        does cctool talk to a running engine?

