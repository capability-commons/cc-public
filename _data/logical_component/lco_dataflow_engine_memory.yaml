title:                  Engine memory
brief:                  |
                        The part of the dataflow engine that allocates
                        every buffer of every edge, and the state of
                        every node, from their declarations before the
                        first local step, and copies each value into
                        each queue it enters.
description:            |
                        Nothing is allocated while the system runs,
                        except when a change set adds an edge or a
                        node. It answers the question: where do values
                        live?

