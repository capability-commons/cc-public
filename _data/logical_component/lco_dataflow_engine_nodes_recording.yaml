title:                  Recording and replay nodes
brief:                  |
                        The nodes that record what a run receives from
                        outside and what the control blocks pass on,
                        and the players that feed a recorded run back
                        in.
description:            |
                        The recording is made by nodes rather than by
                        the engine (WTP, 2026-10-29). They answer the
                        question: what writes things down, and plays
                        them back?

