title:                  Dataflow checks
brief:                  |
                        The part of the dataflow model that checks
                        every complete dataflow variant, on its
                        resolved graph and again on its lowered graph,
                        and checks a change set against the graph it
                        changes.
description:            |
                        To be realized by rules and python under
                        cctool.check, as the other checks are, and
                        reported by cctool check. It answers the
                        question: is the graph right?

