title:                  Dynamic subgraph
brief:                  |
                        The part of the dataflow engine that applies a
                        change set at the start of a local step, joins
                        the dynamic subgraph to the static schedule
                        through fixed slots, and swaps a node version
                        with its state upgraded.
description:            |
                        A build with no dynamic nodes leaves this part
                        out. It answers the question: how does the
                        graph change while it runs?

