title:                  Team member register schema
brief:                  |
                        The team member register specifically: a
                        register whose entries are additionally team
                        members.
description:            |
                        This schema composes the general register
                        schema with the team member register entry
                        schema. Each entry in the table is a register
                        entry and a team member together, closed to
                        any field that neither shape declares.

