title:                  Team member register entry schema
brief:                  |
                        What a team member register entry carries
                        beyond the general register entry.
description:            |
                        A team member entry carries nothing beyond the
                        general register entry. Its title is the name
                        the member chooses to be known by in this
                        register, which may be a pseudonym, and its
                        guid is what a Contributor trailer names.
usage:                  |
                        Composed with sch_register_entry by
                        sch_reg_team_member as the shape of every
                        entry in the team member register.
