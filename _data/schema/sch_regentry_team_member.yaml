protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Team member register entry schema
brief:                  |
                        What a team member register entry carries
                        beyond the general register entry.
description:            |
                        A team member entry carries, beyond the
                        general register entry, the identity the
                        member authors commits under. Its id and title
                        are taken from the full name of the member, as
                        the ruling on how team members are named asks,
                        and its guid is what a Contributor trailer
                        names.
usage:                  |
                        Composed with sch_register_entry by
                        sch_reg_team_member as the shape of every
                        entry in the team member register.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register_entry.yaml

properties:

  git_author:
    type:               string
    pattern:            '^[^<>]+ <[^<>]+>$'
    description:        |
                        Optional. The name and email that git records
                        as the author of a commit this member is
                        responsible for, as in Name <email>. A commit
                        whose author is no member's git_author is
                        refused by the commit-msg hook and reported by
                        cctool history check. A member who authors no
                        commits has none.

  git_signing_key:
    type:               string
    pattern:            '^[0-9A-F]{16}([0-9A-F]{24})?$'
    description:        |
                        Optional. The OpenPGP key, as its long key id
                        or its fingerprint in capitals, with which
                        this member signs the commits they author.
                        Once any member gives one, cctool history
                        check reports a commit that is not signed,
                        whose signature git cannot verify, or that is
                        signed with a key no member gives, so a push
                        of such a commit is refused.

edge:                   []
