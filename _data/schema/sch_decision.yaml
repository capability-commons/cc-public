title:                  Decision schema
brief:                  |
                        The shape of a decision, the question for
                        which a set of alternative options is offered.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. A decision carries nothing
                        beyond them, and requires a brief.

                        title names the decision and brief asks the
                        question. What the decision is about is an
                        edge, and so is each option for it.
usage:                  |
                        Named by t_decision as the schema of every
                        decision, each in a folder of its own under
                        _data/decision/.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
