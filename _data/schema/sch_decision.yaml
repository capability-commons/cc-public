title:                  Decision schema
brief:                  |
                        The shape of a decision: one choice about
                        something in the graph.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. A decision carries nothing
                        beyond them, and requires a brief.

                        title names the decision and brief states it.
                        The brief is required, because a decision that
                        is not stated cannot be argued over.

                        What a decision is about, and which decision
                        it replaces, are edges rather than fields. The
                        rationale is not a field either: it is the set
                        of annotations that support or challenge the
                        decision.
usage:                  |
                        Named by t_decision as the schema of every
                        item in _data/decision/.
note:                   |
                        Whether a decision has been taken is not a
                        field. It is recorded by a determination, an
                        item of its own that upholds or rejects the
                        decision. A decision that no determination
                        names is open.

                        A decision that has been replaced is named by
                        the r_supersedes edge from its successor.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
