$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_trait_rights.yaml
id_self:                sch_trait_rights
guid_self:              sch_f6ab4a480aa64f57b2d7378f023b0d5e
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Rights trait
brief:                  |
                        Trait with the handling and ownership fields.
description:            |
                        This trait holds the fields that govern what
                        may be done with an item and by whom: a
                        protective marking, a copyright statement and
                        a license.

                        The copyright and license fields are required.
                        Together they state who owns the item and on
                        what terms it may be used.

                        The protective_mark field is also required. It
                        names one or more entries in the protective
                        mark register. When several marks are named,
                        they are conjunctive: every constraint implied
                        by every mark applies, and the most
                        restrictive one governs.
usage:                  |
                        Types whose items travel on their own compose
                        this trait via allOf.
note:                   |
                        A license is named rather than quoted.

                        A mark is referenced, not spelled out. The
                        authority whose rules govern it and the level
                        it names are held once, in the register.

                        An item that may be disclosed to anyone says
                        so, by naming mark_public.
type:                   object

required:
  - copyright
  - license
  - protective_mark

properties:

  protective_mark:
    type:               array
    minItems:           1
    description:        |
                        How this item may be handled and with whom it
                        may be shared, given as one or more references
                        to entries in the protective mark register.

                        When more than one mark is present, the marks
                        are conjunctive. All of them apply at once,
                        and the most restrictive governs. A violation
                        of any one mark is a violation under that
                        mark's authority. Nothing here may be read as
                        a choice between marks.

                        A reference that does not resolve names a mark
                        held in a register this repository cannot see.
                        It is still binding, and must be treated as
                        more restrictive than any resolvable mark,
                        never as absent.

    items:
      type:             object
      additionalProperties:  false

      required:
        - id_mark
        - guid_mark

      properties:

        id_mark:
          $ref:         https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
          description:  |
                        Readable id of the mark. Advisory, as every
                        readable id in a reference is.

        guid_mark:
          $ref:         https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid
          description:  |
                        Guid of the mark. The resolvable reference.

  copyright:
    type:               string
    minLength:          1
    pattern:            ^(Copyright( \((c|C)\)| ©)?|\((c|C)\)|©) [0-9]{4}([-–][0-9]{4})?(, ?[0-9]{4}([-–][0-9]{4})?)*
    description:        |
                        Who owns this item, as a complete copyright
                        notice rather than a bare name: the word
                        Copyright, the year of first publication, and
                        the owner.

                        The notice is written in full so that it can
                        be copied verbatim into a NOTICE file or a
                        source header. A field holding only a name
                        would have to be assembled into a notice by
                        whoever needed one, and assembled the same way
                        every time.

                        The pattern accepts the conventional markers
                        -- Copyright, optionally followed by (c), (C)
                        or the copyright sign, and those three used
                        alone -- then one or more four-digit years,
                        and then a non-empty owner. Years may be a
                        single year, a range, or a list of either.

                        The pattern checks only the shape of a notice,
                        not its truth. That a year is four digits is
                        checkable; that it is the right year is not.

                        Marker case is strict: Copyright is accepted
                        and copyright is not. One canonical spelling
                        is preferred here over tolerance, because this
                        field is written by tooling at least as often
                        as by hand.

  license:
    type:               string
    minLength:          1
    pattern:            ^[A-Za-z0-9.+-]+( (AND|OR|WITH) [A-Za-z0-9.+-]+)*$
    description:        |
                        Under what terms this item may be used, as an
                        SPDX license expression.

                        A bare identifier from the SPDX license list
                        is the usual case, such as Apache-2.0 or MIT.
                        The expression grammar also allows a choice
                        (MIT OR Apache-2.0) and an exception
                        (Apache-2.0 WITH LLVM-exception).

                        A license not on the SPDX list is named with a
                        LicenseRef- prefix, so that terms particular
                        to one contributor can be stated without
                        admitting free prose into this field.

                        NOASSERTION means the terms are not known.
                        That is worth being able to say plainly rather
                        than by omission.

                        The pattern checks only the shape of an
                        expression, not the validity of what it names.
                        SPDX is maintained elsewhere and remains the
                        authority on that.
