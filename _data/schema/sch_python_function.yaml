title:                  Python function schema
brief:                  |
                        The shape of a python function data item: the
                        metadata of one python function or method,
                        held in its docstring.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. A python function item
                        adds nothing beyond them.

                        What the item names and where it lives are not
                        fields. The id names the function, and the
                        item lives in the function it names. Its
                        parameters are not fields either: the code
                        holds them.
usage:                  |
                        Named by t_python_function as the schema of
                        the item in the docstring of a python
                        function.
note:                   |
                        The item is a YAML document in the docstring,
                        opened by --- and closed by three full stops,
                        and indented as the docstring is.
type:                   object

