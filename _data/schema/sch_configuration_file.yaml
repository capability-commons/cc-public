title:                  Configuration file schema
brief:                  |
                        The shape of a configuration file data item:
                        the metadata of one configuration file, held
                        in a comment at its head.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. A configuration file item
                        adds nothing beyond them, and requires a
                        description.
usage:                  |
                        Named by type_configuration_file as the schema
                        of the item at the head of a file such as
                        .gitignore.
note:                   |
                        The item is a YAML document in the comment
                        block that opens the file, after the line that
                        names its interpreter if it has one. Each line
                        begins with a hash and a space, the first line
                        of the document is --- and the last is three
                        full stops.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    required:
      - description

unevaluatedProperties:  false
