title:                  Criticality register schema
brief:                  |
                        The criticality register specifically: a
                        register whose entries are additionally
                        criticalities.
description:            |
                        This schema composes the general register
                        schema with the criticality register entry
                        schema. Each of its entries is a register
                        entry and a criticality together, closed to
                        any field that neither shape declares.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register.yaml

  - type:               object

    properties:

      entries:

        additionalProperties:

          allOf:
            - $ref:     https://capability-commons.org/schema/sch_regentry_criticality.yaml

          unevaluatedProperties:  false

