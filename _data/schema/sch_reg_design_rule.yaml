title:                  Design rule register schema
brief:                  |
                        The design rule register specifically: a
                        register whose entries are additionally design
                        rules.
description:            |
                        This schema composes the general register
                        schema with the design rule entry schema. Each
                        of its entries is a register entry and a
                        design rule together, closed to any field that
                        neither shape declares.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register.yaml

  - type:               object

    properties:

      entries:

        additionalProperties:

          allOf:
            - $ref:     https://capability-commons.org/schema/sch_regentry_design_rule.yaml

          unevaluatedProperties:  false

