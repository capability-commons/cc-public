title:                  Logic program file schema
brief:                  |
                        The shape of a logic program file data item:
                        the metadata of one logic program file, held
                        in a comment at the head of the file.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_edge. A logic program file item adds
                        nothing beyond them, and requires a
                        description.

                        What the item names and where it lives are not
                        fields. The id names the file, and the item
                        lives in the file it names.
usage:                  |
                        Named by type_logic_program_file as the schema
                        of the item at the head of every logic program
                        file.
note:                   |
                        The item is a YAML document in the comment, in
                        which each line begins with %. The document is
                        opened by --- and closed by three full stops.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_edge.yaml

  - type:               object

    required:
      - description

unevaluatedProperties:  false
