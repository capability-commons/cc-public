title:                  Concept register schema
brief:                  |
                        The concept register specifically: a register
                        whose entries are additionally concepts.
description:            |
                        This schema composes the general register
                        schema with the concept register entry schema.
                        Each entry in the table is a register entry
                        and a concept together, closed to any field
                        that neither shape declares.

                        The term fields of each entry follow ISO
                        1087:2019, Terminology work and terminology
                        science -- Vocabulary. sch_regentry_concept
                        states what each field means.

