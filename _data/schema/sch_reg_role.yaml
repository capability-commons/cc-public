title:                  Role register schema
brief:                  |
                        The role register specifically: a register
                        whose entries are additionally roles.
description:            |
                        This schema composes the general register
                        schema with the role register entry schema.
                        Each entry in the table is a register entry
                        and a role together, closed to any field that
                        neither shape declares.

