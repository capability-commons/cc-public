$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_interface_control_document.yaml
id_self:                sch_interface_control_document
guid_self:              sch_fec3632e3c3942bd903984cc03ddae25
copyright:              Copyright 2026 William Payne
