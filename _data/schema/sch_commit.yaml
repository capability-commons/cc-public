title:                  Commit schema
brief:                  |
                        The shape of a commit item, which records one
                        change to the tree and why it was made.
description:            |
                        Identity and the descriptive fields come from
                        sch_trait_identity and sch_trait_descriptive.
                        The edges come from sch_trait_relation. A
                        commit carries nothing beyond them. The title
                        is the subject line of the commit message,
                        built from one of a closed list of templates.
                        The brief says what changes and why.
usage:                  |
                        Named by t_commit as the schema of the item
                        held in each commit message.
note:                   |
                        A commit carries no rights fields. Its message
                        is not a file of the tree, and what it records
                        takes its rights from the files it changes.
                        Nor does a commit record a verdict of its own,
                        such as whether the checks passed or how many
                        failed. The gate refuses a commit that fails,
                        so every commit that exists has passed, and a
                        field that said so would only ever hold one
                        value.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_trait_identity.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_descriptive.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    properties:

      title:
        pattern:        '^((Add|Remove|Reformat) [^ ].*|(Rename|Move) [^ ].* to [^ ].*|(Split|Fold) [^ ].* into [^ ].*|(Change|Fix) [^ ].* so that [^ ].*|Lock [^ ].* at [^ ].*|Merge branch [^ ].* into [^ ].*)[^.]$|^Revert "[^"]+"$'
        description:    |
                        The subject line of the commit message: one
                        imperative sentence built from one of these
                        templates, with no full stop.

                        Add OBJECT. Remove OBJECT. Reformat OBJECT.
                        Rename OLD to NEW. Move OBJECT to PLACE. Split
                        OBJECT into PARTS. Fold OBJECT into OTHER.
                        Change OBJECT so that STATEMENT. Fix OBJECT so
                        that STATEMENT. Lock DEPENDENCY at VERSION.

                        Two templates are for the commits that git
                        makes from others. Merge branch BRANCH into
                        BRANCH joins two lines of history. Revert
                        "TITLE" undoes the commit whose title is
                        quoted. Fold, not Merge, joins one item into
                        another, so that Merge keeps the meaning git
                        gives it.

                        An object is an item id, the preferred term of
                        a concept, or a path. This title is the one
                        exception to the rule that a title is a noun
                        phrase: a commit is an act, and the verb says
                        which act. The verbs are a closed list so that
                        most of them can later be checked against the
                        graph before and after the commit.

unevaluatedProperties:  false
relation:               []
