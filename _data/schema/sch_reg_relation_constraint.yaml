title:                  Relation constraint register schema
brief:                  |
                        The relation constraint register specifically:
                        a register whose entries are additionally
                        relation constraints.
description:            |
                        This schema composes the general register
                        schema with the relation constraint register
                        entry schema. Each of its entries is a
                        register entry and a relation constraint
                        together, closed to any field that neither
                        shape declares.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register.yaml

  - type:               object

    properties:

      entries:

        additionalProperties:

          allOf:
            - $ref:     https://capability-commons.org/schema/sch_regentry_relation_constraint.yaml

          unevaluatedProperties:  false

