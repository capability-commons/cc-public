title:                  Issue schema
brief:                  |
                        The shape of an issue, the question that a set
                        of alternative decisions answer.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. An issue carries nothing
                        beyond them, and requires a brief.

                        title names the issue and brief asks the
                        question. What the issue is about is an edge,
                        and so is each decision that answers it.
usage:                  |
                        Named by t_issue as the schema of every issue,
                        each in a folder of its own under
                        _data/issue/.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
relation:               []
