title:                  Python module schema
brief:                  |
                        The shape of a python module data item: the
                        metadata of one python module, held in its
                        module docstring.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_edge. A python module item adds
                        nothing beyond them, and requires a
                        description.

                        What the item names and where it lives are not
                        fields. The id names the module, and the item
                        lives in the module it names.
usage:                  |
                        Named by type_python_module as the schema of
                        the item in the docstring of every python
                        module.
note:                   |
                        The item is a YAML document in the module
                        docstring, opened by --- and closed by three
                        full stops.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_edge.yaml

  - type:               object

    required:
      - description

