title:                  Segment schema
brief:                  |
                        The shape of a segment item, by which a
                        federated repository declares itself and names
                        the releases it consumes.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_edge, among them a relation_consumes
                        edge to the release item of each segment
                        consumed. A segment item carries nothing
                        beyond them, and requires a brief.
usage:                  |
                        Named by type_segment as the schema of every
                        item in _data/segment/.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_edge.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
edge:                   []
