title:                  Determination schema
brief:                  |
                        The shape of a determination, the record that
                        one or more options have been upheld or
                        rejected.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. A determination carries
                        nothing beyond them, and requires a brief.

                        title names the determination and brief states
                        what was determined. Which options are upheld
                        and which are rejected are edges, not fields,
                        so that one determination can settle a set of
                        alternatives at once.
usage:                  |
                        Named by t_determination as the schema of
                        every determination, each in the folder of its
                        issue under _data/issue/.
note:                   |
                        Who made a determination, and when, is
                        recorded by the commits that add and change
                        it, not by a field.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
relation:               []
