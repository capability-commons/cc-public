title:                  Relation constraint register entry schema
brief:                  |
                        What a relation constraint register entry
                        carries beyond the general register entry.
description:            |
                        A relation constraint is an OR of literals,
                        and each literal is an edge: relation_admits
                        to a role an item may play, or
                        relation_excludes to a role it may not. An
                        entry has at least one literal and no other
                        edge. Its brief reads after "the source" or
                        "the target", as in "is arguable".
usage:                  |
                        Composed with sch_register_entry by
                        sch_reg_relation_constraint as the shape of
                        every entry in the relation constraint
                        register.
type:                   object

required:
  - edge

properties:

  edge:
    minItems:           1

    items:

      properties:

        id_relation:

          enum:
            - relation_admits
            - relation_excludes

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register_entry.yaml

edge:                   []
