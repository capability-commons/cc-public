title:                  Logical component schema
brief:                  |
                        The shape of a logical component, one part of
                        cc-public described apart from any technology.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_edge. A logical component carries
                        nothing beyond them, and requires a brief.

                        title names the logical component and brief
                        says what it does. The brief is required,
                        because a part whose job is not stated cannot
                        be told apart from the parts that realize it.
usage:                  |
                        Named by type_logical_component as the schema
                        of every item in _data/logical_component/.
note:                   |
                        What realizes a logical component is an edge
                        from the realizing item, not a field of the
                        logical component, so that a new realization
                        needs no change to it.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_edge.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
edge:                   []
