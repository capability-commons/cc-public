title:                  Python class schema
brief:                  |
                        The shape of a python class data item: the
                        metadata of one python class, held in its
                        docstring.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_edge. A python class item adds
                        nothing beyond them.

                        What the item names and where it lives are not
                        fields. The id names the class, and the item
                        lives in the class it names.
usage:                  |
                        Named by type_python_class as the schema of
                        the item in the docstring of a python class.
note:                   |
                        The item is a YAML document in the docstring,
                        opened by --- and closed by three full stops,
                        and indented as the docstring is.
type:                   object

