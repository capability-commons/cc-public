protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Protective mark register schema
brief:                  |
                        The protective mark register specifically: a
                        register whose entries are additionally
                        protective marks.
description:            |
                        This schema composes the general register
                        schema with the protective mark register entry
                        schema. Each entry in the table is a register
                        entry and a protective mark together, closed
                        to any field that neither shape declares.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register.yaml

  - type:               object

    properties:

      table:

        additionalProperties:

          allOf:
            - $ref:     https://capability-commons.org/schema/sch_register_entry.yaml
            - $ref:     https://capability-commons.org/schema/sch_regentry_protective_mark.yaml

          unevaluatedProperties:  false
