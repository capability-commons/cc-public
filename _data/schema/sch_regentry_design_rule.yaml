title:                  Design rule register entry schema
brief:                  |
                        What a design rule register entry carries
                        beyond the general register entry.
description:            |
                        The rule itself is the brief, and the reason
                        for the rule is the description. Both of those
                        are fields of the general register entry
                        shape. An entry may also give a sentence that
                        follows the rule and the same sentence written
                        so that it breaks it.
usage:                  |
                        Composed with sch_register_entry by
                        sch_reg_design_rule as the shape of every
                        entry in the design rule register.
note:                   |
                        Examples are prose, or there are none. An
                        example that is a data item in the repository
                        would have to be kept in the repository, and
                        an item kept only to break a rule is a
                        nonconformity kept on purpose.
type:                   object

properties:

  follows:
    type:               string
    minLength:          1
    description:        |
                        Optional. A sentence that follows the rule.

  breaks:
    type:               string
    minLength:          1
    description:        |
                        Optional. The same sentence written so that it
                        breaks the rule.

dependentRequired:

  follows:
    - breaks

  breaks:
    - follows

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register_entry.yaml

edge:                   []
