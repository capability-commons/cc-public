$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_trait_edge.yaml
id_self:                sch_trait_edge
guid_self:              sch_74e6e0e2abdc4d839c2f297618e73541
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Edge trait
brief:                  |
                        Trait with the outgoing traceability edges.
description:            |
                        The uniform way an item records its outgoing
                        edges, each labeled by a relation. It is not
                        the only way: a pair of reference fields, such
                        as id_concept and guid_concept, is an edge
                        too, labeled by the field. An edge in this
                        list always consists of exactly four fields:
                        the relation named twice, and the target named
                        twice.

                        Each end is named by readable id and by guid.
                        The id resolves, as it does in prose. The guid
                        tells items apart when one id names two, and
                        finds the item when the id names nothing, as
                        after a rename. See HOW A NAME RESOLVES in
                        sch_trait_identity.yaml.
usage:                  |
                        Composed via allOf by any item that carries
                        outgoing edges.

                        The relation register is an open vocabulary. A
                        new relation is an entry there.
note:                   |
                        Neither field that names an end of an edge is
                        a _self field, because an edge declares
                        nothing. It only refers, twice, and each
                        reference has a field of its own (relation or
                        target). The relation is the type of the edge.
                        See sch_trait_identity.yaml for the
                        convention.

                        This is a trait of its own. It is composed
                        alongside sch_trait_identity.yaml by any item
                        type that carries outgoing edges.
type:                   object

required:
  - edge

properties:

  edge:
    type:               array
    description:        |
                        Outgoing traceability edges to other
                        addressable items, each listed once, since a
                        second copy of an edge adds nothing and a
                        count of edges would read it once. Required
                        wherever this trait is composed; use an empty
                        array where there are no outgoing edges (edge:
                        []).

    items:
      $ref:             '#/$defs/edge'

    uniqueItems:        true

$defs:

  edge:
    description:        |
                        One traceability edge. Named here rather than
                        written inline so that any schema needing to
                        validate edges can reference a stable anchor
                        instead of pointing into this file's layout.
    type:               object

    required:
      - id_relation
      - guid_relation
      - id_target
      - guid_target

    additionalProperties:  false

    properties:

      id_relation:
        $ref:           https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
        description:    |
                        Readable id of the relation that labels this
                        edge (for example
                        relation_is_specified_by_schema).

                        An edge runs in one direction. An author
                        records whichever direction reads naturally,
                        and tooling infers the inverse from the
                        relation register.

      guid_relation:
        $ref:           https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid
        description:    |
                        Guid of the relation that labels this edge.

                        A relation is an item like any other. It is
                        held in the relation register with an identity
                        of its own, so an edge names it the same way
                        it names its target: by id, with a guid that
                        settles an ambiguous or overloaded id.

      id_target:
        $ref:           https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
        description:    |
                        Readable id of the item at the far end of this
                        edge.

                        This is the field that resolves. It keeps
                        edges legible in diffs, and a grep for an
                        item's id finds its structured references as
                        well as its prose mentions. An id that names
                        two items is a nonconformity. An id that names
                        nothing is resolved by the guid and reported
                        as outdated. Copies held in a partner's
                        repository cannot be refreshed from here.

      guid_target:
        $ref:           https://capability-commons.org/schema/sch_primitive.yaml#/$defs/guid
        description:    |
                        Guid of the item at the far end of this edge.

                        The guid disambiguates. It finds the target
                        when the id names nothing, and it tells two
                        items apart when one id names both, so that
                        the id can be renamed.

                        It can target anything that composes
                        sch_trait_identity.yaml, whether that thing
                        travels on its own or is embedded in another
                        item. Both are addressed the same way.

edge:                   []
