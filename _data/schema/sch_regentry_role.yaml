title:                  Role register entry schema
brief:                  |
                        What a role register entry carries beyond the
                        general register entry.
description:            |
                        A role entry carries nothing beyond the
                        general register entry. Its brief says what an
                        item that plays the role is, and reads after
                        "the source" or "the target", as in "is
                        arguable".
usage:                  |
                        Composed with sch_register_entry by
                        sch_reg_role as the shape of every entry in
                        the role register.
