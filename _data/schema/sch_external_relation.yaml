$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_external_relation.yaml
id_self:                sch_external_relation
guid_self:              sch_9e24f686f8b345769dc9acc3272f0932
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  External relation schema
brief:                  |
                        The shape of an external relation, a proxy for
                        a relation of an ontology held outside the
                        graph.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone; the rights are those
                        of the data item. The edges come from
                        sch_trait_edge. An external relation requires
                        a brief, the IRI of the relation as its one
                        identifier, and the label the relation has in
                        the release it was taken from.

                        The definition of the relation is not copied:
                        it is read at the IRI, under the license of
                        the ontology.
usage:                  |
                        Named by type_external_relation as the schema
                        of every item in _data/external_relation/.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_edge.yaml

  - type:               object

    required:
      - brief
      - identifier
      - label

    properties:

      identifier:
        type:           array
        minItems:       1
        maxItems:       1

        items:
          type:         object
          additionalProperties:  false

          required:
            - scheme
            - value

          properties:

            scheme:

              enum:
                - uri

            value:
              type:     string
              format:   uri

      label:
        type:           string
        minLength:      1

unevaluatedProperties:  false
edge:                   []
