title:                  Concern register schema
brief:                  |
                        The concern register specifically: a register
                        whose entries are additionally concerns.
description:            |
                        This schema composes the general register
                        schema with the concern register entry schema.
                        Each entry in the table is a register entry
                        and a concern together, closed to any field
                        that neither shape declares.

