$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_register_entry.yaml
id_self:                sch_register_entry
guid_self:              sch_91757d88f90a40088de864b3a7ab4787
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Register entry schema
brief:                  |
                        The shape every register entry carries,
                        whatever the register controls.
description:            |
                        An entry holds an identity and the descriptive
                        fields, with a required description, optional
                        aliases and optional edges. An entry is
                        addressable and describable, and it is not a
                        standalone item, so it composes those two
                        traits. It has no
                        rights of its own and is covered by the rights
                        of the register that holds it. Every register
                        entry schema composes this schema, and
                        sch_register composes it as the shape of a
                        value in a register's table.

usage:                  |
                        Composed via allOf by each
                        sch_regentry_* schema, and referenced by
                        sch_register as the shape of every value in
                        table.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_trait_identity.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_descriptive.yaml

required:
  - description

properties:

  relation:
    type:               array
    description:        |
                        Optional. Outgoing traceability edges from
                        this entry.

                        Optional rather than required because an entry
                        that points at nothing has nothing to say
                        here, and requiring an empty array of every
                        such entry buys no safety. Where it is
                        present, each edge is the same shape as an
                        edge anywhere else -- the definition is
                        referenced from sch_trait_relation.yaml rather
                        than restated, so the two cannot drift.

                        Note that this property alone does NOT compose
                        sch_trait_relation.yaml, which would make
                        relation required on every entry in every
                        register.

    items:
      $ref:             https://capability-commons.org/schema/sch_trait_relation.yaml#/$defs/edge

  alias:
    type:               array
    description:        |
                        Optional. Alternate keys that MUST resolve to
                        this entry -- historical spellings this entry
                        has been renamed away from, and legacy strings
                        appearing in imported data.

                        This is how rename safety is had without
                        fusing an allocated number into the
                        identifier: a retired key moves here and
                        stored data keeps resolving. Aliases occupy
                        the same key namespace as live entries.

                        Use an empty array when there are none.

    items:
      $ref:             https://capability-commons.org/schema/sch_primitive.yaml#/$defs/id
