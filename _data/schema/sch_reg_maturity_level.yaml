title:                  Maturity level register schema
brief:                  |
                        The maturity level register specifically: a
                        register whose entries are additionally
                        maturity levels.
description:            |
                        This schema composes the general register
                        schema with the maturity level register entry
                        schema. Each of its entries is a register
                        entry and a maturity level together, closed to
                        any field that neither shape declares.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register.yaml

  - type:               object

    properties:

      entries:

        additionalProperties:

          allOf:
            - $ref:     https://capability-commons.org/schema/sch_regentry_maturity_level.yaml

          unevaluatedProperties:  false

edge:                   []
