title:                  Relation restriction register schema
brief:                  |
                        The relation restriction register
                        specifically: a register whose entries are
                        additionally relation restrictions.
description:            |
                        This schema composes the general register
                        schema with the relation restriction register
                        entry schema. Each entry in the table is a
                        register entry and a relation restriction
                        together, closed to any field that neither
                        shape declares.

