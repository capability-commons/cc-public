$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_regentry_criticality.yaml
id_self:                sch_regentry_criticality
guid_self:              sch_bf7e95b9422b43b288a4c0dad829693e
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Criticality register entry schema
brief:                  |
                        What a criticality register entry carries
                        beyond the general register entry.
description:            |
                        A criticality entry carries its number on the
                        scale, the consequence of failure it stands
                        for, and the levels of external scales it
                        corresponds to. Its title names the
                        consequence in a few words.
usage:                  |
                        Composed with sch_register_entry by
                        sch_reg_criticality as the shape of every
                        entry in the criticality register.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register_entry.yaml

required:
  - level
  - consequence

properties:

  level:
    type:               integer
    minimum:            0
    maximum:            100
    description:        |
                        The number of the level, from 0 to 100, which
                        its id ends with. Levels are spaced, so that a
                        level can be put between two others.

  consequence:
    type:               string
    minLength:          1
    description:        |
                        What failing an obligation at this level could
                        lead to, for safety and for security alike.

  corresponds_to:
    type:               string
    minLength:          1
    description:        |
                        Optional. The levels of external scales that
                        this level corresponds to, by the strength of
                        what they demand rather than by their words.

edge:                   []
