title:                  Annotation schema
brief:                  |
                        The shape of an annotation: one assertion
                        about something in the graph.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_edge. An annotation carries nothing
                        beyond them.

                        title names the assertion, brief states it,
                        and description carries the reasoning or the
                        qualification where one is wanted.

                        What an annotation is about and what it argues
                        with are edges rather than fields. There is no
                        status, severity, category, author, time,
                        confidence or verdict field.
usage:                  |
                        Named by type_annotation as the schema of
                        every annotation, each in the folder of its
                        decision under _data/decision/ if it is about
                        one, and in _data/annotation/ if not.

allOf:
