$schema:                https://json-schema.org/draft/2020-12/schema
$id:                    https://capability-commons.org/schema/sch_regentry_writing_style_rule.yaml
id_self:                sch_regentry_writing_style_rule
guid_self:              sch_4895339a23364c1f87462a80ceb3cf24
copyright:              Copyright 2026 William Payne
license:                Apache-2.0

protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Writing style rule register entry schema
brief:                  |
                        What a writing style rule register entry
                        carries beyond the general register entry.
description:            |
                        A writing style rule entry holds one example
                        sentence that follows the rule and one that
                        breaks it. The rule itself is the brief, and
                        the reason for the rule is the description.
                        Both of those are fields of the general entry
                        shape.
type:                   object

required:
  - follows
  - breaks
  - enforcement

properties:

  follows:
    type:               string
    minLength:          1
    description:        |
                        A sentence that follows the rule.

  breaks:
    type:               string
    minLength:          1
    description:        |
                        The same sentence written so that it breaks
                        the rule.

  replacement:
    type:               object
    minProperties:      1

    propertyNames:
      pattern:          ^[a-z]+$

    additionalProperties:
      type:             string
      pattern:          ^[a-z]+$

    description:        |
                        Optional. Words the rule asks to replace, each
                        mapped to the word to write in its place. A
                        check reports each use in the text of an item,
                        whatever its case, outside double quotes and
                        the breaks example.

  enforcement:
    $ref:               '#/$defs/enforcement'
    description:        |
                        What holds this rule today.

$defs:

  enforcement:
    type:               string

    enum:
      - formatter
      - check
      - judge
      - none

    description:        |
                        The mechanism that holds a rule, as things
                        stand.

                        formatter means a formatter writes the layout,
                        so an author cannot break the rule. check
                        means a mechanical check reports a breach.
                        judge means a measured evaluation of the prose
                        reports one. none means nothing holds the
                        rule, and it is followed by attention alone.

                        A rule is honest about this. Where nothing
                        holds it yet, the value is none, and the
                        register shows where the gaps are.

allOf:
  - $ref:               https://capability-commons.org/schema/sch_register_entry.yaml
