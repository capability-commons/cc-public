title:                  Ruling schema
brief:                  |
                        The shape of a ruling, the record that one or
                        more options have been upheld or rejected.
description:            |
                        Identity, the descriptive fields and rights
                        come from sch_standalone. The edges come from
                        sch_trait_relation. A ruling carries nothing
                        beyond them, and requires a brief.

                        title names the ruling and brief states what
                        was determined. Which options are upheld and
                        which are rejected are edges, not fields, so
                        that one ruling can settle a set of
                        alternatives at once.
usage:                  |
                        Named by t_ruling as the schema of every
                        ruling, each in the folder of its decision
                        under _data/decision/.
note:                   |
                        Who made a ruling, and when, is recorded by
                        the commits that add and change it, not by a
                        field.
type:                   object

allOf:
  - $ref:               https://capability-commons.org/schema/sch_standalone.yaml
  - $ref:               https://capability-commons.org/schema/sch_trait_relation.yaml

  - type:               object

    required:
      - brief

unevaluatedProperties:  false
relation:               []
