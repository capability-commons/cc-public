title:                  Stableflow smoketest
brief:                  |
                        The smallest system that runs: a system
                        controller paces a process controller, which
                        passes each control packet to a printer.
description:            |
                        One host runs one OS process, which holds all
                        three dataflow nodes. The system controller
                        sends a control packet once a second and halts
                        the system after 300 steps. The process
                        controller passes each packet to the printer,
                        which prints it, and reports the load of its
                        OS process back to the system controller over
                        a feedback edge.
note:                   |
                        Ported from the smoketest configuration of
                        Stableflow in Design Factory
                        (pl/stableflow/_meta/smoketest.cfg.yaml). Two
                        changes: the process controller reads its
                        input as ctrl, which the original wires as
                        control, and the feedback edge is new, since
                        the original leaves the feedback of the
                        process controller unread.

host:

  localhost:
    hostname:           localhost

os_process:

  main_process:
    host:               localhost

dataflow_node:

  ctrl_sys:
    id_self:            dfn_stableflow_smoketest.ctrl_sys
    guid_self:          dfn_b8b982793ec74e50882002337e87afe3
    brief:              |
                        Paces the system and halts it after 300 steps.
    os_process:         main_process

    settings:
      frequency_hz:     1
      idx_max:          300

    edge:

      - id_relation:    relation_realizes
        guid_relation:  relation_c1f1f5ffece0495981ab2b6ebb32a92f
        id_target:      icd_system_controller
        guid_target:    icd_c9560f82750f479eaeb8c7e4834a05a1

  ctrl_proc:
    id_self:            dfn_stableflow_smoketest.ctrl_proc
    guid_self:          dfn_1ddea9503ffe480f8f98787c422c5b98
    brief:              |
                        Passes control to the dataflow nodes of the
                        main OS process.
    os_process:         main_process

    edge:

      - id_relation:    relation_realizes
        guid_relation:  relation_c1f1f5ffece0495981ab2b6ebb32a92f
        id_target:      icd_process_controller
        guid_target:    icd_71142c599d1f4fcb990108c0d7b0a26a

  printer:
    id_self:            dfn_stableflow_smoketest.printer
    guid_self:          dfn_7f95d46b29da4130b01f9b86c85de7f3
    brief:              |
