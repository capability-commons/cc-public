title:                  Stableflow smoketest
brief:                  |
                        The smallest system that runs: the control
                        block of an execution unit writes a control
                        message in each local step, and a printer
                        prints it.
description:            |
                        One host runs one OS process, which holds both
                        dataflow nodes. The control block writes a
                        control message once a second, with the time
                        and mode of the local step, and the printer
                        prints each one.
note:                   |
                        First ported from the smoketest configuration
                        of Stableflow in Design Factory
                        (pl/stableflow/_meta/smoketest.cfg.yaml), in
                        which a system controller paced a process
                        controller. The control block of the dataflow
                        engine has replaced both.

host:

  localhost:
    hostname:           localhost

os_process:

  main_process:
    host:               localhost

dataflow_node:

  ctrl_proc:
    id_self:            dfn_stableflow_smoketest.ctrl_proc
    guid_self:          dfn_1ddea9503ffe480f8f98787c422c5b98
    brief:              |
                        Writes the control message of each local step
                        of the main OS process.
    os_process:         main_process

    settings:
      period:           1 s

    edge:

      - id_relation:    relation_realizes
        guid_relation:  relation_c1f1f5ffece0495981ab2b6ebb32a92f
        id_target:      icd_dataflow_control_block
        guid_target:    icd_0e22017794a24666b0136cb4a4ac9ca3

  printer:
    id_self:            dfn_stableflow_smoketest.printer
    guid_self:          dfn_7f95d46b29da4130b01f9b86c85de7f3
    brief:              |
                        Prints each control message.
    os_process:         main_process

    settings:
      output:           stdout
      pretty:           true

    edge:

      - id_relation:    relation_realizes
        guid_relation:  relation_c1f1f5ffece0495981ab2b6ebb32a92f
        id_target:      icd_printer
        guid_target:    icd_f9db07ada7cb48289a4911c824424332

dataflow_edge:

  - source:
      id_dataflow_node:  dfn_stableflow_smoketest.ctrl_proc
      guid_dataflow_node:  dfn_1ddea9503ffe480f8f98787c422c5b98
      id_port:          icm_dataflow_control_block.control
      guid_port:        icm_aef7dae3fed8476fad3d3044648a9236

    target:
      id_dataflow_node:  dfn_stableflow_smoketest.printer
      guid_dataflow_node:  dfn_7f95d46b29da4130b01f9b86c85de7f3
      id_port:          icm_printer.value
      guid_port:        icm_871e40e76c064b6cbb6a8a78bd445ff5

