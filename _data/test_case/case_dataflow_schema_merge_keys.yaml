title:                  Every array of a dataflow graph declares its key
brief:                  |
                        Verifies that every array in a dataflow graph
                        names the key that picks out one element, so
                        that a variant operation can address it.
verification_method:    inspection
preconditions:          The schema of the dataflow graph is in the tree.

inputs:
  - List every array in the schema of the dataflow graph.
  - For each, read the key it declares.

expected_results:       Every array declares a key of one or more of its fields, and an edge is keyed by its two ends.

