title:                  Loop with no first value
brief:                  |
                        Verifies that a loop through Kahn nodes needs
                        a first value; a loop that has none fails the
                        check.
verification_method:    test
preconditions:          Two Kahn nodes feed each other, and neither port on the loop can supply a default.

inputs:
