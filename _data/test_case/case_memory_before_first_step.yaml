title:                  No allocation while running
brief:                  |
                        Verifies that memory for buffers and state is
                        allocated up front, from the declarations.
verification_method:    test
preconditions:          An engine built with a counting allocator, running a static graph.

inputs:
  - Start the engine.
  - Note the allocation count after the first local step.
  - Run 1000 more local steps.

expected_results:       The allocation count does not change after the first local step.

