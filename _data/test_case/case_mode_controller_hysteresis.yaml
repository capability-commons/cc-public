title:                  Alternating overruns do not flip the mode
brief:                  |
                        Verifies that the mode changes only after its
                        condition has held for a set number of local
                        steps.
verification_method:    test
preconditions:          A mode controller with hold set to 5.

inputs:
  - Feed it overruns in every other local step for 20 local steps.
  - Then overruns in 5 local steps in a row.

expected_results:       The mode stays normal for the first 20 and changes to degraded after the fifth overrun in a row.

