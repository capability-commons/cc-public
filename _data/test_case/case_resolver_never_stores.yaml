title:                  Resolver writes nothing to the tree
brief:                  |
                        Verifies that a resolved graph is never
                        written into the tree as a second copy of a
                        variant.
verification_method:    inspection
preconditions:          A tree under version control, with a clean working copy.

inputs:
  - Resolve every complete dataflow variant.
  - Run git status.

expected_results:       The working copy is still clean; only cache folders outside the tree were written.

