title:                  Bad change set is not sent
brief:                  |
                        Verifies that a change set is checked in full
                        by cctool before any of it reaches a host.
verification_method:    test
preconditions:          A test host runs a known graph.

inputs:
  - Compute a change set that adds an edge between mismatched ports.
  - Ask deployment to send it.

expected_results:       Deployment refuses, names the failure, and the host receives nothing.

