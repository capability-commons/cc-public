title:                  New member with no default is refused
brief:                  |
                        Verifies that a new version that adds a member
                        with no default cannot upgrade an old value,
                        so it is refused.
verification_method:    test
preconditions:          A dictionary holds a type at version 1.

inputs:
  - Add version 2, which adds a member with no default and names version 1 as the one it upgrades.
  - Run cctool check.

expected_results:       A failure names version 2 and the member that has no default.

