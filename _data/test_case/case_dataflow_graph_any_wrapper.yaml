title:                  Same dataflow graph from YAML and from JSON
brief:                  |
                        Verifies that a dataflow graph is
                        configuration that any wrapper language can
                        write; there is no coordination language to
                        learn.
verification_method:    test
preconditions:          A dataflow graph exists as YAML, and the same graph is written as JSON by a script in another language.

inputs:
  - Read the YAML form.
  - Read the JSON form.
  - Compare the two in their canonical form.

expected_results:       The two canonical forms are identical.

