title:                  Order and count across units
brief:                  |
                        Verifies that a receiver waits for its
                        message, so results do not depend on timing.
verification_method:    test
preconditions:          A sender sends 1000 numbered messages over each transport.

inputs:
  - Run with random delays in both units.

expected_results:       The receiver delivers 1 to 1000, one in each of its local steps, over every transport.

