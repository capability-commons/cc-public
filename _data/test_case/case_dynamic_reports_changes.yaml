title:                  Change events
brief:                  |
                        Verifies that every change to the running
                        graph is reported, so that a replay can make
                        it at the same local step.
verification_method:    test
preconditions:          A running graph with a dynamic subgraph.

inputs:
  - Apply a change set.
  - Swap a node version.
  - Read the events.

expected_results:       One change event and one swap event, each naming its local step.

