title:                  Each fail-safe on overflow
brief:                  |
                        Verifies that an overflow is handled as the
                        port says: drop the excess, drop the message,
                        or fail the local step.
verification_method:    test
preconditions:          A node that writes capacity plus 3 items to a port.

inputs:
  - Run one local step with the fail-safe drop excess.
  - Again with drop message.
  - Again with fail the local step.

expected_results:       The reader gets the first capacity items; then an empty message; then the local step is failed. Each run reports one overflow event.

