title:                  Build-time setting changed at start-up
brief:                  |
                        Verifies that a setting fixed at build time
                        cannot be changed by a variant at start-up or
                        run time.
verification_method:    test
preconditions:          A node declares a setting bound no later than build time.

inputs:
  - Write a variant that sets it at start-up.
  - Run cctool check.

expected_results:       A failure names the setting and the variant.

