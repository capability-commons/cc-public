title:                  Unsafe change sets refused
brief:                  |
                        Verifies that the engine does not trust a
                        change set because cctool checked it.
verification_method:    test
preconditions:          A running graph with a static and a dynamic subgraph.

inputs:
  - Send a change set that joins mismatched ports.
  - One that leaves an input unfed.
  - One that removes a static node.
  - One naming another graph digest.

expected_results:       Each is refused with a reason, and the graph is unchanged.

