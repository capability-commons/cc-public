title:                  Chain runs in order
brief:                  |
                        Verifies that within one execution unit, a
                        reader runs after its writers, once per local
                        step.
verification_method:    test
preconditions:          Nodes a, b and c in one execution unit, where b reads a and c reads b, each logging its invocations.

inputs:
  - Run five local steps.

expected_results:       The log is a, b, c in every local step, and c sees in each local step the value a wrote in that local step.

