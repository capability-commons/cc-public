title:                  Resolution is repeatable
brief:                  |
                        Verifies that resolution is deterministic: the
                        same inputs give the same resolved graph, byte
                        for byte in its canonical form.
verification_method:    test
preconditions:          A dataflow variant with several operations exists.

inputs:
  - Resolve it in one process.
  - Resolve it again in a new process with caches cleared.

expected_results:       Both resolutions give the same input digest and the same content digest.

