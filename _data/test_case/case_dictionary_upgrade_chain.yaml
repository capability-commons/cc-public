title:                  Upgrade path across two versions
brief:                  |
                        Verifies that given two versions, the
                        dictionary gives the chain of mappings between
                        them.
verification_method:    test
preconditions:          A dictionary holds versions 1, 2 and 3 of one value, each naming the one before.

inputs:
  - Ask for the path from version 1 to version 3.
  - Apply it to a value of version 1.

expected_results:       Two mappings come back in order, and the value they give equals the one written by hand for version 3.

