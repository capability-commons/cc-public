title:                  Order independent of timing
brief:                  |
                        Verifies that the order an actor sees messages
                        in does not depend on timing.
verification_method:    test
preconditions:          An actor declares source a before source b; both send three messages within one gap, in varying timing.

inputs:
  - Run the same scenario 100 times with random delays.

expected_results:       Every run handles a1, a2, a3, b1, b2, b3.

