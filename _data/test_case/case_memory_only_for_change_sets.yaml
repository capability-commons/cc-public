title:                  Allocation only on change
brief:                  |
                        Verifies that the only allocation after start
                        is for nodes and edges a change set adds.
verification_method:    test
preconditions:          A running engine with a dynamic subgraph and a counting allocator.

inputs:
  - Run 100 local steps.
  - Apply a change set that adds one edge.
  - Run 100 more.

expected_results:       Allocation happens only in the local step at which the change set takes effect.

