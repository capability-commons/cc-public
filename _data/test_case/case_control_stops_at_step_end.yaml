title:                  Stop waits for the local step
brief:                  |
                        Verifies that an execution unit never stops
                        part way through a local step.
verification_method:    test
preconditions:          A unit with a node that takes 50 ms.

inputs:
  - Send stop 10 ms into a local step.

expected_results:       The local step completes, every output is written, and then the unit stops.

