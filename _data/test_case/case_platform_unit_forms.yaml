title:                  Same graph as processes and as threads
brief:                  |
                        Verifies that the same graph can run as
                        processes on a workstation, threads in an app,
                        or bare cores on a microcontroller.
verification_method:    demonstration
preconditions:          A graph with two execution units.

inputs:
  - Run it with each execution unit in its own OS process.
  - Run it with each in a thread of one OS process.

expected_results:       Both runs give the same messages on every edge.

