title:                  Crossing edge gets a sender and a receiver
brief:                  |
                        Verifies that wherever placement splits an
                        edge, lowering puts a sender and a receiver on
                        it.
verification_method:    test
preconditions:          A resolved graph places camera and detector in one execution unit and tracker in another.

inputs:
  - Lower the graph.

expected_results:       The edge from detector to tracker is replaced by a sender in the first unit and a receiver in the second; no other edge changes.

