title:                  Failed swap rolls back
brief:                  |
                        Verifies that a new node version that fails
                        its first local step is replaced by the old
                        one with its old state.
verification_method:    test
preconditions:          A running node at version 1 with state; version 2 that fails on its first invocation.

inputs:
  - Swap to version 2.
  - Run two local steps.

expected_results:       Version 1 runs again with the state it had, and a swap event says the old version was put back.

