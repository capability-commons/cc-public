title:                  Slow store does not slow steps
brief:                  |
                        Verifies that a recorder hands its writes to
                        storage to another thread and reports a fault
                        if it falls behind.
verification_method:    test
preconditions:          A recorder writing to a store that takes 200 ms per write, in a unit with a 50 ms period.

inputs:
  - Run 100 local steps.

expected_results:       No local step overruns because of the recorder, and the recorder reports that it fell behind.

