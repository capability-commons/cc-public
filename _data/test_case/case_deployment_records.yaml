title:                  Deployment leaves a record
brief:                  |
                        Verifies that every deployment leaves a record
                        of exactly what went where.
verification_method:    test
preconditions:          A test host runs an engine with runtime control.

inputs:
  - Deploy a dataflow variant to the host.
  - Read the deployment record written.

expected_results:       The record names the host, the variant, the commit and the content digest the host reports.

