title:                  Run record requires what ran
brief:                  |
                        Verifies that a run record says exactly which
                        graph ran, where, and on which build, so a
                        result can be traced and repeated.
verification_method:    inspection
preconditions:          The schema of the run record is in the tree.

inputs:
  - Write a run record that leaves out the content digest.
  - Run cctool check.

expected_results:       cctool check reports a schema violation naming the missing digest.

