title:                  Replay reproduces every edge
brief:                  |
                        Verifies that a run in which the graph changed
                        while it ran can be replayed exactly.
verification_method:    test
preconditions:          A deterministic graph, run with a change set at local step 20, a swap at 40 and outside messages throughout, with every edge recorded.

inputs:
  - Replay the run from its recording, with every edge recorded again.
  - Compare the two.

expected_results:       The messages on every edge are identical in both.

