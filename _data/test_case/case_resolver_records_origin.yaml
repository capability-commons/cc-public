title:                  Origin trace of a setting changed twice
brief:                  |
                        Verifies that every node, edge and setting in
                        a resolved graph can be traced to where it
                        came from.
verification_method:    test
preconditions:          A base sets a value; a variant changes it; a variant of that variant changes it again.

inputs:
  - Resolve the second variant.
  - Read the origin of the setting.

expected_results:       The origin names the base and both operations, in the order they were applied.

