title:                  Fault events reach the control block
brief:                  |
                        Verifies that the engine records nothing
                        itself; it reports faults so that nodes can
                        record them.
verification_method:    test
preconditions:          A graph with a node that overflows once and a node that sleeps past the period once.

inputs:
  - Run ten local steps.
  - Read the events the control block passes on.

expected_results:       Exactly one overflow event and one overrun event, each naming the local step they happened in.

