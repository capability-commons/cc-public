title:                  Capacity follows the period
brief:                  |
                        Verifies that port capacities are worked out,
                        not written by hand.
verification_method:    test
preconditions:          A camera declares a maximum of 30 frames each second, and feeds a detector.

inputs:
  - Lower the graph with a period of 100 ms.
  - Lower it again with a period of 200 ms.

expected_results:       The capacity of the input port of the detector grows with the period, and in each case is at least the rate times the period.

