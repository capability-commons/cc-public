title:                  Pinned to the named core
brief:                  |
                        Verifies that placement can say which core an
                        execution unit runs on, and the platform layer
                        does it.
verification_method:    test
preconditions:          A Linux host with at least four cores.

inputs:
  - Start a graph whose execution unit is placed on core 2.
  - Read the CPU affinity of its thread.

expected_results:       The affinity is core 2 only.

