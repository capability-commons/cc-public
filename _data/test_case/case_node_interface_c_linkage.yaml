title:                  Nodes of two languages in one graph
brief:                  |
                        Verifies that every node can be called through
                        C, whatever language it is written in.
verification_method:    test
preconditions:          A node written in C and one in C++ exist, both built against the node interface.

inputs:
  - Build a graph that joins them.
  - Run ten local steps.

expected_results:       Values pass from one to the other in every local step.

