title:                  Stale digest refused
brief:                  |
                        Verifies that requests carry digests so cctool
                        and the engine always mean the same graph.
verification_method:    test
preconditions:          An engine running a known graph.

inputs:
  - Send a request naming another digest.
  - Ask for status.

expected_results:       The request is refused, and the status shows the same graph running.

