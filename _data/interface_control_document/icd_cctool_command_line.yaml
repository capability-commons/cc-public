                  kind:  option

                  type:
                    spelling:  directory

                  default:  .
                  optional:  true
                  variadic:  false
                  flag:  false

                - id_self:  icm_cctool_command_line.export.okf.replace
                  guid_self:  icm_163434d1be3a4735871cac944ed1071f
                  name:  --replace
                  brief:  |
                        Remove the pages already in dir_out first, and
                        keep its other files, such as the settings of
                        a viewer.
                  kind:  option

                  type:
                    spelling:  boolean

                  default:  'false'
                  optional:  true
                  variadic:  false
                  flag:  true

        format:
          id_self:      icm_cctool_command_line.format
          guid_self:    icm_999e1e2ae8074dce9f0f0521f10f09aa
          name:         format
          brief:        |
                        Lay out every YAML document in the tree under
                        --root: the YAML files under _data, the module
                        docstrings of python modules, and the comment
                        headers of other files.

          parameter:

            - id_self:  icm_cctool_command_line.format.root
              guid_self:  icm_292b1e390acf422e834c07f0628b5165
              name:     --root
              brief:    |
                        The tree to lay out. Defaults to the working
                        directory.
              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.format.check
              guid_self:  icm_efbc109293254269bb38519b13f3919b
              name:     --check
              brief:    |
                        Name the files that would change, and write
                        nothing. The exit status is 1 when any would.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

        friction:
          id_self:      icm_cctool_command_line.friction
          guid_self:    icm_03443e834c73473ebaa12613fbfa3345
