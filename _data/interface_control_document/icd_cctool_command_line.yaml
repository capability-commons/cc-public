      exit_status:

        ok:
          id_self:      icm_cctool_command_line.ok
          guid_self:    icm_6afb43665f5f4005ba5d45e2168ef344
          name:         '0'
          brief:        |
                        The command did what was asked.
          value:        0
          condition:    |
                        The command ran, and found nothing wrong where
                        it checks.

        nonconformity:
          id_self:      icm_cctool_command_line.nonconformity
          guid_self:    icm_c5cee6fae5ac41878976d6113072557c
          name:         '1'
          brief:        |
                        The command ran and found a nonconformity.
          value:        1
          condition:    |
                        The command ran to the end, and what it checks
                        does not conform: a check found a failure, a
                        gate step failed, an edit was refused because
                        it would add a failure, a file would change
                        under --check, or release check found that the
                        commit may not be tagged.

        error:
          id_self:      icm_cctool_command_line.error
          guid_self:    icm_b548d2385f9b4a62a587d93acbe7478f
          name:         '2'
          brief:        |
                        The command could not do what was asked.
          value:        2
          condition:    |
                        What was given was wrong, or the command could
                        not run: a bad parameter, an item or file that
                        is not there, or checks that could not be run.
                        click exits with it too, for a usage error.

