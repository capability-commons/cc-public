protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Command line interface
brief:                  |
                        The commands of cctool, the parameters each
                        takes, the statuses it exits with, and the
                        JSON a script may read.
description:            |
                        A peer runs these commands in its own hooks
                        and scripts. What is promised is the commands,
                        their parameters, the exit statuses and the
                        named JSON outputs. What a command prints for
                        a person to read, such as its help, its
                        messages, its tables and the wording of a
                        failure, is not promised. Every command also
                        takes --help, which is click's own.
version_interface:      '0.1'
support:                supported

surface:

  cli:

    command_line:
      program:          cctool

      parameter:

        - id_self:      icm_cctool_command_line.version
          guid_self:    icm_23ce57054a7246c290709810bfcb18d1
          name:         --version
          brief:        |
                        Show the version and exit.
          kind:         option

          type:
            spelling:   boolean

          default:      'false'
          optional:     true
          variadic:     false
          flag:         true

      command:

        batch:
          id_self:      icm_cctool_command_line.batch
          guid_self:    icm_d6c7db0442c846cba40a57a3b60fec7b
          name:         batch
          brief:        |
                        Make the operations listed in the YAML file
                        path_file as one edit.

          parameter:

            - id_self:  icm_cctool_command_line.batch.path_file
              guid_self:  icm_8afba0cdfc27490691a533d5a18e17f2
              name:     path_file
              brief:    |
                        The YAML file that lists the operations, or -
                        for stdin.
              kind:     argument

              type:
                spelling:  filename

              optional:  false
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.batch.root
              guid_self:  icm_a99f0c291e004e179c0022a922e9b851
              name:     --root
              brief:    |
                        The tree to edit. Defaults to the working
                        directory.
              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.batch.dry_run
              guid_self:  icm_2a267b4137ae460e9b85136a971ff468
              name:     --dry-run
              brief:    |
                        Print the edit as a diff, and write nothing.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

