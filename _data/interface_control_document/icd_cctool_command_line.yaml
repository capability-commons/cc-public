              parameter:

                - id_self:  icm_cctool_command_line.export.okf.dir_out
                  guid_self:  icm_f20ae3f8fc6f48d58fb8bebf0e96bce1
                  name:  dir_out
                  brief:  |
                        The folder to write the pages to.
                  kind:  argument

                  type:
                    spelling:  path

                  optional:  false
                  variadic:  false
                  flag:  false

                - id_self:  icm_cctool_command_line.export.okf.root
                  guid_self:  icm_5478d685202249eaa0ba28a3e98d4da0
                  name:  --root
                  brief:  |
                        The tree to export. Defaults to the working
