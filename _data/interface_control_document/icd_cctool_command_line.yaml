              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

        gate:
          id_self:      icm_cctool_command_line.gate
          guid_self:    icm_1d21317884694a048fea7b4fa7b12b26
          name:         gate
          brief:        |
                        Check, lint and test what a commit of the
