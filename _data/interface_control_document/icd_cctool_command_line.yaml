              guid_self:  icm_8180172466c24e85b8c488abcab7aea5
              name:     id_relation
              brief:    |
                        The id of the relation of the edge.
              kind:     argument

              type:
                spelling:  text

              optional:  false
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.link.id_target
              guid_self:  icm_faf4f210e3d946b1a438b6c835d0caeb
              name:     id_target
              brief:    |
                        The id of the item the edge is to.
              kind:     argument

              type:
                spelling:  text

              optional:  false
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.link.root
              guid_self:  icm_30365ac5bd0d4d1882d9d25a3e7e068f
              name:     --root
              brief:    |
                        The tree to edit. Defaults to the working
