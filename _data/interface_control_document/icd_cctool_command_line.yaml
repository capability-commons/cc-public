            - id_self:  icm_cctool_command_line.check.root
              guid_self:  icm_d3d9e079c48f46278ca50c0818315118
              name:     --root
              brief:    |
                        The tree to check. Defaults to the working
                        directory.
              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

