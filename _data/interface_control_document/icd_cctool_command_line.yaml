            - id_self:  icm_cctool_command_line.header.id_self
              guid_self:  icm_2f16e9f33cd34bb193de37c99f164d75
              name:     id_self
              brief:    |
                        The id of the new item. If left out, it
                        follows from the place of the file.
              kind:     argument

              type:
                spelling:  text

              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.header.field
              guid_self:  icm_978bf715c7734139b0c21d892f6127f7
              name:     --field
              brief:    |
                        A field of the new item, given as two values,
                        NAME and VALUE. Repeat it for each field. A
                        NAME given more than once makes a list.
              kind:     option

              type:
                spelling:  text

              optional:  true
              variadic:  true
              flag:     false

            - id_self:  icm_cctool_command_line.header.link
              guid_self:  icm_eff8e1edc19549ccb1a572e1186941d0
              name:     --link
              brief:    |
                        An edge from the new item, given as two
                        values, RELATION and TARGET. Repeat it for
                        each edge.
              kind:     option

              type:
                spelling:  text

              optional:  true
              variadic:  true
              flag:     false

            - id_self:  icm_cctool_command_line.header.root
              guid_self:  icm_12c0e35608a347b08bbdbe080dd2e1d1
              name:     --root
              brief:    |
                        The tree to edit. Defaults to the working
                        directory.
              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.header.dry_run
              guid_self:  icm_8c330ebe283f4b8493671deabcb59f6d
              name:     --dry-run
              brief:    |
                        Print the edit as a diff, and write nothing.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

        history:
          id_self:      icm_cctool_command_line.history
          guid_self:    icm_a70a87dd15f34d15acdb0c89d9380109
          name:         history
          brief:        |
                        Check commits already made.

          command:

            check:
              id_self:  icm_cctool_command_line.history.check
              guid_self:  icm_4c96864db2194fd28bf1b4f8012a26f6
              name:     check
              brief:    |
                        Check each commit in the range list_arg,
                        oldest first, however it was made.

              parameter:

                - id_self:  icm_cctool_command_line.history.check.list_arg
                  guid_self:  icm_25a6b5c657254d3eb5991a70d0a1a247
                  name:  list_arg
                  brief:  |
                        The range of commits to check, as git names
                        one.
                  kind:  argument

                  type:
                    spelling:  text

                  optional:  true
                  variadic:  true
                  flag:  false

                - id_self:  icm_cctool_command_line.history.check.pre_push
                  guid_self:  icm_9edad83b238a41abbd16b21c78058cdc
                  name:  --pre-push
                  brief:  |
                        Check what a push to the remote it names would
                        send, from the lines git gives a pre-push hook
                        on stdin, in place of list_arg.
                  kind:  option

                  type:
                    spelling:  text

                  optional:  true
                  variadic:  false
                  flag:  false

                - id_self:  icm_cctool_command_line.history.check.gate
                  guid_self:  icm_0ea46724cb9b4642bb5b2149655b52fd
                  name:  --gate
                  brief:  |
                        Also check, lint and test the content of the
                        newest commit, or of each ref a push updates.
                  kind:  option

                  type:
                    spelling:  boolean

                  default:  'false'
                  optional:  true
                  variadic:  false
                  flag:  true

                - id_self:  icm_cctool_command_line.history.check.root
                  guid_self:  icm_e4260f03d1974fb989474647c245613f
                  name:  --root
                  brief:  |
                        The repository. Defaults to the working
                        directory.
                  kind:  option

                  type:
                    spelling:  directory

                  default:  .
                  optional:  true
                  variadic:  false
                  flag:  false

        impact:
          id_self:      icm_cctool_command_line.impact
          guid_self:    icm_f5f210ccc2a84001bf9d2f93c38e6a93
          name:         impact
          brief:        |
                        Show what the commit rev touches, and the
                        untouched items around it.

          parameter:

            - id_self:  icm_cctool_command_line.impact.rev
              guid_self:  icm_44b11789fc6a4e7a9bebd8e8934a8fd4
              name:     rev
              brief:    |
                        The commit to show. HEAD if left out.
              kind:     argument

              type:
                spelling:  text

              default:  HEAD
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.impact.staged
              guid_self:  icm_0e14a240a1ae485286b33b30faa50694
              name:     --staged
              brief:    |
                        Show what the staged content would touch as
                        the next commit, in place of rev.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

            - id_self:  icm_cctool_command_line.impact.depth
              guid_self:  icm_6a1a0f56fe0d4635b485835123fee09d
              name:     --depth
              brief:    |
                        How many links from a touched item to look.
              kind:     option

              type:
                spelling:  integer range

              default:  '1'
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.impact.direction
              guid_self:  icm_45c105e13ab646bdaf02a857ba81541c
              name:     --direction
              brief:    |
                        in: the items that link to a touched one. out:
                        those it links to. both: either.
              kind:     option

              type:
                spelling:  choice

              default:  both
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.impact.json
              guid_self:  icm_7683acb191104536a788271ac49a89bd
              name:     --json
              brief:    |
                        Print the JSON output in place of the list.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

            - id_self:  icm_cctool_command_line.impact.root
              guid_self:  icm_8a0b4796c664496db522fbfe46852b36
              name:     --root
              brief:    |
                        The repository. Defaults to the working
                        directory.
              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

          output:

            json:
              id_self:  icm_cctool_command_line.impact.output_json
              guid_self:  icm_4fe4d045dff44402bfc5716234d5df47
              name:     --json
              brief:    |
                        The JSON form of what the command prints.
              content:  |
                        The items the commit touches and the untouched
                        items around them, written to standard output
                        in place of the list when --json is given.
              encoding:  |
                        One JSON object on one line, in UTF-8, on
                        standard output.
              convention:  |
                        touched lists an object for each touched item,
                        with the keys id, delta, was, file and line.
                        neighbor lists an object for each untouched
                        item reached, with the keys id, depth, via,
                        relation, direction, file and line. Each id is
                        the id of an item in the data format.

        import:
          id_self:      icm_cctool_command_line.import
          guid_self:    icm_e1fabd699e19458f920f308fcc20730c
          name:         import
          brief:        |
                        Make an external class for each class IRI, and
                        an external relation for each relation IRI, of
                        the ontology release in the Turtle file
                        path_ttl, or bring those made before up to
                        date with it.

          parameter:

            - id_self:  icm_cctool_command_line.import.path_ttl
              guid_self:  icm_8ede50cade6a40ceb611f74453f656b7
              name:     path_ttl
              brief:    |
                        The Turtle file of the ontology release.
              kind:     argument

              type:
                spelling:  file

              optional:  false
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.import.list_iri
              guid_self:  icm_27be04859efc4ac282f56288cdff1ac7
              name:     list_iri
              brief:    |
                        The IRIs of the classes and relations to bring
                        in. Every one the namespaces cover if left
                        out.
              kind:     argument

              type:
                spelling:  text

              optional:  true
              variadic:  true
              flag:     false

            - id_self:  icm_cctool_command_line.import.namespace
              guid_self:  icm_61425f69371a495a8d0265df9312d586
              name:     --namespace
              brief:    |
                        A namespace, as IRI SHORT RELEASE: the classes
                        and relations whose IRI begins with IRI get
                        ids extcla_SHORT_LABEL and extrel_SHORT_LABEL,
                        and cite the external document RELEASE. Give
                        one for each namespace.
              kind:     option

              type:
                spelling:  text

              optional:  false
              variadic:  true
              flag:     false

            - id_self:  icm_cctool_command_line.import.check
              guid_self:  icm_f3ce0003b4d34ea4a464754a7605474e
              name:     --check
              brief:    |
                        Name each way the external classes and
                        relations differ from the release, and write
                        nothing. Without list_iri, every one the
                        namespaces cover is compared. The exit status
                        is 1 when any differs.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

            - id_self:  icm_cctool_command_line.import.root
              guid_self:  icm_6735cc31ceb44e3e9a951e95a8132624
              name:     --root
              brief:    |
                        The tree to edit. Defaults to the working
                        directory.
              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.import.dry_run
              guid_self:  icm_0c845ff76d624e21a4bde971fb192809
              name:     --dry-run
              brief:    |
                        Print the edit as a diff, and write nothing.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
              variadic:  false
              flag:     true

