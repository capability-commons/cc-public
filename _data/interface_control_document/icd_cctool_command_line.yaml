              kind:     option

              type:
                spelling:  directory

              default:  .
              optional:  true
              variadic:  false
              flag:     false

            - id_self:  icm_cctool_command_line.link.dry_run
              guid_self:  icm_4ae45ad49b1d45d3a850fbfd06959849
              name:     --dry-run
              brief:    |
                        Print the edit as a diff, and write nothing.
              kind:     option

              type:
                spelling:  boolean

              default:  'false'
              optional:  true
