title:                  Static schedule as plain calls
brief:                  |
                        The static part of a build is straight-line
                        calls the compiler can see through.
modal_verb:             shall
activity:               autonomous
object:                 the static schedule of each execution unit as plain C++17 calls
qualifier:              with no allocation of memory and no indirect calls
rationale:              Plain calls keep the speed and the reviewability that make the static subgraph suitable for embedded and high-integrity targets.
verification_method:    inspection
verification_approach:  The generated schedule is read, and checked with a static analyzer for allocations and indirect calls.

