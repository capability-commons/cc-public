title:                  Engine repeats the safety checks
brief:                  |
                        The engine does not trust a change set because
                        cctool checked it.
condition_kind:         logic
condition:              a change set would join ports that carry different values, leave an input unfed, touch a static [[dataflow node]], or name a [[dataflow graph]] other than the one running
modal_verb:             shall
activity:               autonomous
object:                 the whole change set
qualifier:              with its reason in an event
rationale:              A change set could be stale or corrupted in transit; the checks that keep the engine safe are cheap to repeat.
verification_method:    test
verification_approach:  Each kind of unsafe change set is sent to a running engine.

