title:                  Replay of a run with live changes
brief:                  |
                        A run in which the graph changed while it ran
                        can be replayed exactly.
condition_kind:         logic
condition:              a [[dataflow run]] with live changes is replayed from its recording and every [[dataflow node]] is deterministic
modal_verb:             shall
activity:               autonomous
object:                 the same messages on every [[dataflow edge]] as in the recorded [[dataflow run]]
rationale:              Replay is how faults found in the field are reproduced and how evidence is checked.
verification_method:    test
verification_approach:  A run with a change set, a swap and outside messages is recorded and replayed.

