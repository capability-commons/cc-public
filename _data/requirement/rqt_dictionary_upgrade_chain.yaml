title:                  Chain of upgrades between dictionary versions
brief:                  |
                        Given two versions, the dictionary gives the
                        chain of mappings between them.
modal_verb:             shall
activity:               autonomous
object:                 the mappings that take a value from any version in the dictionary to any later version of it, in the order they apply
rationale:              A swap may jump several versions at once, and the generator writes the upgrade from this chain.
verification_method:    test
verification_approach:  A chain of three versions is asked for the path from the first to the third.

