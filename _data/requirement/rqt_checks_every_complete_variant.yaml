title:                  Every complete variant checked twice
brief:                  |
                        Each complete variant is checked as resolved
                        and as lowered.
modal_verb:             shall
activity:               autonomous
object:                 the dataflow rules on every [[complete dataflow variant]], on its [[resolved dataflow graph]] and again on its lowered form
rationale:              Lowering adds machinery that can itself be wrong; checking only the resolved graph would miss it.
verification_method:    test
verification_approach:  A variant whose lowering would leave a crossing edge without transport is checked.

