title:                  Guid kept through a rename
brief:                  |
                        Renaming an [[item]] leaves its guid as it
                        was.
condition_kind:         event
condition:              the Tooling renames an [[item]]
modal_verb:             shall
activity:               autonomous
object:                 the guid of the [[item]]
rationale:              |
                        A reference resolves by its guid where its id
                        does not. A rename that changed the guid would
                        break every reference to the [[item]] at once.
verification_method:    test
verification_approach:  |
                        After a rename, the renamed [[item]] and every
                        [[item]] it holds have the guid they had
                        before.

