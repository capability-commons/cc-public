title:                  Loss where a requirement forbids it
brief:                  |
                        A lossy delivery policy on an edge that must
                        not lose data fails the check.
condition_kind:         logic
condition:              a delivery policy that can lose values is on a [[dataflow edge]] that a [[requirement]] forbids to lose any
modal_verb:             shall
activity:               autonomous
object:                 a [[failure]] that names the [[dataflow edge]] and the [[requirement]]
rationale:              Each policy declares whether it can lose data so that this can be found before a system runs.
verification_method:    test
verification_approach:  A latest-value policy is put on an edge whose requirement forbids loss.

