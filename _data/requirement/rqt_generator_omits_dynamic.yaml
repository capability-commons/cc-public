title:                  Static-only build leaves out the dynamic machinery
brief:                  |
                        A build with no dynamic nodes carries none of
                        the code that changes a graph at run time.
condition_kind:         logic
condition:              a build has no dynamic [[dataflow node]] and its user has not asked for the dynamic machinery
modal_verb:             shall
activity:               autonomous
object:                 the Dynamic subgraph from the build
rationale:              Small and high-integrity targets such as the Raspberry Pi 5 should not carry code they never use.
verification_method:    inspection
verification_approach:  The symbols of a static-only build are listed.

