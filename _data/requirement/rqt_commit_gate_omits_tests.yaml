title:                  Tests left out of the commit gate
brief:                  |
                        Committing stays fast because the tests move
                        to the queue.
modal_verb:             shall
activity:               autonomous
object:                 the tests from the [[commit gate]] on a topic branch, keeping its stages for the [[checks]], lint and the [[commit]] message
rationale:              WTP keeps the fast stages at commit as long as they really are fast (WTP, 2026-10-30); the budget is about 20 seconds for a commit that changes code and about 10 for one that changes only data, and a slow stage is a defect.
verification_method:    test
verification_approach:  A commit that changes code runs no test stage, and the timing log shows its gate within the budget.

