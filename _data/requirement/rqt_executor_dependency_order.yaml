title:                  Kahn nodes in dependency order
brief:                  |
                        Within one execution unit, a reader runs after
                        its writers, once per local step.
modal_verb:             shall
activity:               autonomous
object:                 each Kahn [[dataflow node]] of its execution unit once in each [[local step]]
qualifier:              after every [[dataflow node]] it takes input from in that [[local step]]
rationale:              Reading in dependency order gives same-step reading without anyone declaring it.
verification_method:    test
verification_approach:  A chain of three nodes records the order of invocation.

