title:                  Gap admits only waiting messages
brief:                  |
                        Messages sent during a gap wait for the next
                        gap.
modal_verb:             shall
activity:               autonomous
object:                 to each gap only the messages waiting when the gap opens
rationale:              A gap that took in messages as they arrived could run forever and would not replay.
verification_method:    test
verification_approach:  An actor that sends itself a message is run.

