title:                  Swap can go back
brief:                  |
                        A new node version that fails its first local
                        step is replaced by the old one with its old
                        state.
modal_verb:             shall
activity:               autonomous
object:                 the old state and version of a swapped [[dataflow node]] until its new version completes a [[local step]]
qualifier:              so that the swap can be undone
rationale:              A swap at run time must not be able to take a system down.
verification_method:    test
verification_approach:  A swap to a version that fails at once is made.

