title:                  Changes reported for replay
brief:                  |
                        Every change to the running graph is reported,
                        so that a replay can make it at the same local
                        step.
modal_verb:             shall
activity:               autonomous
object:                 for each change set applied or refused and for each swap an event that names the [[local step]] at which it took effect
rationale:              Replay of a run with live changes needs the step of each change.
verification_method:    test
verification_approach:  A change set and a swap are made and the events read.

