title:                  Overlapping submission refused
brief:                  |
                        Only simple linear stacks of patches are
                        accepted.
modal_verb:             shall
activity:               autonomous
object:                 a submission whose [[concept_commit|commits]] overlap a queued patch in any way other than a linear stack, with the reason
rationale:              A general dependency engine is not needed yet, and an ambiguous overlap would make the boundary of a patch unclear.
verification_method:    test
verification_approach:  A submission that shares commits with two queued patches is refused.

