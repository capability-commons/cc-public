title:                  New member of a dictionary version needs a default
brief:                  |
                        A new version that adds a member with no
                        default cannot upgrade an old value, so it is
                        refused.
condition_kind:         logic
condition:              a new version in the dictionary adds a member that has no default and is not converted from an older one
modal_verb:             shall
activity:               autonomous
object:                 the new version
rationale:              State upgrades during a swap rely on every new member getting a value; one with no default would leave it undefined.
verification_method:    test
verification_approach:  A dictionary version that adds a member with no default is written and checked.

