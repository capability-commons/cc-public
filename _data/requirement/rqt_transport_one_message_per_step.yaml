title:                  One message per local step across units
brief:                  |
                        A receiver waits for its message, so results
                        do not depend on timing.
modal_verb:             shall
activity:               autonomous
object:                 the messages of the [[dataflow edge]], exactly one in each [[local step]] of the receiver, in the order the sender sent them
rationale:              This is what makes a split across units behave as a Kahn process network.
verification_method:    test
verification_approach:  A sender and receiver run with random delays.

