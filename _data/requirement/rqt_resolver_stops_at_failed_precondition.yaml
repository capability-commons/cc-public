title:                  Resolution stops at a failed precondition
brief:                  |
                        An operation whose preconditions do not hold
                        stops resolution and is named in the report.
condition_kind:         logic
condition:              a [[variant operation]] finds absent what it needs, or present what it adds
modal_verb:             shall
activity:               autonomous
object:                 the resolution
qualifier:              with a report that names that [[variant operation]]
rationale:              Removing a node that is not there, or adding one that is, means the base changed under the variant; going on would hide it.
verification_method:    test
verification_approach:  A variant removes a node its base does not hold, and is resolved.

