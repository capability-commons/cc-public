title:                  State recovered after an interruption
brief:                  |
                        An interrupted run leaves nothing landed twice
                        and nothing lost.
condition_kind:         event
condition:              a run of the daemon starts
modal_verb:             shall
activity:               autonomous
object:                 the state of any interrupted attempt from the patch records and refs, before taking new work
rationale:              A ref transaction cannot cover a file write or a push, so each step must be safe to run again.
verification_method:    test
verification_approach:  Interrupting the daemon at each transition, then running it again, leaves dev holding only tested work, no patch landed twice and every patch accounted for.

