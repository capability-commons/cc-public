title:                  Recording does not slow the local step
brief:                  |
                        A recorder hands its writes to storage to
                        another thread and reports a fault if it falls
                        behind.
modal_verb:             shall
activity:               autonomous
object:                 their traffic to storage off the path of the [[local step]]
qualifier:              so that a slow store does not lengthen a [[local step]]
rationale:              A recorder that slowed the local step would change the system it records.
verification_method:    test
verification_approach:  A recorder writes to a deliberately slow store.

