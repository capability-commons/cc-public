title:                  Patch records kept
brief:                  |
                        Each patch has a durable record of what it is
                        and what happened to it.
modal_verb:             shall
activity:               autonomous
object:                 'a record of each patch: its thread, source tip, starting point, dependencies and their revisions, each attempt and outcome, and the [[concept_commit|commits]] it added to dev, held reachable by refs'
rationale:              Branch names alone cannot hold commit boundaries, dependencies or results, and a hash written into a file does not keep its commit from being collected.
verification_method:    test
verification_approach:  After a patch lands and its branch is deleted, its record and the commits it names are still present.

