title:                  Fixed order within a gap
brief:                  |
                        The order an actor sees messages in does not
                        depend on timing.
modal_verb:             shall
activity:               autonomous
object:                 the messages admitted by a gap to each actor by source in the declared order, then by sequence number within a source
rationale:              A fixed order makes runs repeatable and replayable.
verification_method:    test
verification_approach:  Two sources send in interleaved timing; the order seen is compared.

