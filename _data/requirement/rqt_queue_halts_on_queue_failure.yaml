title:                  Queue halted on a failure of its own
brief:                  |
                        A broken environment pauses the queue instead
                        of bouncing patches.
condition_kind:         logic
condition:              the queue itself fails, such as by a broken environment, an unusable signing key, a dirty main checkout, rejected push credentials or a diverged origin
modal_verb:             shall
activity:               autonomous
object:                 all work, holds the patch in hand in its place, and counts nothing as passed
rationale:              A broken environment would otherwise bounce innocent patches and make repair work out of nothing; nothing is retried automatically.
verification_method:    test
verification_approach:  A missing interpreter pauses the queue with its reason, and the patch in hand stays a candidate.

