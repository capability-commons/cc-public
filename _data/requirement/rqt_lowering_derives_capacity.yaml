title:                  Capacity from producer rates
brief:                  |
                        Port capacities are worked out, not written by
                        hand.
modal_verb:             shall
activity:               autonomous
object:                 the capacity of every port from the maximum rates of its producers and the period of the [[local step]]
qualifier:              plus a margin for jitter
rationale:              A hand-written capacity goes stale when a producer or a period changes; one derived per variant does not.
verification_method:    test
verification_approach:  A camera with a stated maximum rate feeds a detector; the graph is lowered for two periods.

