title:                  Control message written first
brief:                  |
                        Every node of a unit sees the control message
                        of the current local step.
modal_verb:             shall
activity:               autonomous
object:                 the control message of each [[local step]]
qualifier:              before any other [[dataflow node]] of its execution unit is invoked
rationale:              A node invoked before the control message would see stale time and modes.
verification_method:    test
verification_approach:  Nodes log the time they read; the control block logs the time it wrote.

