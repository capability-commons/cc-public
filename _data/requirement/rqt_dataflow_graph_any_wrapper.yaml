title:                  A dataflow graph from any wrapper language
brief:                  |
                        A dataflow graph is configuration that any
                        wrapper language can write; there is no
                        coordination language to learn.
modal_verb:             shall
activity:               interface
object:                 a [[dataflow graph]] written in YAML or in JSON by any tool
qualifier:              and give it the same canonical form in either case
rationale:              Users write graphs from the language they prefer; a graph read the same from YAML and from JSON lets any of them produce it.
verification_method:    test
verification_approach:  One dataflow graph written as YAML and as JSON is read, and the two are compared.

