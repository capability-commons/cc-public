title:                  Refusal of an edit that adds a failure
brief:                  |
                        The tooling makes no edit that would add a
                        failure to the tree.
condition_kind:         logic
condition:              an edit would add a failure to the tree
modal_verb:             shall
activity:               autonomous
object:                 the edit
rationale:              |
                        An edit made through the tooling is meant to
                        leave the tree as sound as it found it. An
                        edit that adds a failure would leave the next
                        person a fault they did not make.
verification_method:    test
verification_approach:  |
                        Asked for an edit that adds a failure, the
                        Tooling names the failure and writes no file.

