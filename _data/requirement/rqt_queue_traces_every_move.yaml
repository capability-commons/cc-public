title:                  Every move journaled
brief:                  |
                        The queue keeps a journal of every move, from
                        which its measures come.
modal_verb:             shall
activity:               autonomous
object:                 every move of a patch in a journal, with its time, ref, stages, tip, dev [[commit]] and reason
rationale:              The journal is the audit trail, and gives the time from submission to landing, the gate time, the rates of conflict and rework and the age of the oldest ready patch.
verification_method:    test
verification_approach:  A patch that goes through conflict and then lands leaves one line per move.

