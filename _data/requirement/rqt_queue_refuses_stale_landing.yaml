title:                  Stale landing refused
brief:                  |
                        A patch whose test no longer matches dev goes
                        back to be tried again.
condition_kind:         logic
condition:              dev, the tested [[commit]] or its [[concept_commit_gate|gate]] result no longer match the attempt
modal_verb:             shall
activity:               autonomous
object:                 to land the patch, and returns it to queue/00_candidate under the same name
rationale:              Landing a commit tested on another base would break the rule that dev holds only tested trees.
verification_method:    test
verification_approach:  Moving dev during a test returns the patch to candidate, and dev is not changed by the queue.

