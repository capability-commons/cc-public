title:                  Setting bound too late
brief:                  |
                        A setting fixed at build time cannot be
                        changed by a variant at start-up or run time.
condition_kind:         logic
condition:              a [[dataflow variant]] binds a setting later than the latest time the setting declares
modal_verb:             shall
activity:               autonomous
object:                 a [[failure]] that names the setting and the [[dataflow variant]]
rationale:              Binding later than declared would change something the build has already fixed.
verification_method:    test
verification_approach:  A variant sets at start-up a setting declared to be bound at build time.

