title:                  Direct C++ call from the static schedule
brief:                  |
                        C++ nodes in the static subgraph are called
                        directly, so the compiler can inline them.
modal_verb:             shall
activity:               autonomous
object:                 a C++ form of the invocation function beside its C form
qualifier:              so that the static schedule can call a C++ implementation directly
rationale:              The C entry point is kept for other languages, code loaded at run time and fuzzing; the direct call keeps the static path fast.
verification_method:    inspection
verification_approach:  The generated schedule of a C++ node is read for the call it makes.

