title:                  Idempotent formatting
brief:                  |
                        Formatting a file that is already formatted
                        changes nothing.
condition_kind:         event
condition:              the Tooling formats a file that is already formatted
modal_verb:             shall
activity:               autonomous
object:                 each byte of the file unchanged
rationale:              |
                        The layout check is that formatting a file
                        gives back the file. That check means nothing
                        unless a second pass changes nothing.
verification_method:    test
verification_approach:  |
                        Every file the layout check reads, formatted
                        twice, is byte for byte the same after the
                        second pass as after the first.

