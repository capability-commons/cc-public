title:                  Deployment kept with its data owner
brief:                  |
                        Each deployment of the chat bots runs, stores
                        and pushes only inside the infrastructure of
                        the [[owner]] of the [[data]] it handles.
modal_verb:             shall
activity:               autonomous
object:                 what each deployment runs, stores and pushes to the infrastructure of the [[owner]] of its [[data]]
rationale:              William Payne gave three sources. He assumes that users will want it. The DTU use handles personal [[data]], so GDPR applies to where it is processed and stored. And DTU work and Axair Systems work are to be kept apart, as commercial boundary hygiene.
verification_method:    inspection
verification_approach:  For each deployment, its settings name a host, a volume and a git remote that the [[owner]] of its [[data]] controls.

