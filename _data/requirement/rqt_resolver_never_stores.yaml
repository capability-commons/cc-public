title:                  Resolved graphs only in caches
brief:                  |
                        A resolved graph is never written into the
                        tree as a second copy of a variant.
modal_verb:             shall
activity:               autonomous
object:                 every [[resolved dataflow graph]] it holds to caches that can be dropped and rebuilt
rationale:              A stored copy would drift from its variant and confuse design exploration.
verification_method:    inspection
verification_approach:  The resolver is read for every place it writes.

