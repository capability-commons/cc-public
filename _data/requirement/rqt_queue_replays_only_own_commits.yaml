title:                  Only the patch's own commits replayed
brief:                  |
                        A patch moves onto dev without the commits of
                        other patches it was built on.
modal_verb:             shall
activity:               autonomous
object:                 only the [[concept_commit|commits]] of a patch, from its recorded starting point to its source tip, onto the current dev, signing each as it is copied
rationale:              A patch started on top of another queued patch would otherwise carry that patch's commits onto dev with it, and replaying rewrites commits, so ancestry alone cannot show where a patch begins.
verification_method:    test
verification_approach:  A patch stacked on a landed patch replays only its own commits.

