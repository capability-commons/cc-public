title:                  Only the tested commit landed
brief:                  |
                        What lands on dev is exactly the commit the
                        gate passed.
modal_verb:             shall
activity:               autonomous
object:                 to dev only the signed [[commit]] that passed its landing [[run]], by fast-forward in the main checkout
rationale:              Commits are signed before testing and dev moves only by fast-forward, so nothing changes a commit between its test and its landing; moving dev in the main checkout keeps its index and files in step with the branch.
verification_method:    test
verification_approach:  After a landing, dev and the main checkout are at the tested commit.

