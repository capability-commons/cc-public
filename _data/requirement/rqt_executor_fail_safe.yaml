title:                  Declared fail-safe on overflow
brief:                  |
                        An overflow is handled as the port says: drop
                        the excess, drop the message, or fail the
                        local step.
condition_kind:         logic
condition:              a port is written beyond its capacity
modal_verb:             shall
activity:               autonomous
object:                 the fail-safe of the port
rationale:              Overflow is a broken requirement, and the right response depends on the port.
verification_method:    test
verification_approach:  A node writes more items than its port holds, under each fail-safe.

