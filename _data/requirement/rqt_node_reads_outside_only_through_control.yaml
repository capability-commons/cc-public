title:                  Outside world only through the control message
brief:                  |
                        Ordinary nodes never call clocks, sensors or
                        the engine directly.
modal_verb:             shall
activity:               autonomous
object:                 everything a [[dataflow node]] learns from outside its ports and its state to the control message
rationale:              Every value from outside then arrives as a recordable value, which makes replay possible.
verification_method:    analysis
verification_approach:  The source of each node is analyzed for calls to clocks, the platform layer or the engine.

