title:                  Record of a dataflow run names what ran
brief:                  |
                        A run record says exactly which graph ran,
                        where, and on which build, so a result can be
                        traced and repeated.
modal_verb:             shall
activity:               autonomous
object:                 the [[dataflow variant]], the content digest of its [[resolved dataflow graph]], the host and the build of the engine in the record of each [[dataflow run]]
rationale:              A result that cannot be tied to one exact graph and build cannot be trusted as evidence for a decision.
verification_method:    inspection
verification_approach:  The schema of the run record is read for the required fields.

