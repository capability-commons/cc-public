title:                  Dependent patch waits for its dependency
brief:                  |
                        A patch built on another queued patch waits
                        until that patch lands.
condition_kind:         logic
condition:              a patch depends on a queued patch that is not on dev
modal_verb:             shall
activity:               autonomous
object:                 the patch until the patch it depends on has landed, and flags it as stale if that patch changed after it was built on it
rationale:              The queue never assumes an unchanged dependency.
verification_method:    test
verification_approach:  A patch stacked on one in rework is not tried, and is marked stale once the patch below it changes.

