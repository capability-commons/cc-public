title:                  Tests at push omitted only on proof
brief:                  |
                        A push runs no tests that the queue has
                        provably already run.
modal_verb:             shall
activity:               autonomous
object:                 the tests of the [[commit gate]] at push for a tip only when a passing [[concept_commit_gate|gate]] result names that tip, with a policy and environment that match its own exactly
rationale:              Testing again at push would double the cost of each landing, but a result from a narrower selection or another environment proves nothing.
verification_method:    test
verification_approach:  A push of a tip with a matching result runs no tests; one with a result from the narrower selection of the commit gate runs them.

