title:                  Sender waits rather than drop
brief:                  |
                        A lossless edge never drops a message because
                        the receiver is slow.
condition_kind:         logic
condition:              the queue to the receiver is full and the delivery policy of the [[dataflow edge]] allows no loss
modal_verb:             shall
activity:               autonomous
object:                 each further message
qualifier:              until the queue has room
rationale:              Loss is allowed only where a delivery policy declares it.
verification_method:    test
verification_approach:  A slow receiver is fed by a fast sender.

