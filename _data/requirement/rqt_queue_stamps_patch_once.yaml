title:                  Patch stamped once with its age
brief:                  |
                        Each patch carries the time it was first
                        submitted, which never changes.
modal_verb:             shall
activity:               autonomous
object:                 each patch with a UTC time of first submission, unique within the queue, that it holds through conflict, rework and resubmission
rationale:              The timestamp in the name gives each patch its age with no extra machinery (WTP, 2026-10-30), and a fixed patch keeps its place rather than going to the back.
verification_method:    test
verification_approach:  Two submissions in the same second get different times, and a resubmitted patch keeps its first time.

