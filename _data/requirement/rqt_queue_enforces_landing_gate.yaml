title:                  Landing gate run on each patch
brief:                  |
                        Every patch is tested as it would land, before
                        it lands.
modal_verb:             shall
activity:               autonomous
object:                 the history rules on each replayed [[commit]] of a patch, and on its replayed tip the stages of the [[commit gate]] with every test not marked slow, as a landing run
rationale:              This follows the rule that dev only ever holds trees that passed the gate exactly as they are; the landing gate runs the selection of the gate at push, which is wider than the gate at commit.
verification_method:    test
verification_approach:  A patch whose tip fails a test marked prepush is not landed.

