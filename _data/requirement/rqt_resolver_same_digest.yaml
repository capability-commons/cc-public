title:                  Same input, same resolved graph
brief:                  |
                        Resolution is deterministic: the same inputs
                        give the same resolved graph, byte for byte in
                        its canonical form.
modal_verb:             shall
activity:               autonomous
object:                 the same content digest from the same input digest
qualifier:              on every host and every run
rationale:              Caches are keyed by the input digest and runs cite the content digest; both are worthless if resolution varies.
verification_method:    test
verification_approach:  One variant is resolved twice, in two fresh environments, and the digests are compared.

