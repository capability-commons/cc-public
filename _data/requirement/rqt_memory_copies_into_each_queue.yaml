title:                  Each queue gets its own copy
brief:                  |
                        Values are copied, not shared, between nodes.
modal_verb:             shall
activity:               autonomous
object:                 each value into each queue it enters
qualifier:              so that no two readers share a buffer
rationale:              Copying removes shared mutable memory between nodes, the simplest rule to reason about; memory tokens may come later as recorded exceptions.
verification_method:    test
verification_approach:  One output feeds two readers; one reader writes into its input.

