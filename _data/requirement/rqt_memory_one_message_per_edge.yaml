title:                  One message per Kahn edge
brief:                  |
                        Each Kahn edge holds one message at a time,
                        sized to its capacity.
modal_verb:             shall
activity:               autonomous
object:                 one message for each Kahn [[dataflow edge]], or two where its writer and its reader overlap in time
rationale:              One message per edge per local step makes memory use a sum the generator can compute.
verification_method:    inspection
verification_approach:  The buffer declarations of a generated build are read.

