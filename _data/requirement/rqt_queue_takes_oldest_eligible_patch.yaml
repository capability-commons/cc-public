title:                  Oldest eligible patch taken next
brief:                  |
                        The queue tests the oldest patch that is
                        ready, and nothing else holds it up.
modal_verb:             shall
activity:               autonomous
object:                 its next attempt to the oldest eligible candidate, ordered by the timestamp in the last segment of its name
qualifier:              without interrupting an attempt already running
rationale:              Ordering by the whole name would group patches by thread before time, and patches in conflict, in rework or waiting on a dependency must not hold up unrelated ones.
verification_method:    test
verification_approach:  With candidates from several threads and some patches blocked, the queue takes the oldest unblocked one.

