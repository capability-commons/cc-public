title:                  Commits signed with the queue's own key
brief:                  |
                        The queue signs what it replays with a key
                        registered for that purpose.
modal_verb:             shall
activity:               autonomous
object:                 each [[commit]] it replays with a signing key of its own, without a passphrase, kept only on atlas and registered under WTP beside his personal key
rationale:              WTP chose a dedicated key so that the queue runs unattended and its signatures are told apart from his own (WTP, 2026-10-30). The signature only identifies the key; the gate result and the patch record show that a commit passed.
verification_method:    inspection
verification_approach:  The register holds the queue's key under WTP, and each commit the queue landed is signed by it.

