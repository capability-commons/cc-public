title:                  Gate result captured
brief:                  |
                        Each completed gate run leaves exact evidence
                        of what passed.
modal_verb:             shall
activity:               autonomous
object:                 'a [[concept_commit_gate|gate]] result for each landing run: the signed [[commit]], the dev [[commit]] it was tested on, the policy and test selection, the environment and the outcome'
