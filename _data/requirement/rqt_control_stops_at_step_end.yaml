condition:              a stop request arrives
modal_verb:             shall
activity:               autonomous
object:                 each execution unit it names at the end of its current [[local step]]
rationale:              Stopping mid-step would leave messages half written.
verification_method:    test
verification_approach:  A stop is sent while a slow node runs.

