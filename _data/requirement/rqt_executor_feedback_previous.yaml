title:                  Feedback edge carries the previous local step
brief:                  |
                        Each loop is broken by one edge that is read
                        one local step late.
modal_verb:             shall
activity:               autonomous
object:                 the message of the previous [[local step]] on the one feedback [[dataflow edge]] of each loop, or in the first [[local step]] the default value of the port that supplies one
rationale:              Without that, a loop would have no order in which to run.
verification_method:    test
verification_approach:  A two-node loop with a counter is run.

