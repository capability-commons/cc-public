title:                  Failing patch parked for rework
brief:                  |
                        A patch that fails the landing gate goes back
                        for rework, every time.
condition_kind:         event
condition:              any stage of the landing run fails on a patch
modal_verb:             shall
activity:               autonomous
object:                 the patch to queue/03_rework, with the failing stage and its output, without retrying any test
rationale:              Every test failure, a flaky one included, goes to rework (WTP, 2026-10-30), so that flaky tests are fixed rather than hidden.
verification_method:    test
verification_approach:  A patch with a failing test ends in queue/03_rework with its note, and the test ran once.

