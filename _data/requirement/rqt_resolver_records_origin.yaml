title:                  Origin of every part of a resolved graph
brief:                  |
                        Every node, edge and setting in a resolved
                        graph can be traced to where it came from.
modal_verb:             shall
activity:               autonomous
object:                 each part of a [[resolved dataflow graph]] to the [[base]] and to every [[variant operation]] that touched it, in order
rationale:              A reviewer of a variant, and a failure report, need to know which operation made each part.
verification_method:    test
verification_approach:  A two-level variant is resolved and the origin of a twice-changed setting is read.

