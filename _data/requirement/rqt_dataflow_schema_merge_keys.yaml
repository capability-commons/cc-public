title:                  Merge key on every array of a dataflow graph
brief:                  |
                        Every array in a dataflow graph names the key
                        that picks out one element, so that a variant
                        operation can address it.
modal_verb:             shall
activity:               autonomous
object:                 a merge key for every array in the [[schema]] of a [[dataflow graph]]
rationale:              A variant operation that removes, rewrites or inserts on an element must name it; a key declared once in the schema serves every operation, every merge and every origin record.
verification_method:    inspection
verification_approach:  Each array in the schema of a dataflow graph is read for its declared key.

