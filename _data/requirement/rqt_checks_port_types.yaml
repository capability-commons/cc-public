title:                  Ends of an edge disagree on the value
brief:                  |
                        An edge joins ports that carry the same
                        declared value, or the check fails.
condition_kind:         logic
condition:              the two ends of a [[dataflow edge]] name different declarations in the dictionary
modal_verb:             shall
activity:               autonomous
object:                 a [[failure]] that names the [[dataflow edge]] and both declarations
rationale:              A mismatch would let a node read memory as the wrong shape.
verification_method:    test
verification_approach:  An edge joins an output of one declaration to an input of another.

