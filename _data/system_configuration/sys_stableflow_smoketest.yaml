title:                  Stableflow smoketest
brief:                  |
                        The smallest system that runs: a system
                        controller paces a process controller, which
                        passes each control packet to a printer.
description:            |
                        One host runs one process, which holds all
                        three nodes. The system controller sends a
                        control packet once a second and halts the
                        system after 300 steps. The process controller
                        passes each packet to the printer, which
                        prints it, and reports the load of its process
                        back to the system controller over a feedback
                        edge.
note:                   |
                        Ported from the smoketest configuration of
                        Stableflow in Design Factory
                        (pl/stableflow/_meta/smoketest.cfg.yaml). Two
                        changes: the process controller reads its
                        input as ctrl, which the original wires as
                        control, and the feedback edge is new, since
                        the original leaves the feedback of the
                        process unread.

