title:                  Every concern kept on a shared premise
brief:                  |
                        The merge step records a shared premise once,
                        with a link to each concern that rests on it,
                        so no concern loses its trace to the fact it
                        relies on.
description:            |
                        In the pilot the dependency-risk advocate's
                        "No Rust match for ruamel.yaml" was dropped as
                        a duplicate (note
                        advocate-pilot-tooling-language.md line 40),
                        until the owner allowed several concerns per
                        annotation (W 2026-10-14T21:51:15Z).
                        ann_round_trip_yaml_would_be_our_own_code now
                        carries maintainability and dependency risk
                        (lines 37-45), and
                        ann_souffle_is_outside_the_locked_environment
                        carries four concerns (lines 41-59). The
                        relation register asks for one annotation with
                        a link to each concern (reg_relation.yaml
                        lines 292-295). Limit: the merge is an agent's
                        judgement, and nothing checks that each
                        concern link matches what an advocate argued.

