title:                  Text search expanded through the graph
brief:                  |
                        SQL holds the prose of each item in item_text,
                        an FTS5 table. cctool query text ranks the
                        items that match by BM25, and names for each
                        its issue, the determination that settles it,
                        the decisions upheld, the standing of a
                        decision and the concerns of an annotation.
                        With --issue it gives one row for each issue.
description:            |
                        Built in pym_cc_public.graph.text and the text
                        command of pym_cc_public.cli.querying. Not
                        built yet: widening a query with the admitted
                        terms of a concept, and text hits as facts
                        that a Datalog rule can use.

