title:                  Text search expanded through the graph
brief:                  |
                        SQL holds the prose of each item in item_text,
                        an FTS5 table. cctool query text ranks the
                        items that match by BM25, and names for each
                        its issue, the determination that settles it,
                        the options upheld, the standing of an option
                        and the concerns of an annotation. With
                        --issue it gives one row for each issue.
description:            |
                        Built in pym_cc_public.graph.text and the text
                        command of pym_cc_public.cli.querying. A query
                        that names a concept also matches its other
                        preferred and admitted terms, and cctool query
                        datalog --text gives the hits to rules as
                        text_hit facts.

