title:                  Present tests that cannot vouch for a port
brief:                  |
                        Most tests call Python functions directly, not
                        cctool, and the rules call string functions
                        that follow Python semantics. A Rust port has
                        no evidence that it gives the same results
                        until new checks are written against it.
description:            |
                        161 test functions in ten files (count of def
                        test_ under src/**/_test/, 2026-10-15).
                        test_check.py (59), test_edit.py (38) and
                        test_graph.py (10) hold 107 of them and import
                        cc_public modules rather than drive cctool.
                        The rest run in the same Python process too,
                        through click.testing or by calling modules,
                        with git as the only program they start, so no
                        present test runs cctool as a separate
                        program. The rules call @match, @strlen and
                        @substr (src/cc_public/graph/datalog.py:38-43,
                        101-143; check.lp:60, 75, 171-183, 209, 469;
                        change.lp 115-118). @match uses re.fullmatch,
                        @strlen and @substr count code points, while
                        Rust str::len counts bytes and the Rust regex
                        crate has no lookaround or backreferences. The
                        regexes the rules use today have no lookaround
                        or backreference and the strings measured are
                        ASCII ids and guids, so no present result is
                        known to differ; the point is the missing
                        evidence. ASSUMPTION: tests rewritten to run
                        cctool as a separate program could serve both
                        languages.

