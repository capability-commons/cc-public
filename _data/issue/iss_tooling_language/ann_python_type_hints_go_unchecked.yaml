title:                  Type hints that nothing checks
brief:                  |
                        Most Python functions carry type hints, so a
                        diff shows each contract, but no type checker
                        runs in the gate, so the reviewer must check
                        each hint by reading. A Rust signature is one
                        the compiler has checked.
description:            |
                        140 of 169 function definitions outside tests
                        and conftest.py carry a return type hint
                        (Python ast over src at 89c74d8), for example
                        src/cc_public/edit/edit.py line 207. The gate
                        runs check, lint and test, and lint is ruff
                        only (src/cc_public/gate/gate.py lines 64-66;
                        pyproject.toml line 66), with no annotation
                        rules selected (pyproject.toml lines 93-97).
                        Weak against Python as such: adding mypy or
                        pyright to the gate would remove it without a
                        port (ASSUMPTION that it fits the gate's
                        time). It rests on the same fact as
                        ann_the_compiler_maps_a_change but asserts
                        what the reader of one diff can rely on, not
                        how far a change reaches.

