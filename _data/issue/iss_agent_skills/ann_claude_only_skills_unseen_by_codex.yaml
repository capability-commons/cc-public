title:                  Skills under .claude unseen by Codex
brief:                  |
                        Codex reads repository skills only from
                        .agents/skills, so skills kept only in
                        .claude/skills leave a Codex user without the
                        procedures unless they adopt Claude Code or
                        copy the files.
description:            |
                        Codex lists three repository skill locations,
                        all .agents/skills
                        (https://learn.chatgpt.com/docs/build-skills,
                        fetched 2026-10-15). Will names Codex as an
                        agent to serve (2026-10-14T08:51:24Z). Codex
                        follows linked skill folders (same page), so a
                        link from .agents/skills to .claude/skills
                        would also reach it; the challenge is to
                        having no .agents path at all. Grows with the
                        number of skills, since more procedure would
                        sit behind one vendor's path.

