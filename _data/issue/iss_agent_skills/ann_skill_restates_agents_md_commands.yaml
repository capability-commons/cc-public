title:                  Commands stated in both AGENTS.md and the skill
brief:                  |
                        The skill restates the cctool commands and
                        rules that AGENTS.md also states, so a reader
                        meets them twice and a change must be made in
                        both by hand, with nothing to check that it
                        was.
description:            |
                        Commands: AGENTS.md lines 36-55 and
                        .agents/skills/editing-data-items/SKILL.md
                        lines 32-55. The guid rule: AGENTS.md lines
                        44-45 and SKILL.md lines 110-111. The rename
                        rule: AGENTS.md lines 49-53 and SKILL.md lines
                        103-106. SKILL.md line 13 makes AGENTS.md the
                        reference, which keeps them from conflicting
                        today. No YAML, Python or logic file refers to
                        .agents, SKILL.md or editing-data-items, so
                        cctool check does not see the skill. SKILL.md
                        also names 13 failure ids, 11 from
                        src/cc_public/check/check.lp and 2
                        (schema_violation, unformatted_file) from
                        check.py. SKILL.md changed in 10 of 33 commits
                        from 7dda99e to 89c74d8, AGENTS.md in 7.
                        Shared commands were changed in both by hand
                        in the same commit in afbcf6f and 29cb646, but
                        af6ec6e added unlink and unset to SKILL.md
                        alone, and AGENTS.md listed them only from
                        29cb646, two commits later. Bears equally on
                        opt_skills_in_claude_dir. It is cured by
                        moving procedure out of AGENTS.md, not by
                        dropping skills.

