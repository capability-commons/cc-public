title:                  Violation that names the failed restriction
brief:                  |
                        A failing edge is reported with the end and
                        the restriction it fails, and the relation
                        page reads each end as a sentence, so a reader
                        can trace why an edge is refused.
description:            |
                        restriction_violation has the columns source,
                        relation, target, end and restriction
                        (src/cc_public/check/check.lp).
                        pym_cc_public.web.restriction writes, for
                        example, "The source is an argument." on the
                        page of r_supports.

