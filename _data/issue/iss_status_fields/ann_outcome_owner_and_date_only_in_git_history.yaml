title:                  Owner and date of an outcome only in git history
brief:                  |
                        Who made a determination, and when, comes only
                        from the commit that adds it. Files exchanged
                        without their history lose it, and the squash
                        of 2026-10-14 shows that the history itself
                        can be rewritten.
description:            |
                        _data/schema/sch_determination.yaml lines
                        33-36. memory/lifecycle-and-status.md ("How to
                        apply") says the outcome item supplies the
                        owner and timestamps, which the schema note
                        contradicts. The history was squashed on
                        2026-10-14, and 44034ef and 0d2e23a survive
                        only under the tag pre_squash_20261014. The
                        removed status enums held no author or time
                        either. ASSUMPTION: a partner who receives the
                        data files without the repository history
                        cannot recover the owner or date of an
                        outcome.

