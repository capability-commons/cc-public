title:                  Status values traced to no authority
brief:                  |
                        Each status value was the same uniform value,
                        set by no one for a stated reason. The field
                        asserted an outcome with no trace to who
                        produced it, and a partner reading it would
                        take an unbacked claim as fact.
description:            |
                        Commit 44034ef message: 68 values, all draft
                        or proposed, read by nothing. The removed
                        entry_status was described as "Lifecycle
                        status of this entry", with a note that
                        deprecated entries stay resolvable, and named
                        no one who sets a value or why (git show
                        44034ef^:_data/schema/sch_register_entry.yaml
                        lines 69-72, 93-107). No authority to make a
                        transition, record of who made it, or consumer
                        of the result existed
                        (memory/lifecycle-and-status.md lines 10-13).

