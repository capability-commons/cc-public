title:                  Outcome absent from the decision file
brief:                  |
                        Whether a decision stands is derived from
                        determinations, their edges and supersession
                        over the whole graph, not read from the
                        decision's own file. A partner or any consumer
                        outside the checker must load the graph and
                        reproduce that rule.
description:            |
                        current_determination uses negation over all
                        r_supersedes edges
                        (src/cc_public/check/check.lp lines 389-398,
                        commit 89c74d8). Upholds and rejects are edges
                        on the determination
                        (_data/schema/sch_determination.yaml lines
                        24-28). Nygard's format keeps Status inside
                        the record; MADR has an optional status field
                        (https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions,
                        https://adr.github.io/madr/). The checker
                        already loads the whole tree on each run
                        (src/cc_public/check/check.py lines 66-80),
                        and one evaluation took about 0.12 s on the
                        tree of 2026-10-14. No second consumer exists
                        yet.

