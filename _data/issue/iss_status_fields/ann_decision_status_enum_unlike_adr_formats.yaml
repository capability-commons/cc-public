title:                  Decision status enum unlike common ADR formats
brief:                  |
                        The removed decision status enum held only
                        proposed, accepted and rejected. It had no
                        deprecated or superseded value, so it did not
                        map without loss to Nygard records or MADR.
description:            |
                        Before 44034ef the enum held three values, and
                        the schema note said there was no superseded
                        status because r_supersedes records
                        replacement (git show 44034ef, diff of
                        _data/schema/sch_option.yaml). Nygard's format
                        and MADR both have deprecated and superseded
                        values:
                        https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
                        and https://adr.github.io/madr/ . A search of
                        the tree at 89c74d8 for "adr", "madr" and
                        "export" finds no tooling that exchanges
                        decisions with another system.

