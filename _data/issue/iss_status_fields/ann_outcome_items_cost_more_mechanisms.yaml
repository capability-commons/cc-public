title:                  Outcome items costing more mechanisms than a field
brief:                  |
                        Recording outcomes as items of their own added
                        a type, a schema, two relations, a widened
                        r_supersedes and several check rules, where an
                        enum on sch_option was one field and one
                        definition.
description:            |
                        Bears on the second clause of the chosen
                        option, "record outcomes as items of their
                        own". Before 44034ef: one status property and
                        a three-value enum in sch_option. Commit
                        7db4229 adds t_determination, r_upholds and
                        r_rejects and a check; sch_determination.yaml
                        is a separate schema; check.lp lines 133-155,
                        318-413 and 439-453 hold the rules that
                        involve determinations; 89c74d8 widens
                        r_supersedes to two types. The extra
                        mechanisms buy attribution and settling
                        several alternatives at once, which an enum
                        lacks.

