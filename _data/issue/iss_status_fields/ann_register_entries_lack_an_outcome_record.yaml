title:                  Register entries with no outcome record
brief:                  |
                        Status was removed from registers and entries
                        as well as decisions, but the outcome item
                        that replaces it covers decisions only.
                        Nothing now records that an entry was adopted,
                        or marks one as retired.
description:            |
                        Commit 44034ef removed status from
                        sch_register, sch_register_entry and
                        sch_option. The range of r_upholds and
                        r_rejects is t_option only
                        (_data/register/reg_relation.yaml lines 374,
                        401); r_supersedes covers t_option and
                        t_determination only (lines 262-268). The
                        removed entry_status held deprecated, "new
                        writes should prefer any replacement named in
                        note"; term_deprecated survives on concept
                        entries only
                        (_data/schema/sch_regentry_concept.yaml line
                        70). Concern entries carry no edges, for
                        example concern_traceability
                        (_data/register/reg_concern.yaml line 521). At
                        44034ef no entry was deprecated. The enum gave
                        no reason either, so this is a gap in the
                        replacement, not a case for the enum.

