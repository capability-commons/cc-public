title:                  Lifecycle changes that leave decisions untouched
brief:                  |
                        With outcomes as items of their own, the
                        lifecycle is built and changed through new
                        types, relations and rules, with no edit to
                        existing decisions. A status on every item
                        makes each lifecycle change a sweep that grows
                        with the graph.
description:            |
                        Commits 7db4229, 3d7ef5b and 89c74d8 add
                        t_determination, r_upholds, r_rejects, driver
                        checks and supersession of determinations;
                        their file lists hold registers, schemas, the
                        skill file, check rules and tests, and no
                        decision item (git show --stat). 7db4229
                        changes sch_decision.yaml by 10 lines only.
                        Removing the enums in 44034ef touched 9 files
                        and 68 values. ASSUMPTION: under a status
                        enum, building that machinery would have meant
                        keeping status in step with determinations or
                        rewriting status on existing decisions.
                        ASSUMPTION: status values scale with item
                        count.

