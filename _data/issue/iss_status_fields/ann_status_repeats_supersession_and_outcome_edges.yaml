title:                  Status restating supersession and outcome edges
brief:                  |
                        A decision status enum would record a fact
                        that edges already record. Accepted or
                        rejected would now repeat r_upholds and
                        r_rejects, as a superseded status would have
                        repeated r_supersedes, so one job would have
                        two mechanisms.
description:            |
                        register_status held draft, under_review,
                        accepted, superseded and withdrawn (git show
                        44034ef^:_data/schema/sch_register.yaml lines
                        92-99), but r_supersedes then ran between
                        decisions only (git show
                        44034ef^:_data/register/reg_relation.yaml
                        lines 214-218), so those register values had
                        no edge to repeat. sch_decision already
                        dropped a superseded status so that "the fact
                        is held once" (git show
                        44034ef^:_data/schema/sch_decision.yaml lines
                        36-40). r_supersedes:
                        _data/register/reg_relation.yaml lines
                        241-270. r_upholds and r_rejects: same file,
                        lines 358-401, added in 7db4229.

