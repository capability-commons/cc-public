title:                  Status value with no author
brief:                  |
                        A status value says what state a requirement
                        is in, but not who put it there or why. An
                        outcome kept as its own item can say both.
description:            |
                        A determination names the decisions it upholds
                        or rejects, and the commit that adds it
                        records who and when (sch_determination). A
                        status field would hold only the value.

