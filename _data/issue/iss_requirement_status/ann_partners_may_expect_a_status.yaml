title:                  Partners that may expect a status
brief:                  |
                        The INCOSE guide lists status among the
                        attributes of a requirement, so a partner
                        exchanging requirements may expect one.
description:            |
                        INCOSE Guide for Writing Requirements,
                        revision 3 (2019), section 5, includes status
                        attributes. Leaving the field out defers the
                        question rather than answering it with a value
                        set of our own.

