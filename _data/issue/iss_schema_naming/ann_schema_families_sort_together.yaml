title:                  Schema families sorted side by side
brief:                  |
                        With the general word first, the schemas of
                        one family sit in one contiguous run wherever
                        files are listed or diffed by path. A person
                        finds, changes or reviews a family as one
                        block.
description:            |
                        _data/schema at 89c74d8 holds 31 files, with
                        contiguous runs of sch_reg_* (6),
                        sch_regentry_* (6) and sch_trait_* (4). ls
                        sorts by collating sequence (POSIX ls,
                        https://pubs.opengroup.org/onlinepubs/9699919799/utilities/ls.html).
                        git diff --stat lists files in path order; in
                        ae6eeff the sch_reg_* edits and the
                        sch_regentry_* renames each appear as one run
                        (git show --stat ae6eeff). sch_standalone
                        composes three traits by $ref
                        (_data/schema/sch_standalone.yaml lines
                        40-43). ASSUMPTION: shell completion groups
                        names by shared leading characters (not
                        checked). The gain grows with the number of
                        schemas.

