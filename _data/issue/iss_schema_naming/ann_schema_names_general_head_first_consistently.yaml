title:                  One consistent general-to-specific order
brief:                  |
                        Every schema id puts the subject first and
                        runs from general to specific. The owner keeps
                        this order for consistency and accepts that
                        some names read clumsily.
description:            |
                        Session summary from the "Relation graph
                        applications" thread, pasted by the owner on
                        2026-10-09T17:52:14Z (will-messages.md line
                        55); the wording is the summary's, not
                        necessarily the owner's own: "Schema naming.
                        Subject-first, general to specific. Field
                        bundles are sch_trait_*; the item envelope is
                        sch_standalone". August note
                        (cc-public-session-context.md line 27):
                        "Consistency wins here, despite the
                        clumsiness". That note sits in a list about
                        identifiers and registers and does not name
                        schema naming, so its link to this issue is an
                        inference. Decision made at bb8c338.

