title:                  Unchecked schema naming rule
brief:                  |
                        No check enforces the naming rule beyond the
                        sch_ prefix, so a reviewer judges each new or
                        renamed schema id by eye.
description:            |
                        A search of src/ at 89c74d8 for "sch_trait_*",
                        "subject first" and "naming" finds no match.
                        The only check on a schema id is regex_id
                        ^sch_[a-z][a-z0-9_]*$ on t_schema
                        (_data/register/reg_data_item_type.yaml line
                        132). The session summary pasted by the owner
                        calls the term-resolution part of the rule
                        "proposed, not yet enforced" (will-messages.md
                        line 55). The cost grows with the number of
                        new names until a check exists.

