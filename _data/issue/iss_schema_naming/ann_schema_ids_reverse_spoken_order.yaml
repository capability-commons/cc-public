title:                  Ids in reverse of spoken order
brief:                  |
                        People say "the descriptive trait" but the id
                        is sch_trait_descriptive, so a name recalled
                        as spoken is typed in the wrong order. Where
                        the slip is in a reference, the dangling
                        reference check catches it, so it costs time,
                        not a silent error; a slip in prose is not
                        checked.
description:            |
                        English compound nouns put the head last
                        (https://en.wikipedia.org/wiki/Head_(linguistics)).
                        The prose "the descriptive trait" in the
                        session summary pasted by the owner
                        (will-messages.md line 63) against
                        _data/schema/sch_trait_descriptive.yaml.
                        dangling_reference in
                        src/cc_public/check/check.lp lines 226-239;
                        sch_* references collected in
                        src/cc_public/graph/extract.py line 76. The
                        advocate rates this point weak.

