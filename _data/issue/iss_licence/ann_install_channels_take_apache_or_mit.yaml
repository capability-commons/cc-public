title:                  Install channels open to either licence
brief:                  |
                        The channels through which cc-public would
                        reach a new platform (conda-forge, PyPI,
                        Debian main) take Apache-2.0 and MIT alike, so
                        the licence does not limit where cc-public can
                        be installed.
description:            |
                        The pixi workspace uses the conda-forge
                        channel and targets osx-arm64 and linux-64
                        (pyproject.toml lines 51-52, at 89c74d8).
                        conda-forge asks that the licence field is
                        correct, recommends an SPDX identifier with
                        "Apache-2.0" as its example, asks for a
                        licence file where the licence requires one,
                        and lists no excluded permissive licence
                        (https://conda-forge.org/docs/maintainer/adding_pkgs,
                        fetched 2026-10-15). Debian lists both the
                        Apache License and Expat/MIT-style licences
                        among the licences found in Debian main
                        (https://www.debian.org/legal/licenses/index.en.html,
                        fetched 2026-10-15). PyPI takes the licence as
                        any SPDX expression in License-Expression
                        (https://peps.python.org/pep-0639/, PEP 639).
                        pyproject.toml declares license = "Apache-2.0"
                        (line 37) and LICENSE is in the repository
                        (commit a0b3f50). The stated platform limits
                        are technical: no Windows development because
                        of symbolic links and a POSIX shell (README.md
                        lines 28-30). The point favours neither option
                        over the other. ASSUMPTION: cc-public is not
                        yet published to any package channel, and no
                        source records a plan to publish it.

