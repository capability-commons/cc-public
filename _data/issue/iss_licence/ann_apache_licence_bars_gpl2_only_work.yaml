title:                  Apache-2.0 work barred from GPL-2.0-only work
brief:                  |
                        Apache-2.0 work cannot be combined with
                        GPL-2.0-only work, while MIT work can. This
                        closes off GPL-2.0-only partners and
                        GPL-2.0-only dependencies.
description:            |
                        The ASF states that the FSF has never
                        considered Apache-2.0 compatible with GPL
                        version 2, citing its patent termination and
                        indemnification terms; Apache-2.0 work can go
                        into GPLv3 projects
                        (https://www.apache.org/licenses/GPL-compatibility.html,
                        fetched 2026-10-15). The FSF lists the Expat
                        (MIT) licence as GPL-compatible
                        (https://www.gnu.org/licenses/license-list.html#Expat;
                        one advocate could not fetch it). No package
                        in the current lock is GPL-2.0-only (pixi.lock
                        license lines). ASSUMPTION: no GPL-2.0-only
                        partner or dependency is on record or named.
                        Will plans larger graphs that take in logs,
                        coverage, ASTs and taint graphs (Will,
                        2026-10-13T20:05:25Z), and tools for these
                        might be GPL-2.0-only; this matters only for
                        code linked and distributed with cc-public,
                        not for separate programs whose output it
                        reads.

