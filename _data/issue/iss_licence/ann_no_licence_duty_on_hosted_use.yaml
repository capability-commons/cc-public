title:                  No licence duty on hosted or scaled use
brief:                  |
                        Under both licences the conditions attach to
                        redistribution, not to running the software,
                        so cc-public can run on any host, as a shared
                        service or across many machines with no duty
                        to offer source.
description:            |
                        Apache-2.0 section 2 grants the right to
                        reproduce, publicly perform and distribute,
                        and its conditions sit in section 4,
                        "Redistribution" (LICENSE lines 67-72 and
                        90-93). LICENSE has no clause on use over a
                        network (grep for "network" finds nothing, at
                        89c74d8). MIT conditions apply to "all copies
                        or substantial portions of the Software"
                        (https://opensource.org/license/mit). A
                        network-copyleft licence such as AGPL would
                        add such a duty; neither alternative is one.
                        Will is "tempted to eventually bring in much
                        larger graphs" with logs, test coverage, ASTs
                        and taint graphs (Will, 2026-10-13T20:05:25Z),
                        so bigger hosts are a plausible future; no
                        source mentions shared or multi-machine use.
                        The point stops holding only if a
                        network-copyleft dependency is added.
                        ASSUMPTION: no hosted or multi-machine
                        deployment of cc-public is on record.

