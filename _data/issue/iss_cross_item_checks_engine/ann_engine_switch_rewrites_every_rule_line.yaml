title:                  Engine switch rewrites every rule line
brief:                  |
                        Moving the rules between Souffle and clingo
                        changes almost every line, so the change
                        cannot be judged line by line, and the
                        determination plans to revisit the choice,
                        which would bring a second change of the same
                        kind.
description:            |
                        The move to clingo was one commit of 28 files,
                        1,199 lines added and 1,110 removed (git show
                        --stat 6230e98). Apart from blank lines, no
                        line of check.dl or derive.dl and only 9 lines
                        of change.dl reappear unchanged in the .lp
                        files, and diff reports 1,050, 407 and 172
                        changed lines for the three pairs (diff of
                        6230e98^:*.dl against 6230e98:*.lp). Git shows
                        each rule file as deleted and added, not
                        renamed (git diff -M30% 6230e98^ 6230e98). The
                        changes are mostly syntax, and no conversion
                        script was committed to be reviewed in place
                        of the output. det_cross_item_checks_engine
                        says Souffle may return when the graph is
                        larger, and check.lp has grown from 524 to 643
                        lines since the move (6230e98 to 89c74d8), so
                        a switch grows with the rules. A move back to
                        Souffle now would cost the same rewrite, now
                        of 949 lines of rules. It argues for settling
                        on the engine that will be kept, and
                        challenges clingo only as an interim choice.
                        ASSUMPTION: no translator script exists
                        outside the repository.

