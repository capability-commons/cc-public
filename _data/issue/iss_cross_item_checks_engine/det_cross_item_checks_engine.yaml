title:                  Cross-item checks engine
brief:                  |
                        The cross-item checks move to clingo, which
                        pixi can pin, until the graph is large enough
                        for speed to be measured. At that size the
                        choice is to be revisited, and Souffle may
                        return. Determined by William Payne, who
                        judged that the graph is too small for the
                        speed argument to count.

