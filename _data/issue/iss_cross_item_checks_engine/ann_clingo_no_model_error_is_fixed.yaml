title:                  No-model result now an error
brief:                  |
                        Commit 627e2b5 "Fix datalog.run so that clingo
                        warnings and no answer set are errors" makes
                        run() raise when the rules have no answer set
                        or more than one. At 360ec14 an empty or
                        arbitrary model is no longer read as no
                        failures.
description:            |
                        run() asks clingo for two models and raises
                        ErrorDatalog when it finds none ("The rules
                        have no answer set") or a second ("more than
                        one answer set")
                        (src/cc_public/graph/datalog.py lines 316-337
                        at 360ec14). cctool check turns ErrorDatalog
                        into exit status 2
                        (src/cc_public/cli/checking.py lines 57-61).
                        The point now bears on clingo only as it was
                        configured before the fix; Souffle still
                        forbids the program shapes by construction
                        rather than at run time.

