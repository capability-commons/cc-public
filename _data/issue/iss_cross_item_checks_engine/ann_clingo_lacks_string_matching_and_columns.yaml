title:                  clingo lacks string matching and declared columns
brief:                  |
                        The rules use match, strlen, cat and substr
                        twenty times, which clingo does not provide,
                        so those tests would move into Python
                        functions, and clingo has no declarations from
                        which the tooling could take column names.

