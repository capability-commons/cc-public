title:                  No trace from a decision to what builds it
brief:                  |
                        The chosen form traces a decision back to its
                        reasons, but no edge links a decision to the
                        element that carries it out. An upheld
                        decision that nothing builds is not found.
description:            |
                        Sources: none of the thirteen relations in
                        _data/register/reg_relation.yaml runs from a
                        schema, module or other element to a decision
                        or determination. r_realizes runs only to a
                        logical component (lines 325-356), and issues
                        are about logical components. No rule in
                        check.lp joins r_upholds with r_realizes. In
                        legacy, "20 decision records decided tools
                        that were never built"
                        (cc-public-session-context.md lines 61-63).
                        The other two alternatives share the gap. The
                        gap grows as one component gathers many
                        decisions.

