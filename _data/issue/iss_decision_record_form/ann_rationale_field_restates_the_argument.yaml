title:                  Second place for reasons
brief:                  |
                        A record that holds its own reasoning gives
                        the system two places for the reasons behind a
                        decision, since annotations already support or
                        challenge items. The chosen form keeps one.
description:            |
                        Sources: reg_data_item_type.yaml lines 391-393
                        (an annotation holds one assertion);
                        reg_relation.yaml lines 198-203 and 228-233
                        (r_supports and r_challenges reach decisions);
                        sch_option.yaml lines 27-31 (no rationale
                        field). Every argued decision with a rationale
                        field would carry its reasons twice.

