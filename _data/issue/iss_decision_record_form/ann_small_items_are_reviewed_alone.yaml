title:                  Small and separable changes
brief:                  |
                        Each change adds or edits one short item that
                        states one choice or one assertion, so a
                        reviewer can read it in full and judge it
                        alone. A rationale field mixes choice and
                        reasoning in one document.
description:            |
                        Sources: sch_option.yaml lines 17-31 and 36-41
                        (only a brief; outcome is a separate
                        determination).
                        opt_cross_item_checks_in_clingo is 22 lines
                        with a brief of 3. Each argument lives in its
                        issue folder (commit 1ba2895). Item size does
                        not grow with the graph, but this does not
                        answer the total volume. ASSUMPTION: a legacy
                        record was longer and was edited in place when
                        its reasoning changed; no legacy record is in
                        the snapshot.

