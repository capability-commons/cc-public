title:                  Reasons in a field with no concern each
brief:                  |
                        A record that holds its reasoning in one field
                        gives no edge from any single reason to the
                        concern it serves. A missing or over-weighted
                        concern cannot be found by a check.
description:            |
                        Sources: the legacy design decision records
                        (132) "hold the reasoning"
                        (cc-folder-survey.md line 28;
                        cc-folder-layout.md line 12). The checks read
                        edges, not prose (check.lp lines 417-453); a
                        mention in prose gets no relation. Owner's
                        aim, 2026-10-13T16:42:36Z. ASSUMPTION: the
                        rationale field is prose with reasons for
                        several concerns mixed; the legacy schema is
                        not in the clone.

