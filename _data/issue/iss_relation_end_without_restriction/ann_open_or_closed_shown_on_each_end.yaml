title:                  Open or closed shown on each end
brief:                  |
                        Whether an end is open is visible on the
                        relation entry: it names restrictions or it
                        does not. The open ends of r_has_actor and
                        r_has_process stay open as chosen.
description:            |
                        The relation page says "The target is open to
                        any item." for an end with no restriction
                        (pym_cc_public.web.restriction). Closing an
                        end later is one edge, as for r_has_subject.

