title:                  Coarser blame in the argument trace
brief:                  |
                        If a decision fails because a part could not
                        be checked, the trace can only name
                        maintainability as under-represented, and no
                        maintainability measure covers checking.
description:            |
                        The trace is meant to show which concern was
                        under- or over-represented when a decision
                        turns out wrong (owner's statement,
                        2026-10-13T16:42:36Z). An annotation names its
                        concern through r_argues_for_concern (check.lp
                        lines 430-435), so one concern is the finest
                        grain of blame. By the same premises this
                        supports dec_testability_separate. ASSUMPTION:
                        failures of testability will be frequent
                        enough for this to matter. None is recorded
                        yet.

