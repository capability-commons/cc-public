title:                  Overlap left by the split
brief:                  |
                        The split was made so the two would not
                        overlap, but both entries still covered
                        finding a fault and fixing it, so it added a
                        concept without removing a shared job.
description:            |
                        Commit 6cabbb1 message: "so the two do not
                        overlap". In 6cabbb1 the testability entry
                        asked "How quickly does a failing check lead
                        to its cause?", while maintainability kept
                        "changed and repaired" and gained "What does
                        it take to repair a fault once in use?" (git
                        show 6cabbb1:_data/register/reg_concern.yaml
                        lines 313, 327, 392, 401, 405). ASSUMPTION:
                        repairing a fault includes finding its cause.

