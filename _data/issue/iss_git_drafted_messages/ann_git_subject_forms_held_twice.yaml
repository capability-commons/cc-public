title:                  Git subject forms held in two places
brief:                  |
                        The subject forms git drafts are written once
                        in the sch_commit title pattern and again as
                        regular expressions in message.py, so a new
                        form must be added in both.
description:            |
                        _data/schema/sch_commit.yaml line 50;
                        src/cc_public/commit/message.py lines 87-89.
                        Before 4e6db4c the pattern held only Merge
                        branch ... into ... and Revert "..."; the four
                        other merge words and Reapply came with the
                        hook, because it keeps git's subject (git show
                        4e6db4c). ASSUMPTION: by hand, authors would
                        use the one Merge branch form. Grows if squash
                        or fixup drafts are later converted the same
                        way.

