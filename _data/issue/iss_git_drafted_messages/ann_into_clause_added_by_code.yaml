title:                  Into clause added by code
brief:                  |
                        The hook runs git rev-parse to add the into
                        clause that git leaves out of a merge into
                        main. One git setting, or a pattern that lets
                        the clause be absent, would do the same
                        without that code.
description:            |
                        _data/schema/sch_commit.yaml lines 50 and
                        62-70; src/cc_public/commit/message.py lines
                        158-160 and 185-196. With git 2.43.0 a merge
                        into main drafts "Merge branch 'f'", and with
                        merge.suppressDest set empty it drafts "Merge
                        branch 'f' into main" (test in a scratch
                        repository, 2026-10-15). pixi run hooks
                        already sets git config (pyproject.toml line
                        68). Later that day the owner approved, as
                        "the wiser choice", an assistant proposal not
                        to add machinery for every git path
                        (2026-10-14T14:46:15Z, 14:47:25Z); AGENTS.md
                        lines 25-29, in the assistant's words, say a
                        rule that keeps needing exceptions is fixed in
                        the rule. A small point: it removes one helper
                        and one regular expression, not the hook.

