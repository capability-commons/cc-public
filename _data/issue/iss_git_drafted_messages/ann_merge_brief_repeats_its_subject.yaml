title:                  Merge brief that repeats its subject
brief:                  |
                        For a merge with no body, the drafted brief
                        only repeats the subject and the check accepts
                        it, so the item says neither why the merge was
                        made nor how any conflict was resolved.
description:            |
                        draft sets the brief to git's body, or to the
                        subject and a full stop
                        (src/cc_public/commit/message.py line 166).
                        The plain merge test expects the brief "Merge
                        branch 'topic' into main." and a passing
                        message
                        (src/cc_public/commit/_test/test_draft.py
                        lines 100-104). git's "# Conflicts:" lines are
                        kept as comments (test_draft.py lines
                        130-132), outside the item. git strips them
                        when the message is edited and keeps them, as
                        plain text, with --no-edit (default cleanup is
                        strip when editing, whitespace otherwise;
                        https://git-scm.com/docs/git-commit,
                        --cleanup; tested with git 2.43.0). AGENTS.md
                        lines 22-24 tell authors to keep the message
                        git drafts. t_commit records "what it changes
                        and why" (reg_data_item_type.yaml lines
                        698-700). There are no merge commits yet (git
                        log --merges). A revert does carry git's "This
                        reverts commit HASH." as its brief.
                        ASSUMPTION: a hand-written brief more often
                        states a reason; nothing checks that it does.

