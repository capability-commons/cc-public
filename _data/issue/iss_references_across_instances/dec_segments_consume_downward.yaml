title:                  Segments with directional consumption
brief:                  |
                        Each repository declares a segment and the
                        segments it consumes. A reference may run
                        within a segment or into one it consumes,
                        never upward or sideways, and a consumer's
                        gate checks the union of its own roots and
                        what it consumes.

