title:                  Fault points of per-path hooks
brief:                  |
                        Each added hook is another process that must
                        start and finish for a git operation to go on,
                        so each one adds a way for one environment
                        fault to block work.
description:            |
                        Each existing hook runs "pixi run --frozen
                        ...", so each depends on a working pixi
                        environment (last line of each file in
                        .githooks). The gate takes about 75 s, and a
                        remote device tool call dies at 180 s (memory
                        MEMORY.md, "Gate parallel" and "Clingo switch
                        done"). ASSUMPTION: a hook that fails partway
                        through a rebase leaves the rebase stopped, to
                        be resumed or aborted by hand.

