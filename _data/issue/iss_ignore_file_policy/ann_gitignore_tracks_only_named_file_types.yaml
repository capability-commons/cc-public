title:                  Tracked file types named explicitly
brief:                  |
                        The file types meant for revision control must
                        be named explicitly in .gitignore, as the file
                        states of itself.
description:            |
                        Source: the description of the .gitignore
                        item, repo/.gitignore lines 17-21, in commit
                        bb8c338 under Will's name (2026-10-09). This
                        is the file's own text, not a reason Will gave
                        in a message. His message of
                        2026-10-09T17:52:14Z (a pasted session
                        summary) calls it "a whitelist .gitignore" but
                        gives no reason. The concerns linked are
                        inferred from the text: naming what is tracked
                        keeps control of the repository's content and
                        guards against committing a file by mistake.

