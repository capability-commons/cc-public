title:                  Documented edge model unlike the code
brief:                  |
                        The schema says the guid resolves and the
                        readable id must never be used to resolve, but
                        the tooling does the reverse. A newcomer who
                        learns the design from the schema learns the
                        opposite of what the code does.
description:            |
                        The schema calls the guid "the sole resolvable
                        reference in the edge" and says of id_target
                        "Never resolve by this field"
                        (_data/schema/sch_trait_relation.yaml lines
                        116 and 131-132). The editor removes an edge
                        by matching (id_relation, id_target)
                        (src/cc_public/edit/edit.py lines 462-464).
                        See ann_edge_tooling_resolves_by_readable_id
                        for the checks. The gap widens as tools are
                        added, since new tools written from the schema
                        would resolve by guid. From the
                        maintainability advocate.

