title:                  Readable ids not resolvable across a federation
brief:                  |
                        An edge names its relation by guid for the
                        same reason it names its target by guid. A
                        readable id is not reliably resolvable across
                        a federation.
description:            |
                        Recorded reason, written by an assistant, not
                        by Will: _data/schema/sch_trait_relation.yaml,
                        added in commit bb8c338. The same text keeps
                        the readable id "so that edges stay legible in
                        diffs" and greppable. The August session had
                        decided "Relation types have no guids"
                        (notes/cc-public-session-context.md line 17);
                        memory/cc-public-design-principles.md line 17
                        records that this no longer holds. The note
                        cc-public-stocktake-2026-10-13.md says the
                        shape is the same as in the legacy design.

