title:                  Same check results from both ways
brief:                  |
                        No check follows support chains or computes
                        defeat, so a condition inside its argument
                        gives the same check results and uses the same
                        mechanisms. The difference is only in what a
                        reader can point at.
description:            |
                        argued/2 looks only at annotations with a
                        direct edge to a decision
                        (src/cc_public/check/check.lp lines 418-435).
                        r_challenges is read only for practicality and
                        for argued/2 (lines 427-434 and 557-562).
                        reg_relation.yaml lines 223-225 says nothing
                        computes which assertion prevails. This holds
                        only while the checks stay as they are; if the
                        tooling came to evaluate arguments or read
                        dates, it would favour the separate condition.
                        ASSUMPTION: folding the condition into its
                        argument changes no check result.

