title:                  Whole item for each condition
brief:                  |
                        Each condition needs a full item with
                        identity, rights and relations, which must be
                        kept, moved and reviewed. Most of what a
                        reviewer reads in it is not the condition.
description:            |
                        ann_gate_takes_a_minute is about 32 lines; its
                        title, brief and description take lines 11-20.
                        The issue folders hold 29 annotation files of
                        1025 lines, about 35 lines each (wc -l over
                        _data/issue/*/ann_*.yaml). The item was moved
                        in commit 1ba2895. Owner's statement,
                        2026-10-14T21:51:15Z: "I do feel that
                        annotations might quickly explode out of
                        control". ASSUMPTION: a condition inside its
                        argument adds two to four lines.

