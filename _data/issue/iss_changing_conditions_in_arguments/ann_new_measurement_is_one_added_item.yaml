title:                  New measurement as one added item
brief:                  |
                        With the condition held apart, a new
                        measurement is one added item that names what
                        it challenges. No existing argument is edited,
                        so the change is small to make and to review.
description:            |
                        Commit 86df114 adds one file of 32 lines and
                        edits no other (git show --stat 86df114).
                        ann_gate_takes_a_minute says a later, slower
                        measurement challenges it
                        (_data/issue/iss_tooling_language/ann_gate_takes_a_minute.yaml
                        lines 16-20). ASSUMPTION: with the condition
                        inside the argument, the same update edits
                        that argument's brief, mixing the new fact
                        with the reasoning that rests on it.

