title:                  Condition with its own id
brief:                  |
                        A condition kept as its own annotation has an
                        id, so a later measurement can challenge it
                        alone and the graph can follow what rests on
                        it. Stated inside an argument, only the whole
                        argument can be challenged.
description:            |
                        An edge targets a whole item; nothing
                        addresses part of an item's prose
                        (_data/schema/sch_annotation.yaml lines 27-31;
                        _data/register/reg_relation.yaml lines
                        177-233). r_challenges takes an annotation as
                        object (reg_relation.yaml lines 228-233).
                        ann_gate_takes_a_minute supports
                        ann_python_is_fast_enough, which supports
                        dec_tooling_in_python
                        (_data/issue/iss_tooling_language/, files of
                        those names). Commit 86df114 shows a later
                        measurement naming its target by id.

