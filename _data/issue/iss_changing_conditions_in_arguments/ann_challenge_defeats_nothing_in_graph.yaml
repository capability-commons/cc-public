title:                  Challenge that defeats nothing in the graph
brief:                  |
                        A challenge does not defeat what it
                        challenges, and nothing computes which
                        assertion prevails. The support of a
                        challenged condition falls away only if a
                        person judges that it does.
description:            |
                        Source: _data/register/reg_relation.yaml lines
                        223-226 ("A challenge does not defeat what it
                        challenges. Nothing here computes which
                        assertion or choice prevails"), present since
                        commit 7dda99e and at 6592fb5. This bears on
                        the assistant-written claim in 6592fb5 that
                        the support falls away. It does not contradict
                        the owner's aim, which asks only that the
                        system capture shifting conditions.

