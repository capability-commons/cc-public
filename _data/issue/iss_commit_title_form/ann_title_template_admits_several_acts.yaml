title:                  One act per commit left to the writer
brief:                  |
                        The pattern constrains the first word and the
                        joining word only, so a title may still name
                        several objects or a second act. One verb per
                        commit rests on the writer and on the partial
                        verb check.
description:            |
                        sch_commit line 50 accepts any text after Add,
                        Remove or Reformat; "Add t_issue and remove
                        r_answers" matches (tested with Python re by
                        the reviewability advocate). Titles on main
                        name several objects under one verb, for
                        example 7db4229, f4cb721 and afbcf6f. Before
                        the templates three titles joined two verbs
                        with a comma (6255160, 232f001, ae6eeff); none
                        has since 66326b6. reg_writing_style_rule
                        lines 434-436 claim the list "makes each
                        commit do one thing".

