title:                  Reason of a commit outside its title
brief:                  |
                        Only Change and Fix put a reason in the title,
                        and that clause is not checked. The reason for
                        every commit sits in its brief under any title
                        form, and no commit links by an edge to what
                        called for it, so title form adds little to
                        tracing a change to its reason.
description:            |
                        sch_commit lines 24 and 56-60. change.lp has
                        no rule on the "so that" clause. Every commit
                        item on main has no relations (git log
                        --format=%B), including 89c74d8, which names
                        the chosen option in prose only. No relation
                        in reg_relation has t_commit in its domain, so
                        no such edge can be made yet.

