title:                  Recovery commits named by their verb
brief:                  |
                        The Revert and Reapply templates make an undo
                        commit known from its title, so the checks let
                        it restore earlier content they would
                        otherwise refuse, and git revert stays usable
                        for recovery.
description:            |
                        change.lp lines 159-165 exempt Revert and
                        Reapply from the alias rule, added in a0a519f
                        after a revert of a rename was refused.
                        README.md lines 53-54. message.py lines 89 and
                        161-162 find a revert by the same form.
                        ASSUMPTION: under free imperatives git's
                        "Revert" subject would still be present, so
                        the gain over that choice is only a fixed and
                        tested list.

