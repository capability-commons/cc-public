title:                  Imperative titles from a closed list of templates
brief:                  |
                        A commit title is one imperative sentence
                        built from a closed list of templates, one
                        verb per commit, with Fold and not Merge for
                        joining items.
description:            |
                        Templates: Add, Remove, Reformat, Rename..to,
                        Move..to, Split..into, Fold..into, Change..so
                        that, Fix..so that, Lock..at, plus Merge,
                        Revert and Reapply in the words git drafts.
                        Templates made in 66326b6 and checked by the
                        commit-msg hook added in 987cd9f, both on
                        2026-10-14 before the squash. e25acf9 renamed
                        Merge..into to Fold..into and added the Merge
                        and Revert templates; 4e6db4c added the other
                        merge forms and Reapply. Pattern in sch_commit
                        line 50.

