title:                  Realization recorded once and checked never
brief:                  |
                        Only one component has a realizing item, and
                        no check or query reads r_realizes. The trace
                        from code to component is mostly absent, and
                        the effort to keep it current is deferred, not
                        avoided.
description:            |
                        The only r_realizes edge is pyp_cc_public to
                        lc_tooling (src/cc_public/__init__.py line
                        24). Five of the six components in base0 have
                        none, lc_argumentation among them. A grep of
                        check.lp and src for "realiz" finds no reader;
                        this is an absence found by search. The
                        realization check is later work, "Neither is
                        needed yet"
                        (notes/arcadia-decision-subjects.md line 42).
                        It argues for completing B, not for another
                        alternative. Merged from the cost,
                        traceability and simplicity advocates.

