title:                  One small item per argument
brief:                  |
                        The issue item was a small one-off build and
                        adds one short item to each argument. Its
                        running cost grows with the number of
                        arguments, not with the annotations in them.
description:            |
                        Commit 52e3e6d: 4 files, 147 insertions.
                        Commit 1ba2895: 48 files, 392 insertions, 164
                        deletions, 15 minutes later. An issue item is
                        about 20 lines of YAML
                        (iss_tooling_language.yaml). The checks
                        issue_of, answer_count and misplaced_document
                        are per item (check.lp lines 138-182,
                        308-315). ASSUMPTION: elapsed time between
                        commits stands for effort; the work was
                        agent-written.

