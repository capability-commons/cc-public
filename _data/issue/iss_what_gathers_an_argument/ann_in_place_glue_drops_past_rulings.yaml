title:                  Past rulings lost from the graph
brief:                  |
                        A determination updated in place keeps only
                        the current ruling in the graph. An earlier
                        ruling and why it was replaced survive only in
                        git history. The cross-item checks read only
                        the current tree, and the commit checks
                        compare a commit only with its parent.
description:            |
                        Idea: owner's statement 2026-10-14T22:56:42Z
                        ("being updated as evidence (and arguments)
                        change"); memory/MEMORY.md line 55. Now
                        r_supersedes keeps the earlier determination
                        on record (commit 89c74d8; check.lp lines
                        364-415). Commit checks:
                        src/cc_public/commit/change.lp compares the
                        graph before and after one commit. ASSUMPTION:
                        the glue form would keep earlier rulings in
                        git only. The loss grows with how often
                        rulings change.

