title:                  One issue per decision
brief:                  |
                        A decision may answer only one issue. A choice
                        that settles two questions must be split, or
                        one question folded into the other.
description:            |
                        answer_count (check.lp lines 308-315);
                        determination_across_issues (check.lp lines
                        348-358). ASSUMPTION: no current decision
                        answers two questions; only the two issues in
                        the tree were checked.

