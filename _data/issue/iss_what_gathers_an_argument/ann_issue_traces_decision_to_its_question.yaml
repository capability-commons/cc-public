title:                  Trace from decision through question to driver
brief:                  |
                        The issue gives each decision one traced
                        reason, the question it answers, and links
                        that question to the subject and its drivers.
                        A shared subject stops the trace at the
                        component.
description:            |
                        answer_count (check.lp lines 305-315),
                        missing_about (check.lp lines 291-301).
                        unargued_driver follows decision, r_answers,
                        issue, r_is_about, subject, r_is_driven_by,
                        concern (check.lp lines 448-453). Sibling
                        form: commit fb5566b message.

