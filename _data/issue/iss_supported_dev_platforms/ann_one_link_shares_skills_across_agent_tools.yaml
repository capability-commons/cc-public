title:                  One skill set for two agent tools
brief:                  |
                        The one symbolic link lets Codex and Claude
                        Code read the same skills, so neither tool has
                        to adopt the layout of the other.
description:            |
                        Skills live in .agents/skills/, which Codex
                        reads; Claude Code reads them through
                        .claude/skills, a link to the same directory
                        (AGENTS.md lines 58-61; commit 7f3412f "Link
                        .claude/skills to .agents/skills"). Claude
                        Code loads project skills from .claude/skills
                        and accepts a link for each skill folder
                        (https://code.claude.com/docs/en/skills); the
                        docs do not cover linking the whole skills
                        directory, as done here. Codex scans
                        .agents/skills
                        (https://learn.chatgpt.com/docs/build-skills).
                        The owner chose AGENTS.md because both tools
                        use it (owner's statement
                        2026-10-14T08:51:24Z). The point weakens if
                        Claude Code comes to read .agents/skills
                        itself.

