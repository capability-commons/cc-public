title:                  Unchecked platform without CI
brief:                  |
                        A change is checked only by hooks on the
                        machine that makes it, since there is no CI,
                        so a Windows platform would have no routine
                        check and could break unseen.
description:            |
                        The hooks are the check of record "until CI
                        runs it too" (.githooks/pre-push lines 20-28).
                        The repository has no .github directory or
                        other CI workflow. All five hooks are /bin/sh
                        scripts (line 1 of each file in .githooks/).
                        The gate and history code call git through
                        subprocess (src/cc_public/gate/gate.py lines
                        174, 194; src/cc_public/commit/history.py line
                        176). The point weakens once CI runs a
                        platform matrix.

