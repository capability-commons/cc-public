title:                  Whole check stopped by one unreadable file
brief:                  |
                        Facts come from every document before any rule
                        runs, so one YAML file that does not parse
                        ends the check with a traceback and no other
                        result. The exit status is that of an ordinary
                        failure.
description:            |
                        src/cc_public/check/check.py lines 73-74,
                        95-99; src/cc_public/graph/extract.py lines
                        186-207, 294-305 (no parse error caught).
                        Experiment on a git archive of HEAD 89c74d8,
                        2026-10-15: one malformed file under _data
                        gives a traceback, no failure rows and exit 1.
                        Exit 1 means nonconformity and 2 means error
                        (src/cc_public/cli/group.py lines 31-33). It
                        fails closed, and it is a gap in the code more
                        than in the approach. Assumption: no
                        comparison with the legacy module is made.

