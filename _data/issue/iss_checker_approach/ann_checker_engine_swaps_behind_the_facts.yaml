title:                  Engine replaceable behind the facts
brief:                  |
                        The checks are written as facts and rules
                        apart from the engine that runs them, so the
                        engine can be replaced for supply or for
                        speed. The move from Souffle to clingo left
                        the extractor almost untouched.
description:            |
                        Commit 6230e98 deletes check.dl (526 lines),
                        adds check.lp (524 lines), changes
                        src/cc_public/graph/datalog.py by 290 lines
                        and extract.py by only 14 lines (git show
                        --stat). It is dated 2026-10-14 22:51:31Z, 40
                        minutes after the owner decided to switch at
                        22:11:54Z. Commit 12f83b7 moves the extraction
                        into cc_public.graph so that queries use the
                        same facts. The schemas declare JSON Schema
                        2020-12, a published standard
                        (_data/schema/sch_register.yaml line 1;
                        src/cc_public/check/schema.py lines 56-57,
                        107). The engine decision says Souffle may
                        return when the graph is large enough to
                        measure (det_cross_item_checks_engine). The
                        owner plans much larger graphs (owner's
                        statement 2026-10-13T20:05:25Z). Assumption: a
                        port would keep the checks in hand-written
                        Python bound to its own data access, which
                        only a rewrite can move or speed up; its
                        source is not in this clone.

