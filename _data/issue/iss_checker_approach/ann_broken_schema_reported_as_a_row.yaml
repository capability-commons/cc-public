title:                  Faulty schemas reported as rows
brief:                  |
                        A schema that is itself broken does not crash
                        the check. It is reported as a violation row,
                        the run fails, and validation against the
                        other schemas goes on.
description:            |
                        src/cc_public/check/schema.py lines 52-60 and
                        87-114. Experiment on a git archive of HEAD
                        89c74d8, 2026-10-15: a bad type in
                        sch_regentry_concern gives a row, other rows
                        still appear, exit 1. In the same run a stray
                        field in a concern entry is not reported,
                        because its schema refers to the broken one.
                        So degradation is visible but not complete.

