title:                  Fail-open fault at the engine boundary
brief:                  |
                        Facts plus rules puts a bridge between the
                        extractor and an engine. When the engine ran
                        out of process, a missing output file read as
                        no failures, so a check could pass without its
                        result being read.
description:            |
                        The bridge wrote .facts files, ran souffle as
                        a subprocess and read .csv outputs (git show
                        ba66f33:src/check/check.py lines 108-129; git
                        show 6230e98^:src/cc_public/graph/datalog.py
                        lines 137-197). A missing .csv read as empty
                        (same file, line 193), recorded as a bug in
                        memory/MEMORY.md line 53. The fault ended with
                        in-process clingo (commit 6230e98 message).
                        The engine is to be revisited when the graph
                        is much larger (commit 6c0a949), and an
                        out-of-process engine would bring the file
                        boundary back. The fault is in the bridge, not
                        in rules over facts as such.

