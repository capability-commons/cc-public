title:                  One home for each kind of check
brief:                  |
                        JSON Schema holds the shape of every item, and
                        where a schema cannot express a check, such as
                        prefix uniqueness, it says so. The chosen
                        checker puts those comparisons in rules, so
                        each kind of check has one home.
description:            |
                        _data/schema (31 files at 89c74d8).
                        _data/schema/sch_primitive.yaml lines 59-63
                        and sch_regentry_type.yaml lines 32-36 leave
                        prefix uniqueness to a companion check, and
                        the rule duplicate_prefix in check.lp is that
                        check. Domain and range come from relation
                        entries as facts
                        (src/cc_public/graph/extract.py lines
                        132-135). The assistant-written stock-take
                        says: "JSON Schema checks the shape of each
                        item, and Datalog checks the graph. Each
                        concern has one home."
                        (notes/cc-public-stocktake-2026-10-13.md line
                        69).

