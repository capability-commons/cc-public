title:                  Unreadable file now a reported failure
brief:                  |
                        Commit 0d16c2a "Fix cctool check so that an
                        unreadable file is a failure, not a traceback"
                        turns a file that does not parse into a row of
                        the check unreadable_file. At 360ec14 one such
                        file no longer stops the check or hides the
                        other results.
description:            |
                        extract.documents catches ErrorRead and keeps
                        an Unreadable in place of the document
                        (src/cc_public/graph/extract.py lines 202-215,
                        258-264 at 360ec14); facts_of adds a row of
                        unreadable for it (lines 280-282), and
                        check.lp shows it as unreadable_file (lines
                        476-482). A YAML error, a repeated key and a
                        Python syntax error are each reported with
                        file and line
                        (src/cc_public/check/_test/test_check.py lines
                        267-283). The exit status is 1, as for any
                        failed check, which is now correct.

