title:                  Checks bound to a rule dialect
brief:                  |
                        A maintainer reads a logic language beside
                        Python, and when the engine changed every rule
                        line was rewritten, which a Python port would
                        not have needed.
description:            |
                        Commit 6230e98 replaces all 526 lines of
                        check.dl with 524 lines of check.lp. The
                        clingo rules call the Python functions @match,
                        @cat, @strlen and @substr on 11 lines of
                        check.lp (for example lines 60, 75, 171). The
                        checker spans check.py (122 lines), schema.py
                        (211), extract.py (578), datalog.py (309) and
                        check.lp (643). Assumption: a port would be
                        Python only.

