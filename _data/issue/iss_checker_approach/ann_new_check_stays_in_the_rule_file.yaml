title:                  New check confined to the rule file
brief:                  |
                        Most new or changed cross-item checks since
                        the squash touch only the rule file and its
                        test. A check spreads to the extractor only
                        when it needs a new kind of fact.
description:            |
                        Commits 3d7ef5b, 7db4229, d03026b, aa23286 and
                        89c74d8 each touch under src only check.dl or
                        check.lp and
                        src/cc_public/check/_test/test_check.py (git
                        show --stat). Of the commits since the squash
                        that change the rule file, only 1ba2895
                        touches more, src/cc_public/edit/edit.py, to
                        place new items. Commit fd6323a (pre-squash)
                        also changes src/cc_public/graph/extract.py by
                        196 lines for new kinds of facts. Each output
                        relation is one check and each row one failure
                        (src/cc_public/check/check.py lines 22-25).
                        The legacy module is not in this repository,
                        so the spread of a change inside it is not
                        measured.

