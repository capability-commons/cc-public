title:                  Allocator shared by every clone and partner
brief:                  |
                        An allocated number is unique only where one
                        allocator hands it out, so every clone and
                        partner must reach that allocator or risk a
                        clash. A random guid needs no coordination.
description:            |
                        New items get guid_self from uuid.uuid4() in
                        the local process (src/cc_public/edit/edit.py
                        line 410; src/cc_public/commit/message.py line
                        117). guid_self is assigned once, never
                        changes, and tells apart items whose ids
                        collide (_data/schema/sch_trait_identity.yaml
                        lines 27-30 and 105-115). Global uniqueness of
                        readable ids is impossible across a federation
                        (same file lines 83-98). A rename is computed
                        from the local tree alone (edit.py lines
                        722-770). ASSUMPTION: an allocated number
                        comes from one authority. The packet does not
                        say how allocation would work. Grows stronger
                        with more clones, partners and environments.
                        Merged from the compatibility and flexibility
                        advocates.

