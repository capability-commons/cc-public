title:                  Rename safety without a fused number
brief:                  |
                        A retired key moves into alias and stored data
                        keeps resolving, so rename safety is had
                        without fusing an allocated number into the
                        id. Alias holds old ids after renames, not
                        synonyms.
description:            |
                        Will asked "Is the alias list for other
                        synonyms? Or to help track renames?" (owner's
                        statement, 2026-10-13T14:26:37Z,
                        will-messages.md line 173). The outcome is
                        recorded in memory/MEMORY.md line 12: "alias
                        (on every register entry) is for old ids after
                        renames, not synonyms". The reason about fused
                        numbers is recorded in the packet as written
                        by an assistant, not by Will
                        (_data/schema/sch_register_entry.yaml lines
                        76-80, added in commit bb8c338, in the
                        pre_squash_20261014 history). ASSUMPTION: git
                        names Will as author of bb8c338, so the
                        repository does not confirm who wrote it. The
                        rename_without_alias check came in 7520f91 and
                        cctool rename in afbcf6f (2026-10-14).

