title:                  Synonyms reported as outdated old ids
brief:                  |
                        The checks read every alias as an old id, so a
                        synonym in alias would be reported wherever
                        text uses it. Concept entries already hold
                        synonyms in term_admitted.
description:            |
                        alias_in_use, outdated_reference and
                        outdated_mention treat an alias as an old id
                        and report its use outside the item
                        (src/cc_public/check/check.lp lines 476-521).
                        sch_regentry_concept has term_preferred,
                        term_admitted and term_deprecated after ISO
                        1087 (_data/schema/sch_regentry_concept.yaml
                        lines 53-80). Will asked for the ISO 1087
                        names as field names (owner's statement,
                        2026-10-13T14:28:45Z). Alias items share the
                        key namespace of live entries
                        (_data/schema/sch_register_entry.yaml lines
                        68-84). Mixing the two would need a second
                        kind of alias, and would hide which entries
                        were renamed. Holds at any size. Merged from
                        the maintainability, simplicity and
                        traceability advocates.

