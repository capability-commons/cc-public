title:                  Checked trail from a new id to its old ids
brief:                  |
                        For register entries, the alias list keeps a
                        checked link from the current id to every
                        earlier id. An old id met in a commit message
                        or note still leads to the live entry.
description:            |
                        rename_without_alias reports a register entry
                        renamed without its old id in alias
                        (src/cc_public/commit/change.lp lines 149-165;
                        commit 7520f91). cctool rename appends the old
                        id (src/cc_public/edit/edit.py lines 763-768;
                        commit afbcf6f). An alias is not reported as
                        dangling (src/cc_public/check/check.lp lines
                        236-239 and 466-472). A relation entry renamed
                        in commit f587284 (pre_squash_20261014
                        history) keeps its old id as an alias
                        (_data/register/reg_relation.yaml lines
                        137-138). Commit messages are not rewritten,
                        and unannounced_rename requires a rename to be
                        named in its commit (change.lp lines 142-145).
                        Grows with more renames and more old commits.
                        From the traceability advocate.

