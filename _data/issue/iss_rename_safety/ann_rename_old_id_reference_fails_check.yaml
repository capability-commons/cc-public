title:                  Stored references by old id that fail the check
brief:                  |
                        A reference by a retired key is found but
                        reported as outdated, so it must be rewritten
                        before the tree passes. Stored data does not
                        simply keep resolving.
description:            |
                        outdated_reference reports a reference by an
                        alias (src/cc_public/check/check.lp lines
                        498-501), and every row a check shows is a
                        failure (src/cc_public/check/check.py lines
                        19-25). The option text says guids resolve
                        edges, but the tooling resolves by readable id
                        and only verifies the guid. That finding is
                        recorded as a factual annotation under the
                        issue on the shape of an edge. Raised by the
                        compatibility and simplicity advocates.

