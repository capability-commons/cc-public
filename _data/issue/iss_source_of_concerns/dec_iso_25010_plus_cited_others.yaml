title:                  ISO/IEC 25010 characteristics plus cited others
brief:                  |
                        Hold the nine product quality characteristics
                        of ISO/IEC 25010:2023, plus simplicity,
                        reviewability, traceability, cost, schedule,
                        dependency risk and privacy, each citing the
                        standard it draws on (simplicity has none).

