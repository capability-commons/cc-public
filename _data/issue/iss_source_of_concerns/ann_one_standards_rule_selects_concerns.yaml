title:                  One rule for what enters the register
brief:                  |
                        The chosen set picks concerns by one rule,
                        that each draws on a published standard,
                        rather than by case-by-case judgement.
                        Simplicity is the one stated exception.
description:            |
                        "A simple design follows from a small number
                        of early decisions."
                        (_data/register/reg_concern.yaml lines
                        416-417). Will chose to lean towards being
                        standards-informed (owner's statement,
                        2026-10-13T18:30:41Z). Every concern outside
                        ISO/IEC 25010:2023 except simplicity cites a
                        standard (commit fed3da5 message); simplicity
                        cites none (lines 419-422).

