title:                  In-tree record of a commit's own change
brief:                  |
                        A file committed with its change can record
                        that change, as news fragments do. The commit
                        item does not depend on the hash, so only the
                        hash and a record written after the commit
                        cannot sit in the tree.
description:            |
                        The id is UTC time and six guid digits, not
                        the hash
                        (_data/register/reg_data_item_type.yaml lines
                        710-718), and no field of sch_commit depends
                        on it (_data/schema/sch_commit.yaml lines
                        40-85). towncrier keeps one file per change,
                        committed with it
                        (https://towncrier.readthedocs.io/en/stable/tutorial.html).
                        The type note rejects the tree because "a
                        commit cannot contain its own record" (lines
                        706-710). From the reviewability advocate.

