title:                  Envelope lines in every message
brief:                  |
                        Each message carries an envelope of id, guid,
                        relation and document markers, which a reader
                        of the log reads in every commit though it
                        says nothing about the change. The cost is
                        small and fixed.
description:            |
                        git show -s 89c74d8; message format in the
                        docstring of src/cc_public/commit/message.py.
                        About seven lines per commit; it does not grow
                        the diff a reviewer judges.

