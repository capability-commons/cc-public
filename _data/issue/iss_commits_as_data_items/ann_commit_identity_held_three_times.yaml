title:                  Commit identity held three times
brief:                  |
                        Each commit has a git hash, a cmt id and a
                        guid, and the change check uses neither of the
                        last two. Because a cherry-pick copies the
                        message, a further check exists only to catch
                        two commits that share one id.
description:            |
                        src/cc_public/commit/history.py line 53 (log
                        read by hash) and lines 128-154 (duplicate
                        ids); src/cc_public/commit/message.py lines
                        107-125 (minting) and 278-283 (id suffix
                        check); src/cc_public/commit/change.py lines
                        105-124. No file in _data or src refers to a
                        commit id except the regex in
                        reg_data_item_type.yaml line 718 and one unit
                        test (test_message.py line 66). Principle:
                        "one mechanism does one job and nothing is
                        done twice" (memory
                        cc-public-design-principles.md). This weakens
                        if something comes to link to commit ids.

