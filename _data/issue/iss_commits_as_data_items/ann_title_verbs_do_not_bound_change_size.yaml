title:                  Title verbs that do not bound change size
brief:                  |
                        The closed list of title verbs is said to make
                        each commit do one thing, but five of the ten
                        template verbs (Split, Fold, Change, Fix,
                        Lock) have no rule, and nothing limits size.
                        Commits have reached thousands of changed
                        lines.
description:            |
                        _data/register/reg_writing_style_rule.yaml
                        lines 434-436; owner's statement
                        2026-10-14T11:18:34Z: "It might be a good
                        thing if it forces more fine-grained commits".
                        src/cc_public/commit/change.lp lines 176-183
                        has rows only for Add, Remove, Rename and
                        Move, and lines 219-221 check Reformat. git
                        log --shortstat: 6230e98 changes 28 files
                        (1199 insertions, 1110 deletions); 1ba2895
                        changes 48 files (556 lines); 7dda99e, the
                        squashed root, adds 11910 lines.

