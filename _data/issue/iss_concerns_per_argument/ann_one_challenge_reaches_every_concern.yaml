title:                  One challenge that reaches every concern
brief:                  |
                        A premise held in one annotation is challenged
                        once for all the concerns that rest on it.
                        Copies of it, one per concern, have no edge
                        between them, so a challenge to one copy
                        leaves the others standing unless its author
                        finds and links every copy.
description:            |
                        Rule: _data/register/reg_relation.yaml lines
                        290-295. Each r_challenges edge names one
                        target, so a challenge reaches several copies
                        only through an edge to each
                        (_data/register/reg_relation.yaml lines
                        212-235). No relation in that register marks
                        one annotation as a copy of another.
                        ASSUMPTION: copies of one premise would in
                        practice be challenged unevenly; no such case
                        is recorded.

