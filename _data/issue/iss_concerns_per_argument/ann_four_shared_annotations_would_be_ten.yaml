title:                  Four shared annotations that would be ten
brief:                  |
                        Four annotations now speak for more than one
                        concern, with ten concern edges between them.
                        Under exactly one concern they would be ten
                        annotations, six more.
description:            |
                        Count of r_argues_for_concern per file over
                        _data/issue/*/ann_*.yaml at 89c74d8:
                        ann_souffle_is_outside_the_locked_environment
                        has 4,
                        ann_clingo_is_a_pinned_permissive_package,
                        ann_clingo_lacks_string_matching_and_columns
                        and ann_round_trip_yaml_would_be_our_own_code
                        have 2 each. Of 24 annotations that bear on a
                        decision, this is about 25 percent more. The
                        six would add roughly 190 to 230 lines to the
                        present 1,025 (six single-concern files of 32
                        to 38 lines; splitting the four files as they
                        stand, less one 5-line concern edge per copy,
                        adds 215).

