title:                  One annotation that closes several driver checks
brief:                  |
                        One annotation that names several concerns
                        marks each of them as argued, so the driver
                        check no longer shows that each concern made
                        its own case.
description:            |
                        argued holds for a concern when any practical
                        annotation on a decision of the issue has an
                        edge to it, and unargued_driver fails only
                        when argued does not hold
                        (src/cc_public/check/check.lp lines 423-453).
                        argument_without_concern sets no upper bound
                        (same file, lines 574-576).

