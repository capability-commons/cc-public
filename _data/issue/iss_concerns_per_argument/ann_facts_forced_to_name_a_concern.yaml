title:                  Facts forced to name a concern
brief:                  |
                        Requiring a concern on every annotation that
                        supports or challenges made factual
                        annotations name a concern they do not argue
                        for, an edge that traces to no reason and that
                        a reviewer must still judge.
description:            |
                        Commit d03026b: ann_gate_takes_a_minute and
                        the annotation now named
                        ann_cross_item_checks_run_in_clingo "lose the
                        concern they were made to carry". The rule was
                        added in fd6323a (2026-10-13, history under
                        tag pre_squash_20261014). Owner's statement,
                        2026-10-14T18:58:47Z: "If we're attacking an
                        argument, we're usually going to be poking
                        holes in the argument, rather than saying that
                        concern A outweighs concern B."

