title:                  Replies between annotations
brief:                  |
                        Annotations already support and challenge
                        other annotations, so reply chains exist.
                        Support chains may not loop back, and no edge
                        records an order, so only the ordering half of
                        the claim holds.
description:            |
                        r_supports and r_challenges take an annotation
                        as subject and an annotation or decision as
                        object (_data/register/reg_relation.yaml lines
                        183-186, 198-202, 217-233). Example:
                        ann_graphs_will_grow challenges
                        ann_python_is_fast_enough
                        (_data/issue/iss_tooling_language/ann_graphs_will_grow.yaml
                        lines 30-33). Will expected an annotation
                        bearing on another annotation (owner's
                        statement, 2026-10-14T18:58:47Z,
                        will-messages.md line 663). r_supports is
                        declared acyclic (reg_relation.yaml lines
                        194-196, 205); r_challenges is not (lines
                        212-236). No relation records an order among
                        replies. The cited SysML v2 page on comments
                        mentions no threads or ordering
                        (https://docs.nomagic.com/SYSML2P/2026x/annotations-254422957.html).

