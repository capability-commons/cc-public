title:                  No outside term recorded for annotation
brief:                  |
                        The annotation concept names no outside term
                        it corresponds to, unlike its neighbours, so a
                        partner gets no help mapping it.
description:            |
                        con_annotation gives a preferred term and two
                        deprecated terms and cites no standard
                        (_data/register/reg_concept.yaml lines
                        248-276). con_decision cites ISO/IEC/IEEE
                        42010:2011 clauses 4.2.7 and 5.8 (lines
                        295-299). Other concepts state their Arcadia
                        counterpart or say there is none (lines 483,
                        531, 569). A note on the concept would fix
                        this without a rename.

