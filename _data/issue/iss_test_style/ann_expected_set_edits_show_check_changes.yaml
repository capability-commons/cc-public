title:                  Expected-set edits as a record of check changes
brief:                  |
                        When a check changes what it reports, an exact
                        test must change too, so the diff shows the
                        new behaviour in a short literal a person can
                        read. A test that asks only for some failure
                        keeps passing, and the change is absent from
                        the diff.
description:            |
                        Added round for reviewability, a driver Will
                        added on 2026-10-15 ("especially given the
                        huge (and practically impossible) review
                        burden that we are generating",
                        will-messages.md line 786,
                        2026-10-15T10:59:29Z). Commit 1ba2895 adds the
                        answer_count check and touches 48 files, 392
                        lines added and 164 removed. In it the test of
                        a bare decision changes from a missing_about
                        row for the decision to an answer_count row
                        giving its count, 0 (now test_check.py lines
                        244-246). The bare decision fails before and
                        after, so a test asking for some failure would
                        need no edit. The rule is in clingo's language
                        (check.lp lines 312-315); check.lp has 643
                        lines and 1ba2895 changed 76 added and 13
                        removed lines of it. ASSUMPTION: a reviewer
                        judges a behaviour change faster from a
                        changed literal than from the changed rules.
                        Not measured.

