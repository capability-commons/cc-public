title:                  Small development-only test runner
brief:                  |
                        pytest is a development dependency that pulls
                        in seven packages of its own, all under
                        permissive licences. Use of its API grows with
                        the suite.
description:            |
                        pytest is in the pixi environment only, not in
                        the runtime dependencies (pyproject.toml lines
                        39-41 and 57-61). pytest 9.1.1 is MIT and
                        depends on colorama, pygments, iniconfig,
                        packaging, pluggy, tomli and exceptiongroup,
                        which nothing else in pixi.lock needs
                        (pixi.lock lines 639-657). Their licences are
                        BSD-3-Clause, BSD-2-Clause, MIT, Apache-2.0
                        and "MIT and PSF-2.0". The tests call
                        pytest.fixture, pytest.mark.parametrize and
                        pytest.raises 21 times across 8 files.
                        ASSUMPTION: the other option would keep pytest
                        too, so this point does not separate them.

