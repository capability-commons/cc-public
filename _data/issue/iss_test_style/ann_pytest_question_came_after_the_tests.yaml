title:                  Owner's pytest question after the tests
brief:                  |
                        The owner's question on pytest came about 14
                        hours after the tests were committed, so it
                        confirms a choice already made. No owner
                        statement gives a reason for exact failure
                        sets.
description:            |
                        Commit 0b69eb4 adds the tests at 2026-10-13
                        20:48:04Z and its conftest imports pytest (git
                        show 0b69eb4:src/check/_test/conftest.py line
                        35). The earliest owner's statement on pytest
                        is 2026-10-13T20:49:11Z, one minute after the
                        commit: "Do you think it would be worthwhile
                        adding a pixi pyproject.toml to cc-public so
                        we can install things like pytest?"
                        (will-messages.md line 345). pytest entered
                        the environment in 2132eaf at 20:51:03Z. The
                        reason for exact matching is only in the
                        assistant-written message of 0b69eb4. Raised
                        by the dependency risk, reliability,
                        simplicity and maintainability advocates.

