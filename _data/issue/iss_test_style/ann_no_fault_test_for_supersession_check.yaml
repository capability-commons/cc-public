title:                  No fault test for the newest check
brief:                  |
                        No test plants the fault of the check
                        supersession_across_issues, and nothing in the
                        suite requires each check to have such a test.
                        Neither decision asks that every check be
                        shown to fire.
description:            |
                        check.lp shows 33 checks (#show lines);
                        check.py adds schema_violation and
                        unformatted_file (lines 48, 54).
                        supersession_across_issues is declared and
                        shown at check.lp lines 375-385 and came in
                        commit 89c74d8 (HEAD, 2026-10-14). The name
                        appears in no file under src/ but check.lp;
                        every other shown check is named in some
                        expected result in test_check.py. The suite
                        tests that every check names its columns
                        (test_check.py lines 614-618) but not that
                        every check appears in some expected failure
                        set. Owner's statement: "with a lot of test
                        coverage, I can move faster and more
                        confidently" (will-messages.md line 457,
                        2026-10-14T07:22:55Z). ASSUMPTION: the check
                        works; it was not run against a planted fault.
                        A test comparing the #show names with the keys
                        named in the tests would close the gap under
                        either decision.

