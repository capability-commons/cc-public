title:                  Location and schema columns a reader cannot judge
brief:                  |
                        Some exact literals carry a line number, a
                        schema path and a jsonschema message. A reader
                        cannot confirm these by reading the test; only
                        a run can, so they add lines to review that a
                        person cannot judge.
description:            |
                        13 of the 59 checker tests expect rows with a
                        file path and line number (test_check.py,
                        first named at lines 372, 377, 386, 432, 439,
                        499, 512, 521, 539, 549, 558, 574, 585); one
                        more expects a file path and expected path
                        with no line (line 622). 7 of them expect a
                        schema_violation row with a schema path and
                        message, such as 'allOf/2/type' with "'objct'
                        is not valid under any of the given schemas"
                        (lines 535-542). Some lines are found at test
                        time by searching the written file (lines
                        526-527, 539); others are constants (LINE_ITEM
                        = '1', line 56). One fault can raise two rows
                        (lines 375-381). ASSUMPTION: such columns are
                        copied from a run of the checker, so a
                        reviewer who accepts them confirms only that
                        the checker agrees with itself; no source says
                        how they were written. Comparing check name
                        and item for every failure, with location and
                        message in a few dedicated tests, would keep
                        the whole-set rule. The other 45 of the 59
                        tests expect no file path and are not
                        affected.

