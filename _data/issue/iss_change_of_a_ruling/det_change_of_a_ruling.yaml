title:                  Record of a change of ruling
brief:                  |
                        An issue has at most one determination, and a
                        change of ruling edits it in place. Determined
                        by William Payne, who preferred at first to
                        record the ruling on the issue, and chose this
                        so that determinations do not multiply and
                        because git already holds the history
                        (2026-10-19).

