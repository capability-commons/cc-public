title:                  Class unknown until a requirement is defended
brief:                  |
                        A declared claim says what defence a
                        requirement owes before the defence exists.
                        With traces as edges, an undefended
                        requirement shows no intended class.
description:            |
                        In the September iteration (origin/main of
                        cc-public, tag baseline_20260918), the claim
                        routed checks before any citation or argument
                        was recorded. Here a requirement with no trace
                        to a source shows only that it is untraced.

