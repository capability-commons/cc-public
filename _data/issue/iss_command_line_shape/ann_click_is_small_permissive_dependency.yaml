title:                  Click as a small, permissive dependency
brief:                  |
                        Click is BSD-3-Clause, has no dependencies of
                        its own, is actively released, and is used
                        only through its basic API, so the risk it
                        adds is low and could be undone.
description:            |
                        pyproject.toml lists click>=8.1,<9; the
                        project is Apache-2.0. Click 8.5.0 is
                        BSD-3-Clause with no required dependencies
                        (https://pypi.org/pypi/click/8.5.0/json) and
                        dropped colorama (CHANGES.md, 8.5.0). Pallets
                        made six releases from 2026-04-03 to
                        2026-08-26. pixi.lock pins the 8.5.0 wheel by
                        sha256 (lines 186-190). The command modules
                        use only click.group, argument, option, echo,
                        Path, File and IntRange (grep of
                        src/cc_public/cli/*.py). ASSUMPTION: a port to
                        argparse would be straightforward; none has
                        been tried.

