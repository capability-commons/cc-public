title:                  One parser and one exit convention for every command
brief:                  |
                        One click group gives every command the same
                        argument parsing and the same three exit
                        statuses, declared once. Scripts run directly
                        would each carry their own parsing and exit
                        codes.
description:            |
                        EXIT_OK, EXIT_NONCONFORMITY and EXIT_ERROR are
                        declared once in src/cc_public/cli/group.py
                        lines 31-33, and every command module exits
                        through them (grep EXIT_
                        src/cc_public/cli/*.py). Each kind of command
                        has its own module (auditing, checking,
                        editing, gating, messaging, querying), and
                        command.py only imports them (lines 31-40), so
                        a new command adds one import line. Before
                        6c8d3d5, check.py read list_arg[1] by hand and
                        returned 1 or 0 itself (git show
                        6c8d3d5^:src/check/check.py lines 343-365).
                        ASSUMPTION: further scripts would have
                        repeated this; no second script existed before
                        6c8d3d5 to show it.

