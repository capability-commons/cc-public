title:                  Bounded query output by default
brief:                  |
                        The --limit default of 100 rows caps what a
                        query prints, so a broad query does not stream
                        an unbounded result to the caller. It does not
                        bound time or memory.
description:            |
                        LIMIT_DEFAULT = 100 is the default of --limit
                        (src/cc_public/cli/querying.py lines 46,
                        92-94); the tool prints "N of M rows shown.
                        Pass --limit 0 to show all." (lines 256-261).
                        The cut happens after all rows are in memory
                        (_cut).

