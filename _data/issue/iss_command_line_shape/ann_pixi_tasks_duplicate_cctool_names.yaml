title:                  Two names for check and gate
brief:                  |
                        The pixi tasks check and gate are second names
                        for cctool check and cctool gate, and the
                        hooks use both forms, so one job is reached
                        two ways.
description:            |
                        pyproject.toml lines 64 and 67. pre-commit and
                        pre-merge-commit run "pixi run --frozen gate";
                        commit-msg, prepare-commit-msg and pre-push
                        run "pixi run --frozen cctool ...". README.md
                        lists both forms (lines 38, 62-64). The
                        rejected alternative also used a pixi task, so
                        this does not favour it. ASSUMPTION: the tasks
                        exist so a person types one short form for
                        check, test and lint.

