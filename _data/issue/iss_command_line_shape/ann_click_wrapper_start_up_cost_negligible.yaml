title:                  Negligible start-up cost of the click wrapper
brief:                  |
                        The cctool wrapper adds about 30 ms to a check
                        that takes about 2.9 s, so it costs nothing
                        that matters against running check.py
                        directly.
description:            |
                        Measured 2026-10-15 at 89c74d8 with system
                        Python 3.13, click 8.5.0, median of 3 to 15
                        fresh runs; indicative only. Importing click
                        takes 51 ms, cc_public.check.check 160 ms,
                        cc_public.cli.command 191 ms; a full cctool
                        check about 2.9 s. command.py imports every
                        command module eagerly (lines 31-37), so check
                        also loads the commit, gate and edit code it
                        does not use (jsonschema it loads anyway,
                        through cc_public.check.schema); a lazy import
                        per command would keep this flat as the
                        tooling grows.

