title:                  Nineteen leaf commands under a small surface
brief:                  |
                        The command line now has nineteen leaf
                        commands in three levels, and the edit
                        commands overlap with batch, so the surface is
                        not small by count, though it is still one
                        mechanism.
description:            |
                        Commands: check, gate, format, new, header,
                        link, unlink, set, unset, remove, rename,
                        batch, message new, message check, message
                        draft, history check, query sql, query
                        datalog, query schema (README.md lines 64-80;
                        decorators in src/cc_public/cli/*.py). A query
                        has three input routes (querying.py lines
                        80-85 and 218-232). batch accepts all eight
                        edit kinds, and each single edit command
                        passes one operation to the same _run that
                        batch uses (editing.py lines 120-295, 318-319,
                        339).

