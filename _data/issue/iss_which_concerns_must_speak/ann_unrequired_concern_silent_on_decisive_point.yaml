title:                  Unheard concern on a decisive point
brief:                  |
                        A concern that is not a driver need not speak
                        even where a decision bears on it directly.
                        Cost, for example, drives only
                        lc_argumentation, so a costly tooling choice
                        could be determined with no cost argument.
description:            |
                        templates/drivers.txt; reg_relation.yaml lines
                        421-424; check.lp lines 423-453. Non-drivers
                        may still speak, and driver lists can be
                        changed (3d7ef5b). ASSUMPTION: build, run and
                        support cost is set mostly by tooling and
                        graph decisions. Both advocates rate this weak
                        as a case for weighing all concerns: it is a
                        gap in the driver lists more than in the rule.

