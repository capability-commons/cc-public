title:                  Unargued pass for a subject with no drivers
brief:                  |
                        The driver check fires only through a driver
                        edge, and nothing requires a subject to have
                        one. A determination about a subject with no
                        drivers passes with no argument at all.
description:            |
                        check.lp lines 448-453; the only check on an
                        issue's subject is that it has an r_is_about
                        edge (check.lp lines 290-301). r_is_about has
                        no range, and only a logical component can
                        have drivers (reg_relation.yaml lines 145-172,
                        409-437). No rule refuses a component with no
                        driver. The tests of the driver check use a
                        driven subject
                        (src/cc_public/check/_test/test_check.py lines
                        324-368); the one test of a determination
                        about a subject with no drivers (lines
                        268-273, issue about concern_safety) expects
                        it to pass, and none expects it refused. A
                        small added check would close it without
                        changing the chosen alternative.

