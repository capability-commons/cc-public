title:                  Review load bounded by the drivers
brief:                  |
                        Under a driver list a silent concern adds no
                        file, so each decision need be argued and
                        reviewed for only four or five concerns, not
                        sixteen. A "no bearing" record or a full sweep
                        adds a file for each other concern that must
                        still be run and read.
description:            |
                        The register has sixteen concerns
                        (_data/register/reg_concern.yaml). Each
                        logical component names four or five drivers
                        (base0/_data/logical_component/*.yaml). One
                        annotation file is about 30 lines
                        (iss_tooling_language/ann_python_is_fast_enough.yaml,
                        32 lines), so an issue about lc_tooling could
                        carry up to eleven more files under no bearing
                        records, about 330 lines if each were that
                        size (ASSUMPTION). The two recorded issues
                        already hold 14 and 15 annotations. In the
                        pilot, review took longer than producing the
                        proposals
                        (notes/advocate-pilot-tooling-language.md line
                        49), and the owner reviews in batches of five
                        issues (will-messages.md line 765).
                        ASSUMPTION: review work grows roughly in
                        proportion to the concerns that speak, and a
                        reviewer must read a no bearing record to
                        accept it. The saving grows with the number of
                        decisions.

