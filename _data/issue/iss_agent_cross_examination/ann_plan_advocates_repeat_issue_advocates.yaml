title:                  Plan advocates repeat the issue advocates
brief:                  |
                        Advocates per plan are a second advocate
                        process beside the one that argues on issues.
                        They use the same drivers and produce the same
                        output, drafted annotations, at a second
                        trigger point.
description:            |
                        opt_advocates_merge_verify records the
                        existing process: one agent per driver concern
                        from a shared brief, then a merge and a
                        verification step. The point weakens if both
                        are made one process with two triggers.

