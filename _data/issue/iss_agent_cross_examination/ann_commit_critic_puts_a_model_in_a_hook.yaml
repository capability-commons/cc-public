title:                  A commit critic puts a model in a hook
brief:                  |
                        A model at commit-msg time adds a model call,
                        a filter for missing ids and a way to answer.
                        The commit hooks are not the check of record,
                        so the critic either misses rebased commits or
                        runs a second time at push.
description:            |
                        .githooks/commit-msg runs only cctool message
                        check. AGENTS.md: git skips the commit hooks
                        for a rebase or a cherry-pick; cctool history
                        check is the check of record, run by pre-push;
                        "Do not add hooks to cover more of git's
                        paths". cctool check already reports
                        dangling_reference, so a drafted answer is
                        already checked for missing ids.

