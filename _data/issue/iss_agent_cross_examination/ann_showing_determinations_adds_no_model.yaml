title:                  Showing determinations adds no model
brief:                  |
                        Showing relevant determinations reuses the
                        query commands and adds one hook, where each
                        model option adds a model. It is not yet one
                        small step, because the query needs more
                        r_realizes edges to find what bears on a file.
description:            |
                        cctool has query sql, query datalog and query
                        jq (src/cc_public/cli/querying.py). AGENTS.md:
                        "Add a type, relation, field or command only
                        when a real instance needs it."

