title:                  The ColBERT fallback brings a second stack
brief:                  |
                        The ColBERTv2 form through RAGatouille pulls
                        in torch, faiss, LangChain, LlamaIndex and
                        sentence-transformers, against six runtime
                        dependencies today. torch has no wheel for the
                        python 3.15 the pixi env uses. The FTS5 form
                        is untouched by this.
description:            |
                        RAGatouille 0.0.9.post2, uploaded 2025-05-19,
                        is its latest release and requires torch,
                        colbert-ai, faiss-cpu, langchain, llama-index,
                        onnx and sentence-transformers
                        (https://pypi.org/pypi/ragatouille/json, read
                        2026-10-19). torch 2.14.1 has wheels for cp310
                        to cp314 only, the largest about 555 MB
                        (https://pypi.org/pypi/torch/json). The pixi
                        env is 464 MB today. The device VM has no
                        network, so the owner installs each change by
                        hand. The point weakens if a late-interaction
                        library without torch is chosen.

