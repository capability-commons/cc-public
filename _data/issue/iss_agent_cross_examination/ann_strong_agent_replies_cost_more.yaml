title:                  The strong agent's replies cost more
brief:                  |
                        A small model's question costs a fraction of a
                        cent, so model price does not choose between
                        these options. The cost is the strong agent
                        reading each question and replying, which both
                        model options add to every change.
description:            |
                        Claude pricing page, read 2026-10-19
                        (https://platform.claude.com/docs/en/about-claude/pricing):
                        Haiku 5.5 costs $0.10 per million input tokens
                        and $0.50 per million output tokens; Opus 5.5
                        costs $4 and $20, forty times as much.
                        Assumption: a critic call reads about 20,000
                        tokens and writes about 500, so about $0.002.
                        A longer list of determinations also costs the
                        agent context, so showing them grows dearer as
                        the graph grows.

