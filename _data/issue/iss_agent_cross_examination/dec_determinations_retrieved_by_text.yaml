title:                  Determinations retrieved by text similarity
brief:                  |
                        A hook ranks the text of issues, decisions,
                        determinations and annotations against the
                        agent's plan or diff, and shows the top few.
                        The ranking is SQLite FTS5 with BM25, or
                        ColBERTv2 if that proves too weak. No model
                        judges. A check requires the commit item to
                        name each determination shown, or to say why
                        it does not apply.
description:            |
                        Added on 2026-10-19 after the owner's point
                        that the critical part is bringing in facts a
                        deterministic algorithm on the graph cannot,
                        and that "the graph + some sort of RAG system
                        (Ragatouille and ColBERTv2?)" may be enough
                        without a model critic.

