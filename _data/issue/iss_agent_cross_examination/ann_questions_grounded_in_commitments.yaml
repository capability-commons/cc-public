title:                  Questions grounded in recorded commitments
brief:                  |
                        Published work finds that a model rarely
                        corrects itself without outside feedback, and
                        that a weaker judge does better when handed
                        arguments. A question that cites a
                        determination gives the strong agent that
                        outside fact, which the checks do not.
description:            |
                        Huang et al. 2023
                        (https://arxiv.org/abs/2310.01798): models
                        struggle to self-correct reasoning without
                        external feedback. Khan et al. 2024
                        (https://arxiv.org/abs/2402.06782): with
                        debate, weak judges reach 76% (models) and 88%
                        (humans) against baselines of 48% and 60%.
                        Ideologos report, section 4: a low capacity
                        model caught a reversal and cited the earlier
                        claim by id. Assumption: the deterministic
                        checks test structure and rules, not agreement
                        with the reasoning of an upheld decision.

