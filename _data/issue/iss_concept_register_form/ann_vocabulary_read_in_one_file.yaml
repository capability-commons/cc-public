title:                  One file to find a concept
brief:                  |
                        With concepts as entries of one register, a
                        person checking a word opens one file and
                        reads entries of one shape. Standalone items
                        would spread the vocabulary over many files.
description:            |
                        19 concepts in 576 lines of
                        _data/register/reg_concept.yaml. Search by id
                        works for both forms. ASSUMPTION: scanning one
                        file is faster than scanning one file per
                        concept. The point weakens as the register
                        grows.

