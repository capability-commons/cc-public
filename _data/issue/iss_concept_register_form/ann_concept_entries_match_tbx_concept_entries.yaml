title:                  Concept entries in the shape of TBX
brief:                  |
                        One entry per concept, with its terms below
                        it, matches the conceptEntry of the TermBase
                        eXchange standard, so a partner maps one entry
                        to one concept.
description:            |
                        _data/schema/sch_regentry_concept.yaml lines
                        35-38 (term_preferred, term_admitted,
                        term_deprecated after ISO 1087:2019). TBX is
                        ISO 30042:2019
                        (https://www.iso.org/standard/62510.html); a
                        conceptEntry "represents a
                        language-independent concept"
                        (https://termate.readthedocs.io/en/latest/tbxformat.html).
                        ASSUMPTION: no TBX or SKOS exporter exists, so
                        this path is untested.

