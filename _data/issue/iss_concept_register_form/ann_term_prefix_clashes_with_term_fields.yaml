title:                  Term prefix beside term fields
brief:                  |
                        A term_ prefix would sit in the same entry as
                        the fields term_preferred, term_admitted and
                        term_deprecated, so a reader or a search could
                        take an id for a term or a field.
description:            |
                        _data/schema/sch_regentry_concept.yaml lines
                        49-80; example con_type with term_preferred:
                        type in _data/register/reg_concept.yaml. Will
                        holds that a term is distinct from its concept
                        (owner's statement, 2026-10-13T14:22:26Z). The
                        term_* fields came after the prefix choice
                        (owner's statement, 2026-10-13T14:28:45Z), so
                        this is a benefit found after the fact, not a
                        reason Will gave.

