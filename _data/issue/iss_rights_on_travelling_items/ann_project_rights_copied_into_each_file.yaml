title:                  Project rights copied into each file
brief:                  |
                        Embedded items inherit rights, but each new
                        standalone item gets the project's rights
                        copied in, so the same rights text now sits in
                        over a hundred files. Two mechanisms do one
                        job.
description:            |
                        src/cc_public/edit/edit.py lines 95-98,
                        396-413 and 940-951 copy rights from
                        file_pyproject. 112 YAML items and 10 headers
                        carry "Copyright 2026 William Payne" (grep at
                        89c74d8). Neither recorded alternative removes
                        the copying; the point bears on a third
                        option, inheriting from the project as well.

