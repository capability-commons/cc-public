title:                  Rights block repeated in every entry
brief:                  |
                        Rights on every item would copy the register's
                        rights block into each entry, and the copies
                        grow with the entries and must change
                        together. Under the chosen rule rights grow
                        only with the number of files.
description:            |
                        The rights trait requires copyright, license
                        and protective_mark
                        (_data/schema/sch_trait_rights.yaml lines
                        46-49), about seven lines in the house layout
                        (_data/schema/sch_standalone.yaml lines 5-11).
                        A register entry has no rights of its own
                        (_data/schema/sch_register_entry.yaml lines
                        17-25 and 36-38). The six registers hold 81
                        entries and one copyright line each (grep over
                        _data/register/*.yaml at 89c74d8). At bb8c338
                        reg_concept held 138 entries and one copyright
                        line. All 75 YAML files with rights state
                        Apache-2.0 and mark_public. ASSUMPTION: about
                        570 more lines today, and about 5,700 at ten
                        times the entries, with the same mark count
                        per entry.

