title:                  Wording changed without editing items
brief:                  |
                        Because the sentence is never stored, its
                        wording can change, for another template or
                        language, without editing any requirement.
description:            |
                        The composer alone decides the keywords (If,
                        As soon as, As long as) and the order of the
                        parts, in pym_cc_public.requirement.compose.
                        ASSUMPTION: a change of template or language
                        will be wanted; none has been asked for.

