title:                  Template rules true by construction
brief:                  |
                        Most of the wording rules a reviewer would
                        check of a free sentence hold by construction
                        when the sentence is composed from slots, and
                        the schema refuses a requirement whose slots
                        are malformed.
description:            |
                        In the September iteration (origin/main of
                        cc-public, tag baseline_20260918), two
                        demonstration runs of the INCOSE evaluations
                        gave 469 advisory findings, over half of them
                        on rules a template makes true by
                        construction, 127 on definite articles alone
                        (ddr/ddr_requirement_slots.yaml there). Here
                        sch_requirement carries the slot rules:
                        exactly one subject and one process, an actor
                        when and only when the activity is
                        interaction, and a condition with its kind.
                        cctool new and batch refuse a requirement that
                        breaks them, with no requirement-specific code
                        (commit 44aa96f).

