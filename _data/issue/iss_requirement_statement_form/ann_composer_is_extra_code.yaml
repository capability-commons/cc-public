title:                  Composer as extra code
brief:                  |
                        A composed sentence needs a composer, and
                        every reader that shows a requirement must
                        call it. A stored sentence is read as it is.
description:            |
                        pym_cc_public.requirement.compose and its 12
                        tests were added for this (commit 55d8b47),
                        and the item page of cctool serve calls it to
                        show the statement (commit 021e429). A partner
                        tool that reads a requirement must compose the
                        sentence the same way, or show the slots.

