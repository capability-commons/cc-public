title:                  Evaluation half not yet built
brief:                  |
                        No evaluation of the arguments is computed and
                        no ranking of concerns exists, so the
                        comparison that the chosen alternative relies
                        on does not exist yet.
description:            |
                        Commit 7db4229 says the evaluation "is to be
                        computed and never stored". check.lp has rules
                        on determinations (settles,
                        current_determination,
                        competing_determinations, unargued_driver) but
                        none that evaluates arguments or compares an
                        evaluation with a determination
                        (src/cc_public/check/check.lp lines 319-455;
                        grep for acceptab, grounded, attack, defeat,
                        rank in src finds nothing). Ranking appears
                        only in prose (reg_concept.yaml line 513;
                        reg_relation.yaml lines 298, 311). Effects by
                        concern: a determination can go stale with
                        nothing to report it (functional suitability);
                        a reviewer must read the whole issue folder,
                        639 lines in 19 files for
                        iss_cross_item_checks_engine (reviewability);
                        the half has no reader, the pattern for which
                        status was removed in 44034ef (simplicity);
                        the stated need has nothing that meets it
                        (traceability); the evaluator, ranking and
                        comparison are unbuilt and unestimated work
                        (cost). The same gap falls on
                        dec_computed_evaluation_only. ASSUMPTION: an
                        evaluator can be written as clingo rules on
                        the existing facts; not tried.

