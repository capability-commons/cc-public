title:                  Two outcome mechanisms and a comparison
brief:                  |
                        The chosen alternative keeps a stored
                        determination, a computed evaluation and a
                        comparison between them, which is more to
                        build and keep in step than either other
                        alternative.
description:            |
                        Packet, alternative
                        dec_stored_act_and_computed_evaluation;
                        reg_concept.yaml lines 510-517. The stored
                        half already needs seven rules in check.lp
                        lines 319-413. A computed evaluation changes
                        whenever an argument is added
                        (reg_concept.yaml lines 511-514), so on its
                        own it meets the owner's wish to change his
                        mind (will-messages.md lines 629-631).

