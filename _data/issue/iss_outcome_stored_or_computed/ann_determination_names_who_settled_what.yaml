title:                  Trace from a settled decision to an act
brief:                  |
                        A determination traces each decision it
                        settles to one act, with an author and date
                        from its commit and a stated reason in its
                        brief.
description:            |
                        Each settled decision is named by an r_upholds
                        or r_rejects edge (_data/register/
                        reg_relation.yaml lines 358-404;
                        det_cross_item_checks_engine.yaml lines
                        21-35). A brief is required and who and when
                        come from the commit
                        (_data/schema/sch_determination.yaml lines
                        24-25, 33-36, 45-46). A superseded
                        determination stays in the issue folder
                        (_data/register/reg_data_item_type.yaml lines
                        791-796).

