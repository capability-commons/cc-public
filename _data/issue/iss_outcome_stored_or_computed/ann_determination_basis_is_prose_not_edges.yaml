title:                  Basis of a determination in prose only
brief:                  |
                        A determination does not link to the
                        annotations it rested on, so the arguments it
                        answered can only be recovered from its brief
                        and the repository at its commit.
description:            |
                        sch_determination adds nothing beyond
                        sch_standalone, sch_trait_relation and a brief
                        (sch_determination.yaml lines 18-22, 39-48).
                        Its only edges are r_upholds, r_rejects and
                        r_supersedes (_data/register/reg_relation.yaml
                        lines 262-268, 370-371, 397-398).
                        det_cross_item_checks_engine names no
                        annotation by edge (lines 12-35).
                        unargued_driver checks the current graph, not
                        the graph at the time (check.lp lines
                        439-454). ASSUMPTION: walking history per
                        determination gets harder as history grows;
                        not measured.

