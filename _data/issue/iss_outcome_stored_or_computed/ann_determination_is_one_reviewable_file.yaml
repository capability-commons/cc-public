title:                  A change of outcome as one new file
brief:                  |
                        With a stored determination, a change of
                        outcome shows up as one small new item that a
                        reviewer can read and judge, and the earlier
                        one stays on record.
description:            |
                        det_cross_item_checks_engine is one 36-line
                        file in its issue folder and names the upheld
                        decision and both rejected alternatives
                        (_data/issue/iss_cross_item_checks_engine/
                        det_cross_item_checks_engine.yaml lines 1-36).
                        A later determination supersedes the earlier
                        one, which stays on record (commit 89c74d8
                        message).

