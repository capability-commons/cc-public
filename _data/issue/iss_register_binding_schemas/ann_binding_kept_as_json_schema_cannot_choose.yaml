title:                  Binding files kept for entry choice and partners
brief:                  |
                        The binding files are kept because JSON Schema
                        cannot pick the entry schema from the data,
                        and for portability to federated partners.
description:            |
                        Written by an assistant, not by Will:
                        memory/MEMORY.md line 11, "Per-register
                        sch_reg_* binding files are kept (JSON Schema
                        can't pick entry schema from data; portability
                        for federated partners). Decided 2026-10-13."
                        Will's own words on the point: he first asked
                        "Don't the type-specific registers just pull
                        them in with allOf?" (W 2026-10-13T14:50:20Z),
                        then agreed to "remove the six superfluous
                        references to sch_register_entry lines in the
                        sch_reg_* files" (W 2026-10-13T21:00:19Z, item
                        1; commit 97291f6, pre-squash), and kept
                        sch_reg_relation: "It feels like we need it
                        because of reg_relation.yaml, which is also
                        definitely needed" (W 2026-10-14T10:20:31Z).
                        The first binding, sch_reg_writing_style_rule,
                        was already in the placeholder commit bb8c338;
                        four more were added in 232f001 and
                        sch_reg_concern in a6996e8, all pre-squash.

