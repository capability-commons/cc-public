title:                  Register shape checked twice
brief:                  |
                        Each register is checked against sch_register
                        through its type and again through its
                        binding, so a fault in the shared register
                        shape is reported twice. A fault in an
                        entry-specific field is reported once, by the
                        binding.
description:            |
                        t_register names sch_register
                        (_data/register/reg_data_item_type.yaml lines
                        178-182). Each binding composes sch_register
                        (_data/schema/sch_reg_concern.yaml line 25). A
                        document meets both its type's schema and its
                        own (src/cc_public/graph/derive.lp lines
                        70-85). A test expects two schema_violation
                        rows for one bad title in reg_concern
                        (src/cc_public/check/_test/test_check.py lines
                        520-532). It can be fixed inside the chosen
                        option by dropping the allOf on sch_register
                        from the bindings. ASSUMPTION: validation
                        stays complete, since the type edge still
                        applies sch_register. From the simplicity
                        advocate; the maintainability advocate cites
                        the same test.

