title:                  Binding reason held outside the graph
brief:                  |
                        The six binding schemas carry no link to the
                        reason they exist, which is held only in a
                        memory note. sch_reg_relation went about 20
                        hours with no reason from Will until he kept
                        it.
description:            |
                        sch_reg_concern holds only identity, prose and
                        allOf (_data/schema/sch_reg_concern.yaml lines
                        1-38). No file in the repository at 89c74d8
                        names either decision of this issue. The
                        memory note says sch_reg_relation was "added
                        unasked (Will may remove)" (memory/MEMORY.md
                        line 17); it was added in 232f001 at
                        2026-10-13T14:45Z and kept on W
                        2026-10-14T10:20:31Z. Recording this issue
                        closes most of the gap. From the traceability
                        advocate.

