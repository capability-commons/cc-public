title:                  Recorded chain from register to entry schema
brief:                  |
                        Each register reaches its entry schema through
                        recorded links: an edge to its sch_reg_*
                        schema, then a $ref to its sch_regentry_*
                        schema.
description:            |
                        r_is_specified_by_schema on each register
                        (_data/register/reg_concern.yaml lines 39-42
                        and the five others). $ref in
                        _data/schema/sch_reg_concern.yaml lines 24-36.
                        The extractor records each $ref as a
                        schema_ref fact with file and line
                        (src/cc_public/graph/extract.py lines 156-157,
                        470-480). The checker reads the edge
                        (src/cc_public/graph/derive.lp lines 83-85).
                        From the traceability advocate.

