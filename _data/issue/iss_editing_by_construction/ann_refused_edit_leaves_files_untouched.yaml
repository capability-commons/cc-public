title:                  Refused edit that writes nothing
brief:                  |
                        A cctool edit is built in memory, checked
                        whole and written only if it adds no failure,
                        so a refused edit leaves the files as they
                        were. Under hand editing a faulty edit is
                        already on disk when the checker finds it.
description:            |
                        Edits are held in memory in Tree.edit and
                        Tree.map_document until apply runs
                        (src/cc_public/edit/edit.py lines 161-195). An
                        edit that leaves a file unreadable raises
                        ErrorEdit in Tree.update before any write
                        (lines 186-191). apply writes only if no
                        failure is added (lines 866-891). On refusal
                        the command prints "Nothing was written." and
                        exits 1 (src/cc_public/cli/editing.py lines
                        418-425). Holds at any graph size.

