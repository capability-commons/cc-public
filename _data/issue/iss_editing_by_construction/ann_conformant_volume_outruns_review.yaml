title:                  Cheap conformant volume that outruns review
brief:                  |
                        The commands, and batch above all, make it
                        cheap to write many items that pass the check.
                        The check judges conformance, not whether an
                        item is right, so the limit on what lands
                        moves from writing to human review.
description:            |
                        A batch of 100 set operations takes 5.63 s at
                        89c74d8 (advocate measurement 2026-10-15, as
                        in
                        ann_checked_edit_costs_less_than_edit_check).
                        apply refuses only an edit that adds a check
                        failure (src/cc_public/edit/edit.py lines
                        866-891). Lesson of the advocate pilot:
                        "review is the bottleneck" (memory/MEMORY.md
                        line 52). The memory note of Will's design
                        principles says, in its own words, not quoted
                        from Will, not to generate large batches of
                        items without Will reviewing them; the
                        September tree grew 3 to 8 times in two weeks
                        from agent output and was restarted (memory/
                        cc-public-design-principles.md lines 25-27).
                        The past-decisions drafts average about 11
                        annotations per issue, about 750 for all 68
                        issues (scratchpad notes, 2026-10-15).
                        ASSUMPTION, weak: hand editing is slow enough
                        to limit volume; a model can also write YAML
                        by hand at volume. The remedy lies outside
                        this issue, in a limit on change size or items
                        awaiting review. Grows with the graph.

