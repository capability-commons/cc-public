title:                  Evaluation names what argumentation partners compute
brief:                  |
                        In abstract argumentation, evaluation is the
                        computed acceptability of arguments. A partner
                        that reads an item called an argument
                        evaluation or verdict would take a stored
                        judgement for a computed result.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        519-524, citing Dung, Artificial Intelligence
                        77, 1995. ASSUMPTION: a partner tool built on
                        abstract argumentation reads an item named
                        evaluation in that sense.

