title:                  Only logical components today
brief:                  |
                        Today only logical components play the role,
                        so a subject of another kind, such as an
                        operational or physical element, needs its
                        type added and given the role first.
description:            |
                        cc-public has no physical or operational
                        component types yet. An open target would
                        accept such items as soon as they exist.

