title:                  Read cache that hides most parse cost
brief:                  |
                        The extractor keeps each parsed document keyed
                        by path and content digest, so an unchanged
                        file is parsed once per process. The parse
                        cost matters mostly on the first read in each
                        process.
description:            |
                        MAP_READ, up to 4096 entries keyed by relative
                        path and blake2b digest (src/cc_public/graph/
                        extract.py lines 107-108, 278-285). Commit
                        93a1428: "the tests take about a third of the
                        time they did". The cache lives for one
                        process; the pre-commit hook starts a new one
                        (.githooks/pre-commit), so each commit gate
                        starts cold.

