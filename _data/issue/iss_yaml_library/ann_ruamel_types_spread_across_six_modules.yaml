title:                  ruamel types spread across six modules
brief:                  |
                        ruamel types, attributes and loader settings
                        are used directly in six source modules, with
                        no single place that owns them. A change of
                        library, or of the ruamel API, touches each of
                        them.
description:            |
                        Imports in edit/edit.py, edit/layout.py,
                        graph/extract.py, commit/message.py and
                        cli/editing.py; check/schema.py reads .lc
                        (lines 203-206). Three loaders built
                        separately: edit.py line 140, layout.py line
                        87, extract.py line 47; only layout sets width
                        and preserve_quotes (lines 88-89). .lc.key and
                        .lc.item at 7 sites; CommentedMap and
                        CommentedSeq at layout.py lines 91-92;
                        YAMLError at edit.py 189, layout.py 212,
                        message.py 236, editing.py 244 and 335. Pinned
                        to ruamel.yaml>=0.19.1,<0.20 (pyproject.toml
                        line 41). This challenges the choice as built,
                        not the library.

