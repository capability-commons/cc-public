title:                  Scope given by position in the tree
brief:                  |
                        Global items live in /_data/, source-scoped
                        items in src/**/_data/, and tests in
                        src/**/_test/ beside the code. A standalone
                        item is at _data/<type without t_>/<id>.yaml,
                        with one spelling per file type.

