title:                  File names safe on case-folding volumes
brief:                  |
                        File names are item ids, and ids are lowercase
                        only, so no two item files differ only by case
                        on a macOS volume that folds case.
description:            |
                        Sources: id pattern in
                        _data/schema/sch_primitive.yaml line 67;
                        platforms osx-arm64 and linux-64 in
                        pyproject.toml line 52 and README.md line 28;
                        APFS forms at
                        https://support.apple.com/guide/disk-utility/dsku19ed921c/mac.
                        ASSUMPTION: most macOS volumes fold case. The
                        point rests on the id pattern; the placement
                        decision turns ids into file names.

