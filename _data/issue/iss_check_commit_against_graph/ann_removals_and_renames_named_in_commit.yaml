title:                  Every removal and rename named in its commit
brief:                  |
                        Under the graph check, an item cannot leave
                        the graph or change id unless the commit item
                        names it. A reviewer need not find removals in
                        the diff, and each one has a record of the
                        commit that made it. A title-only check lets
                        an item vanish unnamed.
description:            |
                        unannounced_removal and unannounced_rename in
                        src/cc_public/commit/change.lp (lines
                        121-145). Mentions come from the title, brief
                        and description of the commit item
                        (src/cc_public/commit/change.py lines
                        117-122). The title-only check reads one
                        regular expression
                        (_data/schema/sch_commit.yaml line
                        50) and nothing of the graph. cctool history
                          check reruns the check on commits made
                          without hooks
                          (src/cc_public/commit/history.py, commit
                          18d6181). Proposed by the reviewability and
                          traceability advocates.

