title:                  Commit invariants for identity safety and trusted titles
brief:                  |
                        Conditions that tie the commit item to the
                        change in the graph keep references from
                        silently breaking and let a reviewer trust a
                        checked title, so review can rest on titles.
description:            |
                        Owner's statement, 2026-10-14T07:26:38Z: "If
                        we design the graph and the commit data item
                        properly, we can specify invariants on the
                        graph (before and after), as well as
                        preconditions? postconditions? that tie the
                        commit data item to the change in the graph.
                        ... Is this worth exploring? Or are we yak
                        shaving here?" At 12:35:42Z Will asked what
                        reading commits from git log into the graph
                        buys "in terms of reducing risk and building
                        confidence so we can move faster". The
                        assistant replied at 12:35:57Z (session
                        transcript, thread reply
                        cmsg_01NHzkhswq5soTGyPnt4sCn7PRSyuSqMUjN3GfAWK5nH2q)
                        that loading history buys little by itself,
                        and recommended instead a before and after
                        check in the commit-msg hook, for identity
                        safety (no guid changes type, nothing
                        disappears without the commit saying so) and
                        for titles checked against the change, so that
                        review effort goes where the machine cannot
                        vouch. It ended "Shall I go ahead on that
                        basis?". Will answered at 12:39:46Z: "Yes. Go
                        ahead on that basis." The reasoning was
                        written by the assistant and approved by Will.
                        Built in commit 7520f91.

