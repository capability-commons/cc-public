title:                  Graph check built from existing parts
brief:                  |
                        The check adds one rule file and one small
                        module, and loads, extracts, evaluates and
                        lays out both graphs with machinery that
                        already existed.
description:            |
                        Commit 7520f91 adds change.dl and change.py
                        with tests and does not change gate.py,
                        extract.py or datalog.py (git show --stat
                        7520f91). change.py uses copy_commit,
                        copy_staged, extract and the rule evaluator
                        (src/cc_public/commit/change.py lines 45-48,
                        72-73, 86, 115-116) and format_file (line
                        159). The commit and history checks share
                        check_trees (change.py lines 78-88; history.py
                        line 121). It adds four input relations
                        (change.lp lines 39-59).

