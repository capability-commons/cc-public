title:                  Old prose read the other way after a swap
brief:                  |
                        Many existing annotations use "decision" in
                        prose for a candidate. A rename changes ids
                        but not prose, so after a swap those sentences
                        read as if they meant the question. Renaming
                        only the candidate type leaves them stale but
                        not inverted, and keeping both names leaves
                        them right.
description:            |
                        Sources: 209 of the 1022 annotation files
                        under _data/issue/ contain "decision" or
                        "decisions" (git grep at 7a66cb6), for example
                        "a decision no determination names is open" in
                        ann_annotation_status_restates_determinations.
                        cctool rename rewrites ids, not free prose
                        (commit afbcf6f). Content is almost entirely
                        generated and only reviewed by people (owner's
                        statement, 2026-10-18), so a rewrite of that
                        prose would be a large generated change that a
                        person must read in full, since no check can
                        tell the two senses apart.

