title:                  Choice and option as words already in use
brief:                  |
                        "Choice" already defines a decision ("one
                        choice about one or more items") and names a
                        style class and click.Choice in the code, so
                        it reads as the selected item as much as a
                        candidate. "Option" already names command-line
                        options in cctool. The clash for option is
                        weak, since a flag is easy to tell from a
                        type.
description:            |
                        Sources: con_option brief
                        (_data/register/reg_concept.yaml); "option"
                        appears on about 70 lines in
                        src/cc_public/cli, most of them for click
                        options; "choice" on 19 lines in src,
                        including the .choice class of the review
                        request form (src/cc_public/web/page.py) and
                        click.Choice (src/cc_public/cli/auditing.py).
                        The review form already calls a decision "the
                        choice" (src/cc_public/web/request.py), so the
                        word is in use for a candidate too.
                        ASSUMPTION: a reader takes "choice" as the
                        selected item. The clash grows with the code,
                        not the graph.

