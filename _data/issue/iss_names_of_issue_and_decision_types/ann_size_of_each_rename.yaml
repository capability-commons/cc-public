title:                  Size of the change each rename asks for
brief:                  |
                        A prefix cannot change in place, so every item
                        of a renamed type is removed and remade with a
                        new guid, and every reference to it changes. A
                        swap remakes about 310 items and touches about
                        1360 of 1510 tracked files; renaming only the
                        candidates remakes about 220 and touches about
                        1180. Only keeping both names asks for no
                        change.
description:            |
                        Sources: retyped_guid and unannounced_removal
                        in src/cc_public/commit/change.lp; commit
                        6284ccd remade three items to change the
                        prefix nod to dfn. There are 221 tracked dec
                        files and 89 issue folders, and git grep at
                        7a66cb6 finds 1178 files with a dec token and
                        1362 with either token. A swap also renames
                        the 89 folders under _data/issue/, the folder
                        in the placement rule and the --issue query
                        option. Counts are approximate. The size grows
                        with the graph, which favours settling the
                        names now. If the change is squashed into
                        history (owner's statement,
                        2026-10-20T14:45:25Z), no diff of it is
                        reviewed, and this point weakens.

