title:                  Three unlike prefixes for the argument types
brief:                  |
                        Options that answer an issue give the three
                        linked types prefixes that look nothing alike:
                        iss, opt and det. Every other alternative
                        keeps dec beside det, one letter apart, and
                        the swaps also make decision and determination
                        near-synonyms for a question and its settling.
description:            |
                        Sources: today decision is dec, determination
                        det and issue iss
                        (_data/register/reg_data_item_type.yaml), and
                        no type uses opt.
                        ann_determination_sits_close_to_decision
                        already argues that dec and det are easily
                        swapped when scanning ids. con_determination
                        defines a determination as the act of settling
                        that a decision holds or does not hold
                        (_data/register/reg_concept.yaml). Checks
                        refuse an edge to the wrong type, so the cost
                        falls on reading, and grows as more ids sit
                        side by side.

