title:                  Names of the issue and decision types
brief:                  |
                        The candidate type becomes option, prefix opt,
                        and the issue type becomes decision, prefix
                        dec, so that options are weighed in making a
                        decision and the decision matrix uses the
                        established terms. The answers relation is
                        renamed for options. Everything, quotes
                        included, is rewritten into the new words, so
                        that the foundation is plain for new readers
                        while the project is young. Determined by
                        William Payne on 2026-10-20, who accepted the
                        cost of a phased rename and a squash of
                        history.

