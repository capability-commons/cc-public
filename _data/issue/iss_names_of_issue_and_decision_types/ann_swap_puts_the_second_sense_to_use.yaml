title:                  Second sense of decision put to use by a swap
brief:                  |
                        The uses of "decision" for the whole question
                        are already the sense a swap makes preferred.
                        If only the candidate type is renamed, those
                        uses become a second, unregistered term for
                        the issue concept, beside the admitted term
                        "question".
description:            |
                        Sources: the question-sense uses listed in
                        ann_decision_already_has_two_senses; con_issue
                        has the preferred term "issue" and the
                        admitted term "question"
                        (_data/register/reg_concept.yaml); the concern
                        counts concepts with more than one term in use
                        (_data/register/reg_concern.yaml). A moderate
                        point: under a swap, old prose that uses
                        "decision" for a candidate carries the wrong
                        sense until it is rewritten
                        (ann_old_prose_reads_inverted_after_a_swap),
                        and decision stays close to determination
                        (ann_three_unlike_prefixes_iss_opt_det).

