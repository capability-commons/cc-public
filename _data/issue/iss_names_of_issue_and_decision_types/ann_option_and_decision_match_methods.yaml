title:                  Option and decision as the terms of decision methods
brief:                  |
                        Several decision methods a partner might use
                        call the question a decision, and most call
                        the candidates options or alternatives. With
                        options that answer a decision, both types map
                        by name to their counterparts in MADR,
                        Kepner-Tregoe and ISO/IEC/IEEE 15288, with
                        nothing crossed.
description:            |
                        Sources: MADR has "Considered Options",
                        "Decision Outcome" and "Chosen option", one
                        decision per record
                        (https://adr.github.io/madr/); QOC has
                        Questions, Options and Criteria (MacLean,
                        Young, Bellotti and Moran, 1991);
                        Kepner-Tregoe starts from a decision statement
                        and scores alternatives; the decision
                        management process of ISO/IEC/IEEE 15288
                        evaluates "a set of alternatives for a
                        decision", as quoted by SEBoK
                        (https://sebokwiki.org/wiki/Decision_Management);
                        a Pugh matrix puts concepts or alternatives in
                        columns against criteria. Options that answer
                        an issue match on the candidate only. The
                        mapping is one per type. ASSUMPTION: the
                        15288, Kepner-Tregoe and Pugh terms come from
                        secondary sources. Weak while nothing exports
                        to a partner format
                        (ann_partners_still_read_own_yaml_schemas).

