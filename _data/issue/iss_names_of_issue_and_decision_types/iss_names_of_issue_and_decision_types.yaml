title:                  Names of the issue and decision types
brief:                  |
                        What are the item types called that state a
                        question to be settled and the alternatives
                        that answer it?
description:            |
                        iss_name_of_question_type weighed only issue
                        against question, and the name of the decision
                        type was never argued: it was the first type,
                        and its alternatives were sibling decisions
                        before issues existed. The decision matrix
                        reads its columns as options weighed against
                        concerns, which prompted the owner to ask
                        whether the candidates are options and the
                        question is the decision.

