title:                  Shape in one plain sentence
brief:                  |
                        The restating sentence gives the shape of an
                        item in plain words, in the field the reader
                        is already reading. Without it, a person or a
                        partner must find and decode a block of
                        relation ids and guids, or a list of $ref
                        URLs, to learn the same fact.
description:            |
                        Sources: the t_option note says "The shape of
                        option data items is defined by the sch_option
                        schema"
                        (_data/register/reg_data_item_type.yaml lines
                        459-460); the same fact as an edge is a
                        four-line block of ids and guids (lines
                        469-472). sch_option says in its description
                        which fields come from sch_standalone and
                        which from sch_trait_relation; its allOf gives
                        only two $ref URLs
                        (_data/schema/sch_option.yaml lines 18-20 and
                        47-49). The writing style rule says to write
                        for a reader with only the concept register to
                        hand
                        (_data/register/reg_writing_style_rule.yaml
                        lines 367-370). In JSON Schema 2020-12,
                        description is a standard annotation keyword
                        that generic tools show
                        (https://json-schema.org/draft/2020-12/json-schema-validation#section-9.1).
                        Assumptions: a person reads a sentence faster
                        than an edge block (not measured), and a
                        partner without the relation register reads a
                        relation id from its spelling only. The point
                        weakens if a reader view renders edges as
                        sentences.

