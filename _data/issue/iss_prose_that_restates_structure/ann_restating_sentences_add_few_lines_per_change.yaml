title:                  A few lines per change
brief:                  |
                        Restating prose adds only a few lines to the
                        change that adds a type or a schema, so it
                        does little to the size of what a reviewer
                        reads.
description:            |
                        Source: commit 52e3e6d adds 147 lines across
                        four files, of which about five are restating
                        sentences (git show --stat 52e3e6d;
                        _data/schema/sch_issue.yaml lines 18-20).

