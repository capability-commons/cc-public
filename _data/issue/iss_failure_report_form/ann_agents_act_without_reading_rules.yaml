title:                  Agents act on a failure without reading its rule
brief:                  |
                        A failure that says what is wrong and names
                        the command that mends it saves an agent a
                        read of the logic program, and its fix warns
                        off the tempting wrong remedy, such as
                        deleting what the failure points at. Gate
                        output reads as sentences in review.

