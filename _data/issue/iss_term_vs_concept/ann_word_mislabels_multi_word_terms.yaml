title:                  Multi-word terms that "word" mislabels
brief:                  |
                        Seven of the nineteen preferred terms have
                        more than one word, so a field called "word"
                        would mislead a reader about what it holds.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        138, 188, 239, 359, 378, 404, 494 (register
                        entry, protective mark, writing style rule,
                        python module, python package, logic program
                        file, logical component); admitted terms
                        "relation type" and "style rule" (lines 168,
                        242). The schema defines a term as "a
                        designation of a concept in words"
                        (_data/schema/sch_regentry_concept.yaml lines
                        84-90). Owner judges "term" more accurate
                        (2026-10-13T14:22:26Z). ASSUMPTION: the share
                        of multi-word terms grows as the vocabulary
                        grows.

