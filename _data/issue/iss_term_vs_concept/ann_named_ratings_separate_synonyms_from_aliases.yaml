title:                  Synonyms kept apart from renamed keys
brief:                  |
                        Named rating fields hold the term to use, its
                        synonyms and the terms to avoid, apart from
                        the alias list of alternate keys. The legacy
                        layout set these side by side and left the
                        owner unsure what alias held.
description:            |
                        Sources:
                        232f001^:_data/register/reg_concept.yaml lines
                        69-74 (term, also and alias side by side).
                        Owner asked whether alias was for synonyms or
                        renames (2026-10-13T14:26:37Z). Alias holds
                        alternate keys, old spellings and imported
                        legacy strings, both before and after the
                        change (_data/schema/sch_register_entry.yaml
                        lines 68-82); synonyms and terms to avoid now
                        have rated fields
                        (_data/schema/sch_regentry_concept.yaml lines
                        53-80). ASSUMPTION: the named fields remove
                        the confusion; the owner has not said so.

