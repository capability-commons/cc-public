title:                  A naming change confined to one entry
brief:                  |
                        With rated terms in one concept entry, a new
                        synonym or a change of preferred term edits
                        that one entry, which a reviewer reads in one
                        place. One entry per term spreads it over
                        several.
description:            |
                        Sources: commit 6230e98 changes the preferred
                        term of con_logic_program_file from "Datalog
                        source file" to "logic program file" and lists
                        the old term under term_deprecated
                        (_data/register/reg_concept.yaml lines
                        382-411);
                        src/cc_public/cli/_test/test_editing.py lines
                        110-113 (setting or clearing a list of terms
                        is one field edit). Offset: the con_ id
                        mirrors the preferred term, so that commit
                        also renamed the id and added an alias
                        (_data/schema/sch_register_entry.yaml lines
                        68-80). Note: the legacy register already
                        grouped other forms per entry (138 entries, 40
                        with also, 105 with avoid, at 232f001^), and
                        the owner says it was one entry per concept
                        (2026-10-13T12:52:27Z). So the gain is over a
                        strict one entry per term design, and small
                        over the legacy register as it stood.

