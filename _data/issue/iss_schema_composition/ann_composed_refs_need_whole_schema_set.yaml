title:                  References a partner cannot resolve alone
brief:                  |
                        One item's shape is spread across several
                        files joined by $ref to URLs that are resolved
                        only from the repository's own files, so a
                        partner needs the whole schema set to validate
                        one item.
description:            |
                        sch_option reaches its fields through
                        sch_standalone and sch_trait_relation, and
                        sch_standalone composes three traits that $ref
                        sch_primitive (sch_option.yaml lines 47-49;
                        sch_standalone.yaml lines 40-43). The checker
                        resolves $ref through a referencing.Registry
                        built from local files
                        (src/cc_public/check/schema.py lines 90 and
                        145-153). ASSUMPTION: the $id URLs are not
                        served; a fetch was refused by the session's
                        proxy. ASSUMPTION: many tools that fetch $ref
                        by URL expect JSON, not YAML. Publishing the
                        schemas at their URLs, or a bundled schema per
                        type, would remove most of this cost whichever
                        way fields are shared.

