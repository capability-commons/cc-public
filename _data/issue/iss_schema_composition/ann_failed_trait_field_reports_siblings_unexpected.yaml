title:                  Errors that spread across a composed trait
brief:                  |
                        One bad value in a composed field also makes
                        every other field of the failing allOf branch
                        report as unexpected (in the reproduction, all
                        the fields of sch_standalone's three traits),
                        so each tool that validates items needs its
                        own filter, and the commit message check has
                        none.
description:            |
                        Under 2020-12 a failing subschema yields no
                        annotations, so unevaluatedProperties treats
                        its fields as unevaluated (JSON Schema 2020-12
                        Core). Reproduced with jsonschema 4.26.0:
                        title set to 5 in
                        _data/issue/iss_tooling_language/dec_tooling_in_rust.yaml
                        gives the true error plus one naming brief,
                        copyright, guid_self, id_self, license,
                        protective_mark and title (ad hoc run by the
                        maintainability advocate, 2026-10-15). The
                        checker filters these in _error,
                        src/cc_public/check/schema.py lines 174-188,
                        added in d1c4400 (pre-squash, 2026-10-13).
                        src/cc_public/commit/message.py lines 270-274
                        and 290-303 report every error unfiltered
                        against sch_commit, which closes with
                        unevaluatedProperties (sch_commit.yaml line
                        84).

