title:                  Register entries validated twice
brief:                  |
                        Composition lets one schema be reached by two
                        routes, and every register entry is checked
                        against sch_register_entry once through
                        sch_register and again through its own
                        sch_regentry_* schema.
description:            |
                        sch_register applies sch_register_entry to
                        every table value
                        (_data/schema/sch_register.yaml lines 77-78).
                        Each of the six sch_regentry_* schemas
                        composes sch_register_entry, for example
                        sch_regentry_concern.yaml line 75, and each
                        sch_reg_* applies its sch_regentry_* to table
                        values (sch_reg_concern.yaml lines 25-38).
                        Commit 97291f6 (pre-squash, 2026-10-13)
                        removed six more such references after Will
                        asked "Do we have any unnecessary duplication
                        anywhere?" (W 2026-10-13T20:53:24Z).
                        ASSUMPTION: no check detects a schema reached
                        twice; only check.lp was searched. The result
                        is the same either way, so this costs no
                        correctness.

