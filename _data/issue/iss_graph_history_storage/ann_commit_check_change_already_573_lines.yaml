title:                  Commit check change already 573 lines
brief:                  |
                        The change that built the check alone adds 573
                        lines, so storing history in the same step
                        would have added a second mechanism to an
                        already large change, with no consumer to
                        judge it against.
description:            |
                        git show --stat 7520f91: 6 files, 573
                        insertions, of which change.dl 221, change.py
                        160 and tests 161. The memory note's guidance
                        (assistant-written, from Will's earlier
                        sessions): "Propose small, reviewable changes"
                        and add a type, relation or command only when
                        a real instance needs it
                        (memory/cc-public-design-principles.md line
                        27). ASSUMPTION: storing history needs at
                        least a new store or item type plus code to
                        write it.

