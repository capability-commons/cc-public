title:                  Prefix rename re-mints every instance
brief:                  |
                        A rename of a type's prefix does not change
                        what any item is, yet the rule removes and
                        re-adds every instance under a new guid. The
                        cost grows with the number of instances, and
                        partners holding the old guids lose them.
description:            |
                        In commit 6230e98 the type Datalog source file
                        became t_logic_program_file with prefix lpf
                        and kept its guid
                        t_5de85234c70e41c1ac6eeeffd2b86b7f, while its
                        three instances were removed and lpf_ items
                        added (git show 6230e98;
                        _data/register/reg_data_item_type.yaml lines
                        608-640). A commit checked as a rename neither
                        adds nor removes (commit 7520f91 message); a
                        new guid for an item is a removal and an
                        addition. ASSUMPTION: prefix renames recur as
                        the vocabulary is refined, as with dlm to dls
                        (6b551e3, under tag pre_squash_20261014) and
                        dls to lpf (6230e98). ASSUMPTION: no partner
                        holds guids from this repository yet, so the
                        loss to partners is prospective.

