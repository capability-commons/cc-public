title:                  Two mechanisms for one prefix rename
brief:                  |
                        Under the rule, one change of name goes
                        through two mechanisms. The type entry is
                        renamed with an alias, while the items of that
                        type are removed and added again.
description:            |
                        In 6230e98 the type entry kept guid
                        t_5de85234c70e41c1ac6eeeffd2b86b7f and took
                        its old id as alias, while the three dls_
                        items were removed and lpf_ items added (git
                        show 6230e98;
                        _data/register/reg_data_item_type.yaml lines
                        608-610, 634-635). The items did not become a
                        different kind of thing (commit message: "The
                        rule files become logic program files"). The
                        point does not touch an item that truly
                        becomes another kind of thing.

