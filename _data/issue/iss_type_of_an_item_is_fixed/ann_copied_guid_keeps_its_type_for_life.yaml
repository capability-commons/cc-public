title:                  Copied guid true to its type for life
brief:                  |
                        A guid copied into another repository keeps
                        naming one item of one type. A holder can read
                        the type from its prefix with no lookup and no
                        CC tools, and the copy never goes stale
                        through a change of type.
description:            |
                        Every reference carries the whole guid of the
                        item it names, and a mismatch is reported as
                        stale_guid (src/cc_public/check/check.lp lines
                        243-256). The prefix lets a simple script tell
                        CC guids from foreign UUIDs
                        (notes/cc-public-session-context.md line 23).
                        guid_self tells apart items whose ids collide
                        across a federation
                        (_data/schema/sch_trait_identity.yaml lines
                        28-31). Inside this repository retyped_guid
                        refuses a retype at commit, and domain and
                        range checks catch an edge whose new type its
                        relation does not allow (check.lp lines
                        259-286), but copies held outside get no
                        check. ASSUMPTION: no federated partner exists
                        yet, and no cross-repository check exists in
                        src/.

