title:                  No graph link from a removed item to its successor
brief:                  |
                        When an item is removed and re-added under a
                        new prefix, nothing in the graph links the old
                        guid to the new one. Its lineage and any
                        outside reference to it are cut off.
description:            |
                        In 6230e98 dls_cc_public.check.check,
                        dls_cc_public.commit.change and
                        dls_cc_public.graph.derive were replaced by
                        lpf_ items with new hex digits (for example
                        lpf_81439365f84948c691db275c1f6e20fd for
                        dls_356edabde21c4f628386fc0fc1c31860,
                        src/cc_public/graph/derive.lp line 4). The
                        link is stated only in the commit message. No
                        file at HEAD 89c74d8 mentions dls_cc_public.
                        The alias field is defined on register entries
                        only (_data/schema/sch_register_entry.yaml
                        lines 68-85), and r_supersedes applies to
                        options and determinations only
                        (_data/register/reg_relation.yaml lines
                        241-266). History was squashed once, under tag
                        pre_squash_20261014.

