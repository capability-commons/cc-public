title:                  Principle that coarse types never change
brief:                  |
                        Coarse types never change, so the type prefix
                        on an id and a guid stays true and visible by
                        inspection for the life of the item.
description:            |
                        Owner's principle from the August 24-25
                        sessions, as summarised (not quoted) in the
                        notes: "Coarse types never change", beside
                        "The coarse type prefix goes on both the id
                        and the guid, so a type is visible and
                        greppable by inspection"
                        (memory/cc-public-design-principles.md lines
                        15-16; notes/cc-public-session-context.md
                        lines 22-24). Neither line is in quotation
                        marks as Will's own words. The step from the
                        type to the prefix in the brief is the
                        assistant's reading. Enforced by the rule
                        retyped_guid, added in
                        src/cc_public/commit/change.dl in commit
                        7520f91 on 2026-10-14 and now in
                        src/cc_public/commit/change.lp lines 103-118.
                        Applied in commit 6230e98, where the dls_
                        items were removed and lpf_ items added "since
                        a guid cannot change its prefix".

