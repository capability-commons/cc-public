title:                  Settlement traced to recorded arguments
brief:                  |
                        A determination fails until each driver of its
                        subject has an argument on the issue, so every
                        settled decision traces back to recorded
                        reasons, whoever determines it.
description:            |
                        src/cc_public/check/check.lp lines 420-453;
                        commit 3d7ef5b: "A determination is refused
                        until each driver of the subject of a decision
                        it settles has an argument". Limit: a
                        determination settles decisions with r_upholds
                        and r_rejects edges, and since 89c74d8 may
                        carry r_supersedes to an earlier
                        determination, but no relation runs from a
                        determination to the annotations it weighed
                        (reg_relation.yaml), so which arguments the
                        determiner relied on lives only in the brief
                        (_data/schema/sch_determination.yaml lines
                        24-28; det_cross_item_checks_engine.yaml lines
                        21-36).

