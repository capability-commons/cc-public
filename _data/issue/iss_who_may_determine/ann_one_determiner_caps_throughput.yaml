title:                  Throughput capped by one determiner
brief:                  |
                        Under owner-only, every determination waits
                        for one person's time, and that cost grows
                        with the number of issues.
description:            |
                        This exercise has 68 issue work folders
                        (scratchpad/pd/work/). Every commit is
                        authored by William Payne. memory/MEMORY.md
                        line 50: "Only record determinations Will has
                        made". ASSUMPTION: each determination takes
                        owner time to read the packet and the
                        annotations; the time per determination is not
                        measured.

