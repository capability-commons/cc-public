title:                  Determiner not recorded apart from the agent
brief:                  |
                        The commit is the record of who made a
                        determination, but every commit names William
                        Payne, including those Claude co-wrote. With
                        more than one determiner, the record cannot
                        show who determined, and only a prose sentence
                        in the brief names the maker.
description:            |
                        _data/schema/sch_determination.yaml lines
                        33-36. All 33 commits on main and all 78
                        across all refs have author William Payne (git
                        log --format='%an'). 76 of the 78 carry a
                        Co-Authored-By: Claude trailer, including
                        6c0a949, which adds
                        det_cross_item_checks_engine. That
                        determination names its maker only in prose:
                        "Determined by William Payne"
                        (det_cross_item_checks_engine.yaml lines
                        17-19). No rule in check.lp reads the
                        determiner. The same gap affects
                        dec_owner_only, since the record cannot show
                        that Will rather than an agent made a
                        determination. Grows with scale and with more
                        determiners. Merged from the functional
                        suitability, reviewability and traceability
                        advocates.

