title:                  Owner's determination as the human review
brief:                  |
                        When only the owner determines, each
                        determination is where the one reviewer reads
                        and judges the argument. When anyone may
                        determine, each determination by someone else
                        is one more change waiting for that reviewer.
description:            |
                        One person reviews the code that agents write
                        (_data/issue/iss_tooling_language/ann_one_reviewer_reads_python_readily.yaml
                        lines 13-14). Changes are to be small enough
                        to read in one sitting (AGENTS.md lines
                        91-93). The project is expected to be driven
                        mainly by agents (owner's statement,
                        2026-10-14T22:59:35Z). ASSUMPTION: under
                        opt_anyone_with_a_process, agents could be
                        among those who determine; the owner's
                        statement does not say. Weakens if more people
                        come to review.

