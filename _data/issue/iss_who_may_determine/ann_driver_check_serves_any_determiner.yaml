title:                  Driver check that serves any determiner
brief:                  |
                        The process the owner asked for is already
                        built as the driver check, and it does not
                        read who made a determination. So letting
                        others determine needs no new mechanism or
                        code.
description:            |
                        unargued_driver matches on settles, r_answers,
                        r_is_about and r_is_driven_by only, and
                        neither it nor argued/2 reads who made a
                        determination (src/cc_public/check/check.lp
                        lines 416-453). First added in commit 3d7ef5b,
                        2026-10-14, ported to clingo in 6230e98 and
                        revised in 1ba2895. Who made a determination
                        is recorded by the commit that adds it, not by
                        a field (_data/schema/sch_determination.yaml
                        lines 33-36). No code in src/ reads a commit
                        author (search at 89c74d8). Holds at tenfold
                        graph size, since the rule is per
                        determination. Merged from the functional
                        suitability, simplicity and cost advocates.

