title:                  Determinations open to others behind a process
brief:                  |
                        Determinations need not be the owner's alone,
                        but a process must make sure that all relevant
                        concerns are considered, which the owner gave
                        as the reason.
description:            |
                        Owner's statement, 2026-10-14T19:33:44Z:
                        "Determinations don't have to exclusively be
                        mine - but we do want a bit of a process
                        around them to make sure all relevant concerns
                        are considered" (will-messages.md line 689).
                        The driver check, commit 3d7ef5b at 19:58:12Z
                        the same day, is the process that followed.

