title:                  Concern ids a reviewer cannot judge alone
brief:                  |
                        An annotation names its concern only by id.
                        Some standard ids cover more than the plain
                        word says, so a reviewer must open the
                        register to judge whether an annotation stays
                        inside its concern.
description:            |
                        An annotation carries its concern as one
                        r_argues_for_concern edge with id and guid
                        only
                        (_data/issue/iss_tooling_language/ann_python_is_fast_enough.yaml).
                        concern_flexibility covers installing, moving,
                        adapting and scaling (reg_concern.yaml lines
                        299-304). Compatibility now covers
                        co-existence (7053bfa message). The
                        interaction capability description sets the
                        outcomes of use aside as usability under
                        ISO/IEC 25019 (lines 218-221). ASSUMPTION: a
                        reviewer reads an unfamiliar or wide id by the
                        everyday sense of the word unless they look it
                        up. Weak per change, paid once per annotation
                        read.

