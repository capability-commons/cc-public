title:                  Trace from concern to standard held only in prose
brief:                  |
                        Under either alternative, the link from a
                        concern to its standard sits in a free-text
                        note, not an edge. Standard names make the
                        trace easier to see but not checkable.
description:            |
                        Each 25010 concern cites the standard in its
                        note (_data/register/reg_concern.yaml lines
                        64-67, 103, 142, 179, 224, 266, 307, 346,
                        382), and each concern has an empty relation
                        list (line 84). reg_data_item_type.yaml has no
                        type for a standard or reference document.
                        Only a preview of 25010:2023 was held at
                        decision time (memory/MEMORY.md lines 3-4).
                        This limits the benefit of the choice. It
                        limits opt_plain_names equally.

