title:                  Wider scope carried in with the names
brief:                  |
                        The rename also widened four concerns toward
                        the standard's scope. That added an overlap
                        between capacity and scaling, which needed an
                        extra excludes line, and was not weighed as
                        its own question.
description:            |
                        7053bfa message: compatibility now also covers
                        co-existence, flexibility now also covers
                        scalability, and interaction capability notes
                        that usability belongs to ISO/IEC 25019. The
                        diff also adds helping users complete their
                        tasks to functional suitability and capacity
                        to performance efficiency (git show 7053bfa;
                        _data/register/reg_concern.yaml lines 60-61,
                        173). Flexibility covers scaling (lines 303,
                        314) and gained the excludes line "Behaviour
                        under a set load
                        (concern_performance_efficiency)" (line 322).
                        The owner's question was about naming only
                        (owner's statement 2026-10-13T19:49:54Z).

