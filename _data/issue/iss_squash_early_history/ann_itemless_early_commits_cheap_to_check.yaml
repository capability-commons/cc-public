title:                  Itemless early commits cheap to check
brief:                  |
                        Kept on main, the 43 commits without items
                        would add only a few seconds to a full history
                        walk, because each fails at the message parse
                        before any tree is compared, so speed is no
                        reason to squash them.
description:            |
                        history.check copies the commit tree and its
                        parent's tree with git archive, checks the
                        message, and returns at once if the message
                        fails, before check_trees runs
                        (src/cc_public/commit/history.py lines 97-118;
                        src/cc_public/gate/gate.py lines 186-203).
                        Timing of history.check on every commit of a
                        clone, 2026-10-15, 4 cores, python3 -I: main,
                        33 commits, 140.88 s total, median 4.152 s,
                        all passing; pre_squash_20261014, 45 commits,
                        11.47 s total, median 0.131 s, 43 failing.
                        CAVEAT: another timing run shared the machine,
                        so absolute times are high and noisy; only the
                        ratio is relied on. A re-run in a second clone
                        the same day (also on a shared, loaded
                        machine) gave 15.26 s on the tag and 158.95 s
                        on main; the 43 failing commits took 6.84 s
                        together, and 66326b6 and 987cd9f, which pass,
                        3.54 s and 3.08 s. The pre-push hook checks
                        only commits the remote lacks
                        (.githooks/pre-push line 33; history.py lines
                        72-94), so the early commits would be checked
                        at the first push that sends them (again on
                        each retry if that push fails); only cctool
                        history check with no range walks all history
                        (src/cc_public/cli/auditing.py line 92).
                        ASSUMPTION: git archive time grows roughly
                        with tree size, so the cost grows with the
                        tree but stays well below one passing check
                        per commit. Weak: it removes a possible
                        objection to keeping the history rather than
                        giving a reason for it.

