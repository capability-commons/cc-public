title:                  No storage saved while the tag is kept
brief:                  |
                        The squash leaves the repository about the
                        same size as keeping the history, adding only
                        its one root commit object, because the tag
                        holds every old object and the new root reuses
                        the old tree; deleting the tag would free only
                        about 128 KB.
description:            |
                        7dda99e has tree bb6845c1, the same as the tag
                        (git rev-parse 7dda99e^{tree}). 537 objects
                        are reachable from pre_squash_20261014 and not
                        from main, 128246 bytes packed on disk (git
                        rev-list --objects pre_squash_20261014 --not
                        main, with git cat-file
                        --batch-check='%(objectsize:disk)'). The whole
                        pack is 3.10 MiB (git count-objects -vH).
                        Weak: the early history is fixed in size, so
                        its share shrinks as the repository grows.

