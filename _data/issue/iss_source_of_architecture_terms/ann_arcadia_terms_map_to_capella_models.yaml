title:                  Direct mapping to Arcadia and Capella models
brief:                  |
                        With Arcadia's terms, a Capella or Arcadia
                        partner can read the logical components of the
                        graph without a renaming table.
description:            |
                        con_logical_component takes its name from the
                        Arcadia user guide 2023, clauses 4.3 and 4.4.4
                        (_data/register/reg_concept.yaml lines
                        481-494). Arcadia is published as AFNOR XP
                        Z67-140 (2018). capellambse models
                        realized_logical_components, and the ESA COMET
                        Capella adapter maps logical components
                        (https://capellambse.readthedocs.io/latest/code/capellambse.metamodel.pa.html;
                        https://comet.io.esa.int/content/7-dehp/02-capella/03-limits.html).
                        Limits: no partner exchange exists today (no
                        "capella", "sysml", "export" or "interchange"
                        in _data or src). r_realizes maps only on its
                        range side, since its subjects are source-file
                        items, not physical components.

