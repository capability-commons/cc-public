title:                  Thought already put into the Arcadia method
brief:                  |
                        Arcadia has had a lot of thought put into its
                        method, and cc-public can take advantage of
                        that effort by using its terms.
description:            |
                        Owner's statement, 2026-10-14T18:29:05Z
                        (will-messages.md line 648): "Use Arcadia's
                        terminology for the moment. Let me know where
                        we deviate ... (I think Arcadia has had a lot
                        of thought put into the methodology - we can
                        take advantage of that effort here)". Recorded
                        in commit f4cb721. The concerns linked here
                        are a reading of the statement, which names
                        none.

