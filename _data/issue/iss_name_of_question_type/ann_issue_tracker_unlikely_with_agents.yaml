title:                  Issue tracker unlikely in an agent-driven project
brief:                  |
                        The project is driven mainly by agents, so an
                        issue tracker that would clash with the name
                        "issue" is unlikely to appear. The owner gave
                        this as his reason.
description:            |
                        Owner's statement, 2026-10-14T22:59:35Z
                        (will-messages.md line 753). Change made in
                        commit 52e3e6d.

