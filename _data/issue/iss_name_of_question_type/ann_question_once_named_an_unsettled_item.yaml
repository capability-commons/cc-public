title:                  Earlier unsettled-item sense of question
brief:                  |
                        The project once had a question type for what
                        a decision leaves unsettled, a different role.
                        Reusing the word would give it two meanings
                        across the history.
description:            |
                        Sources: a type named question, prefix qst,
                        "one thing that a design decision leaves
                        unsettled", answered by an r_answers edge;
                        commit 232f001, under tag pre_squash_20261014,
                        removed it. The sense survives in
                        _data/register/reg_writing_style_rule.yaml
                        lines 405-415.

