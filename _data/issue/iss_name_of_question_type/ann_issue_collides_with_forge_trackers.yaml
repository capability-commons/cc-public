title:                  Name collision with forge issue trackers
brief:                  |
                        On a code forge, "issue" would name both a
                        tracker ticket and a graph item under
                        _data/issue/, and agents holding forge tools
                        could confuse them. "Question" would not
                        collide.
description:            |
                        Sources: GitHub and GitLab call tracker items
                        "issues" (https://docs.github.com/en/issues ;
                        https://docs.gitlab.com/user/project/issues/);
                        arguments live in _data/issue/<issue id>/
                        (commit 1ba2895). The repository today has no
                        forge remote; origin is a local git bundle.
                        ASSUMPTION: the project may later be hosted on
                        a forge with its tracker enabled. The owner's
                        statement of 2026-10-14T22:59:35Z argues
                        against this.

