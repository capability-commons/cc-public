title:                  Question text in every issue brief
brief:                  |
                        Every issue states its question in its brief,
                        so a reviewer sees the real question whichever
                        name the type has. The name alters only the
                        type label and the id prefix.
description:            |
                        Sources: _data/schema/sch_issue.yaml lines
                        18-24; the brief of
                        _data/issue/iss_tooling_language/iss_tooling_language.yaml
                        is a question ending in "?". This limits the
                        weight of the naming arguments for both
                        alternatives.

