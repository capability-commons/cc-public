title:                  Overlap kept by the admitted term
brief:                  |
                        Admitting "question" as a term for an issue
                        keeps part of the overlap the name "issue"
                        avoids, since "question" also names a concern
                        field and an older sense.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        569-573; see
                        ann_question_is_already_a_concern_field and
                        ann_question_once_named_an_unsettled_item. The
                        cost falls on prose, not identifiers.
                        ASSUMPTION: no check enforces which term prose
                        uses; none found in check.lp, not every rule
                        searched.

