title:                  Everyday senses of issue
brief:                  |
                        A new reader or reviewer first reads "issue"
                        as a problem or a tracker ticket, while the
                        item is a question that options answer. The
                        reader must unlearn that sense, and may file a
                        problem report as an issue.
description:            |
                        Sources: GitHub describes issues as a way to
                        track ideas, feedback, tasks or bugs
                        (https://docs.github.com/en/issues/tracking-your-work-with-issues/about-issues).
                        The owner used "issue" for a problem on
                        2026-10-14T18:42:50Z. The schema says the
                        brief asks the question
                        (_data/schema/sch_issue.yaml lines 23-24). A
                        person reviews the items (owner's statement,
                        2026-10-14T23:39:41Z). ASSUMPTION: few new
                        readers know the IBIS sense of "issue". The
                        cost is paid once per reader and fades once
                        the term is learned.

