title:                  Question as an existing concern field
brief:                  |
                        Every concern entry has a required field named
                        "question", so a type of the same name would
                        give one word two meanings in one argument, in
                        diffs and in searches.
description:            |
                        Sources:
                        _data/schema/sch_regentry_concern.yaml lines
                        38-48; the field is filled in every concern
                        entry (_data/register/reg_concern.yaml lines
                        69, 107, 146 and others); tests set it by name
                        (src/cc_public/cli/_test/test_editing.py lines
                        60-61; src/cc_public/edit/_test/test_edit.py
                        lines 63, 129, 402-404). The name "issue"
                        holds no other meaning in the tree: t_issue,
                        iss, sch_issue, _data/issue/, DIR_ISSUE,
                        issue_of. The overlap grows with each new
                        concern.

