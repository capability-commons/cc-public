title:                  Negligible cost of the staged copy
brief:                  |
                        Copying the staged content takes well under a
                        second and about 1 MB, against a gate of
                        minutes, so the staged copy loses almost
                        nothing in speed to a gate on the working
                        tree.
description:            |
                        Measured 2026-10-15 in the cloud container,
                        under heavy load from parallel runs: git
                        checkout-index --all into a new folder took
                        0.03 to 0.07s over three runs and wrote 1.1 MB
                        on disk (0.66 MB of file content). The gate
                        runs ruff with --no-cache and pytest with the
                        cache provider off (src/cc_public/gate/gate.py
                        lines 65-66); ruff check src took 0.31s
                        without a cache and 0.03 to 0.09s with one, so
                        the lost caches cost under a second. The gate
                        took 130.8s with two workers there; memory
                        MEMORY.md line 54 gives about 75s after the
                        clingo switch, without naming the machine
                        (ASSUMPTION: Will's VM). This measurement can
                        replace the ASSUMPTION in
                        ann_throwaway_copy_keeps_working_tree_clean
                        that the copy stays small next to test time.
                        ASSUMPTION: the copy grows with the tree size
                        only, to tens of MB at most.

