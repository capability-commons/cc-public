title:                  Gate elements with no realizes link
brief:                  |
                        The gate module, its command and its hooks
                        have no relations, so nothing in the graph
                        traces them to lc_change_control or to this
                        option.
description:            |
                        relation is empty in
                        src/cc_public/gate/gate.py line 42,
                        src/cc_public/gate/__init__.py line 22,
                        src/cc_public/cli/gating.py line 22, and the
                        three hooks (.githooks/pre-commit line 24,
                        pre-merge-commit line 28, pre-push line 29).
                        The only r_realizes edge goes from the root
                        package to lc_tooling
                        (src/cc_public/__init__.py lines 22-27).
                        lc_change_control covers the gate and the
                        hooks. A gap in the build, cheap to fix, not
                        in the choice.

