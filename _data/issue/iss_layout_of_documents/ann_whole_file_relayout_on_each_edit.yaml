title:                  Whole-file relayout on each edit
brief:                  |
                        Every edit lays out the whole file it writes,
                        where the fragment writer wrote only changed
                        lines. The extra cost is small next to the
                        checks an edit already runs.
description:            |
                        b544e09 commit message; _Item.replace and
                        _format in src/cc_public/edit/edit.py. Laying
                        out the largest register file takes about 79
                        ms (advocate measurement, 2026-10-15). apply
                        runs check_documents twice per edit (edit.py
                        lines 866-878), and that grows with the whole
                        tree, so relayout stays a small share. Weak
                        support.

