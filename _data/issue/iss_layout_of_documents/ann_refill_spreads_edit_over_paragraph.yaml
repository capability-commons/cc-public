title:                  Spread of a small prose change over its paragraph
brief:                  |
                        The printer refills every prose block, so a
                        one-word change to prose shows in the diff as
                        several changed lines, at most up to the end
                        of its paragraph. Under the fragment writer, a
                        hand edit stayed a one-line diff.
description:            |
                        The printer refills block scalars with
                        textwrap at width 70
                        (src/cc_public/edit/layout.py lines 67,
                        469-478, 552-567). cctool check reports
                        unformatted_file for any file the printer
                        would change, so a hand edit is followed by
                        cctool format (src/cc_public/check/check.py
                        lines 54, 66-79;
                        .agents/skills/editing-data-items/SKILL.md
                        lines 113-118). Advocate run at 89c74d8,
                        2026-10-15: inserting "any" into the
                        description of concern_reviewability, by hand
                        then cctool format or by cctool set --dry-run,
                        gives the same diff of 3 removed and 3 added
                        lines (_data/register/reg_concern.yaml lines
                        456-458), the last line of the paragraph
                        unchanged. Setting the description to its
                        current value gives an empty diff, and the
                        reprint changes no line outside the edited
                        field. The fragment writer also wrapped every
                        value it wrote
                        (c4a8721:src/cc_public/edit/layout.py lines
                        21-22, 39, 103, 124-136), so for edits made by
                        cctool the two give the same diff. The spread
                        is bounded by one paragraph, and git diff
                        --word-diff shows the true change. Mild.

