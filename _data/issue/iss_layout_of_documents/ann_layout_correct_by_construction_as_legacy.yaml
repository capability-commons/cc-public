title:                  Layout correct by construction as in the legacy repo
brief:                  |
                        Will asked whether YAML layout was now correct
                        by construction, as in the legacy repository,
                        and chose to take the legacy rule as-is and
                        reformat once.
description:            |
                        Owner's statements: "Do we now have
                        correct-by-construction YAML formatting in a
                        similar way to how it existed in
                        cc-public-legacy-20260918?" (W
                        2026-10-14T08:15:55Z). "I agree with your
                        recommendation. Take the legacy rule as-is and
                        reformat once." (W 2026-10-14T08:17:46Z).
                        Built in b544e09 and cdc9ae6 (pre-squash).
                        ASSUMPTION: the reason speaks for
                        maintainability (one checked layout) and
                        simplicity (no new rule to define); Will named
                        no concern.

