title:                  Refusal of input the printer cannot lay out
brief:                  |
                        The printer refuses some documents outside its
                        subset rather than guessing: nested sequences,
                        folded and multi-line plain scalars, and
                        documents that are not YAML mappings. Such
                        input stops an edit with a message instead of
                        being rewritten wrongly.
description:            |
                        Unsupported is raised for documents that are
                        not YAML or not mappings, nested sequences,
                        folded scalars and plain scalars that need
                        more than one line
                        (src/cc_public/edit/layout.py lines 213, 217,
                        480, 499, 543). The class docstring (lines
                        96-103) also names anchors and tags, but they
                        are not refused: a run of format on 2026-10-15
                        kept tags as written, wrote an alias of a
                        scalar as a second copy of its anchor and
                        expanded an alias of a mapping, with the data
                        kept. No document in the repository uses them.
                        An edit that would leave a refused file is
                        refused (edit.py _format, lines 1052-1062).
                        cctool check reports a refused file as one
                        unformatted_file row (layout.py lines
                        106-129). Only block scalars are refilled
                        (layout.py lines 469-478). Layout is tested as
                        a fixpoint over the repository (test_edit.py
                        lines 468-476). violations catches only
                        Unsupported (layout.py lines 120-124).
                        ASSUMPTION: whether other exceptions can arise
                        on valid YAML is not shown.

