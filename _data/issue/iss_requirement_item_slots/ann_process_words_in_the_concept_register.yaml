title:                  Process words in the concept register
brief:                  |
                        A process is a concept, so the register of
                        process words is the concept register already
                        kept, and the words to avoid are its
                        deprecated terms.
description:            |
                        September had a register of process words with
                        verbs to avoid. Here con_keep and con_refuse
                        are ordinary concepts whose term_preferred is
                        the verb the statement writes. No new register
                        or type was needed (commit 44aa96f).

