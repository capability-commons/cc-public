title:                  One reader for every register
brief:                  |
                        With one shape, the structure of a register is
                        defined once, and the tooling, a port of it,
                        or a partner reads every register with one
                        code path and one pair of generic schemas.
                        Register-specific shapes need one reader or
                        schema per register.
description:            |
                        sch_register.yaml lines 16-20: "Registers
                        differ in what their entries say, not in how
                        they are structured." Every entry schema
                        composes sch_register_entry through allOf
                        (sch_register_entry.yaml lines 25-33). The
                        extractor reads tables through one key,
                        KEY_TABLE, with no per-register branch
                        (src/cc_public/graph/extract.py lines 53,
                        426-435). No module under src outside _test
                        names a register id (grep). _append_entry in
                        src/cc_public/edit/edit.py lines 1066-1094
                        adds an entry to any register. key_mismatch
                        and misplaced_register_entry apply to every
                        register (src/cc_public/check/check.lp lines
                        195-198, 221-223). The legacy system had "14
                        register schemas that are one template" (note
                        cc-public-session-context.md line 59). The gap
                        grows with the number of registers. Merged
                        from the compatibility, flexibility,
                        maintainability and simplicity advocates.

