title:                  Identity and edges on every register entry
brief:                  |
                        Every entry composes the one shared entry
                        shape, so every entry in every register has an
                        id and a guid, may carry the common edge list,
                        and can be the end of a traced edge.
                        Register-specific shapes would not guarantee
                        this.
description:            |
                        sch_register_entry.yaml lines 36-38 (identity
                        and descriptive traits) and lines 45-66 (edge
                        definition shared "so the two cannot drift";
                        the relation list is optional, lines 47-63).
                        sch_register.yaml lines 77-78. The extractor
                        records any node with id_self as an item
                        (src/cc_public/graph/extract.py lines
                        411-423). Entries are already edge targets,
                        for example ann_python_is_fast_enough.yaml
                        lines 29-32.

