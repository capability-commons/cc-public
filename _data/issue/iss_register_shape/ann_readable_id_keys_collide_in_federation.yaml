title:                  Readable-id keys colliding across a federation
brief:                  |
                        Readable ids are not unique across
                        repositories, so a table keyed by them cannot
                        hold two partners' entries that share an id.
                        An array could hold both, told apart by guid.
description:            |
                        Keys are readable ids (sch_register.yaml lines
                        35-36, 74-75). id_self has no guarantee of
                        uniqueness across repositories
                        (sch_trait_identity.yaml). Partner entries
                        stay in the partner's own register today
                        (reg_concept.yaml usage;
                        reg_protective_mark.yaml "MARKS HELD
                        ELSEWHERE"), and duplicate_id (check.lp lines
                        93-103) has the same limit. ASSUMPTION: no
                        partner merges registers with cc-public yet.
                        From the compatibility advocate.

