title:                  A schema of its own for each register
brief:                  |
                        Each register is validated against its own
                        sch_reg_* schema, chosen by its
                        r_is_specified_by_schema edge, so "one
                        register schema" no longer holds literally.
                        The shared shape is carried by allOf.
description:            |
                        _data/register/reg_concern.yaml lines 39-42;
                        src/cc_public/graph/derive.lp lines 83-85; six
                        sch_reg_* files besides sch_register in
                        _data/schema; allOf in sch_reg_concern.yaml
                        lines 24-25. From the maintainability
                        advocate.

