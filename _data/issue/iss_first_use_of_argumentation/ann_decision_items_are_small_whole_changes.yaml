title:                  Decision items as small, whole changes
brief:                  |
                        A decision with its annotations is a change a
                        person can read in full. Tooling commits of
                        the same day were larger and harder to judge
                        whole.
description:            |
                        6592fb5 added 9 files, 278 lines: two
                        decisions of 21 lines and seven annotations of
                        32 to 38 lines (git show --stat). Tooling
                        commits earlier on 2026-10-14 added 328 to 573
                        lines each: 7520f91, 18d6181, af6ec6e,
                        4e6db4c, 29cb646 (git log --shortstat
                        7dda99e..HEAD). Caveat: a determination can
                        still set off a large tooling change, as
                        6230e98 (+1199 -1110) did 36 minutes after
                        6c0a949.

