title:                  Early argument found a running cost cheaply
brief:                  |
                        The first real argument exposed a rule engine
                        kept outside the locked environment while its
                        rules were still small enough to port in under
                        an hour.
description:            |
                        Souffle was kept by hand in a gitignored
                        folder with a copied libffi
                        (ann_souffle_is_outside_the_locked_environment
                        lines 12-27). Determination 6c0a949 at 22:15Z;
                        port 6230e98 at 22:51Z, 28 files, +1199 -1110.
                        Rules ported: 445 lines of check.dl, 226 of
                        change.dl, 87 of derive.dl (git diff --stat
                        586a0e5 89c74d8). ASSUMPTION: the effort to
                        change a rule engine grows with the number of
                        rules written for it.

