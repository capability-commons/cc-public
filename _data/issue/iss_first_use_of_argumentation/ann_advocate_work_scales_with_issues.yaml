title:                  Advocate work growing with every issue
brief:                  |
                        Each issue costs one advocate run per driver
                        plus a merger, a verifier and owner review, so
                        text and spend grow with issues times drivers
                        against one reviewer. The chosen alternative
                        moves the bottleneck to review.
description:            |
                        68 issues in work/index.txt (18 argumentation,
                        14 item graph, 12 vocabulary, 10 tooling, 9
                        change control, 5 project guidance); 4 or 5
                        drivers each (templates/drivers.txt), about
                        314 advocate runs plus 136 merger and verifier
                        runs. 208 advocate files of 15,772 lines exist
                        so far, before merge (wc, 2026-10-15T01:13Z).
                        Owner's statements: review "in batches of
                        five" and capture "as comprehensively as
                        possible" (2026-10-14T23:39:41Z); annotations
                        "might quickly explode out of control"
                        (2026-10-14T21:51:15Z). In the advocate pilot,
                        review took longer than production
                        (notes/advocate-pilot-tooling-language.md line
                        49). A prior attempt failed on too much
                        material to review
                        (memory/cc-public-design-principles.md lines
                        11 and 27). ASSUMPTION: each run costs money;
                        no figure is recorded.

