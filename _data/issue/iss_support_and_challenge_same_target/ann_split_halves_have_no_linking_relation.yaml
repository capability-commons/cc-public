title:                  No link between the halves of a split qualifier
brief:                  |
                        Under a refusal, a qualification becomes two
                        one-sided annotations, and no relation records
                        that they are parts of one reason.
description:            |
                        The relations an annotation may hold are
                        r_is_about, r_supports, r_challenges and
                        r_argues_for_concern, and none joins two
                        annotations as parts of one assertion: the
                        domains in _data/register/reg_relation.yaml.
                        r_supersedes is for decisions and
                        determinations only, and means replacement.
                        Two annotations of one issue share only
                        r_is_about, as every annotation there does.

