title:                  Concern edge without a side
brief:                  |
                        Concern edges attach to the annotation, not to
                        its support or challenge edge, so for a
                        double-edged annotation the graph cannot trace
                        which concern gives the reason to accept and
                        which the reason not to.
description:            |
                        r_argues_for_concern has the annotation as its
                        domain and may be repeated:
                        _data/register/reg_relation.yaml lines
                        277-317. argued records no side:
                        src/cc_public/check/check.lp lines 423-435.
                        description, where a qualification goes, is
                        optional:
                        _data/schema/sch_trait_descriptive.yaml lines
                        21-30. Will aims at queries over edges:
                        owner's statement 2026-10-13, will-messages.md
                        line 393.

