title:                  Numbers returned as text by the Datalog command
brief:                  |
                        Over the one fact set, SQL returns and sorts a
                        number as an integer, while the Datalog
                        command returns and sorts it as text, so the
                        two languages give differently typed and
                        ordered results for the same question.
description:            |
                        The query group says both languages see the
                        same relations (querying.py lines 63-67); a
                        :number column is an integer in SQL
                        (querying.py lines 210-211; sql.py line 41).
                        The Datalog command turns every value into
                        text (datalog.py lines 256-266, _field) and
                        sorts rows as text (datalog.py line 309).
                        Advocate's test, 2026-10-15: Datalog gave
                        ('10',), ('9',) and a #count over a declared
                        number gave ('203',); SQL gave (9,), (10,).
                        With --json, Datalog numbers are strings and
                        SQL numbers are numbers (querying.py lines
                        134-135, 179-181). Weak: it affects only
                        numeric columns and ordering, and loses no
                        value. It points at a fix in the Datalog
                        adapter, not at another language set.

