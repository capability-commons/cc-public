title:                  Datalog engine kept under SQL only
brief:                  |
                        The checks and the derived relations are in
                        clingo, so SQL only would hide Datalog without
                        removing it, or would define the derived
                        relations a second time in SQL.
description:            |
                        cc_public.graph.datalog is imported by
                        check/check.py (line 38), commit/change.py
                        (line 47), cli/messaging.py (line 38),
                        cli/auditing.py (line 43) and cli/querying.py
                        (line 41). Checks are in check.lp (643 lines).
                        Derived SQL tables come from clingo on
                        derive.lp (sql.py lines 54-59); no SQL
                        definition of a derived relation exists. So
                        SQL only removes no part that can fail. Grows
                        with the checks.

