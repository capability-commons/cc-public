title:                  Full Datalog evaluation in every SQL query
brief:                  |
                        Each SQL query first runs clingo over all
                        facts to derive relations, so it costs more
                        than a Datalog query and scales with the
                        Datalog engine.
description:            |
                        sql.py lines 54-59; the connection is rebuilt
                        per query (sql.py lines 61, 87-94). Measured
                        by an advocate on 2026-10-15 at HEAD 89c74d8,
                        median of 7 runs on one machine (scratchpad
                        advperf/m.py): SQL query about 89 ms, clingo
                        derivation alone about 87-90 ms, Datalog query
                        about 77 ms. At ten times the items and edges:
                        derivation about 437 ms, SQL query about 425
                        ms. Most of the gap between clingo and Souffle
                        is regex matching called from Python
                        (ann_clingo_is_slower_at_this_size). The
                        SQLite load and the command layout add only
                        about 2 ms.

