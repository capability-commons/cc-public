title:                  SQL repeats the query job of Datalog
brief:                  |
                        Datalog must stay for the checks and already
                        answers joins, counts and recursion, so the
                        SQL command is a second mechanism for a job
                        that Datalog does.
description:            |
                        Tree check and commit check run through
                        cc_public.graph.datalog.run
                        (src/cc_public/check/check.py lines 96-99;
                        src/cc_public/commit/change.py line 86). The
                        engine is clingo
                        (det_cross_item_checks_engine.yaml lines
                        12-17). The SQL path has its own module of 94
                        lines, command, error handling and tests
                        (src/cc_public/graph/sql.py;
                        src/cc_public/cli/querying.py lines 107-137).
                        Weakened by: the SQL layer is small and adds
                        no package. Holds at any graph size.

