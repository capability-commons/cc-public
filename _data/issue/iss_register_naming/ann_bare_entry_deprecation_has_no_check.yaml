title:                  Deprecation of bare entry with no check
brief:                  |
                        Bare "entry" is deprecated, but no tool reads
                        deprecated terms and the data still uses the
                        bare word, so the rule holds only as far as
                        reviewers catch it by hand.
description:            |
                        con_register_entry lists entry under
                        term_deprecated
                        (_data/register/reg_concept.yaml lines
                        143-144). No file under src/ refers to
                        term_deprecated or "deprecated" (grep at
                        89c74d8). Roughly 80 to 90 lines under _data
                        use "entry" or "entries" without "register"
                        before it on the same line, for example
                        _data/schema/sch_regentry_type.yaml line 18
                        ("A type entry"); the count is a rough grep,
                        some are line-wrapped "register entry" and
                        some uses may be acceptable. ASSUMPTION: a
                        reviewer will not reliably notice a deprecated
                        term in running prose without a check.

