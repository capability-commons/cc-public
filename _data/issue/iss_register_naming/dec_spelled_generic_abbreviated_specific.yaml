title:                  Generic names spelled out, specific names abbreviated
brief:                  |
                        Call the register reg_data_item_type, spell
                        out the generic schemas as sch_register and
                        sch_register_entry, abbreviate the specific
                        ones as sch_reg_* and sch_regentry_*,
                        deprecate bare "entry" and rename the held-in
                        relation from registry to register (it has
                        since become r_has_items_held_in_register).

