title:                  Generic schema id as prefix of every specific id
brief:                  |
                        Under sch_register_entry_*, the generic id is
                        a leading substring of each specific id, so a
                        reader of a diff, a file list or a search
                        result can mistake a change to one for the
                        other.
description:            |
                        Commit 232f001 names the specific schemas
                        sch_register_entry_* (tails concept, type,
                        relation, protective_mark and
                        writing_style_rule) beside the generic
                        sch_register_entry (file list). ASSUMPTION: a
                        reader who scans by prefix confuses the two
                        more often when one id is a prefix of the
                        other. Nothing in the repository measures
                        this.

