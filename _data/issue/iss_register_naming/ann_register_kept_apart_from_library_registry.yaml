title:                  Register kept apart from the library Registry
brief:                  |
                        Deprecating "registry" keeps the project's
                        word apart from the Registry class of the
                        referencing library the checker uses, so the
                        two vocabularies share one environment without
                        a clash.
description:            |
                        The checker builds a referencing.Registry
                        (src/cc_public/check/schema.py lines 40 and
                        145-155); the project depends on
                        jsonschema>=4.23 (pyproject.toml line 40).
                        con_register lists "registry" as deprecated
                        (_data/register/reg_concept.yaml lines
                        94-110). The held-in relation is renamed from
                        registry to register (commit message of
                        232f001), and is now
                        r_has_items_held_in_register (f587284).

