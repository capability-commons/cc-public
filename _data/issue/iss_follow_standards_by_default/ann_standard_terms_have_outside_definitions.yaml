title:                  Standard terms with definitions outside cc-public
brief:                  |
                        A term taken from a cited standard has a
                        meaning that a newcomer, maintainer or
                        federated partner can look up outside
                        cc-public, and may already know. A term of
                        cc-public's own design means only what
                        cc-public writes down.
description:            |
                        Each ISO/IEC 25010 concern names the
                        characteristic it corresponds to in its note
                        (_data/register/reg_concern.yaml lines 65,
                        103, 142, 179, 224, 266, 307, 346, 382).
                        Concept fields follow ISO 1087:2019
                        (_data/schema/sch_regentry_concept.yaml line
                        35). cc-public is federated
                        (_data/schema/sch_trait_identity.yaml lines
                        29-31; _data/register/reg_protective_mark.yaml
                        lines 45-46). AGENTS.md lines 85-87 ask agents
                        to follow and cite the standard. ASSUMPTION:
                        many engineers and language models have met
                        ISO/IEC 25010 terms before; not checked.
                        Merged from the compatibility, interaction
                        capability and maintainability advocates.

