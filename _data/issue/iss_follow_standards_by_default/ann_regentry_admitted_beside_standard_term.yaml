title:                  Local short forms as admitted terms
brief:                  |
                        Where a standard term is too long for very
                        frequent use, a local term is added as an
                        admitted term and the standard term stays
                        preferred. This saves the user effort without
                        leaving the standard's frame.
description:            |
                        Owner proposed regentry because it "will be
                        used VERY commonly" (2026-10-13T14:52:46Z).
                        regentry is an admitted term of
                        con_register_entry, whose preferred term stays
                        "register entry"
                        (_data/register/reg_concept.yaml lines
                        132-141). AGENTS.md lines 85-87 do not say a
                        deviation is allowed.

