title:                  Prefixed guids checked as prose mentions
brief:                  |
                        A prefixed guid written in prose is found as a
                        mention and checked like an id, so a trace
                        link written as a guid cannot dangle unseen. A
                        bare UUID in prose would escape the check.
description:            |
                        REGEX_MENTION and _mention:
                        src/cc_public/graph/extract.py lines 68-73,
                        493-507. dangling_mention accepts a guid:
                        src/cc_public/check/check.lp lines 457-472.
                        Will asked that every prefixed id or guid in
                        prose must exist (memory MEMORY.md line 30,
                        2026-10-13).

