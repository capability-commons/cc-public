title:                  Identity scheme of a data item
brief:                  |
                        By using both a readable id and a GUID, we can
                        enable human readable unambiguous references
                        in prose - with the added security of being
                        able to use a GUID as a stable reference
                        if/when the human readable id changes. By
                        adding a type prefix to both the human
                        readable id and the GUID, we enable the use of
                        grep and similar tools to build a database of
                        id references in arbitrary text.

