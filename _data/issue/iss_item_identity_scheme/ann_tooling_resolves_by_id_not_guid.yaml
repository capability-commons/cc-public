title:                  Tooling resolution by readable id
brief:                  |
                        The schema says the guid resolves an item, but
                        the tooling resolves every reference and edge
                        by its readable id and only checks the guid.
                        So two mechanisms serve one job, and across a
                        federation a colliding id could resolve a
                        trace link to the wrong item.
description:            |
                        Guid resolves:
                        _data/schema/sch_trait_identity.yaml lines
                        28-31, 112-113; id_target is a copy not to
                        resolve by: sch_trait_relation.yaml lines
                        112-123. Edges are built from ids only
                        (src/cc_public/graph/extract.py lines
                        458-462). dangling_reference and stale_guid
                        look up by id (src/cc_public/check/check.lp
                        lines 236-239, 243-256). The edit tool indexes
                        by id (src/cc_public/edit/edit.py line 204).
                        This is a gap in the build, not in the chosen
                        scheme; it could be fixed by keying edges on
                        the guid.

