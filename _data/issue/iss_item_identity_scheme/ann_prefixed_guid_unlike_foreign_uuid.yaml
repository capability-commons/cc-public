title:                  Prefixed guid distinct from a foreign UUID
brief:                  |
                        A prefixed guid cannot match a partner's bare
                        UUID, so CC can tell its own guids from
                        foreign ones in mixed data. A bare UUID guid
                        gives this up.
description:            |
                        A bare UUID cannot match the guid pattern,
                        which needs a prefix and an underscore
                        (_data/schema/sch_primitive.yaml line 101).
                        The prefix has no underscore, so prefix and
                        body split without a register (same file,
                        lines 53-57). August 2026 decision, in an
                        assistant-written summary, not Will's own
                        words: cc-public-session-context.md line 23.

