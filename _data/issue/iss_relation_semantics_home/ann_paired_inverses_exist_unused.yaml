title:                  Paired inverses existing with no use
brief:                  |
                        On-demand inverses exist only when an item
                        records an edge with them, while pairs create
                        a second entry whether or not any edge uses
                        it.
description:            |
                        An inverse "is minted when an item wants to
                        record an edge that way, and not as a matter
                        of course" (reg_relation.yaml lines 38-40). No
                        entry embeds an inverse today (13 entries, 0
                        inverse keys, HEAD 89c74d8); the one inverse
                        in the code base is a test fixture
                        (test_check.py lines 458-466). ASSUMPTION:
                        pairing would add about 13 entries today, none
                        used by any edge.

