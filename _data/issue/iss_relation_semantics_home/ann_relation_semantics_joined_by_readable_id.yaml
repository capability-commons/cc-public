title:                  Relation semantics joined by readable id
brief:                  |
                        The tooling joins an edge to its relation, and
                        an inverse to its primary, by readable id,
                        which the schema says does not resolve
                        reliably across a federation, so register
                        semantics reach a partner's edges only while
                        both sides keep the same ids.
description:            |
                        "The guid is what resolves; the readable id is
                        an advisory copy" (sch_trait_relation.yaml
                        lines 22-24, 99-104). The extractor builds
                        edges from id_relation and id_target
                        (extract.py lines 459-462) and inverses as
                        readable id pairs (extract.py lines 563-566);
                        derive.lp lines 60-66 reverse through that
                        pair. It bears equally on
                        dec_paired_relations. ASSUMPTION: partners
                        will reuse relations under a different or
                        stale id; no such case is recorded.

