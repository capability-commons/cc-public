title:                  Cardinality rules still in the checker
brief:                  |
                        Cardinality and other single-relation rules
                        are written by relation name in check.lp, so
                        the system today mixes the chosen design with
                        hard-coded checks.
description:            |
                        check.lp names twelve of the thirteen
                        relations by literal id, 31 times, with 2 more
                        in derive.lp. Examples: missing_about
                        (check.lp lines 290-301), answer_count
                        (305-315), determination_without_option
                        (319-327), supersession_across_types
                        (361-371), argument_without_concern (574-576).
                        The same constraints are stated again in
                        register prose (reg_relation.yaml lines
                        160-162, 290-291), so a change touches two
                        files, and a partner cannot see these rules in
                        the register. They were ported by hand from
                        Souffle in 6230e98 (6230e98^ check.dl lines
                        263-314). Rules that join several relations,
                        such as determination_across_issues (check.lp
                        lines 346-356), belong in the checker under
                        any alternative. The point fades if
                        cardinality becomes a declared field, as
                        sch_regentry_relation.yaml lines 38-41 allow.
                        At HEAD 89c74d8.

