title:                  Traces recordable from either end
brief:                  |
                        Because an edge may be recorded from either
                        end and is read back as one primary edge, a
                        link from an element to its reason can be
                        written on whichever item its author owns.
description:            |
                        reg_relation.yaml lines 45-50 (an author may
                        write only to items they own). primary_edge
                        reverses an inverse edge (derive.lp lines
                        53-66), and the checker reads primary_edge
                        (check.lp lines 295-301, 312-315). ASSUMPTION:
                        pairing could do the same only if each pair is
                        linked for tooling; no such design is
                        recorded.

