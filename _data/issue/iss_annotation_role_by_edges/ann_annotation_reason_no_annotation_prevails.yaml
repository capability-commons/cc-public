title:                  No rule on which annotation prevails
brief:                  |
                        Nothing decides which of two annotations
                        prevails, so an annotation holds no field that
                        states such an outcome.
description:            |
                        This reason was written by an assistant, not
                        by Will. It is in the t_annotation note
                        (_data/register/reg_data_item_type.yaml lines
                        409-414). Its wording comes from the legacy
                        t_annotation in bb8c338 ("Nothing computes
                        which of them prevails"); the ddr_annotation
                        that bb8c338 sch_annotation names is not in
                        the history. Will asked for the type ("Can we
                        add a type for annotation please",
                        2026-10-13T16:13:34Z) but gave no reason for
                        leaving out fields. All five advocates found
                        that the reason still holds: determinations
                        uphold or reject decisions, not annotations
                        (reg_data_item_type.yaml lines 777-780;
                        reg_relation.yaml lines 223-226). The reason
                        explains only the absence of a verdict field.
                        The current text gives no reason for leaving
                        out status, severity, category or author. The
                        legacy t_annotation note in bb8c338 gave one
                        for severity ("would be a finding") and
                        resolution ("would settle itself"); it was not
                        carried over.

