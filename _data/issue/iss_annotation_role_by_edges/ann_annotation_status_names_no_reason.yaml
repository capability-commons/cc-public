title:                  Status value without a traced reason
brief:                  |
                        A status or verdict field records that an
                        annotation is answered or accepted without
                        naming the item that answered it. The trace
                        from a conclusion to its reason breaks.
description:            |
                        Under edges, an answer is an annotation linked
                        by r_supports or r_challenges
                        (reg_relation.yaml lines 177-233). A challenge
                        "does not defeat what it challenges"
                        (reg_relation.yaml lines 223-226).
                        Determinations settle options (check.lp lines
                        333-342, 437-455). Will agreed to remove the
                        failure counts and status of the commit gate
                        because "They don't add information" (owner's
                        statement, 2026-10-14T10:20:31Z), and was
                        inclined to remove all statuses
                        (2026-10-13T21:00:19Z, point 5).

