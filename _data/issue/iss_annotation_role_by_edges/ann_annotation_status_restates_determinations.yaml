title:                  Status field as a second copy of the outcome
brief:                  |
                        A status or verdict field would record on the
                        annotation what edges and determinations
                        already record. The two copies can disagree.
description:            |
                        A determination upholds or rejects decisions,
                        and a decision no determination names is open
                        (reg_data_item_type.yaml lines 771-796;
                        sch_option.yaml lines 36-41; reg_relation.yaml
                        lines 358-407). Whether an annotation is
                        answered shows in incoming r_supports and
                        r_challenges edges (reg_relation.yaml lines
                        177-237). Whether it is practical is derived
                        in check.lp (lines 416-435, 551-563). Status
                        fields were removed from registers, entries
                        and decisions in 44034ef because nothing read
                        them (memory/lifecycle-and-status.md).
                        ASSUMPTION: a status field would need a
                        cross-item rule to stay consistent, since JSON
                        Schema checks one item at a time. ASSUMPTION:
                        a severity field would overlap the planned
                        computed ranking of concerns, which is not
                        built.

