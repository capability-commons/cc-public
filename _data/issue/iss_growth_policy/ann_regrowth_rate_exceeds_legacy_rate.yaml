title:                  Regrowth faster than the legacy growth
brief:                  |
                        The policy does not bound the rate of change.
                        The regrown tree wrote about 6,300 lines of
                        non-test code in about 28 hours, with single
                        commits over 1,000 lines, and review is again
                        the bottleneck.
description:            |
                        Legacy: 7.5k to 25.7k lines in 13 days, about
                        1.4k a day (note cc-public-session-context.md
                        line 48). Regrown: the first code commit is
                        ba66f33 (2026-10-13 20:14Z) and HEAD 89c74d8
                        (2026-10-14 23:41Z) holds 6,344 lines of
                        non-test .py and .lp (8,716 with tests); about
                        11.7k lines inserted on 2026-10-13 and
                        2026-10-14 before the squash (git log
                        --shortstat on tag pre_squash_20261014).
                        Commits c4a8721 (1,408 insertions), 12f83b7
                        (1,120) and 6230e98 (1,199) exceed 1,000
                        lines. "Review is the bottleneck"
                        (memory/MEMORY.md line 52). The size rule in
                        AGENTS.md lines 91-93 would apply equally to
                        pruning. ASSUMPTION: the legacy line counts,
                        like the 25.7k in note cc-folder-survey.md
                        line 29, exclude tests.

