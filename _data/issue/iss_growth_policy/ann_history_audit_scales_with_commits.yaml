title:                  History check cost per commit, not per change
brief:                  |
                        The history check extracts and checks two
                        whole trees for every commit, whatever it
                        changes. The rule for small changes means more
                        commits, so a full history audit grows as
                        commits times tree size, and takes over two
                        minutes at 33 commits.
description:            |
                        The chosen decision keeps each change small
                        enough to read in one sitting (AGENTS.md lines
                        89-93); Will likes finer commits, one verb per
                        commit (memory/MEMORY.md line 41). For each
                        commit, history.check extracts the commit's
                        tree and its parent's with git archive
                        (src/cc_public/commit/history.py lines 97-125;
                        src/cc_public/gate/gate.py lines 186-203). The
                        change check then lays out every file in both
                        trees to find what changed, and evaluates the
                        rules over the facts of the whole tree
                        (src/cc_public/commit/change.py lines 78-145).
                        Parsed documents are reused across commits by
                        path and content digest
                        (src/cc_public/graph/extract.py lines 104-108,
                        265-285), so under cProfile over 6 commits the
                        layout comparison takes about 60 percent of
                        the time and the clingo run about 25 percent
                        (verifier measurement 2026-10-15). cctool
                        history check over the 33 commits at 89c74d8
                        takes 133 s, about 4 s per commit (advocate
                        measurement 2026-10-15; a verifier re-run in a
                        scratch clone on a loaded 4-CPU container took
                        137 s). The pre-push hook checks only commits
                        the remote lacks (.githooks/pre-push lines
                        23-26, 33), but the whole history has been
                        checked after changes (memory/MEMORY.md lines
                        54-55). Device tool calls die at 180 s (line
                        45). ASSUMPTION: pruning the legacy tree would
                        also make many commits; the chosen decision
                        adds the rule for small changes with no
                        matching rule that the per-commit check cost
                        follow the change.

