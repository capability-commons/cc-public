title:                  Legacy trace broken in both directions
brief:                  |
                        The legacy tree held many elements with no
                        traced reason and many reasons that nothing
                        met. A regrown tree whose checks refuse
                        unnamed concepts, unused schemas and
                        unrecorded modules keeps the trace closer to a
                        checked property.
description:            |
                        Legacy: 25 of 71 types had no instances, 20
                        decision records decided tools never built,
                        and its gate contradicted the record it cites
                        (note cc-public-session-context.md lines
                        49-50, 61-63). cc-public checks that every
                        concept is named, every schema used, every
                        module and logic file recorded, and every
                        prefixed id in prose resolved
                        (src/cc_public/check/check.lp lines 202-207,
                        457-473, 608-643). The checks do not cover
                        types, relations, fields or commands.

