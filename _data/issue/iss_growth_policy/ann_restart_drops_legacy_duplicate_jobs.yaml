title:                  Duplicate legacy jobs dropped at once
brief:                  |
                        Restarting drops at once every job the legacy
                        tree did twice, and the regrown parts so far
                        keep one mechanism per job. Pruning would find
                        and remove each duplicate one by one.
description:            |
                        The legacy tree had duplicate indexes, edge
                        enumerations, validators, model clients and
                        renderers, and 14 register schemas that are
                        one template (note
                        cc-public-session-context.md lines 57-59). At
                        HEAD 89c74d8 the type register holds 18
                        entries and the relation register 13. The
                        derived relations are defined once in
                        derive.lp for both SQL and Datalog
                        (src/cc_public/graph/sql.py lines 18-24). One
                        printer lays out every file
                        (src/cc_public/edit/layout.py lines 34-37).

