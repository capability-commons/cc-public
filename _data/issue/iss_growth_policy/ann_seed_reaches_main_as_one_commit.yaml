title:                  Seed on main as one large commit
brief:                  |
                        The regrown seed reaches main as one commit of
                        11,910 lines, which no one can read as a
                        single change. The small steps survive only
                        under a tag.
description:            |
                        Commit 7dda99e adds 78 files and 11,910 lines
                        and replaces 45 earlier commits, kept under
                        tag pre_squash_20261014 (git show --stat
                        7dda99e; its message). Weak: a one-off that
                        does not grow with the tree.

