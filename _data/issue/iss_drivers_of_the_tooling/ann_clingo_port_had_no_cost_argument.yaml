title:                  Clingo port without a cost argument
brief:                  |
                        The largest change to lc_tooling after the
                        drivers were set, the port of the cross-item
                        checks to clingo, was settled with no argument
                        on its effort. Without cost as a driver, a
                        rewrite need not be costed.
description:            |
                        Commit 6230e98 changes 28 files, with 1199
                        lines added and 1110 removed. The annotations
                        of iss_cross_item_checks_engine argue only for
                        the five tooling drivers, and its
                        determination rests on graph size and pinning
                        (det_cross_item_checks_engine.yaml lines
                        12-19). The one cost argument on lc_tooling,
                        ann_a_port_costs_a_rewrite, was written in
                        6592fb5, before 68d1924 set the drivers. This
                        supports dec_include_cost_and_schedule for
                        cost only.

