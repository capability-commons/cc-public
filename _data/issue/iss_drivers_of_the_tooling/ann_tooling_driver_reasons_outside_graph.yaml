title:                  Tooling drivers recorded without reasons
brief:                  |
                        The five driver edges of lc_tooling carry no
                        reason in the graph. Their reasons live only
                        in an assistant-written commit message, and
                        one names Souffle, which the checks no longer
                        use.
description:            |
                        _data/logical_component/lc_tooling.yaml lines
                        17-42 hold five r_is_driven_by edges with no
                        reason. The 68d1924 message gives dependency
                        risk "because of Souffle and a development
                        machine with no network". Commit 6230e98
                        (2026-10-14 22:51) moved the checks to clingo;
                        no file under src names Souffle. Each driver
                        gates every determination on lc_tooling
                        (src/cc_public/check/check.lp lines 448-453).
                        Recording this issue repairs the trace; the
                        point is against the decision as first
                        recorded.

