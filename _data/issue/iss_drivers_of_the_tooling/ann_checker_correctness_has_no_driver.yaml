title:                  Checker correctness without a driver
brief:                  |
                        The main job of lc_tooling is to give the
                        right verdict on the item graph, and that job
                        belongs to functional suitability, which no
                        chosen driver covers. Adding it gives that job
                        one required concern.
description:            |
                        lc_tooling "checks the item graph against its
                        rules"
                        (_data/logical_component/lc_tooling.yaml lines
                        12-15). Functional suitability covers "whether
                        each function gives the right result"
                        (_data/register/reg_concern.yaml lines 56-62).
                        Reliability excludes "Whether a result is
                        right" (reg_concern.yaml line 118), as it did
                        at 68d1924. The 68d1924 message gives
                        reliability as a driver "because a wrong
                        checker is worse than none", which is the job
                        reliability excludes; that reason was written
                        by an assistant. unargued_driver asks only for
                        drivers (src/cc_public/check/check.lp lines
                        448-453). At 89c74d8 no annotation under
                        _data/issue argues for
                        concern_functional_suitability. The gap was
                        raised in
                        notes/advocate-experiment-2-checks-engine.md
                        line 73 (assistant-written). lc_argumentation,
                        proposed alongside this issue, is driven by
                        functional suitability.

