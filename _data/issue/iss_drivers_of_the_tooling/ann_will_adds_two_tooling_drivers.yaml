title:                  Owner's addition of two tooling drivers
brief:                  |
                        Will added functional suitability and
                        reviewability to the drivers of lc_tooling,
                        because the right result is important and the
                        review burden is very large.
description:            |
                        Owner's statement, W 2026-10-15T10:59:29Z: "I
                        agree that we need functional suitability as a
                        driving concern for lc_tooling. This seems
                        pretty important. I also accept reviewability
                        as a driving concern for lc_tooling -
                        especially given the huge (and practically
                        impossible) review burden that we are
                        generating." He also said that not every
                        driver needs a reason.

