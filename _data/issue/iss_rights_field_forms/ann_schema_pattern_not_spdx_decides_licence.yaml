title:                  Schema pattern as the licence gate
brief:                  |
                        The schema pattern, not SPDX, decides which
                        licence expressions pass, since it rejects
                        some that SPDX allows.
description:            |
                        _data/schema/sch_trait_rights.yaml line 132
                        against the SPDX grammar
                        (https://spdx.github.io/spdx-spec/v2.3.1/SPDX-license-expressions/).
                        Raised by the compatibility advocate. The
                        flexibility and maintainability advocates read
                        "SPDX remains the authority" as a claim about
                        what an identifier names, not about syntax,
                        and found no contradiction.

