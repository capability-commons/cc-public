title:                  Rights fields tied to project files by hand
brief:                  |
                        No check compares the item rights fields with
                        NOTICE, LICENSE or pyproject.toml. A drift
                        between them would go unreported.
description:            |
                        A case-insensitive grep of src/ for "notice"
                        and "spdx" finds no code. LICENSE is the
                        Apache License 2.0 unchanged and NOTICE is
                        copied from the legacy repository (commit
                        a0b3f50 message). The risk grows with the
                        number of items.

