title:                  Checked licence for every source file
brief:                  |
                        The rule that every .py file under src holds
                        an item, with schema validation, makes each
                        source file declare a copyright and an SPDX
                        licence.
description:            |
                        unrecorded_module (fd6323a check.dl lines
                        65-69). A python module item is standalone and
                        carries the rights trait, which requires
                        copyright and license (sch_python_module.yaml
                        line 38; sch_standalone.yaml line 43;
                        sch_trait_rights.yaml lines 46-48, 129-150).
                        Under the other decision a file with no header
                        holds no item and meets no schema. It does not
                        cover installed packages or check that a
                        licence is true. At 89c74d8 all 37 .py files
                        under src name William Payne and Apache-2.0,
                        so no third-party source is vendored there.

