title:                  Cycle rule cost growing with chain length
brief:                  |
                        The cycle rule computes every pair joined by a
                        chain of an acyclic relation, so its cost
                        grows with the square of a chain's length. It
                        is cheap only while chains are short.
description:            |
                        cycle and reaches (check.lp lines 523-547).
                        r_supports and r_supersedes are acyclic
                        (reg_relation.yaml lines 205, 270). The tree
                        has 13 r_supports edges. One chain takes 0.019
                        s at 200 edges and 2.4 s at 2000 (scratchpad
                        perf51c.py). Will plans larger graphs
                        (memory/MEMORY.md line 21). The fix would be
                        local to one rule.

