title:                  Concern rule reversed once arguments were written
brief:                  |
                        The argument rule, as chosen, required exactly
                        one concern per argument. Once real arguments
                        were written, that result was judged wrong
                        twice in one day and the rule was changed both
                        times.
description:            |
                        At fd6323a, the one-concern check reports an
                        annotation that supports or challenges and
                        does not speak for exactly one concern (git
                        show fd6323a:src/cc_public/check/check.dl
                        lines 159-169). Will asked about "Plain
                        conditions are forced to speak for a concern."
                        (owner's statement, 2026-10-14T18:42:50Z,
                        will-messages.md line 659). d03026b
                        (2026-10-14T19:01:48Z) let an annotation that
                        bears only on other annotations argue for no
                        concern. Will wrote "Maybe we should allow
                        more than one concern per annotation" (owner's
                        statement, 2026-10-14T21:51:15Z,
                        will-messages.md line 712). aa23286
                        (21:52:18Z) split that check into
                        argument_without_concern and a check on
                        concerns of annotations that bear on no
                        decision, and allows several concerns. A test
                        now asserts that an argument with two concerns
                        passes (src/cc_public/check/_test/
                        test_check.py line 650). The rule was chosen
                        at 2026-10-13T23:26:20Z. No annotation item
                        existed then (git ls-tree fd6323a has none;
                        the first was added in 6592fb5,
                        2026-10-14T16:15:04Z). The failing rule is
                        also what brought the question to Will. The
                        defect is fixed.

