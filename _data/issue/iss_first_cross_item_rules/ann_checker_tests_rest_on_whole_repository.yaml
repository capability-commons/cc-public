title:                  Checker tests resting on the whole repository
brief:                  |
                        Since the seven rules, 56 of the 59 checker
                        tests copy the whole repository and expect an
                        exact set of failures. A defect anywhere fails
                        each of them.
description:            |
                        Before fd6323a the tree fixture copied only
                        _data (fd6323a^:src/cc_public/conftest.py
                        lines 55-61). From fd6323a it copies the whole
                        repository "since items in the data mention
                        items in the source" (fd6323a message;
                        conftest.py lines 44-56). Tests compare exact
                        failure sets (test_check.py lines 231-236,
                        557-570). ASSUMPTION: copy time is small
                        today; not timed.

