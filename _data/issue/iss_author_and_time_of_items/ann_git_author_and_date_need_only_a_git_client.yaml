title:                  Git as a format partners already read
brief:                  |
                        Every commit carries an author and a date that
                        any standard git client shows, so a partner
                        who takes the whole repository needs no
                        project tool to learn who added an item and
                        when.
description:            |
                        All 33 commits on main carry an author name,
                        email and date (git log --format='%an <%ae>',
                        2026-10-15). The clone examined was made from
                        a git bundle (git remote -v). This fails for
                        any exchange of a subset of the items and for
                        rewritten history.

