title:                  Git author that does not name the determiner
brief:                  |
                        Every commit on main has the same author and
                        co-author trailer, so the adding commit cannot
                        tell a determination the owner made from an
                        item the assistant drafted. The one
                        determination so far names its determiner only
                        in prose.
description:            |
                        All 33 commits on main have author William
                        Payne and the trailer Co-Authored-By: Claude
                        Opus 5.5 (git log on main, 2026-10-15).
                        det_cross_item_checks_engine names its
                        determiner in its brief (_data/issue/
                        iss_cross_item_checks_engine/
                        det_cross_item_checks_engine.yaml lines
                        12-19), as does the commit item of 6c0a949. No
                        check reads that prose.

