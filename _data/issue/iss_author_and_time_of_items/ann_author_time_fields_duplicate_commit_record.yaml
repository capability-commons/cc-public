title:                  A second record of who and when to keep in step
brief:                  |
                        Git and the commit item already record who and
                        when for each commit. Fields would add a
                        further value that schemas, cctool new and the
                        checks must mint, validate and keep in
                        agreement.
description:            |
                        git records an author and a date on every
                        commit (git log -1 --format='%an %ad'
                        89c74d8). The id of each commit item is the
                        UTC time of the commit plus six hex digits of
                        its guid
                        (_data/register/reg_data_item_type.yaml lines
                        710-712 and 718;
                        src/cc_public/commit/message.py lines 72 and
                        118). cctool new builds an item only from the
                        fields and edges it is given
                        (src/cc_public/edit/edit.py lines 233-271).
                        ASSUMPTION: a time field could differ from the
                        commit time, so keeping them consistent needs
                        a further rule in the commit check. The cost
                        is per type, not per item, and a creation time
                        set once by cctool new would rarely change, so
                        the saving is modest.

