title:                  Who and when in the adding commit
brief:                  |
                        The commit that adds an item records who made
                        it and when, so the item needs no field for
                        them.
description:            |
                        Written by an assistant, not by Will. The
                        owner's reason is not recorded. Sources:
                        _data/schema/sch_determination.yaml lines
                        33-36 ("Who made a determination, and when, is
                        recorded by the commit that adds it, not by a
                        field"); _data/register/reg_concept.yaml line
                        310, con_decision ("Owner and timestamps are
                        left to git");
                        _data/schema/sch_annotation.yaml lines 28-31
                        (no author or time field, from the legacy
                        ddr_annotation, bb8c338).

