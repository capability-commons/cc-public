title:                  Author and time lost in copies without history
brief:                  |
                        Who made an item and when exists only in the
                        history of the repository that holds it. Items
                        exchanged as a subset, or held in a squashed,
                        shallow or exported copy, have no author or
                        time.
description:            |
                        No author or time field: _data/schema/
                        sch_annotation.yaml line 30;
                        _data/schema/sch_determination.yaml lines
                        33-36; _data/register/reg_concept.yaml line
                        310. The tooling asks git log only for hashes,
                        subjects and bodies (src/cc_public/commit/
                        history.py lines 53, 105, 139 and 163), so the
                        graph holds no author or time. Each
                        determination sits in its issue folder
                        (sch_determination.yaml lines 30-32), which
                        can be copied without history.
                        actions/checkout fetches one commit by default
                        (fetch-depth: 1,
                        https://github.com/actions/checkout README).
                        The loss repeats with each squash, shallow
                        clone or move to a new host.

