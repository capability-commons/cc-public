title:                  No new platform dependency from git
brief:                  |
                        The tooling already needs git and its history
                        to check commits, so taking author and time
                        from git adds nothing an environment must
                        provide.
description:            |
                        pixi run hooks points git at .githooks
                        (pyproject.toml lines 24-26 and 68). cctool
                        history check reads commits with git rev-list
                        and git log (src/cc_public/commit/history.py).
                        The supported platforms are osx-arm64 and
                        linux-64 (pyproject.toml line 52; README.md
                        lines 28-30), and git runs on both.
                        ASSUMPTION: no target environment without git
                        is planned.

