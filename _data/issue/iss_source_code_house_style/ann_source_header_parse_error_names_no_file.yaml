title:                  Source headers widen the crash surface of the check
brief:                  |
                        Every source file carries a data item header
                        that the checker parses, and a YAML slip in a
                        header, or a syntax error in a Python module
                        that cctool does not import, stops cctool
                        check with a traceback that does not name the
                        file, which slows recovery.
description:            |
                        Sources: commit 150d0f7 message; commit
                        beb23ab added Python item checks about five
                        minutes after 09ac7a6;
                        src/cc_public/graph/extract.py lines 278-290
                        and 348 (only UnicodeDecodeError is caught).
                        Reproduced by the advocate at 89c74d8: a YAML
                        error in the header of derive.lp raises an
                        error naming "<unicode string>". Checked by
                        the verifier: a syntax error in a test module
                        raises SyntaxError naming "<unknown>", but one
                        in gate.py names the file, as cctool imports
                        it. The gate fails closed, so no data is
                        harmed. Naming the file in the error would fix
                        this without changing the style. ASSUMPTION:
                        under the common style source files would
                        carry no items.

