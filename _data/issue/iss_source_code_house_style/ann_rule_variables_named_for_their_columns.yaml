title:                  Rule variables named for their columns
brief:                  |
                        A variable named for the column it fills says
                        which column a rule joins on, so a newcomer
                        can read a rule without a lookup, and
                        AGENTS.md sets this form down with check.lp as
                        the model.
description:            |
                        Sources: src/cc_public/check/check.lp lines
                        34-60 (variables such as Id, File, Line, Type,
                        Regex); AGENTS.md lines 80-83. The point grows
                        with the number of rules and joins.

