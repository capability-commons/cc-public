title:                  Multi-line declarations in comments
brief:                  |
                        Putting each declared column on its own line
                        costs a small extra rule in the declaration
                        parser, since a clingo declaration is a
                        comment, and the one-line form would not need
                        it.
description:            |
                        Sources: src/cc_public/graph/datalog.py lines
                        63-68 (REGEX_DECL continuation over "%" lines)
                        and line 169; commit dc5f35f needed no parser
                        change while .decl was native Souffle syntax.
                        A fixed cost that does not grow.

