title:                  Item that travels with its file
brief:                  |
                        An item in the docstring or header goes
                        wherever the file goes, with its id,
                        copyright, license and protective mark. A
                        sidecar under _data sits in another directory
                        and must be found and moved as well.
description:            |
                        Rights fields in the module docstring and
                        comment header: src/cc_public/check/check.py
                        lines 1-12, src/cc_public/check/check.lp lines
                        1-11, pyproject.toml lines 1-12. A session
                        summary that Will pasted from another thread
                        (will-messages.md 2026-10-09T17:52:14Z;
                        written by an assistant, listed there as
                        decisions settled) says that a standalone item
                        can travel on its own and rights attach to
                        what travels ("Standalone and embedded"), and
                        that global items live in /_data/ and
                        source-scoped items in src/**/_data/
                        ("Layout"). The REUSE specification also puts
                        copyright and license in the file's own
                        comment header
                        (https://reuse.software/spec-3.3/). The field
                        names are not the SPDX tags that REUSE tools
                        read, which is a naming question, not one of
                        where the item lives. From the compatibility
                        and flexibility advocates.

