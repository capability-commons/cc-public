title:                  Source items with no edge
brief:                  |
                        The rule makes each source file hold an item
                        but not name the reason it exists. 39 of the
                        40 items under src have no relation, and no
                        check reports it, so the decision gives a
                        place for a trace, not the trace.
description:            |
                        40 files under src (37 .py, 3 .lp) at HEAD
                        89c74d8; all but src/cc_public/__init__.py
                        hold "relation: []". unrecorded_module tests
                        only that an item exists
                        (src/cc_public/check/check.lp lines 207-210).
                        derive.lp has no rule that lets a module
                        inherit its package's r_realizes edge
                        (src/cc_public/graph/derive.lp lines 35-83).
                        ASSUMPTION: such a rule could use the dotted
                        id. A sidecar would have the same gap. From
                        the traceability advocate.

