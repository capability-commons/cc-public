title:                  Hand edits to move a source file
brief:                  |
                        The id of a source item is its dotted import
                        path, and cctool refuses to rename or remove
                        such items. Moving or renaming a module is a
                        hand edit of the item and of every reference
                        to it.
description:            |
                        Id derived from path: src/cc_public/graph/
                        extract.py lines 243-262; misplaced_module:
                        src/cc_public/check/check.lp lines 120-130.
                        cctool rename and remove refuse pym, pyp, lpf
                        and file items (src/cc_public/edit/edit.py
                        lines 105, 698, 731, 774-786). Moving and
                        removing source files was listed as not built
                        on 2026-10-14 (memory/MEMORY.md line 44). In
                        6230e98 three dls_ items were removed and
                        three lpf_ items replaced them, "since a guid
                        cannot change its prefix". The cost comes from
                        the path-derived id, not from where the item
                        is written; a sidecar keyed by path would
                        share it. A move command would remove most of
                        it. From the maintainability advocate.

