title:                  Dynaflow as the name of only the dynamic level
brief:                  |
                        Frozen subgraphs, with a schedule fixed at
                        design time, remain a full part of the engine.
                        A name that says dynamic on the whole engine
                        invites a reader to expect a frozen island to
                        be rewirable, and makes a reviewer check
                        whether the word on a frozen part is a slip.
description:            |
                        Sources: frozen subgraphs have a schedule
                        "fixed at design time and compiled for
                        whole-program optimisation"; dynamic ones
                        "load, start, stop, restart and rewire
                        components from configuration at runtime"
                        (axair-orchestrator docs/execution_levels.md
                        lines 7-10). In a frozen process only a
                        per-node enable flag changes at runtime (line
                        40). Frozen islands in dynamic graphs are the
                        main way the levels meet (lines 74-80, decided
                        2026-10-16). In the draft design, dynamic
                        changes happen only between steps (lines
                        70-72), and reconfiguration within a segment
                        "should select from a finite set of
                        pre-validated topologies (modes)" (lines
                        213-215). Owner's statement
                        (2026-10-20T15:07:59Z): the engine "is
                        intended to incorporate the dynamic-graph
                        capabilities I'd postponed in the past".
                        ASSUMPTION: readers take a product name as
                        describing what it does.

