title:                  Dataflow as a generic word
brief:                  |
                        Dataflow is already a Google Cloud product and
                        a PyPI package. As a common noun the dataflow
                        engine claims nothing, but it cannot become a
                        package or product name without a qualifier,
                        and if cc-public ever held a second dataflow
                        engine it would need one.
description:            |
                        Sources: Google Cloud Dataflow, launched
                        2014-06-25, which Apache Beam reaches through
                        its DataflowRunner
                        (https://beam.apache.org/releases/pydoc/2.68.0/apache_beam.runners.dataflow.html);
                        PyPI package dataflow
                        (https://pypi.org/pypi/dataflow/json). A
                        partner may hold a concept register of its own
                        (_data/register/reg_concept.yaml). cctool
                        rename does not reach a plain word in prose
                        (AGENTS.md), so adding a qualifier later is a
                        change by hand. The second engine is a
                        hypothetical case.

