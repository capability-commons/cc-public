title:                  Engine called Stableflow when frozen and Dynaflow when dynamic
brief:                  |
                        Use two names: Stableflow for the frozen
                        engine, whose schedule is fixed at design
                        time, and Dynaflow for the dynamic one, whose
                        graph changes on demand.

