title:                  Integrated system as the offer, not the engine
brief:                  |
                        A brand name on the engine puts the engine
                        forward as the product. A plain descriptive
                        name leaves the integrated system as the thing
                        outsiders know and look for, which is what the
                        owner says is the offer.
description:            |
                        Sources: owner's statement
                        (2026-10-20T12:23:14Z), "the selling point
                        isn't the engine, it's the entire integrated
                        system and process that it lives within". The
                        source design said the intent of xact, the
                        earlier name of Stableflow, "is not to compete
                        with or replace these frameworks, but rather
                        to provide a uniform interface for the
                        automatic configuration and deployment of such
                        systems" (Design Factory,
                        pl/stableflow/rough_notes.rst line 1281).
                        ASSUMPTION: outsiders take a branded part as a
                        product in its own right.

