title:                  Dynaflow and dataflow as look-alike words
brief:                  |
                        Dynaflow and dataflow are both eight letters,
                        start with d and end in aflow, and would sit
                        side by side in the same items. A reader
                        skimming may confuse them, and a writer may
                        mistype one for the other.
description:            |
                        Sources: the two strings differ only in
                        letters two and three. The preferred terms are
                        "dataflow node" and "dataflow edge"
                        (_data/register/reg_concept.yaml). cc-public
                        content is almost entirely LLM-generated, and
                        humans inspect and review it (owner's
                        statement, 2026-10-18). ASSUMPTION: the
                        overlap raises misreading in review; it has
                        not been measured.

