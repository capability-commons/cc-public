title:                  Stableflow already the name of the source engine
brief:                  |
                        In cc-public, Stableflow names the Design
                        Factory engine that items cite as their
                        source. If the port takes the same name, the
                        lines that say only "Stableflow" could mean
                        either engine.
description:            |
                        Sources: at 09cbf25, "Stableflow" is on 24
                        lines in 6 files (git grep -i -c stableflow).
                        10 are prose and every one refers to the
                        Design Factory original; 14 are ids or Design
                        Factory paths, such as
                        sys_stableflow_smoketest and
                        dfn_stableflow_smoketest.printer. Five prose
                        lines say "of Design Factory" or "in Design
                        Factory" and would stay clear (for example
                        reg_concept.yaml lines 880-882,
                        sys_stableflow_smoketest.yaml line 27). Five
                        say only "Stableflow" (reg_concept.yaml lines
                        910 and 957, sch_system_configuration.yaml
                        line 46, icd_process_controller.yaml line 30,
                        and the smoketest title). The native successor
                        design already calls the port Stableflow: "A
                        native C++ version of the Stableflow
                        simulation engine" (axair-orchestrator
                        README.md line
                        3) and "Native Stableflow"
                          (docs/component_interface.md line 1). The
                          engine is ported into cc-public, not used as
                          a dependency (owner's statement,
                          2026-10-20). cctool rename changes ids in
                          documents and lists, but does not change,
                          files outside documents; a plain word in
                          prose is not an id, so a later rename does
                          not reach it (AGENTS.md).

