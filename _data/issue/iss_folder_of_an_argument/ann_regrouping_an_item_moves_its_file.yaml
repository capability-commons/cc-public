title:                  File moves when items change issue
brief:                  |
                        A change to the issue an item belongs to is
                        also a file move, so a small change of meaning
                        arrives as a large rename. The first such
                        change bundled 35 moves with new checks and
                        schema edits in one commit.
description:            |
                        Commit 1ba2895 changes 48 files, 392
                        insertions and 164 deletions, and 35 of them
                        are moves into two issue folders, in the same
                        commit as changes to check.lp, edit.py, their
                        tests, three registers and three schemas (git
                        show -M --stat 1ba2895). Each moved annotation
                        also changes its r_is_about target, so each
                        move is a rename with an edit. Git shows a
                        move as a rename only above 50% similarity by
                        default (https://git-scm.com/docs/git-diff).
                        The path and the edges must change together,
                        or misplaced_document fails. Under the type
                        layout a regrouped item keeps its path. The
                        number of files grows with one argument, not
                        with the graph. ASSUMPTION: such regrouping is
                        rare next to adding items. No rule says to
                        commit moves apart from other edits (search of
                        .agents/skills/editing-data-items/SKILL.md
                        only).

