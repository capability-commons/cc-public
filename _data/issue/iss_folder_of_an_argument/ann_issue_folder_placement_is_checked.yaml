title:                  Issue folder placement checked and tested
brief:                  |
                        The issue layout comes with checks that report
                        a file outside its issue folder and a
                        determination across two issues, and cctool
                        new writes into the issue folder. It is
                        enforced, not a convention.
description:            |
                        misplaced_document and
                        determination_across_issues in
                        src/cc_public/check/check.lp (commit 1ba2895).
                        Tests: src/cc_public/check/_test/test_check.py
                        lines 254, 261 and 276, and
                        src/cc_public/edit/_test/test_edit.py line
                        257.

