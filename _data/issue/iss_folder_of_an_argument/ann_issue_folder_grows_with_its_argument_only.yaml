title:                  Issue folder that grows only with its argument
brief:                  |
                        Every file of one argument sits under one
                        path, so a reviewer or an agent can read one
                        argument apart from the rest. A type folder
                        grows with the whole graph, while an issue
                        folder grows only with its own argument.
description:            |
                        Before 1ba2895, one argument spread over
                        _data/annotation/, _data/decision/ and
                        _data/determination/, and _data/annotation/
                        held 29 files for two arguments (git ls-tree
                        52e3e6d). At 89c74d8 the two issue folders
                        hold 18 and 19 files. misplaced_document keeps
                        every item of an issue in its folder
                        (src/cc_public/check/check.lp lines 169-184),
                        and a determination may settle the decisions
                        of one issue only
                        (determination_across_issues). A path limits
                        git diff and git log to one argument
                        (https://git-scm.com/docs/git-log). Will plans
                        to review in batches of five (owner's
                        statement, 2026-10-14T23:39:41Z) and expects
                        the project to be driven mainly by agents
                        (owner's statement, 2026-10-14T22:59:35Z). The
                        tooling reads the whole tree by rglob either
                        way (src/cc_public/graph/extract.py line 201),
                        so its run cost is the same under both
                        layouts. ASSUMPTION: one argument stays near
                        its present size of about 20 files.
                        ASSUMPTION: an agent gathers an argument by
                        listing folders rather than by querying the
                        graph.

