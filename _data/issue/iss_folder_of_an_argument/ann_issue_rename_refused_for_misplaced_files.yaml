title:                  Issue rename refused by the folder check
brief:                  |
                        cctool rename renames the issue's file but not
                        its folder, so every item of the argument is
                        then reported misplaced and the rename is
                        refused. Renaming an issue needs the files
                        moved by hand.
description:            |
                        rename in src/cc_public/edit/edit.py lines
                        722-771 renames a file named for the item in
                        place and moves no folder. Tried on a copy of
                        the tree with iss_tooling_language: "Refused:
                        the edit adds 18 failures", all
                        misplaced_document (2026-10-15).
                        memory/MEMORY.md line 55 notes that a rename
                        of an issue does not move its folder. Under
                        the type layout an issue rename changes one
                        file name and the references to it. The cost
                        grows as issues are renamed more often.

