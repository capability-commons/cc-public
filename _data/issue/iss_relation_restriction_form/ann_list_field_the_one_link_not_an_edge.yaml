title:                  List field as the one link that is not an edge
brief:                  |
                        A list of lists in a field would be the one
                        link between items that is not an edge, which
                        uniform relations rule out.
description:            |
                        William Payne asked that links between items
                        be made uniformly as relations in the relation
                        list (2026-10-17). As edges, restrictions are
                        read by the extractor with no new code, and
                        appear in queries and on the review pages like
                        any other edge.

