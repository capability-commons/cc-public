title:                  Rule engine outside the lock at first
brief:                  |
                        When pixi was adopted, Souffle could not be
                        locked by it, so the engine stayed on the PATH
                        until a separate decision moved the checks to
                        clingo. A return to Souffle for a larger graph
                        would bring the gap back.
description:            |
                        Commit 2132eaf message: "Souffle is not on
                        conda-forge and is expected on the PATH". The
                        PyPI name souffle belongs to an unrelated
                        package; Souffle 2.5 is in Homebrew
                        (ann_souffle_is_outside_the_locked_environment).
                        clingo entered pixi in 5665ace on 2026-10-14.
                        Will asked "Is clingo available through pixi?"
                        (2026-10-14T22:08:30Z), and
                        det_cross_item_checks_engine reads "move to
                        clingo, which pixi can pin" and says Souffle
                        may return when the graph is large (lines
                        13-17). The tooling still calls git from the
                        PATH (gate.py line 174, history.py line 176).

