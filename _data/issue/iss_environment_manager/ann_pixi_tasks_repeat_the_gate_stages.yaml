title:                  Tasks repeating the gate
brief:                  |
                        The pixi tasks check, lint and test name the
                        same jobs that cctool gate runs, spelt with
                        different arguments, so one job is defined in
                        two places.
description:            |
                        pyproject.toml lines 64-68 define check, test,
                        lint, gate and hooks. cctool gate runs check,
                        ruff with --no-cache and pytest with -p
                        no:cacheprovider and a shard (gate.py lines
                        64-66). AGENTS.md line 9 states done in terms
                        of the tasks, while the commit gate uses
                        cctool gate. pixi could manage the environment
                        without tasks, so this challenges a part of
                        the choice, not pixi itself.

