title:                  Repeatable gate runs from the lock
brief:                  |
                        With a committed lock and every hook run
                        through pixi run --frozen, each commit is
                        checked by the same exact tool versions.
description:            |
                        pixi.lock lists exact builds, for example
                        python-3.15.0-h6e52b48_101_cp315 and
                        clingo-5.8.2-py315h62b6238_1 (lines 15 and
                        40). The lock was committed in e232fb3. All
                        five hooks exec "pixi run --frozen ..."
                        (.githooks/commit-msg 29, pre-commit 28,
                        pre-merge-commit 32, pre-push 33,
                        prepare-commit-msg 31). One limit: --frozen
                        does not stop when pyproject.toml has changed
                        without a new lock, so the gate then runs on
                        the old environment without saying so;
                        --locked would refuse
                        (https://pixi.prefix.dev/latest/reference/cli/pixi/run/).
                        ASSUMPTION: nothing else compares manifest and
                        lock; none was found.

