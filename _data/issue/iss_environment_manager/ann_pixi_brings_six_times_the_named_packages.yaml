title:                  Indirect dependencies far outnumber direct ones
brief:                  |
                        The environment brings in about six times as
                        many packages as the project names, plus pixi
                        itself and two package services. Each can
                        change or vanish, though pixi records them.
description:            |
                        pyproject.toml names 3 runtime libraries and 4
                        conda packages; the linux-64 environment in
                        pixi.lock holds 44 entries (lines 12-55) from
                        conda.anaconda.org/conda-forge and pypi.org
                        (lines 4-7). No pixi version is pinned (no
                        requires-pixi key). The device VM has no pixi
                        and uses a hand-written stand-in
                        (memory/MEMORY.md line 39). Some locked
                        packages are GPL-3.0-only or GPL with the GCC
                        exception (pixi.lock lines 291-299, 385, 399,
                        501). ASSUMPTION: these are toolchain parts
                        not distributed with cc-public, so its
                        Apache-2.0 licence is not affected; not
                        checked against ISO/IEC 5230. The
                        tools-on-PATH way carries the same libraries
                        without a record.

