title:                  Gate checks on one Python only
brief:                  |
                        The project claims Python 3.12 and later, but
                        the locked environment, and so the gate, runs
                        only Python 3.15. Nothing checks the lowest
                        version the project claims.
description:            |
                        pyproject.toml line 38 sets requires-python
                        ">= 3.12" and line 59 python ">=3.12";
                        pixi.lock holds python 3.15.0 only (lines 40
                        and 80). The pre-commit hook runs the gate in
                        the pixi environment (.githooks/pre-commit
                        line 28). ruff targets py312 (pyproject.toml
                        line 90), which catches some newer syntax but
                        tests no library behaviour (ASSUMPTION). A
                        weak point today: measured by the advocate on
                        2026-10-15 on Python 3.12.3 at 89c74d8, all
                        326 tests pass and cctool check reports 0
                        failures. Tools on the PATH would test on
                        whatever Python each machine has, which is no
                        better as a guarantee.

