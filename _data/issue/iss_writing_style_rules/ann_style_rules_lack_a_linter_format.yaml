title:                  No rule format of a prose linter
brief:                  |
                        Neither alternative holds rules in the format
                        of an established prose linter, so a partner
                        who uses one translates the rules by hand.
description:            |
                        Vale holds each rule as a YAML file with the
                        fields extends, message and level
                        (https://docs.vale.sh/topics/styles). No file
                        in the repository names Vale, textlint or
                        proselint (grep over the clone, excluding
                        .git).

