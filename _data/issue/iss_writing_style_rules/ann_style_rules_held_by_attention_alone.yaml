title:                  Thirteen rules held by attention alone
brief:                  |
                        Thirteen of fourteen rules read none, so on
                        every prose change, much of it written by a
                        model, thirteen rules are held only by the
                        attention of whoever writes or reviews it. The
                        register records the gap but does not close
                        it.
description:            |
                        enforcement none at
                        _data/register/reg_writing_style_rule.yaml
                        lines 58, 85, 108, 140, 165, 195, 220, 245,
                        272, 304, 330, 359, 416; check at line 442. No
                        judge exists in src (grep, 2026-10-15). The
                        owner asks for editing tools that keep prose
                        "conformant-by-construction" (owner's
                        statement 2026-10-13T21:57:52Z,
                        will-messages.md line 394). All 33 commits on
                        the current branch, and 43 of 45 under tag
                        pre_squash_20261014, name a model as
                        co-author.

