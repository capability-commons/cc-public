title:                  Register that shows where the gaps are
brief:                  |
                        Each rule states what holds it, and a rule
                        that nothing holds reads none, so the register
                        shows which rules are not yet enforced.
description:            |
                        Recorded reason in
                        _data/schema/sch_regentry_writing_style_rule.yaml
                        lines 73-75: "A rule is honest about this.
                        Where nothing holds it yet, the value is none,
                        and the register shows where the gaps are."
                        This text was written by an assistant, not by
                        Will. Related statements relayed by the owner:
                        "All thirteen read none: nothing enforces any
                        of them yet" (2026-10-09T17:52:14Z), and
                        "Remove the older non-ASCII em-dash"
                        (2026-10-13T19:56:50Z, commit 09d33bb).

