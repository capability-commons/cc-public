title:                  Unchecked naming rule
brief:                  |
                        No check reads the preferred or deprecated
                        terms, so the rule rests on review, and names
                        already drift from it. A reviewer must judge
                        each name by hand.
description:            |
                        Rule: AGENTS.md lines 54-55. No file under
                        src/ reads term_deprecated or term_preferred
                        at 89c74d8; the only concept check is
                        unused_concept (src/cc_public/check/check.lp
                        lines 635-643). At 89c74d8,
                        src/cc_public/graph/extract.py lines 431-435
                        still name a register entry "entry", in the
                        loop that writes register_entry_key facts, and
                        edit.py lines 240, 398 and 1068 and
                        cli/editing.py line 272 say "an entry" in
                        docstrings. The one check of record is cctool
                        history check (memory enforcement-approach.md,
                        owner's decision of 2026-10-14). ASSUMPTION:
                        review attention per line does not grow with
                        the code.

