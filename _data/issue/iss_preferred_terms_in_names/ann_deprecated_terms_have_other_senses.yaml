title:                  Deprecated terms with ordinary senses
brief:                  |
                        Several deprecated terms are ordinary words
                        that code needs in other senses, so whether a
                        name breaks the rule depends on its meaning,
                        not its spelling. The rule as written in
                        AGENTS.md has no qualifier on meaning.
description:            |
                        AGENTS.md line 55: "Never use a term it lists
                        as deprecated." The owner's question is
                        narrower: names that "refer to a concept we
                        have defined" (2026-10-14T07:10:30Z).
                        Deprecated terms include registry, list,
                        table, term, keyword, tag, note, comment,
                        kind, class, label and entry
                        (_data/register/reg_concept.yaml lines 64-68,
                        105-110, 143-144, 188-195, 214-219, 269-273).
                        Yet "note" is a field of every item, "table"
                        is a field of every register, the register's
                        own fields are term_preferred and
                        term_deprecated, code names a jsonschema
                        registry (src/cc_public/check/schema.py lines
                        90-91), uses list_ prefixes, and says "entry
                        point" (src/cc_public/cli/command.py line 18).
                        A deprecated term is one not used to designate
                        that concept
                        (_data/schema/sch_regentry_concept.yaml lines
                        44-45, 75-77). The owner keeps "term" for the
                        representation of a concept
                        (2026-10-13T14:22:26Z).

