title:                  One written definition behind each name
brief:                  |
                        A name built from a preferred term leads a
                        reader, reviewer or partner to one definition
                        in the concept register. Free naming lets one
                        concept appear under several names that a
                        reader must translate or guess.
description:            |
                        Each concept entry holds one preferred term
                        and any admitted and deprecated terms
                        (_data/register/reg_concept.yaml lines
                        116-145;
                        _data/schema/sch_regentry_concept.yaml lines
                        18-20). The register holds 19 concepts and is
                        a YAML data item that travels with the
                        repository. Three concepts cite ISO/IEC/IEEE
                        42010 or 24765 (reg_concept.yaml lines 297,
                        332 and 448). Example: dc5f35f renamed
                        entry_key to register_entry_key because
                        "entry" is deprecated for register entry. At
                        ten times the size a reviewer cannot recall
                        every concept, so the benefit then rests on a
                        quick lookup.

