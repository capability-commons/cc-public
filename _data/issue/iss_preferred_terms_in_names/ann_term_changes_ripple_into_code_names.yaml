title:                  Renames that follow a change of term
brief:                  |
                        A change to a preferred term forces renames
                        wherever names use it, which cctool rename
                        does not make, and each rename can rewrite
                        every aligned line nearby into a diff a
                        reviewer must read.
description:            |
                        One preferred term changed twice on
                        2026-10-14: Datalog module to Datalog source
                        file (6b551e3), then to logic program file
                        (6230e98). 6b551e3 touched 7 files, 4 under
                        src/. cctool rename lists other files that
                        name an id for change by hand (AGENTS.md lines
                        49-53). In dc5f35f one key rename re-indented
                        the RELATION dictionary in extract.py (39
                        lines out, 40 in); the commit is 4 files, 115
                        insertions and 74 deletions, and also carries
                        reformatting. The owner asked for aligned
                        declaration arguments (2026-10-14T07:10:30Z).
                        ASSUMPTION: term use scales with code size.

