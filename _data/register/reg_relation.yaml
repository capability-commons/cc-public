    title:              Has items that play relation
    brief:              |
                        SUBJ has items that play OBJ
    description:        |
                        Each item of the type identified by SUBJ can
                        play the role identified by OBJ, so it meets
                        any relation restriction that admits that
                        role.

                        The edge is about the items of SUBJ, not about
                        SUBJ itself.
    note:               |
                        A partner gives its own types roles with this
                        edge, in its own register.
    alias:              []

