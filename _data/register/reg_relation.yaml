    title:              Excludes relation
    brief:              |
                        SOURCE excludes TARGET
    description:        |
                        The relation constraint identified by SOURCE
                        is satisfied by an item whose type does not
                        play the role identified by TARGET. A
                        constraint is satisfied if any one of its
                        literals is.
    note:               |
                        Two excludes in one constraint pass anything
                        that does not play both roles. Neither of two
                        roles is two constraints with one exclude
                        each.
    alias:              []

