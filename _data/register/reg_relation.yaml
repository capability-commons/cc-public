    id_self:            r_has_process
    guid_self:          r_18d71931f0c8452c807448226ee71137
    title:              Has process relation
    brief:              |
                        SUBJ has the process OBJ
    description:        |
                        The requirement identified by SUBJ obliges its
                        subject to do the process designated by the
                        concept identified by OBJ. The statement
                        writes the preferred term of the concept as
                        its verb, so a deprecated or undefined verb
                        cannot be written.
    note:               |
                        The process word of the SOPHIST MASTER
                        template. The target is open for now, and is
                        to be revisited.
    alias:              []

