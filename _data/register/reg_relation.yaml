  # ---------------------------------------------------------------------------
  # relation_is_narrower_than -- Is narrower than relation
  #
  relation_is_narrower_than:
    id_self:            relation_is_narrower_than
    guid_self:          relation_698cfb11be904a3f8e7d2821aa926ccd
    title:              Is narrower than relation
    brief:              |
                        SOURCE is narrower than TARGET
    description:        |
                        The concept identified by SOURCE is a kind of
                        the concept identified by TARGET. Whatever
                        SOURCE applies to, TARGET applies to as well,
                        and SOURCE has at least one characteristic
                        that TARGET lacks.

                        A concept may be narrower than several others.
                        A chain of these edges may not lead back to
                        where it began.
    note:               |
                        ISO 1087:2019 calls this a generic relation,
                        between a generic and a specific concept, and
                        ISO 25964-1 records it as a broader and
                        narrower term link. It is the first relation
                        between concepts, and starts the concept
                        register on the way to an ontology.
    acyclic:            true
    alias:              []

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_is_concept
        guid_target:    relcon_2759cd447b284daa9b290a84da8bf60a

      - id_relation:    relation_constrains_target
        guid_relation:  relation_168347672c2647f2b2cd2bd2462be641
        id_target:      relcon_is_concept
        guid_target:    relcon_2759cd447b284daa9b290a84da8bf60a

  # ---------------------------------------------------------------------------
  # relation_uses_concept -- Uses concept relation
  #
  relation_uses_concept:
    id_self:            relation_uses_concept
    guid_self:          relation_aedbfcabf8a14e859ca8cfd58fbd0b5c
    title:              Uses concept relation
    brief:              |
                        SOURCE uses concept TARGET
    description:        |
                        The text of the item identified by SOURCE uses
                        a term in the sense of the concept identified
                        by TARGET. A link to a term in that text, or
                        in the text of an item SOURCE holds, finds its
                        concept among the concepts SOURCE uses: the
                        one with a preferred or admitted term of that
                        form.

                        A link is written as in a wiki: "[[item]]"
                        links the term item. Where SOURCE uses two
                        concepts that share a term, each link to
                        either names its concept, as in
                        "[[concept_identifiable_data_item|item]]".
    note:               |
                        The markup follows the wiki link of MediaWiki
                        and Obsidian, with the target first and the
                        shown text after the bar. The sense is
                        declared on the item that holds the text and
                        never on its type, since a type says nothing
                        about what its text is about.
    alias:              []

    edge:

      - id_relation:    relation_constrains_target
        guid_relation:  relation_168347672c2647f2b2cd2bd2462be641
        id_target:      relcon_is_concept
        guid_target:    relcon_2759cd447b284daa9b290a84da8bf60a

