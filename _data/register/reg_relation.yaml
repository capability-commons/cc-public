    guid_self:          relation_3d73697611024b13ae6633e0e7727983
    title:              Has items that play relation
    brief:              |
                        SOURCE has items that play TARGET
    description:        |
                        Each item of the type identified by SOURCE can
                        play the role identified by TARGET, so it
                        meets any relation constraint that admits that
                        role.

                        The edge is about the items of SOURCE, not
                        about SOURCE itself.
    note:               |
                        A partner gives its own types roles with this
                        edge, in its own register.
    alias:              []

    edge:

