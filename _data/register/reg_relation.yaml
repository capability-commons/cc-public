    guid_self:          relation_bb30591c9b194b57ae32dbc4a2668ba2
    title:              Has related match relation
    brief:              |
                        SOURCE has a related match in TARGET
    description:        |
                        The concept identified by SOURCE and the class
                        that the external class identified by TARGET
                        are associated, but neither is broader than
                        the other and they do not pick out the same
                        things. It marks a false friend: a class whose
                        label is a term of the concept, in another
                        sense.

                        The edge reads through the proxy at its
                        target: it is about the class, not about the
                        data item that stands for it.
    note:               |
                        SKOS calls this relatedMatch. An exact match
                        and a related match of one pair contradict
                        each other.

    reads_through:
      - target

    alias:              []

    edge:

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_skos_reference
