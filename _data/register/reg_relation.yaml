    guid_self:          relation_c1f1f5ffece0495981ab2b6ebb32a92f
    title:              Realizes relation
    brief:              |
                        SOURCE realizes TARGET
    description:        |
                        The item identified by SOURCE implements the
                        design entity identified by TARGET, in one
                        technology: a logical component, or a member
                        of an interface control document.

                        A design entity may be realized by several
                        items, and by none while it is only planned.
                        When an implementation is replaced, the new
                        one realizes the same design entity, and what
                        was decided about the design entity stays with
                        it.
    alias:              []

    edge:

