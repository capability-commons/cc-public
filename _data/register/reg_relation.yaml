  relation_has_exact_match:
    id_self:            relation_has_exact_match
    guid_self:          relation_adb97c9b4a284026a14b4b777e549f44
    title:              Has exact match relation
    brief:              |
                        SOURCE has an exact match in TARGET
    description:        |
                        The concept identified by SOURCE and the class
                        that the external class identified by TARGET
                        pick out the same things, so closely that
                        either may stand for the other in any data.

                        The edge reads through the proxy at its
                        target: it is about the class, not about the
                        data item that stands for it.
    note:               |
                        SKOS calls this exactMatch. It is transitive:
                        two concepts with an exact match in one class
                        are one concept, recorded twice.

    reads_through:
      - target

    alias:              []

    edge:

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_skos_reference
