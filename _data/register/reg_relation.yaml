    title:              Realizes relation
    brief:              |
                        SOURCE realizes TARGET
    description:        |
                        The item identified by SOURCE implements the
                        design element identified by TARGET, in one
                        technology: a logical component, or a member
                        of an interface control document.

                        A design element may be realized by several
                        items, and by none while it is only planned.
                        When an implementation is replaced, the new
                        one realizes the same design element, and what
                        was decided about the design element stays
                        with it.
    alias:              []

