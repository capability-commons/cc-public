    title:              Rejects relation
    brief:              |
                        SOURCE rejects TARGET
    description:        |
                        The ruling identified by SOURCE settles that
                        the option identified by TARGET does not hold,
                        given the arguments presented when it was
                        made.

                        The option keeps the arguments about it, so
                        that the reasons it was rejected stay on
                        record.
