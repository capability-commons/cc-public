  # ---------------------------------------------------------------------------
  # relation_is_driven_by -- Is driven by relation
  #
  relation_is_driven_by:
    id_self:            relation_is_driven_by
    guid_self:          relation_5c98cdd1a08f40f6b942e5f11f967fdc
    title:              Is driven by relation
    brief:              |
                        SOURCE is driven by TARGET
    description:        |
                        The concern identified by TARGET is one of the
                        few that the logical component identified by
                        SOURCE should favor, so that every decision
                        about the logical component is argued for it.

                        Concerns that drive no logical component are
                        not expected to speak on decisions about it,
                        so that a decision is not weighed against
                        every concern there is.

                        A concern named this way is a driver concern
                        (concept_driver_concern) of the logical
                        component.
    note:               |
                        The relation follows the architecture drivers
                        of Arcadia, Thales, Arcadia user guide:
                        principles and contents overview, 2023, clause
                        4.3.1, which are the stakes and properties an
                        architecture should favor, and against which
                        each design decision is checked.
    alias:              []

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_is_design_entity
        guid_target:    relcon_b2a9d1f1b0e14741ac810f2962abaa72

      - id_relation:    relation_constrains_target
        guid_relation:  relation_168347672c2647f2b2cd2bd2462be641
        id_target:      relcon_is_concern
        guid_target:    relcon_cf939a167d034da7a54b779c6216567d

