  # ---------------------------------------------------------------------------
  # r_is_about -- Is about relation
  #
  r_is_about:
    id_self:            r_is_about
    guid_self:          r_17ca99102b0b431b85235445a4635ae8
    title:              Is about relation
    brief:              SUBJ makes its assertion about OBJ
    description:        |
                        The annotation or decision identified by SUBJ
                        makes its assertion or asks its question about
                        the item identified by OBJ.

                        The edge says what the assertion or question
                        is about and nothing about it. It does not say
                        that it is right, that it is adverse, or that
                        anything follows from it.

                        Every annotation and every decision holds at
                        least one such edge, so that nothing is
                        asserted or asked about nothing. Either may
                        hold several, where it concerns how two items
                        meet. An annotation about a decision belongs
                        to that decision, and is kept in its folder.
    alias:              []

    relation:

      - id_relation:    r_restricts_source
        guid_relation:  r_adcac8092b664b269c2a774e5320d32d
        id_target:      rrs_is_discussion
        guid_target:    rrs_065e1f2ffda14288bc1ae33b75b7160b

  # ---------------------------------------------------------------------------
  # r_supports -- Supports relation
  #
  r_supports:
    id_self:            r_supports
    guid_self:          r_5d87b0c1741548108f5b851ad76a8605
    title:              Supports relation
    brief:              SUBJ gives a reason to accept OBJ
    description:        |
                        The annotation identified by SUBJ gives a
                        reason to accept, or to hold with greater
                        confidence, the annotation or option
                        identified by OBJ.

                        Support does not establish what it supports,
                        and an assertion or a choice with many
                        supporters is not thereby right. An annotation
                        may both support and challenge another, where
                        it qualifies it.

                        A chain of support may not lead back to where
                        it began, since an argument cannot be its own
                        reason.
    acyclic:            true
    alias:              []

    relation:

      - id_relation:    r_restricts_source
        guid_relation:  r_adcac8092b664b269c2a774e5320d32d
        id_target:      rrs_is_argument
        guid_target:    rrs_771607fb955949638a49417b6f010586

      - id_relation:    r_restricts_target
