  relation_challenges:
    id_self:            relation_challenges
    guid_self:          relation_7ef507cc69514a36910448016caef428
    title:              Challenges relation
    brief:              SOURCE gives a reason not to accept TARGET
    description:        |
                        The annotation identified by SOURCE gives a
                        reason not to accept, or not to accept without
                        qualification, the annotation or option
                        identified by TARGET.

                        A challenge does not defeat what it
                        challenges. Nothing here computes which
                        assertion or option prevails, and one that
                        nothing answers is not thereby established.
    alias:              []

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_is_argument
        guid_target:    relcon_024e6019978c44ff99d310f779421547

      - id_relation:    relation_constrains_target
