  r_restricts_source:
    id_self:            r_restricts_source
    guid_self:          r_adcac8092b664b269c2a774e5320d32d
    title:              Restricts source relation
    brief:              |
                        SUBJ restricts its source by OBJ
    description:        |
                        Every edge of the relation identified by SUBJ
                        is recorded by an item that satisfies the
                        relation restriction identified by OBJ. A
                        source must satisfy every restriction its
                        relation names for it, and a relation that
                        names none has an open source.
    alias:              []

    relation:

      - id_relation:    r_restricts_source
        guid_relation:  r_adcac8092b664b269c2a774e5320d32d
        id_target:      rrs_is_relation
        guid_target:    rrs_c011b9bbb7f843abbbfdfa3d9546ceaa

      - id_relation:    r_restricts_target
        guid_relation:  r_589d8b04783d49c698c6471080254c8a
        id_target:      rrs_is_relation_restriction
        guid_target:    rrs_96d618138ba0482ca909ebbc8b9fc70b

