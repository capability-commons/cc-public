    title:              Has subject relation
    brief:              |
                        SOURCE has the subject TARGET
    description:        |
                        The requirement identified by SOURCE is an
                        obligation on the item identified by TARGET,
                        the system or system element that is the
                        Subject of the syntax in ISO/IEC/IEEE 29148
                        clause 5.2.4. The statement names it by its
                        title.
    note:               |
                        The target must be a design element. Most
                        subjects belong to a project or a partner, not
                        to cc-public, and such a subject qualifies
                        when its type's items play rol_design_entity,
                        which its own register says.
    alias:              []

    edge:

