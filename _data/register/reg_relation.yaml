        id_target:      relcon_can_be_target_of_an_argument
        guid_target:    relcon_2c9ede4aeb6b4179ad035d8c145aca68

  # ---------------------------------------------------------------------------
  # relation_supersedes -- Supersedes relation
  #
  relation_supersedes:
    id_self:            relation_supersedes
    guid_self:          relation_fdfaf0116c27448cb5cb6203644bbb1d
    title:              Supersedes relation
    brief:              SOURCE supersedes TARGET
    description:        |
                        The item identified by SOURCE replaces the one
                        of the same type identified by TARGET, which
                        no longer governs. An option or an interface
                        control document may be superseded.

                        TARGET keeps the arguments about it, or its
                        content, so that what it said stays on record.

                        An option may supersede several, where one
                        option replaces a number of earlier ones. A
                        new version of an interface is a new interface
                        control document that supersedes the last. A
                        chain of supersession may not lead back to
                        where it began.
    acyclic:            true
    alias:              []

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_is_supersedable
        guid_target:    relcon_367a66fb809847b2a7c14c46818061e7

      - id_relation:    relation_constrains_target
        guid_relation:  relation_168347672c2647f2b2cd2bd2462be641
        id_target:      relcon_is_supersedable
        guid_target:    relcon_367a66fb809847b2a7c14c46818061e7

  # ---------------------------------------------------------------------------
  # relation_speaks_for_concern -- Speaks for concern relation
  #
  relation_speaks_for_concern:
    id_self:            relation_speaks_for_concern
    guid_self:          relation_43b56fb16cb64206892bbcb88a0a6b67
    title:              Speaks for concern relation
    brief:              SOURCE speaks for concern TARGET
    description:        |
                        The annotation identified by SOURCE makes its
                        assertion on behalf of the concern identified
                        by TARGET.

                        The edge says which concern an argument speaks
                        for, not who made it or whether it is sound.

                        An annotation that supports or challenges an
                        option speaks for at least one concern. Where
                        several concerns rest on the same premise, it
                        is one annotation with an edge to each, so
                        that the premise is stated and challenged
                        once. An annotation that bears only on other
                        annotations speaks for none: it is a matter of
                        fact, answered with evidence, and not
                        outweighed by a concern that ranks higher.
    note:               |
                        Value-based argumentation gives each argument
                        one value: Bench-Capon, Persuasion in
                        practical argument using value-based
                        argumentation frameworks, Journal of Logic and
                        Computation 13, 2003. Arguments that promote
                        several values are treated by Kaci and van der
                        Torre, Preference-based argumentation:
                        arguments supporting multiple values,
                        International Journal of Approximate Reasoning
                        48, 2008. How the concerns of one annotation
                        are weighed together is left to the
                        evaluation.

    alias:
      - relation_argues_for_concern

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_is_argument
        guid_target:    relcon_024e6019978c44ff99d310f779421547

      - id_relation:    relation_constrains_target
        guid_relation:  relation_168347672c2647f2b2cd2bd2462be641
        id_target:      relcon_is_concern
        guid_target:    relcon_cf939a167d034da7a54b779c6216567d

