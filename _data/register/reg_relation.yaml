    id_self:            relation_has_process
    guid_self:          relation_3438822c54e5425eb31253e8a7ca51b7
    title:              Has process relation
    brief:              |
                        SOURCE has the process TARGET
    description:        |
                        The requirement identified by SOURCE obliges
                        its subject to do the process designated by
                        the concept identified by TARGET. The
                        statement writes the preferred term of the
                        concept as its verb, so a deprecated or
                        undefined verb cannot be written.
    note:               |
                        The process word of the SOPHIST MASTER
                        template. The target is open for now, and is
                        to be revisited.
    alias:              []

    edge:

