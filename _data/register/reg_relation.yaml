  r_has_subject:
    id_self:            r_has_subject
    guid_self:          r_6b34d5364abb4ddd8f2ff2a9b725e3ef
    title:              Has subject relation
    brief:              |
                        SUBJ has the subject OBJ
    description:        |
                        The requirement identified by SUBJ is an
                        obligation on the item identified by OBJ, the
                        system or system element that is the Subject
                        of the syntax in ISO/IEC/IEEE 29148 clause
                        5.2.4. The statement names it by its title.
    note:               |
                        The target must be a design element. Most
                        subjects belong to a project or a partner, not
                        to cc-public, and such a subject qualifies
                        when its type's items play rol_design_element,
                        which its own register says.
    alias:              []

    relation:

      - id_relation:    r_restricts_source
        guid_relation:  r_adcac8092b664b269c2a774e5320d32d
        id_target:      rrs_is_requirement
