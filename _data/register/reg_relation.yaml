  # ---------------------------------------------------------------------------
  # r_is_about -- Is about relation
  #
  r_is_about:
    id_self:            r_is_about
    guid_self:          r_17ca99102b0b431b85235445a4635ae8
    title:              Is about relation
    brief:              SUBJ makes its assertion about OBJ
    description:        |
                        The annotation identified by SUBJ makes its
                        assertion about the item identified by OBJ.

                        The edge says what the assertion is about and
                        nothing about the assertion itself. It does
                        not say that the assertion is true, that it is
                        adverse, or that anything follows from it.

                        Every annotation holds at least one such edge,
                        so that no assertion is made about nothing. An
                        annotation may hold several, where one
                        assertion concerns how two items meet.

    domain:
      - t_annotation

    status:             proposed
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_supports -- Supports relation
  #
  r_supports:
    id_self:            r_supports
    guid_self:          r_5d87b0c1741548108f5b851ad76a8605
    title:              Supports relation
    brief:              SUBJ gives a reason to accept OBJ
    description:        |
                        The annotation identified by SUBJ gives a
                        reason to accept, or to hold with greater
                        confidence, the assertion made by the
                        annotation identified by OBJ.

                        Support does not establish what it supports,
                        and an assertion with many supporters is not
                        thereby true. An annotation may both support
                        and challenge another, where it qualifies it.

    domain:
      - t_annotation

    range:
      - t_annotation

    status:             proposed
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_challenges -- Challenges relation
  #
  r_challenges:
    id_self:            r_challenges
    guid_self:          r_08792b8910554df3a181ecb43aae429d
    title:              Challenges relation
    brief:              SUBJ gives a reason not to accept OBJ
    description:        |
                        The annotation identified by SUBJ gives a
                        reason not to accept, or not to accept without
                        qualification, the assertion made by the
                        annotation identified by OBJ.

                        A challenge does not defeat what it
                        challenges. Nothing here computes which
                        assertion prevails, and an assertion that
                        nothing answers is not thereby established.

    domain:
      - t_annotation

    range:
      - t_annotation

    status:             proposed
    alias:              []
    relation:           []
