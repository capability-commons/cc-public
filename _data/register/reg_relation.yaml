    title:              Has actor relation
    brief:              |
                        SUBJ has the actor OBJ
    description:        |
                        The requirement identified by SUBJ obliges its
                        subject to provide the item identified by OBJ
                        with the ability to do its process. The
                        statement names the actor by its title.
    note:               |
                        Held only by a requirement whose activity is
                        interaction. The target is open for now, and
                        is to be revisited.
