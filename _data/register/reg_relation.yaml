title:                  Relation register
brief:                  |
                        Register of relations.
description:            |
                        The relation register lists every relation,
                        with the metadata each relation carries. An
                        entry may also hold an inverse reading of the
                        same relation, embedded within it.
usage:                  |
                        The relation register enables general-purpose
                        processing of networks of items. Any item that
                        carries an identifier may take part in such a
                        network as a node, and any pair of such items
                        may be joined by a labelled edge. The label is
                        drawn from this register, and the entry it
                        names defines what the edge means.
note:                   |
                        The register holds one mechanism for labelling
                        an edge between any pair of items that carry
                        identifiers. A relation is added here before
                        an edge uses it.

                        An entry holds the semantics of its relation:
                        the domain, the range, the cardinality at each
                        end, and whatever else a checker reads. Where
                        the opposite reading is useful, the entry
                        embeds an inverse, which holds an identity and
                        a surface form and nothing else. An inverse is
                        minted when an item wants to record an edge
                        that way, and not as a matter of course.

                        An edge may be recorded in either direction,
                        and tooling reads it in both. The choice of
                        direction is not only a question of which
                        reading is easier. An edge is held by the item
                        that records it, so the direction decides
                        which item carries the fact when it travels on
                        its own, and in a federation it decides who is
                        able to record the fact at all, since an
                        author may write only to items they own.

