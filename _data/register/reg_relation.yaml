  relation_constrains_source:
    id_self:            relation_constrains_source
    guid_self:          relation_a821ab32d7f24bed8589434d1a146634
    title:              Constrains source relation
    brief:              |
                        SOURCE constrains its source by TARGET
    description:        |
                        Every edge of the relation identified by
                        SOURCE is recorded by an item that satisfies
                        the relation constraint identified by TARGET.
                        A source must satisfy every constraint its
                        relation names for it, and a relation that
                        names none has an open source.

    alias:
