table:

  # ---------------------------------------------------------------------------
  # r_is_specified_by_schema -- Is specified by schema relation
  #
  r_is_specified_by_schema:
    id_self:            r_is_specified_by_schema
    guid_self:          r_d70024bd40444f93b4fc1903379ded81
    title:              Is specified by schema relation
    brief:              SUBJ is specified by schema OBJ
    description:        |
                        The schema data item identified by OBJ
                        specifies the structure of the data item
                        identified by SUBJ itself.

                        The edge is about SUBJ, not about the items of
                        a type. A type names the schema of its items
                        with r_has_items_specified_by_schema.

    domain:
      - t_register

    range:
      - t_schema

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_has_items_specified_by_schema -- Has items specified by schema relation
  #
  r_has_items_specified_by_schema:
    id_self:            r_has_items_specified_by_schema
    guid_self:          r_c233cc9d78af4ec6bbaec8a4bbc43344
    title:              Has items specified by schema relation
    brief:              SUBJ has items specified by schema OBJ
    description:        |
                        The schema data item identified by OBJ
                        specifies the structure of each item of the
                        type identified by SUBJ.

                        The edge is about the items of SUBJ, not about
                        SUBJ itself. The shape of a type entry is
                        named by the edge on t_type.

    domain:
      - t_type

    range:
      - t_schema

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_has_items_held_in_register -- Has items held in register relation
  #
  r_has_items_held_in_register:
    id_self:            r_has_items_held_in_register
    guid_self:          r_016e74a0abea4a3990cc3259942baf92
    title:              Has items held in register relation
    brief:              SUBJ has items held in register OBJ
    description:        |
                        The register data item identified by OBJ holds
                        each item of the type identified by SUBJ, as
                        an entry in its table.

                        The edge is about the items of SUBJ, not about
                        SUBJ itself. A type entry is held in the data
                        item type register by containment, and needs
                        no edge to say so.

    domain:
      - t_type

    range:
      - t_register

    alias:
      - r_is_held_in_register

    relation:           []

  # ---------------------------------------------------------------------------
  # r_is_about -- Is about relation
  #
  r_is_about:
    id_self:            r_is_about
    guid_self:          r_17ca99102b0b431b85235445a4635ae8
    title:              Is about relation
    brief:              SUBJ makes its assertion about OBJ
    description:        |
                        The annotation or issue identified by SUBJ
                        makes its assertion or asks its question about
                        the item identified by OBJ.

                        The edge says what the assertion or question
                        is about and nothing about it. It does not say
                        that it is right, that it is adverse, or that
                        anything follows from it.

                        Every annotation and every issue holds at
                        least one such edge, so that nothing is
                        asserted or asked about nothing. Either may
                        hold several, where it concerns how two items
                        meet. An annotation about an issue belongs to
                        that issue, and is kept in its folder.

    domain:
      - t_annotation
      - t_issue

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_supports -- Supports relation
  #
  r_supports:
    id_self:            r_supports
    guid_self:          r_5d87b0c1741548108f5b851ad76a8605
    title:              Supports relation
    brief:              SUBJ gives a reason to accept OBJ
    description:        |
                        The annotation identified by SUBJ gives a
                        reason to accept, or to hold with greater
                        confidence, the annotation or decision
                        identified by OBJ.

                        Support does not establish what it supports,
                        and an assertion or a choice with many
                        supporters is not thereby right. An annotation
                        may both support and challenge another, where
                        it qualifies it.

                        A chain of support may not lead back to where
                        it began, since an argument cannot be its own
                        reason.

    domain:
      - t_annotation

    range:
      - t_annotation
      - t_decision

    acyclic:            true
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_challenges -- Challenges relation
  #
  r_challenges:
    id_self:            r_challenges
    guid_self:          r_08792b8910554df3a181ecb43aae429d
    title:              Challenges relation
    brief:              SUBJ gives a reason not to accept OBJ
    description:        |
                        The annotation identified by SUBJ gives a
                        reason not to accept, or not to accept without
                        qualification, the annotation or decision
                        identified by OBJ.

                        A challenge does not defeat what it
                        challenges. Nothing here computes which
                        assertion or choice prevails, and one that
                        nothing answers is not thereby established.

    domain:
      - t_annotation

    range:
      - t_annotation
      - t_decision

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_supersedes -- Supersedes relation
  #
  r_supersedes:
    id_self:            r_supersedes
    guid_self:          r_d687c4ca485e47b78c0a361b221fdf6a
    title:              Supersedes relation
    brief:              SUBJ supersedes OBJ
    description:        |
                        The decision or determination identified by
                        SUBJ replaces the one of the same type
                        identified by OBJ, which no longer governs.

                        OBJ keeps its argument, so that the reasons it
                        was taken stay on record.

                        A decision may supersede several, where one
                        choice replaces a number of earlier ones. A
                        determination supersedes the determination of
                        its issue that was current until it was made,
                        so that each issue has at most one current
                        determination. A chain of supersession may not
                        lead back to where it began.

    domain:
      - t_decision
      - t_determination

    range:
      - t_decision
      - t_determination

    acyclic:            true
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_argues_for_concern -- Argues for concern relation
  #
  r_argues_for_concern:
    id_self:            r_argues_for_concern
    guid_self:          r_ded2d80983a74f7b8271530a881686bf
    title:              Argues for concern relation
    brief:              SUBJ argues for concern OBJ
    description:        |
                        The annotation identified by SUBJ makes its
                        assertion on behalf of the concern identified
                        by OBJ.

                        The edge says which concern an argument speaks
                        for, not who made it or whether it is sound.

                        An annotation that supports or challenges a
                        decision argues for at least one concern.
                        Where several concerns rest on the same
                        premise, it is one annotation with an edge to
                        each, so that the premise is stated and
                        challenged once. An annotation that bears only
                        on other annotations argues for none: it is a
                        matter of fact, answered with evidence, and
                        not outweighed by a concern that ranks higher.
    note:               |
                        Value-based argumentation gives each argument
                        one value: Bench-Capon, Persuasion in
                        practical argument using value-based
                        argumentation frameworks, Journal of Logic and
                        Computation 13, 2003. Arguments that promote
                        several values are treated by Kaci and van der
                        Torre, Preference-based argumentation:
                        arguments supporting multiple values,
                        International Journal of Approximate Reasoning
                        48, 2008. How the concerns of one annotation
                        are weighed together is left to the
                        evaluation.

    domain:
      - t_annotation

    range:
      - t_concern

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_realizes -- Realizes relation
  #
  r_realizes:
    id_self:            r_realizes
    guid_self:          r_2b5f499c599a435c9a5184462525dd9b
    title:              Realizes relation
    brief:              |
                        SUBJ realizes OBJ
    description:        |
                        The item identified by SUBJ implements the
                        logical component identified by OBJ, in one
                        technology.

                        A logical component may be realized by several
                        items, and by none while it is only planned.
                        When an implementation is replaced, the new
                        one realizes the same logical component, and
                        what was decided about the logical component
                        stays with it.

    domain:
      - t_python_package
      - t_python_module
      - t_logic_program_file
      - t_file

    range:
      - t_logical_component

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_upholds -- Upholds relation
  #
  r_upholds:
    id_self:            r_upholds
    guid_self:          r_434abb759a1e4442bef038fbd83d7441
    title:              Upholds relation
    brief:              |
                        SUBJ upholds OBJ
    description:        |
                        The determination identified by SUBJ settles
                        that the decision identified by OBJ holds,
                        given the arguments presented when it was
                        made.

    domain:
      - t_determination

    range:
      - t_decision

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_rejects -- Rejects relation
  #
  r_rejects:
    id_self:            r_rejects
    guid_self:          r_1dcb50b2281349bf9e8972dfedde64f3
    title:              Rejects relation
    brief:              |
                        SUBJ rejects OBJ
    description:        |
                        The determination identified by SUBJ settles
                        that the decision identified by OBJ does not
                        hold, given the arguments presented when it
                        was made.

                        The decision keeps its argument, so that the
                        reasons it was rejected stay on record.

    domain:
      - t_determination

    range:
      - t_decision

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_is_driven_by -- Is driven by relation
  #
  r_is_driven_by:
    id_self:            r_is_driven_by
    guid_self:          r_11e221e2e58140ca869e92bedfc15fbc
    title:              Is driven by relation
    brief:              |
                        SUBJ is driven by OBJ
    description:        |
                        The concern identified by OBJ is one of the
                        few that the logical component identified by
                        SUBJ should favour, so that every decision
                        about the logical component is argued for it.

                        Concerns that drive no logical component are
                        not expected to speak on decisions about it,
                        so that a decision is not weighed against
                        every concern there is.
    note:               |
                        The relation follows the architecture drivers
                        of Arcadia, Thales, Arcadia user guide:
                        principles and contents overview, 2023, clause
                        4.3.1, which are the stakes and properties an
                        architecture should favour, and against which
                        each design decision is checked.

    domain:
      - t_logical_component

    range:
      - t_concern

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # r_answers -- Answers relation
  #
  r_answers:
    id_self:            r_answers
    guid_self:          r_336826c81f7043b89ae024d44a35bb41
    title:              Answers relation
    brief:              |
                        SUBJ answers OBJ
    description:        |
                        The decision identified by SUBJ is one answer
                        to the issue identified by OBJ. The decisions
                        that answer one issue are alternatives to one
                        another.

    domain:
      - t_decision

    range:
      - t_issue

    alias:              []
    relation:           []
