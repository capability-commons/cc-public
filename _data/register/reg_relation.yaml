  # ---------------------------------------------------------------------------
  # relation_is_about -- Is about relation
  #
  relation_is_about:
    id_self:            relation_is_about
    guid_self:          relation_1bb0463a053f42c498e3e9285df99c8f
    title:              Is about relation
    brief:              SOURCE makes its assertion about TARGET
    description:        |
                        The annotation or decision identified by
                        SOURCE makes its assertion or asks its
                        question about the item identified by TARGET.

                        The edge says what the assertion or question
                        is about and nothing about it. It does not say
                        that it is right, that it is adverse, or that
                        anything follows from it.

                        Every annotation and every decision holds at
                        least one such edge, so that nothing is
                        asserted or asked about nothing. Either may
                        hold several, where it concerns how two items
                        meet. An annotation about a decision belongs
                        to that decision, and is kept in its folder.
    alias:              []

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_can_be_about_an_item
        guid_target:    relcon_91efa2f85d2c466ea9c9bc7b53b402eb

  # ---------------------------------------------------------------------------
  # relation_supports -- Supports relation
  #
  relation_supports:
    id_self:            relation_supports
    guid_self:          relation_ac30f9ef05ac4016b99aba04561e1fa5
    title:              Supports relation
    brief:              SOURCE gives a reason to accept TARGET
    description:        |
                        The annotation identified by SOURCE gives a
                        reason to accept, or to hold with greater
                        confidence, the annotation or option
                        identified by TARGET.

                        Support does not establish what it supports,
                        and an assertion or an option with many
                        supporters is not thereby right. An annotation
                        may both support and challenge another, where
                        it qualifies it.

                        A chain of support may not lead back to where
                        it began, since an argument cannot be its own
                        reason.
    acyclic:            true
    alias:              []

    edge:

      - id_relation:    relation_constrains_source
        guid_relation:  relation_a821ab32d7f24bed8589434d1a146634
        id_target:      relcon_is_argument
        guid_target:    relcon_024e6019978c44ff99d310f779421547

      - id_relation:    relation_constrains_target
        guid_relation:  relation_168347672c2647f2b2cd2bd2462be641
        id_target:      relcon_can_be_target_of_an_argument
        guid_target:    relcon_2c9ede4aeb6b4179ad035d8c145aca68

  # ---------------------------------------------------------------------------
  # relation_challenges -- Challenges relation
