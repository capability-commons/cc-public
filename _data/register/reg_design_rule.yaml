title:                  Design rule register
brief:                  |
                        Register of the rules that the design of the
                        system, and the record of that design,
                        follows.
description:            |
                        The design rule register holds one entry per
                        design rule. Each entry states the rule in one
                        sentence and gives the reason for it.
usage:                  |
                        Whoever designs or records the system, a
                        person or a model, follows these rules. The
                        scheduled reviews judge the parts of each rule
                        that no check holds.

                        A [[finding]] is a [[nonconformity]], a
                        [[tension]], an
                        [[opportunity for improvement]] or a
                        [[lesson learned]]. A [[correction]] removes
                        one where it was found, and a
                        [[corrective action]] removes its cause. A
                        design rule is one kind of
                        [[corrective action]], or is imposed by fiat.
                        A rule is changed or retired by editing its
                        entry; git holds its history.
note:                   |
                        The writing style rules are held in a register
                        of their own. They are a choice guided by
                        taste and readability, where design rules
                        mostly come from experience.

table:

  rule_claim_only_what_is_held:
    id_self:            rule_claim_only_what_is_held
    guid_self:          rule_5d592bc1c4224e04bec40b12f0ebd399
    title:              Claim only what is held
    brief:              |
                        A rule claims no more than something holds.
                        Where nothing holds a part of it, the rule
                        says so, or that part is cut.
    description:        |
                        A rule that is stated broadly and held loosely
                        teaches its readers that rules are decoration,
                        and so weakens the rules that are held. A
                        narrow rule that is always held can be trusted
                        and built on. Imposed by the maintainer on
                        2026-10-22, in these words: "It is better to
                        express a virtue in a way which is less
                        expansive but more rigorously upheld than to
                        express a virtue expansively and
                        performatively - theatre without substance is
                        no virtue at all, but a vice."
    follows:            |
                        A term is held to the sense of its concept
                        where it is used as a term: in an id, a title,
                        a requirement slot or a link.
    breaks:             |
                        Prose in the repository is judged against the
                        concept register.
    alias:              []
    edge:               []

  rule_fix_the_rule_not_the_exceptions:
    id_self:            rule_fix_the_rule_not_the_exceptions
    guid_self:          rule_ac0d52b3ba7a447aaceade2b4fe03a80
    title:              Fix the rule, not the exceptions
    brief:              |
                        A rule that keeps needing exceptions is
                        changed so that it no longer needs them.
    description:        |
                        Each exception is a sign that the rule does
                        not say what is meant. Machinery that grows to
                        carry exceptions hides the problem and
                        multiplies the ways to fail. Adopted on
                        2026-10-14, when the commit checks met the
                        many ways git makes a commit.
    follows:            |
                        The rename check exempts a revert, because a
                        revert names what it undoes.
    breaks:             |
                        A hook is added for each git command that
                        skips the commit check.
    alias:              []

    edge:

      - id_relation:    relation_is_held_by
        guid_relation:  relation_e08e6be076454189bc9d611097f60aeb
        id_target:      lpp_cc_public.check.friction.rule_exception
        guid_target:    lpp_32314d099f574919a6095b40a142f489

  rule_resolve_tensions_early:
    id_self:            rule_resolve_tensions_early
    guid_self:          rule_b7a4f7bc12bf451bb124a8ef714336df
    title:              Resolve tensions early
    brief:              |
                        A [[tension]] is resolved while the change is
                        still cheap. When in doubt, the larger change
                        is made now.
    description:        |
                        Early in the life of a system, a change that
                        touches much is still cheap, and each one
                        resolved now removes friction from all later
                        work and spares later changes with a larger
                        blast radius. Adopted on 2026-10-21 as the
                        annealing stance: tolerate churn while the
                        temperature is high, and do not tolerate
                        quirks.
    follows:            |
                        The term is renamed in every file now, while
                        forty files use it.
    breaks:             |
                        The awkward term is kept, and each new text
                        works around it.
    alias:              []

    edge:

      - id_relation:    relation_is_held_by
        guid_relation:  relation_e08e6be076454189bc9d611097f60aeb
        id_target:      lpp_cc_public.check.friction.shared_term
        guid_target:    lpp_43bcc111334a4d92a4298c2a8118fb92

