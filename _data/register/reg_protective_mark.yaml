table:

  # ---------------------------------------------------------------------------
  # mark_public — Public
  #
  mark_public:
    id_self:            mark_public
    guid_self:          mark_0c96ccb7b7534574acf6ed42f9deba0f
    title:              Public
    brief:              |
                        May be disclosed to anyone.
    description:        |
                        The item carries no handling restriction
                        beyond the terms of its licence. It may be
                        published, forwarded and quoted without
                        further permission.
    usage:              |
                        Applied to an item that has been considered
                        and found to need no protection.

                        This mark is affirmative and is not a default.
                        An item is public because somebody decided it
                        was, and said so; absence of a mark is an
                        unanswered question rather than a permissive
                        answer, which is why a mark is required rather
                        than optional.
    note:               |
                        Being public is a property of the item and not
                        of the repository holding it. A public item in
                        a restricted repository is still public.
    status:             proposed
    alias:              []
    authority:          cc
    level:              public
