title:                  Relation restriction register
brief:                  |
                        Register of the conditions that relations
                        place on the items at their ends.
description:            |
                        The relation restriction register holds one
                        entry per condition. Each is an OR of roles
                        admitted or excluded. A relation names the
                        restrictions on its source and its target with
                        r_restricts_source and r_restricts_target
                        edges.
usage:                  |
                        One restriction serves every relation that
                        needs the same condition, so the conditions
                        are written once and read the same way
                        everywhere.
note:                   |
                        A restriction names roles, never types. A
                        restriction is added here when a relation
                        first needs it.

