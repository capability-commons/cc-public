  #
  concept_driver_concern:
    id_self:            concept_driver_concern
    guid_self:          concept_58ed5b69d634459db5c1f6a5a9e1325c
    title:              Driver concern
    brief:              |
                        A concern (concept_concern) that a logical
                        component should favor, named by an edge of
                        relation_is_driven_by.
    description:        |
                        After the architecture drivers of the Arcadia
                        user guide, clause 4.3.1.
    term_preferred:     driver concern

    term_admitted:
      - driver

    alias:              []

    edge:

      - id_relation:    relation_is_narrower_than
