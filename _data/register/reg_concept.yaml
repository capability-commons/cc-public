  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Concept register
brief:                  |
                        Register of the concepts used in the cc-public
                        repository.
description:            |
                        The concept register holds one entry per
                        concept. Each entry defines the concept and
                        gives its preferred term, any admitted terms,
                        and any deprecated terms, as ISO 1087 uses
                        those words.
usage:                  |
                        The concept register keeps the vocabulary of
                        the repository consistent. A data item that
                        introduces a concept enters it here. Prose is
                        judged against it: a term that names a concept
                        is used in that sense, and a deprecated term
                        is not used for it.

                        A partner may hold a concept register of their
                        own. A concept arriving from a partner names
                        an entry there and not here.
note:                   |
                        A concept is entered here whether or not it is
                        a data item type. What has a type is a subset
                        of what has a name.

                        One term may name several concepts, and
                        several terms may name one concept.

relation:

  - id_relation:        r_is_specified_by_schema
    guid_relation:      r_d70024bd40444f93b4fc1903379ded81
    id_target:          sch_reg_concept
    guid_target:        sch_9c44fa0e85434706a25fb5a892955069

table:

  # ---------------------------------------------------------------------------
  # concept_type -- Type
  #
  concept_type:
    id_self:            concept_type
    guid_self:          concept_1fbd78a10f1244f2b8df91eceb7bb739
    title:              Type
    brief:              |
                        A category of data items, declared as an entry
                        in the data item type register and owning one
                        prefix.
    description:        |
                        A type names the schema its data items are
                        validated against. A data item is never
                        retyped.
    term_preferred:     type

    term_deprecated:
      - kind
      - class

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_schema -- Schema
  #
  concept_schema:
    id_self:            concept_schema
    guid_self:          concept_50bce61140e843649dc67857217e2bc5
    title:              Schema
    brief:              |
                        A JSON Schema, held as a data item, against
                        which data items of a type are validated.
    description:        |
                        A schema is itself a data item with an
                        identity, and travels on its own, one per
                        file.
    term_preferred:     schema
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_register -- Register
  #
  concept_register:
    id_self:            concept_register
    guid_self:          concept_3602f58e26a140c8b6e5b8a4010adc7f
    title:              Register
    brief:              |
                        A data item holding a keyed table of entries,
                        and the source of truth for a vocabulary.
    description:        |
                        Entries are keyed by readable id, so a key
                        appears once. A register names a schema of its
                        own, which composes sch_register.
    term_preferred:     register

    term_deprecated:
      - registry
      - list
      - table

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_register_entry -- Register entry
  #
  concept_register_entry:
    id_self:            concept_register_entry
    guid_self:          concept_3b53389bc7814914bef60893f6d6fd49
    title:              Register entry
    brief:              |
                        One record in the table of a register, keyed
                        by its id.
    description:        |
                        A register entry is embedded in its register
                        and travels with it, so it carries no rights
                        of its own. Its shape is the general register
                        entry shape composed with the shape specific
                        to its register.
    usage:              |
                        The admitted term regentry is used in the ids
                        of schemas specific to one register, such as
                        sch_regentry_concept, in the way that reg is
                        used in sch_reg_concept. The schemas that
                        apply to every register spell the term out, as
                        in sch_register_entry.

                        The admitted term entry is used where the
                        register is plain from context, as in
                        "terminological entry" in ISO 1087.
    term_preferred:     register entry

    term_admitted:
      - regentry
      - entry

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_relation -- Relation
  #
  concept_relation:
    id_self:            concept_relation
    guid_self:          concept_42a4bd80300849a98bf9649ad97d10d9
    title:              Relation
    brief:              |
                        A named type of directed edge between data
                        items, declared as an entry in the relation
                        register.
    description:        |
                        A relation is directional. Where the opposite
                        reading is useful, the entry embeds an
                        inverse: a second identity and surface form
                        for the same relation, and not a relation of
                        its own.
    term_preferred:     relation
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_protective_mark -- Protective mark
  #
  concept_protective_mark:
    id_self:            concept_protective_mark
    guid_self:          concept_3ebe0d99432d45678bd5e175f2274cd5
    title:              Protective mark
    brief:              |
                        An entry in the protective mark register that
                        says how a data item may be handled and with
                        whom it may be shared.
    description:        |
                        A data item names one or more protective marks
                        by reference. Several are conjunctive: the
                        most restrictive governs.
    term_preferred:     protective mark

    term_admitted:
      - mark

    term_deprecated:
      - classification
      - label

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_concept -- Concept
  #
  concept_concept:
    id_self:            concept_concept
    guid_self:          concept_4c11efe184cd47289cfa3941377d4807
    title:              Concept
    brief:              |
                        One idea the repository uses, held as an entry
                        in the concept register.
    description:        |
                        A concept carries its preferred term, any
                        admitted terms, and any deprecated terms. A
                        concept need not have a type.
    term_preferred:     concept

    term_deprecated:
      - term
      - keyword
      - tag

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_writing_style_rule -- Writing style rule
  #
  concept_writing_style_rule:
    id_self:            concept_writing_style_rule
    guid_self:          concept_ede9aeb0713d4e40a163b50eee05b6cb
    title:              Writing style rule
    brief:              |
                        One rule that prose in the repository follows,
                        stated in a sentence with its reasoning and an
                        example each way.
    description:        |
                        An entry in the writing style rule register,
                        followed by whoever writes prose in the
                        repository.
    term_preferred:     writing style rule

    term_admitted:
      - style rule

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_annotation -- Annotation
  #
  concept_annotation:
    id_self:            concept_annotation
    guid_self:          concept_eef102576e4a485c8630d2c02b8f8898
    title:              Annotation
    brief:              |
                        One assertion about one or more items in the
                        graph, held as an item of its own so that it
                        can be answered.
    description:        |
                        An annotation is not a finding, is not
                        evidence, and is not true for want of an
                        answer. Its role is carried by its edges: what
                        it is about, and what it supports or
                        challenges.
    note:               |
                        Note is deprecated because it already names
                        the descriptive field every item carries.
                        Comment is deprecated because it suggests
                        threads and ordering, which nothing needs.
    term_preferred:     annotation

    term_deprecated:
      - note
      - comment

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_option -- Option
  #
  concept_option:
    id_self:            concept_option
    guid_self:          concept_f3a14213b8844a60a9c6571f699eba6e
    title:              Option
    brief:              |
                        One candidate answer to a decision, held as an
                        item of its own so that it can be argued over.
    description:        |
                        An option is not an annotation. An annotation
                        asserts something and an option proposes
                        something. Annotations give the reasons for
                        and against an option, and those reasons are
                        its rationale. A ruling upholds or rejects it,
                        and an option no ruling names is open.
    note:               |
                        The options for a decision are the
                        alternatives that ISO/IEC/IEEE 42010:2011,
                        Systems and software engineering --
                        Architecture description, clause 5.8.2, asks a
                        record of an architecture decision to
                        consider. MADR calls them the considered
                        options, and the decision management process
                        of ISO/IEC/IEEE 15288 calls them alternatives.

                        r_is_option_for links an option to its
                        decision and so to the items the decision is
                        about. r_supersedes relates it to the option
                        it replaces.
    term_preferred:     option

    term_admitted:
      - alternative

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_concern -- Concern
  #
  concept_concern:
    id_self:            concept_concern
    guid_self:          concept_a1eb797dc146461aaafc47ce31058f48
    title:              Concern
    brief:              |
                        A matter of interest in a system, such as its
                        security, reliability or safety.
    description:        |
                        A concern is something a stakeholder cares
                        about in a system. An argument about a design
                        speaks for one or more concerns, and a
                        decision weighs the concerns its arguments
                        speak for.
    note:               |
                        The concept follows ISO/IEC/IEEE 42010:2022,
                        Software, systems and enterprise --
                        Architecture description, which defines a
                        concern as a matter of interest or importance
                        to a stakeholder.

                        A concern is distinct from a concept. The two
                        share no prefix: a concern id begins concern_
                        and a concept id begins con_.
    term_preferred:     concern
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_python_module -- Python module
  #
  concept_python_module:
    id_self:            concept_python_module
    guid_self:          concept_7ef83f4d029148d5a9e140905d7c710b
    title:              Python module
    brief:              |
                        One file of python source code, as the unit
                        that python imports.
    description:        |
                        A python module is named by the dotted path it
                        is imported under. It carries its own metadata
                        in its module docstring.
    term_preferred:     python module
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_python_package -- Python package
  #
  concept_python_package:
    id_self:            concept_python_package
    guid_self:          concept_643db5503f854dc3a64d5463f624c921
    title:              Python package
    brief:              |
                        A directory of python modules, as a unit that
                        python imports.
    description:        |
                        A python package is named by the dotted path
                        it is imported under. It carries its own
                        metadata in the docstring of its __init__
                        module.
    term_preferred:     python package
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_logic_program_file -- Logic program file
  #
  concept_logic_program_file:
    id_self:            concept_logic_program_file
    guid_self:          concept_ebfa6b09310a4a1db606523ed88834ed
    title:              Logic program file
    brief:              |
                        One file of a logic program: facts and rules
                        that are placed in a program with others and
                        evaluated together.
    description:        |
                        A logic program file is named by a dotted path
                        in the same way as a python module. It carries
                        its own metadata in a comment at the head of
                        the file.
    note:               |
                        Logic program is the wider term. It covers
                        Datalog, and the answer set programs that
                        clingo evaluates. clingo combines the files of
                        a program into one, and has no module of its
                        own.
    term_preferred:     logic program file

    term_deprecated:
      - Datalog module
      - Datalog source file

    alias:
      - concept_datalog_source_file

    relation:           []

  # ---------------------------------------------------------------------------
  # concept_file -- File
  #
  concept_file:
    id_self:            concept_file
    guid_self:          concept_9f57459dd8d14048b8bcebfe0ca9259b
    title:              File
    brief:              |
                        One file in a file system, such as a file in
                        the repository, whatever its format.
    description:        |
                        Every file is a data item (concept_data_item).
                        Some files carry their own item: a python
                        module in its docstring, a logic program file,
                        a shell script or a configuration file in a
                        comment at its head. A YAML file under _data
                        holds one or more items as YAML documents.
    term_preferred:     file
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_commit -- Commit
  #
  concept_commit:
    id_self:            concept_commit
    guid_self:          concept_b2fa5ffe5feb4cc1854fb950afbd3793
    title:              Commit
    brief:              |
                        One recorded change to the tree, integrated
                        into a branch of its repository.
    description:        |
                        A commit is the change, not the message that
                        explains it. The commit message is where the
                        item that records a commit is held.
    note:               |
                        The concept follows ISO/IEC/IEEE 24765:2017,
                        Systems and software engineering --
                        Vocabulary, which defines a commit (3.644) as
                        the integration of changes into a branch that
                        the version control system's repository makes
                        accessible, and a commit message (3.645) as
                        the explanatory message that accompanies a
                        commit. The nearest concept in configuration
                        management is a change record (3.546).
    term_preferred:     commit
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_logical_component -- Logical component
  #
  concept_logical_component:
    id_self:            concept_logical_component
    guid_self:          concept_06871e5747e743d9b2308e9284145c46
    title:              Logical component
    brief:              |
                        One part of a system, defined by what it does
                        and not by how it is built, so that it stays
                        the same part whatever technology is chosen
                        for it.
    description:        |
                        A logical component is not the code or the
                        file that implements it. Those realize it, and
                        may be replaced by others that realize it in
                        another way. Decisions about how a part is
                        built are about the logical component, so that
                        they keep their subject when the
                        implementation changes.
    note:               |
                        The concept and its name follow the logical
                        architecture of Arcadia, Thales, Arcadia user
                        guide: principles and contents overview, 2023,
                        clause 4.3. There a logical component is a
                        grouping of functions that does not deal with
                        technical or technological choices, and it is
                        realized by the components of the physical
                        architecture, clause 4.4.4.

                        Arcadia allocates functions to logical
                        components. cc-public has no function items
                        yet.
    term_preferred:     logical component
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_ruling -- Ruling
  #
  concept_ruling:
    id_self:            concept_ruling
    guid_self:          concept_73b3dbb310ae4337873e98e119c0dade
    title:              Ruling
    brief:              |
                        The act of settling, given the arguments
                        presented, that an option holds or does not
                        hold, recorded as an item of its own.
    description:        |
                        A ruling is made by someone, and is changed in
                        place when they change the ruling, so that a
                        decision has at most one. It is not the
                        evaluation of the arguments, which is to be
                        computed from them for a given ranking of
                        concerns, and would change whenever an
                        argument is added. No evaluator exists yet.
                        Where the two disagree, the arguments have
                        moved since the ruling was made, and it may be
                        time to change it.
    note:               |
                        Abstract argumentation evaluates arguments and
                        says nothing of who acts on the result: Dung,
                        On the acceptability of arguments and its
                        fundamental role in nonmonotonic reasoning,
                        logic programming and n-person games,
                        Artificial Intelligence 77, 1995. Committing
                        to a course of action is a move in a
                        deliberation dialogue: McBurney, Hitchcock and
                        Parsons, The eightfold way of deliberation
                        dialogue, International Journal of Intelligent
                        Systems 22, 2007.

                        Arcadia has no counterpart.

                        The term "determination" was the first name of
                        the concept and is deprecated: "ruling" says
                        the same thing in plainer words.
    term_preferred:     ruling

    term_deprecated:
      - determination

    alias:
      - concept_determination

    relation:           []

  # ---------------------------------------------------------------------------
  # concept_decision -- Decision
  #
  concept_decision:
    id_self:            concept_decision
    guid_self:          concept_2253ed53e9a744a58f5fe09fbcd9e1ba
    title:              Decision
    brief:              |
                        A question about the system to be settled, for
                        which options are offered and around which the
                        arguments for and against them are gathered.
    description:        |
                        A decision is stated before it is settled. Its
                        options are the alternatives, and every
                        annotation about it, and every ruling that
                        upholds or rejects one of its options, belongs
                        to it. A decision with no ruling is open.
    note:               |
                        The concept follows architecture decisions and
                        rationale in ISO/IEC/IEEE 42010:2011, Systems
                        and software engineering -- Architecture
                        description, clauses 4.2.7 and 5.8. Of the
                        points 5.8.2 asks a record of a decision to
                        consider, the id identifies the decision, the
                        brief states the question, r_is_about links it
                        to the items it is about, its options record
                        the alternatives, annotations carry the
                        rationale and link it to concerns, and a
                        ruling records the outcome. Owner and
                        timestamps are left to git. MADR and the
                        decision management process of ISO/IEC/IEEE
                        15288 likewise use "decision" for the question
                        being settled.

                        The structure follows Issue-Based Information
                        Systems, in which what IBIS calls an issue is
                        answered by positions, and positions are
                        argued for and against: Kunz and Rittel,
                        Issues as elements of information systems,
                        Working Paper 131, Institute of Urban and
                        Regional Development, University of
                        California, Berkeley, 1970. Here an IBIS issue
                        is a decision and a position is an option. A
                        deliberation dialogue likewise opens with a
                        governing question: McBurney, Hitchcock and
                        Parsons, The eightfold way of deliberation
                        dialogue, International Journal of Intelligent
                        Systems 22, 2007.

                        The term "issue" is deprecated because in
                        everyday use, and in code forges, it means a
                        problem or a ticket.

                        Arcadia has no counterpart.
    term_preferred:     decision

    term_admitted:
      - question

    term_deprecated:
      - issue

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_requirement -- Requirement
  #
  concept_requirement:
    id_self:            concept_requirement
    guid_self:          concept_d556c2dba87a402daf54bfd892f432b8
    title:              Requirement
    brief:              |
                        A statement which translates or expresses a
                        need and its associated constraints and
                        conditions.
    description:        |
                        A requirement is an obligation on one system
                        or system element, its subject. It is written
                        as one statement that a reader can verify.
                        Here the statement is not stored: it is
                        composed from the slots of the requirement, so
                        that it is well formed by construction.
    note:               |
                        The definition is that of ISO/IEC/IEEE
                        29148:2011, Systems and software engineering
                        -- Life cycle processes -- Requirements
                        engineering, clause 4.1.17. Clause 5.2.4 gives
                        the syntax [Condition] [Subject] [Action]
                        [Object] [Constraint], and the keywords shall,
                        should, will and may.

                        The slots follow the SOPHIST MASTER template,
                        a stricter form of that syntax: Rupp and the
                        SOPHISTs, Requirements-Engineering und
                        -Management. The attributes follow the INCOSE
                        Guide for Writing Requirements, revision 3,
                        2019, section 5.

                        Arcadia has no counterpart.
    term_preferred:     requirement
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_keep -- Keeping
  #
  concept_keep:
    id_self:            concept_keep
    guid_self:          concept_67873c78ec204ec58f2a0c1214628ceb
    title:              Keeping
    brief:              |
                        The process of holding a thing as it is, so
                        that it does not change.
    description:        |
                        A process word: the verb a requirement obliges
                        its subject to do. What is kept is named by
                        the object of the requirement.
    term_preferred:     keep
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_refuse -- Refusing
  #
  concept_refuse:
    id_self:            concept_refuse
    guid_self:          concept_b4290101525f44089b04d7d6f590f51c
    title:              Refusing
    brief:              |
                        The process of declining to carry out what was
                        asked, so that none of it is done.
    description:        |
                        A process word: the verb a requirement obliges
                        its subject to do. What is refused is named by
                        the object of the requirement.
    term_preferred:     refuse
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_role -- Role
  #
  concept_role:
    id_self:            concept_role
    guid_self:          concept_31444736417d47ceb9a068ecd461efa2
    title:              Role
    brief:              |
                        Something an item can be cast as in a
                        relation, shared by every relation that needs
                        it.
    description:        |
                        A role names what an item is to the relations
                        it takes part in, such as an argument,
                        something that can be argued for or against,
                        or a design element. A type says which roles
                        its items play, and a relation restriction
                        says which roles an end of a relation needs.
                        One role serves many relations, and many types
                        may play it, including the types of a partner
                        in the federation.
    note:               |
                        Role here is the role class of ISO 15926-2,
                        Industrial automation systems and integration
                        -- Integration of life-cycle data for process
                        plants -- Part 2: Data model, whose
                        role_and_domain is a role shared by many
                        relationships and played by the members of a
                        domain. Object-role modelling (Halpin) uses
                        roles played by object types in the same way.

                        It is not the relation role of ISO/IEC
                        11179-3:2013, Information technology --
                        Metadata registries -- Part 3: Registry
                        metamodel and basic attributes, clause
                        3.2.120, which is a named end of one relation.
                        Here the two ends of a relation are its source
                        and its target, and they are not named items.

                        A role is declared on a type, never on an
                        item, so that it cannot drift between items of
                        one type.
    term_preferred:     role
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_relation_restriction -- Relation restriction
  #
  concept_relation_restriction:
    id_self:            concept_relation_restriction
    guid_self:          concept_2f394dca3741439f8117350522409b06
    title:              Relation restriction
    brief:              |
                        A condition on the items that may stand at one
                        end of a relation, stated in terms of roles.
    description:        |
                        A relation restriction is satisfied by an item
                        whose type plays any role it admits, or does
                        not play any role it excludes. A relation
                        names restrictions for its source and for its
                        target. An end must satisfy every restriction
                        it names, and an end that names none is open
                        to any item. The conditions on an end are
                        therefore in conjunctive normal form, with
                        negation.
    note:               |
                        The name follows the property restrictions of
                        OWL 2, W3C OWL 2 Web Ontology Language
                        Structural Specification, section 8, which
                        state conditions on the values of a property.
                        A restriction here names roles, never types,
                        so that a partner in the federation can meet
                        it by giving its own types a role.
    term_preferred:     relation restriction
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_python_class -- Python class
  #
  concept_python_class:
    id_self:            concept_python_class
    guid_self:          concept_c97a730397514643a1b48c4db6fd2c0d
    title:              Python class
    brief:              |
                        A class defined in a python module, at the top
                        of the module or inside another class.
    description:        |
                        A python class is named by the dotted path of
                        its module and the names of the classes it
                        sits in. It carries its own metadata in its
                        docstring once something needs to point at it.
    term_preferred:     python class
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_python_function -- Python function
  #
  concept_python_function:
    id_self:            concept_python_function
    guid_self:          concept_b1d0fdbdcfb7433cb286712549529807
    title:              Python function
    brief:              |
                        A function or method defined in a python
                        module, at the top of the module or inside a
                        class.
    description:        |
                        A python function is named by the dotted path
                        of its module and the names of the classes it
                        sits in. A method is a python function. A
                        function defined inside another function is
                        not one in this sense, since nothing outside
                        can call it. It carries its own metadata in
                        its docstring once something needs to point at
                        it.
    term_preferred:     python function
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_interface_control_document -- Interface control document
  #
  concept_interface_control_document:
    id_self:            concept_interface_control_document
    guid_self:          concept_3f8513f2edef4a7c838f5c7f2de04aed
    title:              Interface control document
    brief:              |
                        A controlled contract for one interface: what
                        crosses a shared boundary between system
                        elements, and what each side may rely on.
    description:        |
                        An interface control document states one
                        version of one interface, in enough detail
                        that a provider and a caller built by
                        different developers agree. It may present the
                        interface in more than one way, such as an API
                        in one language, a runtime step, or the
                        artifacts handed across the boundary. Each
                        declaration it holds can be pointed at on its
                        own.
    note:               |
                        ISO/IEC/IEEE 24765:2017, Systems and software
                        engineering -- Vocabulary, has no entry for
                        the preferred term. 3.2059 defines interface
                        control as the procedures and documentation
                        that identify the characteristics between
                        configuration items provided by different
                        developers. 3.2065 defines interface
                        specification, sense 2, as a document that
                        specifies the interface characteristics of an
                        existing or planned system or component, which
                        is this concept. The preferred term is the one
                        the INCOSE Guide to Writing Requirements uses
                        in attribute A30, trace to interface
                        definition.
    term_preferred:     interface control document

    term_admitted:
      - interface specification

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_interface_member -- Interface member
  #
  concept_interface_member:
    id_self:            concept_interface_member
    guid_self:          concept_52b54cfa0bcd4c698504fe99bd0bc85a
    title:              Interface member
    brief:              |
                        One declaration within an interface control
                        document: a module, type, constant, function,
                        class, method, parameter, port or artifact
                        that crosses the boundary.
    description:        |
                        An interface member has its own identity, so
                        that a requirement, an implementation or a
                        test can name one member rather than the whole
                        interface control document. It states what a
                        caller may rely on: its brief, and its
                        guarantee, which says what the signature does
                        not.
    note:               |
                        ISO/IEC/IEEE 24765:2017 3.2064 defines
                        interface signature as the set of action
                        signatures associated with the interactions of
                        an interface. A member is one element of that
                        set, or one value that an action reads or
                        writes.
    term_preferred:     interface member
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_dataflow_graph -- Dataflow graph
  #
  concept_dataflow_graph:
    id_self:            concept_dataflow_graph
    guid_self:          concept_269cf965b22a4a168e33b3b3e4c37f9d
    title:              Dataflow graph
    brief:              |
                        A system of interest described as a dataflow
                        graph: its dataflow nodes, the dataflow edges
                        that carry data between their ports, and where
                        each dataflow node runs.
    description:        |
                        A dataflow graph is complete enough to be run.
                        Each dataflow node names the interface control
                        document whose dataflow step surface it
                        presents, so that every dataflow edge can be
                        checked against the ports at its ends. A
                        variant of a system, for a test, a simulation
                        or a deployment, is derived from a dataflow
                        graph by transformations, and is not kept as a
                        copy.
    note:               |
                        The sections of a dataflow graph follow the
                        configuration model of Stableflow, the data
                        flow engine of Design Factory (software
                        architecture description 2.0.0, clause 5.5).

                        The concept was first called system
                        configuration. That phrase is kept for its
                        systems engineering sense: a specific
                        configuration of software and hardware,
                        usually the system of interest of a
                        verification or validation exercise.
                        ISO/IEC/IEEE 24765:2017 3.770 defines
                        configuration as the arrangement of a computer
                        system or component as defined by the number,
                        nature and interconnections of its constituent
                        parts.
    term_preferred:     dataflow graph

    alias:
      - concept_system_configuration

    relation:           []

  # ---------------------------------------------------------------------------
  # concept_dataflow_node -- Dataflow node
  #
  concept_dataflow_node:
    id_self:            concept_dataflow_node
    guid_self:          concept_47a87aafdcaa4281982ae0d00c299aa7
    title:              Dataflow node
    brief:              |
                        One step of a dataflow graph: it reads its
                        inputs, writes its outputs and keeps state
                        between invocations.
    description:        |
                        A dataflow node is one use of a step within a
                        dataflow graph. Its interface is a dataflow
                        step surface of an interface control document,
                        and its settings are the values it is
                        configured with. Many dataflow nodes may
                        present the same interface.
    note:               |
                        A dataflow node runs in the dataflow engine
                        (concept_dataflow_engine). Under the semantics
                        of a Kahn process network (Kahn, The semantics
                        of a simple language for parallel programming,
                        IFIP 1974), which the engine supports first,
                        it is a process of that network. It is a node
                        in the sense of Stableflow (software
                        architecture description 2.0.0, clause 5.1).
                        It is qualified because node is an overloaded
                        word. ISO/IEC/IEEE 24765:2017 3.2598 gives
                        node five senses, among them a vertex of a
                        graph (sense 1) and a unit located in space,
                        which is a host (sense 2), and Arcadia uses it
                        for a physical component that hosts others. A
                        dataflow node is neither: it runs on an OS
                        process, and an OS process on a host.
    term_preferred:     dataflow node

    term_admitted:
      - node

    alias:
      - concept_node

    relation:           []

  # ---------------------------------------------------------------------------
  # concept_dataflow_edge -- Dataflow edge
  #
  concept_dataflow_edge:
    id_self:            concept_dataflow_edge
    guid_self:          concept_afe0cae85ddb44768f912d8411b2809a
    title:              Dataflow edge
    brief:              |
                        A connection of a dataflow graph: it carries
                        the values one dataflow node writes on an
                        output port to an input port of another, in
                        order.
    description:        |
                        A dataflow edge is part of a dataflow graph.
                        Each end names a dataflow node and one port of
                        the interface that node presents. A dataflow
                        edge is feedforward unless it says feedback; a
                        feedback edge closes a loop, and its value
                        comes from the invocation before.
    note:               |
                        ISO/IEC/IEEE 24765:2017 3.1006 defines data
                        flow as the sequence in which data transfer,
                        use and transformation are performed during
                        the execution of a computer program. Under the
                        semantics of a Kahn process network, which the
                        dataflow engine (concept_dataflow_engine)
                        supports first, a dataflow edge is a channel
                        of that network. It is an edge in the sense of
                        Stableflow (software architecture description
                        2.0.0, clause 5.1). It is qualified because
                        the graph of items has edges of its own, which
                        are relations.
    term_preferred:     dataflow edge

    term_admitted:
      - edge

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_os_process -- OS process
  #
  concept_os_process:
    id_self:            concept_os_process
    guid_self:          concept_4913750e0fd34300a2cbdbae68962305
    title:              OS process
    brief:              |
                        An executable unit managed by an operating
                        system scheduler, where dataflow nodes run in
                        order.
    description:        |
                        An OS process is part of a dataflow graph.
                        Each runs on one host, and each dataflow node
                        names the OS process it runs in.
    note:               |
                        ISO/IEC/IEEE 24765:2017 3.3037 gives process
                        several senses. This is sense 6, an executable
                        unit managed by an operating system scheduler.
                        Sense 1, a set of interrelated or interacting
                        activities that transforms inputs into
                        outputs, is the life cycle process of
                        ISO/IEC/IEEE 15288, which is why the word is
                        qualified.
    term_preferred:     OS process

    term_admitted:
      - process

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_dataflow_engine -- Dataflow engine
  #
  concept_dataflow_engine:
    id_self:            concept_dataflow_engine
    guid_self:          concept_96848bd06b514560aea72ebcc2c9cdb5
    title:              Dataflow engine
    brief:              |
                        The engine of cc-public that runs a dataflow
                        graph: it places each dataflow node on its OS
                        process and passes values along the dataflow
                        edges.
    description:        |
                        The dataflow engine is being ported into
                        cc-public from Stableflow, the dataflow engine
                        of Design Factory, and reads its dataflow
                        graphs from the graph of items. Its first
                        semantics are those of a Kahn process network.
                        It is meant to support others as well, at
                        least those of actors, so a dataflow node or
                        edge is not defined by Kahn semantics alone.
                        If it ever needs a brand, it is the Capability
                        Commons Dataflow Engine.
    note:               |
                        The owner settled the name on 2026-10-20,
                        after a deliberation among the concern
                        advocates. ISO/IEC/IEEE 24765:2017 3.1006
                        defines data flow. Kahn, The semantics of a
                        simple language for parallel programming (IFIP
                        1974), defines process networks; Hewitt,
                        Bishop and Steiger, A universal modular ACTOR
                        formalism for artificial intelligence (IJCAI
                        1973), defines actors.
    term_preferred:     dataflow engine
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_argument -- Argument
  #
  concept_argument:
    id_self:            concept_argument
    guid_self:          concept_a54dc1974bce4d4fbb5703ef26bbc7d0
    title:              Argument
    brief:              |
                        One annotation that supports or challenges an
                        option or another annotation, and so gives a
                        reason for or against it.
    description:        |
                        An argument is an annotation with an edge of
                        r_supports or r_challenges. When it bears on
                        an option it speaks for at least one concern.
                        The arguments of one decision, with its
                        options and its ruling, make up a deliberation
                        (concept_deliberation); the whole is never
                        called an argument.
    note:               |
                        The concept follows abstract argumentation, in
                        which an argument is an entity that may
                        attack, and be attacked by, other arguments:
                        Dung, On the acceptability of arguments and
                        its fundamental role in nonmonotonic
                        reasoning, logic programming and n-person
                        games, Artificial Intelligence 77, 1995. Here
                        support is recorded as well as attack.
    term_preferred:     argument
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_deliberation -- Deliberation
  #
  concept_deliberation:
    id_self:            concept_deliberation
    guid_self:          concept_6ff2034b0aed4ddbb4e9a2440440bc1e
    title:              Deliberation
    brief:              |
                        Everything gathered by one decision, its
                        options, the annotations about it and the
                        arguments for and against them, and the ruling
                        that settles it.
    description:        |
                        A deliberation is not an item of its own. The
                        decision names it, and the other items belong
                        to it by their edges and are kept in the
                        folder of the decision. A single annotation
                        within it is an argument (concept_argument).
    note:               |
                        A deliberation dialogue is one in which the
                        participants decide together what action to
                        take: McBurney, Hitchcock and Parsons, The
                        eightfold way of deliberation dialogue,
                        International Journal of Intelligent Systems
                        22, 2007.
    term_preferred:     deliberation
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_check -- Check
  #
  concept_check:
    id_self:            concept_check
    guid_self:          concept_2bf4b971ce194741976edcf6a3419e91
    title:              Check
    brief:              |
                        One named test over the graph of items, such
                        as dangling_reference, which reports a failure
                        for each place where the graph breaks it.
    description:        |
                        Most checks are rules of a logic program that
                        clingo runs; a few are in Python, and the
                        shape of every YAML document is checked
                        against its schema. cctool check runs them
                        all, and the gate runs cctool check before
                        every commit. What a check reports is a
                        failure (concept_failure). A rule is the
                        construct of the logic program a check is
                        written in, and a writing style rule is a
                        different thing again.
    term_preferred:     check
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_failure -- Failure
  #
  concept_failure:
    id_self:            concept_failure
    guid_self:          concept_b386c31aebf44fa8a8d6f1814d1d3c1b
    title:              Failure
    brief:              |
                        One report of a check (concept_check), naming
                        the place where the graph breaks it, what was
                        found, and how to fix it.
    description:        |
                        A failure stops a commit at the gate. It is
                        not an error. An error is cctool failing to do
                        what it was asked, such as a query that does
                        not parse, and is reported with exit status 2.
    term_preferred:     failure
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_shell_script -- Shell script
  #
  concept_shell_script:
    id_self:            concept_shell_script
    guid_self:          concept_95b2da0902814d70aa308532e4f69645
    title:              Shell script
    brief:              |
                        One file of commands for a Unix shell, whose
                        first line names the shell that runs it.
    description:        |
                        The git hooks of this repository are shell
                        scripts for the POSIX shell, /bin/sh, and use
                        none of the extensions of bash. A shell script
                        carries its item in a comment at its head,
                        after the line that names its interpreter,
                        because its format has no other place for it.
    note:               |
                        The shell command language is defined by IEEE
                        Std 1003.1 (POSIX), Shell and Utilities
                        volume, chapter 2.
    term_preferred:     shell script
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_data -- Data
  #
  concept_data:
    id_self:            concept_data
    guid_self:          concept_32952ea2083d405aa148ec5199774163
    title:              Data
    brief:              |
                        Recorded information, regardless of form or
                        method of recording.
    description:        |
                        Data is a mass noun. One unit of it, handled
                        on its own, is a data item
                        (concept_data_item).
    note:               |
                        The definition is that of MIL-STD-963C, Data
                        Item Descriptions.
    term_preferred:     data
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_data_item -- Data item
  #
  concept_data_item:
    id_self:            concept_data_item
    guid_self:          concept_4fe42e5902bf4dbb855bce59a285da4d
    title:              Data item
    brief:              |
                        One piece of data (concept_data) that is
                        specified, produced and handled as a unit,
                        whatever its form, such as a file, a drawing,
                        a report or a video in an unknown format.
    description:        |
                        Every file is a data item (concept_file), and
                        so is every engineering document
                        (concept_document). A data item need not have
                        an identity in the graph. The data items that
                        do, with an id_self and a guid_self, are the
                        ones the graph holds; the term for them is
                        still to be decided.
    note:               |
                        The term comes from defense procurement, where
                        a Data Item Description (MIL-STD-963C)
                        specifies one data product, and a Contract
                        Data Requirements List orders a package of
                        them. MIL-STD-963C defines a data product as
                        information generated by the work tasks of a
                        contract and treated as a separate entity,
                        such as a drawing, specification, manual,
                        report, records or parts list. This project
                        applies the same approach at a finer grain,
                        and checks it by machine.
    term_preferred:     data item
    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_document -- Document
  #
  concept_document:
    id_self:            concept_document
    guid_self:          concept_48a1f582dcc8476eba63846aa9cd0708
    title:              Document
    brief:              |
                        A data item meant for people to read, managed
                        and exchanged as a unit, such as a
                        specification, a report or an interface
                        control document.
    description:        |
                        In prose, an engineering document is called
                        that wherever the plain word could be read as
                        a YAML document, which is one document of a
                        YAML stream, and so a matter of syntax rather
                        than of meaning.
    note:               |
                        Compare the definitions of document in
                        ISO/IEC/IEEE 15289 and IEC 82045-1.
    term_preferred:     document

    term_admitted:
      - engineering document

    alias:              []
    relation:           []

  # ---------------------------------------------------------------------------
  # concept_configuration_file -- Configuration file
  #
  concept_configuration_file:
    id_self:            concept_configuration_file
    guid_self:          concept_f4c8815a374744e489095317410791c8
    title:              Configuration file
    brief:              |
                        A file that sets how a tool behaves, such as
                        .gitignore or pyproject.toml.
    description:        |
                        A configuration file whose format has no other
                        place for metadata carries its item in a
                        comment at its head.
    term_preferred:     configuration file
    alias:              []
    relation:           []
