  # ---------------------------------------------------------------------------
  # concept_concept -- Concept
  #
  concept_concept:
    id_self:            concept_concept
    guid_self:          concept_4c11efe184cd47289cfa3941377d4807
    title:              Concept
    brief:              |
                        One idea the repository uses, held as an
                        [[entry]] in reg_concept.
    description:        |
                        A concept carries its preferred term, any
                        admitted terms, and any deprecated terms. A
                        concept need not have a type.
    note:               |
                        A concept entry is the record of our
                        convention for the use of its terms. Of the
                        standard top-level ontologies, DOLCE, which
                        ISO/IEC 21838-3 standardizes, comes closest to
                        this: it describes the world as people
                        conceive it, and its Descriptions and
                        Situations extension (Gangemi and Mika, 2003)
                        treats a concept as a social object, defined
                        by a description that a community shares.

                        BFO, to which the concept register is mapped,
                        is realist and has no class for a concept. A
                        concept entry is therefore never a BFO class;
                        it is linked to classes only by graded mapping
                        edges.
    term_preferred:     concept

    term_deprecated:
      - term
      - keyword
      - tag

    alias:              []

    edge:

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_iso_iec_21838_3_2023
        guid_target:    extdoc_bb78ff276b8340afbc456c4be36d3167

      - id_relation:    relation_cites
