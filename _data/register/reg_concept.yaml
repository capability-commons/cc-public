  # ---------------------------------------------------------------------------
  # concept_concern_advocate -- Concern advocate
  #
  concept_concern_advocate:
    id_self:            concept_concern_advocate
    guid_self:          concept_70ce062ff65a4201960b9b33840d4390
    title:              Concern advocate
    brief:              |
                        An agent that writes annotations on decisions
                        on behalf of one concern (concept_concern).
    description:        |
                        Each concern advocate argues for its concern
                        only, so that a ruling shows which concerns
                        were heard.
    term_preferred:     concern advocate

    term_admitted:
      - advocate

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # concept_commit_gate -- Commit gate
  #
  concept_commit_gate:
    id_self:            concept_commit_gate
    guid_self:          concept_33206a1ae68747a08422bbcd4ea385ab
    title:              Commit gate
    brief:              |
                        The check, lint and test of staged content
                        that cctool gate runs before a commit is made.
    description:        |
                        The commit gate runs on a copy of the staged
                        index, so that what is checked is exactly what
                        is committed. A commit is refused when any
                        stage fails.
    term_preferred:     commit gate

    term_admitted:
      - gate

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # concept_proxy -- Proxy
  #
  concept_proxy:
    id_self:            concept_proxy
    guid_self:          concept_36dffd88734d4aa8a93f38c97b228ae2
    title:              Proxy
    brief:              |
                        A data item that stands in the graph for
                        something outside it, such as an external
                        document or a physical thing.
    description:        |
                        The id and guid of a proxy address the proxy,
                        not the thing it points at. Its type says what
                        kind of thing that is. A relation may read
                        through a proxy at one or both ends, so that
                        its edges join the things pointed at rather
                        than the proxies. Two proxies may point at one
                        thing; where both carry the same outside
                        identifier, such as a DOI or an ISBN, they
                        point at the same thing. A concept entry is
                        not a proxy: it is the concept itself, as the
                        record of our convention for its use. The
                        owner (concept_owner) of the thing is recorded
                        on the proxy.
    term_preferred:     proxy
    alias:              []

    edge:

      - id_relation:    relation_is_narrower_than
        guid_relation:  relation_698cfb11be904a3f8e7d2821aa926ccd
        id_target:      concept_identifiable_data_item
        guid_target:    concept_a125aa49d2a145368ebb6c79d85c375b
