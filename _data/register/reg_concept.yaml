  # ---------------------------------------------------------------------------
  # concept_option -- Option
  #
  concept_option:
    id_self:            concept_option
    guid_self:          concept_f3a14213b8844a60a9c6571f699eba6e
    title:              Option
    brief:              |
                        One candidate answer to a [[decision]], held
                        as an [[concept_identifiable_data_item|item]]
                        of its own so that it can be argued over.
    description:        |
                        An option is not an annotation. An annotation
                        asserts something and an option proposes
                        something. Annotations give the reasons for
                        and against an option, and those reasons are
                        its rationale. A ruling upholds or rejects it,
                        and an option no ruling names is open.
    note:               |
                        The options for a decision are the
                        alternatives that a record of an architecture
                        decision considers in ISO/IEC/IEEE 42010:2022,
                        Software, systems and enterprise --
                        Architecture description. The 2011 edition
                        listed them in clause 5.8.2. MADR calls them
                        the considered options, and the decision
                        management process of ISO/IEC/IEEE 15288 calls
                        them alternatives.

                        relation_is_option_for links an option to its
                        decision and so to the items the decision is
                        about. relation_supersedes relates it to the
                        option it replaces.
    term_preferred:     option

    term_admitted:
      - alternative

    alias:              []

    edge:

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_iso_iec_ieee_15288_2023
        guid_target:    extdoc_cb3bc491fa494a1c8653b9f0bd334835

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_madr
        guid_target:    extdoc_e87a355657a140afa03c62f0b3fb2fc8

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_iso_iec_ieee_42010_2022
        guid_target:    extdoc_1d8aa4e214694b048065933ab1fede06

  # ---------------------------------------------------------------------------
  # concept_concern -- Concern
  #
  concept_concern:
    id_self:            concept_concern
    guid_self:          concept_a1eb797dc146461aaafc47ce31058f48
    title:              Concern
    brief:              |
                        A matter of interest in a system, such as its
                        security, reliability or safety.
    description:        |
                        A concern is something a stakeholder cares
                        about in a system. An argument about a design
                        speaks for one or more concerns, and a
                        decision weighs the concerns its arguments
                        speak for.
    note:               |
                        The concept follows ISO/IEC/IEEE 42010:2022,
                        Software, systems and enterprise --
                        Architecture description, which defines a
                        concern as a matter of interest or importance
                        to a stakeholder.

                        A concern is distinct from a concept, and each
                        has a prefix of its own: a concern id begins
                        concern_ and a concept id begins concept_.
    term_preferred:     concern
    alias:              []

    edge:

      - id_relation:    relation_cites
        guid_relation:  relation_51554b1012884a358e38a299ba3632e0
        id_target:      extdoc_iso_iec_ieee_42010_2022
        guid_target:    extdoc_1d8aa4e214694b048065933ab1fede06

