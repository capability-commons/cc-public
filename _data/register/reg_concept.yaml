title:                  Concept register
brief:                  |
                        Register of the concepts used in the cc-public
                        repository.
description:            |
                        The concept register holds one entry per
                        concept. Each entry defines the concept and
                        gives its preferred term, any admitted terms,
                        and any deprecated terms, as ISO 1087 uses
                        those words.
usage:                  |
                        The concept register keeps the vocabulary of
                        the repository consistent. A data item that
                        introduces a concept enters it here. A term is
                        held to the sense of its concept where it is
                        used as a term: in an id, a slot of a
                        requirement, a title, or a link to the concept
                        in prose. There it is used in that sense, and
                        a deprecated term is not used for it. A word
                        that a concept also uses keeps its everyday
                        senses elsewhere, as ISO 1087 separates terms
                        from the words of general language.

                        The brief of a concept is its definition, and
                        links every term it uses, as do the text slots
                        of a requirement. A definition may link any
                        concept here, since a concept is defined in
                        the terms of the others.

                        A partner may hold a concept register of their
                        own. A concept arriving from a partner names
                        an entry there and not here.
note:                   |
                        A concept is entered here whether or not it is
                        a data item type. What has a type is a subset
                        of what has a name.

                        One term may name several concepts, and
                        several terms may name one concept.

                        The concept register is our record of our
                        conventions for how concepts are used. An
                        entry is the concept itself, not a proxy for
                        one that exists apart from it. An entry can
                        never be wrong in a strict sense, only at odds
                        with the conventions of some other community
                        or system.

