title:                  Maturity level register
brief:                  |
                        Register of the levels of maturity that a
                        source file may declare.
description:            |
                        The maturity level register holds one entry
                        per level, numbered from 0 with gaps between
                        them, read as the numbered lifecycle stages of
                        automotive practice are. Each entry lists what
                        code at that level must show, beyond what each
                        lower level demands. A source file declares
                        its level by an edge of relation_has_maturity,
                        takes the lowest level if it declares none,
                        and may not declare a level above that of a
                        file it imports.
usage:                  |
                        A source file names its level in its own item,
                        by an edge of relation_has_maturity to an
                        entry here.
note:                   |
                        The levels from 20 follow the gates of the
                        numbered Material Life Cycle (MLC) of
                        automotive practice, as WTP gave them on
                        2026-10-28, read through the systems and
                        software stage that each gate is aligned with.
                        maturity_0 comes before MLC 20.

                        As at those gates, a document is asked for at
                        several levels: a draft early, an update at a
                        later level and the final version later still,
                        so that an incomplete document is inspected
                        early rather than written at the last moment
                        (WTP, 2026-10-28). Here the documents are the
                        requirements of a component, its test plan,
                        which is the verification method and approach
                        of each requirement and its verifiers, and its
                        architecture, which is its place among the
                        components and the decisions about it.

entries:

  # ---------------------------------------------------------------------------
  # maturity_0 -- Unassessed
  #
  maturity_0:
    id_self:            maturity_0
    guid_self:          maturity_733e9195f4694e17a454c5ed4dadc3b4
    title:              Unassessed
    brief:              |
                        Code that has not yet entered the lifecycle,
                        such as a sketch written to find out what is
                        needed.
    description:        |
                        The lowest level, which a source file that
                        declares no maturity takes. It stands before
                        MLC 20, and code here may change or go at any
                        time.
    level:              0

    demand:
      - brief:          |
                        It passes the commit gate: the check, the lint
                        and the tests.

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # maturity_20 -- Request and alignment
  #
  maturity_20:
    id_self:            maturity_20
    guid_self:          maturity_02e160cbd66043818c5bda2f96e06b08
    title:              Request and alignment
    brief:              |
                        Code whose need is stated: the requirements it
                        is to meet are written and trace to its
                        logical component.
    description:        |
                        Read as MLC 20, request and strategy
                        alignment, which systems and software practice
                        maps to requirements engineering (ASPICE
                        SYS.2).
    level:              20

    demand:
      - brief:          |
                        A draft of its requirements: it realizes a
                        logical component, and at least one
                        requirement has that component as its subject.
      - brief:          |
                        A draft of its architecture: its logical
                        component is a part of the component it
                        belongs to.

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # maturity_40 -- Concept and prototype
  #
  maturity_40:
    id_self:            maturity_40
    guid_self:          maturity_4f05274d18c74fa3990a09449d9c700a
    title:              Concept and prototype
    brief:              |
                        Code whose design is chosen and shown to work
                        as a prototype on its main path.
    description:        |
                        Read as MLC 40, concept and lab selection,
                        which systems and software practice maps to
                        architecture and prototyping (ASPICE SYS.3 and
                        SWE.2).
    level:              40

    demand:
      - brief:          |
                        An update of its requirements and a draft of
                        its test plan: each requirement on its
                        component gives its verification method and
                        approach.
      - brief:          |
                        An update of its architecture: its component
                        has its place in the order of components, by
                        its edges of relation_may_depend_on, and each
                        decision about the component has its options.
      - brief:          |
                        A test exercises it.

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # maturity_60 -- Technical release
  #
  maturity_60:
    id_self:            maturity_60
    guid_self:          maturity_97bc8576b3f84cd0869b080f0356ebab
    title:              Technical release
    brief:              |
                        Code released as a unit: each requirement it
                        realizes is verified, and its tests reach most
                        of it.
    description:        |
                        Read as MLC 60, technical approvals, which
                        systems and software practice maps to software
                        unit verification (ASPICE SWE.4).
    level:              60

    coverage:
      line:             80
      branch:           70

    demand:
      - brief:          |
                        The final version of its requirements, and an
                        update of its test plan: each requirement it
                        realizes has a verifier.
      - brief:          |
                        The final version of its architecture: each
                        decision about its component is ruled.
      - brief:          |
                        Its tests cover the floor of lines and
                        branches that this level sets.

      - brief:          |
                        Each requirement it realizes at the two
                        highest criticalities has a verifier whose
                        item states the procedure and what shows
                        success.

        criticality:
          - crit_80
          - crit_90

        check:          lpp_cctool.check.check.unstated_procedure

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # maturity_80 -- Integration and pre-series
  #
  maturity_80:
    id_self:            maturity_80
    guid_self:          maturity_14a94c94c5d94252bf993a6e96726f26
    title:              Integration and pre-series
    brief:              |
                        Code verified in the whole it is part of, as
                        it runs from the command line or the service
                        it serves.
    description:        |
                        Read as MLC 80, process qualification and
                        pre-series production, which systems and
                        software practice maps to integration testing.
    level:              80

    coverage:
      line:             90
      branch:           80

    demand:
      - brief:          |
                        The final version of its test plan: each
                        verifier of a requirement it realizes passed
                        in the last run of the night.
      - brief:          |
                        A test runs it through the interface it
                        serves, as a user or a peer would.
      - brief:          |
                        Its tests cover the higher floor of lines and
                        branches that this level sets.
      - brief:          |
                        The check gives no advice on it.

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # maturity_100 -- Production release
  #
  maturity_100:
    id_self:            maturity_100
    guid_self:          maturity_034f3271cf924c72b942fdd440d5a107
    title:              Production release
    brief:              |
                        Code released for use, frozen into the
                        baseline of a release, which changes only by
                        the process of a release.
    description:        |
                        Read as MLC 100, mass production release at
                        the start of production, which software
                        practice maps to a locked baseline.
    level:              100

    demand:
      - brief:          |
                        Each release that ships it declares this
                        maturity, and its check passes.

    alias:              []
    edge:               []

  # ---------------------------------------------------------------------------
  # maturity_120 -- Maintenance and retirement
  #
  maturity_120:
    id_self:            maturity_120
    guid_self:          maturity_74733d19e15c450fa9af72124c14061e
    title:              Maintenance and retirement
    brief:              |
                        Code in use that is watched, fixed and in time
                        retired, rather than extended.
    description:        |
                        Read as MLC 120, continuous monitoring and end
                        of life, which software practice maps to
                        maintenance and updates in the field.
    level:              120

    demand:
      - brief:          |
                        A change to it fixes a defect or prepares its
                        retirement, and names what it fixes.

    alias:              []
    edge:               []

