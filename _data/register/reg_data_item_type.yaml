  # type_interface_control_document -- Interface control document type
  #
  type_interface_control_document:
    id_self:            type_interface_control_document
    guid_self:          type_493a5619421046308af3f2b194d081d8
    title:              Interface control document type
    brief:              |
                        Type of interface control document data items.
    description:        |
                        Each interface control document data item
                        states one version of one interface: its
                        surfaces, and the members that cross the
                        boundary on each.
    usage:              |
                        An interface control document lets a provider
                        and a caller built by different developers
                        agree on a boundary, and lets a requirement,
                        an implementation or a test point at one
                        member of it.
    note:               |
                        A new version of an interface is a new
                        [[item]], which names the one it replaces with
                        relation_supersedes.

                        The shape of interface control document data
                        items is defined by the
                        sch_interface_control_document schema.
    prefix:             icd
    regex_id:           ^icd_[a-z][a-z0-9_]*$
