  # ---------------------------------------------------------------------------
  # type_annotation -- Annotation type
  #
  type_annotation:
    id_self:            type_annotation
    guid_self:          type_2fa7434e745c4f9286e996a335b45e76
    title:              Annotation type
    brief:              |
                        Type of annotation data items.
    description:        |
                        Each annotation data item holds one assertion
                        about one or more [[items]] in the graph,
                        offered for consideration.
    usage:              |
                        Annotation data items let anyone record
                        something worth saying about an [[item]], such
                        as a worry, an opportunity or a reason to keep
                        a design as it is, in a form that can be
                        pointed at and answered.
    note:               |
                        Annotation data items travel on their own, one
                        per file: in the folder of their decision if
                        they are about one, and in _data/annotation/
                        if not.

                        Two assertions that could be answered
                        separately are two annotations.

                        The role of an annotation is carried by its
                        edges rather than by its fields: what it is
                        about, and what it supports or challenges. It
                        has no status, severity or category, and
                        nothing decides which of two annotations
                        prevails.

                        The shape of annotation data items is defined
                        by the sch_annotation schema.
    alias:              []
    prefix:             ann
    regex_id:           ^ann_[a-z][a-z0-9_]*$
    id_concept:         concept_annotation
    guid_concept:       concept_eef102576e4a485c8630d2c02b8f8898

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_annotation
        guid_target:    sch_c4f5b55fbffa4c3e83e9d04d1a42a5ce

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_argument
        guid_target:    rol_cb8f652e4be644959edfdd48c374ca55

      - id_relation:    relation_has_items_that_play
