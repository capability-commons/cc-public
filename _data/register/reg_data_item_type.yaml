    title:              Decision type
    brief:              |
                        Type of decision data items.
    description:        |
                        Each decision data item states one question
                        about the system, for which options are
                        offered.
    usage:              |
                        A decision gathers a deliberation in one
                        place: the options for it, the annotations
                        about it, and the rulings that settle it.
    note:               |
                        Each decision has a folder of its own,
                        _data/decision/ followed by its id, which
