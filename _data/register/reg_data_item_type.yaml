  # ---------------------------------------------------------------------------
  # type_release -- Release type
  #
  type_release:
    id_self:            type_release
    guid_self:          type_fc4e89ff3d3e42baa81f29f5bbc067e9
    title:              Release type
    brief:              |
                        Type of release data items.
    description:        |
                        Each release data item records one release of
                        the tree: its version, why it was made, and
                        the dependencies the release gate tested.
    usage:              |
                        Release data items let a partner that
                        installed a release read what it records with
                        the tools it already has, and let the release
                        tag be checked against the version module.
    note:               |
                        Release data items travel on their own, one
                        per file, in _data/release/. The id names the
                        federated segment released, by the id of its
                        segment data item without the segment prefix,
                        and then the version, with each dot written as
                        an underscore, so that release_cc_public_0_1_0
                        is release 0.1.0 of segment_cc_public. Every
                        federated segment numbers its own releases, so
                        the segment in the id keeps their release data
                        items apart. cctool release prepare writes
                        one, and the tag of the release names the
                        commit that adds it.

                        The shape of release data items is defined by
                        the sch_release schema.
    prefix:             release
    regex_id:           ^release_[a-z][a-z0-9_]*_(0|[1-9][0-9]*)_(0|[1-9][0-9]*)_(0|[1-9][0-9]*)$
    id_concept:         concept_release
    guid_concept:       concept_a471f9716b3c49778a797fd66921b517
    alias:              []

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_release
        guid_target:    sch_e2528cbf61a7479f9b4e8aae14b8d030

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_release
        guid_target:    rol_735205edba274ae2b2e50b928dce130c

  # ---------------------------------------------------------------------------
  # type_federated_segment -- Segment type
  #
  type_federated_segment:
    id_self:            type_federated_segment
    guid_self:          type_fb252f8b1e5946acb26f4dde2e3493bd
    title:              Federated segment type
    brief:              |
                        Type of segment data items.
    description:        |
                        Each segment data item declares the federated
                        segment that holds it, and names the release
                        of each federated segment it consumes.
    usage:              |
                        A segment data item lets the check find what
                        its tree consumes from the data alone, without
                        reading pixi or pyproject.toml, as ruled on
                        how a segment declares itself.
    note:               |
                        Each federated segment holds exactly one
                        segment data item, in
                        _data/federated_segment/. Its rights and
                        protective marks are the defaults of the
                        federated segment: cctool new gives them to
                        each new standalone data item.

                        The shape of segment data items is defined by
                        the sch_federated_segment schema.
    prefix:             segment
    regex_id:           ^segment_[a-z][a-z0-9_]*$
    id_concept:         concept_federated_segment
    guid_concept:       concept_a14ac366a4414b4697991d5136a370df

    alias:
      - type_segment

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_federated_segment
        guid_target:    sch_512e05a569f74c45979892b851d53f95

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_federated_segment
        guid_target:    rol_78f362fc44d6488296f6f6c5f44e781b
