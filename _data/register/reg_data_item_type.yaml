    guid_self:          t_0a72ca6efe7149a58f540c16e5557313
    title:              Requirement type
    brief:              |
                        Type of requirement data items.
    description:        |
                        Each requirement data item is one obligation
                        on a system or system element, its subject.
    usage:              |
                        A requirement is written as slots, and its
                        statement is composed from them wherever it is
                        shown.
    note:               |
                        Each requirement has a file of its own in
