  # ---------------------------------------------------------------------------
  # type_logic_program_predicate -- Logic program predicate type
  #
  type_logic_program_predicate:
    id_self:            type_logic_program_predicate
    guid_self:          type_dee490873cf44511b7af0aae3b8b1b32
    title:              Logic program predicate type
    brief:              |
                        Type of logic program predicate data items.
    description:        |
                        Each logic program predicate data item holds
                        the metadata of one predicate of a logic
                        program, in a comment before its declaration.
    usage:              |
                        Logic program predicate data items let one
                        predicate be traced, annotated and argued
                        over, rather than the whole file that holds
                        it. A design rule names the check that holds
                        it by an edge to its [[item]].
    note:               |
                        The id is the prefix, the name of the logic
                        program file and the name of the predicate, in
                        lower case and separated by full stops.
                        lpp_cctool.check.check.bad_id names the
                        predicate bad_id in src/cctool/check/check.lp.

                        The shape of logic program predicate data
                        items is defined by the
                        sch_logic_program_predicate schema.
    prefix:             lpp
    regex_id:           ^lpp_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
    id_concept:         concept_logic_program_predicate
    guid_concept:       concept_fe7a5d30313b4fbe8c9740d3d4397a96
    prefix_family:      logic_program
    alias:              []

