    title:              Relation restriction type
    brief:              |
                        Type of relation restriction data items.
    description:        |
                        Each relation restriction data item is one
                        condition on the items at an end of a
                        relation: an OR of roles admitted or excluded.
    usage:              |
                        Relations name restrictions on their source
                        and target, which the checker reads in place
                        of lists of types.
    note:               |
                        Relation restriction data items only ever
                        exist as entries in the relation restriction
                        register, never as data items that travel on
                        their own.

                        The shape of relation restriction data items
                        is defined by the
                        sch_regentry_relation_restriction schema.

                        The shape of the relation restriction register
                        is defined by the sch_reg_relation_restriction
                        schema.
