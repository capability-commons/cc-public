        guid_relation:  r_7eb3dc69d8ab45e79b18bec97de5ffa9
        id_target:      rol_implementation
        guid_target:    rol_991702df92e147e9915b344c4297f972

  # ---------------------------------------------------------------------------
  # t_commit -- Commit type
  #
  t_commit:
    id_self:            t_commit
    guid_self:          t_d84300d97a444b43b10d17b8fd1cf737
    title:              Commit type
    brief:              |
                        Type of commit data items.
    description:        |
                        Each commit data item records one commit, what
                        it changes and why.
    usage:              |
                        Commit data items let the history of the tree
                        be read, linked and checked like any other
                        item.
    note:               |
                        A commit data item is held in the message of
                        the git commit it records, after the subject
                        line and before any trailers. It is not held
                        in a file of the tree, because a commit cannot
                        contain its own record. The id is the time the
                        commit was made, in UTC, and the first six hex
                        digits of its guid, so that ids sort by time
                        and are minted without coordination. The shape
                        of commit data items is defined by the
                        sch_commit schema.
    alias:              []
    prefix:             cmt
    regex_id:           ^cmt_[0-9]{14}_[0-9a-f]{6}$
    id_concept:         con_commit
    guid_concept:       con_bc87eae04b9c42869a3bc825f560b94b

    relation:

      - id_relation:    r_has_items_specified_by_schema
        guid_relation:  r_c233cc9d78af4ec6bbaec8a4bbc43344
        id_target:      sch_commit
        guid_target:    sch_ac7d8ef35a67417ca48cb47a3a98cda9

  # ---------------------------------------------------------------------------
  # t_logical_component -- Logical component type
  #
  t_logical_component:
    id_self:            t_logical_component
    guid_self:          t_ab07e43975104844afe9eb099468c74e
    title:              Logical component type
    brief:              |
                        Type of logical component data items.
    description:        |
                        Each logical component data item names one
                        part of cc-public by what it does, apart from
                        any technology chosen for it.
    usage:              |
                        Logical component data items are the subjects
                        of decisions about how a part is built. The
                        items that implement a part realize it, so
                        that a decision keeps its subject when the
                        implementation is replaced.
    note:               |
                        Logical component data items travel on their
                        own, one per file, in
                        _data/logical_component/.

                        The shape of logical component data items is
                        defined by the sch_logical_component schema.
    prefix:             lc
    regex_id:           ^lc_[a-z][a-z0-9_]*$
    id_concept:         con_logical_component
    guid_concept:       con_5afcc0f1b1394c06a76562bcf103444e
    alias:              []

    relation:

      - id_relation:    r_has_items_specified_by_schema
        guid_relation:  r_c233cc9d78af4ec6bbaec8a4bbc43344
        id_target:      sch_logical_component
        guid_target:    sch_0f929ae944d14364aaf89735389eda7a

      - id_relation:    r_has_items_that_play
        guid_relation:  r_7eb3dc69d8ab45e79b18bec97de5ffa9
        id_target:      rol_design_element
        guid_target:    rol_c7e8771d55e4467bbcdd0f4c0d6d165b

  # ---------------------------------------------------------------------------
  # t_determination -- Determination type
  #
  t_determination:
    id_self:            t_determination
    guid_self:          t_98455ab5aded4a16b18756fe0f991d21
    title:              Determination type
    brief:              |
                        Type of determination data items.
    description:        |
                        Each determination data item records that one
                        or more decisions have been upheld or
                        rejected.
    usage:              |
                        A decision that no determination names is
                        open. A determination that upholds one
                        decision may reject its alternatives in the
                        same item.
    note:               |
                        Determination data items travel on their own,
                        one per file, in the folder of the issue whose
                        decisions they settle.

                        An issue has at most one determination. A
                        change of ruling edits it in place, and what
                        was determined before is in the history of its
                        file.

                        The shape of determination data items is
                        defined by the sch_determination schema.
    prefix:             det
    regex_id:           ^det_[a-z][a-z0-9_]*$
    id_concept:         con_determination
    guid_concept:       con_be674cf787004448ac2a890e84893d3a
    alias:              []

