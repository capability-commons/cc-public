        guid_relation:  r_016e74a0abea4a3990cc3259942baf92
        id_target:      reg_concern
        guid_target:    reg_f1772854ec5947c08f93f8ef2f766b0d

      - id_relation:    r_has_items_specified_by_schema
        guid_relation:  r_c233cc9d78af4ec6bbaec8a4bbc43344
        id_target:      sch_regentry_concern
