  # ---------------------------------------------------------------------------
  # type_python_module -- Python module type
  #
  type_python_module:
    id_self:            type_python_module
    guid_self:          type_1e3dea5b4e564fd6926dd52e2f10becc
    title:              Python module type
    brief:              |
                        Type of python module data items.
    description:        |
                        Each python module data item holds the
                        metadata of one python module, in the module
                        docstring.
    usage:              |
                        Python module data items let a module be
                        traced, annotated and argued over like any
                        other [[item]], without a second file to keep
                        in step with it.
    note:               |
                        The id is the prefix and the name the module
                        is imported under, with src as the root of the
                        import path, in lower case and with its parts
                        separated by full stops.
                        pym_cctool.check.check names
                        src/cctool/check/check.py.

                        The shape of python module data items is
                        defined by the sch_python_module schema.
    prefix_family:      python
    alias:              []
    prefix:             pym
    regex_id:           ^pym_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
    id_concept:         concept_python_module
    guid_concept:       concept_7ef83f4d029148d5a9e140905d7c710b

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_python_module
        guid_target:    sch_d1d9d093e52d47a9ba8b4fdd8c47db07

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_implementation
        guid_target:    rol_991702df92e147e9915b344c4297f972

  # ---------------------------------------------------------------------------
  # type_python_package -- Python package type
  #
  type_python_package:
    id_self:            type_python_package
    guid_self:          type_c2ef1aa327414aaf8f597f290bd231e6
    title:              Python package type
    brief:              |
                        Type of python package data items.
    description:        |
                        Each python package data item holds the
                        metadata of one python package, in the
                        docstring of its __init__ module.
    usage:              |
                        Python package data items let a package be
                        traced, annotated and argued over as a whole,
                        apart from the modules it holds.
    note:               |
                        The id is the prefix and the name the package
                        is imported under, with src as the root of the
                        import path, in lower case and with its parts
                        separated by full stops. pyp_cctool.check
                        names src/cctool/check. The __init__ module
                        holds the package [[item]] and has no python
                        module [[item]] of its own.

                        The shape of python package data items is
                        defined by the sch_python_package schema.
    prefix_family:      python
