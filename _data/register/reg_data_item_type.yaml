        guid_target:    sch_a4620d79fab546b3be6c756f0325e069

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_register
        guid_target:    rol_ca2f34ca1dc84113a3f63bc49c63337c

  # ---------------------------------------------------------------------------
  # type_relation -- Relation type
  #
  type_relation:
    id_self:            type_relation
    guid_self:          type_a718495bf70d4077964bc729faafb1b2
    title:              Relation type
    brief:              |
                        Type of relation data items.
    description:        |
                        Each relation data item defines a formal
                        meaning for a set of directed edges between
                        [[items]].
    usage:              |
                        Relation data items control how edges are
                        interpreted. Labeling edges with different
                        relation ids causes them to be treated
                        differently.
    note:               |
                        Relation data items only ever exist as entries
                        in the relation register, never as data items
                        that travel on their own.

                        Relations are directional. Where the opposite
                        reading is useful, the entry embeds an
                        inverse: a second identity and reading for the
                        same relation, and not a relation of its own.

                        The shape of relation data items is defined by
                        the sch_regentry_relation schema.

                        The shape of the relation register is defined
                        by the sch_reg_relation schema.

                        The prefix is the whole word relation, the
                        preferred term: rel would be one letter from
                        reg and from rol.
    alias:              []
    prefix:             relation
    regex_id:           ^relation_[a-z][a-z0-9_]*$
    id_concept:         concept_relation
    guid_concept:       concept_42a4bd80300849a98bf9649ad97d10d9

    edge:

      - id_relation:    relation_has_items_held_in_register
        guid_relation:  relation_e47ddfa559db431eab5e1051dd899440
        id_target:      reg_relation
        guid_target:    reg_512fbf5c51be4efaa4517b52310ddf80

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_regentry_relation
        guid_target:    sch_4efc46f1bf2c4f7a99b68763cd8d6432

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
