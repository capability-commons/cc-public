    title:              Relation constraint type
    brief:              |
                        Type of relation constraint data items.
    description:        |
                        Each relation constraint data item is one
                        condition on the [[items]] at an end of a
                        relation: an OR of roles admitted or excluded.
    usage:              |
                        Relations name constraints on their source and
                        target, which the checker reads in place of
                        lists of types.
    note:               |
