        id_target:      rol_design_entity
        guid_target:    rol_c7e8771d55e4467bbcdd0f4c0d6d165b

  # ---------------------------------------------------------------------------
  # type_ruling -- Ruling type
  #
  type_ruling:
    id_self:            type_ruling
    guid_self:          type_06f53f0057594863b10e210b8dd5ee80
    title:              Ruling type
    brief:              |
                        Type of ruling data items.
    description:        |
                        Each ruling data item records that one or more
                        options have been upheld or rejected.
    usage:              |
                        An option that no ruling names is open. A
                        ruling that upholds one option may reject its
                        alternatives in the same [[item]].
    note:               |
                        Ruling data items travel on their own, one per
                        file, in the folder of the decision whose
                        options they settle.

                        The prefix is the whole word ruling, because
                        rul would read as rule and differ by one
                        letter from rol, the prefix of roles.

                        A decision has at most one ruling. A change of
                        ruling edits it in place, and what was ruled
                        before is in the history of its file.

                        The shape of ruling data items is defined by
                        the sch_ruling schema.
    prefix:             ruling
    regex_id:           ^ruling_[a-z][a-z0-9_]*$
    id_concept:         concept_ruling
    guid_concept:       concept_73b3dbb310ae4337873e98e119c0dade

    alias:
      - type_determination

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_ruling
        guid_target:    sch_bc22fad5b8e54f2fa6a099f34cc7dc6c

      - id_relation:    relation_has_items_that_play
