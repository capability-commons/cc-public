  # ---------------------------------------------------------------------------
  # t_interface_member -- Interface member type
  #
  t_interface_member:
    id_self:            t_interface_member
    guid_self:          t_2b1f3c3df45342e6866dd03cab139b3f
    title:              Interface member type
    brief:              |
                        Type of interface member data items.
    description:        |
                        Each interface member data item is one
                        declaration within an interface control
                        document, embedded in it.
    usage:              |
                        An interface member can be named on its own:
                        code names the member it implements with
                        r_realizes, and a requirement may have one as
                        its subject.
    note:               |
                        The id is the id of what the member sits in,
                        then a full stop and a name of its own, with
                        the prefix icm in place of the prefix of the
                        document. The name is the member's own name in
                        lower case, or its local key.

                        The shape of interface member data items is
                        defined by the sch_interface_member schema.
    prefix:             icm
    regex_id:           ^icm_[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$
    id_concept:         con_interface_member
    guid_concept:       con_0f574750f53d446daa3eb49ce88513c8
    alias:              []

