    title:              Dataflow node type
    brief:              |
                        Type of dataflow node data items.
    description:        |
                        Each dataflow node data item is one dataflow
                        node of a dataflow graph, embedded in it.
    usage:              |
                        A dataflow node can be named on its own: a
                        dataflow edge has one at each end, and a rule
                        can find every dataflow node upstream or
                        downstream of it.
    note:               |
                        The id is the id of the dataflow graph with
                        the prefix dfn in place of dfg, then a full
                        stop and the key the dataflow node is filed
                        under.

                        The shape of dataflow node data items is
                        defined by the sch_dataflow_node schema.
    prefix:             dfn
    regex_id:           ^dfn_[a-z][a-z0-9_]*\.[a-z0-9_]+$
    id_concept:         concept_dataflow_node
