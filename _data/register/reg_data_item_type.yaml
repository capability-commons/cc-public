        guid_relation:  r_c233cc9d78af4ec6bbaec8a4bbc43344
        id_target:      sch_determination
        guid_target:    sch_bc22fad5b8e54f2fa6a099f34cc7dc6c

      - id_relation:    r_has_items_that_play
        guid_relation:  r_7eb3dc69d8ab45e79b18bec97de5ffa9
        id_target:      rol_determination
        guid_target:    rol_d29d91e4122247f0b0aaa44955219209

  # ---------------------------------------------------------------------------
  # t_issue -- Issue type
  #
  t_issue:
    id_self:            t_issue
    guid_self:          t_d0c9f13b64c94587827beb0537f18ba3
    title:              Issue type
    brief:              |
                        Type of issue data items.
    description:        |
                        Each issue data item states one question about
                        the system, which decisions answer.
    usage:              |
                        An issue gathers an argument in one place: the
                        decisions that answer it, the annotations
                        about it, and the determinations that settle
                        it.
    note:               |
                        Each issue has a folder of its own,
                        _data/issue/ followed by its id, which holds
                        the issue and every decision, annotation and
                        determination that belongs to it.

                        The shape of issue data items is defined by
                        the sch_issue schema.
