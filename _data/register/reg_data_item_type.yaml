                        as entries in the writing style rule register,
                        never as data items that travel on their own.

                        The shape of writing style rule data items is
                        defined by the sch_regentry_writing_style_rule
                        schema.

                        The shape of the writing style rule register
                        is defined by the sch_reg_writing_style_rule
                        schema.
    alias:              []
    prefix:             style
    regex_id:           ^style_[a-z][a-z0-9_]*$
    id_concept:         concept_writing_style_rule
