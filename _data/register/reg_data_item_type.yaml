    title:              Python class type
    brief:              |
                        Type of python class data items.
    description:        |
                        Each python class data item holds the metadata
                        of one python class, in the docstring of the
                        class.
    usage:              |
                        Python class data items let one class be
                        traced, annotated and argued over, rather than
                        the whole module that holds it. A class is
                        given an [[item]] only when something needs to
                        point at it.
    note:               |
                        The id is the prefix, the name of the module,
                        and the names of the classes down to it, in
                        lower case and separated by full stops.

                        The shape of python class data items is
                        defined by the sch_python_class schema.
    prefix:             pycls
    regex_id:           ^pycls_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
    id_concept:         concept_python_class
    guid_concept:       concept_c97a730397514643a1b48c4db6fd2c0d
    prefix_family:      python
    prefix_exception:   pyc would read as the extension of compiled python files, so the python family takes cls, the usual python abbreviation of class, after py.
