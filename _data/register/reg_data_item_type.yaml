  # ---------------------------------------------------------------------------
  # type_logic_program_file -- Logic program file type
  #
  type_logic_program_file:
    id_self:            type_logic_program_file
    guid_self:          type_c7b4bae0bf9749bca1e7baa50bac28be
    title:              Logic program file type
    brief:              |
                        Type of logic program file data items.
    description:        |
                        Each logic program file data item holds the
                        metadata of one logic program file, in a
                        comment at the head of the file.
    usage:              |
                        Logic program file data items let a file of
                        rules be traced, annotated and argued over
                        like any other [[item]], without a second file
                        to keep in step with it.
    note:               |
                        The id is the prefix and the dotted name the
                        file would be imported under if it were a
                        python module, in lower case.
                        lpf_cctool.check.check names
                        src/cctool/check/check.lp. Each line of the
                        comment begins with %.

                        The shape of logic program file data items is
                        defined by the sch_logic_program_file schema.
    prefix_family:      logic_program

    alias:
      - type_datalog_source_file

    prefix:             lpf
    regex_id:           ^lpf_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
