  # ---------------------------------------------------------------------------
  # t_role -- Role type
  #
  t_role:
    id_self:            t_role
    guid_self:          t_99f099a845a6485bb0f25512f8be4e93
    title:              Role type
    brief:              |
                        Type of role data items.
    description:        |
                        Each role data item names one thing items can
                        be cast as in relations, such as an argument
                        or a design element.
    usage:              |
                        Types play roles, and relation restrictions
                        admit or exclude them, so that a relation can
                        say what it needs at each end without naming
                        any type.
    note:               |
                        Role data items only ever exist as entries in
                        the role register, never as data items that
                        travel on their own.

                        The shape of role data items is defined by the
                        sch_regentry_role schema.

                        The shape of the role register is defined by
                        the sch_reg_role schema.
    prefix:             rol
