  type_writing_style_rule:
    id_self:            type_writing_style_rule
    guid_self:          type_4d4372962f194195a3ba21ae35fc5e9e
    title:              Writing style rule type
    brief:              |
                        Type of writing style rule data items.
    description:        |
                        Each writing style rule data item states one
                        rule that prose in the repository follows,
                        with a sentence that follows it and a sentence
                        that breaks it.
    usage:              |
                        Writing style rule data items guide whoever
                        writes prose in the repository, a person or a
                        model.
    note:               |
