        guid_target:    rol_3d3ddc21cfb244168bfbf8080a466196

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_option
        guid_target:    rol_ce75f8f10f8c432386adf334d921a91f

  # ---------------------------------------------------------------------------
  # type_concern -- Concern type
  #
  type_concern:
    id_self:            type_concern
    guid_self:          type_deeeb07ebb1148d0a1467b80300e4d03
    title:              Concern type
    brief:              |
                        Type of concern data items.
    description:        |
                        Each concern data item names one matter of
                        interest in a system, such as security,
                        reliability or safety, that an argument about
                        a design may speak for.
    usage:              |
                        Concern data items let the arguments for and
                        against an option be read concern by concern.
    note:               |
                        Concern data items only ever exist as entries
                        in the concern register, never as data items
                        that travel on their own.

                        The prefix is the whole word concern, the
                        preferred term of its concept.

                        The shape of concern data items is defined by
                        the sch_regentry_concern schema.

                        The shape of the concern register is defined
                        by the sch_reg_concern schema.
    alias:              []
    prefix:             concern
    regex_id:           ^concern_[a-z][a-z0-9_]*$
    id_concept:         concept_concern
    guid_concept:       concept_a1eb797dc146461aaafc47ce31058f48

