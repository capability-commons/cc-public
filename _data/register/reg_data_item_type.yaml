  # ---------------------------------------------------------------------------
  # type_option -- Option type
  #
  type_option:
    id_self:            type_option
    guid_self:          type_b49e3aeacf3848f5965e9450b360e949
    title:              Option type
    brief:              |
                        Type of option data items.
    description:        |
                        Each option data item records one candidate
                        answer to a decision.
    usage:              |
                        Option data items are what annotations argue
                        over. The annotations that support or
                        challenge an option, and the concerns they
                        speak for, are its rationale, so that an
                        option that proves wrong can be traced back to
                        the concerns that shaped it.
    note:               |
                        Option data items travel on their own, one per
                        file, in the folder of their decision.

                        Alternatives are options for the same
                        decision, each argued over on its own, and
                        each is kept whatever becomes of it.

                        The shape of option data items is defined by
                        the sch_option schema.
    alias:              []
    prefix:             opt
    regex_id:           ^opt_[a-z][a-z0-9_]*$
    id_concept:         concept_option
    guid_concept:       concept_f3a14213b8844a60a9c6571f699eba6e

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_option
        guid_target:    sch_6fd91c76629042f394ce1addf6f0cd1b

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_can_be_target_of_an_argument
        guid_target:    rol_beff92eeb8034e22b77f3e681744275e

