  #
  t_python_function:
    id_self:            t_python_function
    guid_self:          t_b2603ebd90854998b9aaa271770a071b
    title:              Python function type
    brief:              |
                        Type of python function data items.
    description:        |
                        Each python function data item holds the
                        metadata of one python function or method, in
                        the docstring of the function.
    usage:              |
                        Python function data items let one function be
                        traced, annotated and argued over, rather than
                        the whole module that holds it. A function is
                        given an item only when something needs to
                        point at it.
    note:               |
                        The id is the prefix, the name of the module,
                        the names of any classes it sits in, and its
                        own name, in lower case and separated by full
                        stops. pyf_cc_public.check.check.check names
                        the function check in
                        src/cc_public/check/check.py.

                        The shape of python function data items is
                        defined by the sch_python_function schema.
    prefix:             pyf
    regex_id:           ^pyf_[a-z][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$
    id_concept:         con_python_function
    guid_concept:       con_879798b806c44c3baa25c1e372b90e20
    alias:              []

