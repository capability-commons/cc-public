  # ---------------------------------------------------------------------------
  # type_dataflow_graph -- Dataflow graph type
  #
  type_dataflow_graph:
    id_self:            type_dataflow_graph
    guid_self:          type_8c61f2c5e718498f917fc8dde96f6f52
    title:              Dataflow graph type
    brief:              |
                        Type of dataflow graph data items.
    description:        |
                        Each dataflow graph data item describes one
                        system of interest as a dataflow graph that
                        can be run: its dataflow nodes, the dataflow
                        edges between their ports, and where each
                        dataflow node runs.
    usage:              |
                        A dataflow graph puts the model of a system in
                        the graph of [[items]], so that rules can
                        follow data from dataflow node to dataflow
                        node, and a decision or an argument can be
                        about one arrangement of a model.
    note:               |
                        The shape of dataflow graph data items is
