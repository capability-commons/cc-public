  # ---------------------------------------------------------------------------
  # type_file -- File type
  #
  type_file:
    id_self:            type_file
    guid_self:          type_4aff76e000e945aa992f7bde1f9f1219
    title:              File type
    brief:              |
                        Type of file data items.
    description:        |
                        Each file data item holds the metadata of one
                        file whose format has no other place for it,
                        such as .gitignore or pyproject.toml, in a
                        comment at the head of the file.
    usage:              |
                        File data items let such files be traced and
                        owned like any other [[item]].
    note:               |
                        The type is not limited to configuration
                        files: other kinds of file may need it later.

                        Source code has types of its own. The [[item]]
                        of a python module is held in its docstring
                        and has the type type_python_module, the
                        [[item]] of a logic program file has the type
                        type_logic_program_file, and the [[item]] of a
                        shell script has the type type_shell_script.

                        The prefix is file, the preferred term.

                        The shape of file data items is defined by the
                        sch_file schema.

    alias:
      - type_configuration_file

    prefix:             file
    regex_id:           ^file_[a-z][a-z0-9_]*$
    id_concept:         concept_file
    guid_concept:       concept_9f57459dd8d14048b8bcebfe0ca9259b

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_file
        guid_target:    sch_416542a4956343bfa02a827fcdae43a9

      - id_relation:    relation_has_items_that_play
        guid_relation:  relation_3d73697611024b13ae6633e0e7727983
        id_target:      rol_implementation
        guid_target:    rol_991702df92e147e9915b344c4297f972

  # ---------------------------------------------------------------------------
  # type_commit -- Commit type
  #
  type_commit:
    id_self:            type_commit
    guid_self:          type_2427ffd2d33c44dc83044fc35b1b0e8b
    title:              Commit type
    brief:              |
                        Type of commit data items.
    description:        |
                        Each commit data item records one commit, what
                        it changes and why.
    usage:              |
                        Commit data items let the history of the tree
                        be read, linked and checked like any other
                        [[item]].
    note:               |
                        A commit data item is held in the message of
                        the git commit it records, after the subject
                        line and before any trailers. It is not held
                        in a file of the tree, because a commit cannot
                        contain its own record. The id is the time the
                        commit was made, in UTC, and the first six hex
                        digits of its guid, so that ids sort by time
                        and are minted without coordination. The shape
                        of commit data items is defined by the
                        sch_commit schema.
    alias:              []
    prefix:             cmt
    regex_id:           ^cmt_[0-9]{14}_[0-9a-f]{6}$
    id_concept:         concept_commit
    guid_concept:       concept_b2fa5ffe5feb4cc1854fb950afbd3793

    edge:

      - id_relation:    relation_has_items_specified_by_schema
        guid_relation:  relation_9aeeadc7fb3b4257b0c588d24a203b64
        id_target:      sch_commit
        guid_target:    sch_ac7d8ef35a67417ca48cb47a3a98cda9

