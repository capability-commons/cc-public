    title:              Shell script type
    brief:              |
                        Type of shell script [[items]].
    description:        |
                        Each shell script [[item]] holds the metadata
                        of one shell script, in a comment at the head
                        of the script.
    usage:              |
                        Shell script [[items]] let the git hooks and
                        other scripts be traced and owned like any
