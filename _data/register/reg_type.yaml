table:

  # ---------------------------------------------------------------------------
  # t_type -- Type type
  #
  t_type:
    id_self:            t_type
    guid_self:          t_2a196326eaf84759b37d43d5b1f0b118
    title:              Type type
    brief:              |
                        Type of type data items.
    description:        |
                        Each type data item describes one type of
                        thing that can be held and processed by the
                        system.
    usage:              |
                        Type data items hold type-specific metadata,
                        such as the schemas that validate data items
                        of that type.
    note:               |
                        Every entry in this register is itself a type
                        data item. Most types are data-item types, but
                        other specialised types can also exist.
    status:             proposed
    alias:              []
    prefix:             t
    regex_id:           ^t_[a-z][a-z0-9_]*$
    id_term:            term_type
    guid_term:          term_0d0e04ed926841818a9ef3a06243a4fa

    relation:

