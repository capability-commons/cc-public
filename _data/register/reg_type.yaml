        guid_target:    sch_4a17e1ea6a1143c59c0a634b38f902bc

  # ---------------------------------------------------------------------------
  # t_schema -- Schema type
  #
  t_schema:
    id_self:            t_schema
    guid_self:          t_a4fb6d3ae5ff4452a45804e2f57b06a2
    title:              Schema type
    brief:              |
                        Type of schema data items.
    description:        |
                        Each schema data item defines the structure of
                        a data-item type, either in part or in whole.
    usage:              |
                        A schema data item validates the structure of
                        the data items its type covers.
    note:               |
                        A number of trait schemas exist to hold common
                        elements, such as data primitives. There is
                        therefore no simple one-to-one relationship
                        between data-item types and schemas.
                        Nevertheless most data-item types are expected
                        to have at least one corresponding schema, and
                        most schema data items are expected to
                        validate at most one data-item type.

                        The schema for a data-item type can be
                        inferred either from the schema file name or
                        by looking it up in the type register, which
                        is this document.
    status:             proposed
    alias:              []
    prefix:             sch
    regex_id:           ^sch_[a-z][a-z0-9_]*$
    id_term:            term_schema
    guid_term:          term_3ce8de2f2d6f422fb6b31309884e798d

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
        id_target:      sch_schema
        guid_target:    sch_19b746511dc84ae1b822a98afa81a196

  # ---------------------------------------------------------------------------
  # t_register -- Register type
  #
  t_register:
    id_self:            t_register
    guid_self:          t_dcd4c5f697c945829094914ff868a43b
    title:              Register type
    brief:              |
                        Type of register data items.
    description:        |
                        Each register data item provides a controlled
                        list of register-entry data items.
    usage:              |
                        Register data items are used wherever an
                        automated process needs a controlled set of
                        identifiers.
    note:               |
                        This document as a whole is a register data
                        item. It provides a controlled set of data-
                        item types, and a means of looking up the
                        metadata associated with each type.
    status:             proposed
    alias:              []
    prefix:             reg
    regex_id:           ^reg_[a-z][a-z0-9_]*$
    id_term:            term_register
    guid_term:          term_374dca1dc078449f89c61caae71611e1

    relation:

      - id_relation:    r_is_specified_by_schema
        guid_relation:  r_d70024bd40444f93b4fc1903379ded81
