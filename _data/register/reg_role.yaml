title:                  Role register
brief:                  |
                        Register of the roles that items can play in
                        relations.
description:            |
                        The role register holds one entry per role. A
                        type says which roles its items play with
                        r_has_items_that_play edges on its entry in
                        the data item type register.
usage:                  |
                        A relation restriction admits or excludes
                        roles, so that a relation can say what it
                        needs at each end without naming any type.
note:                   |
                        A partner in the federation gives its own
                        types roles from this register, which it
                        consumes, or from a register of its own. A
                        role is added here when a relation first needs
                        it.

