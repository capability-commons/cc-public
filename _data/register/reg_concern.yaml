title:                  Concern register
brief:                  |
                        Register of the engineering concerns that
                        arguments about a design speak for.
description:            |
                        The concern register holds one entry per
                        concern, such as security, reliability or
                        safety. A concern is a matter of interest in a
                        system, in the sense of ISO/IEC/IEEE 42010.
usage:                  |
                        An annotation that argues for or against a
                        design names the concern it speaks for with an
                        r_speaks_for_concern edge. The arguments for
                        and against an option can then be read concern
                        by concern, and an option that proves wrong
                        can be traced to the concerns that were given
                        too much or too little weight.
note:                   |
                        A concern is what an argument speaks for, not
                        who made the argument. Several agents may
                        speak for one concern, and one agent may speak
                        for several.

                        A concern is added here when an argument first
                        needs it.

