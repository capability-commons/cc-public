status:                 draft
title:                  Concern register
brief:                  |
                        Register of the engineering concerns that
                        arguments about a design speak for.
description:            |
                        The concern register holds one entry per
                        concern, such as correctness, security or
                        usability. A concern is a matter of interest
                        in a system, in the sense of ISO/IEC/IEEE
                        42010.
usage:                  |
                        An annotation that argues for or against a
                        design names the concern it speaks for with an
                        r_argues_for_concern edge. The argument behind
                        a decision can then be read concern by
                        concern, and a decision that proves wrong can
                        be traced to the concerns that were given too
                        much or too little weight.
note:                   |
                        A concern is what an argument speaks for, not
                        who made the argument. Several agents may
                        argue for one concern, and one agent may argue
                        for several.

                        A concern is added here when an argument first
                        needs it.

