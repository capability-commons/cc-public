protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Relation constraint register
brief:                  |
                        Register of the conditions that relations
                        place on the items at their ends.
description:            |
                        The relation constraint register holds one
                        entry per condition. Each is an OR of roles
                        admitted or excluded. A relation names the
                        constraints on its source and its target with
                        relation_constrains_source and
                        relation_constrains_target edges.
usage:                  |
                        One constraint serves every relation that
                        needs the same condition, so the conditions
                        are written once and read the same way
                        everywhere.
note:                   |
                        A constraint names roles, never types. A
                        constraint is added here when a relation first
                        needs it.

