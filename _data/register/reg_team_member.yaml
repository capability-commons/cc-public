title:                  Team member register
brief:                  |
                        Register of the people who contribute to the
                        project.
description:            |
                        The team member register holds one entry per
                        team member. A commit names the member who
                        supplied its content in a Contributor trailer,
                        by the guid of their entry, and the check of
                        the commit message fails a guid that this
                        register does not hold.
usage:                  |
                        cctool message check reads the register of the
                        tree it checks, so a Contributor trailer
                        resolves only where its member is held.
note:                   |
                        Every entry here is public. A member who
                        should not be named in public is held in the
                        team member register of a private repository
                        instead.

