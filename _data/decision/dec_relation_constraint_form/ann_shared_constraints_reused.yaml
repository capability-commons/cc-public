title:                  Constraints reused across relations
brief:                  |
                        A constraint in a shared register is written
                        once and named by every relation that needs
                        it. A list in each relation entry repeats it.
description:            |
                        relcon_is_argument constrains the source of
                        relation_supports, relation_challenges and
                        relation_speaks_for_concern;
                        relcon_is_requirement constrains the source of
                        relation_has_subject, relation_has_actor and
                        relation_has_process (reg_relation).

