title:                  CNF that is harder to read
brief:                  |
                        A conjunction of ORs with negation is harder
                        for a reviewer to read than one list of types.
                        Two excludes in one constraint pass anything
                        that does not play both roles.
description:            |
                        The note on relation_excludes warns of it.
                        William Payne accepted the cost because the
                        content will be written almost entirely by
                        language models and read by people, and the
                        review pages may show it in whatever form
                        reads best (2026-10-18).

