title:                  Which answer of one decision constrains another
brief:                  |
                        Arguments today rest on a particular option of
                        another decision, not on the decision as a
                        whole. An edge between options says which
                        answer forces what, so a check can catch two
                        rulings that cannot both hold and a change of
                        ruling can be traced to what it disturbs. A
                        ruling that records what it made follow says
                        the same in its own words, which traces a
                        change of ruling but gives a check nothing to
                        read. An edge between decisions says only that
                        one bears on the other.
description:            |
                        Sources: annotations already cite a single
                        option of another decision as a premise, for
                        example the versioned package and the
                        git-tags-only publishing route
                        (_data/decision/dec_home_of_the_engine_code/ann_tooling_only_peers_inherit_cpp_build.yaml
                        at description). A ruling is edited in place,
                        so the upheld option can change without a new
                        item
                        (_data/decision/dec_change_of_a_ruling/ruling_change_of_a_ruling.yaml
                        at title and brief). The decision edge records
                        only that one decision constrains another,
                        whatever either is ruled
                        (_data/decision/dec_dependence_between_decisions/opt_decision_constrains_decision.yaml
                        at brief). Under the option edges, a ruling
                        that upholds an option leaves the options it
                        excludes unable to be upheld, which a check
                        can enforce
                        (opt_option_requires_or_excludes_option.yaml
                        at brief, same folder). The ruling option
                        records what that ruling has made follow
                        (opt_ruling_constrains_decision.yaml at brief,
                        same folder), and does not say in what form,
                        so a check on it is not assumed (inference).
                        No existing check compares rulings of
                        different decisions
                        (src/cctool/check/check.lp). Functional
                        suitability asks whether the design does
                        anything it should not
                        (_data/register/reg_concern.yaml at
                        entries.concern_functional_suitability.question),
                        and two upheld options that exclude each other
                        are such a result; traceability asks for
                        tracing in both directions (lines 552-572).
                        Strength: moderate; the precision is real, but
                        incomplete option edges weaken it, and for the
                        ruling option it rests on prose.

