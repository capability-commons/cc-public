title:                  False assurance from incomplete option edges
brief:                  |
                        A check on option edges enforces only the
                        edges that were written, so a missing edge
                        passes in silence, and much of the bearing
                        between decisions is on their arguments or on
                        a detail inside a ruling rather than a clean
                        exclusion of options. An incomplete set gives
                        assurance the record does not earn, which is
                        worse than no check.
description:            |
                        Sources: the option edges enforce exclusion
                        only where an edge exists (inference from
                        _data/decision/dec_dependence_between_decisions/opt_option_requires_or_excludes_option.yaml
                        at brief). In the owner's example the contact
                        with the release gate is a clause inside its
                        ruling, "The fresh install resolves the
                        declared ranges rather than the lock,
                        tentatively"
                        (_data/decision/dec_release_gate/ruling_release_gate.yaml
                        at brief), against the option that consumers
                        are end users, under which the gate tests the
                        exact environment a release ships with
                        (_data/decision/dec_who_consumes_a_release/opt_consumers_are_end_users.yaml
                        at brief). Neither option of the release gate
                        is excluded by an option of the consumer
                        decision; the bearing is on a detail of the
                        upheld option, which no edge between options
                        can carry (inference). Functional suitability
                        asks whether the design does anything it
                        should not (_data/register/reg_concern.yaml at
                        entries.concern_functional_suitability.question).
                        Assumption: in the owner's example the bearing
                        is mostly on the arguments, not a clean
                        exclusion of options. Strength: moderate now
                        and stronger at ten times the decisions, when
                        more option pairs make a complete set less
                        likely.

