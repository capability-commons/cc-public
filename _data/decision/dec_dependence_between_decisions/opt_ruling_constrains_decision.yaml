title:                  Edge from ruling to decision
brief:                  |
                        A ruling names each open decision whose
                        options it narrows, so an edge appears only
                        once a decision is settled, and records what
                        that ruling has made follow. Open decisions
                        that depend on each other are not linked until
                        one is ruled.

