title:                  Edges between options
brief:                  |
                        An option names each option of another
                        decision that it requires or excludes.
                        Dependence between decisions is computed from
                        these edges, and a ruling that upholds an
                        option leaves the options it excludes unable
                        to be upheld, which a check can enforce.

