title:                  Machinery an edge between decisions reuses
brief:                  |
                        An edge between decisions adds one relation
                        and reuses the existing acyclic flag, chain
                        computation and cycle check, plus one sort
                        key, about a person day of work. Edges between
                        options need two relations, a new check across
                        decisions and a derivation of decision
                        dependence, about two to three person days and
                        some four mechanisms. Prose adds no mechanism
                        and costs nothing to build.
description:            |
                        Sources: the simplicity measures are distinct
                        mechanisms introduced and jobs done by more
                        than one mechanism
                        (_data/register/reg_concern.yaml at
                        entries.concern_simplicity.measure); the cost
                        measure is development effort in person days
                        (line 616). A relation is made acyclic by one
                        field, already set on six relations
                        (_data/register/reg_relation.yaml at entries),
                        and one generic rule computes chains and finds
                        cycles in any acyclic relation
                        (src/cctool/check/check.lp within reaches and
                        cycle). The constraint that an end is a
                        decision already exists (relcon_is_decision,
                        _data/register/reg_relation_constraint.yaml at
                        entries.relcon_is_decision). The decisions
                        page has a sort table to extend
                        (src/cctool/web/page.py). Every existing
                        ruling check works within one decision
                        (src/cctool/check/check.lp), so the option
                        check is new logic. The option of edges
                        between options names required and excluded
                        options and a check that enforces exclusion
                        (_data/decision/dec_dependence_between_decisions/opt_option_requires_or_excludes_option.yaml
                        at brief). The prose option adds no new
                        relation
                        (_data/decision/dec_dependence_between_decisions/opt_dependence_in_prose.yaml
                        at brief). A code commit costs about 78 s of
                        gate time and a data-only commit about 10 s
                        (context note, _sources/context.md line 31);
                        every option but prose needs a code change.
                        Assumption: the person-day figures are
                        estimates from the size of comparable rules
                        and page code, not measured. Strength: strong
                        at any size; mechanism counts and build cost
                        do not grow with the number of decisions.

