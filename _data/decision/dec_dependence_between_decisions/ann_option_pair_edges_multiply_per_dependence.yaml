title:                  Edges per dependence between option pairs
brief:                  |
                        One dependence between two decisions becomes
                        as many edges as there are pairs of options
                        that interact, each to be written, read and
                        judged, against one edge between the
                        decisions. An excludes edge enforced by a
                        check blocks rulings, so each one needs
                        judging as carefully as a ruling.
description:            |
                        Sources: there are 355 options across 133
                        decisions, about 2.7 per decision (counted on
                        the snapshot), so a fully described pair of
                        dependent decisions has up to about 7 option
                        pairs to judge (arithmetic). The decision on
                        who consumes a release has three options and
                        the release gate two (folder listings), so the
                        owner's example alone could need up to six
                        option edges against one decision edge. An
                        edge is four lines of YAML and a blank line
                        (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml
                        at edge). Under the option edges, an excluded
                        option cannot be upheld, which a check
                        enforces
                        (_data/decision/dec_dependence_between_decisions/opt_option_requires_or_excludes_option.yaml
                        at brief). Reviewability measures the size of
                        a change in lines and changes awaiting review
                        (_data/register/reg_concern.yaml at
                        entries.concern_reviewability.measure); cost
                        asks how cost grows with use (line 613).
                        Strength: holds and worsens at ten times the
                        decisions; edges per dependence grow with the
                        product of option counts and dependent pairs
                        grow faster than decisions (assumption).

