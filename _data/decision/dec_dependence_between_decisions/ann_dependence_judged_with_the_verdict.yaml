title:                  Dependence judged in the change that settles it
brief:                  |
                        When the edge is part of a ruling, the owner
                        judges its consequences in the same small
                        change as the verdict, in one file he already
                        reads. It does not give the review order of
                        open decisions any input.
description:            |
                        Sources: a decision has one ruling, edited in
                        place, and the history of the ruling is the
                        history of its file (src/cctool/check/check.lp
                        lines 1449-1475). A ruling records the owner's
                        verdict, with his words quoted in the brief
                        (_data/decision/dec_release_gate/ruling_release_gate.yaml
                        lines 19-27). Assumption: the owner reads each
                        ruling as it is made. Reviewability asks
                        whether a person can read a change in full and
                        judge it (_data/register/reg_concern.yaml
                        lines 523-529). Strength: holds for the
                        reading of one ruling at any size.

