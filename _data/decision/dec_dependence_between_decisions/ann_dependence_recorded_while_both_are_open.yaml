title:                  Dependence recorded while both decisions are open
brief:                  |
                        The decision exists so that the decisions many
                        others depend on can be found and ruled first,
                        which needs the dependence on record while
                        both decisions are open. An edge between
                        decisions or between their options can be
                        written at once; an edge held by a ruling
                        appears only when the keystone is ruled, after
                        the decisions it constrains may already have
                        been settled, argued or reviewed, and the
                        owner's own example is that case.
description:            |
                        Sources: the decision asks how the graph
                        should record dependence "so that the
                        decisions many others depend on can be found
                        and ruled first"
                        (_data/decision/dec_dependence_between_decisions/dec_dependence_between_decisions.yaml
                        at brief). Under the ruling option, a ruling
                        names each open decision whose options it
                        narrows, and open decisions that depend on
                        each other are not linked until one is ruled
                        (_data/decision/dec_dependence_between_decisions/opt_ruling_constrains_decision.yaml
                        at brief). The owner's example of 2026-10-24:
                        the decision on who consumes a release bears
                        on the release gate, the publishing route and
                        the declared public API (owner's statement,
                        2026-10-24, background of the advocate brief).
                        That decision has no ruling
                        (_data/decision/dec_who_consumes_a_release/
                        holds the decision and three options only),
                        while the release gate was ruled on 2026-10-24
                        (_data/decision/dec_release_gate/ruling_release_gate.yaml
                        at brief), so under the ruling option a
                        constraint on a settled decision is traced
                        nowhere until the open one is ruled. 18 of 133
                        decisions are open (133 decision folders, 115
                        ruling files, counted on the snapshot; one
                        ruling per decision, src/cctool/check/check.lp
                        within competing_rulings). The decisions page
                        sorts only by component, standing, amount of
                        argument and title (src/cctool/web/page.py),
                        so nothing ranks open decisions by dependence
                        today. The reviewability concern measures
                        changes awaiting review
                        (_data/register/reg_concern.yaml at
                        entries.concern_reviewability.measure); the
                        cost concern asks how cost grows with use
                        (line 613). Assumption: rework of arguments
                        and reviews done on a dependent decision
                        before its keystone is ruled costs more than
                        writing an edge early. Strength: strong, and
                        stronger at ten times the decisions, when
                        about 180 would be open at today's ratio
                        (assumption) and all dependence among them
                        stays invisible under the ruling option.

