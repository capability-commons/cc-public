title:                  Second job for a ruling
brief:                  |
                        A ruling today settles the options of one
                        decision and records only the verdict. A
                        ruling that also names other decisions and
                        records what follows for them gives one item
                        type two jobs, and puts consequences for other
                        decisions into an item that the owner and the
                        checks treat as a verdict.
description:            |
                        Sources: a ruling settles the options of one
                        decision, enforced by the check on decisions
                        mixed in a ruling (src/cctool/check/check.lp
                        lines 1207-1228); upholds and rejects target
                        options (_data/register/reg_relation.yaml
                        lines 412-468). "A ruling records only the
                        verdict and is edited in place"
                        (_data/decision/dec_what_gathers_an_argument/ruling_what_gathers_an_argument.yaml
                        lines 19-20). Under the ruling option a ruling
                        names each open decision whose options it
                        narrows and records what that ruling has made
                        follow
                        (_data/decision/dec_dependence_between_decisions/opt_ruling_constrains_decision.yaml
                        lines 13-16). Simplicity counts jobs done by
                        more than one mechanism
                        (_data/register/reg_concern.yaml line 490);
                        traceability asks whether each element can be
                        traced to the reason it exists (lines
                        569-572). Strength: strong at any size; it is
                        a matter of design, not volume.

