title:                  Stability of edges held at the decision level
brief:                  |
                        Decisions are stable items, while options are
                        added, superseded and rejected and rulings are
                        edited in place. An edge held between
                        decisions survives that churn; edges between
                        options must be moved at each supersession,
                        and edges held by a ruling change whenever the
                        ruling does, mixing two facts in one file
                        history.
description:            |
                        Sources: an option may be superseded by
                        another and no longer governs
                        (_data/register/reg_relation.yaml at
                        entries.relation_supersedes), so each option
                        edge that named it must be moved or left
                        pointing at an option that no longer governs.
                        A change of ruling edits the ruling in place
                        (_data/decision/dec_change_of_a_ruling/ruling_change_of_a_ruling.yaml
                        at title and brief; competing rulings,
                        src/cctool/check/check.lp within
                        competing_rulings). Options point at the
                        decision, not the reverse, so a decision does
                        not change when its options do (inference from
                        the is option for relation,
                        _data/register/reg_relation.yaml at
                        entries.relation_is_option_for). Simplicity
                        asks whether the design follows from decisions
                        already made (_data/register/reg_concern.yaml
                        at entries.concern_simplicity.question); cost
                        asks how cost grows with use (line 613).
                        Strength: strong, and stronger at ten times
                        the decisions, since supersessions and ruling
                        edits grow with the number of decisions while
                        a decision-level edge needs no update from
                        them.

