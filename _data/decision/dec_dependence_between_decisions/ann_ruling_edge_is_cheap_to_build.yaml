title:                  Build effort of an edge held by a ruling
brief:                  |
                        An edge from a ruling to a decision needs one
                        register entry, a rule that carries each edge
                        over to the ruling's own decision so chains
                        can be followed, a ranking and a sort key,
                        roughly the person day of an edge between
                        decisions, and no check across the rulings of
                        two decisions.
description:            |
                        Sources: the cost measure is development
                        effort in person days
                        (_data/register/reg_concern.yaml at
                        entries.concern_cost.measure). The chain
                        computation and cycle check exist for any
                        relation flagged acyclic
                        (src/cctool/check/check.lp within reaches and
                        cycle), and the decisions page has a sort
                        table to extend (src/cctool/web/page.py). The
                        ruling option asks only that a ruling name
                        each open decision it narrows
                        (_data/decision/dec_dependence_between_decisions/opt_ruling_constrains_decision.yaml
                        at brief). The chain rule follows edges of one
                        relation from item to item (check.lp within
                        reaches), and an edge from a ruling ends at a
                        decision, not a ruling, so a step from each
                        ruling to its decision is needed before chains
                        form (inference). Assumption: the person-day
                        figure is an estimate, not measured. Strength:
                        holds at any size, since build cost is
                        one-off; it says nothing about the cost of
                        edges that arrive late.

