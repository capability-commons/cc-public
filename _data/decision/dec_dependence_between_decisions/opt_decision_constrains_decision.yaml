title:                  Edge from decision to decision
brief:                  |
                        A new relation from a decision to each
                        decision it constrains, checked to be free of
                        cycles. The decisions with the most
                        dependents, directly and through others, are
                        computed from the edges, and the review pages
                        rank open decisions by them.

