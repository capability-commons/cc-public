title:                  Standard terms fixed to one concept each
brief:                  |
                        A term taken from a cited standard comes with
                        the definition the standard gives it, so it
                        designates one concept that cc-public does not
                        redefine. A term of our own design is fixed
                        only by our own prose, which can drift as
                        later work bends it.
description:            |
                        Concept entries follow ISO 1087:2019
                        (term_preferred, term_admitted,
                        term_deprecated), and the 25010 concerns take
                        the standard names. Written 2026-10-22 so that
                        terminological quality, a driver of
                        lco_vocabulary, is argued before the ruling.

