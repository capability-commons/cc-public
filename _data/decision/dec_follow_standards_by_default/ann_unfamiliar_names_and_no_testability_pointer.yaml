title:                  Unfamiliar standard names at the point of use
brief:                  |
                        The 2023 standard names replaced familiar
                        ones, three of the five with longer names, and
                        testability can no longer be found by its own
                        name. A person who reaches for the familiar
                        word spends time finding the standard one, and
                        for testability gets no alias to follow.
description:            |
                        Renames in 7053bfa (pre-squash). Old ids are
                        aliases and the check outdated_reference names
                        the current id (src/cctool/check/check.lp
                        lines 487-501). The testability concern was
                        removed, not renamed, in 373ff5d;
                        maintainability has an empty alias list
                        (_data/register/reg_concern.yaml line 362) and
                        no file under _data or AGENTS.md contains
                        "testab" at HEAD 89c74d8; only the
                        maintainability description says "tested". The
                        cost is paid once per term.

