title:                  Testability kept inside maintainability
brief:                  |
                        Keeping testability inside maintainability, as
                        ISO/IEC 25010 does, leans toward being
                        standards-informed, which the owner holds is a
                        good starting position that experience can
                        revise.
description:            |
                        Owner's statement, 2026-10-13T18:30:41Z: "I'd
                        rather testability stay in maintainability so
                        we lean more toward being standards-informed,
                        which I think is a good starting position (we
                        can and will of course learn over time)".
                        Applied in 373ff5d and written into AGENTS.md
                        in a0b3f50 (both pre-squash).

