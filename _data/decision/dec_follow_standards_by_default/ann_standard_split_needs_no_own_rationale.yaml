title:                  Fixed outside reference for review
brief:                  |
                        A change that follows a cited standard is
                        judged against a reference that does not move
                        with the change. A change that sets out its
                        own split must also carry the case for that
                        split, so the reviewer judges the design as
                        well.
description:            |
                        Citations added in one change of 48 lines
                        (fed3da5, pre-squash). The rename to standard
                        names gave the full old-to-new mapping in its
                        message (7053bfa). The own split added eight
                        concerns and moved checking to testability in
                        one change of 262 added and 4 removed lines
                        (6cabbb1). AGENTS.md#before-you-finish ask for
                        changes small enough to read in one sitting.

