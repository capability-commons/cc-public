title:                  Small, contained renames to standard names
brief:                  |
                        Moving five concerns to the ISO/IEC 25010:2023
                        names stayed small, because each old id lives
                        on as an alias and nothing else may still name
                        it.
description:            |
                        Commit 7053bfa (pre-squash) touched 3 files,
                        83 insertions and 61 deletions, and kept each
                        old id in alias. AGENTS.md, "Changing data
                        items", sets the alias rule.

