title:                  Partners still reading cc-public schemas
brief:                  |
                        Standard names do not by themselves let a
                        partner read or write cc-public data. The rule
                        covers structure, terms and citation, not data
                        formats, and a partner still reads cc-public's
                        own YAML schemas.
description:            |
                        AGENTS.md lines 85-87. The repository has no
                        TBX, SKOS or other exchange export (grep for
                        tbx, skos, export and 30042 outside .git finds
                        nothing).

