title:                  Measures for checking a change dropped
brief:                  |
                        Folding testability into maintainability kept
                        the question about checking a change but
                        dropped the two measures that tracked it. A
                        measure added to maintainability would close
                        the gap without the split.
description:            |
                        In 6cabbb1 the testability concern measured
                        time to run the full set of checks and time
                        from a failing check to its cause. 373ff5d
                        removed it and restored the question "How
                        readily can a change be checked before it
                        ships?". Maintainability now measures only
                        time and parts touched for a representative
                        change (_data/register/reg_concern.yaml at
                        entries.concern_maintainability.measure).

