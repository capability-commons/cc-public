title:                  Unchecked citations across standard editions
brief:                  |
                        Standards change by edition, but each citation
                        is free prose in a note, so nothing finds or
                        checks the items that rest on an edition. The
                        register already cites two editions of
                        ISO/IEC/IEEE 42010.
description:            |
                        concept_option cites 42010:2011 clauses 4.2.7
                        and 5.8, concept_concern cites 42010:2022
                        (_data/register/reg_concept.yaml). No item
                        type or relation names a cited standard.
                        Adopting the 25010:2023 names took five
                        renames (7053bfa, pre-squash), kept as aliases
                        (_data/register/reg_concern.yaml at entries).
                        ASSUMPTION: the 2011 clause numbers do not
                        hold in the 2022 edition, and future editions
                        will rename terms again. Merged from the
                        maintainability and compatibility advocates.

