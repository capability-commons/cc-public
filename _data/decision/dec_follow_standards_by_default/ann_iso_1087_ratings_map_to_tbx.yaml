title:                  ISO 1087 term ratings with TBX counterparts
brief:                  |
                        The concept register rates terms as ISO 1087
                        does, so each rating has a direct counterpart
                        in TBX (ISO 30042), the standard terminology
                        exchange format. The value is only potential,
                        since no export exists yet.
description:            |
                        term_preferred, term_admitted and
                        term_deprecated in
                        _data/schema/sch_regentry_concept.yaml lines
                        34-45 and 53-80. Maintainer asked for "those
                        ISO 1087 compliant names as the fieldnames"
                        (2026-10-13T14:28:45Z). TBX administrative
                        statuses: preferredTerm-admn-sts,
                        admittedTerm-admn-sts, deprecatedTerm-admn-sts
                        (https://terminator.readthedocs.io/en/latest/tbx_conformance.html;
                        ISO 30042:2019,
                        https://www.iso.org/standard/62510.html).
                        ASSUMPTION: an exporter would be small.

