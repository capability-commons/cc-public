title:                  Cited standards held outside the repository
brief:                  |
                        The cited standards are paid documents kept on
                        the owner's machine, and some citations were
                        written from public titles and scope only. A
                        reviewer or partner without the text must take
                        "follows ISO X" on trust.
description:            |
                        Owner's statements 2026-10-13T18:36:22Z ("If
                        there are any important ones that are missing,
                        let me know and I can buy them") and
                        2026-10-13T19:47:13Z ("purchased docs to
                        follow later"). At the decision (18:30)
                        neither 25010:2023 nor 1087:2019 was held;
                        previews of both were added at 19:47, full
                        copies to follow. Some citations were written
                        from public titles and scope (memory/MEMORY.md
                        lines 3, 4, 16). git ls-files lists no
                        standard documents.

