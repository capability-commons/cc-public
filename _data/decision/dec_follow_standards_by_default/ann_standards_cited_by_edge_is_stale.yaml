title:                  Standards now cited by edge to external documents
brief:                  |
                        ann_standard_citations_drift_by_edition says
                        each citation is free prose, no item type or
                        relation names a cited standard, and the
                        register cites two editions of ISO/IEC/IEEE
                        42010. Cited editions are now items, the
                        concerns cite them by edge, and both concepts
                        cite the 2022 edition.
description:            |
                        type_external_document is in
                        _data/register/reg_data_item_type.yaml (line
                        1441), and relation_cites in
                        _data/register/reg_relation.yaml (line 861).
                        _data/external_document holds 17 items, each
                        one edition of one document, such as
                        extdoc_iso_iec_ieee_42010_2022 and
                        extdoc_iso_iec_25010_2023.
                        _data/register/reg_concern.yaml holds 20
                        relation_cites edges, so a query finds the
                        concerns that rest on an edition. The notes of
                        concept_option and concept_concern in
                        _data/register/reg_concept.yaml (lines 348-357
                        and 387-391) both cite ISO/IEC/IEEE
                        42010:2022; concept_option names clause 5.8.2
                        of the 2011 edition only as history. These two
                        concepts still cite in prose, with no edge.
                        Found in the review of 2026-10-22.

