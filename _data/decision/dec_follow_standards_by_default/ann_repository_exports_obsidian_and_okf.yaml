title:                  Obsidian and Open Knowledge Format exports in the repository
brief:                  |
                        The repository now exports the graph as an
                        Obsidian vault and as an Open Knowledge Format
                        0.2 bundle, so the statement that it has other
                        exchange export no longer holds. A partner can
                        read cc-public data as Markdown pages, though
                        the pages carry cc-public's own fields.
description:            |
                        The command group "cctool export" has two
                        commands, obsidian and okf, each of which
                        writes the graph of data items as pages of
                        Markdown with frontmatter
                        (src/cctool/cli/exporting.py within export).
                        The okf command follows Open Knowledge Format
                        version 0.2 (src/cctool/export/okf.py within
                        VERSION_OKF). Tests check that both commands
                        write a page for an item and that the bundle
                        conforms
                        (src/cctool/cli/_test/test_exporting.py). The
                        exports carry the repository's own fields as
                        frontmatter, so they are not TBX or SKOS; the
                        part of the challenged statement about TBX and
                        SKOS still holds.

