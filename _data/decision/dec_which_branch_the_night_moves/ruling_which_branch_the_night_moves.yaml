title:                  main becomes the verified line
brief:                  |
                        dev stays the branch that work lands on. At
                        the move to main, main is pointed at the tip
                        of verified, and from then on the overnight
                        run moves main forward, by fast-forward only,
                        to a dev commit that passed everything, and
                        releases are tagged on main. main replacing
                        dev, and main moving only at a release, are
                        rejected. Ruled by WTP on 2026-10-29.

