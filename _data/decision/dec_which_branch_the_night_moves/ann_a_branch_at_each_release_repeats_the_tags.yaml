title:                  A branch moved at each release repeats the tags
brief:                  |
                        A main that moves only at a release points at
                        the newest release tag and nothing else, a
                        third long-lived branch to keep and a step to
                        add to every release, for what git describe
                        and the tags already say. A reader of the
                        history has three branches to compare in place
                        of two.

