title:                  dev against main shows what waits for the night
brief:                  |
                        With dev landed on and main moved by the
                        night, git log main..dev lists exactly the
                        work that has passed the gates but not yet a
                        night, and a red night shows as main standing
                        still while dev moves on. A reviewer reads the
                        state of every stage from the two branch
                        names, without a third.

