title:                  Keeping dev keeps every landing instruction
brief:                  |
                        If dev stays the branch work lands on, the
                        landing steps, the default base of cctool repo
                        bundle and the ranges such as dev..HEAD in
                        AGENTS.md and the review skill stay as they
                        are, and only the overnight run's target
                        changes, from verified to main. If main
                        replaces dev, each of them changes at the
                        move, while threads with branches made on dev
                        are still landing.
description:            |
                        Sources:
                        - cctool repo bundle starts after dev unless
                          told otherwise [77629b36:src/cctool/cli/repository.py
                          within bundle].
                        - AGENTS.md lands each branch on dev
                          [AGENTS.md#working-beside-other-agents].

