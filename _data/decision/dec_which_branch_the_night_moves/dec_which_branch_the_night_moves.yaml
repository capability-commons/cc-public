title:                  Which branch the overnight run moves
brief:                  |
                        Which branches carry work through the stages
                        of quality gates, now on dev and after the
                        release line moves to main, and which branch
                        does the overnight run move forward?
description:            |
                        Work passes four stages, each slower and more
                        thorough than the one before. The commit gate
                        checks, lints and tests the staged tree,
                        leaving out the tests marked slow. Landing a
                        branch replays and signs its commits and runs
                        the history check, and the pre-push hook runs
                        the history check with the gate on what a push
                        sends. The overnight run takes the tip of dev
                        and runs what the gates leave out: the tests
                        on every supported Python, the property tests
                        with many examples, coverage against the floor
                        each maturity sets, and the full schema check.
                        The release gate then runs every check and
                        test with no cached verdicts, builds and
                        installs the package fresh, and checks the
                        data it ships.

                        The ruling on quality stages keeps dev for
                        work that has passed the gates, and a verified
                        branch that the overnight run moves forward,
                        by fast-forward only, to a dev commit that
                        passed everything; releases are cut only from
                        verified. The ruling on branch lines makes dev
                        the release line until WTP moves it to main,
                        which then takes dev's history whole, and adds
                        next for breaking work after 1.0. Until the
                        move every option below is the same: work
                        lands on dev, the night moves verified,
                        releases are tagged on verified. They differ
                        in what main becomes at the move, which WTP
                        expects within a few weeks (WTP, 2026-10-28).
                        The overnight tasks exist as pixi tasks (slow,
                        fuzz, coverage, check-full), but nothing runs
                        them each night or moves a branch yet.

