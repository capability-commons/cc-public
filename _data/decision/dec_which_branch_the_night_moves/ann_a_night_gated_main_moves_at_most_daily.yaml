title:                  A night-gated main moves at most once a day
brief:                  |
                        If the night moves main, a fix that outsiders
                        need reaches main only after the next
                        overnight run passes, up to a day later,
                        unless the run is started by hand. If main
                        replaces dev, it reaches main as soon as it
                        lands. Releases are cut from the night-passed
                        branch under every option, so this delay
                        touches what a visitor sees on main, not what
                        a release ships.

