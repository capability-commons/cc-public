title:                  The overnight run needs a runner that can push
brief:                  |
                        Under every option, the overnight run must run
                        on a machine that holds the repository and the
                        right to push, take the tip of dev at its
                        start, run the overnight tasks, and on success
                        move the night-passed branch forward and push
                        it, without signing anything new, since a
                        fast-forward makes no commit. Work landed
                        while it runs waits for the next night. A red
                        night must be reported where WTP will see it,
                        since nothing else moves.
description:            |
                        Sources:
                        - The overnight tasks exist as pixi tasks, but
                          nothing runs them on a schedule
                          [pyproject.toml at tool.pixi.tasks].

