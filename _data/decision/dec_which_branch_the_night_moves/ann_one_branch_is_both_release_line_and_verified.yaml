title:                  One branch both the release line and the verified line
brief:                  |
                        The ruling on branch lines makes main the
                        release line after the move, and the ruling on
                        quality stages cuts releases only from
                        verified. If main becomes the verified line,
                        the two rulings name the same branch. If main
                        replaces dev, the release line holds commits
                        the night has not passed and releases are cut
                        from another branch, so the rulings disagree
                        on where a release comes from.
description:            |
                        Sources:
                        - Releases come from dev until the maintainer
                          moves the release line to main
                          [_data/decision/dec_branch_lines/ruling_branch_lines.yaml
                          at brief].
                        - Releases are cut only from verified
                          [_data/decision/dec_quality_stages/ruling_quality_stages.yaml
                          at brief].

