title:                  main becomes the verified line
brief:                  |
                        dev stays the branch that work lands on. At
                        the move, main is pointed at the tip of
                        verified, taking its history whole while the
                        legacy history stays under its tag, and
                        verified is retired: from then on the
                        overnight run moves main forward, by
                        fast-forward only, to a dev commit that passed
                        everything, and releases are tagged on main.
                        After 1.0, next holds breaking work as ruled,
                        and lands on dev only in a major release.

