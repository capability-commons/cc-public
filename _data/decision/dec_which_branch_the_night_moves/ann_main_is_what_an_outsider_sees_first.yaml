title:                  main is what an outsider sees first
brief:                  |
                        A clone and the front page of a repository on
                        GitHub show its default branch, which for
                        cc-public will be main. If main is the
                        verified line, someone who arrives without a
                        tag sees only work that passed a night. If
                        main replaces dev, they see work that passed
                        only the gates, which the overnight run may
                        yet fail. Peers depend on release tags rather
                        than a branch, so this matters for visitors
                        and new partners more than for peers.
description:            |
                        Sources:
                        - WTP will move to main before outside
                          partners use cc-public
                          [_data/decision/dec_branch_lines/opt_dev_then_main_then_next.yaml
                          at description].
                        - Peers depend on release tags and build from
                          source for now
                          [_data/decision/dec_publishing_route/ruling_publish_tags_now_channel_to_be_decided.yaml
                          at brief].

