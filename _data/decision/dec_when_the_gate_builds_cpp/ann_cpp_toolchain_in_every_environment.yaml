title:                  Toolchain in every working environment
brief:                  |
                        If every code commit builds the C++, every
                        gate that runs the tests needs the compiler
                        and build tools, including one run for a
                        change to Python alone. Building at pre-push
                        still needs them where the push happens but
                        keeps the commit gate free of them. pixi can
                        hold the toolchain in a feature of its own, as
                        the project already holds environments for
                        three Python versions, but the lock records
                        every environment, so the toolchain enters the
                        lock either way.
description:            |
                        Sources:
                        - The current environment holds no C++
                          compiler or build tool
                          (search of pixi.lock).
                        - The atlas VM has no network, so only the
                          owner can relock
                          (context note, _sources/context.md line 30).
                        - A commit gate for a code commit takes about
                          78 s on atlas
                          (context note, _sources/context.md line 31).
                        - Assumption: the toolchain would come from
                          conda-forge compiler
                          packages added to the pixi environment.
                        - Strength: weak; only where the toolchain is
                          exercised differs.

