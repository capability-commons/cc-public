title:                  Build time on every code commit against the time limits
brief:                  |
                        Building the C++ on every code commit adds its
                        time to a gate that takes about 78 s,
                        including commits that change only Python
                        unrelated to the generator, while a remote
                        device call dies at 180 s and a stage past 600
                        s fails the commit. A slower gate also pushes
                        authors toward fewer, larger commits that are
                        harder to read, so this option needs an
                        incremental build to stay usable.
description:            |
                        Sources:
                        - The commit gate takes about 78 s for a code
                          commit and about
                          10 s for a data-only commit on atlas, 2 CPUs (context note,
                          _sources/context.md line 31).
                        - Device tool calls in a remote session die at
                          180 s
                          (_data/decision/dec_commit_gate/ann_gate_stage_time_limit_is_fixed.yaml;
                          _data/decision/dec_growth_policy/ann_small_tree_keeps_gate_in_session_limit.yaml).
                        - A gate stage that runs past 600 s is stopped
                          and fails
                          (src/cc_public/gate/gate.py lines 104-108).
                        - Gate stages run in parallel
                          (src/cc_public/gate/gate.py lines
                          147-150).
                        - The maintainer likes finer commits, one verb
                          per commit
                          (_data/decision/dec_growth_policy/ann_history_audit_scales_with_commits.yaml
                          lines 22-23).
                        - Assumption: the C++ build and test time is
                          unmeasured, and as
                          a parallel stage it adds to the gate only where it is the
                          slowest stage.
                        - Assumption: authors batch work into fewer
                          commits when each
                          costs more waiting time.

