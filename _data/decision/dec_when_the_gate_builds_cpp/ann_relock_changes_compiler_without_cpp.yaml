title:                  Compiler changes arriving by relock
brief:                  |
                        An upstream change to the compiler or a C++
                        library arrives in a commit that stages only
                        pixi.lock or pyproject.toml, not C++ files. A
                        gate that builds the C++ only when C++ is
                        staged would not build it on that commit,
                        unless the rule is widened to count the lock;
                        building on every code commit, which counts
                        the lock as code, would.
description:            |
                        Sources:
                        - The gate treats a change to pyproject.toml
                          or pixi.lock as
                          code and runs the tests (README.md#getting-started).
                        - The when-staged option builds only in a gate
                          whose commit
                          stages C++ files
                          (_data/decision/dec_when_the_gate_builds_cpp/opt_build_cpp_when_staged.yaml,
                          brief).
                        - Upstream versions are fixed in pixi.lock and
                          change when it is
                          relocked (pixi.lock; context note,
                          _sources/context.md line 30).

