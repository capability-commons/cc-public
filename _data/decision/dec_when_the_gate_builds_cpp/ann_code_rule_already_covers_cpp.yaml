title:                  The existing code rule covering C++
brief:                  |
                        The gate tests a commit when it stages any
                        path under src, and C++ under src is such a
                        path, so building C++ on every code commit
                        reuses that one rule with no change. Building
                        only when C++ is staged adds a second
                        classifier beside it, and building at pre-push
                        adds another difference between the commit and
                        push gates.
description:            |
                        Sources:
                        - The code paths are src/, pyproject.toml,
                          pixi.lock and
                          .githooks/, and a commit that stages none of them is not
                          tested (src/cc_public/gate/gate.py lines 94-99 and 157-170).
                        - The commit gate already leaves out the tests
                          marked prepush,
                          which the push gate runs (README.md lines 77-80).

