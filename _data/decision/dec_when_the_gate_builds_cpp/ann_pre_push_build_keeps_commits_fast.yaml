title:                  Commit latency kept at today's level by a pre-push build
brief:                  |
                        Building the C++ only at pre-push keeps commit
                        latency where it is today for every commit,
                        including commits that touch C++. The cost
                        moves to the push, which already runs every
                        test but the slow ones, with no store, and a
                        push of several commits pays the whole build
                        at once.
description:            |
                        Sources:
                        - The pre-push hook runs cctool history check
                          with --gate, and
                          the gate of a push runs every test but those marked slow, on
                          what the push sends (.githooks/pre-push; README.md#getting-started).
                        - The gate of a push uses no verdict store
                          (README.md#getting-started).

