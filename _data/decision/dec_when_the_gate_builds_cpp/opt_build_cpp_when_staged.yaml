title:                  C++ built when C++ is staged
brief:                  |
                        Build and test the C++ only in a gate whose
                        commit stages a path of the engine, its C++ or
                        the generator that writes it, or
                        pyproject.toml or pixi.lock. The gate of a
                        push always builds it, as it always runs the
                        tests.

