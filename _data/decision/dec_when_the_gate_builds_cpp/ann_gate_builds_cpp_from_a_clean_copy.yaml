title:                  Full C++ build in each gate's clean copy
brief:                  |
                        The gate runs in a fresh temporary copy of the
                        staged content, so no build directory survives
                        from one gate to the next and every gate that
                        builds the C++ builds it from scratch.
                        Building only when C++ is staged keeps Python
                        commits at today's 78 s and data commits at 10
                        s, and pays the clean build only where it
                        tests the change.
description:            |
                        Sources:
                        - The gate copies the staged content into a
                          temporary directory
                          and runs each stage there (src/cc_public/gate/gate.py lines
                          19-21 and 247-261).
                        - The test stage already runs only when code
                          is staged
                          (src/cc_public/gate/gate.py lines 94-99; README.md lines
                          74-77).
                        - A code commit takes about 78 s and a
                          data-only commit about 10
                          s in the gate on atlas (context note, _sources/context.md line
                          31).
                        - Assumption: no compiler cache such as ccache
                          is set up; with
                          one, clean builds would be much faster.

