title:                  One staging rule for tests and the C++ build
brief:                  |
                        Building the C++ only when C++ is staged
                        follows the pattern the test stage already
                        uses, which runs only when code is staged, so
                        a newcomer learns one kind of rule.
description:            |
                        Sources:
                        - The test stage runs only when code is staged
                          (README.md#getting-started; src/cctool/gate/gate.py within stages).
                        - Strength: moderate; it is the learning cost
                          of one rule
                          against a second classifier, which simplicity weighs the other
                          way.

