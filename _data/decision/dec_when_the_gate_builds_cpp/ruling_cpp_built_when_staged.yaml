title:                  C++ built when C++ is staged
brief:                  |
                        The gate builds and tests the C++ only when a
                        commit stages the engine's C++, the generator
                        that writes it, pyproject.toml or pixi.lock,
                        and the gate of a push always builds it. Ruled
                        by William Payne on 2026-10-24, as
                        recommended: Python and data commits keep
                        today's gate times, while a generator change
                        or a relock still gets a build next to its
                        cause, and a build at push alone would leave
                        every commit unbuilt.

