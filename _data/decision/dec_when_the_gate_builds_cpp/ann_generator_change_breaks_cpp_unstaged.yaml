title:                  C++ broken by a commit that stages no C++
brief:                  |
                        The schedule generator is Python that writes
                        the engine's C++, so a commit that changes
                        only the generator stages no C++ file yet can
                        break what the C++ build compiles or runs.
                        Building only when C++ is staged shows that
                        commit a passing gate, and the fault surfaces
                        at a later commit or push, away from its
                        cause.
description:            |
                        Sources:
                        - The generator is part of the dataflow engine
                          component, with
                          the C++ engine
                          (_data/logical_component/lco_dataflow_engine.yaml lines
                          12-15).
                        - cctool resolves a variant and generates the
                          frozen C++
                          schedule from it, with variant logic in Python
                          (_sources/cc-patrol-notes/variants.md lines 92-95).
                        - The generator writes the .cpp of a frozen
                          schedule
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          35-40).
                        - The gate decides whether code is staged by
                          path prefix: src/,
                          pyproject.toml, pixi.lock and .githooks/
                          (src/cc_public/gate/gate.py lines 94-99 and 157-191).
                        - Assumption: C++ staged would also be decided
                          by path, as the
                          test stage is now.
                        - Strength: strong for maintainability and
                          reliability; moderate
                          for functional suitability and reviewability, since a
                          data-only change to a dataflow graph escapes the commit gate
                          under every option, the push gate catches both, and whether
                          generated C++ is built in the gate is not yet designed.

