title:                  Push gate still ahead of any release
brief:                  |
                        Leaving the C++ to the push gate lets a broken
                        C++ commit land in local history, but the push
                        gate still runs before anything reaches
                        origin, whose dev branch is to become main
                        with the first public release. Defects found
                        after release do not rise; what rises is the
                        number of commits between a defect and its
                        discovery.
description:            |
                        Sources:
                        - The pre-push hook runs the history check,
                          which is the check
                          of record (AGENTS.md lines 93-97).
                        - The gate of a push runs every stage on what
                          is pushed and uses
                          no verdict store (src/cctool/gate/gate.py lines 28-32 and
                          94-97; context note, _sources/context.md line 31).
                        - No release has been made yet, and dev on
                          origin will move to
                          main, likely with the first public release (owner's statement,
                          2026-10-22T16:17; context note, _sources/context.md lines
                          32-33).
                        - Strength: weak; it limits the functional
                          harm of the option
                          rather than showing a benefit.

