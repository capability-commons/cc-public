title:                  Unbuilt intermediate commits under a pre-push build
brief:                  |
                        The push gate tests only the content of each
                        pushed ref's tip, so with the C++ built only
                        at pre-push the intermediate commits are never
                        built and a reviewer of one commit cannot know
                        that its C++ compiles. A fault found at push
                        may sit under several later commits and must
                        be traced back, where a build at commit keeps
                        the cause next to the failure.
description:            |
                        Sources:
                        - The pre-push hook runs the history check on
                          the commits the
                          remote lacks, and the gate on the content of each ref the push
                          updates (.githooks/pre-push lines 23-26;
                          _data/decision/dec_commit_gate/ann_commit_gate_misses_rebased_commits.yaml
                          lines 13-17).
                        - cctool history check with --gate checks each
                          commit, and
                          checks, lints and tests the content of the newest only
                          (AGENTS.md lines 40-44).
                        - The commit gate runs on each commit made
                          with hooks (README.md
                          lines 71-74).
                        - One commit does one thing (AGENTS.md line
                          87).
                        - Strength: strong for reviewability; moderate
                          for
                          maintainability and reliability, since the fault is still
                          caught before it leaves the machine.

