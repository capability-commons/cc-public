title:                  Architecture terms from two sources
brief:                  |
                        Concern and decision follow ISO/IEC/IEEE
                        42010, while logical component, drivers and
                        realizes follow Arcadia, so a reader or
                        partner must know both to read one relation.
description:            |
                        concept_option, concept_concern and
                        concept_decision cite ISO/IEC/IEEE 42010:2022
                        (_data/register/reg_concept.yaml lines
                        349-358, 387-392, 633-650).
                        relation_is_driven_by cites Arcadia clause
                        4.3.1 and links a design entity, such as a
                        logical component, to a concern
                        (_data/register/reg_relation.yaml lines
                        451-490). AGENTS.md lines 218-220 names 42010
                        but not Arcadia. Concerns play the role of
                        Arcadia's drivers and viewpoints (memory
                        arcadia-terminology.md line 22). The support
                        for the ISO option is conditional: the visible
                        part of 42010:2022 clause 3 (terms 3.1 to 3.8)
                        defines no component, logical component,
                        realization or driver. ASSUMPTION: neither
                        42010 nor 15288 names a technology-neutral
                        logical component. If so, a second source is
                        unavoidable and this point falls.

