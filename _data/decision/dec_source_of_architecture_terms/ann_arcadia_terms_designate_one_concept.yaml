title:                  Arcadia terms formed like the register's own
brief:                  |
                        The Arcadia terms enter as qualified
                        compounds, logical component and driver
                        concern, formed the way the register already
                        qualifies an overloaded word. Each designates
                        one concept here and keeps the sense of its
                        cited source.
description:            |
                        concept_logical_component has the preferred
                        term "logical component" and keeps Arcadia's
                        sense of a grouping that makes no
                        technological choice
                        (_data/register/reg_concept.yaml lines
                        547-559). concept_driver_concern has "driver
                        concern", admits "driver", and is narrower
                        than concept_concern (reg_concept.yaml lines
                        1898-1912), so the Arcadia driver joins the
                        42010 concern without a second sense. The
                        register qualifies other overloaded words the
                        same way, with the senses they have elsewhere:
                        dataflow node and OS process (reg_concept.yaml
                        lines 1072-1080, 1150-1156). Own names would
                        add terms with no sense outside the repository
                        to check them against. Limit:
                        relation_realizes is wider than Arcadia's
                        realization, since its targets include members
                        of an interface control document
                        (_data/register/reg_relation.yaml lines
                        363-367), and it has no note saying so.
                        ASSUMPTION: ISO 704:2022 favors a term already
                        established in the subject field over a new
                        coinage; not checked against full text.

