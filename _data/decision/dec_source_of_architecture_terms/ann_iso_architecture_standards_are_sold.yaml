title:                  ISO architecture standards behind a paywall
brief:                  |
                        ISO/IEC/IEEE 42010:2022 and 15288 are sold,
                        not free, and are not in the project's
                        standards folder, so a reviewer cannot check a
                        definition against its source.
description:            |
                        Neither standard is in the standards folder or
                        was checked against full text
                        (arcadia-decision-subjects.md line 58).
                        42010:2022 is sold, for example by AFNOR:
                        https://www.boutique.afnor.org/en-gb/standard/iso-iec-ieee-420102022/software-systems-and-enterprise-architecture-description/xs142363/337586.
                        ASSUMPTION: 15288:2023 is likewise sold. The
                        point falls if the standards are bought and
                        filed.

