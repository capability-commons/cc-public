title:                  Borrowed terms kept in single register entries
brief:                  |
                        Each Arcadia term enters as one register
                        entry, and con_logical_component and
                        r_is_driven_by name their source, so a change
                        of mind about one definition touches one
                        entry.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        481-489; _data/register/reg_relation.yaml
                        lines 425-431. At 89c74d8, "logical_component"
                        appears in 5 tracked files (git grep -l). The
                        point holds for a note or definition, not for
                        an id: renaming type_logical_component or the
                        lc_ prefix grows costlier as the graph grows.

