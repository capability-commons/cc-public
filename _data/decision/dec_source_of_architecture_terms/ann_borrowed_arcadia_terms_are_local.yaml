title:                  Borrowed terms kept in single register entries
brief:                  |
                        Each Arcadia term enters as one register
                        entry, and concept_logical_component and
                        relation_is_driven_by name their source, so a
                        change of mind about one definition touches
                        one entry.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        547-558; _data/register/reg_relation.yaml
                        lines 471-477. In the snapshot of 2026-10-22,
                        "logical_component" appears in 41 files, 9 of
                        them outside _data/decision (grep -rl), and
                        six lco_ items are in _data/logical_component.
                        The point holds for a note or definition, not
                        for an id: renaming type_logical_component or
                        its prefix, which commit 3943ab7 changed from
                        lc to lco, grows costlier as the graph grows.

