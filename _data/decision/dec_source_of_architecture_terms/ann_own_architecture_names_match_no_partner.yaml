title:                  Own names matching no standard or tool
brief:                  |
                        Names of cc-public's own would match no
                        standard and no tool, so every partner would
                        need a renaming table to read the architecture
                        items.
description:            |
                        AGENTS.md lines 218-220, present since the
                        first commit 7dda99e, says to follow a
                        recognized standard's structure and terms
                        where one covers the ground. The other
                        architecture terms come from standards:
                        decision and concern from ISO/IEC/IEEE
                        42010:2022 (_data/register/reg_concept.yaml
                        lines 387-392, 633-650), and 9 of the 19
                        concerns from ISO/IEC 25010:2023, with most of
                        the rest citing other ISO standards
                        (_data/register/reg_concern.yaml). The note
                        arcadia-decision-subjects.md (question 2,
                        line 47) only raises own names as a question,
                        and suggests the "logical" qualifier may be
                        enough.

