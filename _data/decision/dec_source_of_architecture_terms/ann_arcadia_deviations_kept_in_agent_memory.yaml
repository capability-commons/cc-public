title:                  Deviation list outside the repository
brief:                  |
                        The full list of deviations from Arcadia lives
                        in an agent memory note, not in the items. A
                        reader or reviewer of r_realizes sees that its
                        subjects are source files, but is not told
                        that Arcadia has physical components there.
description:            |
                        The four deviations are in memory
                        arcadia-terminology.md lines 19-23; no tracked
                        file at 89c74d8 has "memory" in its path, and
                        f4cb721 touches only _data and src. r_realizes
                        has no note naming Arcadia or the deviation
                        (_data/register/reg_relation.yaml lines
                        325-353). Some items do record theirs:
                        con_logical_component (no function items yet),
                        con_ruling and con_decision ("Arcadia has no
                        counterpart") in reg_concept.yaml lines
                        491-493, 531, 569. This bears on how the
                        decision is carried out, not on the choice of
                        source. The fix is a note on each deviating
                        item.

