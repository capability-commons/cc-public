title:                  Deviation list outside the repository
brief:                  |
                        The full list of deviations from Arcadia lives
                        in an agent memory note, not in the items. A
                        reader or reviewer of relation_realizes sees
                        that its subjects are source files, but is not
                        told that Arcadia has physical components
                        there.
description:            |
                        The deviations are in memory
                        arcadia-terminology.md lines 19-23. Since
                        2026-10-20, line 20 says that realizers are
                        source-file items and dataflow nodes, and
                        records WTP's view that physical
                        implementation is in scope, so the physical
                        level is no longer counted as a deviation;
                        three deviations remain. No file in the
                        snapshot has "memory" in its path outside this
                        decision, and f4cb721 touches only _data and
                        src. relation_realizes has no note naming
                        Arcadia or the deviation
                        (_data/register/reg_relation.yaml at
                        entries.relation_realizes). Some items do
                        record theirs: concept_logical_component (no
                        function items yet), concept_ruling,
                        concept_decision and concept_requirement
                        ("Arcadia has no counterpart"), and
                        concept_dataflow_node (Arcadia's sense of
                        node) in reg_concept.yaml at entries. This
                        bears on how the decision is carried out, not
                        on the choice of source. The fix is a note on
                        each deviating item.

