title:                  Arcadia terms with recorded deviations
brief:                  |
                        cc-public takes its logical architecture terms
                        from Arcadia, which is published as AFNOR XP
                        Z67-140 with a free guide, since ISO/IEC/IEEE
                        42010 gives decision and concern but no
                        logical component. Names of our own would
                        match no partner. Each place we depart from
                        Arcadia is to be noted on the item that
                        departs. Ruled by WTP on 2026-10-22.

