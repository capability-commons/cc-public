title:                  A published guide behind each borrowed term
brief:                  |
                        The Arcadia terms logical component and
                        drivers each cite a clause of a free,
                        published guide. A new reader can learn the
                        term from it, and a reviewer can check a
                        definition against it.
description:            |
                        concept_logical_component cites the Arcadia
                        user guide 2023, clauses 4.3 and 4.4.4
                        (_data/register/reg_concept.yaml lines
                        481-489). r_is_driven_by cites clause 4.3.1
                        (_data/register/reg_relation.yaml lines
                        425-431). The guide is a free PDF:
                        https://eclipse.dev/capella/resources/arcadia-reference/Arcadia%20User%20Guide.pdf.
                        r_realizes cites no clause. The preferred term
                        is "logical component", and the qualifier
                        already separates it from the overloaded
                        "component". ASSUMPTION: own names would cite
                        no outside text. ASSUMPTION: the future
                        readers have reason to read an MBSE guide.

