title:                  Actor side moved or retransported by replacing gateways
brief:                  |
                        With gateway nodes at the crossing, the actor
                        side can be moved to another process or host,
                        or its transport changed, by replacing gateway
                        nodes only, as Stableflow does at a segment's
                        edge. A crossing policy on the edge does the
                        same work inside the engine, per policy. Both
                        keep functional nodes unaware of placement,
                        and the edge form adds no node per crossing.
description:            |
                        Sources: a gateway node buffers messages and
                        offers them as tokens at each step
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_gateway_nodes_between_semantics.yaml
                        lines 11-15); the edge policy declares how
                        messages become a token
                        (opt_crossing_policy_on_the_edge.yaml in the
                        same folder, lines 11-18). Stableflow's
                        gateway node keeps components topology-blind,
                        and in simulation is replaced by a link model
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 182-195); the Python Stableflow runtime
                        used the gateway pattern for ASGI servers
                        (same file, lines 195-199). Strength: moderate
                        for gateways, weaker for the edge policy. The
                        gateway form adds a node per crossing, which
                        grows with the number of crossings; the edge
                        policy does not.

