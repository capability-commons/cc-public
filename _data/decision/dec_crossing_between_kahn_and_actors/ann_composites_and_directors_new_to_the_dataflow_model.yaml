title:                  Composites and directors as concepts the model lacks
brief:                  |
                        Ptolemy II's composites are well documented,
                        but the dataflow model has no composite or
                        director, so this option adds both to the
                        schema, the checks and the engine. A node with
                        neighbors of both kinds must be split, moving
                        a node to the other semantics means moving it
                        into another composite and rerouting its edges
                        through ports, and the director still needs a
                        rule per port, so the edge-policy question
                        returns there.
description:            |
                        Sources: nodes are grouped into composites,
                        each run under one semantics, and values cross
                        only at a composite's ports, where its
                        director turns messages into tokens and back,
                        without saying how
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_one_semantics_per_composite.yaml
                        at title and brief). In Ptolemy II, "Each
                        level of the hierarchy in a model can have its
                        own director, and distinct directors can be
                        composed hierarchically"
                        (https://ptolemy.berkeley.edu/projects/chess/pubs/892.html).
                        The dataflow graph schema holds hosts, OS
                        processes, nodes and edges, and no composite
                        (_data/schema/sch_dataflow_graph.yaml at
                        allOf.2.required and allOf.2.properties).
                        Patrol's notes use a composite only
                        informally: "analysis (composite)"
                        (_sources/cc-patrol-notes/plan.md lines
                        136-140) and "One composite node for now"
                        (_sources/cc-patrol-notes/draft/tools/icd_table.py
                        line 101). Strength: moderate. The concept
                        cost is fixed; the rerouting cost of one move
                        grows with the node's edges. It weakens if
                        composites are wanted for other reasons, such
                        as frozen islands
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 74-80), or to carry the static and
                        dynamic subgraphs as well. Simplicity is a
                        non-driver here.

