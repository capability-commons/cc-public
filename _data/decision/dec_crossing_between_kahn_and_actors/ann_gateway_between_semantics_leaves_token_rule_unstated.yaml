title:                  Unstated token rule of a gateway between semantics
brief:                  |
                        The gateway option says a gateway buffers
                        messages and offers them to the Kahn side as
                        tokens, but not which token it gives when
                        several messages arrived, so its result is not
                        yet defined. A gateway type with a policy
                        setting would close the gap, and would then
                        carry the edge policy inside one more node.
description:            |
                        Sources: a gateway node "buffers messages and
                        offers them to the Kahn side as tokens at each
                        step"
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_gateway_nodes_between_semantics.yaml
                        lines 11-15). Gateway nodes were decided on
                        2026-10-16 for the boundary of a segment with
                        the outside world
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 182-188 and 226-227); there an inbound
                        gateway latches what arrived since the last
                        step (same file, lines 190-191), which does
                        not say which of several messages becomes the
                        token. The owner asked whether gateway nodes
                        are needed here, "Or maybe there's a way we
                        can avoid it somehow?" (owner's statement,
                        2026-10-24 12:33Z). Strength: moderate.

