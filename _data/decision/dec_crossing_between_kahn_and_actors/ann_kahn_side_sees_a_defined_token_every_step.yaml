title:                  Defined token at every step, including an empty one
brief:                  |
                        The Kahn side must see a defined token at each
                        step whether or not an actor sent anything, so
                        that a system's handling of loss can be
                        tested. The edge-policy option states an
                        explicit empty token, and the drafted gateway
                        pattern marks its output empty when nothing
                        arrived. A composite's director could do the
                        same, but its option does not say so yet.
description:            |
                        Sources: the edge option turns messages into a
                        token by a stated rule, "with an explicit
                        empty token when none arrived"
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        lines 11-18). An inbound gateway marks its
                        output not enabled when nothing arrived, so
                        loss and delay become explicit empty tokens,
                        and a segment's behavior for any pattern of
                        arrival and loss can be tested by fault
                        injection
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-197). In Ptolemy II a director
                        implements a model of computation and each
                        level of the hierarchy can have its own
                        director
                        (https://ptolemy.berkeley.edu/projects/chess/pubs/655.html).
                        The Patrol draft names policies on its edges
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 45-51). Strength: strong; at ten times
                        the crossings a stated rule per edge or per
                        gateway keeps loss handling testable. Neither
                        for nor against the composite option.

