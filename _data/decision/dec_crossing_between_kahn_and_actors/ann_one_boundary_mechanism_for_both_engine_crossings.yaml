title:                  One boundary mechanism for both crossings
brief:                  |
                        The engine has two boundaries, static to
                        dynamic and Kahn to actor, and a newcomer
                        learns less if both use the same mechanism. If
                        gateway nodes are chosen at the static and
                        dynamic boundary, gateways here reuse that
                        code and concept, with Stableflow's precedent
                        for the asynchronous world. If they are not,
                        the same reasoning favors the policy on the
                        edge.
description:            |
                        Sources: gateway nodes at the static and
                        dynamic boundary are an option in the decision
                        on crossing between static and dynamic
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml
                        at title and brief). In Stableflow a gateway
                        node turns asynchronous traffic into Kahn
                        tokens and back, latching what arrived since
                        the last step and sending an empty token when
                        nothing arrived
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 182-193). The owner asked whether
                        gateway nodes are needed at the Kahn and actor
                        boundary too, "Or maybe there's a way we can
                        avoid it somehow?" (owner's statement,
                        2026-10-24). Strength: moderate; it is about
                        the count of concepts, not of nodes, so it
                        holds at any size. It rests wholly on the
                        decision on crossing between static and
                        dynamic.

