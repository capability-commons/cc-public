title:                  A director per semantics to port to each target
brief:                  |
                        Under one semantics per composite, each
                        director must run on each target platform, so
                        with two semantics there are at least two
                        directors to port. If composites also become
                        the unit of placement, placement is tied to
                        semantics, while the owner asked for an option
                        that states placement in configuration.
description:            |
                        Sources: in the composite option a director
                        turns messages into tokens and back at a
                        composite's ports, as in Ptolemy II
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_one_semantics_per_composite.yaml
                        lines 11-17). Kahn networks and actors are
                        both in the first version
                        (_data/decision/dec_first_semantics/ruling_first_semantics.yaml).
                        The owner asked for an option, as in
                        Stableflow, that states placement in
                        configuration and applies to threads and to
                        embedded systems with no OS (owner's
                        statement, 2026-10-24). ASSUMPTION: with two
                        semantics there are at least two directors to
                        port to each platform. ASSUMPTION: the
                        composite option would tie placement to
                        composites; the option itself does not say so.
                        Strength: weak; it depends on the decision on
                        how Kahn steps are spread across cores.

