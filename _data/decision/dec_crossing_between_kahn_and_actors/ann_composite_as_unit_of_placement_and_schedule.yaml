title:                  Composite as a unit of placement and static scheduling
brief:                  |
                        A composite under one director is a natural
                        unit to place on an execution unit, so a graph
                        moves between desktop and embedded targets by
                        whole composites, and a Kahn composite stays
                        contiguous, so it can be scheduled before the
                        run and generated as one block, as SDF
                        composites are in Ptolemy II. The placement
                        gain rests on the decision on how Kahn steps
                        are spread across cores.
description:            |
                        Sources: the composite option crosses only at
                        a composite's ports, through its director
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_one_semantics_per_composite.yaml
                        lines 11-17). In Ptolemy II an opaque
                        composite has a local director that executes
                        the actors it contains
                        (https://ptolemy.berkeley.edu/ptolemyII/ptII11.0/ptII/doc/codeDoc/ptolemy/actor/CompositeActor.html);
                        SDF execution order "is statically determined
                        prior to execution", the schedule "can be
                        pre-calculated and cached during compile-time
                        or load-time", and an opaque composite appears
                        to its outer director as an ordinary actor
                        (https://www2.eecs.berkeley.edu/Pubs/TechRpts/2001/ERL-01-9.pdf).
                        A frozen island loaded as one node is "the
                        main way the two levels meet"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 76-80). The owner asked that the
                        decision on how Kahn steps are spread across
                        cores include Stableflow's placement stated in
                        configuration, applying to threads as well as
                        processes and to embedded systems with no OS
                        (owner's statement, 2026-10-24). ASSUMPTION:
                        crossings placed on arbitrary edges may break
                        a Kahn region into pieces that must be called
                        separately. Strength: weak to moderate; it
                        matters for large Kahn regions and depends on
                        the placement decision.

