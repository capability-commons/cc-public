title:                  Fixed memory and no extra call for latest-value crossings
brief:                  |
                        A latest-value or fold crossing on the edge
                        keeps a fixed amount whatever arrives, by
                        overwriting one slot in place at the step
                        boundary, with no extra node to call. A
                        gateway node at each crossing adds its own
                        buffer and a call each step.
description:            |
                        Sources: the edge option turns messages into a
                        token at the start of a step by latest value,
                        all in order or a fold
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        at title and brief); the gateway option passes
                        every crossing through a gateway node that
                        buffers messages
                        (opt_gateway_nodes_between_semantics.yaml in
                        the same folder, lines 11-15). Every buffer
                        has a size known before the system starts
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 145-151). Within one process an edge is
                        the upstream node's output buffer itself, so
                        an edge costs nothing (same file, lines
                        41-44). ASSUMPTION: a latest-value policy
                        needs one slot per edge, and a gateway needs
                        its own buffer and a call per step. Only "all
                        of them in order" needs a bounded queue.
                        Strength: moderate; the saving is per crossing
                        edge and small per step, and holds at ten
                        times the nodes.

