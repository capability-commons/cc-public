title:                  Gateway as the place to inject and contain crossing faults
brief:                  |
                        A gateway is a node of its own at each
                        crossing, so in simulation it can be replaced
                        by a link model that drops or delays messages,
                        and it can be reset without touching either
                        side; a composite's director plays the same
                        role for a whole composite. A policy on an
                        edge has no node to substitute unless the
                        engine can put a link model on an edge.
description:            |
                        Sources: in Stableflow's drafts an inbound
                        gateway turns loss and delay into explicit
                        empty tokens, and in simulation the gateway is
                        replaced by a link model that drops, delays or
                        replays tokens, so a segment can be tested by
                        fault injection for any pattern of arrival and
                        loss
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-197). The owner asked whether
                        gateway nodes are needed between the Kahn and
                        actor subgraphs (owner's statement, 2026-10-24
                        12:33Z). In Ptolemy II an opaque composite
                        actor has a local director, and the model of
                        computation inside may differ from the one
                        outside
                        (https://ptolemy.berkeley.edu/ptolemyII/ptII11.0/ptII/doc/codeDoc/ptolemy/actor/CompositeActor.html).
                        A rewire resets only the affected nodes
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). ASSUMPTION: a gateway, being a
                        node, can be reset alone in the same way.
                        ASSUMPTION: a crossing policy stated on an
                        edge has no node of its own to reset or
                        replace. Strength: moderate; it holds at any
                        size but costs a node per crossing.

