title:                  Crossing policy on the edge
brief:                  |
                        An edge between the two declares how messages
                        that arrive between steps become a token at
                        the start of a step, such as the latest value,
                        all of them in order, or a fold, with an
                        explicit empty token when none arrived. Each
                        step's output goes to an actor as one message.

