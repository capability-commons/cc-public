title:                  Fixed capacity and a loss rule where messages become tokens
brief:                  |
                        Actors can send any number of messages between
                        two steps, in a burst or, from outside, on
                        purpose. A crossing that keeps all of them in
                        order, a gateway's buffer and a director's
                        port buffer each need a fixed capacity and a
                        stated rule for when it is full, or a burst
                        exhausts memory, stalls the step, or makes a
                        step's work grow with what an attacker sends.
                        None of the three options states one yet; any
                        of them can.
description:            |
                        Sources: the edge option offers the latest
                        value, all messages in order, or a fold
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        lines 11-18); a gateway node buffers messages
                        (opt_gateway_nodes_between_semantics.yaml in
                        the same folder, lines 11-15); in the
                        composite option a director at each port turns
                        messages into tokens
                        (opt_one_semantics_per_composite.yaml in the
                        same folder, lines 11-17). Every sequence has
                        a fixed capacity and nothing is allocated on
                        the heap while stepping
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 145-151; bounded sequences as BoundedSeq
                        at line 82 of the same file). "A real
                        application can not have unbounded FIFOs", and
                        blocking writes to full ones may cause an
                        artificial deadlock
                        (https://en.wikipedia.org/wiki/Kahn_process_networks;
                        also the annotation on artificial deadlock in
                        bounded Kahn buffers under the decision on
                        first semantics). Patrol's draft has
                        bounded_counted_loss, a bounded crossing that
                        counts what it drops
                        (_sources/cc-patrol-notes/draft/README.md line
                        49), and its recorder counts units it cannot
                        keep
                        (_sources/cc-patrol-notes/draft/icd/icd_patrol_recorder.yaml
                        lines 108-110). Deliberately caused failures
                        belong to security
                        (_data/register/reg_concern.yaml line 130).
                        Latest-value and fold policies are bounded by
                        their form. Strength: strong; the exposure
                        grows with message rate and with the number of
                        actors feeding one Kahn edge, not with graph
                        size, and bites hardest where actors face the
                        outside world.

