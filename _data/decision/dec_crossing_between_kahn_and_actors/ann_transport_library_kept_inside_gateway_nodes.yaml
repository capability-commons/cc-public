title:                  Transport library kept at one seam in gateway nodes
brief:                  |
                        Where actors are reached across processes or
                        hosts, a transport library such as ZeroMQ is
                        needed. Gateway nodes keep it inside the nodes
                        at the seam, as the drafts already decided for
                        pub-sub, so replacing it touches only them; a
                        crossing policy on the edge puts the crossing,
                        and any transport behind it, into the engine
                        core. This matters only if the decisions on
                        how actors are run and how Kahn steps are
                        spread across cores let a crossing leave the
                        process.
description:            |
                        Sources: functional components never access
                        pub-sub directly; only gateway nodes cross the
                        boundary
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 184-188 and 226-227, decided
                        2026-10-16). Between machines the transport is
                        "very likely ZeroMQ", between processes on one
                        host ZeroMQ or a shared-memory queue (same
                        file, lines 120-128); Patrol needs cross-host
                        edges (_sources/cc-patrol-notes/plan.md lines
                        168-171). libzmq was relicensed from LGPL-3.0+
                        to MPL-2.0 in 4.3.5
                        (https://newreleases.io/project/github/zeromq/libzmq/release/v4.3.5),
                        and MPL-2.0 copyleft applies to files
                        containing MPL code
                        (https://www.mozilla.org/en-US/MPL/2.0/FAQ/);
                        cc-public is Apache-2.0
                        (_data/decision/dec_license/ruling_license.yaml).
                        The edge option makes the engine turn messages
                        into tokens by a declared policy
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        lines 11-18). If actors and Kahn steps always
                        share a process, no cross-process transport
                        library is needed at this crossing, though
                        actors may still need a message queue (the
                        annotation on in-process Kahn steps needing no
                        transport, under the decision on first
                        semantics). Strength: moderate; the seam does
                        not grow with the nodes, but matters only
                        where the crossing leaves the process.

