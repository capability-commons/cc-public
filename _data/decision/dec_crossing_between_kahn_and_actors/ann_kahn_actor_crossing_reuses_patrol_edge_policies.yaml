title:                  Crossing rule as the edge policy Patrol already names
brief:                  |
                        A crossing policy on the edge states exactly
                        which token a Kahn step sees from the messages
                        that arrived, using delivery policies the
                        Patrol draft graph already puts on its edges,
                        so changing it is one field. A gateway node
                        per crossing does the same job a second way,
                        with one node and one edge more per crossing.
                        This rests on the decision on edge policy
                        putting policy on the edge; if that is
                        deferred, this option brings it forward.
description:            |
                        Sources: the edge option "declares how
                        messages that arrive between steps become a
                        token at the start of a step, such as the
                        latest value, all of them in order, or a fold,
                        with an explicit empty token when none
                        arrived"
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        at title and brief). The Patrol draft allows
                        named policies by edge kind, among them
                        latest_value, newest_frame,
                        bounded_counted_loss, ordered and
                        ordered_acknowledged
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 45-51); of the 41 edges of the Patrol
                        base draft, 11 state latest_value and 8 state
                        ordered
                        (_sources/cc-patrol-notes/draft/dfg_patrol.yaml,
                        count of policy lines). Patrol's graph needs
                        capacity, initial tokens and named boundary
                        adapters on edges
                        (_sources/cc-patrol-notes/plan.md lines
                        81-84), and cross-host edges need a declared
                        delivery policy (same file, lines 168-171).
                        The gateway option routes every crossing
                        through a gateway node that buffers messages
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_gateway_nodes_between_semantics.yaml
                        at title and brief). Whether edges state a
                        policy is open in the decision on edge policy,
                        which has no ruling
                        (_data/decision/dec_edge_policy/). Strength:
                        strong for functional suitability and
                        maintainability, and it grows with scale,
                        since each crossing adds one field under the
                        edge option and one node and one edge under
                        the gateway option. For simplicity, a
                        non-driver here, strong if policy goes on the
                        edge and moderate otherwise.

