title:                  Semantics defined at every composite boundary
brief:                  |
                        One semantics per composite follows Ptolemy
                        II, where each level of a hierarchy has its
                        own director and distinct directors compose,
                        so the meaning of every crossing is fixed by
                        an established model of heterogeneous
                        computation rather than chosen edge by edge.
description:            |
                        Sources: Ptolemy II, "Each level of the
                        hierarchy in a model can have its own
                        director", and "distinct directors can be
                        composed hierarchically"
                        (https://ptolemy.berkeley.edu/projects/chess/pubs/892.html).
                        Ptolemy proposes hierarchical heterogeneity in
                        place of amorphous heterogeneity (Eker et al.,
                        Taming Heterogeneity: the Ptolemy Approach,
                        Proc. IEEE, January 2003,
                        https://ptolemy.berkeley.edu/publications/papers/03/TamingHeterogeneity).
                        The option has the director turn messages into
                        tokens and tokens into messages at a
                        composite's ports
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_one_semantics_per_composite.yaml
                        at title and brief). Strength: moderate; the
                        gain is defined semantics at each boundary,
                        and the cost of fitting it to the model is
                        argued separately.

