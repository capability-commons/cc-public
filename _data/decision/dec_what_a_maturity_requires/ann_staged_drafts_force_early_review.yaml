title:                  Staged drafts force early review
brief:                  |
                        Demands listed per level can ask for the same
                        document at several levels: a draft early, an
                        update later and a final version after that.
                        Each level then inspects whatever exists,
                        incomplete or not, so problems surface early
                        and the work is not left to the last moment.
                        Agents make this matter more, since what they
                        draft is not right first time and many
                        problems appear only over time, so the process
                        must review and revise each document
                        repeatedly.
description:            |
                        WTP's argument (WTP, 2026-10-28). Under the
                        numbered Material Life Cycle gates of
                        automotive practice, requirements
                        specifications, test plans and software
                        architecture descriptions had several touch
                        points: a draft at an early gate, an updated
                        draft at another and the final version at a
                        third. Incomplete documents were thereby
                        forced into inspection early, which stopped
                        them being done at the last moment. WTP wants
                        the same for data items: drafts produced early
                        and refined as maturity rises, adapted to
                        agentic workflows without assuming that a
                        language model gets anything right on the
                        first try, so that review and revision are
                        built into each step.

