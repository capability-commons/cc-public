title:                  What a level demands, read in one entry
brief:                  |
                        With demands listed on each level, a change to
                        what a stage requires is an edit to one
                        register entry. A table of pairs repeats that
                        demand in every cell of the stage, so one
                        change touches many entries. Phased objectives
                        scatter the demands of a stage across every
                        criticality entry.
description:            |
                        Sources:
                        - September's criticality register holds ten
                          entries, five levels in each of two
                          dimensions
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision, and
                          origin/main:register/reg_criticality.yaml].
                        - The table option holds one register entry
                          for each pair of a criticality and a
                          maturity
                          [_data/decision/dec_what_a_maturity_requires/opt_table_of_criticality_and_maturity.yaml
                          at brief].
                        - The phased option says that each objective a
                          criticality requires names the maturity from
                          which it is required, and that a maturity
                          alone requires nothing
                          [_data/decision/dec_what_a_maturity_requires/opt_objectives_phased_by_maturity.yaml
                          at brief].
                        - September's criticality entry schema already
                          lets each required objective name the
                          maturity from which it is required, absent
                          meaning from the outset
                          [origin/main:schema/sch_entry_criticality.yaml
                          at the from_maturity property].
                        - The per level option lists, for each level,
                          a coverage floor, every requirement it
                          realizes verified and budgets met, whatever
                          the criticality
                          [_data/decision/dec_what_a_maturity_requires/opt_demands_listed_per_level.yaml
                          at brief].
                        - AGENTS.md asks that each change be small
                          enough to read in one sitting
                          [AGENTS.md#keep-it-small]. Strength:
                          Moderate. With four stages and two
                          dimensions of five levels, a table holds up
                          to forty entries against four. At ten times
                          the size, with more levels or dimensions,
                          the table grows as a product and the gap
                          grows with it.

