title:                  What a maturity requires
brief:                  |
                        How does a maturity say what verification is
                        required of the code that declares it?
description:            |
                        September planned that each objective a
                        criticality requires becomes required at some
                        maturity, so that maturity phases what
                        criticality demands in the end
                        (origin/main:ddr/ddr_maturity.yaml at
                        decision). It left open whether each objective
                        names its maturity or the pair indexes a
                        table. The rulings on coverage and budgets
                        make the overnight run the place where such
                        demands are measured.

