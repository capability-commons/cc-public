title:                  Automation that meets most demands of critical code
brief:                  |
                        The process automation being built, of checks,
                        traces and gates that run on every change,
                        meets many of the demands that safety critical
                        code carries, so critical code need not be
                        handled very differently from the rest.
                        Perhaps only a few demands, such as more
                        intensive use of formal methods, differ by
                        criticality. A simple list of demands for each
                        level of maturity, with some levels adding
                        demands for critical work, holds that
                        difference without a table of every pair.
description:            |
                        WTP's argument (WTP, 2026-10-28).

