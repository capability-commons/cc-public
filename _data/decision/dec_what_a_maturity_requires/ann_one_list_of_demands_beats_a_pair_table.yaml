title:                  One list of demands rather than two or a table
brief:                  |
                        Phasing the objectives of a criticality by
                        maturity keeps one list of demands, with one
                        optional field on each objective it names. A
                        table of pairs multiplies the entries by the
                        number of maturity levels. Demands listed on
                        each level are a second list beside
                        criticality's, unless criticality is not
                        built.
description:            |
                        Sources:
                        - September's criticality entry schema already
                          lets each required objective name the
                          maturity from which it is required, absent
                          meaning from the outset
                          [origin/main:schema/sch_entry_criticality.yaml
                          at the from_maturity property].
                        - September's criticality register holds ten
                          entries, five levels in each of two
                          dimensions
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision, and
                          origin/main:register/reg_criticality.yaml].
                        - The table option holds one register entry
                          for each pair of a criticality and a
                          maturity
                          [_data/decision/dec_what_a_maturity_requires/opt_table_of_criticality_and_maturity.yaml
                          at brief].
                        - September chose phasing because two
                          independent lists of demands would have to
                          be kept consistent by hand
                          [origin/main:ddr/ddr_maturity.yaml at
                          rationale].
                        - The per level option lists, for each level,
                          a coverage floor, every requirement it
                          realizes verified and budgets met, whatever
                          the criticality
                          [_data/decision/dec_what_a_maturity_requires/opt_demands_listed_per_level.yaml
                          at brief].
                        - ASSUMPTION: with ten criticality entries and
                          three or four maturity levels, a table holds
                          thirty to forty entries. Strength: strong if
                          criticality is built, since phasing adds one
                          field and no list. If criticality is not
                          built, the phased option has nothing to
                          phase, and demands per level become the one
                          list. At ten times the size the table grows
                          with each new level of either kind, and the
                          phased form does not.

