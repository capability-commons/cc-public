title:                  A high maturity that demands nothing on its own
brief:                  |
                        Under objectives phased by maturity, a
                        maturity alone requires nothing, and every
                        requirement on dev sits at the base level of
                        criticality, which requires what is required
                        today. So a high maturity would demand no
                        trace that a low one does not, and a product
                        released at the highest maturity would show no
                        more evidence than a sketch. Demands listed on
                        each level make a high maturity require
                        coverage, every requirement a part realizes
                        verified and budgets met, whatever the
                        criticality.
description:            |
                        Sources:
                        - The phased option says that each objective a
                          criticality requires names the maturity from
                          which it is required, and that a maturity
                          alone requires nothing
                          [_data/decision/dec_what_a_maturity_requires/opt_objectives_phased_by_maturity.yaml
                          at brief].
                        - September put everything already written at
                          the base level of both dimensions, which
                          requires what is required today, so that the
                          lever changes nothing on the day it is
                          installed
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - The tool itself takes no criticality, since
                          tool qualification accounts for it
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - Dev holds four requirement items and no
                          criticality type [_data/requirement/, four
                          files, measured by Claude in the cloud
                          container, 2026-10-28].
                        - The per level option lists, for each level,
                          a coverage floor, every requirement it
                          realizes verified and budgets met, whatever
                          the criticality
                          [_data/decision/dec_what_a_maturity_requires/opt_demands_listed_per_level.yaml
                          at brief].
                        - Coverage, profiles and budgets are measured
                          overnight
                          [_data/decision/dec_where_test_evidence_is_measured/ruling_where_test_evidence_is_measured.yaml
                          at brief], and a budget is a requirement
                          with a measure that must have a verifier
                          [_data/decision/dec_home_of_a_performance_budget/ruling_home_of_a_performance_budget.yaml
                          at brief].
                        - WTP's ratchet makes traceability a demand of
                          a high maturity release [owner's statement,
                          2026-10-28].
                        - A test names what it verifies by a verifies
                          edge in a test function item
                          [_data/decision/dec_how_a_test_names_what_it_verifies/ruling_how_a_test_names_what_it_verifies.yaml
                          at brief].
                        - September chose phasing because two
                          independent lists of demands would have to
                          be kept consistent by hand
                          [origin/main:ddr/ddr_maturity.yaml at
                          rationale]. Strength for traceability:
                          Strong for cc-public itself, which is
                          tooling and stays at base criticality.
                          Weaker for a peer segment whose requirements
                          carry criticality, where phasing traces each
                          demand to an objective and its standard. At
                          ten times the size the point holds as long
                          as the tool takes no level. Strength for
                          reliability: strong while criticality is
                          absent or rarely raised, and weaker once
                          many requirements carry a high level. It
                          holds at ten times the size, since most code
                          is expected to sit at the base level
                          [origin/main:ddr/ddr_criticality.yaml at
                          rationale, on spaces widest at the bottom].

