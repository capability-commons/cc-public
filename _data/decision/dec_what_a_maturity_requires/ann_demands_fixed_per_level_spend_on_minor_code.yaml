title:                  Demands that ignore criticality
brief:                  |
                        Demands listed on each level apply whatever
                        the criticality, so a mature module whose
                        failure does not matter must pay for a
                        coverage floor and measured budgets. A table
                        of both, or objectives phased by maturity, let
                        that module ask for little and keep the costly
                        measurement for code that matters.
description:            |
                        Sources:
                        - The per level option lists, for each level,
                          a coverage floor, every requirement it
                          realizes verified and budgets met, whatever
                          the criticality
                          [_data/decision/dec_what_a_maturity_requires/opt_demands_listed_per_level.yaml
                          at brief].
                        - The phased option says that each objective a
                          criticality requires names the maturity from
                          which it is required, and that a maturity
                          alone requires nothing
                          [_data/decision/dec_what_a_maturity_requires/opt_objectives_phased_by_maturity.yaml
                          at brief].
                        - The table option holds one register entry
                          for each pair of a criticality and a
                          maturity
                          [_data/decision/dec_what_a_maturity_requires/opt_table_of_criticality_and_maturity.yaml
                          at brief].
                        - September made the lowest criticality level
                          of each dimension a null level that requires
                          nothing beyond the base
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - Coverage, profiles and budgets are measured
                          overnight
                          [_data/decision/dec_where_test_evidence_is_measured/ruling_where_test_evidence_is_measured.yaml
                          at brief], and a budget is a requirement
                          with a measure that must have a verifier
                          [_data/decision/dec_home_of_a_performance_budget/ruling_home_of_a_performance_budget.yaml
                          at brief].
                        - Coverage per test took 2.6 times the base
                          run in the container
                          [_data/decision/dec_where_test_evidence_is_measured/ann_measuring_at_push_keeps_the_commit_gate_fast.yaml
                          at description].
                        - September expected most of what is built to
                          sit at the low end of the scale, and gave
                          the tool itself no level, so code in
                          cc-public sits at the base
                          [origin/main:ddr/ddr_criticality.yaml at
                          rationale, on spaces widest at the bottom,
                          and at decision]. Strength: moderate.
                          Aggregate coverage costs only about 6 per
                          cent, so the saving comes from per-test
                          coverage, budgets and long property runs. It
                          grows at ten times the size, where those
                          costs grow with the tree under the per-level
                          option.

