title:                  Demands listed per maturity level, with some by criticality
brief:                  |
                        Each maturity level's register entry lists
                        what code at that level must show. On
                        condition: a demand may name the criticalities
                        it applies to, so that a level can place
                        additional demands, such as more intensive use
                        of formal methods, on critical work, while its
                        other demands hold at every criticality. A
                        table of criticality and maturity, and
                        objectives phased by maturity, are rejected.
                        Ruled by WTP on 2026-10-28.

