title:                  Two nodes only where needed
brief:                  |
                        Kinds whose thing and record coincide keep one
                        node. New kinds about something outside the
                        repository are built as a record with a
                        describes edge to a thing node. Concepts and
                        logical components keep one node until a need
                        appears.

