title:                  What an id denotes
brief:                  |
                        Physical things can't carry their ids with
                        them in a way that can be processed, so they
                        need a data item to act as their proxy: a
                        pointer out to the real world, or to the world
                        beyond the graph. The guid and the id are the
                        address of the pointer, not the address of the
                        pointed-at thing. Some relations implicitly
                        dereference the pointer at one or both ends of
                        the edge, so they are relations between the
                        pointed-at things rather than the data items
                        acting as the pointers. Two proxies for one
                        thing are unavoidable in a federated system;
                        we accept it as a fact of life and put the
                        machinery in to deal with it. Ruled by William
                        Payne on 2026-10-21.

