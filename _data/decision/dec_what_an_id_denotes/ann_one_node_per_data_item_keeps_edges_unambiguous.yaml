title:                  One node per data item that keeps edges unambiguous
brief:                  |
                        With two nodes for one subject, every author
                        of an edge has to choose which end to name,
                        and tools have to follow describes edges to
                        answer simple questions. With one node per
                        data item, the choice is made once, by the
                        relation.
description:            |
                        Raised in
                        notes/naming-review/discussion-round-4.md part
                        2; the split would double the concept and
                        logical component nodes. The owner judged on
                        2026-10-21 that none of options 2 to 4 cuts
                        it.

