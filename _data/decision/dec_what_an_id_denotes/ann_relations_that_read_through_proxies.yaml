title:                  Relations that read through proxies
brief:                  |
                        If edges about the world could only join
                        records, a fact such as a part being located
                        in a store would have to be stated between two
                        records. A relation that declares it reads
                        through the proxy at an end keeps such facts
                        about the things, while the edge is still
                        recorded between data items.
description:            |
                        Agreed with the maintainer on 2026-10-21: some
                        relations implicitly dereference the pointer
                        at one or both ends. The default is not to
                        read through.

