title:                  Proxy data items
brief:                  |
                        Every id and guid is the address of a data
                        item. Some types are proxies: their data items
                        point out of the graph, at an external
                        document or a physical thing. A relation may
                        read through the proxy at one or both ends, so
                        that its edges join the things pointed at. Two
                        proxies may point at one thing.

