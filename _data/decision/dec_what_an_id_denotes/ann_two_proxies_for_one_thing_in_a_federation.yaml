title:                  Two proxies for one thing in a federation
brief:                  |
                        Partners will record the same standard or the
                        same part independently, so two proxies for
                        one thing cannot be avoided. Where the thing
                        has an outside identifier, such as a DOI, an
                        ISBN, a URN or a serial number, the same
                        identifier shows the same thing; elsewhere an
                        explicit edge says so.
description:            |
                        The maintainer on 2026-10-21: accept it as a
                        fact of life and put the machinery in to deal
                        with it, as two pointers in C may point at the
                        same memory.

