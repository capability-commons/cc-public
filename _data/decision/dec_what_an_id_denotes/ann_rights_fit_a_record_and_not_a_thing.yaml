title:                  Rights that fit a record and not a thing
brief:                  |
                        Every data item carries a copyright, a license
                        and a protective mark. These describe a
                        record. Read as fields of a spanner, or of an
                        ISO standard that ISO owns, they are nonsense.
description:            |
                        The rights fields come from the standalone
                        schema and are required of every standalone
                        data item. Raised in
                        notes/naming-review/discussion-round-4.md part
                        2 (2026-10-21).

