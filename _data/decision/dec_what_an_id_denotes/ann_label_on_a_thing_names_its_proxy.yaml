title:                  Label on a thing that names its proxy
brief:                  |
                        A physical thing cannot carry an id that the
                        graph can process, but it can carry a label or
                        code holding the guid of its proxy. The label
                        points at the proxy and the proxy at the
                        thing, and the type of the proxy says what
                        kind of thing it points at.

