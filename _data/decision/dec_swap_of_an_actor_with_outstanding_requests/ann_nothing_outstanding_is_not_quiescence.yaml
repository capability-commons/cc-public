title:                  Nothing outstanding that is not yet quiescence
brief:                  |
                        An actor with no request outstanding may still
                        be part way through an exchange of several
                        messages, having answered one and waiting to
                        be asked the next. Swapping it there hands the
                        new version an exchange it did not start.
                        Tranquility, the condition for safe dynamic
                        update, requires besides no outstanding
                        request that the node is not processing one
                        and that no neighbor is in a transaction it
                        has joined and may join again. Waiting for no
                        outstanding requests is safe only for actors
                        whose exchanges are single request and reply.
description:            |
                        Sources:
                        - Tranquility adds to quiescence the condition
                          that none of the node's adjacent nodes are
                          engaged in a transaction in which it has
                          already participated and might still
                          participate (Vandewoude et al. 2007,
                          Tranquility: a low disruptive alternative to
                          quiescence for ensuring safe dynamic
                          updates, section 3).
                        - An idle receiver may still straddle a
                          transaction; isolated-turn guarantees of
                          actors do not extend automatically across
                          several messages (ChatGPT corpus analysis,
                          A-actors.md section A2, 2026-10-28, after De
                          Koster et al. 2016, 43 years of actors).

