title:                  Outstanding requests carried in state
brief:                  |
                        An outstanding request is part of the actor's
                        state, and the state upgrade maps it to the
                        new version, which receives the reply.
description:            |
                        Swaps at once, but every state upgrade of an
                        actor must then map requests, which is the
                        hardest part of dynamic updating to get right
                        (Hicks and Nettles 2005).

