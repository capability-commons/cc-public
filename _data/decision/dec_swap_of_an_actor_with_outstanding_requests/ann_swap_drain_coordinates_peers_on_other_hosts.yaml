title:                  Drain that coordinates peers on other hosts
brief:                  |
                        Stopping new requests to the actor means
                        stopping its peers, which may run on other
                        execution units or hosts, so a drain is a
                        protocol across machines that each transport
                        must carry. Waiting for nothing outstanding
                        and fencing by epoch are decided where the
                        actor runs: the engine counts its open
                        requests, or stamps them and checks the stamp
                        on each reply. The stamp must survive
                        transport nodes, as a sequence or step tag on
                        actor messages would need to anyway to keep
                        order across a proxy, so the fence adds little
                        per platform.
description:            |
                        Sources:
                        - The drain option stops new requests to and
                          from the actor.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_drain_outstanding_requests_first.yaml
                          at brief)
                        - Quiescence of a node needs its passive set,
                          every node that can start transactions on
                          it, to be passivated (Kramer and Magee 1990,
                          The evolving philosophers problem, section
                          on node quiescence).
                        - Point-to-point in-order delivery is not
                          transitive, so a proxy such as an inserted
                          transport node reorders actor messages
                          unless they carry a tag (Menard et al. 2023,
                          High-performance deterministic concurrency
                          using Lingua Franca, section 2).
                        - The flexibility concern asks on which
                          platforms and environments the design runs.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question)
                          ASSUMPTION: actors in one region may be
                          placed on different execution units or
                          hosts, as Kahn nodes may. Strength:
                          moderate; it does not arise while every
                          actor of a region runs in one process.

