title:                  Swap of an actor with outstanding requests
brief:                  |
                        When an actor has sent a request whose reply
                        has not yet come, may it be swapped at the
                        next step, and if so what happens to the
                        request?
description:            |
                        The ruling to swap a node version at a step
                        relies on a step boundary being quiescent, in
                        the sense of Kramer and Magee (1990). For Kahn
                        nodes it is, but an actor's request and reply
                        can span steps, so the boundary is not
                        quiescent for that actor. Tranquility
                        (Vandewoude et al. 2007) is a weaker condition
                        that may never be reached, so it needs a
                        fallback.

