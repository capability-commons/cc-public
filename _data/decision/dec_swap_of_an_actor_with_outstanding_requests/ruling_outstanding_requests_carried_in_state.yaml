title:                  Outstanding requests carried in state
brief:                  |
                        An actor waiting for a reply is swapped like
                        any other node, and what it expects is carried
                        in its state through the state upgrade. Ruled
                        by WTP on 2026-10-29, as recommended: an actor
                        only sends one-way messages, a reply is an
                        ordinary message, and the engine has no notion
                        of an outstanding request.

