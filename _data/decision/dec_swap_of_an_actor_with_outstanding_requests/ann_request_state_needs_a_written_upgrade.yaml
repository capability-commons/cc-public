title:                  Request state that needs a written upgrade
brief:                  |
                        Carrying outstanding requests in state means
                        the upgrade must keep each request's identity,
                        what the actor meant to do with the reply, and
                        its deadline, and the new version must accept
                        replies shaped for the old one. A generated
                        upgrade copies and defaults fields by type,
                        which preserves bytes but not meaning, so the
                        author of each actor kind writes and tests
                        this part of the upgrade.
description:            |
                        Sources:
                        - Hicks et al. generate structural
                          translations, give added fields a default
                          value, and leave a placeholder for the
                          programmer where no conversion can be
                          generated (Hicks et al. 2001, Dynamic
                          software updating, section 3.3.2).
                        - Migrating requests in typed state must
                          preserve request identity, continuation
                          meaning, deadlines and compatibility of
                          eventual replies, not just the state bytes;
                          request continuations are a semantic upgrade
                          obligation (ChatGPT corpus analysis,
                          A-actors.md section A2 and
                          D-change-and-evolution.md section D2,
                          2026-10-28).

