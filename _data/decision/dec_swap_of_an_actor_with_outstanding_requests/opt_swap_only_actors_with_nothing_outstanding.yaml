title:                  Swap only actors with nothing outstanding
brief:                  |
                        A change set that swaps an actor waits until
                        the actor has no outstanding request, and is
                        refused if it cannot be applied within a
                        stated number of steps.
description:            |
                        Keeps the swap at a quiescent point. The bound
                        on waiting stops a busy actor from blocking a
                        change for ever.

