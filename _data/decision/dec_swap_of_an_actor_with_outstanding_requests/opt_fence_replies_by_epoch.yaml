title:                  Fence replies by epoch
brief:                  |
                        The engine stamps each request an actor sends
                        with the epoch of the actor instance, and
                        bumps the epoch when the actor is swapped at a
                        step. A reply that carries a stale epoch is
                        dropped and raises a fault that the trace
                        records, and the new actor sends the request
                        again where it still needs the reply. The swap
                        needs no wait, and the lost reply is declared
                        behavior of the actor kind, not a silent
                        effect.
description:            |
                        From the second round of reading (2026-10-28).
                        MillWheel (Akidau et al. 2013) fences a
                        replaced worker in the same way: a new owner
                        invalidates the old owner's token, and a late
                        write carrying the old token is refused. Only
                        an actor whose requests can safely be sent
                        again may be swapped this way.

