title:                  Epoch fence that refuses late writes, not late effects
brief:                  |
                        In MillWheel the fence is enforced where the
                        effect lands: the store refuses a write
                        carrying an old owner's token, so the stale
                        work never takes effect. Dropping a reply with
                        a stale epoch is weaker, since the service has
                        already acted on the request. The new actor's
                        resend then makes a second effect unless the
                        request is safe to repeat, so the option needs
                        either services that check the epoch
                        themselves or a stated list of requests that
                        are safe to resend.
description:            |
                        Sources:
                        - MillWheel's new workers invalidate any
                          extant sequencers before starting work, so
                          writes from a replaced worker are refused at
                          the store (Akidau et al. 2013, MillWheel:
                          fault-tolerant stream processing at internet
                          scale, section 6.2).
                        - MillWheel fences writes at the store
                          mediator; adapting that idea to dropping
                          late replies does not undo an external
                          action already performed, so epoch fencing
                          with automatic resend needs an explicit
                          duplicate-effect argument (ChatGPT corpus
                          analysis, A-actors.md section A2,
                          2026-10-28).
                        - Only an actor whose requests can safely be
                          sent again may be swapped this way.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_fence_replies_by_epoch.yaml
                          at description)

