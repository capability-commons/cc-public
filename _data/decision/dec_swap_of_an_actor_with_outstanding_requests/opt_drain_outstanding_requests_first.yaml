title:                  Drain outstanding requests first
brief:                  |
                        The change set stops new requests to and from
                        the actor, lets the outstanding replies
                        arrive, and swaps it at the first step after
                        they have.
description:            |
                        The same treatment as tokens still in transit,
                        which are drained rather than converted. It
                        needs the engine to hold back new requests for
                        a while.

