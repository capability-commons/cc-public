title:                  Carrying requests across a swap borrowed only from VM runtimes
brief:                  |
                        A working precedent in the notes for swapping
                        a process with its pending messages intact is
                        Erlang/OTP, where the runtime keeps a
                        suspended process's mailbox and runs a state
                        transform on reload; the IEC 61499 work got
                        live update by compiling to Erlang to use that
                        runtime. A C++17 engine cannot take that
                        runtime, so carrying requests in state would
                        be built in house. The fence follows a
                        published mechanism, MillWheel's sequencer
                        token, and the two waiting options need only a
                        counter or a gate, all small enough to own, so
                        none of the four adds a third-party
                        dependency, and the concern bears weakly on
                        the choice.
description:            |
                        Sources:
                        - Suspended Erlang processes keep receiving
                          messages into their mailbox, and the update
                          suspends the process, loads the new module
                          and transforms its state (Prenzel and
                          Provost 2017, Dynamic software updating of
                          IEC 61499 implementation using Erlang
                          runtime system, sections 2.2 and 3.2).
                        - Erlang/OTP release handling installs
                          upgrades through relup and code_change.
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_live_is_a_code_loading_channel.yaml
                          at description)
                        - MillWheel's fence is a sequencer token that
                          new workers invalidate before starting work,
                          a mechanism rather than a library (Akidau et
                          al. 2013, MillWheel, section 6.2).
                        - Orleans virtual actors persist their state
                          and are activated on demand, which may be a
                          further precedent for swaps (Bernstein et
                          al. 2014, Orleans, as listed in the
                          actor-models reading list of 2026-10-28;
                          citation unverified and from memory, not yet
                          read).
                        - The engine is a new C++ engine, C++17
                          planned (WTP, 2026-10-28).
                        - The dependency risk concern asks what the
                          design takes from third parties.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question)
                        ASSUMPTION: no C++ library supplies the
                        carrying of outstanding requests across a code
                        swap; this has not been surveyed. Strength:
                        weak; no option adds a dependency, and the
                        point is mainly that carrying requests in
                        state has no ready-made part to take.

