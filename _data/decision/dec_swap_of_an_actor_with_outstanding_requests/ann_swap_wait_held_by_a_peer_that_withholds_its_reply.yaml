title:                  Swap of a fixed version held by a peer that withholds its reply
brief:                  |
                        A swap is one way a fixed actor version
                        reaches a running system. When the swap waits
                        for outstanding replies, whoever owes the
                        reply decides when the fix lands: a peer or an
                        outside service that never answers holds a
                        drain open without end, and an actor kept busy
                        with requests is refused after the stated
                        number of steps and stays on the flawed
                        version. Fencing by epoch and carrying
                        requests in state swap at the next step
                        whatever the peers do, so neither lets a peer
                        or an attacker block a change, though the
                        fence serves only actors whose requests are
                        safe to send again.
description:            |
                        Sources:
                        - Drain first lets the outstanding replies
                          arrive and swaps at the first step after
                          they have.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_drain_outstanding_requests_first.yaml
                          at brief)
                        - Swap only actors with nothing outstanding is
                          refused if it cannot be applied within a
                          stated number of steps.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_swap_only_actors_with_nothing_outstanding.yaml
                          at brief)
                        - Tranquility is not guaranteed ever to be
                          reached for a given component, and needs a
                          fallback (Vandewoude et al. 2007,
                          Tranquility, section 5).
                        - A live swap brings new code into a running
                          process.
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_live_is_a_code_loading_channel.yaml
                          at brief)
                        - The security concern asks what an attacker
                          can reach. (_data/register/reg_concern.yaml
                          at entries.concern_security.question)
                          ASSUMPTION: some actors take requests from,
                          or send them to, parties outside the graph
                          whose replies the engine does not control.
                          Strength: moderate; weak for actors that
                          talk only to engine-run peers with bounded
                          handlers, strong for actors that wait on
                          outside services.

