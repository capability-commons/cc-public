title:                  Cost of each swap option in steps of reduced service
brief:                  |
                        Carrying requests in state costs nothing at
                        run time beyond the state upgrade at the step.
                        The fence costs one more round trip for each
                        request it drops, which is at least two steps
                        when a gap admits only the messages waiting as
                        it opens, and the service does the work twice.
                        Draining first stops the actor's new requests
                        for as long as its slowest reply takes, so
                        every step of the drain is a step of reduced
                        service. Waiting for nothing outstanding costs
                        no service but delays the change by an amount
                        not known ahead, up to the stated number of
                        steps, after which the change is refused.
description:            |
                        Sources:
                        - At Patrol's camera rate of 30 Hz a step is
                          about 33 ms, and a request and its reply
                          between two actors take two steps when
                          admission is fixed at the gap start.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_admission_at_the_gap_start_adds_a_step_per_hop.yaml
                          at brief)
                        - The fence drops a reply with a stale epoch
                          and the new actor sends the request again.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_fence_replies_by_epoch.yaml
                          at brief)
                        - In the IEC 61499 case, a suspension during
                          an update lasted about 20 ms against a 100
                          ms cycle (Prenzel and Provost 2017, Dynamic
                          software updating of IEC 61499
                          implementation using Erlang runtime system,
                          section 4.4).
                        - The performance concern measures response
                          time at the 50th and 99th percentiles.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure)
                          Strength: moderate; the costs are small
                          while swaps are rare, and grow with swap
                          frequency and the length of the requests in
                          flight.

