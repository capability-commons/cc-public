title:                  Swap rule that asks nothing of actor authors
brief:                  |
                        Waiting for nothing outstanding and draining
                        first are carried out by the engine from
                        requests it already routes, so for single
                        request and reply exchanges an actor author
                        writes nothing for them. The fence asks each
                        author to establish which requests are safe to
                        send again and to write the resend, and
                        carrying requests in state asks for a written
                        upgrade of each request. Vandewoude et al.
                        keep transaction knowledge in the middleware
                        rather than in component code, and WTP wants
                        the mechanism simple and light on node
                        authors, so on this concern the two waiting
                        options lead.
description:            |
                        Sources:
                        - Adding transaction knowledge to component
                          code increases implicit coupling and hinders
                          reuse, so it is pushed into middleware
                          message tagging (Vandewoude et al. 2007,
                          Tranquility, section 6.3).
                        - Only an actor whose requests can safely be
                          sent again may be swapped by the fence, and
                          the new actor sends the request again where
                          it still needs the reply.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_fence_replies_by_epoch.yaml
                          at brief and description)
                        - Carrying requests in state needs an upgrade
                          written and tested by the author of each
                          actor kind.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/ann_request_state_needs_a_written_upgrade.yaml
                          at brief)
                        - Waiting for no outstanding requests is safe
                          only for actors whose exchanges are single
                          request and reply.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/ann_nothing_outstanding_is_not_quiescence.yaml
                          at brief)
                        - WTP wants the approach pragmatic, as simple
                          as feasible, and free of clever mechanisms
                          that burden node authors (WTP, 2026-10-28).
                        - The maintainability concern asks how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question)
                        Strength: moderate; the waiting options still
                        need the fallback argued elsewhere, and for
                        exchanges of several messages someone must say
                        when an exchange is complete; a fence with an
                        engine-generated resend for requests declared
                        safe would narrow the gap.

