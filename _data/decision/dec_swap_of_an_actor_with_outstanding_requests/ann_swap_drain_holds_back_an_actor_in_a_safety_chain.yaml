title:                  Requests held back from an actor in a safety chain during a drain
brief:                  |
                        Draining first stops new requests to and from
                        the actor for as long as replies take, so an
                        actor that relays a stop or a mode change
                        cannot pass it on during that time. In the IEC
                        61499 case on Erlang, the authors warn that
                        suspending a process that controls an actuator
                        may delay a time-critical answer, and note
                        that an update can be scheduled only in safe
                        states. Swapping only an actor with nothing
                        outstanding never holds its traffic back, and
                        the fence swaps at the next step, so both keep
                        the actor answering; a precondition that the
                        swap waits for a safe state would serve any of
                        the options.
description:            |
                        Sources:
                        - The change set stops new requests to and
                          from the actor while the outstanding replies
                          arrive.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/opt_drain_outstanding_requests_first.yaml
                          at brief)
                        - Suspension of a process that directly
                          controls hardware may delay a time-sensitive
                          answer, such as stopping a motor, and an
                          update can be scheduled to run only in safe
                          states (Prenzel and Provost 2017, Dynamic
                          software updating of IEC 61499
                          implementation using Erlang runtime system,
                          sections 4.4 and 5.2).
                        - The safety concern asks how the design
                          avoids or limits each hazard.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question)
                        ASSUMPTION: an actor can sit on the path of a
                        stop or mode command, as it may where Patrol's
                        commands arrive from outside systems.
                        Strength: moderate; it disappears for actors
                        that no safety function depends on, which a
                        change set could be checked for.

