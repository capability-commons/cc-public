title:                  Seven checks landed as one large change
brief:                  |
                        The checks arrived as one commit of 473 added
                        lines across ten files, twelve minutes after
                        Will picked them. When Will next read the rule
                        program, he said it had made his head swim.
description:            |
                        Will's pick: "Implment rules 1, 2, 3, 4, 5, 6,
                        and 7." (owner's statement,
                        2026-10-13T23:26:20Z). fd6323a is dated
                        2026-10-13 23:38:20 +0000 and changes 10
                        files, 473 insertions and 60 deletions (git
                        show --stat fd6323a). 150d0f7 applied a house
                        style to check.dl; then "That is MUCH better.
                        Thank you! ( It made my head swim a bit before
                        when looking at it)" (owner's statement,
                        2026-10-14T07:10:30Z). Single-letter variables
                        predate the checks (git show
                        ba66f33:src/check/check.dl lines 28-46); the
                        checks grew the file from 91 to 199 lines.
                        ASSUMPTION: Will did not read fd6323a line by
                        line before it was committed. The point bears
                        on how the checks landed, not on whether they
                        are the right ones; seven smaller commits
                        would also have avoided it.

