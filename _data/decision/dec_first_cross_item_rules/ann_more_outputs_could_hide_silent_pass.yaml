title:                  More outputs open to a silent pass
brief:                  |
                        When the rules were chosen, the runner read a
                        missing output file as no failures. The rules
                        took the outputs from 12 to 25, so a fault
                        could hide more checks as a clean pass.
description:            |
                        fd6323a datalog.py lines 186-188. Output
                        counts from the .output lines of check.dl at
                        ba66f33 and fd6323a. Recorded as a bug in
                        memory/MEMORY.md line 53. The clingo runner
                        reads results from the model, not from files,
                        and checks that each shown relation's arity
                        matches its declared columns (datalog.py lines
                        280-288). The fault sits in the runner, not
                        the rules.

