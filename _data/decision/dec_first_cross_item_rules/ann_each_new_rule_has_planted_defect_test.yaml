title:                  Each new check shown to fire on a known defect
brief:                  |
                        Every check added under this option has a test
                        that plants a defect and expects that exact
                        failure, and the whole repository passes. Each
                        check gives the right result in at least the
                        planted case.
description:            |
                        Planted-defect tests for dangling_mention,
                        misplaced_document, misplaced_register_entry,
                        unrecorded_module, cycle,
                        argument_without_concern, alias_in_use,
                        outdated_reference, outdated_mention,
                        schema_count, unused_schema and unused_concept
                        (src/cc_public/check/_test/test_check.py lines
                        557-707). Two carry later names: fd6323a added
                        them as the concern count check (split by
                        aa23286) and misplaced_entry (renamed by
                        dc5f35f). Near-case tests that expect no
                        failure exist for the mention and concern
                        checks (lines 565, 650, 670). The cycle check
                        has no passing-chain test other than the whole
                        repository, which holds 13 r_supports edges
                        (line 227). One planted case does not show
                        that a check never fails a correct item (see
                        ann_mention_rule_keyed_on_prefix_shape).

