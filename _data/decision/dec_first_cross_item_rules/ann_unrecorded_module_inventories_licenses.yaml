title:                  Checked license for every source file
brief:                  |
                        The check that every .py file under src holds
                        an item, with schema validation, makes each
                        source file declare a copyright and an SPDX
                        license.
description:            |
                        unrecorded_module (fd6323a check.dl lines
                        65-69). A python module item is standalone and
                        carries the rights trait, which requires
                        copyright and license (sch_python_module.yaml
                        at allOf.0.$ref; sch_standalone.yaml at
                        allOf.2.$ref; sch_trait_rights.yaml at
                        required and properties.license). Under the
                        other option a file with no header holds no
                        item and meets no schema. It does not cover
                        installed packages or check that a license is
                        true. At 89c74d8 all 37 .py files under src
                        name William Payne and Apache-2.0, so no
                        third-party source is vendored there.

