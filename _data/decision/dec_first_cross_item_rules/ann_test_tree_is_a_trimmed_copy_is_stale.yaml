title:                  Test tree now a trimmed copy of the repository
brief:                  |
                        ann_checker_tests_rest_on_whole_repository
                        says the tree fixture copies the whole
                        repository, so a defect anywhere fails each
                        checker test. The fixture now leaves out every
                        decision folder but two, and every source file
                        that the copy does not name.
description:            |
                        The tree fixture in src/cctool/conftest.py
                        (lines 185-207) copies the repository with an
                        ignore function. Lines 55-62 put frozen copies
                        of dec_cross_item_checks_engine and
                        dec_tooling_language, held in
                        src/cctool/_test/_fixture, in place of every
                        folder of _data/decision. Lines 65-76 keep
                        under src only the files named in
                        TUPLE_SOURCE_KEPT and what they mention in
                        turn. So a defect in another decision folder,
                        or in a source file the copy leaves out, no
                        longer fails the checker tests. A defect in
                        the registers, schemas or other data still
                        does. Found in the review of 2026-10-22.

