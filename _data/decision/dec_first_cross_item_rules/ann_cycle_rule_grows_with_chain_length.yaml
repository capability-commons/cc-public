title:                  Cycle check cost growing with chain length
brief:                  |
                        The cycle check computes every pair joined by
                        a chain of an acyclic relation, so its cost
                        grows with the square of a chain's length. It
                        is cheap only while chains are short.
description:            |
                        cycle and reaches (check.lp).
                        relation_supports and relation_supersedes are
                        acyclic (reg_relation.yaml at
                        entries.relation_supports and
                        entries.relation_challenges.edge). The tree
                        has 13 relation_supports edges. One chain
                        takes 0.019 s at 200 edges and 2.4 s at 2000
                        (scratchpad perf51c.py). WTP plans larger
                        graphs (memory/MEMORY.md line 21). The fix
                        would be local to one rule.

