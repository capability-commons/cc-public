title:                  Wider crash surface from file facts
brief:                  |
                        The checks made every file name in the tree a
                        fact. At the time one file name with a tab or
                        a newline could stop the whole checker, and,
                        once they were built, the edit layer and the
                        gate.
description:            |
                        tree_file rows for every file read (fd6323a
                        extract.py lines 128, 184-203). datalog.write
                        raised ValueError on a tab or newline (fd6323a
                        datalog.py lines 141-143), recorded as
                        uncaught in cctool check (memory/MEMORY.md
                        line 53). The edit layer (c4a8721) and gate
                        (653e172) came on 2026-10-14. The clingo port
                        escapes newlines (logic.py line 79).
                        ASSUMPTION: the recorded fault was reachable
                        through tree_file.

