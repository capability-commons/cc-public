title:                  Mechanical questions taken off the reviewer
brief:                  |
                        The checks turn questions a reviewer would
                        otherwise answer by reading every diff (does
                        this id exist, is this file in the right
                        folder, does this chain loop, does this .py
                        file carry an item, is every concept used)
                        into checker failures. Review attention can go
                        to whether a change is right.
description:            |
                        dangling_mention, misplaced_document, cycle,
                        unrecorded_module and unused_concept
                        (src/cctool/check/check.lp at 89c74d8). The
                        twelve checks of ba66f33 read no ids in prose
                        and no file placement (git show
                        ba66f33:src/check/check.dl). 9c41adb removed
                        two dead prose citations found by hand. Will
                        expects the checks to catch "things that
                        coding LLMs (and humans) easily miss"
                        (maintainer's statement, 2026-10-14T07:22:55Z)
                        and calls the review burden "huge (and
                        practically impossible)" (maintainer's
                        statement, 2026-10-15T10:59:29Z). ASSUMPTION:
                        most of what Will reviews is model-written
                        items and prose. Not measured. The checks do
                        not reduce the volume of change.

