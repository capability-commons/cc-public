title:                  No new third party from the rules
brief:                  |
                        The seven rules add no library, service or
                        tool. They run on the engine, the YAML library
                        and the standard library already in use.
description:            |
                        Dependencies at fd6323a are click, jsonschema
                        and ruamel.yaml, unchanged by the commit (git
                        diff fd6323a^ fd6323a -- pyproject.toml is
                        empty; pyproject.toml did not yet exist at
                        ba66f33). fd6323a adds only the imports re and
                        ruamel.yaml.scalarstring to extract.py. The
                        new checks are rules in check.dl (git show
                        fd6323a --stat).

