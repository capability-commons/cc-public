title:                  Changes spread by completeness and placement
brief:                  |
                        Kernel completeness and file placement make
                        some small changes touch more than one part. A
                        new concept needs an item that names it, and a
                        new folder layout needs a change to the
                        checker.
description:            |
                        unused_concept and unused_schema (check.lp
                        lines 605-643);
                        test_a_new_concept_needs_an_item_that_names_it
                        (src/cc_public/edit/_test/test_edit.py lines
                        151-153). misplaced_document fixes folder and
                        file name (check.lp lines 158-184). When
                        deliberations moved into a folder per
                        decision, check.lp changed by 76 lines added
                        and 13 removed in the same commit (1ba2895).

