title:                  Stale ids caught before an edit lands
brief:                  |
                        The prose-mention and old-id checks let the
                        checker and the edit layer refuse a rename or
                        removal that leaves an id pointing at nothing.
                        Without them a stale id in text is found only
                        by reading.
description:            |
                        The twelve checks of ba66f33 read no ids in
                        prose (git show ba66f33:src/check/check.dl).
                        9c41adb removed two dead prose citations,
                        ddr_annotation and evl_prose_describes, found
                        by hand. fd6323a adds dangling_mention,
                        alias_in_use, outdated_reference and
                        outdated_mention (now check.lp lines 455-519).
                        The checks fd6323a added found defects in the
                        data, such as a fake example guid (fd6323a
                        message, "Fixes they found"). edit.apply
                        writes an edit only if it adds no failure
                        (src/cc_public/edit/edit.py lines 866-890).
                        Will asked for editing tools that keep
                        everything "conformant-by-construction"
                        (owner's statement, 2026-10-13T21:57:52Z). The
                        mention check rests on a regular expression
                        and an exception list (extract.py lines
                        61-76).

