title:                  Checker tests resting on the whole repository
brief:                  |
                        Since the seven checks, 56 of the 59 checker
                        tests copy the whole repository and expect an
                        exact set of failures. A defect anywhere fails
                        each of them.
description:            |
                        Before fd6323a the tree fixture copied only
                        _data (fd6323a^:src/cctool/conftest.py lines
                        55-61). From fd6323a it copies the whole
                        repository "since items in the data mention
                        items in the source" (fd6323a message;
                        conftest.py within TUPLE_SKIP and
                        DIR_DECISION). Tests compare exact failure
                        sets (test_check.py within _replace and
                        test_a_reference_with_a_stale_guid_is_reported).
                        ASSUMPTION: copy time is small today; not
                        timed.

