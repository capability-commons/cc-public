title:                  Wider use of engine string builtins
brief:                  |
                        The checks widen the use of the engine's own
                        string functions, so leaving the engine costs
                        more. That cost was paid a day later in the
                        port to clingo.
description:            |
                        ba66f33 uses the Souffle builtins match and
                        cat only (src/check/check.dl lines 29, 52,
                        58). fd6323a adds substr and strlen and more
                        match and cat (check.dl lines 54-56, 69, 123).
                        Commit 6230e98 (2026-10-14) ported the checks
                        to clingo and made these builtins the Python
                        helpers @match, @cat, @strlen and @substr
                        (check.lp lines 60, 75, 171-183, 209, 469).
                        ASSUMPTION: a future engine would accept the
                        same helpers.

