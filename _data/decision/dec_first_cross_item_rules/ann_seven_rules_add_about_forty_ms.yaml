title:                  Small time cost of the seven checks
brief:                  |
                        The seven checks add about 40 ms to a check of
                        about a second, and stay near a third of the
                        clingo stage as the graph grows.
description:            |
                        Measured by the advocate at 89c74d8 with
                        clingo 5.8.2 (scratchpad perf51.py,
                        perf51b.py, perf51f.py). Full check about 1.1
                        s, peak about 41 MB. clingo stage 0.13 s with
                        all checks, 0.09 s without the seven. With
                        facts copied five and ten times: 0.63 s and
                        1.28 s with, 0.41 s and 0.82 s without.
                        ASSUMPTION: the ratios carry over to Will's
                        2-CPU VM.

