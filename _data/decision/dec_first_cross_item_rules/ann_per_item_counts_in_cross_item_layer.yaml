title:                  Per-item counts in the cross-item layer
brief:                  |
                        schema_count counts the edges of one relation
                        in a single item. That is per-item shape,
                        which the checker gives to JSON Schema, so one
                        kind of job sits in both layers.
description:            |
                        Split recorded as "JSON Schema for per-item
                        shape" and "cross-item checks as Datalog
                        rules" (memory/MEMORY.md line 21).
                        schema_count (check.lp lines 600-604). JSON
                        Schema 2020-12 contains with minContains and
                        maxContains can require one matching edge
                        (validation spec sections 6.4.4, 6.4.5). The
                        check on one concern per annotation was
                        per-item in fd6323a and is cross-item today as
                        argument_without_concern (check.lp lines
                        553-576).

