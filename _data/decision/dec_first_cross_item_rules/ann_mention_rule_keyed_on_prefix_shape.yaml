title:                  Mention rule keyed on prefix shape alone
brief:                  |
                        dangling_mention treats any word with a known
                        prefix as an id and ignores any word with an
                        unknown prefix. A check name that starts with
                        a type prefix fails as a missing item, and an
                        id with a mistyped prefix passes unchecked.
description:            |
                        A mention is any word of up to eight
                        lower-case letters, an underscore and more id
                        characters (src/cc_public/graph/extract.py
                        line 72). dangling_mention reports a mention
                        with a known type prefix that names no item or
                        alias (src/cc_public/check/check.lp lines
                        464-472). concern is a type prefix
                        (_data/register/reg_data_item_type.yaml line
                        506), and the checker has a check whose name
                        starts with that prefix (check.lp lines
                        583-587). A made-up concern id in a
                        description is reported (test_check.py lines
                        557-562), so an item description naming that
                        check would be too. A run on a scratch clone
                        at 89c74d8 confirmed it: that check name in a
                        description was reported as dangling_mention,
                        and a mention with the prefix anm_ passed.
                        "xyz_absent" passes because its prefix is
                        unknown (test_check.py lines 565-570), so a
                        typo such as anm_ for ann_ is not reported.
                        ASSUMPTION: such typos occur; none is
                        recorded. The tree passes every check today
                        (test_check.py line 227). The number of
                        prefixes grows with the number of types.

