title:                  No new kind of mechanism from the rules
brief:                  |
                        The rules add no engine, runner or file kind.
                        They are rules in the existing program, fed by
                        the existing extractor.
description:            |
                        In src, fd6323a changes check.dl, check.py,
                        schema.py, extract.py, conftest.py and the
                        checker tests and adds no module (git show
                        --stat fd6323a). It adds an acyclic field to
                        relation entries. check.dl grows from 91 to
                        199 lines. The rule set survived the port to
                        clingo (memory/MEMORY.md line 54). On a pure
                        count the other option adds nothing and is
                        simpler still.

