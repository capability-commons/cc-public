title:                  Checks for a consistent repository
brief:                  |
                        Will asked for checks that keep the repository
                        consistent as development goes on, and picked
                        checks 1 to 7 of the numbered checks proposed.
description:            |
                        Maintainer's statements. 2026-10-13T23:21:07Z:
                        "Once you are done, can you please suggest any
                        other useful rules which Datalog can support?
                        Things that will help keep the repository in a
                        consistent state as we continue our
                        development?" 2026-10-13T23:26:20Z: "Implment
                        rules 1, 2, 3, 4, 5, 6, and 7." Earlier
                        priority, 2026-10-13T21:47:07Z: "Let's make
                        things internally consistent and clean as our
                        priority." Source: will-messages.md. The
                        assistant's list of proposed checks is not in
                        it; memory records seven proposed checks.
                        ASSUMPTION: eight were proposed, the eighth on
                        commit messages, as the session transcript is
                        said to show. Implemented in fd6323a at
                        23:38:20Z.

