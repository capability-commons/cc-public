title:                  Prose mentions as a second naming mechanism
brief:                  |
                        The mention rules make ids in prose a checked
                        way to name items beside the edges of the
                        relation trait. Naming is then done by two
                        mechanisms, each with its own existence and
                        old-id checks.
description:            |
                        sch_trait_relation calls edges "The single
                        traceability mechanism for the whole
                        repository" (lines 16-18). fd6323a adds
                        dangling_mention beside dangling_reference and
                        outdated_mention beside outdated_reference
                        (now check.lp lines 229-239, 460-472,
                        489-519). Both read the same item and alias
                        facts, so the duplication is in the input.

