title:                  Account of its own
brief:                  |
                        A bot with its own number sees only its own
                        traffic, and the operator alone can register
                        it again or copy it to a test host. A linked
                        bot sees the whole account, depends on that
                        account and its phone, and falls under the cap
                        of 5 linked devices and the 45 day unlink. The
                        number must be kept paid so that no one else
                        can claim it, and each deployment holds its
                        own (ruling_chat_host). Ruled by WTP on
                        2026-10-23.

