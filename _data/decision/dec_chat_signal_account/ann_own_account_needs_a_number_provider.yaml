title:                  An own account adds a phone number provider
brief:                  |
                        A bot with its own account needs a phone
                        number that can take SMS or a voice call, so
                        it adds a carrier or number service as a
                        dependency. It also faces a captcha at
                        registration.
description:            |
                        The own account option registers a phone
                        number of the bot's own
                        [_data/decision/dec_chat_signal_account/opt_account_of_its_own.yaml
                        line 13]. signal-cli registration needs a
                        phone number that can receive SMS or a voice
                        call [context.md, summary of the signal-cli
                        0.14.1 README]. "Registering may require
                        solving a CAPTCHA challenge"
                        [https://ftp.fau.de/gentoo/distfiles/72/signal-cli-bin-0.14.1.README.md].
                        signal-cli says that an account deleted with
                        --delete-account cannot be reactivated
                        [https://mirrors.edge.kernel.org/gentoo/distfiles/f0/signal-cli-bin-0.13.19.signal-cli.1.adoc].
                        ASSUMPTION: if the number lapses and is
                        reassigned, its new holder can register it
                        with Signal and take over the bot's account.
                        The own account does not depend on any other
                        Signal account staying active (ASSUMPTION).
                        Holds at ten times the size: yes, because each
                        bot needs its own number, so ten bots mean ten
                        numbers to keep paid and reachable.

