title:                  Own account repaired by the operator alone
brief:                  |
                        A bot with its own number can be set up again,
                        or copied to a test deployment, by the
                        operator alone. A linked bot needs the holder
                        of the primary phone each time it is linked
                        anew, after a long outage or on a new host.
description:            |
                        The own account option registers a phone
                        number of the bot's own
                        (_data/decision/dec_chat_signal_account/opt_account_of_its_own.yaml
                        line 13), and the linked device option links
                        the bot as a secondary device of an existing
                        account (opt_linked_device.yaml lines 13-14).
                        Maintainability covers how readily the system
                        can be repaired and tested
                        (_data/register/reg_concern.yaml lines
                        376-386). signal-cli registers a number that
                        can receive SMS or a voice call
                        (https://raw.githubusercontent.com/AsamK/signal-cli/master/README.md),
                        and has a link command for joining an existing
                        account instead
                        (https://raw.githubusercontent.com/AsamK/signal-cli/master/man/signal-cli.1.adoc).
                        A linked device unlinks after 45 days of
                        inactivity
                        (https://support.signal.org/hc/en-us/articles/360007320551).
                        ASSUMPTION: linking again needs the primary
                        phone to approve the new device, so the
                        operator cannot restore or reproduce a linked
                        bot without the account holder. The adapter
                        code is about the same under both options; the
                        difference lies in repair and test setup.
                        Holds at ten times the size: yes, because each
                        relink of each bot needs the account holder.

