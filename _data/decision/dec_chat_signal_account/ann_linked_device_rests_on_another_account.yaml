title:                  Linked bot living on another account's terms
brief:                  |
                        A linked bot depends on the primary account
                        staying registered and on Signal's rules for
                        linked devices. These rules cap the number of
                        links and drop a device after a period of
                        inactivity.
description:            |
                        The linked device option links the bot as a
                        secondary device of an existing account
                        [_data/decision/dec_chat_signal_account/opt_linked_device.yaml
                        at brief]. signal-cli has a link command:
                        "Link to an existing device, instead of
                        registering a new number"
                        [https://mirrors.edge.kernel.org/gentoo/distfiles/f0/signal-cli-bin-0.13.19.signal-cli.1.adoc].
                        Signal allows at most 5 linked devices per
                        phone
                        [https://support.signal.org/hc/en-us/articles/360007320551].
                        A linked device unlinks after 45 days of
                        inactivity [same URL]. After linking, the
                        phone need not be online for the linked device
                        to work [same URL]. If the primary account is
                        deleted or re-registered, the bot loses its
                        route. ASSUMPTION: linked devices do not
                        survive the deletion of their primary account.
                        Holds at ten times the size: no, because ten
                        bots linked to one account exceed the limit of
                        5 linked devices per phone.

