title:                  Linked device dependent on another account
brief:                  |
                        A bot linked as a secondary device lives only
                        as long as the primary account keeps it
                        linked, and it unlinks after a long outage. A
                        bot with its own number can be registered
                        again by the operator alone.
description:            |
                        Registering an account of its own needs a
                        phone number that can receive SMS or a voice
                        call, and may need a captcha (signal-cli
                        0.14.1 README,
                        https://ftp.fau.de/gentoo/distfiles/72/signal-cli-bin-0.14.1.README.md).
                        The holder of the primary account can remove a
                        linked device at any time (ASSUMPTION). Holds
                        at ten times the size: yes, because ten bots
                        linked to one account would exceed the limit
                        of 5 linked devices.

