title:                  Linked device sees the owner's whole account
brief:                  |
                        A bot linked to an existing account receives
                        that account's other chats, including those of
                        people who never spoke to the bot, so a
                        compromise of the bot exposes them all. An
                        account of its own sees only messages sent to
                        the bot and confines a compromise to bot
                        traffic.
description:            |
                        The linked device option links the bot as a
                        secondary device of an existing account
                        [_data/decision/dec_chat_signal_account/opt_linked_device.yaml,
                        brief]. Signal says that when a device is
                        linked, all chats and the last 45 days of
                        media can be synchronized from the phone, at
                        the user's choice
                        [https://support.signal.org/hc/en-us/articles/360007320551].
                        Incoming and outgoing messages appear on all
                        linked devices of an account
                        [https://signal.org/blog/a-synchronized-start-for-linked-devices/].
                        A linked device receives new messages of the
                        account as the phone does [ASSUMPTION, from
                        how Signal Desktop works]. The account option
                        registers a phone number of the bot's own
                        [_data/decision/dec_chat_signal_account/opt_account_of_its_own.yaml,
                        brief]. ISO/IEC 29100 sets out data
                        minimization as a privacy principle
                        [_data/register/reg_concern.yaml lines
                        728-734]. ASSUMPTION: the linked account would
                        be the maintainer's or an operator's personal
                        account. Holds at ten times the size: yes,
                        because the other chats of the linked account
                        grow independently of the bot, and each bot
                        linked to a personal account adds a full copy
                        of its traffic.

