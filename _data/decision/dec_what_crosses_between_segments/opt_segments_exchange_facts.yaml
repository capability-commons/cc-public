title:                  Facts
brief:                  |
                        A segment's content crosses as facts of the
                        base predicates the extractor declares, and a
                        consuming segment loads facts only, never
                        rules, however either segment stores its own
                        items. A segment held as files, such as
                        cc-public in its package, may cross as its
                        tree, from which the consumer's cctool
                        extracts the same facts. The base predicates
                        become a supported interface once the first
                        segment ships facts; the derived predicates
                        and the query views over them stay
                        unsupported.
description:            |
                        Context: maintainer's comment (2026-10-22),
                        "it's possible (likely even) that partner
                        segments will use a graph-database or
                        something similar as the backing for their
                        part of the engineering graph."

