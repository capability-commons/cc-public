title:                  No consumer copies to erase under queries
brief:                  |
                        When a segment answers queries, its content
                        stays where it is held, so correcting or
                        removing a person's data there takes effect
                        for every consumer at once. Facts and files
                        both leave copies in each consuming segment,
                        which a removal reaches only when each
                        consumer next reloads.
description:            |
                        Sources:
                        - Under the queries option each segment
                          answers queries from the others through a
                          service
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_answer_queries.yaml,
                          brief).
                        - Under the facts option a consuming segment
                          loads the predicates another segment ships
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_exchange_facts.yaml,
                          brief).
                        - "Some federated segments may hold
                          information which requires them to meet
                          certain security or privacy requirements.
                          For example, PII on DTU members will require
                          compliance with the GDPR." (owner's
                          statement, 2026-10-22)
                        - The GDPR gives a data subject the right to
                          erasure without undue delay (GDPR Article
                          17, https://gdpr-info.eu/art-17-gdpr/).
                        - Assumption: a consuming segment keeps loaded
                          facts or files until it reloads them.
                          Strength: moderate; the gain is real only
                          for segments that hold personal data, and a
                          facts design could add a withdrawal step.

