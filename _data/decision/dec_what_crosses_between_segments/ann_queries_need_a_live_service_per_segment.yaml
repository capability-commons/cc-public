title:                  Live service in every answering segment
brief:                  |
                        Queries need each segment to host a service
                        reachable from every consumer while it checks,
                        so a commit's gate can no longer run over a
                        copy of the staged content alone, and a host
                        without network cannot take part. Each service
                        is new running code to test and a network
                        surface to defend, while cctool's only server
                        today has no authentication, binds to the
                        local host by default and takes forms only
                        from it. Against that, a service scales to
                        segments too large to copy whole.
description:            |
                        Sources:
                        - The queries option has each segment answer
                          queries from the others through a service
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_answer_queries.yaml,
                          brief).
                        - The checks are logic program rules evaluated
                          over the extracted facts (README.md lines
                          22-23 and 54-56).
                        - The gate copies the staged content and runs
                          the check, the lint and the tests over the
                          copy (README.md lines 71-74;
                          src/cctool/gate/gate.py lines 120-152).
                        - The atlas VM has no network (context note,
                          _sources/context.md line 30).
                        - The web server binds to 127.0.0.1 by
                          default, though --host can change it
                          (src/cctool/web/server.py line 65;
                          src/cctool/cli/serving.py lines 45-47),
                          and refuses forms not from a local host
                          (src/cctool/web/server.py lines 159-162
                          and 189-199); it has no authentication.
                        - A standard query protocol exists, which a
                          graph database partner might already offer
                          (SPARQL 1.1 Protocol,
                          https://www.w3.org/TR/sparql11-protocol/).
                        - The owner expects most changes to the graph
                          to move into partner segments over time
                          (owner's statement, 2026-10-22).
                        - Assumption: a consuming segment loads all
                          the facts of a segment it consumes, so what
                          it loads grows with that segment. Strength:
                          moderate; a partner with a SPARQL endpoint
                          pays little, but every other partner pays
                          for a service.

