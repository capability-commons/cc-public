title:                  Ground facts only in a loaded shipment
brief:                  |
                        The checks are logic programs whose input can
                        hold rules as well as facts, so a consumer
                        that loads another segment's predicates must
                        admit ground facts only, or a crafted shipment
                        could change what its checks conclude. It is a
                        condition on the facts option, cheap to meet
                        with a parser that admits only facts.
description:            |
                        Sources:
                        - The checks are written as clingo logic
                          programs (src/cctool/check/check.lp,
                          src/cctool/check/advise.lp).
                        - cctool writes the extracted facts as clingo
                          program text and adds them to the same
                          program as the rules
                          (src/cctool/graph/logic.py lines 307-325
                          and 389-391). Strength: moderate.

