title:                  The data format already ruled public as what crosses
brief:                  |
                        The ruling on the public API makes the data
                        format public and leaves whether the query and
                        fact vocabulary is public to this decision.
                        Files cross in that format, so no second
                        interface has to be declared, versioned and
                        watched by the computed bump. Facts would make
                        the 37 base predicates such an interface,
                        though today they are internal and are
                        extended as checks need them, and after 1.0 a
                        change to their columns could then come only
                        in a major release.
description:            |
                        Sources:
                        - The data format is public, naming YAML 1.2
                          and JSON Schema 2020-12, code is public only
                          where an interface control document declares
                          it, anything not declared public is private,
                          and whether the query and fact vocabulary is
                          public waits on this decision
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml at brief).
                        - The predicate table declares 37 base
                          predicates, among them python_signature,
                          stated and interface_port, which serve the
                          checks of interface control documents
                          (src/cctool/graph/extract.py within PREDICATE);
                          cctool query predicates lists them with the
                          16 predicates derived from them.
                        - After 1.0 a breaking change waits for a
                          major release
                          (_data/decision/dec_breaking_work_after_version_one/ruling_breaking_work_after_version_one.yaml,
                          brief), and the graph computes the bump
                          (_data/decision/dec_version_scheme/ruling_semver_computed.yaml,
                          brief).
                        - 1.0 is "likely to be 6 months or more away"
                          (owner's statement, quoted in the same
                          ruling on breaking work). Strength:
                          moderate; before 1.0 the second interface
                          costs little, and the cost grows from 1.0
                          on.

