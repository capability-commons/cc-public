title:                  Schema validation that reads documents, not facts
brief:                  |
                        cctool check runs its logic rules over the
                        extracted facts, but it validates each YAML
                        document against its schemas over the document
                        itself. A consumer given only facts cannot
                        validate what it consumes and must trust the
                        producer's own gate for it, so a stale or
                        crafted shipment could carry items that break
                        the public data format unseen. A consumer that
                        reads the files runs every check over the
                        union.
description:            |
                        Sources:
                        - cctool check evaluates the logic rules over
                          the facts extracted from the documents, then
                          validates the documents themselves against
                          their schemas with JSON Schema
                          (src/cctool/check/check.py lines 277-288;
                          src/cctool/check/schema.py, brief).
                        - A consumer's gate checks the union of its
                          own roots and what it consumes
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 12-18).
                        - The data format, with its schemas, is public
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml
                          lines 13 and 37-38). Strength: moderate; a
                          producer that gates its own content catches
                          the same faults, and the checks of
                          references across segments still run over
                          facts.

