title:                  Consumed content held locally for the consumer's gate
brief:                  |
                        A consumer's gate checks the union of its own
                        content and what it consumes, over a copy of
                        the staged content, on hosts such as atlas
                        that have no network, and the ruled release
                        gate checks that the built package holds _data
                        and that cctool check passes on it. So
                        cc-public's _data has to reach a peer as a
                        copy in the package, whatever else serves the
                        graph. An MCP service or API for reading the
                        graph can be added beside the shipped files
                        for people and agents, and changes nothing
                        that crosses, but it cannot stand in for them
                        in a gate without a live service at every
                        check.
description:            |
                        Sources:
                        - A consumer's gate checks the union of its
                          own roots and what it consumes
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 12-18).
                        - The gate copies the staged content and runs
                          the check, the lint and the tests over the
                          copy (README.md lines 71-74;
                          src/cctool/gate/gate.py lines 120-153).
                        - The atlas VM has no network (context note,
                          _sources/context.md line 30).
                        - The release gate checks that the built
                          package holds _data and that cctool check
                          passes on the _data it ships
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml
                          lines 24-27).
                        - "if we end up with some sort of MCP service
                          or API for the graph, then it's not clear if
                          we SHOULD put _data in the wheel" (owner's
                          statement, quoted in
                          _data/decision/dec_who_consumes_a_release/ruling_consumers_by_what_they_consume.yaml
                          lines 22-26).
                        - The queries option has each segment answer
                          queries through a service
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_answer_queries.yaml,
                          brief). Strength: moderate; a service for
                          reads is still worth having, and the
                          argument is only that it sits beside the
                          copy, not in place of it.

