title:                  Files until needed
brief:                  |
                        A segment held as files crosses as its tree:
                        cc-public's _data ships in the package, and
                        the consumer's cctool reads it, extracts the
                        facts its checks need and validates the
                        documents against their schemas. The query and
                        fact vocabulary stays unsupported. Ruled by
                        WTP on 2026-10-24, as recommended, rejecting
                        the other options: "for today's purposes it's
                        files". An MCP server is likely soon and a
                        graph database backend eventually; an MCP
                        service or API may serve reads beside the
                        shipped files, and if that changes what
                        crosses, this decision is revisited in full.

