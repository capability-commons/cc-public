title:                  Per-read access control in a query service
brief:                  |
                        A service that answers queries can check who
                        asks and record each answer, which gives the
                        strongest access control and accountability of
                        the three options. It would all be new work,
                        and it could be added later beside a facts
                        exchange for a segment that needs it.
description:            |
                        Sources:
                        - Each segment answers queries from the others
                          through a service
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_answer_queries.yaml,
                          brief).
                        - Federation must let a segment meet security
                          or privacy requirements
                          (_data/logical_component/lco_federation.yaml,
                          description; owner's statement,
                          2026-10-22).
                        - Assumption: a service that holds personal
                          data and answers other segments must
                          authenticate callers and keep a record of
                          what it answered. Strength: moderate.

