protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  No stated form yet for a segment held in a database
brief:                  |
                        Leaving the form open gives a partner that
                        builds its segment on a graph database, which
                        the owner thinks likely, no form to build its
                        export to, and gives a segment holding
                        personal data no way to keep items back but to
                        split its tree, since a file tree crosses
                        whole. A partner that starts before the form
                        is chosen may build its own and then have to
                        change it. This costs little while every peer
                        is the owner's own and every item in cc-public
                        is public.
description:            |
                        Sources:
                        - Partner segments are likely to use a graph
                          database or similar as their backing
                          (owner's statement, 2026-10-22,
                          _sources/context.md line 14).
                        - Some federated segments may hold personal
                          data under the GDPR, and federation must let
                          a segment meet such requirements (owner's
                          statement, 2026-10-22;
                          _data/logical_component/lco_federation.yaml at description).
                        - A consumer that reads files gets every field
                          of every item
                          (_data/decision/dec_what_crosses_between_segments/ann_facts_let_segment_limit_what_leaves.yaml,
                          brief).
                        - "All peers are my own, so this is acceptable
                          for now." (owner's statement,
                          2026-10-22)
                        - Every item in cc-public's _data carries
                          mark_public (a grep of id_mark under _data
                          finds no other mark).
                        - Assumption: a partner held in a database
                          would write its own export if no form is
                          stated. Strength: moderate, rising when the
                          first partner segment not held as files is
                          planned.

