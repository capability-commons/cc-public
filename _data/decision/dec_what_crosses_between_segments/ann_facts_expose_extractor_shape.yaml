title:                  Extractor columns as a published interface
brief:                  |
                        Once facts cross segments, a change to a base
                        predicate's columns is a breaking change for
                        every consumer, and the file and line columns
                        of items and references assume file storage
                        that a graph database segment must imitate. No
                        format for exchanging the rows exists yet, so
                        facts need a stated serialization and a rule
                        for those columns before a partner can produce
                        them without cctool.
description:            |
                        Sources:
                        - The item predicate's columns are id, guid,
                          holder, file and line, and the reference
                          predicate also has file and line
                          (src/cctool/graph/extract.py lines
                          185-192).
                        - Failure reports print each failure with its
                          file and line where they have them
                          (AGENTS.md lines 165-168).
                        - The graph is also exposed as RDF triples
                          under urn:cc: namespaces
                          (src/cctool/graph/sparql.py lines 18-25
                          and 38-52).
                        - Assumption: no command writes the base
                          predicates to a file for another segment;
                          the only JSON dump found serves jq queries
                          (src/cctool/graph/jq.py line 81).
                          Strength: moderate; the gap is a format to
                          define and a coupling to manage through the
                          release's versioning, not a flaw in the
                          choice.

