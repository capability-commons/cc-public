title:                  Reuse of the planned multi-root reader
brief:                  |
                        Reading another segment's YAML as files reuses
                        the reader and the multi-root check already
                        planned, and adds no fact format. It stops
                        working as soon as a segment is not stored as
                        files.
description:            |
                        Sources:
                        - The ruled option has a consumer's gate check
                          the union of its own roots and what it
                          consumes
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 12-18).
                        - The plan names cctool check --root A --root
                          B as the multi-root check
                          (_sources/cc-patrol-notes/plan.md lines
                          65-68).
                        - Partner segments are likely to use a graph
                          database or similar as their backing
                          (owner's statement, 2026-10-22).
                          Strength: moderate; fewest mechanisms today,
                          but a database segment would force a second
                          route.

