title:                  Files until another form is needed
brief:                  |
                        A segment held as files, as cc-public is,
                        crosses as its tree: cc-public's _data ships
                        in the package, and the consumer's cctool
                        reads it and extracts the facts its checks
                        need. Only the data format, already public,
                        crosses, so the query and fact vocabulary of
                        cctool stays unsupported: peers may use it,
                        but a change to it is not a breaking change.
                        The form for a segment not held as files,
                        facts of the base predicates or a query
                        service such as an MCP server or an API, is
                        decided when the first such segment is
                        planned. A service for reading the graph may
                        be added beside the shipped files at any time,
                        without replacing them in a gate.
description:            |
                        Context: the ruling on consumers carries _data
                        in the wheel provisionally, pending this
                        decision, in case an MCP service or API for
                        the graph appears
                        (_data/decision/dec_who_consumes_a_release/ruling_consumers_by_what_they_consume.yaml
                        lines 22-26), and the ruling on the public API
                        leaves whether the query and fact vocabulary
                        is public to this decision
                        (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml
                        lines 43-45). The owner: "We need to decide
                        what crosses between segments first of all."
                        (owner's statement, 2026-10-24). A command is
                        added only when a real instance needs it
                        (_data/decision/dec_growth_policy/ruling_growth_policy.yaml
                        lines 15-16).

