title:                  Facts independent of a segment's backing store
brief:                  |
                        Shipping base predicates lets each segment
                        keep its items in files and git or in a graph
                        database, and change its store later without
                        its consumers changing, since it need only
                        emit the declared rows. Reading files ties
                        every segment to a YAML tree laid out as
                        cc-public's, which a segment held in a
                        database does not have.
description:            |
                        Sources:
                        - "it's possible (likely even) that partner
                          segments will use a graph-database or
                          something similar as the backing for their
                          part of the engineering graph." (owner's
                          statement, 2026-10-22T16:20)
                        - The extractor reads a tree and returns one
                          set of rows for each base predicate, and the
                          predicates and their columns are declared in
                          one place, for logic programs and SQL alike
                          (src/cctool/graph/extract.py lines 18-32
                          and 184).
                        - The files option has a consuming segment
                          read the YAML documents of the other
                          segment's tree as files
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_exchange_files.yaml,
                          brief).
                        - A consumer's gate checks its own items
                          together with everything it consumes
                          (_data/decision/dec_references_across_instances/ann_consumer_checks_the_union.yaml).
                          Strength: strong; the owner names a change
                          of backing as likely, and only the files
                          option cannot follow it.

