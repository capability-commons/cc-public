title:                  Queries
brief:                  |
                        Each segment answers queries from the others
                        through a service, such as a SPARQL endpoint,
                        an HTTP API or an MCP server, and a consumer
                        keeps no copy of its content, so cc-public's
                        _data would not need to ship in the package.
                        The query language the service answers becomes
                        the supported interface between segments.

