title:                  Producer control over what leaves a segment
brief:                  |
                        A segment that ships facts decides which items
                        go into the shipment, each item's protective
                        marks travel with it as facts, and the base
                        predicates carry no title, description or
                        copyright text. A consumer that reads files
                        needs access to the whole tree and gets every
                        field of every item, so a segment holding
                        personal data could not hold any back without
                        splitting its tree. Ids and file paths still
                        cross, so such a segment should not form ids
                        from a person's name.
description:            |
                        Sources:
                        - Federation must let a segment meet security
                          or privacy requirements, such as GDPR for
                          personal data of members
                          (_data/logical_component/lco_federation.yaml,
                          description; owner's statement,
                          2026-10-22).
                        - The base predicates are such as item,
                          reference, edge, alias, mention and
                          term_word, with ids, guids, files and lines;
                          none has a column for the title, description
                          or copyright text of an item, though short
                          texts such as terms and external class
                          labels do appear
                          (src/cctool/graph/extract.py lines
                          184-309).
                        - The extractor reads the text of a field only
                          for the ids, terms and avoided words it
                          mentions (src/cctool/graph/extract.py
                          lines 1277-1365).
                        - Every item carries a copyright field that
                          names a person, for example "Copyright 2026
                          William Payne"
                          (_data/logical_component/lco_federation.yaml
                          line 3).
                        - Protective mark references are extracted as
                          facts that the advisory checks read
                          (src/cctool/check/advise.lp lines 75-79);
                          a partner mark that does not resolve is
                          treated as more restrictive than any
                          resolvable one
                          (_data/register/reg_protective_mark.yaml
                          lines 45-53).
                        - The files option has a consuming segment
                          read the YAML documents of the other
                          segment's tree as files
                          (_data/decision/dec_what_crosses_between_segments/opt_segments_exchange_files.yaml,
                          brief).
                        - The plan records the public mark even for
                          commercially sensitive repositories, so
                          marks alone do not separate sensitive items
                          today (_sources/cc-patrol-notes/plan.md
                          lines 121-123). Strength: strong; the
                          difference in what crosses is visible in the
                          extractor's own predicate table.

