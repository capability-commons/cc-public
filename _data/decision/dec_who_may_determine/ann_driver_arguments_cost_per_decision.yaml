title:                  Running cost of arguments per decision
brief:                  |
                        Letting others determine is safe only because
                        each driver concern is argued first, and those
                        arguments cost something for every decision,
                        in proportion to the number of drivers.
description:            |
                        unargued_driver (src/cc_public/check/check.lp
                        lines 448-453; memory/MEMORY.md line 51).
                        lco_argumentation has five drivers
                        (templates/drivers.txt). Drivers were chosen
                        over per-option "no bearing" annotations to
                        avoid "a LOT of noise" (owner's statement,
                        2026-10-14T19:54:22Z). ASSUMPTION: arguments
                        are written by agent runs, one per driver per
                        decision, each with a model cost; no figure in
                        currency is known. The check applies to every
                        ruling, so this cost is also paid under
                        opt_owner_only.

