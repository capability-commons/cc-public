title:                  Settlement traced to recorded arguments
brief:                  |
                        A ruling fails until each driver of its
                        subject has an argument on the decision, so
                        every settled decision traces back to recorded
                        reasons, whoever determines it.
description:            |
                        src/cc_public/check/check.lp lines 420-453;
                        commit 3d7ef5b: "A ruling is refused until
                        each driver of the subject of an option it
                        settles has an argument". Limit: a ruling
                        settles options with relation_upholds and
                        relation_rejects edges, and since 89c74d8 may
                        carry relation_supersedes to an earlier
                        ruling, but no relation runs from a ruling to
                        the annotations it weighed
                        (reg_relation.yaml), so which arguments the
                        determiner relied on lives only in the brief
                        (_data/schema/sch_ruling.yaml lines 24-28;
                        ruling_cross_item_checks_engine.yaml lines
                        21-36).

