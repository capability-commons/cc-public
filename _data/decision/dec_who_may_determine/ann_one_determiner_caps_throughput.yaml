title:                  Throughput capped by one determiner
brief:                  |
                        Under owner-only, every ruling waits for one
                        person's time, and that cost grows with the
                        number of decisions.
description:            |
                        This exercise has 68 decision work folders
                        (scratchpad/pd/work/). Every commit is
                        authored by William Payne. memory/MEMORY.md
                        line 50: "Only record rulings Will has made".
                        ASSUMPTION: each ruling takes owner time to
                        read the packet and the annotations; the time
                        per ruling is not measured.

