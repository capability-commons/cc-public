title:                  Author check or unchecked rule for owner-only
brief:                  |
                        Owner-only needs either a new check that reads
                        the commit author, which adds a mechanism and
                        build effort, or a rule that lives outside the
                        checked graph. The driver check stays either
                        way.
description:            |
                        No field names who made a ruling
                        (_data/schema/sch_ruling.yaml lines 33-36). No
                        code in src/ reads a commit author; the gate
                        reads git only to check out and archive
                        revisions (src/cc_public/gate/gate.py lines
                        174 and 194). ASSUMPTION: an owner-only rule
                        would be enforced, if at all, by comparing the
                        adding commit's author to William Payne;
                        nothing in the repository proposes this.
                        Merged from the simplicity and cost advocates.

