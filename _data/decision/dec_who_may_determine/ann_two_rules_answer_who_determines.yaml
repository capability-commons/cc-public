title:                  Two disagreeing rules on who determines
brief:                  |
                        The stated principle lets anyone determine,
                        but the working rule records only Will's
                        determinations. Two rules answer one question
                        and disagree, so the chosen way is not yet in
                        practice.
description:            |
                        Owner's statement, 2026-10-14T19:33:44Z
                        (will-messages.md line 689). memory/MEMORY.md
                        line 50: "Only record determinations Will has
                        made", a note for commit 7db4229 at 19:26:27Z,
                        seven minutes before the statement. The only
                        determination so far is by William Payne
                        (6c0a949). Weak against growth; it closes when
                        one rule is retired.

