title:                  Known set of arguments behind each determination
brief:                  |
                        A determination made by someone other than the
                        owner arrives as a small item backed by at
                        least one argument per driver concern, which a
                        reviewer can read and judge.
description:            |
                        unargued_driver (src/cc_public/check/check.lp
                        lines 416-453). A determination carries only
                        the shared fields and a required brief
                        (_data/schema/sch_determination.yaml lines
                        18-28 and 43-46). det_cross_item_checks_engine
                        is a 36-line file; its issue folder holds 19
                        files and 639 lines. Limit: the arguments to
                        read grow with each issue, and the check shows
                        only that an annotation exists, not that
                        anyone read it.

