title:                  Validity frame on the node definition
brief:                  |
                        A substitute node's definition declares the
                        inputs and conditions it is valid for and the
                        properties it reproduces, and a check fails a
                        run whose declared conditions fall outside a
                        frame in its resolved dataflow graph.

