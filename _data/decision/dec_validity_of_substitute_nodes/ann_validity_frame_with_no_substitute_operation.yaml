title:                  Substitution with no substitute operation
brief:                  |
                        The only simulation-like Patrol variant has no
                        substitute operation: it keeps analysis by a
                        filter, then adds a clip reader and joins it,
                        and the operation vocabulary lists no
                        substitute. A frame on the substitute
                        operation would attach to nothing there, and
                        needs a new operation kind first.
description:            |
                        Sources:
                        - The replay variant is a filter to analysis,
                          three adds, among
                          them a clip reader that realizes its own interface control
                          document, and three joins.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines
                          25-63)
                        - The Patrol list of operations has no
                          substitute operation.
                          (_data/decision/dec_vocabulary_of_variant_operations/dec_vocabulary_of_variant_operations.yaml
                          lines 25-29)
                        Strength: strong; the ways of bringing a
                        substitute in grow with the vocabulary.

