title:                  Validity that no check can read
brief:                  |
                        A run inside every frame of its resolved graph
                        is a checkable property, but only if the frame
                        and the run's conditions are facts. Validity
                        stated in prose gives a check nothing to read,
                        a partner nothing machine-readable, and an
                        element nothing to trace to, so a run outside
                        its frame passes unseen.
description:            |
                        Sources:
                        - A run inside every frame of its resolved
                          graph is a checkable
                          property and a natural clingo rule.
                          (_sources/survey/simulation-backed-decisions.md line 13)
                        - Validity is stated only in the prose of the
                          annotation that cites
                          a run. (the prose option, brief)
                        Strength: strong; unchecked runs grow with
                        runs that cite substitutes.

