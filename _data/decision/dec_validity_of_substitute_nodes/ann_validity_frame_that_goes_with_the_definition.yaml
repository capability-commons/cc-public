title:                  Frames that go with the model
brief:                  |
                        A validity frame ties a context to the model
                        valid within it. A frame on the definition the
                        substitute realizes attaches however the node
                        got into the graph and goes wherever the
                        definition is reused, including to a partner
                        who takes the node. A frame on an operation is
                        lost at export, since partner structures such
                        as SSP variants are whole structures with no
                        operations.
description:            |
                        Sources:
                        - Validity frames are defined based on
                          specific contexts and
                          related models. (Biglari and Denil,
                          https://arxiv.org/abs/2303.07144, abstract)
                        - SSP variants are whole alternative SSD
                          files.
                          (https://ssp-standard.org/docs/2.0, chapter 3)
                        - The replay variant brings its substitute in
                          by add and join, not
                          by a substitute operation.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines
                          25-63)
                        - ASSUMPTION: what crosses to a partner is a
                          resolved structure,
                          not the operations that made it.
                        Strength: moderate; it depends on node or FMU
                        exchange for the export part.

