title:                  A frame stated once for each substitute
brief:                  |
                        A frame on the substitute's definition is
                        written once, and every simulation variant
                        that uses it traces to it. On the substitute
                        operation it is repeated in each variant, and
                        in prose in each annotation, so copies can
                        disagree and a change to the valid range
                        touches every copy. A frame on the operation
                        can still suit conditions specific to one use.
description:            |
                        Sources:
                        - A dataflow node is one use of a dataflow
                          step of an interface
                          control document. (_data/register/reg_concept.yaml at entries.concept_dataflow_step.description)
                        - The replay variant's clip reader realizes
                          its own interface
                          control document. (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          lines 28-32)
                        - One option is tried by several variants,
                          such as a sweep or two
                          platforms. (_sources/variants-framing.md line 106)
                        - Maintainability counts parts touched by a
                          representative change.
                          (_data/register/reg_concern.yaml at entries.concern_maintainability.measure.1)
                        Strength: strong; copies grow with simulation
                        variants per substitute.

