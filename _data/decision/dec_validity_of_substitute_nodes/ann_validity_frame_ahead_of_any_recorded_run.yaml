title:                  Frames ahead of any recorded run
brief:                  |
                        A frame on a node definition or on a
                        substitute operation adds a schema section and
                        a check against each run's declared
                        conditions, which needs a vocabulary of
                        conditions that does not exist. Since validity
                        does not compose, frames still need a
                        validation pair, so they are a partial
                        mechanism. Prose adds nothing until the first
                        run cites a substitute.
description:            |
                        Sources:
                        - Validity frames on nodes are necessary, not
                          sufficient.
                          (_sources/survey/simulation-backed-decisions.md line 165)
                        - Validated substitutes do not make a
                          validated simulation variant.
                          (_sources/survey/README.md line 144)
                        - _data holds one dataflow graph, no variant,
                          no run and no run
                          schema. (listing of _data/dataflow_graph and _data/schema;
                          _sources/survey/README.md line 80)
                        - A type, relation, field or command is added
                          only when a real
                          instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml lines
                          13-17)
                        Strength: moderate; it weakens as soon as runs
                        that cite substitutes accumulate.

