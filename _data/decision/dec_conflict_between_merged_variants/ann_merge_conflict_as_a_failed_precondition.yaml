title:                  Merge conflict as a failed precondition, as a doubly fed input is
brief:                  |
                        Refusing a conflict adds no mechanism: it is a
                        precondition of the merge, which the resolver
                        already checks, stopping at the first
                        operation that fails with a report naming it.
                        It also treats a clash on one key as the
                        checks already treat the ruling's own example,
                        two upstream variants using the same port of
                        the same node: if each feeds that input, their
                        edges have different ends, so no keyed merge
                        sees a conflict, and the check of every
                        complete variant refuses the input fed twice.
                        A rule for each kind of conflict adds a
                        vocabulary of conflict kinds and three
                        outcomes to every merge, and still needs
                        refusal for kinds it does not name.
description:            |
                        Sources:
                        - Every variant operation states its own
                          preconditions.
                          (_data/decision/dec_preconditions_of_variant_operations/ruling_every_operation_states_its_preconditions.yaml
                          at brief)
                        - Each operation is checked against its
                          preconditions, and the
                          first that fails stops resolution with a report that names it.
                          (_data/interface_control_document/icd_dataflow_resolver.yaml at
                          surface.python.native.function.resolve.guarantee)
                        - The ruling's example of a conflict is two
                          upstream variants
                          using the same port of the same node.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - An edge is identified by its two ends.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - An input fed by two edges fails the checks,
                          and every complete
                          variant is checked. (src/cctool/check/check.lp within
                          input_fed_twice;
                          _data/decision/dec_which_resolved_graphs_are_checked/ruling_every_complete_variant_checked.yaml
                          at brief)
                        - The rule option names, for each kind of
                          conflict, first wins,
                          last wins or refusal, and refuses kinds it does not cover.
                          (_data/decision/dec_conflict_between_merged_variants/opt_merge_declares_a_rule_for_each_conflict.yaml
                          at brief)
                        - Simplicity asks whether a design does what
                          another mechanism
                          already does, and whether it follows from decisions already
                          made. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.1 and
                          entries.concern_simplicity.question.2)
                        Strength: strong on the count of mechanisms;
                        later-wins also adds only one rule. It says
                        nothing on how an author settles a conflict,
                        the refusal option's weak point.

