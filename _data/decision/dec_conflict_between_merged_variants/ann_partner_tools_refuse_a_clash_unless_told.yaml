title:                  Partner tools that refuse a clash unless told how to merge
brief:                  |
                        Two configuration tools a partner may already
                        use treat a clash as the refusal option does.
                        Kustomize refuses a generated resource whose
                        id a base already holds unless the generator
                        declares merge or replace, and CUE unification
                        gives one result in any order and reports a
                        contradiction naming both sides. A partner can
                        reproduce a refusing merge from the declared
                        merge keys alone, and two implementations
                        agree whenever both succeed; reproducing
                        later-wins also needs the exact order of
                        inputs through nested merges. Kustomize's
                        declared behavior is close to a declared rule,
                        though per resource rather than per kind of
                        conflict.
description:            |
                        Sources:
                        - Kustomize tracks a resource by its original
                          id and refuses a
                          generated resource whose id a base holds unless its behavior is
                          merge or replace.
                          (_data/decision/dec_shape_of_a_variant_family/ann_keyed_merge_as_partner_tools_already_do.yaml
                          at description)
                        - Unification, which an earlier argument
                          sources from CUE's
                          tutorial, gives one result in any order and overrides nothing,
                          and a contradiction names both sides.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_vocab_constraints_that_override_nothing.yaml
                          at brief and description)
                        - A merge that fails on conflict is order free
                          with respect to
                          its sides.
                          (_data/decision/dec_shape_of_a_variant_family/ann_merge_that_fails_on_conflict_is_order_free.yaml
                          at brief)
                        - Every list of the graph schema declares a
                          merge key.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/ruling_merge_key_declared_for_every_list.yaml
                          at brief)
                        - Compatibility asks what a partner must adopt
                          to read and use
                          what the design produces. (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2)
                        ASSUMPTION: no literature note covers
                        Kustomize or CUE; the earlier arguments cite
                        Kustomize's issue tracker and CUE's tutorial.
                        That a partner may already use either tool,
                        and that CUE's report of a conflict names both
                        values, are assumed. Strength: weak to
                        moderate; no partner exchanges variants yet,
                        and the evidence is how two tools behave, not
                        a format either shares.

