title:                  Settlement after a merge that resolution has already refused
brief:                  |
                        The refusal option lets the author settle a
                        conflict after the merge or in one of its
                        inputs. After the merge cannot work as the
                        records stand: resolution stops at the first
                        operation whose preconditions fail, so the
                        operation meant to settle a refused merge
                        never runs. Settling in an input means editing
                        a merged variant, which reaches every other
                        variant that merges it, or writing one's own
                        side to agree before the merge and writing it
                        back after. The ruled port groups show another
                        place: a merge's join commands rename one of
                        two clashing members, so settling commands
                        could ride in the merge as joins do, which the
                        option does not say. Later-wins needs no
                        settlement, and a declared rule needs it only
                        for the kinds of conflict it refuses.
description:            |
                        Sources:
                        - The author settles a conflict with an
                          explicit operation, after
                          the merge or in one of its inputs.
                          (_data/decision/dec_conflict_between_merged_variants/opt_conflicting_merge_refused.yaml
                          at brief)
                        - The first operation whose preconditions fail
                          stops resolution.
                          (_data/interface_control_document/icd_dataflow_resolver.yaml at
                          surface.python.native.function.resolve.guarantee)
                        - To keep its own value against a merged-in
                          one, a variant must
                          first write its side to the incoming value, merge, then write
                          its own value back.
                          (_data/decision/dec_shape_of_a_variant_family/ann_conflict_settled_only_before_the_merge.yaml
                          at brief)
                        - An edit to a merged variant reaches every
                          variant that merges
                          it.
                          (_data/decision/dec_shape_of_a_variant_family/ann_edit_to_a_merged_variant_reaches_every_merger.yaml
                          at brief)
                        - The merge carries the commands that join
                          edges, and two merged
                          branches that add a group member with one key are told apart by
                          guid while the merge's join commands rename one.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief;
                          _data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at brief)
                        - Functional suitability asks whether the
                          functions help users
                          complete their tasks; maintainability counts the parts a
                          representative change touches. (_data/register/reg_concern.yaml
                          at entries.concern_functional_suitability.question.2 and
                          entries.concern_maintainability.measure.1)
                        Strength: strong against the option as worded;
                        it falls away if the merge may carry settling
                        commands for named keys, which keeps refusal
                        as the default and needs no rule per kind.

