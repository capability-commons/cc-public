title:                  Fixed winner by position that undoes one side's edit
brief:                  |
                        The records define no three-way merge against
                        a common base, and without one a merge cannot
                        tell a value that one side edited from a base
                        value that the other side only kept. Two
                        variants of one base both hold every base node
                        and edge they did not remove, so whichever
                        position wins, a merge in one of the two
                        directions silently puts the untouched base
                        value back over an edit. The trial did this:
                        the merging variant's base edge displaced the
                        merged variant's keep_latest policy with no
                        error. Refusing the conflict names the element
                        instead, and a declared first-wins or
                        last-wins rule keeps the fault for each kind
                        of conflict it covers.
description:            |
                        Sources:
                        - The ruling has dataflow variants with no
                          common element merge
                          without a three-way merge against a common base, and says
                          nothing of a three-way merge for variants that share one.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Variants of one root share the ids of the
                          nodes their base
                          declares, so a merge that is not three-way cannot tell a
                          removal from an addition.
                          (_data/decision/dec_shape_of_a_variant_family/ann_two_way_merge_restores_what_one_side_removed.yaml
                          at brief and description)
                        - In the trial, merging a variant that had cut
                          an edge and joined
                          it again with keep_latest left the merging variant with the
                          base edge and no policy, and dropped what the merged variant
                          added to the recording list, with no error.
                          Nodes, hosts and units held differently were refused, but
                          edges and top-level fields were kept from the receiving side.
                          (review of 2026-10-29, CC-007 and area report trial-model,
                          TM-03, probe p06; trial 2c777ab9,
                          src/cctool/dataflow/resolve.py, function _merge)
                        - An edit to a merged variant reaches every
                          variant that merges
                          it, and only a conflict fails, at the merge.
                          (_data/decision/dec_shape_of_a_variant_family/ann_edit_to_a_merged_variant_reaches_every_merger.yaml
                          at brief)
                        - Functional suitability asks whether the
                          design does anything
                          it should not. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.3)
                        Strength: strong for merges of variants that
                        share a base, which Patrol's family is built
                        from; weak for pieces with no element in
                        common, where conflicts are rare. Refusal pays
                        for it with a conflict for every base element
                        that one side edited, each to be settled by
                        hand. It would weaken if the merge were
                        three-way against the common base, or used the
                        origin trace to tell an edited value from a
                        kept base value, which no option proposes.

