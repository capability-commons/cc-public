title:                  Conflict between merged variants
brief:                  |
                        When a merge operation joins variants that
                        disagree, such as two values for one setting
                        or two delivery policies for one edge, which
                        wins?
description:            |
                        The ruling on the shape of a variant family
                        makes merge an atomic operation that selects
                        several models and joins them, and leaves the
                        rules for a conflict to be worked through
                        during implementation
                        (ruling_family_as_a_graph_of_edits_with_merge).
                        The trial implementation of 2026-10-29 let the
                        later input win silently, dropped the records,
                        the edge policies and the origin of the merged
                        inputs, and left them out of the input digest
                        (review of 2026-10-29, CC-007).

