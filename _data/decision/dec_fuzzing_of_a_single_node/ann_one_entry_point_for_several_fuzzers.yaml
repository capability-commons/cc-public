title:                  One entry point for several fuzzers
brief:                  |
                        The libFuzzer entry point, one function taking
                        a buffer of bytes, is also run by AFL++ and by
                        Honggfuzz, so a harness written to it is not
                        tied to one fuzzer, and a fuzzer can be
                        swapped without touching harnesses. A harness
                        that runs one step in the same process, with
                        no allocation since the buffers are fixed,
                        runs many thousands of times a second, where a
                        whole graph runs at the pace of its slowest
                        node.
description:            |
                        Sources:
                        - AFL++ documentation, fuzzing in depth:
                          harnesses written for libFuzzer can be
                          compiled and run with AFL++.
                          https://aflplus.plus/docs/fuzzing_in_depth/

