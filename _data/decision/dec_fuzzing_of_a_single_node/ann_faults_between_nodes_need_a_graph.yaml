title:                  Faults between nodes that need a graph
brief:                  |
                        A node fuzzed alone sees any input its
                        interface allows, including inputs no real
                        producer sends, and none of the faults that
                        come from how nodes interact, such as a mode
                        change reaching nodes at different steps. Some
                        fuzzing of whole graphs or subgraphs is still
                        needed for those, though it complements
                        fuzzing single nodes rather than replacing it.
description:            |
                        Sources:
                        - The flag travels with the data, so each node
                          samples it at its own step, and a change
                          must reach every node within a stated number
                          of steps.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief)

