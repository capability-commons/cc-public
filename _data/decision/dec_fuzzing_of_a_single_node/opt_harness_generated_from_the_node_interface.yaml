title:                  Harness generated from the node interface
brief:                  |
                        The generator writes a harness for each node
                        kind from its declared interface. The harness
                        decodes the fuzzer's bytes into the inputs of
                        a step, each a bounded array of up to its
                        capacity, including a count of 0, together
                        with any mode port, runtime-service port and a
                        value of the declared state type, and runs a
                        sequence of steps against buffers the harness
                        owns as the engine would. It checks that no
                        step crashes or trips a sanitizer, that each
                        output stays within its declared maximum
                        items, and that the same inputs give the same
                        outputs. The harness has the libFuzzer entry
                        point, which AFL++ also runs, and a stateless
                        node is fuzzed one step at a time.
description:            |
                        Proposed to WTP on 2026-10-28. It needs
                        nothing from node authors beyond the
                        declarations the rulings already ask for.

