title:                  Fuzzers that reach deeper into small units
brief:                  |
                        A coverage-guided fuzzer explores the branches
                        of what it runs, and the deeper a branch sits
                        behind other branches, the less often random
                        mutation reaches it. One node in its own
                        harness is a small unit with few paths, so the
                        fuzzer reaches its deep branches; the same
                        node inside a whole graph sits behind every
                        node upstream of it, and most mutations are
                        spent there. Fuzzing nodes one at a time is
                        what makes fuzzing worthwhile for faults that
                        would otherwise reach a deployed system.
description:            |
                        Sources:
                        - Fuzzing tools such as American Fuzzy Lop
                          work much better when the system under test
                          is smaller and less complex in the McCabe
                          sense, so the aim was to isolate individual
                          nodes in their own harness and fuzz them
                          individually (WTP, 2026-10-28).

