title:                  Fuzzing of a single node
brief:                  |
                        How is one dataflow node isolated in a test
                        harness so that a coverage-guided fuzzer, such
                        as American Fuzzy Lop, can fuzz it on its own?
description:            |
                        One of the original motivations for
                        Stableflow, and for configurable
                        component-oriented design generally, was to
                        use fuzzing tools such as American Fuzzy Lop,
                        which work much better when the system under
                        test is smaller and less complex in the McCabe
                        sense; the design aim, never realized, was to
                        isolate individual nodes in their own test
                        harness and fuzz them one at a time, making
                        fuzz testing as a whole much more attractive
                        and useful (WTP, 2026-10-28).

