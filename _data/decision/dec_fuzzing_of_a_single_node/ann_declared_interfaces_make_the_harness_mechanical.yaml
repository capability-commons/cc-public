title:                  Declared interfaces that make the harness mechanical
brief:                  |
                        Under the rulings, everything a node reads in
                        a step is declared and bounded: messages are
                        bounded arrays of fixed-size elements, the
                        engine owns every buffer, and node state is
                        typed data the engine holds. So the space of a
                        step's inputs is known from the interface, and
                        a harness that decodes bytes into it can be
                        generated, kept in step with the interface by
                        construction. A hand-written harness repeats
                        the interface, drifts when it changes and is
                        skipped when time is short.
description:            |
                        Sources:
                        - Each message on an edge is an array of
                          elements of one fixed-size type, with a
                          length that varies per message up to a
                          capacity the port declares.
                          (_data/decision/dec_how_values_of_varying_size_are_held/ruling_bounded_array_of_fixed_size_elements.yaml
                          at brief)
                        - The engine, or the generator in a static
                          build, allocates the buffers of each edge
                          from the port types.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief)

