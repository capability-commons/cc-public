title:                  Field reports traced to the graph that ran
brief:                  |
                        The owner wants to respond to reported
                        problems quickly and largely automatically,
                        which needs the exact variant, commit and
                        resolved graph a host ran when it failed. A
                        record for each deployment event keeps that.
                        With no record it is asked of the person who
                        deployed, and a report from Patrol's first
                        laptop has no graph to match.
description:            |
                        Sources:
                        - I'd like to be able to respond to reported
                          problems quickly and
                          largely automatically. (owner's statement, 2026-10-22,
                          _sources/context.md line 24)
                        - A deployment record names variant, host,
                          commit and resolved
                          digest. (_sources/variants-framing.md line 70)
                        - Maintainability covers how readily the
                          system is repaired.
                          (_data/register/reg_concern.yaml at entries.concern_maintainability.brief)
                        - The Legion variant runs on the customer's
                          laptop.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml lines
                          12-16)
                        - Current tools lack native support for
                          variant-aware deployment.
                          (Weiss et al. 2025, https://arxiv.org/html/2507.19446v1, section
                          II-B; summarized in _sources/survey/generative-and-transforms.md
                          lines 109-110)
                        - ASSUMPTION: no Patrol variant is deployed
                          yet, so deferral costs
                          nothing until one is.
                        Strength: weak now, strong once more than one
                        host runs a variant and updates multiply.

