title:                  A deployment record deferred, then shaped like a run
brief:                  |
                        No deployment from cc-public exists, so
                        deferring adds nothing. If a record is needed,
                        one for each deployment event reuses the run
                        record's shape, one mechanism for two jobs. An
                        item per host holds current state overwritten
                        at every deployment, a new kind of item in a
                        tree whose items are otherwise records.
description:            |
                        Sources:
                        - The event option is shaped like a run
                          record. (the per-event
                          option, brief)
                        - The per-host item names what a host runs
                          now. (the per-host
                          option, brief)
                        - Who made a ruling, and when, is left to
                          commits.
                          (_data/schema/sch_ruling.yaml lines 33-35)
                        - ASSUMPTION: no item in _data today holds
                          state that is
                          overwritten on each event.
                        - A type, relation, field or command is added
                          only when a real
                          instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml lines
                          13-17)
                        Strength: moderate; it turns once the first
                        over-the-air update exists.

