title:                  A host item that lags a mode switch
brief:                  |
                        An item for each host that says what it runs
                        now is wrong after a mode switch or an update
                        until someone commits a change, and it holds
                        what ran at the time of a failure only through
                        git history.
description:            |
                        Sources:
                        - The per-host item names what a host runs
                          now. (the per-host
                          option, brief)
                        - One open option of the run-time mode
                          decision has a deployment
                          switch among a named set of pre-resolved modes.
                          (_data/decision/dec_runtime_mode_set/opt_named_set_of_pre_resolved_modes.yaml
                          lines 12-16)
                        - Author and time come from git.
                          (_data/decision/dec_author_and_time_of_items/ruling_author_and_time_of_items.yaml
                          lines 12-14)
                        Strength: strong once a deployment switches
                        modes or takes updates.

