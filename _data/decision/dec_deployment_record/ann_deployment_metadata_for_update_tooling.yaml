title:                  Variant metadata that update tooling matches on
brief:                  |
                        Over-the-air middleware for software-defined
                        vehicles matches artifacts to vehicles by
                        metadata that includes the variant
                        configuration. Either kind of record gives a
                        partner's tooling that metadata, and deferring
                        gives it none.
description:            |
                        Sources:
                        - The cloud middleware determines
                          artifact-to-vehicle compatibility
                          from metadata such as software type and variant configuration.
                          (Weiss et al. 2025, https://arxiv.org/html/2507.19446v1)
                        Strength: weak now; moderate once a partner's
                        update tooling is involved.

