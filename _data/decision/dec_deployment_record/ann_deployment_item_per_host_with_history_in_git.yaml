title:                  A host item with its history in git
brief:                  |
                        An item for each host gives the current state
                        in one place, is overwritten in place at each
                        deployment, and keeps its past in git, so a
                        maintainer can still find what a host ran,
                        more slowly than from a record per event.
description:            |
                        Sources:
                        - The per-host item names the variant, commit
                          and resolved digest a
                          host runs now. (the per-host option, brief)
                        - Author and time come from git.
                          (_data/decision/dec_author_and_time_of_items/ruling_author_and_time_of_items.yaml
                          lines 12-14)
                        - ASSUMPTION: cctool query reads the current
                          tree, not past
                          commits.
                        Strength: weak; weaker than a record per
                        event, and weaker still at ten times the
                        hosts.

