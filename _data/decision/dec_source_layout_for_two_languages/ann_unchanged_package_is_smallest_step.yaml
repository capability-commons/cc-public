title:                  Unchanged package as the smallest step
brief:                  |
                        Adding a dataflow_engine folder beside
                        cc_public changes no module id, no import and
                        not the cctool command, so no existing check
                        or command changes its result and the change
                        that brings in C++ stays in the new folder. It
                        keeps the two names for the tooling.
description:            |
                        Sources:
                        - Module ids follow from the path under src
                          (AGENTS.md lines
                          110-112; src/cc_public/graph/extract.py lines 723-741).
                        - The package is cc_public and the command is
                          cctool
                          (pyproject.toml lines 51 and 62).
                        - pytest collects tests under src with src on
                          the path
                          (pyproject.toml lines 113-114).
                        - The gate treats any path under src as code,
                          so C++ there is
                          gated as code under all three layouts
                          (src/cc_public/gate/gate.py lines 94-99 and 173-191).
                        - Owner's statement, 2026-10-22T15:10:
                          rearranging the cc-tool
                          source "may" be required.
                        - Strength: moderate for maintainability; weak
                          for simplicity
                          and functional suitability, since it shows the absence of a
                          cost now more than a gain, and the rename's costs are
                          temporary.

