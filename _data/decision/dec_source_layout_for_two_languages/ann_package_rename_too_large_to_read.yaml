title:                  A rename too large to read in one sitting
brief:                  |
                        Renaming cc_public to cctool renames about 180
                        ids of modules, programs and the functions and
                        predicates in them, and touches about 2,500
                        lines across more than a hundred files, far
                        more than a person reads in one sitting, and
                        the part outside YAML must be changed and read
                        by hand. Leaving cc_public as it is adds the
                        engine folder with no rename at all.
description:            |
                        Sources:
                        - 183 distinct ids of modules, packages, logic
                          programs and the
                          functions and predicates in them contain cc_public, named in
                          106 files under _data and src (grep over the snapshot,
                          2026-10-22).
                        - 2,573 lines in _data, src, README.md,
                          AGENTS.md and
                          pyproject.toml contain cc_public (grep -c over the snapshot,
                          2026-10-22).
                        - cctool rename changes every YAML document
                          that names an id and
                          lists other files, such as tests, that must be changed by hand
                          (AGENTS.md lines 124-128).
                        - The repository asks that each change be
                          small enough to read
                          in one sitting (AGENTS.md lines 234-238).

