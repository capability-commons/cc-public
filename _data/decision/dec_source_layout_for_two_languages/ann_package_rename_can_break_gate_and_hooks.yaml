title:                  Missed references that stop the gate or hooks
brief:                  |
                        Renaming cc_public changes the entry point of
                        the cctool command that every hook runs, the
                        gate's own command line, every module id and
                        the pixi manifest. cctool rename refuses the
                        id of a module or a logic program, so every
                        reference is moved by hand or by script, and
                        one missed reference leaves the gate or the
                        hooks unable to run. Every hook runs pixi with
                        --locked, so after the manifest changes the
                        hooks refuse until the owner relocks. If the
                        rename is wanted, now, before any release, is
                        the cheapest time.
description:            |
                        Sources:
                        - The gate runs the checker as -m
                          cctool.cli.command
                          (src/cctool/gate/gate.py line 87; AGENTS.md line 39).
                        - cctool rename lists files that still name
                          the old id outside a
                          YAML document, to be changed by hand (AGENTS.md lines
                          124-128).
                        - The pixi manifest names the editable package
                          cc_public
                          (pyproject.toml line 62), and any edit to pyproject.toml needs
                          a relock only the owner can do (context note,
                          _sources/context.md line 30).
                        - No release has ever been made (context note,
                          _sources/context.md line 33).
                        - Strength: weak; the risk is one-off and the
                          gate would catch
                          most misses at once.

