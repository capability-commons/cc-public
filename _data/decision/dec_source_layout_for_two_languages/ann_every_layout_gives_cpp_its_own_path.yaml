title:                  A path prefix of its own for the C++ in every layout
brief:                  |
                        The gate chooses what to run from the paths a
                        commit stages, and each of the three layouts
                        puts the C++ under a prefix of its own, so
                        each lets the gate build C++ only when C++ is
                        staged. The layouts do not differ in how the
                        gate can choose to build the C++.
description:            |
                        Sources:
                        - The gate chooses its stages from the staged
                          paths, matched
                          against src/, pyproject.toml, pixi.lock and .githooks/
                          (src/cc_public/gate/gate.py lines 94-99 and 173-191).
                        - The three layouts put the C++ under
                          src/dataflow_engine,
                          src/cpp and src/dataflow_engine (option briefs under
                          _data/decision/dec_source_layout_for_two_languages/).
                        - Strength: weak; it finds little difference
                          among the options.

