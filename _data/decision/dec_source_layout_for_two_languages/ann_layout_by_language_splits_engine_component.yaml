title:                  Engine component split across two language trees
brief:                  |
                        The dataflow engine component holds a Python
                        generator and a C++ engine, so a by-language
                        layout puts one component in two trees and a
                        change to it touches both. Folders by
                        component use one axis of layout where a split
                        by language adds a second that such a
                        component must straddle.
description:            |
                        Sources:
                        - The dataflow engine component covers the C++
                          engine and the
                          generator (_data/logical_component/lco_dataflow_engine.yaml
                          lines 12-15).
                        - The schedule generator is planned as tooling
                          that emits C++
                          for the engine (_sources/cc-patrol-notes/plan.md lines
                          103-105; _sources/cc-patrol-notes/variants.md lines 92-95).
                        - Strength: moderate; it depends on how much
                          code spans both
                          languages.

