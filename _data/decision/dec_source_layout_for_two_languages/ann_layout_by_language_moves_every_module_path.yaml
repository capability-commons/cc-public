title:                  Moved paths and module ids under a by-language split
brief:                  |
                        Module ids follow from the path below src, so
                        moving the Python package under src/python
                        changes every module id unless the derivation
                        changes too, and moves every Python file even
                        though no behavior changes. Until every
                        reference follows, the checks that tie items
                        to modules report faults the move caused, and
                        every later diff path differs.
description:            |
                        Sources:
                        - The id of a module is its prefix and the
                          dotted path below
                          src, and module_name strips only a leading src folder
                          (AGENTS.md#changing-data-items; src/cctool/graph/extract.py within DIR_IMPORT_ROOT and module_name).
                        - There are 183 distinct ids of modules,
                          packages, logic
                          programs and the functions and predicates in them containing
                          cc_public, in 106 files under _data and src (grep over the
                          snapshot, 2026-10-22).
                        - src holds 92 files, 80 of them Python (find
                          over the snapshot,
                          2026-10-22).
                        - pytest's pythonpath and testpaths, and the
                          gate's lint stage
                          and source dir, name src (pyproject.toml at tool.pytest.ini_options.testpaths and tool.pytest.ini_options.pythonpath;
                          src/cctool/gate/gate.py within TUPLE_CODE).
                        - Strength: strong for maintainability;
                          moderate for functional
                          suitability and reviewability, since the breakage is
                          mechanical and temporary and the owner tolerates renames
                          before 1.0 (owner's statement, 2026-10-21, _sources/context.md
                          line 26).

