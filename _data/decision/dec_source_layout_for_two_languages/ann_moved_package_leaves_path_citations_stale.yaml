title:                  Path citations left pointing nowhere by a moved package
brief:                  |
                        The layout by component and the layout by
                        language both move the folder src/cc_public,
                        and 577 annotations cite a file under it as
                        their evidence. A path written in prose is not
                        an id, so no command follows the move, and
                        each citation then names a file that is not
                        there until it is rewritten. A rewrite by
                        script keeps every line number, since a move
                        changes no line, but it adds those 577
                        arguments to the change a person must read.
                        Leaving cc_public where it is moves no cited
                        path.
description:            |
                        Sources: 577 annotation files under
                        _data/decision, 1,070 lines in all, cite a
                        path that starts with src/cc_public (grep over
                        dev at e46c32b5, 2026-10-23). cctool rename
                        changes the YAML documents that name an id,
                        and refuses the id of a python module,
                        package, class or function, or of a logic
                        program file or predicate, saying to move the
                        file by hand (src/cctool/edit/edit.py lines
                        908 and 1072-1083; AGENTS.md lines 124-128). A
                        condition is stated with its date and source
                        inside the argument that rests on it
                        (_data/decision/dec_changing_conditions_in_arguments/ruling_changing_conditions_in_arguments.yaml,
                        brief), and a review against the current tree
                        adds what went stale before a person rules
                        (_data/decision/dec_concern_advocate_process/ruling_concern_advocate_process.yaml,
                        brief). Each change is to be small enough to
                        read in one sitting
                        (_data/decision/dec_growth_policy/ruling_growth_policy.yaml,
                        brief; AGENTS.md lines 234-238). Assumption:
                        the rewrite would be one sed over
                        _data/decision in the same commit as the move.
                        Strength: moderate; the rewrite is mechanical,
                        but it edits the evidence of hundreds of
                        arguments at once. Drafted by Claude in the
                        review of 2026-10-23, for William Payne to
                        accept or strike.

