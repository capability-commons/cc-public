title:                  Checked Rename commits narrowing what is read
brief:                  |
                        A mechanical rename is large in lines but can
                        be judged without reading every line, since a
                        Rename commit must neither add nor remove and
                        the commit check detects renames. Done as pure
                        Rename commits apart from any other change,
                        its size counts against the renamed layout
                        less than its line count suggests, though the
                        hand-edited code still has to be read.
description:            |
                        Sources:
                        - Rename and Move neither add nor remove
                          (AGENTS.md#before-you-finish).
                        - The commit check already detects renames and
                          removals (context
                          note, _sources/context.md line 34).
                        - The commit-msg hook checks the commit
                          against the graph before
                          and after it (AGENTS.md#before-you-finish).
                        - The owner tolerates renames and prefix
                          changes before 1.0
                          (owner's statement, 2026-10-21, _sources/context.md line 26).
                        - Assumption: the commit check does not verify
                          hand-edited files
                          outside YAML documents, such as Python imports and tests.

