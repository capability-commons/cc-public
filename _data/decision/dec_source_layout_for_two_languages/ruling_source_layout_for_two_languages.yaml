title:                  Layout by component, with the tooling renamed
brief:                  |
                        One folder per component under src: the Python
                        tooling renamed from cc_public to cctool, and
                        the engine in dataflow_engine, with its
                        generator, shipped in the same package that
                        peers install. Ruled by William Payne on
                        2026-10-23, against the recommendation to keep
                        cc_public: "Let's do the rename now. Get it
                        done and over with." The engine ships with
                        that package because "it's all part of the
                        same product", and the generator goes "along
                        with the rest of the engine code".

