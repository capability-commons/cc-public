title:                  Fit with hatchling's default package discovery
brief:                  |
                        hatchling finds the package to ship from the
                        project name, at src/cc_public, with no
                        configuration, so an unchanged cc_public needs
                        no file selection for the tooling. Peers take
                        cc-public as a versioned package and are to
                        use the engine too, and a dataflow_engine
                        folder outside cc_public is not found by that
                        default either. So every layout needs explicit
                        file selection for the engine, and renaming
                        the package or moving it to src/python adds
                        the tooling to that list. The effect on
                        dependencies is small.
description:            |
                        Sources:
                        - Without file selection options, hatchling's
                          wheel builder
                          looks for NAME/__init__.py, src/NAME/__init__.py, NAME.py and
                          NAMESPACE/NAME/__init__.py, and raises an error if none match
                          (https://hatch.pypa.io/latest/plugins/builder/wheel/).
                        - The project is named cc-public, uses
                          hatchling, and has no
                          hatch build section (pyproject.toml lines 37 and 53-55).
                        - The Python package is at src/cc_public
                          (pyproject.toml line
                          51; AGENTS.md line 39).
                        - No PyPI project named cctool existed on
                          2026-10-22
                          (https://pypi.org/pypi/cctool/json returned 404), so the
                          rename meets no name already taken there.
                        - Strength: weak; explicit file selection is a
                          few lines.

