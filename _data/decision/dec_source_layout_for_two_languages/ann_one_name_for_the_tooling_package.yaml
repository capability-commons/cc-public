title:                  One name for the tooling's package and command
brief:                  |
                        The command is cctool while the package is
                        cc_public, two names for one thing; renaming
                        the package to cctool leaves one name,
                        matching what a newcomer already types, and
                        drops the word public from a package whose
                        parts may go private. It does not take the
                        brand out of the name, since cctool keeps the
                        cc that a rebranding would also change. The
                        phase before 1.0 accepts renames, and the
                        design rules say that when in doubt the larger
                        change is made now.
description:            |
                        Sources:
                        - The cctool entry point is
                          cc_public.cli.command:main
                          (pyproject.toml line 51).
                        - "When in doubt, the larger change is made
                          now."
                          (_data/register/reg_design_rule.yaml lines 117-121).
                        - Parts of cc-public may later go private or
                          be rebranded
                          (owner's statement, 2026-10-21, _sources/context.md line 9;
                          _sources/cc-patrol-notes/plan.md lines 112-115).
                        - The owner wants a churn-tolerant phase
                          before 1.0 that
                          tolerates renames and prefix changes (owner's statement,
                          2026-10-21, _sources/context.md line 26).
                        - 506 files under _data and src name cc_public
                          (grep of the
                          snapshot, 2026-10-22).
                        - cctool rename lists files that still name an
                          old id outside a
                          YAML document, to be changed by hand (AGENTS.md lines
                          124-128).
                        - Strength: moderate; the change is large and
                          needs
                          pyproject.toml edits that only the owner can relock (context
                          note, _sources/context.md line 30).

