title:                  relation_supports wording now forbids a double edge
brief:                  |
                        The annotation says the relation_supports
                        description lets an annotation both support
                        and challenge another, so the refusing check
                        is not built. Now the description forbids it
                        and the check is built.
description:            |
                        _data/register/reg_relation.yaml lines
                        208-210: "An annotation never both supports
                        and challenges one target: one that qualifies
                        another challenges it".
                        supports_and_challenges
                        (src/cc_public/check/check.lp lines 1259-1263)
                        reports such an annotation. Found in the
                        review of 2026-10-22.

