title:                  Wrong edge caught by a refusing check
brief:                  |
                        A check that refuses support and challenge of
                        one target catches an annotation whose author
                        picked the wrong relation, and removes no
                        function the graph uses today.
description:            |
                        No annotation has both edges to one target
                        (scan of _data/**/ann_*.yaml, HEAD 89c74d8).
                        Two annotations hold both relations, to
                        different targets:
                        _data/decision/dec_tooling_language/ann_graphs_will_grow.yaml
                        lines 25-33 and
                        _data/decision/dec_cross_item_checks_engine/ann_clingo_lacks_string_matching_and_columns.yaml
                        lines 26-34. Will wants checks that catch what
                        LLMs and humans miss: will-messages.md lines
                        394 and 457. ASSUMPTION: an author editing a
                        list with both relations sometimes sets the
                        wrong one.

