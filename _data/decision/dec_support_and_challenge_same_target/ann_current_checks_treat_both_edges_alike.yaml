title:                  Both edges alike in current checks
brief:                  |
                        The checks that join on either edge, argued
                        and practical, treat relation_supports and
                        relation_challenges the same way, so a
                        double-edged annotation gives no wrong result
                        in any check today.
description:            |
                        argued has one rule per relation with the same
                        body: src/cc_public/check/check.lp lines
                        423-435. practical holds for either edge:
                        lines 555-563. Nothing computes which
                        assertion prevails:
                        _data/register/reg_relation.yaml lines
                        223-226. The cycle check follows
                        relation_supports only, since only it is
                        acyclic (line 205; check.lp lines 529-547),
                        and a double edge to one target makes no cycle
                        there. Holds only until a check depends on the
                        direction of an edge.

