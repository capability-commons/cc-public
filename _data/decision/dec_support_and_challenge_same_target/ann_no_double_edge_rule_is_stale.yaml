title:                  Rule on support and challenge of one target now built
brief:                  |
                        The annotation says no rule joins
                        relation_supports and relation_challenges on
                        one target, and that the relation_supports
                        description allows both. Now a check reports
                        such an annotation, and the description
                        forbids it.
description:            |
                        supports_and_challenges
                        (src/cc_public/check/check.lp lines 1259-1263)
                        holds where one annotation has both edges to
                        one target.
                        test_an_annotation_that_supports_and_challenges_one_option_is_reported
                        (src/cc_public/check/_test/test_check.py line
                        410) covers it. The relation_supports
                        description now says "An annotation never both
                        supports and challenges one target: one that
                        qualifies another challenges it"
                        (_data/register/reg_relation.yaml lines
                        208-210).
                        ruling_support_and_challenge_same_target
                        upholds opt_forbid_support_and_challenge.
                        Found in the review of 2026-10-22.

