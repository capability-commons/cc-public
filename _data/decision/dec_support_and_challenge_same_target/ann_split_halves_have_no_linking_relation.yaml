title:                  No link between the halves of a split qualifier
brief:                  |
                        Under a refusal, a qualification becomes two
                        one-sided annotations, and no relation records
                        that they are parts of one reason.
description:            |
                        The relations an annotation may hold are
                        relation_is_about, relation_supports,
                        relation_challenges and
                        relation_speaks_for_concern, and none joins
                        two annotations as parts of one assertion: the
                        domains in _data/register/reg_relation.yaml.
                        relation_supersedes is for options and rulings
                        only, and means replacement. Two annotations
                        of one decision share only relation_is_about,
                        as every annotation there does.

