title:                  Doubled items from a split qualifier
brief:                  |
                        Under a refusal, an argument that qualifies a
                        target is written as two annotations, one that
                        supports and one that challenges, where
                        allowing it keeps one.
description:            |
                        An annotation is a file of about 35 lines (29
                        annotation files hold 1025 lines, wc -l over
                        _data). The relation_supports description
                        allows the single qualifying annotation:
                        _data/register/reg_relation.yaml lines
                        188-192. No current annotation qualifies a
                        target, so the saving so far is zero items.

