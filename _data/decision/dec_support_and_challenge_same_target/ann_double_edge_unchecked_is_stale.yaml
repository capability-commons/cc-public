title:                  Double edge now refused by a check
brief:                  |
                        The annotation says relation_supports allows
                        the double edge where it qualifies its target,
                        and that no rule checks it. Now the double
                        edge is forbidden and a check reports it, so a
                        qualification is recorded as a challenge
                        alone.
description:            |
                        The relation_supports description now says "An
                        annotation never both supports and challenges
                        one target: one that qualifies another
                        challenges it"
                        (_data/register/reg_relation.yaml lines
                        208-210). supports_and_challenges
                        (src/cc_public/check/check.lp lines 1259-1263)
                        reports an annotation with both edges to one
                        target. Found in the review of 2026-10-22.

