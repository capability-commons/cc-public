title:                  Refusal check of a few lines
brief:                  |
                        A check that refuses support and challenge of
                        one target is a rule of a few lines, and today
                        it would refuse nothing, so it causes no
                        rework.
description:            |
                        A check of this shape is four to six lines,
                        for example argument_without_concern in
                        src/cctool/check/check.lp lines 571-576.
                        Commit fd6323a added twelve checks for the
                        seven that Will picked, in check.dl since
                        ported to check.lp (git show fd6323a). None of
                        the 29 annotation files both supports and
                        challenges one target (scan of every
                        ann_*.yaml, repo HEAD 89c74d8). ASSUMPTION:
                        the added run time per evaluation is small
                        next to the fixed cost each evaluation pays,
                        which is not measured.

