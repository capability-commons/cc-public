title:                  Direction of a double edge left to prose
brief:                  |
                        An annotation with both edges to one target
                        does not say in any field whether it counts
                        for or against it. A reviewer, or a query that
                        weighs support against challenge, has to read
                        its prose to place it.
description:            |
                        relation_supports allows the double edge
                        "where it qualifies it", and no rule checks
                        that condition:
                        _data/register/reg_relation.yaml at
                        entries.relation_is_about.alias and
                        entries.relation_is_about.edge;
                        src/cctool/check/check.lp within
                        decision_about_non_component and
                        argument_across_decisions read only the edges.
                        The qualification is written in the
                        description, as free prose, and an annotation
                        has no verdict field:
                        _data/schema/sch_annotation.yaml at
                        description and usage. WTP wants the argument
                        trace to show which concern was under- or
                        over-represented when a decision turns out
                        wrong: maintainer's statement, 2026-10-13,
                        will-messages.md line 229. ASSUMPTION: such a
                        review weighs support against challenge per
                        concern.

