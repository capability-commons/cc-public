title:                  Qualification already carried by r_challenges
brief:                  |
                        r_challenges already means not to accept
                        without qualification, so a support edge added
                        to the same target is a second encoding of the
                        same thing. Forbidding it leaves each
                        annotation reading one way.
description:            |
                        r_challenges: a reason "not to accept, or not
                        to accept without qualification" its target,
                        _data/register/reg_relation.yaml lines
                        217-221. r_supports allowance: lines 190-192.
                        Both entered in the same commit (ae6eeff, and
                        7dda99e after the squash). The checks give the
                        pair no meaning beyond each edge alone:
                        src/cc_public/check/check.lp lines 423-435 and
                        554-563. The simplicity advocate notes a third
                        option not among the alternatives: say in the
                        r_supports description that a qualification is
                        recorded as a challenge alone, with no new
                        rule.

