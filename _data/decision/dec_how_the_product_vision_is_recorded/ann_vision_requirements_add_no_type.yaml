title:                  Vision requirements that add no type
brief:                  |
                        Requirements already have ids, subjects and a
                        rationale, and the vision option adds no type,
                        while capability items need a new type, its
                        schema, and relations from logical components
                        and from requirements. The cost is that the
                        option depends on two other open decisions:
                        the property form, and how a requirement names
                        its concerns.
description:            |
                        Sources:
                        - The option adds no type, and needs the
                          property form.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_property_requirements.yaml
                          at brief and description)
                        - The capability option adds a type, links
                          logical components to capabilities, and lets
                          requirements trace to them.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_capability_items.yaml
                          at brief)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml
                          at brief)
                        - Simplicity asks how many mechanisms a design
                          adds, and whether it follows from decisions
                          already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.0 and
                          entries.concern_simplicity.question.2)
                        - Assumption: the vision statements are a real
                          instance that needs some home, so the
                          comparison is between homes, not between a
                          home and none. Strength: moderate; it fails
                          if the property form is not upheld, since
                          the statements would then be bent into
                          process words.

