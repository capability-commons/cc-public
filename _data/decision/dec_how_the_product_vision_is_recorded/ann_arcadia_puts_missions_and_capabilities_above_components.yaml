title:                  Arcadia home for missions and capabilities
brief:                  |
                        Arcadia states missions and operational
                        capabilities, the goals and services end users
                        expect, in its operational analysis above the
                        logical architecture, and cc-public takes its
                        architecture terms from Arcadia. Arcadia has
                        no counterpart to the requirement type, so a
                        Capella partner would look for the vision
                        among capabilities, not requirements or a
                        prose file.
description:            |
                        Sources:
                        - Operational capabilities are quantified
                          overall operational goals, results and
                          services expected from end users, beside the
                          missions and major goals of the main
                          stakeholders, in the operational analysis.
                          (Arcadia user guide 2023, clause 4.1.1, page
                          15,
                          https://mbse-capella.org/resources/arcadia-reference/Arcadia%20User%20Guide.pdf)
                        - cc-public takes its logical architecture
                          terms from Arcadia, noting each departure.
                          (_data/decision/dec_source_of_architecture_terms/ruling_source_of_architecture_terms.yaml
                          at brief)
                        - Of concept_requirement, Arcadia has no
                          counterpart.
                          (_data/register/reg_concept.yaml at
                          entries.concept_requirement.note)
                        - Capella users model operational capabilities
                          as model elements with involved activities
                          and processes.
                          (https://forum.mbse-capella.org/t/operational-capabilities-activities-and-processes/5230)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        - Assumption: a partner works in Arcadia or
                          Capella; no exchange with an MBSE tool
                          exists today
                          (_data/decision/dec_source_of_architecture_terms/ann_arcadia_terms_map_to_capella_models.yaml
                          at description). Strength: moderate.

