title:                  Vision statement with no method of verification
brief:                  |
                        A requirement must name a method of
                        verification, and is defined as a statement a
                        reader can verify, but the decision itself
                        says the vision sets direction rather than an
                        obligation that can be verified. Written as
                        requirements, the vision statements would
                        carry methods nobody applies, and would stand
                        as needs that nothing is ever shown to meet.
description:            |
                        Sources:
                        - A requirement is written as one statement
                          that a reader can verify.
                          (_data/register/reg_concept.yaml at
                          entries.concept_requirement.description)
                        - verification_method is required, with the
                          values test, demonstration, inspection and
                          analysis. (_data/schema/sch_requirement.yaml
                          at allOf.2.required and
                          allOf.2.properties.verification_method)
                        - The vision statements set direction rather
                          than an obligation that can be verified, so
                          they fit the requirement type only loosely.
                          (_data/decision/dec_how_the_product_vision_is_recorded/dec_how_the_product_vision_is_recorded.yaml
                          at description)
                        - A rule claims no more than something holds.
                          (_data/register/reg_design_rule.yaml at
                          entries.rule_claim_only_what_is_held.brief)
                        - Traceability counts needs with nothing that
                          meets them. (_data/register/reg_concern.yaml
                          at entries.concern_traceability.measure.1)
                        - Assumption: should does not lift the
                          obligation to verify; 29148 reads should as
                          a preference, still a requirement.
                          (_data/schema/sch_requirement.yaml at
                          allOf.2.properties.modal_verb) Strength:
                          strong for statements such as "later to
                          agent workflows"; weaker for those that can
                          be demonstrated, such as replay from
                          recorded edits.

