title:                  Vision as requirements in the property form
brief:                  |
                        Each vision statement is a requirement in the
                        property form with the modal verb should, on
                        the logical component it is about, such as
                        lco_dataflow_model or lco_tooling, and names
                        the concerns it serves. Advocates cite these
                        requirements when an option serves or works
                        against the vision. This needs the property
                        form and adds no type.
description:            |
                        Recommended to WTP on 2026-10-26. It depends
                        on the property form being upheld.

