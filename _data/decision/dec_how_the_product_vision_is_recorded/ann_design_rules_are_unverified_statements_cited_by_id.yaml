title:                  Design rules as unverified statements cited by id
brief:                  |
                        The design rule register already holds
                        statements that bind across many decisions
                        rather than one design entity, with no method
                        of verification, and arguments cite them by id
                        in prose: 19 annotation files mention the four
                        rules, and the check on mentions holds each
                        citation. A register of vision statements
                        follows that decision rather than making a new
                        pattern. The precedent covers the form and the
                        citation only: each design rule is also held
                        by a check, and a vision entry would not be.
description:            |
                        Sources:
                        - A design rule binds whoever designs and
                          records the system,
                          not one design entity as a requirement does, and outlives the
                          decisions it came from. (_data/register/reg_concept.yaml at
                          entries.concept_design_rule.description)
                        - A design rule entry carries the rule as its
                          brief and the
                          reason as its description, and adds only follows and breaks.
                          (_data/schema/sch_regentry_design_rule.yaml at description and
                          properties)
                        - 19 annotation files under _data/decision
                          mention one or more
                          of the four design rules by id, and no item has an edge to a
                          rule; for one, ann_vision_statement_has_no_verification_method
                          cites rule_claim_only_what_is_held.
                          (_data/decision/dec_how_the_product_vision_is_recorded/ann_vision_statement_has_no_verification_method.yaml
                          at description; counted by search, 2026-10-26)
                        - Every id a text mentions, if it has the
                          prefix of a known type,
                          must name an item. (src/cctool/check/check.lp within
                          dangling_mention)
                        - Each design rule names what holds it, and no
                          more than three
                          may be left to the scheduled reviews.
                          (src/cctool/check/check.lp within unheld_design_rule and
                          unheld_rule_cap)
                        - Simplicity asks whether a design follows
                          from decisions
                          already made. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2)
                        - Assumption: a vision statement is like a
                          design rule in that
                          it guides many decisions and is not verified. Strength:
                          moderate; it weakens if the vision entries need fields or
                          relations that design rules do not have.

