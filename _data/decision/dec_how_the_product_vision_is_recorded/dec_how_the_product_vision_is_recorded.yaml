title:                  How the product vision is recorded
brief:                  |
                        Where do the statements of the product vision
                        live, so that decisions and their arguments
                        can cite them?
description:            |
                        WTP shared the product vision on 2026-10-26: a
                        graph of edits over dataflow models that can
                        be edited and played with a cache at each
                        stage, each node a variant, a family as a tree
                        of experiments with dead ends kept, decisions
                        arguing which direction to explore next, and
                        the same machinery applied to itself and later
                        to agent workflows. WTP asked how the vision
                        can be reinforced in decisions and arguments,
                        and agreed that this should be drafted as a
                        decision (WTP, 2026-10-26). The statements set
                        direction rather than an obligation that can
                        be verified, so they fit the requirement type
                        only loosely.

