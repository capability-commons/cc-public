title:                  Vision statement that spans several subjects
brief:                  |
                        A requirement has exactly one subject, but a
                        vision statement such as the machinery
                        applying to itself spans the dataflow model,
                        the dataflow engine, argumentation and the
                        tooling. As requirements it must be split or
                        given one subject, and the split loses that it
                        is one aim; a capability item can be linked to
                        each component that serves it.
description:            |
                        Sources:
                        - A requirement has exactly one subject.
                          (_data/schema/sch_requirement.yaml at
                          description)
                        - The vision includes decisions arguing which
                          direction to explore next, and the same
                          machinery applied to itself.
                          (_data/decision/dec_how_the_product_vision_is_recorded/dec_how_the_product_vision_is_recorded.yaml
                          at description)
                        - lco_dataflow_model, lco_dataflow_engine,
                          lco_argumentation and lco_tooling are
                          separate logical components.
                          (_data/logical_component/, four files)
                        - The capability option links logical
                          components to the capabilities they
                          contribute to.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_capability_items.yaml
                          at brief)
                        - Traceability asks whether each need can be
                          traced to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1)
                        - Assumption: the self-applied machinery
                          involves those four components. Strength:
                          moderate; statements about one component,
                          such as replay of the graph of edits, fit
                          one subject well.

