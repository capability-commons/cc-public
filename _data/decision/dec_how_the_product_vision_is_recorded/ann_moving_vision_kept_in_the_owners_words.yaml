title:                  Moving vision kept in the owner's words
brief:                  |
                        The vision was first written down on
                        2026-10-26, and already holds one part for
                        later and one part designed for but not built,
                        so it is still moving. One prose document
                        keeps it in the owner's words with no slots,
                        rationale or verification method to restate at
                        each change, and adds no mechanism beyond a
                        citable item.
description:            |
                        Sources:
                        - WTP shared the vision on 2026-10-26,
                          including the same machinery applied later
                          to agent workflows.
                          (_data/decision/dec_how_the_product_vision_is_recorded/dec_how_the_product_vision_is_recorded.yaml
                          at description)
                        - A trained decision model is de-scoped:
                          designed for, not with. (owner's statement,
                          2026-10-26)
                        - Under the document option the vision is one
                          prose document, recorded as an item.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_a_cited_document.yaml
                          at brief)
                        - A requirement must give modal_verb,
                          activity, object, rationale and
                          verification_method.
                          (_data/schema/sch_requirement.yaml at
                          allOf.2.required)
                        - Simplicity asks how many mechanisms a design
                          adds. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.0)
                        - Assumption: the vision will change several
                          times before it settles. Strength: moderate
                          while the vision moves; it fades once the
                          statements settle and arguments cite them
                          often.

