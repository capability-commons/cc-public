title:                  Kept dead ends that make scale part of the vision
brief:                  |
                        A family kept as a tree of experiments with
                        its dead ends, and a cache at each stage,
                        means stored graphs and caches grow with every
                        experiment, so how far the design scales is
                        part of the vision. A property requirement can
                        state that scale in its value slot, and
                        Arcadia assesses capabilities by metrics too;
                        a prose document states it with nothing to
                        measure against.
description:            |
                        Sources:
                        - The vision has a cache at each stage, and a
                          family as a tree of experiments with dead
                          ends kept.
                          (_data/decision/dec_how_the_product_vision_is_recorded/dec_how_the_product_vision_is_recorded.yaml
                          at description)
                        - Flexibility asks whether the design can be
                          scaled up or down as the load changes.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question.2)
                        - The property form has the value or
                          comparison it must meet.
                          (_data/decision/dec_property_form_of_a_requirement/opt_requirement_form_field_with_a_property_form.yaml
                          at brief)
                        - Capabilities are to be assessed with
                          qualitative and also quantitative metrics.
                          (Arcadia user guide 2023, clause 4.1.1, page
                          15,
                          https://mbse-capella.org/resources/arcadia-reference/Arcadia%20User%20Guide.pdf)
                        - Under the document option nothing is checked
                          against the vision.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_a_cited_document.yaml
                          at brief)
                        - Assumption: kept dead ends and caches grow
                          the stored data with each experiment, and
                          are not pruned. Strength: weak; scale is one
                          part of the vision, and a requirement of
                          scale can be written beside any of the three
                          options.

