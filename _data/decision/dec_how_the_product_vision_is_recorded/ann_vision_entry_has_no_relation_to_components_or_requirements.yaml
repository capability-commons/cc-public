title:                  Vision entry with no relation to components or requirements
brief:                  |
                        The option gives each entry edges to the
                        logical components it bears on, and lets a
                        requirement trace to the entry it serves, but
                        no relation admits either edge today.
                        relation_is_about admits only an annotation or
                        a decision as its source, and no relation from
                        a requirement says what the requirement
                        serves. Both edges need a role granted to the
                        new type and a new relation for requirements,
                        which is the cost that
                        ann_vision_requirements_add_no_type charges to
                        capability items.
description:            |
                        Sources:
                        - relation_is_about constrains its source with
                          relcon_can_be_about_an_item, and its target not at all.
                          (_data/register/reg_relation.yaml at
                          entries.relation_is_about.edge)
                        - rol_can_be_about_an_item is played by
                          type_annotation and
                          type_decision, and no other type entry names it.
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_annotation.edge and entries.type_decision.edge)
                        - On a copy of the snapshot, cctool link
                          refused an edge of
                          relation_is_about from rule_claim_only_what_is_held to
                          lco_item_graph, and one from rqt_rename_keeps_guid to that
                          rule, each with constraint_violation at its source end.
                          (src/cctool/check/check.lp within constraint_violation; tried
                          2026-10-26)
                        - The relations whose source must be a
                          requirement are
                          relation_has_subject, relation_has_actor and
                          relation_has_process; they name the subject, the actor and the
                          process word. (_data/register/reg_relation.yaml at
                          entries.relation_has_subject.edge,
                          entries.relation_has_actor.edge and
                          entries.relation_has_process.edge)
                        - The option gives entries edges to logical
                          components and lets
                          a requirement trace to an entry.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_a_register_of_statements.yaml
                          at brief)
                        - Traceability asks whether each need can be
                          traced to what meets
                          it. (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1)
                        - Assumption: one role edge on the new type is
                          enough for the
                          edge from an entry to a component, since the checks on
                          relation_is_about look further only at annotations and
                          decisions. Strength: strong as a statement of what must be
                          added; it is a cost, not a bar.

