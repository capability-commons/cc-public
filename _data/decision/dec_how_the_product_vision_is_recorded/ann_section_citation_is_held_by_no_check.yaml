title:                  Citation by section held by no check
brief:                  |
                        Every id that a text mentions is checked to
                        name an item, but a section of a prose
                        document has no id, so an argument that cites
                        the vision by section is held by nothing and
                        is not found by an edge. When the document is
                        reworded, the arguments that cite it are not
                        flagged; under either item option each
                        statement has an id that the checks hold and a
                        query can follow.
description:            |
                        Sources:
                        - Every id a text mentions, if it has the
                          prefix of a known type, must name an item.
                          (src/cctool/check/check.lp within
                          dangling_mention)
                        - Under the document option, arguments cite
                          the vision by section, and nothing is
                          checked against it.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_a_cited_document.yaml
                          at brief)
                        - Traceability is, as far as possible, held as
                          edges in the uniform relation scheme.
                          (_data/decision/dec_requirement_provenance/ruling_requirement_provenance.yaml
                          at brief)
                        - Traceability asks whether each need can be
                          traced to what meets it; maintainability
                          asks how readily a change can be checked
                          before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1 and
                          entries.concern_maintainability.question.2)
                        - Assumption: arguments will cite the vision
                          often enough that a stale citation matters.
                          Strength: strong as citations grow; it would
                          weaken if the document gave each statement
                          an anchor that a check could hold, which the
                          option does not propose.

