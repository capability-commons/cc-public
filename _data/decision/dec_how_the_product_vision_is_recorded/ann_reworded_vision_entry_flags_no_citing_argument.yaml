title:                  Reworded vision entry that flags no citing argument
brief:                  |
                        The check on mentions holds that a cited id
                        names an item, not that the item still says
                        what the argument relied on. When an entry is
                        removed or renamed the citing arguments are
                        flagged, but when its brief is reworded, the
                        usual change while the vision moves, nothing
                        is flagged, as with a reworded section of a
                        document. The option's claim that the check
                        holds every citation is true of the id only,
                        and the same holds for capability items and
                        requirements.
description:            |
                        Sources:
                        - dangling_mention fails a mention whose id
                          names no item and is
                          no old id; outdated_mention fails a mention of an old id.
                          (src/cctool/check/check.lp within dangling_mention and
                          outdated_mention)
                        - The option says that the check on mentions
                          holds every
                          citation.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_a_register_of_statements.yaml
                          at brief)
                        - A reworded document flags no citing
                          argument, while under
                          either item option each statement has an id the checks hold.
                          (_data/decision/dec_how_the_product_vision_is_recorded/ann_section_citation_is_held_by_no_check.yaml
                          at brief)
                        - The vision is still moving.
                          (_data/decision/dec_how_the_product_vision_is_recorded/ann_moving_vision_kept_in_the_owners_words.yaml
                          at brief)
                        - Maintainability asks how readily a change
                          can be checked
                          before it ships. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                        - Assumption: no check ties a citing text to
                          the wording it
                          cited; none of the check titles in check.lp, advise.lp or
                          friction.lp names one. Strength: moderate while the vision
                          moves; it fades as the wording settles.

