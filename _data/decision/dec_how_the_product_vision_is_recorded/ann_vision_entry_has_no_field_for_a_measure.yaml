title:                  Vision entry with no field for a measure
brief:                  |
                        An entry built like a design rule has a title,
                        a brief and a description, and no field for a
                        measure, so the scale the vision implies, with
                        dead ends and a cache kept at each stage, is
                        stated with nothing to measure it by. A
                        requirement with a value could carry the
                        measure, but no relation lets it trace to the
                        entry. The concern register shows that an
                        entry schema can carry measures, so the option
                        could add one; as written it does not.
description:            |
                        Sources:
                        - A register entry carries identity, the
                          descriptive fields, an
                          alias field and edges; a design rule entry adds only follows
                          and breaks. (_data/schema/sch_register_entry.yaml at
                          properties; _data/schema/sch_trait_descriptive.yaml at
                          properties; _data/schema/sch_regentry_design_rule.yaml at
                          properties)
                        - How far the design scales is part of the
                          vision.
                          (_data/decision/dec_how_the_product_vision_is_recorded/ann_kept_dead_ends_make_scale_part_of_the_vision.yaml
                          at brief)
                        - A concern entry carries a field of measures.
                          (_data/schema/sch_regentry_concern.yaml at
                          properties.measure)
                        - No relation from a requirement can name an
                          entry of a new
                          type.
                          (_data/decision/dec_how_the_product_vision_is_recorded/ann_vision_entry_has_no_relation_to_components_or_requirements.yaml
                          at brief)
                        - Flexibility asks whether the design can be
                          scaled up or down
                          as the load changes. (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question.2)
                        - Assumption: the scale of the vision is to be
                          stated with a
                          measure, not only as a direction. Strength: weak; a measure
                          field is a small addition to the entry schema.

