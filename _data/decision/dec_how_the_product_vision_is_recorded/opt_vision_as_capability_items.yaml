title:                  Vision as capability items of a type of their own
brief:                  |
                        A new type holds each vision statement as a
                        capability or mission in the Arcadia sense:
                        what the product is for, at a level above
                        requirements. Logical components are linked to
                        the capabilities they contribute to, and
                        requirements may trace to them. Advocates cite
                        the capability items.
description:            |
                        Arcadia states missions and capabilities in
                        its operational and system analysis, above the
                        logical architecture
                        (extdoc_arcadia_user_guide_2023).

