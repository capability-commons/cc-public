title:                  Renamed vision entry that keeps its old id
brief:                  |
                        When cctool renames a register entry it keeps
                        the old id in the entry's alias field, and a
                        standalone item keeps no alias. A citation the
                        rename does not rewrite, such as one in a peer
                        that consumes a release, still resolves to the
                        renamed entry, and the check names the current
                        id. Under capability items or requirements the
                        same citation would name nothing.
description:            |
                        Sources:
                        - A renamed register entry keeps its old id as
                          an alias;
                          the rename rewrites the mentions in the documents of its own
                          tree. (src/cctool/edit/edit.py within _rename_one;
                          AGENTS.md#changing-data-items)
                        - An alias is how a retired key keeps
                          resolving.
                          (_data/schema/sch_register_entry.yaml at properties.alias)
                        - A mention of an old id is not dangling, and
                          outdated_mention
                          names the current id. (src/cctool/check/check.lp within
                          dangling_mention and outdated_mention)
                        - A segment that consumes a release is checked
                          together with
                          the consumed tree. (pym_cctool.check.segment at description)
                        - cc-patrol is the first peer, and pins a
                          release.
                          (_data/release/release_cc_public_0_1_0.yaml at brief)
                        - Maintainability asks how far a change in one
                          part spreads to
                          others; compatibility asks whether a partner can read and use
                          what the design produces. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1 and
                          entries.concern_compatibility.question.0)
                        - Assumption: entries will be renamed while
                          the vision moves,
                          and a peer will cite them. Strength: moderate while peers cite
                          the vision; weak while only cc-public does, since there the
                          rename rewrites every mention.

