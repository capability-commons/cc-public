title:                  Vision as a register of statements
brief:                  |
                        The vision statements are entries of one
                        register, built like reg_design_rule: each
                        entry has an id and a guid, a title and a
                        brief that states the direction, and edges to
                        the logical components it bears on, any number
                        of them. An entry needs no verification
                        method, since it sets direction rather than an
                        obligation, and adds no standalone type.
                        Arguments cite an entry by its id, so the
                        check on mentions holds every citation, and a
                        requirement may trace to the entry it serves.
description:            |
                        Proposed by the advocates on this decision as
                        an answer to the challenges against the other
                        options, and added at WTP's request (WTP,
                        2026-10-26).

