title:                  Peer that cannot add entries of a consumed register type
brief:                  |
                        A peer that consumes a release reads the
                        vision register and can cite its entries, but
                        cannot hold vision entries of its own in a
                        register of that type. A register holds only
                        entries of a type whose type entry names it,
                        and that edge sits in the consumed tree, which
                        the peer cannot change. A peer that takes the
                        vision to its own work, such as agent
                        workflows, must define a type of its own or
                        ask cc-public to hold its entries.
description:            |
                        Sources:
                        - A register holds only entries of a type
                          whose edge of
                          relation_has_items_held_in_register names it.
                          (src/cctool/check/check.lp within misplaced_register_entry)
                        - That edge is written on the type entry, as
                          for
                          type_design_rule. (_data/register/reg_data_item_type.yaml at
                          entries.type_design_rule.edge.0)
                        - cctool finds the one register that holds the
                          items of a type.
                          (src/cctool/edit/edit.py within _register)
                        - A consuming segment reads the consumed tree
                          beside its own,
                          and cannot change it. (pym_cctool.check.segment at
                          description)
                        - The vision is to be applied later to agent
                          workflows.
                          (_data/decision/dec_how_the_product_vision_is_recorded/dec_how_the_product_vision_is_recorded.yaml
                          at description)
                        - Compatibility asks what a partner must adopt
                          in order to read
                          or use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2)
                        - Assumption: a peer can hold standalone items
                          of a consumed
                          type in its own tree, as misplaced_document reads; this was
                          not tried. Assumption: a peer will want vision statements of
                          its own. Strength: weak to moderate; it matters only once a
                          peer extends the vision.

