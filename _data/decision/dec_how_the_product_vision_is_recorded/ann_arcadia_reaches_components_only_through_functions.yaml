title:                  Arcadia link from capability to component through functions
brief:                  |
                        In Arcadia a capability reaches components
                        only through the functions and functional
                        chains that realize it, and cc-public has no
                        function type. Linking logical components
                        straight to capabilities is a departure from
                        Arcadia that would have to be noted, and the
                        trace says that a component contributes but
                        not by what.
description:            |
                        Sources:
                        - Functions trace to operational activities
                          and fill capability gaps, and requirements
                          and scenarios are allocated to components
                          through functions. (Arcadia user guide 2023,
                          clauses 4.2.2 and 4.3.3, pages 23 and 34,
                          https://mbse-capella.org/resources/arcadia-reference/Arcadia%20User%20Guide.pdf)
                        - The capability option links logical
                          components to the capabilities they
                          contribute to.
                          (_data/decision/dec_how_the_product_vision_is_recorded/opt_vision_as_capability_items.yaml
                          at brief)
                        - The type register has no function type.
                          (_data/register/reg_data_item_type.yaml,
                          type entries)
                        - Each place cc-public departs from Arcadia is
                          to be noted on the item that departs.
                          (_data/decision/dec_source_of_architecture_terms/ruling_source_of_architecture_terms.yaml
                          at brief)
                        - Compatibility asks what a partner must
                          adopt; traceability asks whether each need
                          can be traced to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2 and
                          entries.concern_traceability.question.1)
                        - Assumption: the guide's account of the
                          trace, read from its text, is complete; its
                          model figures were not read. Strength:
                          moderate; a noted departure is allowed by
                          the ruling, so this is a cost, not a bar.

