title:                  format() costs little on the fact path
brief:                  |
                        str.format is five to seven times slower than
                        an f-string per call, but on the fact writer
                        that adds up to 1 or 2 ms in a check of one to
                        three seconds, so f-strings gain almost
                        nothing.
description:            |
                        Sources: pyproject.toml line 98 (UP032
                        ignored); src/cc_public/graph/datalog.py lines
                        233-237 and 252. Measured by the advocate on
                        2026-10-15: 359 ns against 54 ns and 247 ns
                        against 46 ns per call; write() about 11 ms
                        for 1376 facts; a full cctool check about 1.1
                        to 2 s (2.9 s in the verifier's run).
                        ASSUMPTION: about four string fields per fact.

