title:                  House rule layout doubles the lines to review
brief:                  |
                        The house layout of rule files about doubles
                        the code lines for the same rules, so each
                        rule change has about twice as many lines to
                        read. The lines are short and mostly carry one
                        atom each, so the reading cost grows less than
                        the count.
description:            |
                        Sources: check.dl has 28 declarations and 32
                        rules both before 150d0f7 and at dc5f35f, but
                        its code lines grow from 119 to 233 and its
                        comment lines from 47 to 124; derive.dl code
                        lines grow from 14 to 29 (counted by the
                        advocate with git show and grep). Commit
                        89c74d8 adds four relations to check.lp in 56
                        lines. Part of the comment growth is the data
                        item header from 150d0f7, owed to the rule
                        that every artifact is a data item, not to the
                        layout. The concern's measure is the size of a
                        change in lines
                        (_data/register/reg_concern.yaml line 474).
                        Weak, since a line count overstates the effort
                        for short single-atom lines.

