title:                  House style easier for the owner to read
brief:                  |
                        The owner asked for his house style and finds
                        rules with one column per line and named
                        variables much easier to read than the compact
                        form.
description:            |
                        Owner's statements: "Can you format check.py
                        to conform to my house style"
                        (2026-10-13T20:30:08Z). "That is MUCH better
                        ... It made my head swim a bit before when
                        looking at it"; "I lean toward putting
                        declaration arguments on their own lines, with
                        types and parameter names vertically aligned,
                        regardless of whether they fit ... I think
                        that's much easier to read"; "The single
                        letter variables were much harder to read and
                        understand" (2026-10-14T07:10:30Z, answering
                        the request of 06:49:30Z).

