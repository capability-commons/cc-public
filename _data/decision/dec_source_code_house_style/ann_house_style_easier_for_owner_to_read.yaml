title:                  House style easier for the maintainer to read
brief:                  |
                        The maintainer asked for his house style and
                        finds rules with one column per line and named
                        variables much easier to read than the compact
                        form.
description:            |
                        Maintainer's statements: "Can you format
                        check.py to conform to my house style"
                        (2026-10-13). "That is MUCH better ... It made
                        my head swim a bit before when looking at it";
                        "I lean toward putting declaration arguments
                        on their own lines, with types and parameter
                        names vertically aligned, regardless of
                        whether they fit ... I think that's much
                        easier to read"; "The single letter variables
                        were much harder to read and understand"
                        (2026-10-14, answering an earlier request).

