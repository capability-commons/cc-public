title:                  Docstring layout check as a recurring cost
brief:                  |
                        The check re-lays out the data item docstring
                        of every Python file on each run, about 4 ms
                        per file now, and this grows with the number
                        of source files.
description:            |
                        Sources: src/cc_public/check/check.py line 75;
                        src/cc_public/edit/layout.py lines 106-128 and
                        148-173. Measured by the advocate on
                        2026-10-15: 0.14 to 0.16 s for the 37 .py
                        files, against 0.66 s for 75 YAML files.
                        ASSUMPTION: the common style would drop this
                        step, and a ruff format check would cost less;
                        neither is stated in the packet or measured.

