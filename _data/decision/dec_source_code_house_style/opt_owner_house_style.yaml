title:                  Maintainer's legacy house style
brief:                  |
                        Follow the maintainer's legacy Python house
                        style: a data item in the module docstring, a
                        79-column separator above each function,
                        aligned assignments and spaced keyword
                        arguments, .format() rather than f-strings,
                        whole-module imports, names prefixed by type,
                        and ruff with the legacy rules and thresholds.
                        Carry it to logic programs with one declared
                        column per line, variables named for their
                        columns and one body atom per line.
description:            |
                        Commit 09ac7a6 (2026-10-13) for Python, and
                        commits 150d0f7 and dc5f35f (2026-10-14) for
                        rule files, all pre-squash. The rule style was
                        carried to the clingo .lp files in 6230e98.

