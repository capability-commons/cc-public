title:                  Owner's legacy house style
brief:                  |
                        Follow Will's legacy Python house style, with
                        a data item docstring, 79-column separators,
                        aligned assignments, .format(), type-prefixed
                        names and ruff with the legacy settings, and
                        adapt it to rule files with one declared
                        column per line, variables named for their
                        columns and one body atom per line.
description:            |
                        Commit 09ac7a6 (2026-10-13) for Python, and
                        commits 150d0f7 and dc5f35f (2026-10-14) for
                        rule files, all pre-squash. The rule style was
                        carried to the clingo .lp files in 6230e98.

