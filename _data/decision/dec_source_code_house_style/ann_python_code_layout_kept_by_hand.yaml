title:                  Python code layout kept by hand only
brief:                  |
                        No tool applies or checks the house layout of
                        code below the docstring, so it rests on prose
                        instructions, authors and reviewers, while the
                        common style would let ruff, already present,
                        both apply and check it.
description:            |
                        Sources: src/cctool/gate/gate.py within
                        TUPLE_STAGE (check, ruff check and pytest; no
                        formatter); pyproject.toml at
                        tool.pixi.dependencies.ruff and tool.ruff
                        (ruff present, clashing rules off, no
                        [tool.ruff.format]);
                        src/cctool/check/layout.py (cctool format lays
                        out YAML documents, docstrings and comment
                        headers, and leaves the rest of the file
                        alone); AGENTS.md#style; the maintainer asked
                        for check.py to be restyled by hand
                        (2026-10-13, commit 09ac7a6). One sign of
                        drift: 2072 of 26032 Python lines under src
                        exceed 79 columns, though AGENTS.md sets 79
                        only for separators. ruff format --check on
                        the snapshot would reformat 70 of the 80
                        Python files. ASSUMPTION: ruff format would
                        not conflict with cctool format on docstrings.

