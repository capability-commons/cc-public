title:                  Python code layout kept by hand only
brief:                  |
                        No tool applies or checks the house layout of
                        code below the docstring, so it rests on prose
                        instructions, authors and reviewers, while the
                        common style would let ruff, already present,
                        both apply and check it.
description:            |
                        Sources: src/cc_public/gate/gate.py lines
                        64-66 (check, ruff check and pytest; no
                        formatter); pyproject.toml lines 61 and 83-103
                        (ruff present, clashing rules off, no
                        [tool.ruff.format]);
                        src/cc_public/edit/layout.py lines 32-33 and
                        148 (cctool format leaves the rest of the file
                        alone); AGENTS.md lines 76-80; the owner asked
                        for check.py to be restyled by hand
                        (2026-10-13T20:30:08Z, commit 09ac7a6). One
                        sign of drift: 516 of 7767 Python lines under
                        src exceed 79 columns, though AGENTS.md sets
                        79 only for separators. ASSUMPTION: ruff
                        format would remove the alignment and would
                        not conflict with cctool format on docstrings.

