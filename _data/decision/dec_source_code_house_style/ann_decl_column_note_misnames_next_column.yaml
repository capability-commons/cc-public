title:                  Column notes in multi-line declarations
brief:                  |
                        The declaration parser reads a note written
                        after a column on a continued line as part of
                        the next column's name. For a shown check a
                        test then fails, since its did sentence names
                        a column that is not declared; for a query
                        program the column heading is wrong with no
                        error. The one-line form cannot carry such a
                        note inside the brackets.
description:            |
                        Sources: src/cctool/graph/logic.py within
                        REGEX_DECL (REGEX_DECL continues over any line
                        that begins with "%") and logic.py within
                        declared (every "%" stripped, then split on
                        ","); logic.py within run (the arity check
                        counts columns only). Column names fill the
                        did sentence of a check (logic.py within
                        described; src/cctool/check/check.py within
                        columns), and test_check.py within
                        test_every_check_says_what_a_failure_is_and_how_to_fix_it
                        fails a did that names a column the
                        declaration lacks. cctool query logic heads
                        its output with the declared names
                        (src/cctool/cli/querying.py within logic),
                        with no such test. Rerun on the snapshot of
                        2026-10-23: "% decl a(id: symbol, % the id"
                        followed by "% line: number)" gives a second
                        column named "the id" plus "line". A blank
                        line inside a declaration drops it. None of
                        the 171 declarations in the six logic program
                        files carries such a note, and AGENTS.md#style
                        speaks of "a `% decl` line". Latent; fixed by
                        stripping notes before the split or by
                        refusing them, without giving up the style.

