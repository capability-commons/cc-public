title:                  Column notes in multi-line declarations
brief:                  |
                        The declaration parser reads a note written
                        after a column on a continued line as part of
                        the next column's name, so a check report
                        shows a wrong column heading with no error.
                        The one-line form cannot carry such a note
                        inside the brackets.
description:            |
                        Sources: src/cc_public/graph/logic.py line 67
                        (REGEX_DECL continues over any line that
                        begins with "%") and line 169 (every "%"
                        stripped, then split on ","); line 284 (the
                        arity check counts columns only);
                        src/cc_public/check/_test/test_check.py line
                        614; column names become check headings
                        (src/cc_public/check/check.py lines 110-122,
                        src/cc_public/edit/edit.py line 902) and are
                        read the same way by cctool query
                        (src/cc_public/cli/querying.py line 177). Run
                        by the advocate on 2026-10-15: "% decl a(id:
                        symbol, % the id" followed by "% line:
                        number)" gives a second column named "the id"
                        plus "line". A blank line inside a declaration
                        drops it. No declaration carries such a note
                        at 89c74d8, and AGENTS.md lines 81-82 speak of
                        "a % decl line". Latent; fixed by stripping
                        notes before the split or by a rule in
                        AGENTS.md, without giving up the style.

