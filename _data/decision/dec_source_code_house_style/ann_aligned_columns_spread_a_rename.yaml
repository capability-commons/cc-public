title:                  Aligned columns that spread a small change
brief:                  |
                        Aligning values in columns makes one longer
                        name re-indent its whole block, so a small
                        change touches many lines, which the common
                        style avoids.
description:            |
                        Sources: AGENTS.md lines 77-80; commit
                        dc5f35f, where renaming one key (and rewording
                        one relation comment) changed 43 added and 42
                        removed lines of
                        src/cc_public/graph/extract.py but only 6 and
                        5 with whitespace ignored (git diff --numstat
                        with and without -w). Over the 33 commits of
                        the current history the gap is at most 10
                        added lines in any commit (5836f80), so the
                        cost is real but seldom large so far. Review
                        with git diff -w limits it to diff noise and
                        merge conflicts.

