title:                  Header parse errors now reported with their file
brief:                  |
                        Commit 0d16c2a "Fix cctool check so that an
                        unreadable file is a failure, not a traceback"
                        reports a header or module that cannot be read
                        as unreadable_file with its file and line. At
                        360ec14 a slip in a source header no longer
                        stops the check.
description:            |
                        A YAML error in a header and a Python syntax
                        error both raise ErrorRead with the line of
                        the file (src/cctool/graph/extract.py within
                        file_of and facts_of at 360ec14), which
                        documents keeps as Unreadable (extract.py
                        within documents) and check.lp shows as
                        unreadable_file (check.lp within
                        unreadable_file).
                        test_a_module_that_is_not_python_is_reported
                        covers it
                        (src/cctool/check/_test/test_check.py within
                        test_a_title_that_ends_in_a_newline_is_reported).
                        Every source file still carries a header the
                        checker parses.

