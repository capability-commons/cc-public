title:                  Maintainer's legacy house style
brief:                  |
                        Python and logic programs follow the
                        maintainer's house style, as he asked and as
                        AGENTS.md sets down, and the tree is written
                        in it throughout. It departs from PEP 8 in its
                        aligned and spaced equals signs, and no
                        formatter holds the layout of code, so it
                        rests on authors and review; cctool format
                        holds the docstrings and ruff the legacy lint
                        rules. The compact rule form was harder to
                        read, and the common style would rewrite 70 of
                        80 modules for a gain of about a tenth of a
                        second. Ruled by WTP on 2026-10-23.

