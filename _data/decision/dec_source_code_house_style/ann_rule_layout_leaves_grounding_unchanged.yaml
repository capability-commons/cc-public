title:                  No solver cost from rule layout
brief:                  |
                        The house layout of rule files leaves the
                        ground program and the solve time unchanged,
                        so the readable layout costs nothing in
                        performance.
description:            |
                        Measured by the advocate at 89c74d8 on
                        2026-10-15, clingo 5.8.2: derive.lp and
                        check.lp as written and with comments and
                        whitespace collapsed both give 4805 ground
                        rules and 2300 symbolic atoms over 1376 facts,
                        median 0.1147 s against 0.1134 s over 7 runs
                        (difference assumed noise). ASSUMPTION:
                        renaming variables to single letters would
                        also ground the same, as names in a rule are
                        local; not tested.

