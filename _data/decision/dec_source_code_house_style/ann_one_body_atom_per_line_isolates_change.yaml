title:                  Rule change isolated by one body atom per line
brief:                  |
                        With one body atom and one declared column per
                        line, a change to one condition of a rule
                        shows in the diff as one line. In the compact
                        form several atoms share a line, and a change
                        to one rewrites the whole line.
description:            |
                        Sources: commit 1ba2895 adds "not issue_of(Id,
                        _)" to the misplaced_document rule as one
                        added line (git show 1ba2895 --
                        src/cctool/check/check.lp); the atom is now
                        written "not decision_of(Id, _)"
                        (src/cctool/check/check.lp within
                        misplaced_document). In the compact form a
                        rule body holds several atoms on one line, 75
                        columns in misplaced_document (git show
                        150d0f7^:src/cctool/check/check.dl lines
                        50-56) and up to 77 in the file; git diff
                        reports changes by whole line
                        (https://git-scm.com/docs/git-diff).
                        ASSUMPTION: reviewers read the diff without
                        word-diff options. The isolation is per rule,
                        so it holds as the rules grow.

