title:                  Layout verdicts now kept between runs of the commit gate
brief:                  |
                        The old annotation says that the check lays
                        out the item docstring of every Python file on
                        each run. Now the gate of a commit keeps
                        layout verdicts in a store and lays out again
                        only the files whose text changed. A check
                        with no store still lays out every file.
description:            |
                        violations in src/cc_public/edit/layout.py
                        (lines 133-164) keys each verdict by the path
                        and a digest of the text, reuses a verdict
                        that the store holds, and saves the verdicts
                        it used. pym_cctool.check.store keeps them in
                        the directory named by CC_PUBLIC_STORE, under
                        a digest of the code of cc_public, so a
                        verdict is reused only for the same text and
                        the same code (src/cc_public/check/store.py).
                        The gate sets the store for a commit and none
                        for a push (src/cc_public/gate/gate.py lines
                        28-32 and 141-144). A plain cctool check, and
                        the gate of a push, still lay out every file.
                        Found in the review of 2026-10-22.

