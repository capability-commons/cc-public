title:                  Hand restyles confirmed by no tool
brief:                  |
                        No tool produces the house layout of code, so
                        a restyle of code is made by hand or by an
                        agent, and only the tests and a full line by
                        line read can confirm it changes nothing else.
                        A commit titled Reformat is checked only up to
                        the layout cctool format writes, which leaves
                        code alone. Under the common style a formatter
                        check could confirm a pure layout diff, and
                        black also checks that its output has the same
                        syntax tree as its input.
description:            |
                        Sources: commit 09ac7a6 restyles check.py with
                        206 added and 95 removed lines, still 205 and
                        94 with whitespace ignored (git show --numstat
                        with and without -w), and in the same commit
                        splits _walk; its message says "Behavior is
                        unchanged." The tree at 09ac7a6 holds no test
                        file; the first checker tests come in 0b69eb4.
                        Commit 150d0f7 restyles check.dl in the same
                        commit as a new item type, a new schema and an
                        extractor change. The gate runs check, ruff
                        check and pytest and no formatter
                        (src/cctool/gate/gate.py within TUPLE_STAGE);
                        161 test functions existed under src at
                        89c74d8, and 471 on the snapshot of
                        2026-10-23. A commit titled Reformat fails if
                        it changes the content of a file beyond what
                        the layout printer changes
                        (src/cctool/commit/change.lp within
                        reformat_changes_content;
                        src/cctool/commit/change.py within _changed),
                        and that printer lays out only YAML documents,
                        docstrings and comment headers
                        (src/cctool/check/layout.py), so a restyle of
                        code cannot be titled Reformat. The restyle
                        commits carry a Claude co-author line, so a
                        person must judge a model's layout. Black: "By
                        default, Black performs an AST safety check
                        after formatting your code"
                        (https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html).
                        ruff provides "ruff format --check" but its
                        formatter page states no such safety check
                        (https://docs.astral.sh/ruff/formatter/, read
                        2026-10-15). Run by the functional suitability
                        advocate on 2026-10-15: extract() of check.py
                        at ba66f33 and at 09ac7a6 gives identical
                        facts in all 8 relations, so the one restyle
                        measured kept its results. ASSUMPTION: the
                        tests at 09ac7a6 did not cover every path of
                        check.py. Weak today; grows with the code. It
                        bears on one-off restyles and mixed commits,
                        not on new code written in the house style.

