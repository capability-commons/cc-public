title:                  One convention across all file kinds
brief:                  |
                        The house style gives Python, rule files and
                        data files one convention, read by one
                        extractor and laid out by one printer, while a
                        common Python style says nothing about rule
                        files.
description:            |
                        Sources: AGENTS.md#before-you-finish; memory
                        note datalog-house-style.md ("Why"); commit
                        150d0f7, which adds MAP_MARK_COMMENT and
                        MAP_PREFIX_MODULE to
                        src/cctool/graph/extract.py rather than a new
                        reader; src/cctool/check/layout.py.
                        ASSUMPTION: neither ruff nor black formats
                        clingo .lp files. Caveat from the advocate:
                        the data item header follows from the earlier
                        rule that every artifact is a data item, so
                        only the shared layout rules are owed to this
                        option.

