title:                  Legacy lint settings bound to ruff rule codes
brief:                  |
                        The house style needs ruff rule codes ignored
                        and thresholds set to make room for itself,
                        and ruff may remove rules or change its
                        configuration in minor releases before 1.0.
                        The coupling is small and does not grow with
                        the graph.
description:            |
                        Sources: pyproject.toml lines 83-112 (UP032
                        ignored because "format() is the house form",
                        and five other codes); ruff versioning policy
                        (https://docs.astral.sh/ruff/versioning/);
                        ruff 0.16.10 in pixi.lock line 42. At worst a
                        ruff upgrade past the 0.17 pin means editing a
                        few lines of pyproject.toml. ASSUMPTION: the
                        default style would need no UP032 ignore.

