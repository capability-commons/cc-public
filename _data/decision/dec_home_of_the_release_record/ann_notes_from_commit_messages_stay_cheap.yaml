title:                  Cheap derivation of notes from commit messages
brief:                  |
                        Release notes derived from commit items need
                        one read of the messages since the last
                        release, with no tree extracted, so the cost
                        grows slowly with the number of commits. This
                        holds only if the notes come from commit
                        items; notes from a diff of the graphs must
                        extract each end of the range.
description:            |
                        Sources: every commit carries a commit item
                        with a templated verb (context note,
                        _sources/context.md line 34). The history code
                        reads the messages of many commits with one
                        git log call and lists commits with one git
                        rev-list call (src/cctool/commit/history.py
                        lines 55, 70-77 and 150). Checking a change
                        between two trees extracts the full graph of
                        each (src/cctool/commit/change.py lines
                        131-132); _data holds 1633 files, about 3.5 MB
                        of text and 7.3 MB on disk (count of files
                        under _data, 2026-10-22). Assumption: the
                        notes would be derived from commit items,
                        which the option does not say. Strength: weak;
                        both ways cost seconds at a rare release.

