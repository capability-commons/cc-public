title:                  Shipped copy of notes derived from a tag item
brief:                  |
                        If the release item lives in the tag message,
                        the derived notes and rename maps must be
                        built into the package at release time, or a
                        peer that installs a package cannot read what
                        changed. With that step added, the tag item
                        serves partners as well as a file does and
                        keeps the tree free of release edits.
description:            |
                        Sources: every commit already carries a commit
                        item, and the commit check detects renames and
                        removals (context note, _sources/context.md
                        line 34). The release notes are to be derived
                        mechanically from the graph (owner's
                        statement, 2026-10-22, _sources/context.md
                        line 19). A plain tag carries no item
                        (_data/decision/dec_home_of_the_release_record/opt_plain_release_tag.yaml
                        at brief). Assumption: no step that copies
                        derived notes or rename maps into the built
                        package exists yet, since no release has been
                        made (_sources/context.md line 33). Strength:
                        moderate; it turns the choice into a condition
                        rather than a defect.

