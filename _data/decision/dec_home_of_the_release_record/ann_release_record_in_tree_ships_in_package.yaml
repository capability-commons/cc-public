title:                  Release record that travels inside the package
brief:                  |
                        A release item committed as a file under _data
                        ships inside the package with the rest of
                        _data, so a peer that installed the release
                        can read the record and its rename map with
                        the tools it already has. A record held only
                        in a tag message stays in git and reaches only
                        a peer that fetched the tag, unless the build
                        copies it in, and a plain tag gives a peer
                        nothing to read.
description:            |
                        Sources: the owner chose to ship "the whole of
                        _data" (owner's statement, 2026-10-22,
                        _sources/context.md line 22). Peers bring in
                        cc-public as a versioned package
                        (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml
                        lines 12-16). A wheel built with hatchling
                        from the tree at e46c32b5 holds the 93 files
                        of src/cc_public and none of _data (built in
                        the review of 2026-10-23), since
                        pyproject.toml sets no build target beyond the
                        hatchling backend (pyproject.toml lines
                        53-55). So a release file ships in the package
                        only once the build is set to include _data,
                        which the owner asked for. git archive writes
                        the tree structure of the named tree
                        (https://git-scm.com/docs/git-archive); an
                        annotated tag's message is held in the tag
                        object (https://git-scm.com/docs/git-tag). The
                        release component includes the notes and
                        rename maps derived for each release
                        (_data/logical_component/lco_release.yaml
                        lines 12-16). Assumption: a build from a tree
                        does not read tag messages unless a step is
                        written to do so. Limit: under the route the
                        owner accepts for now, peers build from a tag
                        and so hold the tag anyway (owner's statement,
                        2026-10-22). Strength: moderate for partners
                        who install packages, weak while every peer
                        builds from a tag.

