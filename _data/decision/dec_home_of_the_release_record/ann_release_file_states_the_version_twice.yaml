title:                  Version stated twice by a release file
brief:                  |
                        A release file in the tree holds the version
                        that the tag also names, so two records carry
                        one fact and must be kept in agreement. It
                        also adds a release type and a commit made
                        only to hold the record.
description:            |
                        Sources: in this option the release item is
                        committed as a file before the release is
                        tagged
                        (_data/decision/dec_home_of_the_release_record/opt_release_file_in_data.yaml
                        at brief). Each type has an entry in
                        reg_data_item_type.yaml that names its schema,
                        and a new type needs a prefix of its own
                        (AGENTS.md#changing-data-items and
                        AGENTS.md#finding-things-out). Strength:
                        moderate; the duplication is plain, though a
                        check could hold the two in agreement.

