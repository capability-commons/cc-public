title:                  Reuse of the commit item form in a tag item
brief:                  |
                        An item in an annotated tag message has the
                        same form as a commit item, a YAML document in
                        a git message, so it reuses the message parser
                        and schema check rather than adding a type
                        folder and a release commit. It does need one
                        new check point, since the history check
                        passes over tags today.
description:            |
                        Sources: a commit message holds its item as a
                        YAML document from three dashes to three dots,
                        checked against the commit schema by the
                        message check (src/cctool/commit/message.py).
                        The history check passes over a pushed tag
                        (src/cctool/commit/history.py within pushed;
                        README.md#getting-started). Annotated tags
                        carry a message of their own
                        (https://git-scm.com/docs/git-tag). Strength:
                        moderate; the reuse is real, but the tag check
                        is a new hook point the file option would not
                        need.

