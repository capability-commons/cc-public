title:                  Extra gated commit for a release file
brief:                  |
                        A release record held in a tag, or no record
                        at all, needs no extra commit, while a release
                        file needs one commit before the tag, which
                        runs the commit gate and the commit message
                        check. The cost is about ten seconds per
                        release.
description:            |
                        Sources: the release file option commits a
                        release item as a file before the tag is made
                        (_data/decision/dec_home_of_the_release_record/opt_release_file_in_data.yaml).
                        The pre-commit hook runs the gate on every
                        commit, and a data-only commit is checked,
                        linted and given only the tests marked
                        reads_data (README.md#getting-started;
                        .githooks/pre-commit). A data-only commit
                        takes about 10 s in the gate on atlas (context
                        note, _sources/context.md line 31). The commit
                        message check extracts the whole graph twice
                        (src/cctool/commit/change.py within facts_of).
                        A pushed tag is not checked by the pre-push
                        hook (README.md#getting-started). Strength:
                        weak; seconds on a rare event.

