title:                  Release item in the tag message
brief:                  |
                        The annotated tag of a release carries a
                        release item in its message, as a commit
                        carries a commit item, and the release notes
                        are derived.
description:            |
                        Source: maintainer's comment (2026-10-22),
                        "Agreed. The fact that we can generate the
                        notes mechanically from the graph is also
                        another validation of this approach."

