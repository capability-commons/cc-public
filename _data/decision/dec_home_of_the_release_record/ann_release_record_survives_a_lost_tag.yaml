title:                  Recovery of the release record after a lost tag
brief:                  |
                        An annotated tag can be deleted or re-created,
                        and with it goes the record held in its
                        message, unless another clone still holds the
                        old tag. A release file stays in the
                        forward-only branch history, so the record can
                        be recovered and the tag re-made from it; a
                        plain tag leaves nothing to recover beyond the
                        commit.
description:            |
                        Sources: git tag -d deletes a tag and git tag
                        -f replaces one of the same name
                        (https://git-scm.com/docs/git-tag, options and
                        "On Re-tagging"). git push sends tags when
                        given --tags or --follow-tags
                        (https://git-scm.com/docs/git-push). dev only
                        moves forward and its history stays linear
                        (AGENTS.md#working-beside-other-agents).
                        Strength: moderate; tag loss is uncommon, but
                        the tag-only options then leave nothing to
                        recover from.

