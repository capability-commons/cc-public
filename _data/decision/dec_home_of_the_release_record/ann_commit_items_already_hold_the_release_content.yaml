title:                  Release content already held by the commit items
brief:                  |
                        The release notes and the bump can be computed
                        from the commit items between two tags, so a
                        release item adds a record whose content the
                        commit items already hold. A plain tag is the
                        one option that adds no new mechanism for the
                        record.
description:            |
                        Sources: every commit carries a commit item
                        with a templated title verb, and the commit
                        check detects renames and removals (context
                        note, _sources/context.md line 34). The commit
                        check compares the graph before and after a
                        commit and finds renamed items by guid
                        (src/cc_public/commit/change.lp lines 107-111;
                        src/cc_public/commit/change.py lines 19-25).
                        The owner values that the notes can be
                        generated mechanically from the graph (owner's
                        statement, 2026-10-22T16:28). Strength:
                        moderate; it holds only while a release states
                        nothing beyond its version and the commits it
                        covers, which is not yet shown either way.

