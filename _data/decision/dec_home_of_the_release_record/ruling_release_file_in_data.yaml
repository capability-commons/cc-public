title:                  Release file in data
brief:                  |
                        A release item is committed as a file under
                        _data, and the release tag names the commit
                        that adds it; the release notes and rename
                        maps are derived from the commit items since
                        the last release. Ruled by William Payne on
                        2026-10-24, as recommended. The release item
                        records the exact set of dependencies the
                        release gate tested, and the release step
                        refuses to tag a commit that does not add the
                        release file. Whether the tag should carry the
                        item instead is left to revisit "if it causes
                        tensions".

