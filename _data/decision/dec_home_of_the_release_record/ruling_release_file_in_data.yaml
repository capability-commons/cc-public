title:                  Release file in data
brief:                  |
                        A release item is committed as a file under
                        _data, and the release tag names a commit
                        whose tree holds it; the release notes and
                        rename maps are derived from the commit items
                        since the last release. Ruled by WTP on
                        2026-10-24, as recommended. The release item
                        records the exact set of dependencies the
                        release gate tested. Whether the tag should
                        carry the item instead is left to revisit "if
                        it causes tensions". On 2026-10-25 WTP changed
                        one condition: the release step first refused
                        to tag a commit that does not add the release
                        file, and now refuses a commit whose tree
                        holds no release item for the tag, or one that
                        no longer agrees with the commit's version
                        module, lock or renames.

