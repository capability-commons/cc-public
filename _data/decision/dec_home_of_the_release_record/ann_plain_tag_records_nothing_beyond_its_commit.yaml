title:                  Plain tag that records nothing beyond its commit
brief:                  |
                        A plain tag names a commit but holds no item,
                        so nothing records why the release was made,
                        which needs and decisions it meets, or which
                        upstream package set it was built and tested
                        against. Either item option can hold those, so
                        that when a peer reports a fault after an
                        upstream change the known good set is on
                        record and graph items can point at the
                        release.
description:            |
                        Sources: the plain tag option is "a tag with
                        no item"
                        (_data/decision/dec_home_of_the_release_record/opt_plain_release_tag.yaml
                        at title and brief). A lightweight git tag is
                        only a name for a commit; only an annotated
                        tag object holds a tagger, a date and a
                        message (https://git-scm.com/docs/git-tag).
                        Every commit already carries a commit item
                        that records what it changes and why
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_commit; context note,
                        _sources/context.md line 34). The release
                        component is to derive the notes and rename
                        maps for each release
                        (_data/logical_component/lco_release.yaml at
                        brief). The exact versions of the environment
                        are held in pixi.lock by URL (pixi.lock), each
                        package with a sha256 (such as pixi.lock),
                        while a consumer resolves the ranges in
                        requires_dist (pixi.lock; pyproject.toml at
                        project.dependencies). Assumption: the release
                        item's schema is not written, so whether it
                        carries the upstream set is still open.
                        Strength: strong for traceability, moderate
                        for the upstream set, which depends on a field
                        not yet defined.

