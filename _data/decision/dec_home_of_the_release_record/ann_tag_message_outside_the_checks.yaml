title:                  Tag message outside the checks and the graph
brief:                  |
                        The push check of record skips every pushed
                        tag and the extractor skips the .git
                        directory, so a release item in a tag message
                        could be malformed and still reach the remote,
                        and no item in the tree can be checked to
                        point at it. A release file in the tree passes
                        the commit hooks and the history check like
                        any other item and can carry edges to what it
                        meets.
description:            |
                        Sources: "A pushed tag is not checked: it
                        names history already made"
                        (src/cc_public/commit/history.py lines 31-33;
                        tags skipped at line 95; README.md lines
                        107-108). The pre-push hook is the check of
                        record (.githooks/pre-push lines 26-28 and 33;
                        AGENTS.md lines 93-95). Every committed file
                        under _data is checked by the gate and by the
                        history check (README.md lines 71-80 and
                        103-108). The extractor skips the .git
                        directory (src/cc_public/graph/extract.py line
                        147). A commit item is held in the commit
                        message, not in a file of the tree
                        (_data/register/reg_data_item_type.yaml lines
                        807-812). An earlier annotation found the
                        reason for a removed element living only in a
                        commit message no graph item links to
                        (_data/decision/dec_graph_history_storage/ann_removed_elements_lose_their_reasons.yaml
                        lines 11-28). git push sends tags when given
                        --tags or --follow-tags
                        (https://git-scm.com/docs/git-push).
                        Assumption: no check of a release item in a
                        tag message exists yet. Strength: strong on
                        today's code, moderate if a tag reader and
                        check are built with the release tooling.

