title:                  Binding of the record to its commit by the tag object
brief:                  |
                        An annotated tag is one object that names the
                        exact commit it releases and carries its
                        message, so a release item in the tag cannot
                        drift from the commit it records. A file
                        committed before tagging cannot name the
                        commit that holds it, so its link to the
                        tagged commit rests on convention.
description:            |
                        Sources: an annotated tag object holds the
                        object it points at, the tagger, the date and
                        a message (https://git-scm.com/docs/git-tag).
                        A commit cannot contain its own record, which
                        is why a commit item is held in the commit
                        message
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_commit.note). The release file
                        option commits the item "before the release is
                        tagged"
                        (_data/decision/dec_home_of_the_release_record/opt_release_file_in_data.yaml
                        at title and brief). The owner welcomed
                        deriving the notes from the graph (owner's
                        statement, 2026-10-22). Strength: moderate;
                        the binding is exact, but it trades away the
                        in-tree visibility that the annotation on tag
                        messages outside the checks describes.

