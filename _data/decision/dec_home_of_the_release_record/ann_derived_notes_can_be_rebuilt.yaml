title:                  Derived notes rebuilt after a fault
brief:                  |
                        Where the notes are derived from the graph
                        rather than written by hand, a lost or
                        corrupted notes file can be rebuilt exactly
                        from the history. This holds for a release
                        item in the tag and in the tree alike, so it
                        favors deriving the notes whichever home is
                        chosen.
description:            |
                        Sources: every commit carries a commit item
                        with a templated verb, and the commit check
                        detects renames and removals (context note,
                        _sources/context.md line 34). "The fact that
                        we can generate the notes mechanically from
                        the graph is also another validation of this
                        approach." (owner's statement, 2026-10-22).
                        Strength: weak; it does not separate the two
                        item options.

