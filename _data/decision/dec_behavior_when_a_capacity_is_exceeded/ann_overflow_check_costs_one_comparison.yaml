title:                  Overflow check that costs one comparison per write
brief:                  |
                        Detecting an overflow is a comparison of the
                        count with the capacity when an item is
                        written, and in a static build the fail-safe
                        of each port is known when the code is
                        generated, so a per-port rule costs no more at
                        run time than one rule for the engine. Neither
                        adds memory, since the capacity is already
                        reserved. Blocking costs far more: a wait in
                        one node delays every node after it in the
                        step and, under one step rate, the whole step,
                        which is the overload that degraded mode
                        exists to answer.
description:            |
                        Sources:
                        - One engine runs a static subgraph whose
                          schedule is generated as plain C++17 calls
                          fixed at build time.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          at brief)
                        - Parameterized dataflow makes overflow a
                          declared semantic check rather than a side
                          effect of a buffer filling (Bhattacharya and
                          Bhattacharyya 2001, Parameterized dataflow
                          modeling for DSP systems, section VI).
                        - Degraded mode is only for steps consistently
                          over their period (WTP, 2026-10-28).
                          ASSUMPTION: in the dynamic subgraph the
                          per-port fail-safe is one small enumeration
                          read beside the capacity, not a virtual
                          call. Strength: moderate; it shows the two
                          dropping options equal on performance and
                          blocking worse, so performance does not
                          decide between per-port and engine-wide.

