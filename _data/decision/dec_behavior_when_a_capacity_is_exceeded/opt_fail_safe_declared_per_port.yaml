title:                  Fail-safe declared per port from a fixed list
brief:                  |
                        Each port declares its fail-safe from a fixed
                        list, such as drop the excess items and raise
                        a fault, drop the whole message and raise a
                        fault, or fail the step. Every overflow raises
                        a fault that the trace records, whichever
                        fail-safe is chosen.
description:            |
                        Proposed with WTP's statement that overflow is
                        a broken requirement needing a declared
                        fail-safe (WTP, 2026-10-28). Which entry suits
                        a port depends on its data: dropping the
                        newest detections may be safe where dropping a
                        whole frame is not.

