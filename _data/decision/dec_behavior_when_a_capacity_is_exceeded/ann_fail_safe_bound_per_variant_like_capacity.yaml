title:                  Fail-safe bound per variant like the capacity
brief:                  |
                        A fail-safe declared per port can be set in
                        variant generation by the same transform that
                        derives the capacity, so the variant for a
                        test bench can fail the step at once and stop
                        on the first broken bound, while the variant
                        for the field drops and raises a fault. One
                        rule for the whole engine fixes the same
                        response on every platform and in every
                        configuration, so it cannot be loud in testing
                        and tolerant in service. Blocking cannot be
                        adapted at all where a source cannot wait.
description:            |
                        Sources:
                        - The capacity is part of the variant
                          generated for the configuration that uses
                          the producer.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/opt_capacity_derived_from_maximum_producer_rates.yaml
                          at brief)
                        - Each port declares its fail-safe from a
                          fixed list, such as drop the excess and
                          raise a fault, drop the whole message, or
                          fail the step.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_fail_safe_declared_per_port.yaml
                          at brief)
                        - The flexibility concern asks on which
                          platforms and environments the design runs.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question)
                          ASSUMPTION: test and simulation
                          configurations of Patrol are variants of the
                          same family as the field configuration.
                          Strength: moderate; it depends on the
                          fail-safe being a setting the variant may
                          change, which the per-port option allows but
                          does not yet say.

