title:                  Truncated obstacle list that reads as free space
brief:                  |
                        Keeping the first items up to the capacity is
                        safe only where the items are ordered by
                        importance or where any subset is still true.
                        A list of obstacles or occupied cells cut
                        short does not say "some obstacles were lost";
                        to a planner that reads it, the missing
                        obstacles are free space. For such a port, an
                        empty or absent message with a fault, or a
                        failed step, leads the consumer to a safe
                        state, while a partial list leads it to act on
                        a falsehood. One rule for the whole engine
                        cannot tell these ports apart, so it is unsafe
                        for some port in any graph that has both
                        kinds.
description:            |
                        Sources:
                        - The engine applies one fail-safe to every
                          overflow, keeping the first items up to the
                          capacity, and it cannot express a port where
                          a partial message is worse than none.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_one_fail_safe_for_the_engine.yaml
                          at brief)
                        - Dropping the newest detections may be safe
                          where dropping a whole frame is not.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_fail_safe_declared_per_port.yaml
                          at description)
                        - Data written and never read before it is
                          deleted, or overwritten before it is read,
                          counts as a data-flow error (Xiang et al.
                          2018, Detecting data-flow errors based on
                          Petri nets with data operations, section on
                          the conflict and concurrency relations);
                          that dropped excess items fall in this class
                          is our reading. ASSUMPTION: Patrol's graph
                          will carry at least one list, such as
                          obstacles for a planner, whose truncation
                          reads as absence. Strength: strong for
                          safety; it would weaken only if every list
                          port could be required to sort by
                          importance, which is a burden on authors the
                          engine cannot check.

