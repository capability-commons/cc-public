title:                  Overflow response stated and replayed
brief:                  |
                        A fail-safe per port is a requirement only if
                        it states the arrivals the port is built for,
                        how an overflow is detected, the fault it
                        raises, the response and how soon it follows,
                        and what must hold before normal running
                        resumes. Dropping items changes what the rest
                        of the graph sees, so a replay must reproduce
                        the same drops: which items were dropped must
                        follow from the recorded inputs or be logged.
description:            |
                        Sources:
                        - For every bounded edge, define the admitted
                          arrival envelope, capacity, overflow
                          detector, fault event, immediate response,
                          maximum response delay and recovery
                          preconditions; arbitrary drops or overwrites
                          change event history and must be represented
                          in replay input (ChatGPT corpus analysis,
                          B-memory-and-rates.md section B2,
                          2026-10-28).
                        - The time of an outside event is treated as
                          an input, so test vectors that include it
                          give one correct response (Lohstroh et al.
                          2021, Toward a Lingua Franca for
                          deterministic concurrent systems, section
                          3.6).
                        - Each port declares its fail-safe from a
                          fixed list, and every overflow raises a
                          fault that the trace records.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_fail_safe_declared_per_port.yaml
                          at brief)

