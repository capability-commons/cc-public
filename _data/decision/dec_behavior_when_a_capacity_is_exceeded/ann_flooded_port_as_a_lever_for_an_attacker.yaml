title:                  Flooded port as a lever for an attacker
brief:                  |
                        Whoever controls what arrives at a port,
                        through a spoofed network source or a faulty
                        upstream node, can overflow it at will, and
                        each fail-safe then becomes a lever. Keeping
                        the first items lets early, forged items crowd
                        out real ones. Blocking stalls every node
                        upstream, a denial of service. Failing the
                        step stops the graph. A per-port rule lets the
                        ports exposed to outside input take the
                        response that gives an attacker least, such as
                        dropping the whole message with a fault, which
                        loses that step's real items too but lets no
                        forged partial list through, and the fault
                        count makes a flood visible. One rule for the
                        engine gives every exposed port the crowding
                        weakness.
description:            |
                        Sources:
                        - A count larger than the capacity, written by
                          a faulty or hostile sender, makes every
                          reader that trusts it read past the array,
                          so the receiver of a crossing must check the
                          count.
                          (_data/decision/dec_how_values_of_varying_size_are_held/ann_received_count_and_stale_tail_of_a_bounded_array.yaml
                          at brief)
                        - The security concern asks what an attacker
                          can reach and what it would cost.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question)
                        - Every overflow raises a fault that the trace
                          records, whichever fail-safe is chosen.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_fail_safe_declared_per_port.yaml
                          at brief) ASSUMPTION: some Patrol sources,
                          such as messages from an operator station or
                          another robot, cross a network an attacker
                          could reach. Strength: moderate; the
                          crowding attack needs control of arrival
                          order, and a per-port choice helps only if
                          exposed ports are identified, which the
                          delivery-policy and crossing rules can mark.

