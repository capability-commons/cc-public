title:                  Overflow fault delivered as data to the control node
brief:                  |
                        Raising a fault is a safe response only if
                        something acts on it. If the engine exposes
                        overflow counts as source ports, as it will
                        expose queue occupancy, the control node that
                        triggers degraded mode can read them and
                        choose the safe state, with hysteresis, as an
                        ordinary part of the graph that checks and
                        replay see. The fail-the-step entry is the
                        exception to watch: it ends the step for every
                        node after the failing one, safety functions
                        included, so it should be allowed only where
                        the step's failure itself leads to a safe
                        state. Blocking raises no fault at all, so
                        nothing downstream learns of it.
description:            |
                        Sources:
                        - A control node monitoring queue sizes or
                          processor temperature triggers degraded
                          mode, with hysteresis; the engine exposes
                          occupancy as source ports, a recorded
                          exception (WTP, 2026-10-28).
                        - In the drafted schedule a node that returns
                          any signal other than continue ends the step
                          for the nodes after it.
                          (_data/decision/dec_where_engine_behavior_lives/ann_failing_observer_node_can_end_the_step.yaml
                          at brief)
                        - In the Zeitgeist application, late data is
                          dropped while the system keeps track of how
                          much was dropped (Akidau et al. 2013,
                          MillWheel: fault-tolerant stream processing
                          at internet scale, section 4.5).
                        - A behavior moves into the engine only when a
                          recorded decision shows no inserted node can
                          do it within a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief) Strength: moderate to strong for
                          safety; it favors either dropping option
                          over blocking and asks the per-port option
                          to restrict failing the step.

