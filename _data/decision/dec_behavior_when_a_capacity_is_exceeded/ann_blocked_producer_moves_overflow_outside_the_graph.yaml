title:                  Blocked producer that moves the overflow outside the graph
brief:                  |
                        Under one message per edge per step, the
                        reader of a message runs only once the
                        producer's step has ended, so a producer that
                        waits for room part way through a step waits
                        for something its own step prevents. The step
                        cannot finish, or the excess must be carried
                        into the next step's message, which is a
                        different rule. At a sensor the wait cannot
                        happen at all, so the excess is lost in the
                        driver or its receive ring, outside the graph
                        and its trace. Nor can the engine relieve the
                        wait by growing the buffer, as bounded Kahn
                        scheduling does, since buffers are fixed.
                        Dropping inside the graph with a fault keeps
                        the loss where it is seen.
description:            |
                        Sources:
                        - Bounded Kahn scheduling relieves an
                          artificial deadlock by growing the smallest
                          full channel; with fixed capacities that
                          remedy is unavailable (Parks 1995, Bounded
                          scheduling of process networks, sections 4.2
                          and 4.3).
                        - The engine allocates every buffer from the
                          port types, and reallocation does not fit
                          high-integrity systems.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief)
                        - Under one message per edge per step blocking
                          turns an overflow into a missed step
                          deadline upstream, and a sensor cannot be
                          made to wait.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_overflow_blocks_the_producer.yaml
                          at description) ASSUMPTION: a camera or
                          network driver on the Orin drops frames or
                          packets when its own buffers fill, without a
                          record in the engine's trace. Strength:
                          strong against blocking for item overflow
                          within a message; it does not bear on edges
                          a designer gives a deeper queue.

