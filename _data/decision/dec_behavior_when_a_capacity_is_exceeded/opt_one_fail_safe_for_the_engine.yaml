title:                  One fail-safe for the whole engine
brief:                  |
                        The engine applies one fail-safe to every
                        overflow, keeping the first items up to the
                        capacity and raising a fault. Ports declare
                        nothing.
description:            |
                        Smaller for node authors, but it cannot
                        express a port where a partial message is
                        worse than none.

