title:                  Overflow blocks the producer
brief:                  |
                        A producer that would overflow a port waits
                        until the reader has taken the message, so
                        nothing is dropped and the delay propagates
                        upstream.
description:            |
                        The rule for Kahn networks with bounded
                        channels (Parks 1995). Under one message per
                        edge per step it turns an overflow into a
                        missed step deadline upstream, and a sensor
                        cannot be made to wait.

