title:                  Behavior when a capacity is exceeded
brief:                  |
                        What does a port do when more items arrive in
                        a step than its capacity holds?
description:            |
                        Under maximum producer rates an overflow means
                        a stated bound was wrong, so it is a broken
                        requirement rather than an expected event, but
                        a high-integrity engine must still act
                        defensively when it happens (WTP, 2026-10-28).
                        Parameterized dataflow (Bhattacharya and
                        Bhattacharyya 2001) makes overflow a declared
                        check rather than a side effect of a queue
                        filling.

