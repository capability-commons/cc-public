title:                  Per-port fail-safe with a default entry
brief:                  |
                        A fail-safe on every port is one more thing
                        each node author must choose and each reviewer
                        must read, and a list that grows by request
                        would soon need its own documentation. Both
                        costs shrink if the list is fixed and small,
                        like the list of delivery policies, and one
                        entry, drop the excess and raise a fault, is
                        the default a port gets by saying nothing.
                        Most ports then look exactly as under one rule
                        for the engine, and only the few where a
                        partial list is worse than none carry a
                        declaration. One rule for the engine is the
                        least to learn, but a change to it, when one
                        port needs another response, touches every
                        port.
description:            |
                        Sources:
                        - A dataflow edge carries a delivery policy
                          named from one fixed list.
                          (_data/decision/dec_edge_policy/ruling_named_delivery_policy_on_edge_now.yaml
                          at brief)
                        - The engine-wide rule is smaller for node
                          authors, but it cannot express a port where
                          a partial message is worse than none.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_one_fail_safe_for_the_engine.yaml
                          at description)
                        - WTP wants to avoid clever mechanisms that
                          burden node authors (WTP, 2026-10-28).
                          Strength: moderate; it narrows the gap
                          between the two dropping options on
                          maintainability and asks that the per-port
                          option name a default.

