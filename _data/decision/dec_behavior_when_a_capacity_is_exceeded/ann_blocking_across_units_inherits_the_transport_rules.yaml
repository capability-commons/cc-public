title:                  Blocking across execution units that inherits the transport's rules
brief:                  |
                        A drop with a fault is decided where the item
                        is written into the bounded array, before any
                        transport node sees the message, so the
                        response is the engine's own code on every
                        placement. Blocking a producer whose reader
                        sits on another execution unit needs flow
                        control back across the link, and that
                        behavior is whatever the transport library
                        provides, including its own buffering and its
                        own drops when a history fills. The overflow
                        response would then change with the choice of
                        transport and its version, a dependency the
                        dropping options do not have.
description:            |
                        Sources:
                        - The engine carries values only within one
                          execution unit, and a transform inserts
                          sender and receiver nodes where placement
                          splits an edge.
                          (_data/decision/dec_how_values_cross_execution_units/ruling_transport_nodes_inserted_by_a_transform.yaml
                          at brief)
                        - A transport whose packet size is wrong can
                          deadlock a cycle, since the producer waits
                          to fill a packet that depends on its own
                          output, so how a transport waits is part of
                          the graph's behavior (Nadezhkin et al. 2009,
                          Realizing FIFO communication when mapping
                          Kahn process networks onto the Cell, section
                          4).
                        - A transport library has its own rules on who
                          frees a buffer.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ann_transport_library_rules_on_who_frees_a_buffer.yaml
                          at brief) ASSUMPTION: transports considered
                          for crossing units, such as DDS
                          implementations, apply their own history
                          depth and may drop or block by their own
                          quality-of-service settings. Strength:
                          moderate; it applies only to edges split by
                          placement, but on the Orin those are the
                          edges where overflow is most likely.

