title:                  Fixed-layout dictionary types against open-ended documents
brief:                  |
                        A type of the data dictionary describes plain
                        data of fixed size that the engine reads in
                        place, with a fixed capacity for every
                        sequence and string, and the trial's
                        dictionary types held only fields of a
                        primitive or another type, generated as packed
                        C structs. A variant, a delta module, a sweep
                        or a report of failures needs what the engine
                        must never hold: optional fields, maps keyed
                        by name, lists of any length, a different set
                        of fields for each kind of operation, and free
                        text. Stating documents as dictionary types
                        grows the dictionary into a second type
                        system, with a rule that keeps its document
                        half out of every engine message, while the
                        JSON Schema option leaves the dictionary to
                        what the engine exchanges.
description:            |
                        Sources:
                        - Everything that crosses an edge is of fixed
                          size, every sequence
                          and string has a fixed capacity, and nothing is allocated while
                          stepping.
                          (_data/decision/dec_form_of_the_data_dictionary/ann_external_schema_adds_second_language_and_value_form.yaml at description)
                        - Each type is a data item with a version and
                          a mapping for each
                          field.
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml at brief)
                        - The trial's dictionary types list fields
                          whose type is a
                          primitive or another type, and the generator writes them as
                          packed C structs. (trial 2c777ab9,
                          src/cctool/dataflow/dictionary.py, MAP_PRIMITIVE and class Field;
                          src/cctool/dataflow/generate.py, function _types)
                        - A variant holds a base, an ordered set of
                          operations each with an
                          id and a guid, and whether it is abstract or superset; a run holds
                          bindings, input data by digest, seeds and named measures.
                          (_data/interface_control_document/icd_dataflow_items.yaml at surface.data.artifact.artifact)
                        - Each of the trial's thirteen operations
                          carried fields of its
                          own: a write a path and a value of any type, an added unit a form
                          and a period, a merge a list of variants and joins. (trial
                          2c777ab9, src/cctool/dataflow/resolve.py, MAP_OPERATION and the
                          functions it names; the added unit's fields as in
                          src/cctool/dataflow/_test/_example/dataflow_variant/dfv_trial_two_units.yaml)
                        ASSUMPTION: optional fields, unions and lists
                        without a bound would be added to the
                        dictionary for documents only, and a check
                        would refuse them in any type an engine
                        message uses. Strength: moderate to strong for
                        simplicity, since each document feature the
                        engine must refuse becomes one more rule; it
                        weakens only if documents were reshaped to
                        fixed layouts, which no record proposes.

