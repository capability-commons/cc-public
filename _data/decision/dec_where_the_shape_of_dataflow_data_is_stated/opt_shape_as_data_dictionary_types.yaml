title:                  Shape as types of the data dictionary
brief:                  |
                        Every shape, of documents and of engine
                        messages alike, is a type of the data
                        dictionary, with its version and upgrade
                        mappings, so that the model, the checks and
                        the engine share one system of types, and a
                        change of shape is an upgrade like any other.

