title:                  Where the shape of dataflow data is stated
brief:                  |
                        The dataflow items, the Python types that the
                        model's interfaces name, and the messages the
                        engine exchanges each have a stated content
                        but no stated shape. Where is the shape of
                        each written down, so that the toolchain, the
                        engine and the checks read one source?
description:            |
                        icd_dataflow_items states the content of a
                        variant, a delta module, a sweep, a run and a
                        deployment, but only the graph and its nodes
                        have schemas (sch_dataflow_graph and
                        sch_dataflow_node). icd_dataflow_resolver and
                        icd_dataflow_lowering name Python types, such
                        as the resolved graph, the lowered graph, a
                        change set and a set of failures, without
                        their fields, and the port types of the
                        interface control documents are informal
                        spellings that name no entry of a data
                        dictionary (review of 2026-10-29, CC-065). The
                        trial implementation of 2026-10-29 invented
                        the shapes it needed, and its files
                        contradicted the schemas on dev (CC-026).
                        Already ruled: each type of the data
                        dictionary is a versioned item with upgrade
                        mappings
                        (ruling_dictionary_items_with_upgrades), and
                        port types name entries of a data dictionary
                        (ruling_port_types_from_data_dictionaries).
                        Where the items are kept is open in
                        dec_where_dataflow_items_are_kept.

