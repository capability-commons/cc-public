title:                  Fields of the Python types listed in the interfaces that name them
brief:                  |
                        The resolver, lowering and checks interfaces
                        name ResolvedGraph, LoweredGraph, ChangeSet
                        and Failures without their fields, the trial's
                        author asked for those types to be field lists
                        in the interface control documents, and the
                        review's fix takes up that suggestion. The
                        schema of an interface control document
                        already lets a native surface declare a class
                        with attributes, each with a type, so these
                        fields can be written beside the functions
                        that return them with no change to the schema,
                        and each field then traces to the interface
                        that needs it. That supports the typed-field
                        option for the Python types. Its larger claim,
                        one list for Python, C and JSON Schema alike,
                        has no home today, since a shared declaration
                        states its shape only in prose.
description:            |
                        Sources:
                        - The Python interfaces name ResolvedGraph,
                          LoweredGraph,
                          ChangeSet, Failures, DictionaryType and FieldMapping and define
                          none of their fields. (trial process log, phase 0)
                        - The trial's author would put the types in
                          the interface control
                          documents as typed field lists that can be generated into
                          dataclasses. (trial process log, suggestions for the process,
                          item 1)
                        - The review's fix for the informal types is a
                          dictionary entry or
                          a declared type parameter for each generic port, and Python types
                          as field lists, citing the log's first suggestion. (review of
                          2026-10-29, CC-065)
                        - A class may list its attributes, each with a
                          type.
                          (_data/schema/sch_interface_control_document.yaml at $defs.class and $defs.attribute)
                        - A shared declaration carries an optional
                          shape written in prose.
                          (_data/schema/sch_interface_control_document.yaml at $defs.declaration)
                        - The resolver interface gives its result only
                          as the spelling
                          ResolvedGraph.
                          (_data/interface_control_document/icd_dataflow_resolver.yaml at surface.python.native.function.resolve.returns)
                        - The next generation should be helped by the
                          records being clear.
                          (WTP, 2026-10-29)
                        Strength: strong for the traceability of the
                        Python types, which no other option places in
                        the interface that uses them; weak for the C
                        and JSON Schema half, which needs a construct
                        the schema lacks.

