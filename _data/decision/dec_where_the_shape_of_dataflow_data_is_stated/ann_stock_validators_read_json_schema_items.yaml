title:                  Document shapes that a partner can validate with stock tools
brief:                  |
                        JSON Schema is a public standard, and the
                        repository's schemas already follow its
                        2020-12 draft, so a partner or a wrapper
                        language that writes variants or reads run
                        records can validate them with any conforming
                        validator, under the JSON Schema option and
                        under the typed-field option, which also
                        generates a JSON Schema for files. Dictionary
                        types are an in-house form that only cctool
                        reads. The gain is partial: the array keywords
                        of 2020-12 cannot say which field identifies
                        an element or whether order matters, which
                        merge keys and the input digest need, so these
                        must be extension keywords that a stock
                        validator keeps only as annotations.
description:            |
                        Sources:
                        - The repository's meta-schema composes the
                          draft 2020-12
                          meta-schema. (_data/schema/sch_schema.yaml at description)
                        - A dataflow graph is configuration data that
                          any wrapper language
                          can produce, as ruled on 2026-10-29.
                          (_data/interface_control_document/icd_dataflow_items.yaml at description)
                        - The validation keywords for arrays in draft
                          2020-12 are
                          maxItems, minItems, uniqueItems, maxContains and minContains,
                          and none names a key or declares order insignificant. (JSON
                          Schema Validation, draft 2020-12, section 6.4,
                          https://json-schema.org/draft/2020-12/json-schema-validation)
                        - An implementation should treat a keyword it
                          does not support as
                          an annotation, and the core's data model takes an array to be
                          an ordered list. (JSON Schema Core, draft 2020-12, section 6.5
                          and the instance data model,
                          https://json-schema.org/draft/2020-12/json-schema-core)
                        - Every array of a dataflow graph must name
                          the key that picks out
                          one element, and no schema declares one today.
                          (_data/requirement/rqt_dataflow_schema_merge_keys.yaml at brief;
                          review of 2026-10-29, CC-058)
                        - The trial sorted every array that had a
                          merge key, ordered or
                          not, and two different variants shared one input digest. (review
                          of 2026-10-29, CC-005)
                        - The compatibility measure counts the tools a
                          partner must
                          install to take part.
                          (_data/register/reg_concern.yaml at entries.concern_compatibility.measure)
                        ASSUMPTION: a partner is given the schemas
                        that the dataflow schemas refer to by $ref,
                        such as sch_standalone, since a stock
                        validator must load them too. Strength:
                        moderate; it counts once a partner or a
                        wrapper language writes or reads these
                        documents, and the merge semantics stay
                        cctool's under every option.

