title:                  Shape in JSON Schema items
brief:                  |
                        Every document that the toolchain reads or
                        writes has a JSON Schema item, as the graph
                        has today: variants, delta modules, sweeps,
                        runs, deployments, change sets and failures.
                        The Python types are generated from those
                        schemas or checked against them, and each
                        interface control document names the schema.
                        Messages that the engine handles stay types of
                        the data dictionary.

