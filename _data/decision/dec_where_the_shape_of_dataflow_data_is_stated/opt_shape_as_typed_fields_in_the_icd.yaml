title:                  Shape as typed fields in the interface control document
brief:                  |
                        Each artifact and callable of an interface
                        control document lists its fields with their
                        types, and generators write the Python
                        classes, the C structs and a JSON Schema for
                        files from that one list. The interface
                        control document is the single source of every
                        shape it names.

