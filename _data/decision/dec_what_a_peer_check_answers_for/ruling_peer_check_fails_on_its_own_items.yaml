title:                  Failure only on the peer's own items
brief:                  |
                        A peer's check runs over the peer and every
                        segment it consumes, and fails only on a
                        failure about an item the peer holds; a
                        failure about a consumed item is shown as a
                        notice. Ruled by William Payne on 2026-10-24.

