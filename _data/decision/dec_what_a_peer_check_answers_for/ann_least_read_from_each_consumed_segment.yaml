title:                  Least read from each consumed segment
brief:                  |
                        Reading consumed items only to resolve
                        references asks the least of a consumed
                        segment and of the machine that runs the
                        check. The peer's check then grows with the
                        peer, not with all it consumes. It also needs
                        only what resolves an id, which a segment
                        served from a database or an MCP server could
                        supply without handing over its whole tree.
description:            |
                        Sources:
                        - The only-own option reads consumed items
                          only to resolve the peer's references and
                          register entries
                          (_data/decision/dec_what_a_peer_check_answers_for/opt_peer_checks_only_its_own_items.yaml at brief).
                        - The other two options run the check over the
                          peer and every segment it consumes
                          (_data/decision/dec_what_a_peer_check_answers_for/opt_peer_check_fails_on_any_finding.yaml at brief;
                          _data/decision/dec_what_a_peer_check_answers_for/opt_peer_check_fails_on_its_own_items.yaml at brief).
                        - cctool check over the snapshot takes about
                          30 s in the cloud container (measured
                          2026-10-24 at commit c2c55fdd, context
                          file).
                        - Partner segments are likely to use a graph
                          database or similar as their backing
                          (owner's statement, 2026-10-22).
                        - An MCP server or API serving reads may sit
                          beside the files (owner's statement,
                          2026-10-24).
                        - ASSUMPTION: the time of a check over the
                          union grows with the number of items in it.
                        - ASSUMPTION: resolving a reference needs only
                          the ids, guids, types and register entries
                          of a consumed segment. Strength: moderate
                          today, when the only consumed segment is
                          cc-public; strong at ten times the consumed
                          content.

