title:                  Notices that show where consumed content does not read
brief:                  |
                        Showing a failure about a consumed item as a
                        notice tells the peer where what it received
                        does not read correctly with its own tool,
                        without blocking it. If the rules never run
                        over consumed items, a consumed item that
                        fails a schema or names nothing goes unseen in
                        the peer. The peer then learns of the gap only
                        when one of its own items trips over it.
description:            |
                        Sources:
                        - The own-items option shows a failure about
                          an item of a consumed segment as a notice,
                          because the consumed release passed its own
                          gate
                          (_data/decision/dec_what_a_peer_check_answers_for/opt_peer_check_fails_on_its_own_items.yaml
                          lines 12-19).
                        - The only-own option runs no rule over
                          consumed items, so their failures are never
                          computed in the peer
                          (_data/decision/dec_what_a_peer_check_answers_for/opt_peer_checks_only_its_own_items.yaml
                          lines 12-17).
                        - The check validates each YAML document
                          against the schemas it must conform to
                          (src/cctool/check/schema.py lines 16-17).
                        - The check reports a reference that names no
                          item (src/cctool/check/check.lp lines
                          963-968).
                        - ASSUMPTION: at many consumed segments,
                          notices may need grouping by segment to stay
                          readable. Strength: moderate; it holds at
                          ten times the size, since more consumed
                          content means more places where it may not
                          read.

