title:                  Consumed content outside a gated release
brief:                  |
                        Failure only on the peer's own items shows a
                        failure in consumed content as a notice,
                        because the consumed release passed its own
                        gate. That holds for a release pinned by hash
                        in the lock, but not while the peer is
                        switched to a local checkout, whose content no
                        release gate has passed. Reading consumed
                        items only to resolve references never
                        computes such failures at all. Failure on any
                        finding keeps the gate a check of everything
                        the peer's results rest on, in either state.
description:            |
                        Sources:
                        - The ruled command group switches a peer
                          between a release and a
                          local checkout
                          (_data/decision/dec_commands_for_peers/ruling_peer_command_group.yaml,
                          brief).
                        - While switched to a local checkout a peer
                          runs whatever that
                          checkout holds rather than a pinned release
                          (_data/decision/dec_commands_for_peers/ann_local_checkout_switch_bypasses_pin.yaml,
                          brief).
                        - pixi.lock records a sha256 hash for each
                          package it locks
                          (_data/decision/dec_how_peers_get_cc_public/ann_package_hash_lets_peer_verify_release.yaml,
                          description).
                        - "All peers are my own, so this is acceptable
                          for now." (owner's
                          statement, 2026-10-22, quoted in
                          _data/decision/dec_commands_for_peers/ann_local_checkout_switch_bypasses_pin.yaml).
                        Strength: weak to moderate; the peers are all
                        the owner's own today, and a notice limited to
                        hash-verified releases would answer it as
                        well; at ten times the peers, with partners'
                        segments, it grows.

