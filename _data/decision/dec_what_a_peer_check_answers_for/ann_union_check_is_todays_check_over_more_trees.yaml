title:                  The union check as today's check over more trees
brief:                  |
                        Failing on any finding is the check that runs
                        today, over more documents, and adds no rule
                        about where an item sits. A consumed release
                        has already passed cctool check on the _data
                        it ships, with the same tool, so a failure
                        about a consumed item in the union comes from
                        the peer's content or from a switched local
                        checkout. Nothing has to sort findings by
                        segment to keep the signal.
description:            |
                        Sources:
                        - The check reads the documents of a tree and
                          evaluates the rules over them, with no
                          notion of where an item sits
                          (src/cctool/check/check.py within review).
                        - The release gate checks that the built
                          package holds _data and that cctool check
                          passes on the _data it ships
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml at brief).
                        - The previous iteration found that a
                          consumer's gate reported the core's findings
                          beside its own, and called that noise
                          (legacy ddr_one_name_for_a_tree.yaml lines
                          157-165).
                        - too_many_unheld_rules counts every unheld
                          design rule in what is read, against a cap
                          of 3 (src/cctool/check/check.lp within unheld_rule_cap). Strength: strong while
                          consumed releases pass their own gate; the
                          limits are advice about consumed items still
                          printed in the peer, and union-wide counts
                          such as the unheld rule cap, which count
                          cc-public's items too.

