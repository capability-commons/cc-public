title:                  Findings on consumed items echoed into the peer's output
brief:                  |
                        Under every option the peer reads the same
                        consumed files, so none changes what personal
                        data is held or who may read it. The options
                        differ only in what the peer's check prints:
                        findings name the item and say what is wrong
                        with it, so the two options that compute
                        findings over consumed items repeat details of
                        those items in the peer's output and logs,
                        while the option that runs no rule over them
                        does not. Every segment a peer consumes today
                        is public, so the difference costs nothing
                        yet; it matters only once a segment holding
                        personal data is consumed.
description:            |
                        Sources:
                        - cctool prints each failure as its file and
                          line, the name of the check, and the did
                          sentence (AGENTS.md#failures-and-errors).
                        - A did sentence names the item and what is
                          wrong with it, for example "{id} breaks
                          {schema} at {path}: {message}"
                          (src/cctool/check/check.py within WORDING_SCHEMA).
                        - Some segments may hold personal data under
                          the GDPR, and federation must let a segment
                          meet such requirements
                          (_data/logical_component/lco_federation.yaml,
                          description).
                        - Personal data lives only in private
                          repositories (owner's statement,
                          2026-10-22).
                        - cc-public, the only segment a peer consumes
                          today, is public
                          (_data/logical_component/lco_federation.yaml,
                          protective_mark). Drafted by Claude to give
                          the privacy driver a voice; the privacy
                          advocate judged that every option reads the
                          same files. Strength: weak; it holds at any
                          size, but only for a consumed segment that
                          holds personal data, and a notice could
                          print ids alone.

