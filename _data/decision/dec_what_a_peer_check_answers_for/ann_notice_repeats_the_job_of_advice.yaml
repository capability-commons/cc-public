title:                  A notice that repeats the job of advice
brief:                  |
                        The check already has a channel for findings
                        that are shown but do not fail: advice. A
                        notice for consumed items is either that same
                        channel under another name, or a third
                        severity beside failure and advice. Reading
                        consumed items only to resolve references
                        splits every rule into the parts that may and
                        may not see them.
description:            |
                        Sources:
                        - advise.lp is evaluated with check.lp, and
                          cctool check reports advice without failing
                          on it (src/cctool/check/check.py lines
                          27-31; src/cctool/cli/checking.py lines
                          57-60).
                        - dangling_reference and duplicate_id need the
                          consumed items in the rule body to answer
                          for the peer's own items
                          (src/cctool/check/check.lp lines 420-428 and
                          956-968). Strength: moderate; if the notice
                          is ruled to be advice, the duplication goes,
                          and what remains is the attribution cost
                          another annotation weighs.

