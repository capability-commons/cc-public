title:                  Failures from content gated by another tool release
brief:                  |
                        Before 1.0, checks are added and tightened
                        freely, so content gated by one release of the
                        tool can fail under a later one. If the peer
                        fails on any finding in the union, it fails on
                        content of a consumed segment that was gated
                        by another release or by other tooling, and
                        that it cannot change. Every segment it
                        consumes would then have to move to the same
                        tool release as the peer.
description:            |
                        Sources:
                        - Before 1.0, checks are added and tightened
                          freely
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml at brief).
                        - cc-patrol moves long before 1.0, following
                          frequent minor and point release tags, and
                          1.0 is likely 6 months or more away (owner's
                          statement, 2026-10-24).
                        - cc-public's _data ships in the wheel with
                          the tool (owner's statement, 2026-10-24), so
                          cc-public's own content arrives with the
                          checks that gated it.
                        - In the previous iteration, a consuming
                          segment may use the tool, extend it or
                          replace it (legacy ddr_tooling_travels.yaml
                          lines 47-51).
                        - The any-finding option fails on any failure,
                          wherever the item it is about sits
                          (_data/decision/dec_what_a_peer_check_answers_for/opt_peer_check_fails_on_any_finding.yaml at brief).
                        - ASSUMPTION: a peer may later consume a
                          segment other than cc-public, gated with
                          another release of cctool or with other
                          tooling. Strength: weak while cc-patrol
                          consumes only cc-public, whose data and
                          checks travel together; strong at ten times
                          the segments, when consumed releases differ.

