title:                  No common subject column across failure rows
brief:                  |
                        The 70 checks give their rows in 23 different
                        leading columns. Some rows name two items that
                        can sit in different segments, and one names
                        no item at all. Sorting failures by segment,
                        or running rules over the peer's items only,
                        needs a per-check statement of which column is
                        the subject, kept in step with every check
                        added or changed.
description:            |
                        Sources:
                        - check.lp shows 70 checks, whose first
                          columns take 23 different names, among them
                          id, holder, node, concept, type and register
                          (src/cctool/check/check.lp, the #show and
                          decl lines).
                        - duplicate_id names one id held by two guids,
                          which may sit in two trees
                          (src/cctool/check/check.lp lines 420-428).
                        - duplicate_prefix names a prefix and two
                          types (src/cctool/check/check.lp lines
                          174-182).
                        - too_many_unheld_rules names a count and a
                          cap, and no item (src/cctool/check/check.lp
                          lines 3422-3429).
                        - Each shown predicate already carries did and
                          fix fields, and a test fails one that lacks
                          either (AGENTS.md lines 155-161). Strength:
                          moderate to strong; it grows with each check
                          added, though the did and fix pattern shows
                          a way to declare a subject per check.

