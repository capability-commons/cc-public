title:                  Failure only on the peer's own items
brief:                  |
                        The check runs over the peer and every segment
                        it consumes, and a failure fails it only when
                        the item the failure is about sits in the
                        peer. A failure about an item of a consumed
                        segment is shown as a notice, because the
                        consumed release passed its own gate and the
                        peer cannot change it.

