title:                  Explicit empty outputs while a node is replaced
brief:                  |
                        Holding a node's outputs empty while it
                        restarts makes the gap visible to every
                        downstream node as an explicit empty token,
                        which each can handle by the availability rule
                        its interface states. That is a defined,
                        testable degraded state, provided the rest of
                        the graph is tested for it.
description:            |
                        Sources: the restart option holds the node's
                        outputs empty while it restarts
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_by_restart_from_saved_state.yaml
                        at brief); an interface can state what its
                        step does when an input carries no value
                        (_data/schema/sch_interface_control_document.yaml
                        at
                        $defs.surface_dataflow_step.properties.availability);
                        loss and delay become explicit empty tokens at
                        a gateway, and a segment can be tested for any
                        pattern of arrival and loss
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-197). Strength: weak to moderate; it
                        holds at scale only if downstream nodes state
                        their availability rule. It does not bear on
                        the swap at a step, which has no gap unless it
                        goes back, nor on no live swap, where the
                        whole process restarts.

