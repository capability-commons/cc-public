title:                  Owner's named swap left for a later change to the engine
brief:                  |
                        The owner names the swap of a node at version
                        n for n+1, with its state upgraded in place,
                        as a use case to support. No live swap lacks
                        that function, and adding it later may need a
                        different state form after nodes are written,
                        the late change to every node that the owner
                        warns against. Both live options provide it.
description:            |
                        Sources: "One specific use-case we should
                        support is a node at version n being swapped
                        out for the same node at version n+1", with
                        the state output from the last step at version
                        n "upgraded in-place" (owner's statement,
                        2026-10-24, lines 22-24), and "it is VERY hard
                        to change the engine once it's built and
                        you've started using it" (same statement, line
                        7). The owner chose Kahn networks and actors
                        together so as not to leave "a forgotten,
                        dangling thread"
                        (_data/decision/dec_first_semantics/ruling_first_semantics.yaml,
                        brief). Without a live swap a new version
                        takes effect only when its OS process restarts
                        (_data/decision/dec_swap_of_a_node_version/opt_no_live_swap.yaml
                        lines 12-15). Simplicity, a non-driver here,
                        notes that a later mechanism would be added to
                        an engine already in use. Strength: moderate.
                        If the state form chosen for node state
                        already supports upgrade, the swap can be
                        added later without touching nodes and this
                        objection falls away; it is strong only if the
                        state form does not, so it rests on that
                        decision.

