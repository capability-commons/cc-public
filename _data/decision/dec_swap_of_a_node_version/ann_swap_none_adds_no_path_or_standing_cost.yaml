title:                  No new path and no standing cost without a live swap
brief:                  |
                        No live swap adds no mechanism: it uses only
                        the process restart, which must exist and work
                        anyway for crash recovery, so it adds no new
                        path to fail. No node needs a repointable slot
                        or reserved room for a second state, so the
                        stepping path keeps its generated form in
                        full.
description:            |
                        Sources: the option makes a new version take
                        effect only on a restart of its OS process
                        with a new configuration
                        (_data/decision/dec_swap_of_a_node_version/opt_no_live_swap.yaml
                        at brief). A frozen schedule uses link-time
                        constant slot addresses
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 38). A crashed process can resume from
                        its last committed step if state lives in
                        mapped files (execution_levels.md lines
                        149-151). Simplicity, a non-driver here,
                        counts distinct mechanisms
                        (_data/register/reg_concern.yaml at
                        entries.concern_simplicity.measure). The owner
                        names the swap of a node at version n for n+1
                        as a use case to support (owner's statement,
                        2026-10-24), which outweighs this; and only
                        dynamic nodes would carry the standing cost.
                        Strength: weak; it counts mechanisms and cost
                        for the first version only.

