title:                  Mix of node versions after a swap held as a resolved variant
brief:                  |
                        A swap substitutes one node's implementation
                        version, which is fragment substitution in
                        CVL's terms, and a dataflow variant can pin
                        the version of each node, so the mix of
                        versions a live swap leads to can itself be a
                        resolved dataflow graph, checked and tested
                        before the change set is sent. That narrows
                        the gap by which only a system with no live
                        swap has every running mix configured and
                        checked whole, provided the variant operations
                        gain a substitution and change sets are
                        generated between resolved variants.
description:            |
                        Sources:
                        - With no live swap every running mix of node
                          versions was configured and checked; with a
                          live swap the mix is covered only if its
                          change set was.
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_none_keeps_every_version_mix_checked.yaml at brief)
                        - The swap at a step is part of a change set,
                          and a swap whose state cannot be upgraded is
                          refused by a check before it is sent.
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml at brief)
                        - The planned operations hold no substitution.
                          (_sources/cc-patrol-notes/variants.md lines
                          57-67)
                        - CVL names fragment substitution, the
                          replacement of one set of elements by
                          another, as a kind of variation point beside
                          existence and value assignment.
                          (https://caosd.lcc.uma.es/vexgine/cvl/)
                        - A swap is a substitution operation, and a
                          variant can pin a node version.
                          (_sources/variants-framing.md, section 2)
                          Strength: weak to moderate; it rests on two
                          open questions, the vocabulary of operations
                          and how change sets are made, and a check of
                          the mix says nothing of the state upgrade
                          itself.

