title:                  Limits of going back after one step
brief:                  |
                        The way back of the swap at a step has two
                        limits the option should state. One step is a
                        short trial, so faults that show after tens or
                        thousands of steps find the old state gone;
                        and by the time version n+1 has completed a
                        step its outputs have gone downstream, so
                        going back restores the node but not what its
                        neighbors did with those outputs. The option
                        should name the rollback window as a number of
                        steps or a time, and say that going back is a
                        new change, not an undo.
description:            |
                        Sources: the option keeps the old state only
                        until the new version completes a step, so it
                        can go back
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19). A step's outputs are written
                        into buffers that downstream inputs point at
                        directly within a process
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 41-46). Assumptions: many faults in a
                        new version show only under inputs or states a
                        single step does not reach; keeping version
                        n's state current over several steps would
                        need version n run in shadow or its inputs
                        replayed, so a longer window is not free;
                        going back is meant to happen after version
                        n+1's outputs were read, since the option
                        allows it after the step completes. Strength:
                        moderate; it applies to every rollback, and it
                        is a fix to the option's wording rather than a
                        case against it.

