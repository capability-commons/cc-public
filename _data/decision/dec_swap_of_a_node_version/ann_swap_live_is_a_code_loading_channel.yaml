title:                  Live swap as a channel for new code into a running process
brief:                  |
                        A live swap brings new code into a running
                        process. A system with security requirements
                        must be able to have the engine verify that
                        code's identity, by a signature or a hash
                        pinned in the change set, before it is loaded,
                        and refuse a version older than the one
                        running, so a swap cannot install malicious
                        code or roll back to a known flaw. Without a
                        live swap, new code arrives only by the
                        platform's normal install and restart, where
                        those controls already exist.
description:            |
                        Sources: the swap is part of a change set and
                        runs version n+1 in place of n at the start of
                        a step
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        at brief); without a live swap a new version
                        takes effect only when its OS process restarts
                        with a new configuration
                        (opt_no_live_swap.yaml at brief); the dynamic
                        host loads libraries named in configuration
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 65). Erlang/OTP release handling installs
                        upgrades through relup and code_change, and
                        its documentation describes no signing of
                        release packages
                        (https://www.erlang.org/doc/system/release_handling).
                        Android Verified Boot stores a rollback index
                        in tamper-evident storage and refuses images
                        with a lower index
                        (https://android.googlesource.com/platform/external/avb/+/refs/heads/android15-tests-dev/README.md).
                        The owner wants the swap supported (owner's
                        statement, 2026-10-24) and the engine to let
                        the systems it runs meet their security
                        requirements (2026-10-22, _sources/context.md
                        line 25). Assumption: on a target without a
                        dynamic loader, version n+1 is already linked
                        into the image, which removes run-time code
                        loading but not the need to authorize the
                        swap. This rests on the first-engine decision
                        and on how a change set is applied at a step,
                        which would carry the verification. Strength:
                        strong; every swappable node is a place new
                        code can enter, so the risk grows with the
                        number of dynamic nodes.

