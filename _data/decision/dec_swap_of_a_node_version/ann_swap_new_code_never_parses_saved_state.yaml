title:                  Upgraded state produced by the engine, not parsed by the new code
brief:                  |
                        In the swap at a step, the engine upgrades
                        state by the dictionary's mapping and keeps
                        the old state, so the new version never parses
                        saved bytes itself. In a swap by restart from
                        saved state, the new version loads saved
                        state, which under opaque state means new code
                        parsing bytes that may have been tampered with
                        while the node was stopped.
description:            |
                        Sources: the swap at a step upgrades state by
                        the dictionary's mapping and keeps the old
                        state until the new version completes a step
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        at brief); the restart option saves state,
                        stops the node, starts n+1 and loads the
                        upgraded state
                        (opt_swap_by_restart_from_saved_state.yaml at
                        brief). CWE-502, Deserialization of Untrusted
                        Data
                        (https://cwe.mitre.org/data/definitions/502.html).
                        This rests on the form of node state (the
                        challenge holds if it chooses opaque state)
                        and on the form of the data dictionary.
                        Strength: moderate.

