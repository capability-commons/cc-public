title:                  Way back to version n after a failed first step
brief:                  |
                        Keeping version n's state until version n+1
                        completes a step gives a defined fallback: if
                        the new version fails its first step, the
                        engine can run version n again on its own
                        unchanged state. A restart from saved state
                        states no way back once the old state is
                        replaced, so a failing n+1 leaves the node out
                        of service.
description:            |
                        Sources: the swap at a step keeps the old
                        state until the new version completes a step,
                        so it can go back
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19); the restart option saves state,
                        stops the node, starts n+1 and loads the
                        upgraded state
                        (opt_swap_by_restart_from_saved_state.yaml
                        lines 12-16). Erlang/OTP release handling
                        suspends processes, calls code_change to
                        convert their state, and if installation fails
                        reboots the system with the old release
                        (https://www.erlang.org/doc/system/release_handling.html).
                        Changes happen only between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). Assumption: completing a step
                        detects a version that signals failure or
                        throws
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 95-96), not one that completes with
                        wrong outputs, so going back covers the first
                        case only. This rests on the form of node
                        state (the engine must hold a copy of the
                        state, which opaque state makes harder) and on
                        the form of the data dictionary (the mapping
                        that produces the new state). Strength:
                        moderate to strong; a per-swap mechanism, so
                        it holds at ten times the nodes, but it covers
                        only failures the engine can see.

