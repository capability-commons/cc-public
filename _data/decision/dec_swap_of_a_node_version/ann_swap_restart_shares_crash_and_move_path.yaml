title:                  Restart path shared by a swap, a crash restart and a node move
brief:                  |
                        A swap by save, stop, start and load reuses
                        the restart path and the empty-token
                        convention that consumers already handle, so
                        one mechanism serves a crash restart and an
                        upgrade, and the same steps would also move a
                        node to another execution unit or host as load
                        changes. A swap at a step upgrades state in
                        place, adds a second path with two live
                        versions and rollback state, and gives no such
                        move.
description:            |
                        Sources: the restart option saves the node's
                        state, stops it, starts version n+1, loads the
                        upgraded state and holds outputs empty
                        meanwhile
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_by_restart_from_saved_state.yaml
                        lines 12-16); the swap at a step upgrades
                        state where it is and keeps the old state
                        until the new version completes a step
                        (opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19). The Stableflow dynamic host
                        starts, stops, restarts and rewires only
                        between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72); every packet carries an enable
                        flag, cleared at the start of a step and set
                        when it carries data
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 14-15). Flexibility asks whether the
                        design scales up or down as load changes
                        (_data/register/reg_concern.yaml lines
                        349-352). Assumption: the engine will at some
                        point move a node between execution units; no
                        source states this yet. This rests on the form
                        of node state: with opaque state the save and
                        load hooks are per node, which reverses the
                        maintainability gain, and a move is
                        engine-only only under typed or feedback-edge
                        state. Strength: moderate for the shared path,
                        which is engine code and does not grow with
                        nodes; weak to moderate for the move, which
                        rests on a need not yet stated.

