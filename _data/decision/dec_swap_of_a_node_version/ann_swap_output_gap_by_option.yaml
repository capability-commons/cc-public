title:                  Output gap left by each way of swapping
brief:                  |
                        A swap at a step loses no step: version n+1
                        runs in the step at which its state is
                        upgraded, and the node's outputs continue. A
                        restart from saved state leaves the node's
                        outputs empty for as many steps as the restart
                        takes, a gap every downstream node sees. No
                        live swap restarts the whole OS process, so
                        every node in it, static nodes included, loses
                        its run, not only the node being upgraded.
description:            |
                        Sources: the swap at a step upgrades the state
                        at the start of a step and runs version n+1 in
                        its place
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19); the restart option holds the
                        node's outputs empty while it restarts
                        (opt_swap_by_restart_from_saved_state.yaml
                        lines 12-16); no live swap takes effect only
                        when the OS process restarts with a new
                        configuration (opt_no_live_swap.yaml lines
                        12-15). The smoketest graph has one host
                        running one OS process that holds all its
                        nodes
                        (_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                        line 17), and a frozen island always runs
                        within one OS process
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 76-80). Only the dynamic subgraph is to
                        change while running (owner's statement,
                        2026-10-24 12:33Z, line 18). Patrol's
                        appearance and segmentation engines load
                        models on first use inside a frame
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 100-103). Assumption: a restart that
                        loads a library and allocates buffers takes
                        longer than one 33 ms step at Patrol's 30 Hz
                        camera rate (_sources/cc-patrol-notes/plan.md
                        lines 180-182). This rests on the form of node
                        state: the in-place upgrade needs typed state,
                        and under opaque state the restart is the swap
                        the hooks support. Strength: moderate to
                        strong; per swap, so independent of node
                        count, stronger for nodes with costly
                        start-up, and growing against no live swap as
                        more nodes share a process.

