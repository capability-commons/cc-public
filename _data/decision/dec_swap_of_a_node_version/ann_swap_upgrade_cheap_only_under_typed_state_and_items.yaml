title:                  State upgrade at a swap that rests on two other decisions
brief:                  |
                        Upgrading state by the dictionary's mapping is
                        engine code with no third-party library,
                        checkable before the swap is sent and testable
                        offline on a recorded state, but only if node
                        state is typed data and the dictionary is our
                        own items with upgrades. Under an external
                        schema language the upgrade is that library's
                        resolution code, linked into every target that
                        swaps; under opaque state it is each node's
                        own upgrade code called inside a step.
description:            |
                        Sources: the swap at a step upgrades the
                        node's state by the dictionary's mapping and a
                        swap whose state cannot be upgraded is refused
                        by a check before it is sent
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19); the restart option loads the
                        upgraded state
                        (opt_swap_by_restart_from_saved_state.yaml
                        lines 12-16). Dictionary items with upgrades
                        name, for each field, kept, renamed, converted
                        or new with a default
                        (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_items_with_upgrades.yaml
                        lines 12-18). Avro C++ 1.12 builds against
                        several Boost components and fmt
                        (https://patchwork.yoctoproject.org/project/oe/patch/20250707225407.1558421-2-alperyasinak1@gmail.com).
                        The owner asks that a swap carry state from n
                        to n+1 by the dictionary's mappings (owner's
                        statement, 2026-10-24 12:33Z). Assumption: two
                        versions of one component live at once need
                        distinct symbol names, so the naming macro
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 16-17) would have to include the
                        version. This rests on the form of node state
                        choosing typed data and the form of the data
                        dictionary choosing its own items with
                        upgrades; under other outcomes the support
                        turns into a challenge. Strength: moderate;
                        strong under those two outcomes, after which
                        it holds at any number of nodes, and the
                        per-swap check grows in value with node count,
                        since a swap refused before sending costs less
                        to repair than one found in service.

