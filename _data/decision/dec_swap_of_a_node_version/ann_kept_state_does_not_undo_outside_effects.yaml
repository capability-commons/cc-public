title:                  Kept state that does not undo outside effects
brief:                  |
                        Keeping the old state lets the engine go back
                        to version n's state, but not take back what
                        version n+1 did outside the graph in its first
                        step, such as a command sent to an actuator or
                        a call to an outside service. Going back after
                        such a step is safe only if the node sent
                        nothing outside, or what it sent is safe to
                        send again or can be canceled. The option
                        should say which nodes may be swapped with a
                        way back on those terms.
description:            |
                        Sources:
                        - MillWheel checkpoints produced records
                          before delivery in the same atomic write as
                          the state change, which bounds what recovery
                          must undo; it does not undo an arbitrary
                          external action (Akidau et al. 2013,
                          MillWheel, section 6.1.2).
                        - Keeping old state until one successful new
                          step cannot reverse an external command, a
                          consumed event or a committed output by
                          copying bytes back (ChatGPT corpus analysis,
                          D-change-and-evolution.md section D1,
                          2026-10-28).
                        - The option keeps the old state until the new
                          version completes a step, so it can go back.
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                          at brief)

