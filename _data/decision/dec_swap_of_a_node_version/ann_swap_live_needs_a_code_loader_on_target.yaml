title:                  Code loader a live swap needs where it runs
brief:                  |
                        Both live swaps need version n+1's code in the
                        running process: on Linux that is dlopen, and
                        on a target with no OS or no loader it means
                        linking every version ahead of time. No live
                        swap needs neither, so it is the floor every
                        platform shares, and the live options must
                        fall back to it where no loader exists.
description:            |
                        Sources: the Stableflow dynamic host dlopens
                        component libraries named in configuration
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 65); dlopen is a POSIX interface
                        (https://pubs.opengroup.org/onlinepubs/9699919799/functions/dlopen.html).
                        A macro gives each component's functions
                        unique names, so many components can link into
                        one binary (execution_levels.md lines 16-17).
                        The owner wants the engine to reach embedded
                        systems with no OS (owner's statement,
                        2026-10-24 13:06Z) and to support the swap of
                        version n for n+1 (12:33Z). The swap at a step
                        keeps the old state until the new version
                        completes a step, so both versions are present
                        at once
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19); Erlang likewise keeps current
                        and old code of a module, both valid at once
                        (https://erlang.org/doc/system/code_loading).
                        Without a live swap, a new version takes
                        effect when its OS process restarts
                        (opt_no_live_swap.yaml lines 12-15).
                        Assumptions: a target with no OS has no
                        dynamic loader; unique names per version would
                        let n and n+1 link together, so such a target
                        could swap only to versions it was built with.
                        This rests on where mutability is declared: a
                        node that must be static never swaps live.
                        Strength: moderate; the loader is one platform
                        dependency, not one per node, and it bounds
                        where the live options apply rather than
                        ruling them out.

