title:                  Swap at a step, with its state upgraded
brief:                  |
                        The swap is part of a change set. At the start
                        of a step the engine upgrades the node's state
                        by the dictionary's mapping and runs version
                        n+1 in its place, keeping the old state until
                        the new version completes a step, so it can go
                        back. A swap whose state cannot be upgraded is
                        refused by a check before it is sent.

