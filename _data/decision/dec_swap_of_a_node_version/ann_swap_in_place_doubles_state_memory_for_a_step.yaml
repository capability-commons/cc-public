title:                  Memory and step time of an upgrade in place
brief:                  |
                        Keeping the old state until the new version
                        completes a step doubles the swapped node's
                        state memory for a step, and the field mapping
                        runs inside the step, lengthening it once.
                        Both are bounded when state is fixed-size
                        typed data, but room for the second copy must
                        be reserved ahead of time to keep stepping
                        free of allocation.
description:            |
                        Sources: the option keeps the old state until
                        the new version completes a step
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19); buffer sizes are known before
                        the system starts and nothing is allocated on
                        the heap while stepping
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 148-151). Assumption: the engine must
                        reserve room for the second copy for every
                        node that may be swapped, so peak memory
                        includes it. This rests on the form of node
                        state being fixed-size typed data. Strength:
                        weak per swap; it grows with the number of
                        swappable nodes if room is reserved for each.

