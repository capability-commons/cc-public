title:                  Swap as one more operation of a change set
brief:                  |
                        Swapping at a step makes the swap one more
                        operation of the change set, applied at the
                        step boundary already used for rewires, with
                        the state upgrade one use of the dictionary's
                        mapping. Restarting from saved state adds a
                        save, stop, start and load sequence and a mode
                        with empty outputs beside it. This holds if
                        state is typed data and the dictionary carries
                        mappings.
description:            |
                        Sources: the swap at a step is part of a
                        change set, upgrades state by the dictionary's
                        mapping at the start of a step and is refused
                        by a check when the state cannot be upgraded
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        lines 12-19); start, stop, restart and rewire
                        happen only between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72); the restart option saves state,
                        stops the node, starts n+1 and loads the
                        upgraded state, holding outputs empty
                        meanwhile
                        (opt_swap_by_restart_from_saved_state.yaml
                        lines 12-16). Simplicity, a non-driver here,
                        counts distinct mechanisms
                        (_data/register/reg_concern.yaml lines
                        488-490). This rests on the form of node state
                        choosing typed data and the form of the data
                        dictionary choosing mapped upgrades; with
                        opaque state, both swap options rest on
                        per-node hooks. Strength: strong under those
                        outcomes.

