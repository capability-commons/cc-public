title:                  Every running mix of node versions configured and checked whole
brief:                  |
                        With no live swap, a new node version runs
                        only after its process restarts with a new
                        configuration, so every mix of node versions
                        that runs was configured, checked and can be
                        tested as a whole. With a live swap, the
                        running mix exists only as the result of a
                        change set, and is covered only if that change
                        set was checked and tested.
description:            |
                        Sources: the no-live-swap option makes a new
                        version take effect only when its OS process
                        restarts with a new configuration
                        (_data/decision/dec_swap_of_a_node_version/opt_no_live_swap.yaml
                        at brief); reconfiguration within a segment
                        should select from a finite set of
                        pre-validated topologies, so the deployed
                        configuration is always one a safety case
                        covers
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 212-215). The owner names the swap of n
                        for n+1 as a use case and says only dynamic
                        nodes may change (owner's statement,
                        2026-10-24). Assumption: the owner's use case
                        can be met by live swap for dynamic nodes and
                        no live swap for static nodes, so a system can
                        keep its safety functions on the restart path.
                        This rests on how a change set is checked
                        before it is applied at a step. Strength:
                        strong for static nodes; weak against live
                        swap of dynamic nodes, which the owner has
                        asked for.

