title:                  One license that keeps items movable
brief:                  |
                        With one license, an item can later be made
                        public by changing its mark alone, as when a
                        note is rewritten without quotes, and every
                        tool that reads rights handles one string. A
                        second license string doubles what checks and
                        partner tools must understand, and the private
                        mark already forbids passing the item on,
                        which is the protection needed.
description:            |
                        Sources:
                        - License is an SPDX expression, the same
                          strings NOTICE, pyproject.toml and partner
                          tools already read.
                          (_data/decision/dec_rights_field_forms/ruling_rights_field_forms.yaml
                          at brief)
                        - Apache-2.0 is the license the tree already
                          carries.
                          (_data/decision/dec_license/ruling_license.yaml
                          at brief)

