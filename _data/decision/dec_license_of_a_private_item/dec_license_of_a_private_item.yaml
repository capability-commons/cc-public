title:                  License of a private item
brief:                  |
                        Which license does an item marked private
                        carry, when it quotes documents the holder is
                        licensed to use but may not pass on?
description:            |
                        The ruled license of the tree is Apache-2.0,
                        and the first corpus put it on its private
                        notes, asking WTP to confirm it. The
                        protective mark governs who may handle an
                        item; the license grants what a recipient may
                        do with it.

