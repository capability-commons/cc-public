title:                  All rights reserved for private items
brief:                  |
                        A private item carries a license reference
                        that grants nothing, written as the SPDX
                        expression LicenseRef-all-rights-reserved, so
                        no recipient of a copy that escapes may reuse
                        it.
description:            |
                        SPDX allows a LicenseRef- identifier for a
                        license it does not list.

