title:                  Grant on a copy that escapes
brief:                  |
                        If a private item is ever passed on by
                        mistake, an Apache license on it reads as
                        permission to reuse it, and a reader may take
                        the quoted excerpts to be covered too. All
                        rights reserved makes the holder's position
                        clear on a copy that escapes, at the cost of a
                        second license string.
description:            |
                        Sources:
                        - The corpus includes papers WTP has purchased
                          and is obliged to protect from
                          redistribution (WTP, 2026-10-28).

