title:                  Pseudonymous trailer that keeps a tamper-evident trace
brief:                  |
                        A private guid in the commit trailer ties each
                        item to the person who supplied it in the
                        shared history, without publishing who they
                        are. Naming only the bot leaves that trace in
                        a store the bot itself can rewrite.
description:            |
                        Security includes accountability for what
                        people do and asks whether every action can be
                        traced to whoever took it [reg_concern.yaml at
                        entries.concern_security]. Under
                        opt_no_contributor_in_public, who said what is
                        kept only in the private store of the bot
                        [opt_no_contributor_in_public.yaml brief].
                        Under opt_contributor_by_name, the
                        contributor's name is written into a public
                        commit trailer [opt_contributor_by_name.yaml
                        brief]. A likely first instance is skill
                        profiles of a volunteer team [context.md lines
                        59-60]. ASSUMPTION: once a commit is pushed
                        and fetched by others, altering it is visible,
                        while the bot's private store has no such
                        property. ASSUMPTION: a public list of who in
                        a small volunteer team supplied which skills
                        helps an attacker choose targets for social
                        engineering. Holds at ten times the size: yes,
                        because more contributors make both the value
                        of a trace and the size of a public name list
                        grow.

