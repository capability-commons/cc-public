title:                  No identity question for the contributor
brief:                  |
                        When the bot names a contributor by a guid it
                        already holds, the contributor is never asked
                        who they are and cannot mistype it. Naming
                        them by name needs a question or a guess on
                        every first contact, and the guid option moves
                        the one-time cost to the maintainer who adds
                        the register entry.
description:            |
                        Each team member gets an item in a team member
                        register, and the commit trailer names a
                        pseudonymous guid of that member (owner's
                        statement). One admission option answers only
                        accounts on a private list that the operator
                        keeps
                        (_data/decision/dec_chat_signal_admission/opt_admit_listed_contacts.yaml,
                        brief). The name option writes the
                        contributor's name in a Co-authored-by trailer
                        (_data/decision/dec_chat_contributor_attribution/opt_contributor_by_name.yaml,
                        brief). The bot-only option names only the bot
                        in public and keeps who said what in its
                        private store
                        (_data/decision/dec_chat_contributor_attribution/opt_no_contributor_in_public.yaml,
                        brief). ASSUMPTION: under the guid and
                        bot-only options, the bot finds the
                        contributor from the Signal account through a
                        private table, so the conversation holds no
                        identity question. ASSUMPTION: under the name
                        option, the bot either asks for a name, which
                        adds a turn and a chance of a typing error, or
                        takes the Signal profile name, which the
                        account holder sets freely and may be a
                        nickname. ASSUMPTION: a member with no
                        register entry yet cannot be named by guid, so
                        someone must add the entry before that
                        member's first item. The concern asks how much
                        time and attention a task takes a person and
                        how well the design prevents mistakes
                        (_data/register/reg_concern.yaml lines
                        251-254). Holds at ten times the size: yes,
                        because the identity question and its error
                        chance recur for every new contributor under
                        the name option, while the guid lookup stays
                        one silent step, and the register entry is a
                        one-time cost per member.

