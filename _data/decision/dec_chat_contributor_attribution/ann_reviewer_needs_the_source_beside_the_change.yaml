title:                  Source of an item visible to the reviewer
brief:                  |
                        A reviewer judges a supplied fact better when
                        the change names who supplied it. Naming only
                        the bot sends the reviewer to the private
                        store of the bot for each change.
description:            |
                        Who and when of an item come from the commit
                        that adds it
                        (_data/decision/dec_author_and_time_of_items;
                        context.md, line 55-56). The name option puts
                        the contributor in a Co-authored-by trailer of
                        the commit
                        (_data/decision/dec_chat_contributor_attribution/opt_contributor_by_name.yaml
                        at brief). The pseudonymous option puts the
                        guid of a person item held in a private
                        repository in a trailer
                        (opt_contributor_by_pseudonymous_guid.yaml at
                        brief). The bot-only option keeps who said
                        what in the private store of the bot
                        (opt_no_contributor_in_public.yaml at brief).
                        The maintainer's workstation holds the
                        repositories (context.md, line 57-58). A
                        trailer adds one line to the commit message
                        (ASSUMPTION: one trailer per contributor).
                        Holds at ten times the size: yes, because a
                        trailer stays one line per commit, while a
                        lookup in a separate store is one extra step
                        per change, and the steps add up with volume.

