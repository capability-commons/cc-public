title:                  Pseudonymous guid as an erasable link
brief:                  |
                        A guid in a public commit that a private
                        register maps to a person is pseudonymized
                        personal data, so the law still covers it.
                        Erasure then means deleting the private
                        mapping, while a name in public history can
                        only be erased by rewriting history in every
                        clone.
description:            |
                        Personal data is any information about a
                        person who can be identified, directly or
                        indirectly, by an identifier such as a name,
                        an ID number or an online identifier [UK GDPR
                        Art 4(1),
                        https://www.legislation.gov.uk/eur/2016/679/chapter/I].
                        Pseudonymization is processing so that data
                        can no longer be linked to a person without
                        additional information that is kept separately
                        and protected [UK GDPR Art 4(5), same URL]. A
                        controller must erase personal data without
                        undue delay when it is no longer needed or
                        consent is withdrawn [UK GDPR Art 17(1)(a) and
                        (b),
                        https://www.legislation.gov.uk/eur/2016/679/article/17].
                        A controller that made the data public must
                        take reasonable steps to tell other
                        controllers to erase copies [UK GDPR Art
                        17(2), same URL]. Data protection by design
                        names pseudonymization as one measure, and by
                        default personal data must not be made
                        accessible to an unlimited number of people
                        without the person's involvement [UK GDPR Art
                        25(1) and 25(2),
                        https://www.legislation.gov.uk/eur/2016/679/article/25].
                        The name option puts the contributor's name in
                        a Co-authored-by trailer
                        [_data/decision/dec_chat_contributor_attribution/opt_contributor_by_name.yaml,
                        brief]. The pseudonymous option puts the guid
                        of a person item held in a private repository
                        in a trailer
                        [_data/decision/dec_chat_contributor_attribution/opt_contributor_by_pseudonymous_guid.yaml,
                        brief]. Each team member gets an item in a
                        team member register, and the trailer names
                        that member's guid [owner's statement].
                        cc-public is published under Apache-2.0
                        [LICENSE lines 2-4]. ASSUMPTION: a guid held
                        in the private register is an indirect
                        identifier, so it stays personal data for
                        anyone who holds the register. This is a
                        reading of the text, not a ruling. ASSUMPTION:
                        once the person item is deleted and no other
                        copy of the mapping exists, the guid left in
                        public no longer identifies anyone.
                        ASSUMPTION: changing a trailer changes the
                        commit id and every later commit. Holds at ten
                        times the size: yes, because one deletion in
                        the private register still covers all of a
                        person's commits, while a history rewrite
                        grows with commits and clones.

