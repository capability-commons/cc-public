title:                  Stable pointer from each commit to its source
brief:                  |
                        A guid of a private person item gives every
                        public commit a stable pointer to the person
                        an item came from. Naming only the bot ends
                        the public trace at the bot.
description:            |
                        A guid is minted once and never changed
                        (AGENTS.md lines 114-115). A personal name is
                        not an id of the graph and can be shared by
                        two people or change (ASSUMPTION). No tooling
                        parses commit trailers: a grep of src for
                        "trailer" finds only text saying where
                        trailers go (src/cc_public/commit/message.py
                        line 21, src/cc_public/cli/messaging.py line
                        81). A reference that names neither an id, a
                        guid nor an alias held in the graph is a check
                        failure, and only references in the mark field
                        are exempt (src/cc_public/check/check.lp lines
                        524-529). So a guid in a trailer is a pointer
                        for a reader with private access, not an edge
                        the checks resolve. Under
                        opt_no_contributor_in_public, the link from a
                        public item to its source exists only in the
                        private store of the bot
                        (dec_chat_contributor_attribution/opt_no_contributor_in_public.yaml).
                        Holds at ten times the size: yes, because a
                        guid stays unique and unchanged as people and
                        items grow, while names collide more often.

