title:                  Unchecked contributor trailer
brief:                  |
                        No part of the tooling reads a commit author
                        or trailer, so a contributor named only in a
                        trailer is never checked. A wrong or stale
                        name or guid there lands without any failure.
description:            |
                        A grep of src/cc_public for author, committer
                        and trailer finds no code that reads them
                        (src/cc_public, grep 2026-10-22). git log is
                        asked only for message bodies and subjects
                        (src/cctool/commit/history.py lines 114, 150
                        and 174). A guid of a person item held in a
                        private repository does not resolve in
                        cc-public, whose checks see only its own tree
                        (src/cctool/edit/edit.py lines 169-180, Tree
                        reads one root). The private store of the bot
                        is outside the graph and its checks
                        (dec_chat_contributor_attribution,
                        opt_no_contributor_in_public brief).
                        ASSUMPTION: the function wanted is to answer
                        "who supplied this item" correctly, for review
                        and for follow-up questions. Holds at ten
                        times the size: yes, because more contributors
                        give more names or guids to get wrong, and
                        none of them is checked.

