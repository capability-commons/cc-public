title:                  Contributor name fixed in public history
brief:                  |
                        A contributor named in a commit trailer of a
                        public repository is personal data in public,
                        and it cannot be removed without rewriting
                        history. Keeping who said what in the private
                        store of the bot keeps the name out of public.
description:            |
                        cc-public is published under Apache-2.0
                        [LICENSE line 2]. The option names the
                        contributor by name in a Co-authored-by
                        trailer of the commit
                        [_data/decision/dec_chat_contributor_attribution/opt_contributor_by_name.yaml,
                        brief]. Who and when of an item come from the
                        commit that adds it [context.md lines 55-56,
                        _data/decision/dec_author_and_time_of_items].
                        Personal data lives only in private
                        repositories [owner's statement]. A commit
                        trailer is part of the commit, so changing it
                        changes the commit id and every later commit
                        [ASSUMPTION, standard git behavior]. The
                        concern measures time to fulfill a request to
                        remove data, in days
                        [_data/register/reg_concern.yaml lines
                        741-743]. Holds at ten times the size: yes,
                        because more contributors and more commits
                        make each history rewrite larger and harder to
                        propagate to every clone.

