title:                  Few rulings expected among the hits
brief:                  |
                        Rulings are 95 of about 2,000 items in the
                        decision folders, and a diff is code where
                        rulings are prose. So the top hits are likely
                        annotations or rejected options, and each
                        false hit distracts the agent.
description:            |
                        Counts in the snapshot of 1435df0: 86
                        decisions, 213 options, 17 rulings, 992
                        annotations; now 130, 342, 95 and 1,429 (ls
                        _data/decision). CoIR (Li et al. 2024,
                        https://arxiv.org/abs/2407.02883): BM25
                        averages 29.79 nDCG@10 on code retrieval
                        against 56.26 for the best dense model. Shi et
                        al. 2023 (https://arxiv.org/abs/2302.00093):
                        accuracy "is dramatically decreased when
                        irrelevant information is included". The point
                        weakens if each hit is mapped through the
                        graph to its decision's ruling, or if the
                        query is the plan in prose rather than the
                        diff. cctool query text now does the first: it
                        names the decision of each hit and how it was
                        settled (src/cc_public/graph/text.py lines
                        19-30).

