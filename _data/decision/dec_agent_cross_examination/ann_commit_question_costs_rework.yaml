title:                  Rework cost of a question at commit time
brief:                  |
                        A question raised at commit time comes after
                        the work is done, so acting on it means
                        editing again and running the gate again. A
                        question at plan time is cheaper to act on.
description:            |
                        The commit-msg hook runs after the pre-commit
                        gate (.githooks/pre-commit). The commit gate
                        leaves out the tests marked prepush, and runs
                        no tests when no code is staged
                        (src/cctool/gate/gate.py within stages).
                        Measured on the maintainer's machine, a code
                        commit's gate takes 78 s and a data-only
                        commit's about 10 s (gate-speed proposal). The
                        point weakens if most answers are drafted
                        annotations rather than changed commits.

