title:                  Few hits will be determinations
brief:                  |
                        Determinations are 17 of about 1,300 items,
                        and a diff is code where determinations are
                        prose. So the top hits are likely annotations
                        or rejected options, and each false hit
                        distracts the agent.
description:            |
                        Counts in the snapshot of 1435df0: 86 issues,
                        213 options, 17 determinations, 992
                        annotations. CoIR (Li et al. 2024,
                        https://arxiv.org/abs/2407.02883): BM25
                        averages 29.79 nDCG@10 on code retrieval
                        against 56.26 for the best dense model. Shi et
                        al. 2023 (https://arxiv.org/abs/2302.00093):
                        accuracy "is dramatically decreased when
                        irrelevant information is included". The point
                        weakens if each hit is mapped through the
                        graph to its issue's determination, or if the
                        query is the plan in prose rather than the
                        diff.

