title:                  Text search reuses the SQLite graph
brief:                  |
                        The FTS5 form adds no library and no model
                        spend. It ranks text in the in-memory SQLite
                        database that cctool query sql already builds.
                        It still adds a hook, a record of what was
                        shown and a check against that record.
description:            |
                        src/cc_public/graph/sql.py loads the graph
                        with sqlite3.connect(':memory:'). sqlite3 is
                        in the Python standard library; the pixi
                        python has SQLite 3.54.1 with FTS5 and bm25()
                        working (device VM, 2026-10-19). Runtime
                        dependencies today are click, clingo, htpy,
                        jsonschema, referencing and ruamel.yaml
                        (pyproject.toml). Assumption: the shown set
                        must be kept until commit time, for example in
                        a file in the worktree; nothing does this
                        today.

