title:                  SQLite graph reused by text search
brief:                  |
                        The FTS5 form adds no library and no model
                        spend. It ranks text in the in-memory SQLite
                        database that cctool query sql already builds.
                        It still adds a hook, a record of what was
                        shown and a check against that record.
description:            |
                        src/cctool/graph/sql.py loads the graph with
                        sqlite3.connect(':memory:') (line 70) and
                        fills item_text, an FTS5 table (lines 47-48,
                        85), and src/cctool/graph/text.py ranks it
                        with bm25() for cctool query text. sqlite3 is
                        in the Python standard library; the pixi
                        python has SQLite 3.54.1 with FTS5 and bm25()
                        working (device VM, 2026-10-19). Runtime
                        dependencies today are click, clingo, htpy,
                        jsonschema, jsonschema-rs, pyoxigraph, pyyaml,
                        referencing and ruamel.yaml (pyproject.toml at
                        project.dependencies). Assumption: the shown
                        set must be kept until commit time, for
                        example in a file in the worktree; nothing
                        does this today.

