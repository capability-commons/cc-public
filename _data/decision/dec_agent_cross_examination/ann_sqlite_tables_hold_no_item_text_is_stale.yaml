title:                  Item text now held in the SQLite graph
brief:                  |
                        ann_text_match_is_not_a_recorded_reason says
                        the SQLite tables hold relations, not item
                        text, so a text index would sit beside the
                        edges. The SQLite database now holds the prose
                        of every item in a full-text table.
description:            |
                        src/cctool/graph/sql.py creates item_text as
                        an FTS5 virtual table (lines 47-48) in the
                        same in-memory database as the predicate
                        tables, and connect fills it (lines 52-85).
                        The module header says "The prose of each item
                        is in item_text, a full-text table."
                        src/cctool/graph/text.py ranks hits by BM25
                        and expands each one through the graph to its
                        decision and ruling. cctool query text uses it
                        (src/cctool/cli/querying.py line 373). The
                        rest of the annotation, that a text match is
                        not recorded as an edge, still holds. Found in
                        the review of 2026-10-22.

