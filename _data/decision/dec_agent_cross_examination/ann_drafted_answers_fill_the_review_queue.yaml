title:                  Drafted answers that fill the review queue
brief:                  |
                        Each drafted annotation is one more item a
                        person must read and judge, and the
                        maintainer's time is the dearest part of the
                        process. A plan on a component with five
                        drivers can add five drafts before any edit is
                        made.
description:            |
                        lco_argumentation has five drivers. The 992
                        annotation files at 1435df0 have a median
                        length of 47 lines. Several agents work at
                        once, each in its own worktree (AGENTS.md).
                        Maintainer's statement: graph content "is
                        going to be almost entirely LLM generated -
                        Humans are probably ONLY going to be able to
                        inspect and review." AGENTS.md: "The previous
                        iteration grew faster than it could be
                        reviewed." Showing rulings adds no item to
                        review.

