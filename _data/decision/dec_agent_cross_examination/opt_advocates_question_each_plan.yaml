title:                  Concern advocates question each plan
brief:                  |
                        Before the agent edits, one small-model
                        advocate for each driver of the touched
                        logical component reads the plan beside the
                        relevant rulings and asks at most one
                        question. The answers are drafted as
                        annotations for a person to review.

