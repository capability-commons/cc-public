title:                  Python packages realizing the parts of the tooling
brief:                  |
                        The annotation says only pyp_cctool realizes a
                        logical component, so every python file maps
                        to lco_tooling alone. Now each of the ten
                        packages under cctool realizes a part of
                        lco_tooling, so a file reaches its part and,
                        through it, lco_tooling. Data files still
                        reach nothing.
description:            |
                        relation_realizes has 21 edges, of which 11
                        come from python packages, one for lco_tooling
                        and one for each lco_tooling part (cctool
                        query sql over edge). No decision is yet about
                        a part. Found in the weekly review of
                        2026-10-29.

