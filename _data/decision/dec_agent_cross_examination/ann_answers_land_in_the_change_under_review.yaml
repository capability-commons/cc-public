title:                  Answers landing in the change under review
brief:                  |
                        A question asked at commit time is answered by
                        changing the commit, so the person reviews one
                        change already tested against the rulings. A
                        cap of three questions keeps the extra
                        material small.
description:            |
                        AGENTS.md: one commit does one thing, and each
                        change is kept small enough to read in one
                        sitting. The plan-time option drafts every
                        answer as an annotation instead of changing
                        the work. Assumption: agents mostly answer by
                        changing the commit; if they mostly draft
                        annotations, this costs what the plan-time
                        option costs, at a lower rate.

