title:                  Eight runtime dependencies now
brief:                  |
                        ann_colbert_fallback_brings_a_second_stack
                        sets the ColBERT stack against six runtime
                        dependencies today. The package now declares
                        eight.
description:            |
                        pyproject.toml at project.dependencies list
                        click, clingo, htpy, jsonschema, pyoxigraph,
                        pyyaml, referencing and ruamel.yaml.
                        pyoxigraph is the seventh, used by
                        src/cctool/graph/sparql.py for cctool query
                        sparql, and pyyaml the eighth, used by
                        src/cctool/graph/parse.py to parse with
                        libyaml. The pixi env still uses python 3.15
                        (pixi.lock), so the point about torch wheels
                        is unchanged. Found in the review of
                        2026-10-22.

