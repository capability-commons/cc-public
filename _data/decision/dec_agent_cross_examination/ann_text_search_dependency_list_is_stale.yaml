title:                  Runtime dependency list now including pyoxigraph
brief:                  |
                        ann_text_search_reuses_the_sqlite_graph lists
                        the runtime dependencies as click, clingo,
                        htpy, jsonschema, referencing and ruamel.yaml.
                        pyoxigraph is now a runtime dependency too.
description:            |
                        pyproject.toml at project.dependencies
                        declares pyoxigraph>=0.5.12,<0.6, which
                        src/cctool/graph/sparql.py imports for cctool
                        query sparql. The FTS5 text search still adds
                        no library: src/cctool/graph/sql.py builds
                        item_text with sqlite3 (lines 47-48, 70, 85),
                        and src/cctool/graph/text.py ranks it with
                        BM25. Found in the review of 2026-10-22.

