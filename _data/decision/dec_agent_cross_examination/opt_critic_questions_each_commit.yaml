title:                  A small model questions each commit
brief:                  |
                        At commit-msg time a small model reads the
                        commit item and the diff beside the relevant
                        rulings and asks at most three questions, each
                        citing item ids. A question that cites an id
                        that does not exist is dropped. The agent
                        answers each one by changing the commit or by
                        drafting an annotation.

