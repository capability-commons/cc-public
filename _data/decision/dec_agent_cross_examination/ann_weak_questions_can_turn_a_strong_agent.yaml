title:                  Weak questions can turn a strong agent
brief:                  |
                        Models often give up correct answers when
                        challenged, and model critics report false
                        bugs and nitpicks. No study shows a small
                        model catching what a stronger one misses at
                        run time. Showing rulings avoids that risk,
                        and more questions per change raise it.
description:            |
                        Laban et al. 2023
                        (https://arxiv.org/abs/2311.08596): "Are you
                        sure?" makes models flip answers. McAleese et
                        al. 2024 (https://arxiv.org/abs/2407.00215):
                        critics catch real bugs but also hallucinate
                        bugs; the critics studied are large models.
                        Burns et al. 2023
                        (https://arxiv.org/abs/2312.09390) studies
                        weak supervision in training, not run time
                        questioning. Dropping questions with missing
                        ids catches made-up ids, not wrong questions
                        that cite real ones.

