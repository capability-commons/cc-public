title:                  Cited questions tie a commit to its reason
brief:                  |
                        A question that cites a ruling makes the agent
                        either change the commit or say why it
                        departs, so the commit gains a stated link to
                        the decision behind it. No check asks a commit
                        why it exists today, and a listing leaves no
                        record that it was read.
description:            |
                        The commit checks in
                        src/cc_public/commit/change.lp report
                        retyped_guid, unannounced_removal,
                        unannounced_rename, rename_without_alias,
                        verb_contradicted and
                        reformat_changes_content; none asks a commit
                        to name the decision or ruling it carries out.
                        A commit item mentions the ids in its title,
                        brief and description
                        (src/cc_public/commit/change.py). The point
                        weakens if a rule later requires each commit
                        to mention a ruling, which would give the
                        trace without a model.

