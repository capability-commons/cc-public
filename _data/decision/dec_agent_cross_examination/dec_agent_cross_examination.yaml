title:                  Cross-examination of an agent's work
brief:                  |
                        Should a small, cheap model question a coding
                        agent's plan or commit against the rulings in
                        the graph, and if so where and in what form?
description:            |
                        Raised by the owner on 2026-10-19 after a look
                        at Ideologos, an app in which a low capacity
                        model questions a person against a graph of
                        what they said before. Here the person is a
                        strong coding agent and the graph is the
                        record of rulings. A replay of past commits
                        and of seeded cases is planned to settle it.

