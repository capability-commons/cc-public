title:                  Text search needs no trace edges
brief:                  |
                        A text match finds the rulings that bear on a
                        change without the relation_realizes edges the
                        graph lacks, so it works today. The naming
                        check then gives each commit a stated link to
                        the decisions shown, with no model.
description:            |
                        Query on 1435df0: only pyp_cc_public
                        relation_realizes lco_tooling reaches a
                        logical component. A commit item's mentions
                        are already facts
                        (src/cc_public/commit/change.py), so the
                        naming rule can be written over them. This
                        option is the rule that
                        ann_cited_questions_tie_a_commit_to_its_reason
                        says would give the trace without a model.
                        BEIR (Thakur et al. 2021,
                        https://arxiv.org/abs/2104.08663): "BM25
                        remains a strong baseline for zero-shot text
                        retrieval". Assumption: an agent that must
                        answer a ruling reads it more closely than one
                        handed a list. The point weakens as
                        relation_realizes edges are recorded.

