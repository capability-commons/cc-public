title:                  The shown list can be rerun by the reviewer
brief:                  |
                        A text search with no model gives the same
                        list each time on the same tree and query. A
                        reviewer can rerun it and check that the
                        commit names each ruling shown. A model's
                        questions cannot be reproduced that way.
description:            |
                        bm25() is a fixed function of term counts in
                        the indexed text
                        (https://www.sqlite.org/fts5.html). Under the
                        commit critic, only the agent's answers are
                        recorded, not the questions. The point weakens
                        for the ColBERTv2 fallback if its index
                        differs between machines (assumption).

