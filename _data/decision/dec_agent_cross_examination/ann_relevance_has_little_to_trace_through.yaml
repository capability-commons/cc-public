title:                  Little for relevance to trace through
brief:                  |
                        The graph cannot yet say which rulings bear on
                        a file. Every python file maps to lco_tooling
                        and every file under _data to nothing, so any
                        option that shows or questions against
                        relevant rulings works from a wrong or empty
                        set until that trace exists.
description:            |
                        Query on dev at 1435df0, rechecked on
                        9119fe46: relation_realizes now has 11 edges,
                        and still only pyp_cctool relation_realizes
                        lco_tooling reaches a logical component; the
                        others reach interface control documents and
                        their members. No annotation, option or ruling
                        is the target of an edge from outside its own
                        decision. 130 decisions spread over 13 logical
                        components. The point weakens as
                        relation_realizes edges are recorded, and
                        grows if the graph grows without them. At
                        today's 95 rulings a run could still show all
                        of them instead, at a larger cost in context.

