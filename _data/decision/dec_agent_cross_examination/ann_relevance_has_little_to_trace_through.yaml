title:                  Relevance has little to trace through
brief:                  |
                        The graph cannot yet say which determinations
                        bear on a file. Every python file maps to
                        lc_tooling and every file under _data to
                        nothing, so any option that shows or questions
                        against relevant determinations works from a
                        wrong or empty set until that trace exists.
description:            |
                        Query on dev at 1435df0: r_realizes has 8
                        edges, and only pyp_cc_public r_realizes
                        lc_tooling reaches a logical component. No
                        annotation, option or determination is the
                        target of an edge from outside its own
                        decision. 86 decisions spread over six logical
                        components. The point weakens as r_realizes
                        edges are recorded, and grows if the graph
                        grows without them. At today's 17
                        determinations a run could show all of them
                        instead.

