title:                  Rulings found on demand
brief:                  |
                        AGENTS.md tells the agent to run cctool query
                        text before it argues or changes something; it
                        ranks items by BM25 and names the decision,
                        ruling and concerns of each hit. No hook, no
                        model, and no check that the commit names what
                        was found.

