title:                  Each weak hit needs a written dismissal
brief:                  |
                        A ranking always returns its top few, whether
                        or not they bear on the change. Each one needs
                        a reply in the commit, so most commits carry
                        lines of "does not apply" that cost the agent
                        context and the reviewer reading time.
description:            |
                        FTS5 bm25() orders matching rows by score and
                        does not decide relevance
                        (https://www.sqlite.org/fts5.html). There are
                        17 rulings among about 1,330 items. AGENTS.md
                        asks for each change to be small enough to
                        read in one sitting. Assumption: most changes
                        bear on no ruling. The point weakens with a
                        score threshold, or if only rulings need a
                        reply and one line suffices.

