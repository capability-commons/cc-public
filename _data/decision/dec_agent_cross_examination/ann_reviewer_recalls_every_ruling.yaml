title:                  Recall of every ruling left to the reviewer without a questioner
brief:                  |
                        If nothing puts the rulings in front of the
                        agent, the person reviewing each change must
                        remember which upheld options it might break.
                        That load grows with each ruling, and agents
                        make most of the changes.
description:            |
                        Weak today at 17 rulings, which a person can
                        hold in mind. Strong at ten times that.

