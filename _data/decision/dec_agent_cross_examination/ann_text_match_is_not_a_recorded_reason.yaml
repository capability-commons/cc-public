title:                  Text match, not a recorded reason
brief:                  |
                        A ruling reaches a commit because its words
                        overlap the diff, and that link is never an
                        edge. A ruling named only to set it aside
                        counts as a mention like one that was
                        followed, and files stay without a logical
                        component.
description:            |
                        commit_mention is every id-shaped word in the
                        commit item, with no mark of how the id is
                        used (src/cc_public/graph/extract.py line 106,
                        REGEX_MENTION; src/cc_public/commit/change.py
                        lines 137-138). The SQLite database now also
                        holds the prose of each item in item_text, an
                        FTS5 table (src/cc_public/graph/sql.py lines
                        47-48), but a text match is still not an edge.
                        Assumption: an option that works without
                        relation_realizes edges lowers the pressure to
                        record them. The point weakens if the check
                        records each shown ruling as an edge on the
                        commit.

