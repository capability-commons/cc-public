title:                  A text match is not a recorded reason
brief:                  |
                        A determination reaches a commit because its
                        words overlap the diff, and that link is never
                        an edge. A determination named only to set it
                        aside counts as a mention like one that was
                        followed, and files stay without a logical
                        component.
description:            |
                        commit_mention is every id-shaped word in the
                        commit item, with no mark of how the id is
                        used (src/cc_public/graph/extract.py,
                        REGEX_MENTION). The SQLite tables hold
                        relations, not item text, so a text index sits
                        beside the edges. Assumption: an option that
                        works without r_realizes edges lowers the
                        pressure to record them. The point weakens if
                        the check records each shown determination as
                        an edge on the commit.

