title:                  Consumed trees installed as packages
brief:                  |
                        Each consumed segment is a package installed
                        in the environment of the peer, cc-public and
                        any segment between them alike, and each
                        declares its tree under an entry point group
                        that cctool reads. A switch to a local
                        checkout is a path dependency in place of the
                        tagged one, so the environment manager records
                        the choice, and its lock shows it.

