title:                  Consumed trees named in a local file
brief:                  |
                        A file in the peer that version control
                        ignores maps each consumed segment to the
                        folder of a local checkout. A segment it does
                        not name is read from the installed package,
                        as now. A switch writes or removes its line,
                        so the choice is local to one host and never
                        committed, and cctool check reports it.

