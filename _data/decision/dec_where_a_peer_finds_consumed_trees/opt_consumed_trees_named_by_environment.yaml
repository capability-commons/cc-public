title:                  Consumed trees named by an environment variable
brief:                  |
                        An environment variable lists the folders of
                        the trees a segment may consume, read in place
                        of the installed package where it is set. A
                        switch is setting it in the shell, so no file
                        of the peer records the choice, and nothing
                        outlives the session unless the shell profile
                        sets it.

