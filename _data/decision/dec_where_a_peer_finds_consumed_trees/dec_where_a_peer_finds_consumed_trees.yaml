title:                  Where a peer finds the trees it consumes
brief:                  |
                        Where does cctool find each tree that a
                        segment consumes, and where is it recorded
                        whether that tree is a pinned release or a
                        local checkout, given that today cctool reads
                        only the tree it was itself installed from, so
                        a peer of a peer cannot find the segment
                        between it and cc-public?

