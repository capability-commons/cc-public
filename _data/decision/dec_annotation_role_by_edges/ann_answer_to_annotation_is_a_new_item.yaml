title:                  Answer as a new item, not an edit
brief:                  |
                        With no status field, an answer is a new item
                        with its own brief, and the answered
                        annotation is never edited. A status field
                        adds an edit of one line, with no reason, to
                        every answer.
description:            |
                        An annotation has no status field
                        (_data/schema/sch_annotation.yaml lines
                        27-31). r_supports and r_challenges run from
                        an annotation to an annotation or an option
                        (reg_data_item_type.yaml lines 409-414;
                        reg_relation.yaml lines 177-233). The legacy
                        usage said what became of an annotation is
                        another annotation or a later item (git show
                        bb8c338, t_annotation usage). An option no
                        determination names is open, and a
                        determination states its reason in its brief
                        (reg_data_item_type.yaml lines 782-783;
                        det_cross_item_checks_engine.yaml lines
                        12-19). Upkeep of a status field grows with
                        the number of answers. Existing annotations
                        are 28 to 59 lines each (wc -l at 89c74d8).

