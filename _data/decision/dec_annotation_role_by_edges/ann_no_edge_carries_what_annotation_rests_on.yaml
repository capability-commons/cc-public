title:                  No edge for what an annotation rests on
brief:                  |
                        The schema says what an annotation rests on is
                        an edge, but no relation carries it. Sources
                        and whether a premise is verified sit in prose
                        that no check can read.
description:            |
                        sch_annotation, type_annotation and
                        concept_annotation each name "what it rests
                        on" as a role (sch_annotation.yaml lines
                        27-31; reg_data_item_type.yaml lines 409-412;
                        reg_concept.yaml lines 261-263). The legacy
                        type rested on "captured sources" by a cites
                        relation (git show bb8c338). The relation
                        register holds 13 relations and none links to
                        a source (reg_relation.yaml lines 64-464);
                        memory records that the cites relation was
                        "not added" (MEMORY.md line 13). One
                        annotation can rest on another by
                        relation_supports.
                        ann_clingo_is_slower_at_this_size states
                        timings with no edge to the measurement. No
                        recorded annotation says verified or
                        assumption. This is a gap in the edge set, not
                        a case for fields: a cites relation, or
                        dropping the phrase from the three
                        descriptions, would close it.

