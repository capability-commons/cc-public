title:                  Status field as a second copy of the outcome
brief:                  |
                        A status or verdict field would record on the
                        annotation what edges and rulings already
                        record. The two copies can disagree.
description:            |
                        A ruling upholds or rejects options, and an
                        option no ruling names is open
                        (reg_data_item_type.yaml at
                        entries.type_file.edge and
                        entries.type_commit; sch_option.yaml at note;
                        reg_relation.yaml at entries.relation_realizes
                        and entries.relation_upholds). Whether an
                        annotation is answered shows in incoming
                        relation_supports and relation_challenges
                        edges (reg_relation.yaml at
                        entries.relation_is_about,
                        entries.relation_supports and
                        entries.relation_challenges). Whether it is
                        practical is derived in check.lp (lines
                        416-435, 551-563). Status fields were removed
                        from registers, entries and options in 44034ef
                        because nothing read them
                        (memory/lifecycle-and-status.md). ASSUMPTION:
                        a status field would need a cross-item rule to
                        stay consistent, since JSON Schema checks one
                        item at a time. ASSUMPTION: a severity field
                        would overlap the planned computed ranking of
                        concerns, which is not built.

