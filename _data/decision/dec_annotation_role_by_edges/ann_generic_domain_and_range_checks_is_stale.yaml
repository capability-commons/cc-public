title:                  Relation ends now checked by constraints over roles
brief:                  |
                        ann_annotation_roles_reuse_the_edge_mechanism
                        says the domain and range checks are generic
                        over every relation. Relations no longer have
                        a domain or range. Their ends are governed by
                        relation constraints over roles, checked by
                        one generic rule.
description:            |
                        Entries in _data/register/reg_relation.yaml
                        hold no domain or range field. Each names its
                        end constraints with
                        relation_constrains_source and
                        relation_constrains_target, which point to
                        relcon_ entries in
                        reg_relation_constraint.yaml, and each relcon_
                        admits a role from reg_role.yaml. A type plays
                        roles by relation_has_items_that_play in
                        reg_data_item_type.yaml.
                        src/cctool/check/check.lp derives satisfies
                        (lines 1011-1025) and reports
                        constraint_violation (lines 1065-1075); no
                        range_violation rule exists. The check is
                        still generic, but the edge mechanism now also
                        needs the constraint and role registers. Found
                        in the review of 2026-10-22.

