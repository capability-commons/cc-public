title:                  No record of who wrote an annotation
brief:                  |
                        The chosen alternative drops the author field
                        and no edge takes its place. Commits of
                        agent-written annotations have WTP as author
                        and mark model help only by a Co-Authored-By
                        line for the whole commit, so a reviewer
                        cannot tell from the graph which item a model
                        wrote.
description:            |
                        No author field (sch_annotation.yaml lines
                        29-31). No relation in reg_relation.yaml
                        (lines 64-464) names who asserted an item. The
                        legacy design had an is-asserted-by relation
                        (git show bb8c338, type_annotation usage). WTP
                        intends agents to make arguments, each for a
                        concern (maintainer's statement, 2026-10-13).
                        Commits c7058e3 and 1ba2895 of
                        ann_rules_are_a_small_review_surface have the
                        author William Payne and a Co-Authored-By
                        Claude line. relation_speaks_for_concern hints
                        at an advocate but does not name one.
                        ASSUMPTION: an authorship edge fits the
                        edges-not-fields principle, so this challenges
                        the "no author" clause, not edges as such.

