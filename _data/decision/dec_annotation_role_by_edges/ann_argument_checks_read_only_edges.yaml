title:                  Argument checks that read only edges
brief:                  |
                        Every check on annotations reads only edges,
                        so the checks can walk from an option to each
                        argument for or against it and find any
                        unargued driver. A field such as status names
                        no item and cannot be followed.
description:            |
                        The checks practical, argued, unargued_driver,
                        argument_without_concern and the check on a
                        concern without an option read r_supports,
                        r_challenges, r_is_option_for, r_is_about,
                        r_is_driven_by and r_speaks_for_concern with
                        item types (src/cc_public/check/check.lp lines
                        418-455, 551-590). missing_about reports an
                        annotation or decision with no r_is_about
                        (lines 290-301). r_supports is acyclic and
                        cycles are reported (reg_relation.yaml line
                        205; check.lp lines 540-547). The recorded
                        arguments hold 6 support or challenge edges to
                        annotations and 25 to options (count over
                        base0). Will wants "the argument trace being
                        an explainable artifact" (owner's statement,
                        2026-10-13T16:42:36Z). The legacy tree, with
                        status fields, held 136 unanswered annotations
                        (cc-public-session-context.md line 50).
                        ASSUMPTION: the note gives the count, not the
                        cause. ASSUMPTION: that the legacy annotations
                        had status fields is not checked here; the
                        legacy type_annotation in bb8c338 says it had
                        none.

