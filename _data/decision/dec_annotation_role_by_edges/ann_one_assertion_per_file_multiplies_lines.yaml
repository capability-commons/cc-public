title:                  Lines that grow with each assertion
brief:                  |
                        One file per separately answerable assertion,
                        each with a fixed header and a four-line block
                        per edge, makes the cost to write and to
                        review a deliberation grow with its
                        assertions.
description:            |
                        Two assertions that could be answered
                        separately are two annotations
                        (reg_data_item_type.yaml). In
                        ann_rules_are_a_small_review_surface, 10 of 33
                        lines are identity, copyright, license and
                        mark, 16 hold its three edges, and the
                        assertion is 4 lines. The 29 annotations total
                        1,025 lines (wc -l at 89c74d8). At ten times,
                        about 290 annotations would be about 10,000
                        lines. WTP expects annotations "might quickly
                        explode out of control" (maintainer's
                        statement, 2026-10-14) and allowed several
                        concerns per annotation to contain it
                        (aa23286). He found a "no bearing" annotation
                        "would create a LOT of noise" (2026-10-14). A
                        previous attempt "generated too much material
                        to review" (cc-public-session-context.md line
                        45). ASSUMPTION: fields would still need a way
                        to say what an annotation is about, so their
                        saving is smaller than the full overhead. The
                        split rule could be judged apart from the
                        field rule.

