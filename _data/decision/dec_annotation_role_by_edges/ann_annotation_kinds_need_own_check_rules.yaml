title:                  Annotation kinds defined by edge patterns
brief:                  |
                        Edges give fewer fields but not fewer checks.
                        Each kind of annotation is a pattern of
                        present or absent edges and needs its own
                        cross-item check.
description:            |
                        check.lp holds missing_about, practical,
                        argument_without_concern, the check on a
                        concern without an option, and decision_of for
                        annotations (src/cc_public/check/check.lp
                        lines 147-151, 290-301, 551-590). The fact
                        kind is defined only by the absence of
                        r_speaks_for_concern (reg_relation.yaml lines
                        290-297; check.lp lines 580-590). The rules
                        are short, two to four lines each. The cost
                        grows with the number of annotation kinds, not
                        with the size of the graph.

