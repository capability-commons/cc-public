title:                  Cites relation now links an item to a source
brief:                  |
                        ann_no_edge_carries_what_annotation_rests_on
                        says the relation register holds 13 relations
                        and none links to a source. It now holds 31,
                        and relation_cites links any item to the
                        external document it draws on.
description:            |
                        _data/register/reg_relation.yaml holds 31
                        relations. relation_cites (line 861) reads
                        "SOURCE cites TARGET": the source draws on the
                        document an external document item points at.
                        Its target must play rol_proxy
                        (relcon_is_proxy) and its source is open to
                        any item. _data/external_document holds 17
                        such items, and 18 of the 19 concerns cite
                        one. No annotation under _data/decision uses
                        relation_cites yet, and sch_annotation.yaml no
                        longer names "what it rests on". Found in the
                        review of 2026-10-22.

