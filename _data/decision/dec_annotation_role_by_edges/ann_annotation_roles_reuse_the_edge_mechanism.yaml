title:                  Roles on the one edge mechanism
brief:                  |
                        Annotation roles reuse the edge mechanism that
                        every item already has, so the type was added
                        with register entries and no new code. Typed
                        fields would be a second way to relate items,
                        with their own properties, value lists and
                        checks.
description:            |
                        sch_trait_edge is "The single traceability
                        mechanism for the whole repository", and a new
                        kind of edge is a register entry
                        (_data/schema/sch_trait_edge.yaml lines 16-20,
                        29-30). sch_annotation adds no property of its
                        own, under unevaluatedProperties false
                        (_data/schema/sch_annotation.yaml lines 17-21,
                        38-42). Commit ae6eeff, which added
                        type_annotation, relation_is_about,
                        relation_supports and relation_challenges,
                        changed only register and schema YAML files,
                        but the tree then held no code at all (the
                        checker came later, in ba66f33). The domain
                        and range checks are generic over every
                        relation (src/cctool/check/check.lp lines
                        260-286). sch_option follows the same pattern
                        (sch_option.yaml lines 17-31). ASSUMPTION: an
                        enumerated field would need a value list and a
                        schema property, as is usual in this
                        repository's JSON Schema files.

