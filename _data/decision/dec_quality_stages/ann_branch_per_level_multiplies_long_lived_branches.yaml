title:                  Long-lived branches added by each option
brief:                  |
                        One branch adds nothing. A verified branch
                        adds one name and one nightly fast-forward,
                        with no merge commits. A branch for each
                        maturity level adds a branch and a promotion
                        step for every level, from levels not yet
                        decided, close to the many long-lived branches
                        already rejected with git flow.
description:            |
                        Sources:
                        - The one-branch option lands all work on dev
                          through the commit and push gates
                          [_data/decision/dec_quality_stages/opt_one_branch.yaml
                          at brief].
                        - The verified branch option moves the branch
                          each night, by fast-forward only, to a dev
                          commit that passes every overnight test,
                          coverage and budget check, and cuts releases
                          only from it
                          [_data/decision/dec_quality_stages/opt_dev_and_a_verified_branch.yaml
                          at brief].
                        - The branch per level option has a branch for
                          each maturity level and promotes a commit
                          from one level's branch to the next as it
                          passes the next level's demands
                          [_data/decision/dec_quality_stages/opt_a_branch_per_maturity_level.yaml
                          at brief].
                        - The levels of maturity are still open
                          [_data/decision/dec_maturity_levels/, which
                          holds three options and no ruling].
                        - Git flow was rejected, with releases from
                          dev until the maintainer moves the release
                          line to main and breaking work on next after
                          1.0
                          [_data/decision/dec_branch_lines/ruling_branch_lines.yaml
                          at brief and edge].
                        - Git flow keeps four kinds of long-lived
                          branch for one integration job
                          [_data/decision/dec_branch_lines/ann_git_flow_merges_between_long_lived_branches.yaml
                          at brief].
                        - dev only moves forward by fast-forward
                          merges and its history stays linear
                          [AGENTS.md#working-beside-other-agents].
                          Strength: strong against a branch per level,
                          moderate between one branch and a verified
                          branch, which differ by one branch and one
                          job. At ten times the size the count of
                          branches does not grow, but each promotion
                          step runs more often.

