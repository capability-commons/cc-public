title:                  Cost of promotion per commit against one nightly run
brief:                  |
                        A nightly run tests one dev commit, so its
                        cost does not grow with the number of commits
                        agents land that day. Promoting each commit
                        through a branch per maturity level runs each
                        level's demands per commit, so the cost grows
                        with commits times levels. With a slow run of
                        about 17 minutes already, that does not fit a
                        night at ten times the size.
description:            |
                        Sources:
                        - All software is written by agents, many at
                          once, reviewed by WTP [owner's statement,
                          2026-10-28].
                        - The verified branch option moves the branch
                          each night, by fast-forward only, to a dev
                          commit that passes every overnight test,
                          coverage and budget check, and cuts releases
                          only from it
                          [_data/decision/dec_quality_stages/opt_dev_and_a_verified_branch.yaml
                          at brief].
                        - The one branch option cuts a release from a
                          dev commit that the overnight run and the
                          release gate have passed
                          [_data/decision/dec_quality_stages/opt_one_branch.yaml
                          at brief].
                        - The branch per level option has a branch for
                          each maturity level and promotes a commit
                          from one level's branch to the next as it
                          passes the next level's demands
                          [_data/decision/dec_quality_stages/opt_a_branch_per_maturity_level.yaml
                          at brief].
                        - The slow run took 17 min 8 s real on an
                          8-core machine and the full gate about 26
                          minutes on 4 cores
                          [_data/decision/dec_release_gate/ann_first_release_gate_took_17_to_26_minutes.yaml
                          at brief and description].
                        - The ruling on test evidence measures
                          coverage, profiles and budgets overnight
                          only, on condition that a nightly stage
                          guards what is released, so that nothing
                          unmeasured is released
                          [_data/decision/dec_where_test_evidence_is_measured/ruling_where_test_evidence_is_measured.yaml
                          at brief].
                        - WTP wants the stages ordered by the most
                          risk reduction per computational resource
                          [owner's statement, 2026-10-28, recorded as
                          ann_each_stage_buys_the_most_risk_reduction_for_its_time].
                        - ASSUMPTION: under the branch per level
                          option each commit is promoted on its own,
                          as its brief reads. Batched promotion would
                          cost the same as one nightly run per level.
                        - ASSUMPTION: the slow run grows about
                          linearly with the tests, near three hours at
                          ten times the size. Strength: strong. It
                          holds and grows at ten times the size, since
                          both the commit count and each run's length
                          grow. The verified branch and one branch
                          cost the same machine time, and the
                          fast-forward itself costs one ref update.

