title:                  dev and a verified branch moved nightly
brief:                  |
                        Work lands on dev through the commit and push
                        gates. Each night, a dev commit that passes
                        every overnight test, coverage and budget
                        check moves a verified branch forward to it,
                        by fast-forward only, and releases are cut
                        only from verified. A red night leaves
                        verified at the last commit that passed, and
                        the fix goes forward on dev. One branch, and a
                        branch for each maturity level, are rejected.
                        Ruled by WTP on 2026-10-28, by writing "Uphold
                        opt_dev_and_a_verified_branch as recommended".

