title:                  A second branch that holds no new commits
brief:                  |
                        A verified branch moved by fast-forward holds
                        only commits WTP has already seen on dev, so
                        it adds nothing to review. The commits on dev
                        not yet on verified form one range, a queue
                        the reviewer can read. Promotion through a
                        branch for each level gives several such
                        ranges to watch.
description:            |
                        Sources:
                        - The verified branch option moves the branch
                          each night, by fast-forward only, to a dev
                          commit that passes every overnight test,
                          coverage and budget check, and cuts releases
                          only from it
                          [_data/decision/dec_quality_stages/opt_dev_and_a_verified_branch.yaml
                          at brief].
                        - dev only moves forward by fast-forward
                          merges and its history stays linear
                          [AGENTS.md#working-beside-other-agents].
                        - The branch per level option has a branch for
                          each maturity level and promotes a commit
                          from one level's branch to the next as it
                          passes the next level's demands
                          [_data/decision/dec_quality_stages/opt_a_branch_per_maturity_level.yaml
                          at brief].
                        - Git flow was rejected, with releases from
                          dev until the maintainer moves the release
                          line to main and breaking work on next after
                          1.0
                          [_data/decision/dec_branch_lines/ruling_branch_lines.yaml
                          at brief and edge].
                        - WTP wants work from many agents integrated
                          sooner through a fast first gate, with later
                          stages catching thorny problems before
                          release [owner's statement, 2026-10-28].
                        - The commit gate takes about 78 s for a code
                          commit
                          [_data/decision/dec_tooling_language/ann_gate_takes_a_minute.yaml
                          at brief]. Strength: Moderate. One branch
                          adds no ranges at all but leaves the
                          reviewer to find which commit passed. A
                          branch per level adds one range per level,
                          and more beside main and next. At ten times
                          the size more commits wait each night, and
                          one range remains easy to read.

