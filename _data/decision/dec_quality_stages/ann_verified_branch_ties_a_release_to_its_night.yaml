title:                  Each release traced to the night that passed it
brief:                  |
                        A verified branch moved only by fast-forward
                        records in git which dev commit passed the
                        overnight run, so every release traces to that
                        evidence. A branch for each maturity level
                        gives a whole tree one level, which does not
                        trace to maturities declared part by part.
description:            |
                        Sources:
                        - The ruling on test evidence measures
                          coverage, profiles and budgets overnight
                          only, on condition that a nightly stage
                          guards what is released, so that nothing
                          unmeasured is released
                          [_data/decision/dec_where_test_evidence_is_measured/ruling_where_test_evidence_is_measured.yaml
                          at brief].
                        - The verified branch option moves the branch
                          each night, by fast-forward only, to a dev
                          commit that passes every overnight test,
                          coverage and budget check, and cuts releases
                          only from it
                          [_data/decision/dec_quality_stages/opt_dev_and_a_verified_branch.yaml
                          at brief].
                        - The one branch option cuts a release from a
                          dev commit that the overnight run and the
                          release gate have passed
                          [_data/decision/dec_quality_stages/opt_one_branch.yaml
                          at brief].
                        - The report of each scheduled review is a
                          file in the project's shared notes folder,
                          not in the tree, so under one branch the
                          record of which commit the overnight run
                          passed lives outside the graph and history
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-report].
                        - The branch per level option has a branch for
                          each maturity level and promotes a commit
                          from one level's branch to the next as it
                          passes the next level's demands
                          [_data/decision/dec_quality_stages/opt_a_branch_per_maturity_level.yaml
                          at brief].
                        - Both code maturity options declare maturity
                          per component or per module, not per tree
                          [_data/decision/dec_maturity_of_code/opt_maturity_on_each_logical_component.yaml
                          and opt_maturity_on_each_module.yaml at
                          brief]. Strength: Moderate, and conditional
                          on the review report staying outside the
                          tree. If the overnight run recorded the
                          commit it passed in a committed item, one
                          branch would trace as well. At ten times the
                          size, with more commits a night, the branch
                          position stays one fact per night.

