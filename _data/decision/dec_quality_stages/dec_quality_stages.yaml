title:                  Stages of quality gates
brief:                  |
                        Through how many stages does work pass before
                        it may be released, and which branch holds the
                        work that has passed each?
description:            |
                        Today a commit passes the commit gate and a
                        push passes the pre-push gate onto dev, and a
                        release is cut from dev after the release
                        gate. The ruling on where test evidence is
                        measured puts coverage, profiles and budgets
                        overnight, on condition that a nightly stage
                        guards what is released. WTP argued that the
                        stages form a cascade, each ordered by the
                        risk it removes per unit of time.

