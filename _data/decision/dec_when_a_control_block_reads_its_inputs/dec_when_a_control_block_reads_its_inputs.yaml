title:                  When a control block reads its own inputs
brief:                  |
                        A control block writes the control message
                        before any other node of its unit runs, yet it
                        reads inputs such as the mode and the host
                        readings. Which local step's values does it
                        read?
description:            |
                        rqt_control_block_writes_first puts the block
                        first in each local step.
                        icd_dataflow_control_block gives it the inputs
                        mode_in and host_readings_in, and
                        icd_dataflow_mode_controller reads the control
                        message and writes the mode. Wired as the ICDs
                        describe, control block, mode controller and
                        mode_in form a loop. With feedforward edges
                        check.lp refuses it as a feedforward loop;
                        with a feedback edge,
                        rqt_checks_feedback_default needs a default
                        that neither port declares (review of
                        2026-10-29, CC-053, reproduced). In the trial
                        implementation no graph with a mode controller
                        could be built (CC-023), and in every unit but
                        the first on a host the block ran after the
                        ordinary nodes (CC-001).

