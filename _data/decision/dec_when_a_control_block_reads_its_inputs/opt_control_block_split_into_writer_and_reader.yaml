title:                  Control block split into a writer and a reader
brief:                  |
                        The control block is two nodes. A writer runs
                        first in each local step and writes the
                        control message; a reader runs last, takes the
                        block's inputs, and hands them to the next
                        step's writer. Neither half sits in a loop of
                        the schedule.

