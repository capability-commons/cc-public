title:                  Same-step host readings that exist only in the host block's unit
brief:                  |
                        The gain the runs-after option offers, host
                        readings of this local step, exists only in
                        the unit that holds the host block. Every
                        other unit gets them through an inserted
                        receiver, and since local steps of different
                        units share no step, the block there can only
                        wait for the next message to arrive, with
                        every node of its unit behind it. The trial
                        shows what a waiting crossing costs: with no
                        user edge between units, the lossless
                        host-readings crossing alone held a 10 ms unit
                        to the 50 ms period of another and gave it
                        overruns that can push the mode controller
                        into degraded mode. Under the previous-step
                        option the readings are the value last
                        received, so the block itself never waits on
                        another unit, and moving the host block or a
                        mode controller to another unit leaves the
                        order unchanged.
description:            |
                        Sources:
                        - The host block runs in the unit it is placed
                          in and passes its
                          readings to the blocks of every unit of its host
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at description and surface.host.dataflow_step.invocation).
                        - Lowering puts a sender and a receiver on
                          every edge whose ends lie
                          in different units
                          (_data/requirement/rqt_lowering_inserts_transport.yaml at object).
                        - Steps are local to a unit, and between units
                          an edge is a bounded
                          queue with no common step
                          (_data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at brief).
                        - Development will move nodes between units
                          until they are balanced
                          (WTP, 2026-10-28, as recorded in
                          _data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at description).
                        - The trial put the host block in the first
                          unit; with no user edge
                          between units, a 10 ms unit was held to 50 ms by the lossless
                          host-readings channel and reported overruns (review of 2026-10-29,
                          CC-011, reproduced; trial 2c777ab9, src/cctool/dataflow/lower.py,
                          function _control_blocks).
                        - Whether a receiver waits is the question of
                          an open decision of
                          its own
                          (_data/decision/dec_how_a_receiver_takes_values_from_another_unit/dec_how_a_receiver_takes_values_from_another_unit.yaml
                          at brief).
                        - Flexibility asks whether the design can be
                          scaled as the load
                          changes; reliability asks what happens when a part is faulty
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question and
                          entries.concern_reliability.question).
                        Strength: moderate; whether the host-readings
                        crossing waits belongs to the receiver
                        decision, and this point is only that the
                        runs-after option needs the wait to keep its
                        promise while the previous-step option does
                        not.

