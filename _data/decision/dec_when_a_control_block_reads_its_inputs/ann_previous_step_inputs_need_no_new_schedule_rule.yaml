title:                  Dependency order that puts a block with only feedback inputs first
brief:                  |
                        Under the previous-step option every input of
                        the unit control block is a feedback edge, so
                        the block has no input of the same local step
                        and plain dependency order can run it first.
                        The repair is two defaults declared on ports
                        that already exist, under the ruled default
                        rule, and the trial already wires the mode as
                        feedback and reads a count of 0 on it as
                        normal mode. The other two options each need a
                        scheduling rule of their own: the feeding
                        nodes, then the block, then the rest, with an
                        exemption written into
                        rqt_control_block_writes_first; or a new node
                        kind with a half that must run last.
description:            |
                        Sources:
                        - The block of a unit runs first in each local
                          step and reads the
                          inputs mode_in and host_readings_in
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at surface.unit.dataflow_step.invocation and
                          surface.unit.dataflow_step.input).
                        - Wired as the ICDs describe, block, mode
                          controller and mode_in form
                          a loop that check.lp refuses with feedforward edges, as reproduced,
                          and that needs a default no port declares with a feedback edge
                          (review of 2026-10-29, CC-053).
                        - The trial's schedule leaves feedback edges
                          out of the dependencies
                          and runs a ready control node before other ready nodes, as read
                          from the code (trial 2c777ab9, src/cctool/dataflow/generate.py,
                          function unit_order).
                        - The trial joins the mode controller to
                          mode_in by a feedback edge,
                          and a build with a mode controller was refused because neither
                          port declared a default (trial 2c777ab9,
                          src/cctool/dataflow/lower.py, function _control_blocks; review of
                          2026-10-29, CC-023, reproduced).
                        - The trial's block leaves the mode at 0,
                          normal, when mode_in holds
                          no items (trial 2c777ab9,
                          src/cctool/dataflow/engine/nodes/control_block.cpp, function
                          control_block_unit_step).
                        - A feedback edge needs an end that declares
                          it can supply a default
                          (_data/decision/dec_default_values_on_feedback_edges/ruling_default_from_a_port_that_declares_it.yaml
                          at brief).
                        - The runs-after option exempts the feeding
                          nodes from reading the
                          control message of the same step
                          (_data/decision/dec_when_a_control_block_reads_its_inputs/opt_control_block_runs_after_the_nodes_that_feed_it.yaml
                          at brief); the split option adds a reader that runs last
                          (_data/decision/dec_when_a_control_block_reads_its_inputs/opt_control_block_split_into_writer_and_reader.yaml
                          at brief).
                        - The reviewer recommends the previous-step
                          reading (review of
                          2026-10-29, section 7, W-T3).
                        - Maintainability asks how far a change in one
                          part spreads to
                          others (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question).
                        ASSUMPTION: in the unit that holds the host
                        block, the host block and the unit block are
                        both control nodes with no input of the step,
                        so one stated tie-break, unit block first, is
                        still needed. Strength: strong; it rests on a
                        reproduced contradiction and on trial code
                        that, read rather than run, would need the two
                        defaults and the host-readings join marked
                        feedback; no build with them was tried.

