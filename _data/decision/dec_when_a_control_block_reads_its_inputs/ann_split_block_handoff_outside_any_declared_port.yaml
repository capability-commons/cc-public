title:                  Handoff into the privileged writer outside any declared port
brief:                  |
                        Under the split option the reader hands the
                        block's inputs to the next step's writer. If
                        that handoff is a declared feedback edge with
                        a default, the option is the previous-step
                        option with one node more; if it is anything
                        else, it is a path into the one node
                        privileged to read time and services that no
                        port declares. The generated fuzz harness
                        works from the declared interface, its inputs
                        with a count of 0 included and its declared
                        state, so it would never reach that path, and
                        no check would see it. The previous-step and
                        runs-after options keep every input of the
                        block on declared ports.
description:            |
                        Sources:
                        - Control blocks are the only nodes privileged
                          to read time and
                          runtime services
                          (_data/decision/dec_how_nodes_reach_runtime_services/ruling_services_in_a_control_message.yaml
                          at brief).
                        - The generator writes each node kind's
                          harness from its declared
                          interface, decoding each input as a bounded array up to its
                          capacity, a count of 0 included, with any mode or service port and
                          a value of the declared state type
                          (_data/decision/dec_fuzzing_of_a_single_node/opt_harness_generated_from_the_node_interface.yaml
                          at brief;
                          _data/decision/dec_fuzzing_of_a_single_node/ruling_harness_generated_from_the_node_interface.yaml
                          at brief).
                        - The state of a node is held by the engine
                          and handed to that node
                          at each invocation
                          (_data/interface_control_document/icd_dataflow_node.yaml at
                          surface.step.dataflow_step.state), so declared state carries
                          nothing from one node to another.
                        - The split option does not say how the reader
                          hands its values to
                          the writer
                          (_data/decision/dec_when_a_control_block_reads_its_inputs/opt_control_block_split_into_writer_and_reader.yaml
                          at brief).
                        - Security asks what an attacker can reach
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question).
                        Strength: weak; it turns on how the handoff
                        would be built, which the option leaves open.

