title:                  Same lag from overrun to mode under all three options
brief:                  |
                        Trace an overrun in local step k. Under the
                        previous-step option the block reports it at
                        k+1, the mode controller acts at k+1, and the
                        block hands the new mode to every node at k+2.
                        Under the runs-after option the mode
                        controller at k+1 still reads the message of
                        step k, which does not yet hold the overrun,
                        so it acts at k+2 and the block passes the
                        mode on in that same step: k+2 again. The
                        split option also gives k+2. The runs-after
                        option buys freshness only for host readings,
                        by one local step, and only in the unit that
                        holds the host block.
description:            |
                        Sources:
                        - The mode controller reads the control
                          message, which carries the
                          overruns, and writes the mode flag
                          (_data/interface_control_document/icd_dataflow_mode_controller.yaml
                          at surface.step.dataflow_step.input and
                          surface.step.dataflow_step.output).
                        - Under the runs-after option a node that both
                          feeds and reads the
                          block, such as the mode controller, reads the previous step's
                          message
                          (_data/decision/dec_when_a_control_block_reads_its_inputs/opt_control_block_runs_after_the_nodes_that_feed_it.yaml
                          at brief).
                        - The trial counts an overrun after the step
                          ends, and the block
                          copies the count into the next control message (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, function run_unit;
                          src/cctool/dataflow/engine/nodes/control_block.cpp, function
                          control_block_unit_step).
                        - The mode changes only after its condition
                          has held for a set
                          number of local steps, 5 by default in the trial
                          (_data/requirement/rqt_mode_controller_hysteresis.yaml at brief;
                          trial 2c777ab9,
                          src/cctool/dataflow/standard/node_kind/mode_controller.yaml).
                        - The lag of a mode switch must fit in the
                          capacity margin
                          (_data/decision/dec_response_to_sustained_overload/ann_mode_switch_lag_must_fit_in_the_capacity_margin.yaml
                          at brief).
                        - Response time is a measure of performance
                          efficiency
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure).
                        ASSUMPTION: host readings such as processor
                        temperature change slowly next to a local step
                        of about 33 ms, so one step of age costs
                        little. Strength: moderate; derived by tracing
                        the records and the trial, not measured.

