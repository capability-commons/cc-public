title:                  Platform service calls placed after the control message is written
brief:                  |
                        The host block is the node that reads host
                        services from the platform: the operating
                        system and vendor services such as a thermal
                        sensor. Under the previous-step option the
                        unit block has no input of the step, and
                        writes-first places it before the host block
                        in the unit they share, so the platform calls
                        come after the control message is written: a
                        changed or missing service affects only the
                        next step's readings, though a slow call still
                        lengthens the step. Under the runs-after
                        option those calls sit ahead of the control
                        message for every node of that unit. The split
                        option orders them as the previous-step option
                        does.
description:            |
                        Sources:
                        - The host block reads what belongs to the
                          host, such as processor
                          temperature
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at description).
                        - The trial's host block opens a sysfs thermal
                          file and calls
                          getloadavg in every local step, while the unit block reads only
                          the clocks (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/platform_posix.cpp, functions
                          df_platform_cpu_temp_mc and df_platform_load_permille;
                          src/cctool/dataflow/engine/nodes/control_block.cpp, functions
                          control_block_host_step and control_block_unit_step).
                        - That call allocates in every step of the
                          unit holding the host
                          block (review of 2026-10-29, CC-009, reproduced).
                        - The block writes the control message before
                          any other node of its
                          unit is invoked
                          (_data/requirement/rqt_control_block_writes_first.yaml at
                          qualifier).
                        - Dependency risk asks what happens if
                          something taken from a third
                          party changes or is withdrawn (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question).
                        Strength: weak; the calls are short, and
                        reading the platform on a thread of its own,
                        as the review proposes for CC-009, would
                        shrink the difference.

