title:                  Control block runs after the nodes that feed it
brief:                  |
                        The control block runs after the nodes that
                        feed its inputs and before every other node,
                        so it reads this local step's values. Those
                        feeding nodes are exempt from reading the
                        control message of the same step, and a node
                        such as the mode controller, which both feeds
                        and reads the block, reads the previous step's
                        message.

