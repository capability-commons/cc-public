title:                  Control block reads the previous step's inputs
brief:                  |
                        The control block runs first and reads its
                        inputs as feedback edges, with the values of
                        the previous local step. Its mode input
                        declares the default normal, and the host
                        readings declare an empty default, so the
                        first local step starts in normal mode.

