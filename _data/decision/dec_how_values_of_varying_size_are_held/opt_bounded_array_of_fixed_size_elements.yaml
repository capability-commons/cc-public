title:                  Bounded array of fixed-size elements
brief:                  |
                        Each message on an edge is an array of
                        elements of one fixed-size type, with a length
                        that varies per message up to a capacity the
                        port declares. Memory for the full capacity is
                        allocated from the declaration, so nothing is
                        allocated while the system runs, and a message
                        longer than the capacity is an error the
                        producer must handle. A nested or text value
                        is written as such an array.
description:            |
                        WTP's convention (WTP, 2026-10-26), with a
                        declared capacity so that memory can be laid
                        out ahead of time.

