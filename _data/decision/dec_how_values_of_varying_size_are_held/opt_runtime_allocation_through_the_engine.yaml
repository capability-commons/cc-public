title:                  Allocation at run time through the engine's allocator
brief:                  |
                        A node may ask the engine's allocator for
                        memory of any size while it runs, and the
                        engine frees it when the value is no longer
                        held. Values have no declared bound. Allowed
                        only in dynamic regions, so static builds keep
                        allocating nothing.
description:            |
                        The least restrictive form, given for
                        comparison.

