title:                  Payload in a pool, with a handle on the edge
brief:                  |
                        Every edge carries a value of fixed size, and
                        a value of varying size travels as a handle to
                        a block in a memory pool whose block sizes and
                        count are declared and allocated ahead of
                        time. The handle is a memory token, read-only
                        once sent or moved, so the same mechanism
                        serves values of varying size and copies that
                        are not made. A producer that finds no free
                        block meets a declared policy, such as
                        dropping the message or waiting.
description:            |
                        The pattern of chunk pools in iceoryx and
                        buffer pools in GStreamer, offered beside
                        WTP's convention.

