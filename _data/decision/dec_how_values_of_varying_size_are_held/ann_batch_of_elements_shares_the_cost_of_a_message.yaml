title:                  Batch of elements that shares the cost of a message
brief:                  |
                        WTP likens the convention to scaled data flow,
                        in which a batch of values per message let
                        each fine-grained node run as a sequence of
                        SIMD steps and use the cache better. A bounded
                        array of fixed-size elements, packed in one
                        block, gives a node the same: one call for
                        many elements, a loop over packed data that a
                        compiler can vectorize, and the cost of each
                        message, its call, its header and any
                        transport frame, shared by all its elements. A
                        pool handle gives the same layout only after a
                        lookup, and padding to a fixed size gives it
                        with no count to stop the loop.
description:            |
                        Sources:
                        - WTP suggested that each message on an edge
                          be a variable-length array of fixed-size
                          elements.
                          (_data/decision/dec_how_values_of_varying_size_are_held/dec_how_values_of_varying_size_are_held.yaml
                          at description)
                        - WTP's "scaled data flow" is an old paper on
                          fine-grained dataflow graphs whose nodes
                          each do one elementary operation; it
                          improved cache efficiency by sending batches
                          of values, so that each node runs as a
                          sequence of SIMD steps (owner's statement,
                          2026-10-26).
                        - The drafted bounded sequence holds its items
                          in one array with a count.
                          (_sources/axair-orchestrator/docs/component_interface.md#5-variable-length-data-decided-2026-10-11-fixed-capacity)
                        - A packet may carry a header with a type id,
                          size and sequence number.
                          (_sources/axair-orchestrator/docs/execution_levels.md#4-types-a-numpy-compatible-description)
                        - Performance efficiency asks about
                          throughput, in operations per second.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure.1)
                        - Assumption: the elements of a message are
                          processed alike, as detections or samples
                          are; a value made of unlike parts gains
                          less. Strength: moderate; it grows with the
                          number of elements per message.

