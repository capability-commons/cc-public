title:                  How values of varying size are held
brief:                  |
                        How does an edge carry a value whose size
                        varies from one step to the next, such as a
                        list of detections or a compressed frame, when
                        memory is to be allocated from declarations
                        rather than by nodes at run time?
description:            |
                        WTP noted that allocating buffers per edge
                        from the declared types limits edges to data
                        of a fixed size, which is a big limitation,
                        and suggested a convention in which each
                        message on an edge is a variable-length array
                        of elements of a fixed-size type (WTP,
                        2026-10-26). The drafted node contract says a
                        node allocates nothing, and the ruling on
                        where engine behavior lives admits engine
                        behavior only with a recorded decision held to
                        a measured budget. To be ruled together with
                        dec_who_owns_the_memory_of_a_value.

