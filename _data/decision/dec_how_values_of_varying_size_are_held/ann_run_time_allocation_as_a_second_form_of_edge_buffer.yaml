title:                  Allocation at run time as a second form of edge buffer
brief:                  |
                        The ruling on the first engine has static and
                        dynamic subgraphs share one form of edge
                        buffer from the first version. Allocation at
                        run time, allowed only in dynamic regions,
                        gives dynamic edges a form static edges cannot
                        have. A value with no bound cannot cross a
                        fixed slot into the static subgraph without
                        being cut to a bound at the slot, and moving a
                        node from a dynamic region into a static build
                        changes what its code may do. On a bare core
                        the engine would also have to bring a heap:
                        real-time allocators exist, but o1heap, built
                        for hard real-time systems, needs a heap of
                        2M(1 + ceil(log2 n)) for peak use M and
                        largest request n to be sure no request fails,
                        which is at least twice the peak.
description:            |
                        Sources:
                        - One engine runs a static and a dynamic
                          subgraph, "sharing one node interface, one
                          form of edge buffer, one form of node state
                          and one step protocol from the first
                          version".
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          at brief)
                        - The run-time option is allowed only in
                          dynamic regions, and its values have no
                          declared bound.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_runtime_allocation_through_the_engine.yaml
                          at brief)
                        - Values cross between the subgraphs through
                          fixed slots.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ruling_same_step_through_fixed_slots.yaml
                          at brief)
                        - An execution unit may be a core with no
                          operating system.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - o1heap is "designed for hard real-time
                          high-integrity embedded systems", with
                          constant-time calls and a worst-case memory
                          bound H(M,n) = 2 M (1 + ceil(log2 n)); MIT
                          License.
                          (https://github.com/pavel-kirienko/o1heap)
                        - Flexibility asks what it takes to install
                          the design on a new platform.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question.1)
                        - Assumption: the slot ruling's fixed slots
                          hold values of a declared size. Strength:
                          strong while the first-engine ruling stands.

