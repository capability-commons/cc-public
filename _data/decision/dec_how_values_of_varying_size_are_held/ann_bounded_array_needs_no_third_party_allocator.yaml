title:                  Bounded array with no third-party allocator
brief:                  |
                        A bounded array is a count beside a fixed
                        array, which the drafted engine writes as a
                        template of one line, and which matches
                        AUTOSAR's arrays of variable size with an
                        upper bound. A pool shared between OS
                        processes needs a shared-memory allocator,
                        written in house or taken from a library such
                        as iceoryx, whose successor iceoryx2 lists
                        bare metal only as a proof of concept.
                        Allocation at run time on a bare core needs an
                        allocator library, such as o1heap, or one
                        written in house. The bounded array adds no
                        dependency on any target.
description:            |
                        Sources:
                        - template <class T, size_t N> struct
                          BoundedSeq { uint32_t count; T item[N]; };
                          replaces list.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - In AUTOSAR, an array of VARIABLE-SIZE
                          semantics may vary at run time, and its
                          arraySize sets the upper bound.
                          (https://autosar.readthedocs.io/en/latest/autosar4_api/datatype/application_array_element.html)
                        - iceoryx2 lists bare metal as
                          "proof-of-concept": "A proof-of-concept with
                          no_std bare-metal support is available."
                          (https://docs.rs/crate/iceoryx2/latest)
                        - o1heap is a constant-time allocator for hard
                          real-time embedded systems under the MIT
                          License.
                          (https://github.com/pavel-kirienko/o1heap)
                        - The pool option's blocks are declared and
                          allocated ahead of time.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_payload_in_a_pool_with_a_handle_on_the_edge.yaml
                          at brief)
                        - Dependency risk counts direct and indirect
                          dependencies.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.measure.0)
                        - Assumption: a pool within one OS process can
                          be written in house with little code; the
                          dependency arises between processes.
                          Strength: moderate; it holds at any graph
                          size.

