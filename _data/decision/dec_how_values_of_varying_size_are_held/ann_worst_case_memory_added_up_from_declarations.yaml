title:                  Worst-case memory added up from declarations before a change is applied
brief:                  |
                        With fixed sizes or declared capacities, a
                        check can add up the memory of a resolved
                        graph before it is sent: for each edge, its
                        capacity times its element size times the
                        buffers the edge needs, one within a unit and
                        more across units or behind a queue, plus
                        state, slots, and the room a swap reserves for
                        a second copy of state. Since a deployment may
                        apply any change set that checks, the target
                        can compare what a change set adds with what
                        it has left, and refuse it before applying it.
                        A pool's total is declared too, but whether it
                        suffices depends on how long each holder keeps
                        a block, such as a frame history node that
                        keeps the last frames, which a check can bound
                        only if each port declares how many tokens it
                        may keep. Allocation at run time gives a check
                        nothing to add.
description:            |
                        Sources:
                        - A deployment may apply any change set that
                          checks against the graph it runs; a change
                          set is checked by cctool before it is sent
                          and by the runtime before it is applied.
                          (_data/decision/dec_runtime_mode_set/ruling_any_change_set_checked_against_the_running_graph.yaml
                          at brief;
                          _data/decision/dec_change_set_at_a_step/ruling_change_set_checked_by_both.yaml
                          at brief)
                        - Every buffer the framework allocates has a
                          size known before the system starts.
                          (_sources/axair-orchestrator/docs/component_interface.md#5-variable-length-data-decided-2026-10-11-fixed-capacity)
                        - Keeping the old state through a swap doubles
                          the swapped node's state memory for a step,
                          and room for it must be reserved.
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_in_place_doubles_state_memory_for_a_step.yaml
                          at brief)
                        - Patrol's frame history keeps the last
                          analysis frames.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_frame_history.yaml
                          at brief)
                        - The run-time option gives values no declared
                          bound.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_runtime_allocation_through_the_engine.yaml
                          at brief)
                        - Maintainability asks how readily a change
                          can be checked before it ships; safety
                          counts identified hazards without a
                          mitigation. (_data/register/reg_concern.yaml
                          at
                          entries.concern_maintainability.question.2
                          and entries.concern_safety.measure.0)
                        - Assumption: the target knows its free memory
                          and the check is cheap enough to run before
                          each change set. Strength: strong; the sum
                          grows linearly with the graph, and it is the
                          only option set that lets running out of
                          memory be refused rather than met.

