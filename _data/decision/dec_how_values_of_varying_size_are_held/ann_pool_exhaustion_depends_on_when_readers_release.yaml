title:                  Pool exhaustion that depends on when readers release
brief:                  |
                        A pool shared by several edges runs out
                        according to how many blocks are held at once,
                        and across execution units that depends on
                        when readers in other units release theirs. A
                        drop policy then drops a message that another
                        run would keep, so the tokens on an edge, and
                        a replay, depend on timing, against the Kahn
                        property. A wait policy keeps the tokens but
                        can stall a producer behind a slow reader
                        without limit, as iceoryx warns for a
                        publisher that waits for its subscriber, or
                        deadlock where a cycle waits on itself. A
                        capacity overflow under the bounded array
                        option fails one message, the same way in
                        every run, and cannot starve other edges.
                        Within one unit on a fixed schedule, the
                        blocks held at each point are the same in
                        every run, so a pool there is deterministic
                        and a check could size it.
description:            |
                        Sources:
                        - A producer that finds no free block meets a
                          declared policy, such as dropping the
                          message or waiting.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_payload_in_a_pool_with_a_handle_on_the_edge.yaml
                          at brief)
                        - Units run in parallel and exchange values at
                          the boundaries of a step.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - In a Kahn process network "Timing or
                          execution order of processes must not affect
                          the result"; capping FIFOs by blocking
                          writes "may unfortunately lead to an
                          artificial deadlock".
                          (https://en.wikipedia.org/wiki/Kahn_process_networks)
                        - iceoryx: with a publisher set to wait for
                          its consumer, "it is possible that a slow
                          subscriber blocks a publisher indefinitely".
                          (https://github.com/eclipse-iceoryx/iceoryx/blob/main/iceoryx_examples/iceoptions)
                        - GStreamer's acquire blocks until a buffer is
                          released, unless a flag makes it return at
                          once.
                          (https://developer-old.gnome.org/gstreamer/stable/gstreamer-GstBufferPool.html)
                        - Under the bounded array option, a message
                          longer than the capacity is an error the
                          producer must handle.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_bounded_array_of_fixed_size_elements.yaml
                          at brief)
                        - Reliability asks what happens when a part or
                          an input is faulty.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reliability.question.1)
                        - Assumption: pools would be shared between
                          units placed on one host, as a pool in
                          shared memory is. Strength: strong across
                          units; weak within one unit.

