title:                  Allocation hidden in node code, found by its symbols
brief:                  |
                        Much ordinary C++ breaks the rule that a node
                        allocates nothing: standard containers and
                        strings, and throwing an exception, since
                        libstdc++ allocates each exception with malloc
                        and falls back to an emergency pool, while the
                        drafted wrapper catches whatever a node
                        throws. When every value has a declared bound,
                        a node never needs to grow a buffer, and a
                        build can enforce the rule by refusing a node
                        object that refers to malloc, operator new or
                        __cxa_allocate_exception. Allocation through
                        the engine at run time makes some allocation
                        legal, so the rule can no longer be checked so
                        simply, and a node that grows a container in a
                        dynamic region may fail mid-step when memory
                        runs out.
description:            |
                        Sources:
                        - The component holds no globals and allocates
                          nothing.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - The framework's wrapper catches anything
                          thrown and maps it to a signal.
                          (_sources/axair-orchestrator/docs/component_interface.md#why-this-shape)
                        - In libstdc++, __cxa_allocate_exception calls
                          malloc and, if that fails, an emergency
                          pool.
                          (https://gnu.googlesource.com/gcc/+/refs/tags/releases/gcc-8.2.0/libstdc++-v3/libsupc++/eh_alloc.cc)
                        - The run-time option lets a node ask the
                          engine for memory of any size while it runs.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_runtime_allocation_through_the_engine.yaml
                          at brief)
                        - Safety asks how the design avoids or limits
                          each hazard.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.1)
                        - Assumption: a check of undefined symbols in
                          each node's object is this argument's
                          proposal, not something in the tree; it
                          misses allocation through a library the node
                          calls. Strength: moderate; it holds for
                          every node kind written in C++.

