title:                  Received count and stale tail of a bounded array
brief:                  |
                        A bounded array carries its length as a count
                        beside its storage. A count larger than the
                        capacity, written by a faulty or hostile
                        sender or corrupted on a link, makes every
                        reader that trusts it read past the array, so
                        the receiver of a crossing must check the
                        count against the capacity before passing the
                        value on. A buffer reused from step to step
                        also keeps the elements of an earlier, longer
                        message beyond the current count, so a copy,
                        log or transport that moves the whole capacity
                        sends stale data, which in Patrol may be
                        pictures of people from an earlier frame.
                        Copying only the counted elements, or clearing
                        the tail, closes both. A pool handle received
                        from another unit is worse, since it is an
                        index into memory that the sender chose.
description:            |
                        Sources:
                        - The bounded sequence holds a count and items
                          up to its capacity.
                          (_sources/axair-orchestrator/docs/component_interface.md#5-variable-length-data-decided-2026-10-11-fixed-capacity)
                        - Everything that crosses an edge is fixed
                          size and trivially copyable, so it can be
                          copied whole.
                          (_sources/axair-orchestrator/docs/execution_levels.md#4-types-a-numpy-compatible-description)
                        - A frame step holds the Y plane of a camera
                          picture.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_frame_history.yaml
                          at declaration.frame_step.shape)
                        - A log of every value entering the graph
                          holds all the data the system took in,
                          including personal data.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ann_replay_log_holds_all_personal_data_seen.yaml
                          at brief)
                        - The pool option carries a handle to a block
                          on the edge.
                          (_data/decision/dec_how_values_of_varying_size_are_held/opt_payload_in_a_pool_with_a_handle_on_the_edge.yaml
                          at brief)
                        - Security asks what an attacker can reach,
                          and who can read what.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question.2 and
                          entries.concern_security.question.0)
                        - Assumption: a crossing between units may
                          face a link or a process that is not
                          trusted. Strength: moderate; it is fixed
                          once, in the transport nodes and in the copy
                          routine, and does not grow with the graph.

