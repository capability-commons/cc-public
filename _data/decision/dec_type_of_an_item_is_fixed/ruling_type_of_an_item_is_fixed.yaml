title:                  Type fixed for life, prefix renamable
brief:                  |
                        An item never changes its type, so a change of
                        type is a removal and an addition. A type's
                        prefix may be renamed, and its items then keep
                        their 32 hex digits under the new prefix. Once
                        prefix_alias is built, the type entry lists
                        its former prefixes so that old guids still
                        resolve; until then a prefix rename mints new
                        guids. Ruled by William Payne on 2026-10-22.

