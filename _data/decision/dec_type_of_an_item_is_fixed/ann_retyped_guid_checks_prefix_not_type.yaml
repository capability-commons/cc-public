title:                  Check on the prefix, not the type
brief:                  |
                        retyped_guid forbids any new prefix on old hex
                        digits, which is stricter than "coarse types
                        never change": it also forbids a new prefix
                        for a type that stays the same.
description:            |
                        src/cctool/commit/change.lp within
                        retyped_guid: "The 32 hex digits of a guid
                        that existed before the commit are not given
                        another prefix after it".
                        notes/cc-public-session-context.md line 24:
                        "Similar types may share one prefix", but the
                        repository now gives each type its own prefix
                        (duplicate_prefix, src/cctool/check/check.lp
                        within bad_guid; concept_type in
                        _data/register/reg_concept.yaml). The step
                        from types to prefixes is not sourced to a
                        maintainer's statement.

