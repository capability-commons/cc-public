title:                  Every reference rewritten under either rule
brief:                  |
                        Keeping the hex digits on a retype saves no
                        edits to referring items. Every edge holds the
                        prefixed id and guid, so every reference
                        changes under either alternative.
description:            |
                        An edge carries both id_target and guid_target
                        (_data/schema/sch_trait_edge.yaml at
                        $defs.edge.required), and the prefix is on
                        both (memory/cc-public-design-principles.md
                        line 15). A reference whose guid does not
                        match fails guid_mismatch
                        (src/cctool/check/check.lp within
                        member_stem). What a retype would keep is
                        continuity of identity, not edits.

