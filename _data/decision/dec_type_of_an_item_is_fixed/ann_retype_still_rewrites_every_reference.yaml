title:                  Every reference rewritten under either rule
brief:                  |
                        Keeping the hex digits on a retype saves no
                        edits to referring items. Every edge holds the
                        prefixed id and guid, so every reference
                        changes under either alternative.
description:            |
                        An edge carries both id_target and guid_target
                        (_data/schema/sch_trait_relation.yaml lines
                        74-75), and the prefix is on both
                        (memory/cc-public-design-principles.md line
                        15). A reference whose guid does not match
                        fails guid_mismatch
                        (src/cc_public/check/check.lp lines 242-256).
                        What a retype would keep is continuity of
                        identity, not edits.

