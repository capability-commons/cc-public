title:                  Hex digits kept in the dlm to dls rename
brief:                  |
                        Before the check existed, a prefix rename kept
                        the hex digits of existing items, as the other
                        alternative would.
description:            |
                        Commit 6b551e3 (2026-10-14 07:16 UTC, in the
                        history under tag pre_squash_20261014) changed
                        dlm_b486151691284b839319bf76ec589c06 to
                        dls_b486151691284b839319bf76ec589c06 and
                        dlm_356edabde21c4f628386fc0fc1c31860 to
                        dls_356edabde21c4f628386fc0fc1c31860 (git show
                        6b551e3, src/cctool/check/check.dl and
                        src/cctool/graph/derive.dl). retyped_guid,
                        added later in 7520f91, matches exactly this
                        pattern.

