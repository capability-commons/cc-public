title:                  Item type read from the prefix alone
brief:                  |
                        With a prefix fixed for life, the type of an
                        item follows from its id or guid by one rule.
                        No reader or tool needs to know what the item
                        used to be.
description:            |
                        The type of an item is derived only from the
                        prefix of its id and the type register
                        (src/cc_public/graph/derive.lp lines 32-49,
                        prefix_of and has_type). The rule that keeps
                        the prefix is one rule of about ten lines
                        (src/cc_public/commit/change.lp lines
                        103-118). ASSUMPTION: under a retype, tools
                        that key items by the whole guid would have to
                        key by the hex part or carry a history of
                        prefixes.

