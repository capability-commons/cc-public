title:                  Engine change turned into item churn
brief:                  |
                        Some coarse types name the language or engine
                        of a file, so a move to another engine removes
                        items and adds new ones. The engine choice is
                        open to revisiting, so the churn can recur.
description:            |
                        The move from Souffle to clingo removed three
                        dls_ items and added three lpf_ items (commit
                        6230e98). The prefix of a code item is chosen
                        from the file suffix
                        (src/cc_public/graph/extract.py line 166). The
                        engine is to be revisited when the graph is
                        large enough to measure
                        (ruling_cross_item_checks_engine.yaml), and
                        Will: "We should switch to Clingo until we
                        really need to change to Souffle" (owner's
                        statement, 2026-10-14T22:11:54Z). ASSUMPTION:
                        the broader name logic program file may cover
                        Souffle files, so a return might keep lpf_.
                        The cost scales with engine-bound items, three
                        today.

