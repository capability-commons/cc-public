title:                  Type fixed for life, prefix renamable
brief:                  |
                        An item never changes its type, so a change of
                        type is a removal and an addition. A type's
                        prefix may be renamed: its items keep their 32
                        hex digits under the new prefix, and the type
                        entry lists its former prefixes so that old
                        guids still resolve.

