title:                  One meaning of guid equality
brief:                  |
                        With a fixed prefix, identity is the whole
                        guid string and every rule compares it whole.
                        A retype would put identity in the hex digits
                        only, so each comparison would need a second,
                        suffix-based form.
description:            |
                        The commit rules for added, removed and
                        renamed items match whole guid strings
                        (src/cc_public/commit/change.lp lines 82-84,
                        89-91, 97-100). Edges name their target by the
                        whole guid in guid_target. Of the rules in
                        change.lp and check.lp, only retyped_guid
                        compares the hex digits apart from the prefix
                        (change.lp lines 104-118). ASSUMPTION: no
                        retype design exists to check against; it
                        would need suffix matching in each rule or a
                        separate record from old guid to new.

