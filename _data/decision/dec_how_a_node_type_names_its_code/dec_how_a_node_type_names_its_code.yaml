title:                  How a node type names its code
brief:                  |
                        The generator must find the code of each node
                        type: its step function, its state type and
                        its source files. Where is that binding
                        written?
description:            |
                        ruling_c_contract_with_direct_cpp_calls makes
                        C the contract, with direct C++ calls in the
                        static subgraph. The native surfaces of node
                        code were held back until a C++ extractor
                        exists, which
                        ruling_cpp_interfaces_checked_from_the_first
                        requires no later than the first interface
                        with a native C++ surface.
                        dec_where_dataflow_items_are_kept leaves open
                        where the binding of a node type to its code
                        lives. The trial implementation of 2026-10-29
                        wrote a function name and a source file in the
                        file of each kind of node (trial process log,
                        phase 2).

