title:                  Function names and paths from items that reached generated code
brief:                  |
                        The trial's generator copied names and strings
                        from its YAML items into C++ and CMake
                        unchecked, and the review made an item inject
                        a statement into the generated main through a
                        list of sources, and run a command at CMake
                        configure through the name of an unused kind
                        of node. Under a node type item or a manifest,
                        the step function and the state type, and on a
                        node type item the source files, are again
                        free strings in items, each needing the
                        validation of names and the quoting that the
                        review asks for. Under a header, the function
                        name comes from the extractor's parse of real
                        code and the path from where the file was
                        found, so neither is free text.
description:            |
                        Sources:
                        - Names and strings from items reach C++ and
                          CMake unescaped: the
                          core given to a unit ran code at start, an actor's sources entry
                          injects a statement into main, an unused kind's name runs a
                          command at CMake configure, and bad identifiers fail only in the
                          compiler. (review of 2026-10-29, CC-020;
                          /mnt/project-files/notes/reviews/2026-10-29-full-review/areas/trial-gen.md,
                          TRIAL-GEN-05)
                        - The fix is one validator for every
                          interpolated name, quoted
                          CMake arguments, and generating only the kinds a graph uses.
                          (review of 2026-10-29, CC-020)
                        - The trial named a function and a source file
                          in the file of each
                          kind. (/mnt/project-files/notes/dataflow-trial/process-log.md,
                          phase 2)
                        Strength: moderate; a validator closes most of
                        the gap for the other two options, and node
                        sources are compiled anyway, which the review
                        says limits the harm.

