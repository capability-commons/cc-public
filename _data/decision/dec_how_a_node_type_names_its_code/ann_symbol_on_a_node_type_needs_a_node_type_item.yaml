title:                  Binding of code that needs a node type item from another decision
brief:                  |
                        Naming the symbol and sources on the node type
                        assumes an item for the node type, which no
                        registered type holds today; the open decision
                        on port declarations creates one only under
                        its node type option, and the decision on
                        where dataflow items are kept names node types
                        without saying what they hold. If port
                        declarations go on the step surface, this
                        option must create a node type item for the
                        binding alone, or write code names into the
                        interface control document, whose schema note
                        says it names no implementation. The header
                        option needs no node type item, since code
                        points to the interface, and a manifest is an
                        item of its own either way. The two decisions
                        have two coherent pairs: a node type item with
                        the binding on it, or the step surface with a
                        header.
description:            |
                        Sources:
                        - The node type item names its step function,
                          its state type and
                          its source files.
                          (_data/decision/dec_how_a_node_type_names_its_code/opt_node_type_names_its_symbol_and_sources.yaml
                          at brief)
                        - The declarations of ports go either on a
                          node type item or on the
                          step surface, among others.
                          (_data/decision/dec_where_dataflow_port_declarations_live/opt_declarations_on_a_dataflow_node_type_item.yaml
                          and
                          _data/decision/dec_where_dataflow_port_declarations_live/opt_declarations_on_the_dataflow_step_surface.yaml
                          at brief)
                        - The interface control document names no
                          implementation.
                          (_data/schema/sch_interface_control_document.yaml at note)
                        - No registered type of item holds a node
                          type.
                          (_data/register/reg_data_item_type.yaml at entries)
                        - Where the binding of a node type to its code
                          lives is left open
                          by dec_where_dataflow_items_are_kept, whose options all keep
                          node types somewhere without saying what one holds beyond its
                          interface.
                          (_data/decision/dec_how_a_node_type_names_its_code/dec_how_a_node_type_names_its_code.yaml
                          at description;
                          _data/decision/dec_where_dataflow_items_are_kept/opt_dataflow_items_under_data.yaml,
                          opt_dataflow_files_in_a_folder_of_their_own.yaml and
                          opt_project_items_under_data_with_a_packaged_library.yaml at
                          brief)
                        - Simplicity asks whether a design follows
                          from decisions already
                          made. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2)
                        Strength: moderate; it is a dependency, not a
                        fault, and weighs only once the decision on
                        port declarations is ruled.

