title:                  Code that names its interface, as Python modules already do
brief:                  |
                        In the tree the trace runs from code to
                        contract: a Python function names the
                        interface member it implements by
                        relation_realizes, check.lp holds the two to
                        each other, and the interface names no
                        implementation so that it can travel to a
                        partner without the code. A header in each
                        node source file extends that one mechanism to
                        C and C++, read by the extractor already ruled
                        to arrive with the first native C++ interface,
                        which reads source text alone and knows API
                        macros by name. A node type item or a library
                        manifest runs the other way, naming a
                        function, and on a node type item its files,
                        by strings that no reference check resolves,
                        and is a second file to keep in step with the
                        code.
description:            |
                        Sources:
                        - Code names the member it implements with
                          relation_realizes, so
                          the document names no implementation and can travel to a partner
                          who has none of the code.
                          (_data/schema/sch_interface_control_document.yaml at note;
                          _data/register/reg_data_item_type.yaml at
                          entries.type_interface_member.usage)
                        - A Python module's item lets it be traced
                          without a second file
                          to keep in step with it. (_data/register/reg_data_item_type.yaml
                          at entries.type_python_module.usage)
                        - The checks join a function that realizes a
                          member with its
                          extracted signature. (src/cctool/check/check.lp within
                          realized_function and signature_mismatch)
                        - A C++ extractor arrives no later than the
                          first interface with a
                          native C++ surface; it uses tree-sitter, reads the source text
                          alone and knows API macros by name.
                          (_data/decision/dec_check_of_cpp_interfaces/ruling_cpp_interfaces_checked_from_the_first.yaml
                          at brief)
                        - The trial's binding was a function name and
                          a source file in the
                          file of each kind, a stand-in for what the extractor would read.
                          (/mnt/project-files/notes/dataflow-trial/process-log.md, phase 2,
                          INVENTED entry on how a node kind names its code)
                        - Simplicity counts the distinct mechanisms a
                          design adds.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0)
                        - No item type for C or C++ source files
                          exists yet, and the
                          register gives each kind of source code a type of its own.
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_file.note)
                        ASSUMPTION: a C or C++ source file can carry
                        an item header in a comment, as a shell script
                        or a logic program file does. Strength: strong
                        on the count of mechanisms; it needs an item
                        type for node source files.

