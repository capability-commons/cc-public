title:                  Choice between two codes that realize one interface
brief:                  |
                        A configured node today names only the
                        interface it presents, while the requirements
                        speak of each implementation a node can use,
                        and a swap at a step replaces version n of a
                        node with version n+1 in a running engine, so
                        both codes must be present in the engine and
                        told apart. A node type item or a manifest
                        entry gives the graph and a change set
                        something to name for each code. A header
                        points from code to interface only, so when
                        two files realize one interface nothing in the
                        graph says which one the generator compiles
                        for a node, unless the node also names its
                        code, which the option does not say. The trial
                        kept the second version of its accumulator as
                        a kind of its own that named the first.
description:            |
                        Sources:
                        - A dataflow node realizes one interface
                          control document, and a
                          check fails one that realizes other than one.
                          (_data/schema/sch_dataflow_node.yaml at description;
                          src/cctool/check/check.lp within interface_count)
                        - A fuzz harness is required for each
                          implementation that a
                          dataflow node can use.
                          (_data/requirement/rqt_generator_fuzz_harness.yaml at object)
                        - At the start of a step the engine runs
                          version n+1 in place of
                          version n, keeping the old state until the new version completes
                          a step, so it can go back.
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                          at brief, upheld by ruling_swap_at_a_step_with_state_upgrade)
                        - The trial's second accumulator was a kind
                          that named the first
                          as the kind it versions, with another function in the same source
                          file. (trial 2c777ab9,
                          src/cctool/dataflow/_test/_example/node_kind/accumulate_v2.yaml)
                        ASSUMPTION: a change of code that keeps the
                        interface, such as a bug fix, is swapped
                        without a new interface version; where the
                        state type changes, the interface's state
                        member changes and a new interface version
                        tells the two apart. Strength: moderate; a
                        header could also name a version or key that a
                        node names, at the cost of a reference the
                        option does not describe.

