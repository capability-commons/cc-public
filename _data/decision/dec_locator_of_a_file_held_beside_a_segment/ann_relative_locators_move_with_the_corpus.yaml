title:                  Relative locators that move with the corpus
brief:                  |
                        A locator relative to the segment root stays
                        right when the corpus moves to another disk or
                        machine, and changes only where a file moves
                        within it. An absolute file URI names one
                        machine's path, breaks on any move and tells a
                        reader of a federated graph where the holder's
                        files live. The fixity digest finds a moved
                        file in either case.
description:            |
                        Sources:
                        - The locator is a URI where the document can
                          be fetched, and fixity records a digest of
                          the document as fetched.
                          (_data/schema/sch_external_document.yaml at
                          description)
                        - The library's directory of
                          models-of-computation literature has been
                          reorganized (WTP, 2026-10-28).

