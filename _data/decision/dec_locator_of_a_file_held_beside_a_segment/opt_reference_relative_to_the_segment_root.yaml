title:                  Reference relative to the segment root
brief:                  |
                        The locator is a URI reference resolved
                        against the root of the segment holding the
                        item, percent-encoded, with absolute paths and
                        references outside the root refused. The
                        fixity is the digest of the file itself.
description:            |
                        The proposal of the first corpus of reading
                        notes (2026-10-28), changing the schema's
                        format from uri to uri-reference.

