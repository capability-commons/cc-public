title:                  URI reference as the standard relative form
brief:                  |
                        RFC 3986 defines a URI reference as either a
                        URI or a relative reference, resolved against
                        a base URI, and JSON Schema names that format
                        uri-reference. Changing the format follows the
                        standard rather than inventing a path field,
                        and every existing locator, all absolute,
                        stays valid.
description:            |
                        Sources:
                        - RFC 3986, Uniform Resource Identifier (URI):
                          Generic Syntax, section 4.1, URI-reference =
                          URI / relative-ref.
                          https://www.rfc-editor.org/rfc/rfc3986

