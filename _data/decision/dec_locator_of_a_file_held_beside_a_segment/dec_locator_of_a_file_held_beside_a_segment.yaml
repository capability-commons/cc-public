title:                  Locator of a file held beside a segment
brief:                  |
                        How does an external document point at a file
                        held beside its segment, such as a paper in
                        the library, rather than at a web address?
description:            |
                        The locator of an external document is a URI,
                        which the schema checks as an absolute URI, so
                        a path relative to the corpus cannot be
                        written. The library's topic folders were
                        reorganized on 2026-10-28 and may be again,
                        and the corpus is meant to move as a whole.

