title:                  Cardinality, transitive and dependency undeclared
brief:                  |
                        The relation entry declares only domain,
                        range, acyclic and inverse, and cardinality,
                        transitive and dependency are not declared on
                        any entry, so the reason describes the
                        intended entry, not the one built.
description:            |
                        _data/schema/sch_regentry_relation.yaml lines
                        38-41 ("Cardinality and other properties that
                        a checker might read are not yet declared")
                        and 44-93. The register prose still says an
                        entry holds "the cardinality at each end"
                        (_data/register/reg_relation.yaml lines
                        33-35). grep for transitive over _data and src
                        finds no field. At HEAD 89c74d8. Raised by the
                        flexibility, maintainability, simplicity and
                        traceability advocates.

