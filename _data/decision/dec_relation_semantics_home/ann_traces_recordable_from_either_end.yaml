title:                  Traces recordable from either end
brief:                  |
                        Because an edge may be recorded from either
                        end and is read back as one primary edge, a
                        link from an element to its reason can be
                        written on whichever item its author owns.
description:            |
                        reg_relation.yaml at note (an author may write
                        only to items they own). primary_edge reverses
                        an inverse edge (derive.lp within
                        primary_edge), and the checker reads
                        primary_edge (check.lp within
                        parameter_member). ASSUMPTION: pairing could
                        do the same only if each pair is linked for
                        tooling; no such design is recorded.

