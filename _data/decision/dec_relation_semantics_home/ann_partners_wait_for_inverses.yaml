title:                  Partners waiting for an inverse
brief:                  |
                        No inverse exists yet, so a partner who owns
                        only the target-side items cannot record a
                        fact from their end until the register owner
                        embeds one, where pairs would give both
                        readings from the start.
description:            |
                        13 entries and 0 embedded inverses in
                        reg_relation.yaml at HEAD 89c74d8. Inverses
                        are minted on demand (reg_relation.yaml lines
                        38-40) inside the relation register
                        (sch_regentry_relation.yaml lines 69-93), and
                        an author may write only to items they own
                        (reg_relation.yaml lines 45-50). The point
                        does not hold for a partner who also owns the
                        register.

