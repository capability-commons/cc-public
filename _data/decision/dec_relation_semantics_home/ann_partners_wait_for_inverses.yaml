title:                  Partners waiting for an inverse
brief:                  |
                        No inverse exists yet, so a partner who owns
                        only the target-side items cannot record a
                        fact from their end until the maintainer of
                        the register embeds one, where pairs would
                        give both readings from the start.
description:            |
                        30 entries and 0 embedded inverses in
                        reg_relation.yaml. Inverses are minted on
                        demand (reg_relation.yaml at note) inside the
                        relation register (sch_regentry_relation.yaml
                        at properties.inverse), and an author may
                        write only to items they own
                        (reg_relation.yaml at note). The point does
                        not hold for a partner who also owns the
                        register.

