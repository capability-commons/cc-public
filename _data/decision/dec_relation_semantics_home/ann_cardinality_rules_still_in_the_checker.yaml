title:                  Cardinality rules still in the checker
brief:                  |
                        Cardinality and other single-relation rules
                        are written by relation name in check.lp, so
                        the system today mixes the chosen design with
                        hard-coded checks.
description:            |
                        check.lp names 26 of the 30 relations by
                        literal id, 52 times, with 9 more uses in
                        derive.lp and 4 in advise.lp. Examples:
                        missing_about (check.lp lines 608-614),
                        option_count (627-630), no_option_in_ruling
                        (641-644), supersession_across_types
                        (742-745), argument_without_concern
                        (1411-1413). The same constraints are stated
                        again in register prose (reg_relation.yaml
                        lines 177-178, 316-317), so a change touches
                        two files, and a partner cannot see these
                        rules in the register. They were ported by
                        hand from Souffle in 6230e98. Rules that join
                        several relations, such as
                        decisions_mixed_in_ruling (check.lp lines
                        658-662), belong in the checker under any
                        alternative. The point fades if cardinality
                        becomes a declared field, as
                        sch_regentry_relation.yaml lines 43-46 allow.

