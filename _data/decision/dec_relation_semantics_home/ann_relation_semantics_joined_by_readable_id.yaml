title:                  Relation semantics joined by readable id
brief:                  |
                        The tooling joins an edge to its relation, and
                        an inverse to its primary, by readable id,
                        which the schema says does not resolve
                        reliably across a federation, so register
                        semantics reach a partner's edges only while
                        both sides keep the same ids.
description:            |
                        "The guid is what resolves; the readable id is
                        an advisory copy" (sch_trait_edge.yaml at
                        description,
                        $defs.edge.properties.guid_relation.description
                        and $defs.edge.properties.id_target). The
                        extractor builds edges from id_relation and
                        id_target (extract.py within column) and
                        inverses as readable id pairs (extract.py
                        within definitions); derive.lp within
                        primary_edge reverse through that pair. It
                        bears equally on opt_paired_relations.
                        ASSUMPTION: partners will reuse relations
                        under a different or stale id; no such case is
                        recorded.

