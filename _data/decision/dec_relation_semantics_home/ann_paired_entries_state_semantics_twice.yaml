title:                  Paired entries stating semantics twice
brief:                  |
                        Paired entries state each domain and range
                        twice, once as the other's range and domain,
                        and need a further rule to keep the two halves
                        in step.
description:            |
                        An inverse holds identity and surface form
                        only (sch_regentry_relation.yaml lines 31-36,
                        69-93). The checker reads domain, range and
                        acyclic keyed by one relation id (check.lp
                        lines 260-285, 523-545; extract.py lines
                        132-153). ASSUMPTION: under pairing the domain
                        of a relation is the range of its inverse; no
                        file describes the paired design in detail.

