title:                  Paired entries stating semantics twice
brief:                  |
                        Paired entries state each relation constraint
                        twice, once at each end of the pair, and need
                        a further rule to keep the two halves in step.
description:            |
                        An inverse holds identity and reading only
                        (sch_regentry_relation.yaml lines 36-41,
                        78-102). The checker reads relation
                        constraints and acyclic keyed by one relation
                        id (check.lp lines 587-597, 1121-1142;
                        extract.py lines 1289-1290). ASSUMPTION: under
                        pairing the source constraint of a relation is
                        the target constraint of its inverse; no file
                        describes the paired design in detail.

