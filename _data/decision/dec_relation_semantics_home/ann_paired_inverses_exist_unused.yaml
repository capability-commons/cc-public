title:                  Paired inverses existing with no use
brief:                  |
                        On-demand inverses exist only when an item
                        records an edge with them, while pairs create
                        a second entry whether or not any edge uses
                        it.
description:            |
                        An inverse "is minted when an item wants to
                        record an edge that way, and not as a matter
                        of course" (reg_relation.yaml at note). No
                        entry embeds an inverse today (30 entries, 0
                        inverse keys); the one inverse in the code
                        base is a test fixture (test_check.py within
                        test_an_edge_recorded_through_an_inverse_is_read_in_reverse).
                        ASSUMPTION: pairing would add about 30 entries
                        today, none used by any edge.

