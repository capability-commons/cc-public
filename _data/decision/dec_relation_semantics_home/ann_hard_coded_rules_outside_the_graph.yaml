title:                  Hard-coded relation rules outside the graph
brief:                  |
                        A rule hard-coded in the checker keeps its
                        reason in a program comment, where no edge can
                        reach it, while a register entry is an item
                        that an edge can reach.
description:            |
                        "A relation type is an item like any other"
                        (_data/schema/sch_trait_edge.yaml lines
                        99-100). Rules with their reason in a comment
                        only: check.lp lines 289-301
                        (relation_is_about), 304-315
                        (relation_is_option_for), 360-371
                        (relation_supersedes). ASSUMPTION: check.lp
                        rules do not become items linked to decisions;
                        nothing records such a plan.

