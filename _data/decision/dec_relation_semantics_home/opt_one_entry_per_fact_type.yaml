title:                  One register entry per fact type
brief:                  |
                        Hold what a relation allows in its one
                        register entry: the relation constraints on
                        its ends, acyclic and reads_through. A rule
                        that combines several relations, such as how
                        many options a decision has, stays in the
                        checker. Cardinality moves into the entry when
                        a second relation needs it. An inverse with
                        identity and reading only may be embedded when
                        an item needs one; none does yet, so edges are
                        recorded in one direction.

