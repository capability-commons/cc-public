title:                  One entry holding each meaning of a relation
brief:                  |
                        The primary entry holds all the semantics of a
                        fact type, an inverse is minted on demand
                        rather than in pairs, and direction decides
                        which item carries a fact and, in a
                        federation, who may record it.
description:            |
                        Session summary that WTP pasted on 2026-10-09
                        (will-messages.md line 59, under "Relations").
                        It came from another thread and may be an
                        assistant-written summary that WTP passed on.
                        The same rule of one meaning per relation led
                        to the split of
                        relation_is_specified_by_schema, which "meant
                        one thing on a type entry ... and another on a
                        register" (commit f587284, pre-squash; memory
                        MEMORY.md says WTP asked for the split).
                        acyclic was added in commit fd6323a
                        (pre-squash) under the existing rule that a
                        property "is added when a relation needs it"
                        (sch_regentry_relation.yaml at note). Recorded
                        in reg_relation.yaml at description, usage and
                        note from bb8c338 (pre-squash).

