title:                  Checked trace from each driver to an argument
brief:                  |
                        Each driver of a component gets a
                        machine-checked trace to at least one argument
                        before a ruling stands. The driver set is
                        stated once per component, not once per
                        decision.
description:            |
                        src/cc_public/check/check.lp lines 423-435 and
                        448-453;
                        .agents/skills/editing-data-items/SKILL.md
                        lines 75-80; lc_tooling.yaml lines 17-41. An
                        argument for an alternative counts, so the
                        trace may reach the chosen option only through
                        an alternative. The trace is only as good as
                        the driver list.

