title:                  Old rulings reopened by a new driver
brief:                  |
                        Adding a driver to a component makes every
                        past ruling about it fail the check until the
                        new concern is argued. That arrives as one
                        large batch of annotations to review.
description:            |
                        unargued_driver has no condition on when a
                        driver or ruling was added (check.lp lines
                        448-453). The repository names drivers for
                        lco_tooling only, and base0 names them for six
                        components. ASSUMPTION: each later change to
                        drivers is followed by a batch of new
                        annotations. Adding a concern to the register
                        does the same to the other two alternatives,
                        so this weighs on them too.

