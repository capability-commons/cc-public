title:                  Subject of a decision now checked for type
brief:                  |
                        The annotation says the only check on a
                        decision's subject is its relation_is_about
                        edge, that relation_is_about has no range, and
                        that only a logical component can have
                        drivers. Now a decision must be about a
                        logical component, and any design entity may
                        have drivers.
description:            |
                        decision_about_non_component
                        (src/cc_public/check/check.lp line 1334)
                        reports a decision about anything but a
                        logical component, so a decision about
                        concern_safety now fails. Relations have no
                        range: relation_is_driven_by takes
                        relcon_is_design_entity at its source
                        (_data/register/reg_relation.yaml lines
                        452-495). No rule yet refuses a logical
                        component with no driver, so that part of the
                        point stands; all six components now name
                        drivers. Found in the review of 2026-10-22.

