title:                  One relation and one check
brief:                  |
                        The driver list adds one relation and one
                        reported check, and reuses the logical
                        component already set up as the subject of a
                        decision. It records nothing for a concern
                        with no bearing.
description:            |
                        Commit 3d7ef5b adds r_is_driven_by and the
                        check unargued_driver, with helper rules
                        settles and argued. The check reaches drivers
                        through r_is_about on the decision
                        (src/cc_public/check/check.lp lines 448-453).
                        The logical component became the subject of
                        decisions in f4cb721 and 75475b6. Driver edges
                        grow with components, not with decisions.

