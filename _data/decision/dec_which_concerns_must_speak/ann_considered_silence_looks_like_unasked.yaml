title:                  Silence that cannot be told apart
brief:                  |
                        Under the driver list, a non-driver concern
                        that says nothing leaves no record. Neither
                        the graph nor its reviewer can tell a concern
                        considered and found to have no bearing from
                        one never asked.
description:            |
                        Non-drivers are "not expected to speak"
                        (_data/register/reg_relation.yaml lines
                        421-424). unargued_driver reads no other
                        concern (check.lp lines 448-453). Commit
                        68d1924: "Cost and schedule may still speak,
                        but are not required." With sixteen concerns
                        and five drivers, eleven may stay silent on
                        each decision about lco_argumentation, and
                        twelve for a component with four drivers. The
                        owner wants a process "to make sure all
                        relevant concerns are considered" (W
                        2026-10-14T19:33:44Z). The gap falls only on
                        concerns already ranked as non-drivers.

