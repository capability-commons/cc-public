title:                  Drivers now named for every component
brief:                  |
                        The annotation says the repository names
                        drivers for lco_tooling only. Now all six
                        logical components name their drivers.
description:            |
                        Each file in _data/logical_component holds
                        relation_is_driven_by edges:
                        lco_argumentation, lco_change_control,
                        lco_item_graph, lco_project_guidance and
                        lco_vocabulary five each, and lco_tooling
                        seven. A new driver on any of them now reopens
                        past rulings about it. Found in the review of
                        2026-10-22.

