title:                  No driver relation for weighing all
brief:                  |
                        Counted by mechanisms alone, weighing every
                        concern is smaller: the check could range over
                        every concern, with no driver relation and no
                        driver lists to keep.
description:            |
                        unargued_driver reaches concerns only through
                        r_is_driven_by (check.lp line 452). Each
                        component carries four or five driver edges
                        (templates/drivers.txt). ASSUMPTION: a check
                        for all concerns would match every item of
                        type t_concern in place of the driver edge.
                        This says nothing of how many annotations each
                        alternative makes people write.

