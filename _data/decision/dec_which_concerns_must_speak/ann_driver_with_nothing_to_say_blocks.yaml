title:                  Blocked ruling for a driver with nothing to say
brief:                  |
                        When a driver honestly has no bearing, the
                        only ways past the check are to leave the
                        decision with no ruling or to record an
                        argument that is not one. A no bearing record
                        expresses that case.
description:            |
                        argued holds only for a practical annotation
                        (check.lp within
                        decision_about_non_component). Nothing records
                        a concern with no bearing (3d7ef5b message).
                        templates/advocate.md line 32 expects that an
                        advocate may have nothing to say. Drivers are
                        chosen as the concerns that matter
                        (reg_relation.yaml), so the case should be
                        rare. ASSUMPTION: a no bearing record limited
                        to drivers would meet this without the noise
                        the maintainer objected to; he did not say.

