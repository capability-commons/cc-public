title:                  Concerns now 20 and drivers 5 to 8
brief:                  |
                        The annotation says the register has sixteen
                        concerns and each component names four or five
                        drivers. Now the register has 20 concerns, and
                        the 13 logical components name between five
                        and eight drivers each.
description:            |
                        The table of _data/register/reg_concern.yaml
                        holds 20 entries. Of the 13 files in
                        _data/logical_component, lco_dataflow_engine
                        holds eight relation_is_driven_by edges,
                        lco_chat and lco_tooling seven, lco_chat_core,
                        lco_federation and lco_release six, and the
                        other seven five each.
                        ruling_drivers_of_the_tooling upholds
                        opt_seven_tooling_drivers. Found in the review
                        of 2026-10-22, and recounted on 2026-10-24.

