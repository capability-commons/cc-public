title:                  Absence of an argument recorded twice
brief:                  |
                        A no bearing record states as an item what the
                        absence of an argument already shows. It also
                        gives annotations a role beside support and
                        challenge, which the check does not have.
description:            |
                        An argument counts only when an annotation
                        supports or challenges an option for a concern
                        (check.lp). ASSUMPTION: a no bearing record
                        needs a new edge or a new role, since it
                        neither supports nor challenges.

