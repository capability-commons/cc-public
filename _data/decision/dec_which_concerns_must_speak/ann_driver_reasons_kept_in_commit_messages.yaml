title:                  Driver reasons outside the graph
brief:                  |
                        The driver list carries the weight of which
                        concerns matter, but a driver edge holds no
                        reason. The reasons for the drivers of
                        lco_tooling are written only in a commit
                        message.
description:            |
                        lco_tooling.yaml lines 17-41 and
                        base0/_data/logical_component/lco_argumentation.yaml
                        lines 17-42 hold only relation and target ids.
                        The reasons are in the message of commit
                        68d1924. ASSUMPTION: a possible remedy is a
                        decision for the driver choice of each
                        component; the owner has not proposed it.

