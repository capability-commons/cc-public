title:                  Drivers of the component as the concerns that must speak
brief:                  |
                        Each logical component names its drivers, and
                        a ruling is refused until each driver has an
                        argument. The drivers of a component are the
                        minimum set, not the whole list: a single
                        decision may add a driving concern of its own
                        where that concern is clearly relevant. A
                        ruling is judged by the drivers in force when
                        it was made, so a driver added later does not
                        reopen past rulings, though they may be
                        revisited, for example in a periodic review.
                        Weighing every concern, or recording no
                        bearing for each silent one, would fill every
                        decision with arguments nobody needs to read.
                        Ruled by WTP on 2026-10-24.

