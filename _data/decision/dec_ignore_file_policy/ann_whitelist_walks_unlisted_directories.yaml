title:                  Directory walk over unlisted trees
brief:                  |
                        Rule `!*/` reopens every directory, so git
                        status walks and tests every file in unlisted
                        trees, where a blacklist skips an excluded
                        directory whole. Large local trees must still
                        be excluded by name under the whitelist.
description:            |
                        Line 36 `*` ignores everything and line 48
                        `!*/` re-includes every directory so that git
                        searches them (repo/.gitignore lines 36-48).
                        "Git doesn't list excluded directories for
                        performance reasons"
                        (https://git-scm.com/docs/gitignore, PATTERN
                        FORMAT). Measured in two scratch repositories
                        (git 2.43.0, GIT_TRACE2_PERF, 2026-10-15 and
                        again 2026-10-23), each with one yaml file and
                        a _tools/big tree of 300 directories of 300
                        empty files: with this .gitignore,
                        read_directory visits 304 directories and
                        about 90,300 paths in 0.09 to 0.13 s; with a
                        .gitignore of `_tools/` alone, 2 directories
                        and 5 paths in under 0.002 s. The file already
                        names .pixi/, .venv/, build/ and .ruff_cache/
                        as excludes (lines 101-104); _tools/ is not
                        named and holds binaries (memory/MEMORY.md
                        lines 32, 55; memory/review-tool.md line 19).
                        Grows with the size of unlisted local trees,
                        not with the graph. It shows the chosen file
                        is already a hybrid rather than favoring a
                        pure blacklist. Sits at the edge of
                        flexibility and performance_efficiency.

