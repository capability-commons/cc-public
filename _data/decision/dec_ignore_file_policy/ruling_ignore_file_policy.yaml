title:                  Whitelist .gitignore
brief:                  |
                        The whitelist keeps out every file nobody
                        named, such as local tool binaries, other
                        tools' output and platform files, with no rule
                        written for each. Its costs are one admit line
                        for each new file type and a silent skip when
                        that line is missing, both narrow while data
                        is yaml only. A blacklist must name every
                        unwanted file in advance, and a missed rule
                        lets that file in. Ruled by WTP on 2026-10-23.

