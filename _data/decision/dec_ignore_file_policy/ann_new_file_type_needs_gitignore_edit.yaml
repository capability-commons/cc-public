title:                  Edit to .gitignore for each new file type
brief:                  |
                        Under the whitelist, a change that adds a new
                        kind of tracked file, or brings in a partner's
                        file in a new format, must also edit
                        .gitignore. Every later edit to the file so
                        far is such an admit rule.
description:            |
                        Six commits after bb8c338 change .gitignore,
                        and each adds, removes or changes an admit
                        rule; none adds an exclude rule: ba66f33
                        `!src/**/*.dl`, a0b3f50 `!/AGENTS.md`, 87c602d
                        removes it, 6255160 `!/.agents/**` and
                        `!/AGENTS.md`, 653e172 `!/.githooks/*`,
                        6230e98 replaces `*.dl` with `*.lp` (git log
                        of .gitignore, tag pre_squash_20261014 and
                        HEAD; 2026-10-13 to 2026-10-14). Data under
                        _data is admitted only as json, xml or yaml
                        (lines 79-87), so a .reqif or .csv file needs
                        a new rule. ASSUMPTION: no partner has yet
                        sent such a file. Each edit is one line. It
                        grows with tooling, not with the number of
                        data items of known types.

