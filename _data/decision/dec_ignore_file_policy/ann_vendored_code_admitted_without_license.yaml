title:                  Vendored code admitted without its licence
brief:                  |
                        The whitelist admits source files under src/
                        by extension but no LICENSE or NOTICE file
                        there, so vendored code would be tracked
                        without its licence text.
description:            |
                        git check-ignore -v reports
                        src/cc_public/vendor/foo.py as tracked by line
                        92 and src/cc_public/vendor/LICENSE as ignored
                        by line 37 (hypothetical paths, run on the
                        clone, 2026-10-15). Only the root LICENSE and
                        NOTICE are admitted (lines 68, 70). Apache-2.0
                        section 4(a) and 4(d) and the MIT licence
                        require the licence or notice to go with
                        copies
                        (https://www.apache.org/licenses/LICENSE-2.0,
                        https://opensource.org/license/mit). Nothing
                        is vendored today; dependencies are declared
                        in pyproject and pixi (memory/MEMORY.md line
                        31). ASSUMPTION: future tooling might copy in
                        third-party code. The fix is one admit line.

