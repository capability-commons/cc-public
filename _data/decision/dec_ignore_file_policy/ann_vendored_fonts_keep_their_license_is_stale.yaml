title:                  Vendored fonts tracked with their license
brief:                  |
                        ann_vendored_code_admitted_without_license
                        says only the root LICENSE and NOTICE are
                        admitted and nothing is vendored. Third-party
                        fonts are now vendored under src, and
                        .gitignore admits their license file. A
                        license file elsewhere under src is still
                        ignored.
description:            |
                        src/cctool/web/_static holds three ET Book
                        font files and LICENSE-et-book, an MIT license
                        naming Dmitry Krasny, Bonnie Scranton and
                        Edward Tufte. .gitignore admits them with
                        "!src/**/_static/*.woff" and
                        "!src/**/_static/LICENSE-*" (lines 84 and 85).
                        No other rule admits a license file under src,
                        so the hypothetical case of a vendor folder
                        outside _static is unchanged. Found in the
                        review of 2026-10-22.

