title:                  Agent directories open to any file type
brief:                  |
                        The whitelist admits every file under .agents/
                        and .claude/, so third-party skills or plugins
                        copied there are tracked as readily as under a
                        blacklist.
description:            |
                        Rules `!/.agents/**` and `!/.claude/**`
                        (repo/.gitignore lines 60-61). git
                        check-ignore -v reports
                        .agents/skills/x/run.js and
                        .claude/plugins/x/LICENSE as tracked
                        (hypothetical paths, 2026-10-15). Tracked
                        agent material today is one skill written here
                        and a symlink (git ls-files .agents .claude).
                        ASSUMPTION: the project may later take skills
                        or plugins from others.

