title:                  Silent skip of an unadmitted file type
brief:                  |
                        A file of a type not yet admitted does not
                        show in git status and is skipped by git add
                        without a word, so an author can believe it is
                        committed. A blacklist fails the visible way,
                        with an unwanted file shown as untracked.
description:            |
                        In a scratch repository with this .gitignore,
                        `git add .` and `git add -A` skip a .md,
                        .reqif or .csv file with exit code 0; adding
                        the file by name fails with "The following
                        paths are ignored" and exit code 1 (git
                        2.43.0, 2026-10-15). git status leaves out
                        ignored files unless --ignored is given
                        (https://git-scm.com/docs/git-status). The
                        commit gate checks a copy built from staged
                        content (src/cc_public/gate/gate.py lines
                        166-181; test_gate.py lines 86-90), so it
                        fails when a missing code or rule file breaks
                        check, lint or test. ASSUMPTION: a prose or
                        data file that no gate stage reads gets no
                        such catch. The ordering of rules also needs
                        notes to be understood (.gitignore lines
                        22-27, 41-46).

