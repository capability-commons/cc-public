title:                  Sampling that leaves the ruling's word checked unheld
brief:                  |
                        The ruling says the resolved graph is checked.
                        A sample leaves some hand-written leaves
                        unchecked, so either the ruling's word goes
                        unheld or a second rule must say which leaves
                        need not be checked; and a sample by pairs of
                        features needs a feature vocabulary that does
                        not exist yet, on top of the per-variant key.
description:            |
                        Sources:
                        - The resolved graph is derived, never stored,
                          and checked.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - A rule claims no more than something holds.
                          (_data/register/reg_design_rule.yaml at entries.rule_claim_only_what_is_held.brief)
                        - Patrol has five runnable leaves.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 24-38)
                        - Sampling covers each pair of features, and
                          whether presence tags become a feature vocabulary is
                          an open decision.
                          (_data/decision/dec_which_resolved_graphs_are_checked/opt_sampled_leaves_checked.yaml,
                          brief;
                          _data/decision/dec_feature_model_or_explicit_family/dec_feature_model_or_explicit_family.yaml,
                          brief)
                        - The simplicity question asks whether a
                          design follows from decisions already made.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.question.2)
                          Strength: strong while hand-written leaves
                          are the norm.

