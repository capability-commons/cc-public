title:                  Check rules that match nodes across graphs by id alone
brief:                  |
                        Most dataflow check rules match a node's
                        edges, settings and interfaces by node id with
                        the graph left open, and a base node keeps its
                        id in every variant, so the facts of several
                        resolved graphs cannot share one program as
                        the rules stand. Checking every non-abstract
                        variant can keep the rules unchanged if each
                        leaf is solved on its own; presence-keyed
                        facts and a family check on the base both mean
                        rewriting the rules, six of which use default
                        negation.
description:            |
                        Sources:
                        - Of the eleven dataflow checks only foreign
                          node and unplaced carry the graph in their
                          heads; the fed predicate, the
                          input-fed-twice and unfed-input checks and
                          the others match facts by node id with the
                          graph left open, and the misnamed-node check
                          reports by node though it reads the graph in
                          its body. (src/cctool/check/check.lp within misnamed_node and interface_count and foreign_node and unknown_port and fed and input_fed_twice and unfed_input and port_type_mismatch and feedforward_loop and unknown_setting and missing_setting and unplaced)
                        - A dataflow setting fact has no graph column.
                          (src/cctool/graph/extract.py within PREDICATE)
                        - A node the base declares keeps its id in
                          every variant.
                          (_sources/cc-patrol-notes/variants.md lines
                          79-82)
                        - Pooling the edges of the five runnable
                          Patrol leaves makes 8 inputs look fed by two
                          or more different edges, though each leaf
                          feeds each input once. (func-compat
                          advocate's resolution of the drafts with
                          _sources/cc-patrol-notes/draft/resolve_sketch.py;
                          _sources/cc-patrol-notes/draft/resolved.txt)
                        - Six of the eleven checks use default
                          negation: foreign node, unknown port, unfed
                          input, unknown setting, missing setting and
                          unplaced. (src/cctool/check/check.lp, same
                          lines)
                        - The lifted Datalog analysis the
                          presence-keyed option draws on is shown for
                          rules with positive bodies only and does not
                          address negation, and the survey warns that
                          negation breaks lifting. (Shahin, Chechik,
                          Salay 2019,
                          https://arxiv.org/abs/1907.02192, as
                          summarized in
                          _sources/survey/product-lines.md lines
                          58-61; _sources/survey/README.md line 137)
                        - All facts are added to one clingo program
                          and grounded once.
                          (src/cctool/graph/logic.py within run)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.0)
                        - ASSUMPTION: the resolver can hand one
                          resolved graph at a time to the existing
                          extractor; if all leaves share one program
                          instead, every option must add a variant key
                          to these rules. Strength: strong; the rule
                          rewrite is a fixed cost that the
                          one-solve-per-leaf form never pays, and the
                          miscounted inputs grow with the leaves.

