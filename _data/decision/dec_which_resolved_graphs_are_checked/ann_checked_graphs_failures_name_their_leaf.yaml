title:                  Failures that name the leaf they hold in
brief:                  |
                        Checking each non-abstract variant, from
                        copies or from presence-keyed facts, gives
                        every failure a variant to trace to its
                        operations. A family check on the base gives
                        results over tag conditions that must be
                        mapped back to hand-written leaves, and a
                        sampled check gives a leaf outside the sample
                        no result to trace from.
description:            |
                        Sources:
                        - The Patrol draft asks that failures name the
                          variant and the operation that introduced
                          the fault.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - In the GM industrial study of lifted
                          analysis, the authors provide a means to
                          view results for a subset of products
                          filtered by feature expression.
                          (https://arxiv.org/abs/2107.07690, abstract)
                        - The presence-keyed option derives a presence
                          fact per item per variant.
                          (_data/decision/dec_which_resolved_graphs_are_checked/opt_every_non_abstract_variant_from_presence_keyed_facts.yaml,
                          brief)
                        - Each hand-written leaf has its own reason in
                          its brief.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 102-103) Strength: strong; with more
                          leaves the mapping from a tag condition to
                          its leaves grows, and so does the share of
                          leaves a sample leaves without a result.

