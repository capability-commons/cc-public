title:                  Five leaves, and faults that need two features
brief:                  |
                        Patrol has five runnable leaves, so sampling
                        saves almost nothing, and in a study of Linux
                        variability bugs most needed two or more
                        features to interact. A check that covers less
                        than every leaf, by a sample or by analyzing
                        only the active choice, misses real faults.
description:            |
                        Sources:
                        - The drafts have five runnable variants and
                          one abstract one.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - Testing the maximal configuration would find
                          20 of 42 Linux variability bugs, and the
                          authors count 30 of the 42 as
                          feature-interaction bugs. (Abal, Brabrand,
                          Wasowski 2014,
                          https://www.itu.dk/~brabrand/42-bugs.pdf)
                        - Under the default activation time, Simulink
                          does not analyze the variant choices for
                          incompatibilities in signal attributes.
                          (https://www.mathworks.com/help/simulink/slref/simulink.variantcontrol.html)
                        - The Patrol draft asks that all eleven
                          dataflow checks run on every resolved
                          variant.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89) Strength: strong now; at ten times
                          the leaves exhaustive checking costs gate
                          time, but the fault argument still holds.

