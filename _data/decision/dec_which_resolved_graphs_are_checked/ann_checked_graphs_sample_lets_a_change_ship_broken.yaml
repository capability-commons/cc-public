title:                  A sampled gate that lets a change ship broken in an unsampled leaf
brief:                  |
                        With a sample, a change to the base or an
                        abstract variant can pass the gate and break a
                        leaf outside the sample, and the sample and
                        its policy become one more thing to keep in
                        step as leaves come and go. Checking every
                        non-abstract leaf has no such gap.
description:            |
                        Sources:
                        - Patrol has five runnable variants.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 24-38)
                        - Testing only the maximal Linux configuration
                          found 48 percent of 42 variability bugs.
                          (Abal et al.,
                          https://www.itu.dk/~brabrand/42-bugs.pdf)
                        - The survey's sampling order begins with
                          every hand-written leaf and puts pairwise
                          coverage after it.
                          (_sources/survey/product-lines.md lines
                          233-243)
                        - One maintainability question asks how
                          readily a change can be checked before it
                          ships. (_data/register/reg_concern.yaml at entries.concern_maintainability.question.2) Strength: strong at Patrol's size; at
                          ten times the leaves gate time may force a
                          sample, and then a sample over hand-written
                          leaves is the first step.

