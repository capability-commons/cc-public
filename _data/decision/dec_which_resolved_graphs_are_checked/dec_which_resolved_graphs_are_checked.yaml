title:                  Resolved dataflow graphs that the checks cover
brief:                  |
                        Which resolved dataflow graphs of a variant
                        family do the dataflow checks run on?
description:            |
                        The ruling says the resolved dataflow graph is
                        derived and checked, and the eleven dataflow
                        checks today run once per dataflow graph, so
                        running them per variant multiplies the facts
                        by the number of leaves
                        (_sources/variants-framing.md, sections 2 and
                        4, Q4; src/cctool/check/check.lp lines
                        2998-3495).

