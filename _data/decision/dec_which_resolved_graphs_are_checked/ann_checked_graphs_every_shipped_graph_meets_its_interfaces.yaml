title:                  Every graph a target receives checked against its interfaces
brief:                  |
                        A target receives resolved graphs, never
                        operations, so the graph a target or a partner
                        runs is exactly one complete dataflow variant.
                        If every complete variant is checked, each
                        such graph has passed the interface checks
                        (unknown port, port type mismatch, foreign
                        node) before it leaves cctool, and a partner
                        whose product is a variant of a shared base
                        gets a graph that fits the interface control
                        documents it was built against. If only the
                        base or a sample is checked, a variant that no
                        check resolved can reach a target with a port
                        that no longer matches its interface, and the
                        fault shows only when the two sides are
                        joined.
description:            |
                        Sources:
                        - A target receives resolved graphs or the
                          difference between two of them, never
                          operations.
                          (_data/decision/dec_where_variants_are_resolved/opt_variants_resolved_in_python_only.yaml
                          at brief)
                        - The interface checks on a dataflow graph.
                          (src/cctool/check/check.lp within
                          unknown_port, port_type_mismatch and
                          foreign_node)
                        - The family is checked on its base, or on a
                          sample of leaves, under the other options.
                          (_data/decision/dec_which_resolved_graphs_are_checked/opt_family_checked_on_the_base.yaml
                          at brief;
                          _data/decision/dec_which_resolved_graphs_are_checked/opt_sampled_leaves_checked.yaml
                          at brief)
                        - Assumption: partners build their products as
                          variants of shared bases, as the Patrol
                          drafts do. Strength: moderate; it grows with
                          the number of variants a partner ships.

