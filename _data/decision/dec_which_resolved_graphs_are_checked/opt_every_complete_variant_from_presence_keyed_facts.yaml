title:                  Every non-abstract variant, from base facts keyed by presence
brief:                  |
                        Every dataflow variant not marked abstract is
                        checked, with the facts of the base loaded
                        once and a presence fact derived for each item
                        in each variant, in place of a copy of the
                        facts for each leaf.
