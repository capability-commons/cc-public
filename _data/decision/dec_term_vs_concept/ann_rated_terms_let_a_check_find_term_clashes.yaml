title:                  Rated terms that let a check find a clash
brief:                  |
                        With each concept's terms held and rated in
                        one entry, a check can see when one term
                        designates two concepts, and a link can name
                        the concept a term means. That is what
                        terminological quality asks for.
description:            |
                        The concept register holds 72 concepts, 18
                        with admitted terms and 9 with deprecated
                        ones. ambiguous_term
                        (src/cc_public/check/check.lp:1745) reports a
                        linked term that more than one concept rates,
                        and unresolved_term (:1705) one that no
                        concept rates. shared_term
                        (src/cc_public/check/friction.lp:66) finds a
                        term rated for two concepts. ISO 1087:2019
                        rates terms in this way, and ISO 704:2022 asks
                        that a term designate one concept.

