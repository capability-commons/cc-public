title:                  An enacting commit too large to read in full
brief:                  |
                        The commit that enacted this decision also
                        renamed registers and a relation and added
                        nine schemas, about 6,800 changed lines. Its
                        record of judgement rests on the conversation,
                        not on a review of the change.
description:            |
                        Sources: git show --stat 232f001 (20 files,
                        939 insertions, 5,885 deletions) and its
                        message. The register went from 138 entries to
                        7, as the owner asked (2026-10-13T14:06:59Z,
                        2026-10-13T14:46:40Z). The owner asked for a
                        stock-take before the commit
                        (2026-10-13T14:38:18Z). This challenges how
                        the decision was enacted, not its content.

