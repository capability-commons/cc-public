title:                  Multi-word terms that "word" mislabels
brief:                  |
                        33 of the 72 preferred terms have more than
                        one word, so a field called "word" would
                        mislead a reader about what it holds.
description:            |
                        Sources: _data/register/reg_concept.yaml,
                        where 33 of 72 term_preferred values have more
                        than one word, among them register entry,
                        writing style rule, logic program file,
                        logical component and interface control
                        document (reg_concept.yaml at
                        entries.concept_register_entry,
                        entries.concept_writing_style_rule,
                        entries.concept_logic_program_file,
                        entries.concept_logical_component and
                        entries.concept_interface_control_document);
                        admitted terms "edge type" and "style rule"
                        (reg_concept.yaml at
                        entries.concept_relation.term_admitted and
                        entries.concept_writing_style_rule.term_admitted).
                        The schema defines a term as "a designation of
                        a concept in words"
                        (_data/schema/sch_regentry_concept.yaml at
                        $defs.term). Maintainer judges "term" more
                        accurate (2026-10-13). The share of multi-word
                        terms has grown from 7 of 19 to 33 of 72 as
                        the vocabulary grew.

