title:                  Term ratings that map onto TBX status values
brief:                  |
                        The preferred, admitted and deprecated ratings
                        each map onto one of the seven TBX
                        administrative status values, so a partner
                        term base can read them with a field rename.
description:            |
                        Sources:
                        _data/schema/sch_regentry_concept.yaml at
                        note, required and properties (ratings, ISO
                        1087:2019 cited). TBX status list:
                        https://lists.w3.org/Archives/Public/public-esw-thes/2010Jun/att-0015/termAdminStatus.html
                        (preferredTermAdmnSts, admittedTermAdmnSts,
                        deprecatedTermAdmnSts). SKOS maps less well:
                        hiddenLabel is not a deprecated rating
                        (https://en.wikipedia.org/wiki/Simple_Knowledge_Organization_System).
                        The legacy names term, also and avoid
                        (232f001^:_data/register/reg_concept.yaml
                        lines 69-72, 110) appear in neither source.
                        Neither TBX nor ISO 1087 calls the rated unit
                        a "word". AGENTS.md#before-you-finish asks to
                        follow a recognized standard. The mapping cost
                        is per field, so it does not grow with the
                        register.

