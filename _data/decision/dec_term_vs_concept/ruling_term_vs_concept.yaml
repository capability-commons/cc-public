title:                  ISO 1087 rated terms per concept
brief:                  |
                        A term designates a concept and is not the
                        concept itself. Each concept has one entry
                        that rates its terms preferred, admitted or
                        deprecated, as ISO 1087 does and TBX can read.
                        Term is used over word because many terms are
                        several words. Ruled by William Payne on
                        2026-10-22.

