title:                  Bare string terms with no language or metadata
brief:                  |
                        Each term is a bare string with no language
                        tag and no data of its own, so a partner with
                        a multilingual or annotated term base gets
                        less than its format holds.
description:            |
                        Sources:
                        _data/schema/sch_regentry_concept.yaml lines
                        84-90 (term is a string, minLength 1); no
                        language field in that schema. SKOS allows one
                        prefLabel per language tag; SKOS-XL makes a
                        label a resource
                        (https://www.w3.org/TR/skos-reference/skos-xl.html).
                        AGENTS.md lines 89-93: add a field only when a
                        real instance needs it. ASSUMPTION: no partner
                        needs this today. The fix is additive, so the
                        choice does not lock it out. A partial
                        challenge.

