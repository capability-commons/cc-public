title:                  Term distinct from the concept it names
brief:                  |
                        A term represents a concept but is a different
                        thing from it. "Term" is more accurate than
                        "word", and ISO 1087 gives the field names.
description:            |
                        Maintainer's statements, will-messages.md:
                        2026-10-13T14:22:26Z ("term means a different
                        thing from 'concept', but a word or term can
                        represent a concept. The map is not the
                        territory etc.. I would like us to use 'term'
                        in place of 'word' as it's more accurate") and
                        2026-10-13T14:28:45Z ("please use those ISO
                        1087 compliant names as the fieldnames ...
                        call out the reference to ISO 1087"). Enacted
                        in 232f001 (pre-squash).

