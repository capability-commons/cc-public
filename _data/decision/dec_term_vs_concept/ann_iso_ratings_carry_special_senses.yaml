title:                  ISO rating names with special senses
brief:                  |
                        "Admitted" and "deprecated" carry ISO 1087
                        senses a reader must learn, where the legacy
                        "also" and "avoid" did not. This learning cost
                        is paid once per reader.
description:            |
                        Sources:
                        _data/schema/sch_regentry_concept.yaml at note
                        (a note explains the ratings);
                        232f001^:_data/register/reg_concept.yaml lines
                        71, 110 (also, avoid). At 232f001 an entry
                        status "deprecated" also existed with another
                        sense
                        (232f001:_data/schema/sch_register_entry.yaml
                        lines 75-112); it was removed in 44034ef about
                        seven hours later. House style prefers
                        ordinary words unless the concept register
                        defines the technical one
                        (_data/register/reg_writing_style_rule.yaml at
                        entries.style_ordinary_words), and neither
                        "admitted term" nor "deprecated term" has an
                        entry. Counterweight:
                        AGENTS.md#before-you-finish ask to follow ISO
                        1087. A partial challenge.

