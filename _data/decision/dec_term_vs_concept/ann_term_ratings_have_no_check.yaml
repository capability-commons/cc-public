title:                  Term ratings that no check reads
brief:                  |
                        No check flags a deprecated term in use, so a
                        deprecated term in a name or in prose is
                        caught only by a reader, a load that grows
                        with the register. A term rated twice in one
                        concept is now a failure.
description:            |
                        Sources: src/cctool/check/check.lp within
                        term_rated_twice (term_rated_twice fails a
                        term that one concept rates twice;
                        src/cctool/check/_test/test_check.py within
                        test_a_term_a_concept_rates_twice_is_reported).
                        Deprecated terms are left out of term matching
                        (src/cctool/graph/extract.py within _terms;
                        src/cctool/graph/text.py within
                        TUPLE_KEY_TERM), and no rule in check.lp,
                        advise.lp or friction.lp flags one in use. On
                        a copy of the tree, "Datalog source file"
                        written in an option brief gave no failure or
                        advice. AGENTS.md#changing-data-items forbid
                        deprecated terms. Style rules
                        style_ordinary_words and style_plain_names
                        have enforcement none
                        (_data/register/reg_writing_style_rule.yaml at
                        entries.style_ordinary_words and
                        entries.style_plain_names). The register has
                        72 entries; 9 carry term_deprecated and 18
                        term_admitted; "item" is preferred for
                        concept_item and admitted for
                        concept_identifiable_data_item, which
                        src/cctool/check/friction.lp within
                        shared_term report as a shared term.
                        ASSUMPTION: a reviewer cannot recall dozens of
                        deprecated lists while reading a diff. This
                        argues for a check, not for another
                        alternative; the gap applies to all three
                        alternatives alike.

