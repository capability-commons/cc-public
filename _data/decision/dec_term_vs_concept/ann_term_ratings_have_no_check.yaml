title:                  Term ratings that no check reads
brief:                  |
                        No check reads term_preferred, term_admitted
                        or term_deprecated, so a deprecated term in
                        prose or a conflicting rating is caught only
                        by a reader, a load that grows with the
                        register.
description:            |
                        Sources: grep of src at 89c74d8. Neither
                        src/cc_public/check/check.lp nor check.py
                        mentions the term fields; outside tests only
                        src/cc_public/cli/editing.py line 324 does.
                        AGENTS.md lines 54-55 forbid deprecated terms.
                        Style rules style_ordinary_words and
                        style_plain_names have enforcement none
                        (_data/register/reg_writing_style_rule.yaml
                        lines 169-220). The register has 19 entries; 7
                        carry term_deprecated and 5 term_admitted; no
                        term appears in two entries. ASSUMPTION: a
                        reviewer cannot recall dozens of deprecated
                        lists while reading a diff. This argues for a
                        check, not for another alternative; the gap
                        applies to all three alternatives alike.

