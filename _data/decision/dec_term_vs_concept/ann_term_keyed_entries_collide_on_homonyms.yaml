title:                  Term-keyed entries that collide on homonyms
brief:                  |
                        One entry per term cannot hold two concepts
                        that share a term, so a partner homonym
                        collides with a local entry. Concept-keyed
                        entries let such registers sit side by side.
description:            |
                        Sources:
                        _data/schema/sch_regentry_concept.yaml at
                        description (one term may designate several
                        concepts);
                        232f001^:_data/register/reg_concept.yaml lines
                        57-76 (entries keyed term_<word>, one term
                        field each); _data/register/reg_concept.yaml
                        at usage (a partner may hold its own
                        register). Maintainer: "We have one entry per
                        concept, not one entry per technical term"
                        (will-messages.md line 101, 2026-10-13).
                        ASSUMPTION: no partner register exists yet, so
                        no collision has been seen.

