title:                  SemVer with a computed bump
brief:                  |
                        Number releases by Semantic Versioning 2.0.0,
                        with the bump computed from the commit items
                        since the last release.
description:            |
                        Source: maintainer's comments (2026-10-22),
                        "the fact that the graph can mechanically
                        determine the right SemVer bump on a release
                        is, for me, an early sign that the approach is
                        vindicated", and (2026-10-22) "Let's use
                        SemVer 2.0.0 as per https://semver.org/".

