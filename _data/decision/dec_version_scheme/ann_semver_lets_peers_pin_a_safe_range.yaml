title:                  Compatible range a peer can pin under SemVer
brief:                  |
                        Under Semantic Versioning, from 1.0 on, a peer
                        can accept every release below the next major
                        and stay safe from breaking changes, as
                        cc-public already does for most of its own
                        dependencies, so a fix can reach a peer
                        without a break. A calendar number says when a
                        release was made, not whether it breaks a
                        peer, so a second mechanism such as notes read
                        by hand would have to carry that signal.
description:            |
                        Sources: SemVer 2.0.0 item 8, the major
                        version must be incremented for any backward
                        incompatible change to the public API
                        (https://semver.org/). The Major.Minor.Patch
                        part of SemVer is compatible with Python
                        version specifiers
                        (https://github.com/pypa/packaging.python.org/blob/main/source/specifications/version-specifiers.rst
                        lines 747-750). cc-public bounds most of its
                        own dependencies at the next major, such as
                        click>=8.2,<9, and some below 1.0 at the next
                        minor, such as pyoxigraph>=0.5.12,<0.6, while
                        htpy>=25.10,<27 and referencing>=0.36,<1 are
                        bounded more loosely (pyproject.toml lines
                        42-48). Calendar versioning numbers releases
                        by date, such as 2026.10.0
                        (_data/decision/dec_version_scheme/opt_calver.yaml
                        line 13; https://calver.org/). After 1.0 the
                        owner expects to bundle breaking changes into
                        one major release (owner's statement,
                        2026-10-22, _sources/context.md line 16). The
                        owner chose SemVer 2.0.0 (owner's statement,
                        2026-10-22). How a peer absorbs the renames
                        and removals of a release is an open decision
                        (_data/decision/dec_how_peers_absorb_renames/dec_how_peers_absorb_renames.yaml
                        lines 11-15). Limit: SemVer item 4 says that
                        under major version zero anything may change,
                        so the signal starts only at 1.0. Strength:
                        strong after 1.0, empty before it.

