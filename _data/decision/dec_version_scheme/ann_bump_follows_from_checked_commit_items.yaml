title:                  Bump derived from the checked commit items
brief:                  |
                        Every commit already carries a checked item
                        with a verb, and the commit check already
                        finds removals and renames, so a computed bump
                        adds a computation but no new record. Each
                        part of the number then traces to the commits
                        that called for it, and a release that removes
                        or renames an item cannot be labeled a patch
                        by mistake. A bump chosen by hand repeats a
                        judgment the items already record, and a
                        calendar number traces only to a date.
description:            |
                        Sources: every commit carries a commit item
                        with a templated title verb, and the commit
                        check detects renames and removals (context
                        note, _sources/context.md line 34). The verb
                        must be true of the change: Add removes
                        nothing, Remove adds nothing, Rename and Move
                        neither add nor remove, and a commit names
                        each id it removes or renames (AGENTS.md lines
                        98-102; README.md lines 82-86). Commit titles
                        use a closed list of verbs so that most can
                        later be checked against the graph
                        (_data/schema/sch_commit.yaml lines 49-82).
                        The checks unannounced_removal and
                        unannounced_rename find what a commit item
                        does not name (src/cctool/commit/change.lp
                        lines 161 and 218). SemVer 2.0.0 ties major,
                        minor and patch to incompatible changes,
                        compatible additions and compatible fixes
                        (https://semver.org/spec/v2.0.0.html, items
                        6-8). Owner's statements: "the graph can
                        mechanically determine the right SemVer bump
                        on a release" (2026-10-22); "Let's use SemVer
                        2.0.0" (2026-10-22). Only the traceability
                        point also counts against the calendar number.
                        Strength: strong, since the inputs exist and
                        are checked; the protection against
                        under-labeling applies after 1.0.

