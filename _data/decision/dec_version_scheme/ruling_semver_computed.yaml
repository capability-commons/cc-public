title:                  SemVer with a computed bump
brief:                  |
                        Versions follow SemVer 2.0.0 and the graph
                        computes the bump. Ruled by William Payne on
                        2026-10-22: "Let's use SemVer 2.0.0 as per
                        https://semver.org/", and "the fact that the
                        graph can mechanically determine the right
                        SemVer bump on a release is, for me, an early
                        sign that the approach is vindicated."

