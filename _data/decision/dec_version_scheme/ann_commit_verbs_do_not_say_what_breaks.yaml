title:                  Breaking changes the commit verbs do not classify
brief:                  |
                        A computed bump is only as true as the commit
                        items, and a Change or Fix commit, a behavior
                        change that touches no item id, or a Lock
                        commit that pulls in a breaking upstream
                        release can each be counted as minor or patch.
                        SemVer also judges breaks against a declared
                        public API that cc-public has not declared,
                        and the rule for 0.y.z bumps is not stated.
                        Until these are recorded, the scheme needs a
                        way for a person to set or raise the bump.
description:            |
                        Sources: the title templates include "Change
                        OBJECT so that STATEMENT" and "Fix OBJECT so
                        that STATEMENT", with no field for
                        compatibility (_data/schema/sch_commit.yaml
                        lines 56-60 and 84). The verbs include Change,
                        Fix and Lock as well as Remove and Rename
                        (context note, _sources/context.md line 34). A
                        commit that changes pyproject.toml or
                        pixi.lock is treated as code (README.md lines
                        74-77). A class or function gets an item only
                        when something must point at it (AGENTS.md
                        lines 110-113). The per-commit history check
                        does not cover dangling_reference or
                        dangling_mention
                        (_data/decision/dec_commit_gate/ann_commit_gate_misses_rebased_commits.yaml
                        lines 23-27). SemVer 2.0.0 item 1 requires a
                        declared public API and item 4 says anything
                        may change under major version zero
                        (https://semver.org/). cc-public is at 0.1.0
                        and has never released (context note,
                        _sources/context.md line 33); the owner
                        accepts heavy churn before 1.0 (owner's
                        statement, 2026-10-22). The owner will ship
                        the whole of _data (owner's statement,
                        2026-10-22). Assumptions: no rule yet
                        classifies a Change or Lock commit as
                        breaking; no item marks the public API; some
                        breaking changes, such as a changed default,
                        touch no item id. Strength: moderate; it is a
                        gap to fill before the computed bump is
                        trusted, and a rule that treats Lock commits
                        as at least minor plus a manual override would
                        close most of it.

