title:                  Mapping of SemVer pre-release labels for packages
brief:                  |
                        SemVer pre-release and build labels are not
                        legal in the Python public version field or in
                        a conda version, so a SemVer string carrying
                        such a label must be mapped before packaging.
                        The scheme should state that mapping, or the
                        tag and the package will not agree.
description:            |
                        Sources: SemVer versions with a hyphen or plus
                        sign are not permitted in the Python public
                        version field
                        (https://github.com/pypa/packaging.python.org/blob/main/source/specifications/version-specifiers.rst
                        lines 752-754). A conda package version may
                        not contain "-"
                        (https://github.com/conda/conda-build/blob/main/docs/source/resources/package-spec.rst
                        line 90). The owner chose SemVer 2.0.0
                        (owner's statement, 2026-10-22T16:27,
                        _sources/context.md line 18). Strength:
                        moderate; it applies only when such labels are
                        used, and a mapping is cheap to define.

