title:                  Negligible compute cost of a computed bump
brief:                  |
                        A bump computed from commit items needs one
                        read of the messages since the last release,
                        since each item already names its verb and
                        what it removes or renames. A hand-chosen or
                        calendar number costs nothing, so the
                        difference among the options is seconds at
                        most.
description:            |
                        Sources: every commit item has a templated
                        title verb, and the commit check already
                        detects renames and removals (context note,
                        _sources/context.md line 34). A commit item
                        names the id of every item it removes or
                        renames (AGENTS.md#before-you-finish). The
                        history code reads the messages of many
                        commits with one git log call
                        (src/cctool/commit/history.py within
                        FORMAT_LOG and duplicates). Re-checking each
                        commit instead would extract two full graphs
                        per commit (src/cctool/commit/change.py within
                        facts_of), a cost that grows with the commits
                        since the release. Strength: weak, since no
                        option costs enough to matter at the rate
                        releases are cut.

