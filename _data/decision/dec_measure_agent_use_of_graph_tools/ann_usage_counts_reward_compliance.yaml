title:                  Usage counts reward compliance, not efficacy
brief:                  |
                        A count of use rises when the guidance tells
                        agents to use the tools, whether or not the
                        tools help. So counts and shares of use,
                        alone, cannot tell a useful tool from an
                        obeyed one. A trial that sets the same task
                        with and without the tools, with neutral
                        guidance, compares outcomes directly.
description:            |
                        Sources: owner's statement, 2026-10-25: the
                        use should be driven by what is most
                        effective, not by alignment with the owner's
                        wishes, so a direct or proxy measure of
                        efficacy is needed (WTP, 2026-10-25). The
                        guidance already asks for the tools in places:
                        the editing skill says to find link targets
                        with cctool query
                        (.agents/skills/editing-data-items/SKILL.md#the-procedure).
                        Strength: strong for the claim; how large the
                        effect is, is not known.

