title:                  Measures from code can be reviewed and repeated
brief:                  |
                        A log written by code, and a trial scored
                        against a recorded task set at a pinned
                        commit, give numbers a reviewer can trace to
                        their source and run again. A tally by model
                        readers rests on each reader's judgment of
                        what a call was for, which another tally may
                        judge differently.
description:            |
                        Sources: in the tally of
                        ann_query_tools_seldom_used_outside_their_building,
                        readers chose the category of each call (raw
                        lookup, raw edit, other) by judgment, and one
                        reader put file names in a column meant for
                        session ids. Strength: moderate.

