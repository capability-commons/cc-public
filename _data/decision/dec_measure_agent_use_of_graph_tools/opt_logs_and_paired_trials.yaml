title:                  Logs and paired trials
brief:                  |
                        The two logs of
                        opt_log_runs_and_agent_commands measure use
                        and suggest use cases. Efficacy is measured by
                        trials: a fixed set of tasks with known
                        answers, run at a pinned commit by agents that
                        have the graph tools described without advice
                        to use them, and by agents that do not have
                        them. Each run is scored for a correct answer,
                        tool calls, tokens and time. New tasks come
                        from the questions the logs show agents
                        asking.

