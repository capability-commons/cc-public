title:                  Trials cost tokens and upkeep
brief:                  |
                        Each trial run costs tokens for every task,
                        twice over, and more for repeats, since one
                        run of an agent is noisy. The task set needs
                        upkeep as the tree changes, unless the trials
                        run at a pinned commit and the known answers
                        are computed from the graph at that commit.
description:            |
                        Assumption: a useful set holds tens of tasks,
                        each run a few times in each arm. Strength:
                        moderate.

