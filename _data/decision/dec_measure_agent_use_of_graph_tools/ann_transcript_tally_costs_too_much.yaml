title:                  Transcript tally costs too much to repeat
brief:                  |
                        A tally from transcripts reads every tool call
                        of every session through a model, so its cost
                        grows with the work it measures. The owner
                        stopped the first one part way, as not worth
                        its token spend when telemetry can be added
                        and read later.
description:            |
                        Sources: owner's statement, 2026-10-25: "Token
                        spend not justified when we can just add
                        telemetry and learn later" (WTP, 2026-10-25).
                        The tally of 2026-10-25 used seven readers for
                        about 15 minutes and covered the newest parts
                        of 10 of 29 sessions. A transcript page of 100
                        events cost about 25,000 tokens to read.
                        Strength: strong.

