title:                  A command hook belongs to one agent
brief:                  |
                        A hook that logs shell commands is set in the
                        configuration of one coding agent, such as
                        .claude/settings.json for Claude Code. Each
                        other agent needs its own, if it has hooks at
                        all, and remote sessions cannot write that
                        configuration, so the owner installs it.
description:            |
                        Sources: remote sessions are refused writes
                        under .claude by policy, so the owner made the
                        link .claude/skills (AGENTS.md#skills). Codex
                        and Claude Code both read AGENTS.md, but their
                        hook settings differ. Strength: moderate.

