title:                  A cctool log cannot see raw lookups
brief:                  |
                        The usual alternative to a query is grep, sed,
                        cat or a short python script. A log written by
                        cctool records only its own runs, so it cannot
                        show how often an agent looks something up
                        another way, nor which questions it asks that
                        no query serves.
description:            |
                        Sources: in the tally of
                        ann_query_tools_seldom_used_outside_their_building,
                        raw lookups outnumber queries by about 30
                        to 1. Strength: strong for the claim that a
                        cctool log alone misses most lookups.

