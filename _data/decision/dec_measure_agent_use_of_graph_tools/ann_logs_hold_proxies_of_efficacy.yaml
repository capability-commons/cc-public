title:                  Logs hold proxies of efficacy
brief:                  |
                        Logs of both kinds give proxies of efficacy
                        without trials: a query that is followed by a
                        grep for the same words, which suggests the
                        query did not answer; a query that exits with
                        an error; the share of lookups made with
                        cctool while the guidance is neutral; and
                        edits refused, or check failures, after a
                        lookup. The proxies are confounded by the mix
                        of tasks.
description:            |
                        Sources: cctool exits with 2 on an error and 1
                        on a nonconformity (src/cctool/cli/group.py
                        within EXIT_ERROR). Assumption: a lookup
                        repeated by other means soon after a query
                        marks a query that failed the agent. Strength:
                        weak to moderate; the proxies are cheap and
                        continuous, but noisy.

