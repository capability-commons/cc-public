title:                  Logging adds little run time
brief:                  |
                        Adding one line to a local file costs far less
                        than the run of cctool it records. A hook on
                        agent commands starts one more short process
                        for each command, which adds a little to each
                        call. Neither slows the gate, which runs no
                        agent.
description:            |
                        Assumptions: a cctool run takes at least the
                        start of Python and the read of the tree,
                        about a second or more; a hook process takes
                        tens of milliseconds. Not measured. Strength:
                        weak; run time hardly tells the options apart.

