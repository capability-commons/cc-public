title:                  A cctool log is small and self-contained
brief:                  |
                        One callback on the command group can write
                        the log for every subcommand. It needs no
                        setting in the agent, works the same for any
                        agent or person, and logs no values, so it
                        holds no private text.
description:            |
                        Sources: every command is registered on the
                        click group main (src/cctool/cli/group.py
                        within main). Strength: moderate; the code is
                        small, but the log answers only part of the
                        question.

