title:                  Logs, paired trials and a count of cctool runs
brief:                  |
                        Agent use of the graph tools is measured by
                        logs of cctool runs and of agent commands, and
                        by paired trials for efficacy. The count of
                        cctool runs is upheld too, as information to
                        aggregate and monitor over time. Reading
                        session transcripts is rejected, and so is the
                        log of runs and commands without trials. Ruled
                        by WTP on 2026-10-27.

