title:                  Logged lookups name new use cases
brief:                  |
                        The raw lookups an agent repeats are the
                        questions the tools do not yet answer well.
                        Grouped, they give a list of candidate queries
                        or commands, ranked by how often each is
                        asked. Without a log of shell commands, the
                        list has to be guessed.
description:            |
                        Sources: common raw lookups in the tally of
                        ann_query_tools_seldom_used_outside_their_building:
                        which files name an id, the whole entry of one
                        id in a register, the ids of one type, and the
                        lines around a field. Strength: moderate.

