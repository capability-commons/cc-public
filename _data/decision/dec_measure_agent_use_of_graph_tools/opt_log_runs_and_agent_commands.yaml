title:                  Log cctool runs and agent commands
brief:                  |
                        cctool logs its runs as in
                        opt_count_cctool_runs. A hook of the coding
                        agent also logs each shell command the agent
                        runs, so lookups and edits made with grep, sed
                        or python can be set beside the cctool runs.
                        Use, new use cases and proxies of efficacy are
                        all read from the two logs.

