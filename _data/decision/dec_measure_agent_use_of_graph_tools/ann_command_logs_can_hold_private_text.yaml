title:                  Command logs can hold private text
brief:                  |
                        A shell command line can hold paths, query
                        text, the prose of items and, by mistake,
                        secrets. Some trees are private. A log of
                        agent commands must stay local and out of git,
                        and should keep the command name and shape
                        rather than every argument, or keep arguments
                        only by choice.
description:            |
                        Sources: the private content repository
                        cc-dtu-pii sits beside cc-public under the
                        same folder on the owner's machine. Strength:
                        moderate.

