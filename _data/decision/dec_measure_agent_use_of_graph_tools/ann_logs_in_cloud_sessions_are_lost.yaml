title:                  Logs written in cloud sessions are lost
brief:                  |
                        Many sessions run cctool in a copy of the tree
                        in a cloud container that is thrown away when
                        the session ends. A log written beside that
                        copy goes with it. Logs last only if their
                        place can be set, for example by an
                        environment variable, to a folder that
                        outlives the session.
description:            |
                        Sources: in the tally of
                        ann_query_tools_seldom_used_outside_their_building,
                        382 of the 562 cctool runs were in cloud
                        containers, and the rest on the owner's
                        machine. Strength: strong for cloud sessions.

