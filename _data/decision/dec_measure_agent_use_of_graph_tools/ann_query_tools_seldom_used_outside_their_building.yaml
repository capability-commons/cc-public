title:                  Query tools seldom used outside their own building
brief:                  |
                        In a sample of agent sessions, cctool ran
                        often, but almost only for the steps the
                        commit procedure requires: check, batch,
                        format, message and history check. Queries ran
                        25 times, and nearly every run tested a query
                        feature while it was being built. Read-only
                        lookups with grep, sed and cat ran about 840
                        times.
description:            |
                        Sources: a tally of the newest parts of 10 of
                        the 29 project sessions, read from their
                        transcripts on 2026-10-25 and stopped early;
                        about 3,700 tool calls touched the repository.
                        cctool ran 562 times: check 157, batch 83,
                        message new 57, format 57, history check 50,
                        message check 31, serve 24, header 15, gate
                        14, set 13, query text 12, query sql 8, new 6,
                        impact 4, link 3, query datalog 1. No run of
                        query jq, query sparql or export was seen. All
                        serve runs and most query and impact runs were
                        in the sessions that built the review pages,
                        the text search and impact. Raw lookups: about
                        840 calls with grep (384), sed, cat, ls, find
                        or python over _data and the source; 57 edits
                        of YAML by sed or python; 31 python runs that
                        import cctool modules directly. Many of the
                        greps ask which files name an id, or show one
                        register entry. Strength: moderate as a sign
                        of the pattern, weak as a count; the sample is
                        partial and leans toward sessions that built
                        tools.

