title:                  Measure of agent use of the graph tools
brief:                  |
                        How do we learn how much coding agents use the
                        graph tools, which new uses would make the
                        tools worth more to them, and whether the use
                        makes their work better?
description:            |
                        The graph tools are the query commands of
                        cctool (text, sql, logic, jq, sparql,
                        predicates), impact, export and the review
                        pages of serve. The aim is to give agents more
                        power through the graph, so its use has to be
                        measured. The use is meant to follow from what
                        works best for the agent, not from guidance
                        that tells it to use the tools, so a count of
                        use alone is not enough: some measure of
                        efficacy, direct or proxy, is needed too.

