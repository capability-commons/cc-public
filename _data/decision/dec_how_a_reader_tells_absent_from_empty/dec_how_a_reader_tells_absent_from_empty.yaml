title:                  How a reader tells an absent message from an empty one
brief:                  |
                        A message with no items can mean that nothing
                        arrived, that a message was dropped on
                        overflow, that the sender was switched off, or
                        that it detected nothing. How does a reader
                        tell these apart?
description:            |
                        icd_dataflow_edge_message says a count of 0
                        means nothing arrived, and mentions an enable
                        flag that may be carried, with no field
                        defined. icd_dataflow_node treats a message
                        with no items as nothing arrived.
                        case_executor_fail_safe drops a message as an
                        empty one, and
                        opt_degraded_mode_through_a_mode_port has a
                        node switched off send an empty list. The
                        fail-safe ruling rests on
                        ann_truncated_obstacle_list_reads_as_free_space,
                        which warns that a dropped obstacle list read
                        as empty reads as free space. The fault
                        reaches only the control block, one local step
                        later (review of 2026-10-29, CC-061).

