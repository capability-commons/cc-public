title:                  Validity that every intermediate node must pass on to a safety reader
brief:                  |
                        A validity field protects the reader of a
                        safety port only if every node between the
                        place where the message went missing and that
                        reader passes the field on. The option says
                        only that the reader of a safety-relevant port
                        acts on it; a filter or fusion node that reads
                        an input marked absent and writes its own
                        output as valid and empty turns the absence
                        back into an empty scene. Under the
                        empty-as-unknown option an intermediate node
                        that receives no items writes none, and the
                        safety port fails safe with no rule for the
                        nodes in between. A rule that every output of
                        a node is marked invalid when one of its
                        inputs is would close the gap, but the option
                        does not state it.
description:            |
                        Sources:
                        - The validity option has the reader of a
                          safety-relevant port act on
                          the field in the same local step
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/opt_validity_flag_on_every_edge_message.yaml
                          at brief).
                        - The empty-as-unknown option has a safety
                          port's reader apply its
                          fail-safe to every empty message
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/opt_empty_read_as_unknown_on_safety_ports.yaml
                          at brief).
                        - In a Kahn network a node that filters,
                          emitting nothing when it has
                          nothing to say, makes conditionals replicate through the network
                          (Lohstroh et al. 2021, Toward a Lingua Franca for deterministic
                          concurrent systems, section 2.2, as summarized in
                          /mnt/project-files/notes/literature/part-2/2021-toward-a-lingua-franca-deterministic-concurrent-systems.md);
                          the note, not the paper, takes an empty bounded array as the
                          natural absent value of a Kahn edge.
                        - The engine does nothing a node could do
                          unless a recorded decision
                          shows otherwise, so a propagation rule kept in the engine would
                          need one
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief).
                        - Functional suitability asks whether each
                          function gives the right
                          result (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question).
                        ASSUMPTION: intermediate nodes write no items
                        when they read none; a tracker that predicts
                        from its state would not. Strength: moderate;
                        it falls away if the validity option gains a
                        propagation rule.

