title:                  Empty read as unknown on safety ports
brief:                  |
                        Edge messages stay as they are, and a port
                        that a safety requirement names declares that
                        an empty message means unknown. Its reader
                        applies its fail-safe to every empty message,
                        so "saw nothing" must be sent as an item that
                        says so.

