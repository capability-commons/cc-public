title:                  Saw-nothing item required of every producer of a safety port
brief:                  |
                        Under the empty-as-unknown option every
                        producer that feeds a safety port must send an
                        item that says it saw nothing, so its author
                        must know that a reader downstream is
                        safety-relevant, and a later change in which
                        ports are safety-relevant spreads back to the
                        producers. A producer that wraps third-party
                        code, such as an inference library that
                        returns an empty list, needs a wrapper to turn
                        that list into the item, and an update of the
                        library that changes its empty result passes
                        unnoticed. A node switched off by the ruled
                        degraded mode sends an empty list, which its
                        safety reader would then treat as unknown in
                        every degraded step. A validity field can be
                        written where absence arises, by the receiver,
                        the fail-safe or the mode switch, and leaves a
                        producer's empty list meaning what it says.
description:            |
                        Sources:
                        - Under the empty-as-unknown option "saw
                          nothing" must be sent as an
                          item that says so
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/opt_empty_read_as_unknown_on_safety_ports.yaml
                          at brief).
                        - A node that a mode switches off sends an
                          empty list
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief).
                        - The validity option marks a message valid,
                          absent, dropped or
                          disabled
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/opt_validity_flag_on_every_edge_message.yaml
                          at brief).
                        - Dependency risk asks what happens if
                          something taken from a third
                          party changes; maintainability asks how far a change in one part
                          spreads (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question and
                          entries.concern_maintainability.question).
                        ASSUMPTION: some producer of a safety port
                        wraps a third-party library, such as an object
                        detector on the Orin's inference runtime.
                        Strength: moderate; it grows with the number
                        of producers that feed safety ports.

