title:                  Cost of a validity word against per-input faults in control messages
brief:                  |
                        A validity field costs one word per message
                        and one comparison per read. The trial's
                        descriptor of a message already holds a 32-bit
                        word that is reserved and unused, so the field
                        would not grow it, though the transport frame,
                        today a bare count before the items, needs one
                        word more. Empty-as-unknown adds no field and
                        costs one item of capacity on each safety port
                        for the saw-nothing item. Faults in the
                        control message make its one fixed-size type
                        grow with the number of inputs in the unit,
                        written in every step. All three costs are
                        small; only the last grows with the graph.
description:            |
                        Sources:
                        - The trial's message descriptor holds the
                          items, the count, the
                          capacity, the item size and a reserved word that no code uses
                          (trial 2c777ab9, src/cctool/dataflow/engine/include/df/node.h,
                          struct df_array).
                        - The trial's TCP frame is a bare host-order
                          count followed by the
                          items (review of 2026-10-29, CC-016).
                        - The control message is a value of one type
                          of fixed size, written
                          once in each local step, and each node is given only the fields it
                          declares
                          (_data/interface_control_document/icd_dataflow_control_message.yaml
                          at surface.data.artifact.artifact.control_message.encoding;
                          _data/decision/dec_how_nodes_reach_runtime_services/ruling_services_in_a_control_message.yaml
                          at brief).
                        - Peak memory and throughput are measures of
                          performance efficiency
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure).
                        Strength: weak; every cost is a few bytes per
                        message or per step, and none decides the
                        question alone.

