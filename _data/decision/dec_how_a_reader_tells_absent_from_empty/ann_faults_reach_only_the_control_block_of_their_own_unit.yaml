title:                  Faults reported only to the control block of their own unit
brief:                  |
                        The engine reports a fault to the control
                        block of the unit where it happens. When the
                        producer of a safety port and its reader sit
                        in different units, an overflow at the
                        producer reaches the producer's control
                        message, not the reader's, and no record
                        carries events between units; only the
                        receiver in the reader's unit sees a sender
                        that went silent. Whether a reader can see its
                        input's fault would then change whenever a
                        node moves to another unit, which development
                        will do until the units are balanced. A
                        validity field, or an empty message read as
                        unknown, travels with the message through the
                        sender and the receiver, as an end-of-stream
                        token on the data channel does.
description:            |
                        Sources:
                        - Overflows and overruns are reported as an
                          event to the control
                          block of the execution unit
                          (_data/requirement/rqt_executor_reports_faults.yaml at object).
                        - The engine reports the events a replay needs
                          to the control block
                          of its own execution unit, as it does other readings
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml
                          at brief).
                        - Lowering puts a sender and a receiver on
                          every edge split by
                          placement (_data/requirement/rqt_lowering_inserts_transport.yaml
                          at object).
                        - Development will move nodes between units
                          until they are balanced
                          (WTP, 2026-10-28, as recorded in
                          _data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at description).
                        - An end-of-stream signal sent on a separate
                          channel gave wrong
                          output when delays changed the order of arrival, and the paper
                          notes this is avoided by carrying control tokens on the data
                          channel (Tretter et al. 2015,
                          Executing dataflow actors as Kahn processes, section 4.4, as
                          summarized in
                          /mnt/project-files/notes/literature/part-2/2015-executing-dataflow-actors-as-kahn-processes.md).
                        - Flexibility asks whether the design can be
                          scaled as the load
                          changes; reliability asks what happens when a part or an input is
                          faulty (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question and
                          entries.concern_reliability.question).
                        Strength: strong where safety ports cross
                        units; nil for a graph in one unit.

