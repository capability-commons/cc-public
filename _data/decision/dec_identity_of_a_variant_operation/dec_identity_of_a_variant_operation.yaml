title:                  Identity of a variant operation
brief:                  |
                        How is one variant operation of a dataflow
                        variant named, by a failure report, an origin
                        trace or another item?
description:            |
                        The scout found that a failure naming the
                        third operation of a variant addresses it by
                        position, which shifts as an edge position
                        does (_sources/four-decisions-argued.md line
                        800). The survey's origin trace wants an id
                        per operation (_sources/survey/README.md lines
                        45-48), and Spack gives each directive a
                        condition id (_sources/survey/product-lines.md
                        line 226).

