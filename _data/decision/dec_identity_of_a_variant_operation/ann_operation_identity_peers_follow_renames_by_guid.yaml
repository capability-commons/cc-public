title:                  Peer references to an operation followed through rename maps by guid
brief:                  |
                        A peer whose own dataflow variant builds on a
                        variant that a release publishes, and so names
                        an operation of it, follows renames through
                        the rename maps each release ships, which work
                        by guid. An operation named by an id with a
                        guid is covered by those maps as any other
                        item is; one named by a local key or by its
                        position has no guid for the peer's command to
                        follow, so a peer would need a second scheme,
                        or would break when the operation list
                        changes.
description:            |
                        Sources:
                        - Each release ships the renames it makes,
                          each as an old id, a new id and the guid,
                          and a command in the peer rewrites each
                          reference to the id its guid names.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          at brief)
                        - The id-with-guid option gives each variant
                          operation an id with a guid, as other items
                          do, so that rename maps cover it.
                          (_data/decision/dec_identity_of_a_variant_operation/opt_operation_named_by_id_with_guid.yaml
                          at brief)
                        - The local-key option names an operation by
                          the variant id and a key unique within the
                          variant, and the position option by the
                          variant id and its place in the list.
                          (_data/decision/dec_identity_of_a_variant_operation/opt_operation_named_by_a_local_key.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_variant_operation/opt_operation_named_by_position.yaml
                          at brief)
                        - Compatibility asks whether a partner can
                          read and use what the design produces, and
                          what a partner must adopt to do so.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question)
                          Assumption: a peer will build its own
                          dataflow variants on variants that a release
                          publishes; no peer does so yet. Strength:
                          moderate. It holds only once that happens,
                          and grows with the number of peers.

