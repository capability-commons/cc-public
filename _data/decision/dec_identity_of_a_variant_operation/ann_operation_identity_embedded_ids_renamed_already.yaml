title:                  Embedded ids that the rename command already handles
brief:                  |
                        Dataflow nodes are embedded items whose ids
                        are built from their holder's id, and the
                        rename command already renames them with their
                        holder, so an operation id with a guid built
                        the same way needs no new rename code. A key
                        within the variant needs a new uniqueness
                        check, a second naming scheme kept by hand,
                        though a name written as the variant id, a
                        period and the key is rewritten when the
                        variant is renamed.
description:            |
                        Sources:
                        - The rename command renames each item whose
                          id is made from the renamed item's id, as a
                          dataflow graph's nodes are.
                          (src/cctool/edit/edit.py)
                        - The whole-id pattern matches an id followed
                          by a period. (src/cctool/edit/edit.py within PATTERN_WHOLE_ID)
                        - The drafts hold 18 operations in six
                          variants. (count over the dfv drafts in
                          _sources/cc-patrol-notes/draft/) Strength:
                          moderate; the gain is a fixed saving in
                          code, and the guid costs two lines per
                          operation.

