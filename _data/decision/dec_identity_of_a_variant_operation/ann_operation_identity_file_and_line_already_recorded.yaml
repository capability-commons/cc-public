title:                  File and line, which the extractor already records
brief:                  |
                        Operations are stored in a variant's own YAML
                        file, and the extractor already records the
                        file and line of each element of a list, so a
                        failure or a trace can name an operation as
                        failures name edges today. Unlike an edge
                        position, an operation's position shifts only
                        when its own variant is edited, not when an
                        ancestor is, and no item references an
                        operation, while a local key adds a field and
                        a uniqueness check and an id with a guid adds
                        rename-map entries too.
description:            |
                        Sources:
                        - Each edge fact carries the file and line of
                          its list element.
                          (src/cctool/graph/extract.py within _dataflow_graph)
                        - A variant is stored, and its resolved graph
                          is not.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - Rename map entries are an old id, a new id
                          and a guid.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        - ASSUMPTION: no item will reference a single
                          operation until something such as a change
                          set needs to. Strength: moderate; it fails
                          once items start to reference operations,
                          for example from a ruling, a change set or a
                          declared order.

