title:                  An operation that can carry its reason as a node does
brief:                  |
                        A node carries an id, a guid and a brief, but
                        an operation carries none, so the drafts give
                        reasons for single operations in YAML comments
                        that the graph never sees. An operation with
                        an id and a guid can carry a brief, be the
                        target of an option or annotation, and survive
                        renames; a local key is stable but outside
                        rename maps; a position is neither.
description:            |
                        Sources:
                        - Reasons for single operations are YAML
                          comments.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          lines 22-23 and 47-48;
                          _sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 21-22)
                        - ASSUMPTION: the extractor makes no facts
                          from comments inside YAML items; it reads
                          comment headers only of non-YAML files.
                          (src/cctool/graph/extract.py lines 154-167)
                        - Nodes carry id_self and guid_self.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                          lines 48-49)
                        - Rename maps carry old id, new id and guid.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 13-17)
                        - The comparability check requires that the
                          resolved graphs of sibling options differ
                          only in the operations of the options, so
                          its report names operations.
                          (_data/decision/dec_comparability_of_runs_across_options/opt_comparability_check_over_sibling_runs.yaml,
                          brief) Strength: strong; operations
                          outnumber variants, and positions shift with
                          every inserted operation.

