title:                  Stored references to an operation that shift
brief:                  |
                        A failure report is read against the commit
                        that produced it, so a position is right
                        there. A position goes wrong in any record
                        that outlives the commit, such as an order
                        declared between two included deltas, an
                        annotation or a note that a change does not
                        affect a run: once an operation is inserted
                        above the one named, it names another
                        operation without any error. A key or a guid
                        keeps such references right, and only a guid
                        is followed by rename maps.
description:            |
                        Sources:
                        - A failure naming the third operation
                          addresses it by a position that shifts as an
                          edge position does.
                          (_data/decision/dec_identity_of_a_variant_operation/dec_identity_of_a_variant_operation.yaml,
                          description)
                        - Each failure says what is wrong and how to
                          fix it.
                          (_data/decision/dec_failure_report_form/ruling_failure_report_form.yaml
                          lines 12-15)
                        - A check is asked for operations from
                          different included deltas that touch one key
                          unless an order is declared between them.
                          (_sources/survey/product-lines.md line 323)
                        - An annotation citing a run stays stale until
                          someone records that the change does not
                          affect the measured property.
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_any_digest_change.yaml,
                          brief)
                        - Rename maps rewrite references by guid.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 12-18)
                        - ASSUMPTION: annotations and order
                          declarations will name single operations.
                          Strength: moderate; it grows with lasting
                          references to operations, which do not exist
                          yet.

