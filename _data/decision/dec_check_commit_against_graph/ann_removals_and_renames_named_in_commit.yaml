title:                  Every removal and rename named in its commit
brief:                  |
                        Under the graph check, an item cannot leave
                        the graph or change id unless the commit item
                        names it. A reviewer need not find removals in
                        the diff, and each one has a record of the
                        commit that made it. A title-only check lets
                        an item vanish unnamed.
description:            |
                        src/cctool/commit/change.lp within
                        unannounced_removal and unannounced_rename.
                        Mentions come from the title, brief and
                        description of the commit item
                        (src/cctool/commit/change.py within is_commit
                        and facts_of). The title-only check reads one
                        regular expression
                        (_data/schema/sch_commit.yaml at
                        allOf.3.properties.title.pattern) and nothing
                        of the graph. cctool history check reruns the
                        check on commits made without hooks
                        (src/cctool/commit/history.py, commit
                        18d6181). Proposed by the reviewability and
                        traceability advocates.

