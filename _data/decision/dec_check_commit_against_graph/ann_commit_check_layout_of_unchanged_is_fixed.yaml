title:                  Layout of unchanged files dropped from the check
brief:                  |
                        Commit 5acf7c2 "Change the commit check so
                        that it lays out only files that differ" adds
                        the byte-equality prefilter the annotation
                        proposed. At 360ec14 the layout part of the
                        cost follows the change; the extraction of
                        both whole graphs still follows the tree.
description:            |
                        src/cc_public/commit/change.py lines 129-146
                        at 360ec14 lay out only files whose bytes
                        differ; lines 115-116 still extract both trees
                        whole, and copy_commit and copy_staged still
                        write whole trees. Not re-measured at 360ec14.

