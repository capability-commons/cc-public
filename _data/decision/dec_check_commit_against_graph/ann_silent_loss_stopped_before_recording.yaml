title:                  Silent loss stopped before it is recorded
brief:                  |
                        The commit-msg hook stops a commit that drops
                        or renames an item unannounced before anything
                        is recorded, so recovery is a reword or an
                        unstage, not a history rewrite.
description:            |
                        The commit-msg hook runs the check and a
                        failure stops the commit
                        (.githooks/commit-msg, last line; README.md
                        lines 45-49). The pre-push hook runs the same
                        check on every commit a push would send
                        (src/cc_public/commit/history.py lines 19-31;
                        .githooks/pre-push). A renamed register entry
                        keeps its old id in alias "so that references
                        by the old id can be found and resolved"
                        (src/cc_public/commit/change.lp lines 149-150,
                        written in 7520f91).

