title:                  Unparsable files now kept by the extractor
brief:                  |
                        ann_commit_check_adds_parts_that_can_refuse
                        says extract.py turns no YAML or Python parse
                        error into an error the message check catches,
                        its only except clause being for
                        UnicodeDecodeError. The extractor now catches
                        parse errors and keeps the file as unreadable.
description:            |
                        src/cctool/graph/extract.py raises ErrorRead
                        for a Python syntax error (lines 1092-1096)
                        and for a YAML error (lines 1132-1138), and
                        documents catches ErrorRead and keeps an
                        Unreadable in place of the document (lines
                        459-462). So a file that does not parse no
                        longer raises out of extraction. Found in the
                        review of 2026-10-22.

