title:                  Old register ids kept resolvable after a rename
brief:                  |
                        A renamed register entry must carry its old id
                        as an alias, and the checks resolve an old id
                        through it while asking that it be brought up
                        to date, so a link made before a rename still
                        finds its item. The rule covers register
                        entries only.
description:            |
                        rename_without_alias, condition
                        register_entry_key
                        (src/cctool/commit/change.lp within
                        rename_without_alias). dangling_reference and
                        dangling_mention accept an alias
                        (src/cctool/check/check.lp within
                        dangling_reference and dangling_mention), and
                        outdated_reference and outdated_mention fail a
                        reference or mention by an old id (lines
                        2035-2045, 2081-2085). alias is defined only
                        in _data/schema/sch_register_entry.yaml at
                        properties.alias. ASSUMPTION: a renamed item
                        that is a whole file has no field for its old
                        id, so references to it from outside the tree,
                        such as old commit text, cannot be resolved.

