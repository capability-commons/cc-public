title:                  Old register ids kept resolvable after a rename
brief:                  |
                        A renamed register entry must carry its old id
                        as an alias, and the checks resolve references
                        through aliases, so a link made before a
                        rename still finds its item. The rule covers
                        register entries only.
description:            |
                        rename_without_alias, condition Holder != ""
                        (src/cc_public/commit/change.lp lines
                        159-165). dangling_reference and
                        dangling_mention accept an alias
                        (src/cc_public/check/check.lp lines 236-239,
                        466-472). alias is defined only in
                        _data/schema/sch_register_entry.yaml line 68.
                        ASSUMPTION: a renamed item that is a whole
                        file has no field for its old id, so
                        references to it from outside the tree, such
                        as old commit text, cannot be resolved.

