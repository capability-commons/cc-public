title:                  Commit checked against the graph before and after
brief:                  |
                        Each commit is checked against the graph
                        before and after it, so nothing is removed,
                        renamed or retyped without the commit saying
                        so, and a title that says Add, Remove, Rename,
                        Move or Reformat is true of the change. A
                        check of the message alone sees none of this,
                        and as built it also reads the whole tree, so
                        it would save little time. The cost on a large
                        tree comes from how the check is built and is
                        fixed there. Ruled by WTP on 2026-10-23.

