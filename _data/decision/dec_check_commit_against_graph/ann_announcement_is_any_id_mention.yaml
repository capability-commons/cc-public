title:                  Announcement as any mention of an id
brief:                  |
                        A removal or rename counts as announced when
                        its id appears anywhere in the title, brief or
                        description, not when the message says what
                        happened to it or links it with a role.
description:            |
                        src/cctool/commit/change.py within facts_of;
                        src/cctool/commit/change.lp within
                        unannounced_removal and unannounced_rename.
                        Proposed by the reviewability and traceability
                        advocates.

