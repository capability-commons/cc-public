title:                  Commit check cost set by tree size, not change size
brief:                  |
                        The graph check extracts both whole graphs and
                        lays out every file in both trees on every
                        commit, even when one file changes, so its
                        cost grows with the tree and not with the
                        change.
description:            |
                        facts_of extracts the whole tree after and
                        before (src/cc_public/commit/change.py lines
                        115-116). _changed lays out every file of both
                        trees with no byte comparison first (change.py
                        lines 136-141, 157-159). copy_commit and
                        copy_staged write whole trees
                        (src/cc_public/gate/gate.py lines 167-203).
                        The commit-msg hook runs the check on every
                        commit, merges and reverts included
                        (.githooks/commit-msg, last line;
                        memory/MEMORY.md line 46). Measured 2026-10-15
                        in a 4-CPU session container at 89c74d8, one
                        to three runs: _changed takes 2.3 to 2.7 s of
                        a 6.7 s message check; 123 of 128 files are
                        byte-identical, and laying out only the other
                        5 takes 0.29 s with the same result.
                        ASSUMPTION: time is close to linear in files,
                        so a tenfold tree gives about a minute per
                        commit. The cost lies in how the check is
                        built, not in checking the graph; a
                        byte-equality prefilter keeps the answers.
                        Proposed by the performance efficiency
                        advocate.

