title:                  Most commit verbs unchecked against the graph
brief:                  |
                        Change, Fix, Split, Merge and Lock are not
                        checked against the graph, and they head 15 of
                        the 33 commits, so for those the reviewer gets
                        little more than a syntax-only check gives.
description:            |
                        Unchecked verbs: commit 7520f91, description.
                        Titles: git log --format=%s at 89c74d8 gives
                        18 Add, 10 Change, 4 Fix, 1 Split. Commit
                        e3a2b5c is titled Change yet renames an
                        annotation from its souffle id to its clingo
                        id. The proposal suggested a rule to flag a
                        Change that is a pure addition, removal or
                        rename (project note
                        notes/commit-title-templates.md lines 43-46);
                        change.lp has none. ASSUMPTION: the share of
                        Change and Fix rises as more commits modify
                        existing items.

