title:                  Full history check growing with commits times tree size
brief:                  |
                        history check with no range reruns the graph
                        check on every commit against whole-tree
                        copies, so its time grows with commits times
                        tree size. It takes about two minutes for 33
                        commits.
description:            |
                        With no range, history check checks the whole
                        history (src/cc_public/cli/auditing.py lines
                        77-78, 92). Each commit and its parent are
                        copied whole and passed to check_trees
                        (src/cc_public/commit/history.py lines
                        107-121). Measured 2026-10-15 in a 4-CPU
                        session container at 89c74d8: 33 commits in 1
                        min 59 s to 2 min 25 s over two runs (about 1
                        min 15 s of CPU); five sampled commits took
                        3.0 to 4.8 s each. The pre-push hook checks
                        only commits the remote lacks (history.py
                        lines 72-93), so pushes are not affected. A
                        device tool call dies at 180 s
                        (memory/MEMORY.md line 45). ASSUMPTION:
                        tenfold files and tenfold commits make a full
                        run about a hundred times longer. As built,
                        the message check alone copies each commit's
                        tree and reads every YAML document in it to
                        find sch_commit (history.py lines 112-116;
                        message.py lines 260-265), so a syntax-only
                        history check grows the same way at a smaller
                        cost per commit (0.75 s measured for the
                        syntax part). Proposed by the performance
                        efficiency advocate.

