title:                  Full history check growing with commits times tree size
brief:                  |
                        history check with no range reruns the graph
                        check on every commit against whole-tree
                        copies, so its time grows with commits times
                        tree size. It took about two minutes for 33
                        commits on 2026-10-15, and a commit now takes
                        5 s or more.
description:            |
                        With no range, history check checks the whole
                        history (src/cctool/cli/auditing.py lines
                        80-81, 95). Each commit and its parent are
                        copied whole and passed to check_trees
                        (src/cctool/commit/history.py lines 114-133).
                        Measured 2026-10-15 in a 4-CPU session
                        container at 89c74d8: 33 commits in 1 min 59 s
                        to 2 min 25 s over two runs; five sampled
                        commits took 3.0 to 4.8 s each. After f33413ad
                        the history check took about 5 s a commit on
                        WTP's 2-CPU VM (notes of 2026-10-22 on gate
                        speed). On the tree of 2273 files, measured
                        2026-10-23 in a 4-CPU container under load,
                        the first commit of a run took 21 to 35 s and
                        each further one 9 to 10 s. The pre-push hook
                        checks only commits the remote lacks
                        (history.py lines 81-102). A device tool call
                        dies at 180 s (memory/MEMORY.md line 45).
                        ASSUMPTION: tenfold files and tenfold commits
                        make a full run about a hundred times longer.
                        As built, the message check alone copies each
                        commit's tree and reads every YAML document in
                        it to find sch_commit (history.py lines
                        116-125; src/cctool/commit/message.py lines
                        274-278), so a syntax-only history check grows
                        the same way at a smaller cost per commit
                        (0.75 s measured for the syntax part).
                        Proposed by the performance efficiency
                        advocate.

