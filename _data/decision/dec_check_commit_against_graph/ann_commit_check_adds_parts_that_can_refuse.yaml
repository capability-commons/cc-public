title:                  More parts that can stop a commit
brief:                  |
                        The graph check puts both graphs, the layout
                        printer and the rule evaluator on the path of
                        every commit, so a fault in any of them stops
                        all commits. A title-only check depends on the
                        message parser alone.
description:            |
                        src/cc_public/commit/change.py lines 66-74,
                        85-86, 129-160. The evaluator changed to
                        clingo in 6230e98, after the check was added.
                        message check catches only ErrorGate and
                        ErrorLogic (src/cc_public/cli/messaging.py
                        lines 101-105), and extract.py turns no YAML
                        or Python parse error into either (its only
                        except clause, line 348, is for
                        UnicodeDecodeError). A revert of a rename was
                        refused within three hours of the check being
                        added (a0a519f, after 7520f91). ASSUMPTION
                        (from the code, not run): a file at HEAD that
                        does not parse makes every later commit fail
                        the hook until --no-verify is used, which
                        AGENTS.md line 14 forbids to agents. The cost
                        is lost time, not lost data.

