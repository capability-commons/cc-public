title:                  Changes traced to a commit but not to a reason
brief:                  |
                        No rule ties a commit to the need, decision or
                        option that called for it, and commits are not
                        read into the graph, so the graph cannot say
                        why an item was removed or changed.
description:            |
                        sch_commit allows relation edges
                        (_data/schema/sch_commit.yaml lines 19-20,
                        43), but all 33 commits carry relation: []
                        (git log --format=%B). change.lp has no rule
                        over commit relations; its commit inputs are
                        commit_verb, commit_mention and content_change
                        (change.py lines 119-123). The rule "Option
                        status changes only in a commit that names the
                        option" was recorded and not built
                        (memory/commit-triples.md). extract.py does
                        not read git log. Will deferred graph history:
                        "something for later, not for now" (owner's
                        statement, 2026-10-14T12:39:46Z). The
                        title-only check does less here.

