title:                  Changes traced to a commit but not to a reason
brief:                  |
                        No rule ties a commit to the need, decision or
                        option that called for it, and commits are not
                        read into the graph, so the graph cannot say
                        why an item was removed or changed.
description:            |
                        sch_commit allows edges
                        (_data/schema/sch_commit.yaml at description
                        and allOf.2.$ref), but all 50 commits carry an
                        empty edge list, 33 written relation: []
                        before the field was renamed edge and 17
                        written edge: [] (git log --format=%B).
                        change.lp has no rule over the edges of a
                        commit; its commit inputs are commit_verb,
                        commit_mention and content_change (change.py
                        within facts_of). The rule "Option status
                        changes only in a commit that names the
                        option" was recorded and not built
                        (memory/commit-triples.md). extract.py does
                        not read git log. WTP deferred graph history:
                        "something for later, not for now"
                        (maintainer's statement, 2026-10-14). The
                        title-only check does less here.

