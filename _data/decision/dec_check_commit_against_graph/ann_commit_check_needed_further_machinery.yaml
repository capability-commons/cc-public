title:                  Further machinery and an exception for the check
brief:                  |
                        The graph check has already needed a drafting
                        step for merge and revert messages and an
                        exception for reverts in its rename rule.
description:            |
                        prepare-commit-msg drafting names each removed
                        or renamed item "as the check of the commit
                        requires" and runs the check to find them
                        (src/cctool/commit/message.py within draft),
                        added in 4e6db4c (330 lines, 8 files).
                        rename_without_alias exempts Revert and
                        Reapply since a0a519f (change.lp within
                        rename_without_alias). The approach that a
                        rule which keeps needing exceptions is fixed
                        in the rule, not with more machinery, was the
                        assistant's proposal (session transcript,
                        2026-10-14), approved by WTP ("OK. This feels
                        like the wiser choice. Go ahead on that.").
                        That proposal named the revert exemption as
                        such a fix (memory/enforcement-approach.md).
                        ASSUMPTION: more verb exceptions follow; only
                        one has occurred so far.

