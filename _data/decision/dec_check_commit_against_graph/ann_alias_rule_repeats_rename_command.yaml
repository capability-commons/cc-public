title:                  Alias rule repeating the rename command
brief:                  |
                        cctool rename already adds the old id to a
                        register entry's alias list, and
                        rename_without_alias checks the same thing, so
                        one job is done by two mechanisms.
description:            |
                        src/cc_public/edit/edit.py lines 722-768
                        (added in afbcf6f);
                        src/cc_public/commit/change.lp lines 159-165.
                        The rule also covers a rename made without
                        cctool rename, such as a hand edit, which the
                        command cannot.

