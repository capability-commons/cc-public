title:                  Title-only check with no new mechanism
brief:                  |
                        Checking only the title uses the template
                        check that already exists and adds nothing,
                        though it cannot see removals, renames or
                        retyped guids.
description:            |
                        src/cc_public/commit/message.py lines 24-28;
                        _data/schema/sch_commit.yaml line 50. The
                        commit-msg path runs the template check first
                        (src/cc_public/cli/messaging.py lines 85-110).
                        The graph rules need the graph before the
                        commit (change.lp lines 104-221).

