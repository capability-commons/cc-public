title:                  Title verb checked against the change
brief:                  |
                        A title that says Add, Remove, Rename, Move or
                        Reformat is checked against what the change
                        does, so a reviewer can read it as a true
                        summary. A syntax-only check says only that
                        the title is well formed.
description:            |
                        verb_contradicted and reformat_changes_content
                        in src/cc_public/commit/change.lp (lines
                        167-221). The syntax-only stage checks the
                        title by regular expression
                        (notes/commit-title-templates.md lines 53-54,
                        a project note outside the repository).
                        AGENTS.md lines 89-93 ask that each change be
                        small enough to read in one sitting.

