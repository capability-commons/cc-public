title:                  Old commits judged by current rules
brief:                  |
                        history check reads each commit's message by
                        the schema in that commit, but its change by
                        the rules of the installed tool, so tightening
                        a rule can fail commits that passed when made.
                        Fixing that means rewriting history.
description:            |
                        src/cc_public/commit/history.py lines 23-24,
                        116 (message by its own sch_commit) and line
                        121; change.py lines 51, 86 (RULES beside the
                        installed module). With no range, history
                        check checks the whole history
                        (src/cc_public/cli/auditing.py lines 77-78,
                        92). change.lp changed twice on the day it was
                        added (a0a519f, 6230e98). The pre-push hook
                        checks only commits the remote lacks
                        (history.py lines 72-93), so the push path is
                        not affected.

