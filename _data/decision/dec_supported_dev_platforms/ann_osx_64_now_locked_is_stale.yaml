title:                  Pixi environment now locked for three platforms
brief:                  |
                        The annotation says the pixi environment is
                        locked to linux-64 and osx-arm64. Now it is
                        locked for osx-64 as well. Windows is still
                        not listed, so the point about Windows
                        partners stands.
description:            |
                        pyproject.toml at
                        tool.pixi.workspace.platforms: platforms =
                        ["osx-arm64", "osx-64", "linux-64"]. No win-64
                        entry is listed. Found in the review of
                        2026-10-22.

