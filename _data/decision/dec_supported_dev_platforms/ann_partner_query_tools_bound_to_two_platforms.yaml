title:                  Partner tooling bound to two platforms
brief:                  |
                        A partner can read the YAML items anywhere,
                        but to query or check the graph a partner must
                        run cctool in a pixi environment locked to
                        linux-64 and osx-arm64.
description:            |
                        Data items are YAML under _data/. Queries go
                        through cctool query (AGENTS.md lines 65-71).
                        pixi platforms are osx-arm64 and linux-64
                        (pyproject.toml line 52). The environment
                        includes clingo (README.md lines 32-34).
                        ASSUMPTION: some partner who would query the
                        graph works on Windows. No source names one;
                        with no such partner the point costs nothing.
                        The point grows with the graph, since a larger
                        graph is less usable by reading files alone.

