title:                  Intel Macs now declared and qualified
brief:                  |
                        The annotation says the pixi workspace omits
                        osx-64 and the README says macOS without
                        qualification. Now pyproject.toml lists
                        osx-64, and the README says Intel Macs are
                        locked but not tested.
description:            |
                        pyproject.toml line 59: platforms =
                        ["osx-arm64", "osx-64", "linux-64"]. README.md
                        lines 47-50: "Development is supported on
                        Linux and on macOS with Apple silicon. The
                        environment is also locked for Intel Macs, but
                        it is not tested there, so that platform is
                        unsupported". Found in the review of
                        2026-10-22.

