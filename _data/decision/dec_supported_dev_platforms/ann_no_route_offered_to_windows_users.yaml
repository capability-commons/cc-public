title:                  No route offered to a Windows user
brief:                  |
                        The statement says what does not work but not
                        what to do instead, so a Windows user must
                        work out alone whether WSL or a Linux VM will
                        do.
description:            |
                        README.md#getting-started name Linux and macOS
                        and give no route for Windows. AGENTS.md and
                        the skill under .agents/skills do not mention
                        Windows, WSL or platform (grep). WSL runs a
                        Linux distribution with a filesystem that
                        supports symbolic links
                        (https://learn.microsoft.com/en-us/windows/wsl/about).
                        ASSUMPTION: a clone inside the WSL filesystem
                        with pixi installed there meets the linux-64
                        platform and the POSIX shell; not tried in
                        this project. This challenges the wording of
                        the chosen option, not its scope.

