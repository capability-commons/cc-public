title:                  Linux on ARM outside the declared platforms
brief:                  |
                        The chosen option says Linux, but the pixi
                        workspace locks only x86-64 Linux, so ARM
                        servers and arm64 Linux VMs or containers on
                        Apple silicon Macs cannot install the
                        environment.
description:            |
                        pyproject.toml at project.dependencies lists
                        osx-arm64 and linux-64.
                        README.md#getting-started says Linux and macOS
                        with no architecture. The pixi dependencies
                        are clingo, python, pytest and ruff from
                        conda-forge (pyproject.toml at
                        project.scripts.cctool, tool.pixi.workspace
                        and tool.pixi.pypi-dependencies), and the
                        editable install of the package brings click,
                        jsonschema and ruamel.yaml from PyPI
                        (pyproject.toml at project). conda-forge
                        publishes clingo 5.8.2 for linux-aarch64
                        (https://prefix.dev/channels/conda-forge/packages/clingo).
                        ASSUMPTION: conda-forge also has python 3.12
                        or later, pytest 9 and ruff 0.16, and PyPI has
                        the three packages and their dependencies, for
                        linux-aarch64; not checked package by package.
                        pixi workspace platform add adds a platform
                        and updates the lock file
                        (https://pixi.prefix.dev/latest/reference/cli/pixi/workspace/platform/add/).
                        ASSUMPTION: a Linux VM or container on an
                        Apple silicon Mac runs arm64 Linux unless it
                        emulates x86-64. WTP plans much larger graphs
                        (memory/MEMORY.md line 21, recording WTP on
                        2026-10-13); ASSUMPTION: checks on a larger
                        graph are more likely to run on a hosted
                        machine, and many hosted Linux machines are
                        ARM. The fix is likely one command and a
                        relock, so this challenges the platform list
                        and wording more than leaving out Windows.

