title:                  POSIX shell assumed only by the hooks
brief:                  |
                        Only the five git hooks need a shell, each for
                        one exec line, and Git for Windows runs a
                        /bin/sh hook through its own bash, so the
                        POSIX shell half of the reason is narrower
                        than it reads.
description:            |
                        README.md line 30 says the tools assume a
                        POSIX shell (assistant-written, commit
                        a60b8d9). The hooks are one exec pixi run
                        --frozen line each (.githooks/*, lines 28-33).
                        The pixi tasks and the Python subprocess calls
                        use no shell syntax (pyproject.toml lines
                        63-68; no shell=True in src). Git for Windows
                        runs a hook that starts with #!/bin/sh through
                        its bundled bash
                        (https://til.jakelazaroff.com/git/add-a-git-hook-on-windows/;
                        a personal note, not Git for Windows
                        documentation, so this premise is weaker than
                        it reads). This does not show Windows works:
                        exec, path handling in pixi run and the test
                        suite are untested there.

