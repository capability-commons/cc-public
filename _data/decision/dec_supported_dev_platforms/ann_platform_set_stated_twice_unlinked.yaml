title:                  Two unlinked statements of the platform set
brief:                  |
                        The supported platforms are stated as prose in
                        README.md and as the pixi platform list in
                        pyproject.toml, and nothing ties the two, so a
                        change to one does not prompt a change to the
                        other.
description:            |
                        README.md lines 28-30; pyproject.toml line 52.
                        AGENTS.md does not mention platform, Windows,
                        Linux, macOS or shell (grep). The decision was
                        recorded by one README commit of four added
                        lines (a60b8d9, pre-squash; maintainer's
                        statement 2026-10-14). lco_project_guidance
                        names supported platforms in its brief. This
                        challenges how the chosen option was recorded,
                        not the choice itself.

