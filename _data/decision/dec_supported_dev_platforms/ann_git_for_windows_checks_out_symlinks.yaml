title:                  Symbolic links on Windows as a setup step
brief:                  |
                        Git for Windows can check out symbolic links
                        when symlink support is turned on, so a link
                        is a setup step on Windows, not a block.
description:            |
                        Git for Windows supports links with
                        core.symlinks=true on NTFS or ReFS. It needs
                        SeCreateSymbolicLinkPrivilege or Developer
                        Mode on Windows 10 version 1703 or later, and
                        turns support on by default only in that case
                        (https://gitforwindows.org/symbolic-links).
                        Otherwise git checks a link out as a small
                        plain file holding the link text
                        (https://git-scm.com/docs/git-config,
                        core.symlinks). This does not test the POSIX
                        shell half of the reason.

