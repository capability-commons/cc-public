title:                  Datalog engine no longer tied to Unix
brief:                  |
                        When the decision was taken the checker called
                        Souffle, which has weak Windows support. The
                        checker now uses clingo from pixi, which has
                        Windows builds, so that constraint is gone.
description:            |
                        At commit a60b8d9 (2026-10-14T10:12:03Z)
                        README.md said Datalog is evaluated by Souffle
                        from the PATH or the SOUFFLE variable. A
                        Souffle-based project ships a Windows Souffle
                        binary but says users may have better luck on
                        Mac, Linux, a VM or WSL
                        (https://ctadl.readthedocs.io/en/stable/windows.html).
                        clingo joined the pixi environment at commit
                        5665ace (2026-10-14T22:49:57Z); the checks
                        moved to it at 6230e98. pyproject.toml lines
                        50-58 take clingo from conda-forge. The
                        potassco channel publishes clingo for win-64
                        (https://anaconda.org/potassco/clingo).
                        ASSUMPTION: conda-forge also publishes clingo
                        5.8 for win-64; prefix.dev lists win-64 among
                        its conda-forge clingo subdirs, but no win-64
                        build of 5.8.2 was seen. The owner never gave
                        Souffle as a reason, and the /bin/sh hooks
                        keep a shell assumption, so the point is weak.

