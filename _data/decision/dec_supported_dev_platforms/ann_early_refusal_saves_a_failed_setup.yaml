title:                  Early refusal instead of silent breakage
brief:                  |
                        A plain statement at the start of Getting
                        started tells a Windows user before any
                        install step that setup will not work, which
                        saves a failed setup and a clone that only
                        looks right.
description:            |
                        README.md#what-is-here and
                        README.md#getting-started put the statement
                        before the first command. Git for Windows
                        checks a link out as a plain text file unless
                        symlink support is on
                        (https://github.com/git-for-windows/git/wiki/Symbolic-Links).
                        ASSUMPTION: pixi refuses to install on a
                        platform the workspace does not list, so a
                        Windows user would otherwise see an error only
                        at pixi install. The cost is one sentence and
                        does not grow with the graph.

