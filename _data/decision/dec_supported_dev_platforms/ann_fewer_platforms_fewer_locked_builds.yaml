title:                  Fewer locked builds to track
brief:                  |
                        Every third-party package must exist and keep
                        being built for each listed platform, so
                        adding Windows adds a third set of builds that
                        can lag, break or be withdrawn on its own.
description:            |
                        pyproject.toml at
                        tool.pixi.workspace.platforms lists osx-arm64
                        and linux-64. pixi.lock resolves a package
                        list per platform (linux-64 at line 11,
                        osx-arm64 at line 56). ASSUMPTION: a package
                        missing for one listed platform fails the
                        solve for the whole environment; from general
                        pixi behavior, not checked. Windows support
                        also adds Git for Windows symlink settings to
                        what the project depends on
                        (https://gitforwindows.org/symbolic-links).
                        The point grows with the tooling's
                        dependencies.

