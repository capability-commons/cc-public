title:                  Symlink reason resting on one convenience link
brief:                  |
                        The symbolic link half of the stated reason
                        rests on one link that bridges the skill paths
                        of two agent vendors, so it lapses if that
                        link goes or either vendor changes its path.
description:            |
                        The working tree holds exactly one symbolic
                        link, .claude/skills -> ../.agents/skills
                        (find . -type l; git ls-files -s, mode
                        120000). It was added in commit 7f3412f
                        because Claude Code reads only .claude/skills
                        (memory/MEMORY.md line 38). The owner asked
                        "Do you still need the link from .claude to
                        .agents/skills?" (owner's statement
                        2026-10-14T10:10:08Z). Without the link a
                        Windows user loses only skill discovery in
                        Claude Code. No check ties the README sentence
                        to the link, so the reason can go stale
                        unseen. The POSIX shell half, the /bin/sh
                        hooks in .githooks/, is not affected.

