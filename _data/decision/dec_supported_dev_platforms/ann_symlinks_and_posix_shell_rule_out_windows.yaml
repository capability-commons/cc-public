title:                  Windows ruled out by symbolic links and a POSIX shell
brief:                  |
                        The repository holds symbolic links and the
                        tools assume a POSIX shell, so Windows is not
                        supported for development.
description:            |
                        Maintainer's statements: "Can git store
                        symbolic links?" (2026-10-14T10:11:03Z), then
                        "Let's add a note to our documentation to say
                        Windows is not supported as a development
                        environment" (2026-10-14T10:11:55Z). Will gave
                        no reason in his own words; the reason as
                        worded here is the assistant's, in README.md
                        lines 28-30, added in commit a60b8d9
                        (pre-squash, co-authored by Claude). The POSIX
                        shell half does not appear in Will's messages.
                        The link is .claude/skills, pointing to
                        ../.agents/skills. The five git hooks in
                        .githooks/ are /bin/sh scripts.

