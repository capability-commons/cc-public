title:                  Partner referents that need resolving
brief:                  |
                        Most subjects and process words belong to a
                        project or partner. An edge to them needs
                        references that resolve across repositories,
                        which the checker cannot do yet. A string
                        needs nothing.
description:            |
                        dangling_reference fails any reference that
                        names no item in the tree being checked. Until
                        references across instances are built
                        (dec_references_across_instances), a
                        requirement on a partner item cannot be
                        checked in cc-public.

