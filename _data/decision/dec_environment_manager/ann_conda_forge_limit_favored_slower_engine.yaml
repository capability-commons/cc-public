title:                  Channel limit steering toward the slower engine
brief:                  |
                        Taking every tool from conda-forge left
                        Souffle out, and the move to clingo that
                        followed, partly because pixi can pin it, made
                        the checks slower at the current size.
description:            |
                        pyproject.toml at project.scripts.cctool lists
                        only conda-forge.
                        ruling_cross_item_checks_engine brief: "move
                        to clingo, which pixi can pin". One evaluation
                        took about 0.12 s with clingo and 0.07 s with
                        Souffle; the serial test suite took 2m47s
                        against 2m25s
                        (ann_clingo_is_slower_at_this_size). WTP gave
                        graph size, not packaging, as the main reason
                        for clingo (2026-10-14), and a 2025 comparison
                        does not show Souffle faster at scale
                        (ann_benchmarks_do_not_favor_souffle).
                        ASSUMPTION: pixi could take Souffle from a
                        second channel or a source build; not checked.

