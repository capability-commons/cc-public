title:                  One manifest for every tool
brief:                  |
                        Under pixi one file and its lock declare
                        Python, the libraries, the linter, the test
                        runner and the rule engine, so a tool change
                        touches two files. A tool on the PATH needs
                        its own setup steps, kept outside the
                        repository.
description:            |
                        pyproject.toml lines 39-41 and 57-61 declare
                        every dependency; pixi.lock pins them and is
                        committed (.gitignore line 71, commit
                        e232fb3). Adding clingo changed one line of
                        pyproject.toml and 134 lines of pixi.lock (git
                        show --stat 5665ace). README.md lines 32-36
                        give one install command. While Souffle sat
                        outside pixi it needed a hand-copied binary in
                        a gitignored _tools folder, a libffi.so.7 from
                        Ubuntu 20.04, LD_LIBRARY_PATH and a SOUFFLE
                        variable read in three places
                        (memory/MEMORY.md line 21;
                        ann_souffle_is_outside_the_locked_environment).
                        ASSUMPTION: future tools are on conda-forge or
                        PyPI; each tool on neither brings a PATH setup
                        back.

