title:                  Small run-time cost of the pixi wrapper
brief:                  |
                        Running each hook and task through pixi run
                        --frozen adds about 50 ms to a bare call and
                        0.2 s to 0.4 s to cctool check, below one
                        percent of a gated commit.
description:            |
                        Measured by the advocate on 2026-10-15 with
                        pixi 0.82.0 on a scratch clone at 89c74d8:
                        pixi run --frozen true took 0.041 s to 0.061
                        s; cctool check took 2.88 s direct and 3.09 s
                        to 3.26 s through pixi. The gate takes about
                        75 s per commit (memory/MEMORY.md lines 39 and
                        54). ASSUMPTION: the cost is fixed per call,
                        so it shrinks in relative terms as the graph
                        grows; the larger gap on cctool check was not
                        explained.

