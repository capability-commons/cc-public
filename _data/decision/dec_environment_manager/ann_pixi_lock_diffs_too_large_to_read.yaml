title:                  Lock diffs too large to read
brief:                  |
                        Each environment change also commits a
                        machine-written pixi.lock diff of tens to
                        hundreds of lines, mostly URLs and hashes,
                        which adds to the review volume but gives a
                        reviewer nothing to judge by reading.
description:            |
                        Apart from the squash commit 7dda99e, the
                        commits that changed pixi.lock changed 607,
                        117, 24, 71 and 134 lines of it, about 950 in
                        all; the last came with a 1-line manifest
                        change (git show --stat e232fb3, 21c315c,
                        afac39c, c464728, 5665ace). pixi install
                        writes the lock, and WTP ran it (2026-10-13).
                        The lock has since grown to 2767 lines. There
                        is no .gitattributes, so the lock is not
                        marked as generated in diffs. WTP calls the
                        review burden "huge (and practically
                        impossible)" when accepting reviewability for
                        lco_tooling (will-messages.md line 786); see
                        also memory/cc-public-design-principles.md
                        line 11. Mitigation: four of the five commits
                        touch pixi.lock only, so a reviewer can skip
                        them. ASSUMPTION: the lock can be trusted by
                        checking it came from the reviewed manifest.
                        The hooks now run pixi run --locked, which
                        refuses a lock that does not match the
                        manifest (.githooks/pre-commit line 30; see
                        ann_hooks_run_with_locked_is_stale). The point
                        grows with the tooling, not the graph.

