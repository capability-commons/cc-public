title:                  Hooks and guidance bound to pixi
brief:                  |
                        Every hook runs through pixi, and the guidance
                        and code name it, so a host without pixi
                        cannot commit, and replacing pixi touches many
                        parts.
description:            |
                        All five hooks exec "pixi run --locked ..."
                        (.githooks/*), and git aborts a commit when
                        pre-commit fails
                        (https://git-scm.com/docs/githooks). pixi is
                        named in README.md lines 54-64, AGENTS.md
                        lines 36-43 and 75,
                        .agents/skills/editing-data-items/SKILL.md
                        line 30 and .gitignore lines 66 and 101, and
                        src/cc_public/graph/extract.py line 153 and
                        src/cc_public/conftest.py line 48 skip the
                        .pixi folder. AGENTS.md lines 37-39 give a
                        fallback where pixi cannot run: the main
                        checkout's environment, called directly. On
                        2026-10-14 the device VM had no pixi and no
                        network, so a stand-in script at
                        $HOME/bin/pixi let commits through, and Will
                        ran pixi install himself (memory/MEMORY.md
                        lines 31 and 39). The environment holds
                        absolute paths under /media/wtp (MEMORY.md
                        line 32). The hooks fail closed, so no
                        unchecked commit gets in. The stand-in lives
                        outside the repository and is not committed.

