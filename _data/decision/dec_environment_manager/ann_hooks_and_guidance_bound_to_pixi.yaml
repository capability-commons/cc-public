title:                  Hooks and guidance bound to pixi
brief:                  |
                        Every hook runs through pixi, and the guidance
                        and code name it, so a host without pixi
                        cannot commit, and replacing pixi touches many
                        parts.
description:            |
                        All five hooks exec "pixi run --frozen ..."
                        (.githooks/*), and git aborts a commit when
                        pre-commit fails
                        (https://git-scm.com/docs/githooks). pixi is
                        named in README.md lines 32-58, AGENTS.md line
                        9, .agents/skills/editing-data-items/SKILL.md
                        line 30 and .gitignore lines 71 and 112, and
                        extract.py line 102 and conftest.py line 39
                        skip the .pixi folder. The device VM has no
                        pixi and no network, so a stand-in script at
                        $HOME/bin/pixi lets commits through, and Will
                        runs pixi install himself (memory/MEMORY.md
                        lines 31, 39, 41). The environment holds
                        absolute paths under /media/wtp (MEMORY.md
                        line 32). The hooks fail closed, so no
                        unchecked commit gets in. The stand-in lives
                        outside the repository and is not committed.

