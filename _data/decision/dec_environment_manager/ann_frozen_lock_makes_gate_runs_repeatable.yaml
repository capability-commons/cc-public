title:                  Repeatable gate runs from the lock
brief:                  |
                        With a committed lock and every hook run
                        through pixi run --locked, each commit is
                        checked by the same exact tool versions, and a
                        manifest changed without a new lock is
                        refused.
description:            |
                        pixi.lock lists exact builds, for example
                        python-3.15.0-h6e52b48_101_cp315 and
                        clingo-5.8.2-py315h62b6238_1 (lines 45 and
                        16). The lock was committed in e232fb3. All
                        five hooks exec "pixi run --locked ..."
                        (.githooks/commit-msg 29, pre-commit 30,
                        pre-merge-commit 34, pre-push 33,
                        prepare-commit-msg 34). --locked refuses to
                        run when pyproject.toml has changed without a
                        new lock, where --frozen ran the old
                        environment without saying so
                        (https://pixi.prefix.dev/latest/reference/cli/pixi/run/).
                        The gate counts pyproject.toml and pixi.lock
                        as code, so a commit that changes either runs
                        the tests (src/cctool/gate/gate.py within
                        TUPLE_CODE). Outside the lock remain git,
                        taken from the PATH (gate.py within
                        is_code_staged), and the Chromium that pixi
                        run browsers downloads for the browser tests
                        (pyproject.toml at tool.pixi.tasks.browsers).

