title:                  Hooks that now run pixi with --locked
brief:                  |
                        ann_frozen_lock_makes_gate_runs_repeatable
                        says every hook runs pixi run --frozen, so a
                        manifest changed without a new lock goes
                        unseen. Every hook now runs pixi run --locked,
                        which refuses that case, as the annotation
                        itself notes.
description:            |
                        .githooks/commit-msg, pre-commit,
                        pre-merge-commit, pre-push and
                        prepare-commit-msg each run "pixi run --locked
                        ...". No hook in .githooks uses --frozen. The
                        annotation cites the pixi documentation for
                        the point that --locked refuses to run when
                        pyproject.toml and pixi.lock disagree. So the
                        limit it names no longer applies to the hooks.
                        Found in the review of 2026-10-22.

