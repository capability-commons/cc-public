title:                  Silent failure of a tool off the environment
brief:                  |
                        While Souffle came from the PATH, a fault in
                        it could read as a clean result, and the code
                        needed extra guards to stop that.
description:            |
                        Before the clingo port, datalog.py read a
                        missing Souffle output file as an empty
                        relation (6230e98^,
                        src/cctool/graph/datalog.py lines 192-193),
                        recorded as a bug in memory/MEMORY.md line 53.
                        The gate refused to run without Souffle
                        because the tests that need it would otherwise
                        be skipped and pass (6230e98^,
                        src/cctool/gate/gate.py lines 41-43, 96-99).
                        The fix came with clingo, which pixi supplies
                        (5665ace, 6230e98); pixi alone, before
                        5665ace, did not close it.

