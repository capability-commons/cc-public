title:                  Installing pytest and the like
brief:                  |
                        A pixi pyproject.toml lets the project install
                        tools such as pytest, which the owner gave as
                        the reason on 2026-10-13.
description:            |
                        Owner's statements 2026-10-13T20:49:11Z: "Do
                        you think it would be worthwhile adding a pixi
                        pyproject.toml to cc-public so we can install
                        things like pytest?" and 20:50:13Z: "Write it
                        and I'll run pixi install". The legacy
                        repository also used pixi (note
                        cc-public-stocktake-2026-10-13.md).
                        ASSUMPTION: the reason speaks for
                        maintainability (changes can be tested before
                        they ship) and simplicity (one install for
                        every tool); Will did not name the concerns.

