title:                  Two package sources in one environment
brief:                  |
                        The environment mixes conda-forge packages and
                        PyPI packages, declared in two tables, so
                        where a dependency comes from has two answers.
description:            |
                        pyproject.toml line 51 sets conda-forge and
                        lines 57-61 list python, clingo, pytest and
                        ruff; lines 39-41 list click, jsonschema and
                        ruamel.yaml, resolved as PyPI wheels
                        (pixi.lock lines 48-55). At 2132eaf pyyaml
                        came from conda-forge and the PyPI list was
                        empty; it filled in 6c8d3d5, fcb71b0 and
                        d1c4400 with no recorded reason for taking
                        them from PyPI. A modest point: both tables
                        sit in one file and one lock.

