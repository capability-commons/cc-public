title:                  A tool for every gate stage
brief:                  |
                        Under pixi each stage the gate runs (check,
                        lint, test) finds its tool in the one
                        environment, so every needed function is
                        present wherever pixi install has run. With
                        tools on the PATH a machine could lack one,
                        and that function was absent.
description:            |
                        The gate stages are check, lint and test
                        (src/cc_public/gate/gate.py lines 64-66).
                        check needs clingo: check.py line 38 imports
                        cc_public.graph.datalog, which imports clingo
                        (datalog.py line 55). clingo, pytest and ruff
                        are declared in tool.pixi.dependencies
                        (pyproject.toml lines 57-61) and locked for
                        linux-64 and osx-arm64 (pixi.lock lines 16 and
                        60). Before pixi the device VM had no pytest,
                        and the tests were run in a separate container
                        (memory/MEMORY.md line 25); after pixi they
                        ran in the VM (MEMORY.md line 28). git is
                        still taken from the PATH (gate.py line 174).

