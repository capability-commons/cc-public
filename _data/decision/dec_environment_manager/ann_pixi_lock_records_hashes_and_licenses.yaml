title:                  Locked third-party set with recorded licenses
brief:                  |
                        pixi.lock names every third-party package by
                        exact URL, version and hash, and records its
                        license. Tools on the PATH give no such
                        record, so a change or withdrawal goes unseen
                        until something breaks.
description:            |
                        pixi.lock has 63 sha256 hashes and license
                        fields such as MIT (14), BSD-3-Clause (7) and
                        GPL-3.0-only (1); for example clingo-5.8.2
                        from conda.anaconda.org/conda-forge (pixi.lock
                        line 15). The Souffle used before was version
                        2.4, "presumably 2.4.1", copied by hand from
                        /usr/bin/souffle with a libffi from Ubuntu
                        20.04 (owner's statements 2026-10-13T20:07:22Z
                        and 20:12:49Z; memory/MEMORY.md line 21).

