title:                  Locked third-party set with recorded licenses
brief:                  |
                        pixi.lock names every third-party package by
                        exact URL, version and hash, and records the
                        license of each conda package. Tools on the
                        PATH give no such record, so a change or
                        withdrawal goes unseen until something breaks.
description:            |
                        pixi.lock has 180 sha256 hashes, one for each
                        of its 128 conda and 52 PyPI entries. The
                        conda entries carry license fields such as MIT
                        (46), BSD-3-Clause (11) and GPL-3.0-only (4);
                        the PyPI entries carry none. For example
                        clingo-5.8.2 comes from
                        conda.anaconda.org/conda-forge (pixi.lock).
                        The Souffle used before was version 2.4,
                        "presumably 2.4.1", copied by hand from
                        /usr/bin/souffle with a libffi from Ubuntu
                        20.04 (maintainer's statements 2026-10-13;
                        memory/MEMORY.md line 21).

