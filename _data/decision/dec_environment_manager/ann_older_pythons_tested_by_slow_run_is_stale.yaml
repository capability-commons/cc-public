title:                  Lowest claimed Python now tested by the slow run
brief:                  |
                        ann_gate_tests_only_the_locked_python says
                        pixi.lock holds Python 3.15 only and nothing
                        checks the lowest version the project claims.
                        The lock now holds environments for Python
                        3.12, 3.13 and 3.14, and pixi run slow runs
                        the tests in each. The gate itself still runs
                        one Python.
description:            |
                        pyproject.toml lines 85-87 define the task
                        slow, which runs the test task in the
                        environments py312, py313 and py314. Lines
                        89-101 pin python to 3.12.*, 3.13.* and 3.14.*
                        in those environments. pixi.lock holds them at
                        lines 169, 332 and 496, with python 3.12.15,
                        3.13.16 and 3.14.8 for linux-64 (lines 211,
                        373 and 537). requires-python is still ">=
                        3.12" (line 41). The comment above the task
                        says it is too slow for the gate and is run on
                        its own. So the lowest claimed version is
                        checked, though not at each commit. Found in
                        the review of 2026-10-22.

