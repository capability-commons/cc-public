title:                  Rule engine missing from the package metadata
brief:                  |
                        clingo is declared only in the pixi table, not
                        in the project dependencies, so any install
                        other than pixi gives a cctool whose check
                        command fails on import.
description:            |
                        [project].dependencies lists click, jsonschema
                        and ruamel.yaml only (pyproject.toml lines
                        39-41); clingo is under
                        [tool.pixi.dependencies] (line 58). logic.py
                        imports clingo at module level (line 55).
                        Measured by the advocate on 2026-10-15 at
                        89c74d8: after uv pip install -e on Python
                        3.12.3, importing cc_public.check.check fails
                        with "ModuleNotFoundError: No module named
                        'clingo'"; with clingo added by hand, cctool
                        check reports 0 failures. clingo 5.8.2 is on
                        PyPI (https://pypi.org/pypi/clingo/json, read
                        2026-10-15), so it could be listed there; a
                        one-line fix. This challenges how the choice
                        was applied, not pixi itself. ASSUMPTION:
                        whether an install outside pixi is an intended
                        use; no source says.

