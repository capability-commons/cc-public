title:                  jq missing from the package metadata
brief:                  |
                        clingo is now in the project dependencies, but
                        jq is declared only in the pixi table, so any
                        install other than pixi gives a cctool whose
                        query jq fails.
description:            |
                        [project].dependencies lists click, clingo,
                        htpy, jsonschema, pyoxigraph, referencing and
                        ruamel.yaml (pyproject.toml lines 42-48); jq
                        is only under [tool.pixi.dependencies] (line
                        67), as a conda package (pixi.lock line 22).
                        cctool query jq runs the jq program as a
                        subprocess and, where there is none, stops
                        with "There is no jq program to run. Run pixi
                        install" (src/cc_public/graph/jq.py lines
                        84-91). This challenges how the choice was
                        applied, not pixi itself. ASSUMPTION: an
                        install outside pixi is an intended use, as
                        ann_clingo_in_project_dependencies_is_fixed
                        reports of commit 24e6ca9.

