title:                  Half a gigabyte per machine
brief:                  |
                        The locked environment takes about 267 MB in
                        the clone plus about 278 MB of package cache,
                        a fixed storage cost per machine that tools on
                        the PATH would mostly avoid.
description:            |
                        Measured by the advocate on 2026-10-15: pixi
                        install --frozen took 6.3 s; .pixi was 267 MB
                        and the rattler cache 278 MB. pixi.lock is 861
                        lines, 34 KB. ASSUMPTION: with tools on the
                        PATH a machine reuses a system Python and
                        installed tools. A weak point: the cost does
                        not grow with the graph.

