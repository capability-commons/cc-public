title:                  Indirect dependencies far outnumbering direct ones
brief:                  |
                        The environment brings in about four times as
                        many packages as the project names, plus pixi
                        itself and two package services. Each can
                        change or vanish, though pixi records them.
description:            |
                        pyproject.toml names 7 runtime libraries
                        (lines 42-48), 6 conda packages (lines 65-71)
                        and 2 more PyPI packages (lines 62-63), 14
                        names in all, with clingo in two tables. The
                        linux-64 default environment in pixi.lock
                        holds 55 entries (lines 12-66) from
                        conda.anaconda.org/conda-forge and pypi.org
                        (lines 4-7), and the lock holds four
                        environments for three platforms. No pixi
                        version is pinned (no requires-pixi key). On
                        2026-10-14 the device VM had no pixi and used
                        a hand-written stand-in (memory/MEMORY.md line
                        39). Some locked packages are GPL-3.0-only or
                        GPL with the GCC exception (for example
                        pixi.lock lines 1371, 1510 and 2517).
                        ASSUMPTION: these are toolchain parts not
                        distributed with cc-public, so its Apache-2.0
                        license is not affected; not checked against
                        ISO/IEC 5230. The tools-on-PATH way carries
                        the same libraries without a record.

