title:                  pixi environment from conda-forge
brief:                  |
                        The environment is managed by pixi from
                        pyproject.toml and a committed pixi.lock,
                        which pins every package by version and hash,
                        and every hook runs it with --locked, so each
                        commit is checked with the same tools and a
                        manifest changed without a new lock is
                        refused. This is what the maintainer asked
                        for, to install tools such as pytest, and it
                        ended the silent faults of a rule engine taken
                        from the PATH. Tools on the PATH would need no
                        manager, but each machine would set them up by
                        hand, with no record. Ruled by WTP on
                        2026-10-23.

