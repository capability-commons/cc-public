title:                  Rule engine now in the package metadata
brief:                  |
                        Commit 24e6ca9 "Fix the declared dependencies
                        so that a pip install of cctool runs" lists
                        clingo in [project].dependencies. At 360ec14
                        an install outside pixi brings the rule engine
                        with it.
description:            |
                        [project].dependencies lists click>=8.2,<9,
                        clingo>=5.8,<6, jsonschema, referencing and
                        ruamel.yaml (pyproject.toml lines 39-43 at
                        360ec14). clingo stays in
                        [tool.pixi.dependencies] as well (line 60), so
                        it is still declared in two places.

