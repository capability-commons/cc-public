title:                  Tools found on the PATH
brief:                  |
                        Expect tools such as Souffle on the PATH, or
                        copied there by hand.
description:            |
                        The way tools were found before 2132eaf.
                        Souffle stayed on the PATH after 2132eaf until
                        5665ace and 6230e98 on 2026-10-14 (commit
                        2132eaf message: "Souffle is not on
                        conda-forge and is expected on the PATH"), so
                        for about a day both ways were in force
                        together.

