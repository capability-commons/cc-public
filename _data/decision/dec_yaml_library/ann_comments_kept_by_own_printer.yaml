title:                  Comment keeping in the project's own printer
brief:                  |
                        The switch was also justified by writing files
                        back with comments intact, but the project's
                        own printer keeps comments from the raw text.
                        Round-trip comment keeping is carried but
                        unused, so the choice rests on positions and
                        scalar style.
description:            |
                        Commit fcb71b0 (pre-squash): editing commands
                        "can write a file back with its comments, key
                        order and layout intact". Commit b544e09
                        (pre-squash) brought in the layout printer.
                        layout.py gathers whole-line comments from the
                        text and puts them back by line (layout.py
                        within _lead and _emit_lead). It reads
                        ruamel's .ca comment records only to refuse a
                        comment at the end of a line (layout.py within
                        _refuse). Edits splice line ranges and lay the
                        file out again (edit.py within _format and
                        _Item). ruamel dump is used only for fresh
                        fragments and one scalar (layout.py within
                        dump and _render).

