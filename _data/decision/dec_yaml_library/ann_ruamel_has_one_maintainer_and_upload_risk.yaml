title:                  Single maintainer with a warned upload risk
brief:                  |
                        ruamel.yaml lists a single author and no other
                        maintainer, is pre-1.0 with a record of
                        breaking changes, and its author warns that
                        future uploads to PyPI may become impossible.
                        PyYAML is kept by an organization on GitHub.
description:            |
                        https://pypi.org/pypi/ruamel.yaml/json and
                        https://pypi.org/pypi/pyyaml/json, fetched
                        2026-10-15: one author, Anthon van der Neut,
                        with home and tracker on SourceForge; PyYAML
                        under the yaml organization on GitHub. The
                        ruamel.yaml 0.19.1 README has a section
                        "breaking changes, that may make future
                        uploads to PyPI impossible", on a rename asked
                        for under PEP 625. 0.18.0 deprecated the
                        module-level load and dump; 0.19.0 caused
                        deployment problems fixed in 0.19.1. The
                        maintainer of this project asked at the time
                        whether ruamel.yaml was still maintained
                        (2026-10-13T22:07:14Z). ASSUMPTION: no
                        recorded answer to that question is in the
                        sources.

