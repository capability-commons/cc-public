title:                  End-of-line comments lost on edit
brief:                  |
                        Every edit lays the whole file out again, and
                        the layout keeps comments on their own lines
                        but drops a comment at the end of a line,
                        without any failure.
description:            |
                        edit.py lines 1182-1193 pass each new file
                        text to _format. layout.format("#
                        lead\nid_self: a # trailing\nrelation: []\n")
                        returns the text without the trailing comment
                        (local test against the repo source,
                        2026-10-15). No file under _data has an
                        end-of-line comment today. The fault is in the
                        layout, not the library: ruamel keeps the
                        comment, so a fix stays possible, while PyYAML
                        keeps no comments.

