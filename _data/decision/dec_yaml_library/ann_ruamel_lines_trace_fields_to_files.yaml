title:                  Source lines to trace fields to files
brief:                  |
                        ruamel.yaml gives source lines, so a field can
                        be traced back to where it is written, for
                        example by a viewer that goes from a
                        traceability graph to the line where an
                        identifier occurs.
description:            |
                        Owner's statement, 2026-10-13T22:07:14Z: "I
                        think we probably want ruamel.yaml rather than
                        pyyaml - so we get source lines and can trace
                        back to where fields exist in files (if we
                        ever want to have a viewer where traceability
                        graphs go to the relevant lines in a file
                        where identifiers occur)". Then at
                        2026-10-13T22:39:40Z: "Make the switch now".
                        Commits fcb71b0 and afac39c; line and column
                        on facts in 9a4b995 (all pre-squash).

