title:                  ruamel.yaml as one pure-Python wheel
brief:                  |
                        In the locked environment ruamel.yaml installs
                        as one pure-Python wheel with no required
                        dependencies, while PyYAML had to be built
                        from a source archive. Both are MIT licensed.
description:            |
                        Python 3.15 on linux-64 and osx-arm64
                        (pixi.lock line 40; pyproject.toml line 52).
                        Before the switch the lock resolved
                        pyyaml-6.0.3.tar.gz (commit afac39c, pixi.lock
                        diff); PyYAML 6.0.3 has wheels for cp38 to
                        cp314 only
                        (https://pypi.org/pypi/pyyaml/6.0.3/json,
                        fetched 2026-10-15).
                        ruamel_yaml-0.19.1-py3-none-any.whl,
                        dependencies only behind optional extras
                        (pixi.lock lines 743-751). The ruamel.yaml
                        README says the C extensions bring no
                        advantage with typ='rt'. ASSUMPTION: MIT is
                        compatible with an Apache-2.0 project; no
                        legal source cited.

