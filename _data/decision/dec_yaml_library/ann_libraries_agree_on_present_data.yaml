title:                  Same values from every present data file
brief:                  |
                        On the data as it stands, PyYAML safe_load and
                        ruamel.yaml round-trip give the same values
                        for every file. The difference between them is
                        latent: none of the scalars they read
                        differently occurs today.
description:            |
                        Local test, 2026-10-15: all 75 YAML files
                        under _data loaded with YAML(typ='rt') and
                        with yaml.safe_load, converted to plain types
                        and compared; 0 files differ. Leaf values are
                        only str, int and bool; no dates, floats or
                        nulls. rt loads all 75 without
                        DuplicateKeyError, so no file holds a repeated
                        key. The case for the chosen library on
                        correctness therefore rests on future input,
                        not on a present misreading. This may change
                        as the data grows. Raised by the functional
                        suitability advocate as weak support.

