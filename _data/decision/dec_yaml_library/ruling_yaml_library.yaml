title:                  ruamel.yaml in round-trip mode
brief:                  |
                        The data items are read with ruamel.yaml in
                        round-trip mode, since one load gives the
                        values with the line of each key, which the
                        checks, the edits and the schema errors
                        report, and it reads YAML 1.2 as JSON Schema
                        expects and refuses a repeated key. PyYAML
                        reads YAML 1.1, keeps the last of a repeated
                        key and gives lines only on its nodes, so it
                        would need more code of our own. A cold read
                        about twice as slow and a single upstream
                        maintainer are the accepted costs. Ruled by
                        William Payne on 2026-10-23.

