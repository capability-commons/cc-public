title:                  libyaml parsing into round-trip types
brief:                  |
                        The data items are read by parsing with
                        libyaml and building the nodes into the
                        round-trip types of ruamel.yaml, which keeps
                        the line of each key that the checks, the
                        edits and the schema errors report, the YAML
                        1.2 rules that JSON Schema expects, and the
                        refusal of a repeated key, at about fourteen
                        times the speed of a round-trip load. Edits
                        and layout keep ruamel.yaml in round-trip
                        mode, since they write documents back, so the
                        two libraries serve different purposes. PyYAML
                        alone stays rejected, since it reads YAML 1.1,
                        keeps the last of a repeated key and gives no
                        lines on its values. A second library and a
                        node builder of our own are the accepted
                        costs. Ruled by WTP on 2026-10-23 for
                        ruamel.yaml in round-trip mode, and changed by
                        WTP on 2026-10-26 at 21:13 UTC, by choosing
                        "Uphold the libyaml option" for the question
                        "Rule that libyaml parsing into ruamel types
                        replaces the ruamel-only reading?".

