title:                  Layout now reads ruamel comment records
brief:                  |
                        The annotation says no module reads ruamel's
                        .ca comment records. Now the layout reads them
                        to refuse a comment at the end of a line.
                        Comments are still kept from the raw text, so
                        the main point stands.
description:            |
