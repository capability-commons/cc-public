title:                  One-line diffs from positioned edits
brief:                  |
                        An edit replaces only the lines of the field
                        it changes, found through the line and column
                        that ruamel.yaml records, in a file already in
                        the one layout. A one-field edit shows only
                        the lines it changes, one line for a new
                        title, even in a long register.
description:            |
                        _Item.extent finds the lines of a field from
                        node.lc.key and _Item.replace swaps only those
                        lines before layout
                        (src/cc_public/edit/edit.py lines 1150-1193;
                        _put_field at line 551). Every file under
                        _data is checked against the layout
                        (src/cc_public/check/check.py line 75), and
                        the layout is idempotent (layout.py
                        docstring). Edit commands print a diff with
                        --dry-run (src/cc_public/cli/editing.py lines
                        23-25, 82-84). Local runs at HEAD 89c74d8,
                        2026-10-15: cctool set of a title on
                        reg_concern.yaml (669 lines) gives 1 removed
                        and 1 added line; a one-sentence brief change
                        gives 1 and 1; cctool link adding a first edge
                        gives 1 and 7. A PyYAML load and dump of the
                        same file with no edit gives a diff of 645
                        removed and 712 added lines with key order
                        kept, 660 and 727 with sorting. This supports
                        what was built on the library. Raised by the
                        reviewability advocate.

