title:                  End-of-line comments now refused, not dropped
brief:                  |
                        Commit f298c4a "Fix the layout printer so that
                        it refuses what it would lose" raises
                        Unsupported for a comment at the end of a
                        line. At 360ec14 an edit or format refuses
                        such a file instead of dropping the comment
                        silently.
description:            |
                        The printer walks each node and raises
                        Unsupported for an anchor, an alias, a tag or
                        an end-of-line comment
                        (src/cc_public/edit/layout.py lines 102-105,
                        237-271 at 360ec14);
                        test_what_the_printer_would_drop_or_expand_is_refused
                        covers it
                        (src/cc_public/edit/_test/test_edit.py lines
                        529-540). An edit that would leave a refused
                        file is refused, and cctool check reports the
                        file as unformatted_file. The printer still
                        cannot keep such a comment.

