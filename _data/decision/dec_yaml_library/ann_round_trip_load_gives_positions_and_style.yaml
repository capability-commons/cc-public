title:                  One load for values, positions and prose style
brief:                  |
                        One round-trip load yields the data, the line
                        and column of every key, and whether a value
                        was written as a literal block. Editing,
                        layout, fact extraction and schema errors all
                        use that one record, with no separate pass for
                        positions or style.
description:            |
                        Positions read through .lc:
                        src/cctool/edit/edit.py within _ordered;
                        check/layout.py within _span and _emit_lead;
                        graph/extract.py within read and parse_all;
                        check/schema.py within violations. Block style
                        through LiteralScalarString and
                        FoldedScalarString: extract.py within read;
                        edit.py within _put_field and _operation;
                        layout.py within _lead. Line on item and
                        reference facts: commit 9a4b995 (pre-squash).
                        ASSUMPTION: with PyYAML the tooling would need
                        its own walk from nodes to values, or a second
                        load; this is not built, so unsourced.

