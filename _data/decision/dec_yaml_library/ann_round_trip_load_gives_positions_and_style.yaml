title:                  One load for values, positions and prose style
brief:                  |
                        One round-trip load yields the data, the line
                        and column of every key, and whether a value
                        was written as a literal block. Editing,
                        layout, fact extraction and schema errors all
                        use that one record, with no separate pass for
                        positions or style.
description:            |
                        Positions read through .lc:
                        src/cc_public/edit/edit.py lines 1156 and
                        1166; edit/layout.py lines 425 and 496;
                        graph/extract.py lines 519-540;
                        check/schema.py lines 203-206. Block style
                        through LiteralScalarString and
                        FoldedScalarString: extract.py line 501;
                        edit.py lines 620 and 967; layout.py lines
                        470-479. Line on item and reference facts:
                        commit 9a4b995 (pre-squash). ASSUMPTION: with
                        PyYAML the tooling would need its own walk
                        from nodes to values, or a second load; this
                        is not built, so unsourced.

