title:                  Faulty input refused rather than changed
brief:                  |
                        ruamel.yaml in round-trip mode refuses a
                        repeated key and reads "no" as a string.
                        PyYAML safe_load keeps the last value of a
                        repeated key and reads "no" as False, so the
                        data changes silently.
description:            |
                        Local tests on 2026-10-15, ruamel.yaml 0.19.1
                        and PyYAML 6.0.1: YAML(typ='rt') raises
                        DuplicateKeyError on "id_self: a\nid_self: b";
                        safe_load gives {'id_self': 'b'} with no
                        warning. safe_load reads "mark: no" and "code:
                        NO" as False (YAML 1.1); rt reads them as
                        strings (YAML 1.2). Every YAML file under
                        _data is loaded with YAML(typ='rt'); YAML
                        elsewhere is not read as a document:
                        src/cctool/graph/extract.py within
                        ErrorRead.__init__ and Unreadable;
                        edit/layout.py. Checks run on the loaded data:
                        edit/edit.py within _move_folder. ASSUMPTION:
                        the schemas would likely catch a boolean in a
                        string field, but not a dropped duplicate key.

