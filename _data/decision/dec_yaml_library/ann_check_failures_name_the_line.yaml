title:                  Check failures that name the line
brief:                  |
                        Since the switch, checks that report a file
                        also report the line. This shortens the time
                        to find and repair a faulty item in registers
                        thousands of lines long.
description:            |
                        Commit 9a4b995 (pre-squash): "The checks that
                        report a file now report the line too", taken
                        "from ruamel's record of where each key was
                        read". reg_concept.yaml had 3,259 lines and
                        reg_data_item_type.yaml 2,608 lines
                        (will-messages.md line 74). Weak against
                        PyYAML, which could give the same lines with
                        more code of the project's own.

