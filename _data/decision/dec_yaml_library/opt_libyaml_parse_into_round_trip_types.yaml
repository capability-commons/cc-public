title:                  libyaml parsing into ruamel.yaml's round-trip types
brief:                  |
                        Read the data items with the C parser of
                        libyaml through PyYAML, and build its nodes
                        into the mappings, lists and scalars of
                        ruamel.yaml in round-trip mode, with the line
                        and column of every key and item and the YAML
                        1.2 rules of ruamel.yaml. A document with a
                        tag, an alias, a merge key or a repeated key,
                        one libyaml cannot parse, or a Python without
                        libyaml is read by ruamel.yaml in round-trip
                        mode instead. Edits and layout still use
                        ruamel.yaml, since they write documents back.

