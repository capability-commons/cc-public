title:                  ruamel types spread across six modules
brief:                  |
                        ruamel types, attributes and loader settings
                        are used directly in six source modules, with
                        no single place that owns them. A change of
                        library, or of the ruamel API, touches each of
                        them.
description:            |
                        Imports in edit/edit.py, edit/layout.py,
                        graph/extract.py, commit/message.py and
                        cli/editing.py; check/schema.py reads .lc
                        (schema.py within _line). Three loaders built
                        separately: edit.py within YAML, layout.py
                        within YAML, extract.py within YAML;
                        message.py and editing.py use those of extract
                        and edit. Only layout sets width and
                        preserve_quotes, on its loader (layout.py
                        within YAML). .lc.key and .lc.item on 8 lines;
                        CommentedMap and CommentedSeq at layout.py
                        within Unsupported; YAMLError at layout.py
                        within format, extract.py within _load,
                        message.py within parse, and editing.py within
                        set_field and batch. check/store.py names the
                        library so that a stored verdict is not reused
                        across its versions (store.py within
                        TUPLE_DIST). Pinned to
                        ruamel.yaml>=0.19.1,<0.20 (pyproject.toml at
                        project.dependencies). This challenges the
                        choice as built, not the library.

