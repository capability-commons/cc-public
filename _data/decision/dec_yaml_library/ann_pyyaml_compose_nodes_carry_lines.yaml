title:                  PyYAML nodes also carry source lines
brief:                  |
                        PyYAML also records line and column, on every
                        node that yaml.compose returns. What it lacks
                        is positions on the loaded Python values,
                        which ruamel.yaml keeps through .lc.
description:            |
                        yaml.compose returns nodes whose start_mark
                        and end_mark hold line and column. Local tests
                        with PyYAML 6.0.1 and 6.0.2 on 2026-10-15:
                        composing "a:\n b: 1\n c: [x, y]\n" gives key
                        a at line 0 and keys b and c at lines 1 and 2.
                        yaml.safe_load returns plain dict, list and
                        str with no position. Sources:
                        https://pyyaml.org/wiki/PyYAMLDocumentation
                        (Nodes and Marks); pyyaml lib/yaml/nodes.py
                        lines 1-6 and error.py lines 3-11. The
                        maintainer asked at the time whether his
                        information was out of date. Raised by the
                        dependency risk, maintainability, performance
                        and reliability advocates.

