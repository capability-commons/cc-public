title:                  Reading the tree fourteen times faster
brief:                  |
                        Parsing with libyaml and building the
                        round-trip types reads every YAML file of the
                        tree about fourteen times faster than a
                        round-trip load, and a cold check runs about a
                        fifth faster.
description:            |
                        Sources:
                        - All 3,267 YAML files of the tree read in 9.3
                          s by a round-trip load and in 0.7 s by
                          src/cctool/graph/parse.py within load
                          [measured by Claude in the cloud container
                          on 2026-10-26, Python 3.14, ruamel.yaml
                          0.19.1, PyYAML 6.0.3 with libyaml].
                        - cctool check with no store took 49 s before
                          the change and 39 s after, on the same tree
                          and machine [measured by Claude in the cloud
                          container on 2026-10-26].
                        - Reading YAML was most of the time of a check
                          before the read cache, and the parse still
                          starts cold in each process
                          [_data/decision/dec_yaml_library/ann_round_trip_parsing_is_slow.yaml
                          at brief;
                          _data/decision/dec_yaml_library/ann_read_cache_hides_parse_cost.yaml
                          at description].

