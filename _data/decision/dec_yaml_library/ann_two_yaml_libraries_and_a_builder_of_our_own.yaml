title:                  Two YAML libraries and a node builder of our own
brief:                  |
                        The tool depends on PyYAML as well as
                        ruamel.yaml, and keeps about 280 lines of its
                        own that build ruamel.yaml types from libyaml
                        nodes, and must follow both libraries. A
                        change in how ruamel.yaml builds a scalar, or
                        in the private node types it is given, could
                        make the two readings differ.
description:            |
                        Sources:
                        - pyproject.toml at project.dependencies names
                          both pyyaml and ruamel.yaml.
                        - src/cctool/graph/parse.py holds the builder;
                          it builds scalars with the constructor of a
                          ruamel.yaml round-trip loader and its
                          ScalarNode type, and its resolver copies the
                          implicit resolvers of ruamel.yaml for YAML
                          1.2 [src/cctool/graph/parse.py within
                          _scalar and _Resolver].
                        - The check store keys verdicts by the
                          versions of both libraries
                          [src/cctool/check/store.py within
                          TUPLE_DIST].
                        - The property tests and the whole-tree
                          comparison would show a divergence after an
                          upgrade of either library
                          [src/cctool/_test/test_property.py within
                          test_the_fast_reading_of_a_document_is_that_of_ruamel].
                        - PyYAML is widely used and has a C extension
                          built for the platforms the lock covers;
                          without libyaml the reader falls back to
                          ruamel.yaml [src/cctool/graph/parse.py
                          within IS_FAST and load]. ASSUMPTION:
                          conda-forge builds pyyaml with libyaml on
                          linux-64, osx-64 and osx-arm64; not yet
                          checked in the lock.

