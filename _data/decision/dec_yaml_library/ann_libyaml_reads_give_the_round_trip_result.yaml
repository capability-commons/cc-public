title:                  Same values, types and lines as a round-trip load
brief:                  |
                        On every YAML file of the tree, the libyaml
                        reading gives the same values, types, and
                        lines and columns of keys and items as a
                        round-trip load, and the extractor finds the
                        same facts. What it does not build, and every
                        error, is left to ruamel.yaml, so a repeated
                        key is still refused and YAML 1.2 still
                        decides what a plain scalar is.
description:            |
                        Sources:
                        - All 3,267 YAML files compared, values, types
                          and .lc of every key and item: 0 differ;
                          cctool.graph.extract.extract over the whole
                          tree gives the same facts before and after
                          [measured by Claude in the cloud container
                          on 2026-10-26].
                        - The plain scalar rules are those of
                          ruamel.yaml for YAML 1.2, so yes, no, on and
                          off stay text [src/cctool/graph/parse.py
                          within _Resolver;
                          src/cctool/graph/_test/test_graph.py within
                          test_parse_reads_plain_scalars_by_the_rules_of_yaml_1_2].
                        - A tag, an alias, a merge key, a repeated
                          key, or a libyaml error sends the document
                          to ruamel.yaml [src/cctool/graph/parse.py
                          within load, _build and _mapping].
                        - Two property tests compare the two on
                          made-up documents and on any text
                          ruamel.yaml reads; at 2,000 examples each
                          they found a bare ! tag and a lone = that
                          are now left to ruamel.yaml
                          [src/cctool/_test/test_property.py within
                          test_the_fast_reading_of_a_document_is_that_of_ruamel
                          and
                          test_the_fast_reading_of_any_text_that_ruamel_reads_is_the_same].
                        - libyaml reads a few texts ruamel.yaml
                          refuses, such as a tab after a scalar; the
                          layout check reads every file with
                          ruamel.yaml and reports such a file as not
                          YAML [src/cctool/check/layout.py within
                          _violation].

