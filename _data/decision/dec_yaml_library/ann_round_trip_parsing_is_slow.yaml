title:                  Slow round-trip parsing
brief:                  |
                        Round-trip loading with pure-Python
                        ruamel.yaml takes about twenty times as long
                        as PyYAML with libyaml on the same files, and
                        about 1.7 times pure-Python PyYAML. Reading
                        and validating documents was most of the time
                        of a check before the read cache.
description:            |
                        Best of 5 over the 75 YAML files under _data
                        (269,421 bytes), Python 3.13, ruamel.yaml
                        0.19.1, PyYAML 6.0.2: ruamel rt 421-427 ms;
                        ruamel safe 318-326 ms; PyYAML SafeLoader
                        240-253 ms; PyYAML CSafeLoader 20 ms. Memory
                        held: 2.9 MB against 0.5 MB. Script:
                        scratchpad bench_adv_perf/b.py. Commit
                        93a1428: reading and validating documents
                        "took most of the time of each check". The
                        lock has the pure-Python wheel (pixi.lock
                        lines 54, 743-749). The old lock had PyYAML
                        only as a source archive and no libyaml
                        package (afac39c^:pixi.lock). ASSUMPTION:
                        PyYAML built there would likely have been pure
                        Python, so the 1.7 times figure is the nearer
                        comparison. ASSUMPTION: about 4 s per full
                        read at tenfold size, by linear extrapolation.

