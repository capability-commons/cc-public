title:                  Repeated runtime checks sized to the change
brief:                  |
                        The checks the both option repeats in the
                        runtime, port types and unfed inputs, need
                        only the changed nodes and their neighbors, so
                        their cost follows the size of the change, not
                        the graph.
description:            |
                        Sources: The runtime repeats checks such as
                        port types and unfed inputs
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_both.yaml
                        lines 13-17). The earlier dynamic host already
                        checked every edge when it wired it
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 67). ASSUMPTION: a port type check
                        compares two type ids per edge, and an unfed
                        input check looks at the edges into one node.
                        Strength: moderate to strong; it holds at ten
                        times the nodes as long as the repeated set
                        leaves out whole-graph checks such as loops.

