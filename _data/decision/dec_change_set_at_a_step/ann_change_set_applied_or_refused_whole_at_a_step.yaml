title:                  Change set applied or refused whole at the start of a step
brief:                  |
                        A change set must be applied whole at the
                        start of a step, and a refused one must leave
                        the graph exactly as it was, so a step never
                        sees a part-applied change and the fallback is
                        the last graph that passed. Only the runtime
                        option says so; the other two should state it
                        too.
description:            |
                        Sources: The owner: nodes and edges change "at
                        the start of each dataflow-synchronous 'step'"
                        (owner's statement, 2026-10-24). In Patrol, "A
                        change from the panel between those reads
                        gives one frame two settings"
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 62-66), and the drafted analysis
                        interface applies commands "before a step,
                        never during it" (the interface table script
                        in _sources/cc-patrol-notes/draft/tools, line
                        111). The runtime option is "applied whole at
                        the start of a step ... A change set that
                        fails is refused whole"
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml,
                        brief); the other two briefs do not state it.
                        Start, stop, restart and rewire happen only
                        between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). The register asks what state a
                        design falls back to when it fails
                        (_data/register/reg_concern.yaml at
                        entries.concern_safety.question). Strength:
                        strong and scale-free, though easy to add to
                        the other options by wording.

