title:                  Runtime checks that cover only part of the dataflow checks
brief:                  |
                        A resolved graph must pass cctool's eleven
                        dataflow checks, and a change set that cctool
                        checks is held to all of them. The runtime
                        option lists four checks, three of them among
                        the eleven, and leaves out the other eight,
                        such as input fed twice, unknown port, foreign
                        node, unknown or missing setting and unplaced,
                        so a runtime-only check can accept a graph
                        that cctool would refuse.
description:            |
                        Sources: The dataflow checks in check.lp are
                        misnamed node, interface count, foreign node,
                        unknown port, input fed twice, unfed input,
                        port type mismatch, feedforward loop, unknown
                        setting, missing setting and unplaced
                        (src/cctool/check/check.lp, the show lines).
                        The variants draft runs "all eleven dataflow
                        checks as they are now" on every resolved
                        variant (_sources/cc-patrol-notes/variants.md
                        lines 86-89). The runtime option checks "port
                        types, unfed inputs, loops without a feedback
                        edge, and the place of each crossing"
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml,
                        brief). ASSUMPTION: two implementations of one
                        rule set in different languages drift unless
                        tests hold them to each other. Strength:
                        strong; the gap widens as checks are added.

