title:                  Whole-graph checks inside the gap between steps
brief:                  |
                        Whatever the runtime checks when a change set
                        arrives is done between steps, so it delays
                        the next step; a check of loops without a
                        feedback edge walks the graph, so its cost
                        grows with the graph and can show as a long
                        step at the 99th percentile. Checking a digest
                        costs the same for any graph.
description:            |
                        Sources: The runtime option checks port types,
                        unfed inputs, loops without a feedback edge
                        and the place of each crossing, and applies
                        the change set whole at the start of a step
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml
                        lines 13-19). The cctool-first option checks
                        only the digest
                        (opt_change_set_checked_by_cctool_first.yaml
                        in the same folder, lines 13-18). The loop
                        check in cctool is a closure over the graph
                        (src/cctool/check/check.lp lines 3243-3248 and
                        3285-3286). Start, stop, restart and rewire
                        happen only between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). ASSUMPTION: the runtime could
                        check a change set on another thread before
                        the step boundary and only swap at it; the
                        option does not say where the check runs.
                        ASSUMPTION: the runtime keeps the digest of
                        the graph it runs up to date rather than
                        recomputing it. Strength: moderate; it
                        strengthens at ten times the nodes and weakens
                        if checks move off the step thread.

