title:                  Checked by cctool first
brief:                  |
                        A change set is a data item that cctool checks
                        against the graph before it is sent. The
                        runtime applies only a change set that carries
                        the digest of the graph it was checked
                        against, and checks only that the digest
                        matches the graph it runs.

