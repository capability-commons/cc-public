title:                  Run-time change set as a variant transformation
brief:                  |
                        A change set checked by cctool first is the
                        same kind of thing as a variant
                        transformation, which the Patrol plan already
                        holds as data items with add, remove, join and
                        place operations checked against the graph, so
                        the runtime needs only a digest comparison.
                        This rests on how variants are held, which is
                        not yet ruled, adopting transformation items.
description:            |
                        Sources: Variants are a base plus
                        transformation items, derived, not stored
                        (_sources/cc-patrol-notes/plan.md lines
                        173-175). The planned operations are filter,
                        add, join, write, host, process, place and
                        remove, with joins checked because ports are
                        interface members
                        (_sources/cc-patrol-notes/variants.md lines
                        57-67). The cctool-first option sends a change
                        set as a checked data item and the runtime
                        checks only the digest
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml
                        lines 11-18); the runtime option checks in C++
                        (opt_change_set_checked_by_the_runtime.yaml,
                        lines 11-19). Strength: strong for the count
                        of mechanisms; it says nothing on targets
                        without cctool at hand.

