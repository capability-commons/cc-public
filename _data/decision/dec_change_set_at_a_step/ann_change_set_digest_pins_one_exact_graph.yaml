title:                  Change set pinned to one exact graph by its digest
brief:                  |
                        A change set that carries one graph's digest
                        applies only to systems running exactly that
                        graph. When many systems run variants of a
                        graph, cctool must check and send one change
                        set per variant, while run-time checks let one
                        change set apply wherever its own nodes and
                        edges fit.
description:            |
                        Sources: The runtime applies only a change set
                        carrying the digest of the graph it runs
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml
                        at title and brief). Patrol's drafts already
                        hold several variants of one base graph,
                        differing in hosts, processes and edges
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 65-78; _sources/cc-patrol-notes/plan.md
                        lines 126-135). ASSUMPTION: the digest covers
                        the whole graph, not only the part the change
                        set touches. Strength: grows with scale; at
                        ten times the variants the digest form needs
                        ten times the checked change sets.

