title:                  Change set checked and kept as an item before it is sent
brief:                  |
                        When cctool checks a change set in full before
                        it is sent, a change that would leave an input
                        unfed, join mismatched ports or close a loop
                        without a feedback edge is found on the desk
                        rather than refused in service, and the change
                        set is an item that can be reviewed, tested
                        and given reasons in the graph. A runtime-only
                        check finds the same fault only once the
                        change reaches the running system, and leaves
                        no item for a reason to attach to.
description:            |
                        Sources: cctool already checks unfed inputs,
                        port type mismatches and feedforward loops
                        (src/cctool/check/check.lp within
                        port_type_mismatch, feeds_forward and
                        unknown_setting). In the cctool-first option a
                        change set is a data item checked against the
                        graph before it is sent, and in the both
                        option cctool checks it in full before it is
                        sent
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml
                        and opt_change_set_checked_by_both.yaml,
                        briefs); the runtime option checks in C++ and
                        does not say the change set is an item
                        (opt_change_set_checked_by_the_runtime.yaml,
                        brief). Reconfiguration within a segment
                        "should select from a finite set of
                        pre-validated topologies (modes)" so a safety
                        case covers the deployed configuration
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 212-215). An earlier argument holds that
                        a runtime refusal keeps a defined fallback but
                        gives up build-time assurance
                        (_data/decision/dec_first_engine/ann_runtime_refuses_a_mismatched_wiring.yaml,
                        brief). An annotation or decision may be about
                        any item (_data/register/reg_relation.yaml at
                        entries.relation_is_about). ASSUMPTION: under
                        the both option the change set is held as an
                        item, since cctool checks items. Strength:
                        strong; at ten times the nodes a hand review
                        becomes impractical, and at ten times the
                        systems only items can be followed back.

