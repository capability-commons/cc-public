title:                  Digest match as proof of the graph, not of the change set
brief:                  |
                        A digest match shows which graph a change set
                        was checked against, not that its content is
                        what was checked, that cctool checked it, or
                        that an authorized sender sent it; the graph
                        is public, so anyone who can reach the change
                        channel can compute the digest. A runtime that
                        checks port types, unfed inputs and loops
                        itself still catches a stale, corrupted,
                        forged or tool-faulted change set, refuses it
                        whole and keeps the last consistent graph
                        running.
description:            |
                        Sources: In the cctool-first option the
                        runtime checks only that the change set
                        carries the digest of the graph it runs
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml
                        lines 11-18). The runtime option checks in C++
                        and refuses a failing change set whole
                        (opt_change_set_checked_by_the_runtime.yaml in
                        the same folder, lines 11-19); the both option
                        repeats the checks that keep it safe
                        (opt_change_set_checked_by_both.yaml, lines
                        11-17). The drafted dynamic host checks every
                        edge at wiring time and refuses a mismatch,
                        and rewires only between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 67 and 70-72). The items of the graph
                        carry the public protective mark (the option
                        files in the same folder, line 8), Patrol's
                        graph is to be public too
                        (_sources/cc-patrol-notes/plan.md lines
                        121-122), and the owner ships the whole of
                        _data (owner's statement, 2026-10-22).
                        Patrol's headless configuration puts its user
                        interface on another machine, with a network
                        transport very likely ZeroMQ
                        (_sources/cc-patrol-notes/plan.md lines
                        128-131; execution_levels.md line 126).
                        ASSUMPTION: the digest covers the graph, not
                        the change set's own content; if it covered
                        both, the transit case would fall away but the
                        tool-fault case would remain. ASSUMPTION: an
                        unkeyed digest can be computed by anyone who
                        holds the input; only a keyed MAC or a
                        signature from the checker shows who produced
                        it. ASSUMPTION: cctool does not run on an
                        embedded target. Strength: strong for security
                        at any scale; for reliability and safety it
                        grows with the number of systems and change
                        sets in the field. The security part falls
                        away if the digest is replaced by a signature.

