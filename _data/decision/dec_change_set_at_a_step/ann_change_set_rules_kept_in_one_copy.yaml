title:                  One copy of each graph rule for change sets
brief:                  |
                        The rules a change set must pass (port types,
                        unfed inputs, loops without a feedback edge)
                        already exist once, as clingo rules in cctool.
                        Checking in the runtime, alone or as well,
                        means either taking clingo or another rule
                        library onto every target or writing the rules
                        again in C++ and keeping two copies in two
                        languages in step, with tests that they agree.
                        If port types are compared by layout hash in
                        the engine and by spelling in cctool, which
                        rests on the port types decision, the two
                        copies already disagree on one rule.
description:            |
                        Sources: cctool's checks already hold unknown
                        port, input fed twice, unfed input, port type
                        mismatch and feedforward loop
                        (src/cctool/check/check.lp within
                        unknown_port, input_fed_twice, unfed_input,
                        port_type_mismatch and feedforward_loop).
                        cctool runs them with clingo, a declared
                        dependency (pyproject.toml at
                        project.dependencies), under MIT
                        (_data/decision/dec_license/ann_permissive_dependencies_fit_any_license.yaml).
                        The runtime option checks port types, unfed
                        inputs, loops without a feedback edge and the
                        place of each crossing in C++
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml
                        at brief); the both option repeats a subset
                        (opt_change_set_checked_by_both.yaml at brief,
                        in the same folder). The tooling stays in
                        Python, with clingo for cross-item checks
                        (_data/decision/dec_tooling_language/ruling_tooling_language.yaml;
                        _data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml).
                        cctool compares stated port types for equality
                        (check.lp within port_type_mismatch).
                        ASSUMPTION: an ASP solver is too large to
                        embed in a target with no OS, so in practice
                        the rules would be written twice. Strength:
                        strong; it grows with the number of rules, not
                        of nodes, since every new graph rule is
                        written twice under the two challenged
                        options.

