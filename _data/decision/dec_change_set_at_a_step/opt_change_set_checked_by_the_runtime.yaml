title:                  Checked by the runtime
brief:                  |
                        A change set is applied whole at the start of
                        a step for Kahn parts, and between messages
                        for actor parts, after the runtime checks it
                        in C++: port types, unfed inputs, loops
                        without a feedback edge, and the place of each
                        crossing. A change set that fails is refused
                        whole.

