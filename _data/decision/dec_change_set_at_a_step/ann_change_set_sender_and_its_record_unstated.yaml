title:                  Sender of a change set unstated in every option
brief:                  |
                        None of the three options says who may send a
                        change set. The engine should let a system
                        require an authenticated sender and record
                        which sender's change took effect at which
                        step.
description:            |
                        Sources: The three option briefs state how a
                        change set is checked but not who sends it
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml,
                        opt_change_set_checked_by_the_runtime.yaml and
                        opt_change_set_checked_by_both.yaml, briefs).
                        The drafts leave the configure call open
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 231-232). The security concern asks
                        whether every action can be traced to whoever
                        took it (_data/register/reg_concern.yaml lines
                        163-166). Strength: strong; it does not depend
                        on scale. Of the three, checking in both
                        places comes nearest, since it keeps cctool's
                        full checks before sending and the runtime's
                        checks at the point of use.

