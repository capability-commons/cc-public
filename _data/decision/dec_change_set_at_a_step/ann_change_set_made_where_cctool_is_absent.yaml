title:                  Change sets made where cctool is absent
brief:                  |
                        If the runtime checks a change set, a target
                        can take one made where the Python tooling is
                        absent, such as an embedded target acting on
                        its own, a headless board or another
                        orchestrator joining at run time. If only
                        cctool checks it, every change passes through
                        a Python tool on a development platform first.
                        No Patrol configuration switches by itself
                        today, so the need is future rather than
                        present.
description:            |
                        Sources: The cctool-first option has the
                        runtime check only a digest
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml
                        at title and brief). The tooling stays in
                        Python
                        (_data/decision/dec_tooling_language/ruling_tooling_language.yaml
                        at title and brief), on Linux and macOS
                        development platforms only
                        (_data/decision/dec_supported_dev_platforms/ruling_supported_dev_platforms.yaml
                        at title and brief). The engine is planned for
                        embedded targets (owner's statement,
                        2026-10-21, paraphrased in
                        _sources/context.md), and the owner wants
                        placement to cover systems with no OS (owner's
                        statement, 2026-10-24). Orchestrators of
                        loosely coupled systems connect or disconnect
                        dynamically, and the drafted dynamic host
                        checks every edge at wiring time
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 67 and 174-176). Patrol's fallback to
                        drawn-on video has "No automatic switching for
                        now" (_sources/cc-patrol-notes/draft/README.md
                        lines 86-87). ASSUMPTION: an embedded target
                        runs no Python. ASSUMPTION: under the both
                        option the runtime still applies a change set
                        whose cctool check was made elsewhere and
                        earlier. Strength: weak now, moderate later;
                        it grows with the number of unattended
                        systems, and the porting cost falls only on
                        targets with a dynamic subgraph.

