title:                  Change set generated as the difference between two resolved variants
brief:                  |
                        When the modes a system may switch between are
                        sibling dataflow variants, each resolved and
                        checked ahead of time, a change set is the
                        difference between two resolved dataflow
                        graphs, generated by cctool and pinned to the
                        digest of the graph it leaves. That makes
                        change sets chosen from pre-validated modes
                        concrete, and turns the one change set per
                        variant that the digest form needs into output
                        generated from the variant family, not written
                        and checked by hand.
description:            |
                        Sources:
                        - A variant holds a base and an ordered list
                          of operations, and the resolved graph is
                          derived and checked.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-23)
                        - A change set carrying one graph's digest
                          applies only to systems running exactly that
                          graph, so cctool must check and send one
                          change set per variant.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_pins_one_exact_graph.yaml
                          lines 12-19)
                        - Reconfiguration within a segment should
                          select from a finite set of pre-validated
                          topologies, so the deployed configuration is
                          always one that a safety case covers.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 212-215)
                        - "Change sets chosen from pre-validated
                          modes" is listed as a missing option.
                          (notes/engine-shape-2026-10-24/ruling-guide.md
                          line 79, in the project files)
                        - The Patrol drafts hold five runnable
                          variants of one base, siblings among them.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 24-38)
                        - A change set is the difference between two
                          resolved variants.
                          (_sources/variants-framing.md, section 2)
                        - ASSUMPTION: a tool that takes the difference
                          of two resolved graphs is built; none exists
                          yet. Strength: moderate; it covers switches
                          among modes known in advance, not changes
                          made on the target.

