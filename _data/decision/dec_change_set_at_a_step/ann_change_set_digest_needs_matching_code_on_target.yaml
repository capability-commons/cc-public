title:                  Graph digest computed alike in Python and C++
brief:                  |
                        The cctool-first option moves the shared
                        contract from the rules to the graph's digest:
                        Python and C++ must reduce the running graph
                        to the same canonical form, every field added
                        to the model must be added to both, and the
                        target needs a hash function, written in house
                        or taken from a library. The code is small and
                        fixed, so the cost is modest.
description:            |
                        Sources: The runtime applies only a change set
                        carrying the digest of the graph it was
                        checked against
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml
                        lines 12-18). Graph items are YAML read with
                        ruamel.yaml in Python
                        (_data/decision/dec_first_engine/ann_graph_loading_runtime_needs_a_parser.yaml,
                        which cites pyproject.toml line 48;
                        ruamel.yaml is now at line 49). ASSUMPTION:
                        the runtime holds the graph in its own C++
                        form, so the digest must come from a canonical
                        serialization both sides define. ASSUMPTION: a
                        digest such as SHA-256 is short to implement
                        and public-domain implementations exist.
                        Strength: weak to moderate; one parity test
                        over sample graphs can hold the two reductions
                        together, and the point weakens if the
                        generator emits the digest with the graph and
                        the runtime only carries it forward per
                        applied change set.

