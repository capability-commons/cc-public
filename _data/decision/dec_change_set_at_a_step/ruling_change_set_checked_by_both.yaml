title:                  Change set checked by both
brief:                  |
                        A change set is checked by cctool before it is
                        sent and by the runtime before it is applied
                        at a step. Ruled by WTP on 2026-10-26, as
                        recommended. WTP expects the Python side to
                        transform a change from its canonical form
                        into a materialized form, or a sequence of API
                        calls, that better fits what the C++ runtime
                        can receive.

