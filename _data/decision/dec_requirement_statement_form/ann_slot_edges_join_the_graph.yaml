title:                  Slots that name items join the graph
brief:                  |
                        Slots that name items are edges, so the
                        subject and process of a requirement are part
                        of the traceability graph. A stored sentence
                        names them only in prose.
description:            |
                        r_has_subject, r_has_actor and r_has_process
                        are relations in reg_relation, and each
                        requirement under _data/requirement records
                        them in its relation list (commit 44aa96f). A
                        query or check can follow them like any other
                        edge. A subject named only in a sentence can
                        be found only by reading the sentence.

