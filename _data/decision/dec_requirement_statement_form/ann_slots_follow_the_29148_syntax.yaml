title:                  Slots that follow the 29148 syntax
brief:                  |
                        The slots map onto the parts of the
                        ISO/IEC/IEEE 29148 syntax, so a tool that
                        knows the standard can read them. A free
                        sentence offers no parts to map.
description:            |
                        ISO/IEC/IEEE 29148:2011 clause 5.2.4 gives the
                        syntax [Condition] [Subject] [Action] [Object]
                        [Constraint] with the keywords shall, should,
                        will and may. The fields of sch_requirement
                        are condition, obligation, activity, object
                        and qualifier, beside the subject and process
                        edges.

