title:                  Admission fixed when the gap opens
brief:                  |
                        A run replays only if the set and order of the
                        messages each gap handles are fixed by the
                        graph or recorded. Fixing them when the gap
                        opens leaves one open input, the gap each
                        outside message was admitted by, which a log
                        records cheaply. A time budget makes the set
                        handled depend on how fast the actors ran, so
                        every stopping point must be logged, and a
                        replay on other hardware must follow the log
                        rather than time. Draining until empty fixes
                        the set only if the gap ends.
description:            |
                        Sources:
                        - In Lingua Franca an input port has at most
                          one event at any logical time, and given the
                          declared dependencies any scheduling policy
                          preserves determinism; the time at which an
                          outside event arrives is treated as an input
                          to the program (Lohstroh et al. 2021, Toward
                          a Lingua Franca for deterministic concurrent
                          systems, sections 3.3, 3.6 and 3.8).
                        - Logical event order is part of the semantics
                          rather than something obtained by choosing a
                          thread; a gap needs an admission cutoff, a
                          stable per-source order and a declared
                          tie-break (ChatGPT corpus analysis,
                          A-actors.md section A1, 2026-10-28).
                        - The replay log option records each actor's
                          messages in order and every value from
                          outside.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                          at brief)

