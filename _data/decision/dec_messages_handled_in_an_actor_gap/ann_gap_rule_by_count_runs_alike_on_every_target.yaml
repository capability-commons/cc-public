title:                  Gap rule by message count that runs alike on every target
brief:                  |
                        Admitting the messages waiting when the gap
                        opens needs only a count per mailbox, taken
                        once, so, given the gap that admitted each
                        outside message, the same graph handles the
                        same messages in each gap on an Orin, on a
                        single core with no OS, or in a simulation on
                        a desktop. A time budget needs a fine
                        monotonic clock on each target and can stop
                        only between messages, since a running handler
                        is not interrupted; the set of messages a gap
                        handles then changes with the speed of the
                        target, so a variant tested on one board does
                        not carry its behavior to another. Draining
                        until empty is as portable as the count where
                        it ends.
description:            |
                        Sources:
                        - The engine is a new C++ engine, C++17
                          planned, aimed at embedded reach (WTP,
                          2026-10-28).
                        - Actors between steps need only the engine's
                          own thread of control, so they work on a
                          single core with no OS.
                          (_data/decision/dec_how_actors_are_run/ann_actors_between_steps_need_no_os_threads.yaml
                          at brief)
                        - CAF cannot interrupt running actors (CAF
                          scheduler documentation, as cited in
                          _data/decision/dec_how_actors_are_run/ann_blocked_actor_holds_what_shares_its_thread.yaml
                          at description).
                        - A time budget makes the set handled depend
                          on how fast the actors ran.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_gap_admission_fixed_when_the_gap_opens.yaml
                          at brief)
                        - The flexibility concern asks on which
                          platforms the design runs and what it takes
                          to install on a new one.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question)
                          ASSUMPTION: the engine's handlers run to
                          completion and are not preempted mid-message
                          on any target. Strength: moderate; it
                          matters as soon as a graph is tested on a
                          host and run on a slower or faster target.

