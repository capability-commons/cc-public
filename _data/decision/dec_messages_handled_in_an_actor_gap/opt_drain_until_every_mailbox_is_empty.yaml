title:                  Drain until every mailbox is empty
brief:                  |
                        Each actor handles the messages waiting for
                        it, and the gap continues, in the engine's
                        order, until no actor has a message waiting,
                        including messages that actors sent each other
                        during the gap.
description:            |
                        The reading of the between-steps option as it
                        is worded.

