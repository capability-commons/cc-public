title:                  A step per hop when admission is fixed at the gap start
brief:                  |
                        When a gap handles only the messages waiting
                        as it opens, a message one actor sends to
                        another waits for the next gap, so a chain of
                        k actors takes k steps to pass a message
                        along, and a request and its reply between two
                        actors take two. Draining until empty passes
                        the message along the whole chain in one gap.
                        At Patrol's camera rate of 30 Hz, a step is
                        about 33 ms, so a chain of three actors adds
                        about 100 ms.
description:            |
                        Sources:
                        - Messages that actors send during the gap
                          wait for the next gap.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/opt_messages_waiting_when_the_gap_opens.yaml
                          at brief)
                        - Patrol's Orin configuration holds a 30 Hz
                          camera rate, so one step is about 33 ms.
                          (_data/decision/dec_how_actors_are_run/ann_actor_work_lengthens_every_kahn_step.yaml
                          at description) ASSUMPTION: chains of actors
                          that must answer within one step are rare in
                          the graphs the engine serves; where one is
                          needed, a bounded number of rounds per gap
                          is a middle course.

