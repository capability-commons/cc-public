title:                  Messages handled in an actor gap
brief:                  |
                        Which messages does an actor handle in the gap
                        between two steps, in what order, and when
                        does the gap end?
description:            |
                        Actors run between steps
                        (ruling_actors_between_steps), and the option
                        as worded has each actor drain the messages
                        waiting for it. The literature on
                        deterministic actors makes order part of the
                        semantics rather than a result of running on
                        one thread, so a gap needs a stated admission,
                        order and end; drain-until-empty states none
                        of these when actors message one another
                        within the gap (ChatGPT corpus analysis,
                        A-actors.md section A1, 2026-10-28, after
                        Lohstroh et al. 2021, Toward a Lingua Franca
                        for deterministic concurrent systems).

