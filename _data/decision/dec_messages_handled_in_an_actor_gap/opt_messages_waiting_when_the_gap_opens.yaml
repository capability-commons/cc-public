title:                  Messages waiting when the gap opens
brief:                  |
                        A gap admits the messages waiting when it
                        opens, and only those. Each actor handles them
                        in a fixed order, by source in a declared
                        order and then by arrival sequence within a
                        source. Messages that actors send during the
                        gap wait for the next gap. A message from
                        outside the graph is admitted by the first gap
                        that opens after it arrives, and the replay
                        log records which gap that was.
description:            |
                        Proposed to WTP on 2026-10-28, from the corpus
                        analysis (ChatGPT corpus analysis, A-actors.md
                        section A1, 2026-10-28).

