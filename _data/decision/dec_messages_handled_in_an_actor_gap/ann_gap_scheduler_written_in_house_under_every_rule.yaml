title:                  Gap scheduler written in house under every rule
brief:                  |
                        The ready-made actor runtimes in view, such as
                        CAF, run actors continuously on worker pools
                        and offer none of the three rules, so
                        whichever rule is chosen the engine writes its
                        own gap scheduler and takes no third-party
                        code for it. The options are close to equal
                        here. Admission when the gap opens is the
                        smallest to own, a snapshot of counts and a
                        fixed loop; a time budget adds a dependence on
                        each platform's timer service, a small extra
                        surface per target.
description:            |
                        Sources:
                        - A shared pool is what mature actor
                          frameworks use by default.
                          (_data/decision/dec_how_actors_are_run/ann_actor_code_plainest_on_a_thread_or_pool.yaml
                          at brief)
                        - CAF maps actors onto a pre-dimensioned set
                          of worker threads, with work stealing by
                          default.
                          (_data/decision/dec_how_actors_are_run/ann_many_actors_on_as_many_threads_as_cores.yaml
                          at description)
                        - Ready-made pools carry license and
                          language-level costs to count.
                          (_data/decision/dec_how_actors_are_run/ann_ready_made_actor_pools_license_and_cpp_level.yaml
                          at brief)
                        - Actors run between steps.
                          (_data/decision/dec_how_actors_are_run/ruling_actors_between_steps.yaml
                          at brief)
                        - The C runtime of Lingua Franca, a
                          deterministic reactor runtime, is about
                          2,000 lines and occupies tens of kilobytes
                          for a minimal application (Lohstroh et al.
                          2021, Toward a Lingua Franca for
                          deterministic concurrent systems, section
                          3.1).
                        - The dependency risk concern asks what the
                          design takes from third parties.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question)
                        ASSUMPTION: no ready-made actor runtime offers
                        a gap between steps with a stated admission
                        rule; this generalizes from CAF and has not
                        been surveyed. ASSUMPTION: the platform timer
                        a time budget would read comes from the OS or
                        RTOS of each target, not from the engine.
                        Strength: weak; the difference between options
                        is small, and it is recorded so that the
                        concern has its say.

