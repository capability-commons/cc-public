title:                  Messages waiting when the gap opens
brief:                  |
                        A gap between steps admits only the messages
                        waiting when it opens, in a fixed order, and
                        messages sent during the gap wait for the next
                        gap. Ruled by WTP on 2026-10-28, as
                        recommended.

