title:                  Gap rule that actor authors need not reason about
brief:                  |
                        With admission fixed when the gap opens, an
                        actor author writes a handler for one message
                        and the engine sets the order, so a change to
                        one actor reaches another only through the
                        messages it sends, never through how long its
                        handler runs. Under a time budget, a slower
                        handler in one actor moves the stopping point
                        and so changes what every later actor handles
                        in that gap, which spreads a local change
                        across the region and its tests. Under
                        draining until empty, the authors of actors
                        that message each other must jointly show that
                        their exchange settles, which is reasoning
                        across actors that no single author owns.
description:            |
                        Sources:
                        - In Lingua Franca, given the declared
                          dependencies, any scheduling policy that
                          keeps them preserves determinism, and
                          dependencies are declared rather than
                          inferred from code (Lohstroh et al. 2021,
                          Toward a Lingua Franca for deterministic
                          concurrent systems, section 3.8).
                        - Close coupling makes change more difficult,
                          and nodes should be composed so that they
                          communicate by independent transactions
                          (Kramer and Magee 1990, The evolving
                          philosophers problem, sections on dependent
                          transactions and composition rules).
                        - Two actors that answer each other never
                          leave both mailboxes empty.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_drain_until_empty_may_not_end.yaml
                          at brief)
                        - WTP wants the approach as simple as
                          feasible, avoiding clever mechanisms that
                          burden node authors (WTP, 2026-10-28).
                        - The maintainability concern asks how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question)
                          Strength: strong for the time budget, whose
                          coupling through timing is invisible in the
                          graph; moderate for draining, whose burden
                          falls only on actors that message each other
                          within a gap.

