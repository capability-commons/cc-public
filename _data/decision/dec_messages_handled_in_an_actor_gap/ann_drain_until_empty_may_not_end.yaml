title:                  Drain until empty that may not end
brief:                  |
                        When actors can send each other messages, a
                        gap that drains until every mailbox is empty
                        can go on without limit, as two actors that
                        answer each other never leave both mailboxes
                        empty. The next Kahn step cannot start until
                        the gap ends, so the length of the gap bounds
                        the timing of every node, the safety functions
                        included. Admitting only the messages waiting
                        when the gap opens, or a time budget, gives
                        each gap an end.
description:            |
                        Sources:
                        - Draining until a mailbox is empty needs a
                          termination or work bound when actors can
                          send more messages (ChatGPT corpus analysis,
                          A-actors.md section A1, 2026-10-28).
                        - Lee and Matsikoudis note that a fair
                          execution which produces complete streams
                          may need unbounded memory when outputs are
                          never consumed (Lee and Matsikoudis 2008,
                          The semantics of dataflow with firing).
                        - Actors that run in the gaps between steps
                          add their work to every step's period.
                          (_data/decision/dec_how_actors_are_run/ann_actor_work_lengthens_every_kahn_step.yaml
                          at brief)

