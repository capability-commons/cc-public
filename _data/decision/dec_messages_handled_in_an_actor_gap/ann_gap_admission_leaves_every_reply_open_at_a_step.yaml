title:                  Every reply between actors left open at a step boundary
brief:                  |
                        When a gap admits only the messages waiting as
                        it opens, a request from one actor to another
                        is handled in the next gap at the earliest and
                        its reply in the gap after, so every such
                        request is still open at one step boundary or
                        more. A boundary that follows a request
                        between actors is then not quiescent for them,
                        which makes the open question of swapping an
                        actor with requests outstanding the normal
                        case for actors that talk to each other, and a
                        swap there risks a lost or misdirected reply.
                        Draining until empty, where the gap ends,
                        completes exchanges between engine-run actors
                        within the gap, so the boundary is quiescent
                        for them, as it is for Kahn nodes; only
                        requests to outside services stay open.
description:            |
                        Sources:
                        - Messages that actors send during the gap
                          wait for the next gap.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/opt_messages_waiting_when_the_gap_opens.yaml
                          at brief)
                        - A request and its reply between two actors
                          take two steps when admission is fixed at
                          the gap start.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_admission_at_the_gap_start_adds_a_step_per_hop.yaml
                          at brief)
                        - Draining until empty may not end when actors
                          answer each other.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_drain_until_empty_may_not_end.yaml
                          at brief)
                        - Quiescence of a node means no transaction is
                          in progress at it and none will start
                          (Kramer and Magee 1990, The evolving
                          philosophers problem, section on node
                          quiescence). The part 2 note on that paper
                          applies this to the engine: an actor request
                          and reply that span steps is a dependent
                          transaction still open at the boundary, so
                          the boundary is quiescent for actors only if
                          their exchanges complete inside the gap or
                          the engine waits for them.
                        - The swap decision rests on the step boundary
                          being quiescent, which it is not for an
                          actor whose request and reply span steps.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/dec_swap_of_an_actor_with_outstanding_requests.yaml
                          at description)
                        - A node version is swapped at a step, with
                          its state upgraded.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        Strength: moderate; it weighs as heavily as
                        live swaps of actors are frequent, and a
                        bounded number of rounds per gap would recover
                        most of it for short exchanges.

