title:                  Work in a gap held by a flood of outside messages
brief:                  |
                        A sender outside the graph that floods an
                        actor holds up whatever shares the actor's
                        thread, and between steps that is the next
                        Kahn step. Draining until empty lets messages
                        that arrive during the gap keep it open, so a
                        sustained flood can stall every Kahn node.
                        Admitting only the messages waiting when the
                        gap opens caps a gap at what the bounded
                        mailboxes held at that moment. A time budget
                        caps the gap too, but if each gap starts again
                        at the head of the engine's order, a flooded
                        actor early in that order can spend the budget
                        and starve the actors after it, gap after gap.
description:            |
                        Sources:
                        - An actor that is flooded with messages on
                          purpose holds whatever shares its thread,
                          and between steps it holds up the next Kahn
                          step.
                          (_data/decision/dec_how_actors_are_run/ann_blocked_actor_holds_what_shares_its_thread.yaml
                          at brief)
                        - The drain option continues until no actor
                          has a message waiting.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/opt_drain_until_every_mailbox_is_empty.yaml
                          at brief)
                        - A time budget runs in the engine's order
                          until it is spent, and the messages it did
                          not reach wait for the next gap.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/opt_time_budget_for_each_gap.yaml
                          at brief)
                        - The security concern asks what an attacker
                          can reach. (_data/register/reg_concern.yaml
                          at entries.concern_security.question)
                        - Every producer has a stated maximum data
                          rate, capacity is derived from it, and
                          overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                        ASSUMPTION: an outside sender's messages reach
                        actors through bounded, engine-owned
                        mailboxes, so a flood beyond the stated rate
                        ends in the declared fail-safe rather than
                        unbounded growth. ASSUMPTION: each budgeted
                        gap starts again at the head of the engine's
                        order; the option does not say, and a gap that
                        resumed where the last one stopped would not
                        starve later actors. Strength: moderate; it
                        holds wherever an actor takes input from
                        outside the graph, as Patrol's commands from
                        outside systems may, and weakens if every
                        outside input passes through a gateway node
                        that enforces its stated rate.

