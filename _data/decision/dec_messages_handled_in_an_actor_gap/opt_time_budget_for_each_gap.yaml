title:                  Time budget for each gap
brief:                  |
                        A gap runs in the engine's order until a
                        declared time budget is spent, and the
                        messages it did not reach wait for the next
                        gap. The replay log records where each gap
                        stopped.
description:            |
                        Bounds the gap in time rather than in
                        messages.

