title:                  Title verbs that do not bound change size
brief:                  |
                        The closed list of title verbs is said to make
                        each commit do one thing, but six of the
                        thirteen templates (Split, Fold, Change, Fix,
                        Lock and Merge) have no rule, and nothing
                        limits size. Commits have reached thousands of
                        changed lines.
description:            |
                        _data/register/reg_writing_style_rule.yaml
                        lines 481-483; maintainer's statement
                        2026-10-14T11:18:34Z: "It might be a good
                        thing if it forces more fine-grained commits".
                        _data/schema/sch_commit.yaml lines 56-74 list
                        ten templates and three for the commits git
                        drafts. src/cctool/commit/change.lp lines
                        307-314 have rows only for Add, Remove, Rename
                        and Move, lines 398-400 check Reformat, and
                        Revert and Reapply only lift the alias rule
                        (lines 291-296). No check in src counts the
                        lines or files of a commit. git log
                        --shortstat: 6230e98 changes 28 files (1199
                        insertions, 1110 deletions); 1ba2895 changes
                        48 files (556 lines); 7dda99e, the squashed
                        root, adds 11910 lines.

