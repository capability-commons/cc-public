title:                  Commit title stored twice
brief:                  |
                        The title is written as the git subject line
                        and again as the item title, with a check that
                        the two agree. That is one fact stored twice
                        and kept in step by a rule.
description:            |
                        src/cctool/commit/message.py lines 117-137
                        (compose) and 274-276 (check);
                        _data/schema/sch_commit.yaml lines 22-23. It
                        could be removed by reading the title from the
                        subject line, without changing the rest of the
                        option.

