title:                  Envelope lines in every message
brief:                  |
                        Each message carries an envelope of id, guid,
                        edge and YAML document markers, which a reader
                        of the log reads in every commit though it
                        says nothing about the change. The cost is
                        small and fixed.
description:            |
                        git show -s 89c74d8, where the field was still
                        named relation; message format in the
                        docstring of src/cctool/commit/message.py
                        (lines 19-22) and in compose (lines 120-149),
                        which writes "edge: []". About eight lines per
                        commit: the two markers, two blank lines, id,
                        guid, the title again and the empty edge list.
                        It does not grow the diff a reviewer judges.

