title:                  Commit records kept out of the tree
brief:                  |
                        With the item in the message, the tree does
                        not grow with the number of commits, and all
                        items are read in one git call. A record file
                        per commit in the tree would make every
                        extraction, gate run and change check read one
                        more file for each commit ever made.
description:            |
                        extract walks every file under its root
                        (src/cc_public/graph/extract.py line 201,
                        root.rglob); the change check lays out every
                        file of both trees
                        (src/cc_public/commit/change.py lines
                        129-141). The items of the 33 commits on main
                        are read from one git log call and parsed in
                        0.045 s (0.067 s in the verifier's re-run;
                        src/cc_public/commit/history.py lines 139-148;
                        measured by the performance efficiency
                        advocate, 2026-10-15). 93a1428 caches
                        unchanged documents in memory, keyed by a
                        digest of each file, which softens the parsing
                        cost within one process (such as a history
                        check over many commits) but not across hook
                        runs, not the reading of each file, and not
                        the layout pass. ASSUMPTION:
                        opt_commit_record_in_tree adds one file per
                        commit; no design of it exists. Grows stronger
                        with the number of commits.

