title:                  Commit items not linked into the graph
brief:                  |
                        The commit item is said to be linked like any
                        other item, but no relation allows a commit as
                        source, every commit item has an empty edge
                        list, and a tree text naming a commit id fails
                        the check. So no commit traces by an edge to
                        what called for it.
description:            |
                        _data/register/reg_data_item_type.yaml lines
                        701-704; no relation in reg_relation.yaml has
                        type_commit in its domain; all 33 items on
                        main at 89c74d8 held "relation: []", and the
                        17 since, written after the field was renamed
                        edge, hold "edge: []"; extract.py reads only
                        the tree; check.lp lines 457-472
                        (dangling_mention). Will deferred graph
                        history: "We will probably want
                        graph-changes-over-time history to build a
                        graph-aware-history-aware browser, but that's
                        something for later, not for now" (owner's
                        statement 2026-10-14T12:39:46Z); the
                        per-commit check (7520f91) was built next and
                        graph history deferred (memory MEMORY.md line
                        43). Reading git log into the graph would
                        close the gap without moving the item.
                        ASSUMPTION: that is feasible at the current
                        tooling size.

