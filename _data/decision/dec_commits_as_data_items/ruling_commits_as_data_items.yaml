title:                  Commit item held in the message
brief:                  |
                        Each commit message holds a commit item
                        between the subject line and the trailers, so
                        the hooks and the history check test every
                        commit against the graph before and after it,
                        as the maintainer asked. Free text messages
                        would allow no such check. A record file per
                        commit would make every check read one more
                        file for each commit ever made, and a record
                        written after its commit would leave a window
                        with no record and break on a rewrite. Ruled
                        by William Payne on 2026-10-23.

