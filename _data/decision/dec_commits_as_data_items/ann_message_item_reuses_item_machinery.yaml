title:                  Message item reuses the item machinery
brief:                  |
                        The item in the message adds no new store and
                        no extra commit. It uses the YAML document
                        markers, trait schemas and layout writer of
                        every other item, where a record in the tree
                        would need a second mechanism to record the
                        commit that adds it.
description:            |
                        src/cc_public/commit/message.py lines 75-78
                        and 130-136; src/cc_public/graph/extract.py
                        lines 89-90; _data/schema/sch_commit.yaml
                        lines 18-21 and 40-43;
                        src/cc_public/commit/change.py lines 45-48 and
                        115-122. ASSUMPTION: a tree record needs a
                        following commit per change, or a rule that
                        each commit records its parent. This is
                        reasoning, not a sourced fact.

