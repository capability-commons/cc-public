title:                  Message item that reuses the item machinery
brief:                  |
                        The item in the message adds no new store and
                        no extra commit. It uses the YAML document
                        markers, trait schemas and layout writer of
                        every other item, where a record in the tree
                        would need a second mechanism to record the
                        commit that adds it.
description:            |
                        src/cctool/commit/message.py;
                        src/cctool/graph/extract.py within
                        REGEX_MENTION; _data/schema/sch_commit.yaml at
                        description and allOf;
                        src/cctool/commit/change.py within is_commit
                        and facts_of. ASSUMPTION: a tree record needs
                        a following commit per change, or a rule that
                        each commit records its parent. This is
                        reasoning, not a sourced fact.

