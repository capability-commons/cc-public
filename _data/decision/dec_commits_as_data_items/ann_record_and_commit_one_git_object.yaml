title:                  Record and commit written as one object
brief:                  |
                        With the item in the message, the record of a
                        commit and the commit are one git object, so
                        neither exists without the other. A record in
                        a later commit leaves a window with no record,
                        and a rewrite leaves records naming hashes
                        that main no longer reaches.
description:            |
                        The commit hash is computed over tree,
                        parents, author, committer and message
                        (https://git-scm.com/book/en/v2/Git-Internals-Git-Objects,
                        "Commit Objects"). The history check needs
                        only the message and two trees
                        (src/cc_public/commit/history.py lines
                        97-124). The squash of 2026-10-14 would have
                        left tree records of the 45 old commits
                        pointing at unreachable hashes (owner's
                        statement 2026-10-14T12:26:48Z; memory
                        MEMORY.md line 42). ASSUMPTION: a tree record
                        of commit N sits in commit N+1 or later and
                        names it by hash; no design of that
                        alternative exists.

