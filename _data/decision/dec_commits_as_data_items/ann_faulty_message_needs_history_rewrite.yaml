title:                  Faulty message repaired only by a rewrite
brief:                  |
                        A message cannot change without changing the
                        commit hash, so a commit that reaches the
                        remote with a missing or wrong item is fixed
                        only by rewriting history. The checks that
                        stop such a commit run only on the client.
description:            |
                        Git hooks do not run on rebase or cherry-pick,
                        and a clone may have none
                        (src/cc_public/commit/history.py lines 19-22).
                        The pre-push hook is "the check of record
                        until CI runs it too" (.githooks/pre-push
                        lines 26-28), and the repository has no CI
                        configuration at 89c74d8. Making the old
                        history conform took a squash (owner's
                        statements 2026-10-14T12:26:48Z and
                        2026-10-14T12:31:53Z). ASSUMPTION: a tree
                        record could be corrected by a later ordinary
                        commit.

