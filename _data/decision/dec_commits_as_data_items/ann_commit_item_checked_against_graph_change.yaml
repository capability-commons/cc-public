title:                  Commit item checked against the graph change
brief:                  |
                        The gate checks the commit item against the
                        graph before and after, so the title verb
                        bounds the kind of change and every removed or
                        renamed item is named in the commit that did
                        it. Free text messages give no such check.
description:            |
                        src/cc_public/commit/change.lp lines 121-146
                        (removals and renames must be named), 176-183
                        and 207-219 (verbs that forbid kinds of
                        change); src/cc_public/commit/change.py lines
                        116-122 (ids named in title, brief and
                        description). The commit-msg hook runs the
                        check, and the history check rechecks commits
                        made by rebase or cherry-pick
                        (src/cc_public/commit/history.py lines 18-29).
                        All 33 commits on main at 89c74d8 hold an
                        item. ASSUMPTION: no hook would check a free
                        text message. Merged from the reviewability
                        and traceability advocates.

