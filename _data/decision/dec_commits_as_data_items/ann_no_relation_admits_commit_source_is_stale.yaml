title:                  Commit ends now governed by constraints over roles
brief:                  |
                        ann_commit_items_not_linked_into_graph says no
                        relation allows a commit as source, since none
                        has type_commit in its domain. Relations have
                        no domain now. A source end with no constraint
                        is open to any item, so relation_cites and
                        relation_uses_concept would admit a commit.
                        None reaches a decision, option or ruling.
description:            |
                        The brief of constraint_violation in
                        src/cctool/check/check.lp says "An end that
                        names none is open to any item" (lines
                        1031-1075). In
                        _data/register/reg_relation.yaml,
                        relation_cites (line 861) and
                        relation_uses_concept (line 822) constrain
                        only their target, to rol_proxy and
                        rol_concept. Every other relation constrains
                        its source to a role, and type_commit plays
                        none (reg_data_item_type.yaml at
                        entries.type_commit). Found in the review of
                        2026-10-22.

