title:                  Commit check now laying out only differing files
brief:                  |
                        Commit 5acf7c2 "Change the commit check so
                        that it lays out only files that differ" skips
                        the layout of files that are byte for byte the
                        same. At 360ec14 the layout pass, about half
                        of the measured time, falls away for an
                        ordinary commit; both trees are still copied
                        and extracted whole.
description:            |
                        _changed compares the bytes of each file first
                        and lays out only the files that differ
                        (src/cc_public/commit/change.py lines 129-146
                        at 360ec14). facts_of still extracts both
                        whole trees (lines 115-116), the remainder
                        that ann_change_check_limited_to_changed_files
                        put at 2.1 to 5.1 s per commit. Not
                        re-measured at 360ec14.

