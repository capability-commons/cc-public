title:                  Layout pass limited to changed files
brief:                  |
                        About half of the check time is a layout pass
                        over every file of both trees, which serves
                        only the Reformat rule. Laying out only the
                        files git names as changed gives the same
                        answer seven to ten times faster, so that part
                        of the cost is in the implementation, not the
                        option.
description:            |
                        content_change is used by one rule,
                        reformat_changes_content
                        (src/cc_public/commit/change.lp lines 216-221;
                        set in src/cc_public/commit/change.py line
                        123). Measured by the performance efficiency
                        advocate, 2026-10-15, at 89c74d8, single runs:
                        extracting the graph of HEAD 0.17 s; layout
                        pass over two copies of HEAD 3.35 s; for HEAD
                        against HEAD^, full layout pass 3.81 s, layout
                        of the files named by git diff --name-only
                        0.44 s, same five files found. Re-run by the
                        verifier, 2026-10-15, fresh clone at 89c74d8:
                        full pass 4.03 s and 4.98 s, changed files
                        only 0.40 s and 0.72 s. Of the 32 commits with
                        a parent, the median changes 4 to 5 files
                        (4.5), the largest 48; the root commit
                        adds 78. Timing each stage of the check
                        (verifier, same clone, four runs) put the
                        layout pass at 41 to 63 percent of it; the
                        rest (two archives, message validation, two
                        extracts, one clingo solve) took 2.1 to 5.1 s
                        per commit. That remainder is a fixed cost per
                        commit that free text does not pay.

