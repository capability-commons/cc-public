title:                  Every commit a checkable triple
brief:                  |
                        With commit messages as data items, every
                        commit is a triple of graph before, commit
                        item and graph after, and every part of the
                        history has a parseable message. This is the
                        reason the owner gave.
description:            |
                        Owner's statements. 2026-10-14T07:26:38Z:
                        "We're also going to have git commit messages
                        be data items as well. That means that every
                        commit is a triple:- (graph-before,
                        commit-data-item, graph-after)", with
                        "preconditions? postconditions? that tie the
                        commit data item to the change in the graph".
                        2026-10-13T21:39:30Z: "so then every part of
                        the history will have a parseable commit
                        messages". On the fields,
                        2026-10-14T10:20:31Z, agreeing with the
                        assistant's advice: "remove the failure counts
                        and status. They don't add information". The
                        type_commit note, written by an assistant,
                        adds that the ids "sort by time and are minted
                        without coordination". ASSUMPTION: the reason
                        speaks for traceability, reviewability and
                        simplicity; Will did not name the concerns.

