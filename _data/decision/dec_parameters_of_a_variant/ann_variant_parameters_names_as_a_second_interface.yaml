title:                  Parameter names as a second interface between variants
brief:                  |
                        A declared parameter is a name a parent offers
                        and children or a sweep bind, and that name is
                        not an id, so renaming it means finding every
                        binding by hand. With no Patrol variant
                        needing one, writing leaves out costs little
                        now, and abstract variants already hold what
                        siblings share.
description:            |
                        Sources:
                        - A child variant binds the parameters its
                          parent declares, and a sweep item holds a
                          variant with declared parameters.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml
                          and
                          opt_sweep_items_generate_unstored_variants.yaml,
                          briefs)
                        - The rename command rewrites whole ids in
                          text, not other names.
                          (src/cctool/edit/edit.py within PATTERN_WHOLE_ID and _renamed_documents)
                        - The abstract Orin variant holds the filter
                          and two writes its three children share.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 21-32)
                        - A field is added only when a real instance
                          needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        - ASSUMPTION: parameters would be plain names,
                          not ids with guids. Strength: moderate; it
                          holds until the first sweep.

