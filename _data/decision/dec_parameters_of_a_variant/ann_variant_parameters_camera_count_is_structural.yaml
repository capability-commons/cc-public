title:                  Camera count that changes the structure, not a value
brief:                  |
                        The number of camera inputs WTP named changes
                        how many source nodes and edges a graph holds,
                        and the type of logging sink picks between
                        blocks, so a parameter must drive structure,
                        which a write to an existing address cannot
                        do. A sweep over such a parameter generates
                        [[dataflow variants]] that differ in structure
                        from one definition; with no parameters each
                        count is a leaf written out by hand.
description:            |
                        Sources:
                        - WTP wants parameters on delta modules, such
                          as the number of camera inputs or the type
                          of logging sink (WTP, 2026-10-26).
                          (_data/decision/dec_parameters_of_a_variant/dec_parameters_of_a_variant.yaml
                          at description)
                        - A write sets a value at an address that must
                          already exist.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve)
                        - The earlier annotations held that the first
                          experiment is structural and so needs no
                          parameters, and that a child's write already
                          binds a value.
                          (_data/decision/dec_parameters_of_a_variant/ann_variant_parameters_first_experiment_is_structural.yaml
                          at brief;
                          _data/decision/dec_parameters_of_a_variant/ann_variant_parameters_write_already_binds.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1)
                          Strength: moderate; the structural
                          parameters WTP named are on delta modules,
                          so the sweep option helps here only if it
                          may bind a delta module's parameters, which
                          its wording does not say.

