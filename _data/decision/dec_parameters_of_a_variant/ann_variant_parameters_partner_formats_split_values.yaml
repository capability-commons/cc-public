title:                  Partner formats that keep values apart from structure
brief:                  |
                        SSP keeps parameter values in files apart from
                        the system structure, OpenSCENARIO's
                        distribution file references a scenario and
                        computes values when loaded, and SED-ML has
                        repeated tasks over ranges. Both parameter
                        options give these formats a counterpart; with
                        no parameters each imported value set becomes
                        a written-out variant, and an export loses the
                        split.
description:            |
                        Sources:
                        - An SSP package may hold entries describing
                          parameter values beside the SSD files.
                          (https://ssp-standard.org/docs/2.0,
                          chapter 3)
                        - An OpenSCENARIO file is referenced from the
                          parameter distribution file, values are
                          computed at load time, and a deterministic
                          distribution is a Cartesian product.
                          (https://openscenario.asam.net/ASAM_OpenSCENARIO_XML/latest/09_reuse_mechanisms/09_03_parameter_distribution.html)
                        - SED-ML has repeated tasks with Range and
                          SetValue and is a software-independent
                          format for simulation experiments.
                          (https://sed-ml.org/) Strength: moderate;
                          its weight depends on whether SSP,
                          OpenSCENARIO or SED-ML exchange is built.

