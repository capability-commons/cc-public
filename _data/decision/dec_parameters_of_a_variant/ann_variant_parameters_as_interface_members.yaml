title:                  Parameters declared as members with an id and a guid
brief:                  |
                        An [[interface control document]] already
                        declares settings as members with an id, a
                        guid, a type and a default, so a parameter
                        declared in that form is renamed as any id is
                        and its bindings trace to it. That answers the
                        concern that a parameter name is a second
                        interface found only by hand, for either
                        option that declares parameters, if the
                        declaration takes that form, which neither
                        option says.
description:            |
                        Sources:
                        - A setting of a dataflow step is an interface
                          member, with an id and a guid, a type, and
                          an optional default, as the printer's output
                          setting has.
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.setting;
                          _data/interface_control_document/icd_printer.yaml
                          at
                          surface.step.dataflow_step.settings.output)
                        - The rename command rewrites whole ids in
                          text. (src/cctool/edit/edit.py within
                          PATTERN_WHOLE_ID)
                        - The earlier annotation assumed parameters
                          would be plain names, not ids with guids.
                          (_data/decision/dec_parameters_of_a_variant/ann_variant_parameters_names_as_a_second_interface.yaml
                          at description)
                        - Maintainability asks how far a change in one
                          part spreads to others; traceability asks
                          whether each need can be traced to what
                          meets it. (_data/register/reg_concern.yaml
                          at
                          entries.concern_maintainability.question.1
                          and entries.concern_traceability.question.1)
                          Strength: moderate; it removes the cost of
                          the earlier annotation where parameters take
                          that form, and the same holds for parameters
                          of a delta module.

