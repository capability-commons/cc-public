title:                  Wedge of work items that are never saved as nodes
brief:                  |
                        Houdini's Wedge node makes one work item for
                        each variant, with the varied values as
                        attributes taken from a range or a list of
                        values, which may be sampled at random, and
                        pushes them into node parameters or lets
                        parameters pull them, so the points are never
                        written into the network and each carries the
                        values that made it. A sweep item that
                        generates unstored [[dataflow variants]] does
                        the same; a child per point stores each one,
                        and no parameters means a written leaf for
                        each point.
description:            |
                        Sources:
                        - The Wedge TOP creates "separate work items
                          for each separate variant, with the varied
                          settings stored as attributes", by wedge
                          types such as Range and Value List with an
                          option of random samples, and values are
                          pulled by attribute references in parameter
                          expressions or pushed into a target
                          parameter.
                          (https://www.sidefx.com/docs/houdini/nodes/top/wedge.html)
                        - The decision names Houdini's wedging for
                          running one variant many times with varied
                          values.
                          (_data/decision/dec_parameters_of_a_variant/dec_parameters_of_a_variant.yaml
                          at description)
                        - The sweep option generates one resolved
                          dataflow graph per point without storing the
                          generated variants; the declared option has
                          a child bind the values; with no parameters
                          every leaf is written out.
                          (_data/decision/dec_parameters_of_a_variant/opt_sweep_items_generate_unstored_variants.yaml
                          at brief;
                          _data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml
                          at brief;
                          _data/decision/dec_parameters_of_a_variant/opt_no_variant_parameters.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed is present;
                          traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1
                          and entries.concern_traceability.question.0)
                          Strength: moderate; in Houdini the wedged
                          values land in parameters of nodes, which
                          here are delta modules and settings, so it
                          supports a sweep but not, by itself,
                          parameters on the dataflow variant.

