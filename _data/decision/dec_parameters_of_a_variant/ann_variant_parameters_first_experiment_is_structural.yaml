title:                  A first experiment that is structural, and sweeps that are not
brief:                  |
                        Patrol's first decision compares tracks, video
                        and mixed output, which differ in structure,
                        not in parameter values, so the first instance
                        needs no parameters. A sweep over values does
                        need them; a sweep item keeps the points
                        unstored, as the ruling asks, with each
                        point's binding in its run record, while
                        parameters bound by a child need one stored
                        child per point.
description:            |
                        Sources:
                        - The headless output options are the tracks,
                          video and mixed variants.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34 and 107-109)
                        - Resolved graphs are never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 12-16)
                        - The proposed run record names the bindings
                          of declared parameters.
                          (_sources/survey/simulation-backed-decisions.md
                          line 133)
                        - A child variant binds the declared values.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml,
                          brief) Strength: moderate; stored children
                          per point become untenable at ten times the
                          points.

