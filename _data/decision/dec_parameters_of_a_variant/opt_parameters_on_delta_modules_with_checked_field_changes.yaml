title:                  Parameters on delta modules, field changes as checked change sets
brief:                  |
                        A parameter is declared on the delta module
                        that uses it, with its allowed values, and a
                        variant based on another names the values it
                        overrides. Sweep items generate variants
                        across those values for exploration and are
                        not stored. A value changed by hand on a
                        realized variant in the field is a change set
                        at a step, checked against the declared
                        allowed values, and recorded.
description:            |
                        Combines WTP's two remarks, sweeps for
                        exploration and fiddling with a realized
                        variant manually in the field (WTP,
                        2026-10-27), with the reading for part 2. In
                        DIF (Hsu et al. 2004) a variant based on
                        another is the same topology with some
                        parameters overridden, and each parameter
                        declares its allowed values. Parameterized and
                        scenario-aware dataflow (Bhattacharya and
                        Bhattacharyya 2001; Theelen et al. 2006) allow
                        parameters that change structure or rates only
                        at coarse boundaries, which matches a change
                        set at a step.

