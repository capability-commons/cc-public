title:                  An intent to vary stated in the parent
brief:                  |
                        A declared parameter puts the intent to vary
                        in the parent variant, and each child's
                        binding traces to that declaration, so the
                        reason for the variation is stated once rather
                        than in every child.
description:            |
                        Sources:
                        - A dataflow variant declares parameters that
                          its operations use, and a child binds their
                          values.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml,
                          brief)
                        - Each variant holds its reason in its brief.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 102-103) Strength: moderate; it grows
                          with children that differ only in values.

