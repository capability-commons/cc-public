title:                  Parameters already declared on delta modules
brief:                  |
                        The ruling on the operation vocabulary gives
                        each [[delta module]] declared parameters, so
                        parameters declared on a [[dataflow variant]]
                        as well would be a second place where
                        parameters are declared and bound. A dataflow
                        variant that applies a delta module already
                        binds its parameters, which covers the camera
                        count and the logging sink WTP named, so
                        neither parameter option is needed for them,
                        and the sweep option as worded asks for
                        parameters on the dataflow variant.
description:            |
                        Sources:
                        - The delta module is the one item kind for
                          reuse, a named subgraph of variant
                          operations with declared inputs and
                          parameters, applied like a single variant
                          operation.
                          (_data/decision/dec_vocabulary_of_variant_operations/ruling_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - WTP wants parameters on delta modules, such
                          as the number of camera inputs or the type
                          of logging sink; this decision is about
                          parameters on dataflow variants themselves
                          (WTP, 2026-10-26).
                          (_data/decision/dec_parameters_of_a_variant/dec_parameters_of_a_variant.yaml
                          at description)
                        - The declared option has a dataflow variant
                          declare parameters that a child binds; the
                          sweep option holds a dataflow variant with
                          declared parameters.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml
                          at brief;
                          _data/decision/dec_parameters_of_a_variant/opt_sweep_items_generate_unstored_variants.yaml
                          at brief)
                        - Simplicity asks whether a design does
                          anything another mechanism already does, and
                          counts jobs done by more than one mechanism.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.1 and
                          entries.concern_simplicity.measure.1)
                          Strength: moderate to strong; a parameter
                          that spans several delta modules of one
                          dataflow variant would still want a
                          declaration on the variant, and none is
                          drafted.

