title:                  Parameters of a variant
brief:                  |
                        May a dataflow variant declare parameters that
                        a child or a sweep binds, so that many
                        variants come from one definition?
description:            |
                        Design space exploration and simulation-backed
                        decisions, which the owner named on
                        2026-10-24, call for running one variant many
                        times with varied values, as Houdini's wedging
                        does, while the ruling keeps resolved graphs
                        unstored (_sources/variants-framing.md,
                        sections 3 and 4, Q11).

