title:                  One written leaf per point, against one sweep item
brief:                  |
                        With no parameters, leaves that differ in one
                        value each carry a copy of the shared
                        operations and of one reason, so every change
                        to the shared part touches each copy. A sweep
                        item holds the definition, the values and the
                        reason for the whole range once, and its
                        points are never written, provided the run
                        record and the graph identity carry each
                        point's bindings.
description:            |
                        Sources:
                        - Design space exploration and
                          simulation-backed decisions call for running
                          one variant many times with varied values.
                          (_data/decision/dec_parameters_of_a_variant/dec_parameters_of_a_variant.yaml,
                          description) The owner expects variants to
                          be most useful for rapidly building dataflow
                          simulations that support or oppose
                          simulation-backed decisions. (owner's
                          statement, 2026-10-24T23:00:32Z,
                          _sources/owner-2026-10-24-late.md line 3)
                        - The sweep option generates one resolved
                          graph per point without storing it.
                          (_data/decision/dec_parameters_of_a_variant/opt_sweep_items_generate_unstored_variants.yaml,
                          brief)
                        - Each variant holds its reason in its brief.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 102-103)
                        - The proposed run item records parameter
                          bindings.
                          (_data/decision/dec_shape_of_a_dataflow_run/opt_run_item_in_the_tree.yaml,
                          brief)
                        - Neither input-digest option lists parameter
                          bindings among its inputs.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_digest.yaml
                          and
                          opt_resolved_graph_input_and_content_digests.yaml,
                          briefs)
                        - One maintainability measure counts parts
                          touched by a representative change.
                          (_data/register/reg_concern.yaml at entries.concern_maintainability.measure.1)
                          Strength: weak now, since no sweep exists;
                          strong at ten times the points.

