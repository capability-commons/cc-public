title:                  Scenario parameters varied by name from outside
brief:                  |
                        An OpenSCENARIO parameter distribution
                        references a scenario and binds each
                        distribution to one parameter name, computing
                        the value at load time in place of the
                        scenario's declaration. Parameters declared on
                        a [[dataflow variant]] give such a file a
                        counterpart, one name on the whole system;
                        with parameters only on delta modules, an
                        import must route each scenario name to a
                        binding inside the dataflow variant.
description:            |
                        Sources:
                        - "An ASAM OpenSCENARIO file shall be
                          referenced from the parameter distribution
                          file", "every distribution definition is
                          bound to a single parameterName", and "the
                          actual value is not taken out of the
                          ParameterDeclaration but is computed at load
                          times".
                          (https://openscenario.asam.net/ASAM_OpenSCENARIO_XML/latest/09_reuse_mechanisms/09_03_parameter_distribution.html)
                        - The declared option has a dataflow variant
                          declare parameters that its operations use,
                          and the sweep option holds a dataflow
                          variant with declared parameters and the
                          values to try.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml
                          at brief;
                          _data/decision/dec_parameters_of_a_variant/opt_sweep_items_generate_unstored_variants.yaml
                          at brief)
                        - Compatibility asks whether the design can
                          read and use what a partner produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.1)
                        - ASSUMPTION: an OpenSCENARIO import is built;
                          none is planned. Strength: weak; it depends
                          on such exchange being built, and an import
                          that routes names into delta modules is a
                          small mapping.

