title:                  A child's write that already binds a value
brief:                  |
                        A child variant already binds a value with
                        write, as the abstract Orin variant does for
                        the detector profile, so declared parameters
                        bound by a child would do the same job a
                        second way. A sweep is the one need write
                        cannot meet alone, since it names many values,
                        but a sweep can bind them through write
                        addresses with no declarations; the sweep
                        option as worded requires declared parameters.
description:            |
                        Sources:
                        - Writes in the abstract Orin variant bind a
                          setting and a hostname, and the sketch
                          checks that the address exists.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 26-32;
                          _sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 44-50)
                        - The sweep option holds a dataflow variant
                          with declared parameters.
                          (_data/decision/dec_parameters_of_a_variant/opt_sweep_items_generate_unstored_variants.yaml,
                          brief)
                        - No draft declares a parameter. (the dfv
                          drafts in _sources/cc-patrol-notes/draft/;
                          README.md#what-is-here)
                        - The simplicity measure counts jobs done by
                          more than one mechanism.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.1)
                          Strength: strong on the overlap with write
                          at any scale; moderate on deferring sweeps,
                          which lasts until the first exploration.

