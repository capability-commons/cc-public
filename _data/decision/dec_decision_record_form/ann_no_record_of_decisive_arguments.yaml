title:                  Decisive arguments not recorded
brief:                  |
                        The record shows that each driving concern
                        spoke, but not which arguments decided the
                        matter. Over-representation can be read only
                        from the prose of a ruling.
description:            |
                        Sources: check.lp count a concern as argued if
                        one annotation speaks for it on any
                        alternative. sch_ruling.yaml at description
                        and usage and reg_relation.yaml at
                        entries.relation_realizes and
                        entries.relation_upholds: a ruling links only
                        to the options it upholds or rejects.
                        ruling_cross_item_checks_engine gives its
                        weighing as prose in its brief. concept_ruling
                        speaks of an evaluation for a ranking of
                        concerns (reg_concept.yaml at
                        entries.concept_ruling.brief and
                        entries.concept_ruling.description), but
                        relation_challenges says nothing computes
                        which choice prevails (reg_relation.yaml at
                        entries.relation_supports.edge), and src holds
                        no such code. A rationale field would also
                        hold the weighing as prose, so this qualifies
                        the chosen form rather than favoring another.

