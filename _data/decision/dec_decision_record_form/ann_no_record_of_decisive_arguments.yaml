title:                  Decisive arguments not recorded
brief:                  |
                        The record shows that each driving concern
                        spoke, but not which arguments decided the
                        matter. Over-representation can be read only
                        from the prose of a ruling.
description:            |
                        Sources: check.lp lines 417-435 count a
                        concern as argued if one annotation speaks for
                        it on any alternative. sch_ruling.yaml lines
                        18-28 and reg_relation.yaml lines 358-400: a
                        ruling links only to the options it upholds or
                        rejects. ruling_cross_item_checks_engine gives
                        its weighing as prose in its brief.
                        concept_ruling speaks of an evaluation for a
                        ranking of concerns (reg_concept.yaml lines
                        509-517), but r_challenges says nothing
                        computes which choice prevails
                        (reg_relation.yaml lines 223-226), and src
                        holds no such code. A rationale field would
                        also hold the weighing as prose, so this
                        qualifies the chosen form rather than
                        favouring another.

