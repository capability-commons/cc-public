title:                  Small decision argued over by annotations
brief:                  |
                        The argument trace the maintainer asked for
                        weighed most: only this form gives each reason
                        its own edges to an option and a concern, so a
                        check finds a driving concern that no reason
                        argues. The cost accepted is the volume of
                        argument to review, which the advocate process
                        sets, since the form asks only one argument
                        for each driver. Ruled by WTP on 2026-10-23.

