title:                  Reasons as edges to an option and a concern
brief:                  |
                        Each reason is its own annotation with typed
                        edges to its option and its concern, so a
                        check finds a reason with no concern and a
                        driving concern that no reason speaks for.
description:            |
                        Sources: relation_supports,
                        relation_challenges and
                        relation_speaks_for_concern in
                        _data/register/reg_relation.yaml at entries.
                        check.lp within argument_across_decisions
                        reports an argument that names no concern;
                        check.lp within satisfies (unargued_driver)
                        report a ruling made while a driving concern
                        is unargued; check.lp within
                        constraint_violation count an annotation as
                        practical only when it bears on a type_option.
                        sch_option.yaml at description: the rationale
                        is the set of annotations, not a field. The
                        checks are joins over edges, so they hold the
                        same at ten times the graph. This gives the
                        under-represented half of the maintainer's
                        aim.

