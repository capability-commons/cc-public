title:                  Reasons as edges to an option and a concern
brief:                  |
                        Each reason is its own annotation with typed
                        edges to its option and its concern, so a
                        check finds a reason with no concern and a
                        driving concern that no reason speaks for.
description:            |
                        Sources: r_supports, r_challenges and
                        r_speaks_for_concern in
                        _data/register/reg_relation.yaml lines 177-236
                        and 277-320. check.lp line 574 reports an
                        argument that names no concern; check.lp lines
                        438-455 (unargued_driver) report a ruling made
                        while a driving concern is unargued; check.lp
                        lines 550-563 count an annotation as practical
                        only when it bears on a type_option.
                        sch_option.yaml lines 27-31: the rationale is
                        the set of annotations, not a field. The
                        checks are joins over edges, so they hold the
                        same at ten times the graph. This gives the
                        under-represented half of the owner's aim.

