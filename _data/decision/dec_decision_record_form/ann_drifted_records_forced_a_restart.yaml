title:                  Rework cost of drifted records
brief:                  |
                        The legacy tree recorded 132 decisions as
                        engineering documents that drifted from the
                        code, and the tree was restarted. In the
                        chosen form a stale reason is challenged by a
                        new annotation, not by rewriting the record.
description:            |
                        Sources: cc-folder-layout.md line 12 (132
                        records over 248 commits);
                        cc-public-design-principles.md line 25 (drift
                        as a reason for the restart);
                        ann_gate_takes_a_minute lines 17-20 (a later
                        measurement challenges a condition).
                        ASSUMPTION: the rationale held in the record
                        is what made the records drift; the notes say
                        they drifted but not why.

