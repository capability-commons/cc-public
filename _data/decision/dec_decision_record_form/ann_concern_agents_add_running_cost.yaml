title:                  Running cost of concern agents
brief:                  |
                        The chosen form is meant to be filled by one
                        agent per concern for each decision, which
                        adds a running cost per decision that a single
                        written record does not have.
description:            |
                        Sources: owner's statement,
                        2026-10-13T16:42:36Z (arguments made by
                        agents). The advocate process runs one
                        advocate per driver concern, five for
                        lco_argumentation, plus merger and verifier
                        steps (pd templates). Runs grow with decisions
                        times concerns. The advocate pilot recorded
                        about 30 seconds per advocate and judged the
                        cost small, with review the limit
                        (advocate-pilot-tooling-language.md line 49);
                        no money figure is recorded. ASSUMPTION: each
                        run costs model usage at about the same rate.

