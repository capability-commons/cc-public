title:                  No trace from an option to what builds it
brief:                  |
                        The chosen form traces an option back to its
                        reasons, but no edge links an option to the
                        element that carries it out. An upheld option
                        that nothing builds is not found.
description:            |
                        Sources: none of the 35 relations in
                        _data/register/reg_relation.yaml runs from a
                        schema, module or other element to an option
                        or ruling. relation_realizes runs from an
                        implementation to a design entity (lines
                        372-407), a role that logical components,
                        interface control documents and interface
                        members play (reg_data_item_type.yaml at
                        entries.type_ruling.usage,
                        entries.type_interface_member.brief and
                        entries.type_dataflow_graph.description), and
                        decisions are about logical components
                        (check.lp within
                        decision_about_non_component). No rule in
                        check.lp joins relation_upholds with
                        relation_realizes. In legacy, "20 decision
                        records decided tools that were never built"
                        (cc-public-session-context.md lines 61-63).
                        The other two alternatives share the gap. The
                        gap grows as one component gathers many
                        decisions.

