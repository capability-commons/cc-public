title:                  No trace from an option to what builds it
brief:                  |
                        The chosen form traces an option back to its
                        reasons, but no edge links an option to the
                        element that carries it out. An upheld option
                        that nothing builds is not found.
description:            |
                        Sources: none of the thirteen relations in
                        _data/register/reg_relation.yaml runs from a
                        schema, module or other element to an option
                        or ruling. r_realizes runs only to a logical
                        component (lines 325-356), and decisions are
                        about logical components. No rule in check.lp
                        joins r_upholds with r_realizes. In legacy,
                        "20 decision records decided tools that were
                        never built" (cc-public-session-context.md
                        lines 61-63). The other two alternatives share
                        the gap. The gap grows as one component
                        gathers many decisions.

