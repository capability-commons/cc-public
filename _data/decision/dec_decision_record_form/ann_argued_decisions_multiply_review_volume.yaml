title:                  Volume of deliberation per decision
brief:                  |
                        An argued decision costs hundreds of lines of
                        mostly agent-written YAML for one person to
                        write and review. When every decision is
                        argued, the deliberations become the largest
                        part of the graph.
description:            |
                        Sources: at 89c74d8 the two argued decisions
                        held 37 of the 75 files and 1211 of the 6457
                        lines under _data; an option was 21 or 22
                        lines, an annotation about 35 lines with a
                        brief of about 4. On the snapshot at e3a198e5
                        the 130 decision folders hold 1986 of the 2141
                        YAML files and 87950 of the 105301 lines under
                        _data; an option averages 22 lines and an
                        annotation 52 (find and wc -l over
                        _data/decision). The first 25 past-decision
                        batches total about 8500 lines, about 340 per
                        decision, of 68 past decisions in all. WTP
                        reviews them in batches of five (maintainer's
                        statement, 2026-10-14) and calls the review
                        burden "huge (and practically impossible)"
                        (2026-10-15). The advocate pilot found review
                        took longer than production
                        (advocate-pilot-tooling-language.md line 49).
                        The legacy backlog "grew faster than WTP could
                        read it" (cc-public-session-context.md line
                        87). The schema requires no annotation on an
                        option, but unargued_driver refuses a ruling
                        that upholds an option unless every driving
                        concern has at least one argument on it or an
                        alternative (check.lp within
                        decision_about_non_component and
                        argument_across_decisions); the rest of the
                        volume comes from the advocate process.
                        ASSUMPTION: review effort grows with lines
                        reviewed.

