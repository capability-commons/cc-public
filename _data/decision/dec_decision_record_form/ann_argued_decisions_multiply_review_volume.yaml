title:                  Volume of deliberation per decision
brief:                  |
                        An argued decision costs hundreds of lines of
                        mostly agent-written YAML for one person to
                        write and review. When every decision is
                        argued, the deliberations become the largest
                        part of the graph.
description:            |
                        Sources: the two argued decisions at HEAD
                        89c74d8 hold 37 of the 75 files and 1211 of
                        the 6457 lines under _data; an option is 21 or
                        22 lines, an annotation about 35 lines with a
                        brief of about 4. The first 25 past-decision
                        batches total about 8500 lines, about 340 per
                        decision, of 68 past decisions in all. Will
                        reviews them in batches of five (owner's
                        statement, 2026-10-14T23:39:41Z). The advocate
                        pilot found review took longer than production
                        (advocate-pilot-tooling-language.md line 49).
                        The legacy backlog "grew faster than Will
                        could read it" (cc-public-session-context.md
                        line 87). The schema requires no annotation on
                        an option, but a ruling is reported by
                        unargued_driver unless every driving concern
                        has at least one argument on the decision
                        (check.lp lines 438-453); the rest of the
                        volume comes from the advocate process.
                        ASSUMPTION: review effort grows with lines
                        reviewed.

