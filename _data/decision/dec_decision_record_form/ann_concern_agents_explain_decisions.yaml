title:                  Argument trace by concern agents
brief:                  |
                        Agents that each speak for one concern argue
                        over a decision, and the trace explains why it
                        was made. If it proves wrong, the trace shows
                        which concern was under- or over-represented.
description:            |
                        Owner's statement, 2026-10-13T16:42:36Z, in
                        answer to his own question at 16:20:37Z; "Yes
                        please. Let's do it." at 16:47:50Z was
                        followed by the annotation type with
                        r_supports and r_challenges (ae6eeff, 16:58).
                        The statement opens "I had annotations in
                        mind", so the reason was given for annotations
                        and does not by itself choose a separate
                        option type. The option type came later: Will
                        asked "Have we got a design decision data item
                        yet? Is it time to add it?" at 19:57:52Z and
                        said "OK. Go ahead." at 19:59:09Z, and fb5566b
                        followed at 20:00:56Z (pre-squash)
                        (will-messages.md). The session notes also say
                        the legacy decision records drifted from the
                        code (cc-public- session-context.md line 87).

