title:                  Argument trace by concern agents
brief:                  |
                        Agents that each speak for one concern argue
                        over a decision, and the trace explains why it
                        was made. If it proves wrong, the trace shows
                        which concern was under- or over-represented.
description:            |
                        Maintainer's statement, 2026-10-13, in answer
                        to his own question; "Yes please. Let's do
                        it." was followed by the annotation type with
                        relation_supports and relation_challenges
                        (ae6eeff). The statement opens "I had
                        annotations in mind", so the reason was given
                        for annotations and does not by itself choose
                        a separate option type. The option type came
                        later: WTP asked "Have we got a design
                        decision data item yet? Is it time to add it?"
                        and said "OK. Go ahead.", and fb5566b followed
                        (pre-squash) (will-messages.md). The session
                        notes also say the legacy decision records
                        drifted from the code (cc-public-
                        session-context.md line 87).

