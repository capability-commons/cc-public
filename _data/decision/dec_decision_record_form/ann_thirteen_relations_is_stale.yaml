title:                  Thirty-one relations, realizes reaching interfaces too
brief:                  |
                        ann_no_edge_from_element_to_option counts
                        thirteen relations and says relation_realizes
                        runs only to a logical component. There are
                        now 31 relations, and relation_realizes also
                        reaches interface control documents and their
                        members. Still no relation runs from an
                        element to an option or ruling.
description:            |
                        _data/register/reg_relation.yaml holds 31
                        relations. relation_realizes (line 357)
                        constrains its target to
                        relcon_is_design_entity, a role that
                        type_logical_component,
                        type_interface_control_document and
                        type_interface_member play. The tree holds 11
                        relation_realizes edges: pyp_cc_public to
                        lco_tooling, seven in
                        src/cc_public/check/check.py to icm_ members,
                        and three in
                        _data/dataflow_graph/dfg_stableflow_smoketest.yaml
                        to icd_ items. The relations that can reach an
                        option take as source an annotation, a
                        decision, a ruling or an option, or, for
                        relation_supersedes, an item of the same type,
                        so none runs from an implementing item to an
                        option or ruling. Found in the review of
                        2026-10-22.

