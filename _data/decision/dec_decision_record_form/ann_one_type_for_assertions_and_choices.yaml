title:                  One type for assertions and choices
brief:                  |
                        Recording a decision as an annotation saves
                        one type, but the annotation type would then
                        hold both assertions and choices. Rules that
                        tell the two apart would need a new field or
                        edge pattern in place of the saved type.
description:            |
                        Sources: reg_data_item_type.yaml lines 391-393
                        and 408-413; sch_annotation.yaml lines 14-16
                        and 27-31 (one assertion, role carried by
                        edges); reg_relation.yaml lines 290-297 (a
                        practical annotation must name a concern);
                        r_upholds, r_rejects and r_is_option_for take
                        an option (lines 370-374, 397-401, 457-461).
                        The owner first had annotations in mind for
                        decisions, then agreed to the separate form
                        (owner's statements, 2026-10-13T16:20:37Z,
                        16:42:36Z, 19:57:52Z and 19:59:09Z).

