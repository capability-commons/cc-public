title:                  Small decision argued over by annotations
brief:                  |
                        Record a decision as a small item whose brief
                        asks the question, each option as a small item
                        whose brief states one answer, and the outcome
                        as a ruling that upholds or rejects options.
                        The rationale is the annotations that support
                        or challenge the options, each speaking for a
                        concern; no item has a rationale, options or
                        status field.

