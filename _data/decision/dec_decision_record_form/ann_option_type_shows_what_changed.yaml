title:                  Visible change of choice in a diff
brief:                  |
                        With a separate option type, a reviewer sees
                        from the id prefix whether a change alters
                        what was chosen or only argues about it. As an
                        annotation, the two look alike.
description:            |
                        Sources: cc-public-design-principles.md line
                        15 (type prefix visible by inspection); ann
                        and opt prefixes on the files of
                        dec_cross_item_checks_engine;
                        sch_annotation.yaml lines 27-31 (role carried
                        only by edges). A modest point: a reviewer can
                        still read the edges.

