title:                  Four types and eight relations per decision
brief:                  |
                        Recording and settling one decision uses four
                        item types and eight relations, where a single
                        record would be one type. Five of the twelve
                        came in after the choice, in later commits.
description:            |
                        Sources: fb5566b added type_option and
                        relation_supersedes and widened three
                        relations; 44034ef removed the status field
                        the same day; 7db4229 added type_ruling,
                        relation_upholds and relation_rejects; 52e3e6d
                        added type_decision and relation_is_option_for
                        (2026-10-14). type_annotation,
                        relation_is_about, relation_supports,
                        relation_challenges and
                        relation_speaks_for_concern came before the
                        choice (ae6eeff, a6996e8). The count does not
                        grow with the graph. A per-concern trace needs
                        separate arguments in any form, so the point
                        is that the cost was not visible when chosen.
                        ASSUMPTION: a record with rationale, options
                        and status fields needs one type and at most
                        relation_supersedes.

