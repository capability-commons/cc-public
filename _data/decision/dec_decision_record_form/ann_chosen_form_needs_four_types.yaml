title:                  Four types and eight relations per decision
brief:                  |
                        Recording and settling one decision uses four
                        item types and eight relations, where a single
                        record would be one type. Five of the twelve
                        came in after the choice, in later commits.
description:            |
                        Sources: fb5566b added t_option and
                        r_supersedes and widened three relations;
                        44034ef removed the status field the same day;
                        7db4229 added t_determination, r_upholds and
                        r_rejects; 52e3e6d added t_decision and
                        r_is_option_for (2026-10-14). t_annotation,
                        r_is_about, r_supports, r_challenges and
                        r_argues_for_concern came before the choice
                        (ae6eeff, a6996e8). The count does not grow
                        with the graph. A per-concern trace needs
                        separate arguments in any form, so the point
                        is that the cost was not visible when chosen.
                        ASSUMPTION: a record with rationale, options
                        and status fields needs one type and at most
                        r_supersedes.

