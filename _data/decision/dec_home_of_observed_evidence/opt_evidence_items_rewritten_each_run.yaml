title:                  Evidence items rewritten each run
brief:                  |
                        Each observer, such as the test runner, keeps
                        one evidence item in _data. A run replaces the
                        rows it observed and keeps the others, and the
                        item is committed with the work, so its
                        history is in git. The checks read the rows as
                        they read any item.

