title:                  Recoverable local evidence without commit churn
brief:                  |
                        A local store keyed by a digest of what was
                        observed loses nothing that a rerun cannot
                        rebuild, and a damaged file reads as absent
                        rather than as wrong. Evidence items rewritten
                        and committed on each run put a changing file
                        into every commit of every worktree, which
                        turns parallel work into repeated conflicts on
                        one file.
description:            |
                        Sources:
                        - The existing check store writes each file to
                          a temporary file and then renames it into
                          place, so a run stopped while writing leaves
                          the old file whole
                          [src/cctool/check/store.py at function
                          save].
                        - The existing check store returns nothing
                          when its file cannot be read or was written
                          by other code, so a damaged store is treated
                          as an empty one [src/cctool/check/store.py
                          at function load].
                        - The timing log skips a line that is not
                          whole, as a run stopped while writing would
                          leave [src/cctool/gate/timing.py at function
                          read].
                        - Observations of the commit-gate tests can be
                          produced again by running them, which took
                          209 s in the container [measured by Claude
                          in the cloud container, 2026-10-26].
                        - Several agents work at once, each in its own
                          worktree and branch, and each branch is
                          rebased on dev before it lands [AGENTS.md at
                          section Working beside other agents].
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (September's tree dirty after every run).
                        - Rows keyed by a digest of content avoid the
                          circle in which evidence committed after a
                          run names a commit that does not contain it
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at rationale].
                        - ASSUMPTION: two branches that each commit a
                          rewrite of the same evidence item conflict
                          on rebase whenever both ran tests. Strength:
                          strong for development runs. It holds at ten
                          times the size, since a rerun stays the
                          recovery path and the number of worktrees,
                          and so of conflicts, grows with the work.
                          Overnight results are the exception, because
                          a lost overnight run costs a night to redo.

