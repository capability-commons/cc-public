title:                  Silence when the evidence store is missing
brief:                  |
                        As written, the local store option lets the
                        rules stay silent when there is no store, so a
                        fresh clone or a new session reports the same
                        as a tree whose tests all passed. The option
                        is safe only if a missing or empty store is
                        itself reported, as September made absent
                        evidence critical in a closed world. Kept only
                        for governed runs, evidence is immutable and
                        cannot be damaged, but it is stale between
                        those runs by construction.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (rules silent with no store).
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (stores in the shared git directory).
                        - The gate of a push uses no check store and
                          finds every verdict afresh
                          [src/cctool/check/store.py at module
                          docstring].
                        - September's evidence check made absent
                          evidence, or evidence observed and not a
                          pass, critical in a closed world and
                          advisory in an open one
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at decision].
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (only a digest and counts at release).
                        - September kept immutable execution items
                          only for governed runs, because a record
                          that can be edited is not a record of what
                          happened
                          [origin/main:ddr/ddr_test_execution.yaml at
                          rationale].
                        - Also rests on a source stated once in
                          ann_governed_run_items_accumulate_in_the_tree
                          (nothing newer than the last governed run).
                          Strength: strong as a condition on the local
                          store rather than as a reason to reject it.
                          It grows with size, since more machines and
                          sessions mean more trees that start with no
                          store.

