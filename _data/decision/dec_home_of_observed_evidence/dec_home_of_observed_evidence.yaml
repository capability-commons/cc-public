title:                  Home of observed test evidence
brief:                  |
                        Where are the results, coverage and profiles
                        that a test run observes kept, and how do the
                        checks read them?
description:            |
                        WTP asked on 2026-10-25 that test cases, test
                        results, code coverage and runtime profiles
                        become part of the graph, linked through tests
                        to requirements and interface control
                        documents, and checked by rules over the
                        graph. What a run observes changes on every
                        run, while what people declare changes when
                        someone changes their mind. September kept an
                        evidence item per observer in the tree and
                        rewrote its rows on each run. The gate already
                        keeps a timing log and a check store in the
                        git directory, which every worktree shares and
                        no commit records.

