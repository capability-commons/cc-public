title:                  Release claims traceable to per-requirement observations
brief:                  |
                        A release should be traceable from the
                        committed graph to the observation of each
                        requirement it was gated on. A local store
                        that leaves only a digest and counts in the
                        release cannot be followed from another
                        machine to which requirement passed. An
                        execution item kept per governed run can.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (local store commits only a digest and
                          counts).
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (git directory recorded by no commit).
                        - Also rests on a source stated once in
                          ann_local_evidence_store_follows_existing_stores
                          (governed runs write unchanging items).
                        - September left open whether a release should
                          keep the evidence it shipped with as an item
                          of its own, because the rewritten item loses
                          the observation the release rested on to git
                          alone
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at question history].
                        - WTP asked that test results be part of the
                          graph and linked through test cases to
                          requirements and interface control documents
                          [owner's statement, 2026-10-25]. Strength:
                          Strong for the release trace, weak for the
                          trace during development, where the local
                          store keeps rules current at every run. It
                          holds at ten times the size, since the gap
                          is per requirement and grows with their
                          number. A local store whose release snapshot
                          held a row per requirement would meet it
                          too.

