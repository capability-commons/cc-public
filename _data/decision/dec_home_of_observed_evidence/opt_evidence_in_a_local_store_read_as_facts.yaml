title:                  Local evidence store read as facts
brief:                  |
                        A run writes its rows to a store in the git
                        directory, beside the timing log and the check
                        store, keyed by a digest of what was observed.
                        The extractor loads the current rows as base
                        relations, so the rules see them beside the
                        items. Nothing observed is committed, except
                        that a release records a digest and counts of
                        the evidence it was gated on. With no store,
                        the rules that need observations stay silent.

