title:                  Local evidence store read as facts
brief:                  |
                        A run writes what it observed to a local store
                        in the git directory, and the extractor loads
                        the current rows as facts for the rules;
                        nothing observed is committed, except that a
                        release records a digest and counts of the
                        evidence it was gated on. Evidence items
                        rewritten each run, and evidence kept only for
                        governed runs, are rejected. Ruled by WTP on
                        2026-10-29.

