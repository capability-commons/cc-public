title:                  Evidence store as a third git directory store
brief:                  |
                        A local evidence store follows two mechanisms
                        the gate already has: the timing log and the
                        check store, both in the shared git directory.
                        Rewritten items need a pruning rule September
                        never settled, and governed runs add an item
                        per run and a rule to pick the latest.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (the two stores in the git directory).
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (September's unsettled pruning).
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (an item per run grows the tree).
                        - The governed run option writes an execution
                          item that is not changed once committed and
                          has the checks read the latest one
                          [_data/decision/dec_home_of_observed_evidence/opt_evidence_kept_only_for_governed_runs.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (digest and counts at release).
                        - The rewritten item option needs no new read
                          path, since the checks read its rows as they
                          read any item
                          [_data/decision/dec_home_of_observed_evidence/opt_evidence_items_rewritten_each_run.yaml
                          at brief]. Strength: moderate. The rewritten
                          item has the fewest read paths, which is its
                          real merit. It pays for that with a pruning
                          rule and a dirty tree after every run. The
                          local store adds one loader and one release
                          record, and both follow a pattern the gate
                          already uses twice. The count does not
                          change at ten times the size.

