title:                  Immutable run items that pile up in the tree
brief:                  |
                        An execution item that is never changed once
                        committed adds one item to the tree for every
                        governed run. With an overnight review every
                        day, the tree gains hundreds of items a year
                        that nobody edits and every load of the tree
                        reads.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_local_evidence_store_follows_existing_stores
                          (governed runs write unchanging items).
                        - Also rests on a source stated once in
                          ann_rewritten_evidence_rides_in_every_commit
                          (daily review at 03:00 UTC).
                        - September kept only governed runs as items
                          because a permanent item per development run
                          fills the repository with history nobody
                          reads
                          [origin/main:ddr/ddr_test_execution.yaml at
                          rationale].
                        - Between governed runs the graph holds no
                          observation newer than the last of them
                          [_data/decision/dec_home_of_observed_evidence/opt_evidence_kept_only_for_governed_runs.yaml
                          at brief]. Strength: Moderate. One item per
                          release is cheap to keep. One item per night
                          is about 365 items a year, since the option
                          names the overnight review as a governed run
                          and that review runs daily
                          [_data/decision/dec_home_of_observed_evidence/opt_evidence_kept_only_for_governed_runs.yaml
                          at brief,
                          _data/decision/dec_where_test_evidence_is_measured/dec_where_test_evidence_is_measured.yaml
                          at description]. At ten times the cadence
                          the same argument September made against
                          items per run applies. The weakness is that
                          a release snapshot is wanted anyway, and the
                          store option also records a digest and
                          counts at release.

