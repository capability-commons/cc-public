title:                  Evidence kept only for governed runs
brief:                  |
                        A development run writes nothing. A governed
                        run, such as the release gate or the overnight
                        review, writes an execution item to _data that
                        is not changed once committed, and the checks
                        read the latest one. Between governed runs the
                        graph holds no observation newer than the last
                        of them.

