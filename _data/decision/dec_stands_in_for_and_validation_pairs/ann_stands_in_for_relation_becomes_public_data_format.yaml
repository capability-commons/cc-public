title:                  A relation added now as a member of the public data format
brief:                  |
                        The data format is public, so a stands-in-for
                        relation added now is a member that peers may
                        write against. After 1.0, narrowing what it
                        means or removing it would be a breaking
                        change that waits for a major release.
                        Deferring the relation until a second decision
                        reuses a simulation variant lets its meaning
                        be settled on a real case before peers depend
                        on it. Before 1.0 the cost of changing it is
                        low, so the gain from deferring is modest.
description:            |
                        Sources:
                        - The data format is public, and after 1.0 a
                          schema change that can reject a document the
                          previous release accepted is breaking.
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml
                          at brief)
                        - After 1.0, breaking work collects until a
                          major release, and 1.0 is likely to be six
                          months or more away.
                          (_data/decision/dec_breaking_work_after_version_one/ruling_breaking_work_after_version_one.yaml
                          at brief)
                        - The relation option adds a relation saying
                          that a simulation variant stands in for a
                          deployment variant, with validation pairs.
                          (_data/decision/dec_stands_in_for_and_validation_pairs/opt_stands_in_for_relation_with_validation_pairs.yaml
                          at brief)
                        - Assumption: a relation entry in the register
                          is part of the data format that peers use.
                          Strength: weak before 1.0, moderate after
                          it.

