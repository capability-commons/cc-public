title:                  Runs made before the first reuse
brief:                  |
                        Deferring until a second decision reuses a
                        simulation variant leaves the runs made before
                        then with no recorded target. The replay
                        variant's reason, parity with the detector
                        dump, is stated only in its brief.
description:            |
                        Sources:
                        - The replay variant's reason is parity with
                          the detector dump,
                          stated only in its brief.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines
                          13-17)
                        - Nothing is recorded until a second decision
                          reuses one simulation
                          variant. (the deferral option, brief)
                        Strength: moderate; a relation can be added
                        later, but runs already cited then trace to
                        nothing.

