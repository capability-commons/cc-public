title:                  Replay that runs the Legion analysis settings
brief:                  |
                        Replay leaves the analysis profile at the
                        base's console value, which only Legion keeps,
                        while the Orin variants write leaner. With a
                        shared base alone, or with nothing recorded
                        yet, replay evidence about analysis could be
                        read as holding for the Orin, where it does
                        not. A stands-in-for relation states which
                        variant replay models, and the base's
                        recorder, kept by the deployment variants,
                        could supply the recorded input a validation
                        pair needs.
description:            |
                        Sources:
                        - The base gives the analysis profile console.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml lines 223-232)
                        - The abstract Orin variant writes the
                          analysis profile leaner, and
                          Legion writes nothing.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml lines 30-32;
                          _sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml lines 19-25)
                        - Replay writes no analysis setting.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines
                          18-63)
                        - The recorder keeps the camera's encoded
                          stream.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml lines 251-255)
                        - The recorder carries no tag and is in every
                          resolved deployment
                          variant; replay keeps only analysis.
                          (_sources/cc-patrol-notes/draft/resolved.txt lines 2, 5, 8 and
                          12; _sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines
                          25-26)
                        - A validation pair is two runs on one
                          recorded input, one through
                          each variant. (the stands-in-for option, brief)
                        Strength: strong; mismatched settings multiply
                        with deployment variants.

