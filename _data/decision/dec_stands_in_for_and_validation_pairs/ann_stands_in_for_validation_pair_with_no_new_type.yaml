title:                  A validation pair with no new item type
brief:                  |
                        A stands-in-for relation is one register
                        entry. A validation pair is two runs and a
                        comparison, and it needs no new type if it is
                        two run items and an annotation that measures
                        how alike they are.
description:            |
                        Sources:
                        - A validation pair is two runs on the same
                          recorded input with a
                          measure of likeness. (the stands-in-for option, brief)
                        - A type, relation, field or command is added
                          only when a real
                          instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        Strength: moderate; the support holds only if
                        the pair is not an item of its own, which the
                        option does not say.

