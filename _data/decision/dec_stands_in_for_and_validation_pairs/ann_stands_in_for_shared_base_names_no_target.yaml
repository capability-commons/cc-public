title:                  A shared base that every Patrol variant has
brief:                  |
                        Every Patrol variant, replay and deployment
                        alike, descends from one base, so a shared
                        base cannot say which deployment variant a
                        simulation variant stands in for, and links
                        every variant of that base alike. A relation
                        names the target, and lets a query list the
                        simulation variants to revisit when a
                        deployment variant changes.
description:            |
                        Sources:
                        - The replay, Legion and Orin variants all
                          name the Patrol base as
                          their base. (_sources/cc-patrol-notes/draft/README.md lines 26-34)
                        - In Patrol, one base holds every platform and
                          mode.
                          (_sources/cc-patrol-notes/variants.md lines 118-122)
                        - A relation says that a simulation variant
                          stands in for a
                          deployment variant. (the stands-in-for option, brief)
                        Strength: strong against a shared base at any
                        scale, since a superset base is the root of
                        every variant.

