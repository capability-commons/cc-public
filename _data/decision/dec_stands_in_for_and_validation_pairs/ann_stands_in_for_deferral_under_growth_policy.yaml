title:                  Deferral while no run exists
brief:                  |
                        No run and no simulation variant exist in
                        _data, so deferring the link adds nothing and
                        loses nothing now, in line with the growth
                        ruling. Adding it later means back-filling it
                        for each simulation variant then in the tree.
description:            |
                        Sources:
