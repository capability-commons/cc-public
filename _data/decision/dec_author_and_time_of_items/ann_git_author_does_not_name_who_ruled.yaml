title:                  Git author that does not name who made a ruling
brief:                  |
                        Every commit on main has the same author and
                        co-author trailer, so the adding commit cannot
                        tell a ruling the maintainer made from an item
                        the assistant drafted. The one ruling so far
                        names who made it only in prose.
description:            |
                        All 33 commits on main have author William
                        Payne and the trailer Co-Authored-By: Claude
                        Opus 5.5 (git log on main, 2026-10-15).
                        ruling_cross_item_checks_engine names who made
                        it in its brief (_data/decision/
                        dec_cross_item_checks_engine/
                        ruling_cross_item_checks_engine.yaml lines
                        12-19), as does the commit item of 6c0a949. No
                        check reads that prose.

