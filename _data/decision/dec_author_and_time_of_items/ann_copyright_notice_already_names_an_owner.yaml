title:                  Copyright notice that already names an owner
brief:                  |
                        Every standalone item carries a copyright
                        notice with an owner and a year, so an owner
                        field and a timestamp would sit beside a field
                        that also names a person and a year.
description:            |
                        sch_standalone includes sch_trait_rights
                        (_data/schema/sch_standalone.yaml line 43).
                        The copyright field holds the year of first
                        publication and the owner
                        (_data/schema/sch_trait_rights.yaml lines
                        95-103). ASSUMPTION: the owner of the rights
                        and the person accountable for a decision are
                        different ideas, so the overlap is in form,
                        not meaning. This makes the point weak.

