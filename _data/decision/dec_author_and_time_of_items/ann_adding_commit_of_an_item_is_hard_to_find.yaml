title:                  Adding commit as an unstable anchor
brief:                  |
                        File moves, renames, register files that hold
                        many items, and history rewrites put other
                        commits between an item and the commit that
                        added it. A reader who follows the file path
                        reaches the wrong commit.
description:            |
                        1ba2895 moved every argument into its decision
                        folder: git log on
                        det_cross_item_checks_engine .yaml gives only
                        1ba2895; --follow also gives 6c0a949, which
                        added it. reg_concept.yaml holds 19 concept
                        entries in one table, so file history cannot
                        find the commit that added one. cctool rename
                        rewrites ids (afbcf6f). The commit checks find
                        added items by guid, not path
                        (src/cc_public/commit/change.lp lines 82-84).
                        ASSUMPTION: no cctool command maps a guid to
                        the commit that added it. The problem grows
                        with the graph.

