title:                  Squash date on items made before it
brief:                  |
                        On main, the commit that adds every item made
                        before 2026-10-14 12:32 is the squash root
                        7dda99e, so git gives those items the wrong
                        time.
description:            |
                        git log --diff-filter=A on main gives 7dda99e
                        (2026-10-14 12:32:04) for sch_annotation.yaml
                        and sch_option.yaml. The option type was added
                        in fb5566b on 2026-10-13 and sch_annotation in
                        bb8c338 on 2026-10-09, both only under tag
                        pre_squash_20261014, which is not an ancestor
                        of main (pd/memory/MEMORY.md lines 20 and 42).
                        When asking for three later commits to be
                        folded into the squash, Will said "I don't
                        mind losing a bit of history to keep
                        everything clean" (owner's statement,
                        2026-10-14T12:31:53Z).

