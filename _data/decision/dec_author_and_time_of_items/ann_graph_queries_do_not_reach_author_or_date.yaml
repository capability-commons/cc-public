title:                  Author and date outside the graph queries
brief:                  |
                        No part of the tooling reads a commit author
                        or date, so to ask who made an item and when,
                        a reader leaves the graph queries for git log
                        or git blame.
description:            |
                        git log is asked only for hashes, subjects and
                        bodies (src/cctool/commit/history.py within
                        FORMAT_LOG, check and duplicates); a grep of
                        src for author and committer finds no use.
                        Queries run through cctool query logic over
                        graph facts (src/cctool/cli/querying.py within
                        sql). The maintainer deferred
                        "graph-changes-over-time history" for a
                        history-aware browser as "something for later"
                        (maintainer's statement, 2026-10-14;
                        pd/memory/MEMORY.md line 43). This would fade
                        if such history reading brought author and
                        time into the graph.

