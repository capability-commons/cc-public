title:                  Commit items that trace each change
brief:                  |
                        Each commit carries a commit item with a time
                        in its id and a brief of what changed and why,
                        and the history check compares the graph
                        before and after each commit by guid. So the
                        trace from an item to the change that brought
                        it in is kept in one place.
description:            |
                        Commit item ids match
                        ^cmt_[0-9]{14}_[0-9a-f]{6}$
                        (pd/memory/MEMORY.md line 40; for example the
                        commit item of 6c0a949). cctool history check
                        checks each commit against its first parent
                        (src/cctool/commit/history.py). The commit
                        checks derive added, removed and renamed items
                        by guid (src/cctool/commit/ change.lp lines
                        82-100). This holds only while history is not
                        rewritten, and it does not say who made a
                        ruling.

