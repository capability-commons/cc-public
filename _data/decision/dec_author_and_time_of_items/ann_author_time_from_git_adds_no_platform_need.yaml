title:                  No new platform dependency from git
brief:                  |
                        The tooling already needs git and its history
                        to check commits, so taking author and time
                        from git adds nothing an environment must
                        provide.
description:            |
                        pixi run hooks points git at .githooks
                        (pyproject.toml at
                        tool.pixi.pypi-dependencies). cctool history
                        check reads commits with git rev-list and git
                        log (src/cctool/commit/history.py). The
                        supported platforms are osx-arm64 and linux-64
                        (pyproject.toml just after
                        project.scripts.cctool;
                        README.md#getting-started), and git runs on
                        both. ASSUMPTION: no target environment
                        without git is planned.

