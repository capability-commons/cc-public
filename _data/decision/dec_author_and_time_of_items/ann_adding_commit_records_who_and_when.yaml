title:                  Who and when in the adding commit
brief:                  |
                        The commit that adds an item records who made
                        it and when, so the item needs no field for
                        them.
description:            |
                        Written by an assistant, not by WTP. The
                        maintainer's reason is not recorded. Sources:
                        _data/schema/sch_ruling.yaml at note and type
                        ("Who made a ruling, and when, is recorded by
                        the commit that adds it, not by a field");
                        _data/register/reg_concept.yaml at
                        entries.concept_concept.edge, concept_option
                        ("Owner and timestamps are left to git");
                        _data/schema/sch_annotation.yaml at
                        description and usage (no author or time
                        field, from the legacy ddr_annotation,
                        bb8c338).

