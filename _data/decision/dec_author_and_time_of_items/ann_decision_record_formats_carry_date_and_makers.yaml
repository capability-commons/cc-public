title:                  Decision record formats with date and makers
brief:                  |
                        A widely used decision record format, MADR,
                        holds the date and the decision makers as
                        fields. With fields, a decision maps to and
                        from such a record without loss; with git
                        alone, an imported date or maker has nowhere
                        to go.
description:            |
                        MADR 4.0.0 template lines 4-5 have "date"
                        (when the decision was last updated) and
                        "decision-makers", both optional metadata
                        (https://raw.githubusercontent.com/adr/madr/
                        4.0.0/template/adr-template.md). ISO/IEC/IEEE
                        42010 asks a decision record to consider owner
                        and timestamps (packet; pd/memory/
                        lifecycle-and-status.md line 17). The item
                        schemas allow no extra properties
                        (unevaluatedProperties: false in
                        sch_option.yaml line 56, sch_annotation.yaml
                        line 42, sch_determination.yaml line 48).
                        ASSUMPTION: a partner will exchange records in
                        such a format.

