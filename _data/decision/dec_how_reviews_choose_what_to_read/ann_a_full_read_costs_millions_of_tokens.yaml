title:                  A full read costs millions of tokens
brief:                  |
                        The tree is several million tokens of text, so
                        a full read each night would cost more than
                        the review budget and more than one context
                        holds, and would spend most of it on what has
                        not changed.
description:            |
                        Sources:
                        - The tree held about 14 MB of text in 4,590
                          files on 2026-10-31, counted with git
                          ls-files.

