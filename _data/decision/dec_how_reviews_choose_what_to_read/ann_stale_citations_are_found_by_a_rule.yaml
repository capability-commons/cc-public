title:                  Stale citations are found by a rule, not by attention
brief:                  |
                        Whether the source an argument cites has
                        changed since the argument was written is a
                        fact that a rule can find for every argument,
                        every night, where a model reading by judgment
                        notices only some.
description:            |
                        Sources:
                        - The daily review asks for a fact-check of
                          the arguments the day may have made stale,
                          and leaves the choice of which to the
                          reviewer
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-daily-review-shallow].

