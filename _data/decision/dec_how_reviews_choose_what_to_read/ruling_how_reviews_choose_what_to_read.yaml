title:                  A budgeted cascade of mechanical ranking and model review
brief:                  |
                        A periodic review reads the top candidates
                        that cheap mechanical signals rank, as many as
                        its budget pays for, each as a dossier of
                        questions, and its run records what it read so
                        that the ranking is measured and tuned. A
                        fixed checklist and a full read are rejected.
                        Ruled by WTP on 2026-10-31.
description:            |
                        WTP ruled on 2026-10-31, in the thread where
                        the landing queue was built (WTP, 2026-10-31):
                        "Uphold reviews using the cascade to decide
                        what to read."

                        The first signals, if the cascade is built in
                        slices, are a citation whose source changed
                        after it was written, the ripple of a change
                        through the graph, advice new since the last
                        review, and how long an area has gone unread.

