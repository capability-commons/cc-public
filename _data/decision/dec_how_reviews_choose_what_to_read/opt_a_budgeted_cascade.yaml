title:                  A budgeted cascade of mechanical ranking and model review
brief:                  |
                        Cheap signals from the graph, git and the logs
                        of the gate and the queue mark candidates: a
                        citation whose source changed after it was
                        written, the ripple of a change through the
                        graph, advice new since the last review, and
                        how long an area has gone unread. Each
                        candidate is scored as its risk times its
                        reach, plus a share for exploration of about
                        fifteen percent, and the top N by score per
                        token fill the budget. Each goes to the model
                        as a dossier, with its neighborhood, its diff
                        and its cited sources, and its signals turned
                        into questions; the model answers in a set
                        form, and the answers are checked. The run
                        record of what was read and found gives the
                        precision at N of each signal, which sets the
                        weights and holds the false alarm rate steady
                        as the budget changes.

