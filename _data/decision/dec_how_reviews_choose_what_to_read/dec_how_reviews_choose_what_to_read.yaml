title:                  How reviews choose what to read
brief:                  |
                        How does a periodic review, which reads under
                        a budget of tokens and time, choose which
                        items and areas of the tree to read closely?
description:            |
                        WTP asked on 2026-10-31 how the graph, the
                        logic rules and the periodic reviews can work
                        together, where a review joins mechanical
                        evaluation with evaluation by a model, and
                        what preprocessing can help the model judge
                        better (WTP, 2026-10-31): "Perhaps we could
                        look at this through the budget-constrained
                        CFAR cascade lens we've used before, where
                        cheap mechanisms are used to rank and
                        prioritize items or issues for a more
                        expensive process to look at."

                        A review reads under a budget of tokens and
                        time. The tree held 4,400 data files, about
                        11.9 MB, and 190 source files, about 2.3 MB,
                        on 2026-10-31, several million tokens, more
                        than one context holds. The daily review reads
                        the commits since the last review and the
                        arguments they may have made stale, by
                        judgment
                        [.agents/skills/reviewing-the-repository/SKILL.md#the-daily-review-shallow].

