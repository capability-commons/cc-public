title:                  Dossiers turn review into questions that can be checked
brief:                  |
                        A dossier asks the model a specific question
                        with the evidence attached, such as whether a
                        claim still holds against its changed source,
                        so each answer can be checked, where an open
                        reading of the tree gives findings that are
                        hard to check.
description:            |
                        Sources:
                        - A finding records its evidence and its
                          proposed response
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-report].

