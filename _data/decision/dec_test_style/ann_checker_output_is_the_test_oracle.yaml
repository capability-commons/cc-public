title:                  Checker output as the one oracle
brief:                  |
                        Each test compares the dictionary the checker
                        already returns with one literal, so the tests
                        need no vocabulary of their own. The sound
                        case and the fault cases share one form.
description:            |
                        check() returns a dict from check name to
                        rows, the checks that pass left out
                        (src/cctool/check/check.py lines 98-128,
                        291-292). 90 of the 149 tests in
                        src/cctool/check/_test/test_check.py compare
                        that dict, less layout failures, with one
                        literal, such as lines 403-408; 27 of them
                        expect {}. The sound case is check(DIR_REPO)
                        == {} (lines 248-250), marked slow, so the
                        gate leaves it to its check stage. A second
                        form now exists beside the first: 41 tests
                        read the rows of one check only, and one asks
                        only whether a check fired at all (line 1509).

