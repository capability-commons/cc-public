title:                  Checker output as the one oracle
brief:                  |
                        Each test compares the dictionary the checker
                        already returns with one literal, so the tests
                        need no vocabulary of their own. The sound
                        case and the fault cases share one form.
description:            |
                        check() returns a dict from check name to
                        rows, passing checks left out
                        (src/cc_public/check/check.py lines 56,
                        66-80). Fault tests assert equality with one
                        literal (test_check.py lines 239-241,
                        244-246); the sound case uses check(DIR_REPO)
                        == {} (lines 227-228). ASSUMPTION: asking only
                        for some failure would need a second form, a
                        membership test on one key; no code for it
                        exists.

