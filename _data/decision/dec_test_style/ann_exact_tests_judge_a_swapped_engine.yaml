title:                  Exact failures as a guard on a swapped engine
brief:                  |
                        Exact tests catch a third-party engine or
                        library that starts to report more, fewer or
                        different failures. Tests that ask only for
                        some failure catch only an engine that goes
                        silent.
description:            |
                        The cross-item checks run in clingo through
                        its Python API (src/cc_public/graph/datalog.py
                        line 55; pyproject.toml line 58, pinned
                        >=5.8.2,<6). The engine was replaced once:
                        commit 6230e98 moves the rules from Souffle to
                        clingo. Its changes to test_check.py rename
                        files, drop the souffle fixture and add one
                        test; no expected failure set changes in
                        substance (git show 6230e98 -- test_check.py).

