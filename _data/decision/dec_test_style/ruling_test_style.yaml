title:                  pytest tests with exact expected failures
brief:                  |
                        Each check test copies a fixed slice of the
                        repository, breaks one thing and expects
                        exactly the failures of that fault, so a check
                        that fires where it should not fails a test as
                        surely as one that stays silent. This catches
                        false alarms before they stop every commit at
                        the gate, and a changed literal shows a
                        reviewer what a check now reports. Asking only
                        for some failure is looser and no faster,
                        since one call computes every check. Ruled by
                        William Payne on 2026-10-23.

