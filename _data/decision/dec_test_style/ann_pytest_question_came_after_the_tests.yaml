title:                  Maintainer's pytest question after the tests
brief:                  |
                        The maintainer's question on pytest came about
                        14 hours after the tests were committed, so it
                        confirms a choice already made. No maintainer
                        statement gives a reason for exact failure
                        sets.
description:            |
                        Commit 0b69eb4 adds the tests on 2026-10-13
                        and its conftest imports pytest (git show
                        0b69eb4:src/check/_test/conftest.py line 35).
                        The earliest maintainer's statement on pytest
                        is 2026-10-13, one minute after the commit:
                        "Do you think it would be worthwhile adding a
                        pixi pyproject.toml to cc-public so we can
                        install things like pytest?" (will-messages.md
                        line 345). pytest entered the environment in
                        2132eaf. The reason for exact matching is only
                        in the assistant-written message of 0b69eb4.
                        Raised by the dependency risk, reliability,
                        simplicity and maintainability advocates.

