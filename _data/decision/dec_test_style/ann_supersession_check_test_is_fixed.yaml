title:                  Fault test for the newest check now present
brief:                  |
                        Commit 2b74bfe "Add a test of
                        supersession_across_issues" planted the fault
                        of that check and expected it reported. The
                        check is now supersession_across_types and is
                        still tested, but one other shown check,
                        word_to_replace, has no firing test, and
                        nothing in the suite requires one.
