                        test_an_option_that_supersedes_a_ruling_is_reported
                        (src/cctool/check/_test/test_check.py lines
                        428-432) expects one supersession_across_types
                        row. word_to_replace (check.lp lines
                        1630-1661) is named in no test file under src.
                        test_every_check_names_its_columns still
                        checks only that each shown check is declared
                        (lines 1068-1074), so the second half of the
                        point holds.

