title:                  Location and schema columns a reader cannot judge
brief:                  |
                        Some exact literals carry a line number, a
                        schema path and a jsonschema message. A reader
                        cannot confirm these by reading the test; only
                        a run can, so they add lines to review that a
                        person cannot judge.
description:            |
                        About 21 of the 149 tests in
                        src/cc_public/check/_test/test_check.py expect
                        rows with a file path and line number, such as
                        lines 615-623, 1093 and 1335-1344. 6 of them
                        expect a schema_violation row with a schema
                        path and message, such as 'allOf/2/type' with
                        "'objct' is not valid under any of the given
                        schemas" (lines 970-977). Some lines are found
                        at test time by searching the written file
                        (lines 974, 1344; helper _line at 99-106);
                        others are constants (LINE_ITEM = '1', line
                        64). One fault can raise two rows (lines
                        445-449). ASSUMPTION: such columns are copied
                        from a run of the checker, so a reviewer who
                        accepts them confirms only that the checker
                        agrees with itself; no source says how they
                        were written. Comparing check name and item
                        for every failure, with location and message
                        in a few dedicated tests, would keep the
                        whole-set rule. The other tests expect no file
                        path and are not affected.

