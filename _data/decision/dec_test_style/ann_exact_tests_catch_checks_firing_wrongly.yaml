title:                  Wrong firing caught by exact expectations
brief:                  |
                        A test that expects exactly the failures of
                        its fault fails when a check fires where it
                        should not, so a false alarm is caught before
                        it reaches the commit gate. A test that asks
                        only for some failure passes whatever extra
                        failures appear.
description:            |
                        Recorded reason, written by an assistant, not
                        by Will: "so a check that fires where it
                        should not fails a test as surely as one that
                        stays silent" (commit 0b69eb4 message). 55 of
                        the 59 tests in
                        src/cc_public/check/_test/test_check.py
                        compare the whole result with one dictionary
                        literal (lines 239-241). Fourteen tests of a
                        sound tree expect {}, such as lines 228, 236,
                        273 and 304. The gate runs the checker
                        (src/cc_public/gate/gate.py line 64) and the
                        pre-commit hook runs the gate (AGENTS.md line
                        13), so a false alarm stops every commit.
                        Owner's statements: heavy test coverage lets
                        him move fast (will-messages.md,
                        2026-10-14T07:22:55Z); testability sits in
                        maintainability (2026-10-13T18:30:41Z). The
                        rule has holes: three tests index one key
                        (test_check.py lines 283, 397, 707) and _check
                        drops layout failures (line 210).

