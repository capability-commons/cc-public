title:                  Wrong firing caught by exact expectations
brief:                  |
                        A test that expects exactly the failures of
                        its fault fails when a check fires where it
                        should not, so a false alarm is caught before
                        it reaches the commit gate. A test that asks
                        only for some failure passes whatever extra
                        failures appear.
description:            |
                        Recorded reason, written by an assistant, not
                        by Will: "so a check that fires where it
                        should not fails a test as surely as one that
                        stays silent" (commit 0b69eb4 message; the
                        same words are in the docstring of
                        src/cc_public/check/_test/test_check.py lines
                        18-24). 90 of the 149 tests in that file
                        compare the whole result with one literal,
                        such as lines 403-408; 27 of them expect {},
                        such as lines 322 and 359. The gate runs the
                        checker (src/cc_public/gate/gate.py line 87)
                        and the pre-commit hook runs the gate
                        (AGENTS.md line 79; .githooks/pre-commit line
                        30), so a false alarm stops every commit.
                        Maintainer's statements: heavy test coverage
                        lets him move fast (will-messages.md line 457,
                        2026-10-14T07:22:55Z); testability sits in
                        maintainability (line 271,
                        2026-10-13T18:30:41Z). The rule has holes: 41
                        tests read the rows of one check only (e.g.
                        lines 367-370, 1505-1509) and _check drops
                        layout failures (line 231).

