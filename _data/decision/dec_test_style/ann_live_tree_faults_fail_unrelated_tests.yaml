title:                  Live repository copy under every check test
brief:                  |
                        Each check test runs over a copy of the
                        working repository, less all but two
                        decisions, and expects exactly the failures of
                        its one fault. A fault in the registers,
                        schemas or kept source therefore fails nearly
                        every test at once.
description:            |
                        The tree fixture copies DIR_REPO, the
                        repository the tests run from (the working
                        tree under pixi run test, the gate's copy of
                        the staged content under the gate), less
                        version control, caches, all but two folders
                        of _data/decision and the source nothing in
                        the copy names (src/cctool/conftest.py). 141
                        of the 149 tests in
                        src/cctool/check/_test/test_check.py take it.
                        _guid_of reads guids from the copied tree at
                        test time (lines 80-96). The prefix test broke
                        when options were added to the data, with no
                        change to the prefix check (586a0e5). The
                        effect is noise during work: the check stage
                        of the gate, run beside the tests, also
                        reports such a fault (src/cctool/gate/gate.py
                        just after NAME_TEST); the direct test at
                        test_check.py within
                        test_the_repository_passes_every_check is
                        marked slow and left out of the gate. A commit
                        that stages data but no code runs only the
                        tests marked reads_data, which every test that
                        takes the tree fixture is (gate.py within
                        stages; src/cctool/conftest.py within
                        pytest_collection_modifyitems).

