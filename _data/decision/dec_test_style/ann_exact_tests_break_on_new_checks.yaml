title:                  Check and data model changes spread to tests
brief:                  |
                        Because nearly every test pins the whole
                        failure set, adding a check or changing the
                        data model forces edits to unrelated tests.
                        Tests are already loosened case by case.
description:            |
                        Commit 586a0e5 rewrote the prefix test to look
                        only at duplicate_prefix, because options in
                        the tree raised other failures beside the
                        planted one. In 1ba2895, moving options under
                        issues changed existing expectations (a
                        missing_about failure on the test option
                        became answer_count). Commit 7db4229 replaced
                        fixed line numbers in two schema tests after a
                        note in sch_option changed length. The seven
                        latest commits that touched test_check.py
                        added 233 lines and changed or removed 53 (git
                        show --numstat for 89c74d8, 1ba2895, 6230e98,
                        aa23286, 3d7ef5b, 7db4229, d03026b).

