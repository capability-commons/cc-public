title:                  No test of a file that is not UTF-8
brief:                  |
                        The checker now reports a file it cannot parse
                        as unreadable_file, and tests feed it a
                        repeated key and a module that is not Python.
                        No checker test feeds a YAML, Python or logic
                        program file that is not UTF-8, so that path
                        of the reader is untested.
description:            |
                        src/cc_public/check/_test/test_check.py lines
                        303-320 feed the checker a document with a
                        repeated key and a module that is not Python,
                        and expect one unreadable_file row each. The
                        reader turns a parse error into that row
                        (src/cc_public/graph/extract.py lines
                        1104-1105, 1144-1145) and does the same for a
                        checked file that is not UTF-8 (lines
                        770-781). No test writes such a file: the only
                        bytes a checker test writes are to blob.bin,
                        which is not a checked kind of file
                        (test_check.py line 941). ASSUMPTION: the not
                        UTF-8 path works; not run. The other option
                        has the same gap.

