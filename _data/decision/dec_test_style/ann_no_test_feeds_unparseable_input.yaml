title:                  No test of unparseable input
brief:                  |
                        Each test breaks one thing in well-formed
                        items, so no test shows whether the checker
                        survives a file it cannot parse. A syntax
                        error in one item may stop the whole check
                        rather than be reported.
description:            |
                        test_check.py lines 18-23 say each test "adds
                        or breaks one thing"; the helpers _item and
                        _replace write well-formed YAML (lines
                        112-224). No checker test feeds a file it
                        cannot parse; the one syntax error any test
                        feeds is a YAML value given to cctool set
                        (src/cc_public/cli/_test/test_editing.py lines
                        117-120). The "malformed" test at
                        test_check.py line 385 uses a well-formed file
                        with a bad guid. The extractor calls YAML.load
                        and ast.parse with no handler for a parse
                        error (src/cc_public/graph/extract.py lines
                        305, 322, 334, 388); the only handler is for
                        UnicodeDecodeError (line 348). ASSUMPTION: one
                        such file ends the check with a traceback; not
                        run. The other option has the same gap.

