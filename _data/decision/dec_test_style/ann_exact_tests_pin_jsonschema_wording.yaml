title:                  Third-party message text pinned by tests
brief:                  |
                        Exact tests quote jsonschema error messages
                        verbatim. A jsonschema release that rewords a
                        message fails these tests even when the
                        checker finds the right fault.
description:            |
                        The checker copies the jsonschema message into
                        the failure row (src/cctool/check/schema.py
                        within violations). Eight assertions quote
                        message text, such as "7 is not of type
                        'string'" (test_check.py;
                        src/cctool/commit/_test/test_message.py within
                        test_an_id_that_does_not_end_with_the_guid_is_reported).
                        jsonschema is pinned >=4.23,<5 (pyproject.toml
                        at project.license). ASSUMPTION: jsonschema
                        does not treat its wording as stable within a
                        major version; its changelog was not checked.
                        The cost is a false alarm, not a missed fault,
                        and comparing every column but the message
                        would remove it within the chosen option.

