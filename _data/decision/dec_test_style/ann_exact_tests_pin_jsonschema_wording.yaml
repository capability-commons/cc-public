title:                  Third-party message text pinned by tests
brief:                  |
                        Exact tests quote jsonschema error messages
                        verbatim. A jsonschema release that rewords a
                        message fails these tests even when the
                        checker finds the right fault.
description:            |
                        The checker copies the jsonschema message into
                        the failure row (src/cc_public/check/schema.py
                        lines 47 and 170). Eight assertions quote
                        message text, such as "7 is not of type
                        'string'" (test_check.py lines 382, 391, 500,
                        518, 529, 542, 554;
                        src/cc_public/commit/_test/test_message.py
                        line 124). jsonschema is pinned >=4.23,<5
                        (pyproject.toml line 40). ASSUMPTION:
                        jsonschema does not treat its wording as
                        stable within a major version; its changelog
                        was not checked. The cost is a false alarm,
                        not a missed fault, and comparing every column
                        but the message would remove it within the
                        chosen option.

