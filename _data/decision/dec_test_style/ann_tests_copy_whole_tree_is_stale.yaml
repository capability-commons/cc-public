title:                  Test copies now keep a fixed slice of the tree
brief:                  |
                        The annotation says each check test copies the
                        whole repository, so the time of every test
                        rises with the graph. Now a copy keeps only
                        two decisions and the source it names, so the
                        tests do not slow as deliberations grow.
description:            |
                        src/cc_public/conftest.py lines 52-56 keep
                        only dec_cross_item_checks_engine and
                        dec_tooling_language of _data/decision, and
                        lines 59-70 keep only the source that the rest
                        of the copy names. Its description says the
                        copy keeps "a fixed slice of the deliberations
                        ... so the tests neither slow down nor change
                        meaning as the deliberations in the repository
                        grow". The gate leaves out tests marked slow,
                        which "grow with the data"
                        (src/cc_public/gate/gate.py lines 78-85).
                        Registers and schemas are still copied whole.
                        Found in the review of 2026-10-22.

