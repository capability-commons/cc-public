title:                  Tests of unparseable input now present
brief:                  |
                        Commit 0d16c2a "Fix cctool check so that an
                        unreadable file is a failure, not a traceback"
                        adds tests that feed the checker a repeated
                        key and a module that is not Python. At
                        360ec14 the suite shows that the checker
                        reports such a file and goes on.
description:            |
                        test_a_document_with_a_repeated_key_is_reported
                        and
                        test_a_module_that_is_not_python_is_reported
                        (src/cc_public/check/_test/test_check.py lines
                        267-283 at 360ec14) expect one unreadable_file
                        row each, with file and line, beside the other
                        failures.

