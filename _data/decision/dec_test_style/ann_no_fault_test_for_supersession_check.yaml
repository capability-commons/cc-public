title:                  No fault test for one check
brief:                  |
                        No test plants the fault of the check
                        word_to_replace, and nothing in the suite
                        requires each check to have such a test.
                        Neither option asks that every check be shown
                        to fire.
description:            |
                        check.lp shows 71 checks (#show lines);
                        check.py adds schema_violation and
                        unformatted_file (src/cctool/check/check.py
                        within NAME_SCHEMA and NAME_LAYOUT). The
                        supersession check, now
                        supersession_across_types (check.lp within
                        supersession_across_types), is tested at
                        src/cctool/check/_test/test_check.py within
                        test_an_option_that_supersedes_a_ruling_is_reported.
                        word_to_replace (check.lp within
                        word_to_replace) is named in no test file
                        under src (grep -rw over test_*.py); every
                        other shown check of check.lp and advise.lp
                        is. The suite tests that every shown check is
                        declared and worded (test_check.py within
                        test_every_check_names_its_columns and
                        test_every_check_says_what_a_failure_is_and_how_to_fix_it)
                        but not that every check appears in some
                        expected failure set. Maintainer's statement:
                        "with a lot of test coverage, I can move
                        faster and more confidently" (will-messages.md
                        line 457, 2026-10-14). ASSUMPTION: the check
                        works; it was not run against a planted fault.
                        A test comparing the #show names with the keys
                        named in the tests would close the gap under
                        either option.

