title:                  Exact rows as a check of reported details
brief:                  |
                        An exact test compares every column of a
                        reported row, such as the item, file, line and
                        expected folder. A test that asks only for
                        some failure passes when the checker names the
                        right fault with a wrong item, line or folder.
description:            |
                        Added round for functional suitability, a
                        driver Will added on 2026-10-15
                        (will-messages.md lines 781 and 786,
                        2026-10-15T10:59:29Z). Each check reports rows
                        of named columns read from the decl comments
                        of the rules (src/cctool/check/check.py lines
                        299-335; check.lp, e.g. line 576
                        misplaced_document and line 953
                        dangling_reference). Most fault tests compare
                        rows in full, with file, line and expected
                        place (src/cctool/check/_test/test_check.py,
                        e.g. lines 615-623, 1093). Of the 41 tests
                        that read one check only, 18 still compare its
                        rows in full (e.g. lines 445-449); 23 compare
                        some columns or ask only whether a row is
                        there (e.g. lines 435-442, 547-551). edit.py
                        compares failures before and after an edit by
                        every column but the line
                        (src/cctool/edit/edit.py lines 1243-1262), so
                        the other columns decide which failures an
                        edit is said to add. The cost of pinned lines
                        and wording is argued in
                        ann_exact_tests_break_on_new_checks and
                        ann_exact_tests_pin_jsonschema_wording.

