title:                  pytest tests with exact expected failures
brief:                  |
                        Test with pytest, in _test folders beside the
                        code. Each check test copies a fixed slice of
                        the repository, breaks one thing and expects
                        exactly the failures that fault should cause,
                        less layout failures. Where the fault must
                        also raise failures that tests of their own
                        cover, a test may compare only the rows of its
                        check, and says why.
description:            |
                        Commit 0b69eb4 (pre-squash), 2026-10-13.

