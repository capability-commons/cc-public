title:                  pytest and _test folders already in place
brief:                  |
                        The tests use pytest and sit in _test beside
                        the code, as the maintainer had set. The
                        maintainer asked on 2026-10-14 whether pytest
                        is used, and gave the _test rule on
                        2026-10-09.
description:            |
                        Maintainer's statements: "We're using pytest
                        for the python unit-tests, right?"
                        (will-messages.md line 531, headed
                        2026-10-14T10:34:45Z; the packet gives
                        10:34:02Z), and "tests in src/**/_test/ beside
                        the code they test. Scope comes from position,
                        so the directory name stays constant at every
                        level" (will-messages.md line 57,
                        2026-10-09T17:52:14Z). pyproject.toml lines
                        69-70 declare pytest and pytest-xdist, and
                        line 75 the task test = "pytest -n auto --dist
                        worksteal". Eight _test folders sit beside the
                        code: check, cli, commit, edit, gate, graph,
                        requirement, web. ASSUMPTION: the reason
                        speaks for simplicity (one runner, one folder
                        rule); Will did not name a concern. It does
                        not separate the two options, since both use
                        pytest and _test.

