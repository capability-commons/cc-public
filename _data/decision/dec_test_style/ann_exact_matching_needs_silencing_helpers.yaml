title:                  Helpers that keep unrelated checks quiet
brief:                  |
                        Because a test fails on any unexpected
                        failure, the tests need helpers that silence
                        unrelated checks. Silencing is a second job
                        beside detecting.
description:            |
                        _check removes unformatted_file failures
                        before every comparison (test_check.py lines
                        201-211). _fields writes every field the
                        schema accepts so schema_violation stays
                        silent (lines 143-159). _decision also writes
                        a test decision and places the option in its
                        folder so answer_count and misplaced_document
                        stay silent (lines 128-140). ASSUMPTION: each
                        new check that fires on these items needs a
                        builder change or another carve-out. Today the
                        carve-out list has one entry.

