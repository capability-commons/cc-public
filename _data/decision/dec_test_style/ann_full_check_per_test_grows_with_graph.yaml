title:                  Full checker run per test over the whole tree
brief:                  |
                        Each check test copies a slice of the
                        repository and runs the full checker over it,
                        so the time of every test rises with the
                        registers, schemas and source the slice keeps.
                        The other option does not remove this cost.
description:            |
                        The tree fixture copies the repository less
                        version control and caches, keeps only two
                        folders of _data/decision and only the source
                        the rest of the copy names
                        (src/cctool/conftest.py); registers and
                        schemas are copied whole. Every check test
                        runs the full checker over its copy
                        (src/cctool/check/_test/test_check.py within
                        _check). Measured by the performance advocate
                        on 2026-10-15, before the slice, in a copy of
                        89c74d8: a full check() took about 1.2 s warm,
                        2.5 s cold, and the 59 checker tests then
                        spent 71.9 s in call. The checker test file
                        now holds 149 tests. The gate runs the tests
                        on one worker for each processor with
                        pytest-xdist (src/cctool/gate/gate.py within
                        MARK_PUSH) and leaves out those marked slow,
                        which grow with the data (lines 78-85).
                        ASSUMPTION: check() time grows at least
                        linearly with items; not measured at other
                        sizes.

