title:                  Full checker run per test over the whole tree
brief:                  |
                        Each check test copies the whole repository
                        and runs the full checker over it, so the time
                        of every test rises with the size of the
                        graph. The other option does not remove this
                        cost.
description:            |
                        Measured by the performance advocate on
                        2026-10-15 in a copy of HEAD 89c74d8, pytest
                        9.1.1, clingo 5.8.2, 4 CPUs, serial; not
                        Will's machine. A copy takes about 0.02 s and
                        a full check() about 1.2 s warm, 2.5 s cold.
                        The 59 tests in src/cc_public/check/_test
                        spend 71.9 s in call and 1.4 s in setup. The
                        whole suite of 326 tests takes 3m04s serial.
                        The gate shards tests per processor (gate.py
                        lines 33-36). Device tool calls end at 180 s
                        (memory/MEMORY.md line 45, assistant-written
                        note). ASSUMPTION: check() time grows at least
                        linearly with items; not measured at other
                        sizes. A small fixed fixture tree would keep
                        the cost flat.

