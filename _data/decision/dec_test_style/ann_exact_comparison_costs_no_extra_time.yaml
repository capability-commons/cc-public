title:                  No run-time cost for exact comparison
brief:                  |
                        Exact expectations cost the same machine time
                        as asking for one failure. One call computes
                        every check, so the stricter assertion only
                        compares a small dictionary.
description:            |
                        check() runs one logic program over all facts
                        and returns every failure keyed by check
                        (src/cc_public/check/check.py lines 42,
                        66-107). It has no argument to select a subset
                        of checks (line 66). The tests call it through
                        _check (test_check.py lines 201-212). This
                        holds while the checks run as one program.

