title:                  Verdict on each commit however made
brief:                  |
                        The history check judges each commit from what
                        it records, whatever git command made it. So a
                        rebase, a cherry-pick or a revert is checked
                        the same way as an ordinary commit, one commit
                        at a time.
description:            |
                        It checks the message against sch_commit from
                        the commit's own tree and the change against
                        its first parent, and reports a sentence per
                        failure per commit (repo
                        src/cc_public/commit/history.py lines 18-28
                        and 97-124; commit 18d6181). It also reports a
                        commit item id two commits share, as a
                        cherry-pick makes (history.py lines 128-153).
                        git skips the checking commit hooks for a
                        rebase or a cherry-pick (AGENTS.md lines
                        25-26; README.md lines 56-57); only
                        prepare-commit-msg runs (memory
                        enforcement-approach.md). For reliability, the
                        commits that recovery makes are checked. For
                        reviewability, the verdict is on the unit a
                        reviewer reads. For traceability, every commit
                        that reaches shared history carries a checked
                        record of its reason (sch_commit lines 14-16).
                        The check passed on the whole history at 14,
                        28 and 32 commits (memory MEMORY.md). Holds at
                        tenfold: its cost grows with commits checked,
                        not with git entry points.

