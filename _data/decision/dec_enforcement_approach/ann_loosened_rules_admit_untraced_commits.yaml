title:                  Untraced commits under looser rules
brief:                  |
                        Loosening the rules lets commits into history
                        whose commit item does not record the change
                        and its reason, such as one that removes or
                        renames an item without naming it.
description:            |
                        sch_commit lines 14-16: a commit item "records
                        one change to the tree and why it was made".
                        The rules unannounced_removal and
                        unannounced_rename require it to name each
                        item removed or renamed
                        (src/cc_public/commit/change.lp lines
                        121-145). ASSUMPTION: loosening would relax
                        these rules; the packet does not say which
                        rules it would drop.

