title:                  Git paths with no refusing hook
brief:                  |
                        Hooks for every path would still leave gaps.
                        Some paths offer no hook that can refuse a
                        commit, and any hook can be skipped or be
                        absent from a clone.
description:            |
                        githooks page
                        (https://git-scm.com/docs/githooks):
                        post-rewrite runs for commit --amend and
                        rebase but no effect of its exit status is
                        stated, and fast-import and filter-repo
                        "typically do not call" it; post-commit
                        "cannot affect the outcome of git commit";
                        pre-rebase gets only the upstream and branch,
                        not the rewritten commits; pre-commit and
                        commit-msg "can be bypassed with the
                        --no-verify option". Hooks run only once
                        core.hooksPath names .githooks (README.md
                        lines 56-58). Grows stronger with more
                        contributors and clones.

