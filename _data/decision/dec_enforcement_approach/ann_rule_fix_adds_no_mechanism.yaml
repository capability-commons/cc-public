title:                  Rule fix without a new mechanism
brief:                  |
                        Fixing a rule that keeps needing exceptions
                        inside the rule keeps the count of mechanisms
                        flat. The one example adds two conditions to
                        an existing rule, with no new hook, flag or
                        waiver list.
description:            |
                        a0a519f: 2 files, 12 insertions, 2 deletions;
                        two negated conditions for Revert and Reapply
                        in rename_without_alias (then in change.dl,
                        now src/cc_public/commit/change.lp lines
                        159-165 after the clingo port 6230e98) and a
                        test. Policy in AGENTS.md lines 28-29. Holds
                        while exceptions stay rare.

