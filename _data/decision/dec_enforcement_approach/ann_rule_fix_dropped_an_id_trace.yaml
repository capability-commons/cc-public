title:                  Trace lost by the first rule fix
brief:                  |
                        The first rule fixed under the approach now
                        lets a revert of a rename restore a register
                        entry without the newer id as an alias, so
                        that id in history no longer resolves by id.
                        Fixing a rule can give up a trace.
description:            |
                        rename_without_alias exists so that
                        "references by the old id can be found and
                        resolved" (src/cc_public/commit/change.lp
                        lines 148-151). a0a519f exempts Revert and
                        Reapply (lines 150-165; commit a0a519f brief).
                        Commit items mention ids (change.lp lines
                        49-52), so a rename commit names the newer id.
                        The guid survives (change.lp lines 97-100), so
                        the loss per case is small. Grows with renames
                        and reverts.

