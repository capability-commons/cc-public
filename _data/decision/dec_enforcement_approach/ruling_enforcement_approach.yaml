title:                  One check of record over pushed commits
brief:                  |
                        One check of record, cctool history check,
                        judges each commit from what it records,
                        however git made it, so no hook is needed for
                        each git path and the rules stay as strict as
                        they are. Hooks for every path would still
                        leave paths with no refusing hook, and would
                        add fault points, review load and waiting at
                        each rewrite. Looser rules would let commits
                        into history that do not record what they
                        remove or rename. Ruled by WTP on 2026-10-23.

