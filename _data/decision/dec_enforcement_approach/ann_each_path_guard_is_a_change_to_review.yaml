title:                  Review load of per-path guards
brief:                  |
                        Each guard for one more git path is a change a
                        person must read and judge, and the stream of
                        such changes does not end while git keeps its
                        entry points.
description:            |
                        The prepare-commit-msg guard was 330
                        insertions across 8 files (4e6db4c, 2026-10-14
                        14:18:47Z). The pre-merge-commit guard was 46
                        insertions across 4 files (17de2f5,
                        14:24:25Z). Both and the history check landed
                        within about 70 minutes. Will then asked to
                        "look to see if there are any other holes that
                        we need to fill" (2026-10-14T14:23:37Z).
                        ASSUMPTION: guards for amend, squash and
                        rebase would each be a change of similar size.

