title:                  Same check run from several triggers
brief:                  |
                        Keeping the local hooks beside the check of
                        record runs each job more than once: the
                        commit check at commit-msg and at push, the
                        gate at pre-commit, pre-merge-commit and push.
description:            |
                        .githooks/commit-msg; pre-commit;
                        pre-merge-commit; pre-push runs history check
                        with --gate (src/cctool/commit/history.py
                        within pushed and check). Four of the five
                        hooks plus one command run the two jobs;
                        prepare-commit-msg only drafts (count made for
                        this note). The rule code is shared, so the
                        repetition is in the triggers. ASSUMPTION: the
                        hooks earn their place through faster
                        feedback, which is a maintainability matter
                        not weighed here.

