title:                  Hoops of a waterproof system
brief:                  |
                        Making every git path waterproof means jumping
                        through more and more hoops, a future pain the
                        owner weighed on 2026-10-14 before assenting
                        to one check of record.
description:            |
                        Owner's statement 2026-10-14T14:46:15Z: "Do we
                        loosen our rules and pragmatically accept that
                        we're not going to be able to catch
                        everything? Or do we try to make the system
                        waterproof and end up jumping through more and
                        more hoops, potentially twisting ourselves
                        into pretzels in the process? ... What's going
                        to cause more pain in the future?" Then
                        14:47:25Z: "OK. This feels like the wiser
                        choice. Go ahead on that." The third way, one
                        check of record, was proposed by the assistant
                        between the two messages; Will assented to it.
                        Memory enforcement-approach.md records the
                        result. ASSUMPTION: the reason speaks for
                        simplicity; Will did not name the concern.

