title:                  One check of record over pushed commits
brief:                  |
                        Make cctool history check the only check that
                        must hold. It is run by hand on rebased
                        commits before a branch lands on dev, by the
                        pre-push hook, and later by CI. Keep the local
                        hooks as early feedback that may leak, and fix
                        a rule that keeps needing exceptions in the
                        rule.
description:            |
