title:                  Second gate run on an ordinary push
brief:                  |
                        For a commit made the ordinary way, pre-commit
                        has already gated its content and the push
                        gates the same tip again. Path independence
                        costs about one extra gate run per push.
description:            |
                        .githooks/pre-commit line 28 runs the gate;
                        .githooks/pre-push line 33 runs it again on
                        each ref tip (auditing.py lines 95-96 and
                        145-147). The gate takes about 75 s (memory
                        MEMORY.md, "Clingo switch done"). Remote
                        device tool calls die at 180 s (MEMORY.md,
                        "Gate parallel"). ASSUMPTION: a push of 10
                        commits from a remote session, about 35 s of
                        history check plus 75 s of gate, is already
                        about 110 s (about 120 to 130 s with the
                        verifier's re-run figures). The sum adds a
                        4-CPU container measurement to a figure from
                        Will's 2-CPU VM. After a rebase the push gate
                        is the only gate, so it cannot be dropped; a
                        cache of passed gates keyed on tree hash would
                        remove the repeat. ASSUMPTION: no such cache
                        exists; none was found in gate.py. Adds the
                        time of the repetition stated in
                        ann_same_check_run_from_several_hooks.

