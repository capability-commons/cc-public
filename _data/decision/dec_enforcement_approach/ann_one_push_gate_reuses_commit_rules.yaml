title:                  One gate at the push
brief:                  |
                        The chosen check adds one entry point at the
                        push and reuses the rule code the commit hooks
                        already run, where guarding each git path
                        would add one mechanism per path.
description:            |
                        history.py lines 116 and 121 call the same
                        message and change checks as the commit-msg
                        hook (src/cc_public/cli/messaging.py lines
                        98-102; src/cc_public/commit/change.py line
                        74). The addition was one hook and one
                        command: 33 lines of .githooks/pre-push, 152
                        of cli/auditing.py, 183 of commit/history.py
                        (git show --stat 18d6181). AGENTS.md lines
                        28-29: "Do not add hooks to cover more of
                        git's paths".

