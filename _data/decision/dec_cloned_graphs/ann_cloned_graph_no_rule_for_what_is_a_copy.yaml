title:                  No rule for what counts as a copy
brief:                  |
                        A check that forbids copies needs a rule for
                        what a copy is, and the option gives none.
                        Copies must rename their nodes, so an exact
                        match never fires, and a similarity threshold
                        refuses legitimate near-alike graphs or misses
                        edited copies, gathers exceptions and must be
                        kept tuned. Some copies are kept on purpose,
                        and people who are refused may copy outside
                        the tree.
description:            |
                        Sources:
                        - The forbidding option fails a dataflow graph
                          that is a copy of
                          another, with no criterion. (the forbidding option, brief)
                        - The Patrol drafts keep the single-runtime
                          graph in a folder of its
                          own. (_sources/cc-patrol-notes/draft/README.md line 11)
                        - A node is named for the graph that holds it.
                          (src/cctool/check/check.lp within unused_concept)
                        - A rule that keeps needing exceptions is
                          changed so that it no
                          longer needs them. (_data/register/reg_design_rule.yaml at entries.rule_fix_the_rule_not_the_exceptions)
                        - If forking is harder than copying, people
                          copy.
                          (_sources/survey/product-lines.md line 315)
                        Strength: moderate.

