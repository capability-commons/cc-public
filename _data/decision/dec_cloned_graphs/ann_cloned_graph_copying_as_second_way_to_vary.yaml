title:                  Copying as a second way to vary a graph
brief:                  |
                        _data has one dataflow graph and no copy, so
                        allowing copies silently adds nothing until a
                        copy appears. A cloned-from link with a drift
                        report makes copying a supported second way of
                        varying a graph beside variants, and its drift
                        report is one more report beside the
                        difference tool.
description:            |
                        Sources:
                        - _data/dataflow_graph holds one item.
                          (listing of
                          _data/dataflow_graph)
                        - The survey pairs the cloned-from link with a
                          drift report and a
                          factor command, and the factor command is the same tool as the
                          resolved-graph difference.
                          (_sources/survey/product-lines.md lines 257-261)
                        - A type, relation, field or command is added
                          only when a real
                          instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml lines
                          13-17)
                        - Simplicity counts distinct mechanisms and
                          jobs done by more than
                          one mechanism. (_data/register/reg_concern.yaml lines 489-490)
                        Strength: moderate; with ten times the graphs,
                        silent copies would cost upkeep, so the case
                        is about timing.

