title:                  Copies that drift with no one told
brief:                  |
                        Copies are what people make under time
                        pressure, and they cost fixes carried by hand.
                        Allowed silently, a copy's nodes repeat
                        another graph's reasons and trace to nothing,
                        its drift is found by accident, and the family
                        view rots. A cloned-from link ties the copy to
                        its source, and its drift report can reuse the
                        resolved-graph difference tool the change sets
                        need anyway.
description:            |
                        Sources:
                        - If forking a variant is harder than copying
                          a YAML file, people
                          will copy, and the family view rots.
                          (_sources/survey/product-lines.md line 315)
                        - Industrial cloning costs fixes propagated by
                          hand, repeated tests
                          and untracked reuse. (https://people.csail.mit.edu/mjulia/publications/An_Exploratory_Study_of_Cloning_in_Industrial_Software_Product_Lines_2013.pdf,
                          as summarized in _sources/survey/product-lines.md lines 116-118)
                        - The survey pairs the cloned-from link with a
                          drift report and a
                          factor command, and the factor command is the same tool as the
                          resolved-graph difference.
                          (_sources/survey/product-lines.md lines 257-261)
                        - A change set is the difference between two
                          resolved variants.
                          (_sources/variants-framing.md line 55)
                        Strength: strong; drift grows with copies.

