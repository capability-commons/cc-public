title:                  A variant that the register says is not a copy
brief:                  |
                        The register says a variant of a system is
                        derived from a dataflow graph by
                        transformations and is not kept as a copy. A
                        check that forbids copies holds that, but only
                        for copies close enough to detect, and an
                        edited copy then exists unlinked.
description:            |
                        Sources:
                        - A variant of a system, for a test, a
                          simulation or a deployment,
                          is derived from a dataflow graph by transformations, and is not
                          kept as a copy. (_data/register/reg_concept.yaml at entries.concept_dataflow_graph.description)
                        - ASSUMPTION: a copy check compares content,
                          so a copy edited
                          enough passes it.
                        Strength: weak to moderate.

