title:                  Variants that arrive from SSP as whole structures
brief:                  |
                        SSP holds variants as whole alternative SSD
                        files, so importing an SSP package with
                        several variants gives several whole graphs,
                        each a near copy of the others. Forbidding
                        copies refuses such an import unless it is
                        first factored into a base and operations, and
                        allowing them silently loses how they relate.
                        A cloned-from link keeps them, with a drift
                        report, until someone factors them.
description:            |
                        Sources:
                        - An SSP archive may contain multiple SSD file
                          entries at root
                          level, with SystemStructure.ssd as the default.
                          (https://ssp-standard.org/docs/2.0, chapter 3)
                        Strength: moderate; it depends on SSP import.

