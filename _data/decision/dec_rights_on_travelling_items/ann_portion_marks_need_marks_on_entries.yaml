title:                  Portion-marked partner data
brief:                  |
                        Some marking regimes mark each portion as well
                        as the whole. Only marks on embedded items can
                        carry such data without loss or over-marking.
description:            |
                        32 CFR 2001.21(c), as cited at
                        https://www.archives.gov/isoo/faqs/marking.
                        Protective marks already allow partner marks
                        under other authorities
                        (_data/register/reg_protective_mark.yaml lines
                        45-53; _data/schema/sch_trait_rights.yaml
                        lines 68-72). Covers protective marks only.
                        ASSUMPTION: no partner under a portion-marking
                        regime is known to be planned or ruled out.

