title:                  Holder link that recovers inherited rights
brief:                  |
                        The extracted graph records the holder of each
                        item, so any store that keeps that link can
                        recover an embedded item's rights from its
                        container.
description:            |
                        src/cc_public/graph/extract.py lines 118-122.
                        The graph is already read into Datalog and SQL
                        as well as YAML (README.md, row for
                        src/cc_public/graph). It holds only while
                        every store keeps the holder column.
                        ASSUMPTION: no store that drops it is planned.

