title:                  Inherited rights stated but not derived
brief:                  |
                        The inheritance of rights is stated in schema
                        prose only. No rule derives an embedded item's
                        rights, and no rule checks that the document
                        at the end of each holder chain is of a
                        standalone type. Today every document type in
                        the tree is standalone, so the gap is latent.
description:            |
                        Rule: _data/schema/sch_standalone.yaml lines
                        21-23. No rule in src/cc_public/check/check.lp
                        names rights or standalone; it reads the
                        holder column only to find documents (lines
                        169-210). No derivation in src/cc_public/graph
                        or check/*.py (grep at 89c74d8). Schema
                        validation does require rights on each
                        document whose type composes sch_standalone,
                        as the schema of every document type except
                        t_commit does. ASSUMPTION: a check over the
                        existing item relation could close the gap at
                        small cost. Not built or tested.

