title:                  Edges that resolve within one repository
brief:                  |
                        One repository per deployment keeps every item
                        from a bot, and the edges between them, in a
                        graph where the checks resolve each edge.
                        Choosing the repository per item by mark can
                        split linked items across repositories, where
                        a public edge to a private item fails.
description:            |
                        A reference that names neither an id, a guid
                        nor an alias held in the graph is the failure
                        dangling_reference, and only references in the
                        mark field are exempt
                        (src/cctool/check/check.lp lines 524-529). A
                        likely first instance, member skill profiles,
                        holds personal data (context.md, "Facts
                        gathered"). Under
                        opt_target_by_protective_mark, the repository
                        of each item is chosen from its protective
                        mark (its option file, brief). ASSUMPTION:
                        items from one conversation can carry
                        different marks and so land in different
                        repositories. Holds at ten times the size:
                        yes, because more types per bot raise the
                        chance that one conversation yields items of
                        mixed marks.

