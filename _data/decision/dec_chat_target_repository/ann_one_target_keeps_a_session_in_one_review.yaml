title:                  Whole output of a bot held in one repository
brief:                  |
                        A repository fixed per deployment puts all
                        items of a conversation in one branch for one
                        review. Routing by protective mark can split
                        one conversation across repositories and
                        reviews.
description:            |
                        The fixed option fixes one repository for each
                        deployment of a bot
                        (_data/decision/dec_chat_target_repository/opt_target_fixed_per_deployment.yaml
                        at brief). The mark option chooses the
                        repository for each item from its protective
                        mark (opt_target_by_protective_mark.yaml at
                        brief). Initially there is one schema per bot,
                        and maybe more than one later (owner's
                        statement). ASSUMPTION: under the mark option,
                        items from one conversation can carry
                        different marks and so land on branches in
                        different repositories. Holds at ten times the
                        size: yes, because more bots and more schemas
                        per bot raise the chance that one conversation
                        spans marks, and each split adds a review to
                        the queue.

