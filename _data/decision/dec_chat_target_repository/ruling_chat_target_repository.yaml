title:                  One configured repository for each deployment
brief:                  |
                        Each deployment of a bot writes to one
                        repository, which may be part of the
                        configuration of the bot and so can be
                        reconfigured rather than fixed. A public
                        repository is allowed only for a type that
                        holds no personal data. Ruled by WTP on
                        2026-10-22.

