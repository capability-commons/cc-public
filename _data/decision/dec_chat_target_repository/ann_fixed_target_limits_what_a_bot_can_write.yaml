title:                  Fixed target bounds a manipulated bot
brief:                  |
                        A bot fixed to one repository holds write
                        access to that repository only, so no input
                        can route personal data to a public one.
                        Routing by mark trusts a label that the bot
                        itself sets from untrusted chat.
description:            |
                        Under opt_target_by_protective_mark, the
                        repository for each item is chosen from the
                        protective mark it is given
                        [opt_target_by_protective_mark.yaml brief].
                        Under opt_target_fixed_per_deployment, a
                        public repository is allowed only for a type
                        that holds no personal data
                        [opt_target_fixed_per_deployment.yaml brief].
                        ASSUMPTION: routing by mark needs the bot to
                        hold write credentials for every repository it
                        may route to. Holds at ten times the size:
                        yes, because more types and repositories
                        multiply the routes a wrong mark can take,
                        while a fixed target stays one route.

