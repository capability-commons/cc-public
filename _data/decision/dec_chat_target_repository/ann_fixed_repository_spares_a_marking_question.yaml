protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  No marking question for the contributor
brief:                  |
                        Choosing the repository by protective mark
                        means each item needs a mark, a concept a
                        volunteer does not know and can get wrong. A
                        repository fixed per deployment asks the
                        contributor nothing about where the item goes.
description:            |
                        The protective-mark option chooses the
                        repository for each item from the mark it is
                        given
                        (_data/decision/dec_chat_target_repository/opt_target_by_protective_mark.yaml,
                        brief). The fixed option sets one repository
                        for each deployment
                        (_data/decision/dec_chat_target_repository/opt_target_fixed_per_deployment.yaml,
                        brief). ASSUMPTION: under the protective-mark
                        option either the contributor or the LLM picks
                        the mark, and a wrong pick is a mistake the
                        contributor cannot see. Holds at ten times the
                        size: yes, because the number of contributors
                        who would face the question grows with use.

