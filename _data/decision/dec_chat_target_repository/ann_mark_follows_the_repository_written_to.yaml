protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Protective mark taken from the target tree
brief:                  |
                        cctool gives a new item the protective mark of
                        the repository it is written into, and in
                        cc-public that is mark_public, the only mark
                        the register holds. Routing by mark reverses
                        the flow the editing commands have, and would
                        send personal data to a public repository
                        unless something else intervenes. A repository
                        fixed per deployment does not depend on the
                        mark being right.
description:            |
                        A new standalone item takes protective_mark,
                        with copyright and license, from
                        file_pyproject of the tree it is written to
                        (src/cctool/edit/edit.py lines 104-105,
                        484-485 and 1204-1216). file_pyproject carries
                        mark_public (pyproject.toml lines 8-10). The
                        protective mark register of cc-public holds
                        one mark, mark_public
                        (_data/register/reg_protective_mark.yaml lines
                        67-70). The register says a public item in a
                        restricted repository is still public
                        (_data/register/reg_protective_mark.yaml lines
                        88-91). A mark that no register in the tree
                        holds is reported as the advice
                        unresolved_mark, not as a failure
                        (src/cctool/check/advise.lp lines 38-57). The
                        fixed option allows a public repository only
                        for a type that holds no personal data
                        (_data/decision/dec_chat_target_repository/opt_target_fixed_per_deployment.yaml,
                        brief). Personal data lives only in private
                        repositories (owner's statement). Holds at ten
                        times the size: yes, because the rule that
                        rights come from the target tree does not
                        depend on the number of items or repositories,
                        and more items mean more chances that one mark
                        is set wrong, while a fixed target needs one
                        choice per deployment.

