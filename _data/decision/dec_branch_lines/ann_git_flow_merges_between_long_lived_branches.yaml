title:                  Merge traffic among git flow's long-lived branches
brief:                  |
                        Git flow keeps develop, release, hotfix and
                        main as long-lived branches joined by merge
                        commits, four kinds of branch for the one
                        integration job that a single linear line does
                        now. Each fix then crosses extra merges that
                        run the gate again, reaches the reviewer
                        twice, and leaves merge commits whose items
                        carry only git's wording in the range a
                        release is computed from. One trunk with
                        release tags, and the dev line before any next
                        branch exists, keep one linear history to
                        read, check and trace.
description:            |
                        Sources:
                        - Git flow keeps separate develop, release,
                          hotfix and main branches
                          (_data/decision/dec_branch_lines/opt_git_flow.yaml,
                          brief); release and hotfix branches merge
                          into both main and develop, always as a
                          merge commit rather than a fast-forward
                          (https://nvie.com/posts/a-successful-git-branching-model/).
                          Its author suggests simpler workflows for
                          continuous delivery and keeps git flow for
                          explicitly versioned software (same page,
                          note of 2020-03-05).
                        - dev is the integration branch, only moves
                          forward by fast-forward merges, and its
                          history stays linear (AGENTS.md#working-beside-other-agents).
                        - Landing a branch runs the history check with
                          the gate over each rebased commit (AGENTS.md#working-beside-other-agents); git runs no pre-commit hook
                          for a merge, so the pre-merge-commit hook
                          runs the gate in its place (README.md#getting-started); the history check extracts two full
                          graphs per commit it checks
                          (src/cctool/commit/change.py within facts_of; src/cctool/commit/history.py).
                        - Merge commit titles are the words git drafts
                          for them (_data/schema/sch_commit.yaml at allOf.3.properties.title.description); the computed bump reads the commit
                          items since the last release
                          (_data/decision/dec_version_scheme/opt_semver_computed.yaml at title and brief). Strength: moderate overall.
                          Merges between release lines are rare next
                          to ordinary commits, so the gate cost is
                          small; merged commits stay reachable, so the
                          release range can still be computed, only
                          less plainly; and cc-public is versioned
                          software, the case the author of git flow
                          says it still fits.

