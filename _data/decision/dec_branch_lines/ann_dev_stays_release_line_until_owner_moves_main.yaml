title:                  Dev as the release line until the move to main
brief:                  |
                        Releasing from dev until the maintainer moves
                        the line to main keeps one trunk at a time,
                        changes nothing about how work is landed and
                        reviewed before 1.0, and points no consumer at
                        the legacy code that main still holds. A
                        second line appears only if breaking work is
                        held on next after 1.0, and the move itself
                        must replace main in one step.
description:            |
                        Sources:
                        - dev is the integration branch; finished
                          branches are checked by the history check
                          and land there by fast-forward merge
                          (AGENTS.md lines 13-15 and 40-48).
                        - origin's main branch still holds the legacy
                          September iteration (_sources/context.md
                          line 32).
                        - Owner's statement (2026-10-22T16:30): "I
                          will decide when to move over to "main" from
                          "dev". This is going to be before outside
                          partners use us" (_sources/context.md line
                          21).
                        - The maintainer expects to bundle breaking
                          changes after 1.0 into one major release
                          (owner's statement, 2026-10-22T16:23;
                          _sources/context.md line 16). Strength:
                          moderate. It argues for the period before
                          1.0, not for the next branch after it; and
                          all peers are the maintainer's own (owner's
                          statement, 2026-10-22T16:21), so nobody is
                          misled by main today.

