title:                  dev now, main later, next after 1.0
brief:                  |
                        Releases come from dev until the maintainer
                        moves the release line to main, which then
                        takes dev's history whole, with its release
                        tags, while the legacy history stays under its
                        tag. After 1.0, breaking work collects on a
                        next branch until a major release.
description:            |
                        Source: maintainer's comment (2026-10-22), "I
                        will decide when to move over to "main" from
                        "dev". This is going to be before outside
                        partners use us".

