title:                  Release tags kept reachable across the move to main
brief:                  |
                        main now holds the legacy September iteration.
                        If releases are cut from dev first and from
                        main later, the move must keep those release
                        tags in main's history, or the range since the
                        last release has no known start for the first
                        release from main.
description:            |
                        Sources:
                        - origin's main branch still holds the legacy
                          September iteration (_sources/context.md
                          line 32).
                        - Owner's statement (2026-10-22T16:17): "what
                          is currently on dev will very shortly move
                          over to main. Likely with the first public
                          release." (_sources/context.md line 13).
                        - The computed bump reads the commit items
                          since the last release
                          (_data/decision/dec_version_scheme/opt_semver_computed.yaml
                          lines 11-15).
                        - Assumption: the move from dev to main is not
                          yet specified, so it is not known whether
                          main will take dev's history or join it to
                          the legacy history. Strength: weak, because
                          the owner expects the move near the first
                          release, so few or no releases may be cut
                          from dev before it.

