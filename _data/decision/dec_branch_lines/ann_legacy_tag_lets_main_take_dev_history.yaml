title:                  Legacy history under a tag, freeing main to take dev's history
brief:                  |
                        The legacy tree is now kept under a tag, so
                        the move to main need not keep the legacy
                        history on main. main can take dev's history
                        whole, and every release tag made on dev then
                        stays in main's history, which gives the first
                        release from main a known start. This holds
                        only if dev is not squashed again once a
                        release is tagged on it.
description:            |
                        Sources:
                        - Ruling of 2026-10-23: "the legacy tree is
                          kept under a tag and not pruned"
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml
                          lines 13-14); the tag is baseline_20260918
                          (_data/decision/dec_growth_policy/opt_continue_and_prune_legacy.yaml
                          lines 13-15).
                        - origin's main branch still holds the legacy
                          September iteration (_sources/context.md
                          line 32).
                        - The bump is computed from the commit items
                          since the last release
                          (_data/decision/dec_version_scheme/ruling_semver_computed.yaml
                          lines 13-14; opt_semver_computed.yaml lines
                          12-15).
                        - dev was squashed into one root commit on
                          2026-10-20, with the earlier history under
                          tag pre_squash_20261020
                          (_data/decision/dec_growth_policy/ann_seed_reaches_main_as_one_commit.yaml
                          lines 24-28).
                        - Assumption: the move points main at dev's
                          tip rather than merging dev into the legacy
                          history. Strength: moderate. It answers the
                          traceability challenge to this option only
                          if the move is made this way, which the
                          option does not yet say. Drafted by Claude
                          in the review of 2026-10-23.

