title:                  Dev, then main, then next
brief:                  |
                        Releases come from dev until the maintainer
                        moves the release line to main, which then
                        takes dev's history whole, with the legacy
                        history kept under its tags; after 1.0,
                        breaking work collects on next until a major
                        release. Ruled by WTP on 2026-10-24, as
                        recommended, and together with
                        dec_breaking_work_after_version_one. On
                        history: "At this early stage, history is less
                        important." The release line is not promised
                        never to be squashed again: "I will AVOID
                        squashing after release 1.0 ... But I cannot
                        and will not rule it out", since a
                        generational change may one day have to "throw
                        everything away and start afresh, taking
                        nothing but lessons learned and some wisdom
                        into the new generation."

