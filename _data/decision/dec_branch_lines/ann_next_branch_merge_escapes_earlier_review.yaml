title:                  Unreviewed conflict resolution in the merge of next
brief:                  |
                        A next branch that collects breaking work
                        until a major release is a queue of changes
                        off the release line, brought back in one
                        merge. Until then dev and next diverge, and
                        any conflict resolved in that merge is new
                        material no earlier review saw.
description:            |
                        Sources:
                        - The option collects breaking work on a next
                          branch until a major release
                          (_data/decision/dec_branch_lines/opt_dev_then_main_then_next.yaml
                          lines 12-16).
                        - The owner expects to bundle breaking changes
                          into one major release after 1.0 (owner's
                          statement, 2026-10-22T16:23;
                          _sources/context.md line 16).
                        - For a merge, the prepare-commit-msg hook
                          gives it its commit item and names what it
                          removes or renames (AGENTS.md lines 90-92).
                        - Assumption: work on next and dev will touch
                          some of the same files between major
                          releases, so the merge will need conflict
                          resolution. Strength: moderate; each commit
                          on next can still be reviewed as it lands,
                          so the risk sits mainly in the merge.

