title:                  Patch releases while breaking work waits
brief:                  |
                        After 1.0 a fix must be releasable at once
                        even while breaking work is under way. A
                        separate branch for breaking work keeps the
                        release line always fit for a patch; one trunk
                        holds both, so a fix must wait or be cut from
                        a branch made at the time.
description:            |
                        Sources:
                        - Under the dev, main and next option,
                          breaking work collects on next until a major
                          release
                          (_data/decision/dec_branch_lines/opt_dev_then_main_then_next.yaml,
                          brief).
                        - Git flow keeps separate develop, release,
                          hotfix and main branches
                          (_data/decision/dec_branch_lines/opt_git_flow.yaml,
                          brief); a hotfix branch is made from main
                          and merged back into main and develop
                          (https://nvie.com/posts/a-successful-git-branching-model/).
                        - Under one trunk, one branch carries all work
                          and releases are tags on it
                          (_data/decision/dec_branch_lines/opt_trunk_with_release_tags.yaml,
                          brief).
                        - Owner's statement (2026-10-22T16:23): after
                          1.0, breaking changes are bundled "into one
                          release and make it a major version bump"
                          (_sources/context.md line 16).
                        - Owner's statement (2026-10-22T16:33): "I'd
                          like to be able to respond to reported
                          problems quickly and largely automatically"
                          (_sources/context.md line 24). Strength:
                          strong after 1.0; before 1.0 every option
                          can release fixes at once.

