title:                  Record of what a document establishes
brief:                  |
                        How is what one external document establishes,
                        with the passages that show it, recorded in
                        the graph?
description:            |
                        WTP asked for a data item type for research
                        notes on his library of papers, so that they
                        can be integrated into cc-public later (WTP,
                        2026-10-28). A first corpus of 22 notes was
                        written by another assistant from a brief,
                        with a proposal for cc-public, in a private
                        segment beside the library. An external
                        document is already the proxy for each paper,
                        and an annotation already makes one assertion
                        that may argue for or against an option.

