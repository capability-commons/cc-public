title:                  Reading note with an excerpt list
brief:                  |
                        A new type, reading note, with the prefix
                        reading: one standalone item per external
                        document, about that document, whose brief
                        says what the document establishes. It holds a
                        list of excerpts, each with the section
                        heading of the source, a short exact quote and
                        the claim the quote supports, as plain fields
                        with no identity and no rights of their own.
                        The note has no edges to decisions, options or
                        concerns; a claim that bears on a decision is
                        an annotation that cites the external
                        document. A question that matters to one line
                        of research, such as the burden on node
                        authors, goes in the description, not in a
                        field of the type.
description:            |
                        Claude's recommendation of 2026-10-28, from
                        the proposal of the first corpus with its
                        excerpts changed. The prefix is a whole word
                        of the preferred term, as the prefix rule
                        asks.

