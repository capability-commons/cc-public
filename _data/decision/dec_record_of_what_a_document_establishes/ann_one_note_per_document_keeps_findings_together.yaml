title:                  One note per document that keeps its findings together
brief:                  |
                        A paper is read once and summarized once. With
                        standalone annotations only, a paper's
                        findings scatter across many items with
                        nothing that says what the paper as a whole
                        establishes, and every annotation about a
                        paper would have to be told apart from one
                        that argues a decision. One note per document
                        keeps the summary in one place and leaves
                        annotations to argue. A field for one research
                        question, such as the burden on node authors,
                        would tie a general type to one line of
                        research, so it belongs in the description.
description:            |
                        Sources:
                        - An annotation makes one assertion about
                          items in the graph, and an annotation about
                          a decision argues for or against an option.
                          (_data/decision/dec_record_of_what_a_document_establishes/dec_record_of_what_a_document_establishes.yaml
                          at description)
                        - The first corpus holds 22 notes, each with
                          its excerpts and a field for the burden on
                          node authors (first-corpus proposal,
                          cc-public-proposal.md, 2026-10-28).

