title:                  Quotes in fields that a check can verify
brief:                  |
                        A quote, its section heading and its source
                        file held in fields can be checked
                        mechanically: the quote is found in the
                        converted text under that heading, and is
                        short. Held in prose, as the
                        embedded-annotation option and the
                        standalone-annotation option hold it, a check
                        would have to parse a description convention.
                        The first corpus already ran such a quote
                        check outside cctool, so the check is wanted.
description:            |
                        Sources:
                        - The proposal says that with excerpts as
                          annotations, quote extraction follows a
                          documented description convention rather
                          than separate machine-readable fields, and
                          that a quote validator checks length, exact
                          membership and section membership
                          (first-corpus proposal,
                          cc-public-proposal.md, 2026-10-28).

