title:                  Reading note with embedded annotations
brief:                  |
                        A new type, reading note, as in the
                        excerpt-list option, except that each excerpt
                        is an embedded annotation about the external
                        document, with its own id, guid and rights;
                        its title names the section, its brief states
                        the claim, and its description gives the
                        source file and the quote in prose. The type
                        has a field for the burden on node authors.
description:            |
                        The proposal of the first corpus of reading
                        notes (2026-10-28). It reuses the annotation
                        type rather than adding fields for an excerpt,
                        and gives each excerpt explicit rights because
                        the annotation schema requires them.

