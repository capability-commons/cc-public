title:                  Embedded excerpts that carry rights against the rights ruling
brief:                  |
                        Rights attach to what travels, and an embedded
                        item takes the rights of its container and
                        carries none of its own. An excerpt always
                        travels inside its note, so an embedded
                        annotation that carries copyright, license and
                        protective mark breaks that ruling; it does so
                        only because the annotation schema requires
                        the rights of a standalone item. An excerpt
                        list with plain fields takes the note's
                        rights, as the ruling asks, and adds no
                        exception.
description:            |
                        Sources:
                        - Rights attach to what travels; an embedded
                          item always travels with its container, so
                          it takes the rights of its container and
                          carries none of its own.
                          (_data/decision/dec_rights_on_traveling_items/ruling_rights_on_traveling_items.yaml
                          at brief)
                        - The proposal gives each embedded excerpt
                          explicit private rights because the
                          annotation schema composes the standalone
                          schema (first-corpus proposal,
                          cc-public-proposal.md, 2026-10-28).

