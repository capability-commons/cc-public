title:                  No buffer analysis tool to depend on
brief:                  |
                        Under one message per step the capacity of an
                        edge is a product and a sum, and its depth is
                        one or two messages, so cctool needs no
                        solver. Declared rates need the balance
                        equations solved and a schedule and buffer
                        sizes computed, which is well understood but
                        still code to write and keep. Configured
                        queues need the minimum deadlock-free depths
                        computed, which for a throughput target is an
                        NP-complete search. That is a substantial
                        piece of analysis that cc-public must write
                        and maintain or take from a third party such
                        as an academic tool set, with its own license
                        and maintainer to watch. The engine side
                        differs as well: deadlock detection is engine
                        code that must be carried as a recorded
                        exception.
description:            |
                        Sources:
                        - Finding the buffer sizes that meet a
                          throughput target is NP-complete, though
                          real kernels take milliseconds to minutes
                          (Stuijk, Geilen and Basten 2006, Exploring
                          trade-offs in buffer requirements and
                          throughput constraints for SDF graphs).
                        - Lattuada and Ferrandi compute throughput and
                          buffers of a placed solution with an
                          existing SDF tool, SDF3 (Lattuada and
                          Ferrandi 2013, Modeling pipelined
                          applications with synchronous dataflow
                          graphs).
                        - The engine does nothing a node could do, and
                          behavior moves into it only by a recorded
                          decision with a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief) ASSUMPTION: no buffer analysis
                          tool now in use is suitable as a dependency
                          of cctool; its license and maintenance were
                          not checked. Strength: moderate; it would
                          fade if a well maintained, permissively
                          licensed analysis library were found.

