title:                  Declared rates per port
brief:                  |
                        Each port declares how many messages it reads
                        or writes per firing, as in multirate
                        synchronous dataflow, and the generator solves
                        the balance equations for a schedule and the
                        buffer size of each edge. Nodes may fire
                        several times in a step.
description:            |
                        Synchronous dataflow (Lee and Messerschmitt
                        1987) and cyclo-static dataflow (Bilsen et al.
                        1996). The schedule and buffer sizes are
                        decidable, but node authors state rates, and a
                        graph whose rates do not balance is rejected.

