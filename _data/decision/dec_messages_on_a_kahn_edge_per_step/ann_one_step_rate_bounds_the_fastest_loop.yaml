title:                  One step rate that bounds the fastest loop the Kahn part can close
brief:                  |
                        One message per step decouples the data rate
                        from the step rate, so a 200 Hz sensor feeding
                        a 30 Hz step arrives as a list of about seven
                        items, and moving to a platform or sensor with
                        other rates changes only derived capacities,
                        not the graph. That is good for flexibility.
                        The limit is the other way: a control loop
                        that must close faster than the step cannot be
                        written in the Kahn part at all, and must go
                        to an actor or another subsystem, or the whole
                        Kahn part must step at the fastest rate any
                        loop needs. Declared rates per port let a node
                        fire several times in a step, which can model
                        a fast inner loop beside a slow outer one in
                        one graph, though those firings still fall
                        within the step unless the schedule spreads
                        them. The single rate fits Patrol, where the
                        camera sets the pace, and should be stated as
                        a limit for graphs that mix fast control with
                        slow perception.
description:            |
                        Sources:
                        - A single step rate for the whole Kahn part,
                          with each message a list of items (WTP,
                          2026-10-28).
                        - Every producer has a stated maximum rate,
                          and capacity is derived from the maximum
                          rate times the step period plus a jitter
                          margin, by a transform in variant generation
                          (WTP, 2026-10-28).
                        - Multirate synchronous dataflow lets nodes
                          fire at different rates within one periodic
                          schedule (Lee and Messerschmitt 1987,
                          Synchronous data flow).
                        - A real fixed-step robot controller stack
                          needed single-rate discrete execution, and
                          its controllers were very sensitive to time
                          delays (Ferigo et al. 2020, A generic
                          synchronous dataflow architecture to rapidly
                          prototype and deploy robot controllers).
                          ASSUMPTION: Patrol's Kahn part has no loop
                          that must close faster than the camera step;
                          a motor current loop, if any, runs outside
                          the engine. Strength: moderate; a real limit
                          of the option, which matters only when a
                          graph needs loops at two very different
                          rates.

