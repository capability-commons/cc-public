title:                  Rate declarations and balance failures that fall on node authors
brief:                  |
                        Declared rates per port ask every node author
                        to state how many messages each port reads or
                        writes per firing, and a graph whose rates do
                        not balance is rejected with an error about
                        rates the integrator did not write. One
                        message per step asks only for the maximum
                        items per step on an output port, which the
                        derived capacity needs anyway, and makes every
                        node a function called once per step.
                        Configured queues ask nothing of node authors,
                        but someone must choose and maintain a depth
                        for each edge, and a deadlock found in the
                        field points at a depth rather than at the
                        code that caused it. The single rule is the
                        easiest of the three for a newcomer to
                        understand and the least likely to spread a
                        change from one node to its neighbors.
description:            |
                        Sources:
                        - Under declared rates, node authors state
                          rates, and a graph whose rates do not
                          balance is rejected.
                          (_data/decision/dec_messages_on_a_kahn_edge_per_step/opt_declared_rates_per_port.yaml
                          at description)
                        - Non-sensor ports declare maximum items per
                          step, possibly as a function of their
                          inputs, propagated downstream (WTP,
                          2026-10-28).
                        - WTP wants the approach pragmatic and as
                          simple as feasible, avoiding clever
                          mechanisms that burden node authors (WTP,
                          2026-10-28).
                        - Under scalable dataflow, blocks are user
                          code written to handle a vector of samples
                          in one activation (Ritz et al. 1993, Optimum
                          vectorisation of scalable synchronous
                          dataflow graphs, section 1); with a run-time
                          count they loop to the count received, which
                          is the same small burden under every option
                          that uses bounded arrays. Strength: moderate
                          to strong; it rests on WTP's stated
                          preference and on the option texts rather
                          than on a measurement of author effort.

