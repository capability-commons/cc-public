title:                  One message per Kahn edge per step
brief:                  |
                        Each Kahn edge carries one message per step.
                        Ruled by WTP on 2026-10-28, as recommended,
                        with a note: besides the bounded array of
                        items, a message may also carry an enable flag
                        or a mode flag, so that parts of the dataflow
                        graph can run conditionally.

