title:                  Full message reserved on every edge, and batches for slow readers
brief:                  |
                        One message per step costs memory and latency.
                        Every edge reserves a whole message at its
                        capacity, or two where writer and reader
                        overlap, even on steps that carry nothing, and
                        a consumer that needs data only now and then
                        still runs every step, usually on an empty
                        list. Declared rates per port let a slow node
                        fire less often and size each buffer to what
                        its rates need, and a configured queue can be
                        shallow where the designer knows the traffic
                        is light. The cost is the one Ritz et al.
                        measured for scalable dataflow, and it buys
                        the static sizes argued elsewhere, so it is a
                        reason to keep the deeper options as recorded
                        exceptions rather than a reason to reject the
                        default.
description:            |
                        Sources:
                        - Scalable synchronous dataflow cuts the
                          overhead of each activation by carrying a
                          block of samples, at the cost of more data
                          memory and more latency, and the paper
                          bounds both by a cap on the blocking factor
                          (Ritz, Pankert, Zivojnovic and Meyr 1993,
                          Optimum vectorisation of scalable
                          synchronous dataflow graphs, section 1).
                        - In multirate synchronous dataflow each node
                          fires as often as the balance equations
                          require, and the buffer of each arc follows
                          from the schedule (Lee and Messerschmitt
                          1987, Synchronous data flow).
                        - The known cost of the option: each edge
                          reserves a full message, and a slow consumer
                          sees data in batches.
                          (_data/decision/dec_messages_on_a_kahn_edge_per_step/opt_one_message_per_kahn_edge_per_step.yaml
                          at description) ASSUMPTION: on the Orin the
                          memory reserved for full messages is small
                          next to the image and tensor buffers that
                          dominate Patrol's graph; this needs a
                          measurement. Strength: moderate; it would
                          grow if a target with little memory, the
                          embedded reach the engine aims at, ran
                          graphs with many large, mostly empty edges.

