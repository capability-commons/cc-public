title:                  Deadlock reduced to a loop without a first value
brief:                  |
                        With one message per edge per step, every edge
                        is on one clock and every buffer has a known
                        size before the graph runs, so the only
                        deadlock left is a loop with no first value,
                        which the ruled check on feedback defaults
                        rejects before deployment. Queues of
                        configured depth with dynamic rates leave
                        artificial deadlocks possible, and the best
                        the engine can then do is detect one and raise
                        a fault while the system runs. For a safety
                        function, a stall that is reported is still a
                        stall: rejecting the graph before it runs
                        removes the hazard, while detecting it at run
                        time only starts the fail-safe. Declared rates
                        per port are also decidable before running, so
                        the case is against the configured queues, not
                        against declared rates.
description:            |
                        Sources:
                        - Whether a general Kahn network runs in
                          bounded memory is undecidable, and Parks'
                          remedy for artificial deadlock is to grow
                          the smallest full channel (Parks 1995,
                          Bounded scheduling of process networks,
                          chapters 3 and 4).
                        - A cycle of blocked processes in one part of
                          a system goes undetected by a global check
                          while the rest runs, and a cycle with no
                          initial token is a real deadlock that no
                          capacity fixes (Geilen and Basten 2003,
                          Requirements on the execution of Kahn
                          process networks).
                        - In synchronous Kahn networks an argument
                          crosses the whole network in one step, and a
                          recursion is deadlock-free if it passes
                          through a delay, which is easy to check
                          statically (Caspi and Pouzet 1996,
                          Synchronous Kahn networks, sections 2.1 and
                          3.2).
                        - The engine allocates every edge buffer from
                          the port types, and reallocation by an
                          owning end was rejected as unfit for
                          controlled allocation.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief)
                        - A feedback edge needs at least one end that
                          declares it can supply a default.
                          (_data/decision/dec_default_values_on_feedback_edges/ruling_default_from_a_port_that_declares_it.yaml
                          at brief) Strength: strong; it would weaken
                          only if graphs that need queues deeper than
                          one message turned out to be common.

