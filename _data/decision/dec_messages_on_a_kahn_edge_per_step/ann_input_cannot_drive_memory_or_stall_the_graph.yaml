title:                  Input that cannot drive memory use or stall the graph
brief:                  |
                        Under one message per step no buffer size and
                        no firing depends on the data, so a flood of
                        input, from a faulty sensor or a hostile peer
                        on the network, can at most fill one message
                        to its capacity, where the port's declared
                        fail-safe takes over. Declared rates have the
                        same property. Under configured queues with
                        dynamic rates, how full each queue gets
                        depends on the data, so an input crafted to
                        make one node write more than its readers take
                        can drive part of the graph into a deadlock.
                        The detector reports it, but the graph has
                        stopped, which is a denial of service an
                        attacker can reach through data alone.
description:            |
                        Sources:
                        - Bounded memory is undecidable once token
                          rates depend on data (Buck 1993, Scheduling
                          dynamic dataflow graphs with bounded memory
                          using the token flow model).
                        - A stream combined with a sampled copy of
                          itself needs storage that grows and will
                          sooner or later overflow, which the clock
                          calculus rejects before running (Caspi and
                          Pouzet 1996, Synchronous Kahn networks,
                          section 2.1).
                        - Overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                        - Where rates are dynamic, a cycle of blocked
                          nodes is reported as a fault, and the engine
                          never grows a queue.
                          (_data/decision/dec_messages_on_a_kahn_edge_per_step/opt_queues_of_configured_depth_with_deadlock_detection.yaml
                          at brief) Strength: moderate; it applies
                          only to graphs with dynamic rates and inputs
                          an attacker can reach.

