title:                  Queues of configured depth with deadlock detection
brief:                  |
                        Each Kahn edge has a queue whose depth is set
                        in configuration, and a node fires only when
                        each of its outputs has room for the most
                        messages a step may write. Where rates are
                        static or periodic, cctool computes the
                        smallest depths that cannot deadlock and
                        checks the configured depths against them.
                        Where rates are dynamic, each blocked node
                        names the node it waits on, and a cycle in
                        that relation is reported as a fault; the
                        engine never grows a queue.
description:            |
                        The three parts follow the literature for
                        fixed buffers: computed minimum capacities
                        (Stuijk, Geilen and Basten 2006; Cohen et al.
                        2006 on N-synchronous Kahn networks), firing
                        only when outputs have room (Parks 1995), and
                        local deadlock detection (Geilen and Basten
                        2003, who show that a global check misses a
                        deadlock in one part of a system while the
                        rest runs). Buck (1993) adds graph assertions,
                        such as at most N in a row, that can make an
                        unbounded graph provably bounded.

