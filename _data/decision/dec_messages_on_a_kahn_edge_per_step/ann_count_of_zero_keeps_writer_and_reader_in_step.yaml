title:                  Count of zero that keeps writer and reader in step
brief:                  |
                        Three independent sources trace deadlock or a
                        starved reader to a node that sometimes writes
                        an output and sometimes does not, while its
                        reader expects one. Under one message per edge
                        per step a node with nothing to say still
                        writes a message whose count is 0, so every
                        reader gets exactly one message every step and
                        no producer can fall out of step with its
                        consumers. Queues of configured depth with
                        dynamic rates admit the selective writes that
                        cause these deadlocks. Declared rates avoid
                        them too, since each port writes a fixed
                        number of messages per firing; the case here
                        is against the configured queues.
description:            |
                        Sources:
                        - In the worked example of Kavi et al., two
                          cycles deadlock because selective outputs,
                          chosen far apart, are not correlated; a
                          firing cycle is live when the links it
                          consumes equal those it produces (Kavi,
                          Buckles and Bhat 1986, A formal definition
                          of data flow graph models, Theorem 1 and the
                          example).
                        - In static token form, a value is defined
                          under exactly the condition under which it
                          is used, and each channel action appears at
                          most once in a loop body (Teifel and Manohar
                          2004, Static tokens: using dataflow to
                          automate concurrent pipeline synthesis,
                          sections 2 and 3).
                        - A discrete-event integrator that did not
                          emit on every input deadlocked a feedback
                          loop, and the fix was to force an output
                          after every input (McInnes and Thorne 2010,
                          ScipySim: toward heterogeneous system
                          simulation for the SciPy platform).
                        - Each message is a bounded array whose length
                          varies per message up to a capacity.
                          (_data/decision/dec_how_values_of_varying_size_are_held/ruling_bounded_array_of_fixed_size_elements.yaml
                          at brief) Strength: strong for the class of
                          deadlock it names; it says nothing about
                          overload, which is a separate decision.

