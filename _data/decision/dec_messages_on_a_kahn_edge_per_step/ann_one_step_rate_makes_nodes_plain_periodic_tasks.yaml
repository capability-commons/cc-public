title:                  One step rate that makes nodes plain periodic tasks
brief:                  |
                        With one message per edge per step, every node
                        fires once per step, so the repetition vector
                        is all ones. That is the class of graph in
                        which running each node as a strictly periodic
                        task loses no throughput, start times and
                        buffer sizes come out in closed form, and an
                        ordinary schedulability test decides whether a
                        placement, or a change set, fits the execution
                        units. Declared rates per port keep periodic
                        scheduling possible, but each period then
                        follows from the repetition vector, and graphs
                        with mismatched rates are where it fell short
                        of the best throughput. Configured queues with
                        dynamic rates fall outside the analysis
                        altogether.
description:            |
                        Sources:
                        - The actors of an acyclic cyclo-static graph
                          with periodic input can be scheduled as
                          implicit-deadline periodic tasks, and this
                          matched the self-timed throughput in 16 of
                          19 applications, falling short for
                          mismatched-rate graphs (Bamakhrama and
                          Stefanov 2011, Hard-real-time scheduling of
                          data-dependent tasks in embedded streaming
                          applications, abstract and section 5.2).
                        - A single step rate for the whole Kahn part,
                          with each message a list of items, so Kahn
                          edges are homogeneous synchronous dataflow
                          with one message per edge per step (WTP,
                          2026-10-28).
                        - A deployment may apply any change set that
                          checks against the graph it is running.
                          (_data/decision/dec_runtime_mode_set/ruling_any_change_set_checked_against_the_running_graph.yaml
                          at brief) ASSUMPTION: Patrol's Kahn part is
                          acyclic apart from feedback edges with first
                          values; the 2011 proofs cover acyclic graphs
                          only, so loops need their own analysis.
                          Strength: strong for throughput and
                          admission checks; the latency cost of this
                          schedule is argued on the decision on
                          same-step or next-step reading.

