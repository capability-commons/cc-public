title:                  Edge guids that whatever generates edges must mint stably
brief:                  |
                        Edges come from a base generated from a table,
                        from joins, and during resolution from
                        insert-on-edge and lowering. A guid per edge
                        must then be kept in the table, or every
                        regeneration mints new ones and breaks each
                        operation that names an edge, and edges made
                        during resolution, which is never stored, need
                        guids from a fixed rule, or the content digest
                        and any staleness check drift. Renames gain
                        nothing, since the ends are ids the rename
                        command already rewrites.
description:            |
                        Sources:
                        - The Patrol base has 41 edges and is
                          generated from a table.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 22-23)
                        - Each edge carries an id with a guid, unique
                          within its graph.
                          (_data/decision/dec_identity_of_a_dataflow_edge/opt_edge_identified_by_id_with_guid.yaml,
                          brief)
                        - Insert-on-edge and edge-policy lowering
                          split one edge into two.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_split_edge_plain_by_ends_open_for_a_key.yaml,
                          brief)
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - Non-hermetic transforms break every identity
                          scheme.
                          (_sources/survey/generative-and-transforms.md
                          line 157)
                        - The rename command rewrites every whole-id
                          match, including the node ids at each end of
                          an edge. (src/cctool/edit/edit.py within PATTERN_WHOLE_ID and _renamed_documents;
                          _data/schema/sch_dataflow_graph.yaml at description)
                        - The table generator writes no guids today.
                          (_sources/cc-patrol-notes/draft/tools/gen_base.py
                          line 77) ASSUMPTION: once it writes them, it
                          mints a fresh guid on each run unless the
                          table stores one. Strength: moderate; the
                          upkeep grows with edges, lowering passes and
                          taps, and falls away if bases stop being
                          generated and the option gives a
                          deterministic rule for generated edges.

