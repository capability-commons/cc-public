title:                  A pair of ends unique in every checked graph
brief:                  |
                        A check already allows at most one edge into
                        each input, so in every runnable resolved
                        graph a pair of ends names exactly one edge,
                        and each end is a reference that renames keep.
                        An operation naming an edge that an earlier
                        operation removed then finds nothing, and with
                        a precondition fails rather than picking
                        another edge, and a failure on a resolved
                        edge, which has no file and line, can name the
                        edge by its ends as the resolver sketch
                        already does.
description:            |
                        Sources:
                        - The input-fed-twice check fails when more
                          than one edge ends at an input, counting a
                          second copy of one edge too.
                          (src/cctool/check/check.lp lines 3204-3229)
                        - Among the 41 edges of the Patrol base no
                          pair of ends repeats, though six inputs take
                          two or more edges, which an abstract base
                          may. (count over
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 349-520;
                          _sources/cc-patrol-notes/variants.md lines
                          124-127)
                        - Each end names a node and a port by id and
                          guid, and both are references, so a rename
                          keeps the edge.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          28-32 and 144-171)
                        - The extractor records each edge with the
                          file and line of its place in the list, and
                          a resolved graph is never stored.
                          (src/cctool/graph/extract.py lines
                          1719-1732;
                          _data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-16)
                        - The sketch's output reports the edges that
                          cross hosts by their ends, such as
                          rtp_forward to console_rtp_receive.
                          (_sources/cc-patrol-notes/draft/resolved.txt
                          line 14)
                        - The survey recommends that each operation
                          state a precondition, so that removing an
                          absent element fails.
                          (_sources/survey/README.md lines 45-48)
                          Strength: strong for runnable graphs at any
                          size, held by a check rather than habit;
                          weak for abstract bases, which need their
                          own uniqueness check on pairs of ends.

