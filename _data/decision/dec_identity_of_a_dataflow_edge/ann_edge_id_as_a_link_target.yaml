title:                  An edge that a requirement or ruling can name
brief:                  |
                        Nodes carry an id, a guid and a brief, so
                        other items can link to them. An edge with an
                        id and a guid becomes a link target too, so a
                        need on one connection, such as a cross-host
                        stream, traces to one element and renames keep
                        the link; ends, alone or with an optional key,
                        and target ends give no single target.
description:            |
                        Sources:
                        - A node in a checked graph carries id_self
                          and guid_self.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                          lines 48-49) Patrol nodes carry a brief.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 36-40)
                        - Rename map entries are an old id, a new id
                          and the guid.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 13-17)
                        - In the mixed variant four edges cross hosts,
                          each with a policy.
                          (_sources/cc-patrol-notes/draft/resolved.txt
                          lines 14-17)
                        - ASSUMPTION: requirements or rulings will
                          target single connections, such as a
                          cross-host policy; none does today.
                          Strength: moderate; it grows with
                          requirements on links, and is void if none
                          ever targets an edge.

