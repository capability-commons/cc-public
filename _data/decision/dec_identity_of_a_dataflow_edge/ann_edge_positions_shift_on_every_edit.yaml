title:                  Edge positions that shift on every edit
brief:                  |
                        Every Patrol variant starts with a filter, and
                        a filter removes edges, so the positions of
                        all later edges change; a child variant
                        resolves on its parent's output, so any change
                        to an ancestor shifts the list the child's
                        positions name. An operation that names an
                        edge by position then names a different edge
                        without any error, every variant naming a
                        later edge must be edited, and a base
                        generated from a table can reorder its edges
                        on regeneration.
description:            |
                        Sources:
                        - All six Patrol variant drafts begin with a
                          filter, and "A tag filter removes tagged
                          nodes with their edges, and tagged edges."
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 21-24, and the first operation of each
                          other variant draft)
                        - Three variants have the abstract Orin
                          variant as base.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          line 18, dfv_patrol_orin_tracks.yaml line
                          17, dfv_patrol_orin_video.yaml line 18)
                        - The edge list is an ordered array in the
                          schema.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          98-106)
                        - The sketch resolver rebuilds the edge list
                          on every filter.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 40-43)
                        - "If removing an element from an array, any
                          elements above the specified index are
                          shifted one position to the left." (RFC 6902
                          section 4.2,
                          https://www.rfc-editor.org/rfc/rfc6902)
                        - The Patrol base is generated from a table.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 22-23)
                        - A position carries no guid for rename maps
                          to follow.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 13-15)
                        - One maintainability question is how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml line 395)
                          Strength: strong; the spread grows with
                          variants, edges and the depth of variant
                          chains.

