title:                  Partner formats that name a connection by its ends
brief:                  |
                        An SSP connection names its two ends, element
                        and connector, and lists no key, so a graph
                        whose edges are identified by ends maps to and
                        from SSP with no invented data. A key has to
                        be made up on import and is lost on export,
                        and a position has no stable counterpart in a
                        partner's format.
description:            |
                        Sources:
                        - The SSP 2.0 connection has start element and
                          connector and end element and connector,
                          plus indices and a unit conversion flag, and
                          its attribute table lists no key.
                          (https://ssp-standard.org/docs/2.0, section
                          5.3.2)
                        - SSP model entities may carry an optional
                          file-wide unique id; whether a connection is
                          one could not be confirmed. ASSUMPTION: an
                          SSP file from a partner tool usually gives
                          connections no id. (same source, section
                          4.1)
                        - SED-ML addresses its changes by XPath, and
                          the BioSimulations conventions show a target
                          selected by an element's id; they do not
                          discuss positions.
                          (https://docs.biosimulations.org/concepts/conventions/simulation-experiments/)
                        - Rename maps rewrite each reference in a
                          peer, and edge keys would add one more class
                          of reference for them to carry.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief) Strength: moderate; it holds at
                          any size, and its weight depends on whether
                          an SSP or FMI exchange is ever built.

