title:                  Edge named by its ends, with an optional key
brief:                  |
                        An operation names a dataflow edge by its
                        source node and port and its target node and
                        port. Where one pair of ends carries more than
                        one edge, each of those edges carries a key,
                        and an operation names it by that key.
description:            |
                        Proposed by the simplicity and maintainability
                        and the functional suitability and
                        compatibility advocates
                        (_sources/four-decisions-argued.md line 796),
                        following the framing study's recommendation
                        (_sources/variants-framing.md line 148).

