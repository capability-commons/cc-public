title:                  A split edge plain under ends and open under a key
brief:                  |
                        Insert-on-edge and edge-policy lowering split
                        an edge in two. With ends the result is plain,
                        the old pair gone and two new pairs present;
                        with a key the rule must say which half keeps
                        the key, or later operations and the lowering
                        may act on the wrong half. A key does survive
                        a substitution that changes a node's id, but
                        if substitution keeps the id, that advantage
                        disappears.
description:            |
                        Sources:
                        - Insert-on-edge is needed for a tap such as a
                          recorder. (_sources/variants-framing.md
                          line 47)
                        - A lowered edge policy turns the policy into
                          an adapter node on the edge.
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml
                          lines 20-24)
                        - Substitution replaces a node's
                          implementation, as in CVL's fragment
                          substitution; whether it keeps the node id
                          is open, and Guix distinguishes rewriting by
                          identity from rewriting by name.
                          (_sources/variants-framing.md line 50;
                          _sources/survey/generative-and-transforms.md
                          lines 62-63 and 132)
                        - ASSUMPTION: a substitute that keeps the node
                          id leaves every pair of ends unchanged.
                          Strength: moderate; it grows with the number
                          of lowering passes and taps.

