title:                  Duplicate-edge detection that depends on edge identity
brief:                  |
                        Today a check counts edges into an input where
                        they are written, by file and line, so a
                        second copy of one edge is caught; a resolved
                        graph is never stored, so its edges have no
                        file and line. If edges are known only by
                        their ends, two copies of one edge become one
                        fact and a duplicating join must instead be
                        refused by a precondition, while a key keeps
                        two copies distinct.
description:            |
                        Sources:
                        - The input-fed-twice check counts edges by
                          file and line, so a second copy of one edge
                          counts too. (src/cctool/check/check.lp lines
                          3205-3208 and 3226-3229)
                        - The dataflow edge fact carries file and
                          line. (src/cctool/graph/extract.py lines
                          321-327 and 1724-1732)
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          line 15)
                        - The extractor collects facts in a set, and
                          an atom in clingo is true once, so two edges
                          with the same ends and nothing else to tell
                          them apart would give one fact.
                          (src/cctool/graph/extract.py lines
                          1724-1731) Strength: moderate; the fix is
                          small, a precondition on join, but it must
                          be made and it touches the checks whichever
                          option is ruled.

