title:                  Edges addressed only in groups so far
brief:                  |
                        No Patrol variant names a single edge: edges
                        are dropped by tag, or with the nodes they
                        touch. Single-edge identity is needed only by
                        operations not yet drafted, such as
                        insert-on-edge and edge-policy lowering, so
                        the option that adds least to the schema is
                        the one to prefer until one of those is
                        ported.
description:            |
                        Sources:
                        - The filter removes tagged edges and edges
                          touching removed nodes.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 40-43;
                          _sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 21-25)
                        - Five base edges carry tags.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 434, 439, 484, 489 and 518)
                        - A field is added only when a real instance
                          needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief; AGENTS.md#keep-it-small)
                        - Insert-on-edge is needed by the open
                          decisions on where engine behavior lives and
                          on edge policy.
                          (_sources/variants-framing.md lines 47-48)
                          Strength: moderate; it weakens once lowering
                          or recorder insertion is ported, which may
                          be soon.

