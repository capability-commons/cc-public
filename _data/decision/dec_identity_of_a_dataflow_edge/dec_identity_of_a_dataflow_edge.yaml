title:                  Identity of a dataflow edge
brief:                  |
                        How does a variant operation name the dataflow
                        edge it removes, rewrites or inserts a node
                        on?
description:            |
                        A dataflow edge today has only a source, a
                        target and a direction, and the write
                        operation in the Patrol drafts addresses only
                        keyed sections, so nothing names an edge for
                        an operation to act on
                        (_sources/variants-framing.md, sections 2 and
                        4, Q10; _data/schema/sch_dataflow_graph.yaml
                        lines 173-193).

