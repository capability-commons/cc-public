title:                  Ends that already name an edge, with no field added
brief:                  |
                        An edge is written as its two ends, and the
                        draft join names its new edge the same way, so
                        naming an edge by its ends adds no field and
                        no rule. A key adds a field, a uniqueness
                        check and a naming rule; a position adds a
                        rule for what an index means once a filter has
                        dropped edges.
description:            |
                        Sources:
                        - A dataflow edge requires source and target,
                          each an end naming a node and a port.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          144-191)
                        - The replay draft's joins name ends as edges
                          do.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          lines 47-63)
                        - The Patrol base has 41 edges and no two with
                          the same pair of ends.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 349-520)
                        - The sketch resolver rebuilds the edge list
                          on every filter.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 40-43) Strength: strong; ten times the
                          edges changes nothing in the mechanism.

