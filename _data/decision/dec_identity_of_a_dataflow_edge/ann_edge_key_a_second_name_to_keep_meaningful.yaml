title:                  An edge key as a second name to keep meaningful
brief:                  |
                        The ends of an edge are references, so an
                        operation that names an edge by its ends is
                        rewritten by the same rename command that
                        rewrites the base, and nothing extra is
                        maintained. A key is untouched by renames, but
                        it is a second name for the edge to keep
                        meaningful as its ends change.
description:            |
                        Sources:
                        - Both ends are references, so the checker
                          finds an end that names nothing and a rename
                          keeps the dataflow edge.
                          (_data/schema/sch_dataflow_graph.yaml at description)
                        - The rename command rewrites each reference
                          to the id its guid names.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief)
                        - ASSUMPTION: a key chosen to describe an
                          edge, such as decode_to_analysis, goes stale
                          when the edge's ends change. Strength:
                          moderate; it holds at scale, but the
                          staleness of keys is an assumption.

