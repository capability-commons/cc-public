title:                  One addressing rule for every section of the graph
brief:                  |
                        Hosts, OS processes and dataflow nodes are
                        keyed maps, and only edges are a list. Giving
                        edges keys would let write and remove address
                        every section of the graph by one rule of
                        section, key and field, while ends give edges
                        a second addressing form; the cost is
                        inventing a key for each of Patrol's 41 edges.
description:            |
                        Sources:
                        - host, os_process and dataflow_node are maps
                          keyed by a short local name, and
                          dataflow_edge is an array.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          67-106)
                        - write addresses keyed sections by dotted
                          address.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 26-32;
                          _sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 44-50) Strength: moderate; the gain is
                          uniformity, which holds at any scale,
                          against a one-off cost of keys.

