title:                  A target end that names no single edge where operations act
brief:                  |
                        A target end is unique only where each input
                        is fed once, which holds in runnable graphs,
                        but every Patrol variant applies its
                        operations to an abstract graph, where six
                        inputs take two or more edges. There the
                        target end names no single edge, so the rule
                        needs a fallback in the common case, and if a
                        parent has rewired an input, a child's
                        operation on the old edge silently acts on the
                        new one, where a name of both ends would find
                        nothing and fail.
description:            |
                        Sources:
                        - The option rests on an input being fed by at
                          most one edge in a checked graph.
                          (_data/decision/dec_identity_of_a_dataflow_edge/opt_edge_identified_by_its_target_end.yaml,
                          brief)
                        - Six inputs of the Patrol base take two or
                          more edges, which an abstract base may.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_pair_of_ends_unique_in_every_checked_graph.yaml,
                          description)
                        - The base of every Patrol variant is the
                          abstract base or the abstract Orin variant.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 18-19)
                        - A child variant resolves on its parent's
                          output
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 24-31), and every Patrol variant
                          starts with a filter. (the six dfv drafts in
                          _sources/cc-patrol-notes/draft/)
                        - Removing an absent element fails when
                          operations state preconditions.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_every_operation_states_its_preconditions.yaml,
                          brief)
                        - One maintainability question asks how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml line 395)
                          Strength: strong; abstract bases sit at the
                          root of every variant family, and silent
                          misdirection grows with the depth of variant
                          chains.

