title:                  Edge ids as a further set of names for rename maps to carry
brief:                  |
                        An id with a guid on each edge follows the
                        pattern of nodes, which is uniform, but it
                        adds 41 ids and guids to Patrol, a naming
                        rule, a uniqueness check and rename-map
                        entries, while no operation in the drafts
                        names a single edge.
description:            |
                        Sources:
                        - Rename map entries are an old id, a new id
                          and a guid.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief)
                        - Edges in the drafts are dropped by presence
                          tag or
                          with their nodes, never singly.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_no_variant_yet_names_a_single_edge.yaml,
                          brief)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.0)
                          Strength: moderate; uniformity holds at any
                          scale, and the case for ids grows once
                          lowering names single edges.

