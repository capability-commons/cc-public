title:                  Trace lost when an operation moves an edge's end
brief:                  |
                        If an edge is its ends, an operation that
                        rewires one end makes a different edge, and
                        insert-on-edge replaces one edge with two. The
                        link from the old edge, and from the policy
                        and presence tags it carried, to the new ones
                        then exists only if an origin record keeps it.
                        An explicit key can survive a rewire and give
                        lowered adapter nodes a stable root for their
                        names, but rename maps cover it only if the
                        key is an id with a guid, which the option
                        does not say.
description:            |
                        Sources:
                        - The decision asks how an operation names the
                          edge it removes, rewrites or inserts a node
                          on.
                          (_data/decision/dec_identity_of_a_dataflow_edge/dec_identity_of_a_dataflow_edge.yaml at brief)
                        - The Patrol base adds policy and presence tag
                          on
                          edges, and 5 of its 41 edges carry a presence tag.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 3-4, with presence tags at lines 434, 439, 484,
                          489 and 518)
                        - An edge with attributes is stored as a
                          record of its own, linked to both ends.
                          (_data/register/reg_concept.yaml at entries.concept_edge.description)
                        - A lowered adapter is an element with no
                          traced reason unless its id or a recorded
                          link names the edge and the policy.
                          (_data/decision/dec_edge_policy/ann_lowered_adapter_nodes_need_a_naming_rule.yaml at brief)
                        - Rename map entries are an old id, a new id
                          and the guid.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief) Strength: moderate; rewires
                          grow with lowering and edge policy, but an
                          origin record closes the gap under either
                          option.

