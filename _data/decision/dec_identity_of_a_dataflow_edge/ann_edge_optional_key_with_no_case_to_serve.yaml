title:                  An optional key with no case to serve
brief:                  |
                        The key in the optional-key option is for a
                        pair of ends that carries two edges. In a
                        runnable graph that would feed one input
                        twice, which a check forbids, and no pair of
                        ends repeats in the Patrol base, so the key
                        would be a second addressing form with no
                        instance.
description:            |
                        Sources:
                        - The input-fed-twice check fails when more
                          than one edge ends at an input.
                          (src/cctool/check/check.lp within input_fed_twice)
                        - No pair of ends repeats among the base's 41
                          edges.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_pair_of_ends_unique_in_every_checked_graph.yaml,
                          description)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.0)
                          Strength: strong while superset bases avoid
                          repeated pairs, which needs a uniqueness
                          check on bases that the plain ends option
                          needs too.

