title:                  Edge identified by its ends
brief:                  |
                        A dataflow edge is identified by its two ends.
                        Ruled by WTP on 2026-10-25, as recommended,
                        together with the ruling that every list of
                        the graph schema declares a merge key, of
                        which the pair of ends is the key for edges.

