title:                  Edge named by an id with a guid
brief:                  |
                        Each dataflow edge carries an id with a guid,
                        unique within its graph, as other items do,
                        and an operation names the edge by that id.
description:            |
                        The merge notes found the explicit key option
                        silent on whether the key is an id with a
                        guid, on which rename maps depend, and
                        proposed this wording
                        (_sources/four-decisions-argued.md line 787).

