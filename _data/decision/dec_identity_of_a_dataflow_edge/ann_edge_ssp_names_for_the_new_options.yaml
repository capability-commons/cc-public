title:                  Edge names at the boundary with SSP, for the new options
brief:                  |
                        An SSP connection is named by its two ends.
                        With an optional key used only in hand-written
                        abstract bases, a runnable graph exports and
                        imports with no invented data, as with ends
                        alone, while an id with a guid must be minted
                        for every connection on import. Whether SSP's
                        optional file-wide id applies to a connection,
                        so that an id could be carried out on export,
                        is not confirmed.
description:            |
                        Sources:
                        - An SSP 2.0 connection has a start element
                          and connector and an end element and
                          connector, with the connectors required.
                          (https://ssp-standard.org/docs/2.0, section
                          5.3.2)
                        - SSP model entities may carry an optional
                          file-wide unique id. (same source, section
                          4.1)
                        - The existing annotation makes this point for
                          a plain key and for position.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_partner_formats_name_connections_by_ends.yaml)
                          Strength: moderate; it depends on an SSP
                          exchange being built. On the target-end
                          option it says nothing distinct, since the
                          edge still holds both ends for export.

