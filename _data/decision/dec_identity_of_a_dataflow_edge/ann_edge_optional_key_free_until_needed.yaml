title:                  An optional key that costs nothing until a pair of ends repeats
brief:                  |
                        A pair of ends repeats in no Patrol graph,
                        even the abstract base, so under the
                        optional-key option no edge carries a key
                        today, and edges are named by their ends,
                        which renames already keep. The key is paid
                        for only by the graph that first needs one.
description:            |
                        Sources:
                        - In the Patrol base no pair of ends repeats,
                          though six inputs take two or more edges.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_pair_of_ends_unique_in_every_checked_graph.yaml,
                          description)
                        - A key is needed only where one pair of ends
                          carries more than one edge.
                          (_data/decision/dec_identity_of_a_dataflow_edge/opt_edge_identified_by_ends_with_optional_key.yaml,
                          brief)
                        - Both ends are references that a rename
                          keeps. (_data/schema/sch_dataflow_graph.yaml
                          lines 28-32) Strength: weak; the key may
                          never be used.

