title:                  Edge named by its target end alone
brief:                  |
                        An operation names a dataflow edge by its
                        target node and port only, since an input port
                        is fed by at most one edge in a checked graph.
description:            |
                        Proposed by the simplicity and maintainability
                        and the traceability, reviewability and
                        terminology advocates
                        (_sources/four-decisions-argued.md line 797),
                        who note that abstract bases have inputs fed
                        by more than one edge.

