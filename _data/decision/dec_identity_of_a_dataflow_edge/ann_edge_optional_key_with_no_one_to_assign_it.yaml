title:                  An optional key that a pair of ends gains only once it repeats
brief:                  |
                        Under the optional-key option an edge needs a
                        key only once a second edge shares its ends.
                        Such a pair can come only from a hand-written
                        abstract base or a join that copies an
                        existing pair, and in the second case the base
                        edge has no key and cannot gain one from a
                        child, so the option names no one who gives
                        it; and once the first edge must gain a key,
                        every operation that named it by its ends
                        changes meaning. A precondition that refuses
                        such a join removes the case.
description:            |
                        Sources:
                        - The input-fed-twice check fails when more
                          than one edge ends at an input, so no
                          runnable graph holds a repeated pair.
                          (src/cctool/check/check.lp lines 3260-3263)
                        - Among the 41 edges of the Patrol base no
                          pair of ends repeats.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_pair_of_ends_unique_in_every_checked_graph.yaml,
                          description)
                        - Each edge of a pair of ends that carries
                          more than one edge carries a key.
                          (_data/decision/dec_identity_of_a_dataflow_edge/opt_edge_identified_by_ends_with_optional_key.yaml,
                          brief)
                        - The resolved graph is never stored, so only
                          the base or the operation that creates an
                          edge can write its key.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 12-16) Strength: moderate; the case is
                          rare at any scale, but undefined behavior is
                          still a fault. It falls away with the
                          rewording proposed in the merge notes.

