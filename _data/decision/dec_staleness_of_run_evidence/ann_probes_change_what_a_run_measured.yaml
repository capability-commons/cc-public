title:                  Probes that change what a run measured
brief:                  |
                        A probe inserted to observe a run takes time,
                        holds buffers longer and can change the
                        schedule, so timing measured with probes holds
                        for the graph with probes, not the graph
                        without. The digest of what a run ran should
                        cover its probe configuration, so that a
                        timing result goes stale when probes are added
                        or removed, while a result about values alone
                        need not.
description:            |
                        Sources:
                        - Maximum buffer occupancy depends on the
                          order of scheduling (Theelen et al. 2006, A
                          scenario-aware data flow model, section 5).
                        - A supposedly read-only tap may still alter
                          scheduling and buffer lifetimes; record the
                          probe configuration in run identity and keep
                          logical-value evidence separate from timing
                          evidence collected with instrumentation
                          (ChatGPT corpus analysis,
                          F-replay-evidence-debugging.md section F3,
                          2026-10-28).

