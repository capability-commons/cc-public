title:                  Citations of a graph that no longer resolves the same
brief:                  |
                        With no flag, a rename, a dictionary upgrade
                        or a new operation changes the graph under an
                        old run, and the decision graph keeps citing
                        evidence about a graph that no longer exists;
                        the one condition the tree kept as its own
                        annotation went stale and was never
                        challenged. A flag is what turns such a change
                        into a challenge someone writes, and for a
                        parity variant such as replay the answer to a
                        flag is cheap: run it again.
description:            |
                        Sources:
                        - "Without idea 13 the decision graph will
                          quietly cite evidence about a graph that no
                          longer exists."
                          (_sources/survey/simulation-backed-decisions.md
                          line 169)
                        - A later fact that changes a condition is a
                          factual annotation that challenges the
                          argument, and the one condition kept as its
                          own annotation "went stale and was never
                          challenged".
                          (_data/decision/dec_changing_conditions_in_arguments/ruling_changing_conditions_in_arguments.yaml at brief)
                        - The register already says that an extracted
                          edge goes stale when its source changes.
                          (_data/register/reg_concept.yaml at entries.concept_edge_origin.description)
                        - The resolved graph is derived and never
                          stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The replay variant is "the parity check for
                          every change to analysis".
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          lines 13-17)
                        - Traceability covers following each element
                          to its reason "and back again".
                          (_data/register/reg_concern.yaml at entries.concern_traceability.description) Strength: strong; the citations
                          that can go stale unseen grow with runs
                          times commits. The functional suitability
                          advocate adds that a flag on any change of
                          digest is right only if the digest is
                          rename-neutral; otherwise every rename
                          stales every run (see the annotations on
                          clearing cost and on flags from a shared
                          base).

