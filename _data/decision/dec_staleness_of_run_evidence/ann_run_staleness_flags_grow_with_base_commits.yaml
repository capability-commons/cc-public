title:                  Flags that grow with every commit to a shared base
brief:                  |
                        Flagging on any digest change raises a flag on
                        every citation above any edited base, each
                        cleared by a recorded note, which may outrun
                        what can be reviewed. Flagging only on
                        upstream change keeps the flags to changes
                        that can reach the measure, at the price of
                        trusting a trace a reviewer cannot check by
                        reading.
description:            |
                        Sources:
                        - The any-change option clears a flag only
                          when someone records that the change does
                          not affect the measured property.
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_any_digest_change.yaml
                          lines 12-16)
                        - The upstream option needs an origin trace.
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_upstream_change.yaml
                          lines 12-15)
                        - Reviewability asks whether the rate of
                          change stays within what can be reviewed,
                          measured as changes awaiting review.
                          (_data/register/reg_concern.yaml lines 526
                          and 530)
                        - Assumption: a content digest over the
                          canonical graph includes ids, so a rename
                          changes it and raises flags with no effect
                          on any measure. The impact digest includes
                          each item's own fields, keyed by id.
                          (src/cctool/commit/impact.py lines 139-160)
                          Strength: strong at ten times the runs,
                          where flags scale as citations times base
                          commits; weak now, with no runs. The cost
                          advocate disputes how many flags the
                          upstream rule saves (see the annotation on
                          clearing cost).

