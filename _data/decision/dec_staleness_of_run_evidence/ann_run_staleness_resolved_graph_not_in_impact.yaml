title:                  A changed resolved graph that no reviewer sees
brief:                  |
                        A commit that edits a base, a dictionary or an
                        interface control document changes the
                        resolved graph of every variant above it, but
                        the resolved graph is no item, so the impact
                        command cannot list it, and the chain from
                        variant to run to citing annotation is longer
                        than its default walk. With no flag, the
                        reviewer of that commit has nothing that shows
                        the evidence it touched.
description:            |
                        Sources:
                        - The no-flag option leaves reviewers to judge
                          whether a cited run still holds.
                          (_data/decision/dec_staleness_of_run_evidence/opt_no_staleness_flag.yaml at brief)
                        - Impact matches items by guid and walks links
                          one step by default.
                          (src/cctool/commit/impact.py)
                        - The resolved graph is never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - Three Patrol variants resolve on the
                          abstract Orin variant, and all resolve on
                          the Patrol base graph.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34) Strength: strong; deeper
                          variant chains widen what one base edit
                          reaches.

