title:                  Clearing cost that grows with runs times churn
brief:                  |
                        Before 1.0 the owner accepts many renames, and
                        a rename of a base node changes every resolved
                        graph that holds it. Under either flagging
                        option each such rename flags every annotation
                        citing a run of those graphs until someone
                        clears it by hand, so the effort grows as runs
                        cited times renames; the upstream rule saves
                        few of these flags, since a renamed node
                        upstream of a measure still counts as a
                        change.
description:            |
                        Sources:
                        - The owner accepts "lots of churn in this
                          pre-version-1.0 phase", including prefix
                          changes, and wants renames tolerated before
                          1.0. (owner's statements, 2026-10-22
                          and 2026-10-21, _sources/context.md lines 16
                          and 26)
                        - A node the base declares keeps its id in
                          every variant.
                          (_sources/cc-patrol-notes/variants.md lines
                          79-82)
                        - A flagged annotation stays stale "until
                          someone records that the change does not
                          affect the measured property".
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_any_digest_change.yaml at brief)
                        - Assumption: a content digest over node ids
                          changes on a rename, as the impact digest,
                          keyed by id, would.
                          (src/cctool/commit/impact.py within digests)
                        - Cost asks how cost grows with use.
                          (_data/register/reg_concern.yaml at entries.concern_cost) Strength: strong while churn is
                          high; it weakens after 1.0, when the owner
                          expects breaking changes to be bundled
                          (_sources/context.md line 16). It falls away
                          if the digest is rename-neutral, which no
                          option says.

