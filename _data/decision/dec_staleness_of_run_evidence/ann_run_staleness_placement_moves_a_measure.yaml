title:                  A measure moved by placement, not by anything upstream
brief:                  |
                        The first measure the Patrol notes name for
                        the video mode is the processor cost of
                        software encoding beside the detector on the
                        Orin, which a change of host, process or
                        placement can move though no node upstream of
                        the measured output changes what it computes.
                        A rule that looks only at upstream nodes may
                        keep that evidence fresh after a placement
                        change, unless a change of placement counts as
                        a change to a node; a rule on any change of
                        digest catches it.
description:            |
                        Sources:
                        - "The cost of software encoding on the Orin
                          Nano's six A78 cores beside the detector is
                          unmeasured and is the first thing to measure
                          for this mode."
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 71-74)
                        - The host, process and place operations vary
                          the mapping, not the application.
                          (_sources/variants-framing.md lines 25-27)
                        - The upstream option flags a run only when
                          nodes upstream of its measured outputs
                          change.
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_upstream_change.yaml
                          lines 12-15)
                        - The measures a run records include rates,
                          latency, frame age, CPU and GPU load.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 104-106) Strength: moderate; it holds
                          for timing and load measures, which are most
                          of the measures the Patrol notes name, and
                          depends on whether the upstream rule counts
                          placement as a change to a node, which the
                          option does not say.

