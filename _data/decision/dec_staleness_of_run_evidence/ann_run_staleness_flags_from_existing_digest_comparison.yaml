title:                  Staleness from digests cctool already compares per commit
brief:                  |
                        The commit impact code already computes a
                        digest of each item before and after a commit,
                        so a flag on any change of a resolved graph's
                        digest needs the same kind of comparison,
                        applied to graphs that must first be resolved
                        since the resolved graph is no item, and one
                        check. A flag only on upstream change adds an
                        origin trace and a map from measures to output
                        ports on top; no flag adds nothing but leaves
                        the job to the advocates' review, which runs
                        only before a ruling.
description:            |
                        Sources:
                        - The impact code computes a digest of what
                          each item holds, as sorted JSON hashed with
                          blake2b, for the tree before and after a
                          commit. (src/cctool/commit/impact.py lines
                          119-120 and 139-160)
                        - The upstream option "needs an origin trace",
                          which is a separate open decision.
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_upstream_change.yaml
                          lines 12-15;
                          _data/decision/dec_origin_trace_of_a_resolved_graph/dec_origin_trace_of_a_resolved_graph.yaml
                          lines 12-15)
                        - The advocate process adds what went stale or
                          unargued before a person rules, and nothing
                          in that ruling covers a decision once ruled.
                          (_data/decision/dec_concern_advocate_process/ruling_concern_advocate_process.yaml
                          lines 16-20)
                        - Simplicity counts distinct mechanisms
                          introduced and jobs done by more than one.
                          (_data/register/reg_concern.yaml lines
                          489-490) Strength: moderate to strong; the
                          digest comparison is the same mechanism at
                          any number of runs, while the upstream
                          analysis grows with graph size. The existing
                          comparison covers items only, so resolving
                          each variant before and after a commit is
                          new work.

