title:                  Traces as edges in one graph
brief:                  |
                        With every trace an edge in the edge list, a
                        traceability graph needs no special case for
                        requirements.
description:            |
                        William Payne asked that links between items
                        be made uniformly as relations in the relation
                        list (2026-10-17). The INCOSE guide notes that
                        in a tool, traces are links rather than
                        attributes. relation_has_subject,
                        relation_has_actor and relation_has_process
                        were made this way.

