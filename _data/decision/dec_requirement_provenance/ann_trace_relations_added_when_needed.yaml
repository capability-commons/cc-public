title:                  Trace relations added when needed
brief:                  |
                        A new kind of trace is a new relation, added
                        when there is something to point at, with no
                        change to the shape of a requirement.
description:            |
                        The edge list of sch_trait_edge takes any
                        relation in reg_relation. Traces to a parent
                        and to a source wait for a need type and a
                        source type; nothing in sch_requirement
                        changes when they arrive.

