title:                  Claim that restates the trace to source
brief:                  |
                        Whether a requirement is evidential or a
                        design choice follows from what it traces to,
                        so a claim field says again what an edge
                        already says.
description:            |
                        The INCOSE guide, revision 3, section 5,
                        attribute A5 Trace to Source, records where
                        the requirement came from and how its content
                        was determined, such as a regulation, a
                        standard, an analysis or a trade study. A
                        source that is a standard makes a requirement
                        evidential; a decision makes it a design
                        choice. The claim of the September iteration
                        (origin/main of cc-public, tag
                        baseline_20260918) came from its own
                        methodology register
                        (register/reg_methodology.yaml there), not
                        from a standard.

