title:                  Measure overnight only
brief:                  |
                        Only the overnight run measures coverage,
                        profiles and budgets; the gates run tests
                        without coverage and record only results. This
                        holds on two conditions. A nightly stage
                        guards what is released, so that nothing
                        unmeasured is released; its shape is still to
                        be decided. And a recurring review moves a
                        category of test upstream when its failures
                        are first found late and it can be run earlier
                        at low cost. Measuring at every commit, at
                        push and overnight, and in hosted CI are
                        rejected. Ruled by WTP on 2026-10-28, by
                        writing "Uphold opt_measure_overnight_only".

