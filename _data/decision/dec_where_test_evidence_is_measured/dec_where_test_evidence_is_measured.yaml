title:                  Where test evidence is measured
brief:                  |
                        At which points are tests run under coverage
                        and profiling, so that their observations are
                        recorded?
description:            |
                        The commit gate runs the tests not marked slow
                        or prepush on a copy of the staged content,
                        and takes about 78 s for a code commit on
                        atlas. The pre-push gate runs every test not
                        marked slow on each pushed tip. The daily
                        review runs at 03:00 UTC. There is a GitHub
                        remote and no CI runs on it.

