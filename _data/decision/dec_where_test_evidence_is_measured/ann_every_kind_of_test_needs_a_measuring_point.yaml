title:                  Evidence from every kind of test in the tree
brief:                  |
                        Only measuring at push and overnight records
                        coverage on every pushed tip and also has a
                        measuring point for every kind of test,
                        benchmarks and property tests included,
                        overnight. Hosted CI keeps evidence outside
                        the tree, so the checks can read it only by
                        fetching it from the service.
description:            |
                        Sources:
                        - The push and overnight option records
                          results and coverage at the pre-push gate,
                          and the daily review records the slow tests,
                          the property tests and the benchmarks
                          [_data/decision/dec_where_test_evidence_is_measured/opt_measure_at_push_and_overnight.yaml
                          at brief].
                        - The every commit option runs the commit
                          gate's tests under coverage, and that gate
                          leaves out tests marked slow or prepush
                          [_data/decision/dec_where_test_evidence_is_measured/opt_measure_at_every_commit.yaml
                          at brief, a10a3a2d:src/cctool/gate/gate.py at
                          MARK_COMMIT].
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (no tests at commit without staged code).
                        - WTP asked that results of the overnight
                          property tests go to the same evidence as
                          other tests [owner's statement, 2026-10-25].
                        - September did not take evidence in a CI
                          attestation outside the tree, because the
                          checks read the tree and could not check it
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at alternative].
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (no CI on the remote).
                        - Also rests on a source stated once in
                          ann_hosted_ci_makes_evidence_depend_on_a_service
                          (a later check fetches CI evidence).
                          Strength: Strong, and it holds at ten times
                          the size, since slow and benchmark tests
                          grow with the data. The every commit option
                          could add the overnight run too, but as
                          written it leaves benchmarks with no
                          measuring point.

