title:                  Measurement where the tests already run in full
brief:                  |
                        The pre-push gate already runs every test not
                        marked slow on each pushed tip, so measuring
                        there adds no new place to configure. Hosted
                        CI adds a second configuration and a fetch
                        path to keep in step with the local gate.
description:            |
                        Sources:
                        - The pre-push gate runs every test not marked
                          slow on each pushed tip, and the commit gate
                          runs the tests not marked slow or prepush
                          [_data/decision/dec_where_test_evidence_is_measured/dec_where_test_evidence_is_measured.yaml
                          at description, src/cctool/gate/gate.py at
                          MARK_PUSH and MARK_COMMIT].
                        - The commit gate leaves out the tests when no
                          code is staged, so a data-only commit
                          records no test observation at commit
                          [owner's statement, 2026-10-25;
                          src/cctool/gate/gate.py at function
                          is_code_staged and TUPLE_CODE].
                        - There is a GitHub remote and no CI runs on
                          it
                          [_data/decision/dec_where_test_evidence_is_measured/dec_where_test_evidence_is_measured.yaml
                          at description].
                        - September's CI was a separate workflow file
                          with a matrix over ubuntu and macos and its
                          own steps
                          [origin/main:.github/workflows/gate.yml at
                          runs-on and matrix].
                        - The stages of the local gate are declared
                          once [src/cctool/gate/gate.py at
                          TUPLE_STAGE]. Strength: Moderate. Measuring
                          at push and overnight keeps one definition
                          of the stages. Measuring at every commit
                          also keeps one definition, but its evidence
                          still misses data-only commits. Hosted CI
                          needs a workflow file and a fetch step that
                          must change whenever the gate does. At ten
                          times the tests the argument is unchanged.

