title:                  Measure at push and overnight
brief:                  |
                        The pre-push gate runs its tests under
                        coverage and records results and coverage. The
                        daily review runs the slow tests, the property
                        tests and the benchmarks, and records them
                        too. The commit gate runs as it does now.

