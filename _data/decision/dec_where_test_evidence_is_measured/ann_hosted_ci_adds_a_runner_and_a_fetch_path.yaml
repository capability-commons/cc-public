title:                  Measuring points that exist already
brief:                  |
                        The pre-push gate and the daily review already
                        exist, and the pre-push gate already runs the
                        tests. Measuring there adds no new runner.
                        Hosted CI adds a workflow, a place to publish
                        evidence and a step that fetches it, and no CI
                        runs today.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (no CI on the remote).
                        - Also rests on a source stated once in
                          ann_hosted_ci_makes_evidence_depend_on_a_service
                          (a later check fetches CI evidence).
                        - September's CI workflow pinned actions to
                          commits and needed setup and caching steps
                          of its own
                          [origin/main:.github/workflows/gate.yml at
                          steps].
                        - The overnight only option measures at one
                          point and has the gates record only results
                          [_data/decision/dec_where_test_evidence_is_measured/opt_measure_overnight_only.yaml
                          at brief].
                        - The daily review runs at 03:00 UTC
                          [_data/decision/dec_where_test_evidence_is_measured/dec_where_test_evidence_is_measured.yaml
                          at description].
                        - ASSUMPTION: the daily review can run the
                          tests without a new runner, as the push and
                          overnight option has it run the slow tests,
                          the property tests and the benchmarks.
                          Strength: moderate. Overnight only measures
                          at one point, one fewer than push and
                          overnight. Both reuse points that exist.
                          Hosted CI adds three mechanisms, which is
                          the same at ten times the size.

