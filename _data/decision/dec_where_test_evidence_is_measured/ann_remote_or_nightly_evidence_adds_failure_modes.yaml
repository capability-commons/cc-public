title:                  Failure modes of remote and nightly measurement
brief:                  |
                        Hosted CI makes the check depend on fetching
                        evidence from a service that does not run
                        today, so a network failure or a missing job
                        leaves the check without evidence. Measuring
                        only overnight leaves up to a day of commits
                        unmeasured and finds a fault the next morning.
                        The stage time limit also caps how heavy any
                        local measurement can be.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (no CI on the remote).
                        - Also rests on a source stated once in
                          ann_hosted_ci_makes_evidence_depend_on_a_service
                          (a later check fetches CI evidence).
                        - The daily review runs at 03:00 UTC
                          [_data/decision/dec_where_test_evidence_is_measured/dec_where_test_evidence_is_measured.yaml
                          at description].
                        - Also rests on a source stated once in
                          ann_hosted_ci_adds_a_runner_and_a_fetch_path
                          (overnight only records only results at the
                          gates).
                        - A gate stage that runs longer than 600 s is
                          stopped and fails [src/cctool/gate/gate.py
                          at SECONDS_STAGE].
                        - Per-test coverage on the C tracer took 534 s
                          for the commit-gate tests on 4 CPUs in the
                          container [measured by Claude in the cloud
                          container, 2026-10-26].
                        - ASSUMPTION: a check that cannot reach the
                          hosted evidence either fails or stays
                          silent, and neither is stated by the option.
                          Strength: moderate. The stage limit point
                          grows at ten times the size, where a heavy
                          local measurement would be stopped. It
                          argues for cheap coverage at push and heavy
                          measurement overnight.

