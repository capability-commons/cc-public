title:                  Commit measurement that skips data commits
brief:                  |
                        Measuring at every commit promises evidence
                        never older than the last commit, but the
                        commit gate runs no tests for a data-only
                        commit, and such a commit has already broken
                        112 tests. The pre-push gate tests every
                        pushed tip, data or code, so measuring there
                        covers the case the commit gate misses.
                        Coverage at commit also adds cost to the gate
                        that must stay fast.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (no tests at commit without staged code).
                        - A data-only commit that added 13 concepts
                          broke 112 check tests, and only the pre-push
                          gate caught it [owner's statement,
                          2026-10-25].
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (the pre-push gate runs every test not
                          marked slow).
                        - The commit-gate option claims the evidence
                          is never older than the last commit
                          [_data/decision/dec_where_test_evidence_is_measured/opt_measure_at_every_commit.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_measuring_at_push_keeps_the_commit_gate_fast
                          (the cost of coverage).
                        - Two passing tests failed under per-test
                          contexts on the C tracer [measured by Claude
                          in the cloud container, 2026-10-26].
                        - Also rests on a source stated once in
                          ann_measuring_at_push_keeps_the_commit_gate_fast
                          (a fast commit gate of about 78 s).
                          Strength: strong. It holds at ten times the
                          size, since data commits and the cost of
                          coverage both grow with the tree.

