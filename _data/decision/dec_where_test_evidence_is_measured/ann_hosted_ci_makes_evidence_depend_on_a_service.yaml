title:                  Evidence that depends on a hosted service
brief:                  |
                        Measuring in hosted CI makes the evidence the
                        checks read depend on a third-party service
                        and its actions. Measuring at every commit
                        makes coverage.py a part of every commit that
                        stages code. Measuring at push and overnight
                        keeps both risks off the path of work.
description:            |
                        Sources:
                        - With hosted CI, a later run of the check
                          fetches the evidence the CI job published
                          [_data/decision/dec_where_test_evidence_is_measured/opt_measure_in_hosted_ci.yaml
                          at brief].
                        - September's CI used three third-party
                          actions, actions/checkout,
                          prefix-dev/setup-pixi and
                          actions/upload-artifact, pinned by commit
                          [origin/main:.github/workflows/gate.yml at
                          uses].
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (no CI on the remote).
                        - Under the C tracer core two tests that pass
                          without tracing failed, while no failure is
                          recorded for the sys.monitoring core
                          [measured by Claude in the cloud container,
                          2026-10-26].
                        - coverage.py 7.17.0 is under Apache-2.0
                          [https://pypi.org/pypi/coverage/json].
                          Strength: Moderate. A hosted service can
                          change its terms, its runners or its
                          actions, and evidence fetched from it fails
                          when it does, which a local store does not.
                          Coverage in the commit gate is a smaller
                          risk, but a fault in it would then stop
                          every code commit. The point holds at ten
                          times the size.

