title:                  Commit gate now tests commits of data
brief:                  |
                        ann_commit_measurement_promise_fails_on_data
                        rests on the commit gate running no tests for
                        a data-only commit. Since 52d20906 it runs the
                        tests that read the data, so the check tests
                        that the commit of 13 concepts broke would now
                        fail at commit, not first at push. The gap is
                        narrower: a data-only commit still leaves out
                        the other tests, and a commit of decisions
                        alone runs none.
description:            |
                        A commit that stages data but no code runs the
                        tests marked reads_data, and one that stages
                        only paths under _data/decision runs no tests
                        (src/cctool/gate/gate.py at function stages,
                        MARK_DATA and TUPLE_UNREAD). Every test that
                        takes the tree fixture, the copy of the
                        repository, is marked reads_data when it is
                        collected (src/cctool/conftest.py at function
                        pytest_collection_modifyitems). Found in the
                        daily review of 2026-10-27; the argument was
                        added in 40286894, after the gate change.

