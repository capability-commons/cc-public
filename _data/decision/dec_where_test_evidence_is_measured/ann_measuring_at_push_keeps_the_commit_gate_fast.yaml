title:                  Where the cost of measuring lands
brief:                  |
                        Aggregate coverage adds about 6 percent to a
                        run, and coverage per test multiplies it by
                        2.6. The pre-push gate and the daily review
                        absorb either. The commit gate, which must
                        stay fast, absorbs neither.
description:            |
                        Sources:
                        - The commit gate must stay fast, and
                          gate-speed work took a code commit's gate
                          from 2m13s to about 78 s on atlas [owner's
                          statements in the gate-speed work,
                          2026-10-22].
                        - Branch coverage with the sys.monitoring core
                          added about 6 percent, and coverage per
                          test with the C tracer core took 2.6 times
                          the base [measured by Claude in the cloud
                          container, 2026-10-26].
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (few or no tests at commit without staged code).
                        - Also rests on a source stated once in
                          ann_push_gate_already_runs_the_tests_to_measure
                          (the pre-push gate runs every test not
                          marked slow).
                        - Also rests on a source stated once in
                          ann_remote_or_nightly_evidence_adds_failure_modes
                          (daily review at 03:00 UTC).
                        - WTP agreed that property tests run overnight
                          with a large example count [owner's
                          statement, 2026-10-25].
                        - September's local gate measured about
                          thirteen minutes, and its CI allowed about
                          three times that, as hosted runners are
                          slower
                          [origin/main:.github/workflows/gate.yml at
                          the comments on the gate job and
                          timeout-minutes]. Strength: strong against
                          coverage per test at commit, which would
                          turn about 78 s into over three minutes on
                          atlas (ASSUMPTION: the factor of 2.6
                          measured in the container carries over to
                          atlas). Aggregate coverage at commit is
                          within noise today, but on a data-only commit the commit gate measures only the tests marked reads_data.
                          At ten times the tests the slow runs belong
                          overnight even more.

