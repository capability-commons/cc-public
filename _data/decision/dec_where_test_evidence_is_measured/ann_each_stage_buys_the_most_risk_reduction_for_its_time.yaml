title:                  Each stage buys the most risk reduction for its time
brief:                  |
                        The stages of verification are a cascade, each
                        a step of risk reduction, ordered so that the
                        steps that remove the most risk for the least
                        computing come first. A stage is not a
                        detector with a fixed false alarm rate, so it
                        is judged by risk removed per unit of time. A
                        failure first found late shows a category of
                        test to move upstream, where that can be done
                        cheaply, so measuring overnight does not leave
                        a class of fault to be found late for good.
description:            |
                        Sources:
                        - Argued by WTP in the project thread on
                          2026-10-28 at 14:35 UTC: tests are placed to
                          give the greatest chance of finding an error
                          with the least time spent, under a review
                          that keeps evaluating where tests belong.

