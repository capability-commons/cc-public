title:                  Coverage of each commit for its reviewer
brief:                  |
                        The unit of review is one commit that does one
                        thing. Coverage measured at every commit lets
                        a reviewer judge whether that commit carried
                        its own tests. Measuring at push or overnight
                        only can answer that for a range of commits or
                        a day.
description:            |
                        Sources:
                        - AGENTS.md asks that one commit do one thing
                          and that each change be small enough to read
                          in one sitting [AGENTS.md at sections Before
                          you finish and Keep it small].
                        - September found that a suite floor says
                          nothing about whether a change carried its
                          own tests, and read changed line coverage
                          from the coverage.xml the gate wrote
                          [origin/main:pyproject.toml at the comment
                          on changed line coverage].
                        - Also rests on a source stated once in
                          ann_measuring_at_push_keeps_the_commit_gate_fast
                          (about 6 per cent for aggregate coverage).
                        - Atlas runs Python 3.15 [measured by Claude
                          in the cloud container, 2026-10-26].
                        - Also rests on a source stated once in
                          ann_hosted_ci_adds_a_runner_and_a_fetch_path
                          (overnight only records no coverage at the
                          gates).
                        - Also rests on a source stated once in
                          ann_every_kind_of_test_needs_a_measuring_point
                          (the push option measures each pushed tip).
                          Strength: Moderate. It needs coverage over
                          the whole run, not per test, so it does not
                          require the costly tracer. At ten times the
                          size the gap between one commit and one push
                          grows with the commits per push. It does not
                          help a data-only commit, whose gate runs no
                          tests.

