title:                  Install from a lock without a solve or a live index
brief:                  |
                        Installing from a published lock with hashes
                        needs no dependency solve and can be served
                        from a local cache or mirror, so it is fast
                        and works on hosts without network. A fresh
                        resolve of ranges needs live package indexes
                        and a solve on every install.
description:            |
                        Sources:
                        - pixi install --frozen of the locked
                          environment took 6.3 s when measured on
                          2026-10-15
                          (_data/decision/dec_environment_manager/ann_pixi_environment_needs_half_a_gigabyte.yaml,
                          description).
                        - The environment resolves from
                          conda.anaconda.org/conda-forge and
                          pypi.org/simple (pixi.lock
                          lines 4-7), and a fresh install cannot pass while either is unreachable
                          (_data/decision/dec_release_gate/ann_fresh_install_needs_live_package_indexes.yaml, brief).
                        - The atlas VM has no network (context note,
                          _sources/context.md line 30), and cc-patrol
                          is local
                          to atlas only (_sources/cc-patrol-notes/plan.md line 109).
                        - A lock lets the file to install be
                          "determined in an offline fashion for
                          reproducibility"
                          (https://packaging.python.org/specifications/pylock-toml/).
                        - "performance DOES still matter a lot, as we
                          will need to be able to respond quickly to
                          things"
                          (owner's statement, 2026-10-22T16:31).
                        - Assumption: a solve of a few dozen packages
                          takes seconds to minutes; not measured.
                          Strength: moderate; the saving is per
                          install and per host, so it grows linearly
                          with peers, but each install is short either
                          way.

