title:                  Personal data in a shipped environment
brief:                  |
                        A published lock adds no personal data, but a
                        built environment shipped as a prefix could
                        carry the build host's absolute paths, which
                        can include a user name. The personal data
                        already in every release, the author's email
                        address and the copyright names, is the same
                        under all three options.
description:            |
                        Sources:
                        - pixi.lock holds package URLs, versions,
                          hashes and licenses, and names the local
                          package only as
                          "./" (pixi.lock lines 722-724); a grep of pixi.lock for home paths and email addresses finds
                          nothing.
                        - The built pixi environment holds absolute
                          paths under /media/wtp, a folder name that
                          matches the start of the author's email address (pyproject.toml line 37;
                          _data/decision/dec_environment_manager/ann_hooks_and_guidance_bound_to_pixi.yaml,
                          description).
                        - Package metadata names the author with an
                          email address (pyproject.toml line 37), and
                          every
                          item carries a copyright line that names a person (_data/logical_component/lco_federation.yaml
                          line 3).
                        - An installer may still install a yanked PyPI
                          release for anyone who pins its exact
                          version
                          (https://peps.python.org/pep-0592/;
                          _data/decision/dec_how_peers_get_cc_public/ann_published_package_cannot_be_recalled.yaml).
                        - Assumption: the end-users option might be
                          built as a packed environment rather than a
                          lock; its
                          wording leaves this open. The developers option publishes no environment and is neutral here.
                        Strength: weak; it touches only how the
                        environment is shipped.

