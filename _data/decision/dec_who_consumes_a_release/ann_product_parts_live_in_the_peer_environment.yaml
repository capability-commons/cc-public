title:                  Parts a peer builds into its own product
brief:                  |
                        What a peer imports or builds into its
                        product, such as a Python interface, the
                        generator or the C++ engine, must coexist with
                        that product's own dependencies and toolchain,
                        so it cannot arrive as a separate exact
                        environment. Pinning it exactly forces the
                        peer's whole product onto cc-public's pins,
                        where it clashes or fails to install; declared
                        ranges let the peer's developer find a set
                        that works.
description:            |
                        Sources:
                        - The engine, with its generator, ships in the
                          same package that peers install
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml,
                          brief); src holds only the cctool package today, so the engine is not yet built (listing of src).
                        - Patrol's nodes are native C++ step functions
                          called by the engine, and Patrol host code
                          is C++20
                          and its CUDA C++17, behind a C++17 engine ABI (_sources/cc-patrol-notes/plan.md lines 88-98).
                        - cc-patrol will consume cc-public's tooling,
                          data and dataflow engine (owner's statement
                          file,
                          /home/claude/work/advocates/consumers/owner-2026-10-24.md line 11).
                        - A package installed in a partner's
                          environment brings its bounded dependencies,
                          which can clash
                          with the partner's own
                          (_data/decision/dec_how_peers_get_cc_public/ann_package_shares_partner_environment.yaml, brief).
                        - The Python packaging guide says declared
                          dependencies state what a project "minimally
                          needs to
                          run correctly", and that pinning them to specific versions is not best practice
                          (https://packaging.python.org/en/latest/discussions/install-requires-vs-requirements/).
                        - A library has "a 'sophisticated' developer
                          as an intermediary" who can find a
                          compatible set,
                          though "we shouldn't unreasonably force that work on them if we have the choice" (owner's
                          statement, 2026-10-24T12:00Z).
                        - Assumption: a peer's product holds
                          dependencies of its own that overlap with
                          what an imported
                          part of cc-public needs, and an exact pin clashes at least as often as a wider range.
                        Strength: strong at ten times the peers: each
                        peer product brings its own stack, and
                        cc-public cannot ship an exact environment per
                        peer product.

