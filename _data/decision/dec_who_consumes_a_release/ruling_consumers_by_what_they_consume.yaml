title:                  Consumers by what they consume
brief:                  |
                        What a peer runs, such as cctool and its
                        hooks, is an application installed from the
                        tested lock each release publishes, and what a
                        peer imports or builds into its own product is
                        a library with declared ranges. Ruled by WTP
                        on 2026-10-24, as recommended. The published
                        lock for the tool part holds runtime
                        dependencies only, and jq becomes a declared
                        dependency of the tool part. The wheel carries
                        _data. This was provisional until the decision
                        on what crosses between segments, which
                        settled it for now (WTP, 2026-10-24): an MCP
                        service or API may serve reads beside it, and
                        if that changes, the decision is revisited in
                        full.

