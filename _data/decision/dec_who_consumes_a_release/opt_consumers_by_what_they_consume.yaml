title:                  Consumers by what they consume
brief:                  |
                        What a peer runs, such as cctool and its
                        hooks, is an application, installed in an
                        environment of its own from the tested lock
                        that each release publishes. What a peer
                        imports or builds into its own product, such
                        as a Python interface, the generator or the
                        C++ engine, is a library with declared ranges.
                        The release gate tests both: the lock must
                        pass, and a fresh resolve of the ranges warns
                        when a shared environment breaks.

