title:                  Separate environment for the tools a peer runs
brief:                  |
                        Installed as a library, cctool brings its
                        seven bounded dependencies into the peer's own
                        environment, where they can clash with the
                        peer's products. An application kept in an
                        environment of its own has nothing to clash
                        with, which is why command line tools are
                        commonly installed that way.
description:            |
                        Sources:
                        - cc-public declares seven runtime
                          dependencies, each with an upper bound
                          (pyproject.toml lines
                          43-49), and a package installed into a partner's environment brings them with it
                          (_data/decision/dec_how_peers_get_cc_public/ann_package_shares_partner_environment.yaml, brief).
                        - pipx installs end-user applications in
                          isolated environments so that "their
                          dependencies never
                          collide" (https://pipx.pypa.io/stable/); pixi global "isolates each package in its own
                          environment, exposing only the necessary entry points"
                          (https://pixi.prefix.dev/v0.54.0/global_tools/introduction/).
                        - cctool is a command line program with an
                          entry point (pyproject.toml lines 51-52),
                          run by hooks
                          (pyproject.toml lines 25-27, 84 and 85).
                        - The release gate's fresh resolve is strong
                          at seeing an upstream change and only
                          moderate at
                          seeing a clash with a particular partner's set
                          (_data/decision/dec_release_gate/ann_fresh_install_tests_the_published_ranges.yaml, description).
                        - Compatibility counts conflicts with products
                          in a shared environment
                          (_data/register/reg_concern.yaml lines 309-312).
                        Strength: strong, and stronger at ten times
                        the peers: each peer brings its own products
                        to clash with, while an isolated tool
                        environment has none however many peers there
                        are.

