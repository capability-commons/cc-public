title:                  Installer needed to take up a shipped environment
brief:                  |
                        The only tested environment is a pixi lock,
                        and no standard installer reads a lock from a
                        dependency, so shipping it binds every peer to
                        pixi and adds a published environment file and
                        a way to install it; the split option does so
                        for its tool part. A wheel with declared
                        ranges installs with pip, uv or pixi and needs
                        no new release mechanism, but only once every
                        program cctool runs, such as jq, is declared
                        in the package metadata.
description:            |
                        Sources:
                        - The tested environment is a pixi lock,
                          version 6, that mixes conda-forge packages
                          and PyPI
                          wheels (pixi.lock lines 1-8 and 12-66).
                        - Conda packages are installed by
                          conda-compatible clients
                          (_data/decision/dec_publishing_route/ann_conda_channel_binds_partners_to_conda_tools.yaml,
                          brief); pixi-pack archives recreate an environment without conda, but only on the platform they
                          were made for (https://pixi.prefix.dev/dev/deployment/pixi_pack/).
                        - pip installs from pylock.toml only from pip
                          26.1, experimentally
                          (https://pydevtools.com/handbook/how-to/how-to-install-from-a-pylock-toml-lockfile-with-pip/);
                          the pixi global documentation of version 0.35.0 lists a lock file only as a possible future
                          feature (https://pixi.prefix.dev/v0.35.0/features/global_tools).
                        - pre-commit, a tool that runs in other
                          repositories' hooks, gives each hook an
                          environment of its
                          own, cloned at a rev it assumes is immutable, and its documentation describes no lock file for
                          those environments (https://pre-commit.com/).
                        - The declared ranges already exist
                          (pyproject.toml lines 43-49), the ruled
                          release gate already
                          installs the built package fresh and resolves them, tentatively
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml lines 13-22), and a peer brings in
                          cc-public as one versioned package
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml).
                        - jq is declared only as a pixi dependency,
                          not in the package metadata (pyproject.toml
                          lines 72-74
                          against lines 43-49), and cctool query jq stops with "There is no jq program to run" where it is
                          missing (src/cctool/graph/jq.py lines 89-91).
                        - The wheel selects only src/cctool
                          (pyproject.toml lines 58-62), so it holds no
                          _data today; the
                          check that the built package holds _data, which the ruled gate adds, is needed under every
                          option and does not separate them (_data/decision/dec_release_gate/ruling_release_gate.yaml
                          lines 24-27).
                        - The cc-patrol plan recommends a pixi git
                          dependency on cc-public
                          (_sources/cc-patrol-notes/plan.md lines 69-72), and all peers are the owner's own for now
                          (owner's statement, 2026-10-22T16:21, _sources/context.md line 15).
                        - Compatibility counts tools a partner must
                          install, and simplicity counts distinct
                          mechanisms
                          (_data/register/reg_concern.yaml lines 309-312 and 488-490).
                        - Assumption: a package's own lock is not read
                          when it is installed as a dependency by pip
                          or
                          pixi; installers read its declared requirements.
                        Strength: weak today, since the one known peer
                        uses pixi; strong at ten times the peers, once
                        outside partners on other managers arrive. The
                        mechanism count does not grow with peers.

