title:                  Fault reports traced to the release's own lock
brief:                  |
                        With a lock published per release, a peer's
                        version names the exact set of packages it
                        ran, by hash, so a reported fault can be
                        traced and reproduced from the release record.
                        With a peer's own resolve the release record
                        cannot say what the peer ran, and each report
                        must carry the peer's own lock before analysis
                        can start.
description:            |
                        Sources:
                        - pixi.lock pins every package by version and
                          hash, with exact builds
                          (_data/decision/dec_environment_manager/ruling_environment_manager.yaml, brief;
                          _data/decision/dec_environment_manager/ann_frozen_lock_makes_gate_runs_repeatable.yaml).
                        - A pinned release names the peer's baseline
                          (_data/decision/dec_how_peers_get_cc_public/ann_pinned_release_names_peer_baseline.yaml, brief),
                          and the release verdict should trace to exactly what was released
                          (_data/decision/dec_release_gate/ann_uncached_verdicts_belong_to_the_tagged_tree.yaml, brief).
                        - Under the developers option the peer
                          "resolves its own environment" from the
                          ranges
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_are_developers.yaml, brief), which the
                          commit gate never runs against
                          (_data/decision/dec_release_gate/ann_fresh_install_tests_the_published_ranges.yaml, brief).
                        - "I'd like to be able to respond to reported
                          problems quickly and largely automatically"
                          (owner's
                          statement, 2026-10-22, _sources/context.md line 24).
                        - Assumption: an automatic response needs to
                          reproduce the reporter's environment, which
                          a
                          published lock names and a peer's own resolve does not, unless the peer reports its lock.
                        Strength: strong, and stronger with ten times
                        the peers: one lock per release traces every
                        peer that took it, while ten peers resolving
                        on their own give ten untested sets to
                        collect.

