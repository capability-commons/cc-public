title:                  Two release forms for one job
brief:                  |
                        The split option publishes each release in two
                        forms, a lock for what a peer runs and ranges
                        for what it imports, and gates both, so
                        dependency selection is done by two
                        mechanisms, and since cctool, the generator
                        and the engine ship in one package, each part
                        must also be classed as tool or library. It
                        follows the owner's own application and
                        library distinction, and pixi already holds
                        several environments in one manifest, so the
                        added cost is the published lock and the
                        classification, not a new tool.
description:            |
                        Sources:
                        - The split option installs what a peer runs
                          from a published lock and what it imports
                          from
                          declared ranges, and gates both
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml, brief).
                        - The engine and its generator ship in the
                          same package that peers install, with the
                          tooling
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml,
                          brief).
                        - The owner frames the question as application
                          against library (owner's statement,
                          2026-10-24T12:00Z).
                        - pixi already defines more than one
                          environment in this manifest (pyproject.toml
                          lines 96-108).
                        - Simplicity counts jobs done by more than one
                          mechanism (_data/register/reg_concern.yaml
                          lines
                          488-490).
                        - Assumption: a peer may both run and import
                          the same part, likely the generator, which
                          then sits
                          on both sides.
                        Strength: moderate; at ten times the peers the
                        two forms stay two, but the class of each part
                        must hold for every peer.

