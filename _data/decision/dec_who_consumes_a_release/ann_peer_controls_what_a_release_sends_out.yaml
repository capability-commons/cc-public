title:                  Peer control over what a release sends out
brief:                  |
                        Tools from a release check the peer's whole
                        repository, which may hold personal data under
                        the GDPR, and the owner expects automation of
                        point and patch releases to depend on
                        telemetry built later. The peer needs to see
                        and limit anything the release sends out, and
                        an environment it must install as it is gives
                        it the fewest ways to do that.
description:            |
                        Sources:
                        - Some segments hold personal data, such as
                          data on DTU members under the GDPR, and
                          federation
                          must let them meet those requirements (_data/logical_component/lco_federation.yaml lines 17-24;
                          owner's statement, 2026-10-22).
                        - pixi run check runs the checker over the
                          repository (pyproject.toml lines 22-23), and
                          the commit
                          gate runs the check, the lint and the tests over a copy of the staged content (README.md lines
                          71-74).
                        - "Point and patch releases may get a level of
                          automation, depending on how we build out
                          our
                          telemetry infrastructure" (owner's statement, 2026-10-22).
                        - The privacy concern asks what personal data
                          the design collects and who can see it
                          (_data/register/reg_concern.yaml, privacy entry).
                        - Assumption: problem reports from a peer's
                          environment could carry item ids or file
                          paths formed
                          from a person's name.
                        - Assumption: a switch in the peer's
                          configuration that turns off outbound
                          reporting would meet
                          this under any option, so the point bears on design as much as on the choice.
                        Strength: weak today, since no telemetry
                        exists; it grows with ten times the peers, as
                        more of them would hold personal data.

