title:                  Environment changes outside the checked graph
brief:                  |
                        Where the lock becomes part of what a release
                        ships, a change of environment is a change of
                        the release, yet the lock holds no item, so
                        the graph that computes the version bump and
                        the release notes does not see it. Under the
                        developers option what ships is the ranges,
                        which sit in a file that holds an item.
description:            |
                        Sources:
                        - The generated lock file pixi.lock holds no
                          item (README.md lines 38-43; no id_self in
                          pixi.lock,
                          grep, 0 matches).
                        - pyproject.toml holds an item (pyproject.toml
                          lines 1-34) and the ranges (lines 43-49).
                        - The graph computes the SemVer bump of a
                          release
                          (_data/decision/dec_version_scheme/ruling_semver_computed.yaml), and the release notes are
                          derived for each release (_data/logical_component/lco_release.yaml lines 12-16).
                        - Assumption: an item for the pyproject file
                          does not by itself make the bump see a
                          change of
                          range either; a check is needed in both cases, but shipping the lock needs one over a 2767-line
                          generated file (wc of pixi.lock).
                        Strength: moderate; it does not grow with
                        peers, and a check over the lock could close
                        it, at the cost of one more mechanism.

