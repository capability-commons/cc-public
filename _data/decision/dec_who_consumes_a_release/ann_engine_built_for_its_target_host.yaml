title:                  Engine built for its target host
brief:                  |
                        The engine is on the hot path of a peer's
                        product, on hosts as different as a laptop and
                        a Jetson. Treated as a library, its sources
                        build in the peer's toolchain for that target;
                        shipped inside one exact application
                        environment, it is built once for a generic
                        platform, or, with today's lock, not at all
                        for Arm.
description:            |
                        Sources:
                        - Patrol's nodes are native C++ step functions
                          called by the engine, "with no Python on the
                          hot
                          path" (_sources/cc-patrol-notes/plan.md lines 88-92).
                        - Target hosts include a Lenovo Legion laptop
                          and a Jetson Orin Nano (plan.md lines
                          128-131), and
                          the workspace locks no linux-aarch64 (pyproject.toml line 66).
                        - The engine ships in the package peers
                          install
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml,
                          brief).
                        - "performance DOES still matter a lot"
                          (owner's statement, 2026-10-22).
                        - Assumption: compiler flags tuned for a
                          target CPU or GPU give measurably faster
                          code than a
                          generic build; not measured.
                        Strength: moderate today, since the engine is
                        not built yet; it holds at ten times the peers
                        and grows with the number of distinct targets.

