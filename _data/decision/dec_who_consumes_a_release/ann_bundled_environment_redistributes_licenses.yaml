title:                  Licenses of what a release redistributes
brief:                  |
                        A library release distributes only cc-public's
                        own Apache-2.0 code and names its
                        dependencies, which each peer fetches for
                        itself. A release that ships its exact
                        environment as a bundle redistributes every
                        package in it, including GPL-3.0-only
                        toolchain parts, and takes on their license
                        obligations, while the PyPI entries in the
                        lock record no license at all.
description:            |
                        Sources:
                        - cc-public is licensed Apache-2.0
                          (pyproject.toml at project.license).
                        - ld_impl_linux-64, in the default
                          environment, is GPL-3.0-only (pixi.lock),
                          and libgcc, libgomp and libstdcxx are GPL-3.0-only WITH GCC-exception-3.1 (pixi.lock).
                        - The conda entries in the lock carry license
                          fields and the PyPI entries carry none
                          (_data/decision/dec_environment_manager/ann_pixi_lock_records_hashes_and_licenses.yaml,
                          description).
                        - pixi-pack bundles the locked packages into
                          one archive for another machine
                          (https://pixi.prefix.dev/dev/deployment/pixi_pack/).
                        - Dependency risk draws on ISO/IEC 5230:2020,
                          which covers compliance with the licenses of
                          open
                          source dependencies (_data/register/reg_concern.yaml at entries.concern_dependency_risk.note).
                        - Assumption: publishing a lock that a peer
                          installs from the original indexes is not
                          redistribution by cc-public, while publishing a packed archive is; so this bears on the split
                          option only if its tool part ships as a bundle.
                        - An earlier annotation assumed these
                          toolchain parts are not distributed with
                          cc-public, so its
                          license is not affected, and says this was not checked against ISO/IEC 5230
                          (_data/decision/dec_environment_manager/ann_pixi_brings_six_times_the_named_packages.yaml,
                          description).
                        Strength: weak while every peer is the owner's
                        own (owner's statement, 2026-10-22); moderate
                        at ten times the peers that include outside
                        partners.

