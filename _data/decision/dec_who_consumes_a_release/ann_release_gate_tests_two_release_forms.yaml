title:                  Release gate that tests two kinds of release
brief:                  |
                        The split option has the release gate test
                        both the lock and a fresh resolve of the
                        ranges, so its gate is the longest of the
                        three, while the owner wants quick fix
                        releases. The cost is bounded if the fresh
                        resolve only warns, as the option words it,
                        and runs off the blocking path.
description:            |
                        Sources:
                        - In the split option "the lock must pass, and
                          a fresh resolve of the ranges warns"
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml, brief).
                        - The ruled release gate already includes a
                          fresh install resolving the declared ranges,
                          tentatively, and is to be timed at the first release
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml, brief).
                        - The full gate already costs many times the
                          78 s commit gate
                          (_data/decision/dec_release_gate/ann_full_gate_lengthens_time_to_a_fix.yaml, brief).
                        - "we will need to be able to respond quickly
                          to things" (owner's statement,
                          2026-10-22T16:31).
                        - Assumption: a warning stage can run after
                          the tag without delaying a patch. Strength:
                          weak; the gate runs once per release however
                          many peers there are, and the warning can be
                          taken off the critical path.

