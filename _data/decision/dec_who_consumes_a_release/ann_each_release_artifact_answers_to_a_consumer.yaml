title:                  Release artifacts traced to the consumers that need them
brief:                  |
                        Every published artifact should answer to a
                        need. Under the end-users option the declared
                        ranges and the ruled fresh resolve serve no
                        consumer that the option names, and under the
                        developers option a published lock would serve
                        none. The split option gives each a named
                        consumer, but only if the graph records which
                        shipped part is run and which is imported, and
                        that class is kept as parts are added.
description:            |
                        Sources:
                        - Traceability asks "Does anything exist that
                          nothing calls for?"
                          (_data/register/reg_concern.yaml at entries.concern_traceability.question).
                        - The ruled release gate tests a fresh resolve
                          of the declared ranges
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml, brief), while the end-users option's
                          gate tests only the shipped environment
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_are_end_users.yaml, brief).
                        - The wheel's metadata declares the ranges
                          whatever the option (pyproject.toml at project.dependencies).
                        - The split option names what is run, cctool
                          and its hooks, and what is imported or built
                          in, a
                          Python interface, the generator and the C++ engine
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml, brief), and
                          all of it ships in one package
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml).
                        - Assumption: no item in the graph today
                          records, per shipped part, whether peers run
                          it or import
                          it; not checked exhaustively.
                        Strength: moderate; it depends on the number
                        of shipped parts, not of peers.

