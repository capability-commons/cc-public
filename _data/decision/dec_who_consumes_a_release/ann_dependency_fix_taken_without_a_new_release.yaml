title:                  Dependency fix taken without a new release
brief:                  |
                        When a dependency turns out faulty or
                        vulnerable and a fix is published inside its
                        range, a peer that resolves ranges can take
                        it, or exclude the bad version, at once and
                        with no work in cc-public. A peer that
                        installs the release's exact environment as it
                        is must wait for the owner to relock, run the
                        full release gate and release, so the time to
                        recover rests on one maintainer; in the split
                        option this holds for the tool part.
description:            |
                        Sources:
                        - cc-public declares its seven runtime
                          dependencies as bounded ranges, such as
                          jsonschema>=4.23,<5
                          (pyproject.toml at project.dependencies); under SemVer a patch release of a version 1.0.0 or later holds only
                          backward-compatible fixes, so such a range admits it (https://semver.org/, item 6). Three of the
                          ranges, for pyoxigraph, referencing and ruamel.yaml, cover versions below 1.0.0, where SemVer
                          makes no such promise (https://semver.org/, item 4).
                        - Under the end-users option a peer installs
                          the shipped environment "as it is"
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_are_end_users.yaml, brief).
                        - WTP decides each release for now,
                          and point and patch releases may be
                          automated later
                          (owner's statement, 2026-10-22, _sources/context.md line 24;
                          _data/decision/dec_who_may_release/ruling_maintainer_decides_each_release.yaml).
                        - Any edit to pyproject.toml makes pixi.lock
                          stale, and the atlas VM has no network, so
                          only the
                          owner can relock (context note, _sources/context.md line 30).
                        - The full release gate costs many times the
                          78 s commit gate, and that time sits between
                          a fix
                          and its release (_data/decision/dec_release_gate/ann_full_gate_lengthens_time_to_a_fix.yaml).
                        - The owner wants to "respond to reported
                          problems quickly and largely automatically"
                          (owner's
                          statement, 2026-10-22).
                        - The security concern measures time to remedy
                          a reported vulnerability
                          (_data/register/reg_concern.yaml, security entry).
                        - Assumption: some dependency fixes ship as
                          patch releases inside today's ranges.
                        - Assumption: a peer installing from a lock
                          can still override one pin locally, at the
                          cost of
                          running an untested set; this narrows the gap.
                        Strength: strong for security and
                        maintainability, moderate for reliability; it
                        grows with ten times the peers, since every
                        relock then serves all of them through one
                        person.

