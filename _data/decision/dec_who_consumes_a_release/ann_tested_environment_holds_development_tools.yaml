title:                  Development tools inside the tested environment
brief:                  |
                        The environment the gate tests today holds the
                        test runner, the linter, the browser driver
                        and a newer Python beside the runtime
                        libraries. Shipping "the exact environment it
                        was tested in" would put about eight times as
                        many packages as cctool names as runtime
                        dependencies inside every peer, some of them
                        needed only for development, and inside the
                        product for what the peer builds in, unless a
                        runtime-only environment is locked and tested.
description:            |
                        Sources:
                        - The default linux-64 environment in
                          pixi.lock holds 54 packages from conda-forge
                          and PyPI plus
                          cc-public itself (pixi.lock at environments.default.packages.linux-64),
                          among them pytest, ruff, python 3.15.0, and playwright with
                          greenlet and pyee.
                        - The package declares seven runtime
                          dependencies (pyproject.toml at project.dependencies);
                          pytest,
                          pytest-xdist, ruff, jq and playwright are declared only for the pixi workspace (pyproject.toml at tool.pixi.pypi-dependencies and tool.pixi.dependencies), and the browser tests also fetch a Chromium outside the lock (pyproject.toml at tool.pixi.tasks.browsers).
                        - The slow run tests Python 3.12, 3.13 and
                          3.14 in environments of their own
                          (pyproject.toml at tool.pixi).
                        - The engine will be built into cc-patrol's
                          product on hosts such as a Jetson Orin Nano
                          (_sources/cc-patrol-notes/plan.md lines 88-92 and 128-131).
                        - Dependency risk counts direct and indirect
                          dependencies
                          (_data/register/reg_concern.yaml at entries.concern_dependency_risk.measure); the security concern asks what an attacker can reach.
                        - Assumption: a runtime-only pixi environment
                          could be locked beside the development one,
                          which
                          would remove most of the excess under either option that ships a lock; the split option then
                          holds up on this point.
                        - Assumption: a peer with security
                          requirements vets each third-party package
                          it takes in. Strength: moderate, and
                          unchanged by the number of peers: the excess
                          is fixed once by locking a runtime
                          environment.

