title:                  Platforms a published lock can serve
brief:                  |
                        An exact environment installs only on the
                        platforms it was locked for, which today are
                        linux-64 and two macOS targets, not the Arm
                        Linux of the Jetson Orin Nano that cc-patrol
                        targets, nor Windows. Ranges resolve on any
                        platform where the dependencies are built, and
                        the split option confines the lock to what a
                        peer runs on its development host.
description:            |
                        Sources:
                        - The pixi workspace is locked for osx-arm64,
                          osx-64 and linux-64 only (pyproject.toml
                          line 66);
                          pixi.lock has no linux-aarch64 entry (grep of pixi.lock, 0 matches).
                        - Only Linux and macOS on Apple silicon are
                          supported for development, and Windows is
                          not
                          (README.md lines 47-52).
                        - cc-patrol targets a Lenovo Legion laptop and
                          a Jetson Orin Nano
                          (_sources/cc-patrol-notes/plan.md lines 128-131); the Orin Nano has an Arm Cortex-A78AE CPU
                          (https://en.wikipedia.org/wiki/Nvidia_Jetson).
                        - pixi-pack archives unpack only on the
                          platform they were made for
                          (https://pixi.prefix.dev/dev/deployment/pixi_pack/).
                        - Assumption: cctool and its hooks run on a
                          peer's development host, while the engine
                          runs on the
                          target, so under the split option only the engine must reach the Orin.
                        - Assumption: the OS of the customer's Legion
                          laptop is not recorded; if it is Windows, no
                          lock or
                          tool path covers it today.
                        Strength: strong; the count of platforms grows
                        with peers, and under the end-users option
                        each new platform is added to every release's
                        lock and gate.

