title:                  Deeper reliance on ruamel.yaml round-trip parts
brief:                  |
                        The editing commands place text by ruamel.yaml
                        line and column data and lay out files with
                        its round-trip node and scalar types, so a
                        change in those parts of one library now
                        affects writing files as well as reporting on
                        them.
description:            |
                        edit.py and layout.py load with typ 'rt'
                        (src/cc_public/edit/edit.py line 140;
                        src/cc_public/edit/layout.py line 87). Edits
                        use .lc.key and .lc.item (edit.py lines 1156,
                        1166; layout.py lines 425, 496). layout.py
                        uses CommentedMap, CommentedSeq,
                        LiteralScalarString and FoldedScalarString
                        (layout.py lines 91-92, 254, 474, 479). The
                        extractor also loads in rt mode and reads .lc,
                        but uses none of CommentedMap, CommentedSeq or
                        FoldedScalarString (src/cc_public/graph/
                        extract.py lines 41, 47, 501, 519-537).
                        ruamel.yaml lists one author and no separate
                        maintainer and is hosted on SourceForge
                        (https://pypi.org/pypi/ruamel.yaml/json).
                        Pinned >=0.19.1,<0.20 (pyproject.toml). Will
                        asked whether it was still maintained (W
                        2026-10-13T22:07:14Z). ASSUMPTION: the .lc
                        attributes and comments module are less stable
                        than plain load and dump. Does not change the
                        package count; grows with the tooling.

