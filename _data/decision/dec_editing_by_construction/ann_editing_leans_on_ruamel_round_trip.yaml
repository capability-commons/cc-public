title:                  Deeper reliance on ruamel.yaml round-trip parts
brief:                  |
                        The editing commands place text by ruamel.yaml
                        line and column data and lay out files with
                        its round-trip node and scalar types, so a
                        change in those parts of one library now
                        affects writing files as well as reporting on
                        them.
description:            |
                        edit.py and layout.py load with typ 'rt'
                        (src/cctool/edit/edit.py within
                        PATTERN_WHOLE_ID; src/cctool/check/layout.py).
                        Edits use .lc.key and .lc.item (edit.py within
                        _ordered; layout.py within _span and
                        _emit_lead). layout.py uses CommentedMap,
                        CommentedSeq, LiteralScalarString and
                        FoldedScalarString (layout.py within _spans
                        and _lead). The extractor also loads in rt
                        mode and reads .lc, but uses none of
                        CommentedMap, CommentedSeq or
                        FoldedScalarString (src/cctool/graph/
                        extract.py within read and parse_all).
                        ruamel.yaml lists one author and no separate
                        maintainer and is hosted on SourceForge
                        (https://pypi.org/pypi/ruamel.yaml/json).
                        Pinned >=0.19.1,<0.20 (pyproject.toml). WTP
                        asked whether it was still maintained (W
                        2026-10-13). ASSUMPTION: the .lc attributes
                        and comments module are less stable than plain
                        load and dump. Does not change the package
                        count; grows with the tooling.

