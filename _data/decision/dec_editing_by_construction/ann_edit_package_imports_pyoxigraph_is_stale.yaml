title:                  Edit package that now imports pyoxigraph
brief:                  |
                        ann_editing_adds_no_third_party_package says
                        the edit package imports only the standard
                        library, ruamel.yaml and cc_public, and uses
                        only the three dependencies the checker had.
                        The edit package now imports pyoxigraph, which
                        the checker does not use.
description:            |
                        src/cctool/edit/ontology.py
                        (pym_cctool.edit.ontology) imports pyoxigraph.
                        The import command uses it
                        (src/cctool/cli/editing.py within import_).
                        Under src only edit/ontology.py and
                        graph/sparql.py import pyoxigraph, so the
                        checker does not. pyproject.toml at
                        project.dependencies now list nine direct
                        dependencies: click, clingo, htpy, jsonschema,
                        jsonschema-rs, pyoxigraph, pyyaml, referencing
                        and ruamel.yaml. edit.py and layout.py still
                        import only the standard library, ruamel.yaml
                        and cc_public. Found in the review of
                        2026-10-22.

