title:                  Edit as a short statement of intent
brief:                  |
                        A command or batch file states a change in a
                        few lines, and --dry-run shows the full diff
                        before anything is written. The tool makes the
                        guids, rights and layout and the checker
                        judges them, so a person reviews meaning, not
                        mechanics.
description:            |
                        The commands mint guids, fill in rights and
                        keep the layout; a guid is never written by
                        hand (AGENTS.md#working-beside-other-agents).
                        --dry-run prints each changed file as a
                        unified diff and writes nothing
                        (src/cctool/cli/editing.py within _option and
                        _run). rename is one command that changes
                        every YAML document naming the id (editing.py
                        within remove and rename;
                        AGENTS.md#working-beside-other-agents). batch
                        takes a YAML list of operations and makes them
                        as one edit (editing.py within rename and
                        batch). Under hand editing the change exists
                        only as the edited files, then cctool format
                        and cctool check
                        (AGENTS.md#working-beside-other-agents).
                        Example: the past-decisions run keeps each
                        proposed change as a batch file beside a short
                        draft that WTP reviews in batches of five
                        (scratchpad notes, 2026-10-14). Holds at ten
                        times the graph. ASSUMPTION: a reviewer who
                        reads only the batch file misses any fault in
                        turning intent into the diff that the checker
                        does not catch; the diff is what is committed.

