title:                  Hand editing as a path still needed
brief:                  |
                        The commands do not replace hand editing. Some
                        changes have no command, and a file that does
                        not parse stops every command, so hand editing
                        followed by a check stays in use as a second
                        path and the path of recovery.
description:            |
                        The tools refuse to rename or remove an item
                        that lives in the file it names and tell the
                        user to do it by hand (src/cctool/edit/
                        edit.py lines 774-785). Not built by choice:
                        moving or removing source files, class and
                        function items, insert of embedded items (note
                        review-2026-10-14.md, Open threads). AGENTS.md
                        lines 48-53 say to run cctool format then
                        cctool check after any hand edit. A YAML file
                        that does not parse raises when the tree is
                        read (src/cctool/graph/extract.py lines 284,
                        305), and _run catches only ErrorEdit
                        (src/cctool/cli/editing.py lines 398-404). The
                        pre-commit gate and cctool history check check
                        the tree whatever made the change (AGENTS.md
                        lines 13-15; memory/ enforcement-approach.md).
                        Supports hand editing as a fallback alongside
                        the chosen option, not in its place. More item
                        kinds make edits outside the commands more
                        likely.

