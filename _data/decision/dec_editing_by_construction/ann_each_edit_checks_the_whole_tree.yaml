title:                  Whole-tree check on every edit
brief:                  |
                        Each editing command reads the whole tree and
                        validates every YAML document before it writes
                        one field, so one small edit takes over two
                        seconds today and its cost follows the tree,
                        not the edit.
description:            |
                        Tree.__init__ reads every YAML document
                        (src/cctool/edit/edit.py lines 160-171;
                        src/cctool/graph/extract.py lines 186-206).
                        apply runs check_documents before and after
                        the edit (edit.py lines 866-878). The schema
                        cache lives within one process
                        (src/cctool/check/check.py, CACHE_SCHEMA).
                        Measured by the advocate on 2026-10-15 at
                        89c74d8, 128 files read (122 holding a YAML
                        document), 4 CPUs, Python 3.13: one dry-run
                        set takes about 2.25 s, of which 0.19 s is
                        start-up, 0.70 s reading the tree and about
                        1.3 s schema validation. Will plans much
                        larger graphs (W 2026-10-13T20:05:25Z;
                        memory/MEMORY.md line 21). A tool call on
                        Will's device dies at 180 s (memory/MEMORY.md
                        line 45). ASSUMPTION: cost scales about
                        linearly, near 20 s per edit at ten times the
                        tree. The point is against the whole-tree
                        build more than the option; an incremental
                        check would keep conformance by construction.

