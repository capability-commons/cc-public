title:                  Conformance not held by construction alone
brief:                  |
                        The commands refuse only edits that add a
                        failure, some changes are made by hand, and
                        writes are not atomic. So the commands keep
                        edits from making things worse, and
                        conformance of the tree rests on the checker
                        of record.
description:            |
                        An edit to a tree that already fails is
                        accepted if it adds no failure
                        (src/cctool/edit/ edit.py lines 866-917). Some
                        changes have no command (edit.py lines
                        774-785; AGENTS.md lines 48-53; note
                        review-2026-10-14.md; memory/MEMORY.md line
                        44). Writes are not atomic (edit.py lines
                        882-889). The check of record is cctool
                        history check at push
                        (memory/enforcement-approach.md lines 10-11).

