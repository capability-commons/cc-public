title:                  Rename now carried into the logic programs
brief:                  |
                        Commit 52ecf93 "Fix cctool rename so that
                        rules naming the item follow the rename"
                        rewrites every string of a logic program that
                        is the old id. At 360ec14 renaming a relation
                        that check.lp names no longer drops it from
                        the rules.
description:            |
                        rename replaces "old" with "new" in every .lp
                        file of the tree (src/cctool/edit/edit.py
                        within _key_guid at 360ec14);
                        test_rename_of_a_relation_changes_the_rules_that_name_it
                        covers it (src/cctool/edit/_test/test_edit.py
                        within
                        test_a_link_is_added_after_the_edges_there_are).
                        Python code is still not changed and is only
                        listed: the editor still names
                        relation_upholds in SET_LINK_SETTLE
                        (360ec14:src/cc_public/edit/edit.py line 125),
                        which places a new ruling in its decision
                        folder, and the tests name relations by id. So
                        the premise still holds for ids named in
                        Python, but not for the rules.

