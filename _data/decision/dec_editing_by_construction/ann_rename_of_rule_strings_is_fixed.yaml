title:                  Rename now carried into the logic programs
brief:                  |
                        Commit 52ecf93 "Fix cctool rename so that
                        rules naming the item follow the rename"
                        rewrites every string of a logic program that
                        is the old id. At 360ec14 renaming a relation
                        that check.lp names no longer drops it from
                        the rules.
description:            |
                        rename replaces "old" with "new" in every .lp
                        file of the tree (src/cc_public/edit/edit.py
                        lines 750-756 at 360ec14);
                        test_rename_of_a_relation_changes_the_rules_that_name_it
                        covers it
                        (src/cc_public/edit/_test/test_edit.py line
                        273). Python code is still not changed and is
                        only listed: edit.py still names r_upholds in
                        SET_LINK_SETTLE (line 125), which places a new
                        ruling in its decision folder, and the tests
                        name relations by id. So the premise still
                        holds for ids named in Python, but not for the
                        rules.

