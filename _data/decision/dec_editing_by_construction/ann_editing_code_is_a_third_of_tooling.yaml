title:                  Editing code as a third of the tooling
brief:                  |
                        The editing commands are about a third of the
                        non-test source and were changed in 9 of the
                        22 commits that changed src since the first
                        version. Hand editing then checking carries
                        none of this code.
description:            |
                        src/cc_public/edit/edit.py has 1203 lines and
                        src/cc_public/cli/editing.py 430, of 5451
                        non-test Python lines under src (wc -l at
                        89c74d8). layout.py (586 lines) is shared with
                        the checker and cctool format and is not
                        counted. Tests add 544 lines (edit/_test/
                        test_edit.py) and 159 lines (cli/_test/
                        test_editing.py). Nine of the 22 commits since
                        7dda99e that change src touch
                        src/cc_public/edit (git log 7dda99e..89c74d8
                        -- src), two of them fixes (3ba3a5c, 153c0b1).
                        Against this: hand editing cannot mint a guid,
                        which must never be written by hand (AGENTS.md
                        lines 44-45). ASSUMPTION: one command that
                        prints a fresh guid would cover that job at
                        far smaller size. The cost is per command, not
                        per item, so it weakens as the graph grows.
                        ASSUMPTION: new item types mostly reuse new,
                        link and set.

