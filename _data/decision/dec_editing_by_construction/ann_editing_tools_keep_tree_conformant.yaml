title:                  Editing tools that keep the tree conformant
brief:                  |
                        Will asked for editing tools that enforce
                        style and graph rules, as the previous
                        cc-public did, so that everything stays
                        conformant by construction and gains as the
                        checks grow.
description:            |
                        Maintainer's statement, WTP 2026-10-13:
                        "Editing tools that enforce style and
                        graph-rule conformity in a similar manner to
                        the previous version of cc-public - ensuring
                        that everything remains
                        conformant-by-construction. This will also
                        become powerful as the graph-oriented checks
                        become more powerful in how they check
                        semantic consistency." Remove and rename:
                        "Then add edit commands to remove and rename
                        items" (WTP 2026-10-14), built in afbcf6f.
                        Porting the remaining legacy commands: "Go
                        ahead in that order" (WTP 2026-10-14). Built
                        in c4a8721 (pre-squash), afbcf6f, af6ec6e and
                        29cb646, all 2026-10-14. Not built by choice:
                        moving or removing source files, class and
                        function items, and insert of embedded items
                        (note review-2026-10-14.md). ASSUMPTION: the
                        reason speaks for reliability (bad edits do
                        not land) and maintainability (edits follow
                        the checks as they change); Will named no
                        concern.

