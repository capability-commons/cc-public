title:                  Multi-file writes without atomicity
brief:                  |
                        apply writes the files of an edit one at a
                        time, in place, with no temporary file and no
                        rollback. A crash or full disk during the loop
                        can leave an edit half applied or a file
                        truncated.
description:            |
                        apply writes each file with path.write_text
                        and removes files with path.unlink in one loop
                        (src/cctool/edit/edit.py within _move_folder).
                        No module under src uses os.replace, fsync or
                        a temporary file for data items (grep of src).
                        Path.write_text overwrites an existing file in
                        place
                        (https://docs.python.org/3/library/pathlib.html
                        #pathlib.Path.write_text). rename rewrites
                        every YAML document that names the old id
                        (lines 743-759), and batch writes many
                        operations together (lines 789-822). A
                        truncated file that no longer parses stops
                        every command (src/cctool/cli/ editing.py
                        within batch and import_). Recovery is by git.
                        ASSUMPTION: an uncommitted change to that file
                        is lost by the restore. The fix is small and
                        local (write a temporary file, then rename),
                        so the point is against the current build more
                        than the option.

