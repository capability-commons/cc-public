title:                  Checked edit cheaper than edit then check
brief:                  |
                        One checked edit is faster than a hand edit
                        followed by cctool check, since the command
                        skips the layout check, and a batch spreads
                        the fixed cost over many operations.
description:            |
                        cctool check runs check_documents and
                        layout.violations; an edit runs
                        check_documents only, since "An edit lays out
                        every file it writes"
                        (src/cc_public/check/check.py, comment above
                        NAME_LAYOUT). Measured by the advocate on
                        2026-10-15 at 89c74d8: one set about 2.25 s,
                        one check about 2.85 s, layout.violations
                        about 0.99 s, a batch of 100 sets 5.63 s; 100
                        separate sets would take about 225 s
                        (computed). A refused edit writes nothing
                        (edit.py lines 866-890). ASSUMPTION: a failing
                        hand edit needs at least one more check after
                        its fix. Does not hold when many hand edits
                        share one check, unless the commands use
                        batch.

