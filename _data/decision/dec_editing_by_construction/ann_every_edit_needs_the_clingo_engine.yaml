title:                  Editing dependent on the check engine
brief:                  |
                        Every edit runs the full check before it is
                        written, so editing needs clingo installed and
                        working. Under hand editing only checking
                        stops when the engine is missing.
description:            |
                        apply runs check_documents before and after
                        the edit (src/cc_public/edit/edit.py lines
                        866-878), which runs the rules through
                        cc_public.graph.datalog (src/cc_public/check/
                        check.py lines 95-99), which imports clingo
                        (src/cc_public/graph/datalog.py line 55).
                        clingo is a pixi dependency >=5.8.2,<6
                        (pyproject.toml; added in 5665ace). At c4a8721
                        the engine was Souffle, expected on the PATH.
                        Weak: the commit gate needs the same check, so
                        a missing engine already blocks commits under
                        both alternatives.

