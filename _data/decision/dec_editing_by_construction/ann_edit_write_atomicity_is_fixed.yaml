title:                  Edit writes now staged before replacing
brief:                  |
                        Commit b5fe6e6 "Fix edit.apply so that an edit
                        is written all or none" writes each new text
                        beside its file and replaces the files only
                        once all are written. At 360ec14 a full disk
                        or a failed write leaves the tree as it was.
description:            |
                        _write stages each text as a file beside its
                        target, removes the staged files and raises
                        ErrorEdit if any write fails, and only then
                        moves each into place with os.replace
                        (src/cctool/edit/edit.py within rename at
                        360ec14);
                        test_an_edit_that_cannot_be_written_changes_nothing
                        covers it (src/cctool/edit/_test/test_edit.py
                        within _edit). Each os.replace is atomic for
                        its file, but the set of replaces is not one
                        step: a crash between two of them can still
                        leave an edit half applied, a much narrower
                        window than before.

