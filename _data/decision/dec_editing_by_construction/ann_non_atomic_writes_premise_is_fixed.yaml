title:                  Edit writes no longer left half done
brief:                  |
                        Commit b5fe6e6 "Fix edit.apply so that an edit
                        is written all or none" removes one of the
                        three premises: a failed write no longer
                        leaves an edit half applied. At 360ec14 the
                        other two, edits refused only for added
                        failures and changes with no command, still
                        hold.
description:            |
                        src/cctool/edit/edit.py lines 941-972 at
                        360ec14 stage every file before any replaces
                        its target. A crash between the final replaces
                        remains possible. The refusal rule (_added,
                        edit.py lines 976-990) and the refusal of
                        items in source files (_refuse_source) are
                        unchanged.

