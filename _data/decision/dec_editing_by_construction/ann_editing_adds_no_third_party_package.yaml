title:                  No new third-party package for editing
brief:                  |
                        The editing commands add no third-party
                        package. They use the three direct
                        dependencies the checker already had and the
                        standard library.
description:            |
                        Direct dependencies are click, jsonschema and
                        ruamel.yaml before and after the commands (git
                        show c4a8721^:pyproject.toml and
                        c4a8721:pyproject.toml, lines 41-43). The edit
                        package imports only the standard library,
                        ruamel.yaml and cc_public modules
                        (src/cc_public/edit/edit.py lines 44-56;
                        src/cc_public/edit/layout.py lines 50-61); the
                        CLI adds click and difflib
                        (src/cc_public/cli/editing.py lines 54-65).
                        Guids come from the standard uuid module
                        (edit.py line 410). ruamel.yaml is MIT and
                        cc-public is Apache-2.0
                        (https://pypi.org/pypi/ruamel.yaml/json;
                        pyproject.toml). Holds as the tooling grows
                        only while new commands keep to the same
                        imports.

