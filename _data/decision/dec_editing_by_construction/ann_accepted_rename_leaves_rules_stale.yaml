title:                  Accepted rename that leaves rules naming the old id
brief:                  |
                        An edit that adds no failure is accepted even
                        when it changes what a check means. Renaming a
                        relation that the rules name in code passes,
                        drops that relation from the rules, and makes
                        the commands refuse a correct new item.
description:            |
                        rename does not change text outside YAML
                        documents, such as code, and lists each file
                        that still names the old id
                        (src/cctool/cli/editing.py lines 288-308).
                        check.lp names relation ids as string
                        literals, for example "relation_upholds" at
                        lines 326 and 338; edit.py names
                        relation_upholds and relation_rejects in
                        SET_LINK_SETTLE (line 123). Runs by the
                        advocate on 2026-10-15 at 89c74d8 in a scratch
                        copy: renaming relation_upholds to a new id
                        exits 0, writes two files and lists five files
                        still naming relation_upholds (check.lp,
                        edit.py, two test files, one skill file);
                        cctool check then reports 0 failures. settles
                        (check.lp lines 336-342) then no longer holds
                        for ruling_cross_item_checks_engine, so
                        unargued_driver (lines 448-453) no longer
                        checks that decision. A dry run of cctool new
                        for a ruling linked by the new id to
                        opt_tooling_in_python is then refused with
                        no_option_in_ruling; with relation_upholds in
                        an unchanged copy it is accepted.
                        test_check.py fails with KeyError
                        'relation_upholds' after the rename, and the
                        pre-commit gate runs the tests (AGENTS.md
                        lines 13-15). Hand editing with a check has
                        the same blind spot. Weak against the option;
                        it bounds what conformant by construction can
                        promise. Grows with the tooling. ASSUMPTION:
                        renaming an id named in code is rare.

