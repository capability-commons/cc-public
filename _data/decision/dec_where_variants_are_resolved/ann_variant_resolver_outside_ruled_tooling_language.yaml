title:                  Resolver outside the language ruled for tooling
brief:                  |
                        The tooling was ruled into Python because the
                        maintainer reads it more readily, and the
                        Patrol notes port the fluent API as the Python
                        interpreter of the operations. Resolving in
                        Python keeps the resolver beside the checker
                        and the rename command; one C++ resolver moves
                        it out of the ruled tooling language.
description:            |
                        Sources:
                        - "The tooling stays in Python for now, since
                          the maintainer reads
                          it more readily" (_data/decision/dec_tooling_language/ruling_tooling_language.yaml
                          lines 12-22).
                        - "The fluent API is ported into cc-public as
                          the Python interpreter
                          of those operations" (_sources/cc-patrol-notes/variants.md lines
                          36-40), and "Variant logic stays in Python with the rest of the
                          tooling" (same file, lines 92-95).
                        - The C++ resolver option has cctool call one
                          C++ library
                          (_data/decision/dec_where_variants_are_resolved/opt_one_cpp_resolver_with_python_bindings.yaml
                          lines 12-16).
                        Concerns: maintainability (code in the
                        language the maintainer reads more readily,
                        existing code ported), simplicity (one tooling
                        language). Strength: moderate; it does not
                        grow with variants, and it weakens if a target
                        must apply operations itself.

