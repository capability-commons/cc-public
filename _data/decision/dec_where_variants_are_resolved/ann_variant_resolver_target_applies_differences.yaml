title:                  Target that applies differences rather than operations
brief:                  |
                        When a target receives the difference between
                        two resolved graphs, it adds, removes and
                        rewires exactly the named nodes and edges,
                        which the drafted dynamic host does, in a
                        fixed form the generator writes, and a
                        reviewer reads exactly what will change. When
                        it interprets operations, a filter by tag or a
                        place must search the whole running graph
                        between steps, the target needs a reader for
                        the operation form and the preconditions of
                        each operation, and a reviewer must resolve
                        the operations against the running graph in
                        their head.
description:            |
                        Sources:
                        - Under the Python-only option a target
                          "receives resolved graphs or
                          the difference between two of them, never operations"
                          (_data/decision/dec_where_variants_are_resolved/opt_variants_resolved_in_python_only.yaml at brief). A change set is the difference between two resolved
                          variants (_sources/variants-framing.md line 55), and it can carry
                          the digest of the graph it was checked against
                          (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml at brief).
                        - The dynamic host loads, wires, checks every
                          edge and refuses a
                          mismatch, only between steps
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          65-72).
                        - filter removes nodes by host, process, id or
                          tag and every edge
                          touching them (_sources/cc-patrol-notes/variants.md line 19).
                        - Whatever runs between steps delays the next
                          step
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_runtime_check_lengthens_step_gap.yaml).
                        - Graph items are YAML read with ruamel.yaml
                          (pyproject.toml); a runtime that loads a graph is likely to need a parser
                          library or a hand-written parser
                          (_data/decision/dec_first_engine/ann_graph_loading_runtime_needs_a_parser.yaml).
                          The survey proposes that each operation state what must and must
                          not exist (_sources/survey/README.md lines 45-47).
                        - The frozen schedule is already generated C++
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          35-40).
                        - ASSUMPTION: a selector such as a tag is
                          evaluated against every
                          node, so its cost grows with the graph, while a difference lists
                          only what changes. ASSUMPTION: a generated difference can be
                          emitted as C++ data or a form read without a library.
                        - Counterpoint: an operation list is usually
                          shorter than the
                          difference it produces; for a filter that drops many edges the
                          difference is longer to read (assumption, unmeasured).
                        Concerns: performance efficiency (work sized
                        to the change), reliability (less done in the
                        gap between steps), dependency risk (no
                        operation reader or parser on the target),
                        reviewability (the change is read as its
                        effect), simplicity (the target need not
                        interpret operations). Strength: moderate; it
                        strengthens at ten times the nodes, and falls
                        away for one C++ resolver if that resolver
                        runs only on the desk and ships differences.

