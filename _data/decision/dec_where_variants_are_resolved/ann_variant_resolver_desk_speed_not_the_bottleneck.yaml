title:                  Resolver speed on the desk
brief:                  |
                        A C++ resolver would resolve faster than
                        Python, but the gate's time goes to checks and
                        tests, and the tooling ruling already found
                        that speed does not call for a port. Resolving
                        Patrol's five variants of a 22-node base is
                        likely small next to the clingo checks run on
                        each.
description:            |
                        Sources:
                        - "Speed does not yet call for a port, as the
                          gate takes 78 s for a
                          commit that changes code"
                          (_data/decision/dec_tooling_language/ruling_tooling_language.yaml at brief). A data-only commit, which skips the tests, takes
                          about 10 s (context note, _sources/context.md line 31).
                        - Patrol's base has 22 nodes and 41 edges,
                          with five runnable
                          variants (_sources/cc-patrol-notes/draft/README.md lines 22-34).
                        - Checking per resolved variant makes resolved
                          graphs facts keyed by
                          variant, which multiplies the facts by the number of leaves
                          (_sources/variants-framing.md line 62).
                        - "performance DOES still matter a lot, as we
                          will need to be able
                          to respond quickly to things" (owner's statement,
                          2026-10-22T16:31, _sources/context.md line 23).
                        - ASSUMPTION: resolving is roughly linear in
                          operations times graph
                          size, and clingo grounding per leaf dominates; not measured.
                        Concerns: performance efficiency. Strength:
                        weak to moderate; a sweep of many unstored
                        variants (_sources/variants-framing.md
                        line 84) is the case that would test it, and a
                        resolve-time measurement on the Patrol drafts
                        would settle it.

