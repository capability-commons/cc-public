title:                  Where variants are resolved
brief:                  |
                        Which code interprets variant operations to
                        produce a resolved dataflow graph, and does
                        any of it run on the target?
description:            |
                        The Patrol draft keeps variant logic in Python
                        and has the engine load only resolved graphs,
                        but a run-time change set is an operation list
                        whose base is the running resolved dataflow
                        graph, which raises whether the target must
                        interpret operations too
                        (_sources/variants-framing.md, sections 2 and
                        4, Q7; _sources/cc-patrol-notes/variants.md
                        lines 92-95).

