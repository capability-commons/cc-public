title:                  Resolution in an engine that is not yet built
brief:                  |
                        The tree holds no C++ and no engine yet, and
                        WTP called supporting Kahn networks and actors
                        together a big chunk of work, so resolution in
                        the [[dataflow engine]] would wait on it and
                        put the commit gate on a compiled engine. A
                        Python-hosted run of the graph of edits, each
                        node once in topological order, is about the
                        size of the forty-line sketch, which resolves
                        all five Patrol leaves in about a sixth of a
                        second while the check of the tree takes about
                        a minute.
description:            |
                        Sources:
                        - The tree holds no C, C++ or CMake file
                          (search by the advocate and the verifier,
                          2026-10-26), and cctool's dependencies are
                          seven Python packages. (pyproject.toml at
                          project.dependencies)
                        - Supporting both is "biting off a big chunk
                          of work" (WTP, 2026-10-24).
                          (_data/decision/dec_first_semantics/ruling_first_semantics.yaml
                          at brief)
                        - The sketch resolves the five Patrol leaves
                          in about 0.16 s with no cache (run by the
                          advocate, 2026-10-26), and interprets every
                          drafted kind of operation.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve)
                        - cctool check over a copy of the tree took
                          about 54 s on 2026-10-26 (run by the
                          advocate), and the gate of a commit that
                          changes code takes 78 s.
                          (_data/decision/dec_tooling_language/ruling_tooling_language.yaml
                          at brief)
                        - Dependency risk asks what the design takes
                          from third parties; reliability asks what
                          happens when a part is faulty; performance
                          efficiency asks how quickly the design
                          responds under expected load.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question.0,
                          entries.concern_reliability.question.1 and
                          entries.concern_performance_efficiency.question.0)
                          Strength: strong for the first version, weak
                          later; it is about order, and a C++ resolver
                          can follow once the engine exists.

