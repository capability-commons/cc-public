title:                  Change to an operation reviewed in one place
brief:                  |
                        If each [[variant operation]] is a node of the
                        graph of edits, a change to one is an
                        [[interface control document]] and one
                        implementation. With Python only, both are
                        items cctool checks and one reviewer reads in
                        one commit; one C++ resolver adds the binding
                        and two interpreters add a second
                        implementation. An interface per operation
                        holds the two interpreters' ports and settings
                        to one contract, but not what each operation
                        does.
description:            |
                        Sources:
                        - Under the proposed option each variant
                          operation is a dataflow node, and a dataflow
                          node presents exactly one interface control
                          document.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief; src/cctool/check/check.lp within
                          interface_count)
                        - The unknown-port, unknown-setting and
                          missing-setting checks hold each node to the
                          ports and settings of its interface.
                          (src/cctool/check/check.lp within
                          unknown_port, unknown_setting and
                          missing_setting)
                        - Under the two-interpreter option every
                          operation is written, fixed, reviewed and
                          tested twice.
                          (_data/decision/dec_where_variants_are_resolved/ann_variant_resolver_two_interpreters_drift.yaml
                          at brief)
                        - A C++ resolver bound into cctool has a
                          binding layer that each signature change
                          touches.
                          (_data/decision/dec_where_variants_are_resolved/ann_variant_resolver_cpp_build_on_check_path.yaml
                          at brief)
                        - Reviewability asks whether a person can read
                          a change in full and judge it, and measures
                          the size of a change in lines;
                          maintainability counts parts touched by a
                          representative change.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reviewability.question.0,
                          entries.concern_reviewability.measure.0 and
                          entries.concern_maintainability.measure.1)
                          Strength: moderate; it adds to the earlier
                          annotations the interface as a shared
                          contract, which narrows the drift of two
                          interpreters to semantics.

