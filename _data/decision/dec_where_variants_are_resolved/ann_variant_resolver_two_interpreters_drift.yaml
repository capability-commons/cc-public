title:                  Two interpreters of one operation vocabulary
brief:                  |
                        A Python resolver beside a separate C++
                        interpreter of the same variant operations
                        gives one vocabulary two semantics, so the two
                        can come to resolve some operations on some
                        bases to different graphs, and the graph
                        cctool checked would then not be the graph the
                        target runs. Every operation is written,
                        fixed, reviewed and tested twice, with tests
                        that the two agree, while one resolver in
                        either language has one semantics and cannot
                        drift from itself.
description:            |
                        Sources:
                        - The two-interpreter option has cctool
                          resolve in Python and a C++
                          interpreter apply the same operations on the target
                          (_data/decision/dec_where_variants_are_resolved/opt_python_and_cpp_operation_interpreter.yaml
                          lines 12-16).
                        - Stevens finds "irreconcilable differences"
                          between the intended
                          semantics of QVT Relations and those of QVT Core, and that "Medini
                          rejects many QVT-R transformations that are legal ... and accepted
                          by ModelMorf" (https://homepages.inf.ed.ac.uk/perdita/icmtjournal.pdf,
                          abstract and section 3, checked 2026-10-25; summarized
                          in _sources/survey/generative-and-transforms.md lines 34-35 and
                          158, which reads it as support for one Python resolver as the
                          single semantics).
                        - The proposed core has about ten operations:
                          filter, add, remove,
                          join, write, host, os_process, place, insert-on-edge and
                          substitute (_sources/variants-framing.md line 94), and the survey
                          adds a precondition per operation and an origin trace
                          (_sources/survey/README.md lines 45-48), each of which a second
                          interpreter must repeat.
                        - The same cost already appears twice in the
                          repository: change-set
                          rules kept in two languages
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_rules_kept_in_one_copy.yaml)
                          and a canonical form that Python and C++ must compute alike
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_needs_matching_code_on_target.yaml).
                        - The throwaway resolver interprets all seven
                          drafted kinds in about
                          forty lines of Python (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 24-67); reviewability measures the size of a change in lines
                          (_data/register/reg_concern.yaml line 529).
                        - ASSUMPTION: a parity test that resolves
                          sample variants through
                          both and compares digests holds the two together only for the
                          cases it covers; the two-interpreter option does not include one.
                        Concerns: functional suitability (one graph
                        per variant), reliability (checked graph
                        differs from run graph), maintainability and
                        reviewability (each change made and read
                        twice), simplicity (one language, two
                        semantics). For one C++ resolver, the
                        simplicity and reviewability advocates grant
                        the single semantics but weigh it against the
                        binding layer, argued separately. Strength:
                        strong; it grows with the number of operation
                        kinds and their options, not with nodes.

