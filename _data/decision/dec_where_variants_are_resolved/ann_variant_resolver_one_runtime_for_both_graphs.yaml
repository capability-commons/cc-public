title:                  One dataflow runtime for systems and for the graph of edits
brief:                  |
                        If the graph of edits is a [[dataflow graph]],
                        the [[dataflow engine]] that runs dataflow
                        graphs could also run resolution, with each
                        [[variant operation]] as a node, so the
                        tooling and a target would share one runtime
                        and one implementation of the operations.
                        Resolving in Python then means a second runner
                        of dataflow graphs beside the engine; one C++
                        resolver is the same code the engine would
                        run.
description:            |
                        Sources:
                        - The proposed option holds the graph of edits
                          as a dataflow graph whose nodes are variant
                          operations, merges and delta modules, and
                          resolving a dataflow variant is running it
                          up to its output.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief)
                        - The C++ resolver option shares one
                          implementation between the tooling and the
                          target.
                          (_data/decision/dec_where_variants_are_resolved/opt_one_cpp_resolver_with_python_bindings.yaml
                          at brief)
                        - The engine's C++ lives in cc-public.
                          (_data/decision/dec_home_of_the_engine_code/ruling_engine_code_in_cc_public.yaml
                          at brief)
                        - Simplicity counts jobs done by more than one
                          mechanism; functional suitability asks
                          whether every function that is needed is
                          present. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.1 and
                          entries.concern_functional_suitability.question.1)
                        - ASSUMPTION: the engine can carry a whole
                          dataflow model as a token; its ports are
                          typed by data dictionary entries, and no
                          entry for a model exists. Strength: weak
                          now; the graph of edits is not ruled a
                          dataflow graph, and the engine has no code
                          in the tree, but it grows if a target must
                          resolve or apply change sets itself.

