title:                  Stage cache kept beside the verdict store
brief:                  |
                        cctool already keeps verdicts in a store keyed
                        by input digests, which the gate of a commit
                        uses and the gate of a push leaves out so the
                        check of record finds everything afresh. A
                        Python resolver can keep the cache of each
                        stage the same way, so a stale or corrupt
                        entry can never pass a push; a C++ resolver
                        behind bindings keeps its cache across the
                        binding or in a second store.
description:            |
                        Sources:
                        - The store keeps verdicts under the digest of
                          the text and a digest of the code; the gate
                          of a commit sets it, and the gate of a push
                          sets no store, so the check of record finds
                          every verdict afresh.
                          (src/cctool/check/store.py within directory,
                          code and key)
                        - WTP wants caching at each stage (WTP,
                          2026-10-26).
                          (_data/decision/dec_how_the_graph_of_edits_is_run/dec_how_the_graph_of_edits_is_run.yaml
                          at description)
                        - The C++ resolver option has cctool call one
                          C++ library through Python bindings.
                          (_data/decision/dec_where_variants_are_resolved/opt_one_cpp_resolver_with_python_bindings.yaml
                          at brief)
                        - Reliability asks whether the design can
                          recover without losing or corrupting data;
                          maintainability asks how far a change in one
                          part spreads to others; simplicity counts
                          distinct mechanisms introduced.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reliability.question.2,
                          entries.concern_maintainability.question.1
                          and entries.concern_simplicity.measure.0)
                          Strength: moderate; a C++ resolver could
                          also take its cache from the Python side, at
                          the cost of passing models across the
                          binding.

