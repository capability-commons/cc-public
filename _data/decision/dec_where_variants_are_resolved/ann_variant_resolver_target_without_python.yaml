title:                  What a target with no Python can do
brief:                  |
                        With Python only, a target receives resolved
                        graphs or their difference, which meets every
                        Patrol need today, since no Patrol dataflow
                        variant switches by itself. A target that must
                        act on its own, such as an unattended embedded
                        board, could then only apply differences made
                        ahead of time, and only a resolver that runs
                        on the target lifts that limit.
description:            |
                        Sources:
                        - The engine never sees variants and loads
                          only resolved
                          configurations (_sources/cc-patrol-notes/variants.md lines
                          92-95).
                        - "No automatic switching for now"
                          (_sources/cc-patrol-notes/draft/README.md lines 86-87).
                        - C++17 is planned for embedded reach (owner's
                          statement,
                          2026-10-21, paraphrased in _sources/context.md line 9).
                        - An existing annotation argues the case of
                          change sets made where
                          cctool is absent
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_made_where_cctool_is_absent.yaml).
                        - The C++ resolver option shares one
                          implementation between the
                          tooling and the target
                          (_data/decision/dec_where_variants_are_resolved/opt_one_cpp_resolver_with_python_bindings.yaml at brief).
                        Concerns: functional suitability. It supports
                        Python only for the first instances and one
                        C++ resolver for unattended targets later; the
                        two-interpreter option also reaches such
                        targets but is argued under the
                        two-interpreter annotation. Strength: weak
                        now, moderate later; it grows with unattended
                        targets.

