title:                  C++ build on the path of every cctool check
brief:                  |
                        Checks run on every resolved variant, so a C++
                        resolver bound into cctool puts a C++
                        compiler, a binding library and a compiled
                        extension on the path of every commit gate,
                        every peer that builds cctool and every
                        supported platform, and every change to an
                        operation's signature also touches the binding
                        layer. Resolving in Python, with or without a
                        separate C++ interpreter kept with the engine,
                        leaves cctool with no compiled code of its
                        own.
description:            |
                        Sources:
                        - Checks run on every resolved variant
                          (_sources/cc-patrol-notes/variants.md lines 86-89), so cctool
                          cannot check without resolving.
                        - cctool builds its wheel with hatchling from
                          src/cctool, with no
                          extension build of its own (pyproject.toml lines 59-61 and 73-75);
                          it has seven dependencies (lines 48-54). Two of them, clingo and
                          pyoxigraph, ship compiled wheels (general knowledge, not checked in
                          the repository), so the new cost is a compiled extension built in
                          house, not compiled code as such.
                        - Under the accepted route for the engine
                          code, peers that use only
                          the tooling inherit a C++ build
                          (_data/decision/dec_home_of_the_engine_code/ann_tooling_only_peers_inherit_cpp_build.yaml).
                        - Any edit to pyproject.toml makes pixi.lock
                          stale, the pre-push
                          hook refuses, and only the owner can relock (context note,
                          2026-10-22, _sources/context.md line 30).
                        - The commit gate takes about 78 s on 2 CPUs
                          (context note,
                          _sources/context.md line 31).
                        - Development is on Linux and macOS
                          (_data/decision/dec_supported_dev_platforms/ruling_supported_dev_platforms.yaml
                          lines 12-16).
                        - The C++ resolver option shares one
                          implementation between the
                          tooling and the target
                          (_data/decision/dec_where_variants_are_resolved/opt_one_cpp_resolver_with_python_bindings.yaml
                          lines 12-16); it names no binding library.
                        - ASSUMPTION: the option needs a binding
                          library such as pybind11 or
                          nanobind and a build backend that compiles extensions.
                        Concerns: dependency risk (compiler, binding
                        library, build backend), reliability (the gate
                        depends on a compiled build on each platform),
                        maintainability (an operation change needs a
                        C++ build), simplicity (a compiled extension
                        in a Python-only package), reviewability (a
                        binding layer that each signature change
                        touches). Strength: strong; the cost is per
                        build, per platform and per peer, not per
                        node.

