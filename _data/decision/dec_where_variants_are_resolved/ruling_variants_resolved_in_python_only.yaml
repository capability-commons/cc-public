title:                  Variants resolved in Python only
brief:                  |
                        Only cctool, in Python, interprets variant
                        operations, and a target receives resolved
                        graphs or the difference between two of them.
                        Ruled by WTP on 2026-10-26, on the basis that
                        a Python orchestrator can act as an adapter
                        between whatever canonical form the variant
                        operations are held in and a materialized form
                        that is most convenient for the C++ runtime.
                        The graph of edits may be shaped as a dataflow
                        graph, but cctool runs it, and the engine
                        never sees operations.

