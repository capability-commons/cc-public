title:                  Testability heard wherever maintainability drives
brief:                  |
                        With the fold, every deliberation on a
                        component driven by maintainability must
                        include a maintainability annotation, whose
                        advocate is briefed with the checking
                        question, because the checker refuses a ruling
                        while a driver is unargued. No change to the
                        drivers is needed.
description:            |
                        concern_maintainability asks "How readily can
                        a change be checked before it ships?"
                        (repo/_data/register/reg_concern.yaml line
                        353) and names "tested" in its description
                        (line 341). It drives lco_item_graph,
                        lco_vocabulary, lco_tooling and
                        lco_project_guidance (templates/drivers.txt).
                        Check unargued_driver: check.lp within
                        key_mismatch and dangling_reference. The check
                        asks for an annotation for the concern, not
                        one that addresses checking in particular. A
                        separate concern would be heard only where a
                        component lists it.

