title:                  Repair named in the brief but not asked
brief:                  |
                        The maintainability brief says "repaired", but
                        no question asks about repair. The fold
                        restored the entry as it was before the split,
                        which also had no repair question.
description:            |
                        Brief: repo/_data/register/reg_concern.yaml
                        lines 336-338. The description lists
                        "analysed, modified, tested and reused" (lines
                        339-343). The question "What does it take to
                        repair a fault once in use?" existed only from
                        6cabbb1, which added it, to 373ff5d, which
                        removed it; the brief has said "changed and
                        repaired" since before 6cabbb1 (git show
                        6cabbb1^:_data/register/reg_concern.yaml line
                        313). A minor wording gap in one item that
                        predates the split.

