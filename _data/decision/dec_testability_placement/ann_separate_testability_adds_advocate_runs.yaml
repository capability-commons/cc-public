title:                  Extra advocate run and review per decision
brief:                  |
                        A separate testability concern adds one
                        advocate run, and up to one annotation to
                        review, on each decision about every component
                        it drives. Review is already the bottleneck of
                        the advocate process.
description:            |
                        A ruling fails the check until each driver of
                        the subject is argued
                        (repo/src/cc_public/check/check.lp lines
                        448-453, unargued_driver). The pilot found
                        review to be the bottleneck (memory/MEMORY.md
                        line 52), and the maintainer wants to contain
                        the growth of annotations (line 53). Will
                        reviews advocate results in batches of five
                        (maintainer's statement,
                        2026-10-14T23:39:41Z). The separate entry was
                        36 lines with its own question, measure and
                        excludes lists (git show 373ff5d). ASSUMPTION:
                        a separate testability concern would be made a
                        driver of at least one component, such as
                        lco_tooling. Drivers are set per component, so
                        it could also displace another driver instead
                        of adding one.

