title:                  Fold that leans toward the standard
brief:                  |
                        Keeping testability in maintainability follows
                        ISO/IEC 25010:2023, which the maintainer gave
                        as the reason, to lean toward being
                        standards-informed.
description:            |
                        Maintainer's statement, 2026-10-13T18:30:41Z
                        (will-messages.md line 271): "I'd rather
                        testability stay in maintainability so we lean
                        more toward being standards-informed". Applied
                        in commit 373ff5d. The register already rested
                        on the 25010:2023 characteristics by the
                        maintainer's choice (statements
                        2026-10-13T17:13:50Z and 17:17:37Z). The
                        project memory records that the 25010:2023
                        change list does not move testability out of
                        maintainability (memory/MEMORY.md line 4).
                        That was confirmed only after the decision: at
                        18:30 the 2023 edition was not held and the
                        placement was marked unconfirmed (MEMORY.md
                        line 3); previews were added at 19:47
                        (maintainer's statement,
                        2026-10-13T19:47:13Z).

