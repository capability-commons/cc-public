title:                  Checking question without a measure
brief:                  |
                        After the fold, maintainability asks how
                        readily a change can be checked but has no
                        measure for it, so check-run time and
                        fault-finding time are not measured anywhere.
                        They were measured only by the separate entry,
                        from 6cabbb1 to 373ff5d.
description:            |
                        Question and measures:
                        repo/_data/register/reg_concern.yaml lines
                        353-357. The removed testability entry
                        measured "Time to run the full set of checks,
                        in minutes" and "Time from a failing check to
                        its cause, in hours" (git show 6cabbb1 and
                        373ff5d). concern_cost measures effort in
                        person days and running cost per month (lines
                        548-550). Advocates are briefed from a
                        concern's measures (templates/advocate.md line
                        10). The commit gate took about 2 minutes
                        against the 180 s limit of device tool calls,
                        and about 75 s after later speed-ups
                        (memory/MEMORY.md lines 45, 47 and 54).
                        Maintainability had no checking measure before
                        the split either (git show 6cabbb1^). The gap
                        can be closed by adding a checking measure to
                        maintainability, so this argues for a fix to
                        the chosen entry more than for the separate
                        concern.

