title:                  One concern per characteristic of the standard
brief:                  |
                        With the fold, each concern taken from ISO/IEC
                        25010:2023 traces to one characteristic. A
                        separate testability concern would be the only
                        one that traces to a subcharacteristic.
description:            |
                        Nine concerns carry a note "Corresponds to the
                        ... characteristic of ISO/IEC 25010:2023"
                        (repo/_data/register/reg_concern.yaml note
                        fields at lines 63, 101, 140, 177, 222, 264,
                        305, 344, 380). The removed testability entry
                        said it was a subcharacteristic of
                        maintainability, held apart so that it could
                        be argued for separately (git show 373ff5d).
                        The rule is a lean, not a law:
                        concern_simplicity says no standard defines it
                        (reg_concern.yaml lines 418-422).

