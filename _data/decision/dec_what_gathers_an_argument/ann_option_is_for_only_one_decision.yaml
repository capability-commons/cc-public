title:                  One decision per option
brief:                  |
                        An option may belong to only one decision. A
                        choice that settles two questions must be
                        split, or one question folded into the other.
description:            |
                        option_count (check.lp lines 308-315);
                        determination_across_decisions (check.lp lines
                        348-358). ASSUMPTION: no current option
                        belongs to two questions; only the two
                        decisions in the tree were checked.

