title:                  Separate edges for subject and grouping
brief:                  |
                        Under siblings, r_is_about both named the
                        subject and grouped the alternatives. The
                        decision item gives each job its own edge, at
                        the fixed cost of one type with its concept
                        and schema, one relation and two checks.
description:            |
                        Sibling form: commit fb5566b message. Now
                        argued joins on r_is_option_for (check.lp
                        lines 423-436) and r_is_about has domain
                        type_annotation and type_decision only
                        (_data/register/reg_relation.yaml lines
                        167-169). Cost: type_decision,
                        concept_decision, sch_decision,
                        r_is_option_for (commit 52e3e6d), option_count
                        and decisions_mixed_in_ruling (check.lp lines
                        312-315, 353-357). ASSUMPTION: a narrower
                        subject per question could patch the sibling
                        form, but that subject would be a decision
                        under another name. This patch was not tried.

