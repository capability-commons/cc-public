title:                  Mechanisms the glue form would spare
brief:                  |
                        The glue form needs no decision type or
                        r_is_option_for, and an in-place update needs
                        no supersession rules. The saving is a one-off
                        build of a fixed handful of rules.
description:            |
                        Decision: type_decision, con_decision,
                        sch_decision, r_is_option_for (commit 52e3e6d,
                        147 lines). Supersession: commit 89c74d8, 5
                        files, 109 insertions, adding current_ruling,
                        competing_rulings, supersession_across_types
                        and supersession_across_issues (check.lp lines
                        364-415). ASSUMPTION: the glue form would
                        still need an edge from options and
                        annotations to the glue item, so part of the
                        decision type's cost would recur.

