title:                  Decision item as in IBIS
brief:                  |
                        A decision item gathers each deliberation, as
                        an issue does in IBIS: its options, the
                        annotations about it and its one ruling. It
                        exists before any ruling, so an open question
                        has a home, and two questions about one
                        component no longer count each other's
                        arguments. A ruling records only the verdict
                        and is edited in place. Ruled by William Payne
                        on 2026-10-22.

