title:                  Open deliberations before any ruling
brief:                  |
                        A deliberation exists and needs a home before
                        anyone determines it. A ruling as glue would
                        have to gather and settle at once, and exist
                        with no verdict.
description:            |
                        decision_of places items in a decision with or
                        without a ruling (check.lp lines 138-155). The
                        checks-engine deliberation came in c7058e3 and
                        its ruling in 6c0a949; dec_tooling_language
                        has no ruling at HEAD. no_option_in_ruling
                        requires each ruling to uphold or reject an
                        option (check.lp lines 324-327). A test passes
                        an open option (test_check.py line 366). Will
                        sketched the glue idea only as a question: a
                        ruling "which glues together the whole
                        argument - providing the name of the folder
                        and being updated as evidence (and arguments)
                        change?" (maintainer's statement,
                        2026-10-14T22:56:42Z). ASSUMPTION: the glue
                        form was never specified beyond this, so this
                        reads "glue" plainly.

