title:                  Open deliberations before any ruling
brief:                  |
                        A deliberation exists and needs a home before
                        anyone rules on it. A ruling as glue would
                        have to gather and settle at once, and exist
                        with no verdict.
description:            |
                        decision_of places items in a decision with or
                        without a ruling (src/cctool/graph/derive.lp
                        lines 129-146). The checks-engine deliberation
                        came in c7058e3 and its ruling in 6c0a949;
                        dec_tooling_language has no ruling at HEAD,
                        and 47 of the 113 decisions under
                        _data/decision/ have none. no_option_in_ruling
                        requires each ruling to uphold or reject an
                        option (src/cctool/check/check.lp lines
                        1185-1188). A test passes an open option
                        (test_an_open_option_with_a_driver_unargued_passes,
                        src/cctool/check/_test/test_check.py line
                        505). Will sketched the glue idea only as a
                        question: a ruling "which glues together the
                        whole argument - providing the name of the
                        folder and being updated as evidence (and
                        arguments) change?" (maintainer's statement,
                        2026-10-14). ASSUMPTION: the glue form was
                        never specified beyond this, so this reads
                        "glue" plainly.

