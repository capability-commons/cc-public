title:                  One small item per deliberation
brief:                  |
                        The decision item was a small one-off build
                        and adds one short item to each deliberation.
                        Its running cost grows with the number of
                        deliberations, not with the annotations in
                        them.
description:            |
                        Commit 52e3e6d: 4 files, 147 insertions.
                        Commit 1ba2895: 48 files, 392 insertions, 164
                        deletions, 15 minutes later. A decision item
                        is about 20 lines of YAML
                        (dec_tooling_language.yaml, 21 lines).
                        decision_of (src/cctool/graph/derive.lp lines
                        129-146), option_count and misplaced_document
                        (src/cctool/check/check.lp lines 1149-1152,
                        581-595) are per item. ASSUMPTION: elapsed
                        time between commits stands for effort; the
                        work was agent-written.

