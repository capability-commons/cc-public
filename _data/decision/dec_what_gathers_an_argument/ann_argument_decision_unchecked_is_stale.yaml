title:                  Check now on the decision of an argument
brief:                  |
                        The annotation says no rule compares the
                        decision an annotation is about with the
                        decision of what it argues. Now
                        argument_across_decisions reports an
                        annotation that argues an item of another
                        decision.
description:            |
                        argument_across_decisions
                        (src/cctool/check/check.lp lines 1376-1385)
                        holds where an annotation supports or
                        challenges a target whose decision_of differs
                        from its own.
                        test_an_argument_across_two_decisions_is_reported
                        (src/cctool/check/_test/test_check.py line
                        373) covers it. Found in the review of
                        2026-10-22.

