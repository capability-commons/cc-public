title:                  Open arguments before any determination
brief:                  |
                        An argument exists and needs a home before
                        anyone determines it. A determination as glue
                        would have to gather and settle at once, and
                        exist with no verdict.
description:            |
                        decision_of places items in a decision with or
                        without a determination (check.lp lines
                        138-155). The checks-engine argument came in
                        c7058e3 and its determination in 6c0a949;
                        dec_tooling_language has no determination at
                        HEAD. determination_without_option requires
                        each determination to uphold or reject an
                        option (check.lp lines 324-327). A test passes
                        an open option (test_check.py line 366). Will
                        sketched the glue idea only as a question: a
                        determination "which glues together the whole
                        argument - providing the name of the folder
                        and being updated as evidence (and arguments)
                        change?" (owner's statement,
                        2026-10-14T22:56:42Z). ASSUMPTION: the glue
                        form was never specified beyond this, so this
                        reads "glue" plainly.

