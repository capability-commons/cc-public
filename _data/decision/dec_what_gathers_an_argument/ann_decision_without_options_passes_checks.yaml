title:                  Decision with no options
brief:                  |
                        A decision with no options fails no check. It
                        is reported only as advice, so a question with
                        no alternatives never blocks a commit.
description:            |
                        decision_without_options reports a decision
                        with no options as advice, "so that it is not
                        forgotten" (src/cctool/check/advise.lp within
                        decision_without_options;
                        test_a_decision_no_option_answers_is_advice,
                        src/cctool/check/_test/test_check.py, which
                        finds no failures). The failing rules that
                        name type_decision, missing_about and
                        decision_about_non_component
                        (src/cctool/check/check.lp within
                        missing_about and
                        decision_about_non_component), test only its
                        subject. A rule would make it a failure.

