title:                  Mixed arguments under a shared subject
brief:                  |
                        Once one component has two questions, grouping
                        by shared subject lets an annotation on one
                        question count for the other. The driver check
                        then gives a wrong result, and a reviewer
                        cannot read one deliberation as a bounded set.
description:            |
                        Before 1ba2895, argued/2 joined options on a
                        shared r_is_about subject (git show 1ba2895 --
                        src/cc_public/check/check.lp, removed lines).
                        At c7058e3, opt_tooling_in_python and
                        opt_cross_item_checks_in_clingo both held
                        r_is_about lco_tooling, though they are
                        options for different questions.
                        unargued_driver uses argued/2 (check.lp lines
                        448-453). The harm grows with the number of
                        questions per component, so more pairs
                        miscount and the cost of finding them rises.

