title:                  Source of relation_is_about now set by a role
brief:                  |
                        The annotation says relation_is_about has
                        domain type_annotation and type_decision only.
                        Relations have no domain now. The source must
                        play rol_can_be_about_an_item, which the same
                        two types play.
description:            |
                        relation_is_about constrains its source with
                        relcon_can_be_about_an_item and its target not
                        at all (_data/register/reg_relation.yaml at
                        entries.relation_is_about). The constraint
                        admits rol_can_be_about_an_item
                        (_data/register/reg_relation_constraint.yaml
                        at entries.relcon_can_be_about_an_item), which
                        type_annotation and type_decision play
                        (_data/register/reg_data_item_type.yaml). The
                        split of subject from grouping is unchanged.
                        Found in the review of 2026-10-22.

