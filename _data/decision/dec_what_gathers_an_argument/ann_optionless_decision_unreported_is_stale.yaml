title:                  Decision with no options now reported as advice
brief:                  |
                        The annotation says a decision with no options
                        passes every check and is not reported. Now it
                        is reported as advice, though it is not a
                        failure.
description:            |
                        decision_without_options
                        (src/cctool/check/advise.lp line 109) reports
                        a decision with no options, "so that it is not
                        forgotten".
                        test_a_decision_no_option_answers_is_advice
                        (src/cctool/check/_test/test_check.py line
                        383) covers it. Rules that name type_decision
                        now include decision_about_non_component
                        (check.lp line 1334). Found in the review of
                        2026-10-22.

