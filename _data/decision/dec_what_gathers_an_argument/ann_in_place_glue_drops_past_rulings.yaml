title:                  Past rulings lost from the graph
brief:                  |
                        A ruling updated in place keeps only the
                        current ruling in the graph. An earlier ruling
                        and why it was replaced survive only in git
                        history. The cross-item checks read only the
                        current tree, and the commit checks compare a
                        commit only with its parent.
description:            |
                        Idea: maintainer's statement
                        2026-10-14T22:56:42Z ("being updated as
                        evidence (and arguments) change");
                        memory/MEMORY.md line 55. Rulings are now
                        edited in place in the form in use as well: a
                        decision has at most one ruling
                        (competing_rulings, src/cctool/check/check.lp
                        lines 1467-1472), relation_supersedes admits
                        only options and interface control documents
                        (_data/register/reg_relation.yaml lines
                        264-301), and ruling_change_of_a_ruling chose
                        this on 2026-10-19 because git already holds
                        the history. Commit checks:
                        src/cctool/commit/change.lp compares the graph
                        before and after one commit. ASSUMPTION: the
                        glue form would keep earlier rulings in git
                        only. The loss grows with how often rulings
                        change.

