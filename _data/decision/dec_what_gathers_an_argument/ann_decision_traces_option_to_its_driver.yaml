title:                  Trace from option through question to driver
brief:                  |
                        The decision item gives each option one traced
                        reason, the question it is an option for, and
                        links that question to the subject and its
                        drivers. A shared subject stops the trace at
                        the component.
description:            |
                        option_count (check.lp lines 305-315),
                        missing_about (check.lp lines 291-301).
                        unargued_driver follows option,
                        r_is_option_for, decision, r_is_about,
                        subject, r_is_driven_by, concern (check.lp
                        lines 448-453). Sibling form: commit fb5566b
                        message.

