title:                  Trace from option through question to driver
brief:                  |
                        The decision item gives each option one traced
                        reason, the question it is an option for, and
                        links that question to the subject and its
                        drivers. A shared subject stops the trace at
                        the component.
description:            |
                        option_count (check.lp within
                        parameter_member), missing_about (check.lp
                        within parameter_member). unargued_driver
                        follows option, relation_is_option_for,
                        decision, relation_is_about, subject,
                        relation_is_driven_by, concern (check.lp
                        within satisfies). Sibling form: commit
                        fb5566b message.

