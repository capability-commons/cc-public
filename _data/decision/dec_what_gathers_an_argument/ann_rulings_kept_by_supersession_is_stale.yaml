title:                  Rulings now edited in place
brief:                  |
                        The annotation says relation_supersedes now
                        keeps an earlier ruling on record. Now a
                        ruling is edited in place and cannot be
                        superseded, so an earlier ruling survives only
                        in git history.
description:            |
                        competing_rulings (src/cctool/check/check.lp
                        within competing_rulings) allows one ruling
                        for each decision, and its brief says "A
                        change of ruling edits it in place, and the
                        history of the ruling is the history of its
                        file". relation_supersedes admits only options
                        and interface control documents
                        (_data/register/reg_relation.yaml at
                        entries.relation_supersedes). The annotation's
                        case against the glue form now bears on the
                        form in use. Found in the review of
                        2026-10-22.

