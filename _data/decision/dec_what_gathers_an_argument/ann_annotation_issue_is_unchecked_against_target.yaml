title:                  Annotation decision held twice and unchecked
brief:                  |
                        An annotation joins a decision by its
                        r_is_about edge and again by the option it
                        argues. No check keeps the two equal, so a
                        misfiled annotation can make a driver count as
                        argued in the wrong decision.
description:            |
                        decision_of reads r_is_about (check.lp lines
                        148-151). argued reads r_supports and
                        r_challenges to an option and its
                        r_is_option_for (check.lp lines 423-436). No
                        rule compares the two (search of check.lp and
                        src/ for r_supports). All 29 annotations in
                        _data/decision/ agree today (count by script).
                        An annotation that bears on no option has only
                        r_is_about. One rule would close the gap.

