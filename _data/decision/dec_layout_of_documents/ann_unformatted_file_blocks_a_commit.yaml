title:                  Unformatted file as a block on commit
brief:                  |
                        The printer runs inside cctool check, and
                        check inside the pre-commit gate. A
                        hand-edited file blocks a commit until it is
                        laid out, though recovery is one cctool
                        format.
description:            |
                        check adds unformatted_file rows
                        (src/cc_public/check/check.py lines 66-78).
                        The gate runs check first
                        (src/cc_public/gate/gate.py line 64), and
                        .githooks/pre-commit runs the gate. Hand edits
                        are to be followed by cctool format and check
                        (.agents/skills/editing-data-items/SKILL.md
                        lines 113-118). Under the fragment writer,
                        check had no layout check (b544e09 diff of
                        check.py). A file the printer refuses stays
                        blocked, with no documented bypass. The
                        advocate rated this neutral, a cost with a
                        bound.

