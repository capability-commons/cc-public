title:                  Layout read mostly by the fast reader
brief:                  |
                        The annotation says the layout of every YAML
                        document comes from the round-trip parse of
                        ruamel.yaml. Now the layout reads most files
                        with the fast reader, and only a file the fast
                        reader cannot lay out goes to ruamel.yaml.
description:            |
                        lay_out reads a document as _load reads it,
                        which calls cctool.graph.parse.load, and falls
                        back to ruamel.yaml otherwise
                        (src/cctool/check/layout.py within lay_out and
                        _load). Found in the weekly review of
                        2026-10-29.

