title:                  No new third-party dependency for layout
brief:                  |
                        The ported printer uses only the standard
                        library, ruamel.yaml and cc_public. It adds no
                        package, service or license, and the legacy
                        code is copied in, not linked.
description:            |
                        Runtime dependencies are now click, clingo,
                        htpy, jsonschema, pyoxigraph, referencing and
                        ruamel.yaml (pyproject.toml at
                        project.dependencies). The printer imports
                        only the standard library (ast, io, pathlib,
                        re, typing), ruamel.yaml and cc_public
                        (src/cctool/edit/layout.py), as it did at
                        b544e09. The fragment writer imported the same
                        one third-party package, ruamel.yaml
                        (c4a8721:src/cctool/edit/layout.py lines
                        31-35), so this does not separate the
                        alternatives. Ported from
                        cc-public-legacy-20260918 (layout.py), a local
                        copy on the maintainer's machine
                        (will-messages.md line 45). ASSUMPTION: the
                        legacy code was written by the maintainer
                        alone, so porting it raises no license
                        question.

