title:                  Edits that still splice before they print
brief:                  |
                        An edit first splices text fragments into the
                        file at computed lines and columns, and only
                        then prints the whole file. Two mechanisms
                        place text for one edit.
description:            |
                        link and set_field build fragments with
                        layout.dump and insert them with _Item.replace
                        at ranges from _Item.extent and _Item.column
                        (src/cc_public/edit/edit.py lines 447-449,
                        561-566, 1150-1192). extent scans indentation
                        (lines 1159-1180). dump returns YAML "not laid
                        out" (layout.py lines 228-233). The printer
                        reads comments from source lines (layout.py
                        _lead, line 348). The splice is about 90 lines
                        and does not grow with the graph.
                        opt_fragment_writer has the same splice plus
                        its own layout rules. ASSUMPTION: editing the
                        loaded YAML document instead would need
                        comments carried another way; not tested.

