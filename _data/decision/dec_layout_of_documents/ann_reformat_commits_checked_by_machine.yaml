title:                  Layout-only commits judged by machine
brief:                  |
                        Because one printer defines the layout, a
                        commit titled Reformat is checked to change
                        nothing beyond layout. A person need not read
                        the lines of a reformat to judge it, however
                        many files it touches.
description:            |
                        The commit check reports
                        reformat_changes_content for any file a
                        Reformat commit changes beyond layout
                        (src/cc_public/commit/change.lp lines
                        213-221). A file counts as changed only if it
                        differs once both sides are laid out by the
                        printer (src/cc_public/commit/change.py lines
                        123, 129-161, format_file at line 159). Tests
                        show a layout-only reformat passes and one
                        with a content change is reported
                        (src/cc_public/commit/_test/test_change.py
                        lines 147-159). The check runs from cctool
                        message check and the commit-msg hook
                        (memory/MEMORY.md line 43). It came after the
                        decision, in 7520f91 (after the squash), and
                        needs one canonical layout to compare against.
                        The fragment writer had no whole-file layout
                        and no format command
                        (c4a8721:src/cc_public/edit/layout.py lines
                        21-24, 39, 124-136; b544e09 commit message).
                        opt_new_blank_line_rule keeps one printer, so
                        the same check would serve it. The one
                        reformat so far, cdc9ae6 (pre-squash), touched
                        11 files. The point eases the cost in
                        ann_layout_rule_change_touches_every_file, but
                        not the review of the printer code itself.
                        Maintainer's driver: "the huge (and
                        practically impossible) review burden that we
                        are generating" (W 2026-10-15T10:59:29Z,
                        will-messages.md line 786).

