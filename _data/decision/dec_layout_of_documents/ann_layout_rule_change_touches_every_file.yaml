title:                  A layout rule change touches every file
brief:                  |
                        The check demands that every file match the
                        printer, so any later change to a layout rule
                        brings a reformat of the whole tree into the
                        same change.
description:            |
                        Adopting the legacy blank-line rule took
                        cdc9ae6 (pre-squash), 11 files, 68 insertions
                        and 58 deletions, no data change. cctool check
                        reports unformatted_file for any file the
                        printer would change (b544e09 commit message).
                        The commit check reformat_changes_content
                        compares files after layout (memory/MEMORY.md
                        line 43, 7520f91). cctool format does the
                        reformat mechanically, so the cost is in files
                        touched, not person time. Holds for the legacy
                        rule and an own rule alike.

