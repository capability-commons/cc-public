title:                  Layout verdicts now cached by file content
brief:                  |
                        ann_layout_pass_on_every_check says the layout
                        check runs over every YAML document on each
                        cctool check, with no cache, and that a cache
                        keyed on content is not built. Layout verdicts
                        are now kept by content digest, within a run
                        and, under the gate of a commit, between runs.
description:            |
                        layout.violations (src/cctool/edit/layout.py
                        lines 133-164) keys each verdict on the path
                        and the digest of the text. It keeps up to
                        4096 verdicts in MAP_VIOLATION (lines
                        105-106), and loads and saves them through the
                        store of src/cctool/check/store.py under the
                        kind layout (line 111). The store is the
                        folder that CC_PUBLIC_STORE names, which the
                        gate of a commit sets; the gate of a push sets
                        none. Each check still reads and hashes every
                        file, but lays out only those it has not seen.
                        Found in the review of 2026-10-22.

