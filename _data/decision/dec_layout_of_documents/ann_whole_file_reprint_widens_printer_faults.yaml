title:                  Whole-file reprint widens the reach of a printer fault
brief:                  |
                        Every edit reprints the whole file, so a
                        defect in the printer can change or drop items
                        the edit never named. Nothing compares their
                        data before and after, and the main test
                        covers only shapes the repository holds.
description:            |
                        Every edit lays out the whole file (b544e09
                        commit message; _Item.replace and _format,
                        src/cc_public/edit/edit.py line 1182). apply
                        compares check failures, not item data
                        (edit.py lines 866-891). cctool format writes
                        changed files with no data comparison
                        (src/cc_public/cli/editing.py line 379). The
                        fixpoint and data test runs over the documents
                        in the repository and compares prose by words
                        (src/cc_public/edit/_test/test_edit.py lines
                        468-477). layout.py grew from 183 lines at
                        c4a8721 to 558 at b544e09 and 586 now. 3ba3a5c
                        (after the squash) fixed a lost empty mapping
                        in a list; no file at 3ba3a5c~1 held "- {}",
                        so the repository test could not catch it.
                        Merged from the maintainability and
                        reliability advocates. ASSUMPTION: no
                        data-equality check exists elsewhere.

