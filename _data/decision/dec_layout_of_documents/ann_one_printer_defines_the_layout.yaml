title:                  One printer for every layout job
brief:                  |
                        The check, cctool format, every edit and the
                        commit tools all call the one printer. A
                        change to the layout is made in one place, and
                        drift from it is caught.
description:            |
                        cctool.check.layout is called by the check
                        (src/cctool/check/check.py within review, for
                        unformatted_file), by cctool format
                        (src/cctool/cli/editing.py within format_), by
                        every edit through _format
                        (src/cctool/edit/edit.py within _rename_one,
                        _moves and _redotted), by the commit message
                        writer (src/cctool/commit/message.py within
                        compose) and by the before/after commit check
                        (src/cctool/commit/change.py within _changed).
                        Its usage field: "a file is laid out the same
                        way whoever writes it". The fragment writer of
                        c4a8721 had its own blank-line logic
                        (c4a8721:src/cctool/check/layout.py lines
                        53-70) and no check or format command;
                        unformatted_file came in b544e09. Merged from
                        the maintainability and simplicity advocates.

