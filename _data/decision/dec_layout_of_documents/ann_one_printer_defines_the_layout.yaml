title:                  One printer for every layout job
brief:                  |
                        The check, cctool format, every edit and the
                        commit tools all call the one printer. A
                        change to the layout is made in one place, and
                        drift from it is caught.
description:            |
                        cc_public.edit.layout is called by the check
                        (src/cc_public/check/check.py lines 66-79,
                        unformatted_file at line 54), by cctool format
                        (src/cc_public/cli/editing.py line 372), by
                        every edit through _format
                        (src/cc_public/edit/edit.py lines 1052-1060
                        and 1182-1192), by the commit message writer
                        (src/cc_public/commit/message.py line 130) and
                        by the before/after commit check
                        (src/cc_public/commit/change.py line 159). Its
                        usage field: "a file is laid out the same way
                        whoever writes it". The fragment writer of
                        c4a8721 had its own blank-line logic
                        (c4a8721:src/cc_public/edit/layout.py lines
                        53-70) and no check or format command;
                        unformatted_file came in b544e09. Merged from
                        the maintainability and simplicity advocates.

