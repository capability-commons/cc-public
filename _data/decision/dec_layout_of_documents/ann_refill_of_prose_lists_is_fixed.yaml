title:                  Lists in prose now kept by the printer
brief:                  |
                        Commit a5dea6e "Fix the layout printer so that
                        a list in prose keeps its items" makes each
                        line that opens with a list marker begin a
                        paragraph of its own. At 360ec14 a flush list
                        in a description or a commit body is no longer
                        joined into one run of words.
description:            |
                        REGEX_LIST_ITEM matches "- ", "* ", "+ " and
                        "1. " or "1) " (src/cctool/edit/layout.py
                        within MARK_ITEM and REGEX_COMMENT at
                        360ec14); tests at
                        src/cctool/edit/_test/test_edit.py within
                        test_header_refuses_a_module_with_a_docstring_already
                        and
                        test_set_rewrites_a_field_in_a_comment_header.
                        Other line-by-line text written flush, such as
                        an address or a short poem, is still refilled.

