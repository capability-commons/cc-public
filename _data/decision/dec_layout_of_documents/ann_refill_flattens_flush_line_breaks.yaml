title:                  Refill of line breaks that carry meaning
brief:                  |
                        The printer refills every literal block, not
                        only what an edit writes. Line-by-line text
                        written flush in a block, other than a list,
                        is joined into one run of words, and the check
                        then demands that result.
description:            |
                        _body joins each run of flush lines in a block
                        scalar and fills it. Blank lines, lines
                        indented further and, since a5dea6e, lines
                        that open with a list marker are kept apart
                        (src/cctool/edit/layout.py within _body).
                        Every LiteralScalarString goes to _body,
                        whatever its key (layout.py within
                        _emit_value); literal keys include follows and
                        breaks, 17 each, besides the prose fields
                        (grep, 2026-10-22). The note field says
                        formatted prose differs only in where its
                        lines break (layout.py). At 89c74d8 a flush
                        list was joined into one line, in a
                        description and in a commit body (advocate
                        run, 2026-10-15). Review run, 2026-10-22: a
                        flush list, and a commit body of "Changes:",
                        "- one", "- two", are kept, but two flush
                        lines of an address after the list, "12 Main
                        Street" and "Springfield", are joined onto its
                        last item. The commit message writer uses the
                        same printer (src/cctool/commit/message.py
                        within compose). cctool check reports
                        unformatted_file for any file the printer
                        would change (check.py within review). The
                        fragment writer also joined each paragraph it
                        wrote (c4a8721:src/cctool/edit/layout.py lines
                        124-142), but only the text of the edit, and
                        had no check over hand-written files. 111
                        files under _data now hold a flush list in
                        prose, which the fix keeps. Refill tests:
                        src/cctool/edit/_test/test_edit.py within
                        test_prose_is_refilled_by_paragraph_and_other_scalars_are_left_alone
                        and
                        test_each_item_of_a_list_in_prose_is_filled_on_its_own.
                        ASSUMPTION: authors will want other
                        line-by-line text, such as an address, in a
                        description or commit body. Indenting such
                        lines further keeps them, so the point argues
                        for a documented rule more than for the
                        fragment writer. Also bears weakly on
                        opt_new_blank_line_rule, which keeps the same
                        printer.

