title:                  Legacy printer taken as-is
brief:                  |
                        One printer, ported from the legacy
                        repository, lays out every YAML document, and
                        cctool check reports any file it would change,
                        so a file is laid out the same way whoever
                        writes it. It adds no dependency, and a commit
                        titled Reformat is checked by machine to
                        change only layout. The fragment writer had no
                        check over files written by hand, and a
                        blank-line rule of our own would reopen a rule
                        already settled. Ruled by William Payne on
                        2026-10-23.

