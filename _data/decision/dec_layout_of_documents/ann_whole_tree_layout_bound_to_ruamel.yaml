title:                  Whole-tree layout bound to ruamel.yaml round-trip behavior
brief:                  |
                        The layout of every YAML document comes from
                        the ruamel.yaml round-trip parse, and any
                        difference fails the check. A change in that
                        library would mark files across the tree
                        unformatted, not only the file an edit
                        touched.
description:            |
                        The printer uses YAML(typ = 'rt'),
                        CommentedMap, CommentedSeq, .lc and the scalar
                        style classes (src/cc_public/edit/layout.py
                        lines 57-59, 87-92, 425, 474-479, 496). The
                        fragment writer loaded with typ = 'safe'
                        (c4a8721:src/cc_public/edit/layout.py line
                        48). ruamel.yaml is pinned >=0.19.1,<0.20 and
                        locked at 0.19.1 (pyproject.toml line 41;
                        pixi.lock lines 743-745), so an upgrade is
                        deliberate and cctool format repairs it in one
                        commit. The extractor already used the
                        round-trip parse and .lc
                        (c4a8721^:src/cc_public/graph/extract.py lines
                        46, 491, 507). ruamel.yaml is MIT licensed,
                        with one named author
                        (https://pypi.org/pypi/ruamel.yaml/json,
                        fetched 2026-10-15). opt_new_blank_line_rule
                        has the same exposure. ASSUMPTION: .lc and the
                        style classes are less firmly documented than
                        load and dump; not checked.

