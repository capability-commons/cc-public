title:                  Own blank-line rule as a new decision
brief:                  |
                        An own blank-line rule opens a layout decision
                        that the legacy rule had settled. Taking the
                        rule as-is follows from porting the legacy
                        printer.
description:            |
                        The printer was ported from
                        cc-public-legacy-20260918 (b544e09 commit
                        message; layout.py note field). The legacy
                        rule is one sentence (layout.py description
                        field). The one-time reformat, cdc9ae6
                        (pre-squash), touched 11 files with no data
                        change. The point is small, since the rule is
                        one sentence either way.

