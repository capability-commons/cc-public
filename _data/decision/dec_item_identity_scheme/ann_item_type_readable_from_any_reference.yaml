title:                  Item type readable from any reference
brief:                  |
                        Because id and guid both begin with the type
                        prefix, a reader or a tool knows the type of
                        any reference without a lookup, which keeps
                        the type checks short and local.
description:            |
                        The tooling splits the id at the first
                        underscore and looks up the prefix
                        (src/cc_public/edit/edit.py lines 245-254,
                        334-336). The rename command keeps the type
                        (edit.py lines 733-736). The checker reports
                        unknown prefixes and a guid prefix unlike the
                        id prefix (src/cc_public/check/check.lp lines
                        35-44, 64-75). ASSUMPTION: a centrally
                        numbered id or a bare UUID needs a lookup to
                        give the type; no implementation of either
                        exists.

