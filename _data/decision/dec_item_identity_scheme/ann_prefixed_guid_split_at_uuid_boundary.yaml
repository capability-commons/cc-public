title:                  Prefixed guid split at every UUID boundary
brief:                  |
                        A standard UUID parser or a UUID column
                        rejects a prefixed guid, so every partner
                        system, and any move to a store with a native
                        UUID type, must split off the prefix and keep
                        it apart.
description:            |
                        Guid pattern ^[a-z]{1,8}_[0-9a-f]{32}$ and the
                        rule to split on the first underscore:
                        _data/schema/sch_primitive.yaml lines 99-115.
                        Python 3.13 uuid.UUID rejects the prefixed
                        string and accepts the 32 hex digits (local
                        test, 2026-10-14). The body is uuid4().hex
                        (src/cc_public/edit/edit.py line 410), so the
                        split is mechanical. PostgreSQL uuid input has
                        no letter prefix
                        (https://www.postgresql.org/docs/current/datatype-uuid.html).
                        Items are stored as YAML text, and the query
                        database is in-memory SQLite with TEXT columns
                        (src/cc_public/graph/sql.py lines 41, 61), so
                        neither pays this cost today. ASSUMPTION:
                        other UUID parsers and column types also
                        reject the prefix. ASSUMPTION: the store may
                        one day move to a server database; nothing
                        plans this.

