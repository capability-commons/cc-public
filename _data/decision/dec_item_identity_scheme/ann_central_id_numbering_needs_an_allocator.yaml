title:                  Allocator needed by central id numbering
brief:                  |
                        A central sequence needs a shared allocator
                        that every partner and every environment must
                        reach, or be given numbers by, before it can
                        create an item. Ids and guids are minted
                        locally today with no such service.
description:            |
                        Authors choose id_self and tooling assigns
                        guid_self
                        (_data/schema/sch_trait_identity.yaml lines
                        69-71). Guids are minted with uuid.uuid4()
                        from the standard library
                        (src/cc_public/edit/edit.py lines 405-410;
                        src/cc_public/commit/message.py line 117).
                        August 2026 decision, in an assistant-written
                        summary, not Will's own words
                        (cc-public-session-context.md line 21): no
                        central number allocation, because CC is
                        federated. ASSUMPTION: the needs of an
                        allocator follow from what a central sequence
                        is; no design for one was written down.

