title:                  Lowercase ids portable as file names
brief:                  |
                        The readable id is lowercase only and names
                        its file, so a repository checks out the same
                        on case-sensitive Linux and case-insensitive
                        macOS file systems.
description:            |
                        Id pattern: _data/schema/sch_primitive.yaml
                        lines 65-67. File named by id_self:
                        sch_trait_identity.yaml lines 71-73. Linux and
                        macOS supported (README.md lines 28-30); Will
                        asked that Windows be documented as not
                        supported (2026-10-14T10:11:55Z,
                        will-messages.md line 513). APFS is
                        case-insensitive by default
                        (https://support.apple.com/guide/disk-utility/file-system-formats-dsku19ed921c/mac).
                        opt_bare_uuid_guid keeps the same readable id,
                        so this does not tell those two apart.

