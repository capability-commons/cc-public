title:                  Guid prefix a copy of the id prefix
brief:                  |
                        Every item and every reference carries the id
                        beside the guid, and the tooling reads the
                        type from the id only, so the guid prefix adds
                        one check and one split rule and tells nothing
                        new.
description:            |
                        prefix_of and has_type match the id only
                        (src/cc_public/graph/derive.lp lines 35-48).
                        References are read as id and guid pairs
                        (src/cc_public/graph/extract.py lines
                        453-456). bad_guid exists only to keep the two
                        prefixes equal (src/cc_public/check/check.lp
                        lines 64-75). Guids are minted as the id
                        prefix plus uuid4().hex
                        (src/cc_public/edit/edit.py lines 405-410).
                        Limit: where a guid travels without its id,
                        its prefix is the only type signal; no such
                        path exists in the tree today.

