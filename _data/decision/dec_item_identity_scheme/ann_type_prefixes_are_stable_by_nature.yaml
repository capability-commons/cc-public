title:                  Type prefixes are stable by nature
brief:                  |
                        Type prefixes are not expected to change very
                        often in a mature system
description:            |
                        Aside from a brief period early on in
                        development, when we are iterating quickly and
                        trying different things, we expect type
                        prefixes to be relatively stable. If they do
                        change in a way that breaks federated peers,
                        then that would require a major version
                        increment in the capability commons standard
                        (or whatever equivalent of major version we
                        put in place).

