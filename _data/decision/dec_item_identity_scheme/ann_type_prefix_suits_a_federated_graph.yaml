title:                  Type prefixes suit a federated graph
brief:                  |
                        Readable ids need no central allocation, which
                        a federation cannot have, and a type prefix on
                        both id and guid lets a type be spotted and
                        grepped, and lets a simple script tell CC
                        guids from foreign UUIDs.
description:            |
                        Decided in the August 2026 Base schema review
                        session. The wording is an assistant-written
                        summary of that session, not Will's own words
                        (note cc-public-session-context.md lines
                        21-23; memory cc-public-design-principles.md
                        lines 14-15). The schema records that a
                        prefixed guid is not a bare UUID
                        (_data/schema/sch_primitive.yaml lines
                        110-115). In the tree from bb8c338
                        (2026-10-09).

