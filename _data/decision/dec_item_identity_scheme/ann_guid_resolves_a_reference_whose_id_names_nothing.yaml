title:                  Guid that resolves a reference whose id names nothing
brief:                  |
                        Since 3d721d6 the checker resolves a reference
                        by its guid when its id names nothing, and
                        reports the id as outdated. Edges are still
                        built from ids, so a colliding id can still
                        resolve a link to the wrong item.

