title:                  Tooling resolution by readable id
brief:                  |
                        The schema says the guid resolves an item, but
                        the tooling resolves every reference and edge
                        by its readable id and only checks the guid.
                        So two mechanisms serve one job, and across a
                        federation a colliding id could resolve a
                        trace link to the wrong item.
description:            |
                        Guid resolves:
                        _data/schema/sch_trait_identity.yaml at
                        description and
                        properties.id_self.description; id_target is a
                        copy not to resolve by: sch_trait_edge.yaml at
                        $defs.edge.properties.id_target.description.
                        Edges are built from ids only
                        (src/cctool/graph/extract.py within extract
                        and documents). dangling_reference and
                        guid_mismatch look up by id
                        (src/cctool/check/check.lp within
                        member_stem). The edit tool indexes by id
                        (src/cctool/edit/edit.py within Tree._index).
                        This is a gap in the build, not in the chosen
                        scheme; it could be fixed by keying edges on
                        the guid.

