title:                  Guid lost when the type prefix changes
brief:                  |
                        A guid holds its type prefix, so a prefix
                        rename or a move to another type cannot keep
                        the guid. The item is removed and minted
                        again, and nothing links the new item to the
                        old one.
description:            |
                        guid_self is immutable
                        (_data/schema/sch_trait_identity.yaml lines
                        107-111). The retyped_guid check forbids the
                        same hex under a new prefix
                        (src/cc_public/commit/change.lp lines
                        103-118), and renames are traced by guid
                        (lines 97-100). Commit 232f001 (2026-10-13)
                        gave term_ guids the con_ prefix. Commit
                        6b551e3 rewrote two guids from dlm_ to dls_
                        (check.dl and derive.dl); commit 6230e98
                        removed the dls_ items and minted lpf_ ones,
                        "since a guid cannot change its prefix". The
                        owner asked for term_ to become con_
                        (2026-10-13T13:10:29Z, will-messages.md line
                        113). The rule is that coarse types never
                        change (memory commit-triples.md line 13;
                        cc-public-design-principles.md line 16).
                        ASSUMPTION: a bare UUID guid would survive the
                        change. No case of one item moved to another
                        type was found.

