title:                  Type prefixes still centrally registered
brief:                  |
                        Ids and guid bodies need no central allocator,
                        but type prefixes do: uniqueness of a prefix
                        rests on one shared type register. This
                        narrows the maintainer's reason to ids and
                        guid bodies.
description:            |
                        A prefix is one to eight letters and is
                        checked for uniqueness only over the local
                        type register (_data/schema/sch_primitive.yaml
                        lines 48, 58-63). The federation coordination
                        point is one public data item type
                        meta-register (cc-public-session-context.md
                        line 25; memory cc-public-design-principles.md
                        line 21). If two partners claim one prefix,
                        the type can no longer be spotted by
                        inspection across them.

