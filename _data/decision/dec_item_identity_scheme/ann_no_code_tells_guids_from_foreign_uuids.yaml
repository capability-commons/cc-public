title:                  No code telling CC guids from foreign UUIDs
brief:                  |
                        No code in the tree reads a foreign UUID or
                        tells one from a CC guid, and the graph is
                        built on readable ids. That use of the prefix
                        is so far an intention, not a working feature.
description:            |
                        The only uses of uuid in src/ mint guids
                        (src/cc_public/edit/edit.py line 410;
                        src/cc_public/commit/message.py line 117). A
                        grep for a 32-hex pattern or "foreign" finds
                        only the guid regex (check.lp line 75,
                        test_check.py line 51). Edges are keyed on ids
                        (extract.py lines 458-462). This is an absence
                        found by search. The prefix is used today by
                        bad_guid, retyped_guid and mention detection.

