title:                  Feedback default sent before the first step
brief:                  |
                        A loop may cross units when one of its
                        crossing edges is a feedback edge. Before
                        local step 0 the sender of that edge puts the
                        edge's default in the queue, so the receiver
                        reads the previous step's value, as it would
                        within one unit. A loop across units with no
                        feedback edge is refused.

