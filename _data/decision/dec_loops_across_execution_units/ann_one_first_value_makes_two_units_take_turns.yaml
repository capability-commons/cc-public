title:                  One first value that makes the two units of a loop take turns
brief:                  |
                        A loop split over two units with one first
                        value cannot run its two halves at once: the
                        controller's step k+1 needs the plant's output
                        of step k, which needs the controller's output
                        of step k, so the units alternate, and each
                        crossing adds its transport time to every
                        turn. Putting a controller and a plant on two
                        cores then gains nothing for the loop itself
                        and costs two crossings a step. The halves
                        overlap only if the loop holds more first
                        values, which delays what each side sees by a
                        step and so changes the control law. The gain
                        is real only for work in either unit that lies
                        off the loop, which placement can spread
                        without splitting the loop.
description:            |
                        Sources:
                        - Where a scheduler runs one tag at a time,
                          pipeline parallelism
                          needs an explicit delay between stages. (Menard et al. 2023,
                          High-performance deterministic concurrency using Lingua Franca,
                          section 4.3)
                        - Pipelining over processing elements puts
                          extra first values on
                          the forward edges between stages. (Lattuada and Ferrandi 2013,
                          Modeling pipelined applications with synchronous dataflow
                          graphs, section IV-B)
                        - First values are part of the state that
                          throughput analysis
                          starts from, and changing their number on a loop changes its
                          throughput. (Stuijk, Geilen and Basten 2006, Exploring
                          trade-offs in buffer requirements and throughput constraints
                          for synchronous dataflow graphs, sections 3 and 4)
                        - Across processing elements, the cost of
                          communication
                          outweighed the parallel gain for light kernels. (Nadezhkin et
                          al. 2009, Realizing FIFO communication when mapping Kahn
                          process networks onto the Cell, section on other experiments)
                        - The review names a controller and a plant on
                          two cores as the
                          obvious multi-core case. (review of 2026-10-29, CC-003)
                        ASSUMPTION: the standard bound of dataflow
                        analysis, that a loop's period is at least the
                        time around it divided by its first values,
                        applies to execution units as it does to
                        actors. Strength: moderate; it holds for the
                        loop's own nodes at any scale, and weakens
                        where each unit carries heavy work off the
                        loop.

