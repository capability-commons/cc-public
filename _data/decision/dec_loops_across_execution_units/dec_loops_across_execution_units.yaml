title:                  Loops across execution units
brief:                  |
                        May a loop of Kahn nodes cross between
                        execution units, and if so how does its first
                        local step start?
description:            |
                        Within one unit a feedback edge carries the
                        previous local step's value, with the default
                        of its port in the first
                        (rqt_executor_feedback_previous,
                        rqt_checks_feedback_default). Across units,
                        each receiver waits for its message. In the
                        trial implementation of 2026-10-29 a
                        controller in one unit and a plant in another,
                        joined by a feedback edge with a default,
                        passed every check and then deadlocked at
                        local step 0, since nothing put the default in
                        the queue (review of 2026-10-29, CC-003). The
                        same graph in one unit ran.

