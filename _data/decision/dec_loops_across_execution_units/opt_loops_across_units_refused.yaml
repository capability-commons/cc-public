title:                  Loops across units refused
brief:                  |
                        A check refuses any loop of Kahn nodes whose
                        edges cross between execution units. A loop
                        runs within one unit, and a controller and a
                        plant that must run on two cores meet through
                        an actor or through edges that form no loop.

