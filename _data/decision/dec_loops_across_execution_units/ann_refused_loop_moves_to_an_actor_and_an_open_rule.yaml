title:                  Refused loop that moves to an actor and an unsettled rule
brief:                  |
                        If loops across units are refused, an author
                        who needs a controller and a plant on two
                        cores must route the loop through an actor.
                        That changes its model, not only its
                        placement: an actor runs in the gap after the
                        static schedule and admits what was waiting
                        when the gap opened, so what the controller
                        sees depends on timing and lags by a gap,
                        where a primed Kahn loop gives the one-unit
                        values exactly. The loop also becomes a mixed
                        loop of Kahn nodes and actors, whose rule for
                        a first value is itself open and whose
                        requirement today exempts it. A choice of
                        placement then spreads into the graph's
                        semantics, its checks and its tests.
description:            |
                        Sources:
                        - A controller and a plant that must run on
                          two cores meet
                          through an actor or through edges that form no loop.
                          (_data/decision/dec_loops_across_execution_units/opt_loops_across_units_refused.yaml
                          at brief)
                        - Actors run in the gaps between steps.
                          (_data/decision/dec_how_actors_are_run/ruling_actors_between_steps.yaml
                          at brief) A gap admits the messages waiting when it opens.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ruling_messages_waiting_when_the_gap_opens.yaml
                          at brief)
                        - The trial passed what an actor wrote in a
                          gap to its Kahn
                          reader in the next local step. (review of 2026-10-29, area
                          report trial-engine, section 3)
                        - Whether a loop of Kahn nodes and actors
                          needs a default is
                          open, and rqt_checks_feedback_default applies only to a loop
                          that holds no actor.
                          (_data/decision/dec_first_value_of_a_loop_of_kahn_nodes_and_actors/dec_first_value_of_a_loop_of_kahn_nodes_and_actors.yaml
                          at description; review of 2026-10-29, CC-054)
                        ASSUMPTION: edges that form no loop cannot
                        close a control loop, so the actor is the only
                        route the option leaves for a loop that must
                        span two cores. Strength: moderate; it bites
                        only for loops that must span cores, and
                        placement can keep most loops in one unit.

