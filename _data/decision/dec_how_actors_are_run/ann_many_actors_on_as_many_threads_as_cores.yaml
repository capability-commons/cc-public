title:                  Many actors on as many threads as cores
brief:                  |
                        A shared pool runs many actors on as many
                        threads as the board has cores, takes more
                        actors without more threads, and uses cores
                        the Kahn steps leave idle, without a
                        configuration change. A thread per actor grows
                        the thread count, with its stacks and context
                        switches, with the number of actors rather
                        than the cores.
description:            |
                        Sources: CAF, "Assigning a dedicated thread to
                        each actor would not scale well"; CAF maps N
                        actors onto M worker threads, a
                        pre-dimensioned set, with work stealing by
                        default
                        (https://actor-framework.readthedocs.io/en/latest/core/Scheduler.html).
                        The pool option runs actors alongside the
                        threads that run Kahn steps
                        (_data/decision/dec_how_actors_are_run/opt_actors_on_a_shared_thread_pool.yaml
                        lines 11-15); the own-thread option blocks
                        each actor on its mailbox
                        (opt_actors_on_their_own_threads.yaml in the
                        same folder, lines 11-14). The Orin Nano has
                        six A78 cores, and the load beside the
                        detector there is unmeasured
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 71-74). ASSUMPTION: each OS thread
                        reserves its own stack. ASSUMPTION: pool
                        threads can take cores the Kahn threads leave
                        idle; the pool option says only that they run
                        alongside them. Strength: strong at ten times
                        the actors; with a handful of actors own
                        threads cost little. The pool still needs OS
                        threads, which is argued separately.

