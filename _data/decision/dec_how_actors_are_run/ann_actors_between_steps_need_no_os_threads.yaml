title:                  Actors run without OS threads on a bare target
brief:                  |
                        Running actors in the gaps between steps needs
                        only the engine's own thread of control, so a
                        mix of Kahn nodes and actors works on a single
                        core with no OS as well as on a multi-core
                        board. A pool or a thread per actor needs
                        threads, which a C++17 freestanding
                        implementation need not provide, so on such a
                        target they rest on an RTOS or a threading
                        library.
description:            |
                        Sources: C++17 freestanding headers include
                        atomic but not thread or mutex, and whether a
                        freestanding program can have more than one
                        thread is implementation-defined
                        (https://en.cppreference.com/w/cpp/freestanding).
                        The owner wants the engine to apply to
                        embedded systems where there may be no OS at
                        all (owner's statement, 2026-10-24); the
                        engine is planned as C++17
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 153-158; context note, owner's statement
                        2026-10-21 in _sources/context.md). Between
                        steps, actors drain their mailboxes on the
                        engine's own threads
                        (_data/decision/dec_how_actors_are_run/opt_actors_between_steps.yaml
                        at title and brief). The placement option for
                        Kahn steps has an execution unit run its nodes
                        in order on one thread of control, which may
                        be a core with no OS
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                        at title and brief). Each actor on its own
                        thread blocks on its mailbox
                        (_data/decision/dec_how_actors_are_run/opt_actors_on_their_own_threads.yaml
                        at title and brief). ASSUMPTION: the engine's
                        own threads can be one thread on a
                        single-threaded target. Strength: strong
                        against a thread per actor, whose thread count
                        grows with the actors; moderate against the
                        pool.

