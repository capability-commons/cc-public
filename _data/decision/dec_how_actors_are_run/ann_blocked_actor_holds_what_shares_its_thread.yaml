title:                  Blocked or flooded actor holding up what shares its thread
brief:                  |
                        An actor that blocks on outside I/O, runs
                        long, or is flooded with messages on purpose
                        holds whatever shares its thread. Between
                        steps it holds up the next Kahn step, on a
                        shared pool it holds workers and can starve
                        other actors, and on its own thread it holds
                        up only itself. The first two each need a
                        bound, such as messages or time per actor per
                        gap, or a share of the pool; a bounded
                        crossing between Kahn networks and actors, a
                        matter for that decision, reduces what a flood
                        can do.
description:            |
                        Sources: between steps, actors run on the
                        engine's threads in the gaps between Kahn
                        steps, each draining its messages
                        (_data/decision/dec_how_actors_are_run/opt_actors_between_steps.yaml
                        lines 11-16); in the pool, actors run
                        alongside the threads that run the Kahn steps
                        (opt_actors_on_a_shared_thread_pool.yaml in
                        the same folder, lines 11-15); each actor on
                        its own thread blocks on its mailbox
                        (opt_actors_on_their_own_threads.yaml, lines
                        11-14). CAF cannot interrupt running actors;
                        actors that make blocking calls can cause
                        imbalance or starvation and "can be explicitly
                        detached" to a thread of their own
                        (https://actor-framework.readthedocs.io/en/latest/core/Scheduler.html).
                        Patrol's commands come from outside systems
                        through a FastAPI node
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 88-92), though the drafts route outside
                        traffic through gateway nodes
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 184-188), which would keep blocking out
                        of functional actors. Temporal partitioning
                        ensures one component cannot affect others'
                        use of shared resources, by static
                        table-driven scheduling
                        (https://arxiv.org/pdf/1508.07066, sections
                        2.2 and 3.3.2). Deliberately caused failures
                        belong to security
                        (_data/register/reg_concern.yaml line 130).
                        ASSUMPTION: threads of one process share
                        memory, so own threads isolate time, not
                        memory. Strength: moderate; it grows with the
                        number of actors, since more actors give more
                        chances that one blocks. The cost of a thread
                        per actor at scale is argued separately.

