title:                  Step boundary as the one point of synchronization
brief:                  |
                        Running actors between steps uses the boundary
                        that rewires and change sets already use, and
                        gives a replayable order with no record of
                        thread interleaving. A shared pool or a thread
                        per actor adds a second scheduler beside the
                        step.
description:            |
                        Sources: actors drain their waiting messages
                        in the gaps between Kahn steps
                        (_data/decision/dec_how_actors_are_run/opt_actors_between_steps.yaml
                        at title and brief). Rewires happen only
                        between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). A change set applies at the
                        start of a step for Kahn parts and between
                        messages for actors
                        (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml
                        at title and brief). CAF maps N actors to M
                        threads by work stealing and offers a detached
                        spawn option for blocking actors, two
                        mechanisms in one framework
                        (https://actor-framework.readthedocs.io/en/latest/core/Scheduler.html).
                        Strength: strong for the count of mechanisms;
                        it says nothing on actor latency between
                        steps. Simplicity is a non-driver of the
                        engine; kept as a strong point.

