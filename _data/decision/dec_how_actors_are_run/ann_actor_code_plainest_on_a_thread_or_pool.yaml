title:                  Plain actor code on a thread of its own or a pool
brief:                  |
                        An actor on its own thread blocking on its
                        mailbox is the plainest code to read, and a
                        shared pool is what mature actor frameworks
                        use by default. Both trade that readability
                        for timing that tests cannot pin down, which
                        weighs more as actors grow.
description:            |
                        Sources: each actor runs on a thread of its
                        own and blocks on its mailbox
                        (_data/decision/dec_how_actors_are_run/opt_actors_on_their_own_threads.yaml
                        lines 11-14). CAF's default policy is work
                        stealing over a pre-dimensioned set of worker
                        threads, and blocking actors can be detached
                        (https://actor-framework.readthedocs.io/en/latest/core/Scheduler.html).
                        ASSUMPTION: under the between-steps option the
                        engine provides the mailbox drain and
                        ordering, so actor code there is a message
                        handler and not harder to read than under the
                        pool. Strength: weak; readability of one actor
                        does not grow with scale, while the testing
                        cost does.

