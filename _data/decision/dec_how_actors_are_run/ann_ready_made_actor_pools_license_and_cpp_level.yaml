title:                  License and language level of ready-made actor pools
brief:                  |
                        A shared pool is likely to be taken from a
                        library. oneTBB (Apache-2.0) and CAF
                        (BSD-3-Clause) fit the license, while Taskflow
                        (MIT, header-only) now needs C++20, beyond the
                        engine's C++17 headers. This is a cost to
                        count, not a bar.
description:            |
                        Sources: oneTBB is Apache-2.0 and governed by
                        the UXL Foundation
                        (https://github.com/uxlfoundation/oneTBB). CAF
                        is BSD-3-Clause, needs CMake, and OpenSSL for
                        its openssl and net modules
                        (https://github.com/actor-framework/actor-framework).
                        Taskflow is MIT and header-only, and v4.0.0
                        needs a C++20 compiler
                        (https://github.com/taskflow/taskflow). Only
                        the engine's headers need to compile as C++17
                        (_sources/cc-patrol-notes/plan.md lines
                        95-98). cc-public is Apache-2.0
                        (_data/decision/dec_license/ruling_license.yaml).
                        ASSUMPTION: a pool written in house on
                        std::thread avoids the library but still needs
                        hosted threads. Strength: weak; permissive
                        options kept by organizations exist.

