title:                  How a python class or function becomes an item
brief:                  |
                        A class, function, method or generator holds
                        its item in its own docstring, or the
                        equivalent in another language, and has one
                        only when something must point at it.
                        Otherwise it has none. Ruled by WTP, who
                        agreed with the recommended option
                        (2026-10-19).

