title:                  Overlap kept by the admitted term
brief:                  |
                        Admitting "question" as a second term for the
                        concept of the question type keeps part of the
                        overlap that the name "issue" avoids, since
                        "question" also names a concern field and an
                        older sense.
description:            |
                        Sources: _data/register/reg_concept.yaml at
                        entries.concept_decision.note, and see
                        ann_question_is_already_a_concern_field and
                        ann_question_once_named_an_unsettled_item. The
                        cost falls on prose, not identifiers.
                        ASSUMPTION: no check enforces which term prose
                        uses. None was found in check.lp, though not
                        every rule was searched.

