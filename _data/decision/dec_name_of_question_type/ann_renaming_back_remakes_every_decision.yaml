title:                  Cost of renaming the question type back
brief:                  |
                        The tree already names the question type
                        "decision", so only opt_call_it_decision asks
                        for no change. Calling it "issue" or
                        "question" now remakes all 92 decision items
                        under new guids, rewrites the edges in about
                        1300 files that point at them, and makes a
                        change too large for a person to read in one
                        sitting.
description:            |
                        The question type has the prefix "dec" and the
                        concept concept_decision has the preferred
                        term "decision", the admitted term "question"
                        and the deprecated term "issue"
                        (_data/register/reg_data_item_type.yaml lines
                        929-954; _data/register/reg_concept.yaml lines
                        670-676). The snapshot holds 92 decision
                        folders under _data/decision/, one dec_ item
                        each, with 1442 files in them (count of the
                        snapshot tree). A guid keeps its type, so a
                        guid cannot be given another prefix; to change
                        the type of an item, the item is removed and a
                        new one is made (retyped_guid in
                        src/cctool/commit/change.lp lines 120-155).
                        Each removed item must be named in the commit
                        item (unannounced_removal,
                        src/cctool/commit/change.lp lines 161-191).
                        1299 of the 1660 files in the snapshot hold an
                        edge whose guid_target is a dec_ guid, and
                        1403 hold a dec_ id token (count of the
                        snapshot tree). 15 files under src/ name
                        type_decision, decision_of, _data/decision or
                        DIR_DECISION, including the placement rule in
                        src/cctool/check/check.lp line 594 and the
                        derived predicate in
                        src/cctool/graph/derive.lp lines 129-146
                        (count of the snapshot tree). A test fixture
                        relies on "issue" being a deprecated term of
                        concept_decision
                        (src/cctool/check/_test/test_friction.py lines
                        40-47), so opt_call_it_issue also breaks that
                        test. The project asks that each change be
                        small enough to read in one sitting, since the
                        previous iteration grew faster than it could
                        be reviewed (AGENTS.md lines 234-238). Content
                        is almost entirely generated and only reviewed
                        by people (maintainer's statement, 2026-10-18,
                        as cited in
                        ann_old_prose_reads_inverted_after_a_swap).
                        ann_size_of_each_rename measured the same kind
                        of cost before the swap and then favored
                        keeping "issue"; the swap has since been
                        applied, with a phased rename and a squash of
                        history
                        (ruling_names_of_decision_and_option_types),
                        so the cost now falls on opt_call_it_issue and
                        opt_call_it_question instead. ASSUMPTION: a
                        rename back would follow the same
                        remove-and-remake path as the swap, since no
                        tool was found that retypes a guid.
                        ASSUMPTION: a rename back would not be
                        squashed out of review. If it were, no diff of
                        it is read and the reviewability part of this
                        point weakens. ASSUMPTION: prose that now says
                        "decision" for the question would also need
                        rewriting under opt_call_it_issue or
                        opt_call_it_question, and no check can find
                        it, so a person must read that rewrite in
                        full. Holds at ten times the size: yes,
                        because the number of items, edges and files a
                        rename touches grows with the graph, while
                        opt_call_it_decision touches none at any size.

