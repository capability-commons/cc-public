title:                  The word "question" as the Compendium node name
brief:                  |
                        Compendium, an IBIS tool, names this node
                        "question", so a partner using it would match
                        a question type named "question". The point is
                        weak while no partner format is exchanged.
description:            |
                        Source:
                        https://en.wikipedia.org/wiki/Compendium_(software),
                        which lists "question" among its ten default
                        node types and also speaks of
                        "issues/questions". The admitted term
                        "question" on con_decision
                        (_data/register/reg_concept.yaml lines
                        570-573) closes most of the gap. ASSUMPTION:
                        the repository has no exporter or importer for
                        any IBIS tool format, based on a search for
                        "ibis", "compendium" and "QOC".

