title:                  Name collision with forge issue trackers
brief:                  |
                        On a code forge, the word "issue" would name
                        both a tracker ticket and an item of the
                        question type, and agents holding forge tools
                        could confuse them. "Question" would not
                        collide.
description:            |
                        Sources: GitHub and GitLab call tracker items
                        "issues" (https://docs.github.com/en/issues
                        and
                        https://docs.gitlab.com/user/project/issues/).
                        Deliberations live in one folder per question
                        item, now _data/decision/<decision id>/
                        (commit 1ba2895). The repository today has no
                        forge remote, and origin is a local git
                        bundle. ASSUMPTION: the project may later be
                        hosted on a forge with its tracker enabled.
                        The owner's statement of 2026-10-14T22:59:35Z
                        argues against this.

