title:                  Old sense of "question" gone from the style rule
brief:                  |
                        Commit 3815ad9 "Fix style_write_for_the_reader
                        so that its example names a real type"
                        rewrites the example pair to speak of an item
                        of the question type, then named "issue". At
                        360ec14 the older sense of "question" survives
                        only in history, not in the tree.
description:            |
                        At 360ec14 the follows and breaks of
                        style_write_for_the_reader said "An issue
                        records one question that the design leaves
                        open"
                        (_data/register/reg_writing_style_rule.yaml
                        lines 404-414 at 360ec14), with "issue" as the
                        name then given to the question type. At
                        89c74d8 they spoke of a question data item
                        that a design decision, an item of the
                        candidate type, leaves unsettled. The point
                        that the word "question" had another meaning
                        in the history still holds, with less weight.

