title:                  The word "issue" as the IBIS node name
brief:                  |
                        "Issue" is the node name in the IBIS model
                        that concept_decision follows, so an
                        IBIS-shaped partner would map a question type
                        named "issue" one to one by name.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        554-562 (added in 52e3e6d), citing Kunz and
                        Rittel, Issues as elements of information
                        systems, Working Paper 131, 1970. The mapping
                        is per type, so its cost does not grow with
                        the graph.

