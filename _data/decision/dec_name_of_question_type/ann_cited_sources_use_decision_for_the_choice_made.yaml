title:                  The word "decision" for the choice made in decision-record sources
brief:                  |
                        MADR defines an architectural decision as a
                        design choice, and the van Heesch 2011
                        template gives the name "Decision" to the
                        outcome and puts the question under
                        "Problem/issue". Both also use the word for
                        the whole matter, but calling the question
                        type "decision" keeps the choice-made sense
                        beside it, where a ruling records the choice
                        here, while "issue" or "question" names only
                        the question.
description:            |
                        concept_decision defines a decision as a
                        question to be settled, and a ruling records
                        its outcome (_data/register/reg_concept.yaml
                        lines 618-648). concept_ruling is the act of
                        settling that an option holds or does not hold
                        (_data/register/reg_concept.yaml lines
                        570-575). The note of concept_decision cites
                        ISO/IEC/IEEE 42010:2022 and says MADR and
                        ISO/IEC/IEEE 15288 use "decision" for the
                        question being settled
                        (_data/register/reg_concept.yaml lines
                        633-648). MADR defines an architectural
                        decision as "a software design choice that
                        addresses a functional or non-functional
                        requirement that is architecturally
                        significant" (https://adr.github.io/madr/).
                        MADR titles each record "representative of
                        solved problem and found solution", and its
                        Decision Outcome section holds the chosen
                        option (https://adr.github.io/madr/). MADR
                        also uses "decision" for the matter that has
                        options: its template lists "Considered
                        Options" and "Decision Drivers" for a
                        decision, names the "decision-makers" involved
                        "in the decision", and speaks of "the decision
                        outcome" (https://adr.github.io/madr/). van
                        Heesch, Avgeriou and Hilliard, A documentation
                        framework for architecture decisions, Journal
                        of Systems and Software, 2011, say the concept
                        of architecture decisions has been
                        incorporated into ISO/IEC/IEEE 42010
                        (https://www.mit.edu/~richh/writings/doc-framework-decisions.pdf,
                        section 1). Their decision template defines
                        the element "Decision" as "the outcome of the
                        decision", and puts the question in a separate
                        element "Problem/issue", described as "the
                        issue addressed by the decision" (same URL,
                        section 3.1). The same template gives each
                        decision a current state and a history of
                        "when the decision was proposed, decided,
                        approved and so on", so the paper also uses
                        "decision" for the record before its outcome
                        (same URL, section 3.1). Wikipedia says each
                        architectural decision "describes a concrete,
                        architecturally significant design issue" for
                        which several options exist, and "captures the
                        result of a conscious, often collaborative
                        option selection process"
                        (https://en.wikipedia.org/wiki/Architectural_decision).
                        QOC names the question type Questions
                        (MacLean, Young, Bellotti and Moran, 1991, as
                        cited in
                        ann_option_and_decision_match_methods), and
                        IBIS names it an issue (Kunz and Rittel, 1970,
                        as cited in concept_decision). So the register
                        note is half right about MADR: MADR uses
                        "decision" both for the choice made and for
                        the matter with options, not for the open
                        question alone. ASSUMPTION: the text of
                        ISO/IEC/IEEE 42010:2022 itself was not read,
                        since it is not freely available; its sense is
                        taken from the secondary sources above. Holds
                        at ten times the size: yes, because the sense
                        clash is per term, not per item, and every new
                        decision item and every reader who knows MADR
                        or 42010 meets it again.

