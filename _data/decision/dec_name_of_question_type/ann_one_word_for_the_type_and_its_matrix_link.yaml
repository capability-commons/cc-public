title:                  One word for the type and the matrix it opens to
brief:                  |
                        Under opt_call_it_decision, a reviewer meets
                        one word for the question item everywhere:
                        list, page address, search box, CLI flag and
                        the "Decision matrix" link it opens to. Under
                        the other two options the matrix link keeps
                        the word "decision" while the item is called
                        something else, so the reviewer must learn
                        that two words name one thing.
description:            |
                        The review interface lists these items under
                        the heading "Decisions" at /decisions and
                        shows each at /decision/<id>
                        (src/cctool/web/page.py within PATH_DECISIONS,
                        PATH_DECISION and decisions). The search box
                        on that list reads "Words from a decision or
                        its options" (src/cctool/web/page.py within
                        _decision_controls). Each entry in the list
                        ends in a link labeled "Decision matrix"
                        (src/cctool/web/page.py within
                        _decision_options.entry), and the page of the
                        item opens with its decision matrix
                        (src/cctool/web/page.py). The command line
                        filters these items with the flag --decision
                        (src/cctool/cli/querying.py within text).
                        ASSUMPTION: "Decision matrix" is the
                        established name of that table in decision
                        methods, not a name derived from the type, so
                        renaming the type would not rename it.
                        ruling_names_of_decision_and_option_types says
                        the swap was made so that "the decision matrix
                        uses the established terms", but no source in
                        the snapshot shows the name itself is fixed
                        outside the project. The matrix label prompted
                        the maintainer to ask for the earlier swap
                        (_data/decision/dec_names_of_decision_and_option_types/dec_names_of_decision_and_option_types.yaml
                        description). The open layout of the list is
                        labeled "Questions and answers"
                        (src/cctool/web/page.py within
                        MAP_LAYOUT_NAME), so the admitted term
                        "question" stays usable under
                        opt_call_it_decision. ASSUMPTION: a reviewer
                        who sees two words for one item spends time
                        checking whether they name two things. No task
                        timing exists to measure this. Holds at ten
                        times the size: yes, because the labels are
                        per type, not per item, and every item page
                        repeats them.

