title:                  Type name as the only label on exported items
brief:                  |
                        The Obsidian and Open Knowledge Format exports
                        label each item of the question type only by
                        its type name, in folder, tag, type, path and
                        guid prefix. The admitted term "question"
                        reaches a reader of an export only as a field
                        on the page of concept_decision. Any rename
                        away from "decision" moves every exported page
                        and guid of the type.
description:            |
                        The tool exports the graph as an Obsidian
                        vault and as an Open Knowledge Format 0.2
                        bundle (src/cctool/cli/exporting.py;
                        src/cctool/export/okf.py). The Obsidian export
                        writes the type id as the type and the type id
                        without "type_" as the tag of each note
                        (src/cctool/export/obsidian.py within pages).
                        The Open Knowledge Format export writes the
                        type title without " type" as the type of each
                        concept (src/cctool/export/okf.py within
                        pages; src/cctool/graph/item.py within
                        type_name). Both exports put each page at
                        <type id without "type_">/<item id>.md
                        (src/cctool/export/obsidian.py within path;
                        src/cctool/export/okf.py within path;
                        src/cctool/graph/item.py within folder). The
                        frontmatter of every page carries the guid of
                        its item (src/cctool/export/page.py within
                        properties). A guid keeps its type prefix, so
                        a change of type prefix gives an item a new
                        guid (src/cctool/commit/change.lp within
                        retyped_guid). The admitted terms of a concept
                        are fields of the concept entry, not of the
                        type or its items
                        (_data/register/reg_concept.yaml at
                        entries.concept_ruling;
                        _data/register/reg_data_item_type.yaml at
                        entries.type_decision). Every node with an
                        id_self is an item
                        (src/cctool/graph/extract.py within _walk), so
                        both exports also write a page for
                        concept_decision, and its short list fields,
                        term_admitted among them, go in the
                        frontmatter of that page
                        (src/cctool/export/page.py within properties
                        and is_prose). The tree today names the type
                        "decision", with prefix dec, and folder
                        _data/decision/ holds 92 decision folders
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_decision; count of
                        _data/decision/dec_* in the snapshot). These
                        facts weaken the mitigation by the admitted
                        term in ann_compendium_names_the_node_question
                        and ann_admitted_term_keeps_the_plain_word for
                        a partner who reads the item pages of an
                        export, though not for one who opens the page
                        of concept_decision. They also contradict the
                        statement in
                        ann_partners_still_read_own_yaml_schemas that
                        the repository has no export, on which
                        ann_option_and_decision_match_methods rests
                        its "weak while nothing exports" caveat.
                        ASSUMPTION: no partner yet holds an export, so
                        no link into one breaks today. Holds at ten
                        times the size: yes, because every item of the
                        type appears in every export by path and guid,
                        so the number of exported names a rename moves
                        grows with the graph, while the label a
                        partner sees stays one name per type.

