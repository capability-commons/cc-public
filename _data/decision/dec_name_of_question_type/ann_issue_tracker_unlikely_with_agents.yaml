title:                  Issue tracker unlikely in an agent-driven project
brief:                  |
                        The project is driven mainly by agents, so an
                        issue tracker that would clash with "issue" as
                        the name of the question type is unlikely to
                        appear. The maintainer gave this as his
                        reason.
description:            |
                        Maintainer's statement, 2026-10-14
                        (will-messages.md line 753). The question type
                        was named "issue" in commit 52e3e6d.

