title:                  Question kept as an admitted term
brief:                  |
                        The chosen alternative keeps "question" as an
                        admitted term and defines an issue as a
                        question, so a reader or partner who thinks
                        "question" still finds the concept.
description:            |
                        Sources: con_decision term_preferred issue and
                        term_admitted question
                        (_data/register/reg_concept.yaml lines 544-546
                        and 570-573); ISO 1087:2019 treats an admitted
                        term as an acceptable synonym
                        (_data/schema/sch_regentry_concept.yaml lines
                        34-44). Weak against growth: ids and folders
                        show only "issue".

