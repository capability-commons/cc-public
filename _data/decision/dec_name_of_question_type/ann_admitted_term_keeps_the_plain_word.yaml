title:                  The word "question" kept as an admitted term
brief:                  |
                        This option keeps "question" as an admitted
                        term and defines the question type, named
                        "issue", as a question, so a reader or partner
                        who thinks "question" still finds the concept.
description:            |
                        Sources: the question concept, now
                        concept_decision, had term_preferred "issue"
                        and term_admitted "question"
                        (_data/register/reg_concept.yaml at
                        entries.concept_logic_program_file.description
                        and entries.concept_file at the time). ISO
                        1087:2019 treats an admitted term as an
                        acceptable synonym
                        (_data/schema/sch_regentry_concept.yaml at
                        note). Weak against growth, since ids and
                        folders then showed only "issue".

