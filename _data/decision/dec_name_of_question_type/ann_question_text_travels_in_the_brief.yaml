title:                  Question text in the brief of every question item
brief:                  |
                        Every item of the question type states its
                        question in its brief, so a reviewer sees the
                        real question whichever name the type has. The
                        name alters only the type label and the id
                        prefix.
description:            |
                        Sources: _data/schema/sch_decision.yaml at
                        description. The brief of
                        _data/decision/dec_tooling_language/dec_tooling_language.yaml
                        is a question ending in "?". This limits the
                        weight of the naming arguments for both
                        options.

