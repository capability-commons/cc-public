title:                  Earlier unsettled-item sense of the word "question"
brief:                  |
                        The project once had a type named "question"
                        for one thing that an option, then called a
                        decision, leaves unsettled. That is a
                        different role. Reusing the word would give it
                        two meanings across the history.
description:            |
                        Sources: a type named "question", prefix
                        "qst", defined as "one thing that a design
                        decision leaves unsettled", where a design
                        decision was an item of the candidate type. It
                        was answered by an edge of the relation now
                        named r_is_option_for. Commit 232f001, under
                        tag pre_squash_20261014, removed it. The sense
                        then survived in
                        _data/register/reg_writing_style_rule.yaml
                        lines 405-415.

