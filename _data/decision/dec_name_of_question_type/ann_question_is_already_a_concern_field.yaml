title:                  The word "question" as an existing concern field
brief:                  |
                        Every concern entry has a required field named
                        "question", so a type of the same name would
                        give one word two meanings in one
                        deliberation, in diffs and in searches.
description:            |
                        Sources:
                        _data/schema/sch_regentry_concern.yaml lines
                        38-48. The field is filled in every concern
                        entry (_data/register/reg_concern.yaml lines
                        69, 107, 146 and others). Tests set it by name
                        (src/cc_public/cli/_test/test_editing.py lines
                        60-61 and
                        src/cc_public/edit/_test/test_edit.py lines
                        63, 129, 402-404). At the time the word
                        "issue" had no other meaning in the tree. It
                        named only the question type, its prefix
                        "iss", its schema, its folder, a test constant
                        and a derived predicate, which are now
                        type_decision, sch_decision, _data/decision/,
                        DIR_DECISION and decision_of. The overlap
                        grows with each new concern.

