title:                  Noun phrase titles against git's drafts
brief:                  |
                        Git drafts imperative subjects for merges and
                        reverts, so noun phrase titles would need
                        their own exception or a rewrite of every such
                        draft. The chosen form needs only the one
                        exception for the commit type.
description:            |
                        sch_trait_descriptive lines 39-40; sch_commit
                        lines 77-79; reg_writing_style_rule lines
                        421-441. message.py keep git's words, and
                        lines 158-160 add the into clause git leaves
                        out, an extra step the templates cost.
                        ASSUMPTION (reliability advocate): noun phrase
                        titles would refuse all of git's merge, revert
                        and squash drafts unless rewritten or
                        exempted.

