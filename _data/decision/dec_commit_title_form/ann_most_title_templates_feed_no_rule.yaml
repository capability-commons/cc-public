title:                  Templates with no check behind them
brief:                  |
                        Only Add, Remove, Rename, Move and Reformat
                        feed a check on the change. Split, Fold,
                        Change, Fix and Lock feed none, yet Change and
                        Fix carry 14 of the 33 commits on main, so
                        much of the closed list is a second vocabulary
                        kept for regularity alone.
description:            |
                        change.lp, whole file, by search for the
                        commit verb: lines 164-165, 176-183 and 220
                        only; Revert and Reapply only waive the alias
                        rule. git log --format=%s on main at 89c74d8:
                        Add 18, Change 10, Fix 4, Split 1. sch_commit
                        lines 80-82 say "most of them" can later be
                        checked, so this falls if checks for the other
                        verbs are written. Simplicity, reviewability
                        and traceability advocates, 2026-10-15.

