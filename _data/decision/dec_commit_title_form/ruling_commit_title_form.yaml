title:                  Imperative titles from a closed list of templates
brief:                  |
                        A commit title is one imperative sentence from
                        a closed list of templates, as git convention
                        has it, so the log stays regular and five
                        verbs are checked against the change. Noun
                        phrase titles would clash with the subjects
                        git drafts for merges and reverts. A free
                        imperative would give the commit check no verb
                        it can test. Ruled by William Payne on
                        2026-10-23.

