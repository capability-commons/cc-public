title:                  No relation domain left to admit a commit
brief:                  |
                        ann_commit_reason_held_in_brief_not_title says
                        no relation has type_commit in its domain.
                        Relations have no domain now. type_commit
                        plays no role, so no relation that constrains
                        its source admits a commit, and none links a
                        commit to a decision, option or ruling.
description:            |
                        reg_relation.yaml entries carry
                        relation_constrains_source edges to relcon_
                        entries instead of a domain. type_commit
                        (reg_data_item_type.yaml line 794) has no
                        relation_has_items_that_play edge.
                        relation_is_about needs a source that plays
                        rol_can_be_about_an_item, and
                        relation_supports and relation_challenges need
                        rol_argument. relation_cites and
                        relation_uses_concept leave their source open,
                        but they reach only external documents and
                        concepts. So the point that no commit can link
                        by an edge to what called for it still holds.
                        Found in the review of 2026-10-22.

