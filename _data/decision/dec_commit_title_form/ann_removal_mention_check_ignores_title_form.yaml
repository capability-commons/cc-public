title:                  Removal trace independent of title form
brief:                  |
                        The checks that keep a removed or renamed item
                        traceable read ids named anywhere in the
                        title, brief or description, so they work the
                        same under every title form and owe nothing to
                        the templates.
description:            |
                        change.py lines 117 and 121-122 build mentions
                        from title, brief and description. change.lp
                        lines 129-131 and 142 report an unannounced
                        removal or rename without reading the verb.
                        AGENTS.md lines 30-31.

