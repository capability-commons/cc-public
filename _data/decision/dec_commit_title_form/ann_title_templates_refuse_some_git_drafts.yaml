title:                  Git drafts outside the closed list
brief:                  |
                        The title pattern copies the words git drafts
                        for merges and reverts, so it refuses other
                        drafts git writes on ordinary repair paths,
                        and each new git path has needed a follow-up
                        change.
description:            |
                        Pattern at sch_commit line 50. In a local test
                        with git 2.43.0 on 2026-10-15 (reliability
                        advocate), merge --squash drafts "Squashed
                        commit of the following:" and commit --fixup
                        drafts "fixup! TITLE"; neither matches. Merge
                        and Revert were added in e25acf9 and Reapply
                        in 4e6db4c; the brief of 4e6db4c says the
                        commit-msg hook had refused git's merge and
                        revert drafts. The project accepts that squash
                        drafts are not converted (memory
                        enforcement-approach.md). In that test git
                        revert ran prepare-commit-msg but not
                        commit-msg, so a bad revert draft is found
                        only at pre-push. ASSUMPTION: a check of
                        imperative mood under free imperatives would
                        still refuse the squash and fixup drafts.

