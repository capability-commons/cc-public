title:                  One verb in place of commit fields
brief:                  |
                        The verb in the title does the job that
                        separate fields for removes and renames would
                        otherwise do, and the title is checked by the
                        same schema check as every item, so the change
                        check needs no new commit fields and no
                        separate linter.
description:            |
                        sch_commit has no fields beyond the three
                        shared traits (lines 18-21). The title pattern
                        is checked through the JSON Schema check
                        (sch_commit line 50; message.py). Memory note
                        commit-triples.md plans such fields only when
                        a real commit needs them. Weakens if the
                        checks later need per-item declarations a verb
                        cannot carry.

