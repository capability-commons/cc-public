title:                  Convention kept, titles made regular
brief:                  |
                        The maintainer follows conventions unless
                        there is a good reason to break them, and
                        wants a restricted language so that commit
                        titles are extremely regular and commits may
                        become finer.
description:            |
                        Maintainer's statements, 2026-10-14.
                        "Generally as a matter of principle I like to
                        follow conventions except where I have a good
                        reason for breaking them", then a restricted
                        natural language approach so that "the commit
                        titles become EXTREMELY regular". "It might be
                        a good thing if it forces more fine-grained
                        commits. Please proceed." This followed his
                        question about the reason for the imperative
                        convention and whether breaking it would hurt
                        adoption. The reason for Fold over Merge, "so
                        that Merge keeps the meaning git gives it", is
                        in e25acf9 and sch_commit lines 72-74; it was
                        written by an assistant, not by Will.
                        ASSUMPTION: regular titles and finer commits
                        speak for reviewability; Will did not name a
                        concern.

