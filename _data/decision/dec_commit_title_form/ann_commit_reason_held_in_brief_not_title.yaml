title:                  Reason of a commit outside its title
brief:                  |
                        Only Change and Fix put a reason in the title,
                        and that clause is not checked. The reason for
                        every commit sits in its brief under any title
                        form, and no commit links by an edge to what
                        called for it, so title form adds little to
                        tracing a change to its reason.
description:            |
                        sch_commit lines 24 and 56-60. change.lp has
                        no rule on the "so that" clause. No commit
                        item up to 89c74d8 has an edge (git log
                        --format=%B), including 89c74d8, which names
                        the chosen option in prose only. Relations no
                        longer have a domain. type_commit has no
                        relation_has_items_that_play edge
                        (_data/register/reg_data_item_type.yaml lines
                        804-839). relation_is_about, relation_supports
                        and relation_challenges admit only a source
                        that plays rol_can_be_about_an_item or
                        rol_argument
                        (_data/register/reg_relation_constraint.yaml
                        lines 107-123, 149-165). relation_cites and
                        relation_uses_concept leave the source open
                        but reach only external documents and
                        concepts. So no commit can yet link by an edge
                        to what called for it.

