title:                  No testable verb in open titles
brief:                  |
                        A noun phrase has no verb, and a free
                        imperative has an open one, so neither gives
                        the change check a verb it can test without a
                        parser or a list of its own.
description:            |
                        Reviewability, simplicity and traceability
                        advocates, 2026-10-15, from change.py line 120
                        and change.lp lines 176-183. ASSUMPTION (from
                        the reliability advocate): a rule keyed on an
                        open verb would need a parser or a list
                        anyway.

