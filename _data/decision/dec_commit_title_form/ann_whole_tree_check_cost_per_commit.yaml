title:                  Whole-tree check cost per commit
brief:                  |
                        Each commit check parses every file of the
                        tree before and after the commit, so it costs
                        about the same for a 4-line commit as for a
                        48-file one. If one verb per commit makes
                        commits finer, the total time the hooks spend
                        grows with the number of commits.
description:            |
                        change.py lines 115-116 extract both whole
                        graphs; _changed and _laid_out (lines 129-161)
                        lay out every file of both trees. history.py
                        lines 112-114 copy both trees and line 121
                        runs check_trees once per commit. The
                        commit-msg hook runs cctool message check,
                        which runs change.check (cli/messaging.py line
                        102); the pre-push hook runs cctool history
                        check on each new commit. Timings by the
                        performance efficiency advocate, 2026-10-15:
                        586a0e5 (1 file, 2 lines replaced, 88-file
                        tree) 2.94 s and 3.89 s; 1ba2895 (48 files,
                        129-file tree) 4.21 s; 89c74d8 (5 files,
                        129-file tree) 3.92 s. The verifier
                        re-measured in a scratch clone, two runs each:
                        2.61 and 3.63 s, 4.70 and 3.74 s, 3.77 and
                        3.69 s. Under cProfile most time is YAML
                        parsing (verifier: ruamel load 12.0 s of 20.9
                        s). The commit-msg hook checks the staged tree
                        against HEAD (change.py lines 66-74), not
                        history.check, but does the same whole-tree
                        work. Bears on the chosen option only through
                        the finer commits the owner hoped for (W
                        2026-10-14T11:18:34Z), which have not yet come
                        (see
                        ann_change_template_took_a_48_file_commit).
                        Falls if the check reads only changed files, a
                        change to change.py, not to the title form.
                        ASSUMPTION: check time grows with the number
                        of files in the tree; the two tree sizes
                        measured are too close to confirm it.

