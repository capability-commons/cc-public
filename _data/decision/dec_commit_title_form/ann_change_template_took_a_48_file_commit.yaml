title:                  Large commits under the Change template
brief:                  |
                        The Change template accepts any scope, and
                        apart from the squash root the largest commits
                        since the templates are Change commits of 28
                        and 48 files. The templates have not forced
                        those changes into finer commits.
description:            |
                        6230e98 "Change the cross-item checks so that
                        clingo evaluates them": 28 files, 1199
                        insertions, 1110 deletions. 1ba2895 "Change
                        the arguments so that each is kept in the
                        folder of its decision": 48 files, and by its
                        description several distinct acts. Sizes since
                        the templates, leaving out the squash root
                        7dda99e (78 files), range from 4 changed lines
                        (586a0e5) to 2309 (6230e98). git show
                        --shortstat. This bears on the maintainer's
                        hope of finer commits, not on the convention
                        reason.

