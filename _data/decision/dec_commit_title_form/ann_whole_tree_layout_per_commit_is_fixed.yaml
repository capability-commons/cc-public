title:                  Commit check layout now limited to changed files
brief:                  |
                        Commit 5acf7c2 "Change the commit check so
                        that it lays out only files that differ"
                        removes the layout of unchanged files from
                        each commit check. At 360ec14 only the parse
                        of both whole trees still costs the same for a
                        small commit as for a large one.
description:            |
                        src/cc_public/commit/change.py lines 129-146
                        at 360ec14 lay out only files whose bytes
                        differ; lines 115-116 still extract both whole
                        trees, the YAML parsing that the verifier's
                        profile found to take most of the time. Not
                        re-measured at 360ec14.

