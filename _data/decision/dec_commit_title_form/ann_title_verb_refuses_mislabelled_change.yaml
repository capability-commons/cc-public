title:                  Verb checks against the change
brief:                  |
                        Because the verb comes from a closed list, the
                        commit check can refuse a commit whose change
                        contradicts its verb, such as an Add that
                        removes an item or a Reformat that changes
                        content. Reader and record can trust the kind
                        of change before reading the diff.
description:            |
                        change.py takes the first word of the title as
                        the commit verb. change.lp within
                        rename_without_alias and forbidden_change
                        forbid, per verb, kinds of change (Add may not
                        remove or rename, Remove may not add or
                        rename, Rename and Move may not add or
                        remove), and lines 207-221 report a
                        contradicted verb and a Reformat that changes
                        content. Check added in 7520f91. cctool
                        history check runs it on every pushed commit
                        however it was made
                        (README.md#getting-started; history.py).
                        sch_commit lines 80-82 and
                        reg_writing_style_rule lines 436-439 give this
                        as the purpose of the closed list. Holds for
                        the five checked verbs only.

