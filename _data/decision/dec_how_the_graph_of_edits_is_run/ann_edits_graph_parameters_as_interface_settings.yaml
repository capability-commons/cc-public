title:                  Delta module parameters as the settings of an interface
brief:                  |
                        A [[delta module]] with declared inputs and
                        parameters has the shape of a dataflow step:
                        named input ports, and settings with a type, a
                        default and whether they are optional. As a
                        node of a graph of edits held as a
                        [[dataflow graph]], its parameters are
                        settings, and the unknown-setting and
                        missing-setting checks hold each binding with
                        no new rule; under a resolver, delta module
                        parameters need a declaration form and binding
                        checks of their own.
description:            |
                        Sources:
                        - A delta module is a named subgraph of
                          variant operations with declared inputs and
                          parameters, such as the number of camera
                          inputs or the type of logging sink, applied
                          like a single variant operation.
                          (_data/decision/dec_vocabulary_of_variant_operations/ruling_closed_core_with_one_reuse_item.yaml
                          at brief;
                          _data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - A dataflow step has input ports and
                          settings, and a setting has a type, may be
                          optional and may give a default.
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.surface_dataflow_step and
                          $defs.setting)
                        - A node may be configured only with settings
                          its interface declares, and must give a
                          value for each setting that is neither
                          optional nor defaulted.
                          (src/cctool/check/check.lp within
                          unknown_setting and missing_setting)
                        - The delta module is the counterpart of a
                          Houdini digital asset, and a digital asset
                          gets its interface by "promoting parameters
                          on the contained nodes up onto the asset
                          node".
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at description;
                          https://www.sidefx.com/docs/houdini/assets/intro.html)
                        - Simplicity asks whether a design does
                          anything another mechanism already does;
                          functional suitability asks whether each
                          function gives the right result.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.1 and
                          entries.concern_functional_suitability.question.0)
                        - The proposed core has about ten operations.
                          (_data/decision/dec_where_variants_are_resolved/ann_variant_resolver_two_interpreters_drift.yaml
                          at description)
                        - ASSUMPTION: each kind of variant operation
                          and each delta module presents an interface
                          control document; none is drafted, and the
                          arguments of a filter, such as lists of
                          dataflow tags, have no port type yet.
                          Strength: moderate; it rests on writing an
                          interface for each operation kind, which is
                          about ten interfaces for the proposed core.

