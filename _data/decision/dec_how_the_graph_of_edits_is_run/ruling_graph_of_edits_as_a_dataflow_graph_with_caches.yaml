title:                  Graph of edits as a dataflow graph with caches
brief:                  |
                        The graph of edits is itself a dataflow graph,
                        with a cache on each edge that needs one,
                        keyed by the input digest of its stage. Ruled
                        by WTP on 2026-10-27, as recommended. WTP's
                        condition: it must be possible to specify that
                        particular dataflow nodes shall have no state,
                        as a cache keyed by the input digest needs.
                        Claude proposed doing this as the interface
                        limit on mutability does, with an interface or
                        a graph requiring that its nodes declare no
                        state and a check failing a node that declares
                        state where that is required. The ruling on
                        port groups answers the challenge that a merge
                        of any number of variants did not fit fixed
                        inputs, and cctool, not the engine, runs this
                        graph, as the ruling on where variants are
                        resolved says.

