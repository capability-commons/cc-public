title:                  Stage cache sound only for nodes without state
brief:                  |
                        A [[dataflow node]] retains state between
                        invocations, and a dataflow step may declare
                        state, while a cache keyed by the input digest
                        of a stage returns the right model only if the
                        stage is a pure function of its inputs,
                        settings and code. Held as a
                        [[dataflow graph]], the graph of edits then
                        needs a rule that its nodes declare no state,
                        which no check holds today.
description:            |
                        Sources:
                        - A dataflow node reads its inputs, writes its
                          outputs and retains state between
                          invocations.
                          (_data/register/reg_concept.yaml at
                          entries.concept_dataflow_node.brief)
                        - A dataflow step may declare what it reads
                          and writes between invocations.
                          (_data/schema/sch_interface_control_document.yaml
                          at
                          $defs.surface_dataflow_step.properties.state)
                        - The option keys each cache node by the input
                          digest of its stage.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief)
                        - The Patrol sketch resolver applies each
                          operation as a function of the graph it is
                          given and the arguments of the operation.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve)
                        - Functional suitability asks whether each
                          function gives the right result.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0)
                        - ASSUMPTION: no check over a dataflow graph
                          looks at the state of a dataflow step; none
                          of the dataflow checks in check.lp names
                          state (read by the advocate). Strength: weak
                          to moderate; the rule is one check, and
                          variant operations have no reason to keep
                          state, but without it the cache is unsound
                          in exactly the case the dataflow form allows
                          and the resolver form does not.

