title:                  Second runner of dataflow graphs with semantics of its own
brief:                  |
                        Nothing in cctool runs a [[dataflow graph]]
                        today, and the [[dataflow engine]] ruled for
                        systems is C++ with a static schedule fixed at
                        build time. Run in the tooling, the graph of
                        edits needs a second runner that fires each
                        node once, on demand, upstream of the output
                        asked for, which is a walk in topological
                        order with the name of a dataflow run and
                        semantics unlike the engine's. The resolver
                        option names that walk for what it is.
description:            |
                        Sources:
                        - No python module of cctool resolves a
                          variant or runs a dataflow graph; the
                          dataflow code draws a dataflow step, reads
                          graphs into facts and checks them.
                          (src/cctool, searched for resolve, variant
                          and dataflow by the advocate and the
                          verifier, 2026-10-26; src/cctool/web/step.py
                          within figure)
                        - The engine supports Kahn process networks
                          and actors together.
                          (_data/decision/dec_first_semantics/ruling_first_semantics.yaml
                          at brief)
                        - One engine runs a static subgraph, whose
                          schedule is generated as plain C++17 calls
                          fixed at build time, and a dynamic subgraph,
                          whose nodes and edges may change at the
                          start of a step.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          at brief)
                        - The drafted Kahn option runs every node once
                          in each step in a fixed order.
                          (_data/decision/dec_first_semantics/opt_kpn_first.yaml
                          at brief)
                        - Resolving a dataflow variant is running the
                          graph of edits up to its output.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief)
                        - Simplicity counts jobs done by more than one
                          mechanism; maintainability asks how readily
                          a newcomer can understand the design.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.1 and
                          entries.concern_maintainability.question.0)
                          Strength: moderate; it falls away if the
                          engine itself runs the graph of edits, which
                          needs a dataflow model as a token type and
                          every operation in C++, a question for where
                          variants are resolved.

