title:                  Resolver of the shape the Patrol sketch already has
brief:                  |
                        The Patrol sketch resolver is about forty
                        lines that resolve a [[dataflow variant]] by
                        resolving its [[base]] and applying its
                        operations, and it resolves all five Patrol
                        leaves in about a sixth of a second with no
                        cache, re-reading each file every time. The
                        resolver option is that shape with a cache
                        added; the dataflow option asks first for an
                        interface per operation, a runner and a cache
                        transform, and gives back little at the size
                        of the first family.
description:            |
                        Sources:
                        - The sketch resolves a variant by
                          deep-copying the resolved base and applying
                          each operation in turn, and keeps no cache.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve and load) It interprets all
                          seven drafted kinds in about forty lines of
                          Python.
                          (_data/decision/dec_where_variants_are_resolved/ann_variant_resolver_two_interpreters_drift.yaml
                          at description)
                        - Resolving the five Patrol leaves a hundred
                          times took about 0.16 s per round, and the
                          sketch reported no fault in any of them.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve and report, run by the
                          advocate, 2026-10-26)
                        - The Patrol family has seven dataflow
                          variants and a chain at most three deep.
                          (_sources/cc-patrol-notes/draft/README.md#files)
                        - The option describes the resolver as the
                          Patrol drafts' resolver works today.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_walked_by_a_separate_resolver.yaml
                          at description)
                        - Maintainability asks how readily a newcomer
                          can understand the design and measures the
                          time to make a representative change;
                          simplicity counts distinct mechanisms
                          introduced. (_data/register/reg_concern.yaml
                          at
                          entries.concern_maintainability.question.0,
                          entries.concern_maintainability.measure.0
                          and entries.concern_simplicity.measure.0)
                          Strength: moderate now, weak later; it does
                          not grow with the family, and a sweep or a
                          deep family is where caching and the
                          dataflow form start to pay.

