title:                  How the graph of edits is represented and run
brief:                  |
                        Is the graph of edits that builds a variant
                        family itself a dataflow graph, with caches
                        inserted on its edges, or is it walked by a
                        separate resolver?
description:            |
                        WTP ruled that a variant family is a directed
                        acyclic graph of edits with merge as one
                        operation, and wants it to work like a
                        generative graph-based editor such as Houdini,
                        a graph of transforms that can be edited and
                        played with caching at each stage (WTP,
                        2026-10-26). WTP then pointed out that the
                        graph of edits can itself be represented as a
                        dataflow graph, suitably transformed to insert
                        caches into each relevant edge, which makes
                        the whole thing recursive (WTP, 2026-10-26).
                        The answer bears on where variants are
                        resolved, on the identity of a resolved
                        dataflow graph, and on the origin trace of
                        one.

