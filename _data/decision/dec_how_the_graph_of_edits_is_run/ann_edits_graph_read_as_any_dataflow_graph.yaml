title:                  Graph of edits read as any dataflow graph is read
brief:                  |
                        Held as a [[dataflow graph]] item, the graph
                        of edits is read by the schema, the fact
                        extraction, the checks and the queries that
                        already read dataflow graphs, and by a partner
                        tool that reads that schema, and each
                        [[variant operation]] is a node with an id and
                        a guid, so the origin of each part of a
                        [[resolved dataflow graph]] is a path through
                        one graph. Walked by a resolver, the family
                        exists only as the bases named across many
                        [[dataflow variant]] items, and a partner must
                        rebuild it.
description:            |
                        Sources:
                        - A dataflow graph holds dataflow nodes keyed
                          by a short local name and the dataflow edges
                          between their ports; hosts and OS processes
                          are optional.
                          (_data/schema/sch_dataflow_graph.yaml at
                          allOf)
                        - A variant operation is named by an id with a
                          guid, and a dataflow edge is identified by
                          its two ends.
                          (_data/decision/dec_identity_of_a_variant_operation/ruling_operation_named_by_id_with_guid.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - Under the resolver option the graph of edits
                          is held as dataflow variants and their
                          operation lists.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_walked_by_a_separate_resolver.yaml
                          at brief)
                        - A variant draft names its base in a field.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          at base)
                        - Compatibility asks whether a partner can
                          read and use what the design produces;
                          traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0 and
                          entries.concern_traceability.question.0)
                        - ASSUMPTION: the graph of edits is written as
                          an item; if it is derived from the dataflow
                          variants, a partner must still derive it,
                          see the annotation on a base held twice or
                          derived. Strength: moderate; the review
                          pages draw no dataflow graph today, only the
                          dataflow step of an interface, so the gain
                          is in what reads the graph, not yet in what
                          shows it.

