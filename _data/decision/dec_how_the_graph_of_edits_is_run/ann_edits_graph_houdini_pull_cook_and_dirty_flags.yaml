title:                  Houdini network of nodes cooked on demand and dirtied by a change
brief:                  |
                        In Houdini a node is cooked only when asked
                        for its data, a parameter change dirties
                        everything that depends on it, and the graph
                        is then traversed cooking only the dirty
                        nodes, so one network of nodes is both what
                        the user edits and what is played. A graph of
                        edits held as a [[dataflow graph]], with
                        caches as nodes on its edges, has that shape;
                        a resolver beside the [[dataflow variants]]
                        keeps the edited form and the played form
                        apart.
description:            |
                        Sources:
                        - "Nodes are never cooked unless they are
                          asked for their data", and "If Houdini at
                          any point encounters a node that is up to
                          date, then no further cooking will be done."
                          (https://www.sidefx.com/docs/hdk/_h_d_k__op_basics__overview__cooking.html)
                        - "When a parameter changes, everything in the
                          graph that depends on the parameter's data
                          is dirtied accordingly", and the graph is
                          then traversed, "cooking the nodes which are
                          dirty".
                          (https://www.sidefx.com/docs/hdk/_h_d_k__op_basics__overview__dependencies.html)
                        - "Whenever you wire in a new node or change a
                          parameter, Houdini re-evaluates the networks
                          to compute the new outputs."
                          (https://www.sidefx.com/docs/houdini/basics/cooking.html)
                        - WTP wants the whole to work like Houdini, a
                          graph of transforms that can be edited and
                          played with caching at each stage (WTP,
                          2026-10-26).
                          (_data/decision/dec_how_the_graph_of_edits_is_run/dec_how_the_graph_of_edits_is_run.yaml
                          at description)
                        - Functional suitability asks whether the
                          functions help users complete their tasks;
                          maintainability asks how readily a newcomer
                          can understand the design.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.2
                          and
                          entries.concern_maintainability.question.0)
                          Strength: moderate; it is an alignment with
                          the model WTP named. Houdini's own disk
                          cache is not keyed by its inputs and does
                          not see an upstream change, so the keyed
                          cache of the option is closer to Bazel than
                          to Houdini, and dirty propagation is not in
                          the option's text.

