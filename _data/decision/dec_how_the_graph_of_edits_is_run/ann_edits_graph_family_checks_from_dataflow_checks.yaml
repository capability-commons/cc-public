title:                  Family checks given by the dataflow checks
brief:                  |
                        Held as a [[dataflow graph]], the graph of
                        edits gets the checks a [[variant family]]
                        needs from checks that already exist: the
                        feedforward-loop check fails a family that is
                        not acyclic, the unfed-input check fails a
                        [[variant operation]] with no [[base]] wired
                        in, and the foreign-node and unknown-port
                        checks fail an edge to an operation or port
                        that does not exist. A separate resolver needs
                        its own check for each of these.
description:            |
                        Sources:
                        - The feedforward-loop check fails a loop
                          closed by feedforward edges only; the
                          unfed-input check fails an input that is not
                          optional and that no edge feeds; the
                          foreign-node and unknown-port checks fail an
                          edge end that names no node of the graph or
                          no port of the interface.
                          (src/cctool/check/check.lp within
                          feedforward_loop, unfed_input, foreign_node
                          and unknown_port)
                        - A variant family is a directed acyclic graph
                          of edits.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Under the option the dataflow checks apply
                          to the graph of edits as to any other
                          dataflow graph; under the alternative they
                          do not apply to it.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief;
                          _data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_walked_by_a_separate_resolver.yaml
                          at brief)
                        - The Patrol sketch resolver recurses from a
                          variant to its base and checks neither for a
                          cycle nor for a missing base, beyond failing
                          to load the file.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve)
                        - Simplicity asks whether a design does
                          anything another mechanism already does, and
                          whether it follows from decisions already
                          made. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.1 and
                          entries.concern_simplicity.question.2)
                        - Functional suitability asks whether every
                          function that is needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1)
                          Strength: moderate; the checks a family
                          needs are few and each is small to write in
                          a resolver, but each is then a second rule
                          for a job the dataflow checks already do.

