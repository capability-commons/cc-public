title:                  Graph of edits walked by a separate resolver
brief:                  |
                        The graph of edits is held as
                        [[dataflow variants]] and their operation
                        lists, and a resolver in the tooling walks it
                        from each output back to its roots, with its
                        own cache keyed by the input digest of each
                        stage. The graph of edits is not a
                        [[dataflow graph]], and the dataflow checks do
                        not apply to it.
description:            |
                        The alternative to WTP's proposal, as the
                        Patrol drafts' resolver works today
                        (_sources/cc-patrol-notes/variants.md).

