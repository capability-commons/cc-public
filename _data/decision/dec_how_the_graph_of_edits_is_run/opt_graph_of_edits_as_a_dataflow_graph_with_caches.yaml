title:                  Graph of edits as a dataflow graph with caches on its edges
brief:                  |
                        The graph of edits is itself a
                        [[dataflow graph]]: each
                        [[variant operation]], each merge and each
                        [[delta module]] is a dataflow node, a
                        dataflow model is the token on each edge, and
                        each named [[dataflow variant]] is a named
                        output. A transform inserts a cache node on
                        each edge that needs one, keyed by the input
                        digest of its stage, as other transforms
                        insert nodes on edges. Resolving a dataflow
                        variant is running the graph of edits up to
                        its output, and the dataflow checks apply to
                        the graph of edits as to any other. The graph
                        of edits has no variants of its own, so the
                        recursion ends there.
description:            |
                        WTP's proposal (WTP, 2026-10-26).

