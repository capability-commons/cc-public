title:                  Merge of any number of variants against a fixed set of inputs
brief:                  |
                        A merge selects two or more
                        [[dataflow variants]], but a dataflow step
                        reads a fixed set of named inputs and its
                        ports cannot be variadic, so n edges into one
                        input fail the input-fed-twice check and n
                        named inputs fix the count in each interface.
                        Every port of the graph of edits also carries
                        one type, a dataflow model, so the port-type
                        check can never fail there. The resolver takes
                        a list of any length and needs neither.
description:            |
                        Sources:
                        - A merge selects two or more dataflow
                          variants to combine.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - A dataflow step reads a fixed set of inputs,
                          and a port has a type and may be optional,
                          but has no variadic field, which parameters
                          of a callable and of a command have.
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.surface_dataflow_step.description,
                          $defs.port and $defs.parameter)
                        - An input takes its value from at most one
                          edge. (src/cctool/check/check.lp within
                          input_fed_twice)
                        - The port-type check compares the types the
                          two ends state. (src/cctool/check/check.lp
                          within port_type_mismatch)
                        - In the option a dataflow model is the token
                          on each edge.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed is present;
                          simplicity counts distinct mechanisms
                          introduced. (_data/register/reg_concern.yaml
                          at
                          entries.concern_functional_suitability.question.1
                          and entries.concern_simplicity.measure.0)
                        - ASSUMPTION: a finer port type, such as a
                          model that presents a named interface, is
                          not drafted. Strength: moderate; a variadic
                          input on dataflow steps, with a check that
                          counts its edges, would answer it, at the
                          cost of a new construct in the schema and
                          the checks, and a merge of two, the common
                          case, fits fixed inputs.

