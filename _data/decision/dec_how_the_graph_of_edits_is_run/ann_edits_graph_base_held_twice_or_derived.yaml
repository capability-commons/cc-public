title:                  Base reference held twice or derived by a walk
brief:                  |
                        A [[dataflow variant]] already holds its
                        [[base]] and its [[operation list]], so a
                        graph of edits written as a [[dataflow graph]]
                        item states each base a second time, and the
                        two can disagree, leaving the reason for a
                        part of the family in two places. Derived
                        instead, it is built by reading every dataflow
                        variant and following its base, a walk of the
                        kind the resolver option makes, and the
                        recursion ends because nothing derives
                        variants of a derived graph.
description:            |
                        Sources:
                        - A variant type holds a base, a dataflow
                          graph or another variant, and an ordered
                          list of operations, and the resolved graph
                          is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          at brief)
                        - The graph of edits has no variants of its
                          own, so the recursion ends there.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief)
                        - The resolver option holds the graph of edits
                          as dataflow variants and their operation
                          lists.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_walked_by_a_separate_resolver.yaml
                          at brief)
                        - The type register has no type for a dataflow
                          variant yet, so no rule says what a base may
                          be. (_data/register/reg_data_item_type.yaml
                          at entries)
                        - Simplicity asks whether a design does
                          anything another mechanism already does;
                          maintainability asks how far a change in one
                          part spreads to others; traceability asks
                          whether each element can be traced to the
                          reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.1,
                          entries.concern_maintainability.question.1
                          and entries.concern_traceability.question.0)
                          Strength: moderate to strong; the option
                          does not say which form the graph of edits
                          takes. Derived, it keeps one source and the
                          base case holds by construction, but it
                          gives up the item a partner reads; written,
                          the base case needs a check that no variant
                          is built on the graph of edits.

