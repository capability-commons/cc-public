title:                  A test case only where code cannot carry it
brief:                  |
                        A test case is written for a verification by
                        inspection, analysis or demonstration, which
                        has no test function; for several separately
                        expected conditions of one requirement; for a
                        test reused against more than one
                        implementation; for a tolerance or a vector
                        held outside the repository; and for a test
                        function that verifies more than one
                        requirement and is not divided. Otherwise the
                        test function is the verification.

