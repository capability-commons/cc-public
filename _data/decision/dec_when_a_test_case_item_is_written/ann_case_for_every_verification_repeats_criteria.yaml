title:                  Test case written twice over
brief:                  |
                        A test case for every verification repeats, in
                        a second item, words that the requirement and
                        its test already hold. With no test case type
                        the repository has one fewer mechanism, and
                        the type can be added when the first
                        verification needs it.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_case_for_every_verification_restates_criteria
                          (a quarter to two thirds repeated).
                        - September found that what a case added was
                          the input and configuration
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at context].
                        - Also rests on a source stated once in
                          ann_case_for_every_verification_restates_criteria
                          (September's rejection of a case per
                          requirement).
                        - Function and class items are written only
                          when needed
                          [_data/decision/dec_python_definition_items/ruling_python_definition_items.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_case_for_every_verification_restates_criteria
                          (the 4 requirements on dev).
                        - Also rests on a source stated once in
                          ann_case_for_every_verification_restates_criteria
                          (the kinds the dev option names). Strength:
                          strong against a case for every
                          verification, since that duplicates a job at
                          any size. Between the other two it is
                          moderate. No type is the fewest mechanisms
                          today, with one inspection requirement. The
                          rule of five kinds follows September and the
                          earlier ruling, and it becomes the simpler
                          choice once one of those kinds actually
                          occurs, which ten times the requirements
                          makes likely.

