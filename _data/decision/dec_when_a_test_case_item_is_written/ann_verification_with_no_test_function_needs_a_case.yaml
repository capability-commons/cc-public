title:                  Verifications that no test function carries
brief:                  |
                        With no test case type, a verification by
                        inspection, analysis or demonstration has only
                        prose in verification_approach. No item holds
                        what was expected before anyone looked, and no
                        edge or observation can name it. A requirement
                        verified by inspection already exists, so the
                        gap is present now. A test function that
                        verifies two requirements also needs a case,
                        so that each obligation traces to its own
                        verifier.
description:            |
                        Sources:
                        - Under the option with no test case type, a
                          verification without a test function stays
                          as prose in verification_approach
                          [_data/decision/dec_when_a_test_case_item_is_written/opt_no_test_case_type.yaml
                          at brief].
                        - The requirement
                          rqt_chat_deployment_stays_with_data_owner
                          has verification_method inspection, so no
                          test function can carry its verification
                          [_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml
                          at verification_method].
                        - September held that what a case adds to a
                          verification a person carries out is what
                          was expected, stated before anyone observed
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at consequence].
                        - September wrote a case for a method that is
                          not code, since inspection, analysis and
                          demonstration have no python function to
                          carry them, and kept one method each for
                          them
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at decision and at consequence].
                        - In September five of eleven test functions
                          that verified anything verified two
                          requirements each, and each recorded one
                          verdict for both
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at context].
                        - September found that no reading of the code
                          shows which requirement a pass of such a
                          function was about
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at rationale].
                        - Also rests on a source stated once in
                          ann_case_for_every_verification_restates_criteria
                          (the kinds the dev option names).
                        - WTP asked that test cases become part of the
                          graph and be linked to requirements and
                          interface control documents [owner's
                          statement, 2026-10-25]. Strength for
                          concern_functional_suitability: moderate.
                          One requirement in four is verified by
                          inspection today, and the share is likely to
                          grow as procedures are added (ASSUMPTION),
                          so it holds at ten times the size. Strength
                          for concern_traceability: Strong for the
                          instances named, and it holds at ten times
                          the size, since shared functions and
                          non-test methods grow with the requirements.
                          A case for every verification meets the
                          trace as well, but adds no trace where one
                          function verifies one requirement.

