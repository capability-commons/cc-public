title:                  Size of the tree a check reads
brief:                  |
                        A case for every verification adds about fifty
                        lines per verification for every check to
                        read. Writing cases only where needed keeps
                        that cost to the verifications that use it.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_case_for_every_verification_restates_criteria
                          (a case of 46 to 50 lines).
                        - The gate runs the check stage on every
                          commit, data-only commits included
                          [src/cctool/gate/gate.py at function
                          stages].
                        - The push gate sets no check store, so it
                          checks every file afresh
                          [src/cctool/check/store.py at module
                          docstring].
                        - ASSUMPTION: check time grows roughly with
                          the lines and items in the tree. Strength:
                          weak. At 4 requirements the cost is
                          negligible. At ten times the requirements
                          and members, a case for each adds a few
                          thousand lines to every push gate check.

