title:                  When a test case item is written
brief:                  |
                        When is the content of a verification, its
                        inputs, configuration and expected
                        observations, written as a test case item
                        rather than left in the code of the test?
description:            |
                        September built test case items and measured
                        them: a case came to 46 to 50 lines, and a
                        quarter to two thirds of the words of its
                        expectation repeated the success criteria of
                        what it verified. It then ruled that a case is
                        written only where its content must be read,
                        reused or approved outside the code that runs
                        it.

