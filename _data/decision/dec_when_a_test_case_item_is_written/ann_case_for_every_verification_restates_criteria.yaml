title:                  Case items that restate the success criteria
brief:                  |
                        A test case for every verification adds about
                        fifty lines per verification, and much of its
                        expectation repeats the success criteria the
                        requirement already states. Each such case is
                        a second thing to keep current and a second
                        thing that can disagree with the first. A copy
                        that is not kept current goes on reporting
                        against criteria that have moved, and a
                        reviewer reads the criteria twice. Writing a
                        case only where code cannot carry the content
                        keeps one statement of each expectation and
                        keeps each change to what is new. Its known
                        weakness is that evidence from a bare test
                        function does not see a change to the harness,
                        which the digest must then cover.
description:            |
                        Sources:
                        - September measured a case at 46 to 50 lines,
                          and a quarter to two thirds of the words of
                          its expectation repeated the success
                          criteria of what it verified
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at context].
                        - September rejected a case for every
                          requirement because it costs about fifty
                          lines each to restate success criteria the
                          requirement already carries, and a case that
                          adds only a restatement adds a second thing
                          to keep current and a second thing to
                          disagree with the first
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at rationale and at alternative].
                        - September found that an assertion deleted
                          from a shared function leaves both
                          requirements verified, passing and current,
                          and nothing notices
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at rationale].
                        - The closure of a case covers its method and
                          the adapter that ran it, and the closure of
                          a bare function covers neither
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at rationale].
                        - September's rule includes review by someone
                          who does not read the code among the
                          instances that call for a case
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at decision].
                        - The dev option names inspection, analysis,
                          demonstration, several expected conditions,
                          reuse, a tolerance or external vector, and a
                          function that verifies more than one
                          requirement and is not divided. It does not
                          name review by a non-reader of code
                          [_data/decision/dec_when_a_test_case_item_is_written/opt_test_case_where_code_cannot_carry_it.yaml
                          at brief].
                        - Dev holds 4 requirements, one verified by
                          inspection and three by test
                          [_data/requirement/ at verification_method].
                        - The tooling has about 555 test functions
                          [src/cctool, by count of def test_ in python
                          files].
                        - AGENTS.md asks that a type, relation, field
                          or command be added only when a real
                          instance needs it [AGENTS.md at section Keep
                          it small].
                        - The reviewability measure is the size of a
                          change in lines
                          [_data/register/reg_concern.yaml at
                          entries.concern_reviewability.measure]. Strength
                          for concern_maintainability: Strong against
                          a case for every verification, and it grows
                          linearly: at ten times the requirements the
                          duplicated lines grow ten times. Between the
                          other two options the point is weaker. No
                          test case type is the least to keep today,
                          since only one requirement has no test
                          function. The conditional option adds a
                          type, a schema and a check that serve few
                          items now, but avoids prose that no check
                          reads for verifications that need inputs
                          held outside the code. Strength for
                          concern_reliability: moderate. The drift
                          grows with the number of requirements, so it
                          holds and worsens at ten times the size. The
                          harness blind spot is real and is for
                          dec_what_an_evidence_digest_covers to close.
                          Strength for concern_reviewability: Strong,
                          from a measurement. At ten times the size
                          the cost grows with the requirement count,
                          while the targeted option grows only with
                          the hard cases. The missing instance of
                          review by a non-reader of code is a small
                          gap that a ruling can close by adding it.

