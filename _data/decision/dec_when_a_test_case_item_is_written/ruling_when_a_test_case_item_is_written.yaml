title:                  A test case only where code cannot carry it
brief:                  |
                        The test function item is the verification
                        wherever one test function can stand for it,
                        and a test case item is written only for the
                        cases the option names. One more case is
                        named: a verification whose procedure must be
                        reviewed as a document and outlive the code
                        behind it. Once criticality exists, a critical
                        requirement must have a verifier whose item
                        states the procedure and what shows success. A
                        test case for every verification, and no test
                        case type, are rejected. Ruled by WTP on
                        2026-10-28 at 14:35 UTC, by writing "Uphold
                        opt_test_case_where_code_cannot_carry_it with
                        the changes as discussed".

