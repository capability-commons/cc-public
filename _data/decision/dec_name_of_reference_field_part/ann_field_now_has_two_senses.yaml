title:                  Field in two senses at once
brief:                  |
                        Choosing field gives the word a second sense.
                        It already means a whole key and value of an
                        item, and now also the part of a reference
                        field's name after its prefix, so sentences
                        such as "a field id_<field>" use it both ways
                        at once.
description:            |
                        Sources, at 09cbf25: field as a whole entry:
                        "Trait with the identity fields", "It holds
                        only two fields: guid_self and id_self"
                        (_data/schema/sch_trait_identity.yaml), "Prose
                        fields are ASCII" (AGENTS.md). Field as the
                        part after the prefix: "the rest of its name
                        is its field (for example target, in id_target
                        or guid_target)" (sch_trait_identity.yaml);
                        "the rest of its name, its field, tells
                        references apart"
                        (_data/schema/sch_primitive.yaml). Both at
                        once: "A field id_<field> that names an item
                        is given guid_<field> beside it"
                        (src/cc_public/edit/edit.py); "A field
                        id_FIELD that names an item gets guid_FIELD
                        beside it" (src/cc_public/cli/editing.py); the
                        failure text "{holder} names {id} in its
                        {field} field" (src/cc_public/check/check.lp),
                        which prints "in its target field" though the
                        fields are id_target and guid_target. The
                        register deprecated note for annotations
                        because it "already names the descriptive
                        field every item carries"
                        (_data/register/reg_concept.yaml), a precedent
                        for counting a clash with a field against a
                        term. No entry of the concept register names
                        the part after the prefix.

