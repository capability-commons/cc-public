title:                  Field as what it is
brief:                  |
                        Field is literally what the part names, and
                        the word was free. Slot is taken by the slots
                        of a requirement, and key by YAML keys and the
                        KEY_ constants.
description:            |
                        reference(Holder, Field, Id, Guid, File, Line)
                        in src/cctool/check/check.lp reads as the
                        item, the field it names another from, and the
                        item named.

