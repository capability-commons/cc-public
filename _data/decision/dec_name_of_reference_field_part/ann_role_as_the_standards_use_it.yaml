title:                  Role as the standards use it
brief:                  |
                        The standards use role for something played
                        across relations, which is what the new
                        mechanism needs. Keeping role for the part of
                        a field name would leave the standard word
                        unused where it fits.
description:            |
                        See ann_roles_as_iso_15926_defines_them for
                        the readings of ISO 15926-2 and object-role
                        modeling.

