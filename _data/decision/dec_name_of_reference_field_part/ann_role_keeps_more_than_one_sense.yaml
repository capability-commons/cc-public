title:                  Role in more than one sense either way
brief:                  |
                        Choosing field does not leave role with one
                        meaning. Role still names what an annotation
                        does through its edges, and a standard the
                        register cites uses role for a named end of a
                        relation. Under either option, role has more
                        than one sense across the repository and its
                        cited sources.
description:            |
                        Sources, at 09cbf25: the determination chose
                        field "to free role for what types play"
                        (det_name_of_reference_field_part). Role still
                        names the job of an annotation: "Its role is
                        carried by its edges" (con_annotation,
                        _data/register/reg_concept.yaml), and the
                        issue dec_annotation_role_by_edges. con_role
                        follows ISO 15926-2 and says it is not the
                        relation role of ISO/IEC 11179-3:2013 clause
                        3.2.120, "a named end of one relation"
                        (reg_concept.yaml, con_role note). ASSUMPTION:
                        the part after the prefix names which end of a
                        reference an item stands at, which is close to
                        the 11179-3 sense.

