title:                  Rename that touched many files
brief:                  |
                        Renaming the part cost an edit to every place
                        that named it, and prose in recorded arguments
                        still uses the old sense.
description:            |
                        Commit c94674b changed eight files: check.lp,
                        extract.py, edit.py, three schemas, the
                        editing skill and one annotation. Commit
                        accdad7 changed the help of set and unset.
                        Annotations that use role in other senses were
                        left as written.

