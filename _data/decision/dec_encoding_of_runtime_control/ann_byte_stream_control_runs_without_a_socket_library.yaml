title:                  Byte stream for runtime control on targets a library may not reach
brief:                  |
                        JSON lines and length-prefixed frames both
                        need only a byte stream: a pipe to a local
                        engine, the pipe of a remote shell, a socket,
                        or a serial line on a board with no network
                        stack. Moving runtime control to a new target
                        is then a read and a write in the engine's
                        platform layer. ZeroMQ needs a build of the
                        library for each target and one of its own
                        transports, and pays most where it is not yet
                        needed, across a network. WTP plans the engine
                        for embedded reach, and the records already
                        name small high-integrity targets.
description:            |
                        Sources:
                        - The engine is a new C++17 engine targeting
                          embedded reach, and
                          Patrol, on an NVIDIA Orin, is its first user (WTP, 2026-10-28).
                        - Small and high-integrity targets such as the
                          Raspberry Pi 5
                          should not carry code they never use.
                          (_data/requirement/rqt_generator_omits_dynamic.yaml at rationale)
                        - JSON lines run on standard input and output
                          for a local engine or
                          on a socket for a remote one.
                          (_data/decision/dec_encoding_of_runtime_control/opt_json_lines_on_a_stream.yaml
                          at brief)
                        - The trial's runtime control reads standard
                          input and writes
                          standard output, and the deployer starts the engine as a child
                          process with pipes. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/control.cpp, function
                          control_start; src/cctool/dataflow/deploy.py, class Engine)
                        - Runtime control may depend on the engine's
                          platform component.
                          (_data/logical_component/lco_dataflow_engine_control.yaml at edge)
                        - Flexibility asks on which platforms the
                          design runs and what it
                          takes to install it on a new one.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question.0 and question.1)
                        ASSUMPTION: libzmq's transports, such as TCP,
                        interprocess, in-process and multicast, are
                        network and interprocess ones, none of them a
                        serial line, and libzmq needs an operating
                        system with threads and sockets. Strength:
                        moderate; it matters once a target without a
                        full operating system is in view, while on
                        Patrol's Orin, which runs Linux, all three
                        options work.

