title:                  Dictionary types in length-prefixed frames
brief:                  |
                        Each request and reply is a type of the data
                        dictionary, sent as a binary frame behind its
                        length, so the engine reads values of fixed
                        size with no text parser, and the same
                        generated code describes them on both sides.

