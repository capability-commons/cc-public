title:                  Encoding of runtime control
brief:                  |
                        Requests and replies between deployment and a
                        running engine carry content digests, a
                        lowered graph and change sets. How are they
                        encoded, and over what channel?
description:            |
                        icd_dataflow_runtime_control fixes what each
                        request carries, and leaves its encoding to
                        the first host that needs it. The trial
                        implementation of 2026-10-29 sent one JSON
                        object per line on standard input and output
                        (trial process log, phase 2). The review found
                        that one line of 200 KB crashed its JSON
                        reader (review of 2026-10-29, CC-046), that
                        runtime control raced with the dynamic
                        subgraph (CC-017), and that a request taken as
                        a run ended read a freed engine (CC-006).
                        Transport libraries are confined to the
                        transport nodes
                        (rqt_transport_confines_library).

