title:                  Two JSON readers that can read one request two ways
brief:                  |
                        Under JSON the meaning of a request rests on
                        each reader, and the trial's two readers
                        differ on a repeated name: Python's json
                        module, which cctool uses for replies and
                        recordings, keeps the last value, while the
                        engine's reader merges the values, so that
                        arrays concatenate; RFC 8259 leaves such input
                        to each implementation. By reading its code,
                        the engine also passes over any name it does
                        not know, so a misspelled part of a change set
                        silently means none. cctool checked each
                        change set as Python data and wrote it with a
                        writer that never repeats a name, so the split
                        bites on text cctool did not write: a request
                        corrupted in transit, as rqt_dynamic_rechecks
                        fears, one from another sender, or a recorded
                        change set that recording.py and the engine's
                        replay read two ways. One deeply nested line
                        of 200 KB crashed the reader. Frames of
                        dictionary types are generated for both sides
                        from one item and leave only counts to check
                        against capacities, a check the trial's replay
                        reader also missed.
description:            |
                        Sources:
                        - The engine's JSON reader recurses without a
                          limit, so one deeply
                          nested 200 KB status line crashes the engine; it casts large
                          numbers to integers with undefined behavior, accepts nan and inf,
                          and reads an object with a repeated name as one value holding both
                          arrays. (review of 2026-10-29, CC-046; areas/trial-engine.md,
                          TE-16)
                        - Python's json module keeps the last value of
                          a repeated name
                          (checked by running json.loads on such an object, 2026-10-29).
                        - Objects with repeated names behave
                          unpredictably across
                          implementations, some keeping the last pair and others all of
                          them, and a parser may limit nesting depth, size and the range of
                          numbers (RFC 8259, The JavaScript Object Notation (JSON) Data
                          Interchange Format, sections 4 and 9,
                          https://www.rfc-editor.org/rfc/rfc8259).
                        - The engine reads the parts of a change set
                          by name, such as
                          remove_node and add_node, and passes over any other name, while
                          the deployer writes them by keyword; by reading the code, a change
                          set none of whose parts the engine recognizes is still installed,
                          and the digest it gives is taken as the one running. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/dynamic.cpp, functions
                          build, hook_apply and install; src/cctool/dataflow/deploy.py,
                          function send)
                        - cctool checks a change set as Python data
                          and writes the request
                          with json.dumps; it reads what the engine writes only in replies
                          and in recordings, whose change rows hold the request's text.
                          (trial 2c777ab9, src/cctool/dataflow/deploy.py, functions send and
                          Engine.request; src/cctool/dataflow/recording.py, function read;
                          src/cctool/dataflow/engine/src/dynamic.cpp, function install)
                        - The engine repeats the safety checks because
                          a change set could be
                          stale or corrupted in transit.
                          (_data/requirement/rqt_dynamic_rechecks.yaml at rationale)
                        - In frames each request is a type of the data
                          dictionary, and the
                          same generated code describes it on both sides.
                          (_data/decision/dec_encoding_of_runtime_control/opt_dictionary_types_in_length_prefixed_frames.yaml
                          at brief)
                        - The trial's generated packed C structs and
                          its Python sizes
                          agreed, guarded by a generated static assertion. (review of
                          2026-10-29, areas/trial-model.md, section 5, struct sizes)
                        - The replay reader took a count from its
                          input without checking it
                          and read past a buffer. (review of 2026-10-29, CC-045)
                        Strength: moderate; the split reading needs
                        text cctool did not write, and the crash and
                        the unknown names are faults of the trial's
                        reader; a JSON reader that refuses repeated
                        and unknown names and limits depth closes most
                        of it, at the cost of writing and testing
                        those rules in two languages.

