title:                  Control requests typed, read and recorded as plain text
brief:                  |
                        The trial's tests and the review's
                        reproductions all drove the engine by writing
                        request lines and reading reply lines: status
                        polls at the end of a run, a stop followed by
                        a close, 75 changes under a race detector, and
                        the 200 KB line that found the reader's crash.
                        The recording kept each change set as the
                        request's own text, readable as it stands, and
                        an engine started from a terminal can be asked
                        for its status by typing a line. The tests
                        state change sets as Python maps, which a
                        generated encoder of frames could take as
                        well, but binary frames need a decoder for
                        every look at the channel or the recording,
                        which the generator could write from the same
                        dictionary but which does not exist yet.
description:            |
                        Sources:
                        - The tests send status, stop, start and apply
                          requests through the
                          deployer, with change sets written inline. (trial 2c777ab9,
                          src/cctool/dataflow/_test/test_engine.py and test_dynamic.py)
                        - The review's scripts wrote request lines and
                          read reply lines for
                          the run-end loop, the stop and close loop and the stress run of
                          changes. (review of 2026-10-29, areas/trial-engine.md, section 2,
                          and trial-engine-logs/repro/scripts/runend.py)
                        - Each change set is recorded at its step as
                          the text of its
                          request. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, function install)
                        - JSON lines are readable in a terminal and in
                          a log, with a small
                          parser in the engine.
                          (_data/decision/dec_encoding_of_runtime_control/opt_json_lines_on_a_stream.yaml
                          at brief)
                        - The process log reports that the trial's
                          JSON lines choices
                          worked, though its recording was large. (trial process log,
                          suggestion 2, an encodings phase)
                        - Maintainability asks how readily a newcomer
                          can understand the
                          design and how readily a change can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.0 and question.2)
                        ASSUMPTION: a decoder that prints frames as
                        text can be generated from the dictionary
                        types alongside the code that reads and writes
                        them. Strength: moderate; it weighs most in
                        development and less on a fielded robot, and a
                        generated decoder would close most of the gap.

