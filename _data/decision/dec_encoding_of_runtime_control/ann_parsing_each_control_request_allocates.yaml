title:                  Allocation for every control request while the units run
brief:                  |
                        rqt_memory_only_for_change_sets lets the
                        engine take memory while its units run only
                        for the nodes and edges a change set adds. By
                        reading its code, the trial's runtime control
                        takes memory for every request, a status poll
                        included: it reads each line into a string,
                        parses it into maps and lists and joins
                        strings for the reply. No test counted it,
                        since the trial's counter sees only the units'
                        threads: its log records a conflict between
                        the requirement and adding nodes at run time,
                        and settles it by allocating only in the
                        control thread. A frame of a fixed dictionary
                        type can be read into a buffer set aside
                        before the first step and answered from
                        another, with no allocation at all. JSON lines
                        can do the same only with a reader written not
                        to allocate, and ZeroMQ runs an I/O thread of
                        its own and manages its own message buffers.
description:            |
                        Sources:
                        - Memory is taken while the units run only for
                          a change set that
                          adds an edge or a node; buffers and state are set aside before the
                          first local step because allocation while a system runs is
                          forbidden by MISRA-style rules for high-integrity code and causes
                          jitter. (_data/requirement/rqt_memory_only_for_change_sets.yaml at
                          condition and object;
                          _data/requirement/rqt_memory_before_first_step.yaml at object and
                          rationale)
                        - Runtime control reads each request into a
                          string, parses it into
                          a value held in maps and vectors, and builds each reply by joining
                          strings; this is read from the code, not measured. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/control.cpp, functions
                          control_start, handle and status;
                          src/cctool/dataflow/engine/include/df/json.hpp, struct Value)
                        - The process log says the trial allocates in
                          the thread of runtime
                          control and never on a unit's thread, and asks that the
                          requirement be reworded to say which (trial process log, phase 3,
                          the conflict on allocation); the review found unit threads
                          allocating too on the deploy path (review of 2026-10-29, CC-009).
                        - The test allocator counts only what the
                          threads of execution
                          units allocate. (trial 2c777ab9,
                          src/cctool/dataflow/engine/test/count_new.cpp)
                        - The test case for status asks for status
                          every local step.
                          (_data/test_case/case_control_status_reads_only.yaml at inputs)
                        - A ZeroMQ context runs a pool of I/O threads,
                          one by default
                          (libzmq API, zmq_ctx_set, ZMQ_IO_THREADS,
                          https://libzmq.readthedocs.io/en/latest/zmq_ctx_set.html).
                        - Performance efficiency asks what resources
                          the design consumes;
                          safety asks how it avoids each hazard.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.question.1 and
                          entries.concern_safety.question.1)
                        ASSUMPTION: libzmq allocates storage for any
                        message larger than a small size it holds
                        inline; a JSON reader can be written to fill a
                        fixed table of tokens instead of maps, at the
                        cost of the trial's simple reader. Strength:
                        moderate; if the requirement is reworded as
                        the trial log proposes, to bind only the
                        execution units, the point shrinks to jitter
                        from a busy control thread that shares a core.

