title:                  Messaging library in runtime control, outside the transport nodes
brief:                  |
                        rqt_transport_confines_library allows ZeroMQ,
                        sockets and shared-memory libraries only in
                        the sender and receiver nodes, so that a
                        target without a transport need not build one.
                        Runtime control is part of the engine and is
                        compiled into every build, so ZeroMQ request
                        and reply sockets there would put the library
                        into every engine, one with no transport
                        included, where the trial's engines linked no
                        third-party library at all. The library has
                        also changed its license once, from LGPL-3.0
                        with exceptions to MPL-2.0 in 2023, terms that
                        are not ours to fix. JSON lines or frames read
                        by the engine's own code keep that count at
                        zero, though either one carried on a socket
                        meets the same requirement for the socket.
description:            |
                        Sources:
                        - Nothing else in the engine depends on
                          ZeroMQ, sockets or shared
                          memory libraries, since a target without a transport need not
                          build it.
                          (_data/requirement/rqt_transport_confines_library.yaml at brief
                          and rationale)
                        - Runtime control is part of the dataflow
                          engine.
                          (_data/logical_component/lco_dataflow_engine_control.yaml at edge)
                        - The messaging option sends requests and
                          replies through a library
                          such as ZeroMQ request and reply sockets carrying JSON.
                          (_data/decision/dec_encoding_of_runtime_control/opt_an_existing_messaging_library.yaml
                          at brief)
                        - The generated build compiles every source of
                          the engine core,
                          runtime control among them, leaving out only the actors and the
                          dynamic subgraph when unused, and links each engine with its node
                          library and the threads library only. (trial 2c777ab9,
                          src/cctool/dataflow/generate.py, function _cmake and the text
                          CMAKE_HEAD)
                        - libzmq was licensed under LGPL-3.0 with a
                          static-link exception
                          and is now under MPL-2.0, the relicensing completed in release
                          4.3.5 of 2023-10-09 (ZeroMQ, License,
                          https://zeromq.org/license/; libzmq 4.3.5 release notes,
                          https://newreleases.io/project/github/zeromq/libzmq/release/v4.3.5).
                        - Dependency risk asks what the design takes
                          from third parties and
                          whether their licenses are compatible with ours.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question.0 and question.2)
                        ASSUMPTION: MPL-2.0, a copyleft on each file,
                        can be linked into an Apache-2.0 engine, so
                        the license is a duty to track rather than a
                        bar. Strength: strong while the requirement
                        stands as written; it falls away if WTP lets
                        runtime control share the transport library,
                        or puts runtime control in a process of its
                        own beside the engine.

