title:                  JSON lines on a stream
brief:                  |
                        One JSON object per line on a byte stream,
                        standard input and output for a local engine
                        or a socket for a remote one, with a limit on
                        the length of a line. Readable in a terminal
                        and in a log, with a small parser in the
                        engine.

