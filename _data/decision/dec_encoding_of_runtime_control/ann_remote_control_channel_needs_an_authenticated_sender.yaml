title:                  Authenticated sender on a control channel that leaves the host
brief:                  |
                        Whoever can write to runtime control can stop
                        units or rewire the dynamic subgraph. Over
                        standard input and output only the process
                        that started the engine holds the pipe, which
                        is all the trial needed. Over a socket, as
                        JSON lines allow for a remote engine, anyone
                        who reaches the port can send a stop or an
                        apply, and the digest a request carries proves
                        nothing about its sender, since the graph is
                        public. ZeroMQ's CURVE mechanism can
                        authenticate a client by its public key and
                        encrypts the link, while JSON lines, or frames
                        sent on a socket, must get the same from TLS,
                        a secure shell or a code of their own.
description:            |
                        Sources:
                        - The engine has no safety or security
                          requirements of its own, but
                          must let the systems it runs meet theirs.
                          (_data/logical_component/lco_dataflow_engine.yaml at description)
                        - No option on checking a change set says who
                          may send one, and the
                          engine should let a system require an authenticated sender.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_sender_and_its_record_unstated.yaml
                          at brief)
                        - A digest match shows which graph was meant,
                          not who sent the
                          request, since anyone can compute the digest of a public graph.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_proves_neither_content_nor_sender.yaml
                          at brief)
                        - A stop of one unit can stall a safety
                          function in a neighbor while
                          it is reported as running, and whoever can send runtime control
                          requests gains a quiet way to cause that.
                          (_data/decision/dec_scope_of_stop_and_start/ann_stopped_unit_stalls_readers_and_writers_alike.yaml
                          at brief)
                        - CURVE gives secure authentication and
                          confidentiality between a
                          client and a server, authenticating clients by their long-term
                          public keys when the server chooses to (libzmq API, zmq_curve,
                          https://libzmq.readthedocs.io/en/latest/zmq_curve.html).
                        - The trial's deployer reached the engine only
                          through the pipes of
                          a child process. (trial 2c777ab9, src/cctool/dataflow/deploy.py,
                          class Engine)
                        ASSUMPTION: a pipe is open only to the
                        processes that hold its descriptors, so a
                        local engine needs no authentication of its
                        own. Strength: moderate; it bears only on an
                        engine controlled from another host, and falls
                        away if remote control always runs through the
                        pipe of a secure shell.

