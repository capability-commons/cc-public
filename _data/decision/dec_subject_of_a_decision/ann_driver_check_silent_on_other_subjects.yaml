title:                  Silent pass of the driver check
brief:                  |
                        Nothing makes a decision be about a logical
                        component. If one is not, the driver check
                        reports no missing driver, so a determination
                        can look fully argued when no driver was
                        looked at.
description:            |
                        r_is_about has no range (reg_relation.yaml
                        lines 167-172). range_violation fires only
                        when a range exists (check.lp lines 282-286).
                        missing_about accepts a subject of any type
                        (check.lp lines 296-301). unargued_driver
                        needs r_is_driven_by on the subject (check.lp
                        lines 448-453). Both current decisions are
                        about lc_tooling, so no wrong result has
                        occurred.

