title:                  Silent pass of the driver check
brief:                  |
                        Nothing makes a decision be about a logical
                        component. If one is not, the driver check
                        reports no missing driver, so a ruling can
                        look fully argued when no driver was looked
                        at.
description:            |
                        relation_is_about has no range
                        (reg_relation.yaml at
                        entries.relation_is_about.description).
                        range_violation fires only when a range exists
                        (check.lp within parameter_member).
                        missing_about accepts a subject of any type
                        (check.lp within parameter_member).
                        unargued_driver needs relation_is_driven_by on
                        the subject (check.lp within satisfies). Both
                        current decisions are about lco_tooling, so no
                        wrong result has occurred.

