title:                  Realization edges now many and read
brief:                  |
                        The annotation says the only relation_realizes
                        edge is pyp_cctool to lco_tooling, and that no
                        check or query reads the relation. Now there
                        are 11 such edges, and a check and the review
                        pages read them.
description:            |
                        Edges of relation_realizes: pyp_cctool to
                        lco_tooling (src/cctool/__init__.py), seven
                        from src/cctool/check/check.py to members of
                        icd_cctool_check, such as
                        icm_cctool_check.check, and three in
                        8a40b7e7:_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                        to icd_printer and to the interface documents
                        of the process controller and the system
                        controller, since removed. realized_function
                        (src/cctool/check/check.lp within
                        parameter_member) reads the relation, and
                        parameter_mismatch and signature_mismatch use
                        it. src/cctool/web/page.py shows which members
                        code realizes. Still only lco_tooling has a
                        realizing item among the logical components.
                        Found in the review of 2026-10-22.

