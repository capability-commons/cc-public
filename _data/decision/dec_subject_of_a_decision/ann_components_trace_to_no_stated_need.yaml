title:                  Components with no stated need
brief:                  |
                        Without functions, a component's reason to
                        exist is held only in its prose brief, so the
                        trace stops one step short of the need. Option
                        C would close that step.
description:            |
                        No function, need or requirement type exists
                        (reg_data_item_type.yaml). lco_tooling states
                        what it does only in its brief
                        (lco_tooling.yaml at brief). Concerns are
                        matters of interest such as security or
                        reliability (reg_concept.yaml at
                        entries.concept_concern.title and
                        entries.concept_concern.brief), which a
                        component should favor (reg_relation.yaml),
                        not functions. The proposal called functions
                        "even more stable subjects than components"
                        (notes/arcadia-decision-subjects.md line 40).
                        Weak now; it argues for C later, not against
                        B.

