title:                  Check now on the subject of a decision
brief:                  |
                        The annotation says nothing makes a decision
                        be about a logical component, and that
                        relation_is_about has no range. Now
                        decision_about_non_component reports a
                        decision about anything else, and relations
                        have no domain or range.
description:            |
                        decision_about_non_component
                        (src/cctool/check/check.lp within
                        decision_about_non_component) reports a
                        decision whose relation_is_about target is not
                        of type_logical_component, so the driver check
                        can no longer pass silently on another
                        subject.
                        test_a_decision_about_other_than_a_component_is_reported
                        (src/cctool/check/_test/test_check.py within
                        test_a_decision_about_other_than_a_component_is_reported)
                        covers it. _data/register/reg_relation.yaml
                        holds no domain or range field, and
                        src/cctool/check/check.lp has no
                        range_violation. Relation ends are governed by
                        relation constraints over roles, which
                        constraint_violation checks (check.lp within
                        constraint_violation). Found in the review of
                        2026-10-22.

