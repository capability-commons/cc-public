title:                  Drivers attached only to logical components
brief:                  |
                        The check for unargued drivers follows an
                        decision to its subject and then to the
                        concerns that drive it, and only a logical
                        component can hold drivers. A package or a
                        concept subject would give the check nothing
                        to find.
description:            |
                        relation_is_driven_by has domain
                        type_logical_component only (reg_relation.yaml
                        lines 409-438). unargued_driver in check.lp
                        lines 448-453. A rewrite would remove
                        pyp_cc_public and so end the chain (owner's
                        statement, 2026-10-14T18:15:48Z).
                        relation_is_driven_by came later, in 3d7ef5b,
                        so this was not part of the owner's reason.
                        ASSUMPTION: its domain could have been set to
                        another type had another subject been chosen.
                        Merged from the functional suitability and
                        traceability advocates.

