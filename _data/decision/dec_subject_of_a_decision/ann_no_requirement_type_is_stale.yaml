title:                  Requirement type now present
brief:                  |
                        The annotation says no function, need or
                        requirement type exists. Now type_requirement
                        exists, and three requirements name
                        lco_tooling as their subject.
description:            |
                        type_requirement is in
                        _data/register/reg_data_item_type.yaml (line
                        976): "Each requirement data item is one
                        obligation on a system or system element, its
                        subject". _data/requirement holds
                        rqt_edit_refuses_new_failure,
                        rqt_format_keeps_formatted_file and
                        rqt_rename_keeps_guid, each with a
                        relation_has_subject edge to lco_tooling.
                        relation_has_subject takes
                        relcon_is_design_entity at its target. No
                        function type exists yet. Found in the review
                        of 2026-10-22.

