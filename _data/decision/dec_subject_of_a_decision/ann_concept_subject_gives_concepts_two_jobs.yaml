title:                  Concepts with two jobs
brief:                  |
                        A concept subject adds no mechanism, but it
                        makes a concept both define a term and stand
                        for a part of the system that decisions are
                        about.
description:            |
                        A concept item defines one concept and its
                        preferred term (reg_data_item_type.yaml lines
                        291-298), following ISO 1087 (reg_concept.yaml
                        line 19). The options note says it "would blur
                        the term-and-concept distinction"
                        (notes/arcadia-decision-subjects.md line 30).
                        ASSUMPTION: drivers would also need a home
                        under A, a third job or a new mechanism; A was
                        not built.

