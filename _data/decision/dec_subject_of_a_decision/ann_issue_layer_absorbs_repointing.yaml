title:                  Issue layer that took most of the saving
brief:                  |
                        Since options answer an issue and only issues
                        are about a component, a rewrite under the
                        package subject would re-point only the
                        issues, two items today, not every option and
                        annotation.
description:            |
                        Commit 1ba2895 replaced r_is_about on options
                        with r_is_option_for. In the current tree 29
                        items are about an issue and 2 are about
                        lc_tooling (dec_tooling_language.yaml line 20,
                        dec_cross_item_checks_engine.yaml line 20).
                        The issue layer came about four and a half
                        hours after the choice (f4cb721 at 18:31,
                        52e3e6d at 23:02 and 1ba2895 at 23:17 on
                        2026-10-14). The cost still grows with the
                        number of issues about one component.

