title:                  Drivers now open to any design entity
brief:                  |
                        The annotation says relation_is_driven_by has
                        domain type_logical_component only. Now
                        relations have no domain, and the source of
                        relation_is_driven_by may be any design
                        entity.
description:            |
                        relation_is_driven_by constrains its source
                        with relcon_is_design_entity
                        (_data/register/reg_relation.yaml lines
                        452-495). That constraint admits
                        rol_design_entity
                        (_data/register/reg_relation_constraint.yaml
                        line 212), which type_logical_component,
                        type_interface_control_document and
                        type_interface_member play
                        (_data/register/reg_data_item_type.yaml). A
                        decision must still be about a logical
                        component (decision_about_non_component,
                        src/cctool/check/check.lp line 1334). Found in
                        the review of 2026-10-22.

