title:                  Realization closed to registers and schemas
brief:                  |
                        relation_realizes accepts only source-file
                        items, so a component built mostly from
                        registers and schemas, such as
                        lco_argumentation, cannot record what realizes
                        it.
description:            |
                        relation_realizes domain: type_python_package,
                        type_python_module, type_logic_program_file,
                        type_file (reg_relation.yaml lines 343-347).
                        type_register and type_schema are separate
                        types (reg_data_item_type.yaml lines 98 and
                        146). type_file excludes data items (lines
                        658-662). lco_argumentation.yaml lines 12-15.
                        The deviation was told to WTP (memory
                        arcadia-terminology.md).

