title:                  Realization closed to registers and schemas
brief:                  |
                        r_realizes accepts only source-file items, so
                        a component built mostly from registers and
                        schemas, such as lco_argumentation, cannot
                        record what realizes it.
description:            |
                        r_realizes domain: t_python_package,
                        t_python_module, t_logic_program_file, t_file
                        (reg_relation.yaml lines 343-347). t_register
                        and t_schema are separate types
                        (reg_data_item_type.yaml lines 98 and 146).
                        t_file excludes data items (lines 658-662).
                        lco_argumentation.yaml lines 12-15. The
                        deviation was told to Will (memory
                        arcadia-terminology.md).

