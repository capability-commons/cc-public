title:                  Functions with no decision that needs them
brief:                  |
                        Option C adds a function type and an
                        allocation relation that no decision yet
                        points at. Deferring them saves the build and
                        keeps the change to what it needs.
description:            |
                        Option C adds a function type and allocation
                        on top of B
                        (notes/arcadia-decision-subjects.md line 40).
                        Deferred "until a decision needs a function as
                        its subject" (memory arcadia-terminology.md).
                        Option B alone was 6 files and 180 lines
                        (f4cb721). ASSUMPTION: C costs at least as
                        much again. Holds until a decision needs a
                        function as its subject. Merged from the cost,
                        reviewability and simplicity advocates.

