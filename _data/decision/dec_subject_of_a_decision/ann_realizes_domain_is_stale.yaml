title:                  Realization now governed by a role
brief:                  |
                        The annotation gives relation_realizes a
                        domain of four source-file types. Now
                        relations have no domain: the source must play
                        rol_implementation, which nine types play.
                        Registers and schemas still play no such role,
                        so the point stands.
description:            |
                        relation_realizes constrains its source with
                        relcon_is_implementation and its target with
                        relcon_is_design_entity
                        (_data/register/reg_relation.yaml at
                        entries.relation_realizes and
                        entries.relation_upholds).
                        relcon_is_implementation admits
                        rol_implementation
                        (_data/register/reg_relation_constraint.yaml
                        at entries.relcon_is_implementation). The
                        types that play it are type_python_module,
                        type_python_package, type_logic_program_file,
                        type_file, type_python_class,
                        type_python_function, type_dataflow_node,
                        type_shell_script and
                        type_logic_program_predicate
                        (_data/register/reg_data_item_type.yaml).
                        type_register and type_schema are not among
                        them. Found in the review of 2026-10-22.

