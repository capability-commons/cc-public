title:                  Decision layer that took most of the saving
brief:                  |
                        Since options are offered for a decision and
                        only decisions are about a component, a
                        rewrite under the package subject would
                        re-point only the decisions, two items today,
                        not every option and annotation.
description:            |
                        Commit 1ba2895 replaced relation_is_about on
                        options with relation_is_option_for. In the
                        current tree 29 items are about a decision and
                        2 are about lco_tooling
                        (_data/decision/dec_tooling_language/dec_tooling_language.yaml
                        at edge.0,
                        _data/decision/dec_cross_item_checks_engine/dec_cross_item_checks_engine.yaml
                        at edge.0). The decision layer came about four
                        and a half hours after the choice (f4cb721,
                        52e3e6d and 1ba2895 on 2026-10-14). The cost
                        still grows with the number of decisions about
                        one component.

