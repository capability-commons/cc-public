title:                  One realization edge per rewrite
brief:                  |
                        With a logical component as subject, a rewrite
                        moves one r_realizes edge to the new code.
                        With the package as subject, it re-points one
                        subject edge per issue about the package,
                        mixed into the rewrite change.
description:            |
                        The move from pyp_cc_public to lc_tooling
                        re-pointed 9 items, 18 lines in 9 files
                        (commit 75475b6). Realization is one edge in
                        src/cc_public/__init__.py lines 22-27.
                        reg_relation.yaml lines 336-341: when an
                        implementation is replaced, the new one
                        realizes the same logical component.
                        notes/arcadia-decision-subjects.md lines 5 and
                        38. Merged from the cost and reviewability
                          advocates.

