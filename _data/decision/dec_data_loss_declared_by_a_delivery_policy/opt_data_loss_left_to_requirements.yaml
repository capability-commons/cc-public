title:                  Data loss left to requirements
brief:                  |
                        Policies declare nothing about data loss. A
                        requirement that forbids loss on an edge is
                        checked by tests, as other requirements are.
description:            |
                        Keeps the policy list as it is. Loss then
                        shows only where a test looks for it.

