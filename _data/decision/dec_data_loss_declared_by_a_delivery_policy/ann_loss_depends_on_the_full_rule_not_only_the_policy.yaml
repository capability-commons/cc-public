title:                  Loss that depends on the full rule, not only the policy
brief:                  |
                        A yes or no on each policy is too coarse. A
                        latest-value latch loses data by design; an
                        in-order queue loses nothing unless it fills
                        and its rule for when it is full drops; a fold
                        loses each value but keeps their summary. The
                        declaration must therefore say at least never,
                        by design, or only on overflow, and read the
                        full rule of the edge. This does not favor
                        leaving loss to requirements, but the option
                        to declare loss needs that refinement to be
                        right.
description:            |
                        Sources:
                        - The fixed list includes every value in order
                          up to a stated capacity with a stated rule
                          for when it is full, the latest value, and a
                          fold.
                          (_data/decision/dec_edge_policy/opt_named_delivery_policy_on_edge_now.yaml
                          at brief)
                        - The option declares whether each entry can
                          lose data.
                          (_data/decision/dec_data_loss_declared_by_a_delivery_policy/opt_each_policy_declares_data_loss.yaml
                          at brief)
                        - Overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                          Strength: moderate; it changes the form of
                          the field, not whether to have one.

