title:                  Loss declaration that maps to the DDS reliability setting
brief:                  |
                        DDS and ROS 2 state per endpoint whether
                        delivery may lose samples, as best effort or
                        reliable, and how many are kept, as keep last
                        with a depth or keep all. A loss declaration
                        on each policy gives a gateway to such a
                        partner a value to set and compare, so a check
                        can refuse an edge that forbids loss but
                        crosses to a best-effort endpoint. Leaving
                        loss to requirements gives the gateway nothing
                        to match.
description:            |
                        Sources:
                        - ROS 2 quality of service offers best effort,
                          which may lose samples, and reliable, which
                          retries until they are delivered, alongside
                          keep last with a depth and keep all
                          (https://design.ros2.org/articles/qos).
                        - A declared policy gives a gateway to a DDS
                          partner a stated policy to set and match.
                          (_data/decision/dec_edge_policy/ann_declared_policy_matches_dds_quality_of_service.yaml
                          at brief)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                          ASSUMPTION: Patrol or a later user will
                          exchange data with ROS 2 or DDS nodes
                          through gateways. Strength: moderate; it
                          grows with the number of DDS-facing
                          boundaries and is nil without one.

