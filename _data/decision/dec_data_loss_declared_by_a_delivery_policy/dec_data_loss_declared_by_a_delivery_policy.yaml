title:                  Data loss declared by a delivery policy
brief:                  |
                        Should each entry in the list of delivery
                        policies declare whether it can lose data, so
                        that checks can find where data is lost?
description:            |
                        A latest-value latch loses data by design,
                        while a waiting, ordered read does not. The
                        four data-flow errors of PN-DO (2018),
                        missing, inconsistent, redundant and lost
                        data, give a checklist cctool could apply to a
                        graph.

