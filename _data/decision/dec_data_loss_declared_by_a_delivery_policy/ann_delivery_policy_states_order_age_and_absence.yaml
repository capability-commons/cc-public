title:                  Delivery policy that states order, age and absence
brief:                  |
                        Whether a policy can lose data is one of four
                        things a consumer needs to know about it. The
                        others are whether order is kept, how old a
                        value may be, and how no new value is shown. A
                        queue keeps order and every item, latest value
                        drops the values between, sample at step maps
                        what arrived to the step's list, and hold
                        repeats an old value, which a consumer must be
                        able to tell from a new one. A check for lost
                        data can then also find a consumer that reads
                        a held value as fresh.
description:            |
                        Sources:
                        - Heterogeneous composition has no golden rule
                          for combining actors with different tag
                          sets, and needs explicit conversion such as
                          forgetting tags, timestamping by a clock or
                          holding values (Lee and Matsikoudis 2008,
                          Actors without directors: a Kahnian view of
                          heterogeneous systems, section 4.1).
                        - Each event is a value and a tag (Lee and
                          Sangiovanni-Vincentelli 1998, A framework
                          for comparing models of computation).
                        - A plain bounded list does not by itself
                          distinguish simultaneous events, ordering,
                          age or absence; those meanings need an
                          interface contract (ChatGPT corpus analysis,
                          A-actors.md section A5, 2026-10-28).

