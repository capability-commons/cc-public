title:                  Lost data found by a check, not only by a test
brief:                  |
                        With one message per Kahn edge per step and
                        one fixed list of delivery policies, whether
                        an edge can lose data is a property of its
                        policy and the graph, which a cheap graph
                        check decides for every edge. A test finds
                        loss only where it looks, as the option to
                        leave loss to requirements says, and a
                        latest-value latch loses data only when its
                        producer outruns its consumer, which a test at
                        nominal rate never sees. The evidence leans
                        toward declaring loss on each policy.
description:            |
                        Sources:
                        - Lost data is data overwritten before it is
                          read (Xiang et al. 2018, Detecting data-flow
                          errors based on Petri nets with data
                          operations, definitions of the four errors).
                          The paper finds it by searching a
                          reachability graph; the note on it judges
                          that under one message per edge per step the
                          check needs no such search.
                          (/mnt/project-files/notes/literature/round-2/2018-data-flow-errors-petri-nets-data-operations.md)
                        - Loss then shows only where a test looks for
                          it.
                          (_data/decision/dec_data_loss_declared_by_a_delivery_policy/opt_data_loss_left_to_requirements.yaml
                          at description)
                        - A dataflow edge carries a delivery policy
                          named from a fixed list.
                          (_data/decision/dec_edge_policy/ruling_named_delivery_policy_on_edge_now.yaml
                          at brief)
                        - Kahn edges are homogeneous SDF, one message
                          per edge per step (WTP, 2026-10-28).
                          ASSUMPTION: requirements that forbid loss
                          are linked to edges, so the check knows
                          which edges to hold to it. Strength: strong
                          for latches and crossings; it says nothing
                          about loss inside node code.

