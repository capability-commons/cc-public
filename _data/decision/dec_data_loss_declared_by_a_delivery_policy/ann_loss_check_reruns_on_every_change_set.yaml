title:                  Loss check that reruns on every change set
brief:                  |
                        A field written once on each policy entry
                        keeps working as graphs change: a new policy
                        is classified once, and every edge that uses
                        it is covered. A deployment may apply any
                        change set that checks against the running
                        graph, so a change that puts a latch on an
                        edge whose requirement forbids loss is refused
                        before it runs. Under the option to leave loss
                        to requirements, each such change needs its
                        tests rerun or rewritten, which cannot happen
                        on the target before a change set is applied.
description:            |
                        Sources:
                        - A deployment may apply any change set that
                          checks against the resolved dataflow graph
                          it is running.
                          (_data/decision/dec_runtime_mode_set/ruling_any_change_set_checked_against_the_running_graph.yaml
                          at brief)
                        - The option adds one field to each policy
                          entry, written once by the engine's authors.
                          (_data/decision/dec_data_loss_declared_by_a_delivery_policy/opt_each_policy_declares_data_loss.yaml
                          at description)
                        - Maintainability asks how readily a change
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                          ASSUMPTION: the target checks a change set
                          against the graph but runs no tests before
                          applying it. Strength: strong while runtime
                          change sets are allowed; weaker if every
                          change goes through a full test cycle
                          first.

