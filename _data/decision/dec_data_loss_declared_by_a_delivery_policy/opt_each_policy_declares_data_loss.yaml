title:                  Each policy declares whether it can lose data
brief:                  |
                        Each entry in the list of delivery policies
                        declares whether it can lose data, and cctool
                        checks a graph for the four data-flow errors:
                        an input that may be missing, values that may
                        be inconsistent, data written that nothing
                        reads, and data that may be lost on an edge
                        whose requirement forbids it.
description:            |
                        Proposed from the second round of reading
                        (2026-10-28). It adds one field to each policy
                        entry, written once by the engine's authors,
                        and nothing to node code.

