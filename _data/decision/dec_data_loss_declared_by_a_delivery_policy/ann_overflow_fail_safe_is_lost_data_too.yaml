title:                  Overflow fail-safe as a second place data is lost
brief:                  |
                        A port that overflows and drops the excess
                        loses data as surely as a latch does, and so
                        does an actor input that drops an unexpected
                        message. These losses come from a port's
                        fail-safe, not from the edge's delivery
                        policy, so a declaration on the policy alone
                        leaves them out, and a check built on it would
                        report an edge as lossless when its port can
                        drop. Declaring loss still beats leaving it to
                        tests, but the check must read the fail-safe
                        of each port as well.
description:            |
                        Sources:
                        - Each port may declare its fail-safe from a
                          fixed list, such as drop the excess items
                          and raise a fault.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/opt_fail_safe_declared_per_port.yaml
                          at brief)
                        - Overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                        - In MillWheel, the Zeitgeist application
                          drops late data while counting how much it
                          dropped (Akidau et al. 2013, MillWheel:
                          fault-tolerant stream processing at internet
                          scale, section 4.5).
                        - Akka drops an unmatched actor message and
                          Erlang buffers it, a tradeoff the authors
                          name between races and memory leaks
                          (Prokopec and Odersky 2016, Reactors,
                          channels, and event streams for composable
                          distributed programming, section 2); with
                          bounded buffers only the drop remains, as
                          the note on the paper concludes.
                          (/mnt/project-files/notes/literature/round-2/2016-reactors-channels-event-streams.md)
                        - Traceability asks whether each need can be
                          traced to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1)
                          Strength: moderate; it holds whichever
                          fail-safe option is ruled, unless overflow
                          blocks the producer.

