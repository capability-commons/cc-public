title:                  Lossy edge traced to a requirement that accepts loss
brief:                  |
                        With loss declared, a check can require each
                        edge whose policy can lose data to link to a
                        requirement that accepts the loss, so every
                        latch has a stated reason. Under the option to
                        leave loss to requirements, only edges whose
                        requirement forbids loss are traced, and an
                        edge that loses data with no requirement
                        either way exists with no reason recorded. The
                        evidence leans toward declaring loss.
description:            |
                        Sources:
                        - A latest-value latch loses data by design,
                          in the sense of lost data in Xiang et al.
                          2018; the note on that paper recommends that
                          each policy declare whether it may lose data
                          and that lossy policies be allowed only
                          where the edge says so, for example on
                          crossings from actor to Kahn or on edges
                          whose requirement accepts loss.
                          (/mnt/project-files/notes/literature/round-2/2018-data-flow-errors-petri-nets-data-operations.md)
                        - Nondeterminism should be the express intent
                          of the designer, not forced by the framework
                          (Lohstroh et al. 2021, Toward a Lingua
                          Franca for deterministic concurrent systems,
                          section 5).
                        - Under the requirements option, a requirement
                          that forbids loss on an edge is checked by
                          tests.
                          (_data/decision/dec_data_loss_declared_by_a_delivery_policy/opt_data_loss_left_to_requirements.yaml
                          at brief)
                        - Traceability counts elements with no traced
                          reason. (_data/register/reg_concern.yaml at
                          entries.concern_traceability.measure.0)
                          Strength: moderate to strong; it costs one
                          link per lossy edge, and the Patrol drafts
                          already name a policy on their edges.
                          (_data/decision/dec_edge_policy/ann_patrol_drafts_use_named_policy_only.yaml
                          at brief)

