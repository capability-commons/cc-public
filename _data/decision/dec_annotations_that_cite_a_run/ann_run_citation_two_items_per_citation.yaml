title:                  Two items to write and read per run citation
brief:                  |
                        The split doubles the annotations to write,
                        merge, verify and read for each run citation,
                        and the owner has already rejected keeping a
                        dated condition as its own annotation because
                        its own id bought nothing. Keeping the measure
                        in the run record, or in the one citing
                        annotation, keeps a citation to one item.
description:            |
                        Sources:
                        - Ruled: a condition is stated inside the
                          argument that rests on it, and the one
                          condition kept as its own annotation "went
                          stale and was never challenged, so its own
                          id bought nothing".
                          (_data/decision/dec_changing_conditions_in_arguments/ruling_changing_conditions_in_arguments.yaml
                          lines 12-23 and the edges below them)
                        - Arguments come from one agent per driver
                          concern, then a merge step and a verifier.
                          (_data/decision/dec_concern_advocate_process/ruling_concern_advocate_process.yaml
                          lines 12-21)
                        - The tree holds 1762 annotations. (count of
                          annotation files under _data/decision in the
                          snapshot)
                        - Reviewability measures changes awaiting
                          review, by count; cost measures development
                          effort in person days.
                          (_data/register/reg_concern.yaml lines 530
                          and 611-617)
                        - Assumption: the effort to write, merge,
                          verify and read grows with the number of
                          annotations. Strength: moderate; the extra
                          items scale with run citations. It is weaker
                          where one measured claim is cited by several
                          interpreting annotations, since that fact is
                          then written and reviewed once.

