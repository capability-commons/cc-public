title:                  A doubt about a run with a target of its own
brief:                  |
                        A doubt about a run may be about the number or
                        about what the number means, and only the
                        split option gives each its own target. One
                        combined annotation takes both doubts, and a
                        run record, which is not an annotation or an
                        option, cannot be the target of a challenge
                        under the present role rules, so with the
                        measure only in the record both doubts land on
                        the interpreting annotation.
description:            |
                        Sources:
                        - A challenge targets "the annotation or
                          option identified by TARGET".
                          (_data/register/reg_relation.yaml at entries.relation_challenges)
                        - Only the types that play the argument-target
                          role can be targeted, and the annotation and
                          option types play it.
                          (_data/register/reg_data_item_type.yaml at entries.type_annotation.edge.2.id_target and entries.type_option.edge.1.id_target;
                          _data/register/reg_relation_constraint.yaml at entries.relcon_can_be_target_of_an_argument)
                        - "An annotation that bears only on other
                          annotations speaks for none: it is a matter
                          of fact, answered with evidence".
                          (_data/register/reg_relation.yaml at entries.relation_speaks_for_concern.description)
                        - Assurance 2.0 derives a useful claim from a
                          measured claim by a substitution step, and
                          defeaters are refuted, with a refuted one
                          kept as commentary, or accepted as residual
                          risk.
                          (https://www.csl.sri.com/~rushby/papers/a2nutshell.pdf,
                          read by the traceability advocate;
                          _sources/survey/simulation-backed-decisions.md
                          line 111) Strength: moderate; it holds at
                          any number of runs and grows with challenged
                          runs. It fails for the run-record option
                          only if the run type is given the target
                          role.

