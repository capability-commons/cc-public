title:                  Measured values held in two places
brief:                  |
                        If the run record already holds a table of
                        named measures, a measured-claim annotation
                        restates numbers the record holds, and the two
                        can disagree. The split is sound only if the
                        measured claim cites a measure by name and
                        does not copy its value, or a check compares
                        them.
description:            |
                        Sources:
                        - The proposed run item holds "its outputs as
                          a table of named measures".
                          (_data/decision/dec_shape_of_a_dataflow_run/opt_run_item_in_the_tree.yaml
                          lines 12-18)
                        - The measured-claim annotation "states what a
                          run measured".
                          (_data/decision/dec_annotations_that_cite_a_run/opt_measured_claim_and_interpreting_annotation.yaml
                          lines 12-18)
                        - Simplicity counts jobs done by more than one
                          mechanism. (_data/register/reg_concern.yaml
                          lines 489-490) Strength: moderate;
                          disagreements grow with runs. It does not
                          apply if run fields live only in
                          annotations, which is another open option
                          for the shape of a run.

