title:                  A citing annotation that a challenge can already target
brief:                  |
                        The split gives two reasons: a doubt should
                        hit the interpretation, not the option, and
                        the measure should speak for no concern. The
                        relations already allow the first with one
                        annotation, since a challenge may target an
                        annotation, and a run record that holds the
                        measure meets the second, so holding the
                        measure only in the record does each job in
                        one place.
description:            |
                        Sources:
                        - A challenge takes "the annotation or option
                          identified by TARGET".
                          (_data/register/reg_relation.yaml at entries.relation_challenges.description)
                        - An annotation that supports or challenges an
                          option speaks for at least one concern, and
                          one that bears only on annotations speaks
                          for none. (_data/register/reg_relation.yaml at entries.relation_speaks_for_concern.description)
                        - The proposed run item holds "its outputs as
                          a table of named measures".
                          (_data/decision/dec_shape_of_a_dataflow_run/opt_run_item_in_the_tree.yaml at brief)
                        - The one-annotation option states what a run
                          measured inside the citing annotation, so
                          where a run record exists the measure is
                          stated twice.
                          (_data/decision/dec_annotations_that_cite_a_run/opt_one_annotation_per_run_citation.yaml at brief)
                        - Simplicity counts jobs done by more than one
                          mechanism. (_data/register/reg_concern.yaml at entries.concern_simplicity.measure) Strength: strong at scale; at
                          ten times the runs, the measured-claim
                          option adds one annotation per citation for
                          no new capability. It assumes a run record
                          exists.

