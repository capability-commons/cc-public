title:                  Measured claim and interpreting annotation
brief:                  |
                        One annotation states what a run measured and
                        speaks for no concern, and a second interprets
                        it, speaks for a concern and supports or
                        challenges the option. A doubt about the run
                        challenges the interpreting annotation, not
                        the option.

