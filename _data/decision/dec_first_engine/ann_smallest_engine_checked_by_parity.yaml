title:                  Smallest first engine, checked by parity
brief:                  |
                        A generated frozen schedule is the smallest
                        engine that runs Patrol's first slice, a
                        straight list of direct calls that a newcomer
                        can read in the generated file. Its order is
                        fixed and deterministic, so a failed parity
                        run against detector_dump points at a node,
                        not at the runtime.
description:            |
                        Sources: "Generating plain C++ calls from a
                        validated dataflow graph is the smallest
                        working engine, and fits the first slice
                        (retiming) and analysis parity runs against
                        detector_dump"
                        (_sources/cc-patrol-notes/plan.md lines
                        103-105 and 206-207). The generated step is "a
                        straight-line list of direct calls in schedule
                        order"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 35-52), with types checked in the
                        generator before anything is compiled (same
                        file, line 59). The framework steps nodes in a
                        fixed, deterministic order
                        (_sources/axair-orchestrator/README.md lines
                        5-7). Each Patrol decomposition step ends with
                        detector_dump parity
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 172-177). Strength: strong; the
                        acceptance check for the first slice is named
                        and fits this option directly.

