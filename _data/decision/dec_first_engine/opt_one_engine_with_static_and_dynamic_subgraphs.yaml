title:                  One engine with static and dynamic subgraphs
brief:                  |
                        One engine runs a static subgraph, whose
                        schedule is generated as plain C++17 calls and
                        fixed at build time, and a dynamic subgraph,
                        whose nodes and edges may change at the start
                        of a step. Both share one node interface, one
                        form of edge buffer, one form of node state
                        and one step protocol from the first version,
                        so that neither part changes the shape of the
                        other.

