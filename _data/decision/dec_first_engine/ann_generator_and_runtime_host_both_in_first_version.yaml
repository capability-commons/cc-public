title:                  Generator and runtime host both in the first version
brief:                  |
                        The new option carries both the generator that
                        writes a fixed call list and the runtime host
                        that steps nodes through function pointers
                        from the first version, so one job, ordering
                        the calls of a step, has two mechanisms, and
                        each change to a shared contract must be
                        tested on the generated schedule, on the
                        runtime and across their crossing. That is
                        about three paths where a frozen-first engine
                        has one, by an owner who postponed dynamic
                        graphs before as too hard for a solo
                        developer. It argues for building the dynamic
                        part second within the one-engine shape, and
                        loading the static subgraph as one frozen
                        island would keep the two schedulers from
                        overlapping.
description:            |
                        Sources:
                        - The frozen level is a generated
                          straight-line list of direct calls; the
                          dynamic level is a generic host that steps
                          nodes through function pointers.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 33-40 and 61-68)
                        - A frozen subgraph can be exported as one
                          composite component and loaded as one node
                          of a dynamic graph, decided 2026-10-16.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 74-80)
                        - The dynamic host's loading, allocation,
                          wiring checks and stepping are each code to
                          test.
                          (_data/decision/dec_first_engine/ann_loading_and_wiring_code_to_test_first.yaml)
                        - Crossing between the subgraphs is an open
                          decision with three options.
                          (_data/decision/dec_crossing_between_static_and_dynamic/)
                        - Check tests break one thing and expect
                          exactly the failures of that fault.
                          (_data/decision/dec_test_style/ruling_test_style.yaml)
                          ASSUMPTION: the engine's C++ tests follow
                          the same discipline, so each path needs its
                          own fault cases.
                        - The owner postponed dynamic-graph
                          capabilities because they were "too
                          difficult for me to implement in the first
                          iteration as a solo dev". (owner's
                          statement, 2026-10-20) Strength: moderate
                          for maintainability; it does not grow with
                          node count, since the paths are engine code.
                          Moderate for simplicity; two schedulers at
                          any scale, overlapping or not as the
                          crossing decision goes.

