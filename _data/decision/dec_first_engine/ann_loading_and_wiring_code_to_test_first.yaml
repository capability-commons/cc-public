title:                  Loading, allocation and wiring code to test first
brief:                  |
                        A runtime that loads graphs needs dynamic
                        loading, buffer allocation from type tables,
                        wiring-time checks and stepping through
                        function pointers before it runs a first
                        graph. Each is code to test and debug, where
                        the frozen schedule needs a generator alone.
description:            |
                        Sources: The dynamic host dlopens component
                        libraries, allocates buffers from each
                        component's type table, checks every edge at
                        wiring time and steps nodes through function
                        pointers
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 63-68). The owner intends the engine to
                        gain the dynamic-graph capabilities he
                        postponed because they were "too difficult for
                        me to implement in the first iteration as a
                        solo dev" (owner's statement, 2026-10-20).
                        Strength: moderate; the owner wants the
                        dynamic level eventually, so the cost is
                        deferred, not avoided.

