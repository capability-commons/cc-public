title:                  Node-level recovery beside a fixed core
brief:                  |
                        One engine with both subgraphs lets a faulty
                        dynamic node be stopped, reset and rewired
                        between steps while the static subgraph keeps
                        its fixed, build-checked schedule. Neither
                        older option alone gives both per-node
                        recovery where the graph changes and no
                        in-service wiring faults where it does not.
                        The benefit is lost if the decision on
                        crossing lets a dynamic fault stall the static
                        schedule.
description:            |
                        Sources:
                        - In a frozen schedule a node can only be
                          switched off by its enable flag.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 35-40)
                        - The dynamic host starts, stops, restarts and
                          rewires only between steps, and refuses a
                          mismatched wiring.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 67 and 70-72)
                        - In the frozen case type checking happens in
                          the generator before anything is compiled.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 59)
                        - The owner wants one engine with a build-time
                          immutable schedule and a run-time mutable
                          schedule at once. (owner's statement,
                          2026-10-24 12:33Z) Strength: holds at ten
                          times the nodes; the more nodes, the more it
                          matters that one can be recovered without
                          restarting the rest.

