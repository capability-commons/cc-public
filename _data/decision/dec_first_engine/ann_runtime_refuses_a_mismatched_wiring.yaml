title:                  Runtime refusal of a mismatched wiring
brief:                  |
                        A runtime that loads a graph is not unsafe by
                        itself: the drafted host checks every edge
                        when it wires it and refuses a mismatch, and
                        it rewires only between steps, so a refused
                        change leaves the last consistent graph
                        running. It gives up build-time assurance but
                        keeps a defined fallback.
description:            |
                        Sources: The dynamic host checks every edge at
                        wiring time and refuses the change on a
                        mismatch
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 67). Start, stop, restart and rewire
                        happen only between steps, so a step always
                        sees a consistent graph and replay stays
                        deterministic (same file, lines 70-72).
                        ASSUMPTION: a refusal at wiring time leaves
                        the running system in its previous state
                        rather than partly wired. Strength: weak; the
                        check catches errors in service rather than
                        before deployment, and the frozen option makes
                        the same check earlier, in the generator.

