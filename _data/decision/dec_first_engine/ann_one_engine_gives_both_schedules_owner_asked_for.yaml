title:                  Both schedules the owner asked for, in the first version
brief:                  |
                        One engine with static and dynamic subgraphs
                        is the only option whose first version holds
                        both a schedule fixed at build time for static
                        nodes and a schedule that can change at run
                        time for dynamic nodes, which the owner asked
                        for together. Each older option provides one
                        of the two and leaves the other to a later
                        engine, which the owner warns is very hard to
                        change once in use.
description:            |
                        Sources:
                        - The owner wants "an engine that can support
                          all of these at once": a build-time
                          immutable schedule for static nodes and a
                          run-time mutable schedule for dynamic nodes.
                          (owner's statement, 2026-10-24 12:33Z)
                        - "it is VERY hard to change the engine once
                          it's built and you've started using it - so
                          it's best to get the shape right early on."
                          (owner's statement, 2026-10-24 12:33Z;
                          restated in
                          _data/decision/dec_first_semantics/ruling_first_semantics.yaml
                          lines 17-20)
                        - In a frozen schedule the only thing that can
                          change at run time is a per-node enable
                          flag.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 39-40)
                        - The loading runtime is "A C++ runtime that
                          loads a resolved dataflow graph and runs
                          it".
                          (_data/decision/dec_first_engine/opt_runtime_loads_graph.yaml,
                          brief) ASSUMPTION: its schedule is built
                          when the graph is loaded, so it offers no
                          build-time schedule for static nodes.
                        - The new option generates the static schedule
                          as plain C++17 calls fixed at build time and
                          lets the dynamic subgraph change at the
                          start of a step.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml,
                          brief) Strength: strong; it rests on the
                          owner's stated requirement, not on the size
                          of any graph.

