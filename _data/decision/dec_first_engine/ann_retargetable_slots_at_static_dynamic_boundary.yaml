title:                  Retargetable slots at the static boundary
brief:                  |
                        A static input fed by a dynamic node must read
                        through a slot that a change can repoint, so
                        it cannot be a link-time constant address, and
                        the optimizer loses that fold at each boundary
                        edge. The shared buffer form and step protocol
                        may also put indirections into the static part
                        that a frozen-only engine would not have. How
                        large the cost is rests on the decisions on
                        crossing between the subgraphs and on the form
                        of node state.
description:            |
                        Sources:
                        - In a frozen schedule each input slot is a
                          static const array entry, a link-time
                          constant address.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 38)
                        - A dynamic rewire is a pointer swap in a slot
                          array.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 70-71)
                        - The option requires one form of edge buffer,
                          one form of node state and one step protocol
                          for both parts.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 16-21)
                        - ASSUMPTION: a slot that may be repointed at
                          run time is read through a pointer load the
                          compiler cannot fold away. Strength:
                          moderate; the cost grows with the number of
                          boundary edges, not with the number of
                          static nodes.

