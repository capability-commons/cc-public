title:                  Seam where a dynamic fault can reach the static schedule
brief:                  |
                        Joining both subgraphs in one step protocol,
                        and possibly one process, lets a dynamic node
                        that hangs, faults or is refused mid-change,
                        or a fault in the loading machinery, end the
                        step for static nodes or write into their
                        buffers. The static core is only as reliable
                        and as safe as the rule that keeps dynamic
                        faults out of it, which rests on the still
                        open decisions on how values cross between the
                        subgraphs and where mutability is declared.
description:            |
                        Sources:
                        - The generated proc_step returns as soon as
                          one node returns a signal other than
                          continue_ok, so the nodes after it do not
                          run in that step.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 46-50)
                        - The system controller halts the whole system
                          when a process reports an exception.
                          (_data/interface_control_document/icd_system_controller.yaml
                          lines 21-24)
                        - Both parts share one node interface, edge
                          buffer form, state form and step protocol.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml,
                          brief)
                        - Within one process, edges are plain shared
                          buffers.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 124-125)
                        - How values cross between the two parts is an
                          open decision.
                          (_data/decision/dec_crossing_between_static_and_dynamic/dec_crossing_between_static_and_dynamic.yaml)
                        - ASSUMPTION: dynamic nodes are more likely to
                          fault in service, because their wiring is
                          checked in service; nodes of both subgraphs
                          may share one address space unless placement
                          keeps them apart. Strength: moderate; it
                          grows with the size of the dynamic subgraph
                          and the number of changes applied, and falls
                          away where placement puts the two parts in
                          separate processes. A condition on the
                          option, not a reason to reject it.

