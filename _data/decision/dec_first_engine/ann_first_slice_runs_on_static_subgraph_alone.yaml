title:                  First slice run on the static subgraph alone
brief:                  |
                        Patrol's first slice and its detector_dump
                        parity runs need only a generated schedule,
                        which the new option holds as its static
                        subgraph, so the new option can meet the first
                        acceptance check before the dynamic machinery
                        is finished. The caveat is that the dynamic
                        part's acceptance checks cannot be written
                        until the several open decisions it depends on
                        are ruled.
description:            |
                        Sources:
                        - "Generating plain C++ calls from a validated
                          dataflow graph is the smallest working
                          engine, and fits the first slice (retiming)
                          and analysis parity runs against
                          detector_dump".
                          (_sources/cc-patrol-notes/plan.md lines
                          103-105 and 206-207)
                        - Each Patrol decomposition step ends with
                          detector_dump parity.
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 173-177)
                        - The new option's static schedule is
                          generated as plain C++17 calls.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml,
                          brief)
                        - What the dynamic part must do is open in at
                          least six decisions: crossing between static
                          and dynamic, change sets, form of node
                          state, swap of a node version, crossing
                          between Kahn and actors, and replay with
                          live changes. (_data/decision/, no ruling
                          files in those folders)
                        - ASSUMPTION: a graph whose dynamic subgraph
                          is empty is a valid configuration under the
                          new option. Strength: moderate; it answers
                          the smallest-engine argument for the frozen
                          option, but rests on an assumption the
                          option does not state.

