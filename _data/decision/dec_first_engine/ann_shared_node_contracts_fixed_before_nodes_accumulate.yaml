title:                  Shared contracts fixed before node code accumulates
brief:                  |
                        The new option fixes one node interface, one
                        edge buffer, one state form and one step
                        protocol from the first version. A change to
                        any of these after nodes exist touches every
                        node, and the frozen option as recorded does
                        not commit to the state form and step protocol
                        that swap, upgrade and rewire need, so they
                        could be found wanting after nodes are
                        written, although the drafts already sketch a
                        shared state block.
description:            |
                        Sources:
                        - The option shares one node interface, one
                          form of edge buffer, one form of node state
                          and one step protocol from the first
                          version.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 13-21)
                        - "it is VERY hard to change the engine once
                          it's built and you've started using it - so
                          it's best to get the shape right early on."
                          (owner's statement, 2026-10-24)
                        - Every component exports the same C-linkage
                          reset, step and finalize functions, and the
                          framework owns all memory.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 21-39)
                        - A live swap needs node state the engine can
                          upgrade in place. (owner's statement,
                          2026-10-24) The frozen schedule's
                          state is static storage that only the
                          generated code addresses.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 35-40) The frozen option fixes a
                          schedule per OS process and says nothing of
                          state form or step protocol.
                          (_data/decision/dec_first_engine/opt_frozen_schedule_generated.yaml
                          lines 11-15) The drafts already make state a
                          single block the framework can snapshot or
                          zero.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 47-48) Strength: strong, and stronger
                          with scale: at ten times the nodes a late
                          change to a shared contract costs ten times
                          more, while fixing it early costs the same.
                          Distinct from the existing argument that a
                          frozen island can be loaded later into a
                          dynamic graph, which is about composing
                          islands, not about the contracts inside each
                          node.

