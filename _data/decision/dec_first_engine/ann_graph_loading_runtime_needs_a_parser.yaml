title:                  Parser dependency of a graph-loading runtime
brief:                  |
                        A frozen schedule is plain C++17 generated
                        ahead of time, so the first engine reads no
                        graph at run time. A runtime that loads a
                        graph must read the graph's format and load
                        component libraries, which is likely to bring
                        in a parser library or a hand-written parser
                        to maintain.
description:            |
                        Sources: The frozen schedule is a generated
                        .cpp of static storage and a straight-line
                        list of direct calls
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 33-40). The dynamic host dlopens
                        component libraries named in configuration and
                        wires them at run time (same file, lines
                        61-68). The items of the graph are YAML files
                        read with libyaml and ruamel.yaml
                        (src/cctool/graph/parse.py; pyproject.toml at
                        project.dependencies;
                        AGENTS.md#changing-data-items). ASSUMPTION: a
                        C++ runtime that reads a resolved graph would
                        use a third-party YAML or JSON library unless
                        the generator emits a format simple enough to
                        parse by hand. Strength: moderate; the added
                        dependency is likely but not certain.

