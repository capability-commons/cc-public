title:                  Schedule with nothing loaded or wired at run time
brief:                  |
                        A generated frozen schedule is fixed and
                        type-checked by the generator before anything
                        compiles, and only a per-node enable flag
                        changes while it runs. Faults a loading
                        runtime meets in service, such as a missing
                        library or a slot mismatch, become build
                        failures; no configuration can name code to
                        load; and the configuration that runs is fixed
                        at build time apart from which nodes are
                        enabled, so a safety case can cover the
                        deployed configuration.
description:            |
                        Sources: The generated file holds static
                        storage, link-time constant slot arrays and a
                        straight-line list of direct calls, each
                        guarded by a per-node enable flag, "the one
                        thing that can change at runtime"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 35-40). In the frozen case "Type
                        checking here happens in the generator, from
                        the specs, before anything is compiled" (same
                        file, line 59). The dynamic host dlopens
                        component libraries named in configuration,
                        allocates buffers from type tables, and checks
                        every edge at wiring time (same file, lines
                        63-68). Within a segment, topologies are known
                        and validated "so a safety case applies to the
                        same configuration that is deployed in
                        service", and reconfiguration should select
                        from a finite set of pre-validated modes (same
                        file, lines 169-171 and 212-215). The engine
                        must let the systems it runs meet their safety
                        and security requirements, to a reasonable
                        degree
                        (_data/logical_component/lco_dataflow_engine.yaml
                        lines 16-22; owner's statement
                        2026-10-22T20:19). Strength: strong for each
                        concern; the frozen form gives these
                        properties by construction rather than by
                        policy.

