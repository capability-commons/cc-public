title:                  Frozen start with the dynamic path kept open
brief:                  |
                        The owner wants dynamic-graph capabilities,
                        which a frozen schedule lacks, but Patrol's
                        first users choose variants by configuration
                        with no automatic switching. A frozen island
                        is designed to load later as one node of a
                        dynamic graph, so a frozen first engine is
                        kept, not thrown away, when the runtime comes.
description:            |
                        Sources: Owner's statement, 2026-10-20: the
                        engine is intended "to incorporate the
                        dynamic-graph capabilities I'd postponed in
                        the past". In a frozen schedule the only thing
                        that can change at runtime is a per-node
                        enable flag
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 40). Fallback to drawn-on video is a
                        configuration choice, with no automatic
                        switching for now
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 86-87). A frozen subgraph can be
                        exported as a composite component and loaded
                        as one node of a dynamic graph, decided
                        2026-10-16
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 74-80 and 219-220). Strength: moderate;
                        it rests on the first users' needs, and the
                        owner's wider goal still needs the runtime
                        later.

