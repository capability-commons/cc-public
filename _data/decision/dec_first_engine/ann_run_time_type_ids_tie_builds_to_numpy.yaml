title:                  Run-time type ids tied to one NumPy
brief:                  |
                        The dynamic host checks edges at wiring time
                        by a type id that is a hash of the NumPy dtype
                        description, so libraries built at different
                        times must agree on that description. A frozen
                        schedule is checked by the generator before
                        compiling and can leave the run-time header
                        out.
description:            |
                        Sources: The type id is the hash of the
                        canonical dtype description
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 98). The dynamic host checks every edge
                        at wiring time (same file, line 67). Frozen
                        islands, checked by the generator, can leave
                        the header out (same file, line 118). NumPy is
                        not among cc-public's declared dependencies
                        today (pyproject.toml at
                        project.dependencies). The type-id choice is
                        only tentatively decided (same file, lines
                        224-225). ASSUMPTION: NumPy's canonical dtype
                        string could change between NumPy versions;
                        not checked. Strength: weak.

