title:                  Generated C++17 for any toolchain
brief:                  |
                        A generated frozen schedule is plain C++17
                        calls over static storage, so it builds for
                        any target with a C++17 compiler, including
                        nvcc and boards without a dynamic loader, and
                        needs no runtime library ported to each
                        platform.
description:            |
                        Sources: A frozen process is a generated .cpp
                        with static storage and a straight-line list
                        of direct calls
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 35-40). C++17 is supported by every
                        toolchain likely to be met, including CUDA's
                        nvcc; targets are compute-rich Linux boards,
                        Jetson Orin Nano first and a Qualcomm board
                        later
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 155-158). The dynamic host loads
                        components with dlopen
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 65). ASSUMPTION: dlopen is a POSIX
                        interface, so a runtime that relies on it
                        needs another loader on a platform without
                        one. Strength: moderate; the generated
                        schedule has the fewer platform dependencies
                        of the two, but the named targets are Linux
                        boards, where dlopen is available.

