title:                  Running system that grows or shrinks its dynamic part
brief:                  |
                        The new option lets one deployed build keep a
                        fixed, generated core and add or remove nodes
                        as the load on it changes, without rebuilding
                        the core. A frozen-only engine needs a rebuild
                        for every such change, and a loading runtime
                        keeps a generated core only as frozen islands
                        loaded as nodes.
description:            |
                        Sources:
                        - The flexibility concern asks whether the
                          system can be scaled up or down as the load
                          changes. (_data/register/reg_concern.yaml
                          lines 349-352)
                        - Only the dynamic subgraph supports nodes and
                          edges added, moved or removed at the start
                          of a step. (owner's statement, 2026-10-24
                          12:33Z)
                        - In a frozen schedule only a per-node enable
                          flag changes at run time.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 39-40)
                        - Loosely coupled systems have variable
                          numbers of platforms, so a fixed topology
                          cannot be assumed.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 174-176) A frozen subgraph can be
                          loaded as one node of a dynamic graph. (same
                          file, lines 74-80) Strength: moderate; it
                          holds at ten times the systems, but the
                          first Patrol variants are chosen by
                          configuration with no automatic switching
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 86-87), so the need is later, not
                          first.

