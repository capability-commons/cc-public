title:                  Frozen schedule open to whole-program optimization
brief:                  |
                        A generated schedule is a straight list of
                        direct calls over static buffers whose
                        addresses are constant at link time, so with
                        LTO or a unity build the compiler can inline
                        small components and fold the pointer casts
                        away. A runtime that loads a graph calls each
                        node through a function pointer from a loaded
                        library, and the compiler cannot optimize
                        across that boundary.
description:            |
                        Sources: The generated file holds static
                        storage and static const slot arrays whose
                        addresses are constant at link time, and the
                        step is a straight list of direct calls
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 35-41). With -flto or a unity build the
                        optimizer sees every call and slot address as
                        a constant, and small components inline into
                        the schedule (same file, lines 54-57). The
                        dynamic host dlopens component libraries and
                        steps nodes through function pointers (same
                        file, lines 63-68). Patrol's nodes are native
                        C++ step functions, with no Python on the hot
                        path (_sources/cc-patrol-notes/plan.md lines
                        88-92). Strength: strong; per-step overhead is
                        lowest when the whole schedule is known to the
                        compiler.

