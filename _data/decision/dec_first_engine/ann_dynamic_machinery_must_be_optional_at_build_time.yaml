title:                  Dynamic machinery carried by a build that needs none
brief:                  |
                        The new option does not say that a system with
                        no dynamic nodes can build without the dynamic
                        machinery: the code loader, change-set intake
                        and checks, run-time allocation and later a
                        transport. Unless it can, every build carries
                        those dependencies and platform needs, and an
                        all-static system keeps a run-time path by
                        which its graph or code could be changed. The
                        option should state that an empty dynamic
                        subgraph builds the same engine as a generated
                        frozen schedule.
description:            |
                        Sources:
                        - The option says both parts share one
                          interface and protocol "from the first
                          version" and is silent on whether the
                          dynamic part can be left out of a build.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 12-21)
                        - A frozen process is a generated .cpp of
                          static storage, constant slot arrays and
                          direct calls.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 35-40)
                        - The dynamic host dlopens libraries named in
                          configuration, allocates buffers from type
                          tables and checks edges at wiring time.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 63-68) dlopen is specified by POSIX.
                          (https://pubs.opengroup.org/onlinepubs/9699919799/functions/dlopen.html)
                        - A runtime that reads a graph is likely to
                          need a parser library or a hand-written
                          parser.
                          (_data/decision/dec_first_engine/ann_graph_loading_runtime_needs_a_parser.yaml)
                        - Edges between hosts need a transport, "very
                          likely ZeroMQ".
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 126-128;
                          _sources/cc-patrol-notes/plan.md lines
                          168-171)
                        - The owner wants the engine to reach embedded
                          systems "where there may not be an OS at
                          all". (owner's statement, 2026-10-24 13:06Z)
                        - A frozen island can leave the optional
                          packet header out, a precedent for dropping
                          dynamic-only parts.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 118)
                        - CWE-427, Uncontrolled Search Path Element,
                          describes a product that searches for
                          resources in locations unintended actors may
                          control.
                          (https://cwe.mitre.org/data/definitions/427.html)
                        - ASSUMPTION: the dynamic part can be built as
                          a separate library that the static schedule
                          does not link; code absent from a build
                          cannot be reached by an attacker of that
                          build. Strength: strong for dependency risk,
                          since more systems will be static-only
                          embedded builds; moderate for flexibility
                          and security. A condition the option can
                          meet cheaply if stated now, not a reason to
                          reject it.

