title:                  Node code placed static on a bare target and dynamic on Linux
brief:                  |
                        With one node interface for both subgraphs,
                        the same node code can be placed static on a
                        target with no loader or no OS and dynamic on
                        a Linux board, by configuration alone. The
                        frozen-only option gives the first and not the
                        second, and the loading runtime gives the
                        second but needs a loader on every target.
description:            |
                        Sources:
                        - The new option shares one node interface,
                          edge buffer, node state and step protocol
                          between both subgraphs.
                          (_data/decision/dec_first_engine/opt_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 12-21)
                        - "In general, the same code should be able to
                          be run statically or dynamically." (owner's
                          statement, 2026-10-24, answer 1)
                        - The owner wants placement to apply to
                          threads and to "embedded systems where there
                          may not be an OS at all". (owner's
                          statement, 2026-10-24)
                        - The Stableflow drafts write a component once
                          and link it either into a generated schedule
                          or as a dlopen library.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 14-31)
                        - The dynamic host loads components with
                          dlopen.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 65) ASSUMPTION: a target with no OS has
                          no dynamic loader. Strength: strong; the
                          gain is per node, and each further system or
                          target picks its own split without new node
                          code. It holds only if a static-only build
                          can leave the dynamic machinery out, a
                          condition argued in its own annotation.

