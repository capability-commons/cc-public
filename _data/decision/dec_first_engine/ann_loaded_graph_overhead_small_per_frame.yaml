title:                  Small per-frame cost of a loaded graph
brief:                  |
                        In a loaded graph the wiring checks and buffer
                        allocation happen when the graph is wired, not
                        on each step, leaving one indirect call per
                        node per step. At Patrol's 30 Hz frame rate
                        that is small against a 33 ms frame, and hot
                        paths can later be loaded as optimized frozen
                        islands.
description:            |
                        Sources: The dynamic host allocates buffers
                        and checks edges at wiring time, and rewires
                        only between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 63-72). A frozen subgraph can be loaded
                        as one node in a dynamic graph, decided
                        2026-10-16 (same file, lines 74-80). The Orin
                        configuration must hold a 720p 30 Hz camera
                        rate, and 29-30 of 30 frames were measured on
                        16 October (_sources/cc-patrol-notes/plan.md
                        lines 178-182). ASSUMPTION: an indirect call
                        costs on the order of nanoseconds, and a
                        Patrol graph has tens of nodes, not thousands.
                        Strength: moderate; the argument weakens for a
                        high-rate or many-node graph.

