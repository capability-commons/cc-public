title:                  Graph changes without a rebuild
brief:                  |
                        A runtime that loads a graph can take a new or
                        corrected graph, or a new variant, without
                        regenerating and recompiling, so one build for
                        a host can run several graphs and variants,
                        and a wiring flaw can be remedied quickly. A
                        frozen schedule must be generated and compiled
                        again, with link-time optimization, for every
                        graph change, which costs build and gate time
                        though not run-time speed.
description:            |
                        Sources: The dynamic host loads, starts,
                        stops, restarts and rewires components from
                        configuration between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 9-10 and 61-72). A frozen schedule is
                        fixed at build time
                        (_data/decision/dec_first_engine/opt_frozen_schedule_generated.yaml
                        at brief) and is built with LTO or as a unity
                        build
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 33-57). Patrol needs two configurations,
                        on a Legion laptop and on a headless Jetson
                        Orin Nano (_sources/cc-patrol-notes/plan.md
                        lines 126-134). Variants are meant as
                        documented experiments, design permutations
                        captured as graph data
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 8-9). The drafts limit run-time
                        reconfiguration to a finite set of
                        pre-validated modes
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 212-215). Owner's statement, 2026-10-20:
                        the engine is intended "to incorporate the
                        dynamic-graph capabilities I'd postponed in
                        the past". ASSUMPTION: LTO and unity builds
                        take longer than incremental builds. Strength:
                        weak to moderate; the first Patrol
                        configurations are known in advance and can be
                        built as separate frozen schedules, graph
                        changes are rare compared with steps, and the
                        remedy gain covers wiring, not component code.

