title:                  Node restart only in a loading runtime
brief:                  |
                        A runtime that loads a graph can stop, restart
                        and rewire a node between steps, so one faulty
                        node can be reset while the rest keep running.
                        A frozen schedule can only switch a node off,
                        so recovering a faulted node means restarting
                        its whole process.
description:            |
                        Sources: In the dynamic host, start, stop,
                        restart and rewire happen between steps, and a
                        rewire resets the affected nodes
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). In a frozen schedule only a
                        per-node enable flag changes at runtime (same
                        file, lines 39-40), and a frozen island always
                        runs within a single OS process (same file,
                        line 80). Owner's statement, 2026-10-20: the
                        engine is to "incorporate the dynamic-graph
                        capabilities I'd postponed in the past".
                        Strength: moderate; frozen islands can later
                        be loaded as nodes of a dynamic graph (same
                        file, lines 76-80), so frozen first defers
                        this rather than losing it.

