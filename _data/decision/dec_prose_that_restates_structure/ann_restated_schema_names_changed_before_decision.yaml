title:                  Restated schema names changed within hours
brief:                  |
                        The restated schema names changed once before
                        the owner's statement: commit 232f001 wrote
                        sentences naming sch_register_entry_* schemas,
                        and ae6eeff renamed them to sch_regentry_*
                        about two hours later, editing the sentences
                        along with the edges.
description:            |
                        Sources: 232f001 (2026-10-13T14:45:10Z) and
                        ae6eeff (2026-10-13T16:58:37Z), git show
                        ae6eeff. This was early bootstrap, so it may
                        not predict the later rate of change.

