title:                  Restating prose kept
brief:                  |
                        Prose that restates a schema or an edge stays,
                        because a reader learns the shape of an item
                        from one plain sentence in the field already
                        open. The sentence names each schema by its
                        id, so cctool rename and the mention checks
                        keep it in step with the edge. Ruled by WTP on
                        2026-10-22.

