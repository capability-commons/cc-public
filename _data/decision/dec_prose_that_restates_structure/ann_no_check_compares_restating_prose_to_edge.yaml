title:                  No check of restating prose against its edge
brief:                  |
                        If an edge or an allOf entry is moved to
                        another schema that still exists, the old
                        sentence still names a real item, so no check
                        fires. Readers, reviewers and partner tools
                        can then get two different facts from one item
                        with no warning.
description:            |
                        Sources: dangling_mention and outdated_mention
                        fire only on an id that names no item or on an
                        old id (src/cc_public/check/check.lp lines
                        457-473 and 505-519). No rule in check.lp
                        relates a mention to an edge or to allOf
                        (search of check.lp for mention, and of src
                        for "defined by" and "come from sch_";
                        assumption, not every rule read). The stale
                        sentence can sit outside the three lines of
                        context that git diff shows
                        (https://git-scm.com/docs/git-diff, option
                        -U). Today every restating sentence agrees
                        with its edge or allOf (advocates' scripts
                        over reg_data_item_type.yaml and
                        _data/schema/*.yaml at 89c74d8). The risk
                        grows with the number of sentences, and a
                        check that compares the named schema with the
                        edge would remove it.

