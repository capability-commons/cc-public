title:                  Restated schema renamed twice since the decision
brief:                  |
                        After the maintainer's statement, the schema
                        named in one type's restating sentence changed
                        twice: 6b551e3 renamed the Datalog module
                        schema to the Datalog source file schema, and
                        6230e98 renamed that to
                        sch_logic_program_file. Each commit edited the
                        sentence along with the edge, so the two did
                        not drift apart.
description:            |
                        Sources: git log --all -G"come from|comes
                        from|is defined by" -- _data from
                        2026-10-13T21:35:49Z, then git show of each
                        commit; 6b551e3 (2026-10-14T07:16:07Z, history
                        under tag pre_squash_20261014) and 6230e98
                        (2026-10-14T22:51:31Z) both change the "is
                        defined by" sentence and the
                        relation_has_items_specified_by_schema target
                        in _data/register/reg_data_item_type.yaml.
                        Other commits in that time only add restating
                        sentences or rewrap them (cdc9ae6), and
                        sch_commit changed twice without a change to
                        its composition sentence (66326b6, e25acf9).
                        The record covers about one day, so it is
                        thin.

