title:                  Restated schema named by its id
brief:                  |
                        A restating sentence names its schema by id, a
                        name that designates one item and that the
                        rename tool and the mention checks keep in
                        step. Where a schema restates its composition
                        in plain words instead, one schema goes by
                        several names that nothing ties to it.
description:            |
                        Sources: 31 of the 32 type entries say which
                        schema defines their items, by id (for example
                        _data/register/reg_data_item_type.yaml at
                        entries.type_option.usage), and 19 schemas
                        name each schema in their allOf by id (for
                        example _data/schema/sch_option.yaml at
                        description). cctool rename rewrites a whole
                        id in every YAML document
                        (src/cctool/edit/edit.py within
                        _renamed_documents), and dangling_mention
                        fails a mention that names no item
                        (src/cctool/check/check.lp within
                        dangling_mention). In words, sch_register is
                        "the general register schema" in each of the
                        nine register schemas (for example
                        _data/schema/sch_reg_concept.yaml at
                        description), and sch_register_entry is both
                        "the general register entry" and "the general
                        entry shape"
                        (_data/schema/sch_regentry_writing_style_rule.yaml
                        at brief and description). The concern asks
                        whether a term designates one concept, and
                        counts concepts with more than one term in use
                        (_data/register/reg_concern.yaml at
                        entries.concern_terminological_quality.note
                        and
                        entries.concern_terminological_quality.question).
                        Assumption: the ISO 704 aim of one designation
                        for one concept applies to the names of items
                        as well.

