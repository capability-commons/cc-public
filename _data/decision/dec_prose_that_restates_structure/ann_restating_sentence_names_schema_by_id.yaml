title:                  Restated schema named by its id
brief:                  |
                        A restating sentence names its schema by id, a
                        name that designates one item and that the
                        rename tool and the mention checks keep in
                        step. Where a schema restates its composition
                        in plain words instead, one schema goes by
                        several names that nothing ties to it.
description:            |
                        Sources: 31 of the 32 type entries say which
                        schema defines their items, by id (for example
                        _data/register/reg_data_item_type.yaml lines
                        511-512), and 19 schemas name each schema in
                        their allOf by id (for example
                        _data/schema/sch_option.yaml lines 18-20).
                        cctool rename rewrites a whole id in every
                        YAML document (src/cc_public/edit/edit.py
                        lines 1014-1034), and dangling_mention fails a
                        mention that names no item
                        (src/cc_public/check/check.lp lines
                        1618-1624). In words, sch_register is "the
                        general register schema" in each of the nine
                        register schemas (for example
                        _data/schema/sch_reg_concept.yaml lines
                        18-19), and sch_register_entry is both "the
                        general register entry" and "the general entry
                        shape"
                        (_data/schema/sch_regentry_writing_style_rule.yaml
                        lines 16 and 22-23). The concern asks whether
                        a term designates one concept, and counts
                        concepts with more than one term in use
                        (_data/register/reg_concern.yaml lines 784 and
                        790). Assumption: the ISO 704 aim of one
                        designation for one concept applies to the
                        names of items as well.

