title:                  A second place for each structural fact
brief:                  |
                        Each restating sentence is a second copy of a
                        fact the graph already holds, so a change to
                        that fact touches two parts instead of one.
description:            |
                        Sources: all 18 type entries state their
                        schema in a note and as an
                        relation_has_items_specified_by_schema edge
                        (_data/register/reg_data_item_type.yaml, for
                        example lines 72-76 and 89-92). Ten schemas
                        name the schemas in their allOf in a "come
                        from" sentence in their description, for
                        example _data/schema/sch_option.yaml lines
                        18-20 against 47-49, and others restate their
                        allOf in other words (see
                        ann_restating_prose_uneven_across_schemas).

