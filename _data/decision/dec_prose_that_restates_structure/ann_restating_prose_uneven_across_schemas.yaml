title:                  Restating prose uneven across schemas
brief:                  |
                        Schemas restate their allOf in different forms
                        and places, and two do not name the schemas
                        they compose, so neither a partner nor a
                        reviewer can rely on one form of sentence
                        being there, and the allOf stays the only
                        complete record.
description:            |
                        Sources: ten schemas name each schema in their
                        allOf in a "come from" sentence in their
                        description (for example
                        _data/schema/sch_option.yaml lines 18-20). The
                        six sch_reg_* schemas say in their description
                        that they compose "the general register
                        schema" with an entry schema, in words rather
                        than ids (for example
                        _data/schema/sch_reg_concept.yaml lines
                        18-19). Five of the six sch_regentry_* schemas
                        name sch_register_entry only in their usage
                        field (for example
                        _data/schema/sch_regentry_type.yaml lines
                        22-24). sch_register composes sch_standalone
                        and sch_trait_edge without naming either in
                        prose, and sch_regentry_writing_style_rule
                        speaks only of "the general entry shape". In
                        the type register, by contrast, all 18 entries
                        carry a sentence naming their schema; one
                        advocate's count of 4 missed sentences split
                        across lines. The memory note asks agents to
                        follow the pattern in new types and schemas
                        (prose-restating-structure.md, "How to
                        apply"), but nothing checks it.

