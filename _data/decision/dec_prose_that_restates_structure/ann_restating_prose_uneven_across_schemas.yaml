title:                  Restating prose uneven across schemas
brief:                  |
                        Schemas restate their allOf in different forms
                        and places, and three do not name what they
                        compose at all, so neither a partner nor a
                        reviewer can rely on one form of sentence
                        being there, and the allOf stays the only
                        complete record.
description:            |
                        Sources: of the 43 schemas with an allOf, 19
                        name each schema in it in a "come from"
                        sentence in their description (for example
                        _data/schema/sch_option.yaml at description).
                        The nine register schemas say in their
                        description that they compose "the general
                        register schema" with an entry schema, in
                        words rather than ids (for example
                        _data/schema/sch_reg_concept.yaml at
                        description). Eight of the nine register entry
                        schemas name sch_register_entry only in their
                        usage field (for example
                        _data/schema/sch_regentry_type.yaml at usage),
                        and sch_regentry_writing_style_rule speaks
                        only of "the general entry shape" (lines
                        22-23). sch_standalone and sch_register_entry
                        speak of their traits in words. sch_register,
                        sch_dataflow_node and sch_interface_member
                        compose schemas without naming them in prose.
                        In the type register, by contrast, 31 of the
                        32 entries carry a sentence naming their
                        schema, and type_shell_script carries none.
                        The memory note asks agents to follow the
                        pattern in new types and schemas
                        (prose-restating-structure.md, "How to
                        apply"), but nothing checks it.

