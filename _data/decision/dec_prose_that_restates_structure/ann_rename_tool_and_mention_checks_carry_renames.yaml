title:                  Renames carried into prose by tooling
brief:                  |
                        cctool rename rewrites every mention of an old
                        id in the YAML documents and every quoted id
                        in the logic programs, and lists any other
                        file that still names it, such as Python code.
                        The checker flags prose that names a missing
                        or old id, so the commonest change to a
                        restated fact costs neither a hand edit nor a
                        search by eye.
description:            |
                        Sources: src/cc_public/edit/edit.py lines
                        886-1034 (rename, its quoted ids in logic
                        programs at lines 976-982, and the YAML
                        documents at lines 1014-1034);
                        src/cc_public/cli/editing.py lines 297-325,
                        which lists each file that still names the old
                        id; test at
                        src/cc_public/cli/_test/test_editing.py lines
                        142-147; dangling_mention and outdated_mention
                        in src/cc_public/check/check.lp lines
                        1618-1624 and 2072-2076. The checks came in
                        fd6323a (2026-10-13T23:38:20Z) and the rename
                        command in afbcf6f (2026-10-14T12:56:31Z),
                        both after the decision. It does not cover an
                        edge moved to another existing schema.

