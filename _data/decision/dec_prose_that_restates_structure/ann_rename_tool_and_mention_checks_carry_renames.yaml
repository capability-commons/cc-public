title:                  Renames carried into prose by tooling
brief:                  |
                        cctool rename rewrites every mention of an old
                        id in the YAML documents (not in code, which
                        it lists instead), and the checker flags prose
                        that names a missing or old id, so the
                        commonest change to a restated fact costs
                        neither a hand edit nor a search by eye.
description:            |
                        Sources: src/cc_public/edit/edit.py lines
                        722-760; src/cc_public/cli/editing.py lines
                        285-305; test at
                        src/cc_public/cli/_test/test_editing.py lines
                        141-145; dangling_mention and outdated_mention
                        in src/cc_public/check/check.lp lines 457-519.
                        The checks came in fd6323a
                        (2026-10-13T23:38:20Z) and the rename command
                        in afbcf6f (2026-10-14T12:56:31Z), both after
                        the decision. It does not cover an edge moved
                        to another existing schema.

