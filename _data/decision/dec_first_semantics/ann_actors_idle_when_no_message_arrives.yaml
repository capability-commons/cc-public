title:                  Idle actors when no message arrives
brief:                  |
                        Under Kahn steps every node runs on every
                        step, and a missing input is passed as an
                        empty token. Actors run only when a message
                        arrives, which costs less processor time for
                        sparse inputs such as operator commands and
                        settings.
description:            |
                        Sources: An inbound gateway emits an output
                        marked not enabled when nothing has arrived
                        since the last step
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-191). Commands and settings travel
                        upstream to the Orin configuration and apply
                        at a frame boundary
                        (_sources/cc-patrol-notes/plan.md lines
                        166-167). Each node in a frozen schedule is
                        guarded only by a per-node enable flag
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 39-41). ASSUMPTION: operator commands
                        and settings arrive far less often than
                        frames. Strength: weak; Patrol's main load is
                        frame-driven at a steady rate, where every
                        node has work on every step anyway.

