title:                  Kahn steps in a static, allocation-free schedule
brief:                  |
                        Synchronous Kahn steps run every node once per
                        step in a fixed order over fixed-capacity
                        buffers, so they compile into the
                        straight-line schedule and allocate nothing
                        while stepping. Actors that act on each
                        message need queues whose fill varies at run
                        time and dispatch that depends on which
                        messages arrive.
description:            |
                        Sources: Every sequence has a fixed capacity,
                        every buffer size is known before the system
                        starts, and nothing is allocated on the heap
                        while stepping
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 145-151). The frozen schedule is a
                        straight list of calls in schedule order
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 39-41). Patrol lists allocation-free
                        stepping as a conformance goal
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 100-112). ASSUMPTION: an actor runtime
                        needs per-actor message queues and a scheduler
                        that picks the next ready actor at run time.
                        Strength: moderate; bounded actor queues could
                        narrow the gap.

