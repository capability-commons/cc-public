title:                  Kahn networks and actors together
brief:                  |
                        The dataflow engine supports Kahn process
                        networks and actors together from its first
                        version, against the recommendation to start
                        with Kahn networks alone. Ruled by William
                        Payne on 2026-10-24. It is "VERY hard to
                        change the engine once it's built and you've
                        started using it - so it's best to get the
                        shape right early on". Supporting both is
                        "biting off a big chunk of work - but I think
                        we have to if we're to get everything in and
                        working and not leave anything as a forgotten,
                        dangling thread."

