title:                  Step semantics already stated by the model and its checks
brief:                  |
                        The dataflow model already says a feedback
                        edge carries the value of the invocation
                        before, and the checks already fail a loop of
                        feedforward edges; this is the synchronous
                        step of the Kahn option. Building that first
                        makes the engine, the model and the checks
                        agree with no schema change.
description:            |
                        Sources: "A feedback edge closes a loop: its
                        value comes from the invocation before"
                        (_data/schema/sch_dataflow_graph.yaml lines
                        33-35). The feedforward loop check fails a
                        loop of feedforward edges because a node would
                        wait on its own output
                        (src/cc_public/check/check.lp lines
                        3055-3087). The option's brief is "Synchronous
                        steps in which a feedback edge carries the
                        value of the step before"
                        (_data/decision/dec_first_semantics/opt_kpn_first.yaml
                        lines 12-14). Strength: strong; the existing
                        model and checks define the expected result in
                        these terms.

