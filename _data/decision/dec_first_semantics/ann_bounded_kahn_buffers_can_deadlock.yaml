title:                  Artificial deadlock in bounded Kahn buffers
brief:                  |
                        Kahn networks on real hardware need bounded
                        buffers, and blocking writes to a full buffer
                        can cause an artificial deadlock, a stall that
                        a safety-involved system must detect and
                        leave. Kahn first still needs a defined safe
                        state for that case, mainly on edges between
                        processes.
description:            |
                        Sources: "A real application can not have
                        unbounded FIFOs"; blocking writes on full
                        FIFOs "may unfortunately lead to an artificial
                        deadlock"
                        (https://en.wikipedia.org/wiki/Kahn_process_networks).
                        Every sequence and buffer in the engine has a
                        fixed capacity known before the system starts
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 145-151). Patrol's graph needs edge
                        capacity and initial delay tokens
                        (_sources/cc-patrol-notes/plan.md lines
                        81-84). The option as stated uses synchronous
                        steps in which a feedback edge carries the
                        value of the step before
                        (_data/decision/dec_first_semantics/opt_kpn_first.yaml
                        lines 12-14). ASSUMPTION: a synchronous
                        stepped schedule with one-step feedback delays
                        avoids blocking buffers within a process, so
                        the risk sits on edges between processes,
                        whose transport is still open
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 222-223). Strength: weak.

