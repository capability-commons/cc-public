title:                  Gateway nodes in place of actors for asynchronous traffic
brief:                  |
                        Patrol's asynchronous parts, such as commands
                        from a FastAPI service, streams and the edges
                        that cross hosts, are handled at gateway nodes
                        that turn traffic into step tokens. A
                        Kahn-first engine therefore covers the known
                        Patrol host layouts, and actors can follow
                        when choreographed fleets need them.
description:            |
                        Sources: A gateway node turns asynchronous
                        traffic into Kahn tokens and back, and
                        functional components never access pub-sub
                        directly, decided 2026-10-16
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 184-193 and 226-227). Tightly coupled
                        distributed systems may be orchestrated as one
                        segment with gateway nodes on each link (same
                        file, lines 169-173). Commands come from
                        outside systems through a FastAPI command
                        node, a Python runtime
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 88-92). The Orin mixed variant has four
                        edges that cross hosts (same README, lines
                        75-78). Patrol's review has an open point on
                        an Actor profile
                        (_sources/cc-patrol-notes/plan.md lines
                        31-32). Owner's statement, 2026-10-20: "I
                        imagine that eventually we will want to
                        additionally support at least Actor semantics
                        as well." Strength: moderate; it rests on the
                        drafts of one system, though that system is
                        the first planned user.

