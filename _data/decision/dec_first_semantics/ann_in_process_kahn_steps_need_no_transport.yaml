title:                  No transport library for in-process Kahn steps
brief:                  |
                        Synchronous Kahn steps inside one process pass
                        data through plain shared buffers, with no
                        queue or messaging library. Actors are likely
                        to call for a message queue and, across
                        processes or hosts, the still undecided
                        transport, most likely ZeroMQ.
description:            |
                        Sources: Within one process, edges are plain
                        shared buffers: "No queue is needed and there
                        is no reason to use anything else"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 124-125). Between machines the transport
                        is "very likely ZeroMQ"; between processes on
                        one host it is ZeroMQ or a shared-memory
                        queue, still open (same file, lines 126-128).
                        Owner's statement, 2026-10-20: actors are
                        expected later. ASSUMPTION: an in-process
                        actor mailbox could be written without a
                        third-party library, so the dependency arrives
                        mainly with cross-process actors. Strength:
                        moderate; it defers rather than removes the
                        transport dependency, since Patrol's
                        cross-host edges will want one anyway
                        (_sources/cc-patrol-notes/plan.md lines
                        168-171).

