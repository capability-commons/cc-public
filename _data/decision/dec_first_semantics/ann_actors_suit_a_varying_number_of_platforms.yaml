title:                  Actors for a varying number of platforms
brief:                  |
                        Where the number of hosts changes and links
                        are unreliable, the drafts choose choreography
                        over pub-sub, which matches actor semantics.
                        Kahn semantics need blocking reads across
                        processes, and the drafts apply them within
                        orchestrated segments whose topologies are
                        known, so scaling out across hosts leans on
                        gateway nodes.
description:            |
                        Sources: Swarms and fleets have variable
                        numbers of platforms and unreliable links, so
                        a fixed topology cannot be assumed and
                        choreography applies
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 174-176). "Kahn semantics need blocking
                        reads across processes" (same file, line 152).
                        Within a segment, topologies are known and
                        validated (same file, lines 169-171). Owner's
                        statement, 2026-10-20: "I imagine that
                        eventually we will want to additionally
                        support at least Actor semantics as well."
                        Patrol's headless configuration needs
                        cross-host edges with a declared delivery
                        policy (_sources/cc-patrol-notes/plan.md lines
                        168-171). Strength: weak; the first targets
                        are a fixed set of one or two hosts, where a
                        varying number of platforms does not yet
                        arise.

