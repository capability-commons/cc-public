title:                  Mismatch between the Kahn option's name and brief
brief:                  |
                        The option is named Kahn process networks, but
                        its brief describes synchronous steps, while
                        the engine drafts take Kahn semantics to mean
                        blocking reads. An acceptance check needs one
                        stated semantics to test against, so whichever
                        is meant should be named and stated the same
                        way before the engine is built.
description:            |
                        Sources: The option's brief is "Synchronous
                        steps in which a feedback edge carries the
                        value of the step before"
                        (_data/decision/dec_first_semantics/opt_kpn_first.yaml
                        lines 12-14). The engine draft says "Kahn
                        semantics need blocking reads across
                        processes"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        line 152). The ICD's dataflow step surface has
                        twelve named parts of execution semantics,
                        among them invocation, determinism and back
                        pressure (_sources/mapping.md lines 41-42).
                        Strength: weak; it asks for a correction of
                        wording, not a different choice.

