title:                  Entry points bounded at named gateways
brief:                  |
                        Under the drafted Kahn design, functional
                        components never touch asynchronous traffic,
                        and every way in from outside is a gateway
                        node at a known edge. The places an attacker
                        can reach are then few and listed.
description:            |
                        Sources: "Functional components never use
                        pub-sub (or any other asynchronous transport)
                        directly. The boundary between a segment and
                        the outside world is a gateway node"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 184-186). The gateway pattern "keeps the
                        segment's topology closed" (same file, line
                        195). Strength: moderate; the drafts describe
                        a design, not a built engine.

