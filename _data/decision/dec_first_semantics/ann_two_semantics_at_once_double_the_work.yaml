title:                  Two semantics at once, before either is proven
brief:                  |
                        Supporting both semantics from the first
                        version adds two schedulers and the seams
                        between them before either has run a real
                        graph. Every engine change must then be tested
                        under both, and their interactions add a new
                        class of faults and hazards, such as ordering,
                        starvation and lost messages, that must each
                        be found and mitigated.
description:            |
                        Sources: Owner's statement, 2026-10-20:
                        "eventually we will want to additionally
                        support at least Actor semantics as well",
                        which places actors later, not first. The plan
                        orders a frozen schedule first, with parity
                        runs against detector_dump
                        (_sources/cc-patrol-notes/plan.md lines
                        103-105 and 206-207). Gateway nodes already
                        form a seam between the Kahn domain and the
                        outside world, decided 2026-10-16
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 184-188 and 226-227), and the Python
                        Stableflow runtime used the same pattern (same
                        file, lines 197-199), so actors can be added
                        later at that seam. ASSUMPTION: tests would
                        need a case for each semantics on each shared
                        path, and each interaction adds hazards to
                        analyze. Strength: moderate; the size of the
                        extra work is an assumption, and this argues
                        sequence, not against actors.

