title:                  Repeatable runs under Kahn semantics
brief:                  |
                        Kahn process networks give the same tokens on
                        every edge on every run, whatever the timing,
                        so a failure seen once can be replayed and
                        traced, a tested configuration stands as
                        safety evidence for the deployed one, and
                        parity tests can compare whole outputs. Actor
                        semantics do not fix the order of messages, so
                        the same test can pass once and fail in
                        service.
description:            |
                        Sources: Stableflow's determinism (Kahn
                        semantics, the run id and the configuration
                        digest) means anyone can re-run a scenario and
                        get the same tokens on every edge
                        (_sources/mapping.md lines 19-20). "Processes
                        of a KPN are deterministic ... timing of the
                        processes does not affect outputs of the
                        system"
                        (https://en.wikipedia.org/wiki/Kahn_process_networks).
                        In the actor model there is no requirement
                        that one message arrives before another, and
                        the model "features unbounded nondeterminism"
                        (https://en.wikipedia.org/wiki/Actor_model).
                        Rewires run between steps, so "replay stays
                        deterministic"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). Kahn semantics matter most at
                        the small scale, "where safety cases rest on
                        simulation" (same file, lines 178-180).
                        Patrol's ICD drafts state determinism as
                        bit-for-bit results for a given sequence of
                        frame steps and commands (the ICD table script
                        in _sources/cc-patrol-notes/draft/tools, line
                        110), and its decomposition uses parity runs
                        whose dumps must be identical
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 48-51 and 172-177). ASSUMPTION: the
                        actor semantics will not fix the order in
                        which an actor receives messages from several
                        senders. Strength: strong.

