title:                  Lost input as an explicit empty token
brief:                  |
                        Under the planned Kahn design, loss or delay
                        on a link becomes an explicit empty token at a
                        gateway node, and a segment can be tested by
                        fault injection for any pattern of arrival and
                        loss. That gives a tested account of faulty
                        inputs from the first version.
description:            |
                        Sources: An inbound gateway latches what
                        arrived since the last step; if nothing
                        arrived the output is marked not enabled, so
                        "Loss and delay become explicit empty tokens"
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-191). In simulation the gateway is
                        replaced by a link model that drops, delays or
                        replays tokens, and the claim that "the
                        segment behaves correctly for any pattern of
                        arrival and loss on its declared topics" can
                        be tested by fault injection (same file, lines
                        193-197). The framework wraps each step and
                        maps anything thrown to an immediate exit
                        signal
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 95-96). Strength: moderate; the design
                        is a draft, not code.

