title:                  Message order and rate under outside control
brief:                  |
                        Actors act on each message as it arrives, so
                        the order and rate of incoming messages, which
                        an outside party may control, shape what the
                        system does. Starting with actors, or with
                        both at once, puts that harder-to-bound
                        surface in the first version, before the
                        gateway seam is proven.
description:            |
                        Sources: The option says "Actors that receive
                        messages and act on each one"
                        (_data/decision/dec_first_semantics/opt_actors_first.yaml
                        lines 12-14). Owner's statement, 2026-10-20:
                        actors are expected "eventually". The plan
                        lists the Actor profile as an open point still
                        to become a decision
                        (_sources/cc-patrol-notes/plan.md lines
                        31-32). ASSUMPTION: behavior that depends on
                        message order and rate is harder to test
                        against hostile input than behavior stepped in
                        a fixed order. Strength: weak; actors can be
                        fenced by gateways too, so this argues for
                        order, not against actors.

