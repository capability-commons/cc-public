title:                  Arithmetic of a state upgrade
brief:                  |
                        A state upgrade maps the fields of an old
                        version of a dictionary entry to a new one.
                        When a mapping computes a value, whose
                        arithmetic does it follow?
description:            |
                        The data dictionary holds entries with
                        upgrades (dec_form_of_the_data_dictionary),
                        and a swap of a node version carries its state
                        through them (dec_swap_of_a_node_version). In
                        the trial implementation the Python model
                        divided integers as true division while the
                        generated C++ truncated, so the two disagreed
                        on the upgraded state, and malformed upgrades,
                        such as a cycle of versions, passed the
                        dictionary check and then hung (review of
                        2026-10-29, CC-021).

