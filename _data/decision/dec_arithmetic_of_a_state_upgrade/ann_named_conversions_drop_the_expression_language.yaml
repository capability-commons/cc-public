title:                  Named conversions in place of an expression language
brief:                  |
                        Upgrades without arithmetic drop a mechanism:
                        there is no expression to parse, check,
                        evaluate in the model and re-emit as C++. In
                        the trial that pipeline was where faults sat:
                        the model checked expressions against an
                        allow-list while the generator copied any
                        expression into C++, so a conversion the model
                        refused was still emitted. A fixed list of
                        named conversions follows the pattern already
                        ruled for delivery policies, named entries
                        written once by the engine's authors. The cost
                        is that some mappings fall outside the list:
                        dynamic software updating generated most of
                        each patch but left placeholders for a
                        programmer, so the option must say what a swap
                        does then, such as refusing it, or replacing
                        the node with one started from fresh state.
description:            |
                        Sources:
                        - A mapping may only copy, rename, set a
                          default or apply a named
                          conversion from a fixed library.
                          (_data/decision/dec_arithmetic_of_a_state_upgrade/opt_upgrade_without_arithmetic.yaml
                          at brief)
                        - The trial's generator emitted any conversion
                          expression as C++,
                          and a conversion the model refused was still emitted. (review
                          of 2026-10-29, area report trial-gen, TRIAL-GEN-06)
                        - The exact option computes on whole numbers
                          and fractions
                          without rounding and then checks the range of the target
                          field.
                          (_data/decision/dec_arithmetic_of_a_state_upgrade/opt_upgrade_arithmetic_exact_then_checked.yaml
                          at brief)
                        - Item text that becomes generated C++ is a
                          trust boundary the
                          review raised for names and strings. (review of 2026-10-29,
                          CC-020)
                        - Each delivery policy declares whether it can
                          lose data, one
                          field written once by the engine's authors and nothing in node
                          code.
                          (_data/decision/dec_data_loss_declared_by_a_delivery_policy/ruling_each_policy_declares_data_loss.yaml
                          at brief;
                          _data/decision/dec_data_loss_declared_by_a_delivery_policy/opt_each_policy_declares_data_loss.yaml
                          at description)
                        - Generated patches copied fields of unchanged
                          type, defaulted
                          added ones and translated changed ones, and left a placeholder
                          for the programmer where no translation was possible. (Hicks,
                          Moore and Nettles 2001, Dynamic software updating, section
                          3.3.2, via
                          notes/literature/round-2/2001-dynamic-software-updating.md)
                        - Where states are not compatible, the old
                          block can be stopped
                          and a new one started. (Prenzel and Provost 2017, Dynamic
                          software updating of IEC 61499 implementation using Erlang
                          runtime system, section 3.2, via
                          notes/literature/round-2/2017-dsu-iec-61499-erlang.md)
                        - Simplicity counts distinct mechanisms and
                          asks whether a design
                          follows from decisions already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0 and
                          entries.concern_simplicity.question.2)
                        Strength: moderate to strong on the count of
                        mechanisms; weaker if Patrol's state upgrades
                        turn out to need conversions that no fixed
                        list anticipates.

