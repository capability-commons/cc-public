title:                  Emulation that falls on the model rather than the embedded engine
brief:                  |
                        Of the two options with arithmetic, the target
                        type's puts the emulation on the Python model,
                        where truncating division and a range check
                        take a few lines, and lets the generated C++
                        run each mapping natively, with a checked
                        operation where overflow can occur. Exact
                        arithmetic puts the emulation on the engine
                        instead: a mapping with a product or a
                        quotient needs multi-word integers or
                        fractions in the C++17 code that runs at a
                        swap on an embedded target. The review
                        recommended the target type's arithmetic for
                        this reason, that the generated code is C++
                        and the model must match it.
description:            |
                        Sources:
                        - The review's recommendation for what
                          division means in a state
                          upgrade is C semantics on the target type, since the generated
                          code is C++ and the model must match it. (review of 2026-10-29,
                          section 7, W-T8)
                        - The engine is a new C++ engine, C++17
                          planned, targeting
                          embedded reach, with Patrol on an NVIDIA Orin its first user
                          (WTP, 2026-10-28).
                        - At the start of a step the engine upgrades a
                          swapped node's
                          state by the dictionary's mapping.
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        - The exact option computes on whole numbers
                          and fractions
                          without rounding.
                          (_data/decision/dec_arithmetic_of_a_state_upgrade/opt_upgrade_arithmetic_exact_then_checked.yaml
                          at brief)
                        - Simplicity counts the distinct mechanisms a
                          design introduces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0)
                        ASSUMPTION: GCC and Clang offer builtins that
                        detect integer overflow, C++17 has no standard
                        multi-word integer or rational type, and
                        Python can truncate toward zero and check a
                        range in a few lines. Strength: moderate; it
                        favors the target type over exact arithmetic
                        only, since named conversions are native on
                        both sides, and it falls away if upgrades are
                        limited to them.

