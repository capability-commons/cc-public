title:                  Target-type arithmetic that is not what C does
brief:                  |
                        The target-type option says a mapping computes
                        in the arithmetic of the field it writes, as C
                        does, but C computes in the types of the
                        operands and converts afterward: n / 2 with an
                        integer n written to a float64 field gives 2
                        in C, and 2.5 if computed in the field's type.
                        The trial's generated C++ gave 2 there and its
                        model 2.5. A node author or partner who reads
                        "as C does" and compiles the mapping as C gets
                        one answer, one who follows the title gets the
                        other, and C leaves signed overflow undefined
                        rather than a fault. The exact option has no
                        such split: its meaning is arithmetic itself,
                        which any language with integers and fractions
                        of any size reproduces.
description:            |
                        Sources:
                        - A mapping computes in the arithmetic of the
                          field it writes, as
                          C does, and the model and the generated code share one
                          definition.
                          (_data/decision/dec_arithmetic_of_a_state_upgrade/opt_upgrade_arithmetic_of_the_target_type.yaml
                          at brief)
                        - Into a float64 field the trial's model gave
                          2.5 and its
                          generated C++ gave 2. (review of 2026-10-29, area report
                          trial-model, TM-06)
                        - The trial review proposed emitting C++ with
                          explicit casts to
                          the type of the field. (review of 2026-10-29, area report
                          trial-gen, TRIAL-GEN-06)
                        - The node interface is stated in C.
                          (_data/decision/dec_language_of_the_node_interface/ruling_c_contract_with_direct_cpp_calls.yaml
                          at brief)
                        - Compatibility asks what a partner must adopt
                          to read and use
                          what the design produces. (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2)
                        ASSUMPTION (language rules): C's usual
                        arithmetic conversions apply to the operands,
                        not the destination; signed overflow is
                        undefined in C and C++. Strength: moderate; it
                        is fixed by rewording the option to say that
                        every operand is converted to the target type
                        first, and until then a generator can read it
                        either way.

