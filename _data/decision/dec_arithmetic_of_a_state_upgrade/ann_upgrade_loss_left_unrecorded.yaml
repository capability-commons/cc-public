title:                  Information an upgrade loses without a record of the loss
brief:                  |
                        Under the arithmetic of the target type,
                        truncation is the defined result, so an
                        upgraded state that lost a fraction looks like
                        any other, and nothing records that the
                        mapping lost information. Under exact
                        arithmetic any loss is a fault, so every
                        stored value is the exact image of the old
                        one. Named conversions could each declare
                        whether they lose information, as each
                        delivery policy declares whether it can lose
                        data, so a check could say where an upgrade
                        loses it and trace that to the entry that
                        accepted the loss; the option does not yet say
                        so.
description:            |
                        Sources:
                        - The target-type option truncates integer
                          division toward zero;
                          the exact option makes a result that does not fit a fault,
                          never a silent truncation.
                          (_data/decision/dec_arithmetic_of_a_state_upgrade/opt_upgrade_arithmetic_of_the_target_type.yaml
                          at brief;
                          _data/decision/dec_arithmetic_of_a_state_upgrade/opt_upgrade_arithmetic_exact_then_checked.yaml
                          at brief)
                        - In the trial, total / 2 on 21 gave 10 in the
                          generated C++ and
                          10.5 in the model, with no failure from either. (review of
                          2026-10-29, area report trial-gen, TRIAL-GEN-06)
                        - Each delivery policy declares whether it can
                          lose data, and
                          cctool checks a graph for where data is lost.
                          (_data/decision/dec_data_loss_declared_by_a_delivery_policy/ruling_each_policy_declares_data_loss.yaml
                          at brief)
                        - Traceability asks whether each element can
                          be traced to the
                          reason it exists. (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                        ASSUMPTION: a lost fraction can matter in node
                        state, such as an accumulated sum that is
                        halved; a named conversion can declare whether
                        it loses information. Strength: moderate; most
                        upgrades copy, rename or default and lose
                        nothing, so the point bears on the few
                        converted fields.

