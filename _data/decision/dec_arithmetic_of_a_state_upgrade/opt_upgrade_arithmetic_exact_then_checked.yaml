title:                  Exact arithmetic, then a range check
brief:                  |
                        A mapping computes exactly, on whole numbers
                        and fractions without rounding, and the result
                        is checked against the range and kind of the
                        target field. A result that does not fit is a
                        fault, never a silent wrap or truncation.

