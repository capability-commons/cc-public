title:                  Arithmetic of the target type
brief:                  |
                        A mapping computes in the arithmetic of the
                        field it writes, as C does: integer division
                        truncates toward zero, and a value out of the
                        range of the target type is refused when the
                        upgrade is checked if it can be known then,
                        and is a fault at run time otherwise. The
                        model and the generated code share one
                        definition.

