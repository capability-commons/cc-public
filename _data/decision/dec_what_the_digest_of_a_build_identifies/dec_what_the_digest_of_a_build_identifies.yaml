title:                  What the digest of a build identifies
brief:                  |
                        An engine reports the content digest of the
                        graph it runs. Does that digest identify only
                        the graph, or also the node types, node
                        sources and dictionary entries the build
                        binds?
description:            |
                        rqt_generator_names_digest has the build carry
                        the lowered digest.
                        rqt_control_refuses_wrong_digest and
                        icd_dataflow_runtime_control speak of the
                        digest of the graph running, while
                        icd_dataflow_change_set and
                        rqt_deployment_records use resolved digests,
                        and the records nowhere say which an engine
                        compares (review of 2026-10-29, CC-055). In
                        the trial implementation the lowered digest
                        covered the resolved digest and the lowering
                        version only: a change to a node type's
                        fail-safe changed the generated code but not
                        the digest, so two engines that behave
                        differently reported the same digest (CC-008).
                        Whichever option is upheld, each digest field
                        in the ICDs is to name its graph, resolved or
                        lowered.

