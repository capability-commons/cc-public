title:                  One lowered digest across four changes to what a build binds
brief:                  |
                        In the trial, four changes to what a build
                        binds, a node type's fail-safe, a node type's
                        input port order, a dictionary entry's field
                        order and a node's source file, left unchanged
                        the lowered digest that the build names, while
                        the generated sources or the node code
                        compiled in differed. Runtime control compares
                        that digest to refuse a request meant for
                        another graph, so it would accept requests for
                        engines that behave differently. Version
                        numbers catch these only when every author
                        bumps them: the trial's two versions of one
                        node type compiled the same source file, so a
                        node type's version did not pin its code. A
                        digest over what the graph binds, or a digest
                        of the build, catches each.
description:            |
                        Sources:
                        - For each of those changes the resolved and
                          lowered digests
                          stayed the same while the generated files or compiled node
                          code differed (probe p19). (review of 2026-10-29, CC-008 and
                          area report trial-model, TM-09; area report trial-gen,
                          TRIAL-GEN-09, for node sources)
                        - The digest the build names is the content
                          digest of the
                          lowered graph, which holds what lowering writes, such as the
                          capacities it reads from node types, but not the node types,
                          dictionary entries or node sources themselves; the lowered
                          input digest covered only the resolved content digest and the
                          lowering version. (trial 2c777ab9,
                          src/cctool/dataflow/lower.py, functions lower and _capacities;
                          src/cctool/dataflow/generate.py, function _graph)
                        - Version 1 and version 2 of the accumulate
                          node type both name
                          the source file accumulate.cpp. (trial 2c777ab9,
                          src/cctool/dataflow/_test/_example/node_kind/accumulate.yaml
                          and accumulate_v2.yaml, at source)
                        - The build carries the lowered digest so that
                          runtime control
                          can refuse a graph other than the one the build was made for;
                          a change set applied to another graph could do anything.
                          (_data/requirement/rqt_generator_names_digest.yaml at
                          rationale; _data/requirement/rqt_control_refuses_wrong_digest.yaml
                          at rationale)
                        - Dynamic software updating named each changed
                          type by a hash of
                          its definition, a consistent name under which old and new
                          versions could coexist. (Hicks, Moore and Nettles 2001,
                          Dynamic software updating, section 3.2.2, via
                          notes/literature/round-2/2001-dynamic-software-updating.md)
                        - Functional suitability asks whether each
                          function gives the
                          right result. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0)
                        Strength: strong; it was reproduced, and every
                        change set and swap leans on the comparison.
                        It falls only if a check enforced that content
                        changes only with a new version, which needs a
                        digest of the content anyway.

