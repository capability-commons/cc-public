title:                  Digest identifies the graph only
brief:                  |
                        The lowered digest covers the resolved graph
                        and the lowering version, as now. Node types,
                        node sources and dictionary entries are pinned
                        by version numbers that the graph names, and a
                        change to one without a new version is a fault
                        of its author.

