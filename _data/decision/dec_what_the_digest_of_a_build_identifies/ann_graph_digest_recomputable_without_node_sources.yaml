title:                  Graph digest a partner can recompute without the node sources
brief:                  |
                        A content digest of a graph's canonical form
                        can be recomputed by anyone who holds the
                        graph. Folding the content of node types, node
                        sources and dictionary entries into the
                        lowered digest means that a partner who
                        receives a lowered graph or a status reply can
                        check its digest only with every node source
                        the graph names, and Patrol's sources will be
                        private. A separate build digest keeps the
                        graph digests recomputable from the graph
                        alone, and puts what needs the sources in a
                        value of its own.
description:            |
                        Sources:
                        - A content digest of a published canonical
                          form can be
                          recomputed by anyone holding the graph, without cctool or the
                          repository; Patrol's code will live in a private peer.
                          (_data/decision/dec_identity_of_a_resolved_graph/ann_graph_identity_digest_a_partner_can_recompute.yaml
                          at brief and description)
                        - The covers-what-binds option folds every
                          node type, node source
                          and dictionary entry the lowered graph names into the lowered
                          digest; the separate option leaves the graph digests as they
                          are.
                          (_data/decision/dec_what_the_digest_of_a_build_identifies/opt_digest_covers_what_the_graph_binds.yaml
                          at brief;
                          _data/decision/dec_what_the_digest_of_a_build_identifies/opt_separate_digest_of_the_build.yaml
                          at brief)
                        - A load request carries a lowered graph or
                          the digest of one
                          already on the host.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at surface.data.artifact.artifact.load.content)
                        - Compatibility asks whether a partner can
                          read and use what the
                          design produces. (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        Strength: moderate; it matters once a partner
                        receives lowered graphs or engine status, and
                        little while every peer is WTP's.

