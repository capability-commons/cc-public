title:                  Checks that tighten as a requirement matures
brief:                  |
                        September made a check stricter once a
                        requirement was accepted. Without a status, no
                        check can tell a draft from an accepted
                        requirement.
description:            |
                        In the September iteration (origin/main of
                        cc-public, tag baseline_20260918), an
                        unresolved process word was advisory while the
                        requirement was proposed and critical once it
                        was accepted (ddr/ddr_process_word.yaml
                        there).

