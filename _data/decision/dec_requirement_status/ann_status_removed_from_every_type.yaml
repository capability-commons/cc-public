title:                  Status removed from every other type
brief:                  |
                        Status fields were taken off every register,
                        entry and option because nothing set or read
                        them. A status on requirements alone would
                        bring one back for one type.
description:            |
                        Commit 44034ef removed every status field;
                        dec_status_fields holds that deliberation and
                        opt_no_status_fields. No item sets a status,
                        records who changed it, or acts on it.

