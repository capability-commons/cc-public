title:                  Guide-to-schema edge that names the schema twice
brief:                  |
                        An edge from the guide to the schema repeats
                        what the type already says. If the type moves
                        to a new schema, the guide must be changed
                        too, and no check compares the two.
description:            |
                        A type names the schema of its items with
                        relation_has_items_specified_by_schema
                        (_data/register/reg_relation.yaml lines
                        105-116), and schema_count requires exactly
                        one such edge on each type
                        (src/cc_public/check/check.lp lines
                        2819-2823). Each bot serves one type
                        (ruling_chat_schemas_per_bot.yaml lines
                        12-15). A guide that names the schema states
                        the same fact a second time. No rule in
                        check.lp compares a schema named by one item
                        with the schema of a type named by another. An
                        edge to the type states the fact once, and the
                        schema follows the type. Holds at ten times
                        the size: yes, because each guide is one more
                        copy to keep in step.

