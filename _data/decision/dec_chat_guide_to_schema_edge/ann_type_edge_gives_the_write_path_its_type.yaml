title:                  Type edge that gives the write path its type
brief:                  |
                        The chat core writes through the editing
                        commands, which work from the type of an item.
                        An edge from the guide to the type hands the
                        core the type, and through it the schema and
                        the register, with no reverse lookup.
description:            |
                        The chat core writes the draft through the
                        editing commands
                        (_data/logical_component/lco_chat_core.yaml
                        lines 12-17). The command that makes a new
                        item maps its id prefix to a type, and the
                        type to its register or its folder
                        (src/cctool/edit/edit.py lines 269-281 and
                        1280-1294). schema_count requires every type
                        to name exactly one schema for its items
                        (src/cctool/check/check.lp lines 2819-2823),
                        and the tree finds the schema of an item
                        through its type (src/cctool/graph/derive.lp
                        lines 99-106). No check requires a schema to
                        be named by at most one type, although none of
                        the 34 types shares one today
                        (_data/register/reg_data_item_type.yaml). An
                        edge to the schema would leave the core to
                        find the type by the reverse of that edge.
                        Holds at ten times the size: yes, because the
                        lookup is per guide.

