title:                  New relation to the type
brief:                  |
                        Each guide points at the type whose items it
                        elicits, through a new relation constrained to
                        a type, and reaches the schema through the
                        edge of that type to its schema. The schema is
                        then named once, and the editing commands get
                        the type they work from. Reusing the about
                        relation would give a guide a role meant for
                        annotations and decisions, and leave its
                        target unchecked. The new relation carries a
                        broad match to extrel_cco_prescribes. A later
                        check is to require that the fields a guide
                        lists are properties of its type's schema,
                        counting the properties of the trait schemas
                        that schema includes through allOf. Ruled by
                        William Payne on 2026-10-23.

