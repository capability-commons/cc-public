title:                  Type edge that shows where answers are kept
brief:                  |
                        From the type, a reviewer of a bot sees not
                        only which fields it asks for but where the
                        answers land: a shared register or a folder of
                        files. A schema shows the fields only.
description:            |
                        A guide names the fields a bot asks about
                        (opt_interview_guide_item.yaml lines 13-15). A
                        schema states the shape of an item, and its
                        type states where items are kept: ten types
                        hold their items in a register with
                        relation_has_items_held_in_register
                        (_data/register/reg_relation.yaml lines
                        135-162), and the rest give each item a file
                        in a folder named after the type
                        (src/cc_public/edit/edit.py lines 279-294). A
                        first instance may hold member skill profiles,
                        which are personal data (owner's statement,
                        recorded in
                        ann_a_guide_item_states_what_personal_data_is_asked).
                        An edge to the type lets one read of the guide
                        show both what personal data is asked and
                        where it is stored. Holds at ten times the
                        size: yes, because each bot has one guide and
                        one type.

