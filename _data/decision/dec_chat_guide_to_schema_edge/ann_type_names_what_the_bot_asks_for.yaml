title:                  Type that names in plain words what the bot asks for
brief:                  |
                        A type entry has a title, a description, a
                        usage note and a concept, which tell a
                        volunteer in plain words what kind of item the
                        bot is collecting. A schema holds fields, not
                        that framing.
description:            |
                        Each bot serves one type, and so one schema
                        (ruling_chat_schemas_per_bot.yaml at brief).
                        The conversation is led by a checklist drawn
                        from the schema
                        (ruling_chat_conversation_control.yaml at
                        brief). A type entry carries a title, a
                        description, a usage note and a concept, as
                        type_decision does
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_decision). The upheld guide
                        option says the guide names its type
                        (opt_interview_guide_item.yaml at brief). With
                        an edge to the type, the bot reaches both the
                        plain words for the item and, through the
                        type, the schema for the checklist. Holds at
                        ten times the size: yes, because each guide
                        reads one type entry.

