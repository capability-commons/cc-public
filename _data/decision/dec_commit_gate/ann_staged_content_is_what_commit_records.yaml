title:                  Staged content as the content the commit records
brief:                  |
                        The gate checks the staged content because
                        that is what the commit will record, and it
                        refuses to run without the rule engine so that
                        tests cannot pass by skipping.
description:            |
                        Will's statement 2026-10-14T10:20:31Z: "Let's
                        proceed with implementing the commit gate." He
                        gave no reason of his own. The reasons above
                        were written by the assistant, not by Will, in
                        the message of 653e172 (pre-squash history,
                        2026-10-14). Further assistant-written reasons
                        for parts of the option: a merge was recorded
                        without the check, lint or tests (17de2f5),
                        and the gate took over three minutes on two
                        processors before its stages ran side by side
                        (5836f80). ASSUMPTION: the concerns named here
                        are the ones the reason speaks for; nobody
                        named them at the time.

