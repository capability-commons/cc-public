title:                  One copy routine shared by every check
brief:                  |
                        The commit check and the history check reuse
                        the gate's own routines that copy staged or
                        committed content. A working tree gate would
                        be the one hook check that reads a different
                        tree.
description:            |
                        copy_staged and copy_commit:
                        src/cc_public/gate/gate.py lines 95-100 and
                        167-203. Commit check: src/cc_public/commit/
                        change.py lines 59-74 (7520f91). History
                        check: src/cc_public/commit/history.py lines
                        112-114; src/cc_public/cli/auditing.py lines
                        136-147. No hook runs checks on the working
                        tree (.githooks/pre-commit line 28,
                        pre-merge-commit line 32, pre-push line 33).
                        The plain cctool check run by hand still reads
                        the working tree (README.md line 38).

