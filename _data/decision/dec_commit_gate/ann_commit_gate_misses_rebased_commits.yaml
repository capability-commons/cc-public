title:                  Commits the gate never sees
brief:                  |
                        Rebases, cherry-picks and hookless clones make
                        commits the commit gate never sees, and the
                        push runs the gate only on each ref tip. So an
                        intermediate commit can hold trace links that
                        were never checked.
description:            |
                        src/cc_public/commit/history.py lines 19-23.
                        17de2f5 (a merge recorded unchecked).
                        .githooks/pre-push lines 23-28. The push gate
                        loops over ref tips: src/cc_public/cli/
                        auditing.py lines 136-152. The per-commit
                        history check does not cover
                        dangling_reference or dangling_mention
                        (history.py lines 97-125; change.py lines
                        78-88). CI only shares this gap unless CI
                        gates each commit.

