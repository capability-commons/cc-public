title:                  Gate tests now handed out by pytest-xdist
brief:                  |
                        ann_gate_shards_by_size_not_run_time says the
                        gate splits the tests into one shard per
                        processor by file size. It no longer shards.
                        It runs pytest-xdist with one worker per
                        processor, each taking the next test when
                        free.
description:            |
                        TUPLE_STAGE in src/cc_public/gate/gate.py
                        (lines 87-89) runs pytest with -n auto --dist
                        worksteal. The pixi test task does the same
                        (pyproject.toml, [tool.pixi.tasks]). Check,
                        lint and test still run side by side as three
                        jobs (gate.py lines 148-150). Found in the
                        review of 2026-10-22.

