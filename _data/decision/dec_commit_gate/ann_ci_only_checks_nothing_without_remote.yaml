title:                  No checked boundary before a remote exists
brief:                  |
                        With CI only, nothing checks a change until it
                        reaches a remote, and there is no remote yet.
                        Changes pile up unchecked, and a reviewer must
                        judge whether each one even passes.
description:            |
                        CI "needs a remote first" (notes
                        review-2026-10-14.md line 49). Local main is
                        ahead of the remote and nothing has been
                        pushed (memory MEMORY.md line 7). Main holds
                        33 commits from 2026-10-14 12:32 to 23:41 UTC
                        (git log, 7dda99e to 89c74d8). Weakens once a
                        remote and CI exist.

