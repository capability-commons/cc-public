title:                  Gate wait against small commits
brief:                  |
                        The gate adds a wait of one to two minutes to
                        each commit, which falls hardest on the small
                        commits the maintainer wants. The record shows
                        no growth in commit size so far.
description:            |
                        Maintainer's statement 2026-10-14: "It might
                        be a good thing if it forces more fine-grained
                        commits." Gate time from memory MEMORY.md
                        lines 39, 45, 47, 54. Before the gate the
                        median change is 191 lines (n=41); on main,
                        all gated, it is about 124 lines (n=32), from
                        git log --shortstat. Title templates came the
                        same day and may explain the drop. ASSUMPTION:
                        a longer wait pushes toward batching changes.

