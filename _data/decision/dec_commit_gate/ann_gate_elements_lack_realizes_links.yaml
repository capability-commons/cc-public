title:                  Gate elements with no realizes link
brief:                  |
                        The gate module, its command and its hooks
                        have no relations, so nothing in the graph
                        traces them to lco_change_control or to this
                        option.
description:            |
                        relation is empty in src/cctool/gate/gate.py,
                        src/cctool/gate/__init__.py,
                        src/cctool/cli/gating.py, and the three hooks
                        (.githooks/pre-commit, pre-merge-commit,
                        pre-push). The only relation_realizes edge
                        goes from the root package to lco_tooling
                        (src/cctool/__init__.py). lco_change_control
                        covers the gate and the hooks. A gap in the
                        build, cheap to fix, not in the choice.

