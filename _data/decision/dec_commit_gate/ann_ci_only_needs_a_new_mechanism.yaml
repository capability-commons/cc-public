title:                  New mechanism needed for CI only
brief:                  |
                        CI only needs a remote and a CI configuration
                        that do not exist, while the pre-push check of
                        record already runs the command CI would run.
description:            |
                        .githooks/pre-push line 33; memory
                        enforcement-approach.md line 10. git ls-files
                        at 89c74d8 lists no .github directory and no
                        workflow file. Once a remote exists, CI and
                        pre-push would run the same check twice.

