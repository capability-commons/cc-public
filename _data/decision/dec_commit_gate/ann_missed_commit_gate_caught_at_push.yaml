title:                  Missed commit gate caught before the push
brief:                  |
                        The commit gate can be skipped, but the
                        pre-push check of record runs before anything
                        leaves the machine, so a missed gate at a
                        pushed ref tip costs a local fix, not a bad
                        remote history. The pre-push hook can itself
                        be skipped with --no-verify, and it gates only
                        ref tips.
description:            |
                        git runs no pre-commit hook for a merge it
                        makes without stopping (17de2f5). Rebase and
                        cherry-pick run no commit hook, and
                        --no-verify skips hooks (memory
                        enforcement-approach.md line 11). The pre-push
                        hook runs cctool history check with --gate
                        (.githooks/pre-push lines 19-33). Weakens if
                        the push run grows too slow to finish.

