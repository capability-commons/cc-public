title:                  Commit gate now choosing stages by what is staged
brief:                  |
                        ann_gate_cost_scales_with_whole_graph says no
                        gate stage is chosen by what the commit
                        changes and pytest runs every test. The gate
                        of a commit now skips the tests when no code
                        is staged, leaves out tests marked slow or
                        prepush, and reuses stored verdicts for
                        unchanged files.
description:            |
                        src/cctool/gate/gate.py: stages (lines
                        157-170) drops the test stage when
                        is_code_staged (lines 173-192) finds no staged
                        path under TUPLE_CODE (line 99: src/,
                        pyproject.toml, pixi.lock, .githooks/), and
                        runs the commit tests with "not slow and not
                        prepush" (lines 76-77). The gate of a commit
                        sets a store (lines 142-144) that keeps layout
                        and schema verdicts for unchanged text
                        (src/cctool/check/store.py). The check still
                        extracts the whole tree and evaluates every
                        rule, so its cost still grows with the graph.
                        README.md lines 66-80 describe this. Found in
                        the review of 2026-10-22.

