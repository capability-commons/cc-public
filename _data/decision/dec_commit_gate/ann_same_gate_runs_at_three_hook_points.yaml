title:                  Same gate run at three hook points
brief:                  |
                        Check, lint and tests run on the same content
                        at pre-commit, pre-merge-commit and pre-push.
                        The pre-merge-commit hook guards one git path,
                        which the later pre-push check of record
                        covers when the merge is a pushed ref tip.
description:            |
                        .githooks/pre-commit line 28; .githooks/
                        pre-merge-commit lines 19-32 (17de2f5);
                        .githooks/pre-push lines 19-33 (18d6181). CI
                        is planned as a fourth (notes
                        review-2026-10-14.md line 49). WTP asked how
                        far to go on 2026-10-14 and approved the
                        assistant's proposal of one check of record
                        with leaky local hooks (memory
                        enforcement-approach.md lines 8-16), which
                        still lists pre-merge-commit as early
                        feedback. 17de2f5 predates that approach. The
                        challenge is to the extra hook, not to the
                        staged copy.

