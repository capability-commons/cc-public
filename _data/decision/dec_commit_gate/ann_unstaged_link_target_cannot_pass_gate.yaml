title:                  Recorded graph as the checked graph
brief:                  |
                        On the staged copy, the check judges the graph
                        the commit records, so a gated commit cannot
                        record a trace link whose target was left
                        unstaged. On the working tree, an unstaged
                        target would pass while the commit records a
                        dangling link.
description:            |
                        Check stage: src/cctool/gate/gate.py lines
                        64-66. dangling_reference and
                        dangling_mention: src/cctool/check/check.lp
                        lines 236-239 and 466-472. Staged copy:
                        gate.py lines 95-100 and 167-182. The
                        commit-msg change check also compares HEAD
                        with the staged copy
                        (src/cctool/commit/change.py lines 59-74).
                        ASSUMPTION: commits with part of the working
                        tree unstaged happen here; no record shows how
                        often.

