title:                  Uneven gain from parallel stages
brief:                  |
                        The gate splits the tests into one shard per
                        processor by file size, not by run time, and
                        does not split check or lint. Its time is set
                        by the slowest job and by contention, so more
                        processors do not reliably make it faster.
description:            |
                        Shards by file size, largest first, one per
                        processor: src/cctool/gate/gate.py lines 93,
                        125-142. Check and lint run as single jobs
                        (lines 64-65, 106-107). The slowest tests are
                        in test_draft.py at 4 to 8s each (pytest
                        --durations), which file size need not
                        reflect. Measured 2026-10-15 in the cloud
                        container, one run each: four workers took
                        239.9s, two workers 130.8s, all stages
                        passing. These runs were made under heavy
                        container load from parallel runs, so the
                        comparison is weak. ASSUMPTION: the
                        four-worker run was slowed by contention for
                        processors or disk. On two processors the gate
                        took over three minutes before 5836f80 (its
                        commit message) and about 2 min after (memory
                        MEMORY.md line 45). A gap in the build, cheap
                        to fix (shard by recorded time, or cap
                        workers), not in the choice.

