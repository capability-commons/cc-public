title:                  Checked content as the reviewed content
brief:                  |
                        A gate over the staged copy checks the tree a
                        reviewer reads in the diff. A gate over the
                        working tree can pass on content the reviewer
                        never sees.
description:            |
                        src/cctool/gate/gate.py lines 19-26: "an
                        unstaged edit in the working copy can neither
                        fail a commit nor let one pass". README.md
                        lines 42-45. git-commit documentation: the new
                        commit contains the current contents of the
                        index (https://git-scm.com/docs/git-commit).
                        The working tree can differ from the index
                        (https://git-scm.com/docs/git-add). Holds at
                        any graph size, since it rests on what git
                        records.

