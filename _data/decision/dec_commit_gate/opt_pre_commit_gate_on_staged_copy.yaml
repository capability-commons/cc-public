title:                  Pre-commit gate on a copy of the staged content
brief:                  |
                        cctool gate copies the staged index to a
                        temporary directory and runs check, lint and
                        tests there, refusing to run without the rule
                        engine. The pre-commit and pre-merge-commit
                        hooks run it, and its stages and test shards
                        run side by side.
description:            |
                        Added in 653e172 (pre-squash history,
                        2026-10-14). The pre-merge-commit hook came in
                        17de2f5, and the side by side stages in
                        5836f80. The refusal without the rule engine
                        was removed in 6230e98, when the rules moved
                        to clingo run in process.

