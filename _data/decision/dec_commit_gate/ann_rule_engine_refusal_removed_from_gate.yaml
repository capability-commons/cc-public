title:                  Removal of the rule engine refusal
brief:                  |
                        The gate no longer refuses to run without the
                        rule engine. Since 6230e98 the rules run in
                        clingo through its Python API, so a missing
                        engine fails at import instead of skipping.
description:            |
                        653e172 checked for souffle with shutil.which
                        (653e172:src/cctool/gate/gate.py just after
                        MARK_COMMIT at 653e172). 6230e98 removed that
                        check and the Souffle bridge. The current
                        gate.py, in the whole file, has no check for
                        any rule engine. clingo is imported in
                        src/cctool/graph/logic.py. A search of src for
                        "skip" finds no skipped tests in the Python
                        sources. The aim of the reason still holds, by
                        a different means.

