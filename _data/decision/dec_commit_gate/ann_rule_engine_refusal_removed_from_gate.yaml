title:                  Removal of the rule engine refusal
brief:                  |
                        The gate no longer refuses to run without the
                        rule engine. Since 6230e98 the rules run in
                        clingo through its Python API, so a missing
                        engine fails at import instead of skipping.
description:            |
                        653e172 checked for souffle with shutil.which
                        (src/cc_public/gate/gate.py lines 82-85 at
                        653e172). 6230e98 removed that check and the
                        Souffle bridge. The current gate.py has no
                        check for any rule engine (lines 1-221).
                        clingo is imported in
                        src/cc_public/graph/datalog.py line
                        55. A search of src for "skip" finds no
                          skipped tests in the Python sources. The aim
                          of the reason still holds, by a different
                          means.

