title:                  Empty crossing token that already opens a mixed loop
brief:                  |
                        An edge from an actor to a Kahn node gives the
                        Kahn side an explicit empty token at a step
                        when nothing arrived. So at that crossing the
                        Kahn read never waits, and a loop through both
                        kinds cannot deadlock for want of a first
                        value either. The reasoning behind the absent
                        option therefore reaches mixed loops too, and
                        the default rule for every loop asks for a
                        default where the crossing policy already
                        supplies one. This weighs against the rule for
                        every loop; it does not change the absent
                        option, which keeps the rule for mixed loops
                        as WTP ruled.
description:            |
                        Sources:
                        - A crossing edge turns the messages that
                          arrived between steps into a token, with an
                          explicit empty token when none arrived.
                          (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                          at brief)
                        - The Kahn side must see a defined token at
                          each step whether or not an actor sent
                          anything.
                          (_data/decision/dec_crossing_between_kahn_and_actors/ann_kahn_side_sees_a_defined_token_every_step.yaml
                          at brief)
                        - The ruled default rule refuses a feedback
                          edge with no end that can supply a default,
                          including one across the boundary between
                          Kahn and actor nodes.
                          (_data/decision/dec_default_values_on_feedback_edges/ruling_default_from_a_port_that_declares_it.yaml
                          at brief;
                          _data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - In a Kahn network a node that sometimes
                          emits nothing leaves a downstream blocking
                          read waiting (Lohstroh et al. 2021, Toward a
                          Lingua Franca for deterministic concurrent
                          systems, section 2.2); the note on the paper
                          draws the lesson that an empty bounded
                          array, a count of 0, is the natural absent
                          value of a Kahn edge.
                          (/mnt/project-files/notes/literature/part-2/2021-toward-a-lingua-franca-deterministic-concurrent-systems.md)
                          Strength: moderate; it bears on the scope of
                          the ruled rule, which only WTP can reopen,
                          and it holds only while every crossing
                          policy states its empty token.

