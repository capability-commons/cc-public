title:                  Actor swap with no repriming of an absent loop
brief:                  |
                        The ruled default rule has the engine prime a
                        feedback edge again after a rewire or a
                        version swap. In a loop of actors that may
                        already carry messages, priming again adds a
                        first message beside those in flight, which
                        can duplicate one, and it meets the open
                        question of swapping an actor with outstanding
                        requests. Under the absent option nothing is
                        primed: the new version handles whatever is
                        waiting. The absent option keeps a swap of an
                        actor local to that actor.
description:            |
                        Sources:
                        - The engine primes the edge again after a
                          rewire or a version swap.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - An actor's request and reply can span steps,
                          so a step boundary is not quiescent for that
                          actor.
                          (_data/decision/dec_swap_of_an_actor_with_outstanding_requests/dec_swap_of_an_actor_with_outstanding_requests.yaml
                          at description)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                          ASSUMPTION: priming an actor loop means
                          sending a first message, since an actor
                          mailbox has no slot to overwrite. Strength:
                          moderate; it matters only for actor loops
                          that are swapped while running, which the
                          ruled change sets allow.

