title:                  First value of a loop between actors
brief:                  |
                        Does a loop through actors need a first value
                        supplied by a port, as a feedback edge between
                        Kahn nodes does, or may it start with no
                        value?
description:            |
                        The ruled rule on default values on feedback
                        edges needs at least one end that can supply a
                        default. In Reactors (Lohstroh et al. 2019)
                        and Lingua Franca (2021), a loop through
                        actors needs only a logical delay, and the
                        value it first carries is absent. Geilen and
                        Basten (2003) add that an input that may never
                        be read should not count as closing a loop.

