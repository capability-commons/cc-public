title:                  Actor loop that cannot block on a missing first value
brief:                  |
                        The default rule exists because a Kahn read
                        waits for a token, so a Kahn cycle with no
                        first token is a real deadlock. An actor never
                        waits for a message: it runs on the messages
                        waiting for it in a gap between steps, and
                        with none it does nothing. A loop that passes
                        only through actors therefore has no deadlock
                        for a first value to break, and in Reactors
                        and Lingua Franca such a loop needs only a
                        delay whose first reading is absent. The
                        evidence leans toward letting actor loops
                        start absent.
description:            |
                        Sources:
                        - A feedback cycle with no initial token is a
                          real deadlock that no capacity can fix,
                          which is why a Kahn feedback edge needs an
                          end that can supply a first value (Geilen
                          and Basten 2003, Requirements on the
                          execution of Kahn process networks, as
                          summarized in
                          /mnt/project-files/notes/literature/part-2/2003-requirements-on-the-execution-of-kpns.md).
                        - In reactors, port values reset to absent
                          after each tag, and a feedback loop needs a
                          delay rather than a default value (Lohstroh
                          et al. 2019, Reactors: a deterministic model
                          for composable reactive systems, sections
                          2.1 and 3.6).
                        - Lingua Franca requires at least a microstep
                          delay in any feedback loop between reactions
                          (Lohstroh et al. 2021, Toward a Lingua
                          Franca for deterministic concurrent systems,
                          section 6).
                        - Actors run on the engine's threads in the
                          gaps between Kahn steps, draining the
                          messages waiting for them.
                          (_data/decision/dec_how_actors_are_run/opt_actors_between_steps.yaml
                          at brief)
                        - The open option on gap admission has
                          messages sent during a gap wait for the next
                          gap, which is the delay a loop needs.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/opt_messages_waiting_when_the_gap_opens.yaml
                          at brief) ASSUMPTION: actors handle each
                          message as it comes and never wait inside a
                          handler for a particular message, as the
                          between-steps ruling implies. Strength:
                          strong on liveness; it would weaken if
                          actors were allowed to block on a reply
                          inside a handler.

