title:                  Default rule for every loop
brief:                  |
                        Every loop, through Kahn nodes or actors,
                        needs at least one end that can supply a
                        default value.
description:            |
                        One rule for all loops. Actors that already
                        handle a missing message must still declare a
                        default they never use.

