title:                  One loop rule against a rule scoped by node kind
brief:                  |
                        The rule for every loop is one rule with one
                        check, and it follows the ruled default rule
                        word for word. The absent option adds no
                        runtime mechanism, since actors already handle
                        a gap with no message, but the check must sort
                        every cycle into actor only, Kahn only or
                        mixed and apply a different rule to each,
                        which a reader must learn. On simplicity the
                        evidence leans slightly toward the rule for
                        every loop.
description:            |
                        Sources:
                        - The ruled rule needs at least one end of
                          each feedback edge that can supply a
                          default, and states no exception by node
                          kind.
                          (_data/decision/dec_default_values_on_feedback_edges/ruling_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - The absent option applies the default rule
                          to loops through Kahn nodes and to mixed
                          loops, and lets loops only through actors
                          start with no value.
                          (_data/decision/dec_first_value_of_an_actor_loop/opt_actor_loops_may_start_absent.yaml
                          at brief and description)
                        - Simplicity counts distinct mechanisms and
                          asks whether a design follows from decisions
                          already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0 and
                          entries.concern_simplicity.question.2)
                        - WTP wants the approach as simple as feasible
                          and without clever mechanisms (WTP,
                          2026-10-28). Strength: weak; the extra rule
                          is one predicate in the check, and the
                          absent option spares node authors a
                          declaration, which is the other half of
                          WTP's aim.

