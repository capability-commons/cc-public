title:                  Loops between actors may start absent
brief:                  |
                        The default rule applies to loops through Kahn
                        nodes. A loop that passes only through actors
                        may start with no value, since an actor
                        already handles a step in which no message
                        arrives.
description:            |
                        As in Reactors and Lingua Franca. A loop that
                        mixes Kahn nodes and actors keeps the default
                        rule.

