title:                  Absent first value as Lingua Franca loops have it
brief:                  |
                        Lingua Franca, the nearest deterministic actor
                        framework and one measured on the Orin's
                        predecessor, closes a loop with a delay whose
                        first reading is absent. A loop of reactors
                        brought into a cc-public graph, or taken out
                        of one, maps directly under the absent option,
                        while the default rule would need a default
                        invented for it. Tools that place an initial
                        value on a delay, such as synchronous dataflow
                        tools and Simulink, model loops of the Kahn
                        kind, and the absent option keeps the default
                        rule there, so it loses no partner.
description:            |
                        Sources:
                        - Any feedback loop between reactions needs at
                          least a microstep delay (Lohstroh et al.
                          2021, Toward a Lingua Franca for
                          deterministic concurrent systems, section
                          6).
                        - The Lingua Franca C runtime was measured on
                          the NVIDIA Jetson AGX (Lohstroh et al. 2021,
                          section 3.1).
                        - Partner tools place first values on arcs or
                          on delay blocks.
                          (_data/decision/dec_default_values_on_feedback_edges/ann_partner_tools_place_first_values_on_arcs_or_blocks.yaml
                          at brief)
                        - The absent option keeps the default rule for
                          loops through Kahn nodes.
                          (_data/decision/dec_first_value_of_an_actor_loop/opt_actor_loops_may_start_absent.yaml
                          at brief)
                        - Compatibility asks whether the design can
                          read and use what a partner produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.1)
                          ASSUMPTION: a Lingua Franca model may be a
                          partner of cc-public; none is named in the
                          tree yet. Strength: weak to moderate; it
                          rests on a partner not yet chosen.

