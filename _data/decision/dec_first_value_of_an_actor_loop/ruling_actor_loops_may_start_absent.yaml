title:                  Actor loops may start absent
brief:                  |
                        A loop through actors may start with no first
                        value. Ruled by WTP on 2026-10-29, as
                        recommended, after experiments showed that an
                        actor loop cannot deadlock and only stays idle
                        until a message starts it, so a loop that must
                        run sends its first message from an actor's
                        start handler.

