title:                  Unused actor defaults with no traced reason
brief:                  |
                        Under the rule for every loop, an actor in a
                        loop must declare a default it never uses, as
                        the option itself says. Such a declaration
                        exists only to satisfy the check, and a reader
                        who finds it will assume it matters. Under the
                        absent option the reason an actor loop is
                        accepted is the kind of each node in it, which
                        the graph already records, so the loop stays
                        traced without an element that nothing calls
                        for.
description:            |
                        Sources:
                        - Under the rule for every loop, actors that
                          already handle a missing message must still
                          declare a default they never use.
                          (_data/decision/dec_first_value_of_an_actor_loop/opt_default_rule_for_every_loop.yaml
                          at description)
                        - The port option records only that a port can
                          supply a default; the value lives in node
                          code.
                          (_data/decision/dec_default_values_on_feedback_edges/ann_first_value_of_a_loop_kept_in_node_code.yaml
                          at brief)
                        - Traceability asks whether anything exists
                          that nothing calls for.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.2)
                          Strength: moderate; it grows with the number
                          of actor loops, and is small if actor loops
                          are rare.

