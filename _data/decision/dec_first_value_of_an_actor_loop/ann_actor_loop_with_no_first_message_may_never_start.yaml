title:                  Actor loop with no first message that may never start
brief:                  |
                        A loop of actors that only react to messages,
                        with no first message and no input from
                        outside the loop, never runs. That is not a
                        deadlock but a dead loop, and nothing would
                        report it. The default rule forces one end to
                        emit a first message, so such a loop always
                        starts. Under the absent option a loop entered
                        from outside, such as a request and its reply,
                        works as intended, but a loop meant to keep
                        itself going, such as a periodic exchange
                        between two actors, silently does nothing.
description:            |
                        Sources:
                        - The default rule has the source emit a first
                          token or the destination use its default
                          when nothing has arrived.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - The absent option lets a loop through actors
                          start with no value.
                          (_data/decision/dec_first_value_of_an_actor_loop/opt_actor_loops_may_start_absent.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1)
                          ASSUMPTION: some Patrol actor loops are
                          meant to run on their own rather than be
                          entered from outside; none is drafted in the
                          tree yet. Strength: moderate; it falls away
                          if the check under the absent option also
                          requires every actor loop to have an input
                          from outside it, which is a refinement, not
                          a new option.

