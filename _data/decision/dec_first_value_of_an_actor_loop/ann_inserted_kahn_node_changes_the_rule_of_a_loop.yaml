title:                  Inserted Kahn node that changes the rule of a loop
brief:                  |
                        Under the absent option, inserting a Kahn node
                        into a loop of actors, as a transform or a
                        variant operation might, turns it into a mixed
                        loop and so brings the default rule into force
                        on ports far from the edit. The check or the
                        operation's preconditions would refuse the
                        change until some end declares a default, so
                        the cost is a refusal at check time, not a
                        fault in the field. Under the rule for every
                        loop the same edit needs nothing new, since
                        the loop already has its default.
description:            |
                        Sources:
                        - A loop that mixes Kahn nodes and actors
                          keeps the default rule.
                          (_data/decision/dec_first_value_of_an_actor_loop/opt_actor_loops_may_start_absent.yaml
                          at description)
                        - A variant operation that would make a
                          feedback edge with no end able to supply a
                          default is refused by its preconditions.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                          ASSUMPTION: transforms may insert Kahn
                          nodes, such as transport or probe nodes,
                          into paths that now join only actors.
                          Strength: weak to moderate; it depends on
                          how often such insertions happen, and a
                          refusal is cheap to fix.

