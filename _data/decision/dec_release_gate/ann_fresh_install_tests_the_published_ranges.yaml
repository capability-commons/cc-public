title:                  Fresh install that exercises the declared ranges
brief:                  |
                        The commit gate only runs against the locked
                        versions, while a peer resolves cc-public's
                        declared ranges against whatever upstream
                        offers that day. An install into a fresh
                        environment shows whether those ranges still
                        resolve and work before a peer finds out, and
                        is the first sign of a clash in an environment
                        shared with a partner's products.
description:            |
                        Sources: the commit gate runs over the staged
                        content in the locked environment
                        (README.md#getting-started; context note,
                        _sources/context.md line 30). cc-public
                        declares eight runtime dependencies, each with
                        an upper bound, such as
                        ruamel.yaml>=0.19.1,<0.20,
                        pyoxigraph>=0.5.12,<0.6 and clingo>=5.8,<6
                        (pyproject.toml at project.dependencies;
                        pixi.lock). The full option includes an
                        install in a fresh environment and a check of
                        a fixture peer
                        (_data/decision/dec_release_gate/opt_full_gate_and_smoke_test.yaml).
                        Assumption: the fixture peer carries some
                        dependencies of its own; one with none tests
                        install but not coexistence. Strength: strong
                        for observing an upstream change since the
                        last relock, moderate for clashes with a
                        particular partner's set.

