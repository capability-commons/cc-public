title:                  Time to a fix release lengthened by the full gate
brief:                  |
                        The full gate runs every test with no cached
                        verdicts, the slow run on three Python
                        versions, a package build and a fresh solve
                        and install, so it costs many times the 78 s
                        commit gate. When a release breaks a peer,
                        that time sits between the fix and its
                        release, and the owner wants to respond
                        quickly, so the full gate should let a patch
                        pass quickly or its length counts against it.
description:            |
                        Sources: a code commit takes about 78 s in the
                        gate on atlas, with 2 CPUs (context note,
                        _sources/context.md line 31;
                        src/cc_public/gate/gate.py lines 105-106). The
                        slow run tests on Python 3.12, 3.13 and 3.14
                        and is "too slow for every commit" (README.md
                        lines 64-67; pyproject.toml lines 85-87). The
                        full suite in one process took 361 s in one
                        rough measurement
                        (_data/decision/dec_commit_gate/ann_gate_cost_scales_with_whole_graph.yaml
                        lines 29-35). Each stage may run up to 600 s
                        (gate.py line 108). Owner's statements:
                        "performance DOES still matter a lot, as we
                        will need to be able to respond quickly to
                        things." (2026-10-22T16:31); "I'd like to be
                        able to respond to reported problems quickly
                        and largely automatically" (2026-10-22T16:33).
                        Assumption: a fresh solve and install takes
                        minutes. Strength: moderate; the delay is
                        minutes, not hours, and a reduced patch path
                        could recover most of it, so it bounds how
                        heavy the full gate may become rather than
                        overturning it.

