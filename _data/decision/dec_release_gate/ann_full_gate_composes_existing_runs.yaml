title:                  Full gate composed from existing runs
brief:                  |
                        The every-check-and-test part of the full gate
                        is already a named run, pixi run slow, which
                        the README sets aside for before a release,
                        and the push gate already runs without cached
                        verdicts. The full gate need add only the
                        build, install and fixture peer steps, though
                        the fixture peer depends on federation
                        mechanisms that are not built.
description:            |
                        Sources: pixi run slow runs the tests on
                        Python 3.12, 3.13 and 3.14 and is meant to run
                        on its own, such as overnight or before a
                        release (README.md#getting-started;
                        pyproject.toml at tool.pixi.tasks.slow). The
                        gate of a push uses no store
                        (README.md#getting-started). A fixture peer
                        that consumes cc-public needs segments and a
                        multi-root check, which are not built
                        (_data/decision/dec_references_across_instances/ann_segments_need_a_multi_root_check.yaml;
                        _sources/cc-patrol-notes/plan.md lines 65-68).
                        Strength: moderate.

