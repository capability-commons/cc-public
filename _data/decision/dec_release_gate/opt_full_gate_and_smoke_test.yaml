title:                  Full gate and a smoke test
brief:                  |
                        Every check and test, with no cached verdicts,
                        on each Python that requires-python admits; a
                        build of the package from the tagged tree; an
                        install of that package in a fresh environment
                        that resolves its declared ranges; and, once a
                        peer can consume cc-public, a check of a
                        fixture peer that consumes it.
description:            |
                        Source: maintainer's comment
                        (2026-10-22T16:31:39Z), "Agreed. We will
                        probably introduce even more extensive testing
                        as well - although performance DOES still
                        matter a lot, as we will need to be able to
                        respond quickly to things."

