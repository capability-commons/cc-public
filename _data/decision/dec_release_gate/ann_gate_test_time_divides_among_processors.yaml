title:                  Division of gate test time among processors
brief:                  |
                        The test stage gives one worker to each
                        processor and the stages run side by side, so
                        a release gate run on a larger machine than
                        atlas costs much less wall-clock time than the
                        atlas figures suggest.
description:            |
                        Sources: the tests run with -n auto --dist
                        worksteal (src/cc_public/gate/gate.py line 90;
                        pyproject.toml line 75). The stages run side
                        by side (gate.py lines 46-49). The atlas
                        figures were taken on 2 CPUs (context note,
                        _sources/context.md line 31). Assumption: the
                        release runs on a machine with more than 2
                        processors, or on CI. Strength: weak; the
                        package build and fresh install do not
                        parallelize this way.

