title:                  Release gate as the home of a performance budget
brief:                  |
                        The repository has no benchmark or timing
                        test, and the commit gate's time depends on
                        what is already cached. A gate run with no
                        cache in a fresh environment is the one point
                        where response time and memory can be measured
                        under the same conditions each time, so it is
                        where a performance regression could be caught
                        before peers see it.
description:            |
                        Sources: no module under src mentions
                        benchmark, timeit or perf_counter (grep of
                        src, 2026-10-22). The commit gate reuses
                        cached layout and schema verdicts from a store
                        every worktree shares (README.md lines 94-99).
                        The full gate option runs every check and test
                        with no cached verdicts in a fresh environment
                        (_data/decision/dec_release_gate/opt_full_gate_and_smoke_test.yaml).
                        The owner expects "even more extensive
                        testing" (owner's statement,
                        2026-10-22T16:31). Strength: moderate; the
                        benefit appears only if a timing check is
                        added.

