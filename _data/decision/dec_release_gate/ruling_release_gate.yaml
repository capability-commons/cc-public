title:                  Full gate and smoke test
brief:                  |
                        Before a release is tagged, every check and
                        test runs with no cached verdicts on each
                        Python that requires-python admits, the
                        package is built from the tagged tree and
                        installed in a fresh environment, and, once a
                        peer can consume cc-public, a fixture peer
                        checks against it. Ruled by William Payne on
                        2026-10-24, as recommended. The fresh install
                        resolves the declared ranges rather than the
                        lock, tentatively. The full gate is timed at
                        the first release before any shorter path for
                        patches is added. The gate also checks that
                        the built package holds _data and that cctool
                        check passes on the _data it ships, with
                        "Strong agreement" from William Payne.

