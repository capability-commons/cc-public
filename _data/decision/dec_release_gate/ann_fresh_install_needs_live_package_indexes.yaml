title:                  Live package indexes needed by a fresh install
brief:                  |
                        An install in a fresh environment fetches from
                        conda-forge and PyPI, and the full test run
                        also needs the Chromium that playwright
                        downloads, so a release cannot pass while any
                        of them is unreachable. The owner wants to
                        respond quickly, which an outage at one of
                        them would delay.
description:            |
                        Sources: the environment resolves from
                        conda.anaconda.org/conda-forge and
                        pypi.org/simple (pixi.lock lines 4-8). The
                        browser tests drive a Chromium fetched by pixi
                        run browsers, outside the lock (pyproject.toml
                        lines 27-30 and 79). The atlas VM has no
                        network (context note, _sources/context.md
                        line 30). "performance DOES still matter a
                        lot, as we will need to be able to respond
                        quickly to things." (owner's statement,
                        2026-10-22T16:31). Strength: moderate; the
                        cost is occasional, and a cache of the indexes
                        could reduce it.

