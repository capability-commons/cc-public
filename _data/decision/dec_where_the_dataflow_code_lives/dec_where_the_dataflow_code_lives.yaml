title:                  Where the dataflow code lives
brief:                  |
                        The layout ruling, the module names in the
                        dataflow ICDs and the dependency edges of the
                        dataflow components disagree. Where do the
                        model, the generator, the checks and the
                        engine live, and which may import which?
description:            |
                        ruling_source_layout_for_two_languages puts
                        the engine in dataflow_engine with its
                        generator, one folder for each component under
                        src. icd_dataflow_generator names the module
                        cctool.dataflow.generate, and
                        icd_dataflow_checks names
                        cctool.dataflow.checks, while
                        lco_dataflow_model_checks says it is to be
                        realized under cctool.check.
                        icd_dataflow_checks checks a resolved or
                        lowered graph, but its parameter type is the
                        resolved one. The dependency edges forbid the
                        checks and the generator from depending on
                        lowering, which they must read: the trial
                        implementation of 2026-10-29 followed the
                        ICDs, and cctool check gave six
                        import_not_allowed advisories on it (review of
                        2026-10-29, CC-060).

