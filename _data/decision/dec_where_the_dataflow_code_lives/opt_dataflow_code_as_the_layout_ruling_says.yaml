title:                  Dataflow code as the layout ruling says
brief:                  |
                        The engine and its generator live in a
                        dataflow_engine folder under src, apart from
                        cctool, and the model lives under
                        cctool.dataflow. The ICD module names are
                        amended to match, and the checks and the
                        generator may depend on lowering.

