title:                  Lowered graph moved into the component of what the author wrote
brief:                  |
                        The items component answers what the author
                        wrote, and every other part of the model but
                        deployment, and the generator, may depend on
                        it. A lowered graph is never written by an
                        author: lowering makes it, with transports,
                        adapters, control blocks and capacities that
                        only the engine needs. Moving its form into
                        items lets the checks and the generator read
                        it without an edge to lowering, but it puts
                        engine knowledge into the one component the
                        rest of the model reads, so a change to what
                        lowering inserts reaches the base of the whole
                        model. An edge from the checks and the
                        generator to lowering, as the other two
                        options add, states what is true: they read
                        what lowering makes.
description:            |
                        Sources:
                        - Items defines the items an author writes and
                          owns their
                          schemas; it answers the question of what the author wrote.
                          (_data/logical_component/lco_dataflow_model_items.yaml at brief
                          and description)
                        - The resolver, the dictionary, lowering, the
                          checks and the
                          generator may each depend on items.
                          (_data/logical_component/lco_dataflow_model_resolver.yaml,
                          _data/logical_component/lco_dataflow_model_dictionary.yaml,
                          _data/logical_component/lco_dataflow_model_lowering.yaml,
                          _data/logical_component/lco_dataflow_model_checks.yaml and
                          _data/logical_component/lco_dataflow_engine_generator.yaml at
                          edge)
                        - Lowering turns a resolved graph into the
                          lowered graph that the
                          engine receives, inserting transports, adapters, control blocks
                          and recording taps.
                          (_data/logical_component/lco_dataflow_model_lowering.yaml at
                          brief and description)
                        - The resolver knows nothing of transports or
                          of the engine, and
                          that knowledge is kept in lowering.
                          (_data/logical_component/lco_dataflow_model_resolver.yaml at
                          description)
                        - Lowering returns a LoweredGraph, and the
                          generator takes one as
                          its parameter.
                          (_data/interface_control_document/icd_dataflow_lowering.yaml at
                          surface.python.native.function.lower.returns;
                          _data/interface_control_document/icd_dataflow_generator.yaml at
                          surface.python.native.function.generate.parameter)
                        - A shared form, such as the lowered graph,
                          moves into the items
                          component.
                          (_data/decision/dec_where_the_dataflow_code_lives/opt_one_folder_for_each_dataflow_component.yaml
                          at brief)
                        - Maintainability counts the parts that a
                          representative change
                          touches; simplicity asks whether the design follows from
                          decisions already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure and
                          entries.concern_simplicity.question)
                        Strength: moderate; it weakens if only a bare
                        type, with no lowering logic, moves into
                        items, though even the type carries the
                        engine's vocabulary.

