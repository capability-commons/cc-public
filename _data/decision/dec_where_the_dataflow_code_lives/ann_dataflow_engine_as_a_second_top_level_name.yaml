title:                  A second top-level import name in environments shared with peers
brief:                  |
                        If the ruled layout ships the Python generator
                        as a package named dataflow_engine beside
                        cctool in the same wheel, every install adds a
                        second, generic import name to each
                        environment it enters, including environments
                        shared with a partner's products. Python has
                        no guard against two distributions that ship
                        the same top-level name, and the later install
                        overwrites the earlier. Under cctool.dataflow
                        every import stays inside the one name the
                        project already owns. No PyPI project of that
                        name existed on 2026-10-29, but a module's
                        name need not match its project's.
description:            |
                        Sources:
                        - The engine lives in dataflow_engine with its
                          generator, shipped
                          in the same package that peers install.
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml
                          at brief)
                        - The wheel ships the single package
                          src/cctool today
                          (pyproject.toml at tool.hatch.build.targets.wheel.packages).
                        - An install into a fresh environment is the
                          first sign of a
                          clash in an environment shared with a partner's products.
                          (_data/decision/dec_release_gate/ann_fresh_install_tests_the_published_ranges.yaml
                          at brief)
                        - https://pypi.org/pypi/dataflow-engine/json
                          and
                          https://pypi.org/pypi/dataflow_engine/json returned 404 on
                          2026-10-29.
                        - Dependency risk is exposure to third-party
                          code, services and
                          licenses.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.brief)
                        ASSUMPTION: pip installs two distributions
                        that ship the same top-level package without
                        refusing, the second overwriting the files of
                        the first. Strength: weak; the name is free on
                        PyPI today, and the wheel could map the folder
                        under cctool at build time while the source
                        stays in src/dataflow_engine.

