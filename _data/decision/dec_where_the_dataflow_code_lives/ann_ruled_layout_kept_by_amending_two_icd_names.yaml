title:                  Ruled layout kept by amending two ICD module names
brief:                  |
                        WTP will regenerate the trial, so no code has
                        to move under any option, and what each option
                        costs is the records it changes. Keeping the
                        ruled layout amends the module names in two
                        ICDs and adds dependency edges; moving the
                        code under cctool.dataflow amends a ruling of
                        WTP's, though the reasons he stated, that the
                        engine is part of the same product and that
                        the generator goes with the rest of the engine
                        code, would hold there too. The generator's
                        own component says it ships with the engine. A
                        set of records that follows from a ruling is
                        easier for a reader to check than one that
                        reopens it.
description:            |
                        Sources:
                        - WTP will regenerate the trial implementation
                          from the lessons
                          of the review (WTP, 2026-10-29).
                        - The engine ships with that package because
                          it is all part of
                          the same product, and the generator goes along with the rest of
                          the engine code.
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml
                          at brief)
                        - The generator is shipped with the engine, as
                          ruled on
                          2026-10-23.
                          (_data/logical_component/lco_dataflow_engine_generator.yaml at
                          description)
                        - icd_dataflow_generator names
                          cctool.dataflow.generate,
                          icd_dataflow_checks names cctool.dataflow.checks, and the trial
                          followed the ICDs (review of 2026-10-29, CC-060).
                        - Simplicity asks whether the design follows
                          from decisions
                          already made; reviewability asks whether a change carries only
                          what it needs.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question and
                          entries.concern_reviewability.question)
                        Strength: moderate; it says nothing about
                        which layout works better, only which changes
                        fewer ruled records.

