title:                  One package for each dataflow component, as in cctool today
brief:                  |
                        Every package of cctool realizes exactly one
                        component, and the import rule takes a
                        module's component from the innermost package
                        that realizes one. The trial put the model,
                        the engine and the standard nodes in one
                        package that realized three components, and a
                        module with no component of its own, the
                        recording reader, inherited all three and drew
                        import advice for reading the dictionary. A
                        folder for each dataflow component keeps the
                        convention cctool already follows, so the
                        component of each module, and what it may
                        import, can be read from its path and reviewed
                        there.
description:            |
                        Sources:
                        - cctool.check realizes lco_tooling_check and
                          cctool.gate
                          realizes lco_tooling_gate, and each other package of cctool
                          realizes one component in the same way (the edge list in the
                          docstring of src/cctool/check/__init__.py, and the same in
                          src/cctool/gate/__init__.py).
                        - A module's component is the one that the
                          module itself
                          realizes, or else the one that the innermost package around it
                          realizes (src/cctool/graph/derive.lp within python_component).
                        - The trial's dataflow package realizes
                          lco_dataflow_model,
                          lco_dataflow_engine and lco_dataflow_nodes, and its recording
                          reader, which three components hold, drew import_not_allowed
                          for importing the dictionary (trial 2c777ab9,
                          src/cctool/dataflow/__init__.py at edge; review of 2026-10-29,
                          CC-060).
                        - An import is checked against the components
                          of its modules and
                          their dependency edges.
                          (_data/decision/dec_check_of_import_layering/ruling_check_of_import_layering.yaml
                          at brief)
                        - Maintainability asks how readily a newcomer
                          understands the
                          design; reviewability asks whether a person can read a change
                          and judge it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question and
                          entries.concern_reviewability.question)
                        Strength: moderate; a cctool.dataflow package
                        whose subpackages each realize one component
                        gets the same result, so the point is against
                        one package holding several components, not
                        against either top-level place.

