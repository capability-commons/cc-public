title:                  Dataflow code under cctool.dataflow
brief:                  |
                        The model, the checks and the generator are
                        packages of cctool.dataflow, and the engine's
                        C++ lives beside them, as the ICDs name them.
                        The layout ruling is amended, and so are the
                        dependency edges, so that the checks and the
                        generator may read lowered graphs.

