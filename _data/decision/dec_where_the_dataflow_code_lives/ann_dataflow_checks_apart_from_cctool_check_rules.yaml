title:                  Dataflow checks apart from the rules cctool check already runs
brief:                  |
                        The checks component is to be realized under
                        cctool.check and reported by cctool check, and
                        dev's check.lp already holds dataflow rules
                        for loops, fan-in and port types. Placing the
                        checks in a cctool.dataflow package, as the
                        ICD names it and the option of code under
                        cctool.dataflow says, made a second checker in
                        the trial: cctool check ran none of its
                        dataflow checks, and it let through fan-in
                        that dev's rules refuse. None of the three
                        options places the checks where their
                        component says, so whichever is chosen should
                        say whether the dataflow checks join
                        cctool.check.
description:            |
                        Sources:
                        - The checks are to be realized by rules and
                          python under
                          cctool.check, as the other checks are, and reported by cctool
                          check.
                          (_data/logical_component/lco_dataflow_model_checks.yaml at
                          description)
                        - The checks ICD names the module
                          cctool.dataflow.checks.
                          (_data/interface_control_document/icd_dataflow_checks.yaml at
                          surface.python.native.module.module.name)
                        - The model, the checks and the generator are
                          packages of
                          cctool.dataflow.
                          (_data/decision/dec_where_the_dataflow_code_lives/opt_dataflow_code_under_cctool_dataflow.yaml
                          at brief)
                        - dev's check.lp holds feedforward_loop,
                          input_fed_twice and
                          port_type_mismatch; in the trial cctool check gave 0 failures
                          and ran no dataflow rule, and fan-in was overwritten silently
                          where dev forbids it (review of 2026-10-29, CC-024, CC-026 and
                          CC-028).
                        - Simplicity counts the jobs done by more than
                          one mechanism;
                          functional suitability asks whether each function gives the
                          right result.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure and
                          entries.concern_functional_suitability.question)
                        Strength: strong for one checker; it bears on
                        where the checks go within any of the options
                        more than on the choice between them.

