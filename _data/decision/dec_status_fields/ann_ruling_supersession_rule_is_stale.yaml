title:                  Ruling standing no longer derived from supersession
brief:                  |
                        The annotation says a current ruling is found
                        by negation over all relation_supersedes
                        edges. Now a decision has at most one ruling,
                        a change of ruling edits it in place, and no
                        ruling is superseded.
description:            |
                        No rule named current_ruling exists in
                        src/cctool/check/check.lp. competing_rulings
                        (check.lp line 1465) reports a decision with
                        two rulings, and its brief says "A change of
                        ruling edits it in place". relation_supersedes
                        admits only options and interface control
                        documents at its ends
                        (_data/register/reg_relation.yaml lines
                        266-301), and supersession_across_types
                        (check.lp line 1427) keeps it within one type.
                        Whether an option stands is still read from
                        the ruling of its decision, not from the
                        option file. Found in the review of
                        2026-10-22.

