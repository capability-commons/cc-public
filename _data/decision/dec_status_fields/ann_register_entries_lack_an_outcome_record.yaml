title:                  Register entries with no outcome record
brief:                  |
                        Status was removed from registers and entries
                        as well as options, but the outcome item that
                        replaces it covers options only. Nothing now
                        records that an entry was adopted, or marks
                        one as retired.
description:            |
                        Commit 44034ef removed status from
                        sch_register, sch_register_entry and the
                        option schema. relation_upholds and
                        relation_rejects constrain their target with
                        relcon_is_option
                        (_data/register/reg_relation.yaml lines 433,
                        465), which only type_option meets
                        (_data/register/reg_data_item_type.yaml line
                        548); relation_supersedes admits options and
                        interface control documents only (lines
                        273-307). The removed entry_status held
                        deprecated, "new writes should prefer any
                        replacement named in note"; term_deprecated
                        survives on concept entries only
                        (_data/schema/sch_regentry_concept.yaml line
                        70). No edge of a concern entry records
                        adoption or retirement; concern_traceability
                        has only a citation
                        (_data/register/reg_concern.yaml lines
                        548-587). At 44034ef no entry was deprecated.
                        The enum gave no reason either, so this is a
                        gap in the replacement, not a case for the
                        enum.

