title:                  Status restating supersession and outcome edges
brief:                  |
                        An option status enum would record a fact that
                        edges already record. Accepted or rejected
                        would now repeat relation_upholds and
                        relation_rejects, as a superseded status would
                        have repeated relation_supersedes, so one job
                        would have two mechanisms.
description:            |
                        register_status held draft, under_review,
                        accepted, superseded and withdrawn (git show
                        44034ef^:_data/schema/sch_register.yaml lines
                        90-99), but relation_supersedes then ran
                        between options only (git show
                        44034ef^:_data/register/reg_relation.yaml
                        lines 214-218), so those register values had
                        no edge to repeat. The option schema, then a
                        file named after decisions, already dropped a
                        superseded status so that "the fact is held
                        once" (git show
                        44034ef^:_data/schema/sch_decision.yaml lines
                        35-40). relation_supersedes:
                        _data/register/reg_relation.yaml lines
                        273-307. relation_upholds and
                        relation_rejects: same file, lines 410-466,
                        added in 7db4229.

