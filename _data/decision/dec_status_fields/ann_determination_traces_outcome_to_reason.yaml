title:                  Outcome item that carries its reason
brief:                  |
                        An outcome recorded as its own item points at
                        the options it settles and states why, and a
                        check can walk those edges. A status value on
                        the option holds no pointer and no reason.
description:            |
                        The removed decision_status was a string enum
                        with no field for who or why (commit 44034ef).
                        A determination requires a brief, and upholds
                        or rejects by edge
                        (_data/schema/sch_determination.yaml lines
                        14-28, 43-46; _data/register/reg_relation.yaml
                        lines 358-374, 382-401), and a check refuses a
                        determination with neither edge
                        (src/cc_public/check/check.lp lines 319-327).
                        det_cross_item_checks_engine names who decided
                        and why in its brief (lines 12-19). A check
                        reports a determination when a driver has no
                        argument (src/cc_public/check/check.lp lines
                        448-453).

