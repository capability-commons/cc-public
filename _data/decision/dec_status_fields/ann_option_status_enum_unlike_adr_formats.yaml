title:                  Option status enum unlike common ADR formats
brief:                  |
                        The removed option status enum held only
                        proposed, accepted and rejected. It had no
                        deprecated or superseded value, so it did not
                        map without loss to Nygard records or MADR.
description:            |
                        Before 44034ef the enum held three values, and
                        the schema note said there was no superseded
                        status because an edge records replacement
                        (git show
                        44034ef^:_data/schema/sch_decision.yaml lines
                        35-40, 64-70; options were then named
                        decisions). Nygard's format and MADR both have
                        deprecated and superseded values:
                        https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
                        and https://adr.github.io/madr/ . cctool
                        export okf and cctool export obsidian now
                        write every item, options among them, for
                        other tools (src/cctool/export/okf.py,
                        obsidian.py), but neither writes whether an
                        option stands, and grep -i madr over src finds
                        nothing, so no tooling exchanges options with
                        an ADR tool.

