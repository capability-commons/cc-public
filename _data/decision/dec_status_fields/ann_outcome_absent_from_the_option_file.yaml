title:                  Outcome absent from the option file
brief:                  |
                        Whether an option stands is derived from the
                        edges of the one ruling of its decision, not
                        read from the option's own file. The review
                        pages already repeat that rule, and a partner
                        or any consumer outside the checker must load
                        the graph and do the same.
description:            |
                        settles reads the relation_upholds and
                        relation_rejects edges of a ruling
                        (src/cctool/graph/derive.lp within settles),
                        and a decision has at most one ruling
                        (competing_rulings, src/cctool/check/check.lp
                        within competing_rulings). Upholds and rejects
                        are edges on the ruling
                        (_data/schema/sch_ruling.yaml at description).
                        The review pages derive the standing of each
                        option again, upheld, rejected or open, from
                        those edges (src/cctool/web/argument.py within
                        Graph.decision). cctool export okf and
                        obsidian write each option with no standing
                        (src/cctool/export). Nygard's format keeps
                        Status inside the record; MADR has an optional
                        status field
                        (https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions,
                        https://adr.github.io/madr/). The checker
                        loads the whole tree on each review
                        (src/cctool/check/check.py within review).

