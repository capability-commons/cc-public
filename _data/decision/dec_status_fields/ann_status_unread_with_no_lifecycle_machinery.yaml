title:                  Uniform status values with no reader
brief:                  |
                        Every register said draft and every entry said
                        proposed, and nothing read either. The
                        maintainer doubted that any lifecycle was
                        workable with the machinery of the time, so
                        the fields carried no information and only
                        cost upkeep.
description:            |
                        Maintainer's statements: "It's not clear to me
                        that ANY lifecycle fits well or is workable
                        with current machinery, so my initial
                        inclination is to simply remove all statuses
                        until such time as we implement some sort of
                        machinery to process them" (WTP 2026-10-13);
                        "Yes, that does match my thinking" (WTP
                        2026-10-13). On commit items: status and
                        failure counts "don't add information and they
                        make some other things unnecessarily
                        difficult" (WTP 2026-10-14). Commit 44034ef
                        (pre_squash_20261014), whose message was
                        written in the session with Claude
                        (Co-Authored-By Claude) and is not the
                        maintainer's own words: "Every register said
                        draft, every entry said proposed, and nothing
                        read either". The commit removes 62 values of
                        proposed and 6 of draft, three enums, and 165
                        lines across 9 files. At 44034ef^, the only
                        matches for "status" under src are exit
                        status, at src/check/check.py lines 25 and
                        346.

