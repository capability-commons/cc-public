title:                  No status fields until machinery acts on them
brief:                  |
                        Registers, register entries and options carry
                        no status field, and the outcome of a decision
                        is a ruling, an item of its own that upholds
                        or rejects options and says who ruled, when
                        and why. The removed values were uniform and
                        read by nothing, and an option status would
                        repeat the edges of the ruling. A tool that
                        needs a status, such as the review pages,
                        derives it from the ruling. Ruled by William
                        Payne on 2026-10-23.

