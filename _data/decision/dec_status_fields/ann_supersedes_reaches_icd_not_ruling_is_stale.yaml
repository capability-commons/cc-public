title:                  Supersession now of options and interface control documents
brief:                  |
                        The annotation says relation_supersedes covers
                        options and rulings only. Now it covers
                        options and interface control documents, and
                        not rulings.
description:            |
                        relation_supersedes constrains both ends with
                        relcon_is_supersedable
                        (_data/register/reg_relation.yaml lines
                        266-301). That constraint admits
                        rol_supersedable
                        (_data/register/reg_relation_constraint.yaml
                        line 170), which type_option and
                        type_interface_control_document play
                        (_data/register/reg_data_item_type.yaml). The
                        description of the relation says "An option or
                        an interface control document may be
                        superseded". Register entries still have no
                        outcome record, so the main point stands.
                        relation_upholds and relation_rejects now take
                        relcon_is_option at the target, which only
                        type_option meets. Found in the review of
                        2026-10-22.

