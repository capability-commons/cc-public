title:                  Worker pool that balances load and adapts to the core count
brief:                  |
                        A pool that runs ready nodes uses whatever
                        cores a board has and balances load at run
                        time, so moving to a larger or smaller board,
                        adding or moving nodes, or a change set never
                        touches placement, and parallelism such as
                        appearance beside detection comes without a
                        configuration change. The costs are a
                        scheduling cost per node per step, no inlining
                        across nodes, and performance faults that
                        depend on run-time placement and are harder to
                        reproduce.
description:            |
                        Sources: The pool runs each node whose inputs
                        are ready, with placement chosen at run time
                        and not stated in the configuration
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_ready_nodes_on_a_worker_pool.yaml
                        lines 11-17). In a Kahn process network
                        "timing of the processes does not affect
                        outputs of the system"
                        (https://en.wikipedia.org/wiki/Kahn_process_networks).
                        Taskflow uses work stealing and reports about
                        61 ns to create a task and 14 ns to add a
                        dependency (https://arxiv.org/pdf/2004.10908,
                        section 5.2 for work stealing, table 2 in
                        section 7.2 for the times). Patrol's
                        appearance runs beside the detector in one
                        step
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 138-142). ASSUMPTION: at tens of nodes
                        and 30 Hz, a per-node scheduling cost of the
                        order of 100 ns is negligible against a 33 ms
                        step. Strength: moderate; strong for scaling
                        across Linux boards, weaker for a graph of
                        many tiny nodes at high rates.

