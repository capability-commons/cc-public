title:                  Per-core call lists from the generator with no run-time scheduler
brief:                  |
                        Per-core schedules written at build time need
                        no scheduler while running and keep each
                        core's list of direct calls open to the
                        optimizer. The balance is only as good as the
                        stated costs.
description:            |
                        Sources: The generator divides the static
                        subgraph among cores from the cost stated for
                        each node and writes one schedule per core
                        with the waits between them
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml
                        at brief). Generated straight-line calls let
                        the optimizer inline small components
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 54-57). ARINC 653 uses "a round-robin,
                        fixed schedule that repeats a Major Time
                        Frame"
                        (https://en.wikipedia.org/wiki/ARINC_653).
                        ASSUMPTION: Patrol's detector cost varies from
                        frame to frame, so a fixed split can leave
                        cores idle. Strength: moderate; it weakens
                        where node costs vary widely.

