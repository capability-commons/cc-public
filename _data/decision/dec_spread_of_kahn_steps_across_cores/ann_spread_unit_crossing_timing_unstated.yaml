title:                  Unstated timing of a crossing between execution units
brief:                  |
                        The placement option says values cross between
                        execution units "at the boundaries of a step".
                        If that means a value written in one step is
                        read in the next, two nodes that run in
                        parallel within one step today must either
                        share a unit and run in series or sit in two
                        units with a step of latency between them, and
                        placement changes the tokens; the option
                        should state that a crossing lands in the same
                        step.
description:            |
                        Sources: Each execution unit runs its nodes in
                        a fixed order on one thread of control; work
                        runs in parallel between units, and values
                        cross between them at the boundaries of a step
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                        lines 13-24). Patrol's appearance runs beside
                        the detector on its own thread, "two nodes
                        firing in parallel in one step"
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 138-142). Kahn processes give the same
                        tokens whatever the timing
                        (https://en.wikipedia.org/wiki/Kahn_process_networks).
                        ASSUMPTION: "at the boundaries of a step"
                        means a value written in step k in one unit is
                        read in step k+1 in another. Strength:
                        moderate; it holds at ten times the nodes and
                        falls away if the option is read to allow
                        same-step crossing with a wait. The option
                        still needs no scheduler while running and
                        works without an OS.

