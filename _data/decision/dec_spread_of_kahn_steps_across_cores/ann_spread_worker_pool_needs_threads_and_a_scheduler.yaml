title:                  Worker pool that needs OS threads and likely a scheduling library
brief:                  |
                        Choosing placement at run time from ready
                        nodes is what libraries such as oneTBB's flow
                        graph or Taskflow provide, so the pool is the
                        option most likely to take one, and it needs
                        OS threads on every target, which rules out
                        targets with no OS. Per-core schedules from
                        the generator, or pipeline stages, need one
                        thread of control per core and atomics, but no
                        scheduler.
description:            |
                        Sources: The worker-pool option runs every
                        ready node on a pool of worker threads, with
                        placement chosen at run time
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_ready_nodes_on_a_worker_pool.yaml
                        lines 12-17). The generator option writes one
                        schedule per core with the waits between them
                        (opt_cores_assigned_by_the_generator.yaml,
                        lines 12-17). std::atomic is in C++17
                        freestanding and thread is not
                        (https://en.cppreference.com/w/cpp/freestanding).
                        Pinning a thread to a core on Linux uses
                        pthread_setaffinity_np, a nonportable GNU
                        extension
                        (https://man7.org/linux/man-pages/man3/pthread_setaffinity_np.3.html).
                        Taskflow v4 needs C++20
                        (https://github.com/taskflow/taskflow); oneTBB
                        is Apache-2.0
                        (https://github.com/uxlfoundation/oneTBB). The
                        owner wants the engine to reach systems with
                        no OS (owner's statement, 2026-10-24 13:06Z).
                        ASSUMPTION: waits between per-core schedules
                        can be built on atomics alone. Strength:
                        moderate; it does not grow with nodes, but it
                        decides whether a scheduling library enters
                        the engine at all. The generator option still
                        runs its dynamic subgraph on a pool, which
                        needs threads.

