title:                  Placement on hosts and execution units
brief:                  |
                        As in Stableflow, the configuration places
                        each dataflow node in an execution unit, which
                        runs its nodes in a fixed order on one thread
                        of control, and each execution unit on a host,
                        a computer or a system on a chip. An execution
                        unit may be an OS process, a thread, or a core
                        with no operating system, so the same graph
                        can be placed on a desktop or an embedded
                        target. Work runs in parallel between
                        execution units, and values cross between them
                        at the boundaries of a step. The graph today
                        calls these parts hosts and OS processes.

