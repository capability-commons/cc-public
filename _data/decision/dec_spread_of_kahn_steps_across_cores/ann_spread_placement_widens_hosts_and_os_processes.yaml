title:                  Placement that widens what the model already holds
brief:                  |
                        Hosts and execution units are what the model
                        and its checks already have as hosts and OS
                        processes, with a check that every process or
                        host a node or process names is listed, and a
                        variant operation that places nodes, so the
                        option is a mechanical rename across a known
                        set of files. The generator option adds a cost
                        field, generated per-core code and a second
                        spreading mechanism, a worker pool, for the
                        dynamic subgraph.
description:            |
                        Sources: The graph schema holds hosts and OS
                        processes
                        (_data/schema/sch_dataflow_graph.yaml at
                        description, allOf and $defs), and the
                        unplaced check fails a node on an unlisted
                        process or a process on an unlisted host
                        (src/cctool/check/check.lp within unplaced).
                        Patrol's mixed variant adds a host and an OS
                        process and places nodes by tag (the mixed
                        variant draft in
                        _sources/cc-patrol-notes/draft, lines 25-35).
                        The option would rename these parts, and the
                        owner dislikes the current terms since they
                        should also cover threads and systems with no
                        OS
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                        at brief; owner's statement, 2026-10-24). The
                        commit check already detects renames
                        (_sources/context.md line 34). The generator
                        option divides the static subgraph from a
                        stated cost per node and runs the dynamic
                        subgraph on a worker pool
                        (opt_cores_assigned_by_the_generator.yaml at
                        title and brief). Strength: strong; the rename
                        touches a fixed set of files however many
                        nodes use it, and the generator option has two
                        spreading mechanisms at any scale.

