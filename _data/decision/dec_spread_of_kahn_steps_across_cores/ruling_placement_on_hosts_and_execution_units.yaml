title:                  Placement on hosts and execution units
brief:                  |
                        Kahn steps are spread by placing nodes on
                        hosts and execution units. Ruled by WTP on
                        2026-10-26, as recommended. The configuration
                        of a process can, and should, say which core
                        it runs on. To run on any computer with any
                        number of cores, a variant can be generated
                        with as many processes on a host as it has
                        cores, allocating nodes to processes and
                        processes to cores as needed, so much of the
                        dynamism goes into rewriting the dataflow
                        graph.

