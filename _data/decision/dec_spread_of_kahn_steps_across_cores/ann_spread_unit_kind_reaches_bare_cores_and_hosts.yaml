title:                  Execution unit that may be a process, a thread or a bare core
brief:                  |
                        Because an execution unit may be an OS
                        process, a thread or a core with no OS, one
                        graph can be placed on a desktop, a Linux
                        board or a bare core by editing its placement
                        only. Values cross only between units at step
                        boundaries, so a transport such as ZeroMQ or a
                        shared-memory queue is needed only by units
                        that cross a process or host, and a bare core
                        needs neither. The schema today requires a
                        hostname, so it needs widening.
description:            |
                        Sources: An execution unit may be an OS
                        process, a thread or a core with no OS, and
                        values cross between units at step boundaries
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                        at title and brief). Within one process edges
                        are plain shared buffers; between processes or
                        hosts the transport is ZeroMQ or a
                        shared-memory queue, still open
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 120-128). A host requires a hostname and
                        an OS process requires a host
                        (_data/schema/sch_dataflow_graph.yaml at
                        $defs.host and $defs.os_process). The owner
                        asked for the Stableflow form, widened to
                        threads and to systems with no OS (owner's
                        statement, 2026-10-24). Patrol's
                        configurations differ in hosts, OS processes
                        and the edges that cross hosts
                        (_sources/cc-patrol-notes/plan.md lines
                        126-135). libzmq is MPL-2.0 since 4.3.5
                        (https://newreleases.io/project/github/zeromq/libzmq/release/v4.3.5).
                        Strength: strong; placement is one entry per
                        node and unit, and the transport stays at unit
                        boundaries at ten times the nodes and systems.

