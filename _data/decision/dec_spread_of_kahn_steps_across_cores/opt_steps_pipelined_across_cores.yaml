title:                  Steps pipelined across cores
brief:                  |
                        The graph is cut into stages, one per core,
                        and successive steps overlap: while one core
                        runs a later stage of a step, another runs an
                        earlier stage of the next, which adds a step
                        of latency at each cut for more throughput.

