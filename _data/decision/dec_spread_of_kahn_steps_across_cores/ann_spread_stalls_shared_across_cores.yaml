title:                  Stalls and faults shared across cores
brief:                  |
                        Generated per-core schedules wait on each
                        other within a step, so a core that stalls
                        stalls the others at the next wait; a worker
                        pool shows an overrun on different nodes in
                        different runs; pipelined steps keep several
                        steps in flight, so after a fault later stages
                        must flush or finish steps that rest on bad
                        data. Each has known fixes, such as timeouts
                        and a flush on fault.
description:            |
                        Sources: The generator option writes one
                        schedule per core with the waits between them;
                        the worker-pool option chooses placement at
                        run time; the pipelined option overlaps
                        successive steps across stages
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml,
                        opt_ready_nodes_on_a_worker_pool.yaml and
                        opt_steps_pipelined_across_cores.yaml,
                        briefs). Under the placement option values
                        cross between units at the boundaries of a
                        step
                        (opt_placement_on_hosts_and_execution_units.yaml,
                        brief). ASSUMPTION: a wait between cores has
                        no timeout unless the engine adds one.
                        Strength: moderate; these are design problems,
                        not reasons to reject an option, and the
                        generator's fixed schedules make a stall
                        reproducible.

