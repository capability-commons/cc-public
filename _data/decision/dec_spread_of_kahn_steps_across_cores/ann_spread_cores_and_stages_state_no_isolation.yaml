title:                  Per-core schedules and pipeline stages in one address space
brief:                  |
                        Cores assigned by the generator and pipelined
                        stages share one process, so neither can state
                        that nodes of different trust, or static and
                        dynamic nodes, are kept in different address
                        spaces.
description:            |
                        Sources: The generator option writes one
                        schedule per core and runs the dynamic
                        subgraph on a worker pool
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml
                        lines 11-17). The pipelined option cuts the
                        graph into stages, one per core
                        (opt_steps_pipelined_across_cores.yaml in the
                        same folder, lines 11-17). Spatial
                        partitioning in ARINC 653-style kernels uses
                        memory fixed after initialization
                        (https://arxiv.org/pdf/1508.07066, section
                        2.2). ASSUMPTION: neither option places its
                        cores or stages in separate processes; their
                        briefs do not say. Strength: moderate; it
                        holds at any size, and falls away if either
                        option is combined with placement in execution
                        units.

