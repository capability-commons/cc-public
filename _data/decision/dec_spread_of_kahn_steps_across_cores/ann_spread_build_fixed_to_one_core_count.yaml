title:                  Per-core schedules and pipeline cuts fixed to a core count
brief:                  |
                        Assigning cores in the generator, or cutting
                        the graph into one stage per core, works with
                        no OS but fixes the build to one core count,
                        so a board with another count needs generating
                        and building again.
description:            |
                        Sources: The generator writes one schedule per
                        core
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml
                        at title and brief). The pipelined option cuts
                        the graph into stages, one per core
                        (opt_steps_pipelined_across_cores.yaml in the
                        same folder, lines 11-17). A frozen schedule
                        is fixed at build time
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 33-40). ASSUMPTION: the generator could
                        assign cores within each execution unit, so
                        the option is not exclusive of placement in
                        execution units. Strength: moderate; the
                        rebuild cost is per target, not per node.

