title:                  Stated node costs that go stale with each node change
brief:                  |
                        When the generator divides work by a cost
                        stated for each node, a change to a node's
                        code may make its cost wrong, so a node change
                        spreads into its configuration and into the
                        generated schedules of other nodes on other
                        cores.
description:            |
                        Sources: The generator divides the static
                        subgraph among cores from the cost stated for
                        each node and writes one schedule per core
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml
                        at brief). The cost of software encoding
                        beside the detector on the Orin Nano is
                        unmeasured and the first thing to measure
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 71-74). ASSUMPTION: node costs are
                        measured, not derived from code, so they need
                        remeasuring when code changes. Strength:
                        strong, and stronger with more nodes per core.

