title:                  Worst-case step time fixed by placement
brief:                  |
                        When placement on cores or execution units is
                        fixed before the system starts, each runs a
                        known list of nodes in a known order, so the
                        worst-case step time of a safety-relevant path
                        can be analyzed and tested. A worker pool
                        chooses placement at run time, so step time
                        varies with load and is harder to bound,
                        though its values stay the same.
description:            |
                        Sources: In the placement option each
                        execution unit runs its nodes in a fixed order
                        on one thread of control
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml,
                        brief). The generator option writes one
                        schedule per core at build time
                        (opt_cores_assigned_by_the_generator.yaml,
                        brief). The worker-pool option chooses
                        placement at run time
                        (opt_ready_nodes_on_a_worker_pool.yaml,
                        brief). ARINC 653 uses "a round-robin, fixed
                        schedule that repeats a Major Time Frame"
                        (https://en.wikipedia.org/wiki/ARINC_653).
                        ASSUMPTION: Kahn semantics keep a worker
                        pool's outputs deterministic; the cost is to
                        timing, not to values. Strength: strong in
                        hard-timed systems, and stronger at ten times
                        the nodes.

