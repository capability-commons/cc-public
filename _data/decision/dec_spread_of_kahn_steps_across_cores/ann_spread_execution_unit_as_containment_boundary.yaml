title:                  Execution unit as a boundary that contains and isolates
brief:                  |
                        Placement on hosts and execution units gives
                        every node a stated unit that can be watched,
                        restarted and, where it is an OS process or a
                        partition, used to contain a crash or keep
                        nodes of different trust apart; with state in
                        mapped files a crashed unit can resume from
                        its last committed step. A worker pool chooses
                        placement at run time, so it states no such
                        unit. The benefit holds only where a system
                        chooses processes or partitions, not threads
                        or bare cores.
description:            |
                        Sources: An execution unit may be an OS
                        process, a thread or a core with no OS, each
                        on a host, and values cross between units at
                        step boundaries
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                        at title and brief). The worker-pool option
                        chooses placement at run time
                        (opt_ready_nodes_on_a_worker_pool.yaml at
                        title and brief, in the same folder). A
                        process controller reports the load and
                        exceptions of its process
                        (_data/interface_control_document/icd_process_controller.yaml
                        at
                        surface.step.dataflow_step.output.feedback),
                        and the system controller halts the system on
                        such an exception
                        (_data/interface_control_document/icd_system_controller.yaml
                        at description). With MAP_SHARED a dead
                        process's dirty pages stay in the page cache
                        and a crashed process can resume from its last
                        committed step; that option is not the default
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 130-151). ARINC 653 partitions keep
                        faults from propagating, and fault handling
                        tied to its health monitoring can restart them
                        (https://ptolemy.berkeley.edu/projects/chess/hcssas/papers/GoldbergPositionPaper.pdf);
                        partitioning enforces fault containment
                        (https://arxiv.org/pdf/1508.07066, section
                        2.2). The owner wants the placement terms to
                        cover threads and systems with no OS (owner's
                        statement, 2026-10-24). ASSUMPTION: threads in
                        one process share an address space, so a
                        thread or bare-core unit does not contain a
                        memory fault. Strength: strong for OS-process
                        units, at ten times the nodes as well; weak
                        for thread or bare-core units.

