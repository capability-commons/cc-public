title:                  Same tokens under any spread that keeps step dependencies
brief:                  |
                        Kahn semantics give the same tokens whatever
                        the timing, so any spread that keeps each
                        step's dependencies, whether per-core
                        schedules made at build time or ready nodes
                        run on a pool, gives the same results as one
                        core would.
description:            |
                        Sources: "Processes of a KPN are deterministic
                        ... timing of the processes does not affect
                        outputs of the system"
                        (https://en.wikipedia.org/wiki/Kahn_process_networks,
                        cited in
                        _data/decision/dec_first_semantics/ann_kahn_determinism_makes_runs_repeatable.yaml).
                        Synchronous dataflow schedules, including
                        schedules onto several processors, can be made
                        at compile time (Lee and Messerschmitt 1987,
                        https://ptolemy.berkeley.edu/publications/papers/87/staticscheduling).
                        Taskflow's executor "schedules dependent tasks
                        across worker threads"
                        (https://arxiv.org/pdf/2004.10908, section
                        4.1). The generator option writes one schedule
                        per core with the waits between them
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml,
                        brief). Patrol already runs appearance beside
                        the detector in one step, with a deterministic
                        join
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 138-142). Strength: strong; it holds at
                        any number of nodes and cores.

