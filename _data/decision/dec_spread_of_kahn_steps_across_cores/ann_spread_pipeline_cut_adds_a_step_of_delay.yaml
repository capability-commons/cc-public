title:                  Step of delay added at each pipeline cut
brief:                  |
                        Pipelining adds a step of latency at each cut,
                        so where the cuts fall changes what a node
                        sees, moving a cut changes outputs and parity
                        expectations, and a hazard sensed at the first
                        stage reaches a safe-state action at the last
                        several steps later. Each cut is also a second
                        way to state a one-step delay, which the model
                        already has as a feedback edge.
description:            |
                        Sources: The pipelined option "adds a step of
                        latency at each cut for more throughput"
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_steps_pipelined_across_cores.yaml,
                        brief). Kahn processes are deterministic, so
                        timing does not affect outputs
                        (https://en.wikipedia.org/wiki/Kahn_process_networks,
                        cited in
                        _data/decision/dec_first_semantics/ann_kahn_determinism_makes_runs_repeatable.yaml).
                        Each Patrol decomposition step ends with
                        detector dump parity
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 175-176), and Patrol's console shows the
                        age of the result it draws
                        (_sources/cc-patrol-notes/plan.md line 180).
                        The register measures time to reach a safe
                        state after a failure
                        (_data/register/reg_concern.yaml line 442). A
                        feedback edge's value comes from the
                        invocation before
                        (_data/schema/sch_dataflow_graph.yaml lines
                        33-35). Strength: strong; the added latency
                        and the shifted tokens grow with the number of
                        cuts. Pipelining remains the option with the
                        most throughput where latency does not count.

