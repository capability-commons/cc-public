title:                  Placement as the mapping half that variants explore
brief:                  |
                        In the Y-chart of embedded design space
                        exploration an application model is mapped
                        onto an architecture in a separate step and
                        each mapping is evaluated, and the host,
                        process and place operations of the Patrol
                        variants already vary that mapping, as the
                        mixed Orin variant moves the nodes tagged ui,
                        console and layout to a console host.
                        Placement stated in configuration lets sibling
                        variants try and measure different mappings of
                        one application; a worker pool chooses
                        placement at run time, and a generator that
                        divides work by stated costs derives it, so a
                        variant can vary the mapping only indirectly
                        or not at all. If execution units replace OS
                        processes, the operations take the new name
                        too.
description:            |
                        Sources:
                        - Stefanov, Kienhuis and Deprettere model a
                          Kahn process network application and an
                          architecture separately and map one onto the
                          other in an explicit design step, followed
                          by performance analysis (CODES 2002,
                          https://ptolemy.berkeley.edu/~kienhuis/ftp/CODES_02.pdf);
                          Pimentel gives a tutorial introduction to
                          design space exploration for embedded
                          systems (IEEE Design and Test, 2017,
                          https://staff.fnwi.uva.nl/a.d.pimentel/publication/dt17/).
                        - The mixed Orin variant adds a console host
                          and process and places the nodes tagged ui,
                          console and layout there.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 25-35)
                        - The placement option has the configuration
                          place each node in an execution unit and
                          each unit on a host.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          lines 12-25)
                        - The generator option divides the static
                          subgraph among cores from a cost stated for
                          each node.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_cores_assigned_by_the_generator.yaml
                          lines 12-18)
                        - Execution unit would need a concept entry,
                          and host and OS process rewording.
                          (notes/engine-shape-2026-10-24/ruling-guide.md
                          lines 33-36, in the project files)
                        - Placement is the mapping half of the
                          Y-chart. (_sources/variants-framing.md,
                          sections 1 and 2) Strength: moderate; the
                          gain is for exploration and simulation
                          variants, which the owner named at
                          2026-10-24T23:00Z, more than for one fixed
                          deployment.

