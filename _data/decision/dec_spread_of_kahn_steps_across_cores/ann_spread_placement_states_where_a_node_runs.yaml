title:                  Placement the configuration states, where a node must run
brief:                  |
                        Some nodes must run where their hardware is,
                        Patrol runs on two hosts in one configuration,
                        and in Patrol the engine shares one OS process
                        and six cores with GStreamer's own threads.
                        Placement in declared execution units says
                        where each node runs and how many threads of
                        control the engine uses, so other products can
                        be planned around it; a worker pool chooses
                        placement at run time and leaves both out of
                        the configuration.
description:            |
                        Sources: The headless Patrol configuration
                        runs on an Orin host and a console host, and
                        its mixed variant moves nodes to another host
                        and process (_sources/cc-patrol-notes/plan.md
                        lines 126-145;
                        _sources/cc-patrol-notes/variants.md lines
                        57-67). The graph places nodes on OS processes
                        and processes on hosts, and the unplaced check
                        fails a node whose process or host the graph
                        does not list
                        (_data/schema/sch_dataflow_graph.yaml at
                        description, $defs.host and $defs.os_process;
                        src/cctool/check/check.lp within unplaced).
                        Patrol's GStreamer and engine nodes share one
                        OS process (the Patrol draft graph in
                        _sources/cc-patrol-notes/draft, lines 28-31,
                        41-42, 213-214), the Orin Nano has six A78
                        cores
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 72-73), and some GStreamer elements
                        start their own streaming threads
                        (https://gstreamer.freedesktop.org/documentation/application-development/advanced/threads.html).
                        The worker-pool option has placement "chosen
                        at run time and not stated in the
                        configuration"
                        (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_ready_nodes_on_a_worker_pool.yaml,
                        brief). Some nodes may hold hardware that
                        cannot be freed (owner's statement,
                        2026-10-24, answer 1). ASSUMPTION: a worker
                        pool is by default sized to the hardware
                        threads of the machine. Strength: strong for
                        functional suitability, growing with the
                        number of hosts; moderate for compatibility,
                        weak on a host the engine has to itself.

