title:                  Tags now, a channel to be decided later
brief:                  |
                        Peers depend on release tags and build
                        cc-public from source for now, and a channel
                        is added later, its kind and its trigger to be
                        decided, possibly a proprietary route such as
                        Axair Systems' own. Ruled by WTP on
                        2026-10-24. cc-patrol follows frequent minor
                        and point release tags, long before 1.0, so
                        cutting a release is to be cheap and the work
                        of moving a peer to a new tag is a candidate
                        for automation.

