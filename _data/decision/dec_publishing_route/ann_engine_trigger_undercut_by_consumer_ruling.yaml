title:                  Engine trigger narrowed by the consumer ruling
brief:                  |
                        The staged option makes the engine's C++ in
                        the package a trigger for a channel built once
                        per platform. The consumer ruling has since
                        made the engine a library that a peer builds
                        into its own product, which a recorded
                        annotation reads as a build in the peer's
                        toolchain for its own target host, so a
                        channel of prebuilt engines might trade that
                        tuned build for a generic one. The new
                        option's open trigger and kind avoid
                        committing to that trade.
description:            |
                        Sources:
                        - The staged option builds from source "until
                          the engine's C++ is in the package or an
                          outside partner arrives. Then each release is also built once per platform"
                          (_data/decision/dec_publishing_route/opt_publish_tags_then_channel.yaml at brief).
                        - The engine ships in the same package peers
                          install
                          (_data/decision/dec_source_layout_for_two_languages/
                          ruling_source_layout_for_two_languages.yaml at brief).
                        - Ruled on 2026-10-24: "what a peer imports or
                          builds into its own product is a library
                          with declared ranges" (_data/decision/dec_who_consumes_a_release/
                          ruling_consumers_by_what_they_consume.yaml at brief); the option ruled names the C++
                          engine as such a library (opt_consumers_by_what_they_consume.yaml at brief, same
                          folder).
                        - "Treated as a library, its sources build in
                          the peer's toolchain for that target;
                          shipped
                          inside one exact application environment, it is built once for a generic platform"
                          (_data/decision/dec_who_consumes_a_release/ann_engine_built_for_its_target_host.yaml,
                          brief).
                        - Patrol's nodes are native C++ steps called
                          by the engine, "with no Python on the hot
                          path" (_sources/cc-patrol-notes/plan.md lines 88-92); targets include a Lenovo Legion
                          laptop and a Jetson Orin Nano (same file, lines 128-131).
                        - "performance DOES still matter a lot"
                          (owner's statement, 2026-10-22).
                        - Assumption: a build tuned for a target CPU
                          or GPU runs measurably faster than a generic
                          one. Not measured.
                        - Assumption: a channel could still carry
                          engine sources as well as prebuilt engines;
                          the
                          staged option's wording does not rule this out.
                        Strength: moderate. It rests on an unmeasured
                        speed gain, but grows with the number of
                        distinct targets, which grows with peers. It
                        bears on the engine only; for the tool part,
                        source builds on peers still separate the
                        routes.

