title:                  Exact source named by a tag dependency
brief:                  |
                        A peer that depends on a release tag resolves
                        to one commit, whose tree holds the items and
                        whose history holds the commit items, so what
                        the peer runs traces straight back to its
                        reasons. A built package traces back to its
                        source only through what its build records.
description:            |
                        Sources: a git tag names a commit
                        (https://git-scm.com/docs/git-tag). The git
                        tags option has a peer build cc-public from
                        source at a release tag
                        (_data/decision/dec_publishing_route/opt_publish_git_tags_only.yaml
                        lines 11-14). Assumption: a conda package
                        records the commit it was built from only if
                        the recipe or build tool is set up to do so;
                        not checked against a specific tool. Strength:
                        weak; a channel build can be made to record
                        the tag.

