title:                  Published lock that names an access-controlled host
brief:                  |
                        Peers install cctool from the lock each
                        release publishes, and a lock names each
                        package by the URL of its host. If the later
                        channel is an access-controlled route, the
                        published lock is installable only by a peer
                        with access to that host, and the credentials
                        must live wherever the lock is resolved, which
                        for the first peer is off its own host. The
                        new option names a proprietary route as the
                        likely case, and whether that route needs
                        credentials is not known, so the form of the
                        published lock waits on the channel's access
                        rules.
description:            |
                        Sources:
                        - "What a peer runs, such as cctool and its
                          hooks, is an application installed from the
                          tested lock each release publishes" (_data/decision/dec_who_consumes_a_release/
                          ruling_consumers_by_what_they_consume.yaml lines 13-16).
                        - pixi.lock records each channel and index by
                          URL and each package by its full URL
                          (pixi.lock lines 4-7 and line 12).
                        - The new option names "possibly a proprietary
                          route" (_data/decision/dec_publishing_route/
                          opt_publish_tags_now_channel_to_be_decided.yaml lines 16-17).
                        - prefix.dev's post on its channels, which may
                          be private or public, has users install
                          their packages with the API key authentication it provides
                          (https://prefix.dev/blog/introducing_channels, 2023-05-23). This is one example of an
                          access-controlled host, not a claim about Axair Systems' route.
                        - cc-patrol is "local to atlas only" with "No
                          remote yet"
                          (_sources/cc-patrol-notes/plan.md
                          lines 109 and 112), and the atlas VM has no network, so only the owner can relock
                          (context note, _sources/context.md line 30).
                        - Assumption: "possibly proprietary" includes
                          a host that requires credentials. Not known.
                          Strength: moderate. With ten times the
                          peers, each needs access arranged. The tag
                          route, which the option keeps since a
                          channel is "added", leaves a way in for
                          peers without access, at the cost of source
                          builds. Answered if any channel the option
                          admits can be read without credentials, or
                          if the release also publishes a lock that
                          resolves from public hosts only.

