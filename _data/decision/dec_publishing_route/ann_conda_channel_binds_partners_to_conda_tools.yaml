title:                  Conda tools required of partners by a channel
brief:                  |
                        Conda packages are installed by
                        conda-compatible clients such as conda, mamba
                        and pixi, so a channel alone asks a partner on
                        pip or another manager to adopt one of them. A
                        channel also cannot carry a SemVer pre-release
                        spelling unchanged, since a conda version may
                        not contain a hyphen.
description:            |
                        Sources: a conda package version "May not
                        contain '-'"
                        (https://github.com/conda/conda-build/blob/main/docs/source/resources/package-spec.rst
                        line 90). SemVer 2.0.0 marks a pre-release
                        with a hyphen
                        (https://semver.org/#spec-item-9). cc-public's
                        own environment is pixi over conda-forge, with
                        cc_public installed as a PyPI-style editable
                        package (pyproject.toml lines 57-62). Channel
                        hosting "Will require further discussion"
                        (owner's statement, 2026-10-22). Assumption:
                        pip cannot install a conda package. Strength:
                        moderate; a partner on conda-forge style
                        tooling pays nothing, and the staged option
                        inherits the issue later.

