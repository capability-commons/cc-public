title:                  Time from tag to installable release left unmeasured
brief:                  |
                        Under tags a release can be installed once the
                        tag is pushed, while any channel adds build
                        and upload time before peers can take a fix. A
                        route of unknown kind has no known publish
                        time, so the delay a channel adds to the
                        owner's quick responses cannot be weighed
                        until it is measured. This holds for the
                        staged option's channel phase too.
description:            |
                        Sources:
                        - Under the git tags option a peer depends on
                          a release tag and builds it from source
                          (_data/decision/dec_publishing_route/opt_publish_git_tags_only.yaml at brief).
                        - The staged option builds each release "once
                          per platform" and publishes it to a channel
                          (opt_publish_tags_then_channel.yaml at brief, same folder); the new option's channel
                          kind is not known (opt_publish_tags_now_channel_to_be_decided.yaml at brief).
                        - "I'd like to be able to respond to reported
                          problems quickly and largely automatically"
                          (owner's statement, 2026-10-22).
                        - "Every build and test-run should be timed
                          and the timings recorded for later analysis"
                          (_data/decision/dec_when_the_gate_builds_cpp/ruling_cpp_built_when_staged.yaml at brief); the full gate is timed at the first release
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml at brief).
                        - Automation of minor and patch releases may
                          come later, with telemetry
                          (_data/decision/dec_who_may_release/ruling_maintainer_decides_each_release.yaml, brief).
                        - Assumption: a channel's build and upload
                          take minutes per platform. Not measured.
                          Condition that would answer it: time the
                          publish step, from tag to installable, with
                          the same timing records the ruled builds
                          keep, and weigh any channel against the tag
                          route's time before admitting it. Strength:
                          weak to moderate. The delay is per release
                          and per platform, not per peer, so ten times
                          the peers do not raise it; more target
                          platforms do.

