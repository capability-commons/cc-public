title:                  Hosting service and pipeline added by a channel
brief:                  |
                        A conda channel adds a build pipeline, an
                        upload step and a host that must be up for a
                        peer to install or recover an environment, on
                        top of the git host the repository already
                        uses. Git tags, which every peer already
                        handles, add no new service or mechanism.
description:            |
                        Sources: origin is on github.com (context
                        note, _sources/context.md line 32). On a
                        channel: "Will require further discussion.
                        Hosting can be arranged." (owner's statement,
                        2026-10-22T16:29). "All peers are my own, so
                        this is acceptable for now." (owner's
                        statement, 2026-10-22T16:21). pixi can add a
                        dependency from a git repository at a tag
                        (https://pixi.prefix.dev/dev/reference/cli/pixi/add/).
                        The cc-patrol plan recommends a pixi git
                        dependency pinned to a tag, with a path
                        override for local work
                        (_sources/cc-patrol-notes/plan.md lines
                        69-72). cc-public is already a Python package
                        built by hatchling (pyproject.toml lines
                        35-55). Strength: strong for simplicity,
                        moderate for reliability and dependency risk,
                        since it is one mature host and the owner says
                        hosting can be arranged.

