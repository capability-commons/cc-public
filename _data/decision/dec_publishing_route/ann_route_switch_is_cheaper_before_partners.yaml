title:                  One-time route switch made before outside partners
brief:                  |
                        Tags first and a channel later means every
                        peer changes how it installs cc-public once,
                        at a time chosen by a trigger. A switch made
                        while the few peers are all the owner's own is
                        cheaper to recover from than one made after
                        outside partners arrive.
description:            |
                        Sources: the staged option adds a channel when
                        the engine ships binaries or an outside
                        partner arrives
                        (_data/decision/dec_publishing_route/opt_publish_tags_then_channel.yaml
                        lines 13-15). The move to main is "going to be
                        before outside partners use us" (owner's
                        statement, 2026-10-22T16:30). Strength: weak;
                        it rests on timing, which the option does not
                        fix.

