title:                  Engine build on every peer under tags alone
brief:                  |
                        Once the C++ engine is in the package, a peer
                        that builds from a tag must carry a C++17
                        toolchain, compile the engine on every fresh
                        install, including on a Jetson Orin Nano, and
                        can fail in ways the release gate never saw. A
                        channel of prebuilt packages builds each
                        release once per platform and keeps the
                        toolchain with the publisher.
description:            |
                        Sources: under the git tags option a peer
                        builds from source
                        (_data/decision/dec_publishing_route/opt_publish_git_tags_only.yaml
                        lines 12-14). The engine is new C++ (owner's
                        statement, 2026-10-21, _sources/context.md
                        line 9) and its code is to live in cc-public
                        (owner's statement, 2026-10-22T15:10). The
                        engine is planned as C++17
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 153-158). Target hosts include a Lenovo
                        Legion laptop and a Jetson Orin Nano
                        (_sources/cc-patrol-notes/plan.md lines
                        128-131; context note, _sources/context.md
                        line 35). The package is pure Python built by
                        hatchling today (pyproject.toml lines 53-55),
                        and the environment holds no C++ compiler or
                        build tool (search of pixi.lock for gxx,
                        cxx-compiler, cmake, ninja, clangxx and
                        meson). "All peers are my own, so this is
                        acceptable for now." (owner's statement,
                        2026-10-22T16:21). The owner will move to main
                        before outside partners use cc-public (owner's
                        statement, 2026-10-22T16:30). Assumptions:
                        peers' hosts will not share compiler versions;
                        compiling an optimized engine takes minutes on
                        the Orin. Strength: moderate to strong; it
                        bites once the engine ships, which is the
                        trigger the staged option names.

