title:                  Deferred channel choice held only in prose
brief:                  |
                        The new option defers both the channel's
                        trigger and its kind, out of an open set, so
                        it leaves two questions for later where the
                        staged option leaves one, and a choice the
                        owner expects to make has no item of its own
                        and no event that says when it is due.
                        Recording the choice as an open decision, with
                        the owner's statement on Axair Systems' route
                        as its context, or keeping the staged option's
                        events as review points, would give the
                        channel a traced reason when it arrives.
description:            |
                        Sources:
                        - The new option leaves the channel's "kind
                          and its trigger to be decided"
                          (_data/decision/dec_publishing_route/opt_publish_tags_now_channel_to_be_decided.yaml at brief); "Axair Systems has it's own publishing route, which we will likely want to take
                          advantage of" (owner's statement, 2026-10-24, same file lines 20-26).
                        - The staged option's triggers are "the
                          engine's C++ is in the package or an outside
                          partner
                          arrives", and its kind is one of two, "decided then" (opt_publish_tags_then_channel.yaml at brief, same folder).
                        - "A simple design follows from a small number
                          of early decisions" (_data/register/
                          reg_concern.yaml at entries.concern_simplicity.description, simplicity).
                        - Traceability counts "Needs with nothing that
                          meets them, by count" (_data/register/
                          reg_concern.yaml at entries.concern_traceability.measure).
                        - Open decisions are recorded as decision
                          items with options and no ruling, such as
                          the one
                          on commands for peers (_data/decision/dec_commands_for_peers/, which holds no ruling).
                          How one decision records that it waits on another is itself open
                          (_data/decision/dec_dependence_between_decisions/, no ruling).
                        - Assumption: Axair Systems' route will become
                          usable at a time not known now, which is why
                          a fixed trigger may not fit it.
                        Strength: strong for traceability, at one open
                        item per deferred choice, independent of the
                        number of peers; weak for simplicity, since it
                        counts open questions rather than mechanisms
                        and does not answer the option's reason that
                        the route will evolve.

