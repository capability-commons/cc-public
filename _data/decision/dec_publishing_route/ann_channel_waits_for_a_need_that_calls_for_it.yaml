title:                  Channel deferred until a need calls for it
brief:                  |
                        Every peer today is the owner's own and can
                        build from a tag, so a channel set up now
                        would answer no present need, against the rule
                        to add a mechanism only when a real instance
                        needs it. Tags now and a channel later runs
                        one route at a time and names the events that
                        would bring in the channel, so the channel
                        arrives with a traced reason.
description:            |
                        Sources: "All peers are my own, so this is
                        acceptable for now." (owner's statement,
                        2026-10-22). On the channel: "Will require
                        further discussion. Hosting can be arranged."
                        (owner's statement, 2026-10-22). The staged
                        option adds a channel when the engine ships
                        binaries or an outside partner arrives
                        (_data/decision/dec_publishing_route/opt_publish_tags_then_channel.yaml
                        lines 11-15). "Add a type, relation, field or
                        command only when a real instance needs it."
                        (AGENTS.md lines 234-238). The cc-patrol plan
                        recommends a pixi git dependency pinned to a
                        tag (_sources/cc-patrol-notes/plan.md lines
                        69-72). Limit: the growth rule names types,
                        relations, fields and commands, and a
                        publishing channel is not literally among
                        them. Strength: moderate; the staged option
                        matches tags alone today and differs only in
                        naming a later trigger.

