title:                  Third-party route with unrecorded terms and exit
brief:                  |
                        The new option prepares to take a route whose
                        form, terms and maintainer are unrecorded, run
                        by a party other than cc-public's copyright
                        holder, so what happens if it changes or is
                        withdrawn cannot yet be assessed. The two
                        kinds the staged option names are open formats
                        served by more than one host and client, so a
                        host can be replaced without peers changing
                        clients.
description:            |
                        Sources:
                        - Nothing in the repository describes Axair
                          Systems' publishing route (search of the
                          repository; the option itself quotes the owner's statement of 2026-10-24T18:09Z,
                          _data/decision/dec_publishing_route/opt_publish_tags_now_channel_to_be_decided.yaml
                          lines 20-26).
                        - cc-patrol is "private, under Axair's
                          copyright" (_sources/cc-patrol-notes/plan.md
                          line
                          109); cc-public's copyright is "Copyright 2026 William Payne" (pyproject.toml line 5),
                          and the owner "intends to assign Patrol IP to Axair Systems later" (plan.md lines
                          119-120).
                        - Conda channels can be hosted by
                          anaconda.org, which serves conda-forge
                          (pixi.lock line
                          5), or by prefix.dev, which offers private or public channels
                          (https://prefix.dev/blog/introducing_channels);
                          PyPI-style indexes are read by pip and pixi alike (pixi.lock line 7).
                        - prefix.dev channels were "in beta and free
                          to use", with usage-based pricing planned
                          (same page, 2023-05-23), so a named open-format host also carries terms that can change.
                        - Inference: Axair Systems is a party other
                          than the copyright holder, from the two
                          copyright statements above.
                        - Assumption: a proprietary route may use a
                          format or protocol that only its owner
                          serves,
                          which would make leaving it a change on every peer. Not known.
                        Strength: moderate. It grows with peers, since
                        an exit touches each one. It weakens if the
                        owner's control of Axair Systems makes
                        withdrawal his own choice, which is not
                        recorded, and it is answered if any channel
                        admitted must be readable by an open conda or
                        PyPI client.

