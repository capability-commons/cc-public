title:                  One channel, not two, when another route arrives
brief:                  |
                        The owner expects to take advantage of Axair
                        Systems' own route, while the staged option's
                        engine trigger is close to certain to fire,
                        since the engine is ruled into the package. If
                        it fires first, it builds a conda channel or
                        an index, and if Axair Systems' route is
                        neither of those kinds, which is an
                        assumption, a later move to it would leave two
                        routes for one job or one route abandoned.
                        Leaving the kind open until the route is known
                        avoids building a channel that may be
                        replaced, and no release or upload code exists
                        yet to be sunk.
description:            |
                        Sources:
                        - Axair Systems "has it's own publishing
                          route, which we will likely want to take
                          advantage
                          of ... so this is going to be something that evolves over time" (owner's statement,
                          2026-10-24, quoted in _data/decision/dec_publishing_route/
                          opt_publish_tags_now_channel_to_be_decided.yaml at description).
                        - The staged option adds a channel when the
                          engine's C++ is in the package or an outside
                          partner arrives, of kind conda channel or Python package index
                          (opt_publish_tags_then_channel.yaml at brief, same folder).
                        - The engine and its generator ship in the
                          same package that peers install
                          (_data/decision/dec_source_layout_for_two_languages/
                          ruling_source_layout_for_two_languages.yaml at brief).
                        - No command in src/cctool/cli makes a
                          release, tag or upload; a search for
                          "release" finds
                          only the ontology-release option (src/cctool/cli/editing.py, scout's search), so every
                          route's build-and-upload step is new code.
                        - Assumption: Axair Systems' route is neither
                          a conda channel nor a Python package index.
                          Nothing in the repository says what form it takes; if it is one of those two kinds, the
                          staged option's "decided then" could choose it and the double route does not arise.
                        Strength: moderate, and conditional on the
                        assumption. With ten times the peers a second
                        route costs more to run and to migrate away
                        from, so the point grows stronger.

