title:                  Git tag as a movable reference
brief:                  |
                        A git tag can be deleted or moved by whoever
                        controls the repository host, so a peer pinned
                        to a tag depends on that host and on that
                        discipline holding. A package in a channel is
                        a fixed file recorded with a hash.
description:            |
                        Sources: git tag -d deletes a tag and git tag
                        -f replaces one
                        (https://git-scm.com/docs/git-tag). Conda
                        packages in the lock are recorded by URL with
                        a sha256 and md5 (pixi.lock lines 735-737).
                        All peers are the owner's own today (owner's
                        statement, 2026-10-22). Assumption: pixi
                        records the resolved commit of a git
                        dependency in its lock, which would limit a
                        moved tag's effect to the next relock; not
                        checked. Strength: weak; while every peer is
                        the owner's own, one person controls both the
                        tags and the peers.

