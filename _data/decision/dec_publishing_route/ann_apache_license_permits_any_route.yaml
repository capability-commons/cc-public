title:                  Redistribution through any route permitted by the license
brief:                  |
                        Apache-2.0 lets anyone distribute the work in
                        any medium on the conditions of its section 4,
                        chiefly that recipients get the license and
                        that derivative works keep the NOTICE
                        attributions, so a proprietary route raises no
                        license barrier to carrying cc-public. The
                        duty the route adds is to carry LICENSE and
                        NOTICE in each package, which the release
                        gate's check of the built package could cover.
description:            |
                        Sources:
                        - cc-public is under Apache-2.0 with the
                          legacy NOTICE (_data/decision/dec_license/
                          ruling_license.yaml at title and brief; pyproject.toml at project.license; LICENSE and NOTICE at the
                          repository root).
                        - Section 4 of Apache-2.0: "You may reproduce
                          and distribute copies of the Work or
                          Derivative Works thereof in any medium", on conditions including giving recipients a copy
                          of the license and, for derivative works, keeping the attribution notices of the NOTICE
                          file
                          (https://www.apache.org/licenses/LICENSE-2.0).
                        - The release gate checks what the built
                          package holds
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml at brief).
                        - pixi.lock records a license for each conda
                          package and none for PyPI entries
                          (_data/decision/dec_environment_manager/ann_pixi_lock_records_hashes_and_licenses.yaml,
                          brief and description).
                        - Assumption: hatchling copies NOTICE into the
                          wheel by default. Not checked.
                        - Assumption: a route that bundles
                          dependencies with cc-public redistributes
                          their licenses
                          too, which the lock records for conda entries only.
                        Strength: strong for cc-public's own license
                        at any number of peers; weak for bundled
                        dependencies, whose PyPI licenses are
                        unrecorded. Hosting cost is unknown for every
                        channel ("Hosting can be arranged", owner's
                        statement, 2026-10-22).

