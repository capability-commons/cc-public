title:                  Engine build needing a compiler the published lock leaves out
brief:                  |
                        Under tags a peer builds cc-public from
                        source, and once the C++ engine is in the
                        package that build needs a C++ compiler. The
                        ruled tool lock holds runtime dependencies
                        only and the compiler sits in cc-public's
                        default development environment only, so a
                        peer would need a second, unrecorded way to
                        get a compiler. The new option has no trigger
                        that ends this state; the staged option adds
                        prebuilt packages when the engine lands, which
                        ends it for peers that take them.
description:            |
                        Sources:
                        - "The published lock for the tool part holds
                          runtime dependencies only"
                          (_data/decision/dec_who_consumes_a_release/ruling_consumers_by_what_they_consume.yaml
                          lines 19-21).
                        - The compiler goes in the default pixi
                          environment only, "until such time as we
                          need
                          otherwise" (_data/decision/dec_when_the_gate_builds_cpp/ruling_cpp_built_when_staged.yaml
                          lines 27-30).
                        - Under tags a peer builds cc-public from
                          source
                          (_data/decision/dec_publishing_route/opt_publish_tags_now_channel_to_be_decided.yaml
                          lines 13-14).
                        - The engine ships in the package peers
                          install
                          (_data/decision/dec_source_layout_for_two_languages/
                          ruling_source_layout_for_two_languages.yaml lines 13-17). Today the package is built by
                          hatchling (pyproject.toml lines 54-56).
                        - Assumption: the build tooling a peer uses
                          would not supply a C++ compiler on its own
                          through isolated build requirements. Not checked for pixi.
                        Strength: strong once the engine ships, and it
                        scales with peers, since each one sets up a
                        compiler. Moot before the engine lands.
                        Answered by publishing a build lock, which is
                        one more published artifact, or by a channel
                        that carries prebuilt packages.

