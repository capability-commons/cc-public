title:                  Git tags now, a channel later
brief:                  |
                        Peers depend on release tags and build
                        cc-public from source until the engine's C++
                        is in the package or an outside partner
                        arrives. Then each release is also built once
                        per platform and published to a channel, whose
                        kind, conda channel or Python package index,
                        is decided then.

