title:                  Port type of a generic transport node set for each edge
brief:                  |
                        A sender or receiver must accept whatever type
                        the split edge carries, but node ports are
                        declared with fixed types in the node's spec
                        and checked by type id and size. So either a
                        node is generated for each value type and
                        library, or the port type of a transport node
                        is set for each instance and the port type
                        check learns to read it. Both node options
                        carry this cost and the engine option does
                        not. Since every value that crosses an edge is
                        plain data of a fixed size, one generic node
                        for each library can serve, so the cost is a
                        rule in the check, not code for each type.
description:            |
                        Sources:
                        - Each node's spec declares the types of its
                          inputs and outputs.
                          (_sources/axair-orchestrator/docs/component_interface.md#4-how-a-component-is-declared)
                        - Everything that crosses an edge is
                          standard-layout, trivially
                          copyable and of fixed size, described by a type id and a size.
                          (_sources/axair-orchestrator/docs/execution_levels.md#4-types-a-numpy-compatible-description)
                        - The same need for inserted nodes of every
                          port type was argued
                          in ann_inserted_node_kinds_needed_per_port_type.
                        - Assumption: the generic form is chosen over
                          generated nodes.
                          Strength: moderate; a fixed, one-time cost that does not grow
                          with the graph.

