title:                  Pluggable transport chosen by the engine
brief:                  |
                        The engine holds a transport interface with
                        plugins, and chooses one for each edge by
                        whether its ends share a process, share a host
                        or not, as Stableflow did. The dataflow graph
                        names no transport.
description:            |
                        Stableflow's approach (WTP, 2026-10-26).

