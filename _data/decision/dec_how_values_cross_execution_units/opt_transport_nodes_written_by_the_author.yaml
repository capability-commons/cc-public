title:                  Transport nodes written by the author
brief:                  |
                        The author places sender and receiver nodes,
                        or gateway nodes, in the dataflow graph by
                        hand wherever an edge crosses execution units,
                        and a check fails an edge whose ends are in
                        different units with no transport between
                        them.
description:            |
                        The explicit form, with no transform.

