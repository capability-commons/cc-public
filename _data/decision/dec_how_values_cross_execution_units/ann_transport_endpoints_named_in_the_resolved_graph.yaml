title:                  Transport and its network endpoints named in the resolved graph
brief:                  |
                        With transport nodes, the resolved graph names
                        every sender and receiver, the library each
                        uses and its settings, such as the network
                        port it listens on, so the checks, a review of
                        what a system opens to the network, and a
                        safety case all read what is deployed. Under
                        the engine option the graph names no
                        transport, so which library carries an edge,
                        and on which address, is chosen inside the
                        engine and held in no checked item.
description:            |
                        Sources:
                        - Under the engine option the dataflow graph
                          names no transport.
                          (_data/decision/dec_how_values_cross_execution_units/opt_pluggable_transport_chosen_by_the_engine.yaml
                          at brief)
                        - A node that publishes to systems outside
                          Patrol has the network
                          port it publishes on as a setting.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_track_publish.yaml
                          at surface.step.dataflow_step.settings.port)
                        - Within a segment a safety case applies to
                          what is deployed in
                          service.
                          (_sources/axair-orchestrator/docs/execution_levels.md#where-each-applies)
                        - The same argument was made for recording in
                          ann_recording_visible_in_the_checked_graph.
                        - Assumption: under the engine option the
                          engine would choose or
                          be told addresses outside the graph. Strength: moderate; it
                          holds at any size, but matters only for edges that leave a
                          host.

