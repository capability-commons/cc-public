title:                  Receiver node swapped for a link model in simulation
brief:                  |
                        Where a value crosses hosts, loss and delay
                        are faults the system must survive. A receiver
                        node is the place where loss becomes an
                        explicit empty token, as Stableflow's gateway
                        nodes do, and a simulation variant can swap it
                        for a link model that drops, delays or replays
                        tokens, so fault injection is one more
                        variant. A transport inside the engine would
                        need a fault-injection hook of its own, a
                        second mechanism for the same job.
description:            |
                        Sources:
                        - An inbound gateway node latches what arrived
                          since the last
                          step, with ena false when nothing arrived; in simulation it is
                          replaced by a link model that drops, delays or replays tokens,
                          and the safety claim is tested by fault injection.
                          (_sources/axair-orchestrator/docs/execution_levels.md#gateway-nodes)
                        - A behavior moves into the engine only when
                          no inserted node can
                          do it within a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief)
                        - Assumption: an engine-held transport would
                          need its own hook to
                          drop or delay values in simulation. Strength: moderate; it
                          holds at any size, for edges that cross hosts.

