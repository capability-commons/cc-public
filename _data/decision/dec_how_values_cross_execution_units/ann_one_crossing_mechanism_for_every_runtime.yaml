title:                  One crossing mechanism for engine, GStreamer and outside systems
brief:                  |
                        The Patrol drafts already cross hosts with
                        nodes: GStreamer nodes reach another host over
                        RTP, and results go to outside systems through
                        a track publishing node and a track receiving
                        node that the author places. Transport nodes
                        for engine edges use the same mechanism, so
                        every crossing is a pair of nodes whatever
                        runtime it joins. The engine option adds a
                        second mechanism beside these, even though the
                        drafts assumed it for engine edges.
description:            |
                        Sources:
                        - GStreamer nodes on different hosts are
                          joined only by RTP,
                          owned by GStreamer, and engine-to-engine edges use the engine's
                          own slot, queue or cross-host transport.
                          (_sources/cc-patrol-notes/draft/README.md#hybrid-nodes-and-edges)
                        - A track publishing node and a track
                          receiving node carry
                          results to and from outside systems.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_track_publish.yaml
                          at brief;
                          _sources/cc-patrol-notes/draft/icd/icd_patrol_track_receive.yaml
                          at brief)
                        - The drafts' place operation leaves crossing
                          edges to be bound to
                          a transport by the engine, as Stableflow did.
                          (_sources/cc-patrol-notes/variants.md#2-proposal-for-cc-public)
                        - Assumption: outside systems and GStreamer
                          links will keep
                          needing nodes whichever option is chosen. Strength: moderate;
                          it holds as runtimes are added, and each new runtime adds node
                          pairs, not engine code.

