title:                  Copy into the transport at every sender node
brief:                  |
                        The engine allocates each output buffer in the
                        memory of the OS process that runs the node,
                        so a sender node can only copy the value into
                        its transport, and each transport node adds a
                        call in its unit. On one host the receiving OS
                        process could read the same bytes with no copy
                        only if the engine allocated the source's
                        output buffer in shared memory, which no node
                        can do. The engine option can place that
                        buffer itself. Under the ruling on engine
                        behavior the node options need a recorded
                        exception for it, which is what the decision
                        on how a value is carried along an edge
                        covers.
description:            |
                        Sources:
                        - The framework owns all memory, and each
                          output points at a
                          buffer the framework allocated.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - With memory-mapped edge files both OS
                          processes read the same
                          bytes with no copy.
                          (_sources/axair-orchestrator/docs/execution_levels.md#option-memory-mapped-edge-files)
                        - Patrol holds a 720p stream at 30 Hz.
                          (_sources/cc-patrol-notes/plan.md#4-the-engine-updated-2026-10-21-after-wills-answers)
                        - The extra call at a gateway was argued in
                          ann_crossing_gateway_adds_a_call_per_boundary_edge, and the
                          carrying of values in dec_how_a_value_is_carried_along_an_edge
                          is open.
                        - Assumption: a 720p frame in NV12 is about
                          1.4 MB, so one copy
                          per crossing is about 41 MB per second. Strength: moderate;
                          small for small values, large for pictures, and nothing is
                          measured yet.

