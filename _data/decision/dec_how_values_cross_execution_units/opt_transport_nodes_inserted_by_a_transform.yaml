title:                  Transport nodes inserted by a transform
brief:                  |
                        The engine carries values only within one
                        execution unit. When placement puts the ends
                        of an edge in different units, a transform
                        splits the edge into a sender node in the
                        source unit and a receiver node in the target
                        unit, of one transport kind such as ZeroMQ, a
                        shared-memory queue or TCP. A variant for each
                        transport is one transform each, and the
                        delivery policy on the edge says how arrivals
                        at the receiver become a step's token.
                        Transport libraries are dependencies of those
                        node kinds only.
description:            |
                        Proposed to WTP on 2026-10-26 in answer to his
                        question; WTP asked for it to be drafted.

