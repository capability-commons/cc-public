title:                  How values cross between execution units
brief:                  |
                        When the two ends of a dataflow edge are
                        placed in different execution units, on one
                        host or on different hosts, what carries the
                        value between them?
description:            |
                        Within one execution unit the engine hands
                        over a pointer to the output buffer. The
                        ruling on placement puts nodes on hosts and
                        execution units, and expects variants for a
                        number of cores to be generated by rewriting
                        the dataflow graph (WTP, 2026-10-26). In
                        Stableflow transport was pluggable and chosen
                        automatically by whether an edge was within a
                        process, between processes or between hosts;
                        WTP asked whether a transport can instead be
                        just another node in the graph, added by a
                        transform, with a variant for each transport
                        library (WTP, 2026-10-26). The argument on
                        crossing between static and dynamic found that
                        a transport library held by the engine becomes
                        a dependency of every build.

