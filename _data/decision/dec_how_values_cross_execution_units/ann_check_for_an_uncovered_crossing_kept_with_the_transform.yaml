title:                  Check for a crossing with no transport, kept under the transform
brief:                  |
                        A transform sits between the graph that was
                        reviewed and the graph that runs, so a fault
                        in the transport transform, such as a missed
                        crossing or a wrong policy, reaches every
                        variant it is applied to. The author option
                        names a check that fails an edge whose ends
                        are in different execution units with no
                        transport between them. Under the transform
                        option that check is still needed on the
                        resolved graph, so the output of the transform
                        is held to it; the transform option does not
                        yet say so.
description:            |
                        Sources:
                        - The author option has a check that fails an
                          edge whose ends are
                          in different execution units with no transport between them.
                          (_data/decision/dec_how_values_cross_execution_units/opt_transport_nodes_written_by_the_author.yaml
                          at brief)
                        - The transform option names no such check.
                          (_data/decision/dec_how_values_cross_execution_units/opt_transport_nodes_inserted_by_a_transform.yaml
                          at brief)
                        - The trust placed in the transform that
                          inserts nodes was argued
                          in ann_inserted_nodes_trust_the_transform.
                        - Assumption: the checks run on every resolved
                          graph, so the check
                          costs nothing to keep. Strength: moderate; one transform covers
                          every graph, so the exposure does not grow with them, but a
                          fault in it reaches all of them.

