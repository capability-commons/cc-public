title:                  Crossing edges that change with each placement variant
brief:                  |
                        The placement ruling expects a variant for
                        each core count to be generated by moving
                        nodes between OS processes, so which edges
                        cross execution units changes from one variant
                        to the next. Transport nodes written by the
                        author must then be rewritten in each variant,
                        or every variant operation that moves a node
                        must add and remove them. A transform reads
                        the placement of the resolved graph and
                        inserts them wherever an edge crosses, and the
                        engine option needs nothing in the graph at
                        all.
description:            |
                        Sources:
                        - A variant for any number of cores can be
                          generated by
                          allocating nodes to OS processes and OS processes to cores, so
                          much of the dynamism goes into rewriting the dataflow graph.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - The Patrol drafts have a place operation
                          that moves nodes to
                          another OS process, after which the edges that cross are bound
                          to a transport by the engine.
                          (_sources/cc-patrol-notes/variants.md#2-proposal-for-cc-public)
                        - The author option places sender and receiver
                          nodes by hand
                          wherever an edge crosses execution units.
                          (_data/decision/dec_how_values_cross_execution_units/opt_transport_nodes_written_by_the_author.yaml
                          at brief)
                        - The same cost was argued for gateways at the
                          boundary between
                          static and dynamic nodes in
                          ann_boundary_gateways_added_in_every_variant.
                        - Assumption: a placement variant often moves
                          several nodes at
                          once. Strength: strong; the hand-written work grows with the
                          number of placement variants and crossing edges.

