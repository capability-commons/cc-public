title:                  A ruling schema that keeps such facts in edges
brief:                  |
                        The ruling schema holds only the descriptive
                        fields and edges, and keeps even which options
                        are upheld and who ruled out of fields, so a
                        simulation-based field would be the first
                        exception and a hand-set label that can
                        disagree with the edges. Once run citations
                        are edges, which supports of an upheld option
                        rest on runs can be read from the graph, and
                        the source of the distinction says the two
                        terms largely overlap.
description:            |
                        Sources:
                        - "A ruling carries nothing beyond them, and
                          requires a brief", and which options are
                          upheld or rejected "are edges, not fields".
                          Who made a ruling, and when, is recorded by
                          the commits. (_data/schema/sch_ruling.yaml
                          lines 17-35)
                        - The prostep paper says both terms "can
                          therefore be used largely interchangeably"
                          and that "simulation-based decisions have to
                          be simulation-informed decisions".
                          (https://www.prostep.org/fileadmin/prod-download/TechnicalPaper_Simulation-Credibility_2024_V8.1_v2.pdf,
                          section 1.1, p. 7, read by the traceability
                          advocate and re-read by the verifier)
                        - Simplicity asks whether a design follows
                          from decisions already made.
                          (_data/register/reg_concern.yaml line 486)
                          Strength: moderate to strong; it follows
                          from a schema decision already made, and the
                          reading from edges holds only once runs and
                          their citations are edges, which the
                          decisions on the shape of a run and on the
                          link between a variant and an option settle.
                          The functional suitability advocate disputes
                          that the edges show which support carried
                          the decision (see the annotation on a role
                          only the ruler knows).

