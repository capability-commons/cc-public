title:                  A field on every ruling where none rests on a run
brief:                  |
                        The tree holds 134 rulings and none rests on a
                        dataflow run, since no run type exists, so a
                        field on the ruling schema is one more value
                        to write, check and review on every ruling,
                        for a question most rulings never meet. Not
                        recording the role costs nothing.
description:            |
                        Sources:
                        - 134 ruling files in the snapshot. (count of
                          ruling files under _data/decision)
                        - No run schema exists.
                          (_data/decision/dec_shape_of_a_dataflow_run/dec_shape_of_a_dataflow_run.yaml)
                        - The field option changes the ruling schema.
                          (_data/decision/dec_simulation_based_or_informed/opt_field_on_the_ruling.yaml at brief)
                        - Add a field only when a real instance needs
                          it. (AGENTS.md#keep-it-small;
                          _data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        - Reviewability asks whether a change carries
                          only what it needs; cost asks how cost grows
                          with use. (_data/register/reg_concern.yaml at entries.concern_reviewability.question.1 and entries.concern_cost) Strength: weak to
                          moderate; the cost per ruling is small but
                          paid on every ruling, and falls if the field
                          is optional, which the option does not say.

