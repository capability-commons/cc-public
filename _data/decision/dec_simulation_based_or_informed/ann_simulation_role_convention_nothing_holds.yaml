title:                  A ruling convention that nothing holds
brief:                  |
                        A convention in the ruling brief adds no part,
                        but it is a rule no check holds, and it adds a
                        judgment to write at every ruling from now on,
                        including the many that cite no run.
description:            |
                        Sources:
                        - "A rule claims no more than something holds.
                          Where nothing holds a part of it, the rule
                          says so, or that part is cut."
                          (_data/register/reg_design_rule.yaml lines
                          47-51)
                        - The convention option has the brief of a
                          ruling say whether runs decided or informed
                          it.
                          (_data/decision/dec_simulation_based_or_informed/opt_convention_in_the_ruling_brief.yaml
                          lines 12-14)
                        - No run exists, so no ruling so far rests on
                          a run. (directory listing of _data in the
                          snapshot; _sources/survey/README.md line 80)
                        - Simplicity asks whether a design follows
                          from decisions already made; cost asks how
                          cost grows with use.
                          (_data/register/reg_concern.yaml lines 486
                          and 611-617) Strength: weak to moderate; the
                          cost per ruling is small. The reviewability
                          advocate reads the convention as binding
                          only rulings where runs mattered (see the
                          annotation on a sentence in the ruling
                          brief).

