title:                  A sentence in the ruling brief where runs mattered
brief:                  |
                        A ruling brief already states the owner's
                        reason, so a sentence saying runs decided or
                        informed the ruling is the ruler's stated
                        reason in the form the ruling already carries,
                        and it appears only on rulings where runs
                        mattered.
description:            |
                        Sources:
                        - Ruling briefs already state reasons, for
                          example the ruling on changing conditions.
                          (_data/decision/dec_changing_conditions_in_arguments/ruling_changing_conditions_in_arguments.yaml
                          lines 12-23)
                        - A ruling requires a brief, which states what
                          was ruled. (_data/schema/sch_ruling.yaml
                          lines 17-27)
                        - Reviewability asks whether a change carries
                          only what it needs.
                          (_data/register/reg_concern.yaml line 525)
                          Strength: moderate; it holds at any scale,
                          and assumes the convention binds only
                          rulings where runs played a part, which the
                          option text does not say.

