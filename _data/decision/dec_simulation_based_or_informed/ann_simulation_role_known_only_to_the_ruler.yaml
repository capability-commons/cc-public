title:                  A role of runs that only the ruler knows
brief:                  |
                        Whether runs decided a ruling or only informed
                        it is the ruler's judgment; the graph shows
                        which support cites runs but not which support
                        carried the decision, so the role is lost if
                        it is not recorded. A field can be checked
                        against the graph, since a ruling marked
                        simulation-based whose upheld option has no
                        run-citing support is wrong; a convention in
                        the brief records it but cannot be checked.
description:            |
                        Sources:
                        - Simulation-based decisions use results
                          "directly as the basis for decision making";
                          in simulation-informed ones results "play a
                          role but are not the sole basis". (prostep
                          ivip, section 1.1, p. 7,
                          https://www.prostep.org/fileadmin/prod-download/TechnicalPaper_Simulation-Credibility_2024_V8.1_v2.pdf,
                          read by the functional suitability advocate
                          and re-read by the verifier)
                        - Registers, register entries and options
                          carry no status field until machinery acts
                          on them, and a tool that needs a status
                          derives it from the ruling.
                          (_data/decision/dec_status_fields/ruling_status_fields.yaml
                          lines 11-22) Assumption: the check above is
                          such machinery, and the rule extends to a
                          field on the ruling. Strength: moderate; it
                          grows with simulation-backed rulings, and
                          supports the convention only weakly.

