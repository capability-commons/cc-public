title:                  Written capacity as the one rule that adds no mechanism
brief:                  |
                        Writing each capacity by hand adds nothing to
                        what the bounded-array ruling already has, a
                        capacity declared on the port. Deriving it
                        adds four things: a maximum rate on every
                        producer, a maximum items per step on other
                        ports as a number or a function of inputs, a
                        propagation transform, and a declared bound on
                        every feedback edge with a check that it
                        holds. A throughput target adds more still: an
                        execution time for every node, a target, and a
                        solver for a problem that is NP-complete in
                        general. On simplicity alone the written rule
                        wins and the throughput rule loses; the
                        derived rule's mechanisms do reuse the variant
                        transforms already ruled, so its added count
                        is real but modest.
description:            |
                        Sources:
                        - Each message is a bounded array with a
                          capacity the port declares.
                          (_data/decision/dec_how_values_of_varying_size_are_held/ruling_bounded_array_of_fixed_size_elements.yaml
                          at brief)
                        - The buffer minimization problem is
                          NP-complete (Stuijk et al. 2006, Exploring
                          trade-offs in buffer requirements and
                          throughput constraints for SDF graphs,
                          section 1).
                        - A transform inserts sender and receiver
                          nodes where placement splits an edge, so the
                          variant pipeline already runs transforms
                          over the resolved graph.
                          (_data/decision/dec_how_values_cross_execution_units/ruling_transport_nodes_inserted_by_a_transform.yaml
                          at brief)
                        - WTP wants the approach as simple as feasible
                          and grounded in theory (WTP, 2026-10-28).
                          Strength: moderate; the count of mechanisms
                          is clear, but simplicity of the engine is
                          not changed by any option, since all three
                          are done before the target sees the graph.

