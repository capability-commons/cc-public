title:                  Written capacities left behind by a change of producer rate
brief:                  |
                        When Patrol's camera, or a detector's model,
                        is replaced by one with a higher rate or more
                        detections, every capacity downstream of it
                        must grow: the detector's output, the
                        tracker's input and whatever follows. With
                        capacities written by hand, the person making
                        the change must find each of them, and nothing
                        tells them when one is missed until an
                        overflow in the field. With capacities derived
                        from producer maxima, the change is one edit
                        to the producer's stated rate, and the
                        transform recomputes the rest in every variant
                        that uses it.
description:            |
                        Sources:
                        - Parameters are classed by effect as
                          functional, data-rate, parameter-rate or
                          structural, which sets apart the settings
                          that change a data rate (Arras et al. 2016,
                          DKPN: a composite dataflow/Kahn process
                          networks execution model, section III.B).
                          ASSUMPTION: a data-rate setting means the
                          capacity transform and its check must run
                          again; this is our reading, not the paper's
                          claim.
                        - Each capacity is written by hand, and
                          nothing checks that a written capacity
                          matches the rates of the producers that feed
                          it.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/opt_capacity_written_in_configuration.yaml
                          at description)
                        - The capacity is part of the variant
                          generated for the configuration that uses
                          that producer, and the transform propagates
                          maxima downstream.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/opt_capacity_derived_from_maximum_producer_rates.yaml
                          at brief)
                        - Every producer has a stated maximum data
                          rate; capacity is derived by a transform in
                          variant generation (WTP, 2026-10-28).
                          Strength: strong; it weakens only if
                          variants rarely change producers, which the
                          family of Patrol configurations by sensor
                          suggests they will.

