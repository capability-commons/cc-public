title:                  Capacity computed from a throughput target
brief:                  |
                        A throughput target is stated for the graph,
                        and cctool computes the smallest capacity of
                        each edge that meets it.
description:            |
                        Stuijk, Geilen and Basten (2006) show that the
                        buffer a throughput needs depends on both ends
                        of an edge and on the target, so the depth
                        belongs to the edge rather than to one port.
                        Goddard and Jeffay (1998) do the same for
                        deadlines.

