title:                  Capacity written in configuration
brief:                  |
                        Each capacity is written by hand in the
                        configuration of a variant, and cctool checks
                        only that one is given for every port.
description:            |
                        The simplest rule, and the one the ruling on
                        values of varying size describes. Nothing
                        checks that a written capacity matches the
                        rates of the producers that feed it.

