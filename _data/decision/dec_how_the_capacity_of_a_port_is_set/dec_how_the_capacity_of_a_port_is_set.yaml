title:                  How the capacity of a port is set
brief:                  |
                        Where does the number that bounds the array on
                        a port come from: is it written by hand, or
                        derived from something else that is known
                        about the system?
description:            |
                        The ruling on values of varying size makes
                        each message a bounded array with a capacity
                        the port declares, and the ruling that the
                        engine owns every buffer allocates from that
                        capacity. A capacity that is too small breaks
                        a requirement at run time, and one that is too
                        large wastes memory on the target.

