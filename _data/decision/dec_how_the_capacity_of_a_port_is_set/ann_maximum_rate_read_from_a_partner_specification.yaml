title:                  Maximum rate read from a partner's specification
brief:                  |
                        A sensor or upstream system from another
                        supplier states its maximum output rate in its
                        own specification, and the parametric dataflow
                        models state per-port maxima in the same form.
                        Derived capacities take that figure as it is
                        given, so a partner supplies a rate with a
                        unit, not a capacity in the engine's terms,
                        and a partner analysis tool can read the
                        declared maxima back. A written capacity gives
                        a partner only a number with no stated basis,
                        and a throughput target needs execution times
                        of nodes that a partner cannot supply. Where a
                        source has no known rate, the derived option
                        still takes a declared maximum, so it loses
                        nothing the written option has.
description:            |
                        Sources:
                        - In parameterized dataflow each actor
                          specifies an upper bound on the tokens
                          transferred at each port (Bhattacharya and
                          Bhattacharyya 2001, Parameterized dataflow
                          modeling for DSP systems, section on PSDF
                          graphs).
                        - A BPDF programmer must give a maximal value
                          for each parameter to ensure boundedness
                          (Bebelis et al. 2013, BPDF: a statically
                          analyzable dataflow model with integer and
                          boolean parameters, section 2.2).
                        - DIF gives each parameter a declared domain
                          as a set or an interval for exchange between
                          tools (Hsu et al. 2004, DIF: an interchange
                          format for dataflow-based design tools,
                          section 2.4).
                        - All data producers have a maximum data rate,
                          which in practice is always known (WTP,
                          2026-10-28). ASSUMPTION: Patrol's camera and
                          other bought sensors state a maximum frame
                          or message rate in their data sheets.
                          Strength: moderate; compatibility is a
                          secondary driver here, but the point favors
                          the derived option on each of the concern's
                          questions.

