title:                  Throughput-derived capacity that moves with every node's timing
brief:                  |
                        A capacity computed from a throughput target
                        depends on the execution time of every node on
                        the cycle that constrains it, so a faster or
                        slower version of any node, or a move to
                        another platform, changes capacities that the
                        node never touches. A swap of a node version
                        at a step would then change the memory layout
                        of the running graph. Capacities derived from
                        producer maxima change only when a stated
                        maximum changes, so a node swap that keeps its
                        declared maxima leaves every buffer as it was.
description:            |
                        Sources:
                        - Throughput comes from a self-timed
                          state-space exploration over node execution
                          times, and only channels on a causal
                          dependency cycle are grown (Stuijk et al.
                          2006, Exploring trade-offs in buffer
                          requirements and throughput constraints for
                          SDF graphs).
                        - A node version is swapped at a step, with
                          its state upgraded.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        - The engine allocates the buffers of each
                          edge from the port types.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief) Strength: moderate; it rests on
                          execution times being measured per platform,
                          which the throughput option needs and the
                          other two do not.

