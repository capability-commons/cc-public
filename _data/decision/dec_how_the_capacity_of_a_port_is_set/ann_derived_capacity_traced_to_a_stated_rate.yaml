title:                  Derived capacity traced to a stated producer rate
brief:                  |
                        A derived capacity traces to its reason: the
                        resolver records which transform set it, and
                        the transform takes it from a producer's
                        stated maximum rate, the step period and the
                        margin, each of which can be a requirement
                        with a measure. Overflow is then a broken
                        requirement that names which statement was
                        wrong. A capacity written by hand traces only
                        to whoever wrote it; a number larger than any
                        producer can fill is memory that nothing calls
                        for, and one too small breaks no stated
                        requirement until it overflows.
description:            |
                        Sources:
                        - The resolver records, for each part of a
                          resolved graph, the base item and every
                          variant operation that touched it, in order.
                          (_data/decision/dec_origin_trace_of_a_resolved_graph/ruling_trace_of_every_touching_operation.yaml
                          at brief)
                        - A budget is a requirement of its own with an
                          optional measure, so that a bound is written
                          once and a rule can compare it with what is
                          measured.
                          (_data/decision/dec_home_of_a_performance_budget/ruling_home_of_a_performance_budget.yaml
                          at brief)
                        - Overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                        - The traceability concern asks whether
                          anything exists that nothing calls for.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question)
                          Strength: moderate to strong; the throughput
                          option traces capacities to a target too,
                          but through execution times that are not
                          themselves requirements.

