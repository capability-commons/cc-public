title:                  Throughput target that sizes queue depth, not item count
brief:                  |
                        The buffer-throughput analysis computes how
                        many tokens a channel must hold for the graph
                        to reach a throughput, which is the queue
                        depth of an edge. Under one message per edge
                        per step that depth is already fixed at one
                        message, or two where writer and reader
                        overlap, so the analysis has nothing left to
                        choose. The number this decision sets is how
                        many items one message must hold, and that
                        follows from what the producer can deliver
                        within a step, not from the throughput of the
                        graph. A throughput target therefore answers a
                        different question, while producer maxima
                        answer this one.
description:            |
                        Sources:
                        - Stuijk, Geilen and Basten size the capacity
                          of each channel, counted in tokens, against
                          a throughput constraint, modeling a bounded
                          channel as a reverse channel whose initial
                          tokens are the free space (Stuijk et al.
                          2006, Exploring trade-offs in buffer
                          requirements and throughput constraints for
                          SDF graphs, section 4).
                        - In single-rate dataflow the buffer on an
                          edge never exceeds its initial tokens plus
                          one (Bilsen et al. 1996, Cyclo-static
                          dataflow, section on single-rate dataflow).
                        - Single step rate for the whole Kahn part,
                          each message a list of items, so Kahn edges
                          are homogeneous SDF with one message per
                          edge per step and static buffers (WTP,
                          2026-10-28).
                        - A throughput target is stated for the graph,
                          and cctool computes the smallest capacity of
                          each edge that meets it.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/opt_capacity_computed_from_a_throughput_target.yaml
                          at brief)
                        - The capacity bounds the array on a port, and
                          a capacity that is too small breaks a
                          requirement at run time.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/dec_how_the_capacity_of_a_port_is_set.yaml
                          at description) Strength: strong for Kahn
                          edges under the convention; the throughput
                          option keeps a role only on edges a designer
                          gives a queue deeper than one message, where
                          it sizes depth rather than items.

