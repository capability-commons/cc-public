title:                  Bot version named by the image tag
brief:                  |
                        Each image is tagged with the cc-public
                        release it was built from, so a commit the bot
                        makes in a peer repository can be traced to
                        the version of the bot that made it.
description:            |
                        Peers take cc-public as a versioned package
                        [ruling_peers_take_a_versioned_package,
                        brief]. ASSUMPTION: the image is built from
                        one such release and tagged with its version,
                        and the bot names that version in what it
                        writes. ASSUMPTION: a VM set up by script can
                        be upgraded in place, so the version it runs
                        is known only from the VM itself. Holds at ten
                        times the size: yes, since more deployments
                        means more versions in use at once.

