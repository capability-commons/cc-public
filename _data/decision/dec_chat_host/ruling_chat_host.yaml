title:                  One container image with one volume
brief:                  |
                        The bots ship as one container image with one
                        volume, and each deployment chooses its host
                        inside its data owner's infrastructure, as
                        rqt_chat_deployment_stays_with_data_owner
                        requires. Every kind of host named can run it,
                        from a workstation to ECS on Fargate. A
                        serverless split would reach more hosts at a
                        cost in complexity not worth paying, so a
                        container is the upper bound; a plain process
                        would mean EC2 on AWS. It follows that each
                        deployment holds its own Signal number and
                        keys, and names its own review process. Ruled
                        by WTP on 2026-10-23.

