title:                  Plain process with no image to build
brief:                  |
                        A plain process on a VM needs no container
                        image to build, publish or patch, so it is the
                        simplest bot to ship where the data owner
                        offers a VM.
description:            |
                        Under the plain process option the bot is set
                        up by a script on a Linux VM
                        [opt_host_plain_process_on_vm, brief]. Under
                        the container option a container image is
                        built and run on each host
                        [opt_host_container_with_volume, brief].
                        ASSUMPTION: an image adds a build step, a
                        registry to publish to, and a base image to
                        keep patched. Holds at ten times the size: no,
                        since at many deployments one image is less
                        work than many hand-set VMs.

