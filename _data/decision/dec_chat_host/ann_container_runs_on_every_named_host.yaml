title:                  Container that runs on every named host
brief:                  |
                        Every kind of host the data owners are likely
                        to pick runs a container with one volume, so
                        each deployment can stay inside its owner's
                        infrastructure. A plain process needs a VM,
                        which on AWS means EC2 rather than a managed
                        container service.
description:            |
                        The hosts named are a workstation for testing,
                        a Linode VM for demonstrations and interim
                        use, an EU cloud provider for DTU work, and an
                        AWS service for Axair work [owner's
                        statement]. The bot needs a process that stays
                        up, a volume that survives a restart, a
                        working copy on local disk and outbound HTTPS
                        [ruling_chat_edit_interface, brief; ASSUMPTION
                        for the rest]. ASSUMPTION: each of those hosts
                        offers a container with a volume: a local
                        container, a container on the VM, the
                        provider's container service, and ECS on
                        Fargate with EFS. For Axair a high level AWS
                        service is preferred [owner's statement].
                        Holds at ten times the size: yes, since more
                        deployments means more owners each choosing a
                        host.

