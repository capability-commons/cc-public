title:                  Workstation host widens the blast radius
brief:                  |
                        A bot takes untrusted input from anyone who
                        can message it and feeds it to an LLM. Running
                        it on the workstation that holds all the
                        repositories puts them all within reach of a
                        compromise.
description:            |
                        The maintainer's workstation (atlas) holds the
                        repositories [context.md line 58]. Under
                        opt_host_maintainer_workstation, the bots run
                        on that workstation, each from a clone of its
                        own [opt_host_maintainer_workstation.yaml
                        brief]. Under opt_host_small_server, the bots
                        run on a small server that stays up
                        [opt_host_small_server.yaml brief]. Personal
                        data lives only in private repositories
                        [owner's statement]. Security asks what an
                        attacker can reach and counts known
                        vulnerabilities open [reg_concern.yaml lines
                        159-165]. ASSUMPTION: bots on the workstation
                        run as the maintainer's user or can reach its
                        files and credentials, so a clone of its own
                        is not a boundary. ASSUMPTION: a small server
                        needs only outbound connections to Signal, but
                        it adds one more machine to patch. Holds at
                        ten times the size: yes, because more bots
                        mean more untrusted input on the host, and the
                        workstation's holdings stay all-or-nothing.

