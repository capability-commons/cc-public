title:                  No new holder of personal data
brief:                  |
                        The workstation of the maintainer already
                        holds the repositories, so a bot there adds no
                        new place that holds personal data. A small
                        server adds one more copy and, if rented, one
                        more party.
description:            |
                        The maintainer's workstation (atlas) holds the
                        repositories [context.md lines 57-58].
                        Personal data lives only in private
                        repositories [owner's statement]. The small
                        server option runs the bots on a server that
                        stays up
                        [_data/decision/dec_chat_host/opt_host_small_server.yaml,
                        brief]. A small server that stays up is
                        usually rented from a hosting provider who can
                        reach its disks [ASSUMPTION]. The privacy
                        concern asks who can see personal data
                        [_data/register/reg_concern.yaml at
                        entries.concern_privacy.question]. Holds at
                        ten times the size: no, because at ten times
                        the conversations the workstation may not stay
                        up enough, and a server the maintainer
                        controls may become needed anyway.

