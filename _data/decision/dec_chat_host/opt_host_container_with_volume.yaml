title:                  One container image with one volume
brief:                  |
                        Ship the bots as one container image that
                        needs a process that stays up, one persistent
                        volume for keys, transcripts and the working
                        copy, and outbound HTTPS. Each deployment
                        chooses its host: a workstation, a Linux VM,
                        an EU provider's container service, or ECS on
                        Fargate with an EFS volume on AWS.

