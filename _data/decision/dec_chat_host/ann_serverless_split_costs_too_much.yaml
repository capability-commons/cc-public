title:                  Serverless split not worth its complexity
brief:                  |
                        Reaching serverless hosts would split the bot
                        into a long-running Signal adapter and a core
                        that fetches the repository for each message.
                        The extra parts cost more than a higher level
                        host gains, so a container is the upper bound.
description:            |
                        Signal holds a connection open and a
                        conversation spans hours or days, and the
                        in-process check needs a full working copy on
                        local disk [ruling_chat_edit_interface, brief;
                        ASSUMPTION for the rest]. A serverless handler
                        keeps neither between calls. The Axair website
                        runs on an AWS serverless service, but the
                        complexity a serverless bot needs is not worth
                        it, which makes a container the upper bound on
                        the level of host to target [owner's
                        statement]. Holds at ten times the size: yes,
                        since a fetch of the whole tree per message
                        grows with the tree.

