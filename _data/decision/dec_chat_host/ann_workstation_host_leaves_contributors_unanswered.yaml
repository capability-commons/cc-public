title:                  Conversation broken by an absent bot
brief:                  |
                        A contributor messages the bot when it suits
                        them. A bot on the maintainer workstation is
                        silent whenever that machine is off, so a
                        conversation stalls and the contributor must
                        remember to come back.
description:            |
                        One option runs the bots on the workstation of
                        the maintainer
                        (_data/decision/dec_chat_host/opt_host_maintainer_workstation.yaml,
                        brief). The other runs them on a small server
                        that stays up
                        (_data/decision/dec_chat_host/opt_host_small_server.yaml,
                        brief). ASSUMPTION: the workstation is not on
                        at all hours. ASSUMPTION: Signal delivers
                        queued messages to a client when it comes
                        back, so messages are delayed, not lost. Holds
                        at ten times the size: yes, because more
                        contributors means more messages sent at hours
                        when the workstation is off.

