title:                  Host setup reviewed as one file
brief:                  |
                        What the bot asks of its host is written in
                        one container definition, reviewed like any
                        other file. A VM gathers changes made by hand
                        that no review sees.
description:            |
                        Under the container option the bot is one
                        image on each host
                        [opt_host_container_with_volume, brief]; under
                        the plain process option it is set up by a
                        script on a VM the data owner provides
                        [opt_host_plain_process_on_vm, brief].
                        ASSUMPTION: the image is built from a
                        definition kept in the repository, so a change
                        to it goes through review. ASSUMPTION: a VM
                        that runs for months is changed by hand at
                        times, and those changes are not in the
                        script. Holds at ten times the size: yes,
                        since each deployment's VM drifts on its own.

