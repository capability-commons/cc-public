title:                  Runtimes carried in the image
brief:                  |
                        The bot needs Python with clingo for its check
                        and a Java runtime for signal-cli. An image
                        carries both at fixed versions, so the bot
                        works the same on every host. A VM set up by
                        script gets whatever versions its distribution
                        offers that day.
description:            |
                        The bot calls the editing module in its own
                        process [ruling_chat_edit_interface, brief],
                        and the checks run as clingo logic programs
                        [ruling_tooling_language, brief]. ASSUMPTION:
                        the Signal route uses signal-cli, which needs
                        a Java runtime. ASSUMPTION: a setup script on
                        a VM installs packages from the distribution
                        or the network at the time it runs, so two VMs
                        set up a month apart can differ. Holds at ten
                        times the size: yes, since more deployments
                        means more hosts that could differ.

