title:                  Which sense keeps the bare word step
brief:                  |
                        The concept register admits "step" for the
                        dataflow step, the interface surface a node
                        implements, while the dataflow rulings use
                        bare "step" for a local step of an execution
                        unit. Which sense keeps the bare word?
description:            |
                        The register admits "step" only for
                        concept_dataflow_step, and concept_local_step
                        says it is the sense of step in the rulings.
                        Bare "step" appears 92 times in the dataflow
                        options and rulings, and "local step" once, so
                        by the register the rulings read as about the
                        interface surface (review of 2026-10-29,
                        CC-062).
                        rule_qualify_an_entrenched_overloaded_term
                        governs a term with two senses.

