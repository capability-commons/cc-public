title:                  Local step reading that leaves the dataflow rulings as worded
brief:                  |
                        The dataflow rulings write bare step 21 times
                        and neither qualified form, mostly meaning a
                        local step, while requirements, interfaces and
                        test cases already write local step 43, 67 and
                        53 times, and requirement slots link it to
                        concept_local_step. Sixteen ids of rulings,
                        requirements, test cases and decisions carry
                        step in the local sense. Admitting step for
                        the local step changes two register entries
                        and the few interface-sense uses, such as
                        eight in the interface schema and the surfaces
                        named step in three interfaces; keeping it for
                        the dataflow step rewords the ruling sentences
                        and renames those ids; qualifying every use
                        does both.
description:            |
                        Sources:
                        - Counts over the ruling and option files of
                          the decisions about
                          lco_dataflow_engine and lco_dataflow_model, with line breaks
                          joined: 21 bare uses of step or steps in rulings and 109 in
                          options, against 0 and 28 uses of local step and 0 and 3 of
                          dataflow step; and over _data/requirement,
                          _data/interface_control_document and _data/test_case, 43, 67 and
                          53 uses of local step. (count made for this argument, 2026-10-29)
                        - The interface schema writes bare step eight
                          times, and
                          icd_printer, icd_dataflow_node and icd_dataflow_mode_controller
                          each name a surface step.
                          (_data/schema/sch_interface_control_document.yaml at
                          $defs.surface_dataflow_step; those files under
                          _data/interface_control_document at surface)
                        - A requirement slot links the local step,
                          with an edge to
                          concept_local_step.
                          (_data/requirement/rqt_control_stops_at_step_end.yaml at object)
                        - Ids with step in the local sense include
                          ruling_actors_between_steps,
                          ruling_one_message_per_kahn_edge_per_step,
                          ruling_same_step_through_fixed_slots,
                          ruling_swap_at_a_step_with_state_upgrade,
                          rqt_control_stops_at_step_end, rqt_memory_before_first_step,
                          rqt_recorder_off_step_path, rqt_transport_one_message_per_step,
                          the four test cases that verify those requirements, and four
                          decisions such as dec_change_set_at_a_step. (names of files under
                          _data)
                        - The dataflow step surface of the interface
                          schema says what the
                          step reads and writes, in the interface sense.
                          (_data/schema/sch_interface_control_document.yaml at
                          $defs.surface_dataflow_step)
                        - A term is held to its concept's sense where
                          it is used as a term:
                          in an id, a requirement slot, a title or a link. (AGENTS.md, on
                          preferred terms)
                        - One maintainability measure counts the parts
                          a representative
                          change touches. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure)
                        Strength: strong on the count of parts
                        touched; it says nothing on which reading new
                        readers expect.

