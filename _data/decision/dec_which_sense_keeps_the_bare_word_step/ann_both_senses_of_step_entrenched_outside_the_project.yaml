title:                  Both senses of step entrenched outside the project
brief:                  |
                        Caspi and Pouzet use step in two senses in one
                        paper: a pass of time in which an argument
                        crosses the whole network, the kind of pass a
                        local step is, though common to the whole
                        network, and the step function with explicit
                        state that compilation makes of a program,
                        close to the dataflow step. The project's own
                        upheld options and rulings use both too, a C
                        calling convention for the step beside a swap
                        at a step. Where both senses are entrenched
                        outside the project, the rule on overloaded
                        terms keeps both, admits the bare word for
                        each, and asks every use as a term to say
                        which. Of the three options the one that
                        qualifies every use comes nearest it, though
                        it deprecates the bare word the rule admits,
                        and each option that gives the bare word to
                        one sense takes it from readers who know the
                        other.
description:            |
                        Sources:
                        - Each step moves one value through the whole
                          network, and
                          compilation yields a step function plus explicit state for each
                          instance. (Caspi and Pouzet 1996, Synchronous Kahn networks,
                          sections 3.2 and 3.4, as summarized in
                          /mnt/project-files/notes/literature/round-2/1996-synchronous-kahn-networks.md)
                        - Nodes may be written in any language behind
                          a C calling
                          convention for the step, the port arrays and the control message.
                          (_data/decision/dec_how_a_dataflow_graph_is_written/opt_graph_as_configuration_data.yaml
                          at brief)
                        - A node version is swapped at a step, with
                          its state upgraded.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        - Where two senses are each entrenched outside
                          the project, both
                          are kept, each with a qualified preferred term and the bare word
                          admitted, and every use of the word as a term says which, a wiki
                          link to the bare word naming its concept; a sense that is the
                          project's own gives up the word.
                          (_data/register/reg_design_rule.yaml at
                          entries.rule_qualify_an_entrenched_overloaded_term)
                        Strength: moderate; it rests on one paper,
                        whose time step spans a whole network as a
                        local step does not, and the project's own
                        usage, and it turns toward the dataflow step
                        if the local step is judged the project's own
                        sense, which the rule would then ask to give
                        up the word.

