title:                  Node authors who meet step as the function they write
brief:                  |
                        The people who use the node interface are node
                        authors, and to them step is the function they
                        write: the register takes the dataflow step
                        from Stableflow, which the engine follows, and
                        the trial's node API calls its function type a
                        step function and names each standard node's
                        function with a step suffix. Keeping bare step
                        for the dataflow step matches the word a node
                        author meets in code and the sense the
                        register took from Stableflow, while giving it
                        to the local step asks every interface text to
                        say dataflow step where those readers expect
                        the bare word.
description:            |
                        Sources:
                        - The dataflow step comes from Stableflow,
                          software architecture
                          description 2.0.0, clause 5.1, and the bare word is admitted
                          where the dataflow sense is clear.
                          (_data/register/reg_concept.yaml at
                          entries.concept_dataflow_step.note)
                        - The engine is inspired by Stableflow. (WTP,
                          2026-10-28)
                        - The first graph was ported from Stableflow's
                          smoketest.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml at note)
                        - The node function type is a step function
                          pointer, and each of
                          the ten standard node types names its function with a step
                          suffix. (trial 2c777ab9,
                          src/cctool/dataflow/engine/include/df/node.h;
                          src/cctool/dataflow/standard/node_kind/, each file at function)
                        ASSUMPTION: names in code are not held to the
                        register, so they stay as they are under any
                        option, and the cost falls only on the prose a
                        node author reads. Strength: weak to moderate;
                        it turns on what readers expect, and the
                        interface schema already writes dataflow step
                        in its keys.

