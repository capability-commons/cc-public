title:                  Check on bare step that would flag everyday steps
brief:                  |
                        The option that qualifies every use needs a
                        check that reports the bare word, but the term
                        checks fail an unlinked term only in concept
                        definitions and requirement slots and only
                        advise elsewhere, because prose keeps everyday
                        senses, and the register itself calls a step
                        of a procedure everyday language. The term
                        checks also read only preferred and admitted
                        terms, so a bare step deprecated for both
                        senses is no term to them, and the one check
                        that reports a word in any text maps it to a
                        single replacement, while step has two
                        replacements and an everyday sense that
                        decision records use often. A check over all
                        prose would report uses no one should change,
                        and one confined to slots, ids and titles
                        would be a mechanism of its own, where
                        admitting step for one sense leaves
                        requirement slots to unlinked_term unchanged.
description:            |
                        Sources:
                        - Every text writes local step or dataflow
                          step, and a check
                          reports the bare word.
                          (_data/decision/dec_which_sense_keeps_the_bare_word_step/opt_step_always_qualified.yaml
                          at brief)
                        - unlinked_term fails a term without a link
                          only in a concept's
                          brief and a requirement's text slots, and term_to_link elsewhere
                          only advises, since prose may use the word in its everyday sense.
                          (src/cctool/check/check.lp within unlinked_term and strict_field;
                          src/cctool/check/advise.lp within term_to_link)
                        - The terms the checks look for in text are
                          the preferred and
                          admitted terms of the register entries.
                          (src/cctool/graph/extract.py, function _terms)
                        - word_to_replace reports a word that a
                          writing style rule maps to
                          one preferred word, in all text outside double quotes, as
                          style_american_spelling does. (src/cctool/check/check.lp within
                          word_to_replace; _data/register/reg_writing_style_rule.yaml at
                          entries.style_american_spelling.replacement)
                        - A step of a procedure is everyday language.
                          (_data/register/reg_concept.yaml at
                          entries.concept_dataflow_step.note)
                        - Bare step or steps appears about 1,130 times
                          across
                          _data/decision, some 220 of them in decisions about other
                          components, most of those in everyday senses such as a step of a
                          procedure or two records kept in step. (count made for this
                          argument, 2026-10-29, with line breaks joined, and a sample of
                          25)
                        - Simplicity asks how many mechanisms a design
                          adds, and whether
                          it does anything that another mechanism already does.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question)
                        Strength: moderate; a check confined to ids
                        and titles would be small, and the point
                        weakens if the option is read as asking only
                        for uses of the word as a term.

