title:                  Trial generator that read bare step as the local step
brief:                  |
                        Reading the rulings, requirements and
                        interfaces as they stand, the generator of the
                        trial took bare step as the pass of an
                        execution unit throughout: its engine comments
                        speak of each local step, and its process log
                        counts runs and failures in steps, while it
                        kept the interface sense only for the node
                        function, in its C type and the names of the
                        standard node functions. The review files the
                        overload as a low-severity nonconformity of
                        terms and ties no defect of the trial to it.
                        Admitting step for the local step makes the
                        register say what a generator already reads;
                        keeping it for the dataflow step leaves the
                        register at odds with that reading until every
                        record is reworded.
description:            |
                        Sources:
                        - The node header says a node is invoked once
                          in each local step,
                          and declares the node function type as a step function, and each
                          standard node type names its function with a step suffix. (trial
                          2c777ab9, src/cctool/dataflow/engine/include/df/node.h;
                          src/cctool/dataflow/standard/node_kind/, each file at function)
                        - The engine headers speak of the first local
                          step and of the items
                          that arrived in this local step. (trial 2c777ab9,
                          src/cctool/dataflow/engine/include/df/runtime.hpp and port.hpp)
                        - The process log says the example ran 20
                          steps, that the unit
                          carries on with the next step, and asks what a failed local step
                          does to the rest of the step.
                          (/mnt/project-files/notes/dataflow-trial/process-log.md)
                        - By the register the rulings read as about
                          the interface surface,
                          a low-severity finding on terms. (review of 2026-10-29, CC-062)
                        - WTP will regenerate the trial from the
                          lessons of the review.
                          (WTP, 2026-10-29)
                        Strength: moderate; one generator is one
                        sample, and a reader who follows the register
                        strictly, such as a link check, would still
                        misread.

