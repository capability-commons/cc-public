title:                  Volume of recorded outside input on a target with fixed storage
brief:                  |
                        Replay needs every value that entered the
                        graph from outside to be recorded; for a
                        camera system that is the video, which costs
                        storage bandwidth and space for the whole run
                        and wears flash, while change sets and step
                        numbers cost little. On a target with fixed
                        storage, a full log must either stop and lose
                        replay or stall the system, so the option
                        should state that logging never holds up a
                        step, what it drops first, and that it can be
                        bounded or switched off per target. Replay of
                        the static part still records the inputs
                        entering the static part, so it saves little.
description:            |
                        Sources: the log option records every value
                        that entered the graph from outside, the
                        messages each actor received and the step of
                        each change set and swap
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        at brief); the static-part option replays the
                        static subgraph from the values that entered
                        it and records the dynamic part for inspection
                        (opt_replay_of_the_static_part_only.yaml at
                        brief); no replay needs no log
                        (opt_no_replay_with_live_changes.yaml at
                        brief). Patrol's Orin configuration takes a
                        720p 30 Hz stream
                        (_sources/cc-patrol-notes/plan.md lines
                        181-182), received as RTP video
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 94-96). High-rate writes would wear the
                        Orin's eMMC or NVMe, and tmpfs does not
                        survive a reboot
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 145-148). Every buffer has a fixed
                        capacity
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 145-151). Assumptions: the log is about
                        the size of the outside inputs over the run;
                        recording the encoded RTP stream before decode
                        would cut the volume by a large factor, if the
                        decoder counts as deterministic. Answers: a
                        bounded ring buffer that keeps the last N
                        steps meets most of it. The cost is the same
                        whether or not live changes happen, so it
                        bears on replay in general more than on live
                        changes. Strength: moderate; it grows with
                        input rate and run length, not with node
                        count.

