title:                  Engine log that replays on any platform without a process recorder
brief:                  |
                        Record-and-replay tools such as rr replay a
                        whole process, but only on Linux, on certain
                        CPUs, with hardware performance counters. A
                        log the engine writes is plain data, so it
                        replays on any target the engine runs on, and
                        a run recorded on a board can be replayed on a
                        desktop. Without engine replay, debugging a
                        run with live changes would fall back on such
                        a tool.
description:            |
                        Sources: rr runs on Linux 4.7 or later, on
                        Intel Nehalem or later, some AMD Zen and some
                        AArch64 cores, and in a VM only with
                        virtualized performance counters
                        (https://github.com/rr-debugger/rr); its
                        authors reported in 2017 that a port to ARM
                        failed
                        (https://ar5iv.labs.arxiv.org/html/1705.05937;
                        later releases may differ). Edge values are
                        fixed-size plain data
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 84-86), so they can be logged byte for
                        byte with no serialization library. The log
                        option records change-set steps, actor
                        messages and outside values
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); the static-part option replays
                        the static subgraph from the values that
                        entered it
                        (opt_replay_of_the_static_part_only.yaml lines
                        12-16), which the engine also logs. Patrol
                        already has a variant that runs analysis on
                        recorded clips as a parity check
                        (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                        lines 12-17). The owner wants the engine on
                        embedded targets with no OS (owner's
                        statement, 2026-10-24 13:06Z) and his instinct
                        is that runs with live changes stay replayable
                        (13:08Z). Assumption: without engine replay,
                        debugging a run with live changes would fall
                        back on an outside tool. Cross-platform replay
                        gives the same tokens only for bit-exact nodes
                        (see the annotation on node determinism). This
                        rests on how actors are run: replay in the
                        same order is easiest when actors run between
                        steps. Strength: moderate to strong; it holds
                        at any scale, and the log grows with outside
                        values and actor messages, not with node
                        count.

