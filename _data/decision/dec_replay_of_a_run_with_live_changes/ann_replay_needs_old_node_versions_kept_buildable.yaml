title:                  Every node version and its libraries kept buildable for replay
brief:                  |
                        A log replays a run only with the same code
                        that ran: every node version swapped in during
                        it, and the third-party libraries those
                        versions linked. Replay of live changes
                        therefore turns the withdrawal of an old
                        library or package build into a loss of
                        replay, for as long as runs must stay
                        replayable. Replay of the static part needs
                        only the one static build that ran, so it is
                        less exposed.
description:            |
                        Sources: the log records the step at which
                        each change set and swap took effect, and
                        replay gives the same tokens wherever nodes
                        are deterministic
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); a swap replaces version n with
                        n+1 in a running system
                        (_data/decision/dec_swap_of_a_node_version/dec_swap_of_a_node_version.yaml,
                        brief). Patrol builds against GStreamer and
                        CUDA on the Orin, and its results hold OpenCV
                        types (_sources/cc-patrol-notes/plan.md lines
                        147-149 and 156-157). The environment is
                        locked in pixi.lock and only the owner can
                        relock (_sources/context.md line 30).
                        Assumption: package channels keep old builds
                        available but give no guarantee that they
                        will. Strength: strong; the archive to keep
                        grows with the number of node versions and
                        runs.

