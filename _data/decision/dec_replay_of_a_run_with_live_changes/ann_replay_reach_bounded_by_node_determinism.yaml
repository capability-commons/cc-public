title:                  Replay only as far as the nodes are deterministic
brief:                  |
                        The log option promises the same tokens only
                        wherever the nodes are deterministic, so a
                        node that is not, such as one whose result
                        depends on parallel GPU work, or one whose
                        floating-point results differ between
                        architectures, still breaks replay downstream
                        of it. Interfaces should state determinism so
                        that the reach of a replay is known.
description:            |
                        Sources: the option's own qualifier, "wherever
                        the nodes are deterministic"
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); the dataflow step surface has an
                        optional determinism field, whether one input
                        always yields one output
                        (_data/schema/sch_interface_control_document.yaml
                        lines 803-806); Patrol's analysis interface
                        states bit-for-bit determinism
                        (_sources/cc-patrol-notes/draft/tools/icd_table.py
                        line 110), though its state includes detector
                        history on the GPU
                        (draft/icd/icd_patrol_analysis.yaml lines
                        136-137). Assumption: floating-point results
                        can differ between x86-64 and ARM64 builds, so
                        a replay on another platform gives the same
                        tokens only for nodes written to be bit-exact.
                        Strength: moderate; it narrows the claim
                        rather than refuting the option.

