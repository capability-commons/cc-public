title:                  Starting graph of a replay that is derived and never stored
brief:                  |
                        Under the ruling no resolved dataflow graph is
                        stored, so a log of change sets and inputs
                        replays a run only if it also names exactly
                        which resolved graph the run started from, and
                        a replay must then resolve that graph again
                        from the same base chain, operations,
                        interface versions and cctool, or carry the
                        graph with the log. Both replay options take
                        on that record, beside keeping old node
                        versions buildable.
description:            |
                        Sources:
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The log records the step at which each
                          change set and swap took effect, actor
                          messages and outside values, but not the
                          graph a run starts from.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml at brief)
                        - A replay needs every node version that ran
                          kept buildable.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ann_replay_needs_old_node_versions_kept_buildable.yaml at brief)
                        - The replay log needs the identity of the
                          resolved graph at the start.
                          (_sources/variants-framing.md, section 2 and
                          section 4, Q5) Strength: weak; a digest and
                          a commit per run cost little, and the same
                          identity serves runs, deployments and change
                          sets.

