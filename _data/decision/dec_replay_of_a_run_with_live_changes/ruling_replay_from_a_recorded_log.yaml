title:                  Replay from a recorded log
brief:                  |
                        A run with live changes is replayed from a
                        recorded log of outside inputs, the gap that
                        admitted each one, and the step of each change
                        set and swap. Ruled by WTP on 2026-10-29, as
                        recommended. Rephrased the same day at WTP's
                        request: the engine records nothing itself,
                        but reports these events to the control block
                        of its execution unit, as it does other
                        runtime service readings, and recording nodes
                        write the log.

