title:                  Log of every input as a store of everything the system saw
brief:                  |
                        A log of every value entering the graph and
                        every actor message holds all the data the
                        system took in, including personal or secret
                        data. The engine should let a system protect
                        the log, by encryption, restricted reading or
                        leaving marked fields out, and keep the record
                        of changes separable from the record of
                        inputs, so a system can keep the audit trail
                        without keeping the data. The other options
                        record less.
description:            |
                        Sources: the log option records every value
                        that entered the graph from outside
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); the static-part option records
                        fewer values for replay
                        (opt_replay_of_the_static_part_only.yaml lines
                        12-16), and no replay records none for it
                        (opt_no_replay_with_live_changes.yaml lines
                        12-14). rr captures all inputs to the recorded
                        processes from the kernel to make replay exact
                        (https://rr-project.org/). Some segments may
                        hold personal data on DTU members under the
                        GDPR (owner's statement, 2026-10-22T20:19,
                        _sources/context.md line 25). Patrol's Orin
                        configuration takes a 720p 30 Hz camera stream
                        (_sources/cc-patrol-notes/plan.md lines
                        181-182). It is a condition on the log option,
                        met by a field marking in the data dictionary
                        (see the annotation on secrets carried where
                        the engine copies state) and a separable
                        change record. Strength: strong; the log's
                        size and sensitivity grow with input rate and
                        the number of systems run.

