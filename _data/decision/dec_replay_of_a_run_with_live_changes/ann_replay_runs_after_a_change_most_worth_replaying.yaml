title:                  Runs after a live change as the ones most worth replaying
brief:                  |
                        The runs most likely to fail are those just
                        after a change set or a swap, and the faults
                        most likely lie in the dynamic subgraph and
                        the actors, where the change was made. No
                        replay with live changes gives up exactly
                        those runs, and replay of the static part only
                        leaves out exactly that part. A recorded log
                        lets such a fault be run again on a desk and
                        its cause found, and a system that grows by
                        changing keeps replay as it grows.
description:            |
                        Sources: the log option records the step at
                        which each change set and swap took effect,
                        the messages each actor received in order, and
                        every value from outside
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); the static-part option records
                        the dynamic subgraph and actors for inspection
                        but does not replay them
                        (opt_replay_of_the_static_part_only.yaml lines
                        12-16); with no replay, a run stops being
                        replayable after a change set or swap
                        (opt_no_replay_with_live_changes.yaml lines
                        12-14). Only the dynamic subgraph supports
                        nodes and edges added, moved or removed
                        (owner's statement, 2026-10-24, line 18). The
                        owner's instinct is that a run with live
                        changes should stay replayable, depending on
                        the drawbacks (line 41), and, speaking of
                        point and patch releases, he wants to respond
                        to reported problems "quickly and largely
                        automatically" (2026-10-22,
                        _sources/context.md line 24). The existing
                        system controller is not deterministic, and a
                        run is reproduced only in the order and
                        content of its packets
                        (_data/interface_control_document/icd_system_controller.yaml
                        lines 171-175). Assumptions: a change to the
                        running graph is more likely to introduce a
                        fault than a step of an unchanged graph, and
                        the fault lies in or near the changed part.
                        Today's Patrol configurations choose variants
                        by configuration with no automatic switching
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 86-87), so few runs yet have live
                        changes. This rests on how actors are run:
                        actors on free threads make the recorded order
                        harder to replay. Strength: strong, and
                        stronger with scale: more systems changing
                        live means more faults only replay can
                        reproduce.

