title:                  Static part replayable from the values at its boundary
brief:                  |
                        Even if the dynamic part is only recorded, the
                        static subgraph stays replayable from the
                        values that entered it, including those that
                        crossed from the dynamic part, so a system
                        that keeps its safety functions static keeps
                        replay for them. This holds only if the
                        crossing from dynamic into static gives one
                        defined value per step.
description:            |
                        Sources: the static-only option replays the
                        static subgraph from the values that entered
                        it
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_of_the_static_part_only.yaml
                        lines 12-16); the log option records the same
                        values and more
                        (opt_replay_from_a_recorded_log.yaml lines
                        12-19); with no replay, nothing is replayable
                        after a change
                        (opt_no_replay_with_live_changes.yaml lines
                        12-14). The one-step-delay option gives a
                        static input the value of the step before or
                        an explicit empty token
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_one_step_delay_into_static.yaml,
                        brief), though the owner doubts that a
                        one-step delay is needed (owner's statement,
                        2026-10-24, line 31); any crossing that gives
                        the static part one defined value per step
                        would do. Patrol's decomposition checks each
                        step by dumps that must be identical before
                        and after
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 50-51 and 175-177). This rests on the
                        decision on the crossing between static and
                        dynamic, and on where systems put their safety
                        functions. Strength: moderate; it covers only
                        what the static subgraph holds.

