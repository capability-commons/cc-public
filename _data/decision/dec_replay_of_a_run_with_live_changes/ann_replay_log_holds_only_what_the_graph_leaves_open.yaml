title:                  Log of only what the graph and its nodes do not determine
brief:                  |
                        A run can be replayed if everything not fixed
                        by the graph and its nodes is recorded: when
                        each change set and swap took effect, each
                        actor's message order, and every value from
                        outside, the principle on which rr replays
                        whole programs. If change sets are data items
                        and actors run between steps, the first two
                        are already recorded or fixed by the engine,
                        so the log adds little beyond the outside
                        inputs. The static-part option keeps two
                        regimes, replayed and only inspected.
description:            |
                        Sources: the log option records the step of
                        each change set and swap, each actor's
                        messages in order and every outside value
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        at brief); the static-part option records the
                        dynamic part and actors for inspection without
                        replay
                        (opt_replay_of_the_static_part_only.yaml at
                        brief). rr records and replays system call
                        results and signals and runs one thread at a
                        time
                        (https://ar5iv.labs.arxiv.org/html/1705.05937).
                        Kahn determinism, with the run id and the
                        digest of the resolved dataflow graph, lets
                        anyone re-run a cited scenario and get the
                        same tokens on every edge (_sources/mapping.md
                        lines 19-20); Patrol checks each decomposition
                        step by parity of dumps
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 172-177). Running actors between steps
                        is chosen so a run can be replayed in the same
                        order
                        (_data/decision/dec_how_actors_are_run/opt_actors_between_steps.yaml
                        at brief). Simplicity, a non-driver here,
                        counts distinct mechanisms
                        (_data/register/reg_concern.yaml at
                        entries.concern_simplicity.measure). This
                        rests on how actors are run (between steps,
                        the actor order is fixed by the engine and
                        need not be logged) and on the change set at a
                        step (each change set must take effect at one
                        defined step, and be a data item to count as
                        already recorded); otherwise the message-order
                        log is a new mechanism. Strength: strong under
                        those outcomes; the log grows with outside
                        inputs, not with graph size.

