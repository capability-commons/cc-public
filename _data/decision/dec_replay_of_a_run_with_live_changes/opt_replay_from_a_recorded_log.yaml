title:                  Replay from a recorded log
brief:                  |
                        The engine reports the step at which each
                        change set and swap took effect, the messages
                        each actor received in order, and every value
                        that entered the graph from outside to the
                        control block of its execution unit, and
                        recording nodes write them to a log, so a
                        replay from that log gives the same tokens on
                        every edge wherever the nodes are
                        deterministic. The engine records nothing
                        itself.

