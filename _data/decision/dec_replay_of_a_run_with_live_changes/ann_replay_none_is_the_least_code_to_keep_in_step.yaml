title:                  No replay as the least code to keep in step
brief:                  |
                        No replay with live changes adds nothing to
                        maintain: no log format, no recording in the
                        change-set and swap paths, no replay tool to
                        keep in step with the engine and the data
                        dictionary's versions. If live changes are
                        rare in practice, the code saved may outweigh
                        the faults it would help find.
description:            |
                        Sources: a run is replayable only while no
                        change set or swap is applied
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_no_replay_with_live_changes.yaml
                        at brief); the log option records change-set
                        steps, actor messages and outside values
                        (opt_replay_from_a_recorded_log.yaml at
                        brief). Patrol's first users choose a dataflow
                        variant before the run, with no automatic
                        switching for now
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 86-87). Assumptions: a replay tool and
                        log reader must change whenever the change-set
                        format, the swap protocol or the data
                        dictionary changes; logged values are typed by
                        the data dictionary, so a log written under
                        one type version must be read under it or
                        upgraded by the same mappings as state.
                        Strength: weak; it holds while live changes
                        are rare and weakens with each system that
                        relies on them.

