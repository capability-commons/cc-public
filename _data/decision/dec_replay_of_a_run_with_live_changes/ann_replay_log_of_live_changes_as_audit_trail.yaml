title:                  Log of live changes as an audit trail
brief:                  |
                        Recording the step at which each change set
                        and swap took effect gives a system a record
                        of what was changed and when, so an unexpected
                        change can be found and its effect replayed.
                        To answer who made it, the record should also
                        hold the identity of the sender that the
                        change set is authenticated against. With no
                        replay after a live change, or with only the
                        static part replayable, an attack carried out
                        through the dynamic subgraph cannot be
                        reproduced.
description:            |
                        Sources: the log option records the step of
                        each change set and swap, each actor's
                        messages in order and every outside value
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); without replay, a run stops
                        being replayable after a change
                        (opt_no_replay_with_live_changes.yaml lines
                        12-14); the static-only option records the
                        dynamic part for inspection but does not
                        replay it
                        (opt_replay_of_the_static_part_only.yaml lines
                        12-16), so the record of changes remains but
                        their effect cannot be reproduced. The
                        security concern asks whether every action can
                        be traced to whoever took it
                        (_data/register/reg_concern.yaml lines
                        163-166). The owner's instinct is that such
                        runs stay replayable (owner's statement,
                        2026-10-24). This rests on the change set at a
                        step, which would authenticate the sender.
                        Strength: strong for the record of changes,
                        which is small and does not grow with graph
                        size.

