title:                  Replay of a changed run as evidence for a safety case
brief:                  |
                        A recorded log lets a failure seen once in a
                        changed run be replayed and traced, which is
                        the evidence a safety case and an incident
                        review need. With no replay after a change,
                        any run that used the dynamic features loses
                        that evidence, and the more change sets and
                        actors a run has, the less a person can
                        reconstruct it by hand.
description:            |
                        Sources: the log option gives the same tokens
                        on every edge wherever the nodes are
                        deterministic
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19); with no replay, a run is not
                        replayable after a change set or swap
                        (opt_no_replay_with_live_changes.yaml lines
                        12-14). Stableflow's determinism makes
                        re-running a cited scenario good evidence
                        (_sources/mapping.md lines 19-20); Kahn
                        semantics matter most where safety cases rest
                        on simulation
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 178-180). rr records all inputs from the
                        kernel and nondeterministic CPU effects, so a
                        failure recorded once can be debugged
                        deterministically (https://rr-project.org/).
                        The owner's instinct is that such runs should
                        stay replayable (owner's statement,
                        2026-10-24). Strength: strong.

