title:                  One register per peer for all its entries
brief:                  |
                        A peer holds one register, named for its
                        segment, such as the register prefix with
                        cc_patrol after it, that holds every entry the
                        peer adds, whatever its type. Each entry is
                        checked against the schema of its type's
                        entries, not against one schema for the
                        register.

