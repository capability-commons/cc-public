title:                  Register uniqueness enforced by the existing id check
brief:                  |
                        The ruled rule, that every id is unique across
                        a peer and what it consumes, is already
                        enforced for registers by the duplicate id
                        check over the union the peer check reads.
                        Free register ids add no mechanism. Qualified
                        ids add a naming check tied to the segment,
                        which release ids, the cited precedent, do not
                        have: cctool release prepare writes the
                        segment into a release id, but no check
                        enforces it.
description:            |
                        Sources:
                        - Every prefix and id is unique across the
                          peer and what it consumes
                          (_data/decision/dec_how_peers_add_vocabulary/ruling_peer_holds_registers_of_its_own.yaml
                          at brief).
                        - No id names two items with different guids
                          (src/cctool/check/check.lp within
                          duplicate_id).
                        - A peer check reads the peer tree beside each
                          consumed tree and checks them together
                          (src/cctool/check/segment.py, module
                          docstring at description).
                        - Measured 2026-10-26: in a copy of the peer
                          fixture with its concept register renamed to
                          reg_concept, the peer check reported
                          duplicate_id twice for reg_concept, naming
                          both guids.
                        - The qualified option adds a check that fails
                          a peer register whose id does not carry the
                          segment's name
                          (_data/decision/dec_naming_of_a_peer_register/opt_register_id_qualified_by_its_segment.yaml
                          at brief).
                        - The id pattern of a release does not require
                          the segment's name, only a name and a
                          version
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_release.regex_id).
                        - cctool release prepare builds a release id
                          from the segment item's id without its
                          prefix, and the version
                          (src/cctool/release/release.py within
                          prepare). Strength: moderate. The count of
                          mechanisms is fixed at ten times the size,
                          but clashes between sibling peers are a
                          separate question for
                          dec_uniqueness_of_names_across_segments.

