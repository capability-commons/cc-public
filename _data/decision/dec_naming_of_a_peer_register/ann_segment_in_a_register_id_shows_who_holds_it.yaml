title:                  The holder of a register named in its id
brief:                  |
                        Some findings name a register by its id alone,
                        with no file. If the id carries the segment's
                        name, any reader can tell which segment holds
                        the register and so who answers for its
                        entries. If ids are free, a peer register can
                        take a name that reads as one of cc-public's,
                        and nothing checks it. The check the qualified
                        option adds is cheap, because the reader
                        already knows which tree each file came from.
description:            |
                        Sources:
                        - Measured 2026-10-26 in a scratch copy:
                          cctool check on a peer prints
                          misplaced_register_entry rows with the
                          register id and no file, such as the id of a
                          peer register of concepts.
                        - The union keys each consumed document under
                          a folder named for its segment, so the check
                          knows which segment a file came from
                          (src/cctool/graph/extract.py within
                          DIR_CONSUMED; src/cctool/check/segment.py,
                          module docstring at description; measured
                          2026-10-26, rows naming
                          _consumed/segment_cc_public/).
                        - The options' own terms, and the release id
                          precedent, are cited in
                          ann_free_register_names_collide_across_peers
                          and
                          ann_duplicate_id_already_enforces_register_uniqueness.
                        - Every peer is WTP's own today ("All peers
                          are my own, so this is acceptable for now.",
                          owner's statement, 2026-10-22, quoted in
                          _data/decision/dec_what_crosses_between_segments/ann_no_stated_form_for_a_database_segment.yaml
                          at description).
                        - ASSUMPTION: a reviewer who reads an
                          unqualified register id takes it to belong
                          to cc-public. Strength: weak while every
                          peer is WTP's own; moderate at ten times the
                          size with partners' segments, where
                          accountability for an entry depends on
                          knowing which segment holds it.

