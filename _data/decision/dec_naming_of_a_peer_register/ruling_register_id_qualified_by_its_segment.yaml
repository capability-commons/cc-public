title:                  Register ids qualified by their segment
brief:                  |
                        The id of a register that a peer holds carries
                        the name of its segment after the register
                        prefix and before its subject, as release ids
                        are qualified by their segment, and a check
                        fails a peer register whose id does not. Ruled
                        by WTP on 2026-10-28.

