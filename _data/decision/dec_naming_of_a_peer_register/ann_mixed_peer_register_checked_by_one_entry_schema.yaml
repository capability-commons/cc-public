title:                  Wrong entry schema applied in a mixed peer register
brief:                  |
                        In one register that holds a concept and a
                        concern, cctool checks both entries against
                        the register's one schema. The concern is
                        checked against the concept rules, and the
                        fields a concern must have go unchecked. One
                        register per subject keeps each register under
                        one schema, which the check already handles;
                        one register per peer needs a new way to
                        choose each entry's schema before a change can
                        be checked.
description:            |
                        Sources:
                        - Under the one-register option, a peer holds
                          one register for every entry it adds, and
                          each entry is checked against the schema of
                          its type's entries
                          (_data/decision/dec_naming_of_a_peer_register/opt_one_register_per_peer_for_all_its_entries.yaml
                          at brief).
                        - A schema is found only for a document, from
                          its type or its own edge, and the entries
                          inside a register are checked as part of it
                          (src/cctool/graph/derive.lp within
                          document_schema).
                        - A concern entry requires question and
                          measure; a concept entry requires
                          term_preferred
                          (_data/schema/sch_regentry_concern.yaml at
                          required;
                          _data/schema/sch_regentry_concept.yaml at
                          required).
                        - Measured 2026-10-28: with the inverse in a
                          copy of cc-public, a fixture peer register
                          that names type_concept and type_concern by
                          inverse edges and sch_reg_concept as its
                          schema, holding one concept and one concern
                          with no question and no measure, raised no
                          placement failure; the concern was reported
                          for lacking term_preferred, and not for
                          lacking question or measure.
                        - Under the qualified option, a peer register
                          keeps the schema of the register of
                          cc-public it follows, such as
                          sch_reg_concept
                          (_data/decision/dec_naming_of_a_peer_register/opt_register_id_qualified_by_its_segment.yaml
                          at brief). The free option says nothing of
                          schemas, but its example names a register
                          for one subject
                          (_data/decision/dec_naming_of_a_peer_register/opt_register_id_unique_and_otherwise_free.yaml
                          at brief).
                        - The loss for validators outside cctool is
                          argued in
                          ann_mixed_peer_register_outside_its_binding_schema.
                          Strength: strong; it is measured and the
                          mixed case passes silently today. It holds
                          at ten times the size, since each type a
                          peer mixes adds a case the new rule must
                          handle. It does not choose between the
                          qualified and the free options.

