title:                  Register ids qualified by their segment
brief:                  |
                        The id of a peer register is the register
                        prefix, the name of the segment that holds it,
                        and its subject, such as the register prefix
                        with cc_patrol_concept after it, as release
                        ids are qualified by their segment. Its schema
                        keeps the name of the register it follows,
                        such as sch_reg_concept. A check fails a
                        register in a peer whose id does not carry the
                        segment's name.

