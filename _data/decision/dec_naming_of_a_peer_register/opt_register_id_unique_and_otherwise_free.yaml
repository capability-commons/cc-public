title:                  Register ids that need only be unique
brief:                  |
                        A peer names its registers as it likes, such
                        as the register prefix with patrol_concept
                        after it, and the only rule is that every id
                        is unique across the peer and what it
                        consumes, as ruled. No check ties the id to
                        the segment.

