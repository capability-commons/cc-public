title:                  Free register names that sibling peers can share
brief:                  |
                        A peer register named freely is likely to take
                        a generic name, such as the register prefix
                        with peer_concept after it, which the fixture
                        peer built for the federation measurements
                        already took. Two peers that do not consume
                        each other may both take it, and their
                        registers then cannot be read together without
                        a rename. A register id that carries the
                        segment's name cannot clash while segment
                        names are distinct, and it follows the form
                        already used for release ids.
description:            |
                        Sources:
                        - Read 2026-10-26: the fixture peer built in
                          the container for the federation
                          measurements names its concept register with
                          the register prefix and peer_concept after
                          it. The fixture is not part of cc-public.
                        - Under the free option the only rule is that
                          every id is unique across the peer and what
                          it consumes, and no check ties the id to the
                          segment
                          (_data/decision/dec_naming_of_a_peer_register/opt_register_id_unique_and_otherwise_free.yaml
                          at brief).
                        - Two items with one id and different guids
                          fail the check when they are read together,
                          as cited and measured in
                          ann_duplicate_id_already_enforces_register_uniqueness.
                        - Release ids are qualified by their segment,
                          such as release_cc_public_0_1_0 (owner's
                          statement, 2026-10-25).
                        - More peers are expected, including partners'
                          segments (owner's statement, 2026-10-24).
                        - ASSUMPTION: segment ids are distinct across
                          the federation, since each names one
                          segment, such as segment_cc_public.
                          Strength: weak with one peer; moderate at
                          ten times the peers, since the pairs of
                          peers that can clash grow with the square of
                          their number. The one-register option is
                          qualified by segment too, so it shares this
                          point.

