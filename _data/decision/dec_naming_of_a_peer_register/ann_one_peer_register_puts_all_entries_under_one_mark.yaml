protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  One protective mark for every entry a peer adds
brief:                  |
                        A protective mark sits on a register, not on
                        its entries. One register per peer puts team
                        members, concepts and protected marks under
                        one set of marks, so personal data cannot be
                        marked or handled apart from shareable
                        entries. Either the whole register takes the
                        most restrictive mark, or personal data is
                        under-marked. A register per subject keeps
                        each kind of entry under marks of its own.
description:            |
                        Sources:
                        - A register entry is checked against the
                          identity and descriptive traits only, and
                          the protective_mark field belongs to the
                          rights trait, so an entry carries no mark of
                          its own
                          (_data/schema/sch_register_entry.yaml at
                          allOf; _data/schema/sch_trait_rights.yaml at
                          properties.protective_mark).
                        - The team member register states its marking
                          for all its entries at once: every entry in
                          it is public
                          (_data/register/reg_team_member.yaml at
                          note).
                        - Where an item names several marks, every
                          constraint applies and the most restrictive
                          governs
                          (_data/register/reg_protective_mark.yaml at
                          usage).
                        - A mark is held in a register of its own
                          authority where the existence of the mark is
                          itself protected
                          (_data/register/reg_protective_mark.yaml at
                          note).
                        - Under the one-register option, a peer holds
                          one register that holds every entry the peer
                          adds, whatever its type
                          (_data/decision/dec_naming_of_a_peer_register/opt_one_register_per_peer_for_all_its_entries.yaml
                          at brief).
                        - Personal data lives only in private
                          repositories, and some segments may hold
                          personal data under the GDPR (owner's
                          statement, 2026-10-22, quoted in
                          _data/decision/dec_how_peers_add_vocabulary/ann_private_members_held_in_the_peer.yaml
                          at description).
                        - ASSUMPTION: a peer will want to share some
                          of its entries, such as concepts, with a
                          partner while keeping its members or
                          protected marks back. Strength: moderate
                          today, while the only peer is private as a
                          whole; strong at ten times the size, when
                          peers hold people and share with partners.

