title:                  Hosts, processes and units
brief:                  |
                        Three levels: hosts, the OS processes on a
                        host, and the execution units in an OS
                        process, each unit with its period and core. A
                        unit alone in its process, or a core with no
                        operating system, is a process that holds one
                        unit.

