title:                  Shared process stated once by nesting, or twice by form and key
brief:                  |
                        Under three levels a unit's process is its
                        parent, so units in one process sit on one
                        host and share memory by construction, the
                        existing rule on unplaced nodes grows by one
                        hop, and moving a unit into a process of its
                        own is one placement. Under units with a form,
                        sharing is a key that thread units name, so
                        new rules must check that units naming one key
                        sit on one host and all have the thread form,
                        and a unit alone in a process can be written
                        two ways, in the process form or as a thread
                        whose key no other unit names. Three levels
                        cost an explicit process for every unit, even
                        where each process holds one, and one more
                        kind of part where the closed core has an
                        operation for each kind of part.
description:            |
                        Sources:
                        - Three levels: hosts, the OS processes on a
                          host, and the units in
                          a process.
                          (_data/decision/dec_execution_units_in_the_graph_schema/opt_hosts_processes_and_units.yaml
                          at brief)
                        - Two levels, with thread units naming the OS
                          process they share by
                          a key.
                          (_data/decision/dec_execution_units_in_the_graph_schema/opt_units_on_hosts_with_a_form.yaml
                          at brief)
                        - A node runs on an OS process of its graph,
                          and an OS process on a
                          host of it, which one rule checks in two hops.
                          (src/cctool/check/check.lp within unplaced)
                        - Every array of a dataflow graph names a key,
                          so that a variant
                          operation can address its elements.
                          (_data/requirement/rqt_dataflow_schema_merge_keys.yaml at object)
                        - One option for the closed core has a named
                          operation for each
                          kind of part, such as adding or removing a host, a unit or a
                          node, and another has generic operations on keyed elements.
                          (_data/decision/dec_operations_of_the_closed_core/opt_one_operation_per_kind_of_part.yaml
                          and
                          _data/decision/dec_operations_of_the_closed_core/opt_generic_operations_on_keyed_elements.yaml
                          at brief)
                        - Simplicity counts jobs done by more than one
                          mechanism.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.1)
                        ASSUMPTION: under the form option an OS
                        process exists only as a key that units name,
                        with no element of its own that could hold a
                        setting of the process. Strength: moderate;
                        the extra rules are small, and the extra level
                        costs little under generic operations.

