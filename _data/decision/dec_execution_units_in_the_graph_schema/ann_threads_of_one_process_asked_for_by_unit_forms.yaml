title:                  Threads of one OS process that the unit forms requirement asks for
brief:                  |
                        The upheld placement option lets an execution
                        unit be an OS process, a thread or a core with
                        no operating system, and a requirement has the
                        same graph run as processes on a workstation
                        or as threads in an app; its test case runs
                        two units first as two processes, then as two
                        threads of one process, and compares the
                        messages. With one unit for each OS process,
                        threads are left out of the model, so the
                        second run cannot be written as a variant and
                        the requirement has nothing in the graph to
                        trace to. The trial met the case only by
                        choosing the form on the command line of one
                        build. Both other options can state either
                        form.
description:            |
                        Sources:
                        - An execution unit may be an OS process, a
                          thread or a core with
                          no operating system, so the same graph can be placed on a
                          desktop or an embedded target.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          at brief, upheld by ruling_placement_on_hosts_and_execution_units)
                        - The same graph can run as processes, threads
                          or bare cores, for
                          Patrol from a gaming laptop to a Raspberry Pi 5.
                          (_data/requirement/rqt_platform_unit_forms.yaml at brief and
                          rationale)
                        - The case runs a graph of two units with each
                          in its own OS
                          process, then with each in a thread of one OS process.
                          (_data/test_case/case_platform_unit_forms.yaml at inputs)
                        - Under one unit for each OS process, threads
                          within a process are
                          left out of the model.
                          (_data/decision/dec_execution_units_in_the_graph_schema/opt_one_unit_for_each_os_process.yaml
                          at brief)
                        - The trial ran one build both ways, with the
                          form chosen by which
                          units each engine process was told to run. (trial 2c777ab9,
                          src/cctool/dataflow/_test/test_engine.py, function
                          test_threads_and_processes_give_the_same_messages;
                          src/cctool/dataflow/engine/src/runtime.cpp, function run, its
                          command-line option that names the unit to run)
                        Strength: strong; it rests on an upheld
                        option, a requirement and its case, and falls
                        only if threads are dropped from the platform
                        layer.

