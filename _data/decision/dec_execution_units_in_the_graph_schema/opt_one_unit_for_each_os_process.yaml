title:                  One unit for each OS process
brief:                  |
                        An execution unit is an OS process, or a core
                        with no operating system, and the schema
                        renames its OS processes to execution units.
                        No two units share a process, so every
                        crossing between units goes through a queue
                        between processes, and threads within a
                        process are left out of the model.

