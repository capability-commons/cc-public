title:                  Units on hosts, each with a form
brief:                  |
                        Two levels: hosts, and the execution units on
                        a host, each with its form, period and core.
                        Units whose form is a thread name the OS
                        process they share, by a key, so that
                        placement and transforms can tell which units
                        share memory.

