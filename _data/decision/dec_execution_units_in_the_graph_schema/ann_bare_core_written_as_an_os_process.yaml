title:                  Core with no operating system written as an OS process
brief:                  |
                        The register defines an OS process as an
                        executable unit that an operating system
                        scheduler manages. Three levels write a core
                        with no operating system as a process that
                        holds one unit, so the graph of a
                        microcontroller target would list OS processes
                        where there is no operating system, and the
                        review already found the OS process vocabulary
                        stale against the ruling on execution units.
                        One unit for each process renames the level to
                        execution units, and units with a form give
                        the bare core as a form, so neither uses the
                        term against its definition. The items
                        interface already lists a graph's placement as
                        hosts and execution units, with no OS
                        processes.
description:            |
                        Sources:
                        - An OS process is an executable unit managed
                          by an operating
                          system scheduler. (_data/register/reg_concept.yaml at
                          entries.concept_os_process.brief)
                        - A unit alone in its process, or a core with
                          no operating system,
                          is a process that holds one unit.
                          (_data/decision/dec_execution_units_in_the_graph_schema/opt_hosts_processes_and_units.yaml
                          at brief)
                        - The OS process vocabulary of the graph
                          schema and the concepts
                          is stale against the ruling on placement, and execution unit has
                          no concept. (review of 2026-10-29, CC-058)
                        - A graph holds hosts, execution units,
                          dataflow nodes and dataflow
                          edges.
                          (_data/interface_control_document/icd_dataflow_items.yaml at
                          surface.data.artifact.artifact.graph.content)
                        - Traceability asks whether each element can
                          be traced to the
                          reason it exists. (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                        Strength: moderate; the middle level of three
                        could be named something other than OS
                        process, at the cost of a level whose meaning
                        changes with the form of its units.

