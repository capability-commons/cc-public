title:                  Execution units in the graph schema
brief:                  |
                        The graph schema places nodes on hosts and OS
                        processes, while the rulings speak of
                        execution units, each a thread, an OS process
                        or a core with no operating system, with a
                        period and a core. How does the graph schema
                        hold execution units?
description:            |
                        ruling_placement_on_hosts_and_execution_units
                        notes that the graph calls these parts hosts
                        and OS processes today, and the review found
                        that vocabulary stale (review of 2026-10-29,
                        CC-058). ruling_reading_derived_by_placement
                        makes a step local to an execution unit, and
                        rqt_platform_unit_forms has the same graph run
                        as processes, threads or bare cores. The
                        transport is a setting of the inserted sender
                        and receiver (icd_dataflow_transport), chosen
                        by one transform for each variant
                        (ruling_transport_nodes_inserted_by_a_transform).
                        The trial implementation of 2026-10-29 gave
                        each unit a host, a form and a period, and
                        chose between a queue and TCP at run time,
                        against the records (trial process log, phase
                        2; review of 2026-10-29, CC-057).

