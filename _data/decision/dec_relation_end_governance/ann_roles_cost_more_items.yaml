title:                  Roles that cost more items
brief:                  |
                        Roles and restrictions replace two fields with
                        two registers, two types, five relations and
                        34 entries, and reading what an end allows
                        takes three steps instead of one.
description:            |
                        Commit f6e1b4a added reg_role,
                        reg_relation_constraint, their types and
                        schemas, the relations
                        relation_has_items_that_play, relation_admits,
                        relation_excludes, relation_constrains_source
                        and relation_constrains_target, 17 roles and
                        17 restrictions. A relation names a
                        restriction, which admits a role, which types
                        play.

