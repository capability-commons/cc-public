title:                  Roles as ISO 15926 defines them
brief:                  |
                        The standards use role for something played
                        across many relations by members of a domain,
                        which is what a cc-public role is.
description:            |
                        ISO 15926-2 role_and_domain is a role shared
                        by many relationships; object-role modeling
                        (Halpin) has roles played by object types.
                        ISO/IEC 11179-3:2013 clause 3.2.120 uses
                        relation role for one end of one relation,
                        which this design does not name. The 15926 and
                        ORM readings are from memory; neither text is
                        in the library.

