title:                  Roles that group types once
brief:                  |
                        A role groups the types once, on the types, so
                        every constraint is a single admit. Kind
                        markers would mirror the types and push each
                        grouping into an OR in a constraint.
description:            |
                        rol_can_be_target_of_an_argument is played by
                        annotations and options, and serves the
                        targets of relation_supports and
                        relation_challenges. All 17 constraints in
                        reg_relation_constraint admit one role (commit
                        f6e1b4a). With kind markers, the targets of
                        relation_supports, relation_challenges and
                        relation_supersedes needed a constraint with
                        two literals.

