title:                  Roles that group types once
brief:                  |
                        A role groups the types once, on the types, so
                        every restriction is a single admit. Kind
                        markers would mirror the types and push each
                        grouping into an OR in a restriction.
description:            |
                        rol_arguable is played by annotations and
                        options, and serves the targets of r_supports
                        and r_challenges. All 17 restrictions in
                        reg_relation_restriction admit one role
                        (commit f6e1b4a). With kind markers, the
                        targets of r_supports, r_challenges and
                        r_supersedes needed a restriction with two
                        literals.

