title:                  Partner type that joins without a core change
brief:                  |
                        With roles, a partner lets its own type take
                        part in a cc-public relation by saying, in its
                        own register, that the type's items play a
                        role. Lists or restrictions that name types
                        need cc-public to list the partner's types.
description:            |
                        A partner adds an relation_has_items_that_play
                        edge to its own type entry, for example to
                        rol_design_entity, and relation_has_subject
                        accepts its items, since rrs_is_design_entity
                        admits the role. Before the roles,
                        relation_has_subject had no range at all for
                        this reason (commit 44aa96f).

