title:                  Close after the run, as built and measured clean in the trial
brief:                  |
                        Answering a request already taken and then
                        closing is what the trial has done since its
                        fix, and the review measured it: 200 runs
                        polled as they ended and 200 stops followed by
                        a close, none garbled and none crashed. It
                        adds no message, keeps no state after the run,
                        and lets the process exit so that the system
                        frees all it holds; the review calls the one
                        thing left, saying in the ICD what a late
                        request gets, a records task. The fix works by
                        never freeing the engine and by holding a lock
                        while each reply is written, and the end of
                        input still stops units outside that lock,
                        safe only because nothing is freed.
description:            |
                        Sources:
                        - At 2c777ab9 the engine is allocated and
                          never freed and the run
                          ends under the control lock; the run-end and the stop-and-close
                          loops are clean; the end-of-input path still stops units outside
                          the lock, benign because nothing is freed; what a late request
                          gets is a records task, not a defect. (review of 2026-10-29,
                          CC-006)
                        - A request being answered as the run ends is
                          answered before the
                          process ends, and a later one is not. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, function run;
                          src/cctool/dataflow/engine/src/control.cpp, function
                          control_start)
                        - A request taken before the run ended is
                          answered, and the engine
                          then closes runtime control and exits.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_late_request_unanswered_and_channel_closed.yaml
                          at brief)
                        - Maintainability counts the parts a
                          representative change touches;
                          reliability asks whether the design recovers without losing or
                          corrupting data. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure.1 and
                          entries.concern_reliability.question.2)
                        Strength: moderate; it shows that one
                        implementation works, over 400 runs of two
                        examples, not that deployment learns enough
                        from it.

