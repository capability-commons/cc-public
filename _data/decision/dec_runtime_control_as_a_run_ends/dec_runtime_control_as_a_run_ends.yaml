title:                  Runtime control as a run ends
brief:                  |
                        A run ends when its execution units stop, at a
                        limit on local steps or on a stop. What does
                        runtime control do with a request that comes
                        as the run ends, or after it has ended?
description:            |
                        icd_dataflow_runtime_control does not say. The
                        trial implementation of 2026-10-29 answered
                        such a request from an engine already
                        destroyed (review of 2026-10-29, CC-006). Its
                        fix, at 2c777ab9, ends the run under a lock,
                        answers a request already taken, and then
                        exits without answering a later one. Whether a
                        stop ends the run is open in
                        dec_scope_of_stop_and_start.

