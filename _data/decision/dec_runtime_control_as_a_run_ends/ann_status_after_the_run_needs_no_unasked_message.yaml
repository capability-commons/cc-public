title:                  Status after the run with no message sent unasked
brief:                  |
                        A waiting engine answers the status request
                        the ICD already has, with the graph, each
                        unit, whether it runs and its local step, so
                        deployment reads where each unit stopped with
                        no new message, and the rule of one reply for
                        each request holds. An end notice is a message
                        the engine sends unasked, outside that rule: a
                        reply socket of the messaging option cannot
                        carry it, and the trial's deployer, which by
                        its code reads one line for each request,
                        would take it as the reply to the next. The
                        review's own correction for the run-end race
                        answers a late request with a fixed reply
                        saying that the run has ended.
description:            |
                        Sources:
                        - Status reports the digest of the graph
                          running, the execution
                          units and whether each runs, and its current local step; requests
                          come from deployment one at a time, each answered by one reply.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at surface.data.artifact.artifact.status.content and
                          surface.data.artifact.production)
                        - The engine stays up and answers status until
                          deployment tells it
                          to exit or closes runtime control.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_engine_waits_after_the_run.yaml
                          at brief)
                        - The engine sends one notice that the run has
                          ended.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_end_announced_before_close.yaml
                          at brief)
                        - The deployer writes a request and reads the
                          next line as its
                          reply. (trial 2c777ab9, src/cctool/dataflow/deploy.py, class
                          Engine, function request)
                        - The smallest correction for the run-end race
                          gives the engine a
                          static lifetime or joins the control thread, makes the end of
                          input do nothing once the run has ended, and answers late requests
                          with a fixed reply that the run ended. (review of 2026-10-29,
                          areas/trial-engine.md, TE-07)
                        - A reply socket allows only an alternating
                          sequence of receiving a
                          request and sending its reply (libzmq API, zmq_socket, ZMQ_REP,
                          https://libzmq.readthedocs.io/en/zeromq4-x/zmq_socket.html).
                        Strength: moderate; a notice framed apart from
                        replies, as a tagged message on a stream,
                        costs little, so this weighs most if the
                        encoding is a pair of request and reply
                        sockets.

