title:                  End notice that says why each unit stopped
brief:                  |
                        The end notice carries the last local step of
                        each unit and why it stopped, which status
                        does not: status says whether a unit runs, not
                        why it no longer does. In the trial, by
                        reading its code, a run ended at a step limit,
                        on a stop or when runtime control closed, each
                        with exit status 0, while a failed local step
                        was only an event, and in the review's run it
                        left a bounded run never ending. If a failed
                        step or a silent sender comes to stop the
                        host, as two open options propose, a fault
                        becomes one more way a run ends, and a
                        supervisor that must bring the robot to a safe
                        state needs to tell it from a planned end. A
                        waiting engine gives the same only if status
                        grows a field for it.
description:            |
                        Sources:
                        - The notice carries the last local step of
                          each execution unit and
                          why it stopped.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_end_announced_before_close.yaml
                          at brief)
                        - Status carries whether each unit runs and
                          its current local step.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at surface.data.artifact.artifact.status.content)
                        - A unit ends at its step limit or on a stop,
                          every unit is stopped
                          when runtime control closes, and the run returns 0 in each case; a
                          failed step is reported as an event and the unit carries on.
                          (trial 2c777ab9, src/cctool/dataflow/engine/src/runtime.cpp,
                          functions run_unit and run;
                          src/cctool/dataflow/engine/src/control.cpp, function
                          control_start)
                        - A failed local step shifts downstream units
                          for the rest of the
                          run, and a bounded run never ends. (review of 2026-10-29, CC-004)
                        - A failed local step may stop every unit on
                          the host, and so may a
                          receiver that times out.
                          (_data/decision/dec_what_a_failed_local_step_sends_downstream/opt_failed_step_stops_the_host.yaml
                          at brief;
                          _data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_stops_the_host.yaml
                          at brief)
                        - The engine must let the systems it runs meet
                          their safety
                          requirements. (_data/logical_component/lco_dataflow_engine.yaml at
                          description)
                        - Safety asks what state the design falls back
                          to when it fails.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.2)
                        ASSUMPTION: a supervisor of the robot, not the
                        engine, brings the actuators to a safe state,
                        and acts differently on a fault than on a
                        planned end. Strength: moderate; it grows if
                        either option that stops the host is upheld,
                        and falls if the reason travels in an event to
                        a recorder instead.

