title:                  Waiting engine whose exit rests on seeing the channel close
brief:                  |
                        A waiting engine exits when deployment tells
                        it to or closes runtime control. Over a pipe
                        the close is all but certain, since a deployer
                        that dies closes standard input, and the trial
                        stopped its engine on that, having learned
                        that otherwise a crashed deployer leaves
                        orphan engines. ZeroMQ reconnects peers
                        silently, so seeing a vanished deployer takes
                        heartbeats, and a socket whose peer vanished
                        without closing may give no end of file. On
                        such a channel a waiting engine can wait
                        forever and hold its host, while the other two
                        options exit on their own when the run ends.
description:            |
                        Sources:
                        - The engine must stop when its control input
                          closes, or a crashed
                          deployer leaves orphan engines. (trial process log, phase 3)
                        - At the end of standard input, runtime
                          control marks itself closed
                          and stops every unit. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/control.cpp, function
                          control_start)
                        - ZeroMQ reconnects peers silently, and the
                          Paranoid Pirate pattern
                          adds heartbeats so that each side can detect that the other has
                          gone (ZeroMQ guide, chapter 4, sections Designing Reliability and
                          Robust Reliable Queuing (Paranoid Pirate Pattern),
                          https://zguide.zeromq.org/docs/chapter4/).
                        - The messaging option sends requests and
                          replies through an
                          existing library such as ZeroMQ.
                          (_data/decision/dec_encoding_of_runtime_control/opt_an_existing_messaging_library.yaml
                          at brief)
                        - The engine waits until deployment tells it
                          to exit or closes
                          runtime control.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_engine_waits_after_the_run.yaml
                          at brief)
                        - Dependency risk asks what the design takes
                          from third parties;
                          reliability asks how often the design fails, and for how long.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question.0 and
                          entries.concern_reliability.question.0)
                        ASSUMPTION: a TCP connection whose peer host
                        loses power gives no end of file until a
                        keepalive or a write fails; a pipe gives one
                        when the last process holding its write end
                        exits. Strength: moderate on a socket or with
                        a messaging library, weak over a pipe; a limit
                        on how long the engine waits would close it.

