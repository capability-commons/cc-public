title:                  Requests a waiting engine must refuse once its run has ended
brief:                  |
                        An engine that waits stays reachable with no
                        unit running, so every request but status and
                        exit needs a defined refusal, or a late change
                        set may be reported as taking effect. In the
                        trial an apply sent to a stopped unit was
                        answered ok and pending, a later one silently
                        replaced it, as the review found by reading
                        the code, and start did not restart the unit.
                        The open option in which a stop ends the run
                        already has start begin only a run not yet
                        started. Closing runtime control, with or
                        without a notice, leaves no late request to
                        misread and no channel open to other senders
                        after the run.
description:            |
                        Sources:
                        - After a stop of one unit, an apply was
                          answered ok and pending, a
                          later apply replaced it, the replacement by source inspection, and
                          start left the unit stopped. (review of 2026-10-29, CC-047;
                          areas/trial-engine.md, TE-18)
                        - A stop ends the run of the whole host for
                          good, and start only
                          begins a run that has not started.
                          (_data/decision/dec_scope_of_stop_and_start/opt_stop_ends_the_run.yaml
                          at brief)
                        - The engine stays up after the run and
                          answers status.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_engine_waits_after_the_run.yaml
                          at brief)
                        - A request that cannot be carried out changes
                          nothing and gets a
                          reply that says why.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at surface.data.artifact.failure)
                        - Whoever can send runtime control requests
                          can quietly stall a
                          unit.
                          (_data/decision/dec_scope_of_stop_and_start/ann_stopped_unit_stalls_readers_and_writers_alike.yaml
                          at brief)
                        - Safety asks how the design avoids each
                          hazard; security asks what
                          an attacker can reach. (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.1 and
                          entries.concern_security.question.2)
                        Strength: weak to moderate; one test of
                        whether the run has ended, at the head of each
                        request, closes it, so the cost is states to
                        specify and test rather than a hazard that
                        remains.

