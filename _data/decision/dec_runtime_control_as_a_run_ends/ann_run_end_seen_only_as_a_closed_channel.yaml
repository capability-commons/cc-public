title:                  End of a run that deployment sees only as a closed channel
brief:                  |
                        Under the trial's fix, a request sent as the
                        run ends gets no reply: in 200 runs polled
                        with status, every one ended with the channel
                        closed and no answer. By reading the code, the
                        deployer turns that into the same error a
                        crash gives, and the engine exits with status
                        0 whether the run met its step limit, was
                        stopped, or lost runtime control. The exit
                        status tells a crash from an end only to a
                        parent process, so for an engine reached over
                        a socket, as JSON lines allow, deployment
                        learns nothing of how the run ended. A notice
                        and an engine that waits both tell it.
description:            |
                        Sources:
                        - After the fix, a loop of 200 runs polled
                          with status as they ended
                          gave no garbled reply and 200 closed without a reply. (review of
                          2026-10-29, CC-006)
                        - The deployer raises an error that the engine
                          closed runtime
                          control when no reply line comes. (trial 2c777ab9,
                          src/cctool/dataflow/deploy.py, class Engine, function request)
                        - The engine returns 0 at the end of every
                          run, by reading the code;
                          200 runs ended by a stop and a close all exited with 0. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/runtime.cpp, function
                          run; review of 2026-10-29, CC-006)
                        - JSON lines run on a socket for a remote
                          engine.
                          (_data/decision/dec_encoding_of_runtime_control/opt_json_lines_on_a_stream.yaml
                          at brief)
                        - A request taken before the run ended is
                          answered, and a later
                          request finds the channel closed.
                          (_data/decision/dec_runtime_control_as_a_run_ends/opt_late_request_unanswered_and_channel_closed.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed
                          is present; flexibility asks on which environments the design
                          runs. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1 and
                          entries.concern_flexibility.question.0)
                        Strength: moderate; it bears on remote engines
                        and on diagnosis, and weakens if the engine
                        writes why it ended to its standard error
                        before it closes, which a local deployer
                        already reads.

