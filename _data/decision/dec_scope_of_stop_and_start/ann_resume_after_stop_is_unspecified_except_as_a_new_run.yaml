title:                  Resume after a stop that the records define only as a new run
brief:                  |
                        The records already fix how units start: at
                        their first local step. A stop that ends the
                        run fits that word for word, and resuming
                        becomes a new run with its own recording, as
                        run records are ruled. The one-unit option
                        resumes a unit at its next local step, against
                        the start convention of the runtime control
                        ICD. The whole-host option restarts every unit
                        together from the first local step, though
                        units share no common step, without saying
                        whether node state, messages still queued
                        between units and feedback defaults start
                        afresh. Under either, a recording that spans a
                        stop and a start needs the step of each, which
                        the replay ruling does not list, and in the
                        trial a step missing from the recording was
                        enough to make replay diverge.
description:            |
                        Sources:
                        - Execution units start at their first local
                          step
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at surface.data.artifact.artifact.start.convention).
                        - The one-unit option resumes the unit at the
                          next local step, and
                          the whole-host option begins every unit together from the first
                          local step
                          (_data/decision/dec_scope_of_stop_and_start/opt_stop_and_start_act_on_one_unit.yaml
                          at brief;
                          _data/decision/dec_scope_of_stop_and_start/opt_stop_and_start_act_on_the_whole_host.yaml
                          at brief).
                        - Units have no common step
                          (_data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at brief).
                        - A replay log holds outside inputs, the gap
                          that admitted each, and
                          the step of each change set and swap
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml
                          at brief).
                        - The record of a run is a run item in the
                          tree
                          (_data/decision/dec_shape_of_a_dataflow_run/ruling_run_item_in_the_tree.yaml
                          at brief).
                        - A failed local step left no rows, and replay
                          then diverged on every
                          later step (review of 2026-10-29, CC-012).
                        - In studies of actor systems, a few percent
                          of bugs came from
                          coordination at shutdown and at startup (Menard et al. 2023,
                          High-performance deterministic concurrency using Lingua Franca,
                          section 2, as summarized in
                          /mnt/project-files/notes/literature/round-2/2023-high-performance-deterministic-concurrency-lingua-franca.md).
                        - Maintainability asks how readily a newcomer
                          understands the design
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question).
                        Strength: moderate; a whole-host restart that
                        resets everything is in effect a new run
                        without a new recording, so the gap between
                        those two options lies mostly in the records.

