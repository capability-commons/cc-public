title:                  Unit restart that rests on each transport's handling of a lost peer
brief:                  |
                        Where units are separate processes or hosts,
                        stopping and restarting one while its
                        neighbors run means each transport between
                        them must survive the loss of a peer and its
                        return. The transport libraries live only in
                        sender and receiver nodes, and each kind, a
                        shared-memory queue, ZeroMQ or TCP, treats a
                        vanished peer its own way; the trial's TCP
                        transport killed the sender's process by
                        SIGPIPE or fed the receiver empty messages,
                        never reconnected, and opened its connections
                        only before runtime control started. A stop of
                        the whole host, or one that ends the run,
                        opens and closes every transport with the run,
                        so no library's reconnect behavior becomes
                        part of the engine's semantics.
description:            |
                        Sources:
                        - Transport libraries are used only by the
                          sender and the receiver
                          (_data/requirement/rqt_transport_confines_library.yaml at object).
                        - A transport is of one kind, such as ZeroMQ,
                          a shared-memory queue
                          or TCP, with one transform each
                          (_data/decision/dec_how_values_cross_execution_units/opt_transport_nodes_inserted_by_a_transform.yaml
                          at brief).
                        - Killing the receiver killed the sender's
                          process with exit -13,
                          killing the sender left the receiver on empty messages, and nothing
                          reconnects (review of 2026-10-29, CC-016, reproduced; area report
                          trial-engine, TE-14).
                        - Dependency risk asks what happens if
                          something taken from a third
                          party changes or is withdrawn (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question).
                        ASSUMPTION: the transport kinds differ in how
                        they treat a lost peer; ZeroMQ, for one,
                        reconnects on its own, while a plain socket
                        does not. Strength: moderate for units in
                        separate processes or hosts; nil for units
                        that are threads of one process.

