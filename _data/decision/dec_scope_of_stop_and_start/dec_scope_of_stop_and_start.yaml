title:                  Scope of stop and start
brief:                  |
                        Runtime control can stop and start an engine.
                        Does a stop or a start act on the whole host,
                        or on one execution unit, and can a stopped
                        unit start again?
description:            |
                        icd_dataflow_runtime_control has stop and
                        start requests but does not say what they act
                        on. In the trial implementation of 2026-10-29,
                        stopping one unit stalled the units that read
                        from it while they still reported running, and
                        start could not restart a stopped unit (review
                        of 2026-10-29, CC-047).

