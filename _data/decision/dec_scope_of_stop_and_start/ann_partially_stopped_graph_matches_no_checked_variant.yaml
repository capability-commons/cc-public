title:                  Partly stopped graph that matches no checked variant
brief:                  |
                        The rulings scale a deployment by generating a
                        variant, with as many processes as a host has
                        cores and each complete variant checked, and
                        they meet sustained overload at run time with
                        a degraded mode. A stop of one unit is a third
                        way to shrink a running graph, and it leaves a
                        configuration that no variant describes and no
                        check has seen; in the trial a change set sent
                        to a stopped unit was even answered ok, marked
                        pending. A stop of the whole host, or a stop
                        that ends the run, keeps every running
                        configuration one that a check has passed.
description:            |
                        Sources:
                        - A variant can be generated with as many
                          processes on a host as it
                          has cores, so much of the dynamism goes into rewriting the graph
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml
                          at brief).
                        - Every complete variant is resolved and
                          checked
                          (_data/decision/dec_which_resolved_graphs_are_checked/ruling_every_complete_variant_checked.yaml
                          at brief).
                        - Sustained overload is answered by a degraded
                          mode selected through
                          a mode port
                          (_data/decision/dec_response_to_sustained_overload/ruling_degraded_mode_through_a_mode_port.yaml
                          at brief).
                        - A change set applied to a stopped unit was
                          answered ok, marked
                          pending, after 2 s, and a later one silently replaces it, which the
                          review found by reading the code (review of 2026-10-29, area report
                          trial-engine, TE-18; trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, function hook_apply).
                        - Flexibility asks whether the design can be
                          scaled up or down as the
                          load changes (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question).
                        Strength: moderate; control of one unit could
                        still serve the upkeep of one process, which
                        no record asks for yet.

