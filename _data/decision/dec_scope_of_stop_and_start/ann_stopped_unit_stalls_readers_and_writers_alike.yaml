title:                  Stopped unit that stalls both its readers and its writers
brief:                  |
                        A unit that stops neither reads nor writes.
                        Its readers wait without end, since a receiver
                        waits for exactly one message in each local
                        step and no record gives it a timeout, and its
                        writers wait too once the bounded queue to it
                        fills on a lossless edge. The trial showed the
                        second: after a stop of u2, u1, which writes
                        to it, blocked in a send at step 7 while
                        status still said it was running; the first
                        follows from the ICD. The one-unit option
                        speaks only of readers, and leans on what a
                        receiver does when no message comes, which
                        nothing yet states. A safety function in a
                        neighboring unit thus stops while reported as
                        running, and whoever can send runtime control
                        requests gains a quiet way to cause that.
                        Stopping every unit at once avoids it,
                        provided the engine wakes units blocked on a
                        channel, as the trial's stop of all units did.
description:            |
                        Sources:
                        - A receiver waits for exactly one message in
                          each local step, and a
                          sender waits when the bounded queue is full unless the edge's
                          policy allows loss
                          (_data/interface_control_document/icd_dataflow_transport.yaml at
                          surface.receiver.dataflow_step.availability and
                          surface.sender.dataflow_step.back_pressure).
                        - Under the one-unit option the readers of a
                          stopped unit see a
                          missing sender
                          (_data/decision/dec_scope_of_stop_and_start/opt_stop_and_start_act_on_one_unit.yaml
                          at brief).
                        - In the trial, a stop of u2 left u1, which
                          writes to it, blocked in
                          a lossless send at step 7 with status reporting it running, and a
                          later stop of all units, which closes every channel, closed the run
                          with exit status 0 (review of 2026-10-29, CC-047; area report
                          trial-engine, TE-18, log stop_one_unit.txt; trial 2c777ab9,
                          src/cctool/dataflow/engine/src/control.cpp, function stop).
                        - A deadlock in one part of a network while
                          the rest runs is never
                          caught by a check for global deadlock (Geilen and Basten 2003,
                          Requirements on the execution of Kahn process networks, section 2,
                          as summarized in
                          /mnt/project-files/notes/literature/part-2/2003-requirements-on-the-execution-of-kpns.md).
                        - A message that never arrives blocks a
                          waiting read, so the
                          transport needs a timeout and a fail-safe
                          (_data/decision/dec_same_step_or_next_step_reading/ann_cross_host_wait_within_a_step_as_an_attack_path.yaml
                          at brief).
                        - Runtime control requests carry content
                          digests so that the engine
                          and cctool agree which graph is meant
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at description); no dataflow record found says who may send them.
                        ASSUMPTION: on some deployments someone other
                        than deployment can reach runtime control.
                        Strength: strong within one host; across hosts
                        every option meets the same missing sender at
                        the level of a host, and the point weakens if
                        the receiver decision gives every receiver a
                        timeout and a fail-safe.

