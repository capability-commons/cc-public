title:                  Resume in place without a second start-up
brief:                  |
                        A stop that ends the run makes every resume a
                        full start-up: buffers and state set aside
                        from the declarations before the first local
                        step, every transport connection opened again,
                        a new recording begun. The one-unit and
                        whole-host options can keep these across a
                        stop, so a pause and resume costs little.
                        Nothing in the records yet asks for a quick
                        resume, so the cost counts only if pausing
                        turns out to be a common use.
description:            |
                        Sources:
                        - Memory for every buffer and every state is
                          allocated before the
                          first local step, from the declarations
                          (_data/requirement/rqt_memory_before_first_step.yaml at object and
                          qualifier).
                        - The trial opens its transport connections,
                          with a blocking accept
                          and a connect that retries, before runtime control starts (review
                          of 2026-10-29, CC-016; trial 2c777ab9,
                          src/cctool/dataflow/engine/nodes/transport.cpp, function
                          transport_open).
                        - Under the stop-ends-run option resuming
                          means a new run with a new
                          recording
                          (_data/decision/dec_scope_of_stop_and_start/opt_stop_ends_the_run.yaml
                          at brief).
                        - Response time is a measure of performance
                          efficiency
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure).
                        ASSUMPTION: Patrol has no drafted use for
                        pausing and resuming the engine. Strength:
                        weak; start-up is paid once per run, and it
                        matters only for frequent pauses.

