title:                  Schema per answer, dry run at readback
brief:                  |
                        Each answer is checked against the JSON Schema
                        in the bot as it is given, using the validator
                        of cc_public.check.schema, and the whole draft
                        is dry run once through the editing module at
                        the readback. This finds faults while the
                        contributor is still there and pays the
                        whole-tree check once per item, not once per
                        message. Ruled by William Payne on 2026-10-23.

