title:                  Refused writes keeping personal data held
brief:                  |
                        If nothing is checked until the write, a write
                        refused after the conversation has ended
                        leaves the draft and its transcript held in
                        private with no end date, since they are
                        deleted only when the item lands or the draft
                        is dropped. Finding the fault before the
                        contributor leaves lets the item land and its
                        transcript be deleted on time.
description:            |
                        A transcript is kept in private until its
                        items land or its draft is dropped, and is
                        then deleted
                        (_data/decision/dec_chat_transcript_retention/ruling_chat_transcript_retention.yaml
                        at brief). A refused edit writes nothing
                        (src/cctool/edit/edit.py within apply;
                        src/cctool/cli/editing.py within _run), so the
                        draft stays with the bot. The option of checks
                        only at the write checks nothing until cctool
                        writes the item
                        (_data/decision/dec_chat_check_timing/opt_check_at_write_only.yaml,
                        brief). A likely first instance holds member
                        skill profiles, which are personal data
                        (owner's statement). The concern measures
                        personal data fields held, by count, and time
                        to fulfill a request to remove data, in days
                        (_data/register/reg_concern.yaml at
                        entries.concern_privacy.measure). ASSUMPTION:
                        a contributor who has left seldom returns to
                        mend a refused item, so its draft waits until
                        someone drops it by hand. Holds at ten times
                        the size: yes, because each write refused
                        after the contributor left adds one more held
                        draft, and more contributors mean more of
                        them.

