title:                  Late checks failing after the contributor has left
brief:                  |
                        If nothing is checked until the write, a
                        refused write arrives after the conversation
                        is over, and the work is lost unless the
                        contributor returns. Checking each answer in
                        the bot and dry running once at the readback
                        finds the fault while the contributor is still
                        there, with few whole-tree checks.
description:            |
                        The dry-run-every-turn option runs cctool on
                        the whole draft after every message
                        (opt_dry_run_every_turn, brief). The readback
                        option checks each answer against the JSON
                        Schema inside the bot, through
                        cctool.check.schema, and dry runs the whole
                        draft once, at the readback, through the
                        editing module in its own process
                        (opt_schema_per_answer_dry_run_at_readback,
                        brief). A contributor on a messaging app may
                        stop replying at any time (ASSUMPTION). Holds
                        at ten times the size: yes, because a larger
                        tree makes each whole-tree check slower, which
                        makes per-turn runs worse and leaves one run
                        at the readback tolerable.

