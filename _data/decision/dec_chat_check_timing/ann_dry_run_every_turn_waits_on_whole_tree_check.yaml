title:                  Whole-tree dry run on every message
brief:                  |
                        A cctool dry run reads and checks the whole
                        tree, so running one after every message adds
                        about 17 s or more to every reply. Checking
                        each answer against the JSON Schema in memory,
                        and running cctool once at the readback, pays
                        that cost once per item.
description:            |
                        A dry-run batch of 4 items took 17 s, and
                        cctool check took 24.6 s, in the maintainer's
                        development VM (context.md, facts measured
                        2026-10-22). Tree.__init__ reads every
                        document of the tree for each edit
                        (src/cc_public/edit/edit.py lines 169-180;
                        src/cc_public/graph/extract.py lines 426-446).
                        apply checks the tree before and after the
                        edit, and a third time when it moves a new
                        file that the check finds misplaced
                        (src/cc_public/edit/edit.py lines 1085-1090
                        and _place, lines 1101-1120). Each evaluation
                        re-grounds the whole graph in clingo, and only
                        parsing and schema validation of unchanged
                        documents are cached
                        (_data/decision/dec_checker_approach/ann_rules_checker_regrounds_the_whole_tree.yaml).
                        The snapshot holds 1601 YAML files under _data
                        (find, counted 2026-10-22). ASSUMPTION:
                        validating one answer against one item schema
                        in memory takes well under a second, because
                        it reads no file of the tree. ASSUMPTION: a
                        conversation for one item takes ten or more
                        messages, so a dry run per turn costs ten or
                        more whole-tree checks per item, against one
                        at the readback. Holds at ten times the size:
                        yes, because the per-turn cost follows the
                        tree while the per-answer schema check follows
                        only the item.

