title:                  Failures shown while the answer is fresh
brief:                  |
                        Checking each answer against the schema as it
                        is given lets the bot ask again at once.
                        Checking only at the write reports failures
                        after the contributor has already confirmed
                        the readback, so they must reopen an item they
                        thought was done.
description:            |
                        The command line reports a refused edit as
                        "Refused: the edit adds N failures. Nothing
                        was written." (src/cctool/cli/editing.py line
                        509). The option of checks only at the write
                        checks nothing until cctool writes the item
                        (_data/decision/dec_chat_check_timing/opt_check_at_write_only.yaml,
                        brief). The schema-per-answer option checks
                        each answer against the JSON Schema inside the
                        bot, through cctool.check.schema, and dry runs
                        the whole draft once, at the readback, through
                        the editing module in its own process
                        (_data/decision/dec_chat_check_timing/opt_schema_per_answer_dry_run_at_readback.yaml,
                        brief). Holds at ten times the size: yes,
                        because the per-answer check is local to one
                        draft and does not depend on the size of the
                        graph.

