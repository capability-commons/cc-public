title:                  Late failures cost extra whole-tree runs
brief:                  |
                        Checking nothing until the write is cheapest
                        only when the write succeeds first time. Each
                        refused write costs another whole-tree
                        evaluation, which a per-answer schema check
                        avoids for the failures the schema can see.
description:            |
                        Each item type has a JSON Schema (README.md
                        line 15), and there are 45 schema files in
                        _data/schema (find, counted 2026-10-22).
                        ASSUMPTION: a large share of the failures of
                        an elicited item are schema failures (missing
                        or ill-typed fields), which a schema check per
                        answer finds without cctool. Holds at ten
                        times the size: yes, because each avoided
                        rerun saves a whole-tree evaluation, and that
                        grows with the tree.

