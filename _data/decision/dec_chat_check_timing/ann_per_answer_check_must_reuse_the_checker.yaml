title:                  A second check path inside the bot
brief:                  |
                        Checking each answer inside the bot adds a
                        second validation path that must agree with
                        cctool. It stays cheap to maintain only if it
                        calls the existing validator in
                        cc_public.check.schema rather than a validator
                        of its own.
description:            |
                        The option checks each answer against the JSON
                        Schema inside the bot, and runs cctool on the
                        whole draft once at the readback
                        (opt_schema_per_answer_dry_run_at_readback.yaml,
                        brief). cc_public.check.schema defines its own
                        Validator, which reads pattern as ECMA 262
                        reads it rather than as python's re does
                        (src/cc_public/check/schema.py, lines 97-163).
                        The same module builds the registry that
                        resolves $ref between schemas
                        (src/cc_public/check/schema.py, registry_of,
                        line 443). A schema requires fields and
                        forbids unevaluated properties
                        (_data/schema/sch_option.yaml, lines 47-56),
                        so a partial draft fails the whole schema
                        until it is complete. ASSUMPTION: checking one
                        answer means validating it against the
                        subschema of its property, which needs new
                        code to find that subschema through allOf and
                        $ref. The two other options check only through
                        cctool (opt_check_at_write_only.yaml and
                        opt_dry_run_every_turn.yaml, briefs). Holds at
                        ten times the size: yes, because every schema
                        rule that the bot reads differently from
                        cctool shows up as a disagreement at the
                        readback, whatever the number of types.

