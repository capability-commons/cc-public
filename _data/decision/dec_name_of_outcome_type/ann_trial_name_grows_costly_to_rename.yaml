title:                  Trial name costly to rename
brief:                  |
                        The name is in the id prefix, schema, checks
                        and tests, and every determination item adds
                        more uses. A later rename touches every item,
                        leaves guids unchanged, and becomes a large
                        change to read in full.
description:            |
                        Sources: owner's statement "Let's try
                        'Determination' for now"
                        (2026-10-14T19:22:57Z); commit 7db4229 added
                        230 lines over 8 files; at HEAD 89c74d8, 123
                        lines in 12 files contain "determin" (git grep
                        -i -c), mostly in check.lp,
                        reg_data_item_type.yaml, test_check.py and the
                        schema of determinations; prefix det and
                        pattern ^det_[a-z][a-z0-9_]*$ in
                        _data/register/reg_data_item_type.yaml lines
                        800-801. These counts are at the tag
                        pre_squash_20261014. cctool rename renames one
                        id at a time in the documents that name it,
                        and leaves code and the plain word in prose
                        unchanged (src/cc_public/cli/editing.py lines
                        285-295). This challenges the trial form of
                        the choice, not the word.

