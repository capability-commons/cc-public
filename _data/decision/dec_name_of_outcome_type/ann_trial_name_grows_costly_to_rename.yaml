title:                  Trial name costly to rename
brief:                  |
                        The name is in the id prefix, schema, checks
                        and tests, and every item of the type adds
                        more uses. A later rename touches every item,
                        cannot keep their guids, and becomes a large
                        change to read in full.
description:            |
                        Sources: owner's statement "Let's try
                        'Determination' for now"
                        (2026-10-14T19:22:57Z). The rename came in
                        commit 84045df, which changed 194 files,
                        adding 1172 lines and removing 1206. It remade
                        the 20 rulings with fresh guids, and renamed
                        the type, concept, schema, role and constraint
                        and the checks whose names held the word.
                        cctool rename could not have made that change:
                        it refuses a new id with another prefix,
                        because a rename keeps the type (rename in
                        src/cc_public/edit/edit.py), and it leaves
                        python code and the plain word in prose
                        unchanged (rename in
                        src/cc_public/cli/editing.py). This challenges
                        the trial form of the choice, not the word.

