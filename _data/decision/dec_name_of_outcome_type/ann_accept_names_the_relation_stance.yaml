title:                  Accept already names the stance of a relation
brief:                  |
                        The relations r_supports and r_challenges are
                        read as a reason to accept or not to accept a
                        target. An item type called acceptance gives
                        the word a second meaning on every support and
                        challenge edge.
description:            |
                        Sources: _data/register/reg_relation.yaml
                        lines 181 and 216; con_determination cites
                        Dung, "On the acceptability of arguments"
                        (_data/register/reg_concept.yaml lines
                        519-524).

