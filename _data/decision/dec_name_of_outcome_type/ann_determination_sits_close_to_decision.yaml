title:                  Determination sits close to decision
brief:                  |
                        Determination is a near-synonym of decision,
                        and the det prefix differs from dec by one
                        letter. A new reader must learn why both
                        exist, and a person scanning ids can swap
                        them.
description:            |
                        Sources: prefixes in
                        _data/register/reg_data_item_type.yaml lines
                        462-463 and 800-801; the two types are linked
                        directly by relation_upholds and
                        relation_rejects, and relation_supersedes
                        takes either type
                        (_data/register/reg_relation.yaml lines
                        247-268, 358-401); the writing rules prefer
                        the ordinary word, though they exempt a term
                        the concept register defines, as it defines
                        this one
                        (_data/register/reg_writing_style_rule.yaml
                        lines 169-188); the owner calls the word
                        technical (2026-10-14T19:22:57Z). The checker
                        rejects an edge of the wrong type
                        (src/cc_public/check/check.lp lines 260-286),
                        so the cost is mostly in reading and learning.
                        ASSUMPTION: in ordinary English determination
                        often reads as the act of deciding.

