title:                  Verdict already names the gate result
brief:                  |
                        Verdict already names the pass or fail result
                        of a gate stage and the audit. An item type of
                        that name gives the word two meanings in the
                        same files.
description:            |
                        Sources: src/cc_public/cli/gating.py lines 20,
                        51, 66-67; src/cc_public/cli/auditing.py lines
                        103-106, 138; _data/schema/sch_commit.yaml
                        lines 32-33 and
                        _data/schema/sch_annotation.yaml lines 29-31
                        say those items record no verdict. HEAD
                        89c74d8.

