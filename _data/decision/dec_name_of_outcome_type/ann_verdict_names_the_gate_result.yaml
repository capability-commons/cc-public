title:                  Verdict as the existing name of the gate result
brief:                  |
                        Verdict already names the pass or fail result
                        of a gate stage and the audit. An item type of
                        that name gives the word two meanings in the
                        same files.
description:            |
                        Sources: the gate command in
                        src/cctool/cli/gating.py prints the verdict of
                        each stage; the history check command (check
                        and _gated in src/cctool/cli/auditing.py)
                        reports one too; the description of
                        _data/schema/sch_annotation.yaml and the note
                        of _data/schema/sch_commit.yaml say that those
                        items record no verdict.

