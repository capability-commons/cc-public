title:                  Det prefix fixed once a guid carries it
brief:                  |
                        A guid keeps the prefix of its type for life,
                        so once guids carried the det prefix, the name
                        was not provisional in the way "for now"
                        suggests: changing it meant remaking every
                        item of the type with a new guid.
description:            |
                        Sources: the check retyped_guid in
                        src/cctool/commit/change.lp, which refuses a
                        commit that gives the digits of an existing
                        guid another prefix; the principle that coarse
                        types never change, argued in
                        dec_type_of_an_item_is_fixed; commit 84045df,
                        which gave the type the prefix ruling and
                        remade with fresh guids the 20 rulings that
                        had carried the prefix det. Maintainer's
                        statement, 2026-10-14T19:22:57Z. Proposed by
                        the maintainability advocate.

