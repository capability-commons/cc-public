title:                  Acceptance names only one outcome
brief:                  |
                        The item can reject an option as well as
                        uphold it. A name that means a yes reads
                        wrongly on each item that rejects, so a new
                        reader is likely to misread a rejection.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        505-508; r_rejects in
                        _data/register/reg_relation.yaml lines
                        382-401. The assistant leaned to ruling for
                        this reason, quoted in the owner's message of
                        2026-10-14T19:19:42Z.

