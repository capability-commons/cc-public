title:                  No admitted terms for partner words
brief:                  |
                        The concept register can list admitted terms
                        beside the preferred one, but the
                        determination concept listed none. So partner
                        words such as accepted, ruling or decision
                        outcome are mapped nowhere.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        15-20, 29-31, 138-141 (term_admitted in use)
                        and 531-533 (the determination concept, now
                        concept_ruling), at the tag
                        pre_squash_20261014. Determination items
                        travel one per file
                        (_data/register/reg_data_item_type.yaml line
                        787). The fix is cheap and keeps the chosen
                        name.

