title:                  Evaluation already names the computed result
brief:                  |
                        The repository defines the stored outcome
                        against an evaluation of the arguments that is
                        to be computed, never stored, and compared
                        with it. Calling the stored item an argument
                        evaluation gives both one name, so a reader
                        cannot tell which one a line means.
description:            |
                        Sources: _data/register/reg_concept.yaml lines
                        509-517 (concept_ruling is defined against the
                        computed evaluation); commit 7db4229 message
                        (the outcome is kept apart from the
                        evaluation, which "is to be computed and never
                        stored"; no code computes it at HEAD 89c74d8);
                        _data/register/reg_relation.yaml lines 310-311
                        (concern weighing is left "to the
                        evaluation");
                        ann_each_evaluation_pays_a_fixed_cost and
                        ann_no_graph_state_is_kept in
                        dec_cross_item_checks_engine use evaluation
                        for one run of the checks. "Argument
                        evaluation" was one of the owner's first
                        candidates (owner's statement,
                        2026-10-14T19:19:42Z). ASSUMPTION: the clash
                        grows once tooling computes and reports the
                        evaluation.

