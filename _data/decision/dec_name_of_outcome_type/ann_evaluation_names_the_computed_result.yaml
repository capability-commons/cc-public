title:                  Evaluation already names the computed result
brief:                  |
                        The repository defines the ruling against an
                        evaluation of the arguments that is to be
                        computed from them, and compared with it.
                        Calling the stored item an argument evaluation
                        gives both one name, so a reader cannot tell
                        which one a line means.
description:            |
                        Sources: the description of concept_ruling in
                        _data/register/reg_concept.yaml, which sets
                        the ruling apart from the evaluation of the
                        arguments, "to be computed from them", and
                        says that no evaluator exists yet; the note of
                        relation_speaks_for_concern in
                        _data/register/reg_relation.yaml, which leaves
                        the weighing of concerns "to the evaluation";
                        ann_each_evaluation_pays_a_fixed_cost and
                        ann_no_graph_state_is_kept in
                        dec_cross_item_checks_engine, which use
                        evaluation for one run of the checks.
                        "Argument evaluation" was one of the owner's
                        first candidates (owner's statement,
                        2026-10-14T19:19:42Z). ASSUMPTION: the clash
                        grows once tooling computes and reports the
                        evaluation.

