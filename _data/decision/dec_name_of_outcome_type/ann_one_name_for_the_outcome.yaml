title:                  One name where the outcome had three
brief:                  |
                        Before the rename, the outcome item was called
                        a determination in its ids, a ruling in prose
                        and the web form, and an outcome in the
                        decision itself. Ruling was already the word
                        in use, and it is not a near-synonym of
                        decision.
description:            |
                        Source: the naming review of 2026-10-20
                        (/mnt/project-files/notes/naming-review/naming-review-2026-10-20.md,
                        finding 6), which found ruling in 20 files at
                        3f145c9, including the text of the
                        determination concept, the web form and the
                        fix text of a check, while the ids used the
                        det prefix, one letter from dec.

