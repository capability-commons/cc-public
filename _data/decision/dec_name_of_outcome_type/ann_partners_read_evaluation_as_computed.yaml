title:                  Evaluation as the name of what argumentation partners compute
brief:                  |
                        In abstract argumentation, evaluation is the
                        computed acceptability of arguments. A partner
                        that reads an item called an argument
                        evaluation or verdict would take a stored
                        judgment for a computed result.
description:            |
                        Sources: the note of concept_ruling in
                        _data/register/reg_concept.yaml, citing Dung,
                        Artificial Intelligence 77, 1995. ASSUMPTION:
                        a partner tool built on abstract argumentation
                        reads an item named evaluation in that sense.

