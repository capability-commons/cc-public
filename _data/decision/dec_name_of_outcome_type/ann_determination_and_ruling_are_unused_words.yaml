title:                  Determination and ruling clash with no existing term
brief:                  |
                        Neither determination nor ruling has another
                        meaning in the data or code, so either is easy
                        to keep apart from the existing vocabulary.
description:            |
                        Source: case-insensitive search of _data and
                        src at HEAD 89c74d8. "Ruling" appears nowhere.
                        "Determin" appears outside the new type only
                        in LICENSE line 150 and "deterministically" in
                        _data/schema/sch_primitive.yaml line 56.

