title:                  Determination and ruling clash with no existing term
brief:                  |
                        Neither determination nor ruling names
                        anything else in the data or code, so either
                        is easy to keep apart from the existing
                        vocabulary.
description:            |
                        Source: case-insensitive search of _data and
                        src (git grep -i). Ruling is the name of the
                        type and is used in no other sense. Outside
                        the deliberations, "determination" appears
                        only as the deprecated term of concept_ruling
                        and in the alias lists of type_ruling,
                        concept_ruling and rol_ruling, which keep the
                        ids they had before the rename. Words from the
                        same stem name other things only in
                        determinism, a field of an interface control
                        document
                        (_data/schema/sch_interface_control_document.yaml),
                        in "deterministically" in
                        _data/schema/sch_primitive.yaml, in "not
                        determined" in an error message of
                        src/cc_public/graph/logic.py, and in LICENSE.
                        The web form calls its uphold and reject
                        requests rule (src/cc_public/web/request.py).

