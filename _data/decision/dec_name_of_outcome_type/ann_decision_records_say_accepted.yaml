title:                  Accepted as the status word of decision record formats
brief:                  |
                        MADR marks a decision accepted or rejected and
                        does not use determination, so a partner needs
                        a crosswalk. Acceptance maps more directly but
                        only in part.
description:            |
                        Sources: https://adr.github.io/madr/ (status
                        values proposed, rejected, accepted,
                        deprecated, superseded). ASSUMPTION: other
                        common decision record formats also avoid
                        determination. Options in cc-public carry no
                        status: whether an option holds is recorded by
                        a ruling (the note of
                        _data/schema/sch_option.yaml). Weak: the
                        larger gap is shape, since MADR holds the
                        outcome as a field of the record, and
                        cc-public as a ruling, an item of its own that
                        names options by relation_upholds and
                        relation_rejects. Any of the names needs a
                        mapping for that.

