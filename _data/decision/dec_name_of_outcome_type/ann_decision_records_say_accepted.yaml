title:                  Decision record formats say accepted
brief:                  |
                        MADR marks a decision accepted or rejected and
                        does not use determination, so a partner needs
                        a crosswalk. Acceptance maps more directly but
                        only in part.
description:            |
                        Sources: https://adr.github.io/madr/ (status
                        values proposed, rejected, accepted,
                        deprecated, superseded). ASSUMPTION: other
                        common decision record formats also avoid
                        determination. Options in cc-public once
                        carried proposed, accepted and rejected,
                        removed in commit 44034ef
                        (memory/lifecycle-and-status.md lines 8 and
                        17). Weak: the larger gap is shape, since MADR
                        holds the outcome as a field and cc-public as
                        a separate item linked by relation_upholds and
                        relation_rejects. Any of the names needs a
                        mapping for that.

