title:                  Plain fixed-layout types read in place
brief:                  |
                        An array descriptor exactly describes plain
                        fixed-size memory, so the engine and a Python
                        or C reader on the same host can read values
                        in place, with no decode on each step and no
                        serialization library. Avro's binary form must
                        be decoded with its schema, and FlatBuffers
                        tables reach fields through offsets, so an
                        external schema language gives this up unless
                        the dictionary also generates the plain
                        layout. Dictionary items keep it if they
                        generate the same struct and dtype.
description:            |
                        Sources:
                        - Everything that crosses an edge is
                          standard-layout, trivially copyable and
                          fixed size, so a NumPy structured dtype
                          describes its memory exactly.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 84-86)
                        - A memory-mapped edge lets C++ cast the bytes
                          and Python wrap them as an ndarray, with no
                          copy or serialization, recorded as an option
                          rather than a default.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 130-137)
                        - The generator can emit both the C++ struct
                          and its dtype string from one spec.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 95-96)
                        - "Binary encoded Avro data does not include
                          type information or field names", so the
                          reader needs the schema to decode it.
                          (https://avro.apache.org/docs/1.9.2/spec.html)
                        - A FlatBuffer is not parsed before it is
                          accessed, but tables reach fields through a
                          vtable, and structs, which lack evolution,
                          are meant for small objects that rarely
                          change.
                          (https://fuchsia.googlesource.com/third_party/flatbuffers/+/main/docs/source/WhitePaper.md)
                        - ASSUMPTION: the dictionary-items option
                          would generate plain C++ structs, as the
                          earlier data dictionary drove generated
                          allocators.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 16-19) Strength: moderate for
                          compatibility; it holds for partners on the
                          same host, not across a network, where some
                          encoding is needed anyway. Moderate for
                          performance efficiency, a non-driver point
                          kept with it, since decode cost grows with
                          node count and rate.

