title:                  Impossible state upgrade refused before the swap
brief:                  |
                        The owner asked that an upgrade that cannot be
                        done be blocked before it is attempted. A
                        mapping per field, checked before a swap is
                        sent and applied by one engine routine,
                        refuses such an upgrade before anything
                        changes and runs no upgrade code supplied with
                        the new version. Hand-written upgrades between
                        hashed descriptors are code that no check
                        named by that option looks at before it runs,
                        and an external schema language reports a
                        missing default when it resolves a writer's
                        schema against a reader's for reading, unless
                        its compatibility rules are also run ahead.
                        Its weight rests on the decisions on swapping
                        a node version and on the form of node state.
description:            |
                        Sources:
                        - An upgrade with new fields without defaults
                          "should be blocked before it's attempted".
                          (owner's statement, 2026-10-24)
                        - The items option fails an upgrade with a new
                          field that has no default.
                          (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_items_with_upgrades.yaml at brief)
                        - The array descriptor option has upgrades
                          written by hand and names no check.
                          (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_of_array_descriptors.yaml at title and brief)
                        - In Avro, if the reader's record has a field
                          with no default that the writer lacks, Avro
                          reports an error when it resolves data being
                          read.
                          (https://avro.apache.org/docs/1.11.1/specification/;
                          https://java-browser.yawk.at/org.apache.avro/avro/1.9.1/org/apache/avro/Resolver.java)
                          flatc --conform checks a schema's evolution
                          against a base schema.
                          (https://flatbuffers.dev/evolution/)
                        - ASSUMPTION: cctool could run Avro's or
                          FlatBuffers' compatibility rules ahead of
                          time, which would close most of the gap for
                          the external option. A "converted" field is
                          an exception to "no upgrade code" unless
                          conversions come from a fixed set.
                        - If live swap is ruled out, or state is
                          opaque with hooks, upgrades move out of the
                          dictionary and this need with them.
                          (_data/decision/dec_swap_of_a_node_version/;
                          _data/decision/dec_form_of_node_state/)
                          Strength: holds at ten times the systems for
                          traceability; grows with the number of types
                          for reliability; moderate for safety and
                          security. Reliability, safety and security
                          do not drive the dataflow model; their
                          points are kept because they concur on the
                          same premise.

