title:                  Second schema language and second form of each value
brief:                  |
                        Under an external schema language each type
                        lives in two forms, the schema file and the
                        item that names it, and a reader must know two
                        description languages whose files the graph's
                        checks cannot see into without a parser. Those
                        languages evolve through an encoded form while
                        the engine's edges carry plain fixed-layout
                        data, they give no general converted mapping,
                        and Avro's arrays have no maximum length where
                        the engine needs a fixed capacity for every
                        sequence.
description:            |
                        Sources:
                        - The option writes types in Avro or
                          FlatBuffers, and a data item names each
                          schema and its version.
                          (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_in_an_external_schema_language.yaml at title and brief)
                        - Everything that crosses an edge is plain
                          data: standard-layout, trivially copyable,
                          fixed size; every sequence and string has a
                          fixed capacity, and nothing is allocated on
                          the heap while stepping.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 84-86;
                          _sources/axair-orchestrator/docs/component_interface.md
                          lines 145-151)
                        - Avro type promotion is limited to widening
                          numbers and string to and from bytes, and
                          its array type states no maximum.
                          (https://avro.apache.org/docs/1.11.1/specification/,
                          Schema Resolution and Complex Types)
                        - FlatBuffers tables may gain fields only at
                          the end, unless every field carries an
                          explicit id, and must not lose them; its
                          fixed-layout structs may not have fields
                          added or deprecated.
                          (https://flatbuffers.dev/evolution/;
                          https://chromium.googlesource.com/external/github.com/google/flatbuffers/+/v1.7.1/docs/source/Schemas.md)
                        - ASSUMPTION: neither Avro's binary encoding
                          nor FlatBuffers' offset tables is such a
                          struct, so the engine would still generate
                          its own structs from the schema. Strength:
                          strong for simplicity, since two homes per
                          type and two forms per value grow with the
                          dictionary; moderate for maintainability and
                          functional suitability.

