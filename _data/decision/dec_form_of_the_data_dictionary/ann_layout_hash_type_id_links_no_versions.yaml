title:                  Layout-hash type identity that links no versions
brief:                  |
                        An array descriptor's type id is a hash of its
                        whole layout, so any change, even a rename a
                        reader could absorb, makes a different type
                        that a wiring check refuses, and the hash of
                        version n+1 says nothing of version n. There
                        is nothing for an automatic upgrade to follow,
                        so each edit needs an upgrade written by hand,
                        and a partner checking headers must reproduce
                        the canonical NumPy description exactly. The
                        hash stays useful as an identity check derived
                        from a dictionary item under the other
                        options.
description:            |
                        Sources:
                        - "Type id = hash of the canonical dtype
                          description (field names, types, shapes,
                          offsets), not just a name, so a reordered or
                          resized struct is a different type."
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 98-99) Tentatively decided 2026-10-16,
                          may be revisited. (same file, lines 224-225)
                        - The dynamic host checks every edge at wiring
                          time and refuses a mismatch.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 67) A packet may start with a header
                          holding the type id. (same file, lines
                          105-112)
                        - The generator can emit both the C++ struct
                          and its dtype string from one spec, and the
                          dtype string comes from the dictionary's
                          mapping to NumPy.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 95-96)
                        - The option has upgrades written by hand.
                          (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_of_array_descriptors.yaml at title and brief)
                        - The owner asked for mappings for automatic
                          upgrades. (owner's statement, 2026-10-24)
                        - Prior art: ROS 2 identifies interface types
                          by a SHA-256 hash of a type description.
                          (https://index.ros.org/p/rosidl_generator_type_description)
                        - ASSUMPTION: the canonical form of the
                          description is not defined apart from NumPy,
                          so a partner without Python would
                          reimplement it. The NumPy dependency itself
                          is argued already on the first engine
                          decision and is not repeated. Strength:
                          strong for functional suitability on the
                          upgrade function and for simplicity, as
                          hand-written upgrades grow with the number
                          of changes; moderate and growing with scale
                          for maintainability; strong for
                          compatibility, since every type change
                          breaks every partner at once.

