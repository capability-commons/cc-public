title:                  Two-way reading for partners at other versions
brief:                  |
                        The owner's upgrade mapping turns old data
                        into new, in place, in one direction. A
                        partner that exchanges data with a system
                        often runs another version and needs older
                        readers to read newer data as well as the
                        reverse; external schema languages have tested
                        rules for both and partners' own tools use
                        them. Dictionary items match this only if
                        every mapping can also be read backward or
                        each outward-facing type is also emitted in
                        such a language. This rests on the open
                        decisions on port types, on the form of node
                        state and on swapping a node version.
description:            |
                        Sources:
                        - Node state from the last step at version n
                          is upgraded in place to the state for
                          version n+1. (owner's statement, 2026-10-24
                          12:33Z)
                        - Under the items option a new version names
                          the version it upgrades and a mapping per
                          field.
                          (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_items_with_upgrades.yaml
                          lines 11-18)
                        - In Avro resolution a field the reader lacks
                          is ignored, a field the writer lacks takes
                          the reader's default or signals an error,
                          and aliases let a renamed field be read.
                          (https://avro.apache.org/docs/1.7.6/spec)
                        - In FlatBuffers, new fields go at the end,
                          fields are deprecated rather than removed,
                          and renames are safe because names are not
                          stored. (https://flatbuffers.dev/evolution/)
                        - The track stream is read by the console like
                          any outside system, and its protocol is
                          still open.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 82-85;
                          _sources/cc-patrol-notes/draft/icd-list.md
                          line 36)
                        - Where a recognized standard covers the
                          ground, its structure is the starting
                          position.
                          (_data/decision/dec_follow_standards_by_default/ruling_follow_standards_by_default.yaml
                          lines 11-17; that ruling is about
                          cc-public's vocabulary, so this is an
                          extension)
                        - ASSUMPTION: a "converted" field has no
                          defined reverse. ASSUMPTION: many likely
                          partners already describe payloads in
                          Protocol Buffers, Avro, FlatBuffers or ROS
                          messages. Strength: strong at ten times the
                          systems, as more partners mean more version
                          skew; it does not bear on state inside one
                          engine, where the one-way upgrade is all
                          that is needed.

