title:                  Schema-language libraries and compilers on every target
brief:                  |
                        If the generator turns each dictionary type
                        into a plain C++ struct, a target needs only a
                        C++17 compiler. An external schema language
                        brings its compiler into every build and
                        possibly its library onto the target, Avro's
                        C++ library needing Boost and fmt, and since
                        neither Avro nor FlatBuffers has a general
                        conversion mechanism, the owner's field
                        conversions would still be our own code on
                        top.
description:            |
                        Sources:
                        - The generator can emit the C++ struct and
                          its dtype from one spec.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 95-96) C++17 is supported by every
                          toolchain likely to be met, including nvcc.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 155-158)
                        - Avro C++ "requires boost headers, and the
                          boost regex library"
                          (https://apache.googlesource.com/avro/+/refs/tags/release-1.10.0/lang/c++/README);
                          Avro C++ 1.12 builds against several Boost
                          components and fetches fmt
                          (https://patchwork.yoctoproject.org/project/oe/patch/20250707225407.1558421-2-alperyasinak1@gmail.com).
                        - FlatBuffers is Apache-2.0 and generates code
                          with flatc; its evolution rules describe no
                          conversion mechanism, only flatc --conform
                          to check that a schema evolves.
                          (https://github.com/google/flatbuffers;
                          https://flatbuffers.dev/evolution/)
                        - Dictionary items are data items checked by
                          cctool with its present dependencies.
                          (pyproject.toml lines 43-49) ASSUMPTION:
                          cctool would need a Python package for the
                          chosen schema language to check the named
                          schemas; FlatBuffers' generated readers need
                          a small header-only runtime, which ports
                          more easily than Avro's. Strength: moderate;
                          the libraries are permissive and maintained,
                          but the count and the build tool stay with
                          every target. Dependency risk and
                          flexibility do not drive the dataflow model;
                          kept as a non-driver point that no driver
                          makes.

