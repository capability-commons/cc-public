title:                  Dictionary items with upgrades
brief:                  |
                        Each type is a data item in a data dictionary,
                        with a version; a new version names the
                        version it upgrades and a mapping for each
                        field: kept, renamed, converted, or new with a
                        default, and a check fails an upgrade with a
                        new field that has no default. Ruled by WTP on
                        2026-10-24, as recommended.

