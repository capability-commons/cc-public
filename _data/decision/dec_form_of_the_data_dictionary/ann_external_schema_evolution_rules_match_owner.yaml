title:                  Outside-maintained evolution rules close to the owner's
brief:                  |
                        An external schema language brings evolution
                        rules that others maintain and test, and they
                        come close to what the owner asked: Avro
                        refuses a new field with no default, fills a
                        default where one exists and can follow
                        renames through aliases, which implementations
                        may support, and FlatBuffers gives a newer
                        reader the default for a field older data
                        lacks.
description:            |
                        Sources:
                        - Avro: if the reader's record has a field
                          with no default and the writer has no field
                          of that name, an error is reported; with a
                          default, the reader uses it; fields match by
                          name, and an implementation may optionally
                          use aliases to read a renamed field.
                          (https://avro.apache.org/docs/1.11.1/specification/,
                          Schema Resolution and Aliases)
                        - FlatBuffers: new fields go at the end of a
                          table, fields are not removed, renaming is
                          generally fine, and a newer reader gets the
                          default for a field older data lacks.
                          (https://flatbuffers.dev/evolution/)
                        - The owner wants upgrades blocked where new
                          fields have no default. (owner's statement,
                          2026-10-24) Strength: moderate; it
                          rests on published rules, the gain grows
                          with the number of types, and which language
                          is chosen changes the details.

