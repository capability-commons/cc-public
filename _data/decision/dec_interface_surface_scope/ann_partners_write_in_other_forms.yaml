title:                  Partners whose interfaces take other forms
brief:                  |
                        A partner may present an interface in C or
                        C++, as a dataflow step, or as files it hands
                        on. A schema with every form lets that partner
                        write its document without first changing the
                        schema.
description:            |
                        The schema is closed to undeclared properties,
                        so a form it lacks cannot be written at all
                        until the schema gains it.

