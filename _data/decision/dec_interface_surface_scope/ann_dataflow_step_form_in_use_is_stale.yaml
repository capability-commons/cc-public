title:                  Dataflow step form now in use
brief:                  |
                        ann_unused_surfaces_go_untested says no
                        engineering document uses the C, C++, dataflow
                        step or artifact forms, so no check or test
                        exercises them. Three documents now use the
                        dataflow step form, and checks and a test read
                        it. The C, C++ and artifact forms are still
                        unused.
description:            |
                        icd_printer, icd_process_controller and
                        icd_system_controller in
                        _data/interface_control_document each hold a
                        dataflow_step surface. The extractor turns
                        their ports into interface_port facts
                        (src/cctool/graph/extract.py line 1482), which
                        unknown_port reads (src/cctool/check/check.lp
                        line 2893), and
                        test_dataflow_interface_page_draws_the_step_and_its_semantics
                        (src/cctool/web/_test/test_web.py line 807)
                        draws one. The only native surface is python,
                        in icd_cctool_check, and no document holds an
                        artifact surface. Found in the review of
                        2026-10-22.

