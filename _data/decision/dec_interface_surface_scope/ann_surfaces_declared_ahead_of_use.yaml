title:                  Surfaces declared ahead of their use
brief:                  |
                        The September schema declared C, C++, dataflow
                        step and artifact surfaces when one python
                        surface of six members was all that used it,
                        and its own annotation called that an ontology
                        settled before a use could test it.
description:            |
                        In the September iteration (origin/main of
                        cc-public, tag baseline_20260918),
                        annotation/ann_icd_schema_ahead_of_its_use.yaml
                        records it. Declaring less is the simpler
                        schema.

