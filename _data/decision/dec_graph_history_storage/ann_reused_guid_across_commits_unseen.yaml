title:                  Guid reuse across commits not detected
brief:                  |
                        The guid checks compare one commit with its
                        parent only, so a guid removed in one commit
                        and brought back several commits later goes
                        unseen.
description:            |
                        src/cctool/commit/change.lp lines 104-118
                        compare before_guid with after_guid only. The
                        candidate rule "a removed guid never comes
                        back" is listed as a guid stability check
                        (memory/commit-triples.md line 13), and the
                        assistant's 12:35:57Z reply that Will accepted
                        named it among the commit checks, but
                        change.lp has no such rule. ASSUMPTION
                        (advocate's inference): it needs guids from
                        commits before the parent, which a one-step
                        check does not see. The gap grows with each
                        removal.

