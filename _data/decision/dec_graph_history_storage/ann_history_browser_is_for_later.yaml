title:                  History browser left for later
brief:                  |
                        Graph-over-time history is wanted for a
                        history-aware browser, and that browser is for
                        later, not now.
description:            |
                        Owner's statement, 2026-10-14T12:39:46Z: "Yes.
                        Go ahead on that basis. We will probably want
                        graph-changes-over-time history to build a
                        graph-aware-history-aware browser, but that's
                        something for later, not for now."
                        (will-messages.md). The basis is the
                        assistant's reply of 2026-10-14T12:35:57Z
                        (assistant-written, session transcript): build
                        the before/after check in the commit-msg hook
                        next, and "Leave loading history until a query
                        needs it." Commit 7520f91 then built the check
                        only.

