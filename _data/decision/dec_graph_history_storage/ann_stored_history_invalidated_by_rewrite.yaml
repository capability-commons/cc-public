title:                  Stored history exposed to history rewrites
brief:                  |
                        The branch history has already been rewritten
                        once, and a graph history stored before that
                        squash would describe commits no longer on the
                        branch.
description:            |
                        WTP chose to squash local main's first 43
                        commits into one root commit with a backup tag
                        (maintainer's statement, 2026-10-14) and said
                        "I don't mind losing a bit of history to keep
                        everything clean" (2026-10-14). Root commit
                        7dda99e is dated 2026-10-14. The tag
                        pre_squash_20261014 holds 45 commits.
                        ASSUMPTION: a stored history is keyed by
                        commit hash or order. Holds while the branch
                        is unpublished. ASSUMPTION: main is
                        unpublished; the only record is a summary WTP
                        pasted on 2026-10-09 naming a remote
                        placeholder branch (will-messages.md line 44),
                        and the memory note says not to push unless
                        asked.

