title:                  Deferral wording presumes a store
brief:                  |
                        "Build history later" reads as a separate
                        store still to come, where a later browser
                        could derive past graphs from git on demand
                        and add a cache only on a measured need.
description:            |
                        Owner's statement, 2026-10-14T12:39:46Z
                        (will-messages.md). No browser and no history
                        store exist in the repository. The basis Will
                        accepted, the assistant's reply of
                        2026-10-14T12:35:57Z, said "Leave loading
                        history until a query needs it", a trigger of
                        need rather than a planned store. The memory
                        note's guidance is to add a type, relation or
                        command only when a real instance needs it
                        (memory/cc-public-design-principles.md line
                        27). ASSUMPTION, untested: a browser could
                        read past graphs through copy_commit and the
                        extractor fast enough. This challenges the
                        wording of the deferral, not its choice.

