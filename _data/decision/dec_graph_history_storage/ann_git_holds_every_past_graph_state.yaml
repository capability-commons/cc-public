title:                  Every past graph state already in git
brief:                  |
                        The graph at any commit is rebuilt from git on
                        demand, so a stored history would be a second
                        copy of what git holds, one that could drift
                        from it.
description:            |
                        copy_commit writes any commit's tree out with
                        git archive (src/cctool/gate/gate.py lines
                        186-203). The commit check builds the graph
                        before from HEAD and after from the staged
                        content (src/cctool/commit/change.py lines
                        59-74). check_trees checks the change between
                        any two trees (change.py lines 27-31). cctool
                        history check rebuilds each commit and its
                        first parent the same way
                        (src/cctool/commit/history.py lines 112-121;
                        commit 18d6181). On 2026-10-15 it reported "33
                        commits checked, all passed" (advocate's run).
                        No stored graph history exists in the tree
                        (git show --stat 7520f91). Will's principle,
                        as a memory note quotes it: "one mechanism
                        does one job and nothing is done twice"
                        (memory/cc-public-design-principles.md line
                        11). Judging one commit needs only the two
                        trees, not the series.

