title:                  Git history not a durable trace record
brief:                  |
                        Past graph states kept only in git commits are
                        lost when history is rewritten, while history
                        stored as items in the tree survives a squash,
                        because a squash keeps the tree.
description:            |
                        Root commit 7dda99e "replaces the local
                        history that built the seed"; the earlier 45
                        commits are kept only under the tag
                        pre_squash_20261014 (git log -1 7dda99e; git
                        rev-list --count pre_squash_20261014). WTP
                        chose the squash (maintainer's statements
                        2026-10-14). ASSUMPTION: further rewrites may
                        happen. No source says either way.

