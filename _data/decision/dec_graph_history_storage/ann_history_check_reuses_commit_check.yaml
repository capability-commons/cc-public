title:                  One tree comparison for both checks
brief:                  |
                        With nothing stored, the later check of
                        commits already made reuses the same tree
                        comparison, so there is one change-checking
                        mechanism.
description:            |
                        7520f91 (2026-10-14) adds the commit check and
                        no store. 18d6181 adds cctool history check,
                        which calls check_trees from
                        cctool.commit.change
                        (src/cctool/commit/history.py within check).
                        The pre-push hook runs it as the check of
                        record.

