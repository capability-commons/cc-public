title:                  Identities checked at each commit
brief:                  |
                        Each commit is checked against its parent for
                        unannounced removals and renames, so present
                        elements stay traceable step by step without a
                        stored history.
description:            |
                        src/cctool/commit/change.lp lines 104-165
                        (unannounced removals, unannounced renames,
                        renamed register entries without their old id
                        as alias, guids given another prefix); commit
                        7520f91. cctool history check applies the same
                        check to commits already made (commit
                        18d6181).

