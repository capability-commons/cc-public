title:                  Reasons for removed elements outside the graph
brief:                  |
                        The graph holds only the present tree, so the
                        reason an element existed and was removed
                        lives only in a git commit message that no
                        graph item links to.
description:            |
                        A removal is named in the commit item
                        (src/cctool/commit/change.lp within
                        retyped_guid and unannounced_removal, check
                        unannounced_removal). A commit item is held in
                        its git commit message, not in the tree
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_logic_program_file). The
                        extractor skips .git
                        (src/cctool/graph/extract.py). All 50 commit
                        items on the branch have an empty edge list
                        (git log: 33 written "relation: []" before the
                        field was renamed edge, and 17 written "edge:
                        []").

