title:                  Reasons for removed elements outside the graph
brief:                  |
                        The graph holds only the present tree, so the
                        reason an element existed and was removed
                        lives only in a git commit message that no
                        graph item links to.
description:            |
                        A removal is named in the commit item
                        (src/cc_public/commit/change.lp lines 121-131,
                        check unannounced_removal). A commit item is
                        held in its git commit message, not in the
                        tree (_data/register/reg_data_item_type.yaml
                        lines 705-711). The extractor skips .git
                        (src/cc_public/graph/extract.py line 102). All
                        33 commit items on the branch have an empty
                        relation list (git log, grep for "relation:
                        []").

