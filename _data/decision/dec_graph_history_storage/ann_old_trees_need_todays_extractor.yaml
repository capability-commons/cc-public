title:                  Rebuilding old graphs with current tooling
brief:                  |
                        Deferral relies on the current extractor and
                        rules reading every old tree, so a later
                        change to the tooling could leave some past
                        graphs unbuildable for a later browser.
description:            |
                        The history check reads sch_commit from each
                        commit's own tree but extracts facts and
                        evaluates change.lp with the running code
                        (src/cctool/commit/history.py lines 100-121;
                        src/cctool/commit/change.py line 51).
                        src/cctool/graph/extract.py changed in commits
                        7dda99e, 29cb646, 93a1428 and 6230e98, and the
                        rule language moved from Souffle to clingo
                        (6230e98). Today all 33 commits rebuild and
                        pass (advocate's run, 2026-10-15). ASSUMPTION:
                        each commit's own tooling, with pixi.lock,
                        could rebuild it, but no command does this.

