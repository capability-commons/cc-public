title:                  Graph-level view of a change that now exists
brief:                  |
                        ann_no_graph_level_view_of_a_change says a
                        reviewer sees only check failures and the text
                        diff, not the items a commit adds, removes or
                        changes. cctool impact now lists them, with
                        the untouched items linked to them.
description:            |
                        cctool impact, defined in
                        src/cctool/cli/auditing.py within impact,
                        lists each item a commit adds, removes,
                        renames or changes against its first parent,
                        and each untouched item within --depth links
                        of one, with the links that reach it. It also
                        runs on the staged content with --staged. The
                        work is done by src/cctool/commit/impact.py
                        and the touched and neighbor rules
                        (src/cctool/commit/impact.lp within touched
                        and neighbor). It reads the two graphs from
                        git, with no stored history. Found in the
                        review of 2026-10-22.

