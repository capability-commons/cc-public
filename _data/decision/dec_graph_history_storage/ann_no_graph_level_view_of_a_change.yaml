title:                  No graph-level view of a change
brief:                  |
                        A reviewer sees the check's failures and the
                        text diff, not the items and edges a commit
                        adds, removes or changes, and that view needs
                        no stored history.
description:            |
                        Each shown relation of change.lp is one check
                        and each row is one failure
                        (src/cc_public/commit/change.py lines 23-25).
                        "Change, Fix, Split, Merge and Lock are not
                        checked against the graph" (commit 7520f91
                        message). The before and after graphs are
                        already extracted (change.py lines 115-116).
                        This challenges the scope of the deferral, not
                        its choice of storage. ASSUMPTION: a rename
                        touches every referring item, so its text diff
                        spans many files.

