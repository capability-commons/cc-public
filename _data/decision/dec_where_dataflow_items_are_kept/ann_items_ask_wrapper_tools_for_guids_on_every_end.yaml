title:                  Guids that a wrapper or partner tool must write on every end
brief:                  |
                        A graph that any wrapper language may produce
                        must, as an item, carry the item header and,
                        at each end of each edge, the id and guid of
                        the node and of the port, with node ids that
                        follow the naming rule, while no guid may be
                        written by hand. Patrol's table generator
                        writes no guids today, and the trial, free to
                        choose, wrote ends as node and port names.
                        Files of their own let a partner or a wrapper
                        write plain configuration, which is the
                        strongest point for that option; under either
                        option that puts project graphs under _data,
                        cctool or the wrapper must mint the guids and
                        keep them stable.
description:            |
                        Sources:
                        - A dataflow graph is configuration data that
                          any wrapper language
                          can produce.
                          (_data/decision/dec_how_a_dataflow_graph_is_written/ruling_graph_as_configuration_data.yaml
                          at brief)
                        - An end requires the id and guid of its node
                          and of its port, and
                          identity and rights come from sch_standalone.
                          (_data/schema/sch_dataflow_graph.yaml at description and
                          $defs.end)
                        - A node is named for the dataflow graph that
                          holds it.
                          (src/cctool/check/check.lp within misnamed_node)
                        - Never write a guid by hand. (AGENTS.md, on
                          ids and guids)
                        - The Patrol table generator writes no guids
                          today.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_edge_guids_minted_stably_by_generators.yaml
                          at description)
                        - The trial wrote ends as node and port names
                          joined by a dot, and
                          hand-wrote guids on its operations. (review of 2026-10-29,
                          CC-026)
                        ASSUMPTION: an import command could mint guids
                        and turn node and port names into references,
                        which would remove most of this cost, but no
                        such command exists. Strength: moderate; it
                        falls away with an import command, and it does
                        not touch the standard library, which
                        cc-public writes itself.

