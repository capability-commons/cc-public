title:                  Where dataflow graphs, variants and node types are kept
brief:                  |
                        Are dataflow graphs, variants, node types and
                        dictionary entries data items under _data,
                        checked by cctool check, or files of their own
                        that the dataflow model reads and checks?
description:            |
                        dev holds sch_dataflow_graph,
                        sch_dataflow_node and the graph
                        dfg_stableflow_smoketest under _data, and
                        check.lp judges them. A graph is configuration
                        data (dec_how_a_dataflow_graph_is_written),
                        and variants are a type with operations
                        (dec_how_variants_are_held). The trial
                        implementation of 2026-10-29 invented a YAML
                        of its own, outside _data, with the same
                        prefix and folder names, hand-written guids,
                        and its standard node types and dictionary
                        inside the package. It could not read
                        dfg_stableflow_smoketest, and cctool check
                        read none of it (review of 2026-10-29, CC-024
                        and CC-026). sch_dataflow_graph also lacks the
                        merge keys that rqt_dataflow_schema_merge_keys
                        demands (CC-058).

