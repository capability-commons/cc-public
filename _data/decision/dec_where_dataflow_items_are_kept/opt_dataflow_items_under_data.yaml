title:                  Dataflow items under _data
brief:                  |
                        Graphs, variants, node types and dictionary
                        entries are data items under _data, each with
                        an id and a guid, a schema with a merge key
                        for every list, and checks in cctool check.
                        The standard node types are items too, in the
                        tree that ships them.

