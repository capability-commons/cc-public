title:                  Dictionary types that rulings hold as items for ports to name
brief:                  |
                        Two rulings make each dictionary type a data
                        item with a version, and have port types name
                        those entries, held as items, the engine's
                        first generated struct among the first. The
                        standard interfaces need standard types, such
                        as the control message, host readings and mode
                        flag that icd_dataflow_control_block now only
                        spells, and the trial shipped those, with
                        engine events and mode controller state, as
                        files in its package. Kept as items, a port
                        type names its entry by id and guid, which the
                        checks resolve as they resolve an end; kept as
                        files of their own, in a folder or in the
                        package, an interface names a type that is no
                        item, which the reference checks of the tree
                        cannot resolve, so the port check needs a
                        reader of its own or stays on spellings.
description:            |
                        Sources:
                        - Each type is a data item in a data
                          dictionary, with a version.
                          (_data/decision/dec_form_of_the_data_dictionary/opt_dictionary_items_with_upgrades.yaml
                          at brief, upheld by ruling_dictionary_items_with_upgrades)
                        - Port types name entries of data dictionaries
                          held as items, the
                          dictionary type being added with its first real entries, such as
                          the engine's first generated struct; until then the check
                          compares spellings.
                          (_data/decision/dec_port_types/opt_port_types_from_data_dictionaries.yaml
                          at brief, upheld by ruling_port_types_from_data_dictionaries)
                        - The control block interface spells its port
                          types as host
                          readings, mode flag and control message, and such spellings name
                          no dictionary entry; while the check compares spellings,
                          port_type_mismatch would fail every adapter or sender that
                          lowering inserts. (review of 2026-10-29, CC-065;
                          _data/interface_control_document/icd_dataflow_control_block.yaml
                          at surface)
                        - The trial ships these types as files in its
                          package. (trial
                          2c777ab9, src/cctool/dataflow/standard/data_dictionary/, files
                          control_message_v1.yaml, host_readings_v1.yaml and
                          mode_flag_v1.yaml, among the five there)
                        - The standard dictionary ships inside the
                          package as files of
                          their own.
                          (_data/decision/dec_where_dataflow_items_are_kept/opt_project_items_under_data_with_a_packaged_library.yaml
                          at brief)
                        Strength: strong; it follows from two rulings,
                        and the option names the engine's first
                        generated struct among the first entries a
                        dictionary will hold.

