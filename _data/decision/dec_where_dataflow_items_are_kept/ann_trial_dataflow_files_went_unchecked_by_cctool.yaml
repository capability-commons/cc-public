title:                  Trial dataflow files that no check of the tree ever read
brief:                  |
                        The trial kept its graphs, variants, node
                        types and dictionary in YAML of its own
                        outside _data, and cctool check read none of
                        it: it reported 0 failures with no dataflow
                        rule run, a variant naming an unknown node
                        type surfaced as a crash in lowering, and,
                        with no rule of its own on an input fed twice,
                        the trial let the last edge win where check.lp
                        fails such an input. Items under _data are
                        already validated against their schema, judged
                        by the dataflow rules of check.lp, and kept
                        through renames by their id references. Files
                        of their own need a reader, a discovery and a
                        wiring into cctool check of their own, and it
                        was that second reader that drifted.
description:            |
                        Sources:
                        - The trial reads folders of its own outside
                          _data, its keys and
                          ends differ from sch_dataflow_graph, and it cannot read
                          dfg_stableflow_smoketest. (review of 2026-10-29, CC-026)
                        - cctool check on the trial gives 0 failures
                          and runs no dataflow
                          rule; check_variant and the dictionary failures are called only
                          from tests; a variant with an unknown node type gives a KeyError
                          from lowering instead of a named failure. (review of 2026-10-29,
                          CC-024;
                          /mnt/project-files/notes/reviews/2026-10-29-full-review/areas/trial-model.md,
                          TM-07)
                        - dev fails an input fed by two edges, while
                          the trial has no such
                          check and lets the last edge win silently. (review of 2026-10-29,
                          CC-028; src/cctool/check/check.lp within input_fed_twice)
                        - check.lp already holds dataflow rules over
                          items, such as
                          foreign_node and unknown_port, which name the file and line, and
                          input_fed_twice and misnamed_node. (src/cctool/check/check.lp)
                        - The trial kept its merge keys in a Python
                          map over example data,
                          with three arrays exempt and two empty keys, not in a schema the
                          tree checks. (review of 2026-10-29, CC-058)
                        - Both ends of a dataflow edge are references,
                          so a rename keeps
                          the edge; the trial wrote ends as node and port names and called
                          the keys it built from them fragile under a rename.
                          (_data/schema/sch_dataflow_graph.yaml at description;
                          /mnt/project-files/notes/dataflow-trial/process-log.md, the
                          INVENTED entry on origin trace keys)
                        - A YAML file under _data that holds no item
                          is never checked, and
                          the reviewer recommends that no such file sit under _data, so
                          files of their own would stay outside it. (review of 2026-10-29,
                          CC-066 and section 7, W-D5)
                        - WTP will regenerate the trial from the
                          lessons of the review,
                          helped by the records being clear. (WTP, 2026-10-29)
                        ASSUMPTION: a regenerated model told only to
                        run its checks from cctool check would again
                        write a reader and rules of its own for a
                        format of its own. Strength: strong on what
                        the trial did; moderate as a prediction, since
                        the folder option could be wired into cctool
                        check, though it would not inherit the rules
                        check.lp already holds.

