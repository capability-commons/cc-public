title:                  Dataflow files in a folder of their own
brief:                  |
                        Graphs, variants, node types and dictionary
                        entries are configuration files in a dataflow
                        folder, read and checked by the dataflow model
                        and run from cctool check. Only what an item
                        must point at, such as a graph a requirement
                        names, gets an item.

