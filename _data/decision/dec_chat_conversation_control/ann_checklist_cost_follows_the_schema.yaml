title:                  Checklist cost bounded by the schema
brief:                  |
                        A checklist shown on every turn costs prompt
                        tokens in proportion to the fields of one
                        schema, not to the graph. It stays cheap only
                        if its "failed a check" part comes from
                        in-memory schema checks, not from a cctool run
                        per turn.
description:            |
                        The checklist option shows on every turn what
                        is filled, what is still needed and what
                        failed a check
                        (_data/decision/dec_chat_conversation_control/opt_checklist_led_conversation.yaml).
                        The checklist is drawn from the schema of one
                        item type (same file). The 45 schema files
                        total about 155 KB, and the largest,
                        sch_interface_control_document.yaml, is about
                        27 KB (wc -c on _data/schema, 2026-10-22). A
                        dry-run batch of 4 items took 17 s
                        (context.md, facts measured 2026-10-22).
                        ASSUMPTION: the conversation history sent each
                        turn is larger than the checklist after a few
                        turns, so the checklist adds a modest share of
                        tokens per turn. Free conversation and the
                        form walk send no checklist, but each still
                        resends the history on every turn (ASSUMPTION:
                        a stateless chat API is used). Holds at ten
                        times the size: yes, because ten times the
                        graph leaves the checklist the same size; only
                        a larger schema grows it.

