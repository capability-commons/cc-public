title:                  Checklist that lets the contributor lead without gaps
brief:                  |
                        A checklist-led conversation accepts facts in
                        the order the contributor offers them and
                        still asks for what is missing. A form walk
                        forces an order, and free conversation finds
                        gaps only at the end.
description:            |
                        The checklist option lets the LLM choose what
                        to ask next and shows it on every turn what is
                        filled, what is still needed and what failed a
                        check
                        (_data/decision/dec_chat_conversation_control/opt_checklist_led_conversation.yaml,
                        brief). The form walk asks for one field at a
                        time in the order of the schema
                        (_data/decision/dec_chat_conversation_control/opt_form_walk.yaml,
                        brief). Free conversation writes the item only
                        at the end
                        (_data/decision/dec_chat_conversation_control/opt_free_conversation.yaml,
                        brief). ASSUMPTION: a person describing a
                        colleague or a skill tends to give several
                        fields in one message and not in schema order.
                        Holds at ten times the size: yes, because the
                        checklist is drawn from the schema of each
                        type and its cost per turn does not grow with
                        the number of items or bots.

