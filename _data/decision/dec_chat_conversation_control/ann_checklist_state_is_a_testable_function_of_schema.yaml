title:                  Checklist state testable from schema and draft
brief:                  |
                        A checklist drawn from the schema is a plain
                        function of the schema and the draft, so it
                        can be unit tested and follows a schema change
                        with no code change. A free conversation has
                        no such state to test, and its faults show
                        only in the item written at the end.
description:            |
                        The checklist option shows the LLM, on every
                        turn, what is filled, what is still needed and
                        what failed a check, drawn from the schema
                        (opt_checklist_led_conversation.yaml, brief).
                        The free conversation option writes the item
                        only at the end (opt_free_conversation.yaml,
                        brief). A schema composes others through allOf
                        and $ref, and sets required and
                        unevaluatedProperties
                        (_data/schema/sch_option.yaml at allOf and
                        unevaluatedProperties), so drawing the
                        checklist means resolving those references
                        once, in code. The repository already runs
                        tests on staged code in its gate (AGENTS.md,
                        "Before you finish"). ASSUMPTION: a fault in a
                        free conversation is fixed by changing a
                        prompt, and the fix can be judged only by
                        running conversations. Holds at ten times the
                        size: yes, because the checklist code is the
                        same for every schema, while each new type
                        adds untested prompt behavior under free
                        conversation.

