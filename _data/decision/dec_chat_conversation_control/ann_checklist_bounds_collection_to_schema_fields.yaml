title:                  Collection bounded by the schema
brief:                  |
                        A checklist drawn from the schema keeps the
                        model asking for what the item needs. A free
                        conversation sets no bound, so it can collect
                        personal data no field calls for.
description:            |
                        The checklist option shows the model on every
                        turn what is filled, what is still needed and
                        what failed a check, drawn from the schema
                        [_data/decision/dec_chat_conversation_control/opt_checklist_led_conversation.yaml,
                        brief]. The free option lets the model talk
                        freely and write the item at the end
                        [_data/decision/dec_chat_conversation_control/opt_free_conversation.yaml,
                        brief]. The privacy concern asks what personal
                        data the design collects, and why
                        [_data/register/reg_concern.yaml lines
                        736-739]. ISO/IEC 29100 sets out data
                        minimization as a privacy principle
                        [_data/register/reg_concern.yaml lines
                        728-734]. Holds at ten times the size: yes,
                        because the bound is per conversation and does
                        not weaken with more conversations.

