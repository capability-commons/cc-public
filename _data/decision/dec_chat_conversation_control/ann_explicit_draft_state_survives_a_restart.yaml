title:                  Explicit draft state survives a restart
brief:                  |
                        A conversation that keeps a draft and a list
                        of what is still needed can be resumed after
                        the bot fails. A free conversation that writes
                        the item only at the end loses everything
                        gathered when the bot fails before that end.
description:            |
                        The checklist option shows the LLM, on every
                        turn, what is filled, what is still needed and
                        what failed a check
                        (opt_checklist_led_conversation, brief). The
                        form walk asks for one field at a time in the
                        order of the schema, so the next field is
                        known from the fields already filled
                        (opt_form_walk, brief). The free conversation
                        option lets the LLM talk freely and writes the
                        item at the end (opt_free_conversation,
                        brief). A failed process loses whatever it
                        held only in memory (ASSUMPTION, general
                        property of processes). Holds at ten times the
                        size: yes, because more and longer
                        conversations raise the chance that a failure
                        lands mid-conversation.

