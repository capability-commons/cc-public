title:                  Missing fields kept in view by the checklist
brief:                  |
                        A checklist of filled, needed and failed
                        fields lets the bot finish an item that is
                        complete and valid while letting the person
                        answer in any order. Free conversation finds
                        missing fields only at the end.
description:            |
                        A checklist worked well before: the LLM
                        chooses what to talk about next but stays
                        aware of what it still needs (owner's
                        statement). Schemas name required fields, for
                        example sch_decision requires a brief
                        (_data/schema/sch_decision.yaml lines 36-39).
                        cctool refuses an edit that adds a failure and
                        writes nothing (src/cctool/cli/editing.py
                        lines 500-511). opt_free_conversation writes
                        the item at the end (its brief). opt_form_walk
                        asks one field at a time in schema order (its
                        brief). ASSUMPTION: contributors often give
                        several fields in one message, or out of
                        order. Holds at ten times the size: yes,
                        because a checklist is drawn from the schema
                        of one item, whose size does not grow with the
                        graph.

