title:                  Record every edge and replay any part
brief:                  |
                        Recording nodes record every edge message, not
                        only what comes from outside, so that any node
                        or subgraph can be replayed alone from its
                        recorded inputs. A whole run is replayed as by
                        the transform and replay controller.
description:            |
                        1. A transform puts a recorder on every edge,
                          at a cost in storage and in work off the
                          local step.
                        2. To replay a part, a transform cuts it out
                          and puts players on its inputs; to replay
                          the whole, proceed as by the transform and
                          replay controller.
                        3. Compare the replayed outputs with the
                          recorded ones, edge by edge, to find the
                          first node that differs.

