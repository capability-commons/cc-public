title:                  Replay mode as engine work that inserted nodes could do
brief:                  |
                        The engine does nothing a node could do unless
                        a recorded decision measures the need; the
                        replay ruling was rephrased so that the engine
                        records nothing itself, and the requirements
                        already name a player that stands in for the
                        outside world. A replay mode in the engine
                        conflicts with the first ruling unless a
                        decision records why no inserted node can do
                        the work, and runs against the second, which
                        put recording in nodes. The trial shows the
                        cost: replay ran through a second path beside
                        each live one, in the core, the dynamic
                        subgraph, the actor gap and the control block.
                        Its replayed change sets were built on the
                        unit thread and allocated there, and a missing
                        row passed with no fault. The transform still
                        needs the engine to hold a change set until a
                        named step, but that is not replay's alone.
description:            |
                        Sources:
                        - The engine does nothing that a node could
                          do, unless a recorded
                          decision shows no inserted node can, within a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml at brief)
                        - The engine records nothing itself; recording
                          nodes write the log.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml at brief)
                        - A player stands in for the outside world,
                          local step by local
                          step. (_data/requirement/rqt_player_replays_exactly.yaml at brief;
                          _data/interface_control_document/icd_dataflow_recorder.yaml at brief)
                        - The trial's replay mode lived in the core,
                          the dynamic subgraph,
                          the actor gap and the control block. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, class Replay and
                          function run; src/cctool/dataflow/engine/src/dynamic.cpp,
                          function dynamic_begin; src/cctool/dataflow/engine/src/actors.cpp,
                          function actors_gap;
                          src/cctool/dataflow/engine/nodes/control_block.cpp, function
                          control_block_unit_step)
                        - Replayed change sets were built on the unit
                          thread and allocated
                          there. (area report trial-engine, TE-09)
                        - On a missing row the reader gave a count of
                          0 and the control
                          block kept the last control message, so a run with a failed
                          step did not replay. (review of 2026-10-29, CC-012; trial
                          2c777ab9, src/cctool/dataflow/engine/src/runtime.cpp, function
                          Replay::fill) As read from the code, the control block ignored
                          the reader's result and reported nothing. (trial 2c777ab9,
                          src/cctool/dataflow/engine/nodes/control_block.cpp, function
                          control_block_unit_step)
                        - The controller sends each change set ahead,
                          marked with its
                          step, and the engine holds it until then.
                          (_data/decision/dec_how_a_recorded_run_is_replayed/opt_replay_by_a_transform_and_a_replay_controller.yaml at description, step 3)
                        ASSUMPTION: deployment could use the same hold
                        for a change set scheduled at a step, so the
                        hold is a general engine capability. Strength:
                        strong; it rests on a ruling and on the
                        trial's defects, and no measurement has been
                        recorded that would justify the exception.

