title:                  Replay on the field build, which keeps faults of that build
brief:                  |
                        Replay exists to reproduce faults found in the
                        field. A replay mode runs the very binary that
                        ran in the field, as the trial did. A replay
                        by transform builds another variant, with
                        players in place of sources and control blocks
                        and a controller added, so the generated
                        schedule and buffer layout can differ. Several
                        of the trial's faults lived there, or had
                        effects that hang on the layout: the control
                        block's place in the generated order, a
                        default that overwrote the next buffer
                        descriptor, and an adapter that overflowed the
                        heap. A replay build might not reproduce such
                        a fault, and its digest differs from the
                        recorded one.
description:            |
                        Sources:
                        - Replay is how faults found in the field are
                          reproduced and how
                          evidence is checked.
                          (_data/requirement/rqt_engine_replays_live_changes.yaml at rationale)
                        - A replay is a variant made by a transform
                          that puts players in
                          place of sources and control blocks and adds a replay
                          controller.
                          (_data/decision/dec_how_a_recorded_run_is_replayed/opt_replay_by_a_transform_and_a_replay_controller.yaml at brief)
                        - The trial replayed with the same engine
                          binary given a recording.
                          (trial 2c777ab9, src/cctool/dataflow/_test/test_dynamic.py,
                          test_a_run_with_live_changes_replays_exactly)
                        - Faults in the generated schedule and layout:
                          the control block
                          after ordinary nodes, and a feedback default writing into the
                          next buffer descriptor; and the fold adapter's heap overflow,
                          which corrupts whatever lies next in the heap. (review of
                          2026-10-29, CC-001, CC-018 and CC-010)
                        - A separate digest of the build is one open
                          option.
                          (_data/decision/dec_what_the_digest_of_a_build_identifies/opt_separate_digest_of_the_build.yaml at brief)
                        ASSUMPTION: a transform that puts a player in
                        a source's slot, with the same ports and
                        buffers, keeps the schedule and layout and
                        differs only in the function called there,
                        which would close most of the gap. Strength:
                        moderate; it falls to weak if the replay
                        transform is held to that rule.

