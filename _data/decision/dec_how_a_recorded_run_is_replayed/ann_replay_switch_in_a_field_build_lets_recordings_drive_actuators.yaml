title:                  Replay switch in a field build that lets a recording drive a robot
brief:                  |
                        With a replay mode, every engine shipped to a
                        robot can be started so that recorded values,
                        or crafted ones, stand in for its sensors. In
                        the trial this was one command-line argument,
                        and a live change set was not refused during a
                        replay. A replay variant made by a transform
                        has players where the sensors were, and the
                        field build carries no replay path at all,
                        provided the control block's replay setting is
                        bound at build. Neither option says what
                        becomes of nodes that act on the world during
                        a replay. A transform can replace them by
                        their declared role, while an engine mode
                        would have to know them itself.
description:            |
                        Sources:
                        - The trial's engine took a recording to
                          replay as a command-line
                          argument, and its control blocks wrote recorded values whenever
                          the engine replayed. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, function run;
                          src/cctool/dataflow/engine/nodes/control_block.cpp, function
                          control_block_unit_step)
                        - A live apply during a replay was not
                          refused. (area report
                          trial-engine, section 3, determinism and replay)
                        - The control block has a setting that makes
                          it write recorded
                          control messages instead of reading the platform.
                          (_data/interface_control_document/icd_dataflow_control_block.yaml at surface.unit.dataflow_step.settings.replay.brief)
                        - Each setting declares the latest time it may
                          be bound, and a
                          check fails a variant that binds it later.
                          (_data/decision/dec_binding_time_of_a_variation/ruling_latest_binding_time_per_setting.yaml at brief)
                        - A node type declaring a role such as sink is
                          one open option.
                          (_data/decision/dec_which_nodes_may_reach_the_outside_world/opt_privileged_roles_declared_by_the_node_type.yaml at brief)
                        - Safety asks what harm the design could cause
                          and how each hazard
                          is limited. (_data/register/reg_concern.yaml at entries.concern_safety.question)
                        ASSUMPTION: whoever can start or restart an
                        engine on the robot could pass it a recording.
                        Strength: strong for the field build; it does
                        not apply to a replay mode compiled only into
                        bench builds, which is close to a transform
                        anyway.

