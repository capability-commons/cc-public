title:                  Replay controller that a fast replay can outrun
brief:                  |
                        By transform, the recorded change sets and
                        outside messages reach the engine from a
                        controller through runtime control, which
                        takes one request at a time, each with its
                        reply. A replay run as fast as it can go, as
                        the trial's were, can reach a step before what
                        is due there has arrived. The engine must then
                        refuse the late item as a fault and lose the
                        replay, wait at each step until the controller
                        is done with it (a pacing handshake that is
                        new engine behavior and slows the replay), or
                        take the whole schedule before start, sized
                        for the run. A replay mode reads the log at
                        load and cannot be late. Holding a change set
                        until a named step is also what
                        prepare-then-commit provides and installing at
                        the next step does not.
description:            |
                        Sources:
                        - The controller sends each change set and
                          outside message ahead,
                          marked with its step or gap, and the engine holds it until then.
                          (_data/decision/dec_how_a_recorded_run_is_replayed/opt_replay_by_a_transform_and_a_replay_controller.yaml at description, step 3)
                        - Requests come one at a time, each answered
                          by one reply.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml at surface.data.artifact.production)
                        - On replay, each outside message enters at
                          the gap the recording
                          names, and a gap admits only the messages waiting when it opens.
                          (_data/requirement/rqt_actors_replay_admission.yaml at object;
                          _data/requirement/rqt_actors_admit_waiting_only.yaml at object)
                        - The trial replayed with no pacing, and its
                          apply waited up to
                          2 s for the install before replying. (trial 2c777ab9,
                          src/cctool/dataflow/_test/test_dynamic.py,
                          test_a_run_with_live_changes_replays_exactly;
                          src/cctool/dataflow/engine/src/dynamic.cpp, function hook_apply)
                        - Prepare-then-commit names a step for each
                          unit; installing at the
                          next step names none.
                          (_data/decision/dec_how_a_change_set_is_installed/opt_prepare_then_commit_on_each_unit.yaml at brief;
                          _data/decision/dec_how_a_change_set_is_installed/opt_install_on_each_unit_at_its_next_step.yaml at brief)
                        Strength: moderate; a replay with few change
                        sets and messages can send them all before
                        start, and the handshake matters only for
                        long, busy runs.

