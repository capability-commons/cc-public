title:                  Recording of every edge that multiplies what can overflow
brief:                  |
                        Memory is fixed before the first step, and the
                        recorder must keep its writes off the step.
                        The trial already lost change and admission
                        rows without a count when its buffer or a row
                        filled, and the review found that fixed memory
                        and recording every value cannot both hold. A
                        recorder on every edge multiplies the rows of
                        each step by the number of edges, adds a copy
                        of every value, and at 30 Hz turns a large
                        recording into a much larger one. Recording
                        what comes from outside, as the ruling asks,
                        keeps the volume to what replay needs.
description:            |
                        Sources:
                        - A recorder goes on every edge, at a cost in
                          storage and in work
                          off the local step.
                          (_data/decision/dec_how_a_recorded_run_is_replayed/opt_record_every_edge_and_replay_any_part.yaml at description, step 1)
                        - Change and admission rows the recorder could
                          not take were
                          dropped with no count, and replay diverged. (review of
                          2026-10-29, CC-015)
                        - No event lost and every value recorded
                          cannot both hold with
                          fixed memory. (review of 2026-10-29, CC-052;
                          _data/decision/dec_overflow_of_events_and_recordings/dec_overflow_of_events_and_recordings.yaml at brief)
                        - The trial's recording ring reserved 4096
                          rows of 64 KiB, and the
                          file held one row for each end and step, as JSON with the
                          message in hex. (area report trial-engine, TE-19; trial process
                          log, phase 2)
                        - A value is copied into each queue it passes
                          through.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/ruling_value_copied_into_each_queue.yaml at brief)
                        - Recorders capture every value from outside,
                          every control message
                          and every engine event. (_data/requirement/rqt_recorder_records_outside.yaml at object)
                        - Patrol's camera runs at 30 Hz. (WTP,
                          2026-10-28) Strength: strong for a deployed
                          robot; weak for a short bench run, where a
                          variant could record every edge on purpose.

