title:                  Replay by a transform and a replay controller
brief:                  |
                        A replay is a variant. A transform puts a
                        player that reads the log in place of each
                        node that reads the outside world and of each
                        control block, and adds a replay controller
                        that hands the recorded change sets and
                        outside messages to runtime control, each
                        marked with the step or gap at which the
                        engine must apply or admit it. The engine has
                        no replay mode.
description:            |
                        1. Resolve the variant the recording names, by
                          its digest.
                        2. Apply the replay transform: players for
                          sources and control blocks, and a replay
                          controller.
                        3. Run. The players emit the recorded values
                          at each local step; the controller sends
                          each change set and outside message ahead of
                          time, marked with its recorded step or gap,
                          and the engine holds it until then.
                        4. Record the replay as any run, and compare
                          the two recordings.

