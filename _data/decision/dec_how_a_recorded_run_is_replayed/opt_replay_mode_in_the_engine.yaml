title:                  Replay mode in the engine
brief:                  |
                        The engine has a replay mode. Given a log, it
                        feeds the recorded values in place of the
                        outside world, and applies change sets and
                        admissions at their recorded steps and gaps
                        itself, as the trial did.
description:            |
                        1. Start the engine built for the recorded
                          graph, with the log.
                        2. At each local step, the engine fills each
                          source output and control message from the
                          log instead of running the node.
                        3. At each recorded step or gap, the engine
                          applies the change set or admits the message
                          the log names.
                        4. Recording nodes record the replay, to
                          compare.

