title:                  LLM judge criteria to keep in step with each type
brief:                  |
                        Mechanized checks already exist and are
                        tested. An LLM judge adds criteria for each
                        type that must change with its schema, and
                        output that a deterministic test cannot pin
                        down.
description:            |
                        The judge option judges each draft with an LLM
                        against criteria for its type, together with
                        the graph checks and the mechanized style
                        rules (opt_llm_judge_and_checks.yaml, brief).
                        Of the 16 writing style rules, 14 have
                        enforcement none and 2 have enforcement check
                        (_data/register/reg_writing_style_rule.yaml at
                        entries, the enforcement field of each). Each
                        check in a logic program carries a did and a
                        fix sentence, and a test fails a check that
                        lacks either (AGENTS.md, "Failures and
                        errors"). The owner expects an eval to give
                        feedback on insufficient, inaccurate or poorly
                        phrased information (owner's statement).
                        ASSUMPTION: the output of an LLM judge varies
                        between runs and model versions, so a test of
                        it checks a tolerance rather than an exact
                        result. Holds at ten times the size: yes,
                        because criteria grow with the number of
                        types, while the mechanized checks are shared
                        by all types.

