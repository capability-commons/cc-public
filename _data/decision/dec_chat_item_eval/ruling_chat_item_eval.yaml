title:                  LLM judge with the checks
brief:                  |
                        An LLM judge, run with the graph checks and
                        the mechanized style rules, tells the
                        contributor while they are still in the
                        conversation that an answer is insufficient,
                        vague or badly phrased, which the checks
                        cannot do. The judge does not block the
                        readback: the contributor may use its feedback
                        to improve the item or override it and leave
                        the item as it is. The judge uses the same
                        model access as the conversation. A type's
                        judge criteria live in an eval item of their
                        own, not in the interview guide. The reviewer
                        still reviews the branch, but is not the only
                        judge of quality. Ruled by WTP on 2026-10-23.

