title:                  One extra model call per draft
brief:                  |
                        An LLM judge adds a model call, with its
                        latency and tokens, at each readback. The cost
                        is bounded per draft, and grows with the graph
                        only if graph context is put in the judge's
                        prompt.
description:            |
                        The judge option judges each draft with an LLM
                        against criteria for its type, together with
                        the graph checks and the mechanized style
                        rules
                        (_data/decision/dec_chat_item_eval/opt_llm_judge_and_checks.yaml).
                        The mechanized-checks option uses only the
                        checks that are mechanized
                        (_data/decision/dec_chat_item_eval/opt_mechanized_checks_only.yaml).
                        The owner wants consistency checks that use
                        the graph and the ontology (owner's
                        statement). A cctool dry run is needed by the
                        mechanized checks anyway, and a dry-run batch
                        of 4 items took 17 s (context.md, facts
                        measured 2026-10-22). ASSUMPTION: one model
                        call over a draft and its criteria takes a few
                        seconds, small beside the dry run. ASSUMPTION:
                        the graph checks already cover graph
                        consistency, so the judge's prompt need hold
                        only the draft and its criteria. Holds at ten
                        times the size: yes if the judge's prompt
                        holds only the draft, because its cost then
                        follows the item; no if the prompt carries
                        graph context, because that grows with the
                        graph.

