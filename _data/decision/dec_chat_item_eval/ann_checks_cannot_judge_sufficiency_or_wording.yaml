title:                  Quality the checks cannot see
brief:                  |
                        The mechanized checks judge form and graph
                        consistency, and most writing rules are not
                        mechanized, so the checks alone cannot tell a
                        contributor that an answer is insufficient,
                        vague or badly phrased. An LLM judge gives
                        that feedback in the conversation, while the
                        contributor is still there to fix it, and not
                        later through a reviewer.
description:            |
                        An eval is likely needed to give feedback when
                        information is insufficient, inaccurate or
                        poorly phrased (owner's statement). The checks
                        cover forms such as ids, guids, references and
                        term links (src/cctool/check/check.lp). Of the
                        16 writing style rules, 14 have enforcement
                        none and 2 have enforcement check
                        (_data/register/reg_writing_style_rule.yaml,
                        enforcement fields, lines 58-501). The option
                        of quality left to the reviewer judges quality
                        only at review of the branch of the bot
                        (_data/decision/dec_chat_item_eval/opt_reviewer_judges_quality.yaml,
                        brief). ASSUMPTION: the reviewer cannot reach
                        the contributor as easily as the bot can
                        during the conversation. ASSUMPTION: an LLM
                        judge sometimes flags a sound answer, which
                        costs the contributor an extra turn. Holds at
                        ten times the size: yes, because the judge
                        runs per draft, more items give a reviewer
                        more quality to judge with no more access to
                        the sources, and the gap between mechanized
                        and unmechanized rules does not shrink with
                        size.

