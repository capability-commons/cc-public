title:                  Failing part added to the gate by an LLM judge
brief:                  |
                        Mechanized checks give the same verdict each
                        time and need no outside service. An LLM judge
                        adds a model call that can fail or time out,
                        so if the judge gates the readback, the bot
                        stops whenever the model does.
description:            |
                        The mechanized checks run in cctool on the
                        local tree (src/cctool/edit/edit.py, function
                        apply, lines 1075-1098). The judge option
                        judges each draft with an LLM against criteria
                        for its type, together with the checks
                        (opt_llm_judge_and_checks, brief). A model
                        call over a network can fail, time out or
                        return a malformed answer (ASSUMPTION). Holds
                        at ten times the size: yes, because more
                        drafts mean more judge calls and so more
                        failed calls, unless a failed judgment lets
                        the readback go ahead with the checks alone.

