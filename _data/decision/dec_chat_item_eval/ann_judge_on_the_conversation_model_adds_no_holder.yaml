title:                  No new holder of personal data for a judge on the conversation model
brief:                  |
                        A judge that reaches the same model as the
                        conversation reads only a draft drawn from
                        messages that model has already read, so it
                        adds no holder of personal data. A judge
                        reached through another service would add one.
description:            |
                        The judge option judges each draft with an LLM
                        (_data/decision/dec_chat_item_eval/opt_llm_judge_and_checks.yaml,
                        brief). The conversation already passes the
                        messages of the contributor to an LLM, which
                        chooses what to ask next
                        (ruling_chat_conversation_control, brief). The
                        draft the judge reads is drawn from those
                        messages, so a judge reached through the same
                        model access sends personal data to no holder
                        that does not already have it. Each deployment
                        names the model that serves it
                        (ruling_chat_llm_access, brief). The
                        mechanized checks run in the process of the
                        bot (ruling_chat_edit_interface, brief;
                        src/cc_public/edit/edit.py lines 1170-1192)
                        and send the draft nowhere. Leaving quality to
                        the reviewer adds no holder either, since the
                        reviewer reads the branch under every option
                        (ruling_chat_review_gates, brief). The privacy
                        concern asks who can see personal data
                        (_data/register/reg_concern.yaml lines
                        721-750). ASSUMPTION: the judge's prompt holds
                        the draft and its criteria, and no personal
                        data beyond the draft. Holds at ten times the
                        size: yes, because the judge reads only what
                        the conversation model has already read,
                        whatever the number of items.

