title:                  History check cost per commit, not per change
brief:                  |
                        The history check extracts two whole trees and
                        runs the rules over the facts of the whole
                        tree for every commit, whatever it changes.
                        The rule for small changes means more commits,
                        so a full history audit grows as commits times
                        tree size. It took 133 s at 33 commits on
                        2026-10-15, and about 5 s a commit on the
                        maintainer's machine on 2026-10-22.
description:            |
                        The chosen option keeps each change small
                        enough to read in one sitting (AGENTS.md lines
                        234-238); Will likes finer commits, one verb
                        per commit (memory/MEMORY.md line 42). For
                        each commit, history.check copies the commit's
                        tree and its parent's with git archive
                        (src/cctool/commit/history.py lines 106-134;
                        src/cctool/gate/gate.py lines 266-283). The
                        change check extracts the facts of both whole
                        trees and evaluates the rules over them
                        (src/cctool/commit/change.py lines 78-90,
                        121-141). It now lays out only the files whose
                        bytes differ (change.py lines 145-161), and
                        parsed documents and their facts are reused by
                        path and content digest
                        (src/cctool/graph/extract.py lines 155-174,
                        523-557, 756-800). Measured 2026-10-15 at
                        89c74d8: cctool history check over 33 commits
                        took 133 s, about 4 s a commit (a verifier
                        re-run took 137 s). On 2026-10-22 it took
                        about 52 s a commit on the maintainer's 2-CPU
                        machine, until a fix to the retyped guid rule
                        of change.lp brought it to about 5 s
                        (memory/gate-speed.md). The pre-push hook
                        checks only the commits the remote lacks
                        (history.py lines 81-100; .githooks/pre-push
                        line 33) and runs the gate once for each
                        pushed ref tip, as Will chose on 2026-10-16.
                        Device tool calls die at 180 s
                        (memory/MEMORY.md line 46). ASSUMPTION:
                        pruning the legacy tree would also make many
                        commits; the chosen option adds the rule for
                        small changes with no matching rule that the
                        per-commit check cost follow the change.

