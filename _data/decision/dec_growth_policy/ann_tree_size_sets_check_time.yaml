title:                  Check time set by tree size
brief:                  |
                        A whole-tree check spends almost all its time
                        reading, validating and laying out each file,
                        not on the rules. Check time grows with the
                        data in the tree, so a small tree keeps it
                        short.
description:            |
                        cctool check at 89c74d8 takes 4.3 s, 4.4 s and
                        4.6 s in three runs. Under cProfile (19.3 s in
                        all) YAML loading takes 11.4 s, JSON Schema
                        validation 9.0 s and the layout check 7.4 s
                        (these overlap); the clingo evaluation takes
                        0.69 s, about 4 percent (advocate measurements
                        2026-10-15, cloud container with 4 CPUs;
                        Will's VM has 2, memory/MEMORY.md line 45).
                        check reads, validates and lays out every file
                        on each call (src/cc_public/check/check.py
                        lines 66-82). The tree at 89c74d8 holds 75
                        tracked YAML files; the legacy tree held 665
                        (note cc-public-session-context.md line 48).
                        ASSUMPTION: per-file cost is roughly constant,
                        so a check over a legacy-sized tree takes
                        about nine times as long. Legacy file sizes
                        are not recorded, and the legacy tree used a
                        different checker.

