title:                  Unchecked need rule for additions
brief:                  |
                        The rule that an element needs a real instance
                        is prose only. No check finds a type with no
                        items, a relation with no edges or two
                        mechanisms for one job, and nothing records
                        which instance needed an element.
description:            |
                        Rule: AGENTS.md lines 89-93. check.lp has no
                        such rule among its headed rules (lines
                        35-643); unused_concept and unused_schema test
                        only that an item is named (lines 608-643).
                        Five days after bb8c338, HEAD 89c74d8 holds
                        5,395 lines of non-test Python, 949 lines of
                        clingo rules, 8 CLI command modules and 5 git
                        hooks. Two query languages came on the owner's
                        view that both will be needed (owner's
                        statement 2026-10-13T22:46:52Z), before an
                        instance asked for either. The legacy tree
                        ended with 25 types without instances (note
                        cc-public-session-context.md line 49). No
                        other .lp file or module under src checks it
                        either.

