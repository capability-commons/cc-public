title:                  Unchecked need rule for additions
brief:                  |
                        The rule that an element needs a real instance
                        is prose only. No check finds a type with no
                        items, a relation with no edges or two
                        mechanisms for one job, and nothing records
                        which instance needed an element.
description:            |
                        Rule: AGENTS.md#keep-it-small. No rule of
                        src/cctool/check/check.lp, advise.lp or
                        friction.lp finds a type with no items, a
                        relation with no edges or two mechanisms for
                        one job; unused_concept and unused_schema test
                        only that an item is named (check.lp within
                        unused_schema, named_by_other and
                        unused_concept). At e3a198e5 type_python_class
                        has no item, and relation_supersedes,
                        relation_has_actor, relation_has_exact_match
                        and relation_has_narrow_match have no edge in
                        the tree, yet the check passes (grep of
                        id_self and id_relation over the tree;
                        check.review, 0 failures). Five days after
                        bb8c338, HEAD 89c74d8 held 5,395 lines of
                        non-test Python, 949 lines of clingo rules, 8
                        CLI command modules and 5 git hooks; at
                        e3a198e5 it holds 18,917 lines of non-test
                        Python and 4,985 lines of clingo rules, with 8
                        command modules and 5 hooks. Two query
                        languages came on the maintainer's view that
                        both will be needed (maintainer's statement
                        2026-10-13), before an instance asked for
                        either; there are now five query languages
                        (src/cctool/cli/querying.py). The legacy tree
                        ended with 25 types without instances (note
                        cc-public-session-context.md line 49).

