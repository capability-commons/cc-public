title:                  Pruning against a tree too large to read
brief:                  |
                        Pruning the legacy tree means judging each
                        removal against a tree that had already
                        outgrown what Will could read. Regrowth lets
                        each addition be read when it is made.
description:            |
                        Legacy code grew from 7.5k to 25.7k lines, and
                        YAML from 83 to 665 files, in 13 days; it had
                        71 types, 132 decision records, 243 open
                        questions, 314 orphans and 136 unanswered
                        annotations (note cc-public-session-context.md
                        lines 48-50). "The review backlog grew faster
                        than Will could read it" (same note, line 87).
                        ASSUMPTION: a safe removal needs a reading of
                        what depends on the removed element, outside
                        the change itself.

