title:                  Large seed pruned before regrowth
brief:                  |
                        The seed was not small when committed. It held
                        7,928 lines of registers and schemas, and
                        became small four days later by a prune of
                        5,885 lines.
description:            |
                        bb8c338 (2026-10-09): 18 files, 7,928 lines,
                        with 73 type entries in reg_data_item_type and
                        138 concept entries and no code (git show
                        --stat bb8c338). It also held a second,
                        pared-down type register with 5 types, and the
                        survey read the 73-type file as a leftover
                        being replaced (note cc-folder-survey.md lines
                        60, 67). 232f001 (2026-10-13): 5,885 lines
                        deleted, removing the 5-type register and
                        leaving 7 types and 7 concepts (git show
                        --stat 232f001). So the chosen path began with
                        continue-and-prune applied to the data.
                        ASSUMPTION: the 73 seed types derive from the
                        legacy 71.

