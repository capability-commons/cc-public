title:                  Check of record on one machine only
brief:                  |
                        The legacy tree ran its gate in CI. The
                        regrown tree has its check of record only in a
                        local pre-push hook, with nothing pushed and
                        no CI yet, so a fault in one machine's setup
                        has no second check behind it.
description:            |
                        Legacy CI: gate.yml and CodeQL (note
                        cc-folder-survey.md line 29).
                        .githooks/pre-push lines 19-28: "the check of
                        record until CI runs it too". A remote exists
                        but nothing is pushed (memory/MEMORY.md line
                        7; enforcement-approach.md line 10). Local
                        hooks can be skipped (enforcement-approach.md
                        line 11). The young checker read a missing
                        output file as no failures (memory/MEMORY.md
                        line 53). Temporary: adding CI removes most of
                        it. The legacy gate was not fault-free either
                        (note cc-public-session-context.md lines 63,
                        68).

