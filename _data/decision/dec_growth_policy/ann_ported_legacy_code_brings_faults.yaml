title:                  Legacy faults carried by ported code
brief:                  |
                        Regrowth ports legacy code into the seed, so
                        it can carry legacy faults with it. The ported
                        printer lost empty mappings, a fault the
                        September review had reproduced, until a later
                        fix.
description:            |
                        The September review reproduced "the printer
                        deletes comments, retypes keys and loses empty
                        maps" (note cc-public-session-context.md lines
                        65-69). The layout module is the legacy
                        printer (memory/MEMORY.md lines 37, 44).
                        Commit 3ba3a5c fixes an empty mapping in a
                        list written as nothing. Weak: found and fixed
                        the same day. ASSUMPTION: the other reproduced
                        defects were not checked against the new tree.

