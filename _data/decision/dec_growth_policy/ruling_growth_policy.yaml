title:                  Regrowth from a small seed
brief:                  |
                        cc-public grows from a small seed: the legacy
                        tree is kept under a tag and not pruned, and a
                        type, relation, field or command is added only
                        when a real instance needs it, in changes
                        small enough to read in one sitting. The
                        maintainer gave this as the way to address the
                        bloat of the previous attempt, and pruning
                        would have meant judging each removal against
                        a tree too large to read. The rule is not yet
                        checked, and the regrown tree already holds
                        more YAML than the legacy one, so the policy
                        alone does not bound growth. Ruled by William
                        Payne on 2026-10-23.

