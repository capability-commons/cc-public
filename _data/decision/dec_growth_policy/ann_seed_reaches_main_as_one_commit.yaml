title:                  Seed on dev as one large commit
brief:                  |
                        The regrown tree reaches dev as one root
                        commit, which no one can read as a single
                        change. It was squashed twice, into 7dda99e of
                        11,910 lines on 2026-10-14 and into 3f145c9 on
                        2026-10-20, and the small steps survive only
                        under tags.
description:            |
                        Commit 7dda99e added 78 files and 11,910 lines
                        and replaced 45 earlier commits, kept under
                        tag pre_squash_20261014 (git show --stat
                        7dda99e in a clone at 89c74d8; its message).
                        On 2026-10-20 dev was squashed again into the
                        root commit 3f145c9, with that history under
                        tag pre_squash_20261020, and both tags were
                        pushed on 2026-10-21 (memory/MEMORY.md line
                        43). No branch is named main, and 7dda99e is
                        not an ancestor of dev (review of 2026-10-22,
                        A4 and E2). Weak: a squash is a one-off that
                        does not grow with the tree, though it has now
                        been done twice.

