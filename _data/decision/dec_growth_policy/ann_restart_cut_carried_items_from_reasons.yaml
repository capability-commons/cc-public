title:                  Carried material cut from its reasons
brief:                  |
                        The restart carried legacy material into the
                        seed but not the decision records that gave
                        its reasons, so those reasons are now recorded
                        after the fact. Pruning would have kept each
                        element's link to its record.
description:            |
                        bb8c338 adds reg_concept.yaml (3259 lines) and
                        reg_data_item_type.yaml (2608 lines), and its
                        prose cites legacy decision record ids that do
                        not exist in cc-public (git show bb8c338; note
                        cc-folder-survey.md lines 62-64, 72). The
                        sessions "don't record the decision to
                        restart" (note cc-public-session-context.md
                        line 87). Past decisions are being captured on
                        the maintainer's request of 2026-10-14. A
                        one-time cost bounded by what the seed
                        carried.

