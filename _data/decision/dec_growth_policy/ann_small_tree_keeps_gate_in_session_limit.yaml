title:                  Gate time within the session limit
brief:                  |
                        The small regrown tree keeps the commit gate
                        near 75 seconds, inside the 180 second limit
                        of a remote session, and every commit passes
                        the check of record, so each is a known-good
                        point.
description:            |
                        Device tool calls die at 180 s
                        (memory/MEMORY.md line 45). The gate took
                        about 75 s after the clingo switch (lines 47,
                        54). The history check passes on all commits
                        (line 55). The legacy tree is kept under tag
                        baseline_20260918 (line 6), so the restart
                        lost no data. ASSUMPTION: a gate over the
                        legacy tree would take longer; its time is not
                        recorded. The point weakens as the regrown
                        tree grows. Most of the gate time is the test
                        suite, which runs beside the whole-tree check
                        and lint (src/cc_public/gate/gate.py lines
                        64-66); the whole-tree check itself takes
                        about 4.5 s (see
                        ann_tree_size_sets_check_time), so tree size
                        sets only part of the gate time.

