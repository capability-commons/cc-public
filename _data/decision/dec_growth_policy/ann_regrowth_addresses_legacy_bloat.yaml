title:                  Careful regrowth against legacy bloat
brief:                  |
                        Growing again, more carefully, from a small
                        seed addresses the bloat that the previous
                        attempt accumulated, which the owner gave as
                        the reason on 2026-10-13.
description:            |
                        Owner's statement 2026-10-13T14:46:40Z: "The
                        current work we are doing is still to address
                        some of the bloat that the previous attempt at
                        cc-public accumulated by growing it again
                        (more carefully) from a small seed." Earlier,
                        in memory cc-public-design-principles.md: "A
                        prior attempt failed because the LLM generated
                        too much material to review". AGENTS.md lines
                        89-91: "The previous iteration grew faster
                        than it could be reviewed." ASSUMPTION: the
                        reason speaks for reviewability and
                        simplicity; Will did not name the concerns.

