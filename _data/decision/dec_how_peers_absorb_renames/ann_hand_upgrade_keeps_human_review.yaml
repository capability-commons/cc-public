title:                  Human review of each changed reference
brief:                  |
                        Editing references by hand means a person
                        reads each change in the release notes before
                        the peer depends on it, the strongest review
                        of the three options. With frequent renames
                        expected before 1.0, the volume may erode that
                        review in practice.
description:            |
                        Sources:
                        - The peer's maintainer "edits its references
                          by hand from the release notes"
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_hand.yaml,
                          brief).
                        - The owner wants a churn-tolerant phase
                          before 1.0 that tolerates renames and prefix
                          changes (owner's memory note, 2026-10-21).
                        - Assumption: a reviewer reading many rename
                          notes by hand checks each less carefully.
                          Strength: weak.

