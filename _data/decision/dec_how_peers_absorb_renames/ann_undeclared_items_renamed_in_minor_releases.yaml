title:                  Renames of undeclared items in minor releases
brief:                  |
                        Only the data format and the code that an
                        interface control document declares are
                        public, so after 1.0 a rename of another
                        shared item, such as a logical component that
                        a peer realizes, is not breaking and may ship
                        in a minor release. The peer's check then
                        fails on the outdated reference as soon as it
                        takes that release. A command that applies the
                        renames keeps such a release compatible in
                        practice; by hand, a release that the version
                        calls compatible stops the peer's check until
                        someone edits its references.
description:            |
                        Sources:
                        - The data format, with its schemas, registers
                          and the ids of its types and relations, is
                          public, and code is public only where an
                          interface control document declares it
                          (_data/decision/dec_declared_public_api/opt_public_api_split_by_kind.yaml
                          lines 13-17); "Anything not declared public
                          is private"
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml
                          lines 38-39).
                        - Under SemVer the major version is
                          incremented for a backward incompatible
                          change to the public API
                          (https://semver.org/, item 8), and a peer
                          can accept every release below the next
                          major
                          (_data/decision/dec_version_scheme/ann_semver_lets_peers_pin_a_safe_range.yaml,
                          brief).
                        - A reference by an old id is a failure, found
                          through an alias or through the guid
                          (src/cctool/check/check.lp lines 1966-1975;
                          _data/decision/dec_rename_safety/ann_rename_old_id_reference_fails_check.yaml).
                        - The target of relation_realizes is a logical
                          component or a member of an interface
                          control document
                          (_data/register/reg_relation.yaml lines
                          379-382). Strength: moderate; no peer names
                          such an item yet, and the rule that only
                          public items count as breaking is ruled, so
                          the cost falls on how peers absorb renames.

