title:                  Upgrade by rename maps
brief:                  |
                        Each release ships the renames it makes, each
                        as an old id, a new id and the guid, and a
                        command in the peer rewrites each reference to
                        the id its guid names in the release it takes,
                        and each prose mention from the renames of
                        every release in between. Ruled by William
                        Payne on 2026-10-24.

