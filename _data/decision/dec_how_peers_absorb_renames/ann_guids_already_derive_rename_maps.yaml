title:                  Rename maps derivable from guids
brief:                  |
                        Every edge carries the guid of its target, and
                        a guid never changes, so the new id of a
                        renamed target can be looked up from the two
                        releases. A shipped map stores what can be
                        derived, and its apply command would repeat
                        much of cctool rename. Deriving still needs
                        both releases at hand, and prose mentions
                        carry ids only.
description:            |
                        Sources:
                        - An edge carries the id and the guid of its
                          target, and the guid tells items apart so
                          the id can be renamed
                          (_data/decision/dec_edge_shape/ruling_edge_shape.yaml
                          lines 12-18).
                        - A guid is minted once and never changed
                          (AGENTS.md lines 113-115).
                        - The commit check finds renamed items by
                          matching guids before and after
                          (src/cc_public/commit/change.lp lines
                          107-111).
                        - cctool rename changes every YAML document
                          that names the id (AGENTS.md lines 124-128;
                          src/cc_public/edit/edit.py lines 950-962).
                          Strength: moderate.

