title:                  Rename maps derivable from guids
brief:                  |
                        Every edge carries the guid of its target, and
                        a guid never changes, so the new id of a
                        renamed target can be found from the guid in
                        the release a peer moves to, as the outdated
                        reference check already does. A shipped map
                        stores what can be derived for edges, and its
                        apply command would repeat much of cctool
                        rename. Prose mentions carry ids only, so
                        their new ids still need the renames of the
                        releases in between.
description:            |
                        Sources:
                        - An edge carries the id and the guid of its
                          target, and the guid tells items apart so
                          the id can be renamed
                          (_data/decision/dec_edge_shape/ruling_edge_shape.yaml
                          lines 12-18).
                        - A guid is minted once and never changed
                          (AGENTS.md lines 114-115).
                        - The outdated reference rule finds the
                          current id of a reference whose id names
                          nothing from its guid
                          (src/cctool/check/check.lp lines
                          2041-2045). A mention is found outdated only
                          through an alias (check.lp lines 2082-2086),
                          and only register entries keep aliases
                          (_data/schema/sch_register_entry.yaml lines
                          67-80).
                        - The commit check finds renamed items by
                          matching guids before and after
                          (src/cctool/commit/change.lp lines
                          107-114).
                        - cctool rename changes every YAML document
                          that names the id (AGENTS.md lines 123-127;
                          src/cctool/edit/edit.py lines 960-971 and
                          1023-1044). Strength: moderate.

