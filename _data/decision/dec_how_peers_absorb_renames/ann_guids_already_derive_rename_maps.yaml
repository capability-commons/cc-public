title:                  Rename maps derivable from guids
brief:                  |
                        Every edge carries the guid of its target, and
                        a guid never changes, so the new id of a
                        renamed target can be found from the guid in
                        the release a peer moves to, as the outdated
                        reference check already does, and the option
                        now resolves edges that way. The rename maps
                        are derived for each release under the ruled
                        release record whatever is chosen here, so
                        shipping them costs this option nothing. What
                        it still adds is a command whose rewrite
                        repeats much of cctool rename. Prose mentions
                        carry ids only, so their new ids still need
                        the renames of the releases in between.
description:            |
                        Sources:
                        - An edge carries the id and the guid of its
                          target, and the guid tells items apart so
                          the id can be renamed
                          (_data/decision/dec_edge_shape/ruling_edge_shape.yaml at brief).
                        - A guid is minted once and never changed
                          (AGENTS.md#changing-data-items).
                        - The outdated reference rule finds the
                          current id of a reference whose id names
                          nothing from its guid
                          (src/cctool/check/check.lp within outdated_reference).
                          A mention is found outdated only through an
                          alias (check.lp within outdated_mention), and only
                          register entries keep aliases
                          (_data/schema/sch_register_entry.yaml at properties.alias).
                        - The release notes and rename maps are
                          derived from the commit items since the last
                          release
                          (_data/decision/dec_home_of_the_release_record/ruling_release_file_in_data.yaml at brief).
                        - The commit check finds renamed items by
                          matching guids before and after
                          (src/cctool/commit/change.lp within added).
                        - cctool rename changes every YAML document
                          that names the id (AGENTS.md#changing-data-items;
                          src/cctool/edit/edit.py within _rename_all and _renamed_documents).
                          Strength: weak; the option already resolves
                          edges by guid and the maps are ruled, so
                          only the cost of the command remains.

