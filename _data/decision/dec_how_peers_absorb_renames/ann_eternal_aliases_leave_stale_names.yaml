title:                  Stale names left standing by eternal aliases
brief:                  |
                        The checker today reports a reference by an
                        old id, so ids that resolve for ever would
                        need that check relaxed for peers. A peer's
                        references would then keep resolving after the
                        item behind them is renamed, moved or
                        reworked, with no one in the peer having to
                        look, and its files would go on naming items
                        by ids that cc-public no longer uses.
description:            |
                        Sources:
                        - The option says "a peer never has to change
                          its references"
                          (_data/decision/dec_how_peers_absorb_renames/opt_aliases_resolve_for_ever.yaml,
                          brief).
                        - The outdated reference rule reports a
                          reference that names an item by an old id,
                          through an alias or through the guid
                          (src/cctool/check/check.lp within outdated_reference).
                        - The extractor emits an alias fact for each
                          old id an item carries
                          (src/cctool/graph/extract.py within _walk), and the advisory rule for
                          unresolved marks treats a mark reference as
                          resolved when it matches an alias
                          (src/cctool/check/advise.lp within unresolved_mark).
                          Strength: moderate; the conflict with the
                          existing check is direct, though the alias
                          still names the same item, so this is a loss
                          of review rather than a breach.

