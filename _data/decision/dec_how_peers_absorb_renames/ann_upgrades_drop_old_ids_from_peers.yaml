title:                  Old ids dropped from each peer that upgrades
brief:                  |
                        Under rename maps and under a hand upgrade
                        alike, a peer that takes a release stops
                        naming an old id, since its check fails until
                        it does, and the old id stays only in the
                        records of the release that made the rename.
                        So where a segment whose ids describe people
                        renames an id to correct it, the correction
                        reaches each peer that upgrades, which old ids
                        kept for ever would prevent. Neither option
                        removes the old id from the history and
                        release records that already hold it, so this
                        point does not choose between them.
description:            |
                        Sources:
                        - A reference by an old id fails as outdated
                          (src/cctool/check/check.lp lines 1966-1975),
                          and a mention of an id that names no item
                          and no alias fails as dangling (check.lp
                          lines 1551-1557).
                        - A commit item names every id its commit
                          renames (AGENTS.md lines 98-100), and the
                          release notes and rename maps are derived
                          from the commit items
                          (_data/decision/dec_home_of_the_release_record/ruling_release_file_in_data.yaml
                          lines 13-17).
                        - Federation must let a segment meet security
                          and privacy requirements, such as those on
                          personal data of members under the GDPR
                          (_data/logical_component/lco_federation.yaml
                          lines 18-24; owner's statement,
                          2026-10-22T20:19).
                        - The GDPR gives a data subject rights to
                          rectification and erasure (GDPR Articles 16
                          and 17, https://gdpr-info.eu/art-16-gdpr/
                          and https://gdpr-info.eu/art-17-gdpr/).
                          Strength: weak; cc-public's own ids are
                          impersonal, and the point bears on segments
                          that copy the scheme.

