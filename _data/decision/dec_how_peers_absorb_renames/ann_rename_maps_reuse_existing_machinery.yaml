title:                  Existing rename machinery behind rename maps
brief:                  |
                        The tooling already records every rename in
                        commit items, matches an old id to its item by
                        guid, and rewrites every reference in a tree.
                        A rename map applied by a command reuses these
                        three parts, so a peer upgrade becomes one
                        checked step instead of a hand edit per
                        renamed id.
description:            |
                        Sources:
                        - Every commit carries a commit item, and the
                          commit check already detects renames and
                          removals (context note, _sources/context.md
                          line 34).
                        - A commit item must name the id of every item
                          the commit removes or renames (AGENTS.md
                          lines 98-102).
                        - The outdated reference rule finds a
                          reference by an old id through the guid,
                          "which decides", where the old id names
                          nothing (src/cc_public/check/check.lp lines
                          2003-2007 and 2031-2035).
                        - cctool rename rewrites the id in every YAML
                          document that names it
                          (src/cc_public/edit/edit.py lines 951-981
                          and 1014-1034). Strength: strong; each part
                          the option needs already exists.

