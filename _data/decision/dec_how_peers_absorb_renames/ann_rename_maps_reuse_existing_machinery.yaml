title:                  Existing rename machinery behind rename maps
brief:                  |
                        The tooling already records every rename in
                        commit items, matches an old id to its item by
                        guid, and rewrites every reference to an id in
                        a tree. A rename map applied by a command
                        reuses these three parts, so a peer upgrade
                        becomes one checked step instead of a hand
                        edit per renamed id. The command would call
                        the rewrite itself, since cctool rename
                        refuses an id that its tree does not hold and
                        a change of prefix.
description:            |
                        Sources:
                        - Every commit carries a commit item, and the
                          commit check already detects renames and
                          removals (context note, _sources/context.md
                          line 34); each commit is checked against the
                          graph before and after it
                          (_data/decision/dec_check_commit_against_graph/ruling_check_commit_against_graph.yaml,
                          brief).
                        - A commit item must name the id of every item
                          the commit removes or renames (AGENTS.md#before-you-finish).
                        - The outdated reference rule finds a
                          reference by an old id through the guid,
                          "which decides", where the old id names
                          nothing (src/cctool/check/check.lp within outdated_reference).
                        - cctool rename rewrites the id in every YAML
                          document that names it
                          (src/cctool/edit/edit.py within _derived and _rename_one), but refuses an id the tree
                          does not hold and a new id with another
                          prefix (edit.py within rename). Strength:
                          strong; each part exists, though the command
                          would call the rewrite without the guards of
                          cctool rename.

