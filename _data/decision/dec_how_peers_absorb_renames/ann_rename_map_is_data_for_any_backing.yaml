title:                  Rename map as data for any backing store
brief:                  |
                        A rename map keyed by guid is plain data, so a
                        segment backed by files and one backed by a
                        graph database can each apply it; only the
                        command that applies it is tied to the file
                        tree, and a database segment would need its
                        own applier.
description:            |
                        Sources:
                        - The option ships a map of renamed ids
                          matched by guid, and a command applies the
                          maps
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_rename_maps.yaml,
                          brief).
                        - Partner segments will likely use a graph
                          database or similar, while the graph today
                          is backed by the filesystem and stored in
                          git (owner's statement, 2026-10-22).
                          Strength: moderate; it keeps the upgrade
                          path open to backings that do not exist yet,
                          at the price of one applier per backing.

