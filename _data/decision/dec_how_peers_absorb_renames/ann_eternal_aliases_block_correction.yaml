title:                  Old identifiers that can never be dropped
brief:                  |
                        If every old id must resolve for ever, an id
                        renamed to correct or remove what it says can
                        never be dropped. Where a segment whose ids
                        describe people takes up the same rule, a
                        person could not have an old identifier of
                        theirs removed; cc-public's own ids are
                        impersonal, so the risk lies in segments that
                        copy the rule.
description:            |
                        Sources:
                        - The option keeps every old id resolvable as
                          an alias, so a peer never changes its
                          references
                          (_data/decision/dec_how_peers_absorb_renames/opt_aliases_resolve_for_ever.yaml,
                          brief).
                        - A renamed register entry keeps its old id in
                          its alias list (AGENTS.md lines 99-100), and
                          the extractor records each alias as a fact
                          (src/cctool/graph/extract.py lines
                          1232-1233).
                        - Some federated segments will hold personal
                          data that must comply with the GDPR (owner's
                          statement, 2026-10-22).
                        - The GDPR gives a data subject rights to
                          rectification and erasure (GDPR Articles 16
                          and 17, https://gdpr-info.eu/art-16-gdpr/
                          and https://gdpr-info.eu/art-17-gdpr/).
                          Strength: weak.

