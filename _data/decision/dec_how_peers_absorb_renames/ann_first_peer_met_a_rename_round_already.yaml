title:                  A rename round the first peer has already met
brief:                  |
                        The first peer's drafts were written before
                        cc-public changed the prefix of its relation
                        ids from r to relation, and its graph draft
                        still names the realizes relation by the old
                        id 22 times, in edges with no guid.
                        relation_realizes keeps no alias, and no file
                        in cc-public's tree names the old id, so
                        neither an alias nor a guid would lead a peer
                        to the new id. Only a record of the old and
                        the new id, as the shipped renames carry, or a
                        person who remembers, can. The peer's own plan
                        is to regenerate those drafts by hand when
                        they are ported.
description:            |
                        Sources:
                        - "relation ids" changed prefix to relation,
                          and the ICD drafts use the new shapes while
                          the graph draft and the variants "still use
                          the old ones and will be regenerated when
                          ported"
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 235-238).
                        - The graph draft names the realizes relation
                          by its old id 22 times, each in an edge with
                          no guid_relation or guid_target (grep of
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml).
                        - relation_realizes has an empty alias list
                          (_data/register/reg_relation.yaml lines
                          372-390), and a grep of _data and src finds
                          the old id nowhere.
                        - A conformant edge must carry both guids
                          (_data/schema/sch_trait_edge.yaml lines
                          78-82), so once the drafts are ported their
                          edges can be resolved by guid; their prose
                          cannot.
                        - The option ships each rename as an old id, a
                          new id and the guid
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_rename_maps.yaml,
                          brief). Strength: moderate; it is one real
                          case, met before any release, in drafts that
                          do not yet conform.

