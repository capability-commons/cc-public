title:                  Upgrade command tested by the fixture peer of the release gate
brief:                  |
                        Once a peer can consume cc-public, the release
                        gate checks a fixture peer against each
                        release. A fixture peer that names a renamed
                        item by its old id lets the gate run the
                        upgrade command at each release and find a
                        wrong rename or a wrong rewrite before the
                        tag, so that no real peer is the first to meet
                        it. A hand upgrade is tried only in each real
                        peer, after the release.
description:            |
                        Sources:
                        - Before a release is tagged, and once a peer
                          can consume cc-public, a fixture peer checks
                          against it
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml
                          lines 13-19).
                        - A command in the peer rewrites its
                          references from the renames of the release
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_rename_maps.yaml,
                          brief); the hand option leaves the edit to
                          the peer's maintainer
                          (opt_upgrade_by_hand.yaml in the same
                          folder, brief).
                        - No peer can consume cc-public yet: cctool
                          check takes one root
                          (src/cctool/cli/checking.py lines 43-50),
                          and the multi-root check that a peer needs
                          is planned (_sources/cc-patrol-notes/plan.md
                          lines 65-68). Strength: moderate; neither
                          the fixture peer nor the command exists, but
                          the gate that would run them is ruled.

