title:                  Hand upgrade with no new code
brief:                  |
                        Upgrading by hand from the release notes adds
                        no command and no map to cc-public, and the
                        checker already reports a reference whose id
                        names nothing, so a missed rename is still
                        found, though only when the peer's check
                        fails. Its cost grows with the renames between
                        two releases, so it holds only while peers and
                        renames are few.
description:            |
                        Sources:
                        - A reference to an old id fails the check
                          (_data/decision/dec_rename_safety/ann_rename_old_id_reference_fails_check.yaml).
                        - The release notes can be generated
                          mechanically from the graph (owner's
                          statement, 2026-10-22T16:28).
                        - The owner tolerates renames and prefix
                          changes before 1.0 (owner's memory note,
                          2026-10-21; _sources/context.md line 26),
                          and after 1.0 bundles breaking changes into
                          one major release (owner's statement,
                          2026-10-22T16:23). Strength: moderate; it is
                          the fewest mechanisms, but the cost per
                          release is not yet measured.

