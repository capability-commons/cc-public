title:                  Eternal aliases beyond the ruled alias mechanism
brief:                  |
                        Old ids resolve today only for register
                        entries, whose alias list shares the key
                        namespace of live entries; a renamed
                        standalone item or embedded member keeps none.
                        Resolving every old id for ever would need
                        aliases on every type, and would ask old ids
                        to do for ever the job the rename ruling gives
                        the guid, finding a renamed item from an edge.
description:            |
                        Sources:
                        - Only register entries declare an alias, and
                          aliases share the key namespace of live
                          entries
                          (_data/schema/sch_register_entry.yaml lines
                          67-80).
                        - A renamed standalone item keeps no record of
                          its old id
                          (_data/decision/dec_rename_safety/ann_rename_standalone_items_keep_no_alias.yaml);
                          an embedded member keeps no alias, since
                          references carry its guid
                          (src/cctool/edit/edit.py lines 957-962).
                        - The rename ruling upholds the alias list on
                          register entries and says the guid finds any
                          renamed item from an edge, and that a fused
                          number would be a second stable key beside
                          the guid
                          (_data/decision/dec_rename_safety/ruling_rename_safety.yaml
                          lines 12-37). Strength: strong; it follows
                          from a ruled decision and from what the
                          schema allows.

