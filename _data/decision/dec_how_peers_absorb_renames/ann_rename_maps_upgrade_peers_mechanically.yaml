title:                  Mechanical peer upgrade by guid-keyed maps
brief:                  |
                        Renames and prefix changes are expected often
                        before 1.0, and cctool rename rewrites only
                        the local tree. A map of renamed ids keyed by
                        guid, which never changes, lets a command
                        rewrite every reference in a peer to exactly
                        the item it named before, across every skipped
                        release and with the same effort for any
                        number of peers, where a hand edit costs time
                        per rename per peer and can miss a reference
                        or point it at the wrong item. Each map does
                        keep the old ids in every release that ships
                        it.
description:            |
                        Sources:
                        - The rename edit rewrites every YAML document
                          of the local tree that names the old id
                          (src/cc_public/edit/edit.py lines
                          1014-1034).
                        - "Copies held in a partner's repository
                          cannot be refreshed from here."
                          (_data/schema/sch_trait_edge.yaml lines
                          120-124)
                        - A reference whose id names nothing but whose
                          guid resolves is reported as outdated
                          (src/cc_public/check/check.lp lines
                          2031-2035).
                        - A guid is minted once and never changed
                          (AGENTS.md lines 113-115).
                        - The commit check already detects renames and
                          removals, and every commit carries a commit
                          item (context note, _sources/context.md line
                          34); the history check compares the graph
                          before and after each commit by guid
                          (_data/decision/dec_author_and_time_of_items/ann_commit_items_trace_each_item_change.yaml).
                        - The owner accepts "lots of churn in this
                          pre-version-1.0 phase", and after 1.0
                          expects to bundle breaking changes such as
                          prefix changes into one major release
                          (owner's statement, 2026-10-22T16:23;
                          owner's memory note, 2026-10-21).
                        - The option ships a map of renamed ids,
                          matched by guid, and a command applies the
                          maps of every release in between
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_rename_maps.yaml,
                          brief); the hand option has the peer's
                          maintainer edit references from the release
                          notes (opt_upgrade_by_hand.yaml in the same
                          folder, brief).
                        - Assumption: a prefix change renames every
                          item of a type at once, so one release can
                          rename hundreds of ids, and a hand edit
                          across many references is more likely to
                          miss one than a command. Strength: strong;
                          churn is stated policy, and a hand upgrade
                          multiplies it by the number of peers.

