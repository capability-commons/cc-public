title:                  Rename maps already in the ruled release record
brief:                  |
                        The release record ruled on 2026-10-24 derives
                        the rename maps of each release from the
                        commit items since the last, and the release
                        component lists them, so this option adds no
                        record of its own. What it adds is a command
                        that applies them, where the hand option
                        leaves the same derived renames for a person
                        to read and apply.
description:            |
                        Sources:
                        - The release notes and rename maps are
                          derived from the commit items since the last
                          release
                          (_data/decision/dec_home_of_the_release_record/ruling_release_file_in_data.yaml
                          lines 13-17).
                        - The release component holds "the notes and
                          rename maps derived for each release"
                          (_data/logical_component/lco_release.yaml
                          lines 13-16).
                        - The bump of each release is computed from
                          the same graph
                          (_data/decision/dec_version_scheme/ruling_semver_computed.yaml,
                          brief), a commit item names every id its
                          commit renames (AGENTS.md lines 98-100), and
                          the commit check finds renamed items by guid
                          (src/cctool/commit/change.lp lines 119-122).
                        - The option ships the renames each release
                          makes
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_rename_maps.yaml,
                          brief). Strength: strong for the record,
                          which is ruled; it says nothing of the cost
                          of the command.

