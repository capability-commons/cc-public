title:                  Unbounded growth of alias rows
brief:                  |
                        Keeping every old id for ever makes the graph
                        each environment loads grow with history
                        rather than with content, and every backing
                        store a segment uses must resolve the same
                        aliases.
description:            |
                        Sources:
                        - The owner expects many renames and prefix
                          changes before 1.0 (owner's memory note,
                          2026-10-21; _sources/context.md line 26).
                        - Partner segments will likely use a graph
                          database or similar as their backing
                          (owner's statement, 2026-10-22).
                        - Extraction reads the whole tree into base
                          predicates each time
                          (src/cctool/graph/extract.py lines 18-32
                          and 430-436).
                        - Assumption: an alias kept for ever is a row
                          that every extraction and every consuming
                          store carries, whether or not a peer still
                          uses it. Strength: moderate; each alias is
                          small, but the cost grows with history and
                          with the number of stores.

