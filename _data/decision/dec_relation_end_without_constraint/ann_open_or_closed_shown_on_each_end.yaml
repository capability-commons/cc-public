title:                  Open or closed shown on each end
brief:                  |
                        Whether an end is open is visible on the
                        relation entry: it names constraints or it
                        does not. The open ends of relation_has_actor
                        and relation_has_process stay open as chosen.
description:            |
                        The relation page says "The target is open to
                        any item." for an end with no constraint
                        (pym_cctool.web.constraint). Closing an end
                        later is one edge, as for
                        relation_has_subject.

