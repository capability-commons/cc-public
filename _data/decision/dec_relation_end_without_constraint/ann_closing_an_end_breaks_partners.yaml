title:                  Closing an end that breaks partners
brief:                  |
                        When cc-public adds a restriction to an end
                        partners already use, their checks fail when
                        they next take cc-public. How they hear of it
                        in time is not settled.
description:            |
                        Candidates noted in the walkthrough of the
                        design: report it as advice for a period, pin
                        the cc-public a partner consumes, or announce
                        it in the commit item.

