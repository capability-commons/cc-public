title:                  Host stop that gives whoever can delay a link a stop button
brief:                  |
                        Where a receiver reads over a network a third
                        party can reach, whoever can delay that link
                        past the timeout can, under the host-stop
                        option, stop the receiving host at will, and a
                        brief drop on a radio link stops it by
                        accident. Under waiting without limit the same
                        delay freezes every unit downstream for as
                        long as it lasts. Under a timeout with a
                        fail-safe the attacker can force the declared
                        fail-safe, but the units run on and each fault
                        is reported, which bounds the harm and leaves
                        a trace.
description:            |
                        Sources:
                        - Whoever can delay or flood a link between
                          hosts can stretch
                          every step on the consumer, and the transport still needs a
                          timeout and a fail-safe.
                          (_data/decision/dec_same_step_or_next_step_reading/ann_cross_host_wait_within_a_step_as_an_attack_path.yaml
                          at brief)
                        - A receiver that times out, or whose link
                          closes, stops every
                          unit on its host.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_stops_the_host.yaml
                          at brief)
                        - On a timeout or a closed link the engine
                          reports a fault event,
                          applies the fail-safe, and the unit runs on.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_applies_a_declared_fail_safe.yaml
                          at brief)
                        - Security asks what an attacker can reach and
                          what it would
                          cost; reliability is measured by availability in percent of
                          scheduled time. (_data/register/reg_concern.yaml at
                          entries.concern_security.question and
                          entries.concern_reliability.measure)
                        ASSUMPTION: some deployments join hosts over a
                        network a third party can reach, such as a
                        robot's radio link to a base station; Patrol
                        on one Orin may have none. Strength: moderate;
                        it applies only to crossings between hosts,
                        and a stop may still be right where the safe
                        state is a halted robot.

