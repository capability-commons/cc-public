title:                  Orderly stop as the least mechanism for a dead peer
brief:                  |
                        Stopping the host when a receiver times out
                        needs no per-port declaration, no new entry on
                        the fail-safe list, and no reasoning about how
                        each reader handles a message that never came:
                        one event, one stop, a flushed recording. A
                        halted host is one known state to argue in a
                        safety case, where running on means arguing
                        the fail-safe of every crossing port. The
                        review's own acceptance for the TCP finding
                        asks for an event and an orderly stop, though
                        on the policy it recommends the fail-safe. For
                        a first engine and early Patrol work this is
                        the simplest answer, and a safe one if the
                        robot comes to rest when commands cease; it is
                        weak where the host must keep running.
description:            |
                        Sources:
                        - A receiver that times out or whose link
                          closes reports a fault
                          event and stops every unit on its host at the end of the local
                          step.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_stops_the_host.yaml
                          at brief)
                        - Killing either peer should give an event and
                          an orderly stop,
                          with the recording flushed. (review of 2026-10-29, CC-016) On
                          the policy itself the review recommends a fault event and the
                          receiver's fail-safe instead of a stop. (review of 2026-10-29,
                          section 7, W-T7)
                        - WTP wants the approach pragmatic and as
                          simple as feasible.
                          (WTP, 2026-10-28)
                        - Safety asks what state the design falls back
                          to when it fails.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question)
                        ASSUMPTION: Patrol's actuators stop when
                        commands cease, so a halted host leaves the
                        robot at rest. Strength: moderate; it rests on
                        the assumption about actuators, and loses
                        force once the robot must keep a function
                        running through a lost link.

