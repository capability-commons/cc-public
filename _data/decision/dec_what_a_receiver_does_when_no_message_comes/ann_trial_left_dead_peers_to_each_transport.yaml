title:                  Dead peer handled a different way by each transport of the trial
brief:                  |
                        With no failure clause in the transport ICD,
                        the trial's transports each did something
                        different, and none reported it. Over TCP a
                        dead sender left the receiver running on empty
                        messages for 100 local steps while status
                        showed nothing wrong, and a dead receiver
                        killed the sender's process by SIGPIPE before
                        its recording was flushed. The in-process
                        queue waits for ever unless it is closed, a
                        stopped receiver left its sender blocked on a
                        full queue, and at start a missing peer blocks
                        the engine before runtime control can stop it.
                        Whatever is chosen must be written as the
                        ICD's failure clause, cover the sender's wait
                        as well as the receiver's, and be tested by
                        killing each peer. The timeout option is the
                        only one whose text already asks the engine to
                        keep the unit running and report.
description:            |
                        Sources:
                        - The transport ICD gives the receiver no
                          timeout and has no
                          failure clause.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/dec_what_a_receiver_does_when_no_message_comes.yaml
                          at description;
                          _data/interface_control_document/icd_dataflow_transport.yaml at
                          surface.receiver.dataflow_step.availability)
                        - Over TCP an end of file or an interrupted
                          read gives a count of
                          0 with no event, and writes have no guard against SIGPIPE.
                          (trial 2c777ab9,
                          src/cctool/dataflow/engine/nodes/transport.cpp, functions
                          read_all, write_all and Engine::receive)
                        - Measured: a killed receiver killed the
                          sender with exit status
                          -13, its recording unflushed; after the sender was killed the
                          receiver ran 100 more local steps on empty messages and status
                          showed nothing wrong. (review of 2026-10-29, CC-016)
                        - The in-process queue waits until a message
                          comes or the queue
                          is closed. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, function
                          Channel::pop)
                        - Before runtime control starts, the receiver
                          blocks in accept
                          and the sender retries its connection for ever. (trial
                          2c777ab9, src/cctool/dataflow/engine/nodes/transport.cpp,
                          function transport_open)
                        - Stopping u2 left u1 blocked in a lossless
                          send at step 7 while
                          status said it was running. (review of 2026-10-29, CC-047, and
                          area report trial-engine, TE-18)
                        - On a timeout or a closed link the engine
                          reports a fault event,
                          applies the fail-safe, and the unit runs on.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_applies_a_declared_fail_safe.yaml
                          at brief)
                        - The review asks that killing either peer
                          give an event and an
                          orderly stop with the recording flushed, and leaves stop or
                          degrade to WTP. (review of 2026-10-29, CC-016)
                        Strength: strong as evidence that the failure
                        clause must be written for both ends; the
                        host-stop option also reports an event, so the
                        point weighs most against waiting without
                        limit, which reports nothing.

