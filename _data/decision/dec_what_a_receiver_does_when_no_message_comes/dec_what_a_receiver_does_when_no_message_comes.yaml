title:                  What a receiver does when no message comes
brief:                  |
                        When a receiver waits for a message from
                        another execution unit or host and none comes,
                        because the sender stalled, crashed or lost
                        its link, what does the receiver do?
description:            |
                        The transport ICD (icd_dataflow_transport)
                        gives the receiver no timeout and has no
                        failure clause, so a missing message blocks
                        the receiver for ever. The argument
                        ann_cross_host_wait_within_a_step_as_an_attack_path
                        says the transport still needs a timeout and a
                        fail-safe. In the trial implementation of
                        2026-10-29, killing a TCP receiver killed the
                        sender's process through SIGPIPE, and killing
                        a sender left the receiver running for 100
                        local steps on empty messages with nothing
                        reported (review of 2026-10-29, CC-016).

