title:                  Safe state that waiting without limit leaves outside the engine
brief:                  |
                        If a receiver waits without limit, a stalled
                        sender freezes every unit that reads from it,
                        their safety functions included, and only
                        something outside the engine can notice and
                        act; if a timeout stops the host, something
                        outside must restart it. On Patrol's Orin that
                        could be a supervisor process or a hardware
                        watchdog, a further dependency on each
                        platform that the safety case then rests on,
                        and on a core with no operating system there
                        is no supervisor process at all. A timeout
                        with a declared fail-safe bounds the time to
                        the fail-safe within the engine, by the
                        timeout plus one local step, and keeps that
                        bound in the records where checks can see it.
description:            |
                        Sources:
                        - A stalled or lost sender stops every unit
                          that reads from it,
                          and an operator or a supervisor outside the engine notices and
                          acts.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_waits_without_limit.yaml
                          at brief)
                        - A deployment that must keep running restarts
                          the host from
                          outside.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_stops_the_host.yaml
                          at brief)
                        - An execution unit may be a core with no
                          operating system, so
                          the same graph can be placed on a desktop or an embedded
                          target.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - Safety is measured by the time to reach a
                          safe state after a
                          failure, and dependency risk by the dependencies taken.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.measure and
                          entries.concern_dependency_risk.measure)
                        - Lingua Franca pairs a deadline with a
                          handler that, when the
                          deadline is missed, can raise an alarm or switch the system to
                          a safe degraded mode: a stated bound with a declared reaction
                          inside the program. (Lohstroh et al. 2021, Toward a Lingua
                          Franca for deterministic concurrent systems, section 3.7)
                        - Patrol runs on an NVIDIA Orin. (WTP,
                          2026-10-28) ASSUMPTION: a core with no
                          operating system has no supervisor process.
                          No supervisor or watchdog outside the engine
                          is named in the records, so neither its
                          detection time nor the platforms it runs on
                          are checked. Strength: moderate; it would
                          weaken if the records named a watchdog for
                          each platform with a stated detection time.

