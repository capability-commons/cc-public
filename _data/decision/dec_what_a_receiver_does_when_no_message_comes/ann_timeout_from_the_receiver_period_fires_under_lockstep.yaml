title:                  Timeout from the receiver's own period that fires under lockstep
brief:                  |
                        The timeout option derives each receiver's
                        timeout from the period of its own unit. Where
                        the sending unit is slower and the crossing
                        waits, the receiver legitimately waits longer
                        than its own period in every local step, since
                        connected units advance at the pace of the
                        slowest; in the trial a 10 ms unit took about
                        45 ms per local step, held by a 50 ms unit,
                        there through a full queue at its sender. A
                        timeout of a few of the receiver's periods
                        would then fire every step and apply its
                        fail-safe to data that was only late, while
                        too long a timeout delays the fail-safe when a
                        sender really dies. The timeout must come from
                        the sender's period plus the jitter margin WTP
                        expects may need to be generous, and so from
                        the placed graph. The host-stop option, which
                        states no derivation, needs the same.
description:            |
                        Sources:
                        - Each receiving port has a timeout derived
                          from the period of
                          its unit.
                          (_data/decision/dec_what_a_receiver_does_when_no_message_comes/opt_receiver_timeout_applies_a_declared_fail_safe.yaml
                          at brief)
                        - A receiver waits for exactly one message in
                          each local step.
                          (_data/interface_control_document/icd_dataflow_transport.yaml
                          at surface.receiver.dataflow_step.availability) Where every
                          crossing waits, connected units advance at the pace of the
                          slowest.
                          (_data/decision/dec_how_a_receiver_takes_values_from_another_unit/opt_every_crossing_waits_for_one_message.yaml
                          at brief)
                        - u1 at 10 ms ran 44 local steps in 2 s, about
                          45 ms each, held
                          by u2 at 50 ms; u1 at 2 ms ran 104 in 2 s, held by u2 at 20 ms.
                          In both the fast unit was the sender, held by a full queue, so
                          the trial measured the wait at a sender, not at a receiver.
                          (review of 2026-10-29, CC-011, and area report trial-engine,
                          TE-11)
                        - The jitter margin on an edge between units
                          may need to be
                          generous, since it depends on how fast or slow each unit runs.
                          (_data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at description)
                        - Timing and capacity checks run on the placed
                          graph.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_reading_derived_by_placement.yaml
                          at brief) Analysis that ignored placement was off by 1.5 times.
                          (Lattuada and Ferrandi 2013, Modeling pipelined applications
                          with synchronous dataflow graphs, section V)
                        - Each unit's control block declares its own
                          period.
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at surface.unit.dataflow_step.settings.period)
                        Strength: strong where connected units differ
                        in period and the crossing waits, though the
                        wait at a receiver is reasoned from the
                        records, the trial having measured it at a
                        sender; it falls away for crossings that never
                        wait and for units that share a period.

