title:                  Receiver timeout applies a declared fail-safe
brief:                  |
                        Each receiving port has a timeout, derived
                        from the period of its unit, and a declared
                        fail-safe, as a capacity has: drop the
                        message, hold the last value, or fail the
                        local step. On a timeout or a closed link the
                        engine reports a fault event and applies the
                        fail-safe, and the unit runs on.

