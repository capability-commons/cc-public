title:                  First values that next-step reading puts on every forward edge
brief:                  |
                        Under next-step reading every edge, forward
                        ones included, holds a first value for the
                        first step, so a pipeline produces L steps of
                        output computed from first values before real
                        data reaches its end. The ruled rule asks a
                        port to declare that it can supply a default,
                        which most forward ports have no reason to do,
                        so either that rule is widened to every port,
                        a new burden on node authors, or the engine
                        sends a message with a count of 0 on the first
                        step, which the convention allows but every
                        node must then handle. Same-step reading puts
                        first values only on feedback edges, where the
                        ruling already covers them, and derived
                        reading adds them only on edges that cross
                        units, inserted by the transform.
description:            |
                        Sources:
                        - Every edge then holds a first value, which
                          the rule on default values on feedback edges
                          would have to cover for forward edges too.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_every_edge_read_next_step.yaml
                          at description)
                        - Each node kind declares for each port
                          whether it can supply a default, and a
                          feedback edge needs at least one end that
                          can.
                          (_data/decision/dec_default_values_on_feedback_edges/ruling_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - Pipelining across stages adds initial tokens
                          to every channel that crosses stages, more
                          for channels that skip stages (Lattuada and
                          Ferrandi 2013, Modeling pipelined
                          applications with synchronous dataflow
                          graphs, section IV-B). Strength: moderate;
                          the count of 0 answer is cheap if every node
                          already treats an empty list as normal,
                          which the bounded-array convention
                          encourages.

