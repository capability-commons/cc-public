title:                  Reading derived by placement
brief:                  |
                        Steps are local to an execution unit. Within a
                        unit an edge is read in dependency order, with
                        one feedback edge in each loop reading the
                        previous step's value; between units an edge
                        is a bounded queue with no common step. Ruled
                        by WTP on 2026-10-28, who confirmed both
                        halves of this reading.
description:            |
                        WTP added that the jitter margin on an edge
                        between units may need to be generous, since
                        it depends on how fast or slow each unit runs,
                        and that development will refine algorithms
                        and move nodes between units until they are
                        balanced and run smoothly (WTP, 2026-10-28).

