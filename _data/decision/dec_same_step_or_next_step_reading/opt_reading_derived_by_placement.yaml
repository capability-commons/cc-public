title:                  Reading derived by the placement transform
brief:                  |
                        The placement transform decides for each Kahn
                        edge whether it is read in the same step or
                        the next, from the placement and the latency
                        requirement: edges within one execution unit
                        are read in the same step where the latency
                        requirement needs it, and edges that cross
                        execution units are read in the next. Node
                        authors state nothing, and timing and capacity
                        checks run on the placed graph.
description:            |
                        Proposed from the second round of reading
                        (2026-10-28). Analysis that ignored placement
                        was off by 1.5x in the 2013 study of pipelined
                        applications, so checks belong on the lowered
                        graph.

