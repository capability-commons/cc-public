title:                  Same-step wait that couples execution units
brief:                  |
                        When an edge that crosses execution units is
                        read in the same step, the consumer's unit
                        waits within the step for the producer's, so
                        the step must be long enough for the whole
                        chain across units, and an overrun on one unit
                        delays every unit downstream of it in that
                        step. Next-step reading on crossing edges lets
                        every unit run its share of the step in
                        parallel on messages completed at the last
                        step boundary, so an overrun on one unit does
                        not hold up the others within that step.
                        Reading derived by placement does this for
                        crossing edges and keeps same-step reading
                        only within a unit, where the wait does not
                        cross units. The literature also warns that
                        timing bounds of a distributed synchronous
                        program are hard to obtain.
description:            |
                        Sources:
                        - An edge that crosses execution units makes
                          the consumer wait within the step, so the
                          step must be long enough for the whole
                          chain.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_every_edge_read_same_step.yaml
                          at description)
                        - OC2REP distributes a Lustre program by
                          inserting waiting FIFO puts and gets from
                          placement commands, and the authors note
                          that timing bounds for the distributed
                          program are hard to get (Halbwachs et al.
                          1991, The synchronous data flow programming
                          language LUSTRE).
                        - Occasional overruns are absorbed by the
                          margin in the derived capacity; degraded
                          mode is only for steps consistently over
                          their period (WTP, 2026-10-28).
                        - Values cross execution units only through
                          transport nodes a transform inserts.
                          (_data/decision/dec_how_values_cross_execution_units/ruling_transport_nodes_inserted_by_a_transform.yaml
                          at brief) Strength: strong for graphs placed
                          on several units; it does not bear on a
                          graph placed on one unit, where the options
                          differ only in latency and parallelism.

