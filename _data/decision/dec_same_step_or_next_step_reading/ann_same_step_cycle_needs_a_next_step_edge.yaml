title:                  Same-step cycle that needs a next-step edge
brief:                  |
                        Edges read in the same step order the nodes
                        within a step, so a cycle made only of
                        same-step edges has no order in which its
                        nodes can run. Whichever option is chosen, a
                        check must find every such cycle and require
                        at least one next-step edge in it, and where
                        placement decides the reading, the check runs
                        on the placed graph. A feedback edge with a
                        default value does not settle this by itself,
                        since the default covers only the first step.
description:            |
                        Sources:
                        - LUSTRE requires that any cycle in the
                          network contain at least one pre operator,
                          and orders the code of a node by the
                          dependencies between variables (Halbwachs et
                          al. 1991, The synchronous data flow
                          programming language LUSTRE, sections A and
                          C of the compilation part).
                        - Mixed graphs need a causality check on the
                          same-step dependency graph; a feedback end
                          being able to supply a default does not by
                          itself prove every same-step cycle has a
                          defined evaluation (ChatGPT corpus analysis,
                          B-memory-and-rates.md section B3,
                          2026-10-28).

