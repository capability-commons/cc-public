title:                  Every edge read in the same step
brief:                  |
                        Every Kahn edge is read in the step it was
                        written, except a feedback edge, which is read
                        in the next. Nodes run in dependency order
                        within a step.
description:            |
                        The least latency, as in synchronous languages
                        such as Lustre. An edge that crosses execution
                        units then makes the consumer wait within the
                        step, so the step must be long enough for the
                        whole chain.

