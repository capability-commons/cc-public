title:                  Every edge read in the next step
brief:                  |
                        Every Kahn edge is read in the step after it
                        was written, so every node in a step can run
                        in parallel.
description:            |
                        The simplest rule and the most parallel, at
                        the latency cost of one step per level. Every
                        edge then holds a first value, which the rule
                        on default values on feedback edges would have
                        to cover for forward edges too.

