title:                  Next-step latency on Patrol's camera pipeline
brief:                  |
                        If every edge is read in the next step, a
                        pipeline of L levels takes L steps, each as
                        long as the slowest node. At Patrol's 30 Hz
                        camera rate a step is about 33 ms, so a
                        five-level chain from capture through
                        inference to a command takes about 165 ms,
                        against about one step if the chain runs in
                        order within the step. The literature measures
                        this cost at about five times the self-timed
                        latency on average over real applications, and
                        it is worst for unbalanced pipelines with
                        cheap capture and expensive inference. Reading
                        in the same step removes it, and deriving the
                        reading from a latency requirement removes it
                        where the requirement asks.
description:            |
                        Sources:
                        - Under implicit-deadline periodic scheduling
                          the latency of a graph is the sum of the
                          periods along the longest output path, which
                          raised latency about 5x on average over 19
                          applications; giving bottleneck producers
                          shorter deadlines brings it down to the
                          self-timed minimum at a cost in processors
                          (Bamakhrama and Stefanov 2012, Managing
                          latency in embedded streaming applications
                          under hard-real-time scheduling, sections
                          4.2 and 5.2).
                        - Patrol's Orin configuration holds a 30 Hz
                          camera rate.
                          (_data/decision/dec_how_actors_are_run/ann_actor_work_lengthens_every_kahn_step.yaml
                          at description) ASSUMPTION: a
                          perception-to-command chain on Patrol has
                          about five levels; the figure scales
                          linearly with the real count. Strength:
                          strong; the formula is exact for one message
                          per step, and only the level count is
                          assumed.

