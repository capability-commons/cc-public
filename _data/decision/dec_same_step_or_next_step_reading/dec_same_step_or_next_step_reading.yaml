title:                  Same-step or next-step reading of an edge
brief:                  |
                        Does a node read what its producer wrote in
                        the same step, or what it wrote in the step
                        before?
description:            |
                        Under one message per Kahn edge per step, a
                        pipeline of L levels in which every edge is
                        read in the next step has a latency of L
                        steps, each as long as the slowest node
                        (Bamakhrama and Stefanov 2012). A camera
                        pipeline, with cheap capture and expensive
                        inference, is the bad case. Reading in the
                        same step gives the least latency but less
                        parallelism, and splitting a pipeline across
                        execution units puts first values on forward
                        edges as well as feedback edges (2013, on
                        modeling pipelined applications with
                        synchronous dataflow).

