title:                  Time to a safe state set by the reading of each edge
brief:                  |
                        The time from a hazard being sensed to the
                        robot reaching a safe state includes every
                        step the detection waits on its way to the
                        actuator. Under next-step reading each level
                        on that path adds a whole step, so the bound
                        on the safety path grows with the depth of the
                        graph, and adding a filter node to it quietly
                        lengthens the stop. Deriving the reading from
                        the latency requirement lets the requirement
                        on the safety path force same-step edges on
                        it, and the check on the placed graph shows
                        whether the bound is met. Same-step reading
                        everywhere also keeps the path short, but
                        makes it wait on every unit it crosses.
description:            |
                        Sources:
                        - The register measures safety in part as time
                          to reach a safe state after a failure.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.measure)
                        - The placement transform reads edges in the
                          same step where the latency requirement
                          needs it, and timing checks run on the
                          placed graph.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_reading_derived_by_placement.yaml
                          at brief)
                        - End-to-end latency is a property of a path
                          from input to output, so a requirement can
                          name a path and a bound (Bamakhrama and
                          Stefanov 2012, Managing latency in embedded
                          streaming applications under hard-real-time
                          scheduling, section 4.1).
                        - Moving a controller on board changed its
                          delays, and controllers are very sensitive
                          to time delays (Ferigo et al. 2020, A
                          generic synchronous dataflow architecture to
                          rapidly prototype and deploy robot
                          controllers). Strength: moderate to strong;
                          it assumes safety paths carry latency
                          requirements in the property form, which the
                          requirement decisions make possible but do
                          not yet require.

