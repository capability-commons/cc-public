title:                  Latency analysis in closed form that needs no outside tool
brief:                  |
                        Derived reading needs cctool to compute the
                        latency of each path on the placed graph,
                        which might suggest taking in a third-party
                        dataflow analysis tool. Under one message per
                        step it does not need one: with every node
                        firing once per step the latency of a path is
                        a count of next-step edges times the step, and
                        the schedulability test is a sum of execution
                        times per unit. Same-step and next-step
                        reading everywhere need even less, a
                        topological order and nothing. The three
                        options carry about the same dependency risk,
                        provided the derived option is held to this
                        closed form; feedback loops fall outside the
                        published proofs and need their own short
                        check.
description:            |
                        Sources:
                        - With a repetition vector of all ones,
                          latency is the sum of the periods along the
                          longest output path (Bamakhrama and Stefanov
                          2012, Managing latency in embedded streaming
                          applications under hard-real-time
                          scheduling, section 4.2).
                        - The proofs of strictly periodic scheduling
                          hold for acyclic graphs with periodic input
                          (Bamakhrama and Stefanov 2011,
                          Hard-real-time scheduling of data-dependent
                          tasks in embedded streaming applications,
                          section 4).
                        - Lattuada and Ferrandi rely on an existing
                          SDF tool to analyze the placed graph
                          (Lattuada and Ferrandi 2013, Modeling
                          pipelined applications with synchronous
                          dataflow graphs). Strength: weak to
                          moderate; a real point only in that it
                          removes a dependency the derived option
                          might otherwise seem to need.

