title:                  Derived reading that shifts results when placement changes
brief:                  |
                        Under derived reading, the step in which a
                        value reaches a node depends on where the
                        transform placed its producer, so the same
                        graph regenerated for a host with a different
                        number of cores can deliver some values a step
                        later and give different outputs step by step.
                        Under next-step or same-step reading
                        everywhere, a node sees the same values
                        whatever the placement, and only timing
                        changes. Since the ruling on placement expects
                        variants generated per host, derived reading
                        makes behavior a property of the placed
                        variant: tests, recorded runs and evidence
                        must name the placed graph, and comparing a
                        run on one platform with a run on another
                        needs the reading of each edge. That is a real
                        cost to moving across platforms, and the price
                        of the latency gain.
description:            |
                        Sources:
                        - A variant can be generated with as many
                          processes on a host as it has cores, so much
                          of the dynamism goes into rewriting the
                          dataflow graph.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - Analysis that ignored the stage assignment
                          was off by about 1.5x in throughput and
                          buffer size, so checks belong on the placed
                          graph (Lattuada and Ferrandi 2013, Modeling
                          pipelined applications with synchronous
                          dataflow graphs, section V).
                        - Edges within one unit are read in the same
                          step where the latency requirement needs it,
                          and edges that cross units in the next.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_reading_derived_by_placement.yaml
                          at brief) ASSUMPTION: the lowered graph's
                          digest records the reading of each edge, so
                          a run can name it; if not, a field must be
                          added. Strength: moderate; it is a cost to
                          state and manage rather than a reason to
                          reject the option.

