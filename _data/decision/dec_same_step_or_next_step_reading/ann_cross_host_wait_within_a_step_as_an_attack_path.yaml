title:                  Cross-host wait within a step as an attack path
brief:                  |
                        Where an edge crosses hosts and is read in the
                        same step, the consumer host's step cannot
                        finish until the remote message arrives, so
                        whoever can delay or flood the link between
                        the hosts can stretch every step on the
                        consumer, the safety functions there included.
                        Next-step reading on crossing edges gives the
                        message a whole step period to arrive and lets
                        the consumer's other work proceed, which
                        narrows the attack but does not remove it: a
                        message that never arrives still blocks a
                        waiting read, so the transport still needs a
                        timeout and a fail-safe. Derived reading
                        treats crossing edges as next-step and gets
                        the same narrowing.
description:            |
                        Sources:
                        - An edge that crosses execution units makes
                          the consumer wait within the step.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_every_edge_read_same_step.yaml
                          at description)
                        - Kahn edges split by transport keep waiting,
                          ordered reads, so determinism holds whatever
                          the transport (Benveniste et al. 2008,
                          Actors without directors).
                        - A transport must send each step's message
                          whatever its count, as a transport that
                          waits to fill a packet can deadlock a loop
                          (Nadezhkin et al. 2009, Realizing FIFO
                          communication when mapping Kahn process
                          networks onto the Cell). ASSUMPTION: some
                          deployments place nodes on hosts joined by a
                          network a third party can reach; Patrol on
                          one Orin may not. Strength: moderate; it
                          applies only to edges between hosts, and the
                          timeout on the transport matters more than
                          the choice of reading.

