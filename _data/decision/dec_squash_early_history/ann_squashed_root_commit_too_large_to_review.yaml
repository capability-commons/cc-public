title:                  Root commit too large to review
brief:                  |
                        The squash replaces 44 small steps on main
                        with one root commit of 11910 lines in 78
                        files, which no person can read and judge as
                        one change.
description:            |
                        git show --stat 7dda99e: 78 files, 11910 lines
                        added. Median pre-squash commit adds 167 lines
                        (git log --shortstat pre_squash_20261014).
                        memory/cc-public-design-principles.md lines 11
                        and 27: a prior attempt failed on too much
                        material to review; propose small, reviewable
                        changes. ASSUMPTION: a later reader who runs
                        git log or git blame on main finds only
                        7dda99e.

