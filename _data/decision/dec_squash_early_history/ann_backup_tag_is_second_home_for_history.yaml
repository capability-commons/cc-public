title:                  Backup tag as a second home for history
brief:                  |
                        The squash keeps a parallel, unchecked history
                        under a tag beside main, so the early history
                        is recorded in two places.
description:            |
                        The tag holds 45 commits, 43 without items
                        (git log pre_squash_20261014). 66326b6 and
                        987cd9f were folded into the root and survive
                        as commits only under the tag, which points at
                        987cd9f (git rev-parse pre_squash_20261014).
                        The history check walks from HEAD or pushed
                        refs, not tags (src/cc_public/cli/auditing.py
                        line 92). Weak: the tag is one ref with no
                        code behind it, and nothing reads it.

