title:                  Old history on one unpushed lightweight tag
brief:                  |
                        The only route from main to the early commits
                        is a sentence naming a lightweight tag that is
                        not pushed and that nothing checks, so the
                        trace can be lost silently.
description:            |
                        git cat-file -t pre_squash_20261014 gives
                        commit; main and the tag share no commit (git
                        merge-base). The root commit item names the
                        tag only in prose, with relation: [] (git show
                        7dda99e). No file in the tree names the tag.
                        git push sends no tags by default, and
                        --follow-tags sends only annotated tags
                        (https://git-scm.com/docs/git-push). Nothing
                        is pushed (memory/MEMORY.md line 42). The git
                        bundle copied from the device for this
                        recording also holds the tag, so a second copy
                        exists today. One explicit push of the tag
                        closes most of the exposure.

