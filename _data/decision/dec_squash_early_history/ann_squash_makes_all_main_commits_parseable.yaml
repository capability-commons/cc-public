title:                  Parseable message on every commit of main
brief:                  |
                        After the squash, every commit on main holds a
                        commit item, so a reason for each change can
                        be read and checked; this was the owner's
                        reason.
description:            |
                        Owner's statements: "I want to get to a point
                        where we add commit message data items, then
                        squash all the work so far ... into one
                        commit - so then every part of the history
                        will have a parseable commit messages"
                        (2026-10-13T21:39:30Z). Chose "Squash" on the
                        decision card (2026-10-14T12:26:48Z). "You can
                        squash those three commits together to remove
                        the quirk. I don't mind losing a bit of
                        history to keep everything clean"
                        (2026-10-14T12:31:53Z). The three commits were
                        those left after the first step (782a1fd,
                        84b8af6, 63c5c45); the quirk was that the
                        root's id time was later than that of the two
                        commits on top of it. Facts: the root commit
                        7dda99e holds a commit item (git show
                        7dda99e). All 33 commits on main hold an
                        id_self line (scan of git rev-list main). Of
                        the 45 commits under the tag, only 66326b6 and
                        987cd9f hold a commit item.

