title:                  Tree unchanged by the squash
brief:                  |
                        The root commit has the same tree as the tag,
                        so the squash changes no content, and one tree
                        comparison confirms it at any size.
description:            |
                        git rev-parse 7dda99e^{tree} and
                        pre_squash_20261014^{tree} both give bb6845c1;
                        git diff pre_squash_20261014 7dda99e prints
                        nothing. The tag points at 987cd9f and reaches
                        45 commits back to bb8c338 (git log
                        pre_squash_20261014).

