title:                  Per-change reasons off the ancestry of main
brief:                  |
                        The squash replaces 45 commits, each with its
                        own reason, by one root commit with one reason
                        for the whole seed, so git log and git blame
                        on main stop at that one reason.
description:            |
                        git rev-list --count pre_squash_20261014
                        gives 45. Example reason: 44034ef says status
                        "carried no information" (git show 44034ef).
                        git merge-base --is-ancestor
                        pre_squash_20261014 main fails.
                        memory/MEMORY.md line 42: commit hashes named
                        earlier now exist only under the tag. 41 of
                        the 45 hashes are cited in work/*/packet.md of
                        this decision recording.

