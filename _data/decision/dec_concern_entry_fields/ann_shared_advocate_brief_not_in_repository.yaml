title:                  Shared advocate brief outside the repository
brief:                  |
                        The shared how-to-argue text is not an item or
                        a tracked file. A change to it shapes every
                        advocate's output, but is never a reviewed
                        commit, and no annotation can be traced to the
                        brief that produced it.
description:            |
                        The schema says how to argue is stated once,
                        elsewhere, and names no place
                        (_data/schema/sch_regentry_concern.yaml lines
                        24-25). git ls-files at 89c74d8 has no path
                        with template, prompt or advocate. A search of
                        the repository at 89c74d8 finds no "advocate",
                        and "how to argue" matches only that schema
                        line. The type register has no type for a
                        prompt or brief
                        (_data/register/reg_data_item_type.yaml). The
                        advocate briefs are files outside the
                        repository:
                        scratchpad/pd/templates/advocate.md for this
                        run, and the pilot's
                        /mnt/project-files/notes/advocate-brief.md
                        (scratchpad/pd/memory/MEMORY.md line 52), and
                        project memory lists a shared advocate prompt
                        template as a next candidate
                        (scratchpad/pd/memory/MEMORY.md line 17). The
                        advocates read this as a call to amend the
                        chosen option, not to take the other one.

