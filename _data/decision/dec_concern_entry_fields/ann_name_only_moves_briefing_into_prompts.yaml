title:                  Briefing job moved into each prompt
brief:                  |
                        A concern with only a name and definition does
                        not remove the job of briefing an advocate.
                        The job moves into each prompt, outside the
                        checked graph, where it can be done more than
                        once and in different ways.
description:            |
                        Owner's statement, 2026-10-13T17:03:19Z, asks
                        for something on the concern to build prompts
                        (will-messages.md lines 243-245). No argument
                        procedure is held in the repository data.
                        ASSUMPTION: with only a name and description,
                        each concern's questions and boundaries would
                        be written into each prompt by hand.

