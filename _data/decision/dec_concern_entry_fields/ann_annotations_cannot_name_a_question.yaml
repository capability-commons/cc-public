title:                  Questions that no annotation can point to
brief:                  |
                        Questions and measures are plain strings with
                        no id, and r_speaks_for_concern points to a
                        whole concern. No annotation can be traced to
                        the question it answers, so the new fields add
                        no trace path.
description:            |
                        _data/schema/sch_regentry_concern.yaml lines
                        44-55 and 63-72. r_speaks_for_concern runs to
                        a whole concern
                        (_data/register/reg_relation.yaml lines
                        277-298). It was added in the same commit as
                        the fields (a6996e8, pre-squash). Owner's
                        statement, 2026-10-13T16:42:36Z: he wants to
                        see "which engineering concern was under- or
                        over- represented".

