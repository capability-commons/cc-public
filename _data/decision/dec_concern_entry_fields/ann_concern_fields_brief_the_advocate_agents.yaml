title:                  Concern fields as material for advocate prompts
brief:                  |
                        The maintainer asked for something on each
                        concern to build prompts for the agents that
                        speak for it. A name and definition do not say
                        what an advocate should ask, so the chosen
                        fields give a function the first build lacked.
description:            |
                        Maintainer's statement, 2026-10-13T17:03:19Z:
                        "Do we not need something for concern that
                        will help us build prompts for the agents who
                        will be representing those concerns in the
                        argument?" Maintainer's agreement to the
                        proposal, 2026-10-13T17:03:50Z. The schema
                        says question, measure and excludes are the
                        material from which an agent that speaks for
                        the concern is briefed
                        (_data/schema/sch_regentry_concern.yaml lines
                        22-25). question and measure are required
                        (same file, lines 38-40). The advocate brief
                        reads question, measure and excludes
                        (scratchpad/pd/templates/advocate.md line 10).

