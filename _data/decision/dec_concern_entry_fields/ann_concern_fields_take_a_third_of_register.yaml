title:                  Concern fields as a quarter of the register
brief:                  |
                        Question, measure and out_of_scope take about
                        a quarter of the concern register, so each
                        change that adds concerns is larger to write
                        and to read. The first such change was 598
                        lines in one commit.
description:            |
                        The three fields took 202 of the 669 lines of
                        _data/register/reg_concern.yaml at 89c74d8,
                        and take 239 of its 902 lines at f11c1acf
                        (counted from each "question:" to the next
                        "alias:"). Commit a6996e8 (pre-squash) added
                        598 lines over six files, 375 in
                        reg_concern.yaml, for nine concerns. It is
                        dated 2026-10-13T17:18:05Z, about fifteen
                        minutes after the maintainer asked for the
                        fields. Each out_of_scope line names another
                        concern, so adding or renaming a concern can
                        mean editing other entries
                        (sch_regentry_concern.yaml lines 58-62). The
                        cost grows with the number of concerns, which
                        is small: 19 today.

