title:                  Reason for each concern held only in prose
brief:                  |
                        The chosen fields say what a concern asks, not
                        why the system holds it. No edge traces a
                        concern to the stakeholder or need that calls
                        for it. The other alternative has the same
                        gap.
description:            |
                        All 19 entries in
                        _data/register/reg_concern.yaml have edge: []
                        (for example lines 84 and 521). The reason is
                        given in the note field, for example a
                        standard for concern_traceability (lines
                        500-506); concern_simplicity's note cites no
                        standard. A concern is defined as something a
                        stakeholder cares about
                        (_data/register/reg_concept.yaml lines
                        318-336), but there is no stakeholder type in
                        _data/register/reg_data_item_type.yaml.

