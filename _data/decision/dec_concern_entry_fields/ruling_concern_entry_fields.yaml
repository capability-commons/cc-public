title:                  Questions, measures and exclusions on each concern
brief:                  |
                        Each concern states the questions it asks and
                        how it is measured, and may state what it
                        leaves to other concerns, so that an agent can
                        be briefed to speak for it. How to argue is
                        the same for every concern and is not repeated
                        on each entry. A name and definition alone
                        would leave each prompt to restate this by
                        hand, outside the checked graph. Ruled by WTP
                        on 2026-10-22.

