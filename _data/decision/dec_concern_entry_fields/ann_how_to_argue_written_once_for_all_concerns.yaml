title:                  How to argue written once for all concerns
brief:                  |
                        How to argue is one shared text, not a copy on
                        each concern, so writing and changing it stays
                        one job however many concerns there are. The
                        fields reuse the existing register entry
                        pattern and add no new kind of mechanism.
description:            |
                        The schema says the fields say what to argue
                        for, and how to argue is stated once, for
                        every concern, elsewhere
                        (_data/schema/sch_regentry_concern.yaml lines
                        22-25). The schema composes sch_register_entry
                        with allOf, as the other sch_regentry_*
                        schemas do (same file, lines 74-75). The
                        register holds 16 concerns
                        (_data/register/reg_concern.yaml). The shared
                        text in use is one file of 3359 bytes
                        (scratchpad/pd/templates/advocate.md).

