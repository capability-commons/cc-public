title:                  Question and description covering the same ground
brief:                  |
                        A concern's question field and its description
                        can say the same thing, and the schema gives
                        no rule that separates them, so one job can be
                        done twice in one entry.
description:            |
                        concern_simplicity's description covers
                        "whether anything is done twice"
                        (_data/register/reg_concern.yaml at
                        entries.concern_simplicity.description), and
                        its question asks "Does it do anything that
                        another mechanism already does?" (line 430).
                        description is required
                        (_data/schema/sch_register_entry.yaml at
                        required). question has no rule on how it
                        differs (sch_regentry_concern.yaml at
                        properties.question). ASSUMPTION: whether
                        WTP's wish to keep prose that restates
                        structure covers this case is not known.

