title:                  No check on the excludes field
brief:                  |
                        Beyond schema validation of their shape, no
                        code reads question, measure or excludes, so
                        an advocate that argues a point its concern
                        excludes is not caught.
description:            |
                        A search of src at 89c74d8 finds no
                        "excludes"; "measure" appears only in test
                        files under _test (2026-10-15). JSON Schema
                        validation checks that question and measure
                        are present and are lists of strings
                        (src/cc_public/check/schema.py). The checker
                        requires a practical annotation to speak for a
                        concern but has no rule on excludes
                        (src/cc_public/check/check.lp lines 566-576).

