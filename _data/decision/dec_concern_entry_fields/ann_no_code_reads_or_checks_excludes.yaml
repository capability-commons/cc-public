title:                  No check on the out_of_scope field
brief:                  |
                        Beyond schema validation of their shape, no
                        code reads question, measure or out_of_scope,
                        so an advocate that argues a point its concern
                        leaves to another is not caught.
description:            |
                        A search of src at f11c1acf finds no
                        "out_of_scope". "excludes" appears only for a
                        relation between a relation constraint and a
                        role (src/cctool/check/check.lp within
                        satisfies), and "measure" and "question"
                        appear as field names only in test files under
                        _test. JSON Schema validation checks that
                        question and measure are present and that each
                        field is a list of strings
                        (src/cctool/check/schema.py;
                        _data/schema/sch_regentry_concern.yaml at
                        required, properties and $defs). The checker
                        requires a practical annotation to speak for a
                        concern (argument_without_concern,
                        src/cctool/check/check.lp within
                        argument_without_concern) but has no rule on
                        out_of_scope.

