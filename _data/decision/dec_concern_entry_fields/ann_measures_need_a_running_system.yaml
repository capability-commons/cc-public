title:                  Measures not available at decision time
brief:                  |
                        Many measures in the register count things
                        that exist only after a system runs or is
                        released, so they cannot judge an alternative
                        when it is chosen. The schema has no field for
                        an estimate made before the decision.
description:            |
                        The measure field says what counts as evidence
                        for or against a design
                        (_data/schema/sch_regentry_concern.yaml lines
                        52-55). Examples in
                        _data/register/reg_concern.yaml: defects found
                        after release (line 76); availability and mean
                        time between failures (lines 113-114);
                        response time, throughput and peak memory
                        (lines 189-191).
                        ann_our_graph_is_too_small_to_measure lines
                        12-15 states speed at scale could not decide
                        an earlier choice. This argues for amending
                        the chosen option, not for the other one,
                        which has no measures.

