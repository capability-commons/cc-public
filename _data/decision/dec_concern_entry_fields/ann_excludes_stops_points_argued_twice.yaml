title:                  Exclusions that keep a point from being argued twice
brief:                  |
                        Each concern states what it leaves to others,
                        so advocates are less likely to make the same
                        point twice. That leaves less model output to
                        produce, merge and review.
description:            |
                        The recorded reason in
                        _data/schema/sch_regentry_concern.yaml lines
                        30-35 says that where two concerns cover the
                        same ground, one point is argued twice. That
                        text was written by an assistant, not by Will.
                        The advocate brief tells each advocate to
                        leave out what its excludes line gives to
                        another concern
                        (scratchpad/pd/templates/advocate.md line 10).
                        Project memory records, from Will's earlier
                        sessions, that a prior attempt failed because
                        the model generated too much material to
                        review
                        (scratchpad/pd/memory/cc-public-design-principles.md
                        line 11). Advocate output for this recording
                        run was 188 files and 14,632 lines before
                        merging, counted on 2026-10-15 while the run
                        was still going. ASSUMPTION: the saving is not
                        measured; no run with name-only briefs exists
                        to compare against.

