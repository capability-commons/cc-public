title:                  Edge in an item of the test function
brief:                  |
                        A test that verifies a requirement or an
                        interface member gets a function item in its
                        docstring, written only for such tests, with a
                        verifies edge to each thing it verifies, by
                        the same mechanism by which code names the
                        member it realizes. A test case item that
                        names the test, and a pytest marker read by
                        the extractor, are rejected. Ruled by WTP on
                        2026-10-28, by writing "Uphold
                        opt_verifies_edge_in_a_test_function_item".

