title:                  Stable item at the test end of the trace
brief:                  |
                        A function item for the test gives the
                        verifies edge a source with a guid, running
                        the same way as relation_realizes. A marker
                        makes the edge from an id derived from the
                        test's name, with no guid, so a rename breaks
                        the trace from the requirement to its test.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (marker id derived, no item).
                        - A reference resolves by its guid where its
                          id does not, and a rename that changed the
                          guid would break every reference at once
                          [_data/requirement/rqt_rename_keeps_guid.yaml
                          at rationale].
                        - A definition item carries a guid_self in its
                          docstring, as the function items of check.py
                          do [src/cctool/check/check.py at function
                          review, docstring].
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (relation_realizes ruling).
                        - The earlier annotation on one direction for
                          every trace argues that every trace from an
                          implementation runs from its item to the
                          item of the specification, so a trace query
                          needs no special case
                          [_data/decision/dec_interface_implementation_link/ann_one_direction_for_every_trace.yaml
                          at brief].
                        - The test case item option leaves the test
                          function with nothing, so the case names a
                          function that has no item
                          [_data/decision/dec_how_a_test_names_what_it_verifies/opt_test_case_item_names_the_test.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (items only when needed). Strength: Strong.
                          It holds at ten times the size, since
                          renames grow with the number of tests. The
                          test case option keeps a guid on the case,
                          but its pointer to the function has nothing
                          stable to land on unless the function gets
                          an item anyway.

