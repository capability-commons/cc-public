title:                  Trace written in the test runner's syntax
brief:                  |
                        A pytest marker writes each verifies edge in
                        the decorator syntax of one third-party test
                        runner. The other two options hold the edge in
                        the item format of the repository, which no
                        outside project controls.
description:            |
                        Sources:
                        - With this option a test carries a marker
                          such as pytest.mark.verifies with the ids it
                          verifies
                          [_data/decision/dec_how_a_test_names_what_it_verifies/opt_verifies_marker_read_by_the_extractor.yaml
                          at brief].
                        - pytest is a development dependency of
                          cc-public, taken from conda-forge
                          [pyproject.toml at tool.pixi.dependencies].
                        - Also rests on a source stated once in
                          ann_verifies_edge_adds_no_new_link_mechanism
                          (strict_markers registration).
                        - WTP ruled that the check tests are pytest
                          tests with exact expected failures
                          [_data/decision/dec_test_style/ruling_test_style.yaml
                          at title]. Strength: Weak. The extractor
                          reads the decorator from the syntax tree, so
                          the check itself does not import pytest, and
                          pytest is already a dependency that WTP
                          ruled for. The risk is only that a change of
                          test runner would also mean rewriting every
                          verifies edge. It does not grow with size
                          beyond the count of tests to rewrite.

