title:                  Case naming a test function with no item
brief:                  |
                        When the test function carries nothing, the
                        case must name it by a path or a node name,
                        which moves whenever the function is moved,
                        renamed or divided. September found exactly
                        this decay in its evidence rows, and found it
                        only when one test was divided.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_test_item_gives_the_trace_a_stable_end
                          (the test function carries nothing).
                        - A function or class item is keyed by its
                          file path and definition names in the form
                          pytest uses [src/cctool/graph/extract.py at
                          the comment above DELIM_DEFINITION].
                        - In September, a test function that was
                          divided or deleted left a row naming an item
                          the tree no longer held, and dividing one
                          test found this when nothing else had
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at consequence].
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (items only when needed).
                        - ASSUMPTION: a name for a function without an
                          item carries no guid, so nothing can resolve
                          it after a move. Strength: moderate. It
                          holds at ten times the size, since moves and
                          divisions of tests grow with the suite.

