title:                  Claim of a test in the same diff as its code
brief:                  |
                        When the claim of what a test verifies sits on
                        the test, a change to the test and to its
                        claim shows in one hunk that a reviewer reads
                        together. A test case item in _data puts the
                        claim in another file, about fifty lines long.
                        The marker is the smallest, and a function
                        item is larger but in the same place.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_test_item_gives_the_trace_a_stable_end
                          (the test function carries nothing).
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (a test case of 46 to 50 lines).
                        - A function item with one relation_realizes
                          edge runs from the opening docstring marker
                          to its closing marker in about 25 lines, of
                          which the edge is four
                          [src/cctool/check/check.py at function
                          check, docstring].
                        - Also rests on a source stated once in
                          ann_marker_puts_the_trace_in_pytest_syntax
                          (the marker decorator on the test).
                        - The reviewability measure is the size of a
                          change in lines
                          [_data/register/reg_concern.yaml at
                          entries.concern_reviewability.measure]. Strength:
                          Moderate. Both on-test options keep claim
                          and code together, and the marker costs
                          fewest lines. The edge in a function item
                          costs more lines but most are fixed header
                          fields a reviewer reads once. At ten times
                          the size the separate case item doubles the
                          files a reviewer opens per test change.

