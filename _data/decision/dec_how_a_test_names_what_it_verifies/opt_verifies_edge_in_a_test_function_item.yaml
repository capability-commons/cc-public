title:                  Edge in an item of the test function
brief:                  |
                        A test that verifies something gets a function
                        item in its docstring, written only for such
                        tests, with a verifies edge to each
                        requirement or interface member it verifies.
                        This is the same mechanism by which code names
                        the member it realizes.

