title:                  One mechanism for code and test links
brief:                  |
                        An edge in an item of the test function is the
                        mechanism code already uses to name the member
                        it realizes, so it adds no new way to make an
                        edge. A pytest marker adds a second way, read
                        from decorators. A test case item for every
                        verification adds an item type that restates
                        what the test function holds.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (extractor reads docstring items).
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (relation_realizes ruling and items only
                          when needed).
                        - The rules find a realizing function through
                          the same edges every item has
                          [src/cctool/check/check.lp at predicate
                          realized_function].
                        - The dev configuration refuses a pytest
                          marker that nobody registered, so a verifies
                          marker has to be registered as well as read
                          [pyproject.toml at tool.pytest.ini_options,
                          strict_markers and markers].
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (a test case of 46 to 50 lines). Strength:
                          strong. The edge option adds no mechanism.
                          The marker adds a decorator reader and a
                          derived id scheme for tests. The test case
                          item adds a type for every link. These
                          counts do not change at ten times the size.

