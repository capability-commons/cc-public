title:                  Extraction cost of a test link
brief:                  |
                        The edge and marker options both read the
                        syntax tree the extractor already parses, so
                        neither adds measurable work. A test case item
                        for every verification adds a file of about
                        fifty lines for the extractor to read and
                        check for each link.
description:            |
                        Sources:
                        - The extractor already parses every python
                          module with the ast module to find the items
                          in docstrings [src/cctool/graph/extract.py
                          at functions definitions and _module].
                        - The extractor caches the documents it has
                          read, keyed by path and file digest
                          [src/cctool/graph/extract.py at MAP_READ and
                          its comment].
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (a test case of 46 to 50 lines).
                        - The check store keeps layout and schema
                          verdicts per file text, so a new file is
                          checked once and then reused while unchanged
                          [src/cctool/check/store.py at module
                          docstring].
                        - ASSUMPTION: the time to extract and check an
                          item grows roughly with the number of items
                          and their lines. Strength: weak. Today there
                          are 4 requirements and 6 interface control
                          documents, so the difference is small. At
                          ten times the size, a case per link adds
                          hundreds of files to every cold check, while
                          the edge and the marker add a few lines to
                          files already read.

