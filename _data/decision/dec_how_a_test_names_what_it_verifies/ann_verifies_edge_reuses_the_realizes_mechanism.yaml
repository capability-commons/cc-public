title:                  One mechanism for both kinds of trace
brief:                  |
                        An edge in the item of the test function uses
                        the same docstring item and edge machinery by
                        which code names the member it realizes. A
                        rename or split of the test changes the edge
                        in the same edit, and no second file or second
                        extraction path needs keeping.
description:            |
                        Sources:
                        - The extractor already reads an item from the
                          docstring of any class or function that
                          holds one, with no separate step for tests
                          [src/cctool/graph/extract.py at function
                          definitions].
                        - Code names the interface member it realizes
                          by relation_realizes in the docstring item
                          of its function, as WTP ruled on 2026-10-19
                          [_data/decision/dec_interface_implementation_link/ruling_interface_implementation_link.yaml
                          at brief, src/cctool/check/check.py at
                          function check].
                        - With the edge in the docstring of the code,
                          a rename or split of the code changes the
                          edge in the same edit
                          [_data/decision/dec_interface_implementation_link/ann_edge_changes_with_the_code.yaml
                          at brief].
                        - A function gets an item only when something
                          must point at it
                          [_data/decision/dec_python_definition_items/ruling_python_definition_items.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_claim_of_a_test_beside_its_assertions (a
                          function item of about 25 lines).
                        - September measured a test case item at 46 to
                          50 lines, and kept cases as data in a folder
                          of their own, apart from the test
                          [origin/main:ddr/ddr_test_case_adoption.yaml
                          at context and at consequence].
                        - The extractor reads no decorator today, so a
                          marker needs a new extraction path and an id
                          derived for a function that has no item
                          [src/cctool/graph/extract.py at function
                          definitions,
                          _data/decision/dec_how_a_test_names_what_it_verifies/opt_verifies_marker_read_by_the_extractor.yaml
                          at brief]. Strength: Strong against a test
                          case item for every test, which puts each
                          edge in a second file that must change when
                          the test is renamed. Moderate against the
                          marker, which is one line per test instead
                          of about 25, but adds a second way to make
                          an edge and an id that names no item. At ten
                          times the tests the marker is cheaper in
                          lines, and the function item is cheaper in
                          mechanisms.

