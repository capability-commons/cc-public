title:                  Link that survives a rename
brief:                  |
                        An edge in a docstring item carries the guid
                        of its target and is rewritten by a rename, so
                        the link survives the renames the tooling
                        already makes. A marker string in a decorator
                        is neither a document nor a logic program, so
                        a rename leaves it naming an id that no longer
                        exists.
description:            |
                        Sources:
                        - A rename rewrites the id in the item's own
                          document, in every reference and mention of
                          it in a document, and in every quoted string
                          of a logic program [src/cctool/edit/edit.py
                          at function _rename_one, docstring].
                        - The same docstring notes that rules left
                          naming an old id match nothing, and so pass
                          without a word [src/cctool/edit/edit.py at
                          function _rename_one, docstring].
                        - Also rests on a source stated once in
                          ann_test_item_gives_the_trace_a_stable_end
                          (references resolve by guid).
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (relation_realizes in the function item).
                        - Also rests on a source stated once in
                          ann_verifies_edge_reuses_the_realizes_mechanism
                          (marker with no docstring item).
                        - ASSUMPTION: the rename edit does not rewrite
                          string arguments of python decorators, since
                          its docstring names only documents and logic
                          programs. Strength: strong, and stronger at
                          ten times the size, since more verifies
                          edges mean more of them broken by each
                          rename. The marker option could be repaired
                          by teaching rename to rewrite decorators and
                          by a check of unresolved ids, but that is
                          new code to keep right.

