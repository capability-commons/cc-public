title:                  How a test names what it verifies
brief:                  |
                        How does a test say which requirement or
                        interface member it verifies, so that the
                        graph holds the link as an edge?
description:            |
                        Requirements say how they are verified in the
                        fields verification_method and
                        verification_approach, and nothing names the
                        test. Code names the interface member it
                        realizes by an edge in the item of its
                        function, an item written only when needed.
                        Tests are pytest functions in _test folders,
                        and each test module already has a module
                        item.

