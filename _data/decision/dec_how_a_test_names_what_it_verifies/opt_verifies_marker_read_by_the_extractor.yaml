title:                  pytest marker read by the extractor
brief:                  |
                        A test carries a marker such as
                        pytest.mark.verifies with the ids it verifies.
                        The extractor reads the decorator from the
                        syntax tree and makes a verifies edge from an
                        id derived for the test function, with no
                        docstring item.

