title:                  Model chosen per deployment
brief:                  |
                        Each deployment names the model that serves
                        it, behind one narrow interface, since
                        partners set different terms: DTU a European
                        hosted provider, sovereign peers a hosted
                        open-weights model of their own, and internal
                        development a maker's API. No fixed choice
                        meets every deployment. The other options are
                        not rejected; each is a choice a deployment
                        may make. Ruled by William Payne on
                        2026-10-23.

