title:                  Dependency added to each turn by a hosted model
brief:                  |
                        The model is called on every turn, so a hosted
                        model makes every turn depend on a provider's
                        service. A local model removes that
                        dependency, though the bot still needs the
                        network to reach Signal, and one host serves a
                        limited number of turns.
description:            |
                        The checklist option shows the LLM a checklist
                        on every turn, so the model is called on every
                        turn (opt_checklist_led_conversation, brief).
                        The hosted options call a model through its
                        maker's API or through a cloud platform
                        account (opt_hosted_api_zero_retention, brief,
                        and opt_cloud_platform_model, brief). The
                        local option runs an open-weights model on the
                        host (opt_local_open_weights_model, brief).
                        signal-cli needs network access to the Signal
                        service (ASSUMPTION: the signal-cli 0.14.1
                        README refers to the Signal server but does
                        not say this outright). Hosted model services
                        have outages and rate limits from time to time
                        (ASSUMPTION). Holds at ten times the size: no,
                        because a single host serves a bounded number
                        of concurrent conversations (ASSUMPTION), so
                        at that scale a hosted model may be the more
                        available choice.

