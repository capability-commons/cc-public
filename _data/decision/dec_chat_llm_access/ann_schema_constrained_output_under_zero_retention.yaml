title:                  Replies held to the schema under zero retention
brief:                  |
                        The API of a model maker can hold each reply
                        to the JSON Schema of the item type, and under
                        zero data retention it stores neither prompts
                        nor replies. A draft then matches its schema
                        by construction, though the most capable
                        models of that maker are not offered under
                        zero retention.
description:            |
                        Each type of item has a JSON Schema
                        (README.md#what-is-here), and a bot elicits
                        the fields of one type using its schema
                        (owner's statement). Anthropic lists
                        structured outputs, which also cover strict
                        tool use, as eligible for zero data retention
                        with a qualification: prompts and outputs are
                        not stored, and only the JSON schema is
                        cached, for up to 24 hours since last use
                        (https://platform.claude.com/docs/en/manage-claude/api-and-data-retention.md,
                        feature eligibility table, fetched
                        2026-10-23). The schemas of the types in this
                        repository are public files (_data/schema), so
                        a cached schema holds no personal data. The
                        same page says that four Covered Models
                        require 30-day retention and are not available
                        under zero data retention unless Anthropic
                        expressly authorizes it (section
                        Model-specific data retention requirements).
                        ASSUMPTION: local runtimes for open-weights
                        models can also hold output to a JSON schema,
                        with a less capable model behind it. Holds at
                        ten times the size: yes, because the
                        constraint applies to each reply whatever the
                        number of conversations.

