title:                  Different models for different partners
brief:                  |
                        Each partner in the federation sets its own
                        terms for where a conversation may go, so no
                        one fixed choice of model meets every
                        deployment. Naming the model per deployment
                        lets each meet its own.
description:            |
                        DTU wants a European hosted LLM provider for
                        anything to do with its operations; for
                        deployments Axair controls the choice varies
                        case by case; some customers will not let
                        their data leave the country of origin, so
                        their sovereign federated peers need a hosted
                        open-weights model of their own; and internal
                        development, without the same security risks,
                        may use a maker's API such as Anthropic's or
                        OpenAI's (owner's statement). A local
                        open-weights model could meet them all, but
                        the project does not want to carry that work
                        yet (owner's statement). Each deployment
                        already stays inside its data owner's
                        infrastructure
                        (rqt_chat_deployment_stays_with_data_owner).
                        Holds at ten times the size: yes, since more
                        partners bring more sets of terms.

