title:                  Model chosen per deployment
brief:                  |
                        The core reaches the model through one narrow
                        interface, and each deployment names the model
                        that serves it, as its data owner requires. A
                        DTU deployment may use a European hosted
                        provider, a sovereign peer its own hosted
                        open-weights model, and internal development a
                        maker's API.

