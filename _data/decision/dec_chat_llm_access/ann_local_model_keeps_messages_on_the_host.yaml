title:                  Messages that never leave the host
brief:                  |
                        A local open-weights model is the only option
                        under which no message, and so no personal
                        data, reaches a third party. Zero retention
                        from a maker is an arrangement to be
                        requested, not a default.
description:            |
                        The local option runs an open-weights model on
                        the host so that no message leaves it
                        [_data/decision/dec_chat_llm_access/opt_local_open_weights_model.yaml,
                        brief]. Anthropic says that to request zero
                        data retention an organization contacts its
                        sales team, and that it is enabled per
                        organization
                        [https://platform.claude.com/docs/en/manage-claude/api-and-data-retention.md,
                        section Zero data retention (ZDR), fetched
                        2026-10-23]. The same page says that outside
                        that arrangement conversation content is not
                        retained by default, except for four Covered
                        Models, which require 30-day retention and are
                        not offered under zero data retention [same
                        page, section How Anthropic approaches data
                        retention, and section Model-specific data
                        retention requirements]. It also says that on
                        Amazon Bedrock and on Claude Models on Google
                        Cloud (Google managed) the cloud provider is
                        the data processor, while on Claude Platform
                        on AWS and on Claude Models on Google Cloud
                        (Anthropic managed) Anthropic is [same page,
                        opening paragraph]. Under every hosted route
                        each message reaches a processor outside the
                        host. A likely first instance is member skill
                        profiles, which hold personal data [owner's
                        statement]. Holds at ten times the size: yes,
                        because every extra conversation sent to a
                        hosted model is one more transfer of personal
                        data, while a local model sends none.

