title:                  Model quality sets the number of turns
brief:                  |
                        The contributor's time is mostly turns spent
                        being understood. A small local model that
                        misreads answers or asks again costs them more
                        turns than a frontier hosted model.
description:            |
                        The local option runs an open-weights model on
                        the host
                        (_data/decision/dec_chat_llm_access/opt_local_open_weights_model.yaml,
                        brief). The two hosted options call a hosted
                        model through its maker or a cloud platform
                        (_data/decision/dec_chat_llm_access/opt_hosted_api_zero_retention.yaml,
                        brief)
                        (_data/decision/dec_chat_llm_access/opt_cloud_platform_model.yaml,
                        brief). The conversation is led by an LLM
                        choosing what to ask next (owner's statement).
                        ASSUMPTION: an open-weights model small enough
                        for a workstation follows a checklist and
                        extracts fields less reliably than a frontier
                        hosted model. This is not measured here. Holds
                        at ten times the size: yes, because the cost
                        is per conversation and multiplies with the
                        number of conversations.

