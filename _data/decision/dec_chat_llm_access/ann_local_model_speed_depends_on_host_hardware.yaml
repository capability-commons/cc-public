title:                  Local model speed set by the host
brief:                  |
                        A local open-weights model makes reply time
                        and memory depend on the host that runs the
                        bot. With a checklist and history in every
                        prompt, a host without a suitable GPU may
                        answer much more slowly than a hosted model.
description:            |
                        The local option runs an open-weights model on
                        the host so that no message leaves it
                        (_data/decision/dec_chat_llm_access/opt_local_open_weights_model.yaml).
                        The development VM has no network access, and
                        the maintainer's workstation, atlas, holds the
                        repositories (context.md, facts). The
                        checklist option sends the checklist on every
                        turn
                        (_data/decision/dec_chat_conversation_control/opt_checklist_led_conversation.yaml).
                        The hardware of atlas is not recorded in the
                        snapshot or in context.md. ASSUMPTION: a
                        capable open-weights model needs many
                        gigabytes of memory, and on CPU alone it
                        processes long prompts and generates replies
                        far more slowly than a hosted model.
                        ASSUMPTION: a hosted model adds a network
                        round trip, which is small beside generation
                        time. Holds at ten times the size: no for the
                        local option under ten times the
                        conversations, because one host serves them in
                        turn, while a hosted model scales out.

