title:                  Detection of breaking commits already paid for
brief:                  |
                        The commit check already detects renames and
                        removals, so failing a breaking commit on dev,
                        or warning about it, reuses work the history
                        check already does and adds almost nothing to
                        its time.
description:            |
                        Sources:
                        - The commit check already detects renames and
                          removals (_sources/context.md line 34).
                        - The history check is the check of record and
                          runs at pre-push (AGENTS.md lines 93-97;
                          README.md lines 103-108). Strength: weak,
                          because it shows only that these two options
                          cost nothing extra, not that either is
                          faster than the other.

