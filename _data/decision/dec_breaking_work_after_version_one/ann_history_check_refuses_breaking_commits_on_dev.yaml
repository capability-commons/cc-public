title:                  Refusal of breaking commits on the release line
brief:                  |
                        The history check already detects renames and
                        removals, so refusing a push that moves the
                        release line over a breaking commit reuses
                        detection that exists, and it lets a reviewer
                        know mechanically that every commit on that
                        line is non-breaking. A warning only does the
                        same job at two points and lets a breaking
                        commit land, after which the release refuses
                        any minor or patch bump and an urgent fix is
                        blocked until the commit is reverted.
description:            |
                        Sources:
                        - Every commit carries a commit item and the
                          commit check already detects renames and
                          removals (_sources/context.md line 34).
                        - The history check is the check of record,
                          checks each commit from what it records, and
                          runs at pre-push (README.md lines 103-108;
                          AGENTS.md lines 93-97).
                        - Under the warned option the release refuses
                          a minor or patch bump that holds a breaking
                          commit
                          (_data/decision/dec_breaking_work_after_version_one/opt_breaking_work_warned_only.yaml,
                          brief).
                        - A revert is not gated and its message is
                          first checked at push (README.md lines
                          89-92).
                        - The owner says the graph can mechanically
                          determine the right SemVer bump on a release
                          (owner's statement, 2026-10-22;
                          _sources/context.md line 17). Strength:
                          strong for reliability, since the failure it
                          prevents falls when a fix is most urgent;
                          moderate for review and simplicity, since
                          next is itself a second line, so the count
                          is one rule plus one branch against two
                          rules.

