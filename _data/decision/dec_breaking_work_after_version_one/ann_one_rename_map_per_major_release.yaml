title:                  One rename map per major release
brief:                  |
                        The breaking changes the maintainer expects
                        are renames such as prefix changes. Collecting
                        them on next and landing them together gives
                        one rename map that traces every renamed id of
                        a major release in one place.
description:            |
                        Sources:
                        - Owner's statement (2026-10-22T16:23): "Once
                          we've released version 1.0 I'd expect to
                          bundle together any breaking changes - e.g.
                          prefix changes - into one release and make
                          it a major version bump."
                          (_sources/context.md line 16).
                        - The release component derives rename maps
                          for each release
                          (_data/logical_component/lco_release.yaml
                          lines 13-16).
                        - A renamed register entry keeps its old id in
                          alias, and the commit item must name what it
                          renames (AGENTS.md lines 98-100). Strength:
                          weak, because the warned-only option also
                          confines breaks to major releases and so
                          also yields one map per major release.

