title:                  Break recorded apart from where it takes effect
brief:                  |
                        A break behind a switch lands in one commit
                        and takes effect in another, whose item says
                        only that a switch changed. The computed bump
                        and the derived notes would then trace the
                        break to the wrong commit or miss it, while
                        waiting on next or warning on dev keeps the
                        commit that makes the break as the one that
                        records it.
description:            |
                        Sources:
                        - The option lands breaking changes on dev
                          "behind switches that stay off until a major
                          release"
                          (_data/decision/dec_breaking_work_after_version_one/opt_breaking_work_behind_flags.yaml
                          lines 12-14).
                        - The commit checks find removals and renames
                          from the graph before and after each commit
                          (src/cctool/commit/change.lp lines 161
                          and 218; AGENTS.md lines 87-89).
                        - The computed bump reads the commit items
                          since the last release
                          (_data/decision/dec_version_scheme/opt_semver_computed.yaml
                          lines 11-15).
                        - Assumption: a switch held in data that
                          renames or removes ids on the turn of a flag
                          would not show as a rename or removal in the
                          commit that turns it. Strength: moderate,
                          because it rests on an assumption about how
                          a switch would be built for data items,
                          which no option spells out.

