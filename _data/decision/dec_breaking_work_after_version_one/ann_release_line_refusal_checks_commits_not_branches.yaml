title:                  Refusal on the release line that the history check cannot yet make
brief:                  |
                        The history check judges commits, not
                        branches. A commit does not record the branch
                        it is on, and at push the check reads only the
                        commits that no branch of the remote already
                        has. A breaking commit first pushed on next or
                        on a topic branch is then not checked again
                        when the release line moves over it, and the
                        landing of next at a major release must be let
                        through. Refusing breaking work on the release
                        line needs a new check over the range a push
                        moves that line, with one exception at each
                        major release, while a warning and a computed
                        bump need neither.
description:            |
                        Sources:
                        - The check of record judges each commit from
                          what it records, however git made it
                          (_data/decision/dec_enforcement_approach/ruling_enforcement_approach.yaml
                          lines 13-15). Its per-commit check reads the
                          message and the change against the first
                          parent (src/cctool/commit/history.py
                          lines 15-26), and nothing there names a
                          branch.
                        - At pre-push it takes the commits a push
                          would send, and a commit any ref of the
                          remote already has is not sent; it reads the
                          local ref and commit of each line git gives
                          it, not the remote ref
                          (src/cctool/commit/history.py lines
                          81-101).
                        - Topic branches land on dev by fast-forward
                          merge (AGENTS.md lines 40-48), so a commit
                          already pushed elsewhere reaches the release
                          line with no new commit.
                        - A rule that keeps needing exceptions is
                          fixed in the rule (AGENTS.md lines 96-97).
                        - The bump is computed from the commit items
                          since the last release
                          (_data/decision/dec_version_scheme/ruling_semver_computed.yaml
                          lines 13-14; opt_semver_computed.yaml lines
                          12-15), so a breaking commit in that range
                          makes the bump major under either option.
                        - Assumption: next would be pushed to the
                          remote between major releases, as the owner
                          works from several machines and sessions.
                          Strength: moderate. The pre-push lines give
                          the remote ref and its old commit, so the
                          range check is small to write, and the
                          exception comes once per major release; it
                          changes how the option is built, not whether
                          it meets the owner's aim. Drafted by Claude
                          in the review of 2026-10-23.

