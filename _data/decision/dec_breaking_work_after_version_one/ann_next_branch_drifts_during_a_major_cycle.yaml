title:                  Drift of a branch that waits for a major release
brief:                  |
                        Breaking work held on next for a whole major
                        cycle drifts from dev, and the merge at the
                        major release can be large and conflict-heavy.
                        Unless the work on next is rebased on dev
                        often, the major release becomes the riskiest
                        one.
description:            |
                        Sources:
                        - Under this option breaking work collects on
                          next and lands together in a major release
                          (_data/decision/dec_breaking_work_after_version_one/opt_breaking_work_waits_on_next.yaml,
                          brief).
                        - A rebased branch must pass the history check
                          on each rebased commit before it lands
                          (AGENTS.md lines 40-44).
                        - Assumption: majors will be months apart, so
                          next will diverge noticeably. Strength:
                          weak; it bears on how the option is run, not
                          whether to choose it.

