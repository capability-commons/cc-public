title:                  Two live code paths under switches
brief:                  |
                        A breaking change behind a switch carries the
                        old behavior, the new behavior and the switch
                        logic in one diff, and needs a second change
                        later to remove the switch. Both paths stay in
                        the tree until the major release, one of them
                        barely exercised, and testing both states
                        grows the test stage of every gate.
description:            |
                        Sources:
                        - The option lands breaking changes on dev
                          behind switches that stay off until a major
                          release
                          (_data/decision/dec_breaking_work_after_version_one/opt_breaking_work_behind_flags.yaml,
                          brief).
                        - Feature toggles "require you to introduce
                          new abstractions or conditional logic into
                          your code", add a testing burden, and are
                          inventory with a carrying cost to be removed
                          when no longer needed
                          (https://martinfowler.com/articles/feature-toggles.html).
                        - The tests run in every gate of a code commit
                          (README.md#getting-started); a code commit's
                          gate takes about 78 s on atlas
                          (_sources/context.md line 31).
                        - Assumption: each switch needs tests in both
                          of its states. Strength: strong for review,
                          since the extra code is inherent to the
                          mechanism; weak for run time, since a switch
                          costs little to evaluate and most of the
                          cost falls on the gate.

