title:                  Breaking work waiting on next
brief:                  |
                        After 1.0, a push that moves the release line
                        over a breaking commit fails the history
                        check, except the push that lands next in a
                        major release; breaking work collects on next
                        until then.
description:            |
                        Source: maintainer's comment
                        (2026-10-22T16:23:49Z), "Once we've released
                        version 1.0 I'd expect to bundle together any
                        breaking changes - e.g. prefix changes - into
                        one release and make it a major version bump."

