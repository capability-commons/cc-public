title:                  Bundled breaking work as one large step
brief:                  |
                        Collecting breaking work on next and landing
                        it together makes the major release one large
                        step for anyone who reviews or absorbs it. A
                        warning on dev lets each breaking commit be
                        read where it lands, one at a time, with the
                        release refusing a wrong bump.
description:            |
                        Sources:
                        - The option has breaking work collect on next
                          and land together in a major release
                          (_data/decision/dec_breaking_work_after_version_one/opt_breaking_work_waits_on_next.yaml at brief).
                        - The warned option has the release refuse a
                          minor or patch bump that holds a breaking
                          commit
                          (_data/decision/dec_breaking_work_after_version_one/opt_breaking_work_warned_only.yaml at brief).
                        - Owner's statement (2026-10-22): major
                          releases "require coordination and will
                          likely always require human involvement"
                          (_sources/context.md line 24).
                        - Assumption: the commits on next are reviewed
                          as they land there, so the step that remains
                          large is the merge and the release notes,
                          not each commit. Strength: weak; if each
                          commit on next is reviewed when it lands,
                          only the merge is new to the reviewer.

