title:                  Prefix changes that no switch can hold back
brief:                  |
                        The breaking changes the owner names are to
                        the graph, such as prefix changes and renames,
                        which edit ids in files across the tree rather
                        than code paths. Nothing in cctool switches
                        items on or off, so holding one back would
                        mean two forms of every renamed item, and
                        without that the break reaches peers in a
                        minor release anyway.
description:            |
                        Sources:
                        - Owner's statement (2026-10-22):
                          breaking changes to bundle include "e.g.
                          prefix changes" (_sources/context.md line
                          16).
                        - A guid is the prefix of the type and 32 hex
                          digits, minted once and never changed
                          (AGENTS.md lines 114-115).
                        - cctool rename changes every YAML document
                          that names the id and moves the file of a
                          standalone item (AGENTS.md lines 124-126).
                        - Nothing in cctool's commands switches items
                          on or off (README.md lines 110-138).
                        - Assumption: no mechanism exists to keep two
                          ids or two prefixes live behind a switch;
                          none appears in the repository. Strength:
                          strong; the kind of breaking change the
                          owner names as an example does not fit the
                          option.

