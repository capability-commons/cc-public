title:                  Breaking work waits on next
brief:                  |
                        After 1.0, breaking work collects on next, and
                        a push that moves the release line over a
                        breaking commit fails the history check,
                        except the push that lands next in a major
                        release. Ruled by William Payne on 2026-10-24,
                        as recommended, now rather than when 1.0
                        nears. He first gave 1.0 as about a month or
                        two away, then later the same day as "likely
                        to be 6 months or more away - lots and LOTS to
                        do before then", and asked for the reason to
                        follow the later estimate. The range check is
                        accepted "tentatively. We need to understand
                        the consequences": how the range is computed,
                        whether a breaking commit is moved onto next
                        automatically, and how the person pushing is
                        told. A decision on declaring the public API
                        is to be opened, since what counts as breaking
                        is judged against it.

