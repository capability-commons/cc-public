title:                  Recorder reserve that grows with the length of the run
brief:                  |
                        When the store is slower than the recording
                        rate, the backlog grows by the difference
                        every second, so sizing a recorder for a
                        declared run reserves memory in proportion to
                        the run's length. The case for the requirement
                        already pairs a 200 ms store with a 50 ms
                        period, 15 rows a second more than the store
                        takes, or 7,500 rows over the review's
                        10,000-step regression. A robot on patrol has
                        no natural end to its run, so the option
                        either reserves for a guessed length or
                        refuses to run because its recorder is slow.
                        Counting the loss and marking the recording
                        keeps memory fixed and lets the robot run, at
                        the price of a recording that cannot be
                        replayed.
description:            |
                        Sources:
                        - A deployment declares its longest run and
                          the rate of its
                          store, and one whose store cannot keep up is refused before it
                          runs.
                          (_data/decision/dec_overflow_of_events_and_recordings/opt_capacity_sized_for_a_declared_run.yaml
                          at brief)
                        - A recorder writes to a store that takes 200
                          ms per write, in a
                          unit with a 50 ms period.
                          (_data/test_case/case_recorder_off_step_path.yaml at
                          preconditions)
                        - The proposed regression runs a store 4x too
                          slow for 10,000
                          steps (review of 2026-10-29, CC-052).
                        - The trial's default recording ring already
                          reserved 4096 rows
                          of 64 KiB, 256 MiB (review of 2026-10-29, area report
                          trial-engine, TE-19).
                        - Peak memory is one measure of performance
                          efficiency.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure)
                        ASSUMPTION: one row per local step; a camera
                        end of a few megabytes a row would make the
                        reserve gigabytes within minutes. ASSUMPTION:
                        Patrol's runs are open-ended. Strength: strong
                        for long runs with a slow store; weak where
                        the store keeps up on average and only bursts
                        need absorbing, which a derived capacity
                        handles well.

