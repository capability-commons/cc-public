title:                  Counted loss that keeps a partial recording from passing as whole
brief:                  |
                        The trial dropped change and admission rows
                        without a count, so a recording that lacked
                        them looked complete, and its replay diverged
                        with no sign of why. Its recorder also raised
                        one event for every row it could not take,
                        into the event queue whose events the
                        recording itself holds, while what that queue
                        lost showed only in a status reply. One
                        counted event and a mark on the recording, as
                        the counting option asks, put the loss where
                        the control block and replay look. Zeitgeist,
                        built on MillWheel, ran the same pattern at
                        scale, dropping late data while keeping count
                        of it.
description:            |
                        Sources:
                        - Change and admission rows the writer could
                          not take were
                          dropped without a count, the drop counter stayed at 0, and
                          replay diverged (review of 2026-10-29, CC-015).
                        - The recorder node reports a recorder-behind
                          event for each row
                          it cannot push, and events lost from the queue appear only as a
                          count in the status reply (trial 2c777ab9,
                          src/cctool/dataflow/engine/nodes/recording.cpp, function
                          recorder_step; src/cctool/dataflow/engine/src/runtime.cpp,
                          function EventQueue::push;
                          src/cctool/dataflow/engine/src/control.cpp).
                        - What does not fit is dropped and counted,
                          the count reaches the
                          control block as one event, and a recording that lost anything
                          is marked as not replayable.
                          (_data/decision/dec_overflow_of_events_and_recordings/opt_overflow_counted_and_recording_marked.yaml
                          at brief)
                        - Zeitgeist drops late data while keeping
                          track of how much it
                          dropped (Akidau et al. 2013, MillWheel, section 4.5, as noted in
                          round 2).
                        - The trial's replay accepted any recording,
                          and the review's fix
                          adds a header row that replay verifies, where a mark could also
                          go (review of 2026-10-29, CC-045).
                        - Reliability asks whether the design can
                          recover without losing
                          or corrupting data.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reliability.question)
                        Strength: strong against silent loss; the
                        failing option also makes loss visible, by
                        ending the recording at the fault.

