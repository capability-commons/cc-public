title:                  Requirements on events and recording kept as written
brief:                  |
                        Sizing for a declared run lets "drop no
                        event", "with none dropped" and the recording
                        of every value stand as written, true within
                        any run the deployment accepts. Counting the
                        loss means rewording those records to carry a
                        capacity and a clause on counted loss, and
                        qualifying the two replay requirements for a
                        recording marked incomplete. The failing
                        option rewords them as well, to a recording
                        that ends at the fault. Fewer records change
                        under the sizing option, though each of the
                        others says plainly what it gives up.
description:            |
                        Sources:
                        - The engine reports each overflow and overrun
                          and drops no
                          event; control blocks pass every event with none dropped; an
                          event is never dropped; recorders record every value from
                          outside, every control message and every engine event.
                          (_data/requirement/rqt_executor_reports_faults.yaml at
                          qualifier; _data/requirement/rqt_control_block_passes_events.yaml
                          at object;
                          _data/interface_control_document/icd_dataflow_engine_event.yaml
                          at surface.data.artifact.availability;
                          _data/requirement/rqt_recorder_records_outside.yaml at object)
                        - The review's fix gives the requirements a
                          capacity and a clause
                          that loss is counted and marks the recording (review of
                          2026-10-29, CC-052).
                        - A run with live changes replays the same
                          messages on every edge,
                          and a player delivers exactly what was recorded for each local
                          step, with no condition on whether the recording is complete.
                          (_data/requirement/rqt_engine_replays_live_changes.yaml at
                          object; _data/requirement/rqt_player_replays_exactly.yaml at
                          object)
                        - Maintainability counts the parts that a
                          representative change
                          touches.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure)
                        Strength: weak; rewording is a one-time cost
                        to the records, and a requirement true only
                        within a declared run still needs the run
                        declared and checked.

