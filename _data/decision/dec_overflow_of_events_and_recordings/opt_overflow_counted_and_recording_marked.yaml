title:                  Overflow counted and the recording marked
brief:                  |
                        The event queue and each recorder buffer have
                        declared capacities. What does not fit is
                        dropped and counted, the count reaches the
                        control block as one event, and a recording
                        that lost anything is marked as not
                        replayable.

