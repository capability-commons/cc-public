title:                  Declared store rate that still needs a fail-safe
brief:                  |
                        A capacity derived from a declared store rate
                        holds only while the store keeps that rate,
                        and the rate depends on hardware and on
                        storage software from third parties, which
                        differ between an Orin, a laptop and a
                        Raspberry Pi and change with an update. For
                        ports the same derivation was ruled together
                        with a declared fail-safe, because an overflow
                        means a stated bound was wrong, not that it
                        cannot happen. Sizing for a declared run says
                        nothing of what happens when the store falls
                        behind its declaration; counting the loss, or
                        failing the step, at least states it.
description:            |
                        Sources:
                        - Each port's capacity is derived from stated
                          maximum rates, and
                          each port still declares its fail-safe on overflow, every
                          overflow raising a fault.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/ruling_capacity_derived_from_maximum_producer_rates.yaml
                          at brief;
                          _data/decision/dec_behavior_when_a_capacity_is_exceeded/ruling_fail_safe_declared_per_port.yaml
                          at brief)
                        - Overflow is a broken requirement with a
                          declared fail-safe
                          (WTP, 2026-10-28).
                        - Target platforms range from an Ubuntu
                          workstation to a
                          Raspberry Pi 5.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_control_blocks_hold_the_only_platform_code.yaml
                          at description)
                        - The sizing option states the declaration and
                          the refusal, and
                          no behavior on overflow.
                          (_data/decision/dec_overflow_of_events_and_recordings/opt_capacity_sized_for_a_declared_run.yaml
                          at brief)
                        - Dependency risk asks what happens if a part
                          taken from a third
                          party is changed.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question)
                        ASSUMPTION: the write rate of flash storage
                        varies with wear, temperature and the file
                        system's housekeeping, so a declared rate is
                        an estimate. Strength: strong as a gap in the
                        option as written; it goes away if the option
                        is read as a derived capacity with one of the
                        other two as a backstop, which would be a
                        fourth option.

