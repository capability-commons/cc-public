title:                  Events per local step bounded by the graph and by the door
brief:                  |
                        In one local step a unit raises at most one
                        overflow event per port, one overrun, no more
                        admissions than its actor queues hold and no
                        more swaps than a change set names, so an
                        event queue sized from the lowered graph, and
                        drained by the control block every step,
                        cannot fill from faults inside the graph. Only
                        change requests and outside messages arrive at
                        a rate an outsider sets, and runtime control
                        can refuse those beyond a fixed number per
                        step, as the trial already refused sends
                        beyond its limit. With that door, the sizing
                        option holds for the event queue with no event
                        dropped, and without even a run length to
                        declare. A queue that drops, or that fails the
                        step when full, hands whoever floods runtime
                        control a way to erase the record or to stop
                        the step.
description:            |
                        Sources:
                        - One event is raised for each overflow,
                          whichever fail-safe the
                          port declares; the control block reads events at the next local
                          step, and an event is never dropped.
                          (_data/interface_control_document/icd_dataflow_engine_event.yaml
                          at surface.data.artifact.artifact.overflow.convention,
                          surface.data.artifact.production and
                          surface.data.artifact.availability)
                        - The capacity of each port is derived by a
                          transform from stated
                          maximum rates.
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/ruling_capacity_derived_from_maximum_producer_rates.yaml
                          at brief)
                        - The trial fixed the event queue at 4096 per
                          unit, counted what
                          did not fit only in the status reply, and refused an outside
                          send once 1024 messages were waiting (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, functions run and
                          EventQueue::push; src/cctool/dataflow/engine/src/control.cpp,
                          the status reply; src/cctool/dataflow/engine/src/actors.cpp,
                          function hook_send; trial process log, phase 4).
                        - MillWheel limits skew by waiting to inject
                          newer records at the
                          source until downstream has caught up (Akidau et al. 2013,
                          MillWheel, section 8.4, as noted in round 2).
                        - Security asks what an attacker can reach and
                          what it would
                          cost.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question)
                        ASSUMPTION: a port writes once in a local
                        step, so it overflows at most once in it, and
                        runtime control can refuse a request with a
                        reply that costs the engine nothing. Strength:
                        strong for the event queue; it says nothing
                        about a recorder whose store is slow, which is
                        the other half of the decision.

