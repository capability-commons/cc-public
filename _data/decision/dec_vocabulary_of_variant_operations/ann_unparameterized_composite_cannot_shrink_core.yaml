title:                  A composite without parameters that cannot shrink the core
brief:                  |
                        Inserting a node on an edge and substituting a
                        node act on whichever edge or node a variant
                        names, while a fixed list names fixed nodes
                        and edges. So a composite cannot stand in for
                        either one unless composites take parameters,
                        and parameters are an open decision of their
                        own.
description:            |
                        Sources:
                        - The Patrol list lacks insert-on-edge and
                          substitute, which the open decisions need.
                          (_data/decision/dec_vocabulary_of_variant_operations/dec_vocabulary_of_variant_operations.yaml
                          lines 25-29)
                        - The composite option describes a fixed list
                          and says nothing of parameters.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml
                          lines 13-18)
                        - Houdini digital assets, which the option
                          cites, carry promoted parameters.
                          (_sources/variants-framing.md line 24)
                        - Declared parameters are a separate open
                          option.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml,
                          brief) Strength: moderate; it is unaffected
                          by scale but fails if the owner rules
                          parameters together with composites.

