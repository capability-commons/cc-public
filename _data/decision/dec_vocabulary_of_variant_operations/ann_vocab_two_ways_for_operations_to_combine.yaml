title:                  Two ways for operations to combine in one vocabulary
brief:                  |
                        The order-free option gives the resolver two
                        semantics, unification and ordered rewriting,
                        and rules for how a rewrite meets a
                        constraint, such as a removal of a node a
                        constraint names. Its constraint kinds are
                        properties decided elsewhere, and none is a
                        variant operation in the drafts.
description:            |
                        Sources:
                        - Constraints combine by unification in any
                          order, while rewrites apply in order.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_order_free_constraints_and_ordered_rewrites.yaml,
                          brief)
                        - The drafts use filter, write, host,
                          os_process, place, add and join.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - Tags are on base nodes, and interface limits
                          and mutability belong to an open decision of
                          their own.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 1-4;
                          _data/decision/dec_where_mutability_is_declared/opt_mutability_on_node_with_interface_limit.yaml,
                          brief)
                        - ASSUMPTION: a rewrite that removes a node a
                          constraint names needs a stated rule, since
                          CUE has no removal.
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: moderate; the second semantics is
                          a fixed cost, and the point weakens if
                          variants start to set many constraint-like
                          properties.

