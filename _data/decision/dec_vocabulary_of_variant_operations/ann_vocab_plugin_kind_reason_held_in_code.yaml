title:                  A plugin kind whose reason stays in a code registration
brief:                  |
                        A declared plugin fixes the trace from a
                        resolved element to the operation that made
                        it, but the reason the operation kind exists
                        stays in a code registration, not an item,
                        unless the registration is itself an item.
description:            |
                        Sources:
                        - The declared-plugin registration declares
                          schema, reference fields and origin records.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_open_operations_through_declared_plugins.yaml,
                          brief)
                        - cctool modules already carry a data item in
                          their docstring.
                          (src/cctool/commit/impact.py)
                        - Traceability counts elements with no traced
                          reason. (_data/register/reg_concern.yaml at entries.concern_traceability.measure.0) Strength: moderate; it grows with
                          plugins, and falls away if each registration
                          is a data item.

