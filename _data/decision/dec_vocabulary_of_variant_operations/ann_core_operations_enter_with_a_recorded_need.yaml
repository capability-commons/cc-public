title:                  Core operations that enter with a recorded need
brief:                  |
                        Three operations beyond the seven Patrol uses
                        have been proposed for the core: remove, which
                        appears only in the draft's list, and
                        insert-on-edge and substitute, which trace to
                        open decisions. A closed set that grows by
                        schema change lets each operation enter with
                        the ruling or instance that called for it,
                        provided the first core holds only such
                        operations; under plugins an operation can
                        enter with no item recording why.
description:            |
                        Sources:
                        - The variant tree uses filter, write, host,
                          os_process, place, add and join.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 27-33)
                        - Remove is listed as removing one node or
                          edge by id.
                          (_sources/cc-patrol-notes/variants.md
                          line 67)
                        - The study's core adds insert-on-edge and
                          substitute, needed by the open decisions on
                          where engine behavior lives and on swapping
                          a node version.
                          (_sources/variants-framing.md lines 47, 50
                          and 88)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief) Strength: moderate; the unmet
                          cases are few now, and under plugins the
                          number of operations with no recorded reason
                          has no bound.

