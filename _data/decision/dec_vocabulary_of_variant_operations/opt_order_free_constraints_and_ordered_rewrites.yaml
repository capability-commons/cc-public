title:                  Order-free constraints beside ordered rewrites
brief:                  |
                        The vocabulary has two kinds of operation.
                        Presence tags, requires and excludes,
                        interface limits and mutability combine by
                        unification in any order, with a contradiction
                        an error, while add, remove, join, substitute
                        and place are rewrites applied in order, each
                        seeing only the graph before it.
description:            |
                        Survey idea 8 (_sources/survey/README.md lines
                        65-68), from CUE unification and the Nix and
                        Jsonnet late binding contrast
                        (_sources/survey/generative-and-transforms.md
                        lines 126-128).

