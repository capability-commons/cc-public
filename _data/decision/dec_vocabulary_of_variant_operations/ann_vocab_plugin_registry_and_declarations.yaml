title:                  A plugin registry and declaration format that cctool lacks
brief:                  |
                        Declared plugins need a loader and a registry
                        that cctool does not have, a declaration
                        format for reference fields and a protocol for
                        emitting origin records, three mechanisms
                        beside a closed core that needs none of them,
                        and each plugin's declared references are kept
                        by hand.
description:            |
                        Sources:
                        - A plugin's registration declares its schema,
                          which of its fields are references, and the
                          origin records it emits.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_open_operations_through_declared_plugins.yaml,
                          brief)
                        - A grep of src/ and pyproject.toml finds no
                          plugin or entry_points mechanism.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_every_reader_must_know_each_operation.yaml,
                          description; repeated on this snapshot by
                          the maintainability advocate)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.0)
                          Strength: strong; the declarations to keep
                          grow with each plugin.

