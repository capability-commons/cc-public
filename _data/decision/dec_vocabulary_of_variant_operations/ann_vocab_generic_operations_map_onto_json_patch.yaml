title:                  Generic operations that map onto JSON Patch
brief:                  |
                        Generic add, remove and write over keyed maps
                        correspond one to one with JSON Patch add,
                        remove and replace on paths that do not move,
                        so a partner can apply them with a stock
                        implementation. Over an array the same paths
                        shift on every removal.
description:            |
                        Sources:
                        - JSON Patch add on an existing member
                          replaces it, remove requires the target to
                          exist, and removing an array element shifts
                          the elements above it. (RFC 6902, sections
                          4.1 and 4.2,
                          https://www.rfc-editor.org/rfc/rfc6902)
                        - Hosts, OS processes and dataflow nodes are
                          maps keyed by short local names.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          67-96) Strength: moderate; it depends on
                          JSON-level exchange being used, and covers
                          keyed sections only.

