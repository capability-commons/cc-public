title:                  A lab variant that cannot loosen a constraint by a write
brief:                  |
                        Order-free constraints can only be narrowed,
                        never overridden, but the framing study's lab
                        variant makes a node changeable by a write on
                        a fixed base. With mutability among the
                        order-free constraints, that works only if the
                        base leaves mutability unset.
description:            |
                        Sources:
                        - The order-free kinds include interface
                          limits and mutability.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_order_free_constraints_and_ordered_rewrites.yaml,
                          brief)
                        - Nothing is overridden, only narrowed.
                          (_sources/survey/generative-and-transforms.md
                          lines 79-80)
                        - Per-node mutability lets one base give a
                          fixed deployment and a changeable lab
                          variant by a write.
                          (_sources/variants-framing.md line 58)
                          Strength: moderate; it holds at any scale,
                          and bears on mutability and interface
                          limits, not on requires and excludes.

