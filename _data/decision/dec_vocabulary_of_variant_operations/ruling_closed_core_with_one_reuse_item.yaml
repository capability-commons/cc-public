title:                  Closed core with the delta module as the one item for reuse
brief:                  |
                        The variant operations are a closed core,
                        including merge with its commands that join
                        edges, and the delta module is the one item
                        kind for reuse: a named subgraph of variant
                        operations with declared inputs and
                        parameters, applied like a single variant
                        operation. Ruled by WTP on 2026-10-26, with
                        the option reworded as discussed, and ruled
                        together with the shape of the variant family.

