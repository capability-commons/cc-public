title:                  Readers that must know every operation they meet
brief:                  |
                        Checks, rename maps, dictionary upgrades, the
                        resolver's origin records and a runtime
                        change-set check each have to interpret every
                        operation they meet. With a closed core, the
                        schema declares each operation and which of
                        its fields are references, and a new kind
                        arrives as one checked change to schema,
                        interpreter and checks; with plugins, an
                        operation's schema, references and effects are
                        known only to its own Python code, which the
                        runtime and string-valued addresses such as
                        those of write cannot see.
description:            |
                        Sources:
                        - "every check, rename, dictionary upgrade and
                          run-time change set must understand each
                          operation it meets".
                          (_data/decision/dec_vocabulary_of_variant_operations/dec_vocabulary_of_variant_operations.yaml
                          lines 17-22)
                        - A plugin "supplies the operation's schema
                          and semantics".
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_open_operations_through_plugins.yaml
                          lines 13-16)
                        - Rename maps rewrite each reference to the id
                          its guid names.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 13-17) A plugin that uses the usual
                          reference fields would be renamed anyway,
                          which narrows the claim to references and
                          addresses held in a plugin's own form.
                        - A dictionary upgrade maps each field as
                          kept, renamed, converted or new with a
                          default.
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          lines 12-18) A write addresses a setting by
                          a dotted string, not a reference field.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 30-32)
                        - One open option checks a change set in C++
                          in the runtime, where a Python plugin
                          supplies nothing.
                          (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml
                          lines 12-19)
                        - The Patrol draft asks that check failures
                          name the variant and the operation that
                          introduced the fault.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - Refactorings held as a closed vocabulary of
                          typed graph rules allow conflict and
                          dependency analysis at the vocabulary level.
                          (Mens, Taentzer, Runge 2007,
                          https://user.tu-berlin.de/lieske/tfs/publikationen/Papers07/MTR07.pdf,
                          as summarized in
                          _sources/survey/generative-and-transforms.md
                          lines 25-26)
                        - Traceability had the largest estimated
                          effect on perceived comprehensibility among
                          113 transformation users, though above the
                          paper's threshold for significance. (Hoppner
                          and Tichy 2023,
                          https://arxiv.org/pdf/2305.06764, section
                          5.2)
                        - A grep of src/ and pyproject.toml for plugin
                          and entry_points finds nothing; cctool has
                          no plugin mechanism today.
                        - The maintainability questions include how
                          readily a change can be checked before it
                          ships. (_data/register/reg_concern.yaml line
                          396) Strength: strong; the readers to
                          update, and the places an unknown operation
                          gives a wrong or missing result, grow with
                          every plugin and every variant.

