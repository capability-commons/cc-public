title:                  A parameterized composite that can make a tap but not a substitute
brief:                  |
                        With parameters a composite can express
                        insert-on-edge as remove the edge, add the
                        node and join twice, which takes one operation
                        out of the core, provided the parameters can
                        carry the old edge's policy and presence tags.
                        Substitute must rewire every edge of a node,
                        whose number differs from node to node, so a
                        fixed list cannot express it.
description:            |
                        Sources:
                        - The study's core adds insert-on-edge and
                          substitute. (_sources/variants-framing.md
                          line 94)
                        - Remove, add and join are in the draft's list
                          of operations.
                          (_sources/cc-patrol-notes/variants.md lines
                          61-67)
                        - The Patrol base puts policy and presence
                          tags on
                          edges.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 3-4)
                        - The earlier annotation found that a
                          composite without parameters cannot stand in
                          for either operation.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_unparameterized_composite_cannot_shrink_core.yaml,
                          brief) Strength: moderate; it holds at any
                          scale but depends on which operations are
                          ruled into the core.

