title:                  Reused piece traced to one variant through its merge
brief:                  |
                        Under merge as reuse the reason for a reusable
                        piece is held once, in the brief of its
                        [[dataflow variant]], and each merge, a
                        [[variant operation]] with an id and a guid,
                        points at it. But an element the piece makes
                        has two origins, the merge and the operation
                        inside the piece, so the origin record must
                        follow both, as it must for a composite.
description:            |
                        Sources:
                        - A reusable piece is a dataflow variant that
                          others merge in.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_merge_as_the_reuse_operation.yaml
                          at brief)
                        - Each variant operation is named by an id
                          with a guid.
                          (_data/decision/dec_identity_of_a_variant_operation/ruling_operation_named_by_id_with_guid.yaml
                          at brief)
                        - An element made inside a composite has two
                          origins, which the record must both name.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_composite_traces_through_two_levels.yaml
                          at brief)
                        - Traceability asks whether each element
                          traces to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                          Strength: moderate; the one reuse item gives
                          the same trace through two levels, so this
                          weighs about evenly between them and against
                          plugins.

