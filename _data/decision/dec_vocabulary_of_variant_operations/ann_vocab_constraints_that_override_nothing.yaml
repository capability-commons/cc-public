title:                  Constraints that combine in any order and override nothing
brief:                  |
                        Under the order-free part of the vocabulary,
                        presence tags, requires and excludes combine
                        by unification, which gives one result in any
                        order and never overrides, so no earlier
                        value's reason is erased and a contradiction
                        names both sides.
description:            |
                        Sources:
                        - Unification is commutative, associative and
                          idempotent, and order does not matter.
                          (https://cue.googlesource.com/cue/+/v0.0.3/doc/tutorial/basics/unification.md)
                        - Nothing is overridden, only narrowed.
                          (_sources/survey/generative-and-transforms.md
                          lines 79-80)
                        - Last-writer-wins lets a later variant undo
                          an earlier one with no record of the
                          conflict.
                          (_sources/survey/generative-and-transforms.md
                          line 154) Strength: moderate; it grows with
                          reuse, and needs an origin record that keeps
                          every contributor.

