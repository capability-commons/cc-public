title:                  Hand-written generic operations that drift from the schema
brief:                  |
                        Under either closed option, add, remove and
                        write are hand-written for each section of the
                        dataflow graph schema, so a new schema section
                        needs a matching change to the operations or
                        variants cannot reach it. The drafts already
                        add fields beyond the schema on dev, and
                        deriving the generic operations from the
                        schema would keep the two in step.
description:            |
                        Sources:
                        - The schema has four sections, three keyed
                          maps and one list.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          67-106)
                        - The drafts add abstract, runtime and tag on
                          nodes, and policy and tag on edges.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 1-4)
                        - DeltaEcore generates a delta language's
                          syntax and much of its semantics from the
                          source metamodel. (Seidl, Schaefer, Assmann
                          2014,
                          https://dl.gi.de/handle/20.500.12116/20956,
                          abstract only) Strength: moderate now,
                          strong at ten times the schema changes; it
                          does not depend on the number of variants.

