title:                  Closed core with composite operations that take parameters
brief:                  |
                        A closed core of variant operations is fixed
                        in the schema, and a composite operation is a
                        named list of core operations that declares
                        parameters, whose values each use of the
                        composite binds, as promoted parameters work
                        on a Houdini digital asset.
description:            |
                        The merge notes found the composite option
                        silent on parameters, which the Houdini
                        digital assets it cites carry
                        (_sources/four-decisions-argued.md line 789;
                        https://sidefx.com/docs/houdini/assets/intro.html).

