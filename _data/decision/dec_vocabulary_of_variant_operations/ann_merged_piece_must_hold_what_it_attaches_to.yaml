title:                  Merged piece that must hold what it attaches to
brief:                  |
                        A list of [[variant operations]] applies to
                        whatever the receiving dataflow variant holds,
                        with its preconditions checked there, so it
                        can add a logger and join it to the analysis
                        result of any variant that has one. A piece
                        that is a [[dataflow variant]] is resolved on
                        its own, so to join to the analysis node it
                        must hold that node, and so be built on a base
                        that has it, which brings in the rest of that
                        base and the question of what a merge does
                        with what one side removed.
description:            |
                        Sources:
                        - A reusable piece, such as a trait model or a
                          delta module, is a dataflow variant that
                          others merge in.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_merge_as_the_reuse_operation.yaml
                          at brief)
                        - The reuse item is a named ordered list of
                          core operations used within a variant's list
                          or included.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - The replay variant adds nodes and joins them
                          to the analysis node of the Patrol base.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          at operation)
                        - An end of a dataflow edge names a dataflow
                          node, and the checker finds an end that
                          names nothing.
                          (_data/schema/sch_dataflow_graph.yaml at
                          description)
                        - Every variant operation states its
                          preconditions.
                          (_data/decision/dec_preconditions_of_variant_operations/ruling_every_operation_states_its_preconditions.yaml
                          at brief)
                        - The merge option of the family decision
                          leaves open how an element held by one side
                          only is treated.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1)
                          Strength: strong for pieces that attach to
                          an existing node, which most cross-cutting
                          features do; weak for pieces with no anchor,
                          such as a second system.

