title:                  Generic operations that follow the schema they serve
brief:                  |
                        Add, remove and write driven by the schema
                        need no edit when a keyed section or field
                        appears, and each traces by construction to
                        the section it serves and cannot outlive it.
                        Under either earlier closed option they are
                        hand-written per section, and the drafts
                        already add fields beyond the schema.
description:            |
                        Sources:
                        - The sketch's write walks a dotted address
                          and asserts the last key exists.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 44-50)
                        - The drafts add abstract, runtime and tag on
                          nodes, and policy and tag on edges.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 1-4)
                        - DeltaEcore generates a delta language's
                          syntax and much of its semantics from the
                          metamodel. (Seidl, Schaefer, Assmann 2014,
                          https://dl.gi.de/handle/20.500.12116/20956,
                          abstract only)
                        - The generic operations are generated per
                          keyed section, and domain operations stay
                          hand-written.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_generic_operations_generated_from_the_schema.yaml,
                          brief)
                        - A derived edge is computed by a rule and
                          never written back.
                          (_data/register/reg_concept.yaml lines
                          1828-1835) ASSUMPTION: generated operations
                          for sections no variant edits count as
                          derived, not as elements with no reason.
                          Strength: strong at ten times the schema
                          changes; it does not depend on the number of
                          variants.

