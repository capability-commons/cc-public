title:                  Delta module recast as a dataflow variant merged in
brief:                  |
                        The option calls a [[delta module]] a
                        [[dataflow variant]] that others merge in,
                        while the register, ruled today, defines a
                        delta module as a named list of variant
                        operations held apart from any dataflow
                        variant, included rather than built on.
                        Upholding the option means redefining or
                        retiring that concept, and the definition of a
                        variant operation that names it, or a reader
                        meets one term in two senses.
description:            |
                        Sources:
                        - A reusable piece, such as a trait model or a
                          delta module, is a dataflow variant that
                          others merge in.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_merge_as_the_reuse_operation.yaml
                          at brief)
                        - A delta module is a named list of variant
                          operations, held apart from any one dataflow
                          variant, that dataflow variants include, and
                          it is not a base.
                          (_data/register/reg_concept.yaml at
                          entries.concept_delta_module.brief and
                          entries.concept_delta_module.description)
                        - A variant operation is one member of an
                          operation list or a delta module.
                          (_data/register/reg_concept.yaml at
                          entries.concept_variant_operation.brief)
                        - The terms were ruled on 2026-10-25, and WTP
                          asked that the tree be brought into line
                          with them (WTP, 2026-10-25).
                          (_data/decision/dec_names_for_variants/ruling_qualified_terms_with_clashes_resolved.yaml
                          at brief)
                        - The one reuse item keeps a delta module a
                          named list of operations.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - Maintainability asks how readily a newcomer
                          can understand the design.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.0)
                          Strength: moderate; it is fixed by two
                          register edits made with the ruling, and is
                          a cost of change rather than of the design.

