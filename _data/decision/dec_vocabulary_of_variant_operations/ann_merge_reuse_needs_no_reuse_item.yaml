title:                  Reuse by merge that needs no reuse item
brief:                  |
                        With merge as the reuse operation the reusable
                        unit is the [[dataflow variant]], a type
                        already ruled, so reuse adds one
                        [[variant operation]] and no item type,
                        prefix, schema, register entry or folder, and
                        a built-on variant and a merged-in one are the
                        same kind of item. The one reuse item adds an
                        item kind beside the variant, which the
                        earlier argument for it found unneeded where
                        the variant itself is the reuse unit, as under
                        including built-on variants.
description:            |
                        Sources:
                        - There is no separate reuse item: a reusable
                          piece is a dataflow variant that others
                          merge in.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_merge_as_the_reuse_operation.yaml
                          at brief)
                        - One item kind serves both as a composite and
                          as an included delta module.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - If including built-on variants is upheld,
                          the variant itself is the reuse unit and no
                          new kind is needed, so the two decisions
                          should name one reuse unit between them;
                          merge as reuse makes the variant the unit in
                          another way.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_vocab_one_item_kind_for_reusable_lists.yaml
                          at brief)
                        - A new item type adds a prefix, a schema, a
                          register entry and a folder.
                          (_data/decision/dec_how_variants_are_held/ann_new_variant_type_adds_parts.yaml
                          at brief)
                        - Simplicity counts distinct mechanisms and
                          jobs done by more than one.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0 and
                          entries.concern_simplicity.measure.1)
                          Strength: strong as a count of mechanisms;
                          it holds only if merge is one well-defined
                          operation, which the family decision has
                          still to settle.

