title:                  Parameters declared and bound in a second place
brief:                  |
                        Composites with parameters add substitution
                        and a place where parameters are declared and
                        bound, beside the open decision on parameters
                        of a variant, so upholding both gives one job
                        two mechanisms; and failure reports must name
                        both the use and the core operation inside it.
description:            |
                        Sources:
                        - A parameterized composite declares
                          parameters whose values each use binds.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_parameterized_composites.yaml,
                          brief)
                        - Declared parameters of a variant are a
                          separate open option.
                          (_data/decision/dec_parameters_of_a_variant/opt_declared_parameters_bound_by_child.yaml,
                          brief)
                        - An element made inside a composite has two
                          origins to record.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_composite_traces_through_two_levels.yaml,
                          brief)
                        - The simplicity measure counts jobs done by
                          more than one mechanism.
                          (_data/register/reg_concern.yaml line 490)
                          Strength: strong if both are upheld,
                          moderate otherwise; it weakens if parameters
                          are ruled once for variants and composites
                          together.

