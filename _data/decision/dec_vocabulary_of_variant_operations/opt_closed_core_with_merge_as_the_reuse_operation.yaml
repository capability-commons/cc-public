title:                  Closed core of operations, with merge as the way to reuse
brief:                  |
                        The [[variant operations]] are a closed core,
                        one of which is merge, and there is no
                        separate reuse item: a reusable piece, such as
                        a trait model or a [[delta module]], is a
                        [[dataflow variant]] that others merge in.
description:            |
                        Drafted so that this decision can be ruled
                        together with the shape of the variant family,
                        as WTP asked (WTP, 2026-10-25), if the family
                        becomes a graph of edits with merge as one
                        operation.

