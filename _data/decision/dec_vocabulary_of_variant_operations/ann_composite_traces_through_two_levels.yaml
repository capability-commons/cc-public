title:                  A composite traced through two levels
brief:                  |
                        A composite can hold its reason once, for
                        example the reason for lab logging, and every
                        variant that uses it then traces to that one
                        item. But an element produced inside a
                        composite has two origins, the composite and
                        the core operation within it, so the origin
                        record must name both or the composite's
                        reason drops out of the trace.
description:            |
                        Sources:
                        - A composite is a named, reusable list of
                          core operations that adds no semantics of
                          its own.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml
                          lines 13-18)
                        - The survey proposes that the resolver
                          records which base item and operation
                          produced each resolved part, with an id per
                          operation. (_sources/survey/README.md lines
                          45-47)
                        - A Houdini digital asset packages a
                          sub-network.
                          (https://sidefx.com/docs/houdini/assets/intro.html,
                          as cited in _sources/variants-framing.md
                          line 24) Strength: moderate; with ten times
                          the variants one reason held once beats one
                          copy per variant, but only if the two-level
                          record is built.

