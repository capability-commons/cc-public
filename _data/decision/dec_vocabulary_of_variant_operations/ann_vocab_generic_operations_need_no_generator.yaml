title:                  Generic operations by address that need no generator
brief:                  |
                        Write already reaches any keyed section
                        through a dotted address, so one generic add,
                        remove and write over addresses, written once
                        by hand, covers every section without code
                        generation. The schema has four sections, and
                        a generator for four sections is a mechanism
                        larger than what it replaces.
description:            |
                        Sources:
                        - Write addresses keyed sections by dotted
                          path.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 44-50)
                        - The schema has four sections, three keyed
                          maps and one list.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          67-106)
                        - The sketch resolver interprets all seven
                          kinds in lines 24-67.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: moderate; a schema with many more
                          sections would favor generation.

