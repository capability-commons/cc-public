title:                  Generated generic writes that reach identity and placement fields
brief:                  |
                        Add, remove and write generated for each keyed
                        section would reach every field of a node,
                        including its id and OS process, so a variant
                        could move a node past the crossing rules of
                        place or break the rule that a base node keeps
                        its id. Generation also cannot cover edges
                        until edges have a key.
description:            |
                        Sources:
                        - A dataflow node holds id_self, brief,
                          description, os_process, settings and its
                          edges, and the drafts add runtime, tag and
                          abstract.
                          (_data/schema/sch_dataflow_node.yaml;
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 1-4)
                        - Place is the operation that moves nodes
                          between OS processes, and the engine binds a
                          transport to edges that then cross.
                          (_sources/cc-patrol-notes/variants.md
                          line 66)
                        - A node the base declares keeps its id in
                          every variant.
                          (_sources/cc-patrol-notes/variants.md lines
                          79-82)
                        - The edge list is an array, and the other
                          sections are keyed maps.
                          (_data/schema/sch_dataflow_graph.yaml at allOf.2.properties) Strength: strong for generated
                          writes on identity fields at any scale; it
                          falls away if the option excludes identity
                          and placement fields and waits for edge
                          keys.

