title:                  Reuse as the main lever on perceived maintainability
brief:                  |
                        In a survey of model transformation users,
                        reuse mechanisms seemed to have the strongest
                        effect on perceived maintainability. That
                        supports having some reuse of operation lists,
                        which composites give, though abstract
                        intermediate variants and included deltas give
                        it too.
description:            |
                        Sources:
                        - Hoppner and Tichy (2023) write that reuse
                          mechanisms seem to be the strongest driving
                          factor for perceived maintainability.
                          (https://arxiv.org/pdf/2305.06764, section
                          5.2 and table 3)
                        - Abstract intermediate variants already give
                          reuse.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34) Strength: weak; the evidence is
                          perceived quality, and composites are not
                          the only reuse mechanism on offer.

