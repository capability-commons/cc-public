title:                  Closed core with the delta module as the one item for reuse
brief:                  |
                        A closed core of [[variant operations]] is
                        fixed in the schema, and includes merge with
                        its commands that join edges. One item kind,
                        the [[delta module]], is the unit of reuse: a
                        named subgraph of variant operations with
                        declared inputs and parameters, such as the
                        number of camera inputs or the type of logging
                        sink, applied like any single variant
                        operation to whatever is wired into it. A
                        delta module reuses a transform, while a merge
                        adds a piece of a model.
description:            |
                        Proposed by the simplicity and maintainability
                        and the functional suitability and
                        compatibility advocates as one reuse mechanism
                        ruled once across this decision and
                        dec_shape_of_a_variant_family
                        (_sources/four-decisions-argued.md, the
                        section on the operation vocabulary). Reworded
                        when WTP upheld it: WTP wants the tooling to
                        be as much like a generative graph-based
                        editor such as Houdini as possible, a graph of
                        transforms that can be edited and played with
                        caching at each stage, except that what is
                        transformed is itself a dataflow model, and
                        wants parameters on delta modules (WTP,
                        2026-10-26). The delta module is then the
                        counterpart of a Houdini digital asset, a
                        packaged subnetwork with its own inputs and
                        exposed parameters.

