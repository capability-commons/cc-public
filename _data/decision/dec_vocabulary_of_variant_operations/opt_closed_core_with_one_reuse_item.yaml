title:                  Closed core with one item kind for reuse
brief:                  |
                        A closed core of variant operations is fixed
                        in the schema, and one item kind, a named
                        ordered list of core operations, serves both
                        as a composite operation within a variant's
                        own list and as a delta that a variant
                        includes.
description:            |
                        Proposed by the simplicity and maintainability
                        and the functional suitability and
                        compatibility advocates as one reuse mechanism
                        ruled once across this decision and
                        dec_shape_of_a_variant_family
                        (_sources/four-decisions-argued.md line 794).

