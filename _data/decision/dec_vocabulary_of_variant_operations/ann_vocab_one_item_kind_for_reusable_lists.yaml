title:                  One item kind for every reusable list of operations
brief:                  |
                        One item kind used both as a composite and as
                        an included delta module cuts three mechanisms
                        for one reusable list to two, the built-on
                        parent and the reuse item, with one schema,
                        one interpreter path, one conflict check and
                        one form of two-level origin record. If
                        including built-on variants is upheld in the
                        family decision, the variant itself is the
                        reuse unit and no new kind is needed, so the
                        two decisions should name one reuse unit
                        between them.
description:            |
                        Sources:
                        - One item kind serves inline as a composite
                          and as an included delta module.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml,
                          brief)
                        - Composites and included delta modules would
                          otherwise be two of three mechanisms for one
                          reusable list, with a conflict check built
                          twice.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_three_mechanisms_for_one_reusable_list.yaml,
                          brief)
                        - An element made inside a composite has two
                          origins, which the record must both name.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_composite_traces_through_two_levels.yaml,
                          brief)
                        - The superset Orin variant already holds what
                          its children share.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 18-32)
                        - The owner asks that the variant mechanism be
                          simple and elegant. (owner's statement,
                          2026-10-25T05:45Z,
                          _sources/owner-2026-10-25-morning.md line 5)
                          Strength: strong for simplicity, since the
                          overlap is structural; moderate for
                          functional suitability, which needs the item
                          to state where it applies in each position.

