title:                  Open set of operations through plugins that declare their references
brief:                  |
                        Beyond a core set, a variant operation may be
                        a Python plugin registered with cctool. A
                        plugin's registration declares its schema,
                        which of its fields are references, and the
                        origin records it emits.
description:            |
                        The merge notes found the plugin option silent
                        on reference fields and origin records and
                        proposed this addition
                        (_sources/four-decisions-argued.md line 788).

