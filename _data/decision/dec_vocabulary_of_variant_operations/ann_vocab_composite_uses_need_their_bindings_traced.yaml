title:                  Composite uses whose bindings the origin record must name
brief:                  |
                        Each use of a parameterized composite binds
                        its own values, so two uses give different
                        elements with the same origin unless the
                        origin record names the use and its bindings
                        as well as the composite and the core
                        operation.
description:            |
                        Sources:
                        - Each use of a parameterized composite binds
                          its own values.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_parameterized_composites.yaml,
                          brief)
                        - An element made inside a composite has two
                          origins, which the record must both name.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_composite_traces_through_two_levels.yaml,
                          brief) Strength: moderate; it grows with
                          reuse, and falls away if the origin record
                          carries uses and bindings.

