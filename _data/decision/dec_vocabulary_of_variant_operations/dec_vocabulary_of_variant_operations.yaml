title:                  Vocabulary of variant operations
brief:                  |
                        Is the set of variant operations that a
                        dataflow variant may hold closed, and if not,
                        how is it extended?
description:            |
                        The ruling on how variants are held gives a
                        dataflow variant a base and an ordered list of
                        variant operations, and every check, rename,
                        dictionary upgrade and run-time change set
                        must understand each operation it meets
                        (_sources/variants-framing.md, section 4, Q1).
                        The owner asked on 2026-10-24 for the
                        decisions around variants to be thought
                        through, and the Patrol list of operations
                        lacks two that the open decisions need,
                        inserting a node on an edge and substituting a
                        node (_sources/variants-framing.md, section
                        2).

