title:                  Reusable piece with a graph of its own to check
brief:                  |
                        A reusable piece that is a
                        [[dataflow variant]] has a
                        [[resolved dataflow graph]] of its own, which
                        the checks can cover and a reader can open,
                        before any variant merges it. A reuse item has
                        no graph until applied, so its faults show
                        only in each variant that uses it, under that
                        variant's name.
description:            |
                        Sources:
                        - A reusable piece is a dataflow variant that
                          others merge in.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_merge_as_the_reuse_operation.yaml
                          at brief)
                        - Every dataflow variant has a resolved
                          dataflow graph.
                          (_data/register/reg_concept.yaml at
                          entries.concept_resolved_dataflow_graph.description)
                        - The reuse item is a named ordered list of
                          core operations.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - Maintainability asks how readily a change
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                          Strength: weak to moderate; a piece that
                          attaches to nodes it does not hold fails its
                          own checks, so which checks apply to a piece
                          alone has to be settled, as for a built-on
                          variant.

