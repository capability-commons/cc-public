title:                  Three mechanisms for one reusable list of operations
brief:                  |
                        A composite operation, an included delta item
                        and an abstract intermediate variant are each
                        a named, reusable, ordered list of variant
                        operations, and the Patrol drafts already
                        reuse shared operations through an abstract
                        variant. Upholding both composites and
                        included deltas would give one job three
                        mechanisms and a conflict check to build
                        twice, unless one is defined as the other;
                        either can stand alone.
description:            |
                        Sources:
                        - A composite is "a named, reusable list of
                          core operations" that "adds no semantics of
                          its own".
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml
                          lines 13-18)
                        - An included delta is a named item holding an
                          ordered list of variant operations, applied
                          before the variant's own.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas.yaml
                          lines 13-18)
                        - The abstract Orin variant holds the filter
                          and the two writes its three child variants
                          share.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 18-32;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 29-32)
                        - The ruling allows a variant to be the base
                          of another.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-18)
                        - Houdini digital assets, the model named for
                          composites, carry promoted parameters.
                          (_sources/variants-framing.md line 24;
                          https://sidefx.com/docs/houdini/assets/intro.html)
                          ASSUMPTION: without parameters a composite
                          differs from an included delta only in where
                          it is invoked.
                        - Order and conflicts between included units
                          must be checked.
                          (_sources/survey/product-lines.md line 323;
                          _sources/survey/README.md lines 65-68)
                          Strength: strong for simplicity, moderate
                          for functional suitability; the overlap is
                          structural and does not depend on the number
                          of variants.

