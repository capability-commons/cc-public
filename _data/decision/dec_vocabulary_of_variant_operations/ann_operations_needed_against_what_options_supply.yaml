title:                  Operations Patrol needs against what each option supplies
brief:                  |
                        The Patrol drafts use seven operations, and
                        the open decisions need two more, inserting a
                        node on an edge and substituting a node. A
                        closed set supplies each as one schema change,
                        which the growth ruling admits once a real
                        instance uses it; plugins supply one quickest,
                        with no change to the core schema but with no
                        checks unless the plugin brings its own; a
                        composite cannot supply one, since it adds no
                        semantics, so under that option the two must
                        still enter the core.
description:            |
                        Sources:
                        - The Patrol drafts use filter, write, host,
                          os_process, place, add and join.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - The Patrol list has no insert-on-edge and no
                          substitute, which the decisions on engine
                          behavior and on node version swaps need.
                          (_sources/variants-framing.md lines 47
                          and 50)
                        - A composite adds no semantics of its own.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml
                          lines 13-18)
                        - Under the closed set a new operation is a
                          change to the schema.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_set_of_variant_operations.yaml
                          lines 13-16)
                        - A type, field or command is added only when
                          a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml
                          lines 12-17)
                        - ASSUMPTION: the core changes rarely, about
                          once per new kind of edit. Strength:
                          moderate; it weakens if the core must grow
                          often, for example if each peer runtime
                          wants operations of its own.

