title:                  One merge operation for a partner instead of an include mechanism
brief:                  |
                        A partner that implements the closed core
                        implements one more [[variant operation]], a
                        keyed merge with preconditions, and reads
                        every reusable piece as an ordinary
                        [[dataflow variant]]; with the one reuse item
                        it also reads a second item kind and expands
                        it both inline and as an include. A keyed
                        merge over the whole graph is, though, more to
                        implement than the stock add, remove and
                        replace of JSON Patch.
description:            |
                        Sources:
                        - The core is closed, one of its operations is
                          merge, and there is no separate reuse item.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_merge_as_the_reuse_operation.yaml
                          at brief)
                        - The reuse item serves as a composite within
                          a variant's own list and as a delta module
                          that a variant includes.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - A closed vocabulary is a format a partner
                          can implement from its specification, as
                          JSON Patch is.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_closed_vocabulary_a_partner_can_implement.yaml
                          at brief)
                        - Kustomize tracks a resource by its original
                          id, and refuses a generated resource whose
                          id a base already holds unless its behavior
                          is merge or replace.
                          (https://github.com/kubernetes-sigs/kustomize/issues/4829)
                        - Compatibility asks what a partner must adopt
                          to read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2)
                          Strength: weak to moderate; both options are
                          closed, so the difference is one item kind
                          against one harder operation.

