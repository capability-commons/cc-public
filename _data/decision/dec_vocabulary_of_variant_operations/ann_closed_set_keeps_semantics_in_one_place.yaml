title:                  One home for the semantics of a closed set
brief:                  |
                        The throwaway resolver interprets all seven
                        operation kinds the drafts use in about forty
                        lines of one function, so a closed set is
                        small enough to hold in one place. Plugins add
                        a registration mechanism, and each plugin
                        brings its own schema and semantics as a
                        further mechanism.
description:            |
                        Sources:
                        - The sketch resolver handles filter, write,
                          host, os_process, place, add and join in
                          lines 24-67.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py)
                        - The drafts use exactly those seven kinds.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - A plugin supplies the operation's schema and
                          semantics beyond a core set.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_open_operations_through_plugins.yaml
                          lines 13-16)
                        - The measure for simplicity counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: strong against plugins at ten
                          times the variants, since plugins grow with
                          users; moderate as support for a closed set,
                          which would also grow with ten times the
                          kinds.

