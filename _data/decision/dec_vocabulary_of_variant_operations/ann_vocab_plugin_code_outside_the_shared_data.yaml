title:                  Declared plugins whose effects stay in Python code
brief:                  |
                        Plugins that declare their references fix
                        renames, but their effects remain Python code:
                        every partner who resolves a variant must
                        install it, a runtime check of change sets in
                        C++ cannot run it, and no conflict table can
                        include a kind it does not know.
description:            |
                        Sources:
                        - The declared-plugin option keeps the plugin
                          as Python registered with cctool.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_open_operations_through_declared_plugins.yaml,
                          brief)
                        - One open option checks change sets in C++ in
                          the runtime.
                          (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml,
                          brief)
                        - A pairwise conflict table is finite for a
                          closed vocabulary.
                          (_sources/survey/generative-and-transforms.md
                          line 114)
                        - One compatibility measure is the number of
                          tools a partner must install.
                          (_data/register/reg_concern.yaml at entries.concern_compatibility.measure.1)
                          Strength: strong; each plugin and each
                          partner multiplies what must be installed
                          and what the checks cannot see.

