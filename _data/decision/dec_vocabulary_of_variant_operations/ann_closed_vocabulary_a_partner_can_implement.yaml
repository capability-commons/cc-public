title:                  A closed vocabulary a partner can implement from its specification
brief:                  |
                        A closed set of operations is a format a
                        partner can read and apply with its own code,
                        as JSON Patch and the change classes of SED-ML
                        are. Plugins make each variant depend on
                        Python code that every partner must install
                        into its own environment, alongside
                        cc-public's own pins, before it can resolve or
                        check the variant.
description:            |
                        Sources:
                        - JSON Patch defines a fixed set of operations
                          that any implementation applies to any JSON
                          document.
                          (https://www.rfc-editor.org/rfc/rfc6902)
                        - SED-ML applies a fixed set of change classes
                          to a referenced model before simulation, in
                          a format that is not specific to particular
                          simulation tools. (https://sed-ml.org/,
                          Model section)
                        - Guix exposes package variants as a closed
                          set of named transformations with string
                          arguments.
                          (https://guix.gnu.org/manual/en/html_node/Defining-Package-Variants.html,
                          as summarized in
                          _sources/survey/generative-and-transforms.md
                          lines 62-63)
                        - A plugin supplies the operation's schema and
                          semantics.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_open_operations_through_plugins.yaml at brief)
                        - Peers take cc-public as a versioned package,
                          which already shares the partner's
                          environment and its version pins.
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml at title and brief;
                          _data/decision/dec_how_peers_get_cc_public/ann_package_shares_partner_environment.yaml at title, brief and description)
                        - Composites expand to core operations held as
                          data in the graph.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml at brief) Strength: strong; each new peer
                          or partner multiplies the tools that must be
                          installed. (_data/register/reg_concern.yaml at entries.concern_compatibility.measure)

