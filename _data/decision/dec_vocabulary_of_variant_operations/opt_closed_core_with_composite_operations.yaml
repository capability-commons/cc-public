title:                  Closed core of operations with composite operations
brief:                  |
                        A closed core of variant operations is fixed
                        in the schema, and a composite operation is a
                        named, reusable list of core operations, much
                        as a Houdini digital asset packages a
                        sub-network. A composite adds no semantics of
                        its own.

