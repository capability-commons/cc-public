title:                  Draft hook failure that no-verify cannot skip
brief:                  |
                        A failing prepare-commit-msg aborts the commit
                        even with --no-verify and leaves a merge or
                        revert half done. The draft catches only two
                        exception types, so a fault in the tool or a
                        staged file can block every merge and revert.
description:            |
                        Test with git 2.43.0: a prepare-commit-msg
                        that exits 1 stops git commit --no-verify; git
                        merge prints "Not committing merge"; git
                        revert leaves MERGE_MSG and a staged change.
                        The hook runs pixi run --frozen cctool message
                        draft on every commit
                        (.githooks/prepare-commit-msg). For a merge or
                        revert the draft extracts facts from HEAD and
                        the staged tree (src/cctool/commit/change.py
                        within check and is_commit). The command
                        catches only ErrorGate and ErrorDatalog
                        (src/cctool/cli/messaging.py within draft),
                        though its stated intent is to report and
                        leave the message (lines 122-124). Extraction
                        calls YAML.load and ast.parse with no handler
                        (src/cctool/graph/extract.py within
                        Unreadable, is_document and extract), and the
                        branch lookup runs git rev-parse with
                        check=True (message.py within _branch). Bypass
                        by git -c core.hooksPath=/dev/null commit is
                        not in README.md or AGENTS.md. Under hand
                        writing, --no-verify skips commit-msg
                        (README.md#getting-started;
                        AGENTS.md#working-beside-other-agents).
                        ASSUMPTION: for a merge the gate in
                        pre-merge-commit reports an unparseable item
                        first; not checked. A revert runs no gate. The
                        fix is small: catch broadly, leave the
                        message, exit 0.

