title:                  Hand-written items that restate git's words
brief:                  |
                        Writing each merge or revert item by hand
                        makes the author type a full item for content
                        already reviewed in its own commits. The
                        reviewer gets more text but nothing more that
                        is checked.
description:            |
                        A conforming message holds a YAML item between
                        --- and ... lines (commit messages of e25acf9
                        and 4e6db4c). The sch_commit title pattern
                        fixes the subject to git's own wording: Merge
                        ... into ..., Revert "TITLE" or Reapply
                        "TITLE" (_data/schema/sch_commit.yaml, title
                        pattern, as of 4e6db4c). git revert drafts
                        Revert "TITLE" and "This reverts commit HASH."
                        (https://git-scm.com/docs/git-revert).
                        ASSUMPTION: a hand-written item would mostly
                        restate these words. Weakens if merges come to
                        carry conflict resolution that only the author
                        can describe.

