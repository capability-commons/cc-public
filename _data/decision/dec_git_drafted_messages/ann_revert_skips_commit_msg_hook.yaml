title:                  Revert seen by no commit-time check
brief:                  |
                        git runs prepare-commit-msg for a revert but
                        not commit-msg, so a revert left with git's
                        draft is caught only later, when the fix is a
                        rewrite of history. The hook fixes the message
                        at the one point git offers.
description:            |
                        Test with git 2.43.0 in a scratch repository:
                        git revert --no-edit HEAD and GIT_EDITOR=true
                        git revert HEAD ran prepare-commit-msg and
                        neither pre-commit nor commit-msg. git merge
                        --no-edit ran pre-merge-commit,
                        prepare-commit-msg and commit-msg. ASSUMPTION:
                        WTP's git behaves the same; his version is not
                        recorded. .githooks/commit-msg line 29 runs
                        cctool message check. The pre-push hook that
                        runs cctool history check came in 18d6181
                        (2026-10-14), after 4e6db4c, and it refuses a
                        push but does not change commits
                        (.githooks/pre-push lines 19-28). README.md
                        lines 45-51 imply, and memory/MEMORY.md line
                        46 says, that commit-msg checks the drafted
                        revert message, which the test does not show.

