title:                  Draft built on the existing composer and check
brief:                  |
                        draft builds its message with the same compose
                        function as cctool message new and runs the
                        same change check as the commit-msg hook. So
                        it adds no second composer and no second
                        checker, only the conversion step and the
                        hook.
description:            |
                        src/cc_public/commit/message.py lines 167 and
                        179; src/cc_public/cli/messaging.py line 102.
                        Stated by the simplicity advocate as a
                        counterpoint.

