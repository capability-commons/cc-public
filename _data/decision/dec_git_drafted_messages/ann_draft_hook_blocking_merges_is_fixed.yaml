title:                  Draft hook no longer able to stop a commit
brief:                  |
                        Commit 2e06752 "Fix the draft hook so that it
                        never stops a merge or a revert" makes the
                        draft command catch every error and the hook
                        always exit 0. At 360ec14 a fault in the draft
                        leaves git's message for the commit-msg hook
                        to judge.
description:            |
                        message draft catches Exception, prints "No
                        draft" and leaves the message
                        (src/cctool/cli/messaging.py lines 130-135 at
                        360ec14). The hook runs the command with "||
                        echo" and then "exit 0"
                        (.githooks/prepare-commit-msg lines 28-35).
                        This is the fix the annotation named.

