title:                  Reverted commit named only by a git hash
brief:                  |
                        The drafted revert item names the commit it
                        undoes only by git's hash and a quoted title
                        that may be cut short, with no link to the
                        reverted commit item. A hash can dangle after
                        a history rewrite.
description:            |
                        compose always writes relation as an empty
                        list (src/cc_public/commit/message.py line
                        128). The revert brief is "This reverts commit
                        1234567."
                        (src/cc_public/commit/_test/test_draft.py
                        lines 114-116). _fitted cuts a long title and
                        adds "..." (message.py lines 200-214). No
                        relation in reg_relation.yaml has t_commit in
                        its domain, so neither alternative can record
                        a typed edge today; the gap is shared with
                        hand-written messages. Hashes were rewritten
                        once already by the squash (memory/MEMORY.md
                        line 42). ASSUMPTION: an author writing by
                        hand might name the commit item id in prose;
                        nothing shows this.

