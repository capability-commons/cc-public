title:                  Removals and renames named from the graph
brief:                  |
                        The drafted item names each id a merge or
                        revert removes or renames, computed from the
                        graph. So the reviewer reads the list in the
                        message, and each removal traces to its commit
                        with no step left to the author.
description:            |
                        draft runs the change check and writes "It
                        removes ..." and "It renames ... to ..." into
                        the description (src/cctool/commit/message.py
                        lines 167-180). The revert test expects such a
                        line and a passing message
                        (src/cctool/commit/_test/test_draft.py lines
                        106-118). The checks unannounced_removal and
                        unannounced_rename refuse a commit that does
                        not name them (src/cctool/commit/change.lp
                        lines 122-146), so by hand the author must
                        find and type the same ids. Where the check
                        runs both alternatives end with the same
                        mentions; the gain is in reaching that state
                        reliably. The mention is a bare id in prose,
                        not a typed edge. ASSUMPTION: a revert of a
                        large commit removes many items.

