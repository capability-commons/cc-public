title:                  Git drafts made to conform by the hook
brief:                  |
                        The prepare-commit-msg hook turns the merge
                        and revert messages git drafts into messages
                        that conform to the system; this was the
                        maintainer's reason.
description:            |
                        Maintainer's statements: "How do we handle the
                        default merge and revert messages? Do we want
                        to use the prepare-commit-msg hook to ensure
                        they conform to our system?"
                        (2026-10-14T14:07:40Z). "Are you proposing to
                        turn git's draft into a conforming message
                        using the prepare-commit-msg hook? Or
                        something else?" (14:12:02Z). "OK. Proceed.
                        Thank you." (14:12:20Z). Made in e25acf9 and
                        4e6db4c.

