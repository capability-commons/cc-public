title:                  Commit edges governed by constraints, not domains
brief:                  |
                        ann_revert_names_target_by_git_hash says no
                        relation has type_commit in its domain.
                        Relations have no domain now: their ends are
                        governed by relation constraints over roles.
                        Its conclusion still holds, as no relation can
                        link a commit to another commit.
description:            |
                        _data/register/reg_relation.yaml holds no
                        domain or range field. Each relation names
                        constraints on its ends with
                        relation_constrains_source and
                        relation_constrains_target, as ruled in
                        ruling_relation_end_governance. An end with no
                        constraint is open
                        (opt_unconstrained_end_is_open), and
                        constraint_violation in
                        src/cctool/check/check.lp (lines 1065-1075)
                        checks the rest. type_commit plays no role
                        (its only edge names sch_commit), so a commit
                        can be the source only of relation_cites and
                        relation_uses_concept, the two relations with
                        no source constraint. Their targets must play
                        the proxy or concept role, so neither can
                        reach a commit. Found in the review of
                        2026-10-22.

