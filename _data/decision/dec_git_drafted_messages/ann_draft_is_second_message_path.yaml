title:                  Second path that writes commit items
brief:                  |
                        The hook adds a second path that produces
                        commit items, beside cctool message new, for
                        one class of commit. Writing merges and
                        reverts with cctool message new adds no
                        mechanism.
description:            |
                        cctool message new composes and checks an item
                        for any title built from a sch_commit template
                        (src/cctool/cli/messaging.py within new). The
                        Merge and Revert templates came in e25acf9,
                        before the hook question, so either
                        alternative can use them. 4e6db4c adds a third
                        hook file (five exist now, after 17de2f5 and
                        18d6181), a third cctool message subcommand,
                        and about 110 lines in message.py with three
                        new regular expressions (git show --stat
                        4e6db4c).
                        AGENTS.md#working-beside-other-agents now give
                        two rules for writing a message.

