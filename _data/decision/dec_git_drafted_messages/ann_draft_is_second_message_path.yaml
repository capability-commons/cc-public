title:                  Second path that writes commit items
brief:                  |
                        The hook adds a second path that produces
                        commit items, beside cctool message new, for
                        one class of commit. Writing merges and
                        reverts with cctool message new adds no
                        mechanism.
description:            |
                        cctool message new composes and checks an item
                        for any title built from a sch_commit template
                        (src/cc_public/cli/messaging.py lines 60-78).
                        The Merge and Revert templates came in e25acf9
                        (12:49:58Z), before the hook question at
                        14:07:40Z, so either alternative can use them.
                        4e6db4c adds a third hook file (five exist
                        now, after 17de2f5 and 18d6181), a third
                        cctool message subcommand, and about 110 lines
                        in message.py with three new regular
                        expressions (git show --stat 4e6db4c).
                        AGENTS.md lines 16-24 now give two rules for
                        writing a message.

