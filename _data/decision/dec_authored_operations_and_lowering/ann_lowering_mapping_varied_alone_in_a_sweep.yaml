title:                  A mapping that a sweep can vary alone
brief:                  |
                        The four-stage option keeps the mapping apart
                        from the application, so a sweep can vary
                        placement alone and explore mappings over one
                        application, as the Y-chart tools do. That
                        works where every application operation can
                        come before every mapping operation.
description:            |
                        Sources:
                        - Daedalus keeps application, platform and
                          mapping as three separate specifications, so
                          mappings can be explored apart.
                          (https://staff.fnwi.uva.nl/a.d.pimentel/artemis/SAMOS08-Daedalus.pdf,
                          as summarized in
                          _sources/survey/generative-and-transforms.md
                          lines 90-91)
                        - The mapping stage lets a sweep vary one
                          axis. (_sources/survey/README.md lines
                          73-76) Strength: moderate; it grows with
                          sweeps over placement, and depends on how
                          often an application choice follows a
                          mapping choice.

