title:                  Placement swept without a stage of its own
brief:                  |
                        A sweep can vary only the host and place
                        operations of a variant while its other
                        operations stay fixed, so exploring mappings
                        over one application needs no separate mapping
                        stage. Each run item names its variant and
                        resolved digest, so a run whose placement
                        alone changed is told apart by its variant's
                        operations, which leaves the four-stage
                        option's separate mapping digest a convenience
                        rather than a need, and spares a stage that
                        the Patrol drafts could not keep in order.
description:            |
                        Sources:
                        - A sweep item holds a dataflow variant with
                          declared parameters and the values to try,
                          and cctool generates one resolved dataflow
                          graph per point.
                          (_data/decision/dec_parameters_of_a_variant/opt_sweep_items_generate_unstored_variants.yaml
                          at brief)
                        - A dataflow run names its variant and
                          resolved digest.
                          (_data/decision/dec_shape_of_a_dataflow_run/opt_run_item_in_the_tree.yaml
                          at brief)
                        - The Patrol drafts mix application and
                          mapping operations in one variant.
                          (_data/decision/dec_authored_operations_and_lowering/ann_lowering_stage_cannot_follow_operation_kind.yaml
                          at brief)
                        - Drawn from the tutorial on lowering written
                          for WTP on 2026-10-29, whose recommendation
                          WTP followed (WTP, 2026-10-29). Strength: moderate; it
                          answers the two arguments for the four-stage
                          option rather than adding a new benefit.

