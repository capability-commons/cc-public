title:                  A lowered graph that must be checked again
brief:                  |
                        In Patrol the kind of an edge, and so the
                        adapter that lowering inserts, follows from
                        the runtimes at its two ends and whether they
                        share a process or host, so lowering must run
                        after the mapping, and its output can break a
                        check. Both staged options check the lowered
                        graph, and the four-stage option also gives it
                        a digest; the separate-passes option does not
                        say that the lowered graph is checked.
description:            |
                        Sources:
                        - The kind of an edge, and what realizes it,
                          follows from the runtimes at its two ends
                          and whether they share an OS process or
                          host.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 40-51)
                        - Place makes edges cross processes and hosts.
                          (_sources/cc-patrol-notes/variants.md
                          line 66)
                        - An adapter inserted by lowering must appear
                          in the lowered graph and its digest, or two
                          runs that differ only in an adapter are
                          mistaken for runs of one graph.
                          (_sources/survey/simulation-backed-decisions.md
                          line 185)
                        - The separate-passes option says the passes
                          run on the resolved graph and does not say
                          their output is checked.
                          (_data/decision/dec_authored_operations_and_lowering/opt_lowering_as_separate_passes.yaml,
                          brief) The one-vocabulary option checks the
                          lowered graph again, and the four-stage
                          option checks and digests each stage.
                          (opt_one_vocabulary_for_authoring_and_lowering.yaml
                          and
                          opt_four_stages_with_the_mapping_split_out.yaml
                          in the same folder, briefs) Strength:
                          strong; adapters grow with edges that cross
                          runtimes and hosts.

