title:                  A digest for each layer a run depends on
brief:                  |
                        Four named stages give a run a digest for the
                        mapped graph and the lowered graph, so a run
                        traces to the exact mapping it used. With two
                        stages a host or placement change and an
                        application change move the same digest, and
                        separate passes give the lowered graph no
                        named digest.
description:            |
                        Sources:
                        - The four-stage option names and digests each
                          stage.
                          (_data/decision/dec_authored_operations_and_lowering/opt_four_stages_with_the_mapping_split_out.yaml,
                          brief)
                        - Patrol's operations split into application
                          kinds, filter, add, join and write, and
                          mapping kinds, host, OS process and place.
                          (_sources/variants-framing.md lines 25-27;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 22-35)
                        - The one-vocabulary option checks two graphs,
                          the resolved and the lowered.
                          (_data/decision/dec_authored_operations_and_lowering/opt_one_vocabulary_for_authoring_and_lowering.yaml,
                          brief) Strength: moderate; it grows with
                          sweeps that vary only the mapping, and is
                          mild against the one-vocabulary option.

