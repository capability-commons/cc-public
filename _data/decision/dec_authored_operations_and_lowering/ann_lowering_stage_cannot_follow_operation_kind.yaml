title:                  Application and mapping choices mixed in one variant
brief:                  |
                        A separate mapping stage means each operation
                        is assigned to the application or the mapping
                        stage, but the drafts mix them: the abstract
                        Orin variant uses write both for a hostname
                        and for a node setting, a parent's mapping
                        write comes before its child's application
                        filter, and the mixed variant's filter drops
                        edges because of where the console is placed.
                        Stage then cannot follow operation kind,
                        chains would be reordered across variants, the
                        unplaced check cannot run before mapping, and
                        one more stage with its digest and checks must
                        be kept.
description:            |
                        Sources:
                        - The mapped graph comes from the host, OS
                          process and placement operations.
                          (_data/decision/dec_authored_operations_and_lowering/opt_four_stages_with_the_mapping_split_out.yaml,
                          brief)
                        - The abstract Orin variant writes the station
                          hostname, a mapping value, and the analysis
                          profile, an application value, with the same
                          operation kind, and its mixed child filters
                          after it.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 26-32;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 18-35)
                        - The direct result edges are dropped in the
                          mixed variant because the console reads the
                          published track stream.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 82-85)
                        - The unplaced check fails a node or OS
                          process that is not placed.
                          (src/cctool/check/check.lp lines 3517-3524)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: moderate; the extra stage is a
                          fixed cost, and the weight rests on how
                          often operations mix, which Patrol shows in
                          three of six variants.

