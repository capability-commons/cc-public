title:                  One vocabulary for authoring and lowering
brief:                  |
                        Generated transforms are written as variant
                        operations, applied by the same interpreter as
                        authored ones, with the resolved graph checked
                        and the lowered graph checked again. Ruled by
                        WTP on 2026-10-29, as recommended after the
                        tutorial on lowering. The reasons: the Patrol
                        drafts already mix application and mapping
                        operations in one variant, which the
                        four-stage option forbids; a sweep can vary
                        placement alone without a stage of its own;
                        and every generated sender, receiver, adapter
                        and tap gets an origin record naming the edge
                        and declaration behind it, which separate code
                        passes would not give.

