title:                  One interpreter for authored and generated rewrites
brief:                  |
                        A lowering pass and a variant operation both
                        rewrite a graph. Written as variant
                        operations, edge-policy lowering and recorder
                        taps get one interpreter, one set of checks,
                        and the preconditions, origin records, naming
                        and failure reports that exist for authored
                        variants; separate code passes give the job a
                        second mechanism, each needing its own way to
                        fail and to name what it made, and leave a
                        lowered adapter tracing only to code outside
                        the graph.
description:            |
                        Sources:
                        - The edge-policy and engine-behavior
                          transforms do to a resolved graph what
                          variant operations do to a base.
                          (_data/decision/dec_authored_operations_and_lowering/dec_authored_operations_and_lowering.yaml,
                          description; _sources/variants-framing.md
                          lines 53-54)
                        - A lowered adapter is an element with no
                          traced reason unless its id or a recorded
                          link names the edge and the policy.
                          (_data/decision/dec_edge_policy/ann_lowered_adapter_nodes_need_a_naming_rule.yaml
                          lines 13-26)
                        - The survey proposes preconditions and an
                          origin trace for each operation.
                          (_sources/survey/README.md lines 45-48)
                        - Separate passes run as tooling or generator
                          code.
                          (_data/decision/dec_authored_operations_and_lowering/opt_lowering_as_separate_passes.yaml,
                          brief)
                        - The simplicity measure counts jobs done by
                          more than one mechanism.
                          (_data/register/reg_concern.yaml line 490)
                          Strength: strong; each new lowering pass
                          repeats the cost under separate passes, and
                          adapters multiply with edges, policies and
                          cross-host placements. The same holds for
                          the four-stage option if its generated
                          transforms are variant operations, which it
                          does not say.

