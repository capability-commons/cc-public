title:                  Lowering written in the vocabulary that is exchanged
brief:                  |
                        Variant operations are a closed core that any
                        tool reading variants already understands.
                        Lowering written in that core is data in the
                        same vocabulary as the variants it lowers, so
                        a partner's tool or a second engine can read,
                        replay or inspect what was inserted and why.
                        Lowering written as separate passes in cctool
                        exists only as code, so another tool can
                        reproduce the lowered graph only by running
                        cctool or porting its passes.
description:            |
                        Sources:
                        - The variant operations are a closed core,
                          and the delta module is the one item kind
                          for reuse.
                          (_data/decision/dec_vocabulary_of_variant_operations/ruling_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - Separate passes run as tooling or generator
                          code.
                          (_data/decision/dec_authored_operations_and_lowering/opt_lowering_as_separate_passes.yaml
                          at brief) ASSUMPTION: graphs and variants
                          will cross between federated segments, as
                          the argument
                          ann_received_graph_parsed_not_executed also
                          assumes. Strength: moderate; it grows with
                          the number of tools and partners that read
                          lowered graphs.

