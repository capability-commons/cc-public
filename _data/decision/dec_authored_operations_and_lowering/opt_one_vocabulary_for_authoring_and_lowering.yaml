title:                  One vocabulary in two stages
brief:                  |
                        Generated transforms are written as variant
                        operations. The resolved dataflow graph, from
                        the authored operations, is checked, and the
                        lowered graph, from the generated ones, is
                        checked again and is what the engine receives.
description:            |
                        In plain terms: the rewrites cctool generates,
                        such as inserting transport or recorder nodes,
                        are written with the same operations an author
                        uses to make a variant, so one interpreter
                        applies both and one trace shows both. The
                        graph is checked once as authored and once as
                        lowered.

