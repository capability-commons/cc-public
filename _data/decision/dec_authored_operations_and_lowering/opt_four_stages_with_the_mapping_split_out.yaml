title:                  Four stages with the mapping split out
brief:                  |
                        Authored items pass through named stages, each
                        checked and given a digest: the resolved
                        dataflow graph from the application
                        operations, a mapped graph from the host, OS
                        process and placement operations, a lowered
                        graph from generated transforms such as edge
                        policies and recorder taps, and the engine
                        schedule. The mapping of the Y-chart is a
                        stage of its own, apart from the application.
description:            |
                        Survey idea 10 (_sources/survey/README.md
                        lines 73-76), from the SDF3 flow and
                        Daedalus's separate application, platform and
                        mapping specifications
                        (_sources/survey/generative-and-transforms.md
                        line 124).

