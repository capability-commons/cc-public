title:                  Subset of CSL-JSON fields
brief:                  |
                        An external document may have the CSL-JSON
                        fields author (family and given names),
                        issued, container-title, volume, issue and
                        page, each written only where the document
                        prints it. The citation stays in the brief.
                        The formatter learns to lay out a sequence
                        inside a sequence, so that issued keeps the
                        CSL-JSON date-parts form.
description:            |
                        The proposal of the first corpus of reading
                        notes (2026-10-28), which leaves issued out of
                        its items until the formatter change is made.

