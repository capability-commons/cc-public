title:                  Bibliographic fields of an external document
brief:                  |
                        Does an external document hold its authors,
                        date and venue as fields, and if so under
                        which names?
description:            |
                        Today the citation is prose in the brief, with
                        optional identifiers such as a DOI. A corpus
                        of papers would let tools sort, match and
                        export citations if these were fields. The
                        cctool formatter refuses a sequence directly
                        inside a sequence, which the CSL-JSON form of
                        a date uses.

