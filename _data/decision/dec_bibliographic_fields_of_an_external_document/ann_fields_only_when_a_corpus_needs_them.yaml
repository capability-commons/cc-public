title:                  Fields only when a corpus needs them
brief:                  |
                        The repository adds a field only when a real
                        instance needs it. The corpus of reading notes
                        is such an instance: 22 papers already, with
                        authors and venues that matching against the
                        earlier notes needed. Prose in the brief
                        cannot be matched without parsing, while
                        optional fields cost nothing to items that
                        leave them out, such as standards and user
                        guides.
description:            |
                        Sources:
                        - The first corpus matched its 22 papers
                          against 67 earlier notes by work, and
                          reports bibliographic details as printed or
                          inferred (first-corpus README and
                          comparison, 2026-10-28).

