title:                  CSL-JSON as the interchange standard for citations
brief:                  |
                        CSL-JSON is the input of the Citation Style
                        Language processors and the export of
                        reference managers such as Zotero, and it
                        gives authors as structured names and dates as
                        parts, which BibTeX gives only as strings to
                        be parsed. A subset with its own names lets a
                        partner tool read the fields as they are. The
                        cost is one formatter change, for the nested
                        sequence of a date.
description:            |
                        Sources:
                        - Citation Style Language, CSL-JSON schema.
                          https://citeproc-js.readthedocs.io/en/latest/csl-json/markup.html
                        - The cctool formatter refuses nested
                          sequences. (src/cctool/check/layout.py at
                          Unsupported)

