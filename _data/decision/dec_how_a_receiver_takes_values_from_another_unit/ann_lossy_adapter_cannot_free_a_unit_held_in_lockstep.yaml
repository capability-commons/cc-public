title:                  Lossy adapter that cannot free a unit held in lockstep
brief:                  |
                        When every crossing waits for one message, a
                        keep-latest or fold adapter placed before the
                        sender or after the receiver sees exactly one
                        message per local step, so it has nothing to
                        choose among, and the faster unit is held to
                        the slower one's period. The trial built this
                        arrangement and measured it: a 2 ms unit
                        feeding a 20 ms unit through a keep-latest
                        edge ran 104 local steps in 2 s with 99
                        overruns, and the reader got every value in
                        order. Those false overruns can drive the mode
                        controller into the ruled degraded mode with
                        no fault, and a placement variant that puts a
                        source's reader in a slower unit silently
                        changes the source's sampling rate. Letting
                        the delivery policy decide whether a receiver
                        waits removes all three effects on the edges
                        whose policy allows loss.
description:            |
                        Sources:
                        - The option on every crossing confines a
                          lossy policy to an
                          adapter before the sender or after the receiver.
                          (_data/decision/dec_how_a_receiver_takes_values_from_another_unit/opt_every_crossing_waits_for_one_message.yaml
                          at brief)
                        - The trial's lowering placed the keep-latest
                          adapter in the unit
                          of the target and then made the crossing lossless, so the
                          adapter sat after a waiting receiver. (trial 2c777ab9,
                          src/cctool/dataflow/lower.py, functions _adapt and _transports)
                        - Measured: u1 at 2 ms ran 104 local steps
                          with 99 overruns in
                          2 s, and u2 at 20 ms read 30, 33, 36 and so on, one value per
                          local step, in order. (review of 2026-10-29, CC-011, and its
                          area report trial-engine, TE-11)
                        - In another variant u1 at 10 ms was held
                          close to the 100 ms
                          period of u2, 24 local steps in 2 s, its sensor was in effect
                          sampled at that period, and no check warned. (review of
                          2026-10-29, area report trial-model, TM-14)
                        - The overruns can drive the mode controller
                          into degraded mode
                          with no fault. (review of 2026-10-29, CC-011)
                        - Degraded mode is for steps consistently over
                          their period,
                          triggered by a control node that watches queue sizes or
                          temperature. (WTP, 2026-10-28) The mode controller raises it
                          when local steps consistently overrun their period.
                          (_data/interface_control_document/icd_dataflow_mode_controller.yaml
                          at brief)
                        - A latest-value edge gives the reader only
                          the value that
                          arrived last when several arrive in one local step.
                          (_data/requirement/rqt_adapter_latest_value.yaml at condition
                          and object) Under lockstep no more than one ever arrives.
                        - Variants for a number of cores are generated
                          by allocating
                          nodes to processes and processes to cores.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        Strength: strong; it is reproduced, and it
                        holds for any graph whose connected units
                        differ in period. It weakens only if every set
                        of connected units must share one period, as
                        the argument on a shared period asks.

