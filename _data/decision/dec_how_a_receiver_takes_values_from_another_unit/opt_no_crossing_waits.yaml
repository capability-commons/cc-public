title:                  No crossing waits
brief:                  |
                        No receiver waits. Each crossing gives the
                        latest message that has arrived, or an empty
                        one, so units never hold each other back. What
                        one unit reads from another depends on timing,
                        and only the recording of arrivals makes a run
                        repeatable.

