title:                  Lossy receiver that replay must record as an input
brief:                  |
                        A receiver that turns whatever has arrived
                        into a step's token gives values that depend
                        on timing, so for replay and for comparing
                        runs it is an input, like a sensor: its output
                        must be recorded in each local step and played
                        back in its place. The trial recorded for
                        replay only the outputs of sources and control
                        blocks, which is enough only while every
                        crossing waits. Under the delivery-policy
                        option the recording must also take every
                        lossy receiver, a cost in proportion to the
                        lossy crossings an author declares. With no
                        waiting at all it must take every receiver,
                        and a run is repeatable only given its
                        recording.
description:            |
                        Sources:
                        - Kahn and MacQueen left out any test of
                          whether input is
                          available, on purpose, to keep input and output free of
                          timing. (Kahn and MacQueen 1977, Coroutines and networks of
                          parallel processes, section 2.3)
                        - The time at which an outside event is taken
                          in counts as part
                          of the program's input, and making a system nondeterministic
                          should be the designer's choice. (Lohstroh et al. 2021, Toward
                          a Lingua Franca for deterministic concurrent systems, sections
                          5 and 6)
                        - For replay the trial records every output of
                          a source node and
                          of a unit's control block, and nothing at receivers.
                          (trial 2c777ab9, src/cctool/dataflow/lower.py, function
                          _ends_recorded)
                        - A player delivers in each local step exactly
                          what was recorded
                          for it. (_data/requirement/rqt_player_replays_exactly.yaml at
                          object)
                        - What one unit reads from another depends on
                          timing, and only
                          the recording of arrivals makes a run repeatable.
                          (_data/decision/dec_how_a_receiver_takes_values_from_another_unit/opt_no_crossing_waits.yaml
                          at brief)
                        Strength: moderate; the cost is real code in
                        lowering, the recorder and the player, but
                        under the delivery-policy option it is bounded
                        by the lossy crossings, and none of it arises
                        where every crossing waits.

