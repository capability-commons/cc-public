title:                  Host readings that chain every unit of a host to one unit
brief:                  |
                        Lowering joins the host's control block,
                        placed in the first unit of the host, to the
                        control block of every other unit. If every
                        crossing waits, that edge alone binds every
                        unit to the first: in the trial a 10 ms unit
                        with no user edge to its neighbor was held to
                        about 45 ms by a 50 ms unit, with 38 overruns
                        in 44 local steps. A unit that runs a safety
                        function then inherits every stall and overrun
                        of an unrelated unit, and a delay injected on
                        a waiting crossing into the first unit spreads
                        to every unit of the host. Under the
                        delivery-policy option host readings cross as
                        keep latest and never hold a unit back; with
                        no waiting at all, no crossing does.
description:            |
                        Sources:
                        - Lowering puts the host block in the first
                          unit of the host and
                          joins its readings to each unit's block. (trial 2c777ab9,
                          src/cctool/dataflow/lower.py, function _control_blocks)
                        - The block of a host passes its readings to
                          the blocks of its
                          execution units.
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at description)
                        - Measured: u1 at 10 ms and u2 at 50 ms with
                          no user edge between
                          them; after 2 s u1 had run 44 local steps with 38 overruns.
                          (review of 2026-10-29, CC-011, and area report trial-engine,
                          TE-11)
                        - Host readings cross as keep latest, so they
                          never hold a unit
                          back.
                          (_data/decision/dec_how_a_receiver_takes_values_from_another_unit/opt_delivery_policy_decides_whether_a_receiver_waits.yaml
                          at brief)
                        - Whoever can delay or flood a link between
                          hosts can stretch
                          every step of a consumer that waits on it.
                          (_data/decision/dec_same_step_or_next_step_reading/ann_cross_host_wait_within_a_step_as_an_attack_path.yaml
                          at brief)
                        - Safety is measured by the time to reach a
                          safe state after a
                          failure. (_data/register/reg_concern.yaml at
                          entries.concern_safety.measure)
                        ASSUMPTION: Patrol will place a safety
                        function, such as an obstacle stop, in a unit
                        other than the one that holds the host block.
                        Strength: strong for reliability and safety on
                        any host with more than one unit; for security
                        it matters only where the first unit waits on
                        a link a third party can reach.

