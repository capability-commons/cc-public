title:                  Hangs of the trial that were each a wait at a crossing
brief:                  |
                        The hangs the review reproduced in the trial's
                        runs over two units were each a wait at a
                        crossing: the receivers of a loop across two
                        units at local step 0, a receiver at the end
                        of a bounded run that never ended after a
                        failed local step, and a sender left blocked
                        on a full queue when its reader's unit was
                        stopped. A crossing that never waits cannot
                        hang, so no waiting at all removes this class
                        by construction, and the delivery-policy
                        option removes it on lossy edges. Where every
                        crossing waits all of them remain, and each
                        then needs its own rule, such as priming, a
                        timeout or a mark on a failed step. The price
                        of never waiting is that results depend on
                        timing.
description:            |
                        Sources:
                        - A loop across units passed every check and
                          deadlocked at local
                          step 0 in the receivers' wait. (review of 2026-10-29, CC-003)
                        - After a failed local step a run bounded to 8
                          steps never ended,
                          because the last receiver waited for a message never sent.
                          (review of 2026-10-29, CC-004)
                        - Stopping u2 left u1 blocked in a lossless
                          send while status
                          said it was running. (review of 2026-10-29, CC-047, and area
                          report trial-engine, TE-18)
                        - No receiver waits, so units never hold each
                          other back.
                          (_data/decision/dec_how_a_receiver_takes_values_from_another_unit/opt_no_crossing_waits.yaml
                          at brief)
                        - In a Kahn network with bounded queues a
                          stall in one part need
                          not stop the rest, and a check for global deadlock misses it.
                          (Geilen and Basten 2003, Requirements on the execution of Kahn
                          process networks, section 2)
                        Strength: moderate; the hangs are reproduced,
                        but each also has a fix that keeps the wait,
                        argued on the decisions about loops across
                        units, failed local steps and missing
                        messages.

