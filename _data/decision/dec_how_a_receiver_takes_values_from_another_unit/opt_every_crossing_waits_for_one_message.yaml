title:                  Every crossing waits for one message
brief:                  |
                        Every edge between execution units is
                        lossless. The receiver waits for exactly one
                        message in each local step, so connected units
                        advance together, at the pace of the slowest.
                        A delivery policy that allows loss applies
                        only inside a unit, in an adapter before the
                        sender or after the receiver.

