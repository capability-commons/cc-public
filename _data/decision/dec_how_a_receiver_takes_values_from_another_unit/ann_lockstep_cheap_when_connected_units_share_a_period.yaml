title:                  Lockstep that costs little when connected units share a period
brief:                  |
                        Under WTP's convention of a single step rate,
                        with each message a list of items, units that
                        share one period lose little by waiting: a
                        waiting read never falls more than a step
                        behind, and with start offsets derived as for
                        a strictly periodic schedule it waits only
                        when a unit overruns. Waiting on every
                        crossing keeps each split edge a Kahn queue,
                        so results do not depend on timing, and every
                        transport needs only blocking, ordered
                        delivery. The trial hints at the alternative's
                        cost: its lossy branch existed for the
                        in-process queue only, never ran, and had no
                        counterpart in the TCP transport. The option
                        needs a check that connected units share a
                        period, which the records lack, since each
                        unit's control block declares its own.
description:            |
                        Sources:
                        - Single step rate for the whole Kahn part,
                          with each message a
                          list of items, so Kahn edges are homogeneous synchronous
                          dataflow; occasional overruns are absorbed by the capacity
                          margin. (WTP, 2026-10-28)
                        - In an acyclic graph with periodic input
                          every node can run as
                          a strictly periodic task, with start times and buffer sizes
                          derived in closed form; throughput fell short of the
                          self-timed schedule only for graphs of mismatched rates, which
                          one rate excludes, and the proofs leave loops out. (Bamakhrama
                          and Stefanov 2011, Hard-real-time scheduling of data-dependent
                          tasks in embedded streaming applications, sections 4.2 and 5.2)
                        - Bounded queues keep a Kahn network
                          determinate when a full
                          queue blocks its writer, at the risk of deadlocks the
                          unbounded network would not have. (Geilen and Basten 2003,
                          Requirements on the execution of Kahn process networks,
                          sections 2 to 4)
                        - In the trial the drop branch of the
                          in-process queue was
                          unreachable, and the socket sender ignored the lossless flag
                          altogether. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, function
                          Channel::push; src/cctool/dataflow/engine/nodes/transport.cpp,
                          function Engine::send; review of 2026-10-29, CC-011)
                        - Transport libraries are used only by the
                          sender and the
                          receiver, so each lossy behavior is code written against each
                          library. (_data/requirement/rqt_transport_confines_library.yaml
                          at object)
                        - Each execution unit's control block has its
                          own period.
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at surface.unit.dataflow_step.settings.period)
                        - The review proposed a check or advice on a
                          lossless crossing
                          between units of different periods. (review of 2026-10-29, area
                          report trial-model, TM-14)
                        ASSUMPTION: units that share a period and
                        start at offsets derived as for a strictly
                        periodic schedule find each message already
                        waiting, so a waiting read falls at most a
                        step behind and waits only after an overrun.
                        ASSUMPTION: every transport named so far, a
                        shared-memory queue, ZeroMQ or TCP, offers
                        blocking, ordered delivery with nothing added,
                        while keep latest across a socket needs a
                        non-blocking drain at the receiver and a drop
                        rule at the sender. Strength: moderate; it
                        holds exactly as far as one period per set of
                        connected units holds, which the records leave
                        open.

