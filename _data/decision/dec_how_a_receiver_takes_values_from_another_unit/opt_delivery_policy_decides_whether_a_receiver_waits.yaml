title:                  Delivery policy decides whether a receiver waits
brief:                  |
                        A crossing edge whose delivery policy is
                        lossless waits for one message in each local
                        step. One whose policy allows loss, such as
                        keep latest or a fold, never waits: the
                        receiver turns whatever has arrived since its
                        last local step into that step's token, which
                        may be empty. Host readings cross as keep
                        latest, so they never hold a unit back.

