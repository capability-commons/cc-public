title:                  Where dataflow port declarations live
brief:                  |
                        Several ruled declarations of ports and
                        settings have no field in any schema: the
                        fail-safe on overflow, whether a port can
                        supply a default value, the maximum items per
                        step or the maximum rate, the latest binding
                        time of a setting, and whether an interface
                        requires static nodes. Where are they
                        declared?
description:            |
                        The rulings are
                        ruling_fail_safe_declared_per_port,
                        ruling_default_from_a_port_that_declares_it,
                        ruling_capacity_derived_from_maximum_producer_rates,
                        ruling_latest_binding_time_per_setting and
                        ruling_mutability_on_node_with_interface_limit.
                        A dataflow node realizes the interface control
                        document whose dataflow step surface it
                        presents (sch_dataflow_node), and the ports of
                        that surface carry only a type and whether
                        they are optional
                        (sch_interface_control_document). The trial
                        implementation of 2026-10-29 kept these
                        declarations in files of its own for each kind
                        of node (trial process log, phase 0). Where
                        the binding of a node type to its code lives
                        is open too
                        (dec_where_dataflow_items_are_kept).

