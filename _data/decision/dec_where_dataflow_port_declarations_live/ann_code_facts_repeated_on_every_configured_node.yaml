title:                  Facts about a node's code repeated on every use of it
brief:                  |
                        Whether a port can make a default, the most
                        items a step can write and how a port fails on
                        overflow describe what a node's code does, and
                        the fuzz harness is ruled to be generated once
                        for each node kind and to check each output
                        against its declared maximum. Declared on each
                        configured node, these facts are copied onto
                        every use of the code, supplied by a delta
                        module as a second mechanism for what a type
                        states once, and written again by lowering for
                        every sender, receiver, adapter, recorder and
                        control block it inserts. Two uses of one code
                        could then declare different maxima, and the
                        harness of the kind has no one value to check
                        against.
description:            |
                        Sources:
                        - Each node kind declares, for each of its
                          ports, whether it can
                          supply a default, and a node that can make a default value of a
                          type makes every port of that type able to supply one.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief, upheld by ruling_default_from_a_port_that_declares_it)
                        - The generator writes a harness for each node
                          kind from its
                          declared interface, and the harness checks that each output
                          stays within its declared maximum items.
                          (_data/decision/dec_fuzzing_of_a_single_node/opt_harness_generated_from_the_node_interface.yaml
                          at brief, upheld by ruling_harness_generated_from_the_node_interface)
                        - A fuzz harness is required for each
                          implementation that a
                          dataflow node can use.
                          (_data/requirement/rqt_generator_fuzz_harness.yaml at object)
                        - The delta module is the one item kind for
                          reuse.
                          (_data/decision/dec_vocabulary_of_variant_operations/ruling_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - The trial's lowering added senders,
                          receivers, adapters,
                          recorders and control blocks as ordinary operations, and, as
                          its code reads, took their maxima and rates, and by default
                          their fail-safes, from the files of their kinds. (trial
                          2c777ab9, src/cctool/dataflow/lower.py, functions
                          _control_blocks, _transports, _adapt, _recorders and
                          _output_capacity; src/cctool/dataflow/generate.py, method
                          overflow of class Unit)
                        - WTP wants no clever mechanisms that burden
                          node authors (WTP,
                          2026-10-28), and the literature notes list declaring a port's
                          element type, most items per step and ability to supply a first
                          value as the node author's part.
                          (/mnt/project-files/notes/literature/part-2/README.md, section
                          Node-author burden)
                        - Simplicity counts jobs done by more than one
                          mechanism, and
                          maintainability the parts a change touches.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.1 and
                          entries.concern_maintainability.measure.1)
                        Strength: strong on the repetition and on the
                        harness; it weakens only if delta modules and
                        lowering write every value mechanically, which
                        still leaves two uses free to disagree.

