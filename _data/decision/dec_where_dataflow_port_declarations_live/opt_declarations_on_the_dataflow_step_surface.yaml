title:                  Declarations on the dataflow step surface
brief:                  |
                        The ports and settings of the dataflow step
                        surface of an interface control document gain
                        these fields, so the interface states them for
                        every node that realizes it. A configured node
                        may narrow a value where a ruling allows it,
                        such as the maximum rate of one camera.

