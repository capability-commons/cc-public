title:                  Check of the edge type at connection that every option needs
brief:                  |
                        A receiver built from another version of an
                        edge's type, after one host is rebuilt and
                        deployed on its own, reads plausible but wrong
                        values under any encoding unless something
                        compares the two ends, and the memory option
                        is the only one whose text states such a
                        check. The canonical option converts byte
                        order and padding faithfully, but as worded it
                        would convert one version of a type as if it
                        were another, and CDR without type information
                        does the same. On a safety path an obstacle
                        position that is wrong but looks valid is
                        worse than a connection refused at start. Each
                        option needs the name, version and layout of
                        the edge type checked when the ends connect,
                        and the canonical and standard options should
                        say so.
description:            |
                        Sources:
                        - The memory option checks that both ends were
                          built alike
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/opt_memory_layout_on_the_wire.yaml
                          at brief); neither the canonical nor the standard option names a
                          check
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/opt_canonical_layout_from_the_dictionary.yaml
                          at brief;
                          _data/decision/dec_encoding_of_a_message_between_os_processes/opt_standard_serialization.yaml
                          at brief).
                        - Each type of the dictionary has versions
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          at brief).
                        - The trial's framing had no magic, channel,
                          type or size check
                          (review of 2026-10-29, areas/trial-engine.md, section 3).
                        - A list read wrongly leads a planner to act
                          on a falsehood
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/ann_truncated_obstacle_list_reads_as_free_space.yaml
                          at brief).
                        - Safety asks how the design avoids or limits
                          each hazard, and
                          functional suitability whether each function gives the right
                          result (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.1 and
                          entries.concern_functional_suitability.question.0).
                        ASSUMPTION: the version of an edge's type can
                        differ between hosts when one is rebuilt with
                        a newer dictionary entry and the other is not.
                        Strength: moderate as the options are worded;
                        it stops separating them once each states the
                        check.

