title:                  Whole-dictionary digest that makes hosts move together
brief:                  |
                        The memory option checks that both ends were
                        built from the same dictionary digest. If that
                        is a digest of the whole dictionary, as the
                        wording suggests, it changes whenever any type
                        is added or upgraded, so a host rebuilt for a
                        change that touches none of the edges it
                        shares can no longer talk to the others, and
                        every host must be rebuilt and deployed
                        together. The option also refuses, rather than
                        converts, a pair of hosts whose compilers lay
                        a type out differently, though hosts may
                        differ. The check needed is narrower, the
                        name, version and layout of the one type on
                        each crossing edge, and the canonical layout
                        converts where layouts differ and checks no
                        digest, so a host rebuilt for a change
                        elsewhere keeps talking to the others.
description:            |
                        Sources:
                        - The memory option checks that both ends were
                          built from the same
                          dictionary digest for the same byte order, alignment and sizes
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/opt_memory_layout_on_the_wire.yaml
                          at brief).
                        - Each type is an item with a version, and a
                          new version names the
                          one it upgrades
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          at brief).
                        - Hosts may differ, as a workstation that
                          simulates and an embedded
                          target do
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/dec_encoding_of_a_message_between_os_processes.yaml
                          at description).
                        - Maintainability counts the parts a
                          representative change touches;
                          flexibility asks what it takes to install on a new platform
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure.1 and
                          entries.concern_flexibility.question.1).
                        ASSUMPTION: the option means one digest over
                        the whole dictionary; on 32-bit x86 Linux a
                        64-bit integer inside a struct is aligned to 4
                        bytes where AArch64 aligns it to 8, so one
                        type can have two layouts. Strength: moderate;
                        a digest for each edge type removes most of
                        it, and then the two options differ little on
                        hosts of one layout.

