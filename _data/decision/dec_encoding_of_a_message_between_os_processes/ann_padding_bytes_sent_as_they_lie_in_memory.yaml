title:                  Padding bytes sent and recorded as they lie in memory
brief:                  |
                        If dictionary types are laid out as the
                        compiler lays them out, as the decision puts
                        it, a struct can carry padding whose bytes are
                        whatever the memory held, and sending memory
                        as it lies sends those bytes to another
                        process or host. They may hold leftovers of
                        other data, and they can make two runs that
                        computed the same values give messages and
                        recordings that differ in bytes, where the
                        player's case expects two recordings identical
                        and the replay case expects control messages
                        byte for byte. The canonical layout has no
                        padding by definition, while CDR leaves the
                        content of its alignment gaps undefined, so a
                        CDR writer must zero them by choice. The trial
                        avoided this by packing every type, and its
                        current types were naturally aligned as well.
description:            |
                        Sources:
                        - Within an OS process a message is laid out
                          as the compiler lays
                          it out
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/dec_encoding_of_a_message_between_os_processes.yaml
                          at brief); the canonical layout has fixed sizes and no padding
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/opt_canonical_layout_from_the_dictionary.yaml
                          at brief).
                        - CDR inserts alignment gaps whose octets are
                          undefined (OMG CORBA
                          specification, section 15.3.1, CDR primitive types,
                          https://www.site.uottawa.ca/~tcl/gradtheses/mnojoumian/ThesisFiles/FinalSpec/CORBA/15.3.1.html).
                        - Two recordings of a replay are to be
                          identical, and replayed
                          control messages the same byte for byte
                          (_data/test_case/case_player_replays_exactly.yaml at
                          expected_results; _data/test_case/case_control_block_replay.yaml
                          at expected_results).
                        - The trial packed every generated type (trial
                          2c777ab9,
                          src/cctool/dataflow/generate.py, function _types), and every
                          current type is naturally aligned (review of 2026-10-29,
                          areas/trial-engine.md, section 5).
                        - Security covers the confidentiality and
                          integrity of data
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.description).
                        ASSUMPTION: padding in a struct that a node
                        fills field by field is not reliably zeroed in
                        C or C++, so its bytes can differ between runs
                        and hold earlier contents of that memory.
                        Strength: moderate; packing every type, as the
                        trial did, removes it at some cost in aligned
                        access, after which the memory and canonical
                        layouts coincide on little-endian hosts.

