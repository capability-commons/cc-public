title:                  Encoding of a message between OS processes
brief:                  |
                        Within an OS process, a message is an array of
                        items of fixed size, laid out as the compiler
                        lays them out. How is a message encoded when a
                        transport carries it to another OS process or
                        host?
description:            |
                        icd_dataflow_edge_message fixes the layout in
                        memory, and icd_dataflow_transport names a
                        shared-memory queue, ZeroMQ or TCP as
                        transports.
                        ruling_value_copied_into_each_queue and
                        ruling_transport_nodes_inserted_by_a_transform
                        apply. Hosts may differ, as a workstation that
                        simulates and an embedded target do
                        (ruling_placement_on_hosts_and_execution_units).
                        The trial implementation of 2026-10-29 sent
                        the count and the bytes of the array as they
                        lay in memory over TCP (trial 2c777ab9,
                        src/cctool/dataflow/engine/nodes/transport.cpp).

