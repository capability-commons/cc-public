title:                  Canonical layout from the dictionary
brief:                  |
                        A canonical layout that the data dictionary
                        defines, little-endian with fixed sizes and no
                        padding. Generated code converts to and from
                        it at the sender and the receiver where a
                        host's own layout differs, and copies straight
                        through where it does not.

