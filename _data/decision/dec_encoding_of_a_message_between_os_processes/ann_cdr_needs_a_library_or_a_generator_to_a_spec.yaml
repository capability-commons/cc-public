title:                  CDR library, or a generator written to an OMG specification
brief:                  |
                        The standard option takes its encoding from a
                        specification that cc-public does not control,
                        through either a library such as eProsima's
                        Fast CDR under the Apache-2.0 license, or a
                        generator of ours that follows the OMG rules
                        for alignment and byte order, in whichever of
                        the two versions, XCDR1 and XCDR2, ROS 2 tools
                        expect. The canonical and memory options need
                        neither, only code generated for each type
                        from the dictionary that the generator already
                        reads. A CDR library kept to the sender and
                        receiver, as the requirement keeps transport
                        libraries, would reach no other node, so the
                        exposure is small, but it is the only option
                        with any.
description:            |
                        Sources:
                        - Fast CDR is eProsima's C++ library for CDR
                          serialization, under
                          the Apache-2.0 license (https://github.com/eProsima/Fast-CDR).
                        - The cdr message encoding of ROS 2 is a
                          stream in XCDR1 or XCDR2
                          with RTPS SerializedPayload framing (MCAP Format Registry,
                          https://mcap.dev/spec/registry).
                        - CDR fixes alignment on natural boundaries
                          and lets the receiver
                          translate byte order (OMG CORBA specification, section 15.3.1,
                          CDR primitive types,
                          https://www.site.uottawa.ca/~tcl/gradtheses/mnojoumian/ThesisFiles/FinalSpec/CORBA/15.3.1.html).
                        - Every use of a transport library is confined
                          to the sender and
                          the receiver (_data/requirement/rqt_transport_confines_library.yaml
                          at object).
                        - Dependency risk counts direct and indirect
                          dependencies
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.measure.0).
                        Strength: moderate on dependency risk alone;
                        it weighs little if a standard encoding is
                        wanted for other reasons.

