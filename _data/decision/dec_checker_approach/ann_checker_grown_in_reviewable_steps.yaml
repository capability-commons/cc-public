title:                  Checker built and grown in reviewable steps
brief:                  |
                        The chosen checker arrived as a 248-line
                        change and has grown mostly by changes that
                        add one check with its test in about 60 to 130
                        lines. One step, adding seven rules at once,
                        was 473 lines. Each step is small enough for
                        one person to read in full.
description:            |
                        Commit ba66f33 (pre-squash, 2026-10-13
                        20:14:28Z) adds 248 lines in three files:
                        check.dl 111, check.py 136. Schema validation,
                        d1c4400, adds 276 lines and removes 33 over
                        six files. Later checks: 3d7ef5b adds 56 rule
                        lines and 33 test lines; 89c74d8 adds 56 rule
                        lines and 33 test lines; 7db4229 adds 12 rule
                        lines in a 230-line change that also adds a
                        type (git show --stat). fd6323a (pre-squash)
                        added the owner's rules 1-7 in one change of
                        473 insertions and 60 deletions over ten files
                        (git show --stat; memory/MEMORY.md line 35). A
                        check is one output relation with its rules
                        under one comment separator (git show 3d7ef5b;
                        src/cc_public/check/check.py lines 22-25).
                        Sixteen minutes after ba66f33 the owner asked
                        for check.py in his house style (owner's
                        statement 2026-10-13T20:30:08Z); assumption:
                        he had read it. The whole is not small: rule
                        files total 949 lines, the Python beside them
                        1,220, and 31 schema files 2,101 lines (wc -l
                        at 89c74d8). The steps are small, the total is
                        not.

