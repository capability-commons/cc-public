title:                  Old duplication carried by a port
brief:                  |
                        The legacy tree did several jobs twice,
                        validators among them. Porting its check
                        module would bring its machinery into a
                        restart made to remove such duplication.
description:            |
                        Legacy module about 6,083 lines
                        (ann_rules_are_a_small_review_surface). Review
                        of the legacy tree: "many jobs were done
                        twice", including validators
                        (notes/cc-public-session-context.md lines
                        57-58). The restart removed duplicated
                        machinery
                        (memory/cc-public-design-principles.md).
                        Assumption: which duplicated validators lived
                        in the check module itself is not recorded.

