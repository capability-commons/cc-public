title:                  Relation ends now coming from constraint edges
brief:                  |
                        ann_shape_and_comparison_checks_split_cleanly
                        says domain and range come from relation
                        entries as facts. Relation entries hold no
                        domain or range now. Their ends come from
                        edges to relation constraints, which the rules
                        compare with the roles each type plays.
description:            |
                        _data/register/reg_relation.yaml entries carry
                        relation_constrains_source and
                        relation_constrains_target edges to relcon_
                        entries, and no domain or range field. The
                        extractor yields these as ordinary edges, and
                        src/cctool/check/check.lp within satisfies and
                        constraint_violation checks them. The split of
                        shape checks into JSON Schema and comparisons
                        into rules still holds. Found in the review of
                        2026-10-22.

