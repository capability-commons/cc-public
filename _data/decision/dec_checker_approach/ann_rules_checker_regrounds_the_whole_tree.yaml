title:                  Whole-tree cost on every check
brief:                  |
                        The chosen checker re-extracts the facts of
                        every YAML document and re-grounds the whole
                        graph on each evaluation, and an edit
                        evaluates twice. Only parsing and schema
                        validation of unchanged documents are cached;
                        nothing is incremental at the rule level.
description:            |
                        Each evaluation builds a new clingo control
                        and grounds from nothing:
                        src/cc_public/graph/datalog.py lines 277-303;
                        ann_no_graph_state_is_kept. Before caching,
                        reading and validating took most of each check
                        (commit 93a1428). Caches cut the gate from
                        2m04s to about 1m07s (memory/MEMORY.md line
                        47). Device tool calls die at 180 s
                        (memory/MEMORY.md line 45). The legacy checker
                        was never timed on this tree, so this does not
                        show a port would be cheaper.

