title:                  Maintainer's choice of a second-generation checker
brief:                  |
                        The maintainer chose to go straight to the
                        planned rules-based checker over derived facts
                        rather than pull from the old checker, with
                        JSON Schema for the shape of each item beside
                        it.
description:            |
                        Maintainer's statement, posed as a question:
                        "Are we going to pull straight from the old
                        checker? Or are we going to try to go straight
                        for our second-generation datalog based
                        checker that we want to build?" (2026-10-13).
                        The choice itself, no port and JSON Schema for
                        per-item shape, is recorded as the
                        maintainer's direction of 2026-10-13 in
                        memory/MEMORY.md line 21 (assistant-written
                        note). A session summary the maintainer pasted
                        from another thread, not his own words, said:
                        "A small checker over derived facts is the
                        natural first task" (2026-10-09). Commits
                        ba66f33 and d1c4400 (pre-squash). The engine
                        is a separate decision.

