title:                  Engine change as one very large diff
brief:                  |
                        Because the checks are in an engine's rule
                        language, the move from Souffle to clingo came
                        as one commit of 1,199 added and 1,110 removed
                        lines, committed under two minutes after the
                        owner's last step, and no owner message refers
                        to its content.
description:            |
                        Commit 6230e98: 28 files, 1,199 insertions,
                        1,110 deletions; check.dl (526) to check.lp
                        (524), change.dl (226) to change.lp (221),
                        derive.dl (87) to derive.lp (85), datalog.py
                        changed by 290 lines (git show --stat). Owner
                        decided to switch at 2026-10-14T22:11:54Z and
                        wrote "OK. I've run pixi install" at
                        22:49:43Z; 6230e98 is dated 22:51:31Z; his
                        next messages from 22:56:42Z are about folder
                        layout and decisions (will-messages.md lines
                        731-762). test_check.py changed by 36 of 621
                        lines, so the tests act as an equivalence
                        check that needs less reading. The engine is
                        to be revisited when the graph is much larger
                        (commit 6c0a949;
                        ruling_cross_item_checks_engine). Assumption:
                        the owner did not read the rewrite line by
                        line; nothing records either way. Sits beside
                        ann_checks_bound_to_a_rule_dialect, which
                        makes the maintainability point.

