title:                  One fault reported as two failures
brief:                  |
                        An id or guid that breaks the general form in
                        sch_primitive gives a row from a rule and a
                        row from schema validation. The checker counts
                        failures, not faults, so a user fixing one
                        item sees two reports.
description:            |
                        An id against its type's pattern gives both
                        bad_id and schema_violation rows
                        (src/cc_public/check/_test/test_check.py lines
                        376-382), and a guid of the wrong form gives
                        both bad_guid and schema_violation rows (same
                        file, lines 384-390). An id that breaks only
                        its type's narrower regex_id, or a well-formed
                        guid with another type's prefix, gives one row
                        from the rule alone. The id form is both a
                        schema pattern and a rule
                        (_data/schema/sch_primitive.yaml lines 67 and
                        101; src/cc_public/check/check.lp lines 56-60
                        and 72-75; ann_identifier_form_checked_twice).
                        Each row of a check is one failure
                        (src/cc_public/check/check.py lines 22-25).
                        Bounded to the identity fields. Assumption: no
                        other field is checked by both a schema and a
                        rule.

