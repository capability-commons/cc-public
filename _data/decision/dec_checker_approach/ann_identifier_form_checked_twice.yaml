title:                  Identifier form checked twice
brief:                  |
                        The form of ids and guids is checked both by a
                        schema pattern and by a rule over facts, and
                        the rules choose which schemas the validator
                        applies, so the two mechanisms are not
                        independent.
description:            |
                        _data/schema/sch_primitive.yaml at
                        $defs.id.pattern and $defs.guid.pattern;
                        src/cctool/check/check.lp within bad_id and
                        bad_guid; sch_regentry_type.yaml at note. A
                        guid that passes the rule also passes the
                        schema pattern. Which schemas a YAML document
                        must meet is derived in
                        src/cctool/graph/derive.lp within
                        document_schema and fed to the validator
                        (commit d1c4400). The overlap is small and
                        bounded to the identity fields. Assumption: no
                        written rule assigns each field to one side.

