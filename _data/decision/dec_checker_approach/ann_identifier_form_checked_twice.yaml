title:                  Identifier form checked twice
brief:                  |
                        The form of ids and guids is checked both by a
                        schema pattern and by a rule over facts, and
                        the rules choose which schemas the validator
                        applies, so the two mechanisms are not
                        independent.
description:            |
                        _data/schema/sch_primitive.yaml lines 67 and
                        101; src/cc_public/check/check.lp lines 56-60
                        and 72-75; sch_regentry_type.yaml lines 27-30.
                        A guid that passes the rule also passes the
                        schema pattern. Which schemas a document must
                        meet is derived in
                        src/cc_public/graph/derive.lp lines 78-85 and
                        fed to the validator (commit d1c4400). The
                        overlap is small and bounded to the identity
                        fields. Assumption: no written rule assigns
                        each field to one side.

