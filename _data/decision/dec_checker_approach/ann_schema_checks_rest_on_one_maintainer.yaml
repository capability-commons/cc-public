title:                  Shape checks resting on one maintainer
brief:                  |
                        The JSON Schema half pulls in four more
                        packages, and four of the five list the same
                        single author. One is a compiled extension
                        built per platform.
description:            |
                        jsonschema became a dependency in commit
                        d1c4400 (pyproject.toml). jsonschema 4.26.0
                        needs attrs, jsonschema-specifications,
                        referencing and rpds-py (pixi.lock lines
                        257-265). All but attrs list Julian Berman
                        (PyPI JSON, read 2026-10-15). All five are
                        MIT. rpds-py is locked as platform wheels
                        (pixi.lock lines 733-740). schema.py imports
                        referencing, which pyproject.toml does not
                        declare (src/cc_public/check/schema.py lines
                        40-41, 145-153).

