title:                  Engine dependency a port would not need
brief:                  |
                        Rules add a logic engine as a dependency. At
                        the time of the decision it was a Souffle
                        binary copied by hand and kept outside the
                        locked environment.
description:            |
                        Commit ba66f33, src/check/check.py lines 10,
                        115-123 (souffle by subprocess). Maintainer's
                        statement 2026-10-13 (binaries copied). Needed
                        libffi.so.7 from a gitignored folder
                        (memory/MEMORY.md line 21). Now clingo 5.8.2,
                        MIT, locked by pixi (pyproject.toml;
                        pixi.lock; commits 5665ace, 6230e98), so the
                        exposure is mostly closed. An engine stays for
                        queries in any case
                        (ann_python_checks_add_no_third_party).
                        Assumption: a port would take no logic engine.

