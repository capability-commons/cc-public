title:                  Coverage of the legacy checks never measured
brief:                  |
                        The chosen checker began with 12 checks
                        against a 6,083-line legacy module, and no
                        list says which legacy checks it covers or
                        drops on purpose. A port would have carried
                        the legacy checks over by construction.
description:            |
                        The first version had 12 checks
                        (memory/MEMORY.md line 21; commit ba66f33,
                        pre-squash); there are 35 at 89c74d8. Legacy
                        check module about 6,083 lines
                        (memory/MEMORY.md line 21;
                        ann_rules_are_a_small_review_surface). A
                        session summary the maintainer pasted, not his
                        own words, names frozen-20260918 as "the
                        parity oracle" (2026-10-09T17:52:14Z), but no
                        such golden-output folder exists on disk
                        (memory/MEMORY.md line 6, verified
                        2026-10-09). The legacy module is not in this
                        clone. Assumption: no inventory of legacy
                        checks exists; none was found by grep in
                        repo/_data and memory. Assumption: some legacy
                        checks target a data model this tree no longer
                        has (the legacy tree held 132 decisions,
                        memory/MEMORY.md line 6), so a port would also
                        carry checks not needed. This is a gap in
                        evidence, not a proven missing check; a
                        one-time inventory would close it.

