title:                  No speed difference at this size
brief:                  |
                        At the present size one check takes a fraction
                        of a second and the gate about a minute, so
                        speed gives no reason to prefer the port.
description:            |
                        One evaluation took about 0.12 s on the tree
                        of 2026-10-14
                        (ann_clingo_is_slower_at_this_size). The gate
                        took about a minute over 47 source files
                        (ann_gate_takes_a_minute). The owner judged
                        the tree too small to measure speed
                        meaningfully (owner's statement
                        2026-10-14T22:11:54Z). It is a condition of
                        the present size.

