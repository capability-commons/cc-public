title:                  A port as one bulk change past review
brief:                  |
                        Porting the legacy check module means bringing
                        in about 6,083 lines, at once or in a long run
                        of changes. A note records the owner as saying
                        that too much generated material to review
                        sank an earlier attempt.
description:            |
                        Legacy module about 6,083 lines
                        (memory/MEMORY.md line 21;
                        ann_rules_are_a_small_review_surface). An
                        assistant-written note quoting the owner: "A
                        prior attempt failed because the LLM generated
                        too much material to review", with "Propose
                        small, reviewable changes"
                        (memory/cc-public-design-principles.md lines
                        11, 27). The September tree grew 3 to 8 times
                        in two weeks from agent output (same file,
                        line 25). Review is the bottleneck
                        (memory/MEMORY.md line 52). The owner's own
                        words, accepting reviewability as a driver:
                        "especially given the huge (and practically
                        impossible) review burden that we are
                        generating" (2026-10-15T10:59:29Z).
                        Assumption: the legacy module, like the
                        September tree, was mostly agent output.
                        Commits here are co-authored by a model
                        (trailers of 3d7ef5b, 6230e98). The present
                        checker's Python and check rules total 1,863
                        lines. Assumption: a port would be done by an
                        agent; how far the legacy module could be cut
                        while porting is not known, since it is not in
                        this clone.

