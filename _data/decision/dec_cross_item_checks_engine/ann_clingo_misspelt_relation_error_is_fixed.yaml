title:                  Misspelt-relation warning now an error
brief:                  |
                        Commit 627e2b5 "Fix datalog.run so that clingo
                        warnings and no answer set are errors" drops
                        --warn=none and treats every clingo message as
                        an error, and 2b74bfe "Add a test of
                        supersession_across_issues" gives that check a
                        test. At 360ec14 a misspelt relation stops the
                        run instead of passing.
description:            |
                        run() collects every message clingo logs and
                        raises ErrorDatalog if there is any, so "atom
                        does not occur in any rule head" now stops the
                        check; each input relation is declared defined
                        so that an empty one gives no message
                        (src/cc_public/graph/datalog.py lines 296-314
                        at 360ec14). The test of
                        supersession_across_issues is
                        src/cc_public/check/_test/test_check.py lines
                        374-380. A relation still needs no declaration
                        in the clingo path, so the difference from
                        Souffle is now when the misspelling is found,
                        not whether.

