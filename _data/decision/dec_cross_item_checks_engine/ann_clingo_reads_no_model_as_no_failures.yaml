title:                  No model read as no failures
brief:                  |
                        As run today, clingo returns no rows when a
                        program has no model, and one arbitrary model
                        when it has several, so a check can pass when
                        it should fail. Souffle forbids the program
                        shapes that cause this.
description:            |
                        run() collects the shown atoms of each model
                        and does not look at whether the result is
                        satisfiable or how many models came back
                        (src/cc_public/graph/datalog.py lines
                        303-309). A broken integrity constraint gives
                        UNSAT with zero models, which check.py reads
                        as all checks passing (check.py lines 96-106).
                        Two rules that negate each other give one
                        model, and which one is not fixed by the
                        rules. Trials run on 2026-10-15 with clingo
                        5.8.2, the version pixi.lock locks (pixi.lock
                        line 16; pyproject.toml line 58 allows
                        >=5.8.2,<6); the trial script is not in the
                        repository. Souffle requires stratified
                        negation and has no integrity constraints, so
                        a program has one result
                        (https://souffle-lang.github.io/rules). The
                        same run() serves the tree check, the commit
                        check (change.py line 86) and logic queries
                        with rules a user or agent writes
                        (cli/querying.py line 172). check.lp,
                        change.lp and derive.lp have no integrity
                        constraints or choice rules today, but a rule
                        that negates its own head, such as fail(X) :-
                        item(X), not fail(X), also gives UNSAT with
                        zero models (same trials). Holds at any graph
                        size and grows with the number of rules.
                        ASSUMPTION: a few lines in run() could raise
                        unless there is exactly one model; not tried.
                        So it weighs against the present clingo path
                        more than against clingo.

