title:                  Text-file fact boundary that rejects or loses data
brief:                  |
                        A fact holding a tab or a newline raises an
                        exception that the check does not catch, and
                        an output file missing after Souffle succeeds
                        is read as no failures.
description:            |
                        See datalog.py as it was before commit
                        6230e98, where facts were written as
                        tab-separated files and missing outputs were
                        read as empty, and checking.py, which then
                        caught no exception around the check.

