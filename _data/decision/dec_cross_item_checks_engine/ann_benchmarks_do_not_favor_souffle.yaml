title:                  Benchmarks do not show Souffle ahead of clingo
brief:                  |
                        A 2025 comparison of transitive closure found
                        clingo faster than Souffle except for right
                        recursion on complete and maximal acyclic
                        graphs, though Souffle read and wrote data
                        fastest.
description:            |
                        Liu, Idogun, Stoller and Tong, Efficiency of
                        analysis of transitive relations using
                        query-driven, ground-and-solve, and
                        fact-driven inference, arXiv 2504.21291 v3,
                        2026, section 5 item 4. clingo 5.7.1 and
                        Souffle 2.4.1 were compared, with Souffle
                        timed as compiled programs. Memory was not
                        measured, and negation, aggregation and string
                        operations were not studied.

