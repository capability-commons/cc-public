title:                  clingo is slower at this size
brief:                  |
                        Measured on the tree of 2026-10-14, one
                        evaluation of the checks took about 0.12 s
                        with clingo and 0.07 s with Souffle, and the
                        test suite run serially took 2m47s against
                        2m25s. Most of the difference is regex
                        matching called from Python. At this size the
                        fixed cost of starting Souffle is not what
                        dominates.

