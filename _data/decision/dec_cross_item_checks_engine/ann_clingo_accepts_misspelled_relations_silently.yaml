title:                  Misspelled relations accepted silently
brief:                  |
                        As configured, clingo reports nothing when a
                        rule names a relation that nothing defines, so
                        a misspelled name silently changes what a
                        check finds and a reviewer must check each
                        name by eye. Souffle refuses an undeclared
                        relation.
description:            |
                        datalog.py creates the control with
                        --warn=none (src/cc_public/graph/datalog.py
                        line 291). Without it, clingo 5.8.2 logs
                        "info: atom does not occur in any rule head";
                        with it, nothing. A misspelled positive body
                        atom makes a check find nothing; a misspelled
                        negated atom makes every candidate a failure
                        (trials run on 2026-10-15; the script is not
                        in the repository). A relation needs no
                        declaration in the clingo path: the % decl
                        comment is optional (datalog.py lines 27-35),
                        and only #show arity is checked against it
                        (lines 282-288). Souffle requires every
                        relation to be declared
                        (https://souffle-lang.github.io/relations) and
                        reports "Undefined relation" as an error for
                        an atom whose relation is not declared
                        (src/ast/transform/SemanticChecker.cpp in the
                        Souffle source). Of the 33 relations shown in
                        check.lp, supersession_across_issues (lines
                        377-385, commit 89c74d8) is named in no test.
                        The rules of a logic query are written for the
                        occasion and run directly, so no test guards
                        them (cli/querying.py lines 163-172), though
                        the query command itself is tested
                        (cli/_test/test_querying.py). Holds at any
                        size and grows with the rules. ASSUMPTION:
                        dropping --warn=none and failing on that
                        message would close most of the gap without
                        changing engine.

