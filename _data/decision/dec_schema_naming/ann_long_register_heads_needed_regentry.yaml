title:                  Long shared heads that needed a coined word
brief:                  |
                        With the general word first, five entry
                        schemas shared the long head register_entry.
                        The fix was the coined word regentry, which a
                        new user must learn beside reg and register.
description:            |
                        232f001 named the entry schemas
                        sch_register_entry_* beside sch_register and
                        sch_register_entry. The maintainer chose
                        register_entry over entry because "entry" is
                        overloaded (will-messages.md line 149), so the
                        length came from that choice as much as from
                        the order. The maintainer proposed
                        sch_regentry_* "to disambiguate" and called it
                        "a neologism and a piece of jargon"
                        (will-messages.md line 203, 2026-10-13);
                        agreed at line 209. _data/schema at 89c74d8
                        uses sch_reg_*, sch_register* and
                        sch_regentry_* as heads. ASSUMPTION: a larger
                        graph needs more coined words of this kind,
                        extrapolated from one case. Whether role-first
                        names avoid this is not shown.

