title:                  Head words trait and standalone without a concept
brief:                  |
                        The head words trait and standalone have no
                        concept entry, so a reader learns their
                        meaning only by opening the schema.
description:            |
                        _data/register/reg_concept.yaml has entries
                        for schema, register and register entry and
                        the admitted term regentry (lines 76, 94, 118,
                        132-141), but no match for trait or
                        standalone. sch_standalone.yaml at description
                        give the meaning of standalone in prose. The
                        every-word rule is "proposed, not yet
                        enforced" (session summary pasted by the
                        maintainer, will-messages.md line 55), and no
                        checker under src/ reads term_preferred or
                        term_admitted. Registering two concepts fixes
                        it.

