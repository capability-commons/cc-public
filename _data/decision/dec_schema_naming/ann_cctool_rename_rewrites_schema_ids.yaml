title:                  Tool rename of an id in every document
brief:                  |
                        cctool rename rewrites an id in every
                        document, including inside a URL path, and
                        renames the file. It cuts the edit cost of
                        each rename but not the number of ids that
                        move.
description:            |
                        src/cc_public/edit/edit.py lines 134-137 and
                        722-770, added in afbcf6f (2026-10-14). The
                        renames in 232f001 and ae6eeff predate it. git
                        rename detection reduced each renamed schema
                        in ae6eeff to a 4-line diff (git show --stat
                        ae6eeff).

