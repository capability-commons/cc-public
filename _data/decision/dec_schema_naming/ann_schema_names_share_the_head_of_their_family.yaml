title:                  Schema names that share the head of their family
brief:                  |
                        With the general word first, every schema of a
                        family opens with the same head, as
                        sch_trait_* and sch_regentry_* do, so a new
                        name is built from the words its siblings
                        already use and reads as one of them.
description:            |
                        Written 2026-10-22 so that terminological
                        quality, a driver of lco_vocabulary, is argued
                        before the ruling.
                        ann_schema_ids_reverse_spoken_order gives the
                        cost on the other side: the ids reverse the
                        spoken order.

