title:                  General heads that are role words
brief:                  |
                        Half the schema ids open with a role word such
                        as trait, reg or regentry. A reviewer cannot
                        tell from the rule alone whether a new name is
                        subject-first or role-first.
description:            |
                        16 of 31 schema ids open with the head trait,
                        reg or regentry (_data/schema at 89c74d8).
                        ASSUMPTION: these heads name what the schemas
                        do in the system; no source says so. The
                        session summary pasted by the owner says
                        register entry schemas "keep entry as the
                        general head" (will-messages.md line 55). The
                        packet defines opt_role_first_names only as
                        "names that start with the role". The advocate
                        reads this as support for role-first names as
                        not clearly distinct from the chosen rule.

