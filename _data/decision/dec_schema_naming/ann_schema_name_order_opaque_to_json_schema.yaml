title:                  Name order opaque to partner tools
brief:                  |
                        A JSON Schema tool resolves $ref by the whole
                        URI and reads nothing into the order of words
                        in it. Subject-first names cost a partner no
                        extra tool or format.
description:            |
                        Each schema is a JSON Schema 2020-12 document
                        whose $id is
                        https://capability-commons.org/schema/<schema
                        id>.yaml (_data/schema/sch_standalone.yaml
                        lines 1-2, sch_regentry_type.yaml line 2).
                        $ref is a URI reference resolved against the
                        base URI
                        (https://json-schema.org/draft/2020-12/json-schema-core#section-8.2.3.1).
                        ASSUMPTION: both alternatives keep the sch_
                        prefix and differ only in word order after it;
                        the packet does not define role-first names
                        that far.

