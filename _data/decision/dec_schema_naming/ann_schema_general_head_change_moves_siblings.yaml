title:                  General-head changes that move every sibling id
brief:                  |
                        The rule does not fix which word is the
                        general head, and the head of the register
                        entry schemas changed twice on one day, four
                        days after the rule was recorded. The second
                        change renamed every sibling schema id and its
                        public $id URI, with no alias left behind.
description:            |
                        At bb8c338 (2026-10-09) the register of types
                        named sch_entry_* schema ids, and the writing
                        style rule entry schema had no entry head.
                        232f001 (2026-10-13) replaced the sch_entry_*
                        ids with sch_register_entry_* and gave the
                        writing style rule entry schema that head too.
                        ae6eeff (2026-10-13) renamed the five
                        sch_register_entry_* schemas to
                        sch_regentry_*, each with a new $id, and
                        updated references in 14 files in all.
                        Maintainer's statements, will-messages.md
                        lines 149, 203, 209 (2026-10-13T13:54:30Z,
                        14:52:46Z, 14:53:48Z). No schema file has an
                        alias field, and the alias check covers
                        register entries only (memory/MEMORY.md line
                        43). Schema ids appear inside $ref URLs in
                        other schemas, for example sch_trait_identity
                        in the $ref lists of three other schemas
                        (sch_commit, sch_register_entry,
                        sch_standalone). Nothing is yet pushed to the
                        public remote, so no partner holds the old
                        URIs (memory/MEMORY.md line 7). The fan-out
                        grows with the number of siblings under one
                        head.

