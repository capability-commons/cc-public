title:                  Head renames driven by wording, not word order
brief:                  |
                        The entry renames came from an overloaded word
                        and the wish for a short distinct name, not
                        from the subject-first order. Role-first names
                        could need the same renames.
description:            |
                        Maintainer's statements, will-messages.md line
                        149 ("entry" is overloaded, 2026-10-13) and
                        line 203 (regentry to disambiguate,
                        2026-10-13). Neither cites subject-first
                        ordering. ASSUMPTION: a role word can be
                        overloaded too; the repository holds no
                        evidence on how often.

