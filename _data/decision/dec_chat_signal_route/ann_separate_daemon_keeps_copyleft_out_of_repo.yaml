title:                  Copyleft code kept out of the repository by a separate daemon
brief:                  |
                        Running signal-cli as its own process behind
                        JSON-RPC lets cc-public stay Apache-2.0 and
                        leaves the Signal protocol to a maintained
                        client. An own client on libsignal puts AGPL
                        code that is unsupported outside Signal into
                        the bot's source.
description:            |
                        cc-public is licensed Apache-2.0 [LICENSE line
                        2; pyproject.toml line 40]. The bot's source
                        lives in cc-public [owner's statement].
                        libsignal is licensed under the GNU AGPLv3
                        [https://git.tjdev.de/mirror/libsignal/raw/branch/main/README.md,
                        a mirror of the libsignal README]. The
                        libsignal README says "Use outside of Signal
                        is unsupported" [same URL]. The libsignal
                        README says "All APIs and implementations are
                        subject to change without notice" [same URL].
                        signal-cli is licensed GPLv3 and has a daemon
                        mode with a JSON-RPC interface
                        [https://ftp.fau.de/gentoo/distfiles/72/signal-cli-bin-0.14.1.README.md].
                        ASSUMPTION: talking to a GPL program over
                        JSON-RPC from a separate process does not make
                        the Apache-2.0 bot a derivative work. This is
                        the common reading of the GPL, not a ruling.
                        ASSUMPTION: with an own client, the project
                        itself must track every libsignal and Signal
                        server change, while with the daemon the
                        signal-cli maintainers do that tracking and
                        the project only bumps a version. Holds at ten
                        times the size: yes, because the number of
                        bots does not change which code links
                        libsignal. More bots share one upgrade of the
                        daemon.

