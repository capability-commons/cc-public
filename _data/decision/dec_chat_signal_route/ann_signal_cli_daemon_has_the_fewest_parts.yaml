title:                  signal-cli daemon with the fewest parts to fail
brief:                  |
                        Any route uses an unofficial client that stops
                        working if it is not kept current. A
                        signal-cli daemon puts that burden on a
                        maintained upstream and runs as one
                        restartable process. A Matrix bridge adds a
                        homeserver and a bridge, and an own client on
                        libsignal puts the whole burden on this
                        project.
description:            |
                        signal-cli says that releases older than three
                        months may not work correctly, because
                        official clients expire after three months and
                        the Signal server may then make incompatible
                        changes
                        (https://raw.githubusercontent.com/AsamK/signal-cli/master/README.md
                        lines 16-17). The mautrix-signal bridge is set
                        up on a Matrix server and logs in to Signal as
                        a linked secondary device
                        (https://etke.cc/help/bridges/mautrix-signal/;
                        https://raw.githubusercontent.com/mautrix/docs/master/bridges/go/setup.md
                        lines 35-36). ASSUMPTION: Signal has no
                        official bot API; no Signal source was found
                        that offers one. Holds at ten times the size:
                        yes, because the count of parts on the route
                        does not shrink with more bots.

