title:                  Homeserver and bridge as extra holders of messages
brief:                  |
                        The Matrix route passes every message through
                        a bridge and a homeserver, two more places
                        that hold message content and personal data,
                        and each one more service to secure. The
                        signal-cli daemon keeps the path from Signal
                        to the bot short and the decrypted messages in
                        one local process.
description:            |
                        The Matrix option speaks Matrix to a
                        homeserver and reaches Signal through the
                        mautrix-signal bridge
                        [_data/decision/dec_chat_signal_route/opt_matrix_bridge.yaml,
                        brief]. In unencrypted Matrix rooms, events
                        are stored in plaintext in the homeserver
                        database
                        [https://docs.mau.fi/bridges/general/end-to-bridge-encryption.html].
                        The mautrix docs say end-to-bridge encryption
                        hides bridged messages from the homeserver,
                        and that deleting keys prevents the bridge and
                        bridge admin from reading old messages [same
                        URL]. End-to-bridge encryption covers the path
                        between Matrix users and the bridge, and the
                        page's advice that deleting keys stops the
                        bridge reading old messages shows that the
                        bridge itself reads them [same URL]. Without
                        end-to-bridge encryption a bridged room is
                        unencrypted, so the homeserver stores its
                        messages in plaintext [same URL]. The
                        signal-cli option runs signal-cli as a daemon
                        and talks to it over JSON-RPC
                        [_data/decision/dec_chat_signal_route/opt_signal_cli_daemon.yaml,
                        brief; signal-cli 0.14.1 README, context.md
                        lines 46-50]. The signal-cli daemon offers a
                        UNIX or a TCP socket, and its wiki page says
                        nothing about authentication on it
                        [https://github.com/AsamK/signal-cli/wiki/JSON-RPC-service].
                        ASSUMPTION: a UNIX socket with file
                        permissions limits the signal-cli daemon to
                        local users, so the TCP socket must not be
                        used. Holds at ten times the size: yes,
                        because a homeserver keeps message history for
                        every room, which grows with the
                        conversations, and each extra service carries
                        its own vulnerabilities to track whatever the
                        volume.

