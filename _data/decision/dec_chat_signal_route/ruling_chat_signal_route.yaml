title:                  signal-cli daemon
brief:                  |
                        A signal-cli daemon leaves the Signal protocol
                        to a maintained client and keeps its GPL code
                        in its own process, so cc-public stays
                        Apache-2.0. The adapter reaches it only over a
                        local UNIX socket, never TCP, since the daemon
                        offers no authentication. The Matrix bridge
                        adds a homeserver, a database and a bridge
                        that each hold messages and need upkeep; it
                        may be revisited if many more messengers are
                        added. An own client on libsignal would make
                        this project keep a Signal client on a library
                        its maker does not support outside Signal.
                        Ruled by William Payne on 2026-10-23.

