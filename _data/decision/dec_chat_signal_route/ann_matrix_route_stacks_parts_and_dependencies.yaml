title:                  Outside parts stacked on the Matrix route
brief:                  |
                        The Matrix route depends on a homeserver, a
                        PostgreSQL database, an appservice
                        registration, the mautrix-signal bridge and
                        libsignal inside the bridge. Each one can
                        change or break the route and is one more part
                        to upgrade and repair, where the signal-cli
                        route adds one daemon that the adapter talks
                        to over JSON-RPC.
description:            |
                        The Matrix option speaks Matrix to a
                        homeserver and reaches Signal through the
                        mautrix-signal bridge
                        [_data/decision/dec_chat_signal_route/opt_matrix_bridge.yaml
                        at brief]. mautrix-signal is "A Matrix-Signal
                        puppeting bridge" licensed AGPL-3.0
                        [https://pkg.go.dev/github.com/element-hq/mautrix-signal].
                        mautrix-signal depends on libsignal, and its
                        license notice says "A license exception for
                        libsignal must be acquired separately from
                        Signal"
                        [https://raw.githubusercontent.com/mautrix/signal/main/LICENSE.exceptions].
                        A mautrix Go bridge needs a homeserver that
                        supports application services, a PostgreSQL
                        server v16 or higher, a registered appservice,
                        a Signal client that can add linked devices,
                        and ffmpeg
                        [https://raw.githubusercontent.com/mautrix/docs/master/bridges/go/setup.md
                        lines 26-37]. The signal-cli daemon option
                        runs one program and talks to it over JSON-RPC
                        [_data/decision/dec_chat_signal_route/opt_signal_cli_daemon.yaml
                        at brief]. signal-cli has a daemon mode with
                        JSON-RPC and D-Bus interfaces, and needs a
                        Java Runtime Environment 25 and the native
                        library libsignal-client
                        [https://raw.githubusercontent.com/AsamK/signal-cli/master/README.md
                        lines 11-12 and 27-28]. So both routes rest on
                        libsignal, and the Matrix route adds a
                        homeserver and a bridge on top. signal-cli
                        must keep pace with the Signal server, since
                        releases older than three months may not work
                        correctly [same README, lines 16-17].
                        ASSUMPTION: the bridge must keep pace too; the
                        mautrix setup page does not say so.
                        ASSUMPTION: a Matrix client library for the
                        bot would add one more package to the seven
                        direct dependencies listed today
                        [pyproject.toml at project.dependencies to
                        48]. Holds at ten times the size: yes, because
                        the chain of components and the count of parts
                        per deployment stay the same however many bots
                        use it. The Matrix route only gains if many
                        other chat apps are bridged through the same
                        homeserver, which is not yet a stated goal.

