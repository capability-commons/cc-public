title:                  Own Signal client as the most code to keep
brief:                  |
                        An own client on libsignal makes cc-public
                        keep a Signal client, on a library whose maker
                        says use outside Signal is unsupported and
                        whose APIs change without notice.
description:            |
                        The option writes a Signal client of our own
                        on the libsignal library
                        (opt_own_client_on_libsignal.yaml, brief).
                        libsignal is written in Rust and exposed as a
                        Java, Swift or TypeScript library (README,
                        https://github.com/beeper/libsignal, a fork
                        that carries the upstream README). cc-public
                        is written in python (pyproject.toml,
                        requires-python >= 3.12). Holds at ten times
                        the size: yes, because the client is kept up
                        to date with Signal regardless of how many
                        bots use it.

