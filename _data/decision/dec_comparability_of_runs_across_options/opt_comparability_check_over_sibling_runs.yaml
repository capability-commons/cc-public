title:                  Check over the runs of sibling options
brief:                  |
                        A check requires that runs cited for sibling
                        options share scenario, measures, seed policy
                        and fidelity, and that their resolved dataflow
                        graphs differ only in the operations of the
                        options, as the difference tool shows.

