title:                  Comparability as one critical question
brief:                  |
                        Whether a measured effect follows from the
                        option or from the frame is already one of the
                        critical questions proposed for run evidence.
                        A guidance rule or a check of its own gives
                        that job a second mechanism; if the critical
                        questions are upheld, no separate rule is
                        needed.
description:            |
                        Sources:
                        - The proposed critical questions include
                          "does the measured effect follow from the
                          option or from the frame" (CQ2).
                          (_sources/survey/simulation-backed-decisions.md
                          line 145; the option on registered critical
                          questions in the credibility decision draws
                          on it)
                        - The check needs scenario, measures, seed
                          policy and fidelity in each run, and the
                          difference tool.
                          (_data/decision/dec_comparability_of_runs_across_options/opt_comparability_check_over_sibling_runs.yaml
                          lines 12-17; _sources/variants-framing.md
                          line 70)
                        - Simplicity counts jobs done by more than one
                          mechanism. (_data/register/reg_concern.yaml
                          lines 489-490) Strength: strong on the
                          overlap, which is structural. It holds only
                          if the credibility decision upholds the
                          critical questions; at ten times the runs a
                          reviewer is less likely to spot an unequal
                          frame by answering a question by eye.

