title:                  A comparability rule that nothing holds
brief:                  |
                        A guidance rule for comparability is held only
                        by the care of advocates and reviewers, and no
                        check holds it. The design rules accept such a
                        rule only if it says that nothing checks it,
                        and call a rule stated more broadly than it is
                        held a vice; guidance that names comparability
                        as a rule risks that, while having no rule
                        claims nothing, though it leaves the same gap.
description:            |
                        Sources:
                        - "A rule claims no more than something holds.
                          Where nothing holds a part of it, the rule
                          says so, or that part is cut." The owner:
                          "theatre without substance is no virtue at
                          all, but a vice."
                          (_data/register/reg_design_rule.yaml lines
                          47-63)
                        - The guidance option is a rule that advocates
                          and reviewers follow, with no check.
                          (_data/decision/dec_comparability_of_runs_across_options/opt_comparability_as_guidance.yaml
                          lines 12-14)
                        - Simplicity asks whether a design follows
                          from decisions already made.
                          (_data/register/reg_concern.yaml line 486)
                          Strength: moderate; it follows from a design
                          rule already imposed and does not depend on
                          scale, but guidance that says plainly that
                          nothing checks it meets the rule.

