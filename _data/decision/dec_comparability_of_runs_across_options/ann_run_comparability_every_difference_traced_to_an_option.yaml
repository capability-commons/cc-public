title:                  Every difference between compared graphs traced to an option
brief:                  |
                        A check that sibling runs differ only in the
                        operations of their options makes each
                        difference between the compared graphs trace
                        to an option. Under guidance or no rule, a
                        difference that is not the option exists in
                        the evidence with nothing recording why.
description:            |
                        Sources:
                        - The check requires graphs that differ only
                          in the options' operations "as the
                          difference tool shows".
                          (_data/decision/dec_comparability_of_runs_across_options/opt_comparability_check_over_sibling_runs.yaml at brief)
                        - The difference tool does not exist yet and
                          is listed as a need.
                          (_sources/variants-framing.md line 70)
                        - Traceability asks whether anything exists
                          that nothing calls for.
                          (_data/register/reg_concern.yaml at entries.concern_traceability.question.2)
                        - In SysML v2 a trade study scores its
                          alternatives by one evaluation function.
                          (_sources/survey/simulation-backed-decisions.md
                          line 105, which says it read the SysML v2
                          material only in part; the OMG overview,
                          https://omg.org/pdf/SysML-v2-Overview.pdf,
                          lists trade-off analysis as a capability but
                          does not describe the evaluation function)
                          Strength: strong at any number of options,
                          provided the operations of an option can be
                          identified, which the identity of a variant
                          operation, an open decision, settles.

