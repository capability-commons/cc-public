title:                  Sibling candidates of one abstract variant, without every measure
brief:                  |
                        Patrol's three headless candidates are
                        children of one abstract Orin variant, so
                        "differ only in the operations of the options"
                        is each child's own list, which a check can
                        compute. But tracks out sends no video and so
                        has no video latency, so a check that demands
                        identical measures would refuse a fair
                        comparison; it should demand the measures of
                        the concern argued.
description:            |
                        Sources:
                        - The tracks, video and mixed Orin drafts have
                          the Orin draft as base.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin_tracks.yaml
                          line 17;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_video.yaml
                          line 18;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          line 18)
                        - Tracks out sends tracks and detections only,
                          and no video leaves the Orin.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin_tracks.yaml
                          lines 12-16)
                        - The check requires shared "scenario,
                          measures, seed policy and fidelity".
                          (_data/decision/dec_comparability_of_runs_across_options/opt_comparability_check_over_sibling_runs.yaml
                          lines 12-17) Strength: strong for the first
                          decision Patrol will put to runs; the
                          measure caveat holds wherever options differ
                          in what they output.

