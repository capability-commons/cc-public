title:                  A comparability check whose cost comes before any run exists
brief:                  |
                        The check is the only option that costs
                        development effort, and nearly all of it goes
                        on parts that do not exist yet: run fields,
                        the difference tool and a map from options to
                        operations. With no run recorded, that effort
                        buys nothing until the first experiment, while
                        guidance costs only the advocates' time.
description:            |
                        Sources:
                        - _data holds no variant, run or run schema.
                          (directory listing of _data in the snapshot;
                          _sources/survey/README.md line 80)
                        - The Patrol notes put the run type and the
                          relation at the first experiment.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 112-113)
                        - The survey sizes the check "medium".
                          (_sources/survey/simulation-backed-decisions.md
                          line 141)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief) Strength: moderate; it is about
                          timing. Once runs accumulate the case
                          reverses, since a missed unequal frame then
                          costs a wrong ruling.

