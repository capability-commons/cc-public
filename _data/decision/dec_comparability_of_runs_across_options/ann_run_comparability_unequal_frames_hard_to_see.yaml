title:                  Unequal frames that a reviewer cannot see by reading
brief:                  |
                        Unequal frames across options are the
                        commonest flaw of informal trade studies and
                        the one a reviewer is least likely to spot by
                        eye, and the resolved graphs being compared
                        are never stored, so a reviewer must resolve
                        both to see whether they differ only in the
                        option. Guidance asks reviewers for exactly
                        that, and no rule leaves it to chance; only a
                        check holds it.
description:            |
                        Sources:
                        - Unequal frames are "the most common flaw in
                          informal trade studies", and without the
                          remedy "the support edges look symmetric and
                          are not".
                          (_sources/survey/simulation-backed-decisions.md
                          line 173)
                        - The survey calls it the failure a reviewer
                          is least likely to spot by eye.
                          (_sources/survey/simulation-backed-decisions.md
                          line 141)
                        - Resolved graphs are derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-16)
                        - The check requires shared scenario,
                          measures, seed policy and fidelity, and
                          graphs that differ only in the options'
                          operations.
                          (_data/decision/dec_comparability_of_runs_across_options/opt_comparability_check_over_sibling_runs.yaml
                          lines 12-17)
                        - Reviewability asks whether a person can read
                          a change in full and judge it.
                          (_data/register/reg_concern.yaml line 524)
                          Strength: strong; the comparisons to judge
                          grow with options times runs.

