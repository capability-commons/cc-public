title:                  On each node, within its interface
brief:                  |
                        Each configured dataflow node says whether it
                        is static or dynamic, and an interface may
                        require its nodes to be static, as a node that
                        holds hardware it cannot free for the life of
                        the system must be. A check fails a dynamic
                        node of such an interface.

