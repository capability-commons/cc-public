title:                  Interface limit for a case not yet met
brief:                  |
                        Letting an interface require static nodes adds
                        a second place that states mutability and a
                        check that holds the two together, for a case
                        the owner expects to be rare and that no
                        interface or graph in the tree has yet.
                        Per-node declaration alone covers every case
                        the tree holds, and the limit can be added
                        when a first such node arrives without
                        changing the per-node field.
description:            |
                        Sources:
                        - The option has each configured node say
                          static or dynamic, lets an interface require
                          static, and fails a dynamic node of such an
                          interface.
                          (_data/decision/dec_where_mutability_is_declared/opt_mutability_on_node_with_interface_limit.yaml
                          lines 11-18)
                        - The owner expects nodes that must be static
                          to be rare. (owner's statement, 2026-10-24, answer 1)
                        - "Add a type, relation, field or command only
                          when a real instance needs it."
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml;
                          AGENTS.md lines 236-238)
                        - The only recorded dataflow graph is the
                          Stableflow smoke test, and nothing in it is
                          declared static or dynamic.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml)
                          The dataflow step surface has no field that
                          states a limit on lifetime or mutability.
                          (_data/schema/sch_interface_control_document.yaml
                          lines 689-815)
                        - ASSUMPTION: the case may arrive with
                          Patrol's GPU or camera nodes, which would
                          give the limit a real instance. Strength:
                          moderate for simplicity, as the extra field
                          and rule are fixed in count; weak for
                          traceability, since it challenges the timing
                          of the limit, not its form.

