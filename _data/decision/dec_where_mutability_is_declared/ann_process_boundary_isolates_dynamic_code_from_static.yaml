title:                  Address space as the boundary between static and dynamic code
brief:                  |
                        The engine is C++, so code loaded into a
                        process can read and write any memory of that
                        process, and a native crash ends the whole
                        process. If mutability is declared per OS
                        process, static and dynamic nodes never share
                        an address space, so a faulty or hostile
                        dynamic node cannot change a static node's
                        state or buffers or crash it. Per-node
                        declaration needs another isolation rule where
                        this matters, which rests on the placement
                        decision, and the boundary is lost on a target
                        with no processes.
description:            |
                        Sources:
                        - The dynamic host loads component libraries
                          into its process with dlopen.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 65)
                        - Components are C-linkage functions, and
                          within a process an input points at the
                          upstream node's own output buffer; the
                          framework catches what is thrown and maps it
                          to an exit signal.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 26-42, 95-96) ASSUMPTION: a memory
                          fault such as a segmentation fault is not
                          caught by that wrapper and ends the process.
                        - Within one process, edges are plain shared
                          buffers.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 124-125)
                        - Spatial partitioning keeps a component from
                          altering the code or private data of others,
                          as in ARINC 653-style separation kernels.
                          (https://arxiv.org/pdf/1508.07066, section
                          2.2)
                        - The engine is to reach embedded systems
                          "where there may not be an OS at all".
                          (owner's statement, 2026-10-24)
                        - ASSUMPTION: C++17 gives no memory safety
                          between code in one address space; separate
                          OS processes have separate address spaces.
                          Strength: strong for security at scale,
                          since more dynamic nodes in a process means
                          more code that can reach static memory;
                          moderate for reliability; weak for safety,
                          as it conflicts with the owner's statement
                          that mutability belongs to each configured
                          node. None of the three drives the dataflow
                          model; kept as a strong non-driver point. It
                          costs a crossing between processes at every
                          boundary edge.

