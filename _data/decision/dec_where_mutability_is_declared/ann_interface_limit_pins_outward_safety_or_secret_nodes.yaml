title:                  Interface limit for nodes that outside readers, safety cases or secrets rely on
brief:                  |
                        The same interface limit can hold static a
                        node whose output an outside system reads, one
                        a system's safety case relies on, or one that
                        holds a key or credential, so no configuration
                        can make it replaceable at run time. Under the
                        other options keeping such a node static
                        depends on each configuration remembering to
                        do so. The outward-facing part loses most of
                        its force if the decision on swapping a node
                        version rules out live swap.
description:            |
                        Sources:
                        - The option lets an interface require its
                          nodes to be static, and a check fails a
                          dynamic node of such an interface.
                          (_data/decision/dec_where_mutability_is_declared/opt_mutability_on_node_with_interface_limit.yaml at title and brief)
                        - In the mixed Patrol variant, exactly three
                          contracts cross hosts, and all face the
                          outside world: camera RTP, the track stream
                          and the HTTP API.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 94-96) The track stream protocol is
                          still open.
                          (_sources/cc-patrol-notes/draft/icd-list.md
                          line 36)
                        - A dynamic node may be swapped from version n
                          to n+1 while the system runs. (owner's
                          statement, 2026-10-24)
                        - An interface control document carries a
                          version, and its dataflow step surface
                          states the execution semantics compatibility
                          depends on.
                          (_data/schema/sch_interface_control_document.yaml at allOf.2.properties.version_interface and $defs.surface_dataflow_step.description)
                        - The engine must let systems meet their own
                          safety and security requirements to a
                          reasonable degree. (owner's statement,
                          2026-10-22)
                        - ASSUMPTION: an outside reader does not take
                          part in the engine's change protocol, so a
                          live swap that changes its input reaches it
                          unannounced. ASSUMPTION: the limit would be
                          stated on the interface, so an integrator
                          can use it for reasons other than hardware;
                          the option as written names only the
                          hardware case. Strength: moderate; it holds
                          at scale, since more systems mean more
                          outside boundaries and more configurations
                          that could forget a rule held per
                          configuration. Safety and security are not
                          drivers of the dataflow model; their points
                          are kept as they extend the same limit to
                          their own reasons.

