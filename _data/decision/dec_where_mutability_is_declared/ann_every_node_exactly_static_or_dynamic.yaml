title:                  Exactly one of static or dynamic for every node
brief:                  |
                        The owner requires every node to be exactly
                        one of static or dynamic. A required
                        two-valued field on each configured node gives
                        that by the schema alone, with no new check
                        rule. Under the per-process option a node
                        takes its mode from an OS process, which today
                        is an optional local key rather than an item
                        of its own and is absent on a bare core with
                        no OS, so a node could be neither, and its
                        mode would carry the reasons for its placement
                        rather than a reason of its own. The weight on
                        a bare core rests on the placement decision.
description:            |
                        Sources:
                        - "A node cannot be both, and a node cannot be
                          neither." (owner's statement, 2026-10-24)
                        - The os_process field of a dataflow node is
                          optional, and the graph's os_process section
                          is optional too.
                          (_data/schema/sch_dataflow_node.yaml lines
                          56-62; _data/schema/sch_dataflow_graph.yaml
                          lines 77-85) The check that a node's OS
                          process exists fires only when one is named.
                          (src/cctool/check/check.lp lines 3401-3404)
                        - OS processes are filed under short local
                          keys in a dataflow graph, and the data item
                          type register lists no type for them.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          37-40;
                          _data/register/reg_data_item_type.yaml)
                        - Node items are validated against JSON
                          Schema, where a required property with an
                          enum of two values admits exactly one.
                          (_data/schema/sch_dataflow_node.yaml lines
                          1, 38-42; an existing enum in
                          _data/schema/sch_dataflow_graph.yaml lines
                          193-198)
                        - Today an OS process requires a host, and a
                          host a hostname.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          112-142) The owner wants placement to apply
                          to embedded systems "where there may not be
                          an OS at all". (owner's statement,
                          2026-10-24)
                        - One placement option replaces OS processes
                          with execution units.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml)
                          Strength: strong for simplicity (one field,
                          no rule, at any size); holds at scale for
                          traceability; weak to moderate for
                          functional suitability, since making
                          os_process required closes the gap; moderate
                          for flexibility (non-driver), resting on the
                          placement decision.

