title:                  Moving one node between subgraphs without moving its process
brief:                  |
                        When each configured node states static or
                        dynamic, moving a node between subgraphs is
                        one field in the configuration, and its code,
                        its interface and its process placement are
                        untouched, as the owner asked. When the OS
                        process sets it, the process gets two jobs,
                        where nodes run and whether they may change,
                        so moving one node means moving it to another
                        process and changing the transport of every
                        edge that then crosses processes. This rests
                        in part on the placement decision, which may
                        replace OS processes with execution units.
description:            |
                        Sources:
                        - Static or dynamic "is a property of how it's
                          configured", and the same code should run
                          either way. (owner's statement, 2026-10-24, answer 1)
                        - The owner wants placement to cover threads,
                          separate processes and embedded systems with
                          no OS. (owner's statement, 2026-10-24)
                        - A dataflow node names its OS process by a
                          key. (_data/schema/sch_dataflow_node.yaml
                          lines 56-62) An OS process is where dataflow
                          nodes run in order.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          37-40, 77-85)
                        - Under the per-process option, a process is
                          static or dynamic as a whole and every node
                          takes that from it.
                          (_data/decision/dec_where_mutability_is_declared/opt_mutability_on_os_process.yaml
                          lines 11-14)
                        - Within one process an edge is a shared
                          buffer; between processes its transport is
                          still open.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 120-128) Moving a node to another
                          process binds the edges that now cross to a
                          transport.
                          (_sources/cc-patrol-notes/variants.md
                          line 66)
                        - Precedent for the per-process option: a
                          frozen island always runs within a single OS
                          process.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          line 80) Values cross between execution
                          units at step boundaries in one placement
                          option, which the per-process grouping would
                          reuse.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          lines 21-23)
                        - Naming note for whichever option wins: the
                          interface schema already uses "mutability",
                          with values immutable and mutable, for
                          whether a callee may change what a parameter
                          refers to and whether a caller may write an
                          attribute.
                          (_data/schema/sch_interface_control_document.yaml
                          lines 239-248 and 352-360) Strength: strong
                          for maintainability, since under the
                          per-process option the edges touched by one
                          move grow with the node's fan-in and
                          fan-out; moderate for functional suitability
                          and simplicity, since the per-process option
                          has a real precedent.

