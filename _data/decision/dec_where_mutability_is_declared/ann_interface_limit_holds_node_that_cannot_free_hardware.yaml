title:                  Static-only limit held on the interface
brief:                  |
                        A node that holds hardware it cannot free for
                        the life of the system must be static, and
                        that is a fact about its interface. Only the
                        interface-limit option states it there, where
                        a requirement can name it and one check covers
                        every configuration that uses the node; under
                        the other options a configuration that makes
                        such a node dynamic is accepted, and a later
                        change or swap would try to replace a node
                        whose resources cannot be given back.
description:            |
                        Sources:
                        - "I can imagine some specific circumstances
                          around allocation of exotic hardware
                          resources that cannot be freed for the
                          lifetime of the system where a node might
                          HAVE to be static - but I expect that to be
                          rare." (owner's statement, 2026-10-24, answer 1)
                        - Only the dynamic subgraph supports nodes
                          being added, moved or removed. (owner's
                          statement, 2026-10-24)
                        - The option fails a dynamic node of an
                          interface that requires static nodes.
                          (_data/decision/dec_where_mutability_is_declared/opt_mutability_on_node_with_interface_limit.yaml at title and brief)
                        - The checker already lets an interface
                          constrain its nodes: an unfed input fails
                          unless the interface states it optional.
                          (src/cctool/check/check.lp within unfed_input;
                          _data/schema/sch_interface_control_document.yaml at $defs.port.allOf.1.properties.optional)
                        - The subject of a requirement must be a
                          design entity; interface control documents
                          and interface members play that role, and a
                          dataflow node plays the implementation role.
                          (_data/register/reg_relation.yaml at entries.relation_has_subject;
                          _data/register/reg_data_item_type.yaml at entries.type_interface_control_document, entries.type_interface_member and entries.type_dataflow_node)
                        - Cross-item checks are logic rules over
                          extracted facts.
                          (_data/decision/dec_checker_approach/ruling_checker_approach.yaml)
                          Strength: moderate; the case is rare by the
                          owner's words, but one statement on an
                          interface covers every node that presents it
                          and costs one rule however large the graph.
                          The per-node field is the same in both
                          per-node options, so the limit can be added
                          later without touching existing graphs.

