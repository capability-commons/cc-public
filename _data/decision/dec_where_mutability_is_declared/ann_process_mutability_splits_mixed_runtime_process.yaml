title:                  One OS process shared by three runtimes
brief:                  |
                        In the Patrol draft, GStreamer, engine and
                        Python nodes all run in one OS process, joined
                        in-process by appsink and appsrc adapters. If
                        mutability is declared on the OS process, the
                        GStreamer and Python nodes take a mode the
                        engine does not control for them, and making
                        only the engine nodes dynamic means splitting
                        the process, which breaks the in-process links
                        to GStreamer.
description:            |
                        Sources:
                        - The Patrol base graph has one OS process,
                          main, and all 22 of its nodes name it: 12
                          GStreamer, 9 engine, 1 Python.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 23-31, 41-42, 213-214, 338-339;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 22-23)
                        - Data goes from GStreamer to the engine
                          through an appsink adapter, and back through
                          appsrc or element properties.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 49-50) A gst_link edge is allowed only
                          between GStreamer nodes in one OS process.
                          (same file, lines 59-60)
                        - Only the dynamic subgraph allows nodes and
                          edges to change, at the start of a step.
                          (owner's statement, 2026-10-24)
                        - ASSUMPTION: appsink and appsrc hand buffers
                          over within one process, so an adapter edge
                          cannot cross a process boundary without
                          another transport; a GStreamer pipeline is
                          changed by GStreamer's own mechanisms, so
                          engine mutability means nothing for a
                          GStreamer node. Not checked against the
                          GStreamer documentation.
                        - The per-node options would then need a rule
                          for nodes the engine does not run, if the
                          schema adds a runtime per node as the Patrol
                          draft does.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          line 3) Strength: holds at ten times the
                          nodes, since each process then holds more
                          nodes and is more likely to mix runtimes;
                          weaker for a graph of engine nodes alone.

