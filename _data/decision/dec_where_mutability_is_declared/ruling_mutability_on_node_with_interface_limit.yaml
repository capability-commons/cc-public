title:                  Mutability on the node with an interface limit
brief:                  |
                        Each configured dataflow node says whether it
                        is static or dynamic, and an interface may
                        require its nodes to be static. Ruled by WTP
                        on 2026-10-26, as recommended. WTP had already
                        rejected mutability on the OS process.

