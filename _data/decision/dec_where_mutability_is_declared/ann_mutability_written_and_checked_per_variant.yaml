title:                  Mutability set by a variant and checked across a deployment's modes
brief:                  |
                        When each configured node states static or
                        dynamic, one base gives a fixed deployment and
                        a changeable lab variant by a write operation
                        per node, with no change of placement, where
                        under the per-process option the lab variant
                        must move nodes to another process, by process
                        and place operations and, as in the mixed Orin
                        variant, perhaps a host operation. A per-node
                        field also lets a check hold that a node
                        declared static in a deployment is unchanged
                        across every mode, every sibling variant, that
                        the deployment may switch between, which is
                        one answer to how static and dynamic relate to
                        variants.
description:            |
                        Sources:
                        - Each configured node says whether it is
                          static or dynamic, so the same node code can
                          run either way in different configurations.
                          (_data/decision/dec_where_mutability_is_declared/opt_mutability_on_each_configured_node.yaml
                          lines 12-17)
                        - An OS process is static or dynamic as a
                          whole.
                          (_data/decision/dec_where_mutability_is_declared/opt_mutability_on_os_process.yaml
                          lines 12-15)
                        - The drafted write operation sets a node's
                          settings by a dotted address, and the mixed
                          Orin variant uses host, process and place
                          operations to move nodes.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 26-32;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 25-35)
                        - "How static and dynamic relate to variants"
                          is listed as a missing decision.
                          (notes/engine-shape-2026-10-24/ruling-guide.md
                          line 73, in the project files)
                        - A node is static in a deployment when it is
                          unchanged across every mode the deployment
                          may switch between.
                          (_sources/variants-framing.md, section 2)
                          Strength: weak to moderate; the placement
                          part extends the existing argument on moving
                          one node alone to whole variants, and the
                          check across modes is a proposal not yet
                          made.

