title:                  A restated signature drifted before
brief:                  |
                        In the September design the stated signature
                        was a second copy that nothing held to the
                        code, and it drifted while the edge still
                        resolved.
description:            |
                        In the September iteration (origin/main of
                        cc-public, tag baseline_20260918),
                        annotation/ann_icd_signature_is_a_second_copy.yaml
                        records it. The check here compares names and
                        order, but not types, defaults or what is
                        returned, so those can still drift.

