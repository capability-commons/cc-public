title:                  Whether a member restates the signature
brief:                  |
                        A function member restates the signature of
                        the function that realizes it, and the
                        restatement is checked mechanically:
                        parameter_mismatch checks the names and order
                        of the parameters, and signature_mismatch
                        checks the type, default, optional and
                        variadic of each and the type returned,
                        wherever the member states them. Ruled by WTP,
                        who accepted the duplication on condition that
                        it is checked mechanically (2026-10-19).

