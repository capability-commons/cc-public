title:                  Signature check that now covers types and returns
brief:                  |
                        ann_restated_signature_drifted_before says the
                        check compares names and order, but not types,
                        defaults or what is returned. The check
                        signature_mismatch now compares each of these
                        that a member states.
description:            |
                        signature_mismatch (src/cctool/check/check.lp
                        within signature_mismatch, its two rules)
                        compares, for each part a member states, the
                        type and default of each parameter, whether it
                        is optional or variadic, and the type the
                        function returns, with what the python
                        function that realizes it says. The extractor
                        reads these from the code
                        (src/cctool/graph/extract.py within
                        _parameters and _returns). A part the member
                        does not state is still not compared. Found in
                        the review of 2026-10-22.

