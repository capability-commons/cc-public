title:                  A stated signature is held to the code
brief:                  |
                        parameter_mismatch and signature_mismatch
                        compare every part of a signature that a
                        member states with the function that realizes
                        it, so a stated signature that drifts from the
                        code fails at the next commit. The engineering
                        document stays a faithful trace of the code.

