title:                  The jsonschema-rs check is kept in one module
brief:                  |
                        The check lives in the schema module alone and
                        reports nothing of its own, so a reviewer
                        reads one module to see what it changes, and
                        the rows of a check read the same as before.
description:            |
                        Sources:
                        - Only src/cctool/check/schema.py imports
                          jsonschema_rs, and its rows come from
                          jsonschema [src/cctool/check/schema.py
                          within _errors_of].

