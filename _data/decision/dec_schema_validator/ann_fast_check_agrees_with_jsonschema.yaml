title:                  The jsonschema-rs check agrees with jsonschema
brief:                  |
                        On the tree, and on tens of thousands of its
                        YAML documents changed at random, the
                        jsonschema-rs check found a document to
                        conform exactly when jsonschema did. A pattern
                        is read by the same function for both, and a
                        value that plain JSON cannot hold goes to
                        jsonschema.
description:            |
                        Sources:
                        - The rows of the whole tree are the same with
                          and without the check: 0 rows each over
                          3,661 pairs [measured by Claude in the cloud
                          container on 2026-10-28].
                        - 19,000 YAML documents of the tree, each
                          changed in one place at random (a field
                          removed or added, a value replaced, a
                          character put into a string): 0 that
                          jsonschema refused were passed by
                          jsonschema-rs; 3 that jsonschema passed were
                          validated again by jsonschema, which costs
                          time but loses nothing [measured by Claude
                          in the cloud container on 2026-10-28].
                        - A property test changes YAML documents of
                          the tree and asserts the two verdicts are
                          the same; it passed at 2,000 examples
                          [src/cctool/_test/test_property.py within
                          test_the_fast_check_of_a_changed_document_agrees_with_jsonschema].
                        - jsonschema-rs reads \d as ECMA 262 does,
                          ASCII digits only, while the pattern
                          function reads it as Python does; the
                          replaced keyword makes the two read every
                          pattern alike [src/cctool/check/schema.py
                          within _Match;
                          src/cctool/check/_test/test_check.py within
                          test_the_fast_check_of_a_schema_reads_a_pattern_as_jsonschema_does].
                        - Formats are asserted by neither
                          [src/cctool/check/schema.py within _Fast].

