title:                  The whole tree validated in under half a second
brief:                  |
                        With the jsonschema-rs check first, schema
                        validation of the whole tree takes about 0.4 s
                        in place of about 13 s, a cold check of the
                        tree runs in about 27 s in place of about 41
                        s, and the check and edit tests in about 282 s
                        in place of about 325 s.
description:            |
                        Sources:
                        - 3,661 pairs of a YAML document and a schema,
                          the document_schema rows of the tree,
                          validated in 0.37 s with the jsonschema-rs
                          check and in 12.84 s with jsonschema alone,
                          giving the same rows [measured by Claude in
                          the cloud container on 2026-10-28, Python
                          3.14, jsonschema-rs 0.60.3].
                        - cctool check with no store took 41.6 s and
                          41.0 s on dev 7e7ce86d, and 27.1 s and 27.5
                          s with the change, on the same tree and
                          machine [measured by Claude in the cloud
                          container on 2026-10-28].
                        - The tests of src/cctool/check/_test and
                          src/cctool/edit/_test, run in one process,
                          took 325 s on dev 7e7ce86d and 282 s with
                          the change [measured by Claude in the cloud
                          container on 2026-10-28].
                        - Schema validation was 12.0 s of a whole-tree
                          check, the second largest step after layout
                          [measured by Claude in the cloud container
                          on 2026-10-27, profile of cctool check].
                        - The check and edit tests check many small
                          trees, and each validates its documents
                          again [src/cctool/check/schema.py within
                          violations].

