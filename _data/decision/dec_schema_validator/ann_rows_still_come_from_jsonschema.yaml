title:                  The rows still come from jsonschema
brief:                  |
                        What the check reports for a document that
                        breaks a schema, its path, line and message,
                        is still found by jsonschema, so the reports,
                        and the store of verdicts, are the same under
                        either option.
description:            |
                        Sources:
                        - A document that fails the check is validated
                          with jsonschema, whose errors give the rows
                          [src/cctool/check/schema.py within
                          _errors_of and _row].
                        - The same 0 rows on the tree with and without
                          the check [measured by Claude in the cloud
                          container on 2026-10-28].

