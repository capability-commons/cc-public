title:                  A jsonschema-rs check first, then jsonschema for a document that fails it
brief:                  |
                        Each YAML document is checked with
                        jsonschema-rs first, and only one that fails,
                        or that plain JSON cannot hold, is validated
                        again with jsonschema, whose errors give every
                        row. The overnight run validates with
                        jsonschema alone, through pixi run check-full,
                        so that a document jsonschema-rs passes in
                        error is reported within a day rather than at
                        once; that delay is the accepted cost of the
                        speed. jsonschema alone is rejected. Ruled by
                        WTP on 2026-10-28 at 14:35 UTC, by writing
                        "Uphold the jsonschema-rs check".

