title:                  Overnight check with jsonschema alone
brief:                  |
                        The annotation says only the property tests
                        would find a document that jsonschema-rs
                        passes in error. Now pixi run check-full
                        validates every document with jsonschema
                        alone, and the ruling on the validator relies
                        on that run.
description:            |
                        CCTOOL_SCHEMA_FULL (src/cctool/check/schema.py
                        within ENV_FULL) turns off the fast path, and
                        the pixi task check-full sets it
                        (pyproject.toml at tool.pixi.tasks). No run is
                        scheduled yet, so the check is there but not
                        yet run each night. Found in the weekly review
                        of 2026-10-29.

