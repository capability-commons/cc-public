title:                  Two validators to keep in step
brief:                  |
                        The check adds about 200 lines to the schema
                        module: a copy of each YAML document as plain
                        JSON, a bridge that gives jsonschema-rs the
                        pattern function, and a registry that leaves
                        out a schema whose $ref names none. An upgrade
                        of either library may need them changed, and
                        the property test to show they still agree.
description:            |
                        Sources:
                        - src/cctool/check/schema.py within _Fast,
                          _registry_fast, _Match, ErrorUnplain and
                          plain.
                        - The check store keys its verdicts by the
                          versions of both libraries, so an upgrade
                          validates again [src/cctool/check/store.py
                          within TUPLE_DIST].

