title:                  jsonschema-rs is a compiled dependency that changes fast
brief:                  |
                        jsonschema-rs adds a compiled dependency,
                        published by one maintainer, still before
                        version 1, with six releases in October 2026;
                        the version used was a day old. It ships
                        wheels for every platform the tool supports,
                        and the pin keeps it to one minor version.
description:            |
                        Sources:
                        - PyPI lists Dmitry Dygalo as author, the MIT
                          license, and wheels for macOS on x86-64 and
                          arm64, Linux on x86-64 and aarch64, and
                          Windows, for version 0.60.3
                          [https://pypi.org/project/jsonschema-rs/0.60.3/,
                          read by Claude on 2026-10-28].
                        - Releases 0.58.5, 0.58.6, 0.59.0, 0.60.0,
                          0.60.1 and 0.60.3 were uploaded between
                          2026-10-02 and 2026-10-27
                          [https://pypi.org/pypi/jsonschema-rs/json,
                          read by Claude on 2026-10-28].
                        - The dependency is pinned to 0.60
                          [pyproject.toml at project.dependencies].
                        - jsonschema stays a dependency under either
                          option [pyproject.toml at
                          project.dependencies].

