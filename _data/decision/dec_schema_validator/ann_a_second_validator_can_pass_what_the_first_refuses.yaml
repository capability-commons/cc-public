title:                  A second validator can pass what the first refuses
brief:                  |
                        A document that jsonschema-rs passes is not
                        validated again, so a keyword that
                        jsonschema-rs reads more loosely than
                        jsonschema would let a violation go
                        unreported, with nothing to show it. Only the
                        property tests, which the gate of a commit
                        leaves out, would find such a difference.
description:            |
                        Sources:
                        - A document the check passes is kept as
                          having no rows [src/cctool/check/schema.py
                          within _errors_of].
                        - Every keyword but pattern is read by
                          jsonschema-rs itself
                          [src/cctool/check/schema.py within _Fast].
                        - The property tests are marked fuzz, which
                          the gate of a commit leaves out; the gate of
                          a push runs them with few examples, and an
                          overnight run with many
                          [src/cctool/_test/test_property.py at
                          description].

