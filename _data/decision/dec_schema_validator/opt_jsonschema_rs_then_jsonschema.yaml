title:                  A jsonschema-rs check first, then jsonschema for a document that fails it
brief:                  |
                        Ask jsonschema-rs, a JSON Schema validator
                        written in Rust, only whether each YAML
                        document conforms, with its pattern keyword
                        replaced by the function that reads a pattern
                        for jsonschema. Validate again with jsonschema
                        only a document it finds to fail, or one it
                        cannot be given as plain JSON, such as one
                        that holds a date, so that every row the check
                        reports still comes from jsonschema.

