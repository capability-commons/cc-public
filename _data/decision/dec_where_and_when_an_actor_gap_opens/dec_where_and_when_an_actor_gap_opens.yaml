title:                  Where and when an actor gap opens
brief:                  |
                        Actors run in gaps between Kahn steps, but
                        steps are local to an execution unit. Whose
                        steps bound the gap of an actor, and what
                        happens in a gap?
description:            |
                        The rulings are ruling_actors_between_steps,
                        ruling_messages_waiting_when_the_gap_opens,
                        ruling_crossing_policy_on_the_edge and
                        ruling_reading_derived_by_placement, and the
                        requirements rqt_actors_admit_waiting_only and
                        rqt_actors_fixed_order. No algorithm for the
                        gap is written down. The trial implementation
                        of 2026-10-29 opened a gap after each local
                        step of the unit that held the actor, with one
                        buffer shared by every unit, so actors in two
                        units corrupted each other's gaps (review of
                        2026-10-29, CC-002). What one message from a
                        Kahn edge into an actor is, is open in
                        dec_unit_of_a_message_from_kahn_into_an_actor.

