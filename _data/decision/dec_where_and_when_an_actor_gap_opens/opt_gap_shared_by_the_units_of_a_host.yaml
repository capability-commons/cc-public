title:                  Gap shared by the units of a host
brief:                  |
                        One gap for each host, which opens when every
                        execution unit on the host has completed a
                        local step, so that all actors on the host see
                        one consistent set of messages, at the cost of
                        a barrier across the units of the host.
description:            |
                        1. Each unit, after its local step, waits at
                          the host's barrier.
                        2. When all have arrived, one thread takes the
                          messages waiting for every actor on the
                          host, runs them in the fixed order, and
                          holds their writes for the next local step
                          of each reader.
                        3. The units are released together, and each
                          admission is reported with the local step of
                          every unit on the host.

