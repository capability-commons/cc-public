title:                  Crossing, copy and step of latency on every edge of an actor unit
brief:                  |
                        In a unit of their own, actors reach Kahn
                        nodes only through a sender and receiver pair,
                        so each edge between a Kahn node and an actor
                        becomes a crossing, with a copy into its
                        queue. A Kahn output reaches the actor at the
                        actor unit's next tick, and the answer reaches
                        its Kahn reader at that reader's next step
                        after it arrives. That can be as much as one
                        actor period and one Kahn step later than a
                        gap in the same unit, where the actor sees the
                        output of the step just finished and its
                        reader gets the answer at the next local step.
                        At 30 Hz a Kahn step is 33 ms. The gain is
                        that actors can be placed and paced apart from
                        the Kahn units.
description:            |
                        Sources:
                        - Messages between the actor unit and Kahn
                          units go through a
                          sender and receiver.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_actors_in_a_unit_of_their_own.yaml at description, step 3)
                        - A transform inserts a sender and receiver
                          wherever placement puts
                          the ends of an edge in different units, and a value is copied
                          into each queue it passes through.
                          (_data/decision/dec_how_values_cross_execution_units/ruling_transport_nodes_inserted_by_a_transform.yaml at brief;
                          _data/decision/dec_how_a_value_is_carried_along_an_edge/ruling_value_copied_into_each_queue.yaml at brief)
                        - In the per-unit gap the unit takes the
                          messages after its step,
                          and what an actor writes toward a Kahn node is held for the next
                          local step.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_gap_after_each_local_step_of_its_unit.yaml at description)
                        - When each stage reads what its producer
                          wrote in the step
                          before, latency grows by a step for each level.
                          (Bamakhrama and Stefanov 2012, Managing latency in embedded
                          streaming applications under hard-real-time scheduling, Theorem 4)
                        - Patrol's camera runs at 30 Hz. (WTP,
                          2026-10-28) Strength: moderate; it matters
                          for actors in a control path, such as a
                          planner answering a perception step, and
                          little for actors that handle operator
                          commands.

