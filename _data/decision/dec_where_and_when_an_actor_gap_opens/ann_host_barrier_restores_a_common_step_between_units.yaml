title:                  Host barrier that brings back a common step the ruling excludes
brief:                  |
                        A gap shared by the units of a host opens only
                        when every unit on the host has finished a
                        step, so every unit waits for the slowest and
                        for the actors of all the others. That is a
                        common step for the host, which the ruling on
                        reading by placement excludes. In the trial,
                        lockstep through the channel of host readings
                        alone held a 10 ms unit to 50 ms, and through
                        one lossless crossing a 2 ms unit reported 99
                        overruns in 104 steps. A gap per unit, or a
                        unit of actors, leaves each unit at its own
                        period.
description:            |
                        Sources:
                        - Steps are local to an execution unit, and
                          between units there is
                          no common step; WTP expects nodes to be moved between units
                          until they run smoothly.
                          (_data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml at brief and description)
                        - Kahn steps are spread by placing nodes on
                          hosts and execution
                          units.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml at brief)
                        - Each unit waits at the host's barrier, and
                          one thread runs every
                          actor of the host before the units are released together.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_gap_shared_by_the_units_of_a_host.yaml at description)
                        - Host readings alone held a 10 ms unit to 50
                          ms, and a 2 ms unit
                          feeding a 20 ms unit through a lossless crossing had 99 overruns
                          in 104 steps. (review of 2026-10-29, CC-011)
                        ASSUMPTION: a barrier binds the units of a
                        host at least as tightly as those lossless
                        crossings did. Strength: strong; the barrier
                        is the option's mechanism, not a defect of an
                        implementation.

