title:                  Flood of outside messages confined to the unit it targets
brief:                  |
                        The trial kept one queue of 1024 messages for
                        every actor of every unit. Once it was full,
                        an outside message to any actor was refused,
                        so whoever can send to one actor could starve
                        all of them. When actors in two units shared
                        its snapshot, one handled only 240 of its own
                        400 messages. With a gap and queues per unit,
                        a flood fills only the queue of the unit it
                        targets, and with a unit of actors it stays
                        out of the Kahn units. In a shared host gap, a
                        flood to any actor lengthens the one gap that
                        every unit of the host waits for.
description:            |
                        Sources:
                        - One queue and one snapshot of 1024 messages
                          served all actors,
                          and an outside send beyond it was refused for any actor, as read
                          from the code. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/actors.cpp, functions enqueue
                          and hook_send)
                        - Messages routed beyond the queue were
                          dropped with no event.
                          (area report trial-engine, TE-19)
                        - With actors in two units, relay2 handled 240
                          of its 400 messages.
                          (review of 2026-10-29, CC-002)
                        - Outside messages enter through runtime
                          control. (trial process
                          log, phase 4)
                        - Each unit has its own queues; in the shared
                          option one gap of the
                          host runs every actor while the units wait.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_gap_after_each_local_step_of_its_unit.yaml at brief;
                          _data/decision/dec_where_and_when_an_actor_gap_opens/opt_gap_shared_by_the_units_of_a_host.yaml at description)
                        Strength: moderate; a declared capacity per
                        actor would confine a flood further under any
                        option.

