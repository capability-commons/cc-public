title:                  Actors in a unit of their own
brief:                  |
                        Actors are placed in an execution unit that
                        holds only actors, with its own period. Its
                        gap opens at each of its own ticks, and
                        messages between it and the Kahn units cross
                        like any edge between units.
description:            |
                        1. At each tick, the actor unit takes the
                          messages waiting for its actors, and only
                          those.
                        2. It runs each actor once for each message,
                          in the fixed order.
                        3. Messages to Kahn units go through a sender
                          and receiver, whose delivery policy makes
                          them a token in the reader's local step.
                        4. The actor unit reports each admission with
                          its own tick number.

