title:                  Host barrier that grows with every unit placed on the host
brief:                  |
                        Placement may give a host as many units as it
                        has cores, and with a shared gap every one of
                        them joins the host's barrier. More cores then
                        mean more units waiting for the slowest.
                        C++17, the engine's language, has no barrier,
                        since std::barrier came with C++20, and POSIX
                        barriers are missing on macOS, so the barrier
                        is written in-house or taken from a library,
                        while the other two options need only a lock
                        per queue. On a target with a single thread, a
                        gap per unit runs the actors on the one unit
                        there is, while a unit of actors needs a
                        second unit.
description:            |
                        Sources:
                        - A variant can be generated with as many
                          processes on a host as
                          it has cores.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml at brief)
                        - Each unit, after its local step, waits at
                          the host's barrier.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_gap_shared_by_the_units_of_a_host.yaml at description, step 1)
                        - The engine is a new C++17 engine targeting
                          embedded reach.
                          (WTP, 2026-10-28)
                        - std::barrier is defined in the header
                          barrier since C++20
                          (cppreference, https://cppreference.com/cpp/thread/barrier,
                          checked 2026-10-29).
                        - PostgreSQL supplies its own
                          pthread_barrier_t for macOS, which
                          lacks one (PostgreSQL source, src/include/port/pg_pthread.h,
                          https://doxygen.postgresql.org/pg__pthread_8h_source.html,
                          checked 2026-10-29).
                        - The actor unit is an execution unit of its
                          own.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_actors_in_a_unit_of_their_own.yaml at brief)
                        Strength: weak on dependency, since a barrier
                        is a few lines over a mutex and a condition
                        variable; moderate on scaling.

