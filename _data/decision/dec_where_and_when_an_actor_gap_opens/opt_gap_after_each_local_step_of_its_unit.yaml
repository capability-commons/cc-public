title:                  Gap after each local step of its unit
brief:                  |
                        Each actor is placed in one execution unit,
                        and that unit opens a gap after each of its
                        local steps. Each unit has its own gap, its
                        own queues and its own record of admissions.
description:            |
                        1. After its local step, the unit takes the
                          messages waiting for its own actors, and
                          only those.
                        2. It runs each actor once for each message,
                          in the fixed order: by source in the
                          declared order, then by sequence within a
                          source.
                        3. What an actor writes to another actor waits
                          for the next gap; what it writes toward a
                          Kahn node is held for the next local step,
                          where the crossing policy of the edge makes
                          it a token.
                        4. The unit reports each admission with the
                          step the gap follows. A message between
                          actors in two units crosses like any edge
                          between units.

