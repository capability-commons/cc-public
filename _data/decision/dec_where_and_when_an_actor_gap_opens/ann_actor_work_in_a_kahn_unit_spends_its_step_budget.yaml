title:                  Actor work run inside a Kahn unit's period
brief:                  |
                        With a gap after each local step, the actors
                        run on the Kahn unit's thread and inside its
                        period. A burst of outside messages, each
                        running its actor once, lengthens that unit's
                        step and can make a control loop overrun. The
                        trial counted the gap in the step's time and
                        admitted up to 1024 messages in one gap. A
                        unit of actors confines a burst to its own
                        ticks, and the Kahn units keep their period. A
                        shared host gap is the worst case, since every
                        unit of the host waits for the actors of all
                        of them.
description:            |
                        Sources:
                        - The gap ran at the end of the unit's
                          generated step, and the
                          unit's loop measured the whole step, gap included, against the
                          period and reported an overrun. (trial 2c777ab9,
                          src/cctool/dataflow/generate.py, method step;
                          src/cctool/dataflow/engine/src/runtime.cpp, function run_unit)
                        - Up to 1024 messages could wait at once, and
                          each admitted
                          message ran its actor once, as read from the code. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/actors.cpp, function
                          actors_gap)
                        - A gap admits only the messages waiting when
                          it opens.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ruling_messages_waiting_when_the_gap_opens.yaml at brief)
                          In the per-unit option the unit takes the messages waiting for
                          its actors and runs each actor once for each, with no bound
                          stated.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_gap_after_each_local_step_of_its_unit.yaml at description, steps 1 and 2)
                        - The actor unit has its own period, and its
                          gap opens at each of
                          its own ticks.
                          (_data/decision/dec_where_and_when_an_actor_gap_opens/opt_actors_in_a_unit_of_their_own.yaml at brief)
                        - Safety asks how each hazard is limited, and
                          measures the time to
                          reach a safe state after a failure.
                          (_data/register/reg_concern.yaml at entries.concern_safety.question and entries.concern_safety.measure)
                        ASSUMPTION: a declared capacity per actor
                        queue bounds the added time of a per-unit gap,
                        so it can be checked against the period.
                        Strength: moderate; with that bound the
                        per-unit gap's cost is known and may be small
                        enough, but it is still paid by the Kahn unit.

