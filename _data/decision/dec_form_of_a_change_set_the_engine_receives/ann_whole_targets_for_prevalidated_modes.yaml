title:                  One whole target for each pre-validated mode
brief:                  |
                        Where a system switches among modes that are
                        sibling variants, each checked ahead of time,
                        a document is needed for every ordered pair of
                        modes, N times N minus 1 of them, while a
                        whole target is needed once for each mode. An
                        orchestrator on the target could then hold one
                        checked target per mode and switch from
                        whichever runs. That holds only if a target
                        may name just the graph it gives, which
                        rqt_control_refuses_wrong_digest would have to
                        allow; named with the graph it leaves, a whole
                        target is pinned to one pair as a document is.
                        No Patrol variant switches by itself today.
description:            |
                        Sources:
                        - Change sets chosen among pre-validated modes
                          are differences
                          between sibling resolved graphs, generated by cctool.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_as_difference_of_resolved_variants.yaml
                          at brief)
                        - A change set carrying one graph's digest
                          applies only to systems
                          running exactly that graph.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_pins_one_exact_graph.yaml
                          at brief)
                        - Change sets may come from where cctool is
                          absent, though no Patrol
                          dataflow variant switches by itself today.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_made_where_cctool_is_absent.yaml
                          at brief)
                        - A request naming a digest other than that of
                          the graph running is
                          refused. (_data/requirement/rqt_control_refuses_wrong_digest.yaml
                          at condition)
                        - Flexibility covers how readily the system is
                          adapted when its
                          environment changes. (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.description)
                        Strength: weak now and growing with the number
                        of modes; it rests on relaxing a requirement.

