title:                  Request and recording row that grow with the whole dynamic subgraph
brief:                  |
                        A whole target carries every dynamic node and
                        edge on every change, a one-node swap
                        included, and the engine compares each with
                        what runs. The trial recorded each change set
                        at its step as one row of the request's text,
                        rows of at most 64 KiB, and a change of 900
                        nodes in 79 KB went unrecorded without a
                        count, so its replay diverged. Under the whole
                        target those limits bind on the size of the
                        subgraph, not of the change. The ruling on the
                        first engine names logging, data recording and
                        telemetry nodes as examples of what the
                        dynamic subgraph may add later, which suggests
                        a small subgraph for now. The comparison falls
                        on the thread of runtime control, though the
                        trial built the row, a copy of the whole
                        request, on the unit's thread at the step of
                        the change.
description:            |
                        Sources:
                        - cctool sends the whole dynamic subgraph that
                          the engine is to run.
                          (_data/decision/dec_form_of_a_change_set_the_engine_receives/opt_whole_target_dynamic_subgraph.yaml
                          at brief)
                        - Each change set is recorded at its step as
                          one row holding the
                          request's text, the recording's rows hold at most 64 KiB, and the
                          change set is built in the thread of runtime control. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/dynamic.cpp, functions
                          install and hook_apply; src/cctool/dataflow/engine/src/runtime.cpp,
                          function run)
                        - The record line of a change set is built on
                          the unit's thread
                          when it is installed. (review of 2026-10-29, CC-009;
                          areas/trial-engine.md, TE-09)
                        - A change set of 900 nodes, 79 KB, was
                          applied but not recorded,
                          the count of dropped rows stayed at zero, and the replay differed.
                          (review of 2026-10-29, CC-015; areas/trial-engine.md, TE-13)
                        - A build with no dynamic nodes leaves out the
                          dynamic machinery
                          unless its user asks for it, for example to add logging, data
                          recording or telemetry nodes later.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          at brief)
                        - A run with live changes is replayed from a
                          recorded log that holds
                          the step of each change set and swap.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml
                          at brief)
                        ASSUMPTION: the dynamic subgraphs of the first
                        systems hold a few nodes, as the ruling's
                        examples suggest. Strength: weak to moderate;
                        it grows with the dynamic subgraph, which is
                        likely small for now, and a recording that
                        holds only digests would not carry the target
                        at all.

