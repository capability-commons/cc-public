title:                  Swaps chosen by the engine that cctool can only predict
brief:                  |
                        Computing the difference decides, for each
                        node in both graphs, whether it is swapped,
                        keeping and upgrading its state, or removed
                        and added, losing it; the trial's deployer
                        made that choice in Python. Under the whole
                        target the engine makes it in C++, while
                        cctool must still refuse, before sending
                        anything, a swap whose state cannot be
                        upgraded, so it can check only the swaps it
                        predicts the engine will choose. Two copies of
                        one rule must then agree, and the trial's two
                        validators already did not. The ruling on
                        checking a change set expects the Python side
                        to turn a change into a materialized form, or
                        a sequence of calls, that fits the engine; a
                        document or a list of calls leaves the choice
                        of swaps there, while a whole target, though
                        itself a materialized form, moves that choice
                        into the engine.
description:            |
                        Sources:
                        - The deployer's change set removes and adds a
                          node whose unit or
                          family of kind differs, and swaps one whose kind or settings
                          differ. (trial 2c777ab9, src/cctool/dataflow/deploy.py, function
                          change_set)
                        - A swap whose state cannot be upgraded is
                          refused by cctool before
                          it is sent.
                          (_data/interface_control_document/icd_dataflow_change_set.yaml at
                          surface.data.artifact.compatibility)
                        - A node version is swapped at a step, with
                          its state upgraded.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        - WTP expects the Python side to turn a change
                          from its canonical
                          form into a materialized form, or a sequence of API calls, that
                          better fits what the C++ runtime can receive.
                          (_data/decision/dec_change_set_at_a_step/ruling_change_set_checked_by_both.yaml
                          at brief)
                        - The change-set check was weaker than the
                          engine, and the fix is
                          one validator shared with the engine's reasons. (review of
                          2026-10-29, CC-029)
                        - Checking graph rules in the runtime as well
                          means two copies in
                          two languages, kept in step with tests that they agree.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_rules_kept_in_one_copy.yaml
                          at brief)
                        ASSUMPTION: a node that is removed and added
                        instead of swapped starts again from its
                        initial state, so a filter or the integrator
                        of a controller restarts in service. Strength:
                        moderate; a parity test over pairs of graphs
                        could hold the two copies together, and the
                        ruling on where variants are resolved admits a
                        whole resolved graph as what a target
                        receives.

