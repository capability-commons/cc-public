title:                  Repeated change set already refused by the digest it names
brief:                  |
                        The whole-target option claims that a lost or
                        repeated request changes nothing, but a
                        document gets that from its digests: it names
                        the graph it applies to, the engine refuses
                        whole one meant for another graph, and once
                        installed the engine runs the graph the change
                        set gives. A repeat is then refused, and the
                        refusal names the graph that runs, so
                        deployment learns that the first one took
                        effect. A whole target gains more only by
                        being accepted whatever graph runs, which
                        rqt_control_refuses_wrong_digest forbids as
                        written. By reading its code, the trial left
                        one hole that any form must close: while a
                        change set waits to be installed, a second one
                        naming the same graph passes and silently
                        replaces it.
description:            |
                        Sources:
                        - A change set carries the digest of the graph
                          it applies to and of
                          the one it gives, and one that applies to a graph other than the
                          one running is refused whole.
                          (_data/interface_control_document/icd_dataflow_change_set.yaml at
                          surface.data.artifact.artifact.change_set.content and
                          surface.data.artifact.failure)
                        - A request naming a content digest other than
                          that of the graph
                          running is refused and changes nothing.
                          (_data/requirement/rqt_control_refuses_wrong_digest.yaml at
                          condition and qualifier)
                        - The deployer sends a change set under the
                          digest of the graph it
                          applies to; runtime control refuses a request naming another
                          digest, with a reason that names the graph running; install sets
                          the running digest to the one the change set gives. (trial
                          2c777ab9, src/cctool/dataflow/deploy.py, function send;
                          src/cctool/dataflow/engine/src/control.cpp, function handle;
                          src/cctool/dataflow/engine/src/dynamic.cpp, function install)
                        - An apply not installed within 2 s is
                          answered ok and pending, and
                          a later apply silently replaces it, the replacement found by
                          reading the code; the digest a request is checked against changes
                          only when a change set is installed. (review of 2026-10-29,
                          areas/trial-engine.md, TE-18; trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, functions hook_apply
                          and install)
                        - With the whole target, a lost or repeated
                          request changes nothing.
                          (_data/decision/dec_form_of_a_change_set_the_engine_receives/opt_whole_target_dynamic_subgraph.yaml
                          at brief)
                        Strength: strong on the digest rule as
                        written; the hole while a change set is
                        pending belongs to
                        dec_how_a_change_set_is_installed, whichever
                        form is chosen.

