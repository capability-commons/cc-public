title:                  Change held open in the engine across a sequence of calls
brief:                  |
                        Under ordered calls, each call before the
                        commit changes what the engine holds, so one
                        change lives across many requests, while the
                        runtime control ICD has each request answered
                        on its own and a failed one change nothing. If
                        deployment dies or loses the channel part way,
                        a half-built change waits for whoever sends
                        next, and the option does not say who owns it,
                        when it is dropped, or whether a refused call
                        discards the calls before it, as
                        case_dynamic_atomic needs. The checks that
                        need the whole result still run only at the
                        commit, as the trial ran them. And the order
                        buys little, since Kramer and Magee order a
                        change so that each node is quiescent before
                        it is unlinked, which a swap at a step gives
                        the whole graph at once.
description:            |
                        Sources:
                        - Requests come one at a time, each answered
                          by one reply, and a
                          request that cannot be carried out changes nothing.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml
                          at surface.data.artifact.production and
                          surface.data.artifact.failure)
                        - The engine checks each call as it comes, and
                          the commit makes them
                          all take effect at one local step.
                          (_data/decision/dec_form_of_a_change_set_the_engine_receives/opt_ordered_list_of_engine_calls.yaml
                          at brief)
                        - A change set that adds two nodes and then an
                          edge to a missing
                          port is refused, and neither node is added.
                          (_data/test_case/case_dynamic_atomic.yaml at preconditions and
                          expected_results)
                        - The trial checks that every input is fed,
                          that none is fed twice,
                          that the dynamic subgraph has no loop and that one unit is
                          touched, all on the whole new graph. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, function build)
                        - A change set left pending between requests
                          is silently replaced
                          by the next, as the review found by reading the code. (review of
                          2026-10-29, areas/trial-engine.md, TE-18)
                        - A node is removed only when quiescent and
                          isolated, and a link is
                          made or broken only when its initiating end is quiescent; the
                          configuration manager, not the user, orders the change (Kramer and
                          Magee 1990, The Evolving Philosophers Problem: Dynamic Change
                          Management, sections on objectives, the management view and node
                          quiescence, via
                          notes/literature/part-2/1990-evolving-philosophers-problem.md).
                        - A node version is swapped at a step.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        - Security asks who can change what, and how
                          that is enforced.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question.0)
                        Strength: moderate to strong; a session id, a
                        count of calls checked at the commit and an
                        abort on any refusal would close the holes, at
                        the cost of a protocol the other two forms do
                        not need.

