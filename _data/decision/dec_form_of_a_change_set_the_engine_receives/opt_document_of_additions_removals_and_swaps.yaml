title:                  Document of additions, removals and swaps
brief:                  |
                        One document lists the nodes and edges to add,
                        with their placement and declarations, those
                        to remove, and the swaps with their upgrade
                        mappings, together with the digests before and
                        after. The engine checks it and installs it as
                        a whole.

