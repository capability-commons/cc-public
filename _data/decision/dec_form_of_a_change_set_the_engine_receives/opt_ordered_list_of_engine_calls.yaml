title:                  Ordered list of engine calls
brief:                  |
                        cctool turns the change into an ordered list
                        of small engine calls, such as make a node,
                        bind a port, join, cut, swap and commit. The
                        engine checks each call as it comes, and the
                        commit makes them all take effect at one local
                        step.

