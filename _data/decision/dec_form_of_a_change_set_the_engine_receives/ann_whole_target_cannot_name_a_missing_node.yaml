title:                  Whole target that cannot name a node missing from what runs
brief:                  |
                        Two of the ways the trial's cctool check and
                        its engine disagreed were deltas that did not
                        fit the graph that ran: adding a node whose
                        name was taken, there by a static node, and
                        removing one that was not there. A whole
                        target cannot name a missing node, nor add a
                        dynamic node that already runs, since a node
                        is either in it or not; a dynamic node that
                        takes a static node's name can still be sent,
                        and must still be refused. The trial's engine
                        already built the whole new graph of the unit
                        off the step path and checked every input on
                        the result, so receiving the target spares
                        only the code that reconciles a delta with
                        what runs, with its refusals for a node not
                        there and an edge not there. The engine must
                        still match each node of the target to a
                        running one to keep its state.
description:            |
                        Sources:
                        - cctool's check passed, and the engine
                          refused, an added node
                          named like a static one, a removed node that did not exist, a
                          node of a kind the build lacks and an edge across units; on a
                          two-unit build the engine also refused added edges with the wrong
                          reason, that an input was fed twice. (review of 2026-10-29,
                          CC-029; areas/trial-model.md, TM-11 and its hand-off note)
                        - The engine builds the new dynamic subgraph
                          from the running nodes
                          less those removed and plus those added, refuses an existing name,
                          a missing node and a missing edge, and then checks every input and
                          orders the nodes, all in the thread of runtime control. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/dynamic.cpp, functions
                          build and hook_apply)
                        - With the whole target, the engine computes
                          the difference from
                          what it runs.
                          (_data/decision/dec_form_of_a_change_set_the_engine_receives/opt_whole_target_dynamic_subgraph.yaml
                          at brief)
                        - A target receives resolved graphs or the
                          difference between two of
                          them.
                          (_data/decision/dec_where_variants_are_resolved/ruling_variants_resolved_in_python_only.yaml
                          at brief)
                        - Reliability asks what happens when an input
                          is faulty;
                          maintainability counts the parts a representative change touches.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reliability.question.1 and
                          entries.concern_maintainability.measure.1)
                        Strength: moderate; the digest check already
                        stops most stale deltas, and matching the
                        nodes is the cost set out in
                        ann_engine_side_difference_chooses_unchecked_swaps.

