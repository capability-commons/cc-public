title:                  A review data item type
brief:                  |
                        A new type of standalone item records one
                        review: the items it reviewed, by an edge to
                        each, the maturity level it reviewed them for,
                        by an edge to that level, who reviewed them,
                        and the git blob id of each reviewed file as
                        it was seen. A check compares each blob id
                        with the file as it is now, and a level's
                        demand for a document is unmet until a review
                        for that level matches. Findings stay
                        annotations about the reviewed items, and a
                        revision after them makes the review stale
                        until the next one.

