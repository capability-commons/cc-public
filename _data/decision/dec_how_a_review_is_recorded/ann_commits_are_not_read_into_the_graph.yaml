title:                  Commits are not read into the graph
brief:                  |
                        A commit item lives in its git message, and
                        the graph holds only the items in the files of
                        the tree. A review recorded in a commit is
                        invisible to cctool query and to the logic
                        rules until commits are read from git log into
                        the graph, which is not built.
description:            |
                        Sources:
                        - The commit item sits in the message between
                          the subject and the trailers
                          [_data/schema/sch_commit.yaml at
                          description].
                        - The extractor reads the files of the tree
                          [src/cctool/graph/extract.py within
                          documents].

