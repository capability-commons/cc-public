title:                  A review recorded in the item of a commit
brief:                  |
                        A commit that records a review carries, in its
                        commit item, an edge to each item reviewed and
                        to the level. The check reads commits from git
                        log and holds a review fresh while no later
                        commit changes what it reviewed.

