title:                  A review data item type
brief:                  |
                        A review is recorded as an item of its own
                        type: the items it reviewed, the maturity
                        level it reviewed them for, who reviewed them,
                        and the git blob id of each reviewed file as
                        it was seen, so that a check can tell from the
                        tree alone whether the review still covers
                        each file. A review as an annotation, a review
                        in the item of a commit, and reviews left to
                        the scheduled review reports, are rejected.
                        Ruled by WTP on 2026-10-29.

