title:                  A recorded digest keeps the freshness check within the tree
brief:                  |
                        A review that records the digest of what it
                        saw is fresh exactly while that digest matches
                        the file now, which a check can compare from
                        the tree alone, as it already digests each
                        file it reads. Neither the graph extractor nor
                        cctool check runs git, so a freshness check
                        that orders reviews and changes by commit
                        would add a walk of git history to every
                        check, and would not work on a tree without
                        its history, such as the copy the gate checks.
description:            |
                        Sources:
                        - extract digests each file as it reads it
                          [src/cctool/graph/extract.py within
                          digest_of].
                        - Commits are read from git only by the
                          history check [src/cctool/commit/history.py
                          within commits], by release and by the
                          repository steps; the graph and check
                          packages do not run git.
                        - The gate checks a copy of the staged files,
                          not a clone [src/cctool/gate/gate.py within
                          gate].

