title:                  A review recorded as an annotation
brief:                  |
                        An annotation about the reviewed item says
                        that it was reviewed, with a new edge to the
                        maturity level it was reviewed for. Whether
                        the review still covers the item is found from
                        git: the commit that added the annotation must
                        be newer than the last commit that changed the
                        item.

