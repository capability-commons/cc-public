title:                  Reports cannot hold a level back
brief:                  |
                        The scheduled review reports are prose files
                        in the shared notes folder, outside the tree,
                        so no check can read them. A component could
                        then claim a level whose documents nobody
                        inspected, or that changed after they were,
                        and only a person reading the reports would
                        notice. Staged drafts force early inspection
                        only if a level cannot be claimed without it.
description:            |
                        Sources:
                        - Each review writes one report file in a
                          reviews folder of the shared notes folder
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-report].

