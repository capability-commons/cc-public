title:                  How a review is recorded
brief:                  |
                        How is it recorded that a document was
                        reviewed for a maturity level, so that a check
                        can tell whether the review still covers the
                        document as it is now?
description:            |
                        The ruling on what a maturity requires lets a
                        level ask for a document at several stages: a
                        draft early, an update later and a final
                        version after that. WTP argued that each stage
                        forces the document into inspection early, and
                        that agents, which do not get things right
                        first time, need review and revision built
                        into each step. The demands of each level in
                        reg_maturity_level name the stage a document
                        must reach, but nothing records that anyone
                        reviewed it, so a component can claim a level
                        whose documents nobody has inspected, or that
                        changed after they were inspected. The check
                        proposed with this decision holds that, for a
                        component to claim a level, each document the
                        level asks for has a review for that level
                        that is newer than the document's last change.

