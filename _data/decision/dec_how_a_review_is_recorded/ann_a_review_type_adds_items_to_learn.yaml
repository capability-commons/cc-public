title:                  A review type adds items to learn
brief:                  |
                        A type of its own needs a type entry, a
                        schema, a concept, an edge to what was
                        reviewed and an edge to the level, with their
                        relation constraints, and the check. An
                        annotation reuses relation_is_about and adds
                        only the edge to the level; the report option
                        adds nothing.

