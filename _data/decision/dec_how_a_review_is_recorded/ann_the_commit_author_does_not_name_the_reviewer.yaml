title:                  The commit author does not name the reviewer
brief:                  |
                        Every commit is authored by the maintainer,
                        whoever drafted it, so the commit that records
                        a review cannot tell a review by an agent from
                        one by the maintainer. Whichever way a review
                        is recorded, it must say who reviewed in the
                        record itself if the two are to count
                        differently.
description:            |
                        Sources:
