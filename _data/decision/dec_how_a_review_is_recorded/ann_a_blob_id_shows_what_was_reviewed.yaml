title:                  A blob id shows exactly what was reviewed
brief:                  |
                        git names the content of each file by its blob
                        id, which can be computed from the content
                        alone. A review that records the blob id of
                        each file it saw lets a later reader show
                        exactly that content with git cat-file, and
                        diff it with the file now to see what changed
                        since the review, without finding the commit
                        the review was made at.

