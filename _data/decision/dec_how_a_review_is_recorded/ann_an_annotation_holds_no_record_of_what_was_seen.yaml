title:                  An annotation holds no record of what was seen
brief:                  |
                        An annotation carries nothing beyond its
                        identity, descriptive fields, rights and
                        edges, and has no author, time or verdict
                        field by design. A review recorded as an
                        annotation can name the level by an edge, but
                        cannot say which content it saw or who saw it,
                        so what it covered is known only by its
                        commit.
description:            |
                        Sources:
                        - sch_annotation rules out any field beyond
                          identity, the descriptive fields, rights and
                          edges [_data/schema/sch_annotation.yaml at
                          description].

