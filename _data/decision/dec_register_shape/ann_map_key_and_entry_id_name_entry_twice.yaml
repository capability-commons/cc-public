title:                  Key and id naming each entry twice
brief:                  |
                        A map-keyed table names each entry twice, as
                        key and as id_self, so the system needs an
                        extra fact and an extra rule to keep the two
                        in step. An array names each entry once and
                        traces it just as well.
description:            |
                        sch_register.yaml lines 34-42. Fact
                        register_entry_key
                        (src/cc_public/graph/extract.py lines 138-139,
                        428-435); rule key_mismatch
                        (src/cc_public/check/check.lp lines 214-223)
                        and its test (test_check.py line 422). Each
                        entry is already an item with its register as
                        holder, from lists as well as maps (extract.py
                        lines 402-423). ASSUMPTION:
                        misplaced_register_entry could read the holder
                        instead of the key. The cost is fixed and does
                        not grow with the graph. Merged from the
                        simplicity and traceability advocates.

