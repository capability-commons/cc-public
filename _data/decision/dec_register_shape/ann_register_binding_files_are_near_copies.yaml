title:                  Near-copy binding schemas per register
brief:                  |
                        One shape still leaves a binding schema and an
                        entry schema per register, and the binding
                        files differ only in the entry schema they
                        name. A change to the binding pattern touches
                        every copy.
description:            |
                        Six sch_reg_* files (38-43 lines) and six
                        sch_regentry_* files (53-115 lines), 725 lines
                        (wc -l on _data/schema). All six sch_reg_*
                        files differ from sch_reg_concern only in
                        header, prose and one $ref (diff). Kept on
                        2026-10-13 because JSON Schema cannot pick the
                        entry schema from data, and for federated
                        partners (memory/MEMORY.md line 11). On review
                        Will asked to "remove the six superfluous
                        references to sch_register_entry lines in the
                        sch_reg_* files" (2026-10-13T21:00:19Z, item
                        1). Grows one file per register. It argues for
                        generating or checking the binding files, not
                        for register-specific shapes, which copy more.
                        Merged from the maintainability and simplicity
                        advocates.

