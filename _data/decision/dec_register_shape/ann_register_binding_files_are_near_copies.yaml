title:                  Near-copy binding schemas per register
brief:                  |
                        One shape still leaves a binding schema and an
                        entry schema per register, and the binding
                        files differ only in the entry schema they
                        name. A change to the binding pattern touches
                        every copy.
description:            |
                        Eight sch_reg_* files (38-43 lines) and eight
                        sch_regentry_* files (32-117 lines), 930 lines
                        (wc -l on _data/schema). Each sch_reg_* file
                        differs from sch_reg_concern only in header,
                        prose and one $ref, and two add an empty edge
                        list (diff). Kept on 2026-10-13 because JSON
                        Schema cannot pick the entry schema from data,
                        and for federated partners. On review WTP
                        asked to remove the references to
                        sch_register_entry in the sch_reg_* files, and
                        none of them names it now. Grows one file per
                        register. It argues for generating or checking
                        the binding files, not for register-specific
                        shapes, which copy more. Merged from the
                        maintainability and simplicity advocates.

