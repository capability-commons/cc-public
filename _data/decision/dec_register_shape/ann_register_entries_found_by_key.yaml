title:                  Register entries found by name
brief:                  |
                        A map-keyed table lets the editor, the checker
                        and its error paths reach an entry by its
                        readable id, so a fault is quick to locate and
                        an edit quick to place.
description:            |
                        The checker reports a register fault at the
                        path "table/concern_cost/title"
                        (src/cctool/check/_test/test_check.py lines
                        944-953). The editor finds an entry in its
                        register's table by its readable id
                        (src/cctool/edit/edit.py lines 787-789). JSON
                        Schema uniqueItems compares whole items, so an
                        array would need a uniqueness rule of its own
                        (json-schema-validation 2020-12 section
                        6.4.3). Weak spot: a duplicate key is reported
                        as unreadable_file at its line, but the
                        register drops out and every reference to its
                        entries dangles. Tested 2026-10-22 on a copy
                        of the tree with concern_cost repeated. An
                        edit that adds a duplicate key is refused as
                        "The edit leaves {file} unreadable"
                        (src/cctool/edit/edit.py lines 199-201). From
                        the maintainability advocate.

