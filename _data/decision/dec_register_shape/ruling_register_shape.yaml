title:                  One register shape with map-keyed tables
brief:                  |
                        Registers differ in what their entries say,
                        not in how they are structured, so they share
                        one shape. A map keyed by readable id makes
                        each key unique and lets a reader find an
                        entry by name. The entry repeats its id so
                        that it still says what it is when lifted out
                        of its table. Ruled by William Payne on
                        2026-10-22.

