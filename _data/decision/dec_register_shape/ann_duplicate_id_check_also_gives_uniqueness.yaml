title:                  Duplicate id check as a second guarantee
brief:                  |
                        The check duplicate_id reports one id that
                        names two items, and register entries are
                        items, so a repeated entry id is caught with a
                        map or an array. The map is now a second
                        guarantee, though it was the only one when the
                        reason was given.
description:            |
                        src/cc_public/check/check.lp lines 93-103;
                        src/cc_public/graph/extract.py lines 412-418.
                        When the reason was given there was no
                        checker: an assistant-written session summary
                        that Will pasted on 2026-10-09 still says
                        "There is no checker" (will-messages.md line
                        76). The check first appears in commit
                        ba66f33, 2026-10-13 (tag pre_squash_20261014),
                        squashed into 7dda99e, 2026-10-14. Limit:
                        duplicate_id fires only when the two guids
                        differ (check.lp lines 100-103), and
                        duplicate_guid only when the two ids differ
                        (lines 114-117), so an exact copy with the
                        same id and guid is reported by neither. From
                        the simplicity advocate.

