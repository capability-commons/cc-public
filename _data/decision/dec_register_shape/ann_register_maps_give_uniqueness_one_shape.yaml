title:                  Unique keys in one shared register shape
brief:                  |
                        Register tables are maps, not arrays, because
                        uniqueness guarantees are worth something, and
                        every register has the same shape, so there is
                        one register schema.
description:            |
                        Decision of the base schema review of 24-25
                        August 2026, as recorded in the
                        assistant-written note
                        cc-public-session-context.md (lines 19 and
                        26): "Register tables: maps, not arrays", and
                        "every register has the same shape, so there
                        is one register schema". Only "Uniqueness
                        guarantees are worth something" is quoted
                        there as Will's own words; the rest is the
                        note's record. Will restated the shape as his
                        understanding, in a question, on 2026-10-13:
                        "I thought that this is what we were already
                        doing with sch_register and
                        sch_register_entry? Don't the type-specific
                        registers just pull them in with allOf?"
                        (will-messages.md line 199). sch_register.yaml
                        first appears in bb8c338.

