title:                  Key uniqueness held by the YAML loader
brief:                  |
                        A duplicate entry key is rejected only by a
                        loader that refuses duplicate keys.
                        ruamel.yaml does, but PyYAML and Python json
                        keep the last value silently, so a partner or
                        a port on such a loader loses a duplicate
                        entry without notice.
description:            |
                        cc-public parses with libyaml into ruamel.yaml
                        round-trip types, and hands a document with a
                        repeated key to ruamel.yaml, which refuses it
                        (src/cctool/graph/parse.py within load and
                        _mapping); ruamel.yaml is pinned
                        >=0.19.1,<0.20 (pyproject.toml at
                        project.dependencies). Tested 2026-10-15:
                        ruamel.yaml 0.19.1 raises DuplicateKeyError on
                        "a: 1\na: 2"; PyYAML 6.0.1 safe_load and
                        json.loads return the last value. RFC 8259
                        section 4 leaves duplicate names
                        unpredictable; YAML 1.2.2 section 3.2.1.1
                        requires unique keys. key_mismatch (check.lp
                        within misplaced_register_entry and
                        unrecorded_module) cannot see a key the loader
                        dropped. An array does not make uniqueness a
                        parse property for anyone, so this limits the
                        reason rather than favoring arrays. Merged
                        from the compatibility and flexibility
                        advocates.

