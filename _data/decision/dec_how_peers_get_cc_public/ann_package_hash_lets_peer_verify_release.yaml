title:                  Hash-verifiable release artifact
brief:                  |
                        One package per release gives a single
                        artifact whose hash the peer's lock file
                        records, so a peer can check that it got
                        exactly what was released and can pin a patch
                        release that carries a security fix. It adds a
                        trust point in whoever builds and hosts the
                        package, a route not yet decided.
description:            |
                        Sources:
                        - pixi.lock records a sha256 hash for each
                          package it locks (pixi.lock, for example
                          line 665; 180 such entries).
                        - pixi.lock hashes the local package's
                          metadata, and the pre-push hook runs with
                          --locked (context note, _sources/context.md
                          line 30).
                        - "Let's use SemVer 2.0.0 as per
                          https://semver.org/" (owner's statement,
                          2026-10-22).
                        - On the publishing route: "Will require
                          further discussion. Hosting can be
                          arranged." (owner's statement,
                          2026-10-22)
                        - The owner chose the versioned package
                          (owner's statement, 2026-10-22).
                          Strength: strong, provided the build and the
                          hosting are secured when they are designed.

