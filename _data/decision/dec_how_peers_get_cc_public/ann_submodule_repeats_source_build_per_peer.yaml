title:                  Source build repeated in every submodule peer
brief:                  |
                        A submodule asks each peer to build the
                        tooling and the C++ engine from source and to
                        learn the submodule clone and update steps, so
                        the build and its failures repeat in every
                        peer. One package gives a peer one pinned
                        dependency for the tooling, the shared data
                        and the engine, and follows from cc-public
                        already being a built Python package.
description:            |
                        Sources:
                        - The submodule option holds cc-public at a
                          pinned commit and builds the tooling and
                          engine from source
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_submodule.yaml,
                          brief).
                        - A plain git clone leaves submodule
                          directories empty unless
                          --recurse-submodules is given or git
                          submodule update --init is run
                          (https://git-scm.com/book/en/v2/Git-Tools-Submodules).
                        - The engine is new C++, C++17 planned
                          (owner's statement, 2026-10-21, paraphrase;
                          _sources/context.md line 9).
                        - cc-public is a Python package with a
                          hatchling build backend and the cctool entry
                          point (pyproject.toml at project and build-system).
                        - The owner wants peers to use the engine and
                          all the other tooling, and chose the
                          versioned package (owner's statements,
                          2026-10-22).
                        - Assumption: bundling the C++ engine needs a
                          build step the Python build backend does not
                          have yet. Strength: moderate to strong; well
                          known friction that repeats per peer, though
                          with one peer today the repetition is small.

