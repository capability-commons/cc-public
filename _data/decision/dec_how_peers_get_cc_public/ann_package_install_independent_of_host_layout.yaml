title:                  Package install independent of host layout
brief:                  |
                        A package lets a peer on any platform it is
                        built for take a release with its own
                        environment manager, without a checkout of
                        cc-public, a set folder layout or a build
                        toolchain on that host, and lets many peers on
                        many hosts each pin their own release. A
                        sibling checkout works only where someone has
                        placed both checkouts side by side.
description:            |
                        Sources:
                        - The package option builds each release into
                          one package holding the tooling, the shared
                          data and the engine, which a peer pins in
                          its own environment
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml,
                          brief).
                        - Patrol targets a Lenovo Legion laptop and a
                          Jetson Orin Nano, with the user interface on
                          another machine
                          (_sources/cc-patrol-notes/plan.md lines
                          128-131).
                        - Paths that depend on where a folder sits
                          differ on each machine and in each remote
                          session (AGENTS.md lines 30-32).
                        - "Strong agreement on building a versioned
                          package." (owner's statement,
                          2026-10-22T15:14)
                        - Assumption: a hosted runner or a new partner
                          does not place two checkouts side by side on
                          its own. Strength: strong; it is the only
                          option whose install step does not depend on
                          the host's folders or toolchain.

