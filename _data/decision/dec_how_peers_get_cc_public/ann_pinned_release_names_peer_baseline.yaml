title:                  Pinned release as the peer's baseline
brief:                  |
                        A versioned package pins a named release in
                        the peer's environment, so a change in
                        cc-public reaches a peer only when the peer
                        moves its pin, and anyone can later tell which
                        release the peer ran. A sibling checkout pins
                        nothing: whatever that folder holds reaches
                        the peer at once, unchecked, and leaves no
                        record of the version.
description:            |
                        Sources:
                        - The sibling checkout option says "A peer
                          reads a checkout of cc-public in a
                          neighboring folder" and names no pin
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_read_a_sibling_checkout.yaml,
                          brief).
                        - The package option is pinned by the peer "in
                          its own environment", and the submodule
                          option also pins, "at a pinned commit"
                          (opt_peers_take_a_versioned_package.yaml and
                          opt_peers_take_a_submodule.yaml in the same
                          folder, briefs).
                        - The repository's own workflow keeps several
                          sibling folders of cc-public, one per
                          worktree, and dev only moves forward as
                          branches land (AGENTS.md lines 13-27 and
                          46-47).
                        - SemVer 2.0.0 is the chosen scheme (owner's
                          statement, 2026-10-22T16:27), the bump can
                          be determined mechanically (16:24) and the
                          notes generated from the graph (16:28).
                        - The plan recommended a dependency pinned to
                          a tag with a path override for local work,
                          over a path dependency on the sibling
                          checkout (_sources/cc-patrol-notes/plan.md
                          lines 69-72).
                        - The owner chose the versioned package
                          (owner's statement, 2026-10-22T15:14).
                          Strength: strong; integrity, accountability
                          and a bounded change all depend on a pin,
                          and this option has none. Simplicity notes
                          that the sibling checkout adds no mechanism,
                          but leaves the recording of a version
                          undone.

