title:                  One release snapshot rather than git history
brief:                  |
                        A package holds the files of one release, so
                        data removed from the shared data before that
                        release never reaches peers who take it. A
                        submodule or a sibling checkout is a git clone
                        that carries every past commit, so data once
                        committed and later removed still sits in
                        every peer's copy.
description:            |
                        Sources:
                        - The versioned package holds the tooling, the
                          shared data and the engine of one release
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml,
                          brief).
                        - The release ships "the whole of _data"
                          (owner's statement, 2026-10-22).
                        - A git clone copies the repository's full
                          history unless a shallow clone is asked for
                          (https://git-scm.com/docs/git-clone).
                        - A git submodule is a full repository held
                          inside another at a pinned commit
                          (https://git-scm.com/book/en/v2/Git-Tools-Submodules).
                        - The graph is "currently backed by the
                          filesystem and stored in git" (owner's
                          statement, 2026-10-22).
                        - Assumption: the shared data holds no
                          personal data today beyond the copyright
                          holder's name, so the gain matters mainly if
                          personal data is ever committed by mistake.
                          Strength: moderate.

