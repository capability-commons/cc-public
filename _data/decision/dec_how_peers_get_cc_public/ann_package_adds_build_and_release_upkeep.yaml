title:                  Build and release machinery to maintain
brief:                  |
                        A package needs a release process, a build
                        that bundles Python, C++ and data, and a path
                        for working against an unreleased cc-public,
                        each of them new machinery to keep working.
                        Testing a change to cc-public inside a peer
                        then takes a rebuild or an override, which
                        slows changing both together.
description:            |
                        Sources:
                        - "This means we also need to design and
                          implement the release process for cc-public
                          right now." (owner's statement,
                          2026-10-22)
                        - No release has ever been made (context note,
                          _sources/context.md line 33), and the
                          publishing route is undecided (owner's
                          statement, 2026-10-22).
                        - The plan recommends a dependency pinned to a
                          tag "with a path override for local work"
                          (_sources/cc-patrol-notes/plan.md lines
                          69-72).
                        - Any edit to pyproject.toml makes pixi.lock
                          stale, and only the owner can relock on the
                          offline host (context note,
                          _sources/context.md line 30). Strength:
                          moderate; the costs are largely one-time,
                          and the override already has a recommended
                          form.

