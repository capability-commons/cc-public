title:                  Copies of a published package beyond recall
brief:                  |
                        Once a package is published, every peer and
                        the package host keep a copy that the
                        maintainer cannot withdraw, so the release
                        process should check the shared data for
                        personal data before each release. A git
                        remote that peers clone also leaves such
                        copies, so the package adds only the host as
                        one more holder.
description:            |
                        Sources:
                        - The publishing route and host are not yet
                          decided (owner's statement,
                          2026-10-22T16:29).
                        - On PyPI a yanked release is still installed
                          for anyone who pins its exact version, if
                          the installer chooses to (PEP 592,
                          https://peps.python.org/pep-0592/).
                        - The release ships "the whole of _data"
                          (owner's statement, 2026-10-22T16:30).
                        - No release has yet been made (context note,
                          _sources/context.md line 33). Strength:
                          weak; every option leaves copies with peers.

