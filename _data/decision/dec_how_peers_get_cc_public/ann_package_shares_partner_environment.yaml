title:                  Package dependencies inside the partner environment
brief:                  |
                        A package installed into a partner's
                        environment brings cc-public's bounded
                        dependencies with it, so its pins can clash
                        with the partner's own. A sibling checkout
                        keeps cc-public in an environment of its own
                        and cannot clash, at the cost of the partner
                        running a second environment.
description:            |
                        Sources:
                        - cc-public declares seven runtime
                          dependencies with upper bounds, such as
                          click<9, clingo<6 and ruamel.yaml<0.20
                          (pyproject.toml at project.dependencies).
                        - The package is to hold the tooling, the
                          shared data and the engine in one
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml,
                          brief).
                        - Assumption: a partner's own products may
                          need versions of these libraries outside
                          those bounds. Strength: weak; the bounds are
                          wide today.

