title:                  Release install on offline hosts
brief:                  |
                        A peer on a host without network access cannot
                        fetch a new package or submodule commit
                        itself, while a sibling checkout can be
                        updated by copying a folder. Whichever option
                        is chosen should leave a way to install a
                        release from a local copy, such as a local
                        channel or a bundled submodule.
description:            |
                        Sources:
                        - The atlas VM has no network, so only the
                          owner can relock there (context note,
                          _sources/context.md line 30).
                        - cc-patrol is local to atlas only
                          (_sources/cc-patrol-notes/plan.md line 109).
                        - Any edit to pyproject.toml makes pixi.lock
                          stale, and the pre-push hook refuses a stale
                          lock (context note, _sources/context.md line
                          30).
                        - Assumption: a package or a submodule can
                          also be installed from a local file or
                          mirror, so this bears more on how the chosen
                          option is set up than on which is chosen.
                          Strength: weak.

