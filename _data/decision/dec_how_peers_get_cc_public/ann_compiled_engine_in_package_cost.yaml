title:                  Compiled engine inside the package
brief:                  |
                        If the package carries the compiled C++
                        engine, each release needs a build for each
                        platform a peer runs on, including ARM Linux
                        for the Jetson, which the workspace does not
                        lock today, and a peer runs binary code it
                        cannot read unless the build is reproducible
                        or signed. A submodule built from a pinned
                        commit reaches any host with a C++17 toolchain
                        and runs the source it pins. Both costs fall
                        away if the package ships engine sources
                        rather than binaries.
description:            |
                        Sources:
                        - The workspace platforms are osx-arm64,
                          osx-64 and linux-64, with no linux-aarch64
                          (pyproject.toml line 59).
                        - The Jetson Orin Nano has six A78 cores
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 72-74), and Patrol already builds on
                          it under JetPack 7.2
                          (_sources/cc-patrol-notes/plan.md lines
                          147-148).
                        - C++17 is supported by the toolchains the
                          project is likely to meet, including CUDA's
                          nvcc
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 155-158).
                        - The submodule option holds cc-public at a
                          pinned commit and builds the tooling and
                          engine from source
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_submodule.yaml,
                          brief); a submodule records a specific
                          commit
                          (https://git-scm.com/book/en/v2/Git-Tools-Submodules).
                        - The engine is new C++ (owner's statement,
                          2026-10-21, paraphrase; _sources/context.md
                          line 9).
                        - All peers are the owner's own for now
                          (owner's statement, 2026-10-22).
                        - Assumption: the package would carry compiled
                          engine code rather than only its sources and
                          headers. Strength: moderate; the build
                          matrix and the unreadable binary are real,
                          but both can be avoided or narrowed by
                          shipping sources or by a build the
                          maintainer controls.

