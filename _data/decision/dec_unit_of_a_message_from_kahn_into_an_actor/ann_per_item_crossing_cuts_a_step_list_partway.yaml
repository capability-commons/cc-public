title:                  Step list cut partway where an actor's shared queue fills
brief:                  |
                        Under one message for each item, the items a
                        Kahn node wrote in one local step enter the
                        actor's queue one by one, and a full queue
                        refuses whichever item comes next. The trial's
                        code, as read, does this silently: past 1024
                        waiting messages, a limit shared by every
                        actor of every unit, or for any item over 64
                        bytes, it drops the item with no event, so an
                        actor could receive the first part of a list
                        as if it were the whole. A list of obstacles
                        cut short reads as free space, the hazard the
                        per-port fail-safe ruling rests on, and no
                        port declares a fail-safe for an actor's
                        queue. One message for each local step
                        carries, whole, the message the Kahn port has
                        already bounded and fail-safed, and normally
                        only one waits per edge at a gap.
description:            |
                        Sources:
                        - The trial enqueues each item of a Kahn
                          output as one message,
                          ignores the result, and refuses a message when 1024 wait or when
                          it exceeds 64 bytes (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/actors.cpp, functions actors_gap
                          and enqueue).
                        - Route items over 64 bytes or beyond the
                          global queue are dropped
                          with no event, found by source inspection (review of 2026-10-29,
                          area report trial-engine, TE-19).
                        - A list of obstacles cut short reads as free
                          space, while an empty
                          or absent message with a fault leads the consumer to a safe state
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/ann_truncated_obstacle_list_reads_as_free_space.yaml
                          at brief).
                        - Each port declares its fail-safe, and every
                          overflow raises a fault
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/ruling_fail_safe_declared_per_port.yaml
                          at brief).
                        - Each step's output goes to an actor as one
                          message
                          (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                          at brief).
                        ASSUMPTION: some actor in Patrol's graph
                        consumes a list whose truncation reads as
                        absence, such as obstacles or detections.
                        Strength: strong for safety where such an
                        actor exists; the trial's limits are its own,
                        but the queue that per-item delivery needs has
                        no declared size or fail-safe in any record.

