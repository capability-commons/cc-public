title:                  One value per actor message, as the actor ICDs read today
brief:                  |
                        One message for each item is how the ICDs read
                        today, if not the upheld option: an actor
                        message holds a value of the type its input
                        port declares, and an actor is invoked once
                        for each message admitted. The trial built
                        that reading, with an outside source that
                        sends one value at a time, and its log called
                        the point unspecified. Under one message for
                        each local step, the actor message ICD must
                        say that a message holds a bounded array, an
                        actor fed both from outside and from a Kahn
                        edge gets values in two shapes, or arrays of
                        one from outside, and its inbox must hold the
                        largest capacity of its sources. Per-item, for
                        its part, needs the upheld option amended.
description:            |
                        Sources:
                        - An actor message carries a value of the type
                          the input port of the
                          actor declares
                          (_data/interface_control_document/icd_dataflow_actor_message.yaml
                          at surface.data.artifact.artifact.message.content).
                        - An actor is invoked once for each message
                          admitted to it in a gap
                          (_data/interface_control_document/icd_dataflow_node.yaml at
                          surface.step.dataflow_step.invocation).
                        - The trial's outside send takes exactly one
                          value of the inbox's
                          item size (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/actors.cpp, function hook_send).
                        - The trial's log called the Kahn-into-actor
                          unit a gap with no spec,
                          and the review found that it contradicts the upheld option (review
                          of 2026-10-29, CC-027 and CC-057).
                        - The reviewer recommends per-step as the
                          smaller change (review of
                          2026-10-29, section 7, W-T4).
                        - WTP will regenerate the trial from the
                          lessons of the review, and
                          the next generation should be helped by the records being clear
                          (WTP, 2026-10-29).
                        - Maintainability asks how far a change in one
                          part spreads to others
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question).
                        Strength: moderate; it bears on wording and on
                        the shape of actor code, not on behavior,
                        where the evidence leans the other way.

