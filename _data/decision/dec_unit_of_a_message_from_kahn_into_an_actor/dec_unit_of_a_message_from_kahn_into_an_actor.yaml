title:                  Unit of a message from a Kahn edge into an actor
brief:                  |
                        When a Kahn node's output feeds an actor, does
                        the actor receive one message for each local
                        step, carrying the whole output, or one
                        message for each item of it?
description:            |
                        The upheld option on crossing between Kahn
                        networks and actors says in passing that each
                        step's output goes to an actor as one message
                        (opt_crossing_policy_on_the_edge). The trial
                        implementation of 2026-10-29 sent one message
                        for each item, and its process log called the
                        point unspecified (review of 2026-10-29,
                        CC-027 and CC-057). This decision asks whether
                        the passing remark should stand as the rule.

