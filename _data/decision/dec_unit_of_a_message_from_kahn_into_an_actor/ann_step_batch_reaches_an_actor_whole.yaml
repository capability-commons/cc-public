title:                  Items of one step handed to an actor together
brief:                  |
                        Under one message for each local step an actor
                        receives all the items a Kahn node wrote in
                        one step together, so an actor that must act
                        on everything one camera frame produced, such
                        as a map update from all its detections, sees
                        exactly that set. Under one message for each
                        item the actor sees one item per invocation,
                        and nothing marks where one step's items end,
                        since the trial's messages carry a sequence
                        number from their source and no step. An actor
                        that hands its input to a library that takes a
                        batch must then gather items across
                        invocations without knowing when the batch is
                        complete.
description:            |
                        Sources:
                        - The trial invokes an actor once per message
                          with an inbox of one,
                          and numbers messages per source (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/actors.cpp, function actors_gap;
                          /mnt/project-files/notes/dataflow-trial/process-log.md, phase 4).
                        - A varying data rate becomes a varying number
                          of items, not a
                          varying number of messages
                          (_data/interface_control_document/icd_dataflow_edge_message.yaml
                          at description).
                        - In-order delivery does not survive an
                          inserted proxy, so actor
                          messages that pass one need step or sequence tags (Menard et al.
                          2023, High-performance deterministic concurrency using Lingua
                          Franca, section 2, as summarized in
                          /mnt/project-files/notes/literature/round-2/2023-high-performance-deterministic-concurrency-lingua-franca.md).
                        - Functional suitability asks whether each
                          function gives the right
                          result; dependency risk asks what the design takes from third
                          parties (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question and
                          entries.concern_dependency_risk.question).
                        ASSUMPTION: some actors wrap a third-party
                        library, such as a mapping or planning
                        library, whose calls take a whole batch.
                        Strength: moderate for function; weak for
                        dependency risk, which rests on libraries not
                        yet chosen.

