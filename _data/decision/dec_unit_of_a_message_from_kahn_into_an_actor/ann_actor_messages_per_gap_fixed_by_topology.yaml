title:                  Count of actor messages in a gap set by the scene or by the graph
brief:                  |
                        Under one message for each item, the number of
                        messages in a gap follows the number of items
                        the Kahn side produced, so the sensed scene
                        sets how many queue entries, copies, sorts and
                        handler calls each gap takes, and a scene with
                        many items can crowd out messages from outside
                        the graph, which share the queue. Under one
                        message for each local step, the count of
                        messages from Kahn edges is fixed by the
                        graph: one per edge per gap. The work inside a
                        handler still grows with the items under both,
                        but per-step pays the cost of a message once
                        per batch, as the bounded-array convention
                        intends.
description:            |
                        Sources:
                        - The trial copies each item into its own
                          64-byte slot, sorts every
                          message of the gap, and invokes the actor once per message;
                          messages from outside share the same queue and are refused as "too
                          many messages are waiting" when it is full (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/actors.cpp, functions actors_gap
                          and hook_send).
                        - A batch of elements in one message shares
                          the cost of the message,
                          its call and its header among its elements
                          (_data/decision/dec_how_values_of_varying_size_are_held/ann_batch_of_elements_shares_the_cost_of_a_message.yaml
                          at brief).
                        - Actor work in a gap adds to every step's
                          period
                          (_data/decision/dec_how_actors_are_run/ann_actor_work_lengthens_every_kahn_step.yaml
                          at brief).
                        - A sender that floods an actor holds up what
                          shares its thread, and
                          admission at the gap start caps a gap at what the bounded mailboxes
                          hold
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_gap_admission_bounds_what_a_flood_can_hold.yaml
                          at brief).
                        - Security asks what an attacker can reach and
                          at what cost;
                          throughput is a measure of performance efficiency
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question and
                          entries.concern_performance_efficiency.measure).
                        ASSUMPTION: the number of items a detector
                        emits depends on the scene, which someone
                        outside the robot can shape. Strength:
                        moderate; it grows with items per step, and
                        capacities derived from maximum rates bound
                        both options.

