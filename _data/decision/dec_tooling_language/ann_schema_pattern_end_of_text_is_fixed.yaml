title:                  Schema patterns now read as ECMA-262
brief:                  |
                        Commit 6cbc563 "Fix schema patterns so that $
                        matches only at the end of the text" makes the
                        validator read $ as JSON Schema does. At
                        360ec14 a title that ends in a newline is
                        reported, so the defect is fixed inside
                        Python.
description:            |
                        The validator replaces the pattern keyword
                        with one that rewrites each unescaped $ to \Z
                        before it compiles the pattern
                        (src/cctool/check/schema.py at 360ec14).
                        test_a_title_that_ends_in_a_newline_is_reported
                        covers it
                        (src/cctool/check/_test/test_check.py within
                        test_checks_that_cannot_run_exit_with_an_error).
                        The commit message check builds the same
                        Validator (src/cctool/commit/message.py within
                        violations). This confirms the annotation's
                        own assumption that the fix stays in Python;
                        the rest of the regex dialect is still that of
                        Python re.

