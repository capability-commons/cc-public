title:                  Tooling in Python
brief:                  |
                        The tooling stays in Python for now, since the
                        maintainer reads it more readily, it reads the
                        items held in docstrings with its standard
                        library, and one toolchain serves the code,
                        the tests and clingo. Speed does not yet call
                        for a port, as the gate takes 78 s for a
                        commit that changes code, and a port of about
                        26,000 lines could be neither reviewed in full
                        nor vouched for by the present tests. Ruled by
                        William Payne on 2026-10-23.

