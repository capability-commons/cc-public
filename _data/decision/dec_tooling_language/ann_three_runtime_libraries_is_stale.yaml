title:                  Runtime libraries now seven
brief:                  |
                        The annotation says the tooling takes three
                        runtime libraries, click, jsonschema and
                        ruamel.yaml, and three development tools. Now
                        it takes seven runtime libraries and more
                        development tools.
description:            |
                        pyproject.toml lines 42-48 list click, clingo,
                        htpy, jsonschema, pyoxigraph, referencing and
                        ruamel.yaml as dependencies. The pixi
                        environment adds clingo, jq, pytest,
                        pytest-xdist and ruff (lines 65-71) and
                        playwright from PyPI (line 63). The licenses
                        of the new packages were not checked. Found in
                        the review of 2026-10-22.

