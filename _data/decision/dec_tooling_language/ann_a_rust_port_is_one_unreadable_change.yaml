title:                  A port no one can review in full
brief:                  |
                        A move to Rust is a change of thousands of
                        lines that a person must judge as a whole,
                        over five times larger than any change the
                        tooling has had since its first commit. The
                        owner already calls the review burden
                        practically impossible.
description:            |
                        The Python under src is 7,767 lines, 2,316 of
                        them tests (wc -l at 89c74d8). Before the
                        squash, 19 commits changed Python under src,
                        median 218 lines, largest 1,411 (c4a8721),
                        lines added plus removed. On main after the
                        squash commit 7dda99e (5,255 lines, a squash
                        of that history, not a change made in one go),
                        22 more did, the largest 536 lines (18d6181).
                        The owner said he can review recorded
                        decisions in batches of five (will-messages.md
                        line 765, 2026-10-14T23:39:41Z) and called the
                        review burden "huge (and practically
                        impossible)" (2026-10-15T10:59Z). ASSUMPTION:
                        a port could be split module by module, but
                        only with a Python-Rust boundary that is
                        itself new code to review. This is about
                        whether the change can be judged, not its
                        effort (ann_a_port_costs_a_rewrite).

