title:                  Python regex dialect in schema patterns
brief:                  |
                        The schemas are checked by a validator that
                        reads each pattern with Python re, not with
                        the ECMA-262 dialect that JSON Schema names.
                        So the one-line title pattern accepts a title
                        that ends in a newline.
description:            |
                        The schemas declare JSON Schema 2020-12
                        (_data/schema/sch_trait_descriptive.yaml:1)
                        and are validated with Draft202012Validator
                        (src/cc_public/check/schema.py:56, 107). JSON
                        Schema says pattern uses ECMA-262 syntax. The
                        jsonschema library checks pattern with
                        re.search (jsonschema 4.26.0, _keywords.py
                        215-220). In Python re, $ also matches before
                        a final newline; in ECMA-262 without the m
                        flag it does not. The title pattern is
                        ^[^\n]+$ (sch_trait_descriptive.yaml:35-42).
                        Run on 2026-10-15: a block-scalar title loads
                        as 'A title\n' and the validator accepts it;
                        Node rejects the same string. The same $ form
                        ends the patterns in sch_primitive.yaml:48,
                        67, 101 and sch_commit.yaml:50. No item in
                        _data has a block-scalar title today, so no
                        present item is wrongly accepted. ASSUMPTION:
                        the defect can be fixed inside Python, for
                        example with a schema clause that forbids a
                        newline, and the Rust jsonschema crate is not
                        shown to follow ECMA-262 exactly either.

