title:                  One reviewer reads small Python readily
brief:                  |
                        Agents write the code and one person reviews
                        it, who reads Python more readily than Rust.
                        ruff keeps each Python function within
                        complexity 11 and 10 branches, where Rust
                        would add ownership and lifetimes to every
                        change reviewed.

