title:                  Settlement traced to recorded arguments
brief:                  |
                        A ruling fails until each driver of its
                        subject has an argument on the decision, so
                        every settled decision traces back to recorded
                        reasons, whoever rules on it.
description:            |
                        src/cctool/check/check.lp within
                        unreadable_file; commit 3d7ef5b: "A
                        determination is refused until each driver of
                        the subject of a decision it settles has an
                        argument", in the names of the time, when a
                        ruling was called a determination and an
                        option a decision. Limit: relation_upholds and
                        relation_rejects are the only relations whose
                        source must be a ruling
                        (_data/register/reg_relation.yaml at
                        entries.relation_upholds and
                        entries.relation_rejects), and
                        relation_supersedes admits only options and
                        interface control documents
                        (_data/register/reg_relation.yaml at
                        entries.relation_supersedes;
                        ruling_change_of_a_ruling). No relation runs
                        from a ruling to the annotations it weighed,
                        so which arguments the maker of the ruling
                        relied on lives only in the brief
                        (_data/schema/sch_ruling.yaml at description;
                        _data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml
                        at brief and edge).

