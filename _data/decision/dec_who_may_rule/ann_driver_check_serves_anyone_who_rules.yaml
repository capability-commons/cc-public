title:                  Driver check that serves anyone who rules
brief:                  |
                        The process the maintainer asked for is
                        already built as the driver check, and it does
                        not read who made a ruling. So letting others
                        rule needs no new mechanism or code.
description:            |
                        unargued_driver matches on settles,
                        relation_is_option_for, relation_is_about and
                        relation_is_driven_by only, and neither it nor
                        argued/2 reads who made a ruling
                        (src/cc_public/check/check.lp lines 416-453).
                        First added in commit 3d7ef5b, 2026-10-14,
                        ported to clingo in 6230e98 and revised in
                        1ba2895. Who made a ruling is recorded by the
                        commit that adds it, not by a field
                        (_data/schema/sch_ruling.yaml lines 33-36). No
                        code in src/ reads a commit author (search at
                        89c74d8). Holds at tenfold graph size, since
                        the rule is per ruling. Merged from the
                        functional suitability, simplicity and cost
                        advocates.

