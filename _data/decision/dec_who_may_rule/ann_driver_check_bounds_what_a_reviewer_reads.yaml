title:                  Known set of arguments behind each ruling
brief:                  |
                        A ruling made by someone other than the
                        maintainer arrives as a small item backed by
                        at least one argument per driver concern,
                        which a reviewer can read and judge.
description:            |
                        unargued_driver and argued
                        (src/cctool/check/check.lp within
                        unreadable_file). A ruling carries only the
                        shared fields and a required brief
                        (_data/schema/sch_ruling.yaml at description
                        and allOf.2.required).
                        ruling_cross_item_checks_engine is a 36-line
                        file; its decision folder holds 26 files and
                        1009 lines. Limit: the arguments to read grow
                        with each decision, and the check shows only
                        that an annotation exists, not that anyone
                        read it.

