title:                  Throughput capped by one person who rules
brief:                  |
                        Under maintainer-only, every ruling waits for
                        one person's time, and that cost grows with
                        the number of decisions.
description:            |
                        The repository holds 130 decisions and 95
                        rulings, and the brief of every ruling names
                        WTP, the initials of William Payne, as its
                        maker (ls _data/decision/*/ruling_*.yaml). At
                        89c74d8 every commit was authored by William
                        Payne. memory/MEMORY.md line 50: "Only record
                        determinations WTP has made", a determination
                        being what is now called a ruling. ASSUMPTION:
                        each ruling takes maintainer time to read the
                        packet and the annotations; the time per
                        ruling is not measured.

