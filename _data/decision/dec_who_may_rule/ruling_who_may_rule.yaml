title:                  Rulings by any team member, with a process
brief:                  |
                        A team member, not only the maintainer, may
                        make a ruling, once the driver check shows
                        that every driver concern is argued; an agent
                        records a ruling but does not make one. The
                        driver check already serves whoever rules,
                        while maintainer-only would need an author
                        check or a rule nothing checks. For now
                        William Payne is the only team member, so
                        every ruling is still his. Ruled by William
                        Payne on 2026-10-23.

