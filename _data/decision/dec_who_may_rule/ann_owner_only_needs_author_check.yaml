title:                  Author check or unchecked rule for maintainer-only
brief:                  |
                        Maintainer-only needs either a new check that
                        reads the commit author, which adds a
                        mechanism and build effort, or a rule that
                        lives outside the checked graph. The driver
                        check stays either way.
description:            |
                        No field names who made a ruling
                        (_data/schema/sch_ruling.yaml lines 32-35). No
                        code in src/ reads a commit author: it reads
                        commit hashes and messages
                        (src/cc_public/commit/history.py lines 55, 114
                        and 150), staged files, the git directory and
                        revisions (src/cc_public/gate/gate.py lines
                        182, 204, 254 and 274). The optional
                        Contributor trailer names the team member who
                        supplied the content of a commit and is
                        checked only against reg_team_member
                        (src/cc_public/commit/message.py lines
                        300-304); no rule ties it to a ruling.
                        ASSUMPTION: a maintainer-only rule would be
                        enforced, if at all, by comparing the author
                        or Contributor trailer of the adding commit to
                        William Payne; nothing in the repository
                        proposes this. Merged from the simplicity and
                        cost advocates.

