title:                  Maker of a ruling not recorded apart from the agent
brief:                  |
                        The commit is the record of who made a ruling,
                        but every commit names William Payne,
                        including those Claude co-wrote. With more
                        than one person who rules, the record cannot
                        show who ruled, and only a prose sentence in
                        the brief names the maker.
description:            |
                        Who made a ruling, and when, is recorded by
                        the commits, not by a field
                        (_data/schema/sch_ruling.yaml at note). At
                        89c74d8 all 33 commits on main and all 78
                        across all refs had author William Payne (git
                        log --format='%an'), and 76 of the 78 carried
                        a Co-Authored-By: Claude trailer, including
                        6c0a949, which added
                        ruling_cross_item_checks_engine. That ruling
                        names its maker only in prose: "Ruled by WTP"
                        (ruling_cross_item_checks_engine.yaml lines
                        17-19), and the briefs of all 95 rulings now
                        do the same. A commit may name the team member
                        who supplied its content in a Contributor
                        trailer, checked against reg_team_member
                        (src/cctool/commit/message.py within
                        violations), but the trailer is optional and
                        no rule in check.lp reads who made a ruling.
                        The same gap affects opt_owner_only, since the
                        record cannot show that WTP rather than an
                        agent made a ruling. Grows with scale and with
                        more people who rule. Merged from the
                        functional suitability, reviewability and
                        traceability advocates.

