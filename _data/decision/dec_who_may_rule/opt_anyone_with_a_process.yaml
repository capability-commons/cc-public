title:                  Rulings by any team member, with a process
brief:                  |
                        A team member, not only the maintainer, may
                        make a ruling, once the driver check shows
                        that every driver concern of the decision has
                        been argued. An agent records a ruling that a
                        person has made, but does not make one.

