title:                  Maintainer's ruling as the human review
brief:                  |
                        When only the maintainer rules, each ruling is
                        where the one reviewer reads and judges the
                        deliberation. When anyone may rule, each
                        ruling by someone else is one more change
                        waiting for that reviewer.
description:            |
                        One person reviews the code that agents write
                        (_data/decision/dec_tooling_language/ann_one_reviewer_reads_python_readily.yaml
                        at brief). Changes are to be small enough to
                        read in one sitting
                        (AGENTS.md#before-you-finish). The project is
                        expected to be driven mainly by agents
                        (maintainer's statement, 2026-10-14).
                        ASSUMPTION: under opt_anyone_with_a_process,
                        agents could be among those who rule; the
                        maintainer's statement does not say. Weakens
                        if more people come to review.

