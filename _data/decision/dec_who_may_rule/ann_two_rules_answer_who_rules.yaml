title:                  Two disagreeing answers to who may rule
brief:                  |
                        The stated principle lets anyone rule, but the
                        working rule records only Will's rulings. Two
                        rules answer one question and disagree, so the
                        chosen way is not yet in practice.
description:            |
                        Maintainer's statement, 2026-10-14T19:33:44Z
                        (will-messages.md line 689). memory/MEMORY.md
                        line 50: "Only record rulings Will has made",
                        a note for commit 7db4229 at 19:26:27Z, seven
                        minutes before the statement. The only ruling
                        so far is by William Payne (6c0a949). Weak
                        against growth; it closes when one rule is
                        retired.

