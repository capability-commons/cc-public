title:                  Two disagreeing answers to who may rule
brief:                  |
                        The stated principle lets anyone rule, but the
                        working rule records only WTP's rulings. Two
                        rules answer one question and disagree, so the
                        chosen way is not yet in practice.
description:            |
                        Maintainer's statement, 2026-10-14
                        (will-messages.md line 689). memory/MEMORY.md
                        line 50: "Only record determinations WTP has
                        made", a note for commit 7db4229, seven
                        minutes before the statement; that note lives
                        outside the repository. In the tree, the guide
                        for agents says to record only a ruling that a
                        person has made
                        (.agents/skills/editing-data-items/SKILL.md
                        lines 87-88), concept_team_member says a team
                        member may rule on decisions
                        (_data/register/reg_concept.yaml lines
                        2691-2692), and concept_maintainer says the
                        maintainer is the person whose rulings settle
                        decisions today (same file, lines 1951-1952).
                        All 95 rulings so far name WTP, the only entry
                        in reg_team_member. Weak against growth; it
                        closes when one rule is retired.

