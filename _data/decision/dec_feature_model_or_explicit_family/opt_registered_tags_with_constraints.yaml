title:                  Registered tags with requires and excludes
brief:                  |
                        Tags come from a registered vocabulary in
                        which a tag may require or exclude others,
                        much as Kconfig's depends on and select do,
                        and each resolved dataflow graph is checked
                        against those constraints. Variants are still
                        written by hand.

