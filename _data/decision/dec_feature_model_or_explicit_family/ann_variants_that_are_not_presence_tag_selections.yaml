title:                  Variants that are not presence tag selections
brief:                  |
                        A feature model that generates variants can
                        only generate what a selection of features
                        expresses. Patrol's replay variant adds three
                        nodes and three edges, and the Orin variants
                        write a hostname and a detector profile, so
                        most of the drafted family could not be
                        generated, while registered presence tags
                        still let every variant be written by hand. A
                        feature selection does fit the owner's settled
                        and plural member products, so generation may
                        earn its place later for member products, not
                        now for experiments.
description:            |
                        Sources:
                        - The replay variant holds a filter, three
                          adds and three joins.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          lines 25-63)
                        - The superset Orin variant writes the station
                          hostname and the analysis profile.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 26-32)
                        - In the generating option a feature selection
                          names the features of one system, and cctool
                          generates the variant from it.
                          (_data/decision/dec_feature_model_or_explicit_family/opt_feature_model_generates_variants.yaml,
                          brief)
                        - Some variants record settled answers that
                          differ by member product. (owner's statement,
                          2026-10-25T05:45Z,
                          _sources/owner-2026-10-25-morning.md line 5)
                          Strength: strong for simulation and test
                          variants at any scale; it weakens for a large family of member products that differ only in presence tags.

