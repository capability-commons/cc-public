title:                  A generator layer above the hand-made variants
brief:                  |
                        A feature model that generates variants adds a
                        feature selection item, a generator and a
                        second form of every variant, and a fault in a
                        generated variant is fixed in the model, the
                        selection or the generator, not where it
                        shows. Registered presence tags keep one form,
                        the hand-made variant.
description:            |
                        Sources:
                        - The feature model option has a feature
                          selection item from which cctool generates
                          the dataflow variant.
                          (_data/decision/dec_feature_model_or_explicit_family/opt_feature_model_generates_variants.yaml,
                          brief)
                        - 13 of 42 Linux variability bugs were fixed
                          in the mapping, in the model, or in two
                          layers. (Abal et al.,
                          https://www.itu.dk/~brabrand/42-bugs.pdf, as
                          summarized in
                          _sources/survey/product-lines.md line 130)
                        - Imperative propagation, as in Kconfig's
                          select, was found incomplete or error-prone.
                          (Berger et al.,
                          https://gsd.uwaterloo.ca/sites/default/files/vm-2013-berger.pdf,
                          as summarized in
                          _sources/survey/product-lines.md lines 94
                          and 311)
                        - Patrol's six variants are hand-made.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 24-34) Strength: strong now; with many
                          variants over independent features the
                          balance may move, since generation then
                          replaces many hand edits.

