title:                  Registered dataflow tags with constraints
brief:                  |
                        Dataflow tags come from a register whose
                        entries record what each tag means, by a link
                        to the logical component, decision,
                        requirement or interface control document it
                        stands for. Variant operations and views
                        select parts by tag, and constraints are
                        inferred from the meaning of the tags where
                        they can be, as when two tags stand for
                        disjoint logical components, with requires and
                        excludes stated where they cannot. Dataflow
                        variants are still written by hand. Ruled by
                        WTP on 2026-10-25, with the option reworded as
                        WTP described.

