title:                  One constraint form, if tags gain constraints
brief:                  |
                        If tags gain requires and excludes, the
                        repository already has one ruled form for
                        constraints, shared register entries in
                        conjunctive normal form, while the options
                        cite Kconfig's depends on and select. A second
                        constraint form would be one job done by two
                        mechanisms.
description:            |
                        Sources:
                        - Constraints are shared register entries, in
                          conjunctive normal form, as edges.
                          (_data/decision/dec_relation_constraint_form/ruling_relation_constraint_form.yaml at brief)
                        - The tag option says "much as Kconfig's
                          depends on and select do".
                          (_data/decision/dec_feature_model_or_explicit_family/opt_registered_tags_with_constraints.yaml,
                          brief)
                        - The survey suggests that tag constraints and
                          option constraints use one form.
                          (_sources/survey/product-lines.md line 221)
                        - The simplicity measure counts jobs done by
                          more than one mechanism.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.1)
                          Strength: strong if constraints are adopted,
                          at any scale; it falls away if the two
                          options are read as using the ruled form.

