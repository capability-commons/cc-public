title:                  A base that already lists every presence tag
brief:                  |
                        In the current drafts every presence tag that
                        a variant filters or places by is carried by
                        some node or edge of the base, so the base
                        chain is already the vocabulary. One check,
                        that a presence tag an operation names is
                        carried in its base chain, catches a
                        misspelling with no register; a registered
                        vocabulary is a second list of the same names,
                        no draft states a requires or excludes between
                        presence tags, and a generating feature model
                        adds a selection item and a generator.
description:            |
                        Sources:
                        - The current base carries 13 presence tags,
                          and every
                          presence tag in the filter and place operations of
                          the six current variant drafts is among
                          them. (count over
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          and the dfv drafts beside it)
                        - The spelling display_local is in the v1
                          draft and the design note, not in the
                          current drafts, so a filter naming it
                          against the current base would fail the
                          proposed check.
                          (_sources/cc-patrol-notes/draft/v1/dfv_patrol_orin_headless.yaml
                          line 25;
                          _sources/cc-patrol-notes/variants.md line
                          107)
                        - The sketch resolver filters silently.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 33-43)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml at brief)
                        - The owner on the variant mechanism: "we will
                          definitely need to take care to make it
                          simple and elegant and avoid a proliferation
                          of complication". (owner's statement,
                          2026-10-25,
                          _sources/owner-2026-10-25-morning.md line 5)
                          Strength: moderate; it holds while each
                          family has one base, and a shared register
                          starts to earn its place with many variants
                          across several bases.

