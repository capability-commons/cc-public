title:                  A second home for why a system has a feature
brief:                  |
                        In cc-public the reason a system has a feature
                        is a decision, an option and its ruling. A
                        feature model with selection items would hold
                        the same reason a second time, in a structure
                        the decision graph does not argue over.
description:            |
                        Sources:
                        - A variation point is a delayed design
                          decision, and a variant records how
                          decisions were bound.
                          (_sources/variants-framing.md line 18)
                        - Decision models hold decisions, the
                          dependencies between them and assets with
                          inclusion conditions, and the requires and
                          excludes edges between options already form
                          a small one.
                          (_sources/survey/product-lines.md lines 37
                          and 219-224)
                        - The owner asks for a mechanism that is
                          simple and elegant and avoids a
                          proliferation of complication. (owner's
                          statement, 2026-10-25,
                          _sources/owner-2026-10-25-morning.md line 5)
                          Strength: moderate; it weakens if a family
                          outgrows hand-made leaves, as the framing
                          study expects (_sources/variants-framing.md
                          line 125).

