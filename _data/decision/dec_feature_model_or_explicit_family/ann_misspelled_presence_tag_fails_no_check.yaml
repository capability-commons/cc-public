title:                  A misspelled tag that fails no check
brief:                  |
                        The draft resolver filters by set
                        intersection, so a filter naming a tag that no
                        element carries silently removes nothing, and
                        a design note already spells one tag two ways.
                        A registered vocabulary turns that into a
                        check failure, gives each tag an entry it
                        traces to and makes retiring a tag a checked
                        change; the analysis checks add the reverse
                        question, a dead tag that nothing uses, though
                        they find none in Patrol today.
description:            |
                        Sources:
                        - The sketch drops nodes and edges whose tags
                          meet the exclude list, with no test that
                          each excluded tag exists.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 33-43)
                        - The design note and the earlier v1 drafts
                          write display_local; the current base and
                          the Orin filter both write local_display,
                          and every tag the current variant drafts
                          name is carried by the base.
                          (_sources/cc-patrol-notes/variants.md lines
                          48, 107 and 112;
                          _sources/cc-patrol-notes/draft/v1/dfv_patrol_orin_headless.yaml
                          line 25;
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          line 100;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          line 24)
                        - In the Linux kernel features are retired
                          often, so retiring a tag should be a
                          supported, checked change. (Passos et al.,
                          https://www.se.cs.uni-saarland.de/publications/docs/PTD+16.pdf,
                          as summarized in
                          _sources/survey/product-lines.md lines
                          97-100)
                        - A dead tag is one present in no non-abstract
                          variant, and dead, core and void-family
                          checks are small once tags are registered.
                          (_sources/survey/product-lines.md lines
                          196-204)
                        - Traceability asks whether anything exists
                          that nothing calls for.
                          (_data/register/reg_concern.yaml at entries.concern_traceability.question.2)
                        - No base node or edge is dropped by all five
                          runnable leaves. (func-compat advocate's
                          resolution of the drafts) Strength: strong;
                          misspellings and dead tags grow with tags
                          and variants. The analysis checks gain value
                          as the leaves grow.

