title:                  Registered dataflow tags with constraints
brief:                  |
                        [[Dataflow tags]] on [[dataflow nodes]] and
                        [[dataflow edges]] come from a register. Each
                        entry names one group of related parts, such
                        as a functional chain, or an aspect like
                        logging or control, and records what the tag
                        means by an edge to the logical component,
                        decision, requirement or interface control
                        document it stands for. Variant operations
                        select parts by tag, as in deleting a
                        functional chain, and so do views, as in
                        hiding logging and control edges. Constraints
                        follow from that meaning where they can, as
                        when two tags stand for disjoint logical
                        components and so are never on the same node
                        or edge, and an entry may state requires or
                        excludes, much as Kconfig's depends on and
                        select do, where the meaning does not give
                        them. Each resolved dataflow graph is checked
                        against the constraints. Dataflow variants are
                        still written by hand.
description:            |
                        Reworded when WTP upheld it (WTP, 2026-10-25).
                        WTP tagged the nodes of functional chains when
                        building variants with StableFlow, so that a
                        chain could be deleted selectively, and used
                        the same tags as flags in the user interface
                        to show or hide functionally related parts,
                        such as logging and control edges. Those tags
                        gave the parts they label a meaning, and a
                        register gives each tag an entry on which that
                        meaning is recorded, most likely by a link to
                        a logical component, decision, requirement or
                        interface control document; the constraints
                        can probably be inferred from that meaning
                        (WTP, 2026-10-25).

