title:                  Tag meaning that a partner can read from the register
brief:                  |
                        With registered dataflow tags, a partner who
                        reads a dataflow graph can look up what each
                        tag means in its register entry, and follow
                        the link to the logical component, decision,
                        requirement or interface control document it
                        stands for, without adopting the convention of
                        whoever wrote the tags. With free tags the
                        meaning lives only in that convention, and two
                        authors can spell one tag two ways, as the
                        Patrol drafts already do.
description:            |
                        Sources:
                        - Under the reworded option, each tag's
                          register entry records what the tag means by
                          an edge to the item it stands for.
                          (_data/decision/dec_feature_model_or_explicit_family/opt_registered_presence_tags_with_constraints.yaml
                          at brief)
                        - Under the free-tag option, tags on nodes
                          stay free text that no register declares.
                          (_data/decision/dec_feature_model_or_explicit_family/opt_explicit_family_with_free_presence_tags.yaml
                          at brief)
                        - The Patrol drafts disagree on a tag, one
                          note writing display_local where the base
                          graph uses local_display.
                          (_data/decision/dec_feature_model_or_explicit_family/dec_feature_model_or_explicit_family.yaml
                          at description)
                        - Compatibility asks whether a partner can
                          read and use what the design produces, and
                          what a partner must adopt in order to do so.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question)
                          Strength: moderate. It grows with the number
                          of partners that read or write tagged
                          dataflow graphs; with one author it is
                          small.

