title:                  Names of the question and candidate types
brief:                  |
                        The candidate type, then called "decision",
                        becomes "option", prefix opt, and the question
                        type, then called "issue", becomes "decision",
                        prefix dec, so that options are weighed in
                        making a decision and the decision matrix uses
                        the established terms. The relation then
                        called "answers" is renamed for options, as
                        relation_is_option_for. Everything, quotes
                        included, is rewritten into the new words,
                        except where an argument speaks of the former
                        names as words, so that the foundation is
                        plain for new readers while the project is
                        young. Ruled by WTP on 2026-10-20, who
                        accepted the cost of a phased rename and a
                        squash of history.

