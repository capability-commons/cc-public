title:                  The word "option" as the name of an open candidate
brief:                  |
                        In everyday English a decision is a choice
                        already made, so the review tool's "Reject
                        this decision", on a candidate then called a
                        decision, read as overturning something
                        settled. "Option" names a candidate that is
                        still open, which is what the item is, whether
                        or not the question type, then "issue", is
                        renamed too.
description:            |
                        Sources: at 7a66cb6 the review tool's Uphold
                        and Reject buttons carried the titles "Uphold
                        this decision" and "Reject this decision", and
                        the add button read "+ Decision"
                        (src/cc_public/web/page.py). The question page
                        showed a decision matrix of one column per
                        candidate. People will mostly inspect and
                        review, not author (owner's statement,
                        2026-10-18). Existing arguments already called
                        the alternatives options in prose, such as
                        "the chosen option" in
                        ann_commit_reason_held_in_brief_not_title.
                        ASSUMPTION: a new reviewer reads "decision" in
                        its everyday sense. The cost is paid once per
                        reader, but every question page showed the
                        labels.

