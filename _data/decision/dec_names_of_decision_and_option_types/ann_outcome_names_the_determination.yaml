title:                  The word "outcome" as the name of the ruling
brief:                  |
                        "Outcome" already names what settles a
                        candidate, both in this repository and in
                        MADR's "Decision Outcome". Calling every
                        candidate an outcome gives a reader two things
                        called an outcome, one possible and one
                        actual, and a rejected or open outcome reads
                        as a contradiction.
description:            |
                        Sources: the note of concept_decision says
                        that "a ruling records the outcome"
                        (_data/register/reg_concept.yaml); when this
                        was written, concept_option said "Its outcome
                        is a determination". dec_name_of_outcome_type
                        named that item. MADR's "Decision Outcome"
                        section holds the chosen option
                        (https://adr.github.io/madr/). None of IBIS,
                        QOC, MADR, Kepner-Tregoe, 15288 or Pugh calls
                        a candidate an outcome. The review tool gives
                        each candidate a standing of upheld, rejected
                        or open (src/cc_public/web/argument.py).

