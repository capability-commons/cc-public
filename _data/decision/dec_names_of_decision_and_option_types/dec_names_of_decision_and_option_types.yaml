title:                  Names of the question and candidate types
brief:                  |
                        What are the item types called that state a
                        question to be settled and the alternatives
                        that answer it?
description:            |
                        dec_name_of_question_type weighed only "issue"
                        against "question" as names for the question
                        type. The name of the candidate type, then
                        "decision", was never argued. It was the first
                        type, and the candidates for one question were
                        sibling items of that type before the question
                        type existed. The decision matrix reads its
                        columns as options weighed against concerns,
                        which prompted the owner to ask whether the
                        candidates should be called options and the
                        question should be called the decision.

