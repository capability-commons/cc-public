title:                  Size of the change each rename asks for
brief:                  |
                        A prefix cannot change in place, so every item
                        of a renamed type is removed and remade with a
                        new guid, and every reference to it changes. A
                        swap remakes about 310 items and touches about
                        1360 of 1510 tracked files. Renaming only the
                        candidates remakes about 220 and touches about
                        1180. Only keeping both former names asks for
                        no change.
description:            |
                        Sources: retyped_guid and unannounced_removal
                        in src/cctool/commit/change.lp. Commit 6284ccd
                        remade three items to change the prefix "nod"
                        to "dfn". At 7a66cb6 there were 221 tracked
                        files of the candidate type, then prefix
                        "dec", and 89 folders of the question type,
                        then prefix "iss". git grep at 7a66cb6 finds
                        1178 files with a "dec" token and 1362 with
                        either token. A swap also renames the 89
                        folders, then under _data/issue/, the folder
                        in the placement rule and the query option
                        then named "--issue". Counts are approximate.
                        The size grows with the graph, which favors
                        settling the names now. If the change is
                        squashed into history (maintainer's statement,
                        2026-10-20T14:45:25Z), no diff of it is
                        reviewed, and this point weakens.

