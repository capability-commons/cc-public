title:                  The words "choice" and "option" already in use
brief:                  |
                        "Choice" already defines the candidate type,
                        then called "decision" ("one choice about one
                        or more items"), and names a style class and
                        click.Choice in the code, so it reads as the
                        selected item as much as a candidate. "Option"
                        already names command-line options in cctool.
                        The clash for "option" is weak, since a flag
                        is easy to tell from a type.
description:            |
                        Sources: the brief of the candidate concept,
                        now con_option
                        (_data/register/reg_concept.yaml). At the
                        time, "option" appeared on about 70 lines in
                        src/cc_public/cli, most of them for click
                        options, and "choice" on 19 lines in src.
                        These included the .choice class of the review
                        request form (src/cc_public/web/page.py) and
                        click.Choice (src/cc_public/cli/auditing.py).
                        The review form already called a candidate
                        "the choice" (src/cc_public/web/request.py),
                        so the word was in use for a candidate too.
                        ASSUMPTION: a reader takes "choice" as the
                        selected item. The clash grows with the code,
                        not the graph.

