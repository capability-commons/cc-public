title:                  Prefix "dec" given a new meaning by a swap
brief:                  |
                        A swap moves the prefix "dec", and ids such as
                        type_decision and concept_decision, from the
                        candidate type to the question type. An old
                        mention of an id the swap reuses still
                        resolves and passes the checks while it names
                        the other type, and in the diff of the change
                        the same ids carry opposite meanings. Renaming
                        only the candidate type leaves the old names
                        free, so the checks flag each stale use.
description:            |
                        Sources: a renamed register entry keeps its
                        old id as an alias (commit 18f1136, for the
                        node type). A reference or mention by alias is
                        reported as outdated only while the alias
                        names no live item (outdated_reference and
                        outdated_mention in
                        src/cc_public/check/check.lp). Under a swap,
                        the question now named
                        dec_preferred_terms_in_names would take the id
                        that its own candidate, now
                        opt_preferred_terms_in_names, then held, so
                        the order of the renames matters. 117 lines in
                        the tree named both "decision" and "issue"
                        (git grep at 7a66cb6), where a single
                        substitution pass goes wrong. The cost grows
                        with the graph. Squashing history (owner's
                        statement, 2026-10-20T14:45:25Z) removes the
                        diff but not the stale mentions.

