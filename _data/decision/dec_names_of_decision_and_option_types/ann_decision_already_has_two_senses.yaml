title:                  Two senses of the word "decision" already in use
brief:                  |
                        The type term "decision" then named each
                        candidate, but definitions, a style rule and
                        the review tool also used "decision" for the
                        whole question weighed across the candidates.
                        If both former names were kept, one term would
                        keep two senses, twice on the same review
                        page.
description:            |
                        Sources: the candidate type, now type_option,
                        said that alternatives are decisions that
                        answer the same issue
                        (_data/register/reg_data_item_type.yaml at
                        7a66cb6), and the relation now named
                        relation_is_option_for said the same
                        (_data/register/reg_relation.yaml). Uses in
                        the question sense were these. concept_concern
                        says "a decision weighs the concerns its
                        arguments speak for"
                        (_data/register/reg_concept.yaml).
                        relation_is_driven_by says "every decision
                        about the logical component is argued" for its
                        drivers. style_record_the_ruling, before it
                        was rewritten to describe a ruling, said "A
                        design decision says what was chosen, what was
                        not, and why". dec_subject_of_a_decision is
                        titled "Subject of a design decision". The
                        review tool headed each question page
                        "Decision matrix", with a column for each
                        candidate, then called a decision
                        (src/cc_public/web/page.py). No check can tell
                        the two senses apart in prose.

