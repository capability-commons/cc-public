title:                  The word "decision" as the name of the question elsewhere
brief:                  |
                        In MADR, Kepner-Tregoe and ISO/IEC/IEEE 15288,
                        "decision" names the question being settled or
                        the choice made, never one candidate. Under
                        the former names, a partner's decision would
                        map to our question type, then "issue", and
                        our candidate type, then "decision", would map
                        to their option, so one word would mean
                        different things on the two sides.
description:            |
                        Sources as in
                        ann_option_and_decision_match_methods. IBIS,
                        which supplies the word "issue", calls the
                        candidates positions (Kunz and Rittel, 1970).
                        The candidate concept, now concept_option,
                        then said that "the other decisions that
                        answer the issue record the alternatives"
                        (_data/register/reg_concept.yaml at 7a66cb6).
                        Renaming is cheapest now, while nobody else
                        uses cc-public (maintainer's statement,
                        2026-10-20). Weak while nothing exports to a
                        partner format.

