title:                  Concept naming inside a large commit
brief:                  |
                        The chosen names arrived in one commit with
                        other renames and nine new schemas, too large
                        to read in full, so the naming was not
                        reviewed as a change of its own.
description:            |
                        Commit 232f001 (pre-squash): 20 files, 939
                        insertions, 5,885 deletions, with the renames
                        of the type and term registers, a schema
                        family rename, a relation rename, two new
                        types and nine schemas. Most deletions (3,169
                        and 2,410 of 5,885) replace the legacy concept
                        register of 3,259 lines and the legacy data
                        item type register of 2,608 lines. This
                        weakens confidence in the review, not the
                        decision. Keeping the old name would not by
                        itself have made the commit smaller.

