title:                  Concepts as entries of reg_concept
brief:                  |
                        Concepts are entries of reg_concept, one per
                        concept with its terms rated below it, as ISO
                        1087 and the TBX concept entry do. The prefix
                        concept_ is the preferred term of the concept,
                        while term is deprecated for it. The form can
                        still move to standalone items later without
                        new guids. Ruled by William Payne on
                        2026-10-22.

