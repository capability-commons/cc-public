title:                  All concept changes in one file
brief:                  |
                        Every new concept is appended at the end of
                        one file, so changes that should be
                        independent meet in one place and can conflict
                        across branches.
description:            |
                        src/cctool/edit/edit.py within _append_entry
                        (new entries go after the last one). The
                        legacy register was 3,259 lines
                        (will-messages.md line 74), and
                        _data/register/reg_concept.yaml is now 2,352
                        lines. Two branches that each append after the
                        same last entry change the same region, which
                        git-merge reports as a conflict
                        (https://git-scm.com/docs/git-merge).
                        ASSUMPTION: parallel branches are common
                        enough to matter. The cost is shared with the
                        eight other register-held types
                        (_data/register/reg_data_item_type.yaml).

