title:                  One new concept as one hunk
brief:                  |
                        Adding a concept is one block of added lines
                        in one file. A standalone item would add a
                        file per concept that repeats about seven
                        lines of rights boilerplate for a reviewer to
                        read.
description:            |
                        Commit 0d2e23a adds con_commit as one hunk of
                        28 lines in _data/register/reg_concept.yaml. A
                        standalone file opens with copyright, license
                        and protective_mark, seven lines with spacing,
                        beside the id_self and guid_self that an entry
                        also carries
                        (_data/logical_component/lc_tooling.yaml lines
                        1-10). Embedded items carry no rights
                        (will-messages.md line 53).

