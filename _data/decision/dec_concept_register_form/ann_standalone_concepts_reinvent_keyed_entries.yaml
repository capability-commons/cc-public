title:                  Standalone concepts reinventing keyed entries
brief:                  |
                        A concept that travels on its own would
                        reinvent the keyed entries a register already
                        gives.
description:            |
                        The worked example in the writing style rule
                        style_record_the_ruling, before it was
                        rewritten to describe a ruling
                        (_data/register/reg_writing_style_rule.yaml at
                        entries.style_record_the_ruling.description at
                        3e4fb7d). That wording was an assistant's
                        rewording in 232f001, made when WTP asked to
                        change the vocabulary of the style rules
                        (2026-10-13). The example predates the
                        decision: in bb8c338 it read "A glossary is a
                        register whose entries are terms. A document
                        of its own was rejected: it would reinvent
                        keyed entries." ASSUMPTION: that earlier text
                        came from an assistant session; no record
                        names its author. WTP gave no reason of his
                        own for rejecting the standalone form.

