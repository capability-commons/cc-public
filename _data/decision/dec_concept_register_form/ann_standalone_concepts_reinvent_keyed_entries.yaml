title:                  Standalone concepts reinventing keyed entries
brief:                  |
                        A concept that travels on its own would
                        reinvent the keyed entries a register already
                        gives.
description:            |
                        The worked example in the writing style rule
                        style_record_the_decision
                        (_data/register/reg_writing_style_rule.yaml
                        lines 263-267). Its present wording is an
                        assistant's rewording in 232f001, made when
                        Will asked to change the vocabulary of the
                        style rules (2026-10-13T13:54:30Z). The
                        example predates the decision: in bb8c338 it
                        read "A glossary is a register whose entries
                        are terms. A document of its own was rejected:
                        it would reinvent keyed entries." ASSUMPTION:
                        that earlier text came from an assistant
                        session; no record names its author. Will gave
                        no reason of his own for rejecting the
                        standalone form.

