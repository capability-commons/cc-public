title:                  Prefix that is the preferred term
brief:                  |
                        The name reg_concept and the prefix concept_
                        use the preferred term of the concept they
                        hold. The prefix term_ and a register named
                        for terms would name concept entries by a term
                        the register deprecates for them.
description:            |
                        The preferred term of concept_concept is
                        concept, and term is one of its deprecated
                        terms (_data/register/reg_concept.yaml lines
                        258-261). prefix_form accepts concept as a
                        whole word of that preferred term
                        (src/cc_public/check/check.lp lines 306-317).
                        A term_ prefix would also share its stem with
                        the fields term_preferred, term_admitted and
                        term_deprecated
                        (_data/schema/sch_regentry_concept.yaml lines
                        48-80). The concern draws on ISO 704:2022 and
                        ISO 1087:2019, which keep a concept apart from
                        the terms that designate it
                        (_data/register/reg_concern.yaml lines
                        776-781).

