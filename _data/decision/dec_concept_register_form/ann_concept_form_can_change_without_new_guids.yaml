title:                  Concept form open to later change
brief:                  |
                        An entry is addressed exactly as a standalone
                        item is, a guid survives promotion, and one
                        edge on t_concept sets the form. So register
                        entries lock little in, and a later switch
                        touches data, not code or references.
description:            |
                        guid_target addresses embedded and standalone
                        items the same way
                        (_data/schema/sch_trait_relation.yaml).
                        guid_self is kept on promotion from embedded
                        to standalone
                        (_data/schema/sch_trait_identity.yaml lines
                        105-113). t_concept has
                        r_has_items_held_in_register to reg_concept
                        (_data/register/reg_data_item_type.yaml lines
                        323-326); the edit tool picks the form from
                        that edge (src/cc_public/edit/edit.py lines
                        236-269 and 921-936). ASSUMPTION: nothing yet
                        performs such a move. A partner that wants one
                        concept takes the whole register file.

