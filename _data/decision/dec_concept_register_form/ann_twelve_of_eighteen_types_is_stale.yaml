title:                  Twenty-three of thirty-two types now standalone
brief:                  |
                        ann_tooling_writes_both_concept_forms says
                        twelve of the eighteen types are standalone
                        items. There are now 32 types, of which 9 are
                        held in registers and 23 are standalone.
description:            |
                        _data/register/reg_data_item_type.yaml holds
                        32 type entries. Nine carry
                        relation_has_items_held_in_register:
                        type_type, type_relation,
                        type_protective_mark, type_concept,
                        type_writing_style_rule, type_concern,
                        type_role, type_relation_constraint and
                        type_design_rule. The point that the
                        standalone form is in wide use is stronger
                        now. Found in the review of 2026-10-22.

