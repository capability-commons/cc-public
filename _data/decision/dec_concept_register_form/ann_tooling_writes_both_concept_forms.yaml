title:                  Standalone form already in use and tooled
brief:                  |
                        Twelve of the eighteen types are standalone
                        items, and the edit tool writes both forms
                        through one switch, so a standalone concept
                        would reinvent nothing today.
description:            |
                        _data/register/reg_data_item_type.yaml (six
                        types carry r_has_items_held_in_register, at
                        lines 85-88, 226-229, 272-275, 323-326,
                        371-374, 513-516); src/cc_public/edit/edit.py
                        lines 236-269. Holds for today's tooling only.
                        The edit tool came later (first commit
                        c4a8721, 2026-10-14), so the recorded reason
                        may have meant the data layout, not code.

