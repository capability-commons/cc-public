title:                  Rename while concept references were few
brief:                  |
                        The rename to reg_concept and con_ came when
                        few ids referred to concepts, so it was a
                        small change to judge. A later rename would
                        put a larger mechanical diff before a
                        reviewer.
description:            |
                        Five dangling term_* references in the
                        2026-10-09 session summary (will-messages.md
                        line 69) and seven con_* refs in the new
                        register (owner's statement,
                        2026-10-13T14:06:59Z). Each type entry now
                        carries id_concept and guid_concept
                        (_data/register/reg_data_item_type.yaml), and
                        con_ ids appear in tests and the CLI.
                        ASSUMPTION: a later rename grows with types,
                        concepts and code references.

