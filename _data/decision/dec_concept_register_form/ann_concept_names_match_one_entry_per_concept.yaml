title:                  Names that match one entry per concept
brief:                  |
                        The register holds one entry per concept, not
                        one per term, so the old name misleads. The
                        name reg_concept and the prefix con_ say what
                        an entry is and keep the names consistent.
description:            |
                        Owner's statements, 2026-10-13T12:52:27Z
                        ("[the term register] is misleading. We have
                        one entry per concept, not one entry per
                        technical term") and 2026-10-13T13:10:29Z
                        ("change the term_* prefix to con_* so it's
                        consistent"), will-messages.md lines 95-113.
                        Applied in commit 232f001 (pre-squash).

