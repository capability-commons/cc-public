title:                  Shared stem of con and concern
brief:                  |
                        con_ takes a stem that the concern type also
                        needs, so concern ids spell out the word, and
                        a reader met the concept of concern, under
                        con_, beside concern_* ids.
description:            |
                        When this was argued, the concept type had the
                        prefix con
                        (_data/register/reg_data_item_type.yaml line
                        316, tag pre_squash_20261020), and the concern
                        type had the prefix concern "because con
                        already marks the concept type" (same file
                        lines 496-506). Most other prefixes abbreviate
                        in three or four letters. The concern register
                        came later (a6996e8, 2026-10-13, pre-squash),
                        so the clash was not weighed. ASSUMPTION: a
                        reader first reads con_ as short for concern.
                        A one-off learning cost, not a cost per task.

