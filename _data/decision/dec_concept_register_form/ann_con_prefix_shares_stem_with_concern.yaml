title:                  Shared stem of con and concern
brief:                  |
                        con_ took a stem that the concern type also
                        needed, so concern ids spelled out the word,
                        and a reader met the concept of concern, under
                        con_, beside concern_* ids. The concept prefix
                        is now concept_.
description:            |
                        When this was argued, the concept type had the
                        prefix con
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_concept.title, tag
                        pre_squash_20261020), and the concern type had
                        the prefix concern "because con already marks
                        the concept type" (same file lines 496-506).
                        Most other prefixes abbreviate in three or
                        four letters. The concern register came later
                        (a6996e8, 2026-10-13, pre-squash), so the
                        clash was not weighed. ASSUMPTION: a reader
                        first reads con_ as short for concern. A
                        one-off learning cost, not a cost per task.
                        The concept type now has the prefix concept
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_concept.prefix), and the note of
                        the concern type now says its prefix is the
                        whole word concern, the preferred term of its
                        concept (same file lines 563-564). 22 of the
                        32 prefixes abbreviate; the other 10 are whole
                        words.

