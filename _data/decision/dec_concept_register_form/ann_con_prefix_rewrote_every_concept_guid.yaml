title:                  Concept guids rewritten by the con_ prefix
brief:                  |
                        The change from term_ to con_ changed the guid
                        of every concept carried over, although the
                        rules then in force said a guid never changes.
                        Any foreign edge to an old guid would no
                        longer resolve.
description:            |
                        Before 232f001 guid_self was "Opaque,
                        immutable" (git show
                        232f001^:_data/schema/sch_trait_identity.yaml
                        lines 108-112). term_type had guid
                        term_0d0e04ed926841818a9ef3a06243a4fa (git
                        show 232f001^:_data/register/reg_concept.yaml
                        lines 153-155); con_type has
                        con_0d0e04ed926841818a9ef3a06243a4fa
                        (232f001:_data/register/reg_concept.yaml line
                        55). Of 138 term_ guids, 7 survive with a new
                        prefix and none unchanged. guid_target is the
                        sole resolvable reference
                        (_data/schema/sch_trait_relation.yaml). The
                        later rule retyped_guid flags this pattern
                        (src/cc_public/commit/change.lp lines
                        104-118). ASSUMPTION: no record shows whether
                        any repository outside cc-public held edges to
                        term_ guids, so the harm done may be nil; the
                        cost grows with partners.

