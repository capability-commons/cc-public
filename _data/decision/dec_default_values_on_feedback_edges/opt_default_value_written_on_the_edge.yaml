title:                  Default value written on the feedback edge
brief:                  |
                        The configuration of each feedback edge gives
                        its first value, as the initial tokens of a
                        delay in synchronous dataflow. Nodes declare
                        nothing about defaults, and a check refuses a
                        feedback edge that has no value written on it.
description:            |
                        The way synchronous dataflow tools place
                        initial tokens on an arc.

