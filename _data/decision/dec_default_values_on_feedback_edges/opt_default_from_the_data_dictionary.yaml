title:                  Default from the data dictionary entry of the type
brief:                  |
                        The data dictionary entry of each type may
                        give a default value, and any feedback edge
                        whose port type has one can be closed. Nodes
                        declare nothing about defaults, and the
                        default of a type is the same wherever it is
                        used.
description:            |
                        A third place a default could live, beside the
                        port and the edge.

