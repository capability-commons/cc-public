title:                  First values chosen per use, not per type
brief:                  |
                        Dataflow tools that give a type-wide initial
                        value also let the user set one for a
                        particular delay, which suggests that one
                        default per type is not enough for every loop.
                        The dictionary option gives one default per
                        type wherever it is used. The port and edge
                        options let the value differ between uses.
description:            |
                        Sources:
                        - In the SDF domain of Ptolemy, "a delay with
                          parameter equal to one is simply an initial
                          particle on an arc"; "for most particle
                          types, the initial value of a delay will be
                          zero"; "Initializable delays allow the user
                          to give values to the initial particles
                          placed in the buffer."
                          (https://ptolemy.berkeley.edu/papers/almagest/docs/user/pdf/sdf.pdf)
                        - The Initial condition parameter of the
                          Simulink Unit Delay block gives the output
                          for the first sampling period, and is 0 by
                          default.
                          (https://www.mathworks.com/help/simulink/slref/unitdelay.html)
                        - The dictionary option gives a type the same
                          default wherever it is used.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_the_data_dictionary.yaml
                          at brief)
                        - Assumption: some types, such as a frame from
                          a camera or a handle to a resource, have no
                          value that would be right as a first value
                          everywhere. Strength: moderate; the
                          dictionary default could serve as a fallback
                          beneath a port or edge value.

