title:                  Partner tools that place first values on arcs or blocks
brief:                  |
                        Synchronous dataflow tools put the initial
                        tokens of a loop on the arc, and Simulink puts
                        the initial condition on a delay block, so the
                        edge option maps directly to the first and the
                        port option to the second. Under the port
                        option as drafted, a graph exported to a tool
                        of the first kind carries no initial value,
                        since the value is not in the items.
description:            |
                        Sources:
                        - In Ptolemy's SDF domain a delay is an
                          initial particle on an arc, and the
                          scheduler flags an error for a loop with no
                          delays.
                          (https://ptolemy.berkeley.edu/papers/almagest/docs/user/pdf/sdf.pdf)
                        - The Simulink Unit Delay block holds its own
                          Initial condition parameter.
                          (https://www.mathworks.com/help/simulink/slref/unitdelay.html)
                        - The edge option is described as the way
                          synchronous dataflow tools place initial
                          tokens on an arc.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_value_written_on_the_edge.yaml
                          at description)
                        - The port option states whether a port can
                          supply a default, not the value.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        - Assumption: a partner tool of the SDF kind
                          will read or write cc-public graphs; none is
                          named in the tree yet. Strength: weak to
                          moderate; it rests on a partner not yet
                          chosen, and a port that declared its value
                          would export as well as an edge.

