title:                  Default from a port that declares it can supply one
brief:                  |
                        Each node kind declares, for each of its
                        ports, whether it can supply a default value,
                        and a node that can make a default value of a
                        type makes every port of that type able to
                        supply one. A feedback edge needs at least one
                        end that can: the source emits a first token,
                        or the destination uses its default when
                        nothing has arrived. A check refuses a
                        feedback edge with no such end, including one
                        through a slot or across the boundary between
                        Kahn and actor nodes, and a variant operation
                        that would make one is refused by its
                        preconditions. The engine primes the edge
                        again after a rewire or a version swap.
description:            |
                        WTP's rule (WTP, 2026-10-26).

