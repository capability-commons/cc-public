title:                  Default values on feedback edges
brief:                  |
                        Where does the first value on a feedback edge
                        come from, and how do the checks know that one
                        will be there?
description:            |
                        A loop of data flow is closed by a feedback
                        edge, whose value comes from the step before;
                        at the first step, and after a rewire or a
                        version swap, there is no step before, so
                        something must supply a first value or the
                        loop never starts. WTP stated a rule on
                        2026-10-26: every feedback edge in a Kahn
                        network needs a default value supplied by its
                        source port or its destination port; each node
                        declares, for each port it handles, whether it
                        can supply a default; two ports that cannot
                        are never joined by a feedback edge; slots
                        between the static and dynamic subgraphs
                        inherit the ability from the ports they join,
                        as do edges between Kahn and actor nodes; and
                        a transform that would break the rule is
                        refused when it is validated in Python before
                        it is applied. The ruling on crossing between
                        static and dynamic already applies this rule
                        to slots.

