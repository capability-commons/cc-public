title:                  Port rule already ruled for slots
brief:                  |
                        The ruling on crossing between static and
                        dynamic subgraphs already rests on ports that
                        declare whether they can supply a default, and
                        lets a slot inherit that ability from the
                        ports it joins. The port option adds no
                        mechanism beyond what that ruling needs. The
                        edge and dictionary options have nodes declare
                        nothing, so the slot ruling would need a
                        second source of first values, or rewording.
description:            |
                        Sources:
                        - The ruling gives slots an optional default
                          and states that each node declares, for each
                          port, whether it can supply a default, and
                          that a slot inherits that ability from the
                          ports it joins.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ruling_same_step_through_fixed_slots.yaml
                          at brief)
                        - The edge option and the dictionary option
                          both say that nodes declare nothing about
                          defaults.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_value_written_on_the_edge.yaml
                          at brief;
                          _data/decision/dec_default_values_on_feedback_edges/opt_default_from_the_data_dictionary.yaml
                          at brief)
                        - Simplicity asks whether a design follows
                          from decisions already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2)
                        - Assumption: a slot could also take its first
                          value from an edge or a dictionary entry, so
                          the conflict is one of wording and of a
                          second mechanism, not of possibility.
                          Strength: strong while the slot ruling
                          stands; it does not grow or shrink with the
                          number of graphs.

