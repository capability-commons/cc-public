title:                  First value of a loop kept in node code
brief:                  |
                        Under the port option the items record only
                        that a port can supply a default, and the
                        value itself lives in the code of the node. A
                        reader of the graph cannot see what a loop
                        starts from, or why. The edge option writes
                        the value in the graph item, and settings
                        already show a way to keep a value in the
                        interface, which the port option could borrow.
description:            |
                        Sources:
                        - The port option declares, for each port,
                          whether it can supply a default value; it
                          states no value.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - The edge option gives the first value in the
                          configuration of each feedback edge.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_value_written_on_the_edge.yaml
                          at brief)
                        - A setting of an interface may state its
                          default, as the surface language writes it;
                          a port has no such field.
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.setting.allOf.1.properties.default
                          and $defs.port)
                        - Traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                        - Assumption: the first value of a feedback
                          loop matters to the behavior of the system,
                          as the initial condition of a delay does.
                          Strength: moderate; it falls away if the
                          port declares its value rather than a yes or
                          no.

