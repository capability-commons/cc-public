title:                  Edge values to convert on every type upgrade
brief:                  |
                        A value written on a feedback edge is data of
                        one version of a type, so every upgrade of
                        that type must convert each such value in
                        every graph and variant operation that writes
                        one. Under the dictionary option the default
                        sits in the entry beside the upgrade mapping,
                        and under the port option it sits in node code
                        built against the type. An edge split by a
                        transform also has to say which half keeps the
                        value.
description:            |
                        Sources:
                        - Each type is a dictionary item with a
                          version; a new version maps each field as
                          kept, renamed, converted, or new with a
                          default.
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          at brief)
                        - Port types name entries of data
                          dictionaries.
                          (_data/decision/dec_port_types/ruling_port_types_from_data_dictionaries.yaml
                          at brief)
                        - The edge option writes the first value in
                          the configuration of each feedback edge.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_value_written_on_the_edge.yaml
                          at brief)
                        - Insert-on-edge and edge-policy lowering
                          split an edge in two.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_split_edge_plain_by_ends_open_for_a_key.yaml
                          at brief)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                        - Assumption: the upgrade mapping can be
                          applied to a literal value as it is to a
                          token, so the cost is in finding every
                          literal, not in converting it. Strength:
                          moderate; it grows with the number of
                          feedback edges and of type versions.

