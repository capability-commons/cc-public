title:                  Optional input as a destination that needs no first value
brief:                  |
                        An interface can already state that an input
                        is optional, meaning that an invocation may
                        run with no value there. The one feedback edge
                        in the tree ends at such an input, whose
                        packet type carries a flag for an empty
                        packet. Under the port option the destination
                        case may need no new field, if an optional
                        input counts as one that can close a feedback
                        edge.
description:            |
                        Sources:
                        - A port may state optional, "Whether an
                          invocation may run with no value here."
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.port.allOf.1.properties.optional)
                        - The smoketest's one feedback edge ends at
                          the feedback input of the system controller.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                          at dataflow_edge.2.direction)
                        - That input states optional: true.
                          (_data/interface_control_document/icd_system_controller.yaml
                          at
                          surface.step.dataflow_step.input.feedback.optional)
                        - The feedback packet carries ena, true when
                          the packet carries data.
                          (_data/interface_control_document/icd_system_controller.yaml
                          at declaration.feedback_packet.shape)
                        - The port option has the destination use its
                          default when nothing has arrived.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - Assumption: WTP's rule speaks of a default
                          value, and an optional input that runs with
                          no value may not be what he means; whether
                          optional is enough is his call. Strength:
                          moderate; it covers the destination side
                          only, and a source that emits a first token
                          still needs a declaration.

