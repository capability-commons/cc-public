title:                  Type default beside the field defaults of an upgrade
brief:                  |
                        The ruled data dictionary already gives a
                        default to each field that an upgrade adds, so
                        a default for a whole type is a field the
                        entry nearly has. The dictionary option then
                        puts every first value in one kind of item,
                        with no declaration on nodes and no value on
                        edges.
description:            |
                        Sources:
                        - A check fails an upgrade with a new field
                          that has no default.
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          at brief)
                        - The dictionary option has nodes declare
                          nothing about defaults.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_the_data_dictionary.yaml
                          at brief)
                        - Simplicity counts the distinct mechanisms a
                          design introduces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0)
                        - Assumption: only fields added by an upgrade
                          must have a default, so the first version of
                          a type still needs a default for every
                          field, which is a new requirement on
                          dictionary entries. Strength: weak; it
                          trades a declaration on ports for one on
                          types, and the slot ruling still speaks of
                          ports.

