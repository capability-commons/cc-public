title:                  Default from a port that declares it can supply one
brief:                  |
                        Each node kind declares, for each of its
                        ports, whether it can supply a default value,
                        and a feedback edge needs at least one end
                        that can. Ruled by WTP on 2026-10-26; the
                        option is WTP's own rule.

