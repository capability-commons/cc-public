title:                  Transport library taken into the engine by fixed slots
brief:                  |
                        Between execution units a value crosses
                        through a transport, and the candidates named
                        so far are third-party code such as ZeroMQ. If
                        a gateway node holds the transport, that
                        library is a dependency of the gateway node
                        kinds only, and a change to it or its
                        withdrawal touches those nodes. If the
                        engine's fixed slots must carry a value across
                        units, the transport library becomes a
                        dependency of the engine, in every build that
                        has such a boundary. Within one unit the fixed
                        slots hand over pointers and take nothing from
                        third parties, so the point applies only to
                        boundary edges that cross units.
description:            |
                        Sources:
                        - A pointer handover is free only within one
                          address space, and an edge whose ends are in
                          different execution units needs a copy
                          through a transport, which a gateway node
                          can hold.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ann_crossing_gateway_holds_transport_between_units.yaml
                          at brief)
                        - Between processes or machines the transport
                          is ZeroMQ or a shared-memory queue, still
                          open.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ann_crossing_gateway_holds_transport_between_units.yaml
                          at description)
                        - A behavior moves into the engine only when a
                          recorded decision shows that no inserted
                          node can do it within a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief)
                        - Assumption: some boundary edges between the
                          static and dynamic subgraphs will cross
                          execution units. Strength: weak to moderate;
                          under the engine ruling, a transport in the
                          engine needs a recorded exception, which
                          limits the risk.

