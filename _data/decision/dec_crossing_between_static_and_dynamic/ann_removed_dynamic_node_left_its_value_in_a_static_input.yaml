title:                  Removed dynamic node that left its last value in a static input
brief:                  |
                        In the trial, after a change set removed the
                        dynamic node feeding a static sink, the sink
                        read that node's last value at every later
                        step, 13129682 for ever, and could not tell
                        that its producer was gone. The ruled slots
                        carry an optional default, but the ruling does
                        not say what a static input reads in a local
                        step its slot does not fill, whether the
                        region was removed, has not run yet, or was
                        put back after a failed swap. The ruled option
                        needs that rule stated: the slot's default
                        when it has one, otherwise a message marked
                        absent, never a value held from an earlier
                        step. Without it a static safety function can
                        act on a stale picture with no fault raised.
description:            |
                        Sources:
                        - Measured: after the removal at step 5 the
                          sink gave 13129682 at
                          steps 5 to 10. (review of 2026-10-29, CC-014, and area report
                          trial-engine, TE-12)
                        - Nothing resets a static input when its
                          feeding edge or node is
                          removed. (review of 2026-10-29, CC-014; trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, functions build,
                          install and dynamic_slot)
                        - Values cross in the same step through fixed
                          slots, each with an
                          optional default value.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ruling_same_step_through_fixed_slots.yaml
                          at brief)
                        - Every input carries exactly one message in
                          each local step, and
                          a message with no items means nothing arrived.
                          (_data/interface_control_document/icd_dataflow_node.yaml at
                          surface.step.dataflow_step.availability)
                        - How a reader tells an absent message from an
                          empty one is open.
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/dec_how_a_reader_tells_absent_from_empty.yaml
                          at brief)
                        - An earlier argument on this decision found
                          that the fixed-slot
                          option does not say what a static input sees when its region
                          does not run; the trial now shows the consequence.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ann_crossing_defined_value_when_dynamic_side_is_absent.yaml
                          at brief)
                        Strength: strong for safety and reliability;
                        it is a gap in the wording of the ruled
                        option, closed by one stated rule, not a
                        reason to reverse it.

