title:                  One step delay into static nodes
brief:                  |
                        Values from static to dynamic nodes cross in
                        the same step. A static input fed from a
                        dynamic node takes the value of the step
                        before, or an explicit empty token when
                        nothing feeds it, so the static schedule never
                        waits on the dynamic subgraph.

