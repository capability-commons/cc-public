title:                  Boundary anchor named in the graph or derived by the generator
brief:                  |
                        A gateway is a node a reader can see in the
                        graph, with its own interface, tests and
                        settings. A fixed call slot is placed by the
                        generator from the static edges, so where a
                        dynamic region runs in the static order is
                        derived, and its two refusal rules are rules
                        every author of a change set must learn. Both
                        need a rebuild of the static part to add a new
                        anchor.
description:            |
                        Sources: A gateway node is itself static and
                        gives static edges a stable anchor, accepting
                        dynamic edges on its other side
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml
                        lines 13-16). The static schedule holds a
                        fixed call slot for each dynamic region,
                        placed by the static edges at the boundary,
                        and a change set that would need a region at
                        another point, or would close a loop through
                        the static subgraph within a step, is refused
                        (opt_same_step_through_fixed_slots.yaml in the
                        same folder, lines 14-20). Stableflow's
                        gateway nodes are ordinary nodes in the
                        orchestrated graph, used before in the Python
                        Stableflow runtime
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 182-199). The owner suggested gateway
                        nodes and asked whether all static nodes could
                        cope with dynamic edges instead (owner's
                        statement, 2026-10-24). Strength: moderate;
                        the readability gain holds at any size, but
                        each crossing adds a gateway to configure and
                        read. Neutral on the delay option, which needs
                        no anchor.

