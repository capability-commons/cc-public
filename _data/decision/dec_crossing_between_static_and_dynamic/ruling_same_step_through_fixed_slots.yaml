title:                  Same step through fixed slots
brief:                  |
                        Values cross between the static and dynamic
                        subgraphs in the same step through fixed
                        slots, each with an optional default value.
                        Ruled by WTP on 2026-10-26. WTP's reason:
                        every feedback edge in a Kahn network needs a
                        default value, supplied by its source port or
                        its destination port, so each node declares,
                        for each port, whether it can supply a
                        default; two ports that cannot are never
                        joined by a feedback edge. A slot inherits
                        that ability from the ports it joins, which
                        restricts how graphs are wired, and a
                        transform that would break the rule is refused
                        when it is validated in Python before it is
                        applied.

