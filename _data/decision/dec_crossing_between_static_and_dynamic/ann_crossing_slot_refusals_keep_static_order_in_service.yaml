title:                  Static order guarded by the slot refusals
brief:                  |
                        The fixed-slot option refuses a change set
                        that would move a region in the static order
                        or close a loop through the static subgraph
                        within a step, so the static order never
                        changes in service and a bad change leaves the
                        previous graph running. The loop refusal loses
                        no valid graph, since the checker already
                        fails a loop of feedforward edges.
description:            |
                        Sources: The option refuses a change set that
                        "would need a region to run at another point
                        in the static order, or would close a loop
                        through the static subgraph within a step"
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml,
                        brief). Every loop of data flow must be closed
                        by a feedback edge, and cctool fails a loop of
                        feedforward edges (src/cctool/check/check.lp
                        lines 3254-3286). The drafted dynamic host
                        refuses a mismatched wiring and rewires only
                        between steps
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 67 and 70-72). Strength: moderate; it
                        guards change, not faults while running, and
                        the other two options also leave the static
                        order unchanged.

