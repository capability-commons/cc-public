title:                  Defined value at a static input whose dynamic source is absent
brief:                  |
                        A static node fed from the dynamic subgraph
                        must see a defined value at every step, an
                        explicit empty token included, when its
                        dynamic source is absent, refused, being
                        swapped or has failed. A gateway node and the
                        one-step delay both give a stable place to
                        hold that value, and a gateway lets dynamic
                        nodes be removed or restarted behind it and be
                        replaced by a link model for fault injection;
                        the fixed-slot option does not say what a
                        static input sees when its region does not
                        run.
description:            |
                        Sources: An inbound gateway latches what
                        arrived since the last step and, if nothing
                        arrived, marks its output not enabled, so loss
                        and delay become explicit empty tokens; in
                        simulation a gateway is replaced by a link
                        model that drops, delays or replays tokens
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-197). The gateway option routes
                        every boundary edge through a static node that
                        gives static edges a stable anchor
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml
                        lines 11-16). The delay option gives the value
                        of the step before or an explicit empty token
                        (opt_one_step_delay_into_static.yaml, brief).
                        The fixed-slot option's brief does not state
                        what a static input holds when the region is
                        empty (opt_same_step_through_fixed_slots.yaml,
                        brief). An interface can state what its step
                        does when an input carries no value
                        (_data/schema/sch_interface_control_document.yaml
                        lines 773-777). The owner expects gateway
                        nodes may be needed so static edges find a
                        stable anchor (owner's statement, 2026-10-24).
                        Strength: strong; a rule stated once at the
                        boundary scales where per-node handling would
                        not. For reliability it holds only if the
                        gateway latches the previous value rather than
                        waiting for its dynamic side.

