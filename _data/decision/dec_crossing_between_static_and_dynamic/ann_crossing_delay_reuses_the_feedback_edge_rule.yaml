title:                  Delay into static nodes as the feedback edge rule reused
brief:                  |
                        The one-step delay adds no rule the model
                        lacks: an edge from a dynamic node into a
                        static one behaves as a feedback edge does,
                        taking the value of the step before, and the
                        empty token it falls back on is the existing
                        enable flag of a packet.
description:            |
                        Sources: A feedback edge's value comes from
                        the invocation before
                        (_data/schema/sch_dataflow_graph.yaml lines
                        33-35 and 193-203). Every loop must be closed
                        by a feedback edge, and a check holds this
                        (src/cctool/check/check.lp lines 3254-3286).
                        Every packet carries an enable flag, cleared
                        at the start of a step and set when it carries
                        data
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 14-15). The owner doubts the delay is
                        needed (owner's statement, 2026-10-24 12:49Z,
                        answer 2). Strength: strong on the count of
                        mechanisms; it says nothing on latency.

