title:                  Latched copy owned by the static side
brief:                  |
                        When a static input takes the value of the
                        step before, that value can be latched into
                        storage the static side owns, so nothing the
                        dynamic subgraph does during a step changes
                        what static nodes read in it. Security needs
                        only the copy, not the delay, and a gateway
                        could make the same copy within the step.
description:            |
                        Sources: Under the delay option a static input
                        fed from a dynamic node takes the value of the
                        step before, or an explicit empty token
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_one_step_delay_into_static.yaml
                        lines 11-18). An inbound gateway latches
                        whatever arrived since the last step into an
                        output, not enabled when nothing arrived
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-191). The owner doubts the delay is
                        necessary (owner's statement, 2026-10-24,
                        answer 2). ASSUMPTION: the delay latches by
                        copy rather than by keeping a pointer into the
                        dynamic node's buffer; the option text does
                        not say which. Strength: weak; a secondary
                        benefit that other options can also get.

