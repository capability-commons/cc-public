title:                  Refusal of a dynamic region at a new point in the static order
brief:                  |
                        The fixed-slot option refuses a change set
                        that would need a dynamic region at another
                        point in the static order, which is a
                        reconfiguration a user could want and cannot
                        have without a rebuild.
description:            |
                        Sources: The option refuses a change set that
                        "would need a region to run at another point
                        in the static order"
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml,
                        brief). ASSUMPTION: the slot positions are
                        fixed when the static schedule is generated,
                        so a region that needs a new position needs a
                        new build. Strength: moderate; the limit binds
                        more often as the static subgraph grows.

