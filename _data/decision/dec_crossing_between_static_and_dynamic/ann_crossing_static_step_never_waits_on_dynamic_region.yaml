title:                  Static step kept apart from dynamic work and faults
brief:                  |
                        With a one-step delay the static schedule
                        never waits on the dynamic subgraph, so a
                        dynamic region that runs long, hangs, faults
                        or is being changed cannot stretch or end the
                        static step, the static part's time to a safe
                        state does not depend on it, and the two parts
                        can run on different cores or even different
                        kinds of platform. A fixed call slot runs the
                        dynamic region inline in the static order, so
                        the static step inherits its worst case and
                        its faults; a pointer handover removes the
                        copy but not this wait.
description:            |
                        Sources: In the delay option "the static
                        schedule never waits on the dynamic subgraph",
                        and a static input takes the value of the step
                        before or an explicit empty token
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_one_step_delay_into_static.yaml
                        at title and brief). In the fixed-slot option
                        the static schedule holds a call slot for each
                        dynamic region and values cross in the same
                        step (opt_same_step_through_fixed_slots.yaml
                        at title and brief, in the same folder). The
                        generated process step returns as soon as one
                        node returns a signal other than continue, so
                        the nodes after it do not run in that step
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 46-50). An inbound gateway turns loss
                        and delay into explicit empty tokens (same
                        file, lines 190-191). A frozen schedule is a
                        straight-line list of direct calls (same file,
                        lines 35-40), while the dynamic host relies on
                        dlopen (same file, line 65). The register
                        measures time to reach a safe state after a
                        failure (_data/register/reg_concern.yaml at
                        entries.concern_safety.measure). The owner
                        wants placement to reach systems with no OS
                        (owner's statement, 2026-10-24) and doubts the
                        delay is needed (answer 2). ASSUMPTION:
                        handing over pointers removes the copy but not
                        the wait for the dynamic node to finish
                        writing within the step. ASSUMPTION: a value
                        of the step before must stay readable while
                        the new one is written, so each such edge
                        holds two buffers, which with a step of
                        latency is the price. Strength: strong for
                        fault isolation and hard-timed systems, and
                        stronger as the dynamic subgraph grows; weak
                        for performance where dynamic work is light.
                        It does not answer the latency point, which
                        weighs the other way.

