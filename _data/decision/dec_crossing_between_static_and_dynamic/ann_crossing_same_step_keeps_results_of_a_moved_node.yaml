title:                  Same results when a node moves between subgraphs
brief:                  |
                        With a one-step delay into static nodes,
                        moving an upstream node from static to dynamic
                        changes the tokens on every edge downstream of
                        it, so parity results and test expectations
                        change with a configuration choice. Crossing
                        in the same step through fixed slots keeps the
                        tokens an all-static schedule would give, so
                        the move stays a change of placement alone.
description:            |
                        Sources: Under the delay option a static input
                        fed from a dynamic node takes the value of the
                        step before
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_one_step_delay_into_static.yaml
                        at brief). Under the fixed-slot option values
                        cross in the same step by handing over buffer
                        pointers
                        (opt_same_step_through_fixed_slots.yaml in the
                        same folder, lines 13-14). The owner wants the
                        same node code to run statically or
                        dynamically, and asked "Is a one step delay
                        *really* necessary? ... Surely we're just
                        swapping out pointers to buffers?" (owner's
                        statement, 2026-10-24, answers 1 and 2).
                        Within a process an input slot points at the
                        upstream output buffer itself
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 41-44). Each Patrol decomposition step
                        ends with detector dump parity
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 175-176). Strength: strong, and stronger
                        with scale, since every node moved across the
                        boundary shifts the timing of everything
                        downstream of it. A gateway that passes values
                        within the step would share this benefit, but
                        the gateway option does not state its timing.

