title:                  Failed dynamic node that ends the static local step
brief:                  |
                        In the trial a dynamic node that returns a
                        failure ends the whole local step of its unit.
                        With the slot after every static node, that
                        skipped only the static feedback copies and
                        the actor gap, which already left static loops
                        reading an older value. With a slot inside the
                        static order, as the ruling requires, it would
                        also skip every static node after the slot,
                        and their senders, so other units would shift
                        as after a failed static step. The ruled
                        option should say that a failure inside a
                        dynamic region stays in the region: its
                        outputs to static inputs take the slot's
                        default or a mark of absence for that step,
                        and the static order runs on, as it already
                        does in the trial when a swapped-in version
                        fails its first step and is put back.
description:            |
                        Sources:
                        - The dynamic slot returns false when a
                          dynamic node that is not
                          on trial returns non-zero, and the generated step then returns
                          at once. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, function
                          dynamic_slot; src/cctool/dataflow/generate.py, function step)
                        - After a failed step the feedback copy is
                          skipped, so its target
                          reads the value of the last completed step. (review of
                          2026-10-29, area report trial-engine, section 3)
                        - A failed local step shifted every downstream
                          unit by one step.
                          (review of 2026-10-29, CC-004)
                        - A new version whose first invocation fails
                          is put back with its
                          old state, and the step goes on. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, function
                          dynamic_slot)
                        - The static schedule holds a fixed call slot
                          for each dynamic
                          region it exchanges values with.
                          (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml
                          at brief)
                        - An earlier argument held that a fixed slot
                          makes the static
                          step inherit the dynamic region's faults; the trial shows the
                          mechanism, and that one rule of containment answers it without
                          the delay.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ann_crossing_static_step_never_waits_on_dynamic_region.yaml
                          at brief)
                        Strength: moderate; the effect on static nodes
                        after a slot is read from the source, not run,
                        since the trial's slot sat after them.

