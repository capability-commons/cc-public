title:                  Gateway with unstated timing and a second job
brief:                  |
                        The gateway option does not say whether a
                        value crosses in the same step or the next, so
                        the tokens it gives are not yet defined, and
                        once stated it reduces to one of the other two
                        options with an extra node. It also gives a
                        node a new role, static itself with fixed
                        edges on one side and changing edges on the
                        other, while the drafted gateway does a
                        different job, turning asynchronous outside
                        traffic into tokens, so one name would cover
                        two jobs.
description:            |
                        Sources: A gateway node "gives the static
                        edges a stable anchor and accepts dynamic
                        edges on its other side"; it states no timing
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml,
                        brief). The drafted gateway node is the
                        boundary between a segment and the outside
                        world and "turns asynchronous traffic into
                        Kahn tokens, and back", and an inbound gateway
                        marks its output empty when nothing arrived
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 182-191). The owner asked whether all
                        static nodes could cope with dynamic edges "so
                        this becomes moot" (owner's statement,
                        2026-10-24). ASSUMPTION: a gateway on a
                        crossing edge adds a node, and so a call,
                        between the two ends of that edge. Strength:
                        moderate; the timing gap closes once the
                        option states its timing, and the naming point
                        weakens if the crossing between Kahn and actor
                        parts also chooses gateways and the two jobs
                        are made one.

