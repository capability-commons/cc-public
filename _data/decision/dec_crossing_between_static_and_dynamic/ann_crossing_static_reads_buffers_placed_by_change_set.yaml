title:                  Static nodes reading buffers placed at run time
brief:                  |
                        Handing over buffer pointers in the same step
                        means a static node reads memory whose address
                        and writer a change set chose, so it is safe
                        only if the runtime proves at each change that
                        every pointer names a buffer of the right type
                        and size, written by a node that has finished.
                        The fixed slots and the refusal of reordering
                        keep the order closed, which helps, but the
                        pointer check is on the change path, not the
                        build. How large this risk is rests on how
                        change sets are checked: if the runtime checks
                        them, it is small.
description:            |
                        Sources: Values cross by handing over buffer
                        pointers, the static schedule holds a fixed
                        slot for each dynamic region, and a change set
                        that would move a region or close a loop
                        through the static subgraph is refused
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml
                        at title and brief). The owner asks whether
                        crossing is "just swapping out pointers to
                        buffers" (owner's statement, 2026-10-24,
                        answer 2). A rewire in the drafted dynamic
                        host is a pointer swap in a slot array
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-71). The type id carried in a packet
                        header is a hash of the canonical dtype
                        description, and the draft does not say it is
                        keyed (same file, lines 98 and 110). Strength:
                        moderate.

