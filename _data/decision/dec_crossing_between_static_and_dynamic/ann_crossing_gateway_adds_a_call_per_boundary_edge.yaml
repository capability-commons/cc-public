title:                  Extra node call and copy at each gateway
brief:                  |
                        A gateway node on every boundary edge adds a
                        node call per edge per step and, if it latches
                        its input into its own output as the earlier
                        gateway did, a copy of the value.
description:            |
                        Sources: Every edge between the subgraphs
                        passes through a static gateway node
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml
                        lines 12-16). The earlier gateway latches what
                        arrived into an edict output
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 190-191). ASSUMPTION: a gateway between
                        two in-process subgraphs could forward a
                        pointer rather than copy, which would reduce
                        the cost to one call. Strength: weak; the cost
                        is per boundary edge and small against a 33 ms
                        step.

