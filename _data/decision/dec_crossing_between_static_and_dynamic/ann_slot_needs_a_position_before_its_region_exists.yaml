title:                  Slot position needed before its dynamic region exists
brief:                  |
                        The upheld option places each fixed slot by
                        the static edges at the boundary, but the
                        static schedule is generated at build time,
                        while a region's boundary edges may arrive
                        later by change set, and a build may carry the
                        dynamic machinery with no dynamic node yet.
                        The trial's generator, with no rule for this,
                        put one slot for the whole dynamic subgraph
                        after every static node, the only position
                        from which a dynamic node can read every
                        static output, and so delivered every dynamic
                        value to static inputs a local step late: the
                        rejected option, logged as invented. No
                        requirement carries the ruling to prevent
                        that. If the ruling stands, it needs a
                        requirement and a case saying what a region
                        is, how a slot's position is fixed when the
                        build does not yet show the region's edges,
                        and that a change set needing another position
                        is refused; the node ICD's rule that a node
                        runs after every node it reads from in the
                        same local step then orders the static nodes
                        around each slot. The delay option needs no
                        such rule.
description:            |
                        Sources:
                        - The static schedule holds a fixed call slot
                          for each dynamic
                          region, placed by the static edges at the boundary, and a change
                          set that would need a region at another point in the static
                          order is refused.
                          (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml
                          at brief)
                        - A build with no dynamic node leaves out the
                          dynamic machinery
                          unless its user has asked for it.
                          (_data/requirement/rqt_generator_omits_dynamic.yaml at
                          condition and object)
                        - The generated step calls every static node
                          and then the one
                          dynamic slot. (trial 2c777ab9, src/cctool/dataflow/generate.py,
                          function step; src/cctool/dataflow/engine/src/dynamic.cpp,
                          function dynamic_slot)
                        - The trial log lists it as invented: a
                          dynamic node may read any
                          static output and write any optional static input, and runs
                          after the unit's static nodes. (trial process log,
                          /mnt/project-files/notes/dataflow-trial/process-log.md, phase 3)
                        - Measured: the static sink read at each step
                          the dynamic node's
                          output of the step before. (review of 2026-10-29, CC-014)
                        - The ruling gives rise to no requirement.
                          (review of 2026-10-29,
                          CC-056) The change-set ICD refuses a change that would close a
                          loop through the static subgraph, but not one that would need a
                          slot elsewhere.
                          (_data/interface_control_document/icd_dataflow_change_set.yaml
                          at surface.data.artifact.failure)
                        - A node is invoked after every node it reads
                          from in the same
                          local step.
                          (_data/interface_control_document/icd_dataflow_node.yaml at
                          surface.step.dataflow_step.invocation)
                        - The review recommends implementing the
                          ruling if same-step
                          reading matters to a planned graph, and otherwise amending it
                          with the reason. (review of 2026-10-29, section 7, W-T4)
                        Strength: strong as evidence of how the ruling
                        must be specified; it says nothing against the
                        merit of crossing in the same step, only that
                        a generator left without the rule falls back
                        to the delay.

