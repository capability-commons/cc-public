title:                  One reviewable place where values enter the static subgraph
brief:                  |
                        A gateway node is a single static, reviewable
                        place where every value from the dynamic
                        subgraph enters the static one, so a system
                        can check or bound those values there. This
                        follows the rule already drafted for the
                        boundary with the outside world, that only
                        gateway nodes cross it.
description:            |
                        Sources: Every edge between the two subgraphs
                        passes through a gateway node, itself static
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml
                        lines 11-16). Functional components never
                        access pub-sub directly; only gateway nodes
                        cross the boundary, decided 2026-10-16
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 184-188 and 226). The owner thinks
                        gateway nodes likely but not certain (owner's
                        statement, 2026-10-24). Strength: strong; the
                        number of places to check grows with the
                        boundary edges, not the nodes behind them.

