title:                  Gateway node as the place a crossing transport lives
brief:                  |
                        A pointer handover is free only within one
                        address space; an edge whose ends are placed
                        in different execution units needs a copy
                        through a transport, and the fixed-slot option
                        does not say what happens then. A gateway is
                        an ordinary node that can hold that transport,
                        so porting to a platform with another
                        transport, or none, means rewriting gateway
                        nodes only, at the cost of one gateway per
                        boundary edge. This rests on how steps are
                        spread across cores: under a worker pool
                        within one process the challenge to the fixed
                        slots falls away.
description:            |
                        Sources: Within a process an input points at
                        the upstream output buffer itself;
                        cross-process edges point at a buffer the
                        framework fills
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 41-44). Within one process plain shared
                        buffers serve; between processes or machines
                        the transport is ZeroMQ or a shared-memory
                        queue, still open
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 120-128). Stableflow's gateway node is
                        an ordinary node, and functional components
                        never use asynchronous transports directly
                        (same file, lines 182-193 and 226). A frozen
                        island always runs within one OS process (same
                        file, lines 79-80). The gateway option routes
                        every boundary edge through a static gateway
                        node
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml
                        lines 11-16). The owner raised gateway nodes
                        as "likely (but not certain)" (owner's
                        statement, 2026-10-24). Strength: moderate; it
                        holds at ten times the nodes only for boundary
                        edges that cross units, and the gateway count
                        grows with the boundary. Neutral on the delay
                        option.

