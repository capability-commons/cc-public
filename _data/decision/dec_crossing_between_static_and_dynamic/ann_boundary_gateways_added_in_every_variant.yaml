title:                  Boundary gateways that each variant must add where it moves the boundary
brief:                  |
                        Placement and mutability may differ from one
                        variant to the next, so which edges cross
                        between the static and dynamic subgraphs is
                        known only on each resolved dataflow graph,
                        and the crossing rules are checked there, not
                        on the base. A gateway node on every boundary
                        edge must then be added by operations in each
                        variant that moves the boundary, unless a
                        lowering step inserts it, while the one-step
                        delay and the fixed slots are derived by the
                        generator from the resolved graph and need no
                        operation.
description:            |
                        Sources:
                        - The resolved graph is derived and checked.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The place operation makes edges cross
                          processes or hosts.
                          (_sources/cc-patrol-notes/variants.md line
                          66; _sources/cc-patrol-notes/draft/README.md
                          lines 75-78)
                        - Every boundary edge passes through a gateway
                          node.
                          (_data/decision/dec_crossing_between_static_and_dynamic/opt_gateway_nodes_at_the_boundary.yaml at brief)
                        - The fixed call slots are placed by the
                          static edges at the boundary.
                          (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml at brief)
                        - The crossing rules are checked per resolved
                          variant, not on the base.
                          (_sources/variants-framing.md, section 2)
                          Strength: weak; if generated transforms may
                          insert gateways, as the open question on
                          authored operations and lowering allows, the
                          cost falls away.

