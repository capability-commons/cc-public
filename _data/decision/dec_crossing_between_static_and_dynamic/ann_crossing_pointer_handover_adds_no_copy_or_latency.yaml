title:                  No copy and no step of latency at a pointer handover
brief:                  |
                        Handing over buffer pointers in the same step
                        adds no copy and no step of latency, and the
                        static schedule pays one call per dynamic
                        region, not per edge. A one-step delay adds
                        about 33 ms at Patrol's 30 Hz each time a path
                        crosses into the static part.
description:            |
                        Sources: The fixed-slot option crosses values
                        in the same step by handing over buffer
                        pointers, with one fixed call slot per dynamic
                        region in the static schedule
                        (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml
                        at brief). Within one process an edge is the
                        upstream node's output buffer itself
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 41-44). The owner: "Surely we're just
                        swapping out pointers to buffers?" (owner's
                        statement, 2026-10-24, answer 2). A one-step
                        delay gives a static input the value of the
                        step before
                        (opt_one_step_delay_into_static.yaml in the
                        same folder, lines 13-19). At Patrol's 30 Hz
                        rate one step is about 33 ms
                        (_sources/cc-patrol-notes/plan.md lines
                        180-182). Strength: strong; the cost per
                        crossing is constant, so it holds at ten times
                        the nodes.

