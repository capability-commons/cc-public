title:                  Numbered maturity levels already read across automotive engineering
brief:                  |
                        A level given as a number needs no look-up: an
                        author knows what comes after what, and
                        engineers who have worked under the numbered
                        lifecycle scales of automotive suppliers and
                        makers read a level such as maturity_60 as
                        roughly the stage that those scales number 60.
                        Named stages, as acronyms, were opaque and
                        confusing in practice, and do not carry across
                        organizations.
description:            |
                        WTP's argument (WTP, 2026-10-28). At
                        Continental, the numbered stages of its
                        Materiel Life Cycle (MLC) process were taught
                        to every engineer, down to pocket booklets,
                        and the German makers, such as BMW and VW,
                        used similar numbered scales with similar
                        meanings, which made working between them
                        easy. JLR named its stages instead, by
                        three-letter acronyms that were opaque and
                        confusing. Aligning the numbers with that
                        automotive practice lets a large body of
                        engineers read a level without a register.

