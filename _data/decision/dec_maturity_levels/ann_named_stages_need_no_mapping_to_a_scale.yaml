title:                  Named stages with no mapping to keep
brief:                  |
                        September said the stages decide the levels.
                        Three or four named stages in one register are
                        the smallest set of levels that does the job,
                        and a level defined as a named stage traces
                        directly to what it promises. A level taken
                        from an outside scale traces first to that
                        scale, then through a mapping to what the
                        tooling checks, so two links and a second
                        thing must be kept beside the levels. A spaced
                        scale adds a numbering rule, which earns its
                        place only if levels are often inserted.
description:            |
                        Sources:
                        - The stages of the lifecycle must be defined
                          first, and they decide the levels, not the
                          other way about
                          [origin/main:ddr/ddr_maturity.yaml at
                          consequence].
                        - The named stages option has three or four
                          stages, ordered in a register and named for
                          what they promise, such as draft, tested,
                          verified and released
                          [_data/decision/dec_maturity_levels/opt_a_few_named_stages.yaml
                          at brief].
                        - The external scale option takes levels from
                          a published scale of readiness or capability
                          and maps them to what the tooling can check
                          [_data/decision/dec_maturity_levels/opt_levels_from_an_external_scale.yaml
                          at brief].
                        - The technology readiness scale has nine
                          levels, from 1 to 9, canonized in ISO
                          16290:2013, with level 9 described as flight
                          proven or proven in operational environment,
                          and its definitions use hardware terms
                          [https://en.wikipedia.org/wiki/Technology_readiness_level].
                        - The spaced scale option numbers levels from
                          0 to 100 with gaps, each a register entry
                          that names the stage it stands for
                          [_data/decision/dec_maturity_levels/opt_levels_on_a_spaced_scale.yaml
                          at brief].
                        - September chose spaced numbers so that a
                          level can be inserted without a rename and
                          so that a name carries its own order without
                          a rank beside it
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision and rationale].
                        - No criticality register exists on dev, so a
                          spaced scale for maturity would not yet
                          share a convention with anything built
                          [_data/register/, which holds no criticality
                          register].
                        - The guidance asks that a type, relation,
                          field or command be added only when a real
                          instance needs it [AGENTS.md#keep-it-small].
                        - ASSUMPTION: published readiness scales
                          describe the readiness of a technology or
                          the capability of a process, not the
                          verification evidence held for one part of a
                          code base, so the mapping to checks is not
                          given by the scale. Strength for
                          traceability: Moderate. The external scale
                          gains a cited reason for each level, which
                          counts for it. It loses because the mapping
                          to checks is a second, local trace. The
                          spaced scale traces as well as named stages
                          if each entry names its stage. At ten times
                          the size the mapping is still one table, so
                          the point does not grow much. Strength for
                          simplicity: moderate. Named stages need an
                          order written in the register, which a
                          spaced number would carry in the name, so
                          the spaced scale is close behind. The
                          external scale adds a whole mapping. At ten
                          times the size the code grows but the number
                          of stages does not, so the point holds.

