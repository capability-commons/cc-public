title:                  A stage name judged in the diff itself
brief:                  |
                        A change that moves code from draft to tested
                        says in the diff what it claims, and a
                        reviewer can judge it without opening a
                        register. A change from one number to another
                        needs the register entry read beside it. A few
                        stages also leave fewer distinctions for one
                        reviewer to hold.
description:            |
                        Sources:
                        - The named stages option has three or four
                          stages, ordered in a register and named for
                          what they promise, such as draft, tested,
                          verified and released
                          [_data/decision/dec_maturity_levels/opt_a_few_named_stages.yaml
                          at brief].
                        - The spaced scale option numbers levels from
                          0 to 100 with gaps, each a register entry
                          that names the stage it stands for
                          [_data/decision/dec_maturity_levels/opt_levels_on_a_spaced_scale.yaml
                          at brief].
                        - September chose spaced numbers so that a
                          level can be inserted without a rename and
                          so that a name carries its own order without
                          a rank beside it
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision and rationale].
                        - All software is written by agents and
                          reviewed by one maintainer [owner's
                          statement, 2026-10-28]. Strength: Moderate.
                          The cost is small per change but paid on
                          every change of maturity. September's
                          reasons for numbers are real but serve other
                          concerns. A name that carries no order can
                          be paired with an order in the register. At
                          ten times the size the number of maturity
                          changes grows, so the point grows with it.

