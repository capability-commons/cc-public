title:                  Levels that each name a gate that already runs
brief:                  |
                        A maturity claim is only as trustworthy as the
                        check behind it. A few stages named for what
                        they promise can each be tied to a gate that
                        already runs and whose cost is known: the
                        commit gate, the pre-push gate, the overnight
                        run and the release gate. A level with no gate
                        of its own adds either a new run or no
                        evidence. A nine-level published readiness
                        scale has more levels than there are gates,
                        and describes states such as proven in an
                        operational environment, which no check here
                        can establish.
description:            |
                        Sources:
                        - The pre-push gate runs every test not marked
                          slow, and the commit gate leaves out slow,
                          prepush and fuzz tests
                          [src/cctool/gate/gate.py at MARK_PUSH and
                          MARK_COMMIT].
                        - A code commit takes about 78 s in the gate
                          on the development VM and a data-only commit
                          about 10 s
                          [_data/decision/dec_tooling_language/ann_gate_takes_a_minute.yaml
                          at brief].
                        - The overnight run holds the slow run, the
                          fuzz run and the full check [pyproject.toml
                          at tool.pixi.tasks.slow,
                          tool.pixi.tasks.fuzz and
                          tool.pixi.tasks.check-full].
                        - The release gate runs every check and test
                          with no cached verdicts on each Python, and
                          builds and installs the package
                          [_data/decision/dec_release_gate/ruling_release_gate.yaml
                          at brief].
                        - The ruling on where test evidence is
                          measured makes the overnight run the only
                          place coverage, profiles and budgets are
                          measured
                          [_data/decision/dec_where_test_evidence_is_measured/ruling_where_test_evidence_is_measured.yaml
                          at brief].
                        - The named stages option has three or four
                          stages, ordered in a register and named for
                          what they promise, such as draft, tested,
                          verified and released
                          [_data/decision/dec_maturity_levels/opt_a_few_named_stages.yaml
                          at brief].
                        - The technology readiness scale has nine
                          levels, from 1 to 9, canonized in ISO
                          16290:2013, with level 9 described as flight
                          proven or proven in operational environment,
                          and its definitions use hardware terms
                          [https://en.wikipedia.org/wiki/Technology_readiness_level].
                        - The external scale option takes levels from
                          a published scale of readiness or capability
                          and maps them to what the tooling can check
                          [_data/decision/dec_maturity_levels/opt_levels_from_an_external_scale.yaml
                          at brief].
                        - The stages of the lifecycle must be defined
                          first, and they decide the levels, not the
                          other way about
                          [origin/main:ddr/ddr_maturity.yaml at
                          consequence].
                        - ASSUMPTION: several readiness levels would
                          map to the same check here, so a level
                          claimed would say more than any check
                          showed.
                        - ASSUMPTION: a maturity level is shown by
                          evidence from some run, so each level needs
                          a run that tells it from the level below.
                          Strength for reliability: moderate. It
                          favors levels derived from the gates over
                          levels imported from outside. The spaced
                          scale is neutral on this point, since each
                          of its entries can also name a gate. It
                          holds at ten times the size, since the gates
                          stay few as the code grows. Strength for
                          performance efficiency: weak to moderate.
                          The spaced numbering itself costs nothing,
                          so the point is about how many levels are
                          used, not how they are numbered. It holds at
                          ten times the size, since each extra run
                          then costs more.

