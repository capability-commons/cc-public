title:                  Levels of maturity
brief:                  |
                        What levels can a maturity take, and what
                        stages of the lifecycle do they stand for?
description:            |
                        September left the stages undefined and said
                        they must be defined first, and that they
                        decide the levels
                        (origin/main:ddr/ddr_maturity.yaml at
                        consequence). It numbered criticality from 0
                        to 100 with gaps between levels, so that a
                        level can be put between two others without a
                        rename, and planned the same for maturity
                        (origin/main:ddr/ddr_criticality.yaml at
                        decision).

