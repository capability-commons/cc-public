title:                  Maturity levels on a spaced scale
brief:                  |
                        Maturity levels are numbers from 0 to 100 with
                        gaps between them, read as the numbered
                        lifecycle stages of automotive practice are,
                        for the reasons in
                        ann_numbered_levels_are_read_across_the_industry.
                        A few named stages, and levels from an
                        external scale, are rejected. Ruled by WTP on
                        2026-10-28.

