title:                  Guidance kept in the schema
brief:                  |
                        Guidance drawn from the schema descriptions
                        lives in one place, so a change to a field and
                        to how it is asked about is one edit. A guide
                        item from the start repeats the field names in
                        a second item that must change with the
                        schema.
description:            |
                        Most schema properties already carry a
                        description, such as brief and description
                        (_data/schema/sch_trait_descriptive.yaml at
                        properties.brief and properties.description).
                        144 of the 195 properties declared under
                        _data/schema have one (count, 2026-10-22). The
                        interview guide option gives each bot an item
                        that names its type and holds prompts and the
                        fields to ask about
                        (opt_interview_guide_item.yaml, brief). The
                        schema-first option adds a guide item only
                        when an instance needs one
                        (opt_schema_descriptions_first.yaml, brief).
                        The owner says an auxiliary guidance item may
                        be needed, as an open possibility (owner's
                        statement). ASSUMPTION: no check compares the
                        field names a guide item lists with the
                        properties of its schema, so a renamed field
                        leaves the guide stale until someone writes
                        such a check. Holds at ten times the size:
                        yes, because each new type adds one schema
                        under schema-first, but a schema and a guide
                        under the guide option.

