title:                  Guidance in the graph checked before use
brief:                  |
                        Guidance kept in schema descriptions or as an
                        item in the graph is checked by cctool like
                        every other item, so a broken guide, or a
                        field it names that does not exist, is found
                        before a conversation uses it. Guidance in a
                        private deployment configuration drifts from
                        the schema unseen and is first exercised in a
                        live conversation.
description:            |
                        25 of the 45 schema files under _data/schema
                        hold at most one description field (grep
                        count, 2026-10-22). sch_decision carries
                        guidance only in its top-level description
                        (_data/schema/sch_decision.yaml at
                        description). Not all needed information is
                        always in the schema, and an auxiliary guide
                        item is an open possibility (owner's
                        statement). Every file of cc-public is a data
                        item, and the whole graph is checked
                        mechanically before it is committed
                        (README.md#capability-commons). The editing
                        commands refuse any edit that adds a check
                        failure (src/cctool/edit/edit.py, function
                        apply, lines 1075-1098, and
                        src/cctool/cli/editing.py within _run). The
                        checks report references that name no item, as
                        dangling_reference (src/cctool/check/check.lp
                        within dangling_reference). The
                        deployment-configuration option keeps guidance
                        beyond the schema in the private configuration
                        of each deployment
                        (opt_guidance_in_deployment_config, brief).
                        The guide-item and schema-descriptions options
                        keep guidance in a guide item or in schema
                        descriptions (opt_interview_guide_item, brief,
                        and opt_schema_descriptions_first, brief).
                        ASSUMPTION: a guide item would name its type
                        and fields by references that the checks can
                        resolve. Holds at ten times the size: yes,
                        because more types and more bots give more
                        guidance to keep in step with schemas that
                        change, and each extra deployment adds one
                        more unchecked configuration under the private
                        option.

