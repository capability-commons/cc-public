title:                  A reviewable list of the data a bot asks for
brief:                  |
                        An interview guide item names the fields a bot
                        asks about, so the personal data each bot
                        collects, and why, is written down once as an
                        item that can be reviewed and kept to the
                        needed subset of the schema. Guidance in a
                        private deployment configuration hides that
                        list, and schema descriptions alone leave the
                        bot free to ask about every property the
                        schema allows.
description:            |
                        The guide option gives each bot an item that
                        names its type and holds prompts and the
                        fields to ask about (opt_interview_guide_item,
                        brief). The schema-first option uses the
                        schema descriptions and adds a guide item only
                        when an instance needs one
                        (opt_schema_descriptions_first, brief). The
                        deployment option keeps guidance beyond the
                        schema in the private configuration of each
                        deployment (opt_guidance_in_deployment_config,
                        brief). A schema can declare more properties
                        than it requires, as the descriptive trait
                        requires only title and brief of its five
                        properties
                        (_data/schema/sch_trait_descriptive.yaml,
                        lines 21-23 and 29-31). Almost every file of
                        cc-public is a data item, and the graph is
                        checked before it is committed (README.md,
                        lines 3-8). A likely first instance holds
                        member skill profiles, which are personal data
                        (owner's statement). The LLM is free to choose
                        what to talk about next while it tracks what
                        it still needs (owner's statement).
                        ASSUMPTION: a guide item names fields and
                        prompts but holds no personal data itself, so
                        it can be read by those who review the bot and
                        shown to a contributor before the
                        conversation. ASSUMPTION: a bot told which
                        fields to ask about asks about those and not
                        about other properties its schema allows.
                        Holds at ten times the size: yes, because more
                        bots and types mean more lists of collected
                        fields to review, and one item per bot keeps
                        each list in one known place, while private
                        configurations multiply copies no reviewer
                        sees.

