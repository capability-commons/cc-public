title:                  Questions phrased for the contributor
brief:                  |
                        Schema descriptions tell an author how to
                        write a field, not how to ask a volunteer for
                        it. An interview guide item gives a place for
                        questions in the contributor's terms that can
                        be reviewed like any other item.
description:            |
                        The description of the title field reads
                        "Human-facing name. A noun phrase, not a
                        sentence."
                        (_data/schema/sch_trait_descriptive.yaml at
                        properties.title.description). The schema of a
                        decision carries one description, at its top
                        level (_data/schema/sch_decision.yaml at
                        description). Not all information is always in
                        the schema, and an auxiliary item to guide
                        elicitation may be needed (owner's statement).
                        The guide option names its type and holds
                        prompts and the fields to ask about
                        (_data/decision/dec_chat_elicitation_guidance/opt_interview_guide_item.yaml,
                        brief). Guidance in the deployment
                        configuration is kept private to each
                        deployment
                        (_data/decision/dec_chat_elicitation_guidance/opt_guidance_in_deployment_config.yaml,
                        brief). Holds at ten times the size: yes,
                        because each new type and audience needs its
                        own wording of the questions.

