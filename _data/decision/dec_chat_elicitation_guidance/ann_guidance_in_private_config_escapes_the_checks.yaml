title:                  Private configuration outside the checked graph
brief:                  |
                        Guidance in the private configuration of each
                        deployment sits outside the graph, so cctool
                        check cannot tell when it no longer matches
                        the schema it guides.
description:            |
                        The option keeps guidance beyond the schema in
                        the private configuration of each deployment
                        (opt_guidance_in_deployment_config.yaml,
                        brief). Personal data lives only in private
                        repositories (owner's statement). ASSUMPTION:
                        a deployment configuration is a file that
                        cctool does not read, unless it is made a data
                        item of a private repository. Holds at ten
                        times the size: yes, because each deployment
                        adds an unchecked copy of guidance, and a
                        schema change must be carried to each by hand.

