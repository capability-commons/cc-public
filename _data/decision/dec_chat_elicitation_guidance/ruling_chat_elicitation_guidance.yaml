title:                  An interview guide item for each bot
brief:                  |
                        Each bot has an interview guide item from the
                        start, which holds prompts and the fields to
                        ask about. The edge from the guide to its
                        schema is the subject of
                        dec_chat_guide_to_schema_edge. Ruled by WTP on
                        2026-10-22.

