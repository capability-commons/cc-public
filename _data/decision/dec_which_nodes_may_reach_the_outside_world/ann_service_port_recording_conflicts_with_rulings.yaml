title:                  Engine-side recording at every service port against the rulings
brief:                  |
                        Declared service ports on any node have the
                        engine record what crosses each port and feed
                        it back on replay. That conflicts with two
                        rulings and needs a recorded exception under a
                        third: the engine records nothing itself and
                        recording nodes write the log, the control
                        blocks are the only nodes privileged to read
                        time and runtime services, and a behavior
                        moves into the engine only with a measured
                        budget. Privileged roles keep all three, since
                        the control block, the recorder and player,
                        the transport and the sink each match a role
                        that the rulings, or the requirements they
                        give rise to, already name, and the one new
                        role, the source, is one the records already
                        presume. Its cost is two requirements reworded
                        and a role field in the interface schema.
description:            |
                        Sources:
                        - Any node type may use a runtime service
                          declared as a port, and
                          the engine records what crosses each such port.
                          (_data/decision/dec_which_nodes_may_reach_the_outside_world/opt_any_node_through_a_declared_service_port.yaml
                          at brief)
                        - The engine records nothing itself; it
                          reports events to the
                          control block, and recording nodes write the log.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml
                          at brief; _data/requirement/rqt_executor_reports_faults.yaml at
                          brief)
                        - The replay ruling gives rise to a
                          requirement on the player,
                          which stands in for the outside world on replay.
                          (_data/requirement/rqt_player_replays_exactly.yaml at brief)
                        - The control blocks are the only nodes
                          privileged to read time,
                          modes, application states and runtime service readings, and
                          services that act go through a sink node, an actor or a control
                          block that takes commands.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ruling_services_in_a_control_message.yaml
                          at brief)
                        - A behavior moves into the engine only when a
                          recorded decision
                          shows that no inserted node can do it within a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief)
                        - A transform inserts sender and receiver
                          nodes, and the records
                          speak of a node that is not a source and of a camera source.
                          (_data/decision/dec_how_values_cross_execution_units/ruling_transport_nodes_inserted_by_a_transform.yaml
                          at brief;
                          _data/decision/dec_how_the_capacity_of_a_port_is_set/opt_capacity_derived_from_maximum_producer_rates.yaml
                          at brief; _data/test_case/case_recorder_records_outside.yaml at
                          preconditions)
                        - The trial, left to itself, invented a source
                          role beside the
                          control role; the review's fix names the privileged roles,
                          rewords the two requirements and adds the role to the ICD
                          schema (review of 2026-10-29, CC-050).
                        - Lowering already inserts recording taps.
                          (_data/logical_component/lco_dataflow_model_lowering.yaml at
                          description)
                        ASSUMPTION: an inserted tap on each service
                        port could do the recording in place of the
                        engine, which would remove the conflict with
                        the replay ruling but not the one with the
                        services ruling. Strength: strong while those
                        rulings stand.

