title:                  One local step of lag on each action a control block carries out
brief:                  |
                        A control block runs first in its local step,
                        so a command that another node computes in
                        that step can reach it only as the previous
                        step's value, as the reproduced loop between
                        the control block and the mode controller
                        showed. If only control blocks act on the
                        outside, every actuation, a stop command
                        included, waits one more period, 33 ms if
                        Patrol steps at its camera's 30 Hz. A sink
                        node scheduled after its producer acts in the
                        same local step. The lag adds directly to the
                        time to reach a safe state, one of the two
                        measures of safety.
description:            |
                        Sources:
                        - The control message is written before any
                          other node of the
                          unit is invoked.
                          (_data/requirement/rqt_control_block_writes_first.yaml at
                          qualifier)
                        - A control block cannot run first and also
                          read its own inputs
                          in that step: wired as the ICDs describe, it forms a loop that
                          the checks refuse, reproduced; the recommended fix reads those
                          inputs as the previous step's value (review of 2026-10-29,
                          CC-053 and W-T3).
                        - Services that act are reached through a sink
                          node, an actor or
                          a control block that takes commands.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ruling_services_in_a_control_message.yaml
                          at brief)
                        - Within a unit, a consumer that runs after
                          its producer reads
                          the message of the same local step.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_reading_derived_by_placement.yaml
                          at brief)
                        - Safety is measured by the time to reach a
                          safe state after a
                          failure, in ms.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.measure)
                        - Patrol's camera runs at 30 Hz (WTP,
                          2026-10-28). ASSUMPTION: the control block
                          carries out commands in its own invocation
                          at the start of the step. A second block run
                          last in the step would remove the lag, but
                          the option describes none. ASSUMPTION: the
                          local step of the unit that acts runs at the
                          camera's rate. Strength: strong for
                          actuators on a safety path; weak for slow
                          actions such as writing a file.

