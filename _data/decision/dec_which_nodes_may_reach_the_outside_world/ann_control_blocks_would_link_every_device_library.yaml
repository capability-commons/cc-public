title:                  Every device and transport library linked into the control blocks
brief:                  |
                        If only control blocks reach the outside, the
                        control block of a unit must drive the camera,
                        write the recorder's store and run the sockets
                        and queues of every crossing edge, so it links
                        every device and transport library the graph
                        uses. That breaks the requirement that
                        confines transport libraries to the sender and
                        the receiver, whose rationale is that a target
                        without a transport need not build it, and the
                        upheld option that makes transport libraries
                        dependencies of those node kinds only.
                        Privileged roles leave each library with the
                        one node kind that uses it, which a variant
                        can leave out or swap per target, and declared
                        service ports can do the same if the node kind
                        that declares a port is the one that links the
                        library behind it.
description:            |
                        Sources:
                        - Only the control blocks and the engine core
                          reach the outside;
                          sensors, recorders, transports and acting sinks give what they
                          produce to the control block, which carries out the action.
                          (_data/decision/dec_which_nodes_may_reach_the_outside_world/opt_only_control_blocks_reach_the_outside.yaml
                          at brief)
                        - Every use of a transport library is confined
                          to the sender and
                          the receiver, so that a target without a transport need not
                          build it.
                          (_data/requirement/rqt_transport_confines_library.yaml at
                          object and rationale)
                        - Transport libraries are dependencies of the
                          sender and receiver
                          node kinds only.
                          (_data/decision/dec_how_values_cross_execution_units/opt_transport_nodes_inserted_by_a_transform.yaml
                          at brief)
                        - Transport nodes are the only nodes that
                          depend on a transport
                          library.
                          (_data/logical_component/lco_dataflow_nodes_transport.yaml at
                          description)
                        - The platform layer hides threads, core
                          pinning, clocks, shared
                          memory and readings such as processor temperature; it names no
                          camera, store or network.
                          (_data/logical_component/lco_dataflow_engine_platform.yaml at
                          brief)
                        - A shared object such as a file is best
                          managed by one process
                          responsible for all accesses to it, reached through channels
                          (Kahn and MacQueen 1977, Coroutines and networks of parallel
                          processes, section 2.2, as noted in round 2).
                        - Dependency risk counts direct and indirect
                          dependencies, and
                          flexibility measures the effort to install on a new platform.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.measure and
                          entries.concern_flexibility.measure)
                        ASSUMPTION: Patrol's camera on the Orin is
                        reached through a vendor library that a laptop
                        or a Raspberry Pi target lacks. ASSUMPTION:
                        under declared service ports the service is
                        linked into the node kind that declares the
                        port, not into the engine; the option does not
                        say which. Strength: strong; the option
                        conflicts with a requirement and an upheld
                        option as they stand, and it would weaken only
                        if the control block were split into one block
                        per device, which is a privileged role by
                        another name.

