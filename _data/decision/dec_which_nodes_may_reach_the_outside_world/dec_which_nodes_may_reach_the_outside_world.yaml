title:                  Which nodes may reach the outside world
brief:                  |
                        Which dataflow nodes may read from or act on
                        the world outside the engine, such as a
                        sensor, a file, a socket or the clock, and
                        what must each report so that a run can be
                        replayed?
description:            |
                        rqt_node_reads_outside_only_through_control
                        and rqt_platform_confines_services confine
                        every outside access to the control blocks and
                        the engine core. Yet the records give the
                        recording and transport nodes a dependency on
                        the engine platform
                        (lco_dataflow_nodes_recording,
                        lco_dataflow_nodes_transport), require a
                        recorder to write storage and a sender to use
                        sockets, and speak of source nodes and a
                        camera source. Condition 3 of
                        ruling_services_in_a_control_message lets
                        services that act go through a sink node, an
                        actor or a control block that takes commands,
                        and opt_services_in_a_control_message says
                        that the decision stays open for discussion.
                        The trial implementation of 2026-10-29
                        invented a source role (review of 2026-10-29,
                        CC-050).

