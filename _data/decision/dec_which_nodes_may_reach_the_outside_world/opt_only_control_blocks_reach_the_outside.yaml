title:                  Only control blocks reach the outside
brief:                  |
                        Only the control blocks and the engine core
                        reach the outside. Sensors, recorders,
                        transports and acting sinks get what they need
                        through the control message and give what they
                        produce to the control block, which carries
                        out the action.

