title:                  Privileged roles declared by the node type
brief:                  |
                        A node type may declare one privileged role:
                        control block, source, sink, recorder or
                        player, or transport. Each role may reach the
                        outside in a stated way and must report what
                        replay needs, such as a source's readings.
                        Every other node is ordinary, and a check
                        fails one that reaches the outside.

