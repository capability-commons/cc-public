title:                  Outside reach confined to blocks shipped with the engine
brief:                  |
                        If only control blocks reach the outside, the
                        code that can touch clocks, devices, files and
                        sockets is a short list of standard nodes
                        shipped and reviewed with the engine, and no
                        author's node kind can join it. A privileged
                        role opens that reach to any node kind that
                        declares the role, and a declared service port
                        opens it to every node kind. The trial shows
                        how wide a role can be in practice: each node
                        of a privileged role was handed the whole
                        engine and its unit, and the guard on the
                        platform header was passed by including
                        another header. Since C++ in one address space
                        cannot be fenced, the reach is bounded by the
                        code a review must read.
description:            |
                        Sources:
                        - The standard nodes ship with the dataflow
                          engine, and the
                          control blocks are among them.
                          (_data/logical_component/lco_dataflow_nodes.yaml at brief and
                          description)
                        - The generated schedule passes every node
                          whose role is not
                          ordinary a handle that holds the Engine and its unit runtime,
                          and the example source node reads the replay store through it
                          (trial 2c777ab9, src/cctool/dataflow/generate.py, method
                          invocation of class Unit;
                          src/cctool/dataflow/engine/include/df/runtime.hpp, struct
                          df_privileged;
                          src/cctool/dataflow/_test/_example/node_src/sensor.cpp,
                          function sensor_step).
                        - Including runtime.hpp defines the privilege
                          macro and passes
                          the guard of platform.h (review of 2026-10-29, CC-048; area
                          report trial-gen, TRIAL-GEN-12).
                        - In C++, processes in one address space can
                          modify each other's
                          state, and there is no way of preventing it (Vrba et al. 2009,
                          The Nornir run-time system, section on message transport, as
                          noted in round 2).
                        - Security asks who can read or change what,
                          and how that is
                          enforced.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question)
                        Strength: moderate; it weakens if privileged
                        kinds get a build target of their own that
                        alone sees the platform headers, as the review
                        proposes, and if each role is handed something
                        narrower than the whole engine, and it says
                        nothing of what the confinement costs
                        elsewhere.

