title:                  One role per node type, with actors left off the list
brief:                  |
                        The privileged roles option lets a node type
                        declare one role from a fixed list of five,
                        yet the ruling on services lets a service that
                        acts be reached through an actor, and an actor
                        is not on the list. A device that is both read
                        and commanded, such as a camera whose exposure
                        a node sets, needs two roles or two node
                        types. Declared service ports have no list to
                        outgrow: each node type declares what it
                        reaches. Lingua Franca shows that shape,
                        treating the time of an outside event as an
                        input and failing in the target compiler on a
                        port used but not declared.
description:            |
                        Sources:
                        - A node type may declare one privileged role:
                          control block,
                          source, sink, recorder or player, or transport.
                          (_data/decision/dec_which_nodes_may_reach_the_outside_world/opt_privileged_roles_declared_by_the_node_type.yaml
                          at brief)
                        - Services that act are reached through a sink
                          node, an actor or
                          a control block that takes commands.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ruling_services_in_a_control_message.yaml
                          at brief)
                        - The trial's role field also says what a node
                          is, with actor and
                          adapter among its values beside source, recorder and transport
                          (trial 2c777ab9, src/cctool/dataflow/lower.py, the role
                          constants; src/cctool/dataflow/standard/node_kind/fold.yaml and
                          recorder.yaml, at role).
                        - In Lingua Franca the timestamp of a physical
                          action counts as an
                          external input to the program, and a port used in reaction code
                          but not declared is an error in the target compiler (Lohstroh
                          et al. 2021, Toward a Lingua Franca for deterministic concurrent
                          systems, sections 3.8 and 6, as noted in part 2).
                        - Functional suitability asks whether every
                          function that is
                          needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question)
                        ASSUMPTION: Patrol will have at least one
                        device that is both read and commanded, such
                        as a camera with a set exposure or a motor
                        driver that reports its encoder. Strength:
                        moderate; putting actor on the list, and
                        letting one role cover both reading and
                        commanding one device, would answer most of
                        it.

