title:                  Where engine behavior lives
brief:                  |
                        Should recording, logging, telemetry,
                        buffering and the like be done by the dataflow
                        engine itself, or by nodes that a model
                        transform puts into the graph?
description:            |
                        Source: the owner's statement of
                        2026-10-24T22:43Z, on Stableflow: "we would do
                        as much as humanly possible at the application
                        level, leaving the runtime/engine as simple as
                        possible. (Specifically - this was a decision
                        NOT to do data recording in the
                        runtime/engine, but instead do a model
                        transform to inject data recording nodes in
                        the edges which needed them - but a lot of
                        other decisions followed from that." He asked
                        for it to be captured as a design decision or
                        principle, since "It was kinda key for the
                        philosophy that Stableflow was intended to
                        represent". Most Stableflow messages were
                        lists, which decoupled the step rate from the
                        message rate at the application level.

