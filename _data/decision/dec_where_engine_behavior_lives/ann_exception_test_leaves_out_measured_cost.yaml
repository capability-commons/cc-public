title:                  An exception test that leaves out measured cost
brief:                  |
                        The option of recorded exceptions admits a
                        behavior to the engine only when no inserted
                        node can do it, so a behavior a node can do,
                        but too slowly, has no recorded way in, and
                        under the option of model transforms none at
                        all. The end-to-end argument allows a
                        lower-level version of a function as a
                        performance enhancement, and the owner wants
                        builds and test runs timed and says
                        performance matters a lot.
description:            |
                        Sources:
                        - The exceptions option's test: "only when a
                          recorded decision shows that no inserted
                          node can do it".
                          (_data/decision/dec_where_engine_behavior_lives/opt_minimal_engine_with_recorded_exceptions.yaml
                          lines 12-18)
                        - "Sometimes an incomplete version of the
                          function provided by the communication
                          system may be useful as a performance
                          enhancement." (Saltzer, Reed, Clark 1984,
                          https://web.mit.edu/saltzer/www/publications/endtoend/endtoend.txt)
                        - Performance "DOES still matter a lot, as we
                          will need to be able to respond quickly to
                          things". (owner's statement,
                          2026-10-22T16:31)
                        - "Every build and test-run should be timed
                          and the timings recorded for later
                          analysis."
                          (_data/decision/dec_when_the_gate_builds_cpp/ruling_cpp_built_when_staged.yaml
                          lines 22-25)
                        - The principle is "a principle, not an
                          absolute". (owner's statement,
                          2026-10-24T22:46Z) Strength: moderate. It
                          does not depend on node count; it grows with
                          input rates.

