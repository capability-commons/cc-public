title:                  No cost on edges with nothing inserted
brief:                  |
                        Under a transform, an edge that is not
                        recorded or logged has nothing on it, and in a
                        static build an inserted node is one more
                        direct call that the optimizer can inline. A
                        service that configuration switches on for any
                        node or edge needs a test at every step in
                        every build, unless the switch is fixed at
                        build time, and then it does what a transform
                        does.
description:            |
                        Sources:
                        - The services are switched on "for any node
                          or edge" by configuration.
                          (_data/decision/dec_where_engine_behavior_lives/opt_engine_provides_common_services.yaml at brief)
                        - The frozen schedule is a straight-line list
                          of direct calls, and with LTO "small
                          components inline into the schedule".
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 35-40, 54-57)
                        - Within one process an edge is the upstream
                          output buffer itself, "so an edge costs
                          nothing".
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 41-42)
                        - ASSUMPTION: a per-edge test costs
                          nanoseconds, against a 33 ms step at 30 Hz.
                          (_sources/cc-patrol-notes/plan.md lines
                          181-182) Strength: weak. The cost grows
                          linearly with edges but stays small against
                          the step.

