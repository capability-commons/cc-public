title:                  Recorder placed where the load can be carried
brief:                  |
                        A recorder that is a node can be placed like
                        any node, beside its source to avoid a copy,
                        or in another execution unit or on another
                        host when the source unit is full. An engine
                        service runs wherever the recorded unit runs;
                        ROS 2 went the node way, first with the
                        recorder as its own process and now also as a
                        composable node in the producer's process.
description:            |
                        Sources:
                        - The configuration places each node in an
                          execution unit and each unit on a host.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml,
                          brief)
                        - rosbag2 can be run as an executable from a
                          launch script.
                          (https://github.com/ros2/rosbag2/blob/master/README.md)
                          "A composable recorder node is now part of
                          the standard rosbag2 framework."
                          (https://github.com/berndpfrommer/rosbag2_composable_recorder)
                        - The flexibility question: "Can it be scaled
                          up or down as the load changes?"
                          (_data/register/reg_concern.yaml at entries.concern_flexibility.question)
                          Strength: moderate. It strengthens with ten
                          times the nodes, since more units compete
                          for the same storage.

