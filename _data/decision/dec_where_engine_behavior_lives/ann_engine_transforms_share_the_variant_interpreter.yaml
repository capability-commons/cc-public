title:                  Model transform carried out by the interpreter of variant operations
brief:                  |
                        Under the variant ruling the tooling must hold
                        an interpreter of variant operations that adds
                        nodes and joins edges to make a resolved
                        dataflow graph, which the Patrol proposal puts
                        in cctool, and a model transform that puts
                        recorders, loggers or buffers into the graph
                        is a rewrite of the same kind. So either
                        minimal option adds operations to a tool that
                        must exist anyway, not a second mechanism. It
                        needs one operation that the Patrol list
                        lacks, inserting a node on an edge, and that
                        in turn needs a way to name an edge.
description:            |
                        Sources:
                        - A variant holds a base and an ordered list
                          of operations, and the resolved graph is
                          derived and checked.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The fluent API of Design Factory is to be
                          ported as the Python interpreter of those
                          operations.
                          (_sources/cc-patrol-notes/variants.md lines
                          36-40)
                        - The transforms option has nodes put into the
                          resolved graph by a model transform.
                          (_data/decision/dec_where_engine_behavior_lives/opt_minimal_engine_with_transforms.yaml at brief)
                        - The planned operations are filter, add,
                          join, write, host, process, place and
                          remove, and no one of them inserts a node on
                          an existing edge; a remove, an add and two
                          joins would do it, but remove names an edge
                          by an id that edges do not have.
                          (_sources/cc-patrol-notes/variants.md lines
                          57-67)
                        - A dataflow edge has only a source, a target
                          and a direction.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.dataflow_edge)
                        - The model transform is the same machinery as
                          variant operations, so the minimal engine
                          gets cheaper. (_sources/variants-framing.md,
                          section 2) Strength: moderate; it lowers the
                          cost of the transform under both minimal
                          options, but the insert operation and a way
                          to name an edge are still to be added.

