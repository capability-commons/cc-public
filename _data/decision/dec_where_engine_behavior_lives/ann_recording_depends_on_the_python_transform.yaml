title:                  Recording that depends on the transform in the Python tooling
brief:                  |
                        Under either minimal option, nothing the
                        engine runs records, buffers or applies a
                        delivery policy unless the transform in cctool
                        has first been applied, on a development
                        platform. So the useful behavior of a graph
                        depends on cctool and its dependencies, and
                        recording in a fielded system is turned on by
                        a change set or a rebuild, where a service
                        needs only a switch and no tool on the target.
description:            |
                        Sources:
                        - The transforms option puts the nodes into
                          "the resolved graph" by a model transform.
                          (_data/decision/dec_where_engine_behavior_lives/opt_minimal_engine_with_transforms.yaml at brief)
                        - cctool already resolves variants, and "the
                          C++ engine loads only resolved
                          configurations".
                          (_sources/cc-patrol-notes/variants.md lines
                          92-95)
                        - cctool runs its checks with clingo, a
                          declared dependency.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_rules_kept_in_one_copy.yaml at description)
                        - The tooling stays in Python on Linux and
                          macOS development platforms. (as cited in
                          _data/decision/dec_change_set_at_a_step/ann_change_set_made_where_cctool_is_absent.yaml at description)
                        - The static build carries dynamic machinery
                          only on request, and the ruling names
                          recording nodes as a reason to ask.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml at brief)
                        - In the frozen schedule each node is guarded
                          by an enable flag, "the one thing that can
                          change at runtime".
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 39-40) So the transform can insert
                          recorders disabled and leave them to that
                          flag, at the cost of a node per recorded
                          point in every build.
                        - ASSUMPTION: the transform lives in cctool or
                          in the generator, both in Python. Strength:
                          weak now, moderate later. cctool is the
                          owner's own code with development-side
                          dependencies, and variants already depend on
                          it the same way; the field cost grows with
                          the number of fielded units, not with nodes.

