title:                  A recorded decision for each behavior the engine holds
brief:                  |
                        Under the option of recorded exceptions, each
                        behavior admitted to the engine has its own
                        decision, where the library it brings in and
                        what a safety case needs from it are weighed.
                        The services option brings its services in
                        together, with no rule for what belongs in the
                        engine and nothing that keeps the jobs a
                        safety case needs apart from those it does
                        not. The record helps only while the test for
                        an exception stays narrow, since a rule that
                        keeps needing exceptions is to be restated.
description:            |
                        Sources:
                        - A behavior "moves into the engine only when
                          a recorded decision shows that no inserted
                          node can do it".
                          (_data/decision/dec_where_engine_behavior_lives/opt_minimal_engine_with_recorded_exceptions.yaml
                          lines 12-18)
                        - Dependency risk drives the dataflow engine.
                          (_data/logical_component/lco_dataflow_engine.yaml
                          lines 51-55)
                        - The services option provides recording,
                          logging, telemetry and buffering as built-in
                          services.
                          (_data/decision/dec_where_engine_behavior_lives/opt_engine_provides_common_services.yaml
                          lines 12-16)
                        - The safety concern is measured by the time
                          to reach a safe state after a failure.
                          (_data/register/reg_concern.yaml line 442)
                        - Prior art: Liedtke's minimality principle
                          tolerates a concept inside the kernel only
                          if moving it outside would prevent the
                          system's required functionality, a stated
                          test for each exception. (Liedtke, On
                          micro-kernel construction, SOSP 1995,
                          https://cgi.cse.unsw.edu.au/~cs9242/22/papers/Liedtke_95.pdf)
                        - "A rule that keeps needing exceptions is
                          changed so that it no longer needs them."
                          (_data/register/reg_design_rule.yaml lines
                          89-91)
                        - The owner calls it "a principle, not an
                          absolute", and says he does not yet fully
                          understand its consequences. (owner's
                          statement, 2026-10-24) Strength:
                          moderate. The exceptions the drafts already
                          imply number about three to six by the
                          advocates' estimates, a count that grows
                          with engine features, not with nodes or
                          graphs; it turns against the option if the
                          exceptions keep growing.

