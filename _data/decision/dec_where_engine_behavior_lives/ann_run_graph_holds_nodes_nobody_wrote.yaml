title:                  Nodes in the running graph that nobody wrote
brief:                  |
                        Under either minimal option, the graph the
                        engine runs holds nodes that no author wrote,
                        so a maintainer debugging a run has more to
                        learn, and a failure must be reported against
                        the authored edge and the transform that
                        placed the node, not against a node found in
                        no file. Nothing that does this is built yet.
description:            |
                        Sources:
                        - The transforms option puts nodes into the
                          resolved graph by a model transform.
                          (_data/decision/dec_where_engine_behavior_lives/opt_minimal_engine_with_transforms.yaml at brief)
                        - The variants draft has the checks run on
                          every resolved variant, with each failure
                          naming the variant and the operation that
                          brought in the fault.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - Transformations are not built yet.
                          (_sources/cc-patrol-notes/plan.md lines
                          173-176)
                        - The maintainability measure counts the parts
                          that a representative change touches.
                          (_data/register/reg_concern.yaml at entries.concern_maintainability.measure) Strength: moderate, growing with
                          scale, since the placed nodes grow with the
                          edges that need them. Failures that name the
                          transform would answer it.

