title:                  Recording writes inside the step of the unit recorded
brief:                  |
                        An inserted recording node runs in the fixed
                        schedule of its execution unit, and the
                        drafted node contract, under which a node
                        holds no globals and allocates nothing, gives
                        it no stated way to own a writer thread, so
                        its storage writes lengthen the step and its
                        tail latency, or the node needs an execution
                        unit of its own and a copy across units. An
                        engine service can keep a writer thread with a
                        double buffer off the step path, as rosbag2
                        does.
description:            |
                        Sources:
                        - An execution unit runs its nodes in a fixed
                          order on one thread of control.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml,
                          brief)
                        - "the component holds no globals and
                          allocates nothing", and nothing is allocated
                          on the heap while stepping.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 23-24, 145-151)
                        - rosbag2 "is divided into two major layers
                          internally via a double-buffered cache
                          mechanism", and "the number of data copies
                          drastically impacts the CPU load and final
                          recording performance".
                          (https://www.apex.ai/post/improvements-in-data-recording-path)
                        - The Orin configuration holds a 720p 30 Hz
                          stream. (_sources/cc-patrol-notes/plan.md
                          lines 181-182)
                        - ASSUMPTION: a node may not start a thread of
                          its own, which the contract does not say
                          outright; and a storage write can block for
                          longer than one step on eMMC or NVMe under
                          load.
                        - Answer: let a node own a thread, or have the
                          transform place each recorder in an
                          execution unit of its own; either needs a
                          stated rule. Strength: moderate. It grows
                          with the volume recorded per step, not with
                          the number of nodes.

