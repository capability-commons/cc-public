title:                  Recorders and clip readers as paired nodes of field and simulation variants
brief:                  |
                        The owner expects variants to be most useful
                        as dataflow simulations that support or oppose
                        simulation-backed decisions, and a simulation
                        variant swaps hardware-facing nodes for models
                        or recorded inputs, as the Patrol replay
                        variant puts a clip reader where the camera
                        was. When recording is done by nodes, the
                        recorder a field variant carries and the
                        reader a simulation variant carries can be two
                        node kinds over one interface, each placed by
                        variant operations; a built-in recording
                        service writes in a form that no node in the
                        graph states.
description:            |
                        Sources:
                        - Variants will likely be most useful "when
                          rapidly building dataflow simulations to use
                          as simulation variants to support or oppose
                          different simulation-backed decisions"
                          (owner's statement, 2026-10-24).
                        - The replay variant keeps analysis only and
                          adds a clip reader, fixed settings and a
                          dump writer.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          lines 20-63)
                        - Variants are meant as documented
                          experiments, and a run item would record
                          what a variant measured.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 8-9 and 98-113)
                        - Simulation variants are the strongest fit of
                          the ruling, since the argument side already
                          exists. (_sources/variants-framing.md,
                          section 3)
                        - ASSUMPTION: a recorder and a clip reader for
                          the same stream can share one frame format
                          stated in an interface control document.
                          Strength: weak to moderate; it rests on the
                          assumption, and a service could also
                          document its format.

