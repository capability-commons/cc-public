title:                  Service code carried in every engine build and on every target
brief:                  |
                        Code in the engine is in every build and on
                        every target, while an inserted node is only
                        where a transform put it. So built-in services
                        make each of their defects common to every
                        system, put their network and storage code
                        within an attacker's reach everywhere, make
                        their storage and telemetry libraries
                        dependencies of every build, must be ported or
                        stubbed on every target including one with no
                        OS, and turn every change to them into an
                        engine change. As nodes, the same code is left
                        out where it is not used and is fixed or
                        replaced as a node kind.
description:            |
                        Sources:
                        - The services option provides recording,
                          logging, telemetry and buffering as built-in
                          services.
                          (_data/decision/dec_where_engine_behavior_lives/opt_engine_provides_common_services.yaml
                          lines 12-16)
                        - A build with no dynamic nodes leaves out the
                          dynamic machinery unless its user asks for
                          it, "for example to add logging, data
                          recording or telemetry nodes later".
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 22-25)
                        - The engine is "VERY hard to change ... once
                          it's built and you've started using it".
                          (_data/decision/dec_first_semantics/ruling_first_semantics.yaml
                          lines 17-20)
                        - The transforms option keeps the engine
                          "small enough to review and to port to new
                          hardware".
                          (_data/decision/dec_where_engine_behavior_lives/opt_minimal_engine_with_transforms.yaml
                          lines 12-21)
                        - The owner wants placement to cover systems
                          with no OS. (owner's statement, 2026-10-24
                          13:06Z, as cited in
                          _data/decision/dec_change_set_at_a_step/ann_change_set_made_where_cctool_is_absent.yaml
                          lines 35-37)
                        - The planned targets are a Jetson Orin Nano
                          first and a Qualcomm flight controller board
                          later.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 155-157)
                        - "Functional components never use pub-sub (or
                          any other asynchronous transport) directly",
                          and only gateway nodes cross the boundary; a
                          transport library such as ZeroMQ stays at
                          that one seam.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 184-188, 226-227;
                          _data/decision/dec_crossing_between_kahn_and_actors/ann_transport_library_kept_inside_gateway_nodes.yaml,
                          brief)
                        - rosbag2 "provides two storage plugins, mcap
                          and sqlite3", and "The default is mcap".
                          (https://github.com/ros2/rosbag2/blob/master/README.md)
                        - In ROS 2, rosbag2 records topics, run as its
                          own executable from a launch script or as a
                          composable recorder node.
                          (https://github.com/ros2/rosbag2/blob/master/README.md;
                          https://github.com/berndpfrommer/rosbag2_composable_recorder)
                        - A change set adds, moves or removes nodes
                          and edges of the dynamic subgraph while the
                          system runs.
                          (_data/decision/dec_change_set_at_a_step/dec_change_set_at_a_step.yaml,
                          brief)
                        - The owner wants "to be able to respond to
                          reported problems quickly and largely
                          automatically". (owner's statement,
                          2026-10-22T16:33)
                        - The register's questions: "What can an
                          attacker reach, and what would it cost?"
                          (_data/register/reg_concern.yaml line 166);
                          "What happens if one of them is changed or
                          withdrawn?" (same file, line 699); effort to
                          install on a new platform, in person hours
                          (same file, lines 354-356); parts a
                          representative change touches (same file,
                          lines 398-400).
                        - ASSUMPTION: the services would sit in the
                          engine core, present in every build, and
                          would need at least one storage format and,
                          for video, a compressor. Strength: strong.
                          The exposure grows with the number of
                          systems, services and targets that share the
                          engine, not with nodes.

