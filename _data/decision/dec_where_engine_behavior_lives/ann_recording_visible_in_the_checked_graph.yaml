title:                  Recording visible in the checked graph
brief:                  |
                        If recording and buffering are inserted nodes,
                        everything that runs is in the resolved graph
                        the checks see, so turning recording on
                        changes that graph and goes through review,
                        and a check could hold that an edge carrying
                        personal data is recorded only by a node that
                        protects it. If services are switched on by
                        configuration, behavior that changes timing,
                        memory use and who can read the data is turned
                        on with no change to the graph a safety case
                        or a protection rule covers.
description:            |
                        Sources:
                        - Within a segment, "Its topologies are known
                          and validated, so a safety case applies to
                          the same configuration that is deployed in
                          service."
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 169-171; also lines 213-215)
                        - The checks run on every resolved variant,
                          and the engine sees only resolved dataflow graphs.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-95)
                        - Under the services option, "a graph names no
                          node for them".
                          (_data/decision/dec_where_engine_behavior_lives/opt_engine_provides_common_services.yaml at brief)
                        - Some segments may hold personal data under
                          the GDPR. (owner's statement,
                          2026-10-22)
                        - A log of every input holds everything the
                          system took in, and the engine should let a
                          system protect it.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ann_replay_log_holds_all_personal_data_seen.yaml,
                          brief)
                        - The security concern asks "Who can read or
                          change what, and how is that enforced?"
                          (_data/register/reg_concern.yaml at entries.concern_security.question)
                        - ASSUMPTION: the switches for services would
                          not be checked by the dataflow checks; if
                          they became checked items, this would
                          weaken. No check of recorded personal data
                          exists yet, and field marking in the data
                          dictionary is proposed but not built.
                          Strength: strong for the deployed resolved dataflow graph, since more switchable services mean more combinations of services deployed but never checked; moderate for personal
                          data, which rests on a check yet to be
                          written.

