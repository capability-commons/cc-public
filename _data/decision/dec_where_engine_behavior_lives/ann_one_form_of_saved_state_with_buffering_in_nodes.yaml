title:                  One form of saved state when buffering is done by nodes
brief:                  |
                        If buffering, folds and delays are done by
                        inserted nodes, what they hold is node state,
                        so one save and restore path covers restart
                        after a crash, moving a node and swapping a
                        version. If the engine does the buffering, it
                        holds a second kind of state that every one of
                        those paths must also save, restore and
                        upgrade.
description:            |
                        Sources:
                        - "state is everything that persists between
                          steps, so the framework can snapshot or zero
                          it for re-simulation."
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 47-48)
                        - The first engine has "one form of node
                          state".
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 17-19)
                        - If node state blocks live in memory-mapped
                          files, a crashed process can be restarted
                          from its last committed step.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 149-151)
                        - The swap option upgrades "the node's state
                          by the dictionary's mapping".
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml,
                          brief)
                        - The services option puts buffering in the
                          engine.
                          (_data/decision/dec_where_engine_behavior_lives/opt_engine_provides_common_services.yaml
                          lines 12-16)
                        - ASSUMPTION: buffers the engine holds outside
                          node state are not covered by the node state
                          mechanism unless designed into it
                          separately. Strength: strong. The state that
                          would sit outside node state grows with
                          every buffered edge.

