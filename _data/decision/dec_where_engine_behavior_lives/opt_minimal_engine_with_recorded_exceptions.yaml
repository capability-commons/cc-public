title:                  Minimal engine with recorded exceptions
brief:                  |
                        The engine is minimal as in the option of
                        model transforms, and a behavior moves into
                        the engine only when a recorded decision shows
                        that no inserted node can do it, such as
                        gathering the messages an actor sends between
                        two steps into the token a step reads.

