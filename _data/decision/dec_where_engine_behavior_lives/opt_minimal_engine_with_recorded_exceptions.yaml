title:                  Minimal engine with recorded exceptions
brief:                  |
                        The engine is minimal as in the option of
                        model transforms, and a behavior moves into
                        the engine only when a recorded decision shows
                        that no inserted node can do it within a
                        measured budget, such as gathering the
                        messages an actor sends between two steps into
                        the token a step reads, or keeping a
                        recorder's storage writes off the step path
                        when a recording node would lengthen the step
                        past its budget. The decision records the
                        measurement and the budget it was held to.
description:            |
                        Reworded at WTP's request on 2026-10-26 so
                        that the test for an exception includes a
                        measured budget, answering the challenge that
                        a behavior a node can do, but too slowly, had
                        no recorded way into the engine.

