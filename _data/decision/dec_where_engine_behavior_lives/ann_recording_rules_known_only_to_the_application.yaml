title:                  Recording rules that only the application knows
brief:                  |
                        What a recorder may lose, and how it recovers,
                        depends on what it records, as the Patrol
                        recorder's keyframe rule shows. A recorder
                        node can carry such a rule, and the ruling on
                        the first engine already speaks of adding data
                        recording nodes; a built-in recording service
                        would be a second way to record that does not
                        know these rules.
description:            |
                        Sources:
                        - A build with no dynamic nodes leaves out the
                          dynamic machinery "unless its user asks for
                          it, for example to add logging, data
                          recording or telemetry nodes later".
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 22-25)
                        - The Patrol base graph draft has a recorder
                          node bound to the recorder interface.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 251-261)
                        - The recorder interface states: "Bounded;
                          units it cannot keep are counted, and
                          recording recovers at the next keyframe."
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_recorder.yaml
                          lines 108-110)
                        - "The function in question can completely and
                          correctly be implemented only with the
                          knowledge and help of the application."
                          Low-level mechanisms for such functions "are
                          justified only as performance enhancements".
                          (Saltzer, Reed, Clark 1984,
                          https://www.cs.princeton.edu/courses/archive/fall15/cos518/papers/endtoend.pdf)
                        - The services option provides recording "as
                          built-in services that configuration
                          switches on for any node or edge".
                          (_data/decision/dec_where_engine_behavior_lives/opt_engine_provides_common_services.yaml
                          lines 12-16)
                        - ASSUMPTION: the ruling's wording is an
                          example and was not meant to settle this
                          decision. Strength: moderate. Each new data
                          type with its own loss rule is one more
                          thing a generic service does not know, so it
                          holds at ten times the nodes and graphs; it
                          is not strong because the ruling's words are
                          only an example.

