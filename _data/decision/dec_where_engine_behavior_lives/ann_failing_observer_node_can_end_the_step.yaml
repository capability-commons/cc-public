title:                  An inserted observer node that can end the step
brief:                  |
                        In the drafted schedule, a node that returns
                        any signal other than continue ends the step
                        for the nodes after it, so a recording node
                        that fails could stop functional nodes.
                        Something must state that an observer's
                        failure does not end the step, a small engine
                        behavior or a rule on where the transform
                        places the node; the option of recorded
                        exceptions can record it, and the option of
                        model transforms as worded gives it no place.
description:            |
                        Sources:
                        - The generated process step returns as soon
                          as one node returns a signal other than
                          continue.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 46-50)
                        - The framework's wrapper catches anything a
                          node throws and maps it to an exit signal.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 95-96)
                        - The Patrol recorder is designed to count
                          what it cannot keep, not to fail.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_recorder.yaml
                          lines 108-110)
                        - A built-in service would need the same rule.
                          Strength: moderate. More observers mean more
                          chances for it to happen, but one stated
                          rule covers all of them.

