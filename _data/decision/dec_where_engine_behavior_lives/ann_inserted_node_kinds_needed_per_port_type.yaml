title:                  Inserted node kinds needed for each port type
brief:                  |
                        A recorder or buffer that a transform puts on
                        an edge needs ports that accept that edge's
                        type, and port types are checked against data
                        dictionary entries with no type parameters. So
                        the generator writes one node kind, or one
                        dictionary entry, for each recorded or
                        buffered type, where an engine service can
                        handle any edge by the size in its type table.
description:            |
                        Sources:
                        - Port types name entries of data
                          dictionaries, and edges are checked against
                          those entries.
                          (_data/decision/dec_port_types/ruling_port_types_from_data_dictionaries.yaml
                          lines 12-19)
                        - Every dataflow node needs a brief and an
                          edge that realizes the interface control
                          document whose step surface it presents.
                          (_data/schema/sch_dataflow_node.yaml lines
                          18-24, 38-40)
                        - A search of the interface control document
                          schema for "generic" or "template" finds
                          nothing. ASSUMPTION: without type
                          parameters, each such node kind needs one
                          interface, or one dictionary entry, for each
                          port type it serves.
                        - Everything that crosses an edge is plain,
                          fixed-size data; a type id is a hash of the
                          canonical type description, and each
                          component's type table lists a type id and
                          size for every slot.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 84-86, 98-103)
                        - The dynamic host allocates buffers from the
                          size in each component's type table.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 63-68)
                        - ASSUMPTION: the generator can write a
                          recorder for a type from its dictionary
                          entry, as it writes the type's C++ struct
                          (same file, lines 95-96). If it can, this
                          becomes a cost of generation, not a gap in
                          function. Strength: moderate. The count is
                          bounded by the number of types, not nodes,
                          and it falls away if the data dictionary
                          gains type parameters.

