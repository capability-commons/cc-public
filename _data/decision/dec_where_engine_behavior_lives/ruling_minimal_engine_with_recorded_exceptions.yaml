title:                  Minimal engine with recorded exceptions
brief:                  |
                        The engine does nothing that a node could do,
                        and a behavior moves into the engine only when
                        a recorded decision shows that no inserted
                        node can do it within a measured budget; the
                        decision records the measurement and the
                        budget. Ruled by WTP on 2026-10-26, as
                        recommended, with the budget wording he asked
                        for.

