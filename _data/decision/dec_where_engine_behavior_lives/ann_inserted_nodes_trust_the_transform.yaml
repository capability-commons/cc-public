title:                  Inserted nodes that trust the transform inserting them
brief:                  |
                        Under either minimal option, a transform sits
                        between the graph that was reviewed and the
                        graph that runs, so a fault in the transform
                        puts a fault into every system it is applied
                        to. The checks on the resolved graph mostly
                        offset this, but nothing yet checks that an
                        inserted node does what its declaration says.
description:            |
                        Sources:
                        - Transformations are not built yet.
                          (_sources/cc-patrol-notes/plan.md lines
                          173-176)
                        - The checks run on every resolved variant,
                          and a failure names the operation that
                          introduced it.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89) Strength: weak to moderate. One
                          transform covers any number of graphs, so
                          the risk does not grow with them, but the
                          transform is a single point of failure for
                          all of them.

