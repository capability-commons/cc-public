title:                  Minimal engine with model transforms
brief:                  |
                        The engine moves one token along each edge at
                        each step and runs the nodes, and does nothing
                        that a node could do instead. Recording,
                        logging, telemetry, rate decoupling and the
                        delivery policy of an edge are done by nodes
                        that a model transform puts into the resolved
                        graph where they are needed, so the engine
                        stays small enough to review and to port to
                        new hardware.
description:            |
                        This is the choice Stableflow made (owner's
                        statement, 2026-10-24T22:43Z).

