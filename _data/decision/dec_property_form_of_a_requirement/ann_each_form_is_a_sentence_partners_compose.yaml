title:                  Each form a sentence that partners must compose
brief:                  |
                        A partner tool that shows a requirement must
                        compose its sentence as cctool does, or show
                        the bare slots, so each form adds a sentence
                        order for every partner to reproduce. A reader
                        that does not know a form shows no statement
                        at all, as the item page of cctool serve does
                        for slots that do not compose.
description:            |
                        Sources:
                        - A partner tool that reads a requirement must
                          compose the sentence the same way, or show
                          the slots.
                          (_data/decision/dec_requirement_statement_form/ann_composer_is_extra_code.yaml
                          at description)
                        - The item page returns an empty statement
                          when the slots do not compose.
                          (src/cctool/web/page.py within _statement)
                        - The composer knows one sentence order.
                          (src/cctool/requirement/compose.py within
                          parts)
                        - Compatibility counts the tools a partner
                          must install to take part, and asks what a
                          partner must adopt.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2 and
                          entries.concern_compatibility.measure.1)
                        - Assumption: partners show the composed
                          sentence rather than the slots. Strength:
                          moderate; it is one sentence order per form,
                          so it weighs most against four forms at
                          once.

