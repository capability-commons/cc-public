title:                  Second form that spreads across five mechanisms
brief:                  |
                        A form field reaches the schema, the composer,
                        the review questions, the strict field rule
                        and the agent guidance, since each of them
                        assumes one form with a process word and an
                        object. Each further form repeats those
                        changes, so adding three forms at once
                        multiplies the spread for forms that no
                        requirement uses yet.
description:            |
                        Sources:
                        - The schema requires modal_verb, activity,
                          object, rationale and verification_method of
                          every requirement, and exactly one edge of
                          relation_has_process.
                          (_data/schema/sch_requirement.yaml at
                          allOf.2.required and
                          allOf.2.properties.edge.allOf.1)
                        - The composer builds one sentence order, with
                          a process word and an object.
                          (src/cctool/requirement/compose.py within
                          parts)
                        - The review questions read only the
                          condition, object and qualifier, and say of
                          every requirement that it is composed from
                          one process word and one object.
                          (src/cctool/requirement/review.py within
                          questions and characteristics)
                        - The strict text slots of a requirement are
                          condition, object and qualifier, in the
                          check and in the guidance.
                          (src/cctool/check/check.lp within
                          strict_field; AGENTS.md#changing-data-items)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                        - Assumption: each new form needs its own
                          branch in each of these places, rather than
                          one shared table. Strength: strong against
                          all four forms now; moderate against one
                          property form, which is a bounded change
                          made once.

