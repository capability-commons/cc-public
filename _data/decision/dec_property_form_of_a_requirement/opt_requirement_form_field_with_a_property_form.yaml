title:                  Form field with a property form beside the functional form
brief:                  |
                        A requirement names its form, function or
                        property. The function form keeps today's
                        slots. The property form has a subject, a
                        modal verb, the characteristic, and the value
                        or comparison it must meet, with the optional
                        condition and qualifier: "the graph of edits
                        should be replayable from its recorded edits".
                        The schema requires each form's slots and only
                        those, and the composer writes each form's
                        sentence. Further SOPHIST forms, for
                        environment and process, are added only when a
                        requirement needs one.
description:            |
                        Recommended to WTP on 2026-10-26.

