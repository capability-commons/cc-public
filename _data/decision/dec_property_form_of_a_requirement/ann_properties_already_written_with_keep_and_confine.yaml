title:                  Properties already written with keep and confine
brief:                  |
                        Three of the four requirements state what are
                        in effect properties, a file left unchanged, a
                        guid kept, and a deployment held inside a
                        boundary, through the process words keep and
                        confine, and each of them composes today. So
                        far the one form has carried every property
                        asked of it with no second slot set, schema
                        branch or composer path.
description:            |
                        Sources:
                        - rqt_format_keeps_formatted_file and
                          rqt_rename_keeps_guid have the process word
                          concept_keep.
                          (_data/requirement/rqt_format_keeps_formatted_file.yaml
                          at edge.1;
                          _data/requirement/rqt_rename_keeps_guid.yaml
                          at edge.1)
                        - rqt_chat_deployment_stays_with_data_owner
                          has the process word concept_confine.
                          (_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml
                          at edge.1)
                        - There are four requirements in all.
                          (_data/requirement/, four files)
                        - The decision itself names the deployment
                          requirement as a constraint written in the
                          one form.
                          (_data/decision/dec_property_form_of_a_requirement/dec_property_form_of_a_requirement.yaml
                          at description)
                        - Simplicity asks how many mechanisms a design
                          adds, and whether it does anything another
                          mechanism already does.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.0 and
                          entries.concern_simplicity.question.1)
                        - Assumption: the properties the vision needs,
                          such as replayable, can be bent into a
                          process word the same way without losing
                          what is meant. Strength: moderate while
                          there are few requirements; it weakens if
                          properties with numeric values become
                          common, since the value then sits in free
                          text.

