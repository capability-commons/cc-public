title:                  Characteristic slot that joins requirements on one property
brief:                  |
                        In the one form, which property a requirement
                        states is buried in the object text behind a
                        general process word such as keep or confine,
                        so nothing joins two requirements about the
                        same property. A property form with a
                        characteristic slot, made an edge to a concept
                        as the process word is, lets every requirement
                        on a property such as replayable be found by
                        its edge.
description:            |
                        Sources:
                        - The slots that name items are edges to
                          items.
                          (_data/decision/dec_requirement_item_slots/ruling_requirement_item_slots.yaml
                          at brief)
                        - Traceability is, as far as possible, held as
                          edges in the uniform relation scheme.
                          (_data/decision/dec_requirement_provenance/ruling_requirement_provenance.yaml
                          at brief)
                        - The process word is an edge to a concept
                          whose preferred term the statement writes as
                          its verb. (_data/register/reg_relation.yaml
                          at entries.relation_has_process.description)
                        - In the deployment requirement the property
                          is written only in the object text.
                          (_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml
                          at object)
                        - Traceability asks whether each need can be
                          traced to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1)
                        - Assumption: the characteristic is made an
                          edge to a concept; the option does not yet
                          say whether it is text or an edge. Strength:
                          moderate; it grows with the number of
                          property requirements.

