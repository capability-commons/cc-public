title:                  Property form of a requirement
brief:                  |
                        Does a requirement that states a property,
                        such as how fast, how reliable or how
                        replayable something must be, get a sentence
                        form of its own, or is it written in the one
                        form that every requirement has today?
description:            |
                        WTP asked whether requirements other than
                        functional ones can be drafted yet (WTP,
                        2026-10-26). The schema sch_requirement
                        composes every statement from one template: a
                        subject, a modal verb, a process word, an
                        object and an optional qualifier. A property
                        needs a process word in that form, so a
                        statement such as "the graph of edits should
                        be replayable" has to be bent into a verb;
                        rqt_chat_deployment_stays_with_data_owner
                        shows a constraint written that way. The
                        SOPHIST templates the schema follows have a
                        separate template for properties, and
                        ISO/IEC/IEEE 29148 treats quality requirements
                        and constraints as kinds of requirement
                        alongside functional ones.

