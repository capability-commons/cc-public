title:                  Bending guidance as a tension kept open
brief:                  |
                        Guidance on how to bend a property into a
                        process word is a way of wording around the
                        form, which the guidance itself names as a
                        tension to resolve. With four requirements, of
                        which only the deployment requirement would
                        plainly be recast, the change of form is as
                        cheap now as it will ever be.
description:            |
                        Sources:
                        - Under the one form, guidance gives examples
                          of how to bend a property into that form.
                          (_data/decision/dec_property_form_of_a_requirement/opt_properties_written_in_the_one_form.yaml
                          at brief)
                        - A tension is resolved while the change is
                          still cheap, and when in doubt the larger
                          change is made now.
                          (_data/register/reg_design_rule.yaml at
                          entries.rule_resolve_tensions_early.brief)
                        - Wording around a check is a tension,
                          reported and not hidden.
                          (AGENTS.md#improving-as-you-go)
                        - There are four requirements, and the
                          decision names one of them as a constraint
                          bent into a verb. (_data/requirement/, four
                          files;
                          _data/decision/dec_property_form_of_a_requirement/dec_property_form_of_a_requirement.yaml
                          at description)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                        - Assumption: requirements will grow in
                          number, so a later change of form touches
                          more files. Strength: moderate; it argues
                          for changing the form now, not for any
                          particular number of forms.

