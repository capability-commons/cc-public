title:                  Required value slot for the measure of a property
brief:                  |
                        In the one form the measure of a property sits
                        in the qualifier, which is optional, so a
                        property with no measure passes the schema and
                        the review only asks whether one is needed. A
                        property form whose value slot is required
                        refuses a property with no value at the
                        schema, before anyone reviews it.
description:            |
                        Sources:
                        - The qualifier is optional; it is not in the
                          required list.
                          (_data/schema/sch_requirement.yaml at
                          allOf.2.required and
                          allOf.2.properties.qualifier)
                        - With no qualifier, the review raises a
                          question, and its questions are prompts for
                          a reviewer, not failures.
                          (src/cctool/requirement/review.py within
                          questions, and the description in its module
                          docstring)
                        - Under the option the property form has the
                          characteristic and the value or comparison
                          it must meet, and the schema requires each
                          form's slots.
                          (_data/decision/dec_property_form_of_a_requirement/opt_requirement_form_field_with_a_property_form.yaml
                          at brief)
                        - rqt_chat_deployment_stays_with_data_owner
                          has no qualifier.
                          (_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml)
                        - Maintainability asks how readily a change
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                        - Assumption: a property worth stating has a
                          value that can be written in a slot.
                          Strength: moderate; a value such as "from
                          its recorded edits" is still text, so the
                          schema checks that a value is given, not
                          that it can be measured.

