title:                  Properties written in the one form
brief:                  |
                        Keep one form. A property is written with a
                        process word such as keep, meet or confine,
                        its object, and its measure in the qualifier,
                        as rqt_chat_deployment_stays_with_data_owner
                        does. Guidance gives examples of how to bend a
                        property into that form.
description:            |
                        The form in use today.

