title:                  Property form that matches the SOPHIST property template
brief:                  |
                        The SOPHIST templates the schema already
                        follows have a property template with a
                        characteristic, the thing considered, the
                        modal verb, an optional comparison and a
                        value, which are the slots the option
                        proposes. A partner that writes with those
                        templates can map a property requirement slot
                        for slot, while a property bent into a process
                        word reads to that partner as a function.
description:            |
                        Sources:
                        - The slots of a requirement follow the
                          SOPHIST MASTER template, and its attributes
                          the INCOSE guide.
                          (_data/register/reg_concept.yaml at
                          entries.concept_requirement.note)
                        - The SOPHIST property template has the slots
                          characteristic, object considered, modal
                          verb, an optional comparison operator, a
                          value, and the closing verb be. (Rupp and
                          the SOPHISTs, "Schablonen fuer alle Faelle",
                          chapter 3.3, figure 12, pages 27-29,
                          https://silo.tips/download/die-sophistenschablonen-fr-alle-flle-2)
                        - SOPHIST gives PropertyMASTER,
                          EnvironmentMASTER and ProcessMASTER as its
                          templates for non-functional requirements,
                          beside FunctionMASTER. (SOPHIST Master
                          Patterns Knowledge Library, 2020, pages
                          11-12,
                          https://www.reusecompany.com/wp-content/uploads/2020/08/SOPHIST-Master-Patterns-Library.pdf)
                        - Where a recognized standard covers the
                          ground, its structure is the starting
                          position.
                          (_data/decision/dec_follow_standards_by_default/ruling_follow_standards_by_default.yaml
                          at brief)
                        - Compatibility asks whether a partner can
                          read and use what the design produces, and
                          what it must adopt to do so.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0 and
                          entries.concern_compatibility.question.2)
                        - Assumption: some partners write requirements
                          with the SOPHIST templates; none is named
                          today. Strength: moderate; the point holds
                          for any partner that uses the templates, and
                          is void for one that does not.

