title:                  Platform and scale needs stated as values
brief:                  |
                        What flexibility asks, which platforms, what
                        it takes to install, and how far it scales, is
                        answered by a characteristic and a value, the
                        shape of the property template, and for an
                        operating environment by the environment
                        template. No requirement states a platform or
                        a scale today; the form field makes the
                        property form available now and adds the
                        environment form when the first platform
                        requirement needs it.
description:            |
                        Sources:
                        - Flexibility asks on which platforms the
                          design runs, what it takes to install it on
                          a new one, and whether it can be scaled; it
                          measures platforms by count and install
                          effort in person hours.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question and
                          entries.concern_flexibility.measure)
                        - The SOPHIST property template ends in a
                          comparison and a value, and the environment
                          template says the thing considered shall be
                          so designed that it can be operated under a
                          stated condition. (Rupp and the SOPHISTs,
                          "Schablonen fuer alle Faelle", chapters 3.3
                          and 3.4, pages 27-33,
                          https://silo.tips/download/die-sophistenschablonen-fr-alle-flle-2)
                        - None of the four requirements names a
                          platform or a scale. (_data/requirement/,
                          four files)
                        - The form field option adds the environment
                          form only when a requirement needs one.
                          (_data/decision/dec_property_form_of_a_requirement/opt_requirement_form_field_with_a_property_form.yaml
                          at brief)
                        - Assumption: the first flexibility
                          requirements can be stated as properties,
                          such as how many platforms the tooling
                          installs on, until an environment form is
                          added. Strength: weak to moderate; it rests
                          on requirements that do not yet exist.

