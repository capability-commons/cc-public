title:                  Process form that obliges a person rather than a design entity
brief:                  |
                        The SOPHIST process template obliges an actor,
                        a person or role such as a contractor, rather
                        than the system, while the subject of a
                        requirement must be a design entity by ruling.
                        Adding the process form now therefore reopens
                        a settled decision and breaks the trace from
                        each requirement to the element it obliges;
                        adding forms only when needed leaves that
                        question until a requirement raises it.
description:            |
                        Sources:
                        - In the SOPHIST process template the first
                          slot is an actor, a person or role and not
                          the system, as in "the contractor must write
                          an operating manual". (Rupp and the
                          SOPHISTs, "Schablonen fuer alle Faelle",
                          chapter 3.5, figure 14, pages 35-36,
                          https://silo.tips/download/die-sophistenschablonen-fr-alle-flle-2)
                        - The subject of a requirement must be a
                          design element.
                          (_data/decision/dec_requirement_subject/ruling_requirement_subject.yaml
                          at brief)
                        - The target of relation_has_subject must be a
                          design entity, the system or system element
                          the requirement is an obligation on.
                          (_data/register/reg_relation.yaml at
                          entries.relation_has_subject.description and
                          entries.relation_has_subject.note)
                        - The option with a form field adds the
                          environment and process forms only when a
                          requirement needs one.
                          (_data/decision/dec_property_form_of_a_requirement/opt_requirement_form_field_with_a_property_form.yaml
                          at brief)
                        - Simplicity asks whether a design follows
                          from decisions already made; traceability
                          asks whether each element can be traced to
                          the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2 and
                          entries.concern_traceability.question.0)
                        - Assumption: the process form would be added
                          with the actor in the subject place, as
                          SOPHIST writes it. Strength: strong against
                          the process form now; it says nothing
                          against the environment form, whose subject
                          is the thing considered.

