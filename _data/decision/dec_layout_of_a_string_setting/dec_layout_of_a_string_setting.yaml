title:                  Layout of a string setting
brief:                  |
                        Some node types take a string setting, such as
                        a printer's output path or a transport's
                        endpoint. How is a string laid out in the
                        fixed-size settings of a node?
description:            |
                        icd_printer, icd_dataflow_recorder and
                        icd_dataflow_transport each have a string
                        setting, and settings are fixed in size so
                        that no memory is allocated after the first
                        local step (rqt_memory_before_first_step). The
                        trial implementation of 2026-10-29 had no
                        string settings, and wrote setting values as
                        Python literals with no type check, so a
                        string became a number (review of 2026-10-29,
                        CC-019).

