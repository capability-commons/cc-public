title:                  Length in characters of an encoding the option leaves unstated
brief:                  |
                        The character option bounds a value by a
                        length in characters, but a string in YAML is
                        a sequence of Unicode characters, and in UTF-8
                        each character outside ASCII takes two or more
                        bytes. A check that counts characters can then
                        accept a value that does not fit the bytes
                        reserved, and one that counts bytes must say
                        so. A bounded array of bytes states its unit,
                        and a Linux path is a sequence of bytes in any
                        case. The checks of setting values are to be
                        written new, so the unit has to be fixed
                        before they are.
description:            |
                        Sources:
                        - A string setting is an array of characters
                          of a declared length,
                          padded with zeros, and a longer value is refused when the graph
                          is checked.
                          (_data/decision/dec_layout_of_a_string_setting/opt_string_as_characters_of_a_declared_length.yaml
                          at brief)
                        - A string setting is a bounded array of
                          bytes.
                          (_data/decision/dec_layout_of_a_string_setting/opt_string_as_a_bounded_array_of_bytes.yaml
                          at brief)
                        - The trial wrote setting values with no type
                          check, so that a
                          string became a number, and the fix adds a check of each
                          setting's type. (review of 2026-10-29, CC-019)
                        - Functional suitability asks whether each
                          function gives the
                          right result. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0)
                        ASSUMPTION: YAML strings are Unicode, UTF-8
                        encodes characters outside ASCII in two to
                        four bytes, and Linux paths are byte strings.
                        Strength: weak to moderate; most paths and
                        endpoints are ASCII, and one word in the
                        option, bytes for characters, fixes it.

