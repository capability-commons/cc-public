title:                  Maturity of the code
brief:                  |
                        Is a maturity declared on the code, saying how
                        far through its lifecycle it is, and on which
                        items?
description:            |
                        Today every item is held to one standard of
                        rigour, too much for a sketch and too little
                        for what matters. September recorded, and
                        never built, a maturity declared on each
                        module that may not exceed the maturity of
                        anything it imports, directly or through
                        another module
                        (origin/main:ddr/ddr_maturity.yaml at
                        decision). WTP used a declared maturity on
                        each file in earlier work, as a ratchet: a
                        module of high maturity could not depend on
                        one of lower maturity, and a release could
                        claim only the lowest maturity of its parts.
                        The import rule over the graph, now ruled,
                        reads imports between modules and the
                        components they belong to.

