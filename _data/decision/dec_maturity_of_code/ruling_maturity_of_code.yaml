title:                  Maturity declared on each source file, with two conditions
brief:                  |
                        Each source file declares a maturity in its
                        own item, in any supported language, and a
                        file may not declare a higher maturity than
                        any file it imports, directly or through
                        another. Two conditions: a logical component's
                        maturity is computed from the most mature file
                        that implements it, never stored, so
                        requirements that trace to a component still
                        reach a maturity; and a file that declares
                        none takes the lowest level, so declarations
                        arrive only as files mature. A maturity on
                        each logical component, and no maturity, are
                        rejected. Ruled by WTP on 2026-10-28, by
                        choosing "Uphold source files, with
                        conditions".

