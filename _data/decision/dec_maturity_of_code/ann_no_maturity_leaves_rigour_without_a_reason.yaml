title:                  One standard of rigour with no stated reason
brief:                  |
                        With no maturity, nothing records why a sketch
                        and a finished part are held to the same
                        checks, or which parts are meant to be
                        finished. WTP's ratchet makes the traceability
                        of a high maturity release a stated demand.
                        Without it, that demand has no item to rest
                        on.
description:            |
                        Sources:
                        - Today every item is held to one standard of
                          rigour, too much for a sketch and too little
                          for what matters
                          [_data/decision/dec_maturity_of_code/dec_maturity_of_code.yaml
                          at description].
                        - WTP described a ratchet in which releasing
                          at a high maturity requires all coverage,
                          testing, validation and traceability to be
                          in place [owner's statement, 2026-10-28].
                        - The no maturity option holds every item to
                          the same checks, as now
                          [_data/decision/dec_maturity_of_code/opt_no_maturity.yaml
                          at brief].
                        - WTP said he does not know whether to
                          implement maturity now or ever, since all
                          development is done by agents [owner's
                          statement, 2026-10-28]. Strength: Moderate.
                          It is an argument about what the graph can
                          say, not about cost. It weakens if the
                          project never needs to tell finished parts
                          from sketches. At ten times the size the gap
                          grows, since more parts share one
                          undifferentiated claim.

