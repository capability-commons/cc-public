title:                  Costly checks confined to mature code
brief:                  |
                        With no maturity, every item gets the same
                        checks, so the costly ones either run over the
                        whole tree or run nowhere. A declared maturity
                        lets the overnight run spend per-test
                        coverage, budgets and long property runs only
                        on code that claims a high maturity. That
                        keeps the machine time of verification from
                        growing with every sketch an agent writes.
description:            |
                        Sources:
                        - The full gate for v0.1.0 took about 26
                          minutes on 4 cores, and the slow run took 17
                          min 8 s real on an 8-core machine
                          [_data/decision/dec_release_gate/ann_first_release_gate_took_17_to_26_minutes.yaml
                          at description].
                        - In that run 3,058 of the 3,760 tests are
                          marked slow
                          [_data/decision/dec_release_gate/ann_first_release_gate_took_17_to_26_minutes.yaml
                          at description].
                        - Coverage per test with the C tracer took 2.6
                          times the base run, and 534 s for the
                          commit-gate tests on 4 CPUs
                          [_data/decision/dec_where_test_evidence_is_measured/ann_measuring_at_push_keeps_the_commit_gate_fast.yaml
                          and
                          ann_remote_or_nightly_evidence_adds_failure_modes.yaml
                          at description].
                        - In earlier work higher maturity required
                          more coverage and more stringent testing,
                          and lower maturity was less constrained
                          [owner's statement, 2026-10-28].
                        - The no maturity option holds every item to
                          the same checks, as now
                          [_data/decision/dec_maturity_of_code/opt_no_maturity.yaml
                          at brief].
                        - All software is written by agents, many at
                          once, and reviewed by one maintainer
                          [owner's statement, 2026-10-28].
                        - ASSUMPTION: the overnight run selects its
                          costly checks by the declared maturity. If
                          it runs them on all code anyway, maturity
                          changes what is required but not what is
                          spent. Strength: moderate today, since the
                          tree is small and coverage is measured
                          overnight only. It grows at ten times the
                          size, where slow tests that grow with the
                          data would run on every module, mature or
                          not.

