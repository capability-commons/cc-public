title:                  The code is what matures
brief:                  |
                        What becomes mature is the code: its tests,
                        its coverage and its review belong to source
                        files, not to the logical component they
                        implement. A component therefore takes its
                        maturity from the most mature implementation
                        of it, rather than declaring one, and the
                        maturity is declared where the evidence for it
                        sits. The bound must hold for any supported
                        language, not only Python.
description:            |
                        Sources:
                        - Argued by WTP in the project thread on
                          2026-10-28 at 15:38 UTC: "It feels to me
                          like it's the CODE which is the thing that's
                          mature, and the logical component inherits
                          it's maturity from the most mature
                          implementation of it."
                        - Tests verify and coverage reaches functions
                          and modules, through a verifies edge in a
                          test function item
                          [_data/decision/dec_how_a_test_names_what_it_verifies/ruling_how_a_test_names_what_it_verifies.yaml
                          at brief].

