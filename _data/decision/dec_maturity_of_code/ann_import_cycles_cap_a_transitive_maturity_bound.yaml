title:                  Import cycles that weaken a maturity ratchet
brief:                  |
                        Some packages already import each other, and
                        the ruled import rule starts as advice for
                        that reason. A maturity bound read from the
                        same imports can only report, not refuse,
                        until those cycles are broken. September
                        rejected a bound that only reports, so neither
                        maturity option is a working ratchet on the
                        day it lands.
description:            |
                        Sources:
                        - The checker imports the editor and the
                          release package [src/cctool/check/check.py,
                          the imports of cctool.edit.layout and
                          cctool.release.record].
                        - The editor imports the checker
                          [src/cctool/edit/edit.py, the import of
                          cctool.check.check].
                        - The release package imports the checker
                          [src/cctool/release/release.py, the import
                          of cctool.check.check, as listed in
                          ann_unchecked_imports_already_run_both_ways].
                        - The import rule over the graph starts as
                          advice, since imports already run both ways
                          between some parts
                          [_data/decision/dec_check_of_import_layering/ruling_check_of_import_layering.yaml
                          at brief].
                        - Under a transitive bound, every module in an
                          import cycle depends on every other, so all
                          of them must declare the same maturity
                          [origin/main:ddr/ddr_maturity.yaml at
                          decision, read with the cycles above].
                        - September rejected letting a module declare
                          a maturity its dependencies do not support
                          and reporting it as a note, because a claim
                          allowed to stand is one that will be
                          believed [origin/main:ddr/ddr_maturity.yaml
                          at alternative].
                        - The component option has the import rule
                          report a component that depends on one of
                          lower maturity, and the module option has a
                          check report a module that does
                          [_data/decision/dec_maturity_of_code/opt_maturity_on_each_logical_component.yaml
                          at brief, opt_maturity_on_each_module.yaml
                          at brief].
                        - ASSUMPTION: some of the packages in these
                          cycles belong to different logical
                          components once modules are given
                          components, since no edge from a module to a
                          component exists yet. Strength: moderate and
                          temporary. It holds against either maturity
                          option until the cycles are broken, and is
                          gone once they are. At ten times the size
                          the number of pairs that can form cycles
                          grows faster than the modules, so the cost
                          of making the bound refuse rises with it.

