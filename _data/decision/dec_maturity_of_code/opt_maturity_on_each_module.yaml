title:                  Maturity declared on each source file
brief:                  |
                        Each source file declares a maturity in its
                        own item: a Python module in the item of its
                        docstring, as September recorded, and the
                        equivalent file in each other supported
                        language in the same way. A file may not
                        declare a higher maturity than any file it
                        imports, directly or through another, and a
                        check reports one that does. A logical
                        component declares no maturity of its own: it
                        takes that of the most mature implementation
                        of it.

