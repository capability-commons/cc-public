title:                  Cost of the maturity bound
brief:                  |
                        The transitive bound needs no walk of
                        transitive imports. If every direct import
                        goes to code of equal or higher maturity,
                        every chain of imports does too, so one
                        comparison per import edge is enough. On
                        components the comparisons run over the edges
                        between 14 components rather than the imports
                        of 60 modules.
description:            |
                        Sources:
                        - September asks for a check that computes the
                          transitive imports of each module
                          [origin/main:ddr/ddr_maturity.yaml at
                          consequence].
                        - If each module's maturity is at most that of
                          each module it imports directly, the
                          relation holds along every chain, by
                          induction over the chain (reasoning, no
                          external source).
                        - The ruled import rule records imports as
                          facts, puts modules in logical components by
                          edges, states allowed dependencies as a
                          relation between components, and reports an
                          import that relation does not allow
                          [_data/decision/dec_check_of_import_layering/ruling_check_of_import_layering.yaml
                          at brief].
                        - Dev has 60 Python modules outside the test
                          folders, beside 11 package files, 71 Python
                          files in all [src/cctool, count of files
                          with an id_self beginning pym_ outside the
                          _test folders, measured by Claude in the
                          cloud container, 2026-10-28].
                        - There are fourteen logical component files
                          on dev [_data/logical_component/, one file
                          each].
                        - The component option lets modules take the
                          maturity of their component, bounds a
                          component by the components it depends on,
                          and has the import rule report a component
                          that depends on one of lower maturity
                          [_data/decision/dec_maturity_of_code/opt_maturity_on_each_logical_component.yaml
                          at brief].
                        - ASSUMPTION: every module declares a maturity
                          or takes one from its component, so no
                          module in a chain is without a value.
                          Strength: weak as a separator, since both
                          options cost milliseconds today. It holds at
                          ten times the size, since the cost stays
                          linear in import edges for modules and
                          linear in component edges for components,
                          and the component check reads only the facts
                          the import rule already extracts.

