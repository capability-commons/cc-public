title:                  No import cycle left to weaken a maturity ratchet
brief:                  |
                        ann_import_cycles_cap_a_transitive_maturity_bound
                        says a maturity bound read from imports can
                        only report until the import cycles between
                        packages are broken. They are broken: the
                        packages of cctool now import one another in
                        one direction only, so a bound read from
                        imports could refuse from the day it lands,
                        under either maturity option.
description:            |
                        The two imports that closed the cycle, of the
                        layout printer and of the release record by
                        the checker, are gone; both modules now live
                        in the checker [src/cctool/check/layout.py,
                        src/cctool/check/release_record.py]. Read with
                        ast over src, leaving out tests and fixtures,
                        no package reaches itself through its imports,
                        and no module does [measured by Claude in the
                        cloud container, 2026-10-28]. No check yet
                        keeps it so; the ruled import rule over the
                        graph would.

