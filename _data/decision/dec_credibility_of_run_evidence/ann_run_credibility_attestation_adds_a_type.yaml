title:                  An attestation type against one registered list
brief:                  |
                        An attestation item adds a type, a rule for
                        who may attest and upkeep as contexts of use
                        change, and the survey itself defers it until
                        a second decision reuses one simulation
                        variant. Critical questions add one list,
                        written once, that the advocates and the
                        verifier already have a step to work through.
description:            |
                        Sources:
                        - A new item type adds a prefix, a schema, a
                          register entry and a folder.
                          (_data/decision/dec_how_variants_are_held/ann_new_variant_type_adds_parts.yaml
                          lines 12-18)
                        - The survey ties attestation to who may rule,
                          sizes it "small to medium; defer", and sizes
                          the templates "small (guidance), medium (as
                          register entries)".
                          (_sources/survey/simulation-backed-decisions.md
                          lines 145 and 157)
                        - The advocate process already has a verifier
                          and a review step.
                          (_data/decision/dec_concern_advocate_process/ruling_concern_advocate_process.yaml
                          lines 16-20)
                        - Simplicity counts distinct mechanisms
                          introduced; cost counts development effort.
                          (_data/register/reg_concern.yaml lines
                          489-490 and 611-617) Strength: moderate; the
                          survey's size labels are judgments, not
                          measured effort.

