title:                  A level argued over at every run citation
brief:                  |
                        A level costs the advocate time that critical
                        questions cost, plus the argument over each
                        level claimed, and because a level can be
                        filled in without the work, each one invites a
                        challenge to settle.
description:            |
                        Sources:
                        - Levels "can be filled in without the
                          underlying work".
                          (_sources/survey/simulation-backed-decisions.md
                          line 175; _sources/survey/README.md line
                          146)
                        - The level is a claim that other annotations
                          may challenge.
                          (_data/decision/dec_credibility_of_run_evidence/opt_ordinal_credibility_level.yaml at brief)
                        - Cost asks how cost grows with use.
                          (_data/register/reg_concern.yaml at entries.concern_cost)
                        - Assumption: a claimed level draws at least
                          one challenge or reply per citation more
                          often than an answered question does.
                          Strength: moderate; it scales with run
                          citations and rests on an assumption about
                          how often levels are disputed.

