title:                  Review effort per cited run
brief:                  |
                        A level is a number a reviewer cannot check by
                        reading, so judging it means redoing the
                        assessment, and templates worked per citation
                        put one answer per question, up to one per V&V
                        40 factor, in front of a reviewer for every
                        run cited. An attestation is reviewed once per
                        variant and use, though it then reaches runs
                        nobody reviewed against it.
description:            |
                        Sources:
                        - Twelve V&V 40 credibility factors.
                          (https://www.imagwiki.nibib.nih.gov/sites/default/files/asme_vv_40_model_simulation_standard.pdf)
                        - The FDA guidance asks for a self-contained
                          credibility report, distinct from the study
                          results, and an adequacy plan before
                          results.
                          (https://www.fda.gov/media/175363/download,
                          read by the reviewability advocate)
                        - Scores "can be filled in without the
                          underlying work".
                          (_sources/survey/simulation-backed-decisions.md
                          line 175)
                        - Reviewability asks whether a person can read
                          a change in full and judge it, and whether
                          the rate of change stays reviewable.
                          (_data/register/reg_concern.yaml lines
                          524-526) Strength: strong at ten times the
                          runs, where per-citation templates scale
                          linearly and an attestation does not. The
                          cost advocate reads the same templates as
                          written once (see the annotation on an
                          attestation type).

