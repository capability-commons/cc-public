title:                  An attestation that outlives the graph it attested
brief:                  |
                        The attestation option carries an attestation
                        to later runs within its context of use, but a
                        variant's resolved graph changes when its
                        bases or operations change. An attestation
                        that does not name the resolved digest, and go
                        stale with it, then vouches for a graph nobody
                        attested.
description:            |
                        Sources:
                        - Later runs within the attested use carry the
                          attestation.
                          (_data/decision/dec_credibility_of_run_evidence/opt_suitability_attestation_item.yaml at brief)
                        - The resolved graph is derived from a base
                          and operations, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief) Strength: strong; attestations
                          matter once a variant is reused, and the gap
                          grows with commits to its bases.

