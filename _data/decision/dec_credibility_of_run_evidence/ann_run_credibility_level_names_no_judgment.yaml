title:                  A level that names none of its judgments
brief:                  |
                        A single level stands for many separate
                        judgments and names none of them, and the
                        annotation schema deliberately has no
                        confidence field. A level is then either a
                        schema change or a convention in prose that no
                        check holds.
description:            |
                        Sources:
                        - "There is no status, severity, category,
                          author, time, confidence or verdict field."
                          (_data/schema/sch_annotation.yaml lines
                          28-30)
                        - The V&V 40 framework rates twelve separate
                          factors.
                          (https://www.imagwiki.nibib.nih.gov/sites/default/files/asme_vv_40_model_simulation_standard.pdf)
                        - "A rule claims no more than something
                          holds." (_data/register/reg_design_rule.yaml
                          lines 47-51)
                        - Traceability counts elements with no traced
                          reason; simplicity asks whether a design
                          follows from decisions already made.
                          (_data/register/reg_concern.yaml lines 486
                          and 575) Strength: strong; the schema
                          conflict holds at any scale.

