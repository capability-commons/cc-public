title:                  An ordinal level as a claim open to challenge
brief:                  |
                        An ordinal level is a fair summary of
                        credibility when it is a claim that cites the
                        factors or questions behind it and that others
                        can challenge; the survey warns that a level
                        standing on its own is theater.
description:            |
                        Sources:
                        - NASA-STD-7009B levels run from "Level 0:
                          Insufficient evidence" to Level 4.
                          (https://www.validas.de/resources/glossary/nasa-std-7009b,
                          a secondary source)
                        - Levels "can be filled in without the
                          underlying work", and a credibility level
                          should be a claim that others can challenge,
                          citing evidence items.
                          (_sources/survey/simulation-backed-decisions.md
                          line 175)
                        - The level option has the interpreting
                          annotation claim a level that other
                          annotations may challenge.
                          (_data/decision/dec_credibility_of_run_evidence/opt_ordinal_credibility_level.yaml at brief) Strength: moderate; it supports
                          the level only as a claim that cites the
                          questions, not as a free-standing number.

