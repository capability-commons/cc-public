title:                  Run evidence that separates observed from bounded
brief:                  |
                        A run shows what happened under its inputs and
                        conditions, not what always will. The
                        questions put to run evidence should ask
                        whether a figure is an observed maximum, an
                        estimate or an analytical bound, which graph,
                        code, placement and probes ran, and over what
                        inputs. A run whose observed occupancy or
                        latency disagrees with the analysis shows that
                        the analysis does not apply, rather than a
                        number to widen.
description:            |
                        Sources:
                        - A latency analysis whose worst-case times
                          include communication and assume an acyclic
                          consistent graph cannot be established by a
                          measured fast run (Bamakhrama and Stefanov
                          2012, Managing latency in embedded streaming
                          applications under hard real-time
                          scheduling, section 4.1).
                        - Record the claim, exact graph and code
                          revision, lowered placement and transport,
                          target conditions, input envelope, method,
                          raw trace and exclusions; separate observed
                          maximum, estimated bound, analytical bound
                          and human acceptance (ChatGPT corpus
                          analysis, F-replay-evidence-debugging.md
                          section F2, 2026-10-28).
                        - The critical-question option registers
                          questions for run evidence that advocates
                          work through.
                          (_data/decision/dec_credibility_of_run_evidence/opt_critical_question_templates.yaml
                          at brief)

