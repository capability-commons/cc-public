title:                  Credibility traced factor by factor
brief:                  |
                        ASME V&V 40 lists separate credibility
                        factors, from code verification to
                        applicability to the context of use, and
                        critical questions drawn from them do the work
                        of judging a run, each answer tracing to the
                        evidence it cites. They give no threshold, and
                        they trace only if their answers are recorded.
description:            |
                        Sources:
                        - The V&V 40 framework lists twelve
                          credibility factors, from code verification
                          to applicability to the context of use, with
                          credibility thresholds set by a risk
                          assessment that guides the planned
                          activities, so that credibility is
                          "commensurate with the associated risk".
                          (https://www.imagwiki.nibib.nih.gov/sites/default/files/asme_vv_40_model_simulation_standard.pdf,
                          read by both advocates)
                        - The option is a registered list of critical
                          questions drawn from the V&V 40 factors,
                          worked through by advocates, with no level.
                          (_data/decision/dec_credibility_of_run_evidence/opt_critical_question_templates.yaml
                          lines 12-16)
                        - Traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml line 570)
                          Strength: moderate; it holds at any scale,
                          but only if answers are recorded as
                          annotations, which the option does not say.

