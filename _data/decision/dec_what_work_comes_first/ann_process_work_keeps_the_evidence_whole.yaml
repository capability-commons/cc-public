title:                  Work on the process keeps the evidence whole
brief:                  |
                        The records that show what passed and why,
                        such as gate results, exist only because work
                        on the process made them. Feature work done
                        first would land on evidence that is thinner
                        than the rules assume.
description:            |
                        Sources:
