title:                  A slow stage costs every commit of every agent
brief:                  |
                        A stage of the commit gate runs on every
                        commit by every agent, so a second saved there
                        is saved many times a day, while a feature
                        saves time only for the work that uses it.
description:            |
                        Sources:
                        - The commit gate keeps its stages only as
                          long as they are fast, and a slow stage is a
                          defect
                          [_data/requirement/rqt_commit_gate_omits_tests.yaml
                          at rationale].

