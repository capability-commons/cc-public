title:                  Process machinery is more to understand
brief:                  |
                        Each tool added to the process, such as the
                        queue, its hooks and its timers, is more for
                        an agent to understand and to keep working, so
                        putting the process first must still add only
                        what a real need asks for.
description:            |
                        Sources:
                        - Add a type, relation, field or command only
                          when a real instance needs it
                          [AGENTS.md#keep-it-small].

