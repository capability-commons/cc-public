title:                  What work comes first
brief:                  |
                        In what order is work on the process that
                        builds cc-public, and work on its features,
                        taken up?
description:            |
                        Many agents work on cc-public at once, and
                        each can choose between work on the product
                        and work on the process that builds it: the
                        gate, the landing queue, the tests and the
                        checks. A failing or flaky test, a slow stage
                        or a manual step holds up every agent, while a
                        missing feature holds up only the work that
                        needs it. WTP set the order on 2026-10-31.

