title:                  Process before features, with an Andon Cord
brief:                  |
                        A failing or flaky test stops the line until
                        it is fixed, work on the process comes before
                        feature work, and the graph improves itself
                        through rules, tests, evals and review.
                        Features before process is rejected. Ruled by
                        WTP on 2026-10-31.
description:            |
                        WTP ruled on 2026-10-31, in the thread where
                        the landing queue was built (WTP, 2026-10-31):
                        "I would also like to formalise something like
                        'The Andon Cord' system from the Toyota
                        Production System - we should fix flaky tests
                        and failing tests first - and prioritise work
                        that makes the development process systematic
                        and consistent and smooth and functional and
                        fast ABOVE feature development. Our guiding
                        KPI is speed of response to changing customer
                        requirements, and our fundamental thesis is
                        that this is achieved better with a MORE
                        mature process and tooling than a LESS mature
                        process and tooling."

                        In the same message, on how the process
                        improves itself (WTP, 2026-10-31): "We will
                        want to delete annotations that no longer
                        apply so we're not overwhelmed with them - but
                        I do want to be able to use the graph to be
                        able to reflect back on itself, so we bake
                        continual improvement into the process (guided
                        by logic rules to keep things consistent,
                        simulations and test cases to keep things
                        functional and operational, evals to keep
                        things governed with quantitative evidence,
                        and periodic review to incorporate general
                        knowledge and best practice)"

                        What this means for the work:
                        - A failing or flaky test stops the line. It
                          is fixed before any other work is started,
                          as a cord pulled on a production line stops
                          it until the fault is cleared. A patch that
                          goes to rework for a flaky test is fixed,
                          not resubmitted unchanged.
                        - Work that makes the process systematic,
                          consistent, smooth, functional and fast
                          comes before feature work.
                        - The measure is how quickly the project
                          responds to a change in what its users need.
                          The thesis is that a more mature process and
                          tooling responds faster than a less mature
                          one.
                        - The graph reflects on itself: logic rules
                          keep it consistent, simulations and test
                          cases keep it functional and operational,
                          evals govern it with quantitative evidence,
                          and periodic review brings in general
                          knowledge and best practice. An annotation
                          that no longer applies is removed, so that
                          the findings stay few enough to act on.

