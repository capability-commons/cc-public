title:                  Values that depend on the order in which writers take a lock
brief:                  |
                        Under shared write, what a reader sees depends
                        on the order in which writers took the lock,
                        which depends on timing, so the same inputs
                        can give different tokens from one run to the
                        next. A Kahn network is deterministic because
                        timing does not affect its results and each
                        channel has one writer and one reader. Replay,
                        simulation evidence and safety cases all rest
                        on getting the same tokens again. The other
                        two options keep the value on an edge fixed
                        once it is sent.
description:            |
                        Sources:
                        - In the shared-write option the order in
                          which writers take the
                          lock decides what readers see.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/opt_memory_token_with_shared_write.yaml
                          at brief)
                        - The timing or order of execution of the
                          processes of a Kahn
                          network must not affect the result, and a channel is not read
                          by more than one process or written by more than one.
                          (https://en.wikipedia.org/wiki/Kahn_process_networks)
                        - A Kahn network stays deterministic only if
                          no reader can see a
                          value change after it was sent.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/dec_how_a_value_is_carried_along_an_edge.yaml
                          at description)
                        - Re-running a cited scenario gives the same
                          tokens on every edge.
                          (_sources/mapping.md#what-i-understand-you-want)
                        - Safety cases rest on simulation at the small
                          scale.
                          (_sources/axair-orchestrator/docs/execution_levels.md#where-each-applies)
                        - Assumption: none. Strength: strong; it holds
                          for every shared
                          region, at any size.

