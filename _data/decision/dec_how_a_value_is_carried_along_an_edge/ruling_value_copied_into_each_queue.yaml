title:                  Value copied into each queue
brief:                  |
                        A value is copied into each queue it passes
                        through. Ruled by WTP on 2026-10-29, as
                        recommended, with a note: various sorts of
                        memory tokens are expected as exceptions, for
                        example to support shared read-only memory or
                        one writer at a time, with the exact
                        mechanisms to be discussed later.

