title:                  Tokens that fall back to copies where no memory is shared
brief:                  |
                        An execution unit may be a bare core or sit on
                        another host, where the two ends of an edge
                        share no memory. Because the leading option
                        keeps the value as the meaning and uses a
                        token only where an exception applies, an edge
                        placed across hosts simply copies, and the
                        same graph runs under every placement. Shared
                        write makes sharing part of what the graph
                        means, so a graph that relies on it cannot be
                        placed across hosts. Shared-memory transports
                        such as iceoryx need payloads with no pointers
                        to the memory of an OS process, which the
                        plain fixed-size data on every edge already
                        meets.
description:            |
                        Sources:
                        - An execution unit may be an OS process, a
                          thread or a core with
                          no operating system, each on a host.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/opt_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - Variants are generated by allocating nodes
                          to OS processes and
                          hosts.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml
                          at brief)
                        - Everything that crosses an edge is plain
                          data of fixed size.
                          (_sources/axair-orchestrator/docs/execution_levels.md#4-types-a-numpy-compatible-description)
                        - iceoryx payloads must lie wholly in shared
                          memory, with no
                          pointers to memory local to an OS process.
                          (https://docs.rs/iceoryx-rs)
                        - Assumption: none. Strength: strong; it holds
                          for every placement
                          variant.

