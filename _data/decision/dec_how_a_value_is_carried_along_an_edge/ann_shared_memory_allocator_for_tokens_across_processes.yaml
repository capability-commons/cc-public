title:                  Shared-memory allocator needed for tokens across OS processes
brief:                  |
                        Within one OS process a token needs only a
                        reference count the engine can keep itself.
                        Across OS processes on one host it needs
                        regions in shared memory and a way to hand
                        them out and take them back, which is either
                        engine code or a library such as iceoryx,
                        whose classic line is now in maintenance.
                        Copying needs neither. If the allocator sits
                        in transport nodes, the dependency stays with
                        them, but the source node's output buffer must
                        still be taken from it, which is engine work
                        under a recorded exception.
description:            |
                        Sources:
                        - The framework owns all memory and allocates
                          every output buffer.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - The transport between OS processes on one
                          host, ZeroMQ or a
                          shared-memory queue, is still open.
                          (_sources/axair-orchestrator/docs/execution_levels.md#5-transport-for-edges-not-yet-decided)
                        - iceoryx classic is in maintenance mode, and
                          iceoryx2 is
                          recommended for new projects.
                          (https://github.com/eclipse-iceoryx/iceoryx)
                        - iceoryx2 is licensed MIT OR Apache-2.0.
                          (https://docs.rs/iceoryx2/latest)
                        - Assumption: tokens are wanted across OS
                          processes, not only
                          within one. Strength: moderate; the dependency is one library
                          whatever the graph's size.

