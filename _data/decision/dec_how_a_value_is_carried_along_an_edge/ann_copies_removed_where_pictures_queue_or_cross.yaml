title:                  Picture copies removed where values queue, fan out or cross
brief:                  |
                        Within one execution unit a Kahn edge already
                        costs no copy, since an input points at the
                        upstream output buffer. Copies arise where a
                        value waits in a queue of several tokens,
                        crosses to another OS process on the same
                        host, or goes to a node that writes into it.
                        Patrol carries full-size pictures at 30 Hz,
                        and its overlay drawing node draws onto
                        pictures, the case where a moved region lets a
                        node write in place. Copying into each queue
                        pays a copy for each queue and picture; a
                        token pays none where it applies.
description:            |
                        Sources:
                        - Within an OS process an input points at the
                          upstream node's
                          output buffer itself, so an edge costs nothing.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - An edge may deliver every value in order up
                          to a stated
                          capacity.
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml
                          at brief)
                        - Patrol holds a 720p stream at 30 Hz.
                          (_sources/cc-patrol-notes/plan.md#4-the-engine-updated-2026-10-21-after-wills-answers)
                        - Patrol's overlay drawing node draws marks
                          onto pictures.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_overlay_draw.yaml
                          at brief)
                        - Assumption: a 720p NV12 picture is about 1.4
                          MB, so each copy
                          costs about 41 MB per second at 30 Hz. Strength: moderate;
                          nothing is measured yet, and the ruling on engine behavior asks
                          for a measurement before each exception.

