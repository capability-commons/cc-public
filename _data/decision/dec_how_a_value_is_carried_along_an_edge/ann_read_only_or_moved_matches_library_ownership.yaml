title:                  Read-only or moved, the rule the transport libraries follow
brief:                  |
                        GStreamer lets an element write a buffer only
                        when it holds the one reference, and copies on
                        demand otherwise; rclcpp hands a message with
                        no copy to one subscription that takes
                        ownership, shares it read-only among several,
                        and copies when ownership must go to more than
                        one; ZeroMQ takes ownership of a buffer handed
                        to it; iceoryx loans a sample that the
                        publisher fills and then publishes. A memory
                        token with the same two states maps onto each
                        of these, so a transport node can pass it
                        through, and replacing one library with
                        another does not change what nodes see. Shared
                        write matches none of them.
description:            |
                        Sources:
                        - A GStreamer buffer is writable only when its
                          reference count is
                          exactly 1, and making it writable copies only when needed.
                          (https://gstreamer.freedesktop.org/documentation/gstreamer/gstbuffer.html)
                        - In rclcpp intra-process communication a
                          unique pointer passes
                          with no copy to a single subscription; subscriptions taking
                          const shared pointers share one message; with two owners one
                          gets a copy.
                          (https://github.com/ros2/ros2_documentation/pull/6048/files)
                        - A ROS 2 loaned message is returned to the
                          middleware on publish,
                          and the design covers POD message types only.
                          (https://github.com/ros2/design/blob/gh-pages/articles/zero_copy.md)
                        - zmq_msg_init_data performs no copy and takes
                          ownership of the
                          buffer it is given.
                          (https://libzmq.readthedocs.io/en/latest/zmq_msg_init_data.html)
                        - An iceoryx publisher loans a sample and
                          publishes it.
                          (https://docs.rs/iceoryx-rs)
                        - The leading option names the same approach.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/opt_memory_token_read_only_or_moved.yaml
                          at description)
                        - Assumption: transport nodes are built on one
                          or more of these
                          libraries. Strength: strong; the rule is fixed once and does not
                          grow with the graph.

