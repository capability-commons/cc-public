title:                  Memory token, read-only once sent or moved
brief:                  |
                        The graph always means a value on each edge,
                        and the engine may carry it as a memory token
                        over a region of shared memory where a
                        recorded exception shows the copy costs more
                        than its budget. A region follows one of two
                        rules: read-only once sent, so several readers
                        may share it, or moved, so the sender gives it
                        up and one reader owns it. A node that would
                        write into a region it received must own it,
                        or is given a copy. Checks, replay and caching
                        see values only.
description:            |
                        Proposed to WTP on 2026-10-26; the same
                        approach as loaned samples in iceoryx, loaned
                        messages in ROS 2 and reference-counted
                        buffers in GStreamer.

