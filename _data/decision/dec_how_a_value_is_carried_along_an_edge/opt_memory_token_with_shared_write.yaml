title:                  Memory token with shared write under a lock
brief:                  |
                        Nodes pass memory tokens and may write into a
                        shared region while holding its lock, so no
                        value is ever copied. The order in which
                        writers take the lock decides what readers
                        see.
description:            |
                        The most copy-free form, given for comparison.

