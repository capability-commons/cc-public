title:                  In-place port that the node interface lacks
brief:                  |
                        The node interface passes inputs as read-only
                        pointers and outputs as buffers the engine
                        allocated, so no node writes into what it
                        received. A moved region pays off only if a
                        node such as Patrol's overlay drawing can take
                        its input region as its output, which needs
                        the interface to declare an input and an
                        output as one region, and the engine to give a
                        copy when the region is still shared. Until
                        the interface has that, the moved half of the
                        leading option has no user.
description:            |
                        Sources:
                        - Inputs are const pointers, and outputs point
                          at buffers the
                          framework allocated, written in place.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - A node that would write into a region it
                          received must own it,
                          or is given a copy.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/opt_memory_token_read_only_or_moved.yaml
                          at brief)
                        - Patrol's overlay drawing node draws onto
                          full-size pictures.
                          (_sources/cc-patrol-notes/draft/icd/icd_patrol_overlay_draw.yaml
                          at brief)
                        - Assumption: a moved region is wanted for
                          nodes that change a
                          large value in place. Strength: moderate; a one-time change to
                          the interface, needed only by such nodes.

