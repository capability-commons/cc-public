title:                  Fixed pool and exhaustion rule for regions held by readers
brief:                  |
                        A copied value sits in a queue of fixed
                        capacity, so its memory is bounded by
                        construction. A region carried as a token
                        stays in use until its last reader lets it go,
                        so a slow or stalled reader holds regions, and
                        the engine needs a fixed pool sized before the
                        system starts and a stated rule for when it
                        runs out: refuse the send, drop a value, or
                        wait. iceoryx bounds this with a maximum
                        number of samples a publisher may loan at
                        once. Neither token option states this yet.
description:            |
                        Sources:
                        - Every buffer has a size known before the
                          system starts, and
                          nothing is allocated on the heap while stepping.
                          (_sources/axair-orchestrator/docs/component_interface.md#5-variable-length-data-decided-2026-10-11-fixed-capacity)
                        - An iceoryx2 publisher has a maximum number
                          of samples it can
                          loan in parallel.
                          (https://docs.rs/iceoryx2/latest)
                        - A real application cannot have unbounded
                          FIFOs.
                          (https://en.wikipedia.org/wiki/Kahn_process_networks)
                        - The same need was argued where messages
                          become tokens in
                          ann_bounded_capacity_needed_where_messages_become_tokens.
                        - Assumption: readers may hold a region for
                          longer than one step.
                          Strength: strong; the exposure grows with fan-out and with how
                          long readers hold regions.

