title:                  Shared region that reaches across the boundary of an OS process
brief:                  |
                        An OS process used as an execution unit
                        contains a memory fault and keeps nodes of
                        different trust apart. A region shared by two
                        OS processes is memory both can reach: if the
                        reader's mapping is writable, a fault or a
                        hostile node in one process can change a value
                        the other has already checked. Read-only once
                        sent holds across OS processes only if the
                        receiver maps the region read-only, and within
                        one OS process it is only a const pointer.
                        When an OS process dies holding regions,
                        something must reclaim them; iceoryx runs a
                        daemon for this. Copying keeps each OS
                        process's memory its own, and shared write
                        gives every holder write access by design.
description:            |
                        Sources:
                        - An execution unit that is an OS process can
                          contain a crash and
                          keep nodes of different trust apart.
                          (ann_spread_execution_unit_as_containment_boundary)
                        - A node receives its inputs as const
                          pointers.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - The iceoryx daemon RouDi cleans up the
                          shared resources of an
                          application that ended abnormally.
                          (https://docs.rs/iceoryx-rs)
                        - Assumption: the operating system can map a
                          region read-only for
                          the receiver. Strength: moderate; it applies only to regions
                          shared between OS processes, not within one.

