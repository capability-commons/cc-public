title:                  Value on each edge kept as the meaning for checks and replay
brief:                  |
                        The leading option keeps a value on each edge
                        as the meaning of the graph and makes the
                        token a recorded exception of the engine, so
                        the checks, recorders and replay see values,
                        and an exception can be removed with no change
                        to any graph. Each use of a token is a
                        recorded decision with its measurement and
                        budget, so it can be found and reviewed. Under
                        shared write the value on an edge is not
                        defined apart from the lock order, so a
                        recorder must capture the order too and a
                        check cannot reason from edges alone.
description:            |
                        Sources:
                        - The graph always means a value on each edge,
                          and checks, replay
                          and caching see values only.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/opt_memory_token_read_only_or_moved.yaml
                          at brief)
                        - A behavior moves into the engine only with a
                          recorded decision
                          that holds the measurement and the budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief)
                        - Under shared write the lock order decides
                          what readers see.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/opt_memory_token_with_shared_write.yaml
                          at brief)
                        - Assumption: none. Strength: strong; the
                          meaning stays the same
                          at any size, and the number of recorded exceptions grows only
                          with the places a copy is too costly.

