title:                  Windows in engine-owned ring buffers
brief:                  |
                        Each edge's buffer is a ring the engine owns.
                        A writer acquires a window in it, writes in
                        place and commits; a reader acquires a window,
                        reads in place and releases it; a slow reader
                        makes the writer wait, so no pool is needed.
                        One writer or many readers hold a window at a
                        time, never both. A node's state may not hold
                        a window past a step, since the engine copies
                        and upgrades state. Only the engine and
                        transport node pairs move a value between
                        buffers. A pool stays a recorded exception,
                        for payloads too large for a ring where a
                        measurement shows it.
description:            |
                        A refinement of read-only or moved tokens from
                        the reading for part 2. Windowed FIFOs (Haid
                        et al. 2009) read and write a channel in place
                        and keep node code unchanged when placement
                        changes. The one-writer-or-many-readers rule
                        is that of linear types (Wadler 1990) and of
                        RustBelt (Jung et al. 2018); C++ cannot
                        enforce it, hence the engine and transport
                        nodes only. Wadler also shows that a copyable
                        value may not contain a linear one, which is
                        why state may not hold a window.

