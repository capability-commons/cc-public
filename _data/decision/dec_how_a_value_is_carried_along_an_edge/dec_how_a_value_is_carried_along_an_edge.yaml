title:                  How a value is carried along an edge
brief:                  |
                        Is a value copied into each queue it passes
                        through, or carried as a memory token that
                        guards a region of shared memory, and under
                        what rule?
description:            |
                        WTP expects engine exceptions that remove the
                        data copies a graph implies to become a theme:
                        rather than copying memory through queues,
                        guard regions of shared memory with memory
                        tokens and pass the tokens (WTP, 2026-10-26).
                        The ruling on where engine behavior lives
                        admits such a behavior only with a recorded
                        decision held to a measured budget. A Kahn
                        network stays deterministic only if no reader
                        can see a value change after it was sent.

