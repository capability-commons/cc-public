title:                  Switch of git identity that blocks commits until reset
brief:                  |
                        Under pseudonymous git identities, the change
                        that sets the new git_author makes the hooks
                        refuse the identity each person commits under
                        today. Every machine and agent session must be
                        set to the new identity and key before it can
                        commit or push again. The failure is loud and
                        recoverable, so the cost is a one time stop
                        rather than a lasting fault.
description:            |
                        Sources:
                        - Each person commits under a pseudonymous git
                          identity signed with a key that names no
                          person
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_and_git_identities.yaml
                          at brief).
                        - A commit is checked against the team members
                          that its own tree holds
                          (src/cctool/commit/history.py within check),
                          so the commit that changes a git_author is
                          itself checked against the new value.
                        - A team member entry holds one git_author
                          string
                          (_data/schema/sch_regentry_team_member.yaml
                          at properties.git_author).
                        - Measured 2026-10-28 in a scratch copy with
                          git_author set to a noreply identity:
                          author_violations from
                          src/cctool/commit/message.py refuses William
                          Payne <wtpayne@gmail.com>.
                        - Under full names and under names held
                          privately, people keep the git author they
                          use today
                          (_data/decision/dec_how_team_members_are_named/opt_members_named_by_full_name.yaml
                          at brief;
                          _data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_with_names_held_privately.yaml
                          at brief).
                        - ASSUMPTION: a new signing key that names no
                          person also has to be made and set on each
                          machine. Strength: weak, since the failure
                          is caught by the hooks and mended by setting
                          git config. It grows at ten times the size
                          with more people and machines, but stays a
                          one time cost per person.

