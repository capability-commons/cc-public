title:                  Public trace from member entry to person
brief:                  |
                        A member entry exists because a person
                        contributes. Under the full name option the
                        public graph traces each entry to that person.
                        Under both pseudonymous options the public
                        trace stops at a handle, and only a private
                        segment, which cc-public cannot reach, holds
                        the rest.
description:            |
                        Sources:
                        - Each team member data item stands for one
                          person who contributes
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_team_member.description).
                        - Both pseudonymous options hold the mapping
                          from handle to person only in a private
                          segment
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_with_names_held_privately.yaml
                          at brief;
                          _data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_and_git_identities.yaml
                          at brief).
                        - A reference may run within a segment or into
                          one it consumes, never upward or sideways
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          at brief), the option WTP upheld
                          (_data/decision/dec_references_across_instances/ruling_references_across_instances.yaml
                          at brief).
                        - A check reads the tree under its root and
                          what its segment consumes
                          (src/cctool/check/segment.py within union),
                          and cc-public consumes nothing
                          (_data/federated_segment/segment_cc_public.yaml
                          at brief), so a check of cc-public sees no
                          private register.
                        - A guid gives a stable pointer from a public
                          commit to a person for a reader with private
                          access
                          (_data/decision/dec_chat_contributor_attribution/ann_private_guid_gives_stable_trace_to_contributor.yaml
                          at brief).
                        - The concern asks whether each element can be
                          traced to the reason it exists
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question).
                          Strength: weak; WTP holds the private
                          segment, so the trace is whole for the one
                          person who rules, and the trace from commit
                          to entry is untouched. It holds at ten times
                          the size only for readers outside the
                          private segment, such as partners.

