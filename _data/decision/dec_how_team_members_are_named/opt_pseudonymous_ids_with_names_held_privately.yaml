title:                  Pseudonymous member ids with names held privately
brief:                  |
                        A team member id is the member prefix and an
                        opaque handle, and the entry in a public
                        register gives no name. The person's name is
                        held only in a register of a private segment,
                        which maps the handle to the name. Commits
                        keep the git author the person already uses.

