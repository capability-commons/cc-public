title:                  Real git author left in a public entry
brief:                  |
                        Under names held privately a member who
                        authors commits keeps the git author they
                        already use, and the author check needs that
                        author in a register the tree can read. So for
                        an authoring member the public entry still
                        gives a name and an email. Only pseudonymous
                        git identities take the name out of both the
                        entry and new commits.
description:            |
                        Sources:
                        - Names held privately keeps the git author
                          the person already uses
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_with_names_held_privately.yaml
                          at brief); pseudonymous git identities
                          commit under a chosen name and a noreply
                          address, with a key that names no person
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_and_git_identities.yaml
                          at brief).
                        - Measured 2026-10-28 in a scratch copy with
                          an opaque id and title but the git_author
                          William Payne <wtpayne@gmail.com> kept:
                          author_violations accepts that author, so
                          the name stays in the public entry.
                        - Today the only member who authors commits in
                          cc-public is WTP (WTP, 2026-10-25), whose
                          name is also in pyproject.toml at
                          project.authors.
                        - ASSUMPTION: the public key with id
                          9C4FB30F113CAB6A carries a user id that
                          names its owner, as OpenPGP keys commonly
                          do. Strength: weak today, since the one
                          authoring member is named everywhere anyway.
                          Moderate at ten times the size if other
                          people author commits in public trees.

