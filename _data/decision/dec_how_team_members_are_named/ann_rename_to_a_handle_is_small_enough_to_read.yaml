title:                  Rename to a handle small enough to read
brief:                  |
                        The public change that gives the one member a
                        handle is small enough for a person to read in
                        full. A dry run of cctool rename changes 17
                        lines in five files. The rename leaves the
                        title and description, which still name the
                        person, so they take a few more lines by hand,
                        and cctool check names the three citations
                        that the rename breaks. The reviewer has one
                        thing to catch that no check reports: the
                        rename keeps the old id, which is the full
                        name, as an alias in the public register.
description:            |
                        Sources:
                        - Measured 2026-10-28 in a scratch copy of the
                          snapshot: python3 -m cctool.cli.command
                          rename with --dry-run and PYTHONPATH=src,
                          from member_william_payne to a member id
                          made of the prefix and a short opaque
                          handle, prints a diff of 17 changed lines
                          across _data/register/reg_team_member.yaml
                          and four annotation files, and adds
                          member_william_payne under alias.
                        - Other text outside YAML documents, such as
                          python code, is not changed by a rename
                          (cctool rename --help, read 2026-10-28).
                        - The same dry run, rerun 2026-10-28 by the
                          verifier, leaves the title William Payne and
                          the description of the entry unchanged;
                          after the rename itself, cctool check
                          reports three unresolved_citation failures
                          and no other.
                        - A Contributor trailer names a member by
                          guid, not by id
                          (_data/register/reg_team_member.yaml at
                          description), so past trailers need no
                          change.
                        - Full names need no change today
                          (_data/decision/dec_how_team_members_are_named/opt_members_named_by_full_name.yaml
                          at brief).
                        - ASSUMPTION: the private register that maps
                          handles to names, and the change that lets
                          commit checks read it, come as further
                          changes of similar size. Strength: weak in
                          favor; it removes an objection rather than
                          giving a reason. At ten times the size each
                          new member is one small entry, but a later
                          rename of many named members grows with the
                          number of annotations that name them.

