title:                  Public register that unmasks the trailer guid
brief:                  |
                        A commit already names its contributor by a
                        guid, not by name. Under the full name option
                        anyone with a public clone maps that guid to a
                        full name in one lookup. Since every commit is
                        authored by WTP, a contributor other than WTP
                        is named in public only through the register,
                        so for them git does not already give the name
                        away.
description:            |
                        Sources:
                        - A commit names its contributor in a
                          Contributor trailer by the guid of their
                          team member entry, ruled by WTP on
                          2026-10-22
                          (_data/decision/dec_chat_contributor_attribution/ruling_chat_contributor_attribution.yaml
                          at brief).
                        - A guid that a separately held register maps
                          to a person is pseudonymized personal data
                          (_data/decision/dec_chat_contributor_attribution/ann_public_guid_stays_personal_data_while_key_exists.yaml
                          at brief).
                        - The entry a guid names gives a title, and
                          today that title is the full name
                          (_data/register/reg_team_member.yaml at
                          entries.member_william_payne).
                        - Every commit is authored by William Payne,
                          whoever drafted it, and agents add a
                          Co-Authored-By trailer (WTP, 2026-10-25;
                          AGENTS.md#before-you-finish).
                        - A member who authors no commits has no
                          git_author
                          (_data/schema/sch_regentry_team_member.yaml
                          at properties.git_author.description).
                        - Contributors are already identified by name
                          in git commits, so pseudonymity buys little
                          (WTP, 2026-10-28).
                        - ASSUMPTION: a contributor other than WTP
                          will supply content through a trailer rather
                          than author commits, as the rule above
                          implies. Strength: moderate; today the
                          register holds only WTP, so no one else is
                          exposed yet. It holds and grows at ten times
                          the size, since each new contributor is
                          named in public only by their entry, and
                          WTP's view that git already names them holds
                          only for WTP.

