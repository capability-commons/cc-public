title:                  Pseudonymous member ids and git identities
brief:                  |
                        A team member id is the member prefix and an
                        opaque handle, and each person also commits
                        under a pseudonymous git identity, such as a
                        GitHub noreply address with a chosen name,
                        signed with a key that names no person. The
                        mapping from handle to person is held only in
                        a private segment.

