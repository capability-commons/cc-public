title:                  Handle map held in one private copy
brief:                  |
                        Under pseudonymous git identities, only a
                        private segment records which person a handle
                        is, and nothing in the public record ties
                        them. If that segment is lost, the person
                        accountable for each public commit cannot be
                        recovered. Under names held privately, the git
                        author of each commit still names the person,
                        so most of the map can be rebuilt. Under full
                        names, the public record and its many copies
                        hold it.
description:            |
                        Sources:
                        - Under pseudonymous git identities, the
                          mapping from handle to person is held only
                          in a private segment
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_and_git_identities.yaml
                          at brief).
                        - Under names held privately, commits keep the
                          git author the person already uses
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_with_names_held_privately.yaml
                          at brief).
                        - Every commit is authored by William Payne,
                          the accountable person, whoever drafted it
                          (WTP, 2026-10-25).
                        - A Contributor trailer names a member by the
                          guid of their entry
                          (_data/register/reg_team_member.yaml at
                          description).
                        - cc-public is public on GitHub, and cc-patrol
                          is private and local (WTP, 2026-10-21).
                        - ASSUMPTION: a private local segment has
                          fewer copies than a public repository, and
                          may have no copy off the machine that holds
                          it.
                        - ASSUMPTION: under names held privately, a
                          handle can be matched to a person through
                          the git author of the commits whose
                          Contributor trailer names it, for members
                          who author commits. Strength: moderate. With
                          one person today the map is easy to
                          remember, so the risk is small. At ten times
                          the size, with many handles and partners'
                          people, losing the private copy loses
                          accountability for public history with no
                          way back under pseudonymous git identities.

