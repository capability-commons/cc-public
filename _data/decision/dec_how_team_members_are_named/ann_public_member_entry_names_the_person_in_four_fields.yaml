title:                  Full name in four fields of a public member entry
brief:                  |
                        Under the full name option a public member
                        entry holds the person's name in its id,
                        title, description and git_author, and their
                        email in git_author. No check reads the id,
                        title or description for anything a handle
                        could not give. Both pseudonymous options hold
                        the same entry with fewer personal data
                        fields, so they meet data minimization better.
description:            |
                        Sources:
                        - The entry member_william_payne holds the
                          name in its id, its title and its
                          description, and holds a name and an email
                          in its git_author
                          (_data/register/reg_team_member.yaml at
                          entries.member_william_payne).
                        - Every entry in the public register is public
                          (_data/register/reg_team_member.yaml at
                          note).
                        - The commit checks read only the guid,
                          git_author and git_signing_key of an entry
                          (src/cctool/commit/message.py within
                          _members, _authors and _signing_keys).
                        - Measured 2026-10-28 in a scratch copy of the
                          snapshot: after cctool rename of
                          member_william_payne to an opaque handle id
                          and a title and description that name no
                          one, the author William Payne and the key
                          9C4FB30F113CAB6A are still accepted by
                          author_violations and signature_violations
                          in cctool.commit.message.
                        - The concern draws on ISO/IEC 29100, whose
                          principles include data minimization, and
                          counts personal data fields held
                          (_data/register/reg_concern.yaml at
                          entries.concern_privacy.note and
                          entries.concern_privacy.measure). Strength:
                          strong as a count, since it is measured; it
                          grows at ten times the size, as each
                          publicly named member adds four name fields
                          to a register that ships with every release.

