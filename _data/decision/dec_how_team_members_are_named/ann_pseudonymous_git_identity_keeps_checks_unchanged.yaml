title:                  Pseudonymous git identities that fit the checks as they are
brief:                  |
                        Of the two pseudonymous options, only
                        pseudonymous git identities keep one place
                        that maps a member to the identity git
                        records. The public entry gives the
                        pseudonymous git_author and key, and the
                        commit checks work unchanged. The name lives
                        only in the private mapping, so no job is done
                        twice in the public tree.
description:            |
                        Sources:
                        - Under this option each person commits under
                          a pseudonymous git identity, signed with a
                          key that names no person, and the mapping
                          from handle to person is held only in a
                          private segment
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_and_git_identities.yaml
                          at brief).
                        - The signing check matches the key id or
                          fingerprint only, not a name on the key
                          (src/cctool/commit/message.py within
                          signature_violations).
                        - The git_author pattern accepts any name and
                          email in the form Name <email>
                          (_data/schema/sch_regentry_team_member.yaml
                          at properties.git_author). Strength:
                          moderate. It is a comparison with names held
                          privately, not with full names, which need
                          no mapping at all. It holds at ten times the
                          size, since each member is still one public
                          entry.

