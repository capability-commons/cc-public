title:                  Team members named by their full name
brief:                  |
                        A team member entry takes its id and title
                        from the person's full name, as today, and
                        records their git author and signing key. A
                        person who must not be named in public is held
                        in the team member register of a private
                        segment instead, as the register's note says.

