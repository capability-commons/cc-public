title:                  Team members named by their full name
brief:                  |
                        A team member entry takes its id and title
                        from the person's full name, and records their
                        git author and signing key. Contributors who
                        author commits are named by git anyway, and
                        WTP is named throughout the code by its
                        copyright lines. Pseudonymous ids alone would
                        weaken the author check without hiding anyone,
                        and full pseudonymity costs traceability and
                        adds new mechanisms. A person who must not be
                        named in public is held in the team member
                        register of a private segment. Ruled by WTP on
                        2026-10-28.

