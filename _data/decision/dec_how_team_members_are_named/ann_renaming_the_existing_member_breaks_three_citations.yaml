title:                  Citations broken by renaming the existing member
brief:                  |
                        Either pseudonymous option means renaming
                        member_william_payne to a handle. The guid
                        stays, so trailers still resolve, but three
                        annotations cite the entry by its id and lose
                        that citation. The full name option leaves
                        every citation as it is.
description:            |
                        Sources:
                        - Measured 2026-10-28 in a scratch copy of the
                          snapshot: after cctool rename of
                          member_william_payne to an opaque handle id,
                          cctool check reports three
                          unresolved_citation failures, in
                          ann_private_members_held_in_the_peer,
                          ann_people_of_one_name_clash_across_sibling_peers
                          and
                          ann_inverse_member_register_keeps_private_people_private,
                          each citing entries.member_william_payne.
                        - The fix the check gives is to name the part
                          as the file now holds it, or to cite the
                          commit that held it as REV:PATH (cctool
                          check output, same run).
                        - Measured 2026-10-28 in the same copy: the
                          guid of the entry is unchanged, and a
                          Contributor trailer that names it is still
                          accepted. Strength: weak; it is a one-off
                          cost of three edits, measured. At ten times
                          the size the count of citations by member id
                          grows, so a later switch costs more than one
                          made now.

