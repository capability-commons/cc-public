title:                  A name held privately and in git_author at once
brief:                  |
                        Under names held privately, the public entry
                        must still give the git_author the person
                        commits under, which is their name and email.
                        So the private register maps the handle to the
                        name, and the public git_author maps it again,
                        and one job is done by two mechanisms.
                        Dropping git_author from the public entry to
                        avoid this turns the author check off for the
                        whole tree.
description:            |
                        Sources:
                        - Under this option commits keep the git
                          author the person already uses
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_with_names_held_privately.yaml
                          at brief).
                        - The author check reads only the register
                          whose id is reg_team_member, in the tree
                          being checked and what it consumes
                          (src/cctool/commit/message.py within
                          author_violations and _authors;
                          src/cctool/check/segment.py within union).
                        - An entry is closed to any field that the
                          register entry and team member shapes do not
                          declare
                          (_data/schema/sch_reg_team_member.yaml at
                          description), and the team member shape adds
                          only git_author and git_signing_key
                          (_data/schema/sch_regentry_team_member.yaml
                          at properties), so a private mapping from
                          handle to name has no field of its own and
                          needs a new field, relation or second entry.
                        - A register that gives no git_author checks
                          nothing (src/cctool/commit/message.py within
                          author_violations); today the register holds
                          one entry, so dropping its git_author turns
                          the author check off for the whole tree.
                          Strength: strong, since it follows from the
                          check code as it stands. It holds at ten
                          times the size, as each member adds one more
                          name held in two places.

