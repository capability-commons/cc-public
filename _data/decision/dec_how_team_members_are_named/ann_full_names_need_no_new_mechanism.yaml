title:                  No new mechanism under full names
brief:                  |
                        Naming members by full name adds no mechanism,
                        because it is how the register, its schema and
                        the commit checks work today. The schema
                        already lets a member choose a pseudonym as
                        their title, and the register note already
                        sends a person who must not be named in public
                        to a private register. So the two pseudonymous
                        options add mechanisms for a job that existing
                        ones already cover for those who want it.
description:            |
                        Sources:
                        - Today the entry id and title come from the
                          person's name, as in member_william_payne
                          (_data/register/reg_team_member.yaml at
                          entries.member_william_payne).
                        - The title of a team member entry is the name
                          the member chooses to be known by, which may
                          be a pseudonym
                          (_data/schema/sch_regentry_team_member.yaml
                          at description).
                        - The id pattern for a team member is the
                          member prefix and any lower-case snake case
                          words, with nothing tying it to a name
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_team_member.regex_id).
                        - A member who should not be named in public
                          is held in the team member register of a
                          private repository instead
                          (_data/register/reg_team_member.yaml at
                          note).
                        - Measured 2026-10-28 in a scratch copy of the
                          snapshot: an entry given an opaque id and
                          title, with its guid kept, raises no schema
                          or id failure under python3 -m
                          cctool.cli.command check. Strength: strong
                          as a count of mechanisms, since this option
                          adds none and the others add at least a
                          private mapping. It holds at ten times the
                          size, as each new member is one entry of the
                          shape that exists today.

