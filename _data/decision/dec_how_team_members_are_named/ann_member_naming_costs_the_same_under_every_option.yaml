title:                  Equal check cost under every naming option
brief:                  |
                        The full check and the read the commit checks
                        rely on take the same time under all three
                        options. A member lookup scans one small
                        register by guid, git_author and signing key,
                        and the form of those values does not change
                        the work. Full names win only because they
                        need no change at all to what was measured.
description:            |
                        Sources:
                        - Measured 2026-10-28 in scratch copies of the
                          snapshot, one per option, with python3 -m
                          cctool.cli.command check --root . run with
                          PYTHONPATH=src: the full check took 14.9 s
                          with full names, 14.4 s with names held
                          privately and 14.8 s with pseudonymous git
                          identities.
                        - Measured 2026-10-28 in the same copies,
                          timing cctool.check.segment.union over five
                          calls: 131 ms, 128 ms and 128 ms per call.
                        - The commit checks find members by a scan of
                          the one register whose id is
                          reg_team_member, reading guid, git_author
                          and git_signing_key
                          (src/cctool/commit/message.py within
                          _members, _authors and _signing_keys).
                        - The register holds one entry today
                          (_data/register/reg_team_member.yaml at
                          entries). Strength: weak; the costs are
                          equal. The spread between runs is within
                          run-to-run noise, and at ten times the size
                          the lookup still scans a register of a few
                          dozen entries, which is small next to the
                          union read.

