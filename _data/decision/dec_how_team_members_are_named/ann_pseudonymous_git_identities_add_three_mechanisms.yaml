title:                  Mechanisms added by pseudonymous git identities
brief:                  |
                        Pseudonymous git identities add a second git
                        identity per person, a signing key that names
                        no person, and a private mapping from handle
                        to person. For WTP the name still appears in
                        the copyright line of nearly every file, so
                        hiding it would need a fourth mechanism for
                        copyright strings. Full names need none of
                        these.
description:            |
                        Sources:
                        - The option asks each person to commit under
                          a pseudonymous git identity, with a key that
                          names no person, and holds the mapping only
                          in a private segment
                          (_data/decision/dec_how_team_members_are_named/opt_pseudonymous_ids_and_git_identities.yaml
                          at brief).
                        - Every commit is authored by William Payne,
                          the accountable person, whoever drafted it
                          (WTP, 2026-10-25).
                        - The copyright line is Copyright 2026 William
                          Payne (WTP, 2026-10-21).
                        - Measured 2026-10-28 with grep over the
                          snapshot, leaving out __pycache__: 3828 of
                          3851 files hold the string Copyright 2026
                          William Payne.
                        - ASSUMPTION: a contributor who is not WTP and
                          wants pseudonymity can already have it under
                          full names, by a pseudonymous title and
                          git_author in a public entry or by an entry
                          in a private register. Strength: moderate
                          today, with one member whose name is public
                          in copyright strings anyway. At ten times
                          the size it weakens if many contributors
                          want pseudonymity, since the mechanisms are
                          paid once, and strengthens if few do.

