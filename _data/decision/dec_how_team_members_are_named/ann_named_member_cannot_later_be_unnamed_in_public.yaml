title:                  Removal of a name once it is public
brief:                  |
                        A member named in public under the full name
                        option cannot later be fully unnamed. A rename
                        keeps the old id, the full name, as an alias
                        in the entry, it breaks the citations of the
                        entry by its old id whether or not the alias
                        stays, and released copies and git history
                        keep the old entry. Under either pseudonymous
                        option a request from a member who authors no
                        commits to remove their name is met by
                        deleting the private mapping.
description:            |
                        Sources:
                        - cctool rename keeps the old id of a register
                          entry as an alias (cctool rename --help, run
                          2026-10-28 in a scratch copy of the
                          snapshot).
                        - Measured 2026-10-28 in a scratch copy:
                          cctool rename of member_william_payne to an
                          opaque handle id leaves alias
                          member_william_payne in the entry, and with
                          or without that alias cctool check reports
                          three unresolved_citation failures, whose
                          fix offers to cite the commit that held the
                          part as REV:PATH.
                        - A release ships the whole of _data
                          (_data/decision/dec_what_data_a_release_ships/ruling_what_data_a_release_ships.yaml
                          at brief), and every peer and the package
                          host keep a copy of a published package that
                          the maintainer cannot withdraw
                          (_data/decision/dec_how_peers_get_cc_public/ann_published_package_cannot_be_recalled.yaml
                          at brief).
                        - A name in public history can be erased only
                          by rewriting history in every clone
                          (_data/decision/dec_chat_contributor_attribution/ann_public_guid_stays_personal_data_while_key_exists.yaml
                          at brief;
                          _data/decision/dec_chat_contributor_attribution/ann_name_in_public_commit_cannot_be_removed.yaml
                          at brief).
                        - Erasure of pseudonymized data means deleting
                          the private mapping
                          (_data/decision/dec_chat_contributor_attribution/ann_public_guid_stays_personal_data_while_key_exists.yaml
                          at brief).
                        - The concern measures the time to fulfill a
                          request to remove data, in days
                          (_data/register/reg_concern.yaml at
                          entries.concern_privacy.measure). Strength:
                          moderate; it does not help WTP, whose name
                          is already public under every option, but
                          for a later member the time to remove falls
                          from never to one private edit. It holds at
                          ten times the size, with more releases and
                          clones holding each named entry.

