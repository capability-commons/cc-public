title:                  Core that consumes nothing
brief:                  |
                        With directional consumption cc-public
                        consumes nothing, so it never depends on a
                        partner, and a partner changes only itself and
                        what consumes it.
description:            |
                        The rule of the September iteration
                        (origin/main of cc-public, tag
                        baseline_20260918) (ddr/ddr_segment.yaml
                        there). With one aggregated set, a change in
                        any instance can change what every other
                        instance's references resolve to.

