title:                  Multi-root check needed for segments
brief:                  |
                        Segments need a check over several roots at
                        once, which cctool does not have, and a way to
                        name what a repository consumes.
description:            |
                        cctool check reads one tree. Neither a segment
                        type nor a consumption relation exists here
                        yet. Both have to be built before the first
                        partner can refer to cc-public.

