title:                  Consumer that checks the union
brief:                  |
                        A consumer's gate checks its own items
                        together with everything it consumes, so every
                        reference it makes resolves there.
description:            |
                        In the September iteration (origin/main of
                        cc-public, tag baseline_20260918), the
                        process-word check resolved a verb against the
                        registers its segment could see: its own and
                        those it consumed (ddr/ddr_segment.yaml
                        there).

