title:                  Consumption like a dependency
brief:                  |
                        Consuming a segment works like depending on a
                        package: a partner takes a version of
                        cc-public and checks against it, which
                        partners already know how to do.
description:            |
                        ASSUMPTION: partners will pin the cc-public
                        they consume, as with pixi.lock here. One
                        aggregated set has no version a partner can
                        pin.

