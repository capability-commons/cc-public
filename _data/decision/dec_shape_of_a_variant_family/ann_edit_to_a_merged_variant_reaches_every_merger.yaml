title:                  Edit to a merged variant that reaches every variant that merges it
brief:                  |
                        An edit to a [[dataflow variant]] that others
                        merge reaches each of them and their
                        descendants, as a [[base]] edit does, so a
                        variant gains a second kind of dependent
                        beside its children. Additions that conflict
                        with nothing arrive silently, and only a
                        conflict fails, at the merge.
description:            |
                        Sources:
                        - A variant family is a directed acyclic graph
                          of dataflow variants, each built from the
                          dataflow variants it names.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Including built-on variants gives one
                          variant children and includers, so an edit
                          for its children also changes every
                          includer.
                          (_data/decision/dec_shape_of_a_variant_family/ann_family_built_on_variant_as_parent_and_mixin.yaml
                          at brief)
                        - A base edit can change variants that were
                          not edited with no failure.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/ann_base_edit_silently_changes_leaf_states.yaml
                          at brief)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                          Strength: moderate; the spread is the point
                          of reuse, and the checks on each variant
                          meant to run catch a spread that breaks it.
                          It grows with merges.

