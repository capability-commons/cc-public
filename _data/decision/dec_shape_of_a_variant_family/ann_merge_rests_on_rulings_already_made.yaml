title:                  Merge built from rulings already made
brief:                  |
                        The merge option needs no rule of its own for
                        matching or for conflict: it matches by the
                        merge keys every list must declare, identifies
                        a dataflow edge by its ends, names each
                        [[variant operation]] by an id with a guid,
                        and lets a conflict fail the merge's
                        preconditions, all ruled today. It adds one
                        variant operation, where included delta
                        modules add an item type, an include field, an
                        order rule and a conflict table.
description:            |
                        Sources:
                        - The option rests on the rulings that every
                          variant operation states its preconditions,
                          that a dataflow edge is identified by its
                          ends, and that every list of the graph
                          schema declares a merge key.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at description)
                        - Those rulings and the one naming each
                          operation by an id with a guid were made by
                          WTP on 2026-10-25.
                          (_data/decision/dec_preconditions_of_variant_operations/ruling_every_operation_states_its_preconditions.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief;
                          _data/decision/dec_merge_keys_of_graph_schema_lists/ruling_merge_key_declared_for_every_list.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_variant_operation/ruling_operation_named_by_id_with_guid.yaml
                          at brief)
                        - The earlier argument against several bases
                          found no merge or conflict rule drafted.
                          (_data/decision/dec_shape_of_a_variant_family/ann_merged_bases_need_rules_not_yet_drafted.yaml
                          at brief)
                        - Included delta modules add a delta module
                          type, an include field, an order rule and a
                          conflict check.
                          (_data/decision/dec_shape_of_a_variant_family/ann_single_base_adds_no_mechanism_to_the_ruling.yaml
                          at brief)
                        - The dataflow graph schema declares no merge
                          key yet.
                          (_data/schema/sch_dataflow_graph.yaml at
                          allOf.2.properties)
                        - Simplicity asks whether a choice follows
                          from decisions already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2)
                          Strength: strong against several bases as
                          first drafted, moderate against a single
                          base, which adds nothing at all; the rulings
                          are made but not yet built.

