title:                  Two-way merge that restores what one side removed
brief:                  |
                        The option does not say what a merge does with
                        an element only one side holds, or against
                        which common [[base]] it compares. Two
                        [[dataflow variants]] of the Patrol base share
                        its nodes, so a merge that takes the union
                        would, merging a lab variant built on the base
                        into Legion, bring back the second decoder and
                        every node Legion's filter removed, which
                        fails Legion's checks. A three-way merge
                        against the nearest common base, as git's
                        merge is, tells a removal from an addition.
description:            |
                        Sources:
                        - A merge brings a second dataflow variant
                          into the one being built, matching nodes,
                          edges and list entries by their merge keys;
                          most variants build on one base.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - The Patrol base holds 22 nodes for every
                          platform and output mode, and Legion removes
                          the L4T decoder, console, video out, tracks
                          out, relay and remote command nodes by one
                          filter.
                          (_sources/cc-patrol-notes/draft/README.md#files;
                          _sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          at operation)
                        - A node the base declares keeps its id in
                          every variant, so variants of one root share
                          node ids.
                          (_sources/cc-patrol-notes/variants.md#2-proposal-for-cc-public)
                        - Both decoders feed the analysis branch in
                          the base, the input-fed-twice fault of a
                          superset graph.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at dataflow_edge; src/cctool/check/check.lp
                          within input_fed_twice)
                        - git merge-base finds the best common
                          ancestors of two commits to use in a
                          three-way merge.
                          (https://code.googlesource.com/git/+/v1.6.1/Documentation/git-merge-base.txt)
                        - The earlier argument against several bases
                          found that every node two bases share
                          arrives twice.
                          (_data/decision/dec_shape_of_a_variant_family/ann_merged_bases_need_rules_not_yet_drafted.yaml
                          at brief)
                        - Functional suitability asks whether the
                          design does anything it should not.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.3)
                          Strength: strong as the option is worded; it
                          falls away if the merge is defined three-way
                          against the nearest common base, or limited
                          to dataflow variants with no base in common.

