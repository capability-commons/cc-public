title:                  A conflict table by operation kind alone
brief:                  |
                        Two included deltas conflict when they touch
                        the same element, not when they are of the
                        same kind, so a table of kinds alone would
                        flag every pair of writes, even to different
                        settings, unless it also compares the
                        addressed element, which needs the merge keys
                        of the open decision on lists. And a variant's
                        own operations come after its includes so that
                        they can override them; flagging those as
                        conflicts would refuse a deliberate override.
description:            |
                        Sources:
                        - Two operations that touch the same element
                          give different products in different orders,
                          so a check is asked for operations from
                          different included deltas that touch the
                          same key, unless an order is declared
                          between them.
                          (_sources/survey/product-lines.md line 323)
                        - The option fails a variant where a delta and
                          the variant's own operations conflict by a
                          table of operation kinds.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas_checked_for_conflicts.yaml,
                          brief)
                        - Included deltas apply before the variant's
                          own operations.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas.yaml,
                          brief)
                        - Henshin reports binary conflicts first and
                          finer reasons later.
                          (https://wiki.eclipse.org/Henshin/Conflict_and_Dependency_Analysis,
                          as summarized in
                          _sources/survey/generative-and-transforms.md
                          lines 22-23) Strength: strong; false
                          conflicts by kind grow roughly with the
                          square of the operations in included deltas.
                          The option is sound once the conflict is
                          defined by kind and addressed element and
                          the variant's own list counts as ordered
                          after its includes.

