title:                  Keyed merge as partner tools already do it
brief:                  |
                        Matching entries by a key and refusing a
                        second entry with a key already held, unless
                        told to merge, is close to what Kustomize does
                        with resources, so a partner can reproduce the
                        merge from the keys the schema declares. A
                        second system to integrate becomes a
                        [[dataflow variant]] merged in, with no copy
                        of its nodes.
description:            |
                        Sources:
                        - A merge matches nodes, edges and list
                          entries by their merge keys, and a second
                          system to integrate is a dataflow variant
                          merged in.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Kustomize tracks a resource by its original
                          id, and refuses a generated resource whose
                          id a base already holds unless its behavior
                          is merge or replace.
                          (https://github.com/kubernetes-sigs/kustomize/issues/4829)
                        - Every list of the graph schema declares a
                          merge key.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/ruling_merge_key_declared_for_every_list.yaml
                          at brief)
                        - An SSP connection names its two ends, as a
                          dataflow edge identified by its ends does.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_partner_formats_name_connections_by_ends.yaml
                          at brief)
                        - Compatibility asks what a partner must adopt
                          to read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.2)
                          Strength: moderate; the partner still needs
                          the rule for an element one side holds, and
                          for settling a conflict, which the option
                          has to state.

