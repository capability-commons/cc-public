title:                  An included delta as a second or third form of one reusable list
brief:                  |
                        An included delta item is a named, ordered
                        list of variant operations, as a composite
                        operation is and as an abstract intermediate
                        variant already is in the Patrol drafts.
                        Upholding included deltas alongside composites
                        gives one job three mechanisms; even alone, it
                        adds a second form beside the abstract variant
                        the ruling already allows.
description:            |
                        Sources:
                        - An included delta is a named item holding an
                          ordered list of variant operations, applied
                          before the variant's own.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_delta_modules.yaml at brief)
                        - A composite is "a named, reusable list of
                          core operations" that "adds no semantics of
                          its own".
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml at brief)
                        - The abstract Orin variant holds the filter
                          and the two writes its three child variants
                          share.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 18-32;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 29-32)
                        - The ruling allows a variant to be the base
                          of another.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The measure for simplicity counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure)
                          Strength: strong if composites are also
                          upheld; moderate alone, since an abstract
                          variant cannot be mixed into branches the
                          way an included item can.

