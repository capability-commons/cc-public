title:                  Cross-cutting features copied into each leaf of a tree
brief:                  |
                        A pure tree factors out what siblings share
                        through an abstract parent, but not a choice
                        that cuts across branches, such as lab logging
                        on both Legion and Orin variants, which is
                        then written into each leaf; the copies can
                        drift, a change touches every copy, and no one
                        item holds why the feature exists. With
                        included deltas the feature and its reason sit
                        in one item, and which variants include it is
                        a query; Kustomize hit this limit and added
                        included components.
description:            |
                        Sources:
                        - The decision names the combination "a
                          platform plus video output plus lab
                          logging".
                          (_data/decision/dec_shape_of_a_variant_family/dec_shape_of_a_variant_family.yaml at description) The owner wants composition to
                          generate product lines. (owner's statement,
                          2026-10-24,
                          _sources/owner-2026-10-24-late.md line 3)
                        - The abstract Orin variant holds what all
                          headless Orin variants share.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 14-19)
                        - Leaves already repeat tag exclusions, across
                          branches as well as between siblings: relay
                          and console are excluded by separate filters
                          in the Legion, Orin tracks and Orin video
                          drafts.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          line 25, dfv_patrol_orin_tracks.yaml line
                          22, dfv_patrol_orin_video.yaml line 23)
                        - Kustomize records that "modular applications
                          cannot always be expressed in a tall
                          hierarchy", and its components are reusable
                          pieces that distinct overlays mix and match,
                          where order matters. (KEP-1802,
                          https://www.kubernetes.dev/resources/keps/1802/)
                        - In industrial clone-and-own, fixes are
                          propagated by hand. (Dubinsky et al. 2013,
                          https://people.csail.mit.edu/mjulia/publications/An_Exploratory_Study_of_Cloning_in_Industrial_Software_Product_Lines_2013.pdf,
                          as summarized in
                          _sources/survey/product-lines.md lines
                          116-118)
                        - The maintainability measure counts parts
                          touched by a representative change.
                          (_data/register/reg_concern.yaml at entries.concern_maintainability.measure)
                        - ASSUMPTION: Patrol will gain a cross-cutting
                          choice such as lab logging; no draft holds
                          one today. Strength: weak to moderate at
                          Patrol's present size; strong at ten times
                          the variants with two or more independent
                          features, since copies multiply as leaves
                          times features.

