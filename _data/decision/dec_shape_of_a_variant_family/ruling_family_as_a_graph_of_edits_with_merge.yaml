title:                  Family as a directed acyclic graph of edits, with merge as one operation
brief:                  |
                        A variant family is a directed acyclic graph
                        of edits, and a merge is one atomic variant
                        operation that selects the dataflow variants
                        to merge and carries the commands that join
                        edges between them, so that dataflow variants
                        with no common element merge without a
                        three-way merge against a common base. Which
                        side wins a conflict, such as two upstream
                        dataflow variants using the same port of the
                        same node, is to be worked through during
                        implementation. Ruled by WTP on 2026-10-26,
                        with the merge reworded as WTP described.

