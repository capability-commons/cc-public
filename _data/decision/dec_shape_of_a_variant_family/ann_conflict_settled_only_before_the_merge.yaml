title:                  Conflict that only an operation before the merge can settle
brief:                  |
                        A conflict is settled only by an operation
                        earlier in the [[operation list]], so to keep
                        a value of its own against a merged-in one a
                        dataflow variant must first write its side to
                        the incoming value, merge, then write its own
                        value back; a write after the merge comes too
                        late. Delta-oriented programming settles such
                        a clash by order or by a further delta module,
                        after the fact.
description:            |
                        Sources:
                        - The merge's preconditions fail unless an
                          earlier operation in the list settles it.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - In delta-oriented programming conflicts on
                          one class are resolved by the ordering, or
                          prohibited at the price of writing further
                          delta modules for the combinations.
                          (Schaefer et al., SPLC 2010,
                          https://iris.unito.it/bitstream/2318/79356/1/main.pdf)
                        - Maintainability asks how readily a newcomer
                          can understand the design.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.0)
                        - ASSUMPTION: settling means making the two
                          sides agree, by a write or a removal on the
                          receiving side; the option does not say.
                          Strength: weak to moderate; the extra write
                          is short, but its only reason is to let the
                          merge pass, which a reader must know. It
                          falls away if a merge may name the keys on
                          which its receiving side wins.

