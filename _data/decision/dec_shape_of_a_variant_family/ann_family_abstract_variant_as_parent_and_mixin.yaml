title:                  An abstract variant that is both a parent and an included unit
brief:                  |
                        Including abstract variants gives one abstract
                        variant two kinds of dependent, children that
                        build on it and variants that include it, so
                        an edit made for its children also changes
                        every includer, which the tree does not show.
                        Against a single base it still adds the
                        include field, the order rule and the conflict
                        handling that included deltas need, and gives
                        abstract a second role.
description:            |
                        Sources:
                        - Each variant names one base and may include
                          abstract variants, whose operations apply
                          before its own.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_including_abstract_variants.yaml,
                          brief)
                        - The abstract Orin variant is an unrunnable
                          parent with three children.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 18-19;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - Two deltas touching one key give different
                          graphs by order. (_sources/survey/README.md
                          line 141)
                        - One maintainability question asks how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml line 395)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: moderate to strong; the overlap of
                          roles is structural, and the hidden reach
                          grows with abstract variants used both ways.

