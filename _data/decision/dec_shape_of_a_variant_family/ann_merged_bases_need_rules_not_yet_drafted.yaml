title:                  Merge and conflict rules that several bases need
brief:                  |
                        Several bases merged means two resolved
                        graphs, in Patrol always of one root, are
                        combined, so every node they share arrives
                        twice and a conflict rule picks the survivor.
                        No such rule is drafted, the ruling speaks of
                        a tree of variants of one base, a change in
                        one base can silently change how every child
                        merges, and unless the merge records which
                        base won, an element's reason is the outcome
                        of a rule rather than an item.
description:            |
                        Sources:
                        - "composing operations gives a tree of
                          variants of one base".
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The merged option needs "rules for merging
                          and for conflicts" and makes the family a
                          directed acyclic graph.
                          (_data/decision/dec_shape_of_a_variant_family/opt_several_bases_merged.yaml at brief) No such rules exist in the
                          drafts or the study.
                          (_sources/variants-framing.md lines 92-94)
                        - Every Patrol variant has the Patrol base at
                          the root of its chain, and a node the base
                          declares keeps its id in every variant.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34;
                          _sources/cc-patrol-notes/variants.md lines
                          79-82)
                        - Two operations that touch one key give
                          different products in different orders.
                          (_sources/survey/product-lines.md line 323;
                          Haber et al.,
                          https://arxiv.org/pdf/1408.5756, section
                          4.1, give each delta module an optional
                          application-order constraint but do not
                          state this result themselves)
                        - The simplicity question asks whether a
                          choice follows from decisions already made.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.question)
                          Strength: strong; more variants mean more
                          merged pairs, more shared elements and more
                          conflicts.

