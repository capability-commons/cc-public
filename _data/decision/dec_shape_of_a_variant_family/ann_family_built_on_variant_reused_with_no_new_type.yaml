title:                  The ruled variant type reused as the included unit
brief:                  |
                        Including abstract variants reuses the variant
                        type the ruling already gives, so it adds no
                        item type, prefix, schema, register entry or
                        folder, one mechanism fewer than included
                        delta items.
description:            |
                        Sources:
                        - The included unit is the existing variant
                          type, with no new item type.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_including_built_on_variants.yaml,
                          brief)
                        - A new item type adds a prefix, a schema, a
                          register entry and a folder.
                          (_data/decision/dec_how_variants_are_held/ann_new_variant_type_adds_parts.yaml,
                          brief)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.0)
                          Strength: strong as a comparison with
                          included deltas, at any scale; it does not
                          hold against a single base per variant,
                          which adds nothing.

