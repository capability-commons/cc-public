title:                  Merge that fails on conflict, and so does not depend on order
brief:                  |
                        Since two sides that give one key different
                        values fail the merge instead of the later one
                        winning, a merge that succeeds gives the same
                        graph whichever [[dataflow variant]] is merged
                        into which, the commutativity the model
                        merging literature asks of a merge.
                        Delta-oriented programming gets the same
                        result by requiring unordered delta modules to
                        be compatible. Included delta modules applied
                        in a stated order let the order decide
                        instead.
description:            |
                        Sources:
                        - Where both sides give one key different
                          values, the merge's preconditions fail
                          unless an earlier operation settles it.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Brunet et al. list commutativity,
                          associativity and idempotency among the
                          ideal properties of a merge, and a merge
                          takes a relationship between the models,
                          which here the merge keys give. (Brunet,
                          Chechik, Easterbrook, Nejati, Niu and
                          Sabetzadeh, A manifesto for model merging,
                          GaMMa 2006,
                          https://homepages.uc.edu/~niunn/papers/GAMMA06.pdf)
                        - In delta-oriented programming, delta modules
                          not ordered by after clauses must be
                          compatible, no class added or removed in
                          more than one, and the partial order ensures
                          that all compatible application orders
                          generate the same product. (Schaefer,
                          Bettini, Bono, Damiani and Tanzarella,
                          Delta-oriented programming of software
                          product lines, SPLC 2010,
                          https://iris.unito.it/bitstream/2318/79356/1/main.pdf)
                        - FeatureHouse superimposes trees by merging
                          nodes identified by name and type, composes
                          terminal nodes by rules for each language,
                          and notes that the order of elements can
                          matter. (Apel, Kastner and Lengauer,
                          FeatureHouse, ICSE 2009,
                          https://www.se.cs.uni-saarland.de/publications/docs/ICSE2009fh.pdf)
                        - Included delta modules make the resolved
                          graph depend on the order of inclusion where
                          two touch one key.
                          (_data/decision/dec_shape_of_a_variant_family/ann_inclusion_order_as_a_new_source_of_faults.yaml
                          at brief)
                        - Functional suitability asks whether each
                          function gives the right result;
                          maintainability asks how readily a change
                          can be checked.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0
                          and
                          entries.concern_maintainability.question.2)
                          Strength: moderate to strong; the merge
                          still sits at a place in an ordered list, so
                          it is order free only with respect to its
                          two sides, and only if an element held by
                          one side is treated alike from either side.

