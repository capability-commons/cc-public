title:                  Several bases as another way to factor cross-cutting choices
brief:                  |
                        A variant that merges a platform base with a
                        feature base also writes a cross-cutting
                        choice once instead of in every leaf, so the
                        several-bases option answers the same limit of
                        a pure tree, though at the price of the merge
                        rules it still lacks.
description:            |
                        Sources:
                        - A pure tree repeats a choice that cuts
                          across branches, and Kustomize added
                          included components for this reason.
                          (KEP-1802,
                          https://www.kubernetes.dev/resources/keps/1802/)
                        - A variant may name several bases, merged
                          before its own operations apply.
                          (_data/decision/dec_shape_of_a_variant_family/opt_several_bases_merged.yaml
                          lines 13-17)
                        - The decision names combinations such as a
                          platform plus video output plus lab logging.
                          (_data/decision/dec_shape_of_a_variant_family/dec_shape_of_a_variant_family.yaml
                          lines 17-25) Strength: weak; both advocates
                          rank it below included deltas, which give
                          the same factoring without a merge.

