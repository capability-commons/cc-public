title:                  One base and one list as the ruling already gives them
brief:                  |
                        The ruling already gives a variant one base
                        and one ordered list, composing into a tree,
                        so a single base per variant adds no mechanism
                        to it. Included delta modules add a delta
                        module type, an include field, an order rule
                        and a conflict check.
description:            |
                        Sources:
                        - A variant holds a base and an ordered list
                          of operations, and composing them gives a
                          tree of variants of one base.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - A new item type adds a prefix, a schema, a
                          register entry and a folder.
                          (_data/decision/dec_how_variants_are_held/ann_new_variant_type_adds_parts.yaml at brief)
                        - Two operations touching one element give
                          different products in different orders, so
                          included delta modules need a conflict check.
                          (_sources/survey/product-lines.md line 323,
                          warning 13; Haber et al.,
                          https://arxiv.org/pdf/1408.5756, section
                          4.1, give each delta module an optional
                          application-order constraint but do not
                          state this result themselves)
                        - The simplicity question asks whether a
                          choice follows from decisions already made.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.question)
                          Strength: strong for now; it weakens if
                          independent features multiply.

