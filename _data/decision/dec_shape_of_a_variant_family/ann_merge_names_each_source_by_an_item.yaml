title:                  Merge that names each source by an item with its reason
brief:                  |
                        Every piece a merge brings in, a trait model,
                        a reusable piece or a second system, is a
                        [[dataflow variant]] with its own id, guid and
                        reason, and the merge itself is a
                        [[variant operation]] named by an id with a
                        guid. So which variants draw on a piece is a
                        query over merges, and a conflict failure can
                        name the merge and the key.
description:            |
                        Sources:
                        - A trait model, or a second system to
                          integrate, is a dataflow variant merged in.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Each variant operation is named by an id
                          with a guid.
                          (_data/decision/dec_identity_of_a_variant_operation/ruling_operation_named_by_id_with_guid.yaml
                          at brief)
                        - Removing an absent node or adding one that
                          exists fails resolution with a report naming
                          the operation.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_every_operation_states_its_preconditions.yaml
                          at brief)
                        - Traceability asks whether each need traces
                          to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1)
                          Strength: moderate; included delta modules
                          give the same trace to a named item, so this
                          weighs mainly against several bases as first
                          drafted, where an element's reason is the
                          outcome of a rule.

