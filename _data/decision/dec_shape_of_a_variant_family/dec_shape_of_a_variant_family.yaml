title:                  Shape of a variant family
brief:                  |
                        Does a dataflow variant build on exactly one
                        base, so that a variant family is a tree, or
                        may it draw on several?
description:            |
                        The ruling says composing variant operations
                        gives a tree of variants of one base, and the
                        owner on 2026-10-24 wants that composition to
                        generate product lines and simulations;
                        combinations such as a platform plus video
                        output plus lab logging raise whether a
                        variant may combine more than one source of
                        operations (_sources/variants-framing.md,
                        section 4, Q2).

