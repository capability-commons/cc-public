title:                  One chain of origins per resolved element
brief:                  |
                        With one base, and with one base plus deltas
                        applied in a stated order, every resolved
                        element has a single chain of origins from
                        base to final operation, which an origin
                        record can follow. The condition is that,
                        where two included deltas touch one key, the
                        record names both operations.
description:            |
                        Sources:
                        - Included deltas are applied in a stated
                          order before the variant's own.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas.yaml at brief)
                        - The ruling gives a variant one base and an
                          ordered list of operations.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - Two included deltas that touch one key give
                          different graphs in different orders.
                          (_sources/survey/README.md lines 65-68 and
                          141) Strength: strong; it holds at any size
                          as long as the origin record is built.

