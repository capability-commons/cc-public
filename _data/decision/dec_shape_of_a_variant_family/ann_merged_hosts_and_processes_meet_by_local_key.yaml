title:                  Hosts and OS processes of two merged systems that meet by local key
brief:                  |
                        Dataflow node ids are qualified by the item
                        that declares them, so two systems of
                        different roots never match a node by
                        accident. Hosts and OS processes are keyed
                        only by short local names, such as station and
                        main in Patrol, so a second system merged in
                        that also has a host named station shares it
                        when the hostnames agree and fails when they
                        differ, and the merge cannot tell a meant
                        share from a clash of names.
description:            |
                        Sources:
                        - A trait model, or a second system to
                          integrate, is a dataflow variant merged in,
                          matching by merge keys.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Hosts and OS processes are keyed by a short
                          local name.
                          (_data/schema/sch_dataflow_graph.yaml at
                          allOf.2.properties.host.description and
                          allOf.2.properties.os_process.description)
                        - Patrol names its host station and its OS
                          process main; the smoke test names localhost
                          and main_process.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at host and os_process;
                          8a40b7e7:_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                          at host and os_process)
                        - A node keeps the id its declaring item gives
                          it, and a node a variant adds is named after
                          the variant.
                          (_sources/cc-patrol-notes/variants.md#2-proposal-for-cc-public;
                          _sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          at operation)
                        - Compatibility asks whether the design can
                          read and use what a partner produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.1)
                          Strength: moderate; it is fixed by
                          qualifying hosts and OS processes by their
                          graph, or by a rename in the merge, either
                          of which the option does not yet state.

