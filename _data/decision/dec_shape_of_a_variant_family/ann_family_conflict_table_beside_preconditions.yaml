title:                  A conflict table beside preconditions that already catch part of it
brief:                  |
                        The conflict-check option adds a table for
                        every pair of operation kinds and a check.
                        With preconditions, a delete-then-use conflict
                        already fails at resolution, because removing
                        or naming an absent node fails, so the table
                        would duplicate that part and add only the
                        write-write case, where the last writer wins,
                        a narrower check than a full table.
description:            |
                        Sources:
                        - The option checks conflicts by a table of
                          operation kinds that conflict or depend.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas_checked_for_conflicts.yaml,
                          brief)
                        - The precondition option fails removing an
                          absent node or adding one that exists.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_every_operation_states_its_preconditions.yaml,
                          brief)
                        - Null-as-delete and last-writer-wins hide
                          intent.
                          (_sources/survey/generative-and-transforms.md
                          line 154)
                        - The simplicity measure counts jobs done by
                          more than one mechanism.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.1)
                          Strength: moderate; the table grows with the
                          square of operation kinds, and the overlap
                          holds only if preconditions are ruled.

