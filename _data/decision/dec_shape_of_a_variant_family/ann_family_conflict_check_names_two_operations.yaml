title:                  A conflict check that names the two operations that meet
brief:                  |
                        The conflict check moves the order fault of
                        included delta modules from a reader's eye to
                        a check at the gate that reports one unit's
                        operation against another's, the condition the
                        earlier traceability annotation set for an
                        origin record. Its upkeep is a table of
                        operation-kind pairs, about 55 for ten kinds,
                        revised with each new kind, and it holds only
                        while operations have stable names.
description:            |
                        Sources:
                        - Included delta modules make the resolved
                          graph
                          depend on the order of inclusion where two
                          touch one key.
                          (_data/decision/dec_shape_of_a_variant_family/ann_inclusion_order_as_a_new_source_of_faults.yaml,
                          brief)
                        - Where two included delta modules touch one
                          key, the
                          origin record must name both operations.
                          (_data/decision/dec_shape_of_a_variant_family/ann_one_chain_of_origins_per_resolved_element.yaml,
                          brief)
                        - A check that reports binary conflicts can be
                          one clingo rule, and the table is small for
                          ten operations.
                          (_sources/survey/generative-and-transforms.md
                          line 114)
                        - The study's core has ten operations, and ten
                          kinds give 45 distinct pairs plus 10
                          same-kind pairs.
                          (_sources/variants-framing.md line 94;
                          arithmetic)
                        - A failure naming the third operation
                          addresses it by position.
                          (_data/decision/dec_identity_of_a_variant_operation/dec_identity_of_a_variant_operation.yaml,
                          description) Strength: moderate to strong;
                          possible conflicts grow with the square of
                          included units, the table with the square of
                          operation kinds, not with variants.

