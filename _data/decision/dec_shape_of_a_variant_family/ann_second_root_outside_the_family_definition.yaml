title:                  Second root outside the registered sense of a variant family
brief:                  |
                        A [[variant family]] is registered as all the
                        [[dataflow variants]] built on one root, but a
                        second system or a trait model written whole
                        and merged in brings a second root, so under
                        this option a family can have several roots
                        and the definition, and the resolved dataflow
                        graph's, which follows bases only, must
                        change.
description:            |
                        Sources:
                        - A variant family is all the dataflow
                          variants built, directly or in turn, on one
                          root dataflow variant, and it need not stay
                          a tree. (_data/register/reg_concept.yaml at
                          entries.concept_variant_family.brief and
                          entries.concept_variant_family.description)
                        - A resolved dataflow graph applies the
                          operation lists of the variant and of each
                          base beneath it.
                          (_data/register/reg_concept.yaml at
                          entries.concept_resolved_dataflow_graph.brief)
                        - A dataflow variant may be a dataflow graph
                          written whole, as the root of the family.
                          (_data/register/reg_concept.yaml at
                          entries.concept_dataflow_variant.brief)
                        - A trait model, or a second system to
                          integrate, is a dataflow variant merged in.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - WTP ruled the variant terms today and asked
                          that the tree be brought into line with them
                          (WTP, 2026-10-25).
                          (_data/decision/dec_names_for_variants/ruling_qualified_terms_with_clashes_resolved.yaml
                          at brief)
                        - Simplicity asks whether a choice follows
                          from decisions already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2)
                          Strength: weak to moderate; the change is
                          two definitions, but it reopens terms ruled
                          the same day.

