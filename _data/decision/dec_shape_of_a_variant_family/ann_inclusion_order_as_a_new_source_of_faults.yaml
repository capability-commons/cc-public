title:                  Order of inclusion as a new source of faults
brief:                  |
                        Included deltas make the resolved graph depend
                        on the order of inclusion wherever two deltas
                        touch one key, so a check must be built and
                        kept up to date before they land. A single
                        base has no such order to keep right.
description:            |
                        Sources:
                        - Included deltas are applied in a stated
                          order before the variant's own.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas.yaml at brief)
                        - Two deltas touching one key give different
                          graphs by order. (_sources/survey/README.md
                          line 141; Haber et al.,
                          https://arxiv.org/pdf/1408.5756, section
                          4.1, give each delta an optional
                          application-order constraint but do not
                          state this result themselves) Strength:
                          moderate; it grows with the number of
                          included deltas per variant.

