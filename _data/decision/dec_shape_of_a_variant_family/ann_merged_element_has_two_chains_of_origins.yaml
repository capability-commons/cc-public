title:                  Merged element with two chains of origins
brief:                  |
                        After a merge an element held by both sides
                        has two chains of origins, and an element
                        brought in has the merge as the last
                        [[variant operation]] that produced it, so a
                        trace of the last producing operation names
                        the merge and not the reason in the merged
                        [[dataflow variant]]. The trace has to follow
                        into the merged side's chain, which a single
                        base never needs.
description:            |
                        Sources:
                        - With one base every resolved element has a
                          single chain of origins.
                          (_data/decision/dec_shape_of_a_variant_family/ann_one_chain_of_origins_per_resolved_element.yaml
                          at brief)
                        - One option traces the operation that last
                          produced each part, another every operation
                          that touched it.
                          (_data/decision/dec_origin_trace_of_a_resolved_graph/opt_trace_of_the_last_producing_operation.yaml
                          at brief;
                          _data/decision/dec_origin_trace_of_a_resolved_graph/opt_trace_of_every_touching_operation.yaml
                          at brief)
                        - A merge is one more variant operation that
                          brings a second dataflow variant in.
                          (_data/decision/dec_shape_of_a_variant_family/opt_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                          Strength: moderate; it grows with merges per
                          variant, and falls away if the trace records
                          every touching operation through both
                          chains.

