title:                  Single base that may include abstract variants
brief:                  |
                        Each dataflow variant names one base and may
                        include abstract dataflow variants, whose
                        operations apply in a stated order before its
                        own. The included unit is the existing variant
                        type, with no new item type.
description:            |
                        Proposed by the simplicity and maintainability
                        advocate (_sources/four-decisions-argued.md
                        line 795).

