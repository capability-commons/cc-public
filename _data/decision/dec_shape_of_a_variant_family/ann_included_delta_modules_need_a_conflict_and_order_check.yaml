title:                  Included delta modules that are right only with a conflict check
brief:                  |
                        Included delta modules compose without a
                        merge, since each is applied to one chain in a
                        stated order, but they give the right result
                        only if two included delta modules that touch
                        one element are caught or ordered on purpose.
                        Without that check the order of inclusion
                        silently decides the graph; with it, and with
                        a check that a variant does not include
                        itself, the option is sound.
description:            |
                        Sources:
                        - Included delta modules are applied in a
                          stated
                          order before the variant's own.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_delta_modules.yaml at brief)
                        - The survey asks for a conflict check before
                          included delta modules land.
                          (_sources/survey/README.md lines 65-68 and
                          141)
                        - A check that reports binary conflicts can be
                          written as one clingo rule.
                          (_sources/survey/generative-and-transforms.md
                          line 114)
                        - A variant that includes itself is a cycle
                          that a check can catch.
                          (_sources/variants-framing.md line 94)
                          Strength: strong as a condition; the number
                          of possible conflicts grows roughly with the
                          square of the number of included delta modules.

