title:                  An included abstract variant written against its own base
brief:                  |
                        An abstract variant names a base of its own,
                        and its operations were written against that
                        chain: the Orin variant writes the station
                        host and the analysis profile of the Patrol
                        base. Included into a variant with another
                        chain, those addresses may not exist and a
                        failure in them points at an item whose stated
                        base is wrong for that use, and the option
                        does not say whether inclusion applies only
                        the included list or its whole chain. It gives
                        the right result only if inclusion applies the
                        list alone and the included variant's base
                        lies on the including variant's chain.
description:            |
                        Sources:
                        - The abstract Orin variant has the Patrol
                          base as base, speaks for headless Orin
                          configurations only, and writes the station
                          hostname and the analysis profile.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 13-32)
                        - Under the option an included abstract
                          variant's operations apply in a stated order
                          before the including variant's own, with no
                          new item type.
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_including_built_on_variants.yaml,
                          brief)
                        - In the sketch, a write to an undeclared
                          address fails.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          line 49) Strength: moderate; mismatched
                          chains grow with included units and bases,
                          and the point vanishes if the option is
                          narrowed as proposed in the merge notes.

