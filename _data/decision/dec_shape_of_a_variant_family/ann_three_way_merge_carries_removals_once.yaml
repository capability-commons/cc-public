title:                  Three-way merge that writes a shared removal once
brief:                  |
                        If the merge compares both sides with their
                        common [[base]], a merged-in
                        [[dataflow variant]] carries what it removed
                        as well as what it added, so a choice that
                        cuts across branches, such as no relay and no
                        console, now removed by separate filters in
                        three leaves, can be written once and merged.
                        A merge that only adds or agrees cannot factor
                        a removal, which included delta modules can.
description:            |
                        Sources:
                        - Relay and console are removed by separate
                          filters in the Legion, Orin tracks and Orin
                          video drafts.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          at operation;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_tracks.yaml
                          at operation;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_video.yaml
                          at operation)
                        - A pure tree copies a cross-cutting choice
                          into each leaf, and included delta modules
                          hold it in one item.
                          (_data/decision/dec_shape_of_a_variant_family/ann_cross_cutting_features_copied_in_a_tree.yaml
                          at brief)
                        - git merge-base finds the common ancestor for
                          a three-way merge.
                          (https://code.googlesource.com/git/+/v1.6.1/Documentation/git-merge-base.txt)
                        - The maintainability measure counts parts
                          touched by a representative change.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure.1)
                          Strength: moderate, and conditional: it
                          holds only with a three-way rule the option
                          does not yet state, and the three copies in
                          Patrol are short.

