title:                  Named delta items as units that peers can share
brief:                  |
                        A partner such as an SSP tool receives whole
                        resolved structures, so the family shape does
                        not show at that boundary. Between peers, a
                        named delta item is a unit one peer can
                        publish and another include, whereas a pure
                        tree makes a peer copy the operations, and
                        merging bases from two peers puts conflict
                        rules across two owners.
description:            |
                        Sources:
                        - SSP variants are whole alternative SSD files
                          with one default.
                          (https://ssp-standard.org/docs/2.0,
                          chapter 3) The resolved graph is derived and
                          checked under every option.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - Peers take cc-public as a versioned package,
                          and Patrol code will live in cc-patrol, a
                          private federated peer.
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml at title and brief; owner's statement, 2026-10-21,
                          paraphrased in _sources/context.md line 9)
                        - Kustomize components are reusable, ordered
                          transformations that an overlay includes.
                          (KEP-1802,
                          https://www.kubernetes.dev/resources/keps/1802/)
                        - References across federated repositories use
                          segments with directional consumption, ruled
                          but not yet built.
                          (_data/decision/dec_references_across_instances/ruling_references_across_instances.yaml at brief) ASSUMPTION: a variant in a peer
                          may include a delta item from a segment the
                          peer consumes. Strength: weak now, with one
                          peer and no shared delta; moderate with
                          several peers.

