title:                  Single base with included deltas
brief:                  |
                        Each dataflow variant names one base and may
                        include named delta items, each an ordered
                        list of variant operations, applied in a
                        stated order before its own, much as Nix
                        overlays or the application order of delta
                        modeling work.

