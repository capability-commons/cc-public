title:                  Delta module inputs and merge refusal needing no per-operation list
brief:                  |
                        The two needs the decision names beyond the
                        implied pair already have homes of their own.
                        A delta module declares its inputs, so
                        applying it is one operation whose
                        preconditions follow from the module it names,
                        as an add's follow from the key it names. A
                        merge that refuses conflicting inputs has that
                        refusal as a precondition of the merge itself,
                        which the resolver checks like any other.
                        Neither needs a written list on each
                        operation, so the implied option covers both
                        once the schema of the core states what
                        applying a module and merging require; written
                        extras would be a second way to state the same
                        thing.
description:            |
                        Sources:
                        - A delta module is a named subgraph of
                          variant operations with
                          declared inputs and parameters, applied like a single variant
                          operation to whatever is wired into it.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_one_reuse_item.yaml at brief)
                        - Refusing a conflict adds no mechanism, being
                          a precondition of
                          the merge that the resolver already checks.
                          (_data/decision/dec_conflict_between_merged_variants/ann_merge_conflict_as_a_failed_precondition.yaml at brief)
                        - One open option refuses a merge whose inputs
                          disagree.
                          (_data/decision/dec_conflict_between_merged_variants/opt_conflicting_merge_refused.yaml at brief)
                        - The extras option names the declared inputs
                          of a delta module as
                          its example.
                          (_data/decision/dec_how_an_operation_states_its_preconditions/opt_implied_preconditions_with_written_extras.yaml at brief)
                        - The simplicity measure counts jobs done by
                          more than one
                          mechanism.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure)
                        ASSUMPTION: a declared input of a delta module
                        states what it must be wired to, such as the
                        interface a node must present. Strength:
                        moderate; it fails if
                        dec_conflict_between_merged_variants upholds a
                        rule for each conflict written on each merge,
                        which would be a written extra in all but
                        name.

