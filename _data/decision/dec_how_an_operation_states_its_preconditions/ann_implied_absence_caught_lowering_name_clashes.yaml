title:                  Implied absence that caught clashes in generated operations
brief:                  |
                        In the review's probes of the trial, an
                        author's node named like a control block
                        passed the resolved check, and lowering's add
                        of its own control block then stopped with a
                        report naming the lowering operation: the
                        implied absence of an add guarded generated
                        operations with no code in lowering. The same
                        trial shows the cost of implying them in code
                        written for each kind: write and join checked
                        less than their references needed, so a write
                        could make a unit on a host that does not
                        exist, which no check caught, and a join
                        checked its nodes but not their ports, leaving
                        a bad port to the later check of the graph.
                        Implied preconditions stay complete only if
                        they follow from the schema, for example that
                        an added key is absent and every reference the
                        element holds resolves, rather than being
                        coded by hand for each kind.
description:            |
                        Sources:
                        - Authored nodes named like the nodes lowering
                          adds pass the
                          resolved check, and lowering then fails because the node is
                          already there. (review of 2026-10-29, CC-041, detail TM-12, with
                          the probe log areas/trial-model-logs/p21_names.out; trial
                          2c777ab9, src/cctool/dataflow/resolve.py, function _add_node)
                        - A write of a unit with a host that does not
                          exist passes every
                          check. (review of 2026-10-29, CC-041, detail TM-12)
                        - The trial's join checks that the nodes at
                          its ends exist, not
                          their ports; in the review's probe a join to a port that does
                          not exist resolved, and the check of the graph then reported it
                          as an unknown port. (trial 2c777ab9,
                          src/cctool/dataflow/resolve.py, function _join; review of
                          2026-10-29, areas/trial-model-logs/p05_resolver.out)
                        - Under the implied option the schema of the
                          core states the
                          preconditions of each kind once.
                          (_data/decision/dec_how_an_operation_states_its_preconditions/opt_preconditions_implied_by_the_kind.yaml at brief)
                        - An end of a dataflow edge names its node and
                          port as references,
                          so the checker finds an end that names nothing.
                          (_data/schema/sch_dataflow_graph.yaml at description)
                        ASSUMPTION: the schema of the core can mark
                        which fields of an element are references, as
                        the id and guid pairs of the graph schema
                        already are. Strength: moderate; it shows
                        implied preconditions working for generated
                        operations, and that their completeness
                        depends on deriving them from the schema.

