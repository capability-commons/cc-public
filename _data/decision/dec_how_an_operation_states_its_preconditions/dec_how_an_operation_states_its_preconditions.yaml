title:                  How an operation states its preconditions
brief:                  |
                        Every variant operation states what it must
                        find and what must be absent. Are those
                        preconditions implied by the kind of
                        operation, or written on each operation?
description:            |
                        ruling_every_operation_states_its_preconditions
                        rules that each operation states them, and
                        rqt_resolver_stops_at_failed_precondition has
                        resolution stop at the first that fails.
                        Nothing says how they are written. The trial
                        implementation of 2026-10-29 implied them by
                        kind: what an operation names must exist, and
                        what it adds must not (trial process log,
                        phase 1). A merge of dataflow variants that
                        conflict may need more than that
                        (dec_conflict_between_merged_variants), and so
                        may a delta module, whose inputs are declared.

