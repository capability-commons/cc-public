title:                  Required preconditions that are exactly the pair a kind implies
brief:                  |
                        The requirement on resolution names its
                        condition as an operation that finds absent
                        what it needs, or present what it adds, and
                        the ruled option's own examples are removing
                        an absent node and adding a node that exists;
                        both are what the kind of an operation
                        implies. Under the implied option the
                        requirement traces to one rule for each kind,
                        stated once in the schema of the core, where
                        under written preconditions it is met only as
                        far as each author wrote the pair. Conditions
                        on the value of a field trace to no
                        requirement or ruling today; the only further
                        needs the decision names are a delta module's
                        declared inputs and a merge of variants that
                        conflict, each with records of its own.
description:            |
                        Sources:
                        - Resolution stops, naming the operation, when
                          an operation finds
                          absent what it needs or present what it adds.
                          (_data/requirement/rqt_resolver_stops_at_failed_precondition.yaml at condition and qualifier)
                        - Removing an absent node or adding a node
                          that exists fails
                          resolution with a report naming the operation.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_every_operation_states_its_preconditions.yaml at brief)
                        - The trial implied preconditions by kind, and
                          the first failing
                          operation stopped resolution and was named. (trial process log,
                          phase 1; review of 2026-10-29, areas/trial-model.md, section 5)
                        - A merge that conflicts and a delta module
                          may need more.
                          (_data/decision/dec_how_an_operation_states_its_preconditions/dec_how_an_operation_states_its_preconditions.yaml at description)
                        - The traceability question asks whether
                          anything exists that
                          nothing calls for.
                          (_data/register/reg_concern.yaml at entries.concern_traceability.question)
                        Strength: moderate; a requirement or ruling
                        that asks for conditions on values would turn
                        it around.

