title:                  Written precondition lists that restate or miss the required pair
brief:                  |
                        Resolution must stop when an add finds its
                        element present or a remove finds it absent,
                        whatever the author wrote. If preconditions
                        are only written, an add with no written
                        absence either overwrites in silence, against
                        the requirement, or the resolver checks
                        absence anyway, which is the implied option
                        with written extras. Written alone, every
                        operation restates the pair its kind already
                        fixes, and so does every operation that
                        lowering generates, since the ruling on one
                        vocabulary sends those through the same
                        interpreter; the trial's lowering emitted
                        operations at every crossing edge, adapter,
                        recorder and control block.
description:            |
                        Sources:
                        - Resolution stops when an operation finds
                          absent what it needs,
                          or present what it adds.
                          (_data/requirement/rqt_resolver_stops_at_failed_precondition.yaml at condition)
                        - Under the written option each operation
                          carries a list in a small
                          fixed vocabulary, which the resolver checks in order.
                          (_data/decision/dec_how_an_operation_states_its_preconditions/opt_preconditions_written_on_each_operation.yaml at brief)
                        - Generated transforms are written as variant
                          operations and
                          applied by the same interpreter.
                          (_data/decision/dec_authored_operations_and_lowering/ruling_one_vocabulary_for_authoring_and_lowering.yaml at brief)
                        - One vocabulary means one set of
                          preconditions and one place to
                          fix a bug.
                          (_data/requirement/rqt_lowering_one_interpreter.yaml at rationale)
                        - The trial's lowering emits its own
                          operations for control blocks,
                          recorders, adapters and transports. (trial 2c777ab9,
                          src/cctool/dataflow/lower.py, the calls of emit)
                        - WTP wants the approach as simple as
                          feasible. (WTP, 2026-10-28) Strength:
                          strong; it falls away only if the written
                          option is read as adding the implied pair by
                          default, which makes it the option with
                          written extras.

