title:                  Producers of variants that need write no conditions
brief:                  |
                        A dataflow graph is ruled to be configuration
                        data that any wrapper language can produce,
                        lowering and sweep items produce variants and
                        operations by program as people do by hand,
                        and the Patrol base already comes from a
                        table. Under the implied option a producer
                        writes only the operation, and a partner who
                        reads a variant learns its preconditions from
                        one table in the schema of the core; under
                        written preconditions every producer must emit
                        a list in the vocabulary for every operation,
                        and every reader must evaluate it. The implied
                        option still asks a partner to implement each
                        kind's rule rather than reuse a stock patch
                        tool, since JSON Patch's add replaces an
                        existing member where ours must refuse.
description:            |
                        Sources:
                        - A dataflow graph is configuration data that
                          any wrapper language
                          can produce, as ruled on 2026-10-29.
                          (_data/interface_control_document/icd_dataflow_items.yaml at description)
                        - The Patrol base graph is generated from a
                          table.
                          (_data/decision/dec_naming_of_ports_in_a_group/ann_generated_members_need_stable_guids_and_rename_entries.yaml at description)
                        - Sweep items generate variants that are not
                          stored.
                          (_data/decision/dec_parameters_of_a_variant/ruling_sweep_items_generate_unstored_variants.yaml at brief)
                        - Generated transforms are written as variant
                          operations.
                          (_data/decision/dec_authored_operations_and_lowering/ruling_one_vocabulary_for_authoring_and_lowering.yaml at brief)
                        - JSON Patch add on an existing member
                          replaces it.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_vocab_generic_operations_map_onto_json_patch.yaml at description)
                        - The compatibility question asks what a
                          partner must adopt to
                          read or produce what the design uses.
                          (_data/register/reg_concern.yaml at entries.concern_compatibility.question)
                        Strength: weak to moderate; it counts once
                        partners or wrapper languages write variants,
                        and the extras option keeps the gain for every
                        operation that writes none.

