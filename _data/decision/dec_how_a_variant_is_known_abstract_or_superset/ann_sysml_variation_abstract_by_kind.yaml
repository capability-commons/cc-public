title:                  SysML v2 variation abstract by its kind, not by a written keyword
brief:                  |
                        In SysML v2 a variation is always abstract,
                        the abstract keyword is not written on it, and
                        constraints added in 2.0b2 enforce this, so
                        the standard closest to the partners does not
                        let an author state the abstractness of a
                        variation. The derived options follow that
                        practice and the declared state is at least
                        checked against the graph, while the flag asks
                        a partner tool to trust a field that nothing
                        checks.
description:            |
                        Sources:
                        - "A variation is always abstract, so the
                          abstract keyword is not used on a
                          variation", resolved in SysML 2.0b2 by
                          adding constraints that enforce it.
                          (https://issues.omg.org/issues/SYSML2-488)
                        - The flag option marks a variant that is only
                          built on, whatever it lacks or holds.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_built_on_flag_only.yaml
                          at brief)
                        - A compatibility question asks whether a
                          partner can read and use what the design
                          produces. (_data/register/reg_concern.yaml
                          at entries.concern_compatibility.question.0)
                        - ASSUMPTION: a partner's exporter to SysML v2
                          maps a superset base to a variation; no such
                          mapping is drafted. Strength: weak to
                          moderate; it is an alignment with prior art,
                          and SysML fixes abstractness by the kind of
                          element, not by deriving it from a graph.
                          The declared state lies between, stated by
                          the author and checked, so this neither
                          supports nor challenges it.

