title:                  Flag that nothing compares with the graph
brief:                  |
                        Under the flag, a variant whose base later
                        changes so that it could run stays unchecked,
                        and a leaf flagged by mistake escapes the gate
                        for good, since nothing compares the flag with
                        the graph. The declared state fails at that
                        variant when its declaration no longer
                        matches, and the derived states cannot go
                        stale.
description:            |
                        Sources:
                        - The flag option resolves, checks and runs
                          every variant without the field, whatever it
                          lacks or holds.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_abstract_flag_only.yaml
                          at brief)
                        - The declared option fails when a declaration
                          disagrees with the resolved graph.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - The Patrol notes recommend a flag on a graph
                          that only variants may resolve, as the
                          alternative to exempting the base from
                          input_fed_twice and similar checks.
                          (_sources/cc-patrol-notes/variants.md#3-patrol-with-this-mechanism)
                        - A maintainability question asks how readily
                          a change can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                          Strength: strong; the gap is structural and
                          grows with the family.

