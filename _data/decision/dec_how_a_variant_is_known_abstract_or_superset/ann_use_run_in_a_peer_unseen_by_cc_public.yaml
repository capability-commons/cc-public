protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Run in a peer that cc-public cannot see
brief:                  |
                        A [[dataflow variant]] of cc-public that
                        cc-public builds on and that only a peer runs
                        is cited by a [[dataflow run]] in the peer,
                        which cc-public does not consume, so cc-public
                        holds it to the built-on checks while the peer
                        holds it complete. One dataflow variant then
                        has two states in two repositories, while a
                        declared state travels with the item.
description:            |
                        Sources:
                        - A dataflow variant that a dataflow run cites
                          is meant to run and must be complete.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - References across federated repositories use
                          segments with directional consumption.
                          (_data/decision/dec_references_across_instances/ruling_references_across_instances.yaml
                          at brief)
                        - Peers take cc-public as a versioned package.
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml
                          at brief)
                        - A dataflow variant declares its state under
                          the declared option.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        - ASSUMPTION: a run in a peer may cite a
                          dataflow variant of cc-public; no run type
                          and no shared variant exist. Strength: weak
                          now, moderate with several peers; it is the
                          run-side counterpart of the annotation on a
                          leaf rule blind to peers that build on a
                          shared variant.

