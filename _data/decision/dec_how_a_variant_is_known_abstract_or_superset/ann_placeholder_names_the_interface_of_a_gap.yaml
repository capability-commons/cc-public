title:                  Placeholder that names the interface meant to fill a gap
brief:                  |
                        A placeholder records which block a base lacks
                        and the interface it must present, so the gap
                        traces to an interface control document and
                        the operation that fills it traces to the
                        placeholder. An unfed port traces the gap only
                        to a port, a declaration says which state but
                        not which block, and a flag records no reason
                        at all.
description:            |
                        Sources:
                        - A placeholder declares the interface the
                          missing block must present.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief)
                        - Each dataflow node presents exactly one
                          interface control document.
                          (src/cctool/check/check.lp within
                          interface_count)
                        - The drafted field says only, in prose, that
                          the base is not runnable itself.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at brief and abstract)
                        - Traceability asks whether each element can
                          be traced to the reason it exists, and each
                          need to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0 and
                          entries.concern_traceability.question.1)
                          Strength: moderate; nothing in Patrol lacks
                          a block, so it has no instance yet. Against
                          the unfed-ports and declared options it is
                          weak, since both still trace to the graph.

