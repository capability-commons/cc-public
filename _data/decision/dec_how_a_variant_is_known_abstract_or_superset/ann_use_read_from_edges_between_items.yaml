title:                  Use read from the edges between items
brief:                  |
                        Under the use rule, which
                        [[dataflow variants]] must run can be read
                        from the YAML of the items, the base each
                        names, the options they take and the runs that
                        cite them, by a partner's own tool without the
                        resolver; only the state of a built-on
                        dataflow variant needs cctool. The tool must
                        read the whole family, where a flag is read
                        from the item itself.
description:            |
                        Sources:
                        - The three uses are building on, citation by
                          a dataflow run and taking an option, and the
                          state of a built-on dataflow variant is
                          derived when wanted.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - A variant draft names its base in a field.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          at base) relation_takes_option is an edge of
                          the variant.
                          (_data/register/reg_relation.yaml at
                          entries.relation_takes_option.description)
                        - A derived state exists only after cctool
                          resolves the variant.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/ann_declared_state_read_without_resolver.yaml
                          at brief)
                        - A compatibility measure counts the tools a
                          partner must install to take part.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.measure.1)
                          Strength: weak; peers already run cctool, as
                          the earlier annotation found.

