title:                  Set of checks that hold whatever descendants add
brief:                  |
                        A built-on [[dataflow variant]] is checked
                        only for what holds whatever its descendants
                        add, but no list of such checks exists. Read
                        as additions only, an input fed twice stays
                        fed twice, so the Patrol base and the Orin
                        variant would fail; read as any edit, a
                        descendant can remove whatever fails, so no
                        dataflow check holds. Either way someone must
                        name, check by check, which ones run on a
                        built-on variant.
description:            |
                        Sources:
                        - Any other dataflow variant is only built on,
                          and is checked only for what holds whatever
                          its descendants add.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - The input-fed-twice check fails an input fed
                          by more than one edge.
                          (src/cctool/check/check.lp within
                          input_fed_twice) Both Patrol graphs that are
                          built on have inputs fed twice.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within report, run 2026-10-25)
                        - Descendants remove nodes and edges by
                          filter.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin_tracks.yaml
                          at operation)
                        - The Patrol notes name the choice as
                          exempting the base from input_fed_twice and
                          similar checks, or flagging it.
                          (_sources/cc-patrol-notes/variants.md#3-patrol-with-this-mechanism)
                        - Simplicity counts distinct mechanisms
                          introduced. (_data/register/reg_concern.yaml
                          at entries.concern_simplicity.measure.0)
                          Strength: moderate; the list is small and
                          fixed, and the derived and placeholder
                          options need the same list for the variants
                          they find incomplete. It weighs against the
                          claim that the use rule adds nothing.

