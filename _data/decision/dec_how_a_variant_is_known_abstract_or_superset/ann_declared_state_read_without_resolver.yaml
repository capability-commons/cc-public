title:                  Declared state read from the item without the resolver
brief:                  |
                        A field, flag or declaration, can be read from
                        the YAML of the item by a partner's own tool,
                        while a derived state exists only after cctool
                        resolves the variant, so a partner who wants
                        to know which variants run must install
                        cctool. Peers already run cctool, so the point
                        is weak.
description:            |
                        Sources:
                        - The derived options compute the state from
                          the graph and no field states it.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief;
                          _data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_unfed_required_ports_and_state_derived.yaml
                          at brief)
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          at brief)
                        - A compatibility measure counts the tools a
                          partner must install to take part.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.measure.1)
                        - ASSUMPTION: peers already run cctool.
                          Strength: weak.

