title:                  Base edit that silently changes which descendants run
brief:                  |
                        Under the derived options an edit to a base,
                        such as removing its second decoder or adding
                        a consumer to an output, can change the state
                        of variants that were not edited, and so which
                        of them are checked and run, with no failure
                        to show it. The declared state reports it as a
                        mismatch at each variant affected.
description:            |
                        Sources:
                        - Both derived options compute the state from
                          the graph, with no field.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief;
                          _data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_unfed_required_ports_and_state_derived.yaml
                          at brief)
                        - Three Patrol leaves are built on the Orin
                          variant, which is built on the Patrol base.
                          (_sources/cc-patrol-notes/draft/README.md#files)
                        - A maintainability question asks how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                          Strength: moderate; the change of state is
                          often the right one, and the harm is that it
                          is silent. The flag has the opposite fault,
                          covered by the annotation on a flag that
                          nothing compares with the graph.

