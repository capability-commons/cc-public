title:                  Use as a leaf that must be remembered after a child is added
brief:                  |
                        A [[dataflow variant]] that is meant to run
                        only because nothing builds on it loses that
                        reason when a child is built on it, so to stay
                        held complete the tooling must remember that
                        it was a leaf, which the tree does not say and
                        a commit check sees only for the one commit
                        that adds the child. The rule then needs a
                        stored mark, which the option says is not
                        declared, a read of history, or a
                        [[dataflow run]] or option edge on every
                        member product; a declared state says it on
                        the item.
description:            |
                        Sources:
                        - Nothing is declared; a dataflow variant that
                          nothing builds on, that a dataflow run
                          cites, or that takes an option is meant to
                          run, and stays so when other dataflow
                          variants are built on it.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - Each commit is checked against the graph
                          before and after it, the graph before read
                          from HEAD.
                          (_data/decision/dec_check_commit_against_graph/ruling_check_commit_against_graph.yaml
                          at brief; src/cctool/commit/change.py within
                          check)
                        - No dataflow run item exists yet, and
                          relation_takes_option is optional.
                          (_data/register/reg_data_item_type.yaml at
                          entries; _data/register/reg_relation.yaml at
                          entries.relation_takes_option.description)
                        - A dataflow variant declares its state under
                          the declared option.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - Functional suitability asks whether each
                          function gives the right result; simplicity
                          asks whether a design follows from decisions
                          already made; traceability asks whether each
                          element can be traced to the reason it
                          exists. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0,
                          entries.concern_simplicity.question.2 and
                          entries.concern_traceability.question.0)
                          Strength: moderate; it falls away once each
                          member product takes an option or is cited
                          by a run, which would make the leaf use a
                          default for drafts only.

