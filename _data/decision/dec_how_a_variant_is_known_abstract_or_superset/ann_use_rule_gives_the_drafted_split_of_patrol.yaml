title:                  Use rule that gives the drafted split of the Patrol family
brief:                  |
                        In the Patrol drafts the two graphs flagged as
                        only built on are exactly the two that
                        something builds on, and the five
                        [[dataflow variants]] that nothing builds on
                        all resolve with every required input fed
                        once. So the rule of use gives the split the
                        drafts state by a field, with no field, and
                        the drafts hold no leaf that is meant to stay
                        incomplete.
description:            |
                        Sources:
                        - The drafts form a tree in which the Patrol
                          base and the Orin variant each have
                          descendants and are flagged, and Legion, the
                          three Orin leaves and replay have none.
                          (_sources/cc-patrol-notes/draft/README.md#files;
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at abstract;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          at abstract)
                        - The resolver reports no fault in any of the
                          five leaves, and four inputs fed twice in
                          the Orin variant.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within report, run by the advocate and again
                          by the verifier on 2026-10-25;
                          _sources/cc-patrol-notes/draft/README.md#what-resolving-them-showed-resolvedtxt)
                        - Under the option a dataflow variant that
                          nothing builds on must be complete, and any
                          other is only built on.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - A functional suitability question asks
                          whether each function gives the right
                          result. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0)
                          Strength: moderate; one family of seven
                          items, and the flag gives the same split, at
                          the cost of a field. A family with a leaf
                          that is meant to stay incomplete, such as a
                          draft not yet finished, would break the
                          match.

