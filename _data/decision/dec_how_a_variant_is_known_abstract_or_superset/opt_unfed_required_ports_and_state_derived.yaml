title:                  Unfed required ports and a derived state
brief:                  |
                        No placeholder item is added. A dataflow
                        variant is abstract while a required input
                        port of one of its dataflow nodes has no
                        dataflow edge, superset while alternatives
                        under presence tags remain, and complete when
                        neither holds. The tooling derives the state
                        from the graph.

