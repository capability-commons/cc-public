title:                  Forgotten or doubled edge in a leaf taken for a variant state
brief:                  |
                        Under the option of unfed required ports, an
                        unfed required input makes a variant abstract,
                        and that is exactly the fault the unfed-input
                        check fails today, so a leaf with a forgotten
                        edge would be read as abstract and left out of
                        what is run instead of failing. If either
                        derived option detects remaining alternatives
                        by inputs fed twice, the only symptom Patrol's
                        superset graphs show, a doubled edge in a leaf
                        would likewise read as superset; the flag and
                        the declared state keep both faults as
                        failures in every variant not marked.
description:            |
                        Sources:
                        - The option of unfed required ports: a
                          dataflow variant is abstract while a
                          required input port of one of its dataflow
                          nodes has no dataflow edge.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_unfed_required_ports_and_state_derived.yaml
                          at brief)
                        - The unfed-input check fails an input that
                          the interface does not state optional and no
                          edge feeds. (src/cctool/check/check.lp
                          within unfed_input) The input-fed-twice
                          check fails an input fed by more than one
                          edge. (src/cctool/check/check.lp within
                          input_fed_twice)
                        - Both derived options make a variant superset
                          "while alternatives under presence tags
                          remain", without saying how that is seen.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief)
                        - The resolver finds inputs fed twice, and
                          nothing unfed, in both Patrol graphs flagged as only built on.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py,
                          run by both the advocate and the verifier)
                        - The flag option resolves, checks and runs
                          every variant without the field; the
                          declared option treats a variant that
                          declares neither state as complete.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_built_on_flag_only.yaml
                          at brief;
                          _data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - A functional suitability question asks
                          whether the design does anything it should
                          not. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.3)
                        - ASSUMPTION: the derived options add no rule
                          that a variant nothing builds on must be
                          complete; their text does not say. With that
                          rule the fault fails at the leaf again.
                          Strength: strong against the unfed-ports
                          option as written; moderate against the
                          placeholder option, whose abstract half does
                          not depend on unfed ports and whose superset
                          half depends on wording not yet given; weak
                          if a leaf rule is added.

