title:                  State declared and checked
brief:                  |
                        A dataflow variant declares that it is
                        abstract, superset or both, a check fails when
                        the declaration disagrees with the resolved
                        graph, and a variant that declares neither is
                        complete. Ruled by WTP on 2026-10-27, for now,
                        as recommended. Deriving the state from use is
                        the better rule once every product variant
                        takes an option or is cited by a run.

