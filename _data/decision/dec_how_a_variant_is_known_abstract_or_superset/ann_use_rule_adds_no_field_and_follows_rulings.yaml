title:                  Use rule that adds no field and follows earlier rulings
brief:                  |
                        The use rule adds no field and no item: the
                        three uses are a base reference,
                        relation_takes_option, which already exists,
                        and a citation by a [[dataflow run]], and it
                        states what two rulings already imply, that
                        only a complete [[dataflow variant]] is run
                        and that a member product is one complete
                        dataflow variant. The flag adds a field and an
                        exemption, and the declared state a field that
                        states one fact twice.
description:            |
                        Sources:
                        - Nothing is declared.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - relation_takes_option is in the relation
                          register. (_data/register/reg_relation.yaml
                          at entries.relation_takes_option)
                        - Every dataflow variant has a resolved
                          dataflow graph, and only that of a complete
                          dataflow variant is run (WTP, 2026-10-25).
                          (_data/register/reg_concept.yaml at
                          entries.concept_resolved_dataflow_graph.description)
                        - A member product is represented by one
                          complete dataflow variant (WTP, 2026-10-25).
                          (_data/decision/dec_settled_answers_that_differ_by_product/dec_settled_answers_that_differ_by_product.yaml
                          at description)
                        - The flag adds one field and an exemption;
                          the declared state adds a field and a
                          consistency check.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/ann_mechanisms_added_to_know_a_variant_state.yaml
                          at brief)
                        - Simplicity asks how many mechanisms a design
                          adds and whether it follows from decisions
                          already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.0 and
                          entries.concern_simplicity.question.2)
                          Strength: moderate; the citation by a run
                          depends on an open decision, and the rule
                          still needs the set of checks that a
                          built-on variant is held to, which the next
                          annotation counts as a mechanism.

