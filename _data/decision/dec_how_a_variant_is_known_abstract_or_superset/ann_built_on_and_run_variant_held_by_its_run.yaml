title:                  Built-on variant that is also run, held complete by its use
brief:                  |
                        A [[dataflow variant]] that others build on
                        and that is also run is coherent under the
                        ruled terms, since the state belongs to the
                        dataflow variant itself and a descendant that
                        adds a block filling no gap does not make its
                        base abstract. Under the use rule the reason
                        it must be complete then traces to an item,
                        the [[dataflow run]] that cites it or the
                        upheld option it takes, while for a leaf the
                        reason is only that nothing builds on it.
description:            |
                        Sources:
                        - The uses are alternatives: nothing builds on
                          it, a dataflow run cites it, or it takes an
                          option.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - The state belongs to the dataflow variant
                          itself, and a descendant that adds a block
                          which fills no gap does not make its base
                          abstract. (_data/register/reg_concept.yaml
                          at
                          entries.concept_abstract_dataflow_variant.description)
                        - A member product is represented by one
                          complete dataflow variant, and an abstract
                          or superset dataflow variant is not a member
                          product (WTP, 2026-10-25).
                          (_data/decision/dec_settled_answers_that_differ_by_product/dec_settled_answers_that_differ_by_product.yaml
                          at description)
                        - A dataflow variant names the upheld option
                          it takes with relation_takes_option.
                          (_data/decision/dec_settled_answers_that_differ_by_product/ruling_variant_names_the_upheld_option_it_takes.yaml
                          at brief)
                        - Traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                          Strength: moderate; the trace is to an item
                          only for the two uses that are edges, and
                          the run that would cite a variant is
                          recorded after the variant first runs, so
                          the first run of a built-on variant is held
                          complete only if the tooling derives the
                          state before running it.

