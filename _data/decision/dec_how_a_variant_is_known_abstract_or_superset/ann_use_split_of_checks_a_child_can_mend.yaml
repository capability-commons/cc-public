title:                  Split of the checks by what a descendant can mend
brief:                  |
                        The reworded rule holds unknown port, port
                        type mismatch and foreign node on a built-on
                        [[dataflow variant]] as faults a descendant
                        cannot mend, but a descendant that removes or
                        filters the edge mends each of them, so the
                        split is a choice of which faults a [[base]]
                        may carry, not a property of the checks. The
                        option does not say on which side the
                        missing-setting, unknown-setting,
                        feedforward-loop, interface-count and unplaced
                        checks fall, so the list must still be written
                        check by check.
description:            |
                        Sources:
                        - The checks that what a descendant adds
                          cannot mend, such as an unknown port, a port
                          type mismatch or a foreign node, hold on a
                          built-on dataflow variant, and unfed input
                          and input fed twice do not.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - The Fluent operations remove nodes by filter
                          with every edge touching them, and the
                          builder removes one node or edge by id.
                          (_sources/cc-patrol-notes/variants.md#1-what-design-factory-already-has;
                          _sources/cc-patrol-notes/variants.md#2-proposal-for-cc-public)
                        - A dataflow edge is identified by its two
                          ends, so an edge can be named for removal.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - The dataflow checks are interface_count,
                          foreign_node, unknown_port, input_fed_twice,
                          unfed_input, port_type_mismatch,
                          feedforward_loop, unknown_setting,
                          missing_setting and unplaced.
                          (src/cctool/check/check.lp within
                          interface_count, foreign_node, unknown_port,
                          input_fed_twice, unfed_input,
                          port_type_mismatch, feedforward_loop,
                          unknown_setting, missing_setting and
                          unplaced)
                        - Functional suitability asks whether each
                          function gives the right result;
                          maintainability asks how readily a newcomer
                          can understand the design.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0
                          and
                          entries.concern_maintainability.question.0)
                          Strength: moderate; failing a base that
                          names a missing port is arguably right
                          whatever a child does, so the choice is
                          defensible, but the option words it as a
                          fact, and half the dataflow checks are not
                          placed.

