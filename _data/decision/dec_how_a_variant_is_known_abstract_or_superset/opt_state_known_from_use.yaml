title:                  State known from how a dataflow variant is used
brief:                  |
                        Nothing is declared. A [[dataflow variant]]
                        that nothing builds on, that a
                        [[dataflow run]] cites, or that takes an
                        option, is meant to run and must be complete:
                        every check holds on its
                        [[resolved dataflow graph]], so a forgotten or
                        doubled edge fails there. Any other dataflow
                        variant is only built on, and is checked only
                        for what holds whatever its descendants add.
                        Whether a built-on dataflow variant is
                        abstract, superset or hybrid is derived from
                        its resolved dataflow graph when wanted, and
                        never stored.
description:            |
                        Proposed after WTP asked whether the state
                        needs declaring at all, since it becomes
                        obvious through use (WTP, 2026-10-25). It is
                        close to the derived option with a leaf rule
                        that the arguments on this decision named as
                        missing. relation_takes_option gives one of
                        the uses.

