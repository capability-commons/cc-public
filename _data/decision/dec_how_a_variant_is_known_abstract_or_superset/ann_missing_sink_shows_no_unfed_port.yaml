title:                  Missing sink that no unfed port shows
brief:                  |
                        An unfed required input shows a missing block
                        only when something downstream needs it, so a
                        base that lacks a sink, as Patrol's replay
                        lacks its dump writer once filtered to
                        analysis, has no unfed input and would be
                        called complete by the option of unfed
                        required ports. A placeholder can say that the
                        sink is missing; the declared state can say
                        abstract but its check finds nothing in the
                        graph to confirm it, and the flag can only say
                        not run.
description:            |
                        Sources:
                        - The replay variant filters the base to
                          analysis, then adds a dump writer fed by
                          analysis.result.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          at operation)
                        - No dataflow check reports an output that no
                          edge reads; the unfed-input check looks only
                          at inputs. (src/cctool/check/check.lp within
                          unfed_input and edge_end)
                        - A placeholder declares a block the base
                          lacks, with the interface it must present.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief)
                        - The declared option fails when a declaration
                          disagrees with what the resolved graph
                          shows.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - A functional suitability question asks
                          whether every function that is needed is
                          present. (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1)
                          Strength: moderate; no Patrol item is in
                          this state today, but splitting the replay
                          variant into a filtering base and an adding
                          leaf would make one.

