title:                  First descendant that relaxes the checks on its base
brief:                  |
                        Building the first [[dataflow variant]] on a
                        leaf that is meant to run, such as a lab
                        variant on Legion, makes Legion only built on,
                        so a doubled edge in it no longer fails,
                        unless a [[dataflow run]] cites it or it takes
                        an option. No dataflow run item exists yet and
                        the edge that takes an option is optional, so
                        today nothing would hold it. The reverse also
                        holds: removing the three Orin leaves makes
                        the Orin variant a leaf that fails four inputs
                        fed twice.
description:            |
                        Sources:
                        - A dataflow variant that nothing builds on,
                          that a dataflow run cites, or that takes an
                          option must be complete; any other is
                          checked only for what holds whatever its
                          descendants add.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - The shape of a dataflow run is an open
                          decision with no ruling, and the type
                          register has no run type.
                          (_data/decision/dec_shape_of_a_dataflow_run/dec_shape_of_a_dataflow_run.yaml;
                          _data/register/reg_data_item_type.yaml at
                          entries)
                        - relation_takes_option is optional, and where
                          it is absent nothing is inferred.
                          (_data/register/reg_relation.yaml at
                          entries.relation_takes_option.description)
                        - The Orin variant has three descendants and
                          four inputs fed twice.
                          (_sources/cc-patrol-notes/draft/README.md#files;
                          _sources/cc-patrol-notes/draft/resolve_sketch.py
                          within report, run 2026-10-25)
                        - The declared state keeps a variant that
                          declares neither state complete, whatever
                          builds on it.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                          Strength: moderate to strong; it grows with
                          variants of variants, since each new child
                          changes what its parent is held to. It falls
                          away once every member product takes an
                          option or is cited by a run, and failing an
                          orphaned superset base is arguably right.

