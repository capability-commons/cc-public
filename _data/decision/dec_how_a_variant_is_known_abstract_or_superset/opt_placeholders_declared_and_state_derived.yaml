title:                  Declared placeholders and a derived state
brief:                  |
                        A base may declare a placeholder for a
                        functional block or chain it lacks, with the
                        interface it must present. The tooling derives
                        the state: a dataflow variant is abstract
                        while a placeholder is unfilled, superset
                        while alternatives under presence tags remain,
                        and complete when neither holds. No field
                        states the state.

