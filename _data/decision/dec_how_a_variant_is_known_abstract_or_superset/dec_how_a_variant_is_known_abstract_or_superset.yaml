title:                  How a variant is known to be abstract or superset
brief:                  |
                        How does the tooling know whether a dataflow
                        variant is abstract, superset, hybrid or
                        complete, and so which variants are resolved,
                        checked and run?
description:            |
                        Source: WTP's comment on the framing study
                        (WTP, 2026-10-25). Abstract fits a base that
                        lacks blocks or chains, superset fits a base
                        whose surplus blocks and chains are removed,
                        and many bases will be both. The Patrol drafts
                        mark a variant with a field that says it is
                        abstract, which cannot tell the two cases
                        apart
                        (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml).
                        The decision on which resolved graphs are
                        checked depends on the answer.

