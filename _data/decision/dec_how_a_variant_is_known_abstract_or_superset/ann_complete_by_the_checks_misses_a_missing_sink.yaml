title:                  Completeness by the checks that misses a missing sink
brief:                  |
                        The use rule holds a leaf complete when every
                        check holds on its
                        [[resolved dataflow graph]], but no check
                        shows a missing sink, so a replay leaf that
                        forgot its dump writer would pass and be run,
                        and a built-on [[dataflow variant]] keeps no
                        record of which block it lacks. A placeholder
                        names the gap and its interface, and its fill
                        can be checked.
description:            |
                        Sources:
                        - A dataflow variant meant to run must be
                          complete: every check holds on its resolved
                          dataflow graph. The state of a built-on
                          dataflow variant is derived when wanted, and
                          never stored.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - No dataflow check reports an output that no
                          edge reads; the unfed-input check looks only
                          at inputs. (src/cctool/check/check.lp within
                          unfed_input and edge_end)
                        - The replay variant keeps analysis and adds a
                          dump writer fed by its result.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml
                          at operation)
                        - A placeholder declares a block the base
                          lacks, with the interface it must present.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief)
                        - A complete dataflow variant is neither
                          abstract nor superset, which is wider than
                          passing the checks.
                          (_data/register/reg_concept.yaml at
                          entries.concept_complete_dataflow_variant.brief)
                        - Functional suitability asks whether every
                          function that is needed is present;
                          traceability asks whether each need traces
                          to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1
                          and entries.concern_traceability.question.1)
                          Strength: moderate; it repeats against this
                          option the fault the missing-sink annotation
                          found in the unfed-ports option, and no
                          Patrol item is in this state today.

