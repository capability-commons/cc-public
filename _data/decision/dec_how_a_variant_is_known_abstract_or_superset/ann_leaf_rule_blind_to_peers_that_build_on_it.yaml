title:                  Leaf rule blind to peers that build on a shared variant
brief:                  |
                        A [[dataflow variant]] that cc-public
                        publishes for peers to build on, and that
                        nothing in cc-public builds on, is a leaf
                        there and must be complete, although its
                        builders are in other repositories that
                        cc-public does not consume and so cannot see.
                        A shared superset [[base]] would then fail in
                        its own repository. A flag or a declared state
                        lets its author say what it is.
description:            |
                        Sources:
                        - A dataflow variant that nothing builds on
                          must be complete.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - References across federated repositories use
                          segments with directional consumption, ruled
                          but not yet built.
                          (_data/decision/dec_references_across_instances/ruling_references_across_instances.yaml
                          at brief)
                        - Peers take cc-public as a versioned package.
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml
                          at brief)
                        - The flag and the declared state are written
                          on the variant itself.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_built_on_flag_only.yaml
                          at brief;
                          _data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_declared_and_checked.yaml
                          at brief)
                        - A compatibility question asks whether a
                          partner can read and use what the design
                          produces. (_data/register/reg_concern.yaml
                          at entries.concern_compatibility.question.0)
                        - ASSUMPTION: a variant in a peer may name a
                          cc-public variant as its base; no such
                          variant exists. Strength: weak now, with one
                          peer and no shared variant; moderate with
                          several peers. It falls away if the rule
                          counts a peer that builds on the variant,
                          which needs a reference the publisher cannot
                          see, or if a shared base keeps a child in
                          its own repository.

