title:                  Mechanisms each option adds to know a variant's state
brief:                  |
                        The unfed-ports option adds no data and reads
                        the abstract state from a condition an
                        existing check already holds; the flag adds
                        one field on two item types and an exemption
                        in the checks; the declared state adds a field
                        and a consistency check that can reuse the
                        unfed-input and input-fed-twice checks, though
                        it states one fact twice; placeholders add a
                        new construct with a schema, facts and a check
                        that it is filled. Patrol, the first real
                        family, has no lacking base to use a
                        placeholder on.
description:            |
                        Sources:
                        - The unfed-input check already holds the
                          unfed-ports option's condition.
                          (src/cctool/check/check.lp within
                          unfed_input)
                        - Both Patrol graphs marked abstract hold
                          surplus and lack nothing.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py,
                          run on the Patrol base and the Orin variant,
                          2026-10-25)
                        - The flag sits on a dataflow graph and on a
                          variant in the drafts.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at abstract;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          at abstract) Nothing in src or _data/schema
                          mentions abstract today (grep by the
                          verifier, 2026-10-25).
                        - The simplicity measures count distinct
                          mechanisms introduced and jobs done by more
                          than one mechanism.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0 and
                          entries.concern_simplicity.measure.1)
                        - Under every option these checks need a graph
                          argument or one solve per resolved graph,
                          since they match nodes by id with the graph
                          left open. (src/cctool/check/check.lp within
                          fed;
                          _data/decision/dec_which_resolved_graphs_are_checked/ann_checked_graphs_rules_match_nodes_by_id_alone.yaml
                          at brief) Strength: moderate. The flag and
                          the declared state each add one small
                          mechanism, so this neither supports nor
                          challenges them.

