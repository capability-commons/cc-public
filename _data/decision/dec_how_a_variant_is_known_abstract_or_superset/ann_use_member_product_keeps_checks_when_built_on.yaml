title:                  Member product that keeps its checks when built on
brief:                  |
                        As reworded, a [[dataflow variant]] meant to
                        run stays held to every check when a child is
                        built on it, so a lab variant on Legion no
                        longer relaxes the checks on Legion, and the
                        option now names the unknown-port, port-type
                        and foreign-node checks as holding on a
                        built-on dataflow variant, so a broken edge in
                        a [[base]] fails at the base itself, as well
                        as at each leaf below it.
description:            |
                        Sources:
                        - A dataflow variant meant to run stays so
                          when other dataflow variants are built on
                          it, and the checks that what a descendant
                          adds cannot mend, such as an unknown port, a
                          port type mismatch or a foreign node, hold
                          on a built-on dataflow variant.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - The earlier wording let the first descendant
                          of a leaf relax its checks.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/ann_first_descendant_relaxes_checks_on_its_base.yaml
                          at brief)
                        - Three Patrol leaves are built on the Orin
                          variant, so a fault in it would otherwise
                          show at each of the three.
                          (_sources/cc-patrol-notes/draft/README.md#files)
                        - Functional suitability asks whether the
                          design does anything it should not;
                          maintainability asks how readily a change
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.3
                          and
                          entries.concern_maintainability.question.2)
                          Strength: moderate to strong for the run and
                          option uses; for a leaf that only nothing
                          builds on, see the annotation on a use
                          remembered after a child.

