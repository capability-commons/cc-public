title:                  Leaf rule that fails a broken leaf where it breaks
brief:                  |
                        Under the use rule a forgotten or doubled edge
                        in a leaf, or a [[base]] edit that leaves a
                        leaf with an unfed input, fails at that leaf,
                        and which [[dataflow variants]] are run
                        depends on the shape of the family and on runs
                        and options, not on the content of a graph. So
                        the two faults earlier annotations raised
                        against the derived options, a leaf fault read
                        as a state and a base edit that silently
                        changes which descendants run, do not arise.
description:            |
                        Sources:
                        - Every check holds on the resolved dataflow
                          graph of a dataflow variant that nothing
                          builds on, that a dataflow run cites or that
                          takes an option, so a forgotten or doubled
                          edge fails there.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_state_known_from_use.yaml
                          at brief)
                        - The earlier argument that a leaf fault is
                          read as a state assumed the derived options
                          add no rule that a variant nothing builds on
                          must be complete, and rated itself weak if
                          such a rule is added.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/ann_leaf_fault_taken_for_a_variant_state.yaml
                          at description)
                        - Under the derived options a base edit can
                          change the state of variants that were not
                          edited, and so which of them are checked and
                          run, with no failure.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/ann_base_edit_silently_changes_leaf_states.yaml
                          at brief)
                        - The unfed-input and input-fed-twice checks
                          fail these faults today.
                          (src/cctool/check/check.lp within
                          unfed_input and input_fed_twice)
                        - Maintainability asks how far a change in one
                          part spreads to others and how readily it
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1
                          and
                          entries.concern_maintainability.question.2)
                          Strength: strong for leaves; it says nothing
                          about a variant that is built on, whose own
                          faults stay unchecked, see the annotation on
                          a first descendant.

