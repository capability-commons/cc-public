title:                  Binding times beyond static and dynamic
brief:                  |
                        The owner's camera example is two member
                        products from one base, so the camera count is
                        fixed per member product rather than at run
                        time, Patrol's fallback to drawn-on video is
                        chosen by variant with no switching at run
                        time, and the engine draft guards each call of
                        a frozen schedule by an enable flag that
                        changes at run time. A static or dynamic flag
                        cannot say fixed at startup but different per
                        deployment, which Simulink and AUTOSAR name,
                        so a later need turns the flag into an
                        enumeration and every item that carries it
                        changes. A latest binding time per setting
                        says it from the start.
description:            |
                        Sources:
                        - A high end variant with forward and rear
                          cameras and a
                          cheaper variant with a forward camera only, from one base.
                          (owner's statement, 2026-10-25,
                          _sources/owner-2026-10-25-morning.md line 5)
                        - Fallback to drawn-on video is a choice of
                          dataflow variant, the video variant, with no
                          automatic switching for now.
                          (_sources/cc-patrol-notes/draft/README.md lines 86-87)
                        - ASSUMPTION: a member product's camera count
                          and the
                          fallback choice are
                          bound at build, deployment or startup; neither source says which.
                        - A frozen schedule guards each call by a
                          per-node enable flag, the
                          one thing that can change at runtime.
                          (_sources/axair-orchestrator/docs/execution_levels.md lines 39-40)
                        - Simulink's activation times include startup
                          and runtime.
                          (https://www.mathworks.com/help/simulink/slref/simulink.variantcontrol.html)
                          AUTOSAR post-build variants activate on or after component
                          startup.
                          (https://www.mathworks.com/help/autosar/ug/configure-post-build-variant-conditions.html)
                        - ASSUMPTION: the flag of the mutability
                          decision is two-valued. Strength: strong for
                          functional suitability as member products and modes
                          multiply; weak to moderate for the migration
                          cost, which is mechanical.

