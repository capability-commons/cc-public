title:                  Two binding times, as the engine ruling gives them
brief:                  |
                        The engine ruling fixes a static subgraph at
                        build and lets a dynamic subgraph change at
                        the start of a step, which is two binding
                        times, and a static or dynamic flag, if ruled,
                        records them. A latest binding time per
                        setting adds an enumeration and a check, and
                        beside the flag holds one job twice. A binding
                        time per operation adds a field to every
                        operation.
description:            |
                        Sources:
                        - A static schedule is fixed at build time,
                          and a dynamic
                          subgraph's nodes and edges may change at the start of a step.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 12-17)
                        - A node is dynamic exactly where some setting
                          has runtime binding.
                          (_sources/survey/generative-and-transforms.md line 136)
                        - The flag's own decision is open; it has no
                          ruling.
                          (_data/decision/dec_where_mutability_is_declared)
                        - Simplicity counts distinct mechanisms and
                          jobs done by more than
                          one mechanism. (_data/register/reg_concern.yaml lines 489-490)
                        Strength: moderate; it holds until a variant
                        binds something at deployment or startup,
                        which no draft does yet.

