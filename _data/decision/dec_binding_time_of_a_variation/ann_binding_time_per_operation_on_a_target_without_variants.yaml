title:                  Operations bound on a target that never sees variants
brief:                  |
                        A binding time on each operation lets some
                        operations be bound at run time, so the target
                        would have to interpret variant operations,
                        against the design note that the engine never
                        sees variants and loads only resolved dataflow
                        graphs.
description:            |
                        Sources:
                        - The engine loads only resolved dataflow
                          graphs, and variant logic
                          stays in Python. (_sources/cc-patrol-notes/variants.md lines
                          92-95)
                        - A dynamic subgraph's nodes and edges may
                          change at the start of a
                          step.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml at brief)
                        Strength: strong; any run-time operation puts
                        an interpreter on the target.

