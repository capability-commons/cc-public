title:                  Binding time as partner formats declare it
brief:                  |
                        AUTOSAR declares a configuration class on each
                        parameter definition, and FMI declares the
                        variability of each variable, tunable among
                        them. A latest binding time per setting maps
                        one to one onto both. A time per operation has
                        no counterpart in either, and a two-valued
                        flag loses the difference between pre-compile,
                        link and post-build.
description:            |
                        Sources:
                        - A parameter definition has a value
                          configuration class that says
                          in which class it is available, with values that include
                          PreCompile, Link and PostBuild. (AUTOSAR TPS ECU Configuration R4.2.2, section 2.3.4.3,
                          https://autosar.org/fileadmin/standards/R4.2.2/CP/AUTOSAR_TPS_ECUConfiguration.pdf)
                        - An FMU exports a tunable parameter with
                          causality parameter and
                          variability tunable.
                          (https://www.mathworks.com/help/fmuexport/ug/fmu-paramater-tunability-limitations.html)
                          FMI's own definitions of fixed and tunable were not read.
                        Strength: moderate; it depends on AUTOSAR or
                        FMI exchange.

