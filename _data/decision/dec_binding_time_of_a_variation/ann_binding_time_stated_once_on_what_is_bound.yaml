title:                  A binding limit stated where its reason lives
brief:                  |
                        The reason a setting must be fixed by some
                        time belongs to the setting, so a latest
                        binding time declared there is written once,
                        and a check traces each late binding to the
                        setting and the operation. A time on each
                        operation is restated wherever the setting is
                        bound, with nothing to check that the uses
                        agree or to say who required it. A mutability
                        flag says a node is dynamic without saying
                        which setting made it so.
description:            |
                        Sources:
                        - Each setting or node declares the latest
                          time it may be bound,
                          and a check fails a later binding. (the latest binding time
                          option, brief)
                        - Each operation states when it is bound. (the
                          per-operation
                          option, brief)
                        - A node is dynamic exactly where some setting
                          has runtime binding.
                          (_sources/survey/generative-and-transforms.md line 136)
                        - AUTOSAR gives each configurable parameter a
                          configuration class.
                          (as summarized in _sources/survey/generative-and-transforms.md
                          lines 106-107)
                        Strength: strong; uses grow with variants and
                        binding stages.

