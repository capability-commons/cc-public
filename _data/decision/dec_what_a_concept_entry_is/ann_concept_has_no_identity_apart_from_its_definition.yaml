title:                  Concept with no identity apart from its definition
brief:                  |
                        A proxy earns its place where the thing it
                        points at has an identity of its own, such as
                        a DOI or a serial number. A concept has none
                        apart from its definition and characteristics:
                        change the definition and the concept has
                        changed. A proxy for it would point at nothing
                        that could be found without it.

