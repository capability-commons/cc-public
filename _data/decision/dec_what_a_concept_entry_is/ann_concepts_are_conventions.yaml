title:                  Concepts as conventions
brief:                  |
                        Words and concepts are conventions that hold a
                        meaning close enough for each party to a
                        discourse to go on, as in the later
                        Wittgenstein and in Lewis's Convention (1969).
                        The concept register is then our record of a
                        convention, not a copy of something that
                        exists apart from it.
description:            |
                        The owner's view, 2026-10-21: language and
                        concepts are protocol-shaped and pragmatic,
                        and grounding is never precise in the
                        logical-positivist sense.

