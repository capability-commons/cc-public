title:                  What a concept entry is
brief:                  |
                        Concepts are not proxies. Language and
                        concepts are protocol-shaped: conventions
                        which hold a close enough meaning for each
                        interlocutor in a discourse that the discourse
                        can proceed meaningfully. The concept register
                        IS our record of our convention for how the
                        concepts are used. It can never be wrong in a
                        strict sense, only in violation of the
                        conventions held by some other community or
                        system. Ruled by William Payne on 2026-10-21.

