title:                  Three aims of grounding
brief:                  |
                        With concepts as conventions, grounding has
                        three aims. First, internal consistency:
                        symbols are grounded against the concept
                        register, so that the parts of the system
                        cohere. Second, external interoperability:
                        symbol mappings allow specific, limited
                        transfers of information with an outside
                        symbolic system or ontology. Third, grounding
                        in the real world only as far as needed to
                        produce useful systems.
description:            |
                        The maintainer, 2026-10-21. The third aim is
                        met when, for example, machine vision models
                        produce tracks with edges to label data: the
                        loop closes, and the effectiveness of the
                        internal symbolic models can be judged, not
                        only their consistency. The first project is a
                        sensing project, so this confrontation with
                        reality comes early.

