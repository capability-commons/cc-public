title:                  Graded mapping that suits the concepts of partners
brief:                  |
                        Concepts of two vocabularies are rarely
                        identical; they are close, broader or
                        narrower. Concepts as proxies allow only
                        sameness between partners, while concepts as
                        entries can be joined by graded mapping edges,
                        as SKOS and ISO 25964 do.

