title:                  Match with the W3C annotation class
brief:                  |
                        Annotation matches the class name of the W3C
                        Web Annotation Vocabulary, so a partner who
                        uses it can find the counterpart by name.
                        Neither note nor comment names a class there.
description:            |
                        W3C Recommendation of 23 February 2017 defines
                        oa:Annotation as the class for Web
                        Annotations; commenting is one of thirteen
                        motivations, not a class
                        (https://www.w3.org/TR/2017/REC-annotation-vocab-20170223/).
                        A cc-public annotation is one assertion about
                        items, linked by r_is_about
                        (_data/register/reg_concept.yaml lines
                        254-263; _data/register/reg_relation.yaml
                        lines 145-168). The match is in name only. The
                        W3C motivation replying covers one annotation
                        answering another, but without a support or
                        challenge polarity (section 2.3.12).
                        ASSUMPTION: r_supports and r_challenges have
                        no direct counterpart among the W3C
                        motivations; the closest is assessing.

