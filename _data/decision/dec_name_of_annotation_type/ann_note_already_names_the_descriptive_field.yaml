title:                  Note already names a field on every item
brief:                  |
                        The descriptive trait already has a field
                        named note, so a type called note would give
                        one word two meanings in the same files.
description:            |
                        Relayed by Will: "annotation keeps its name,
                        because the descriptive trait already has a
                        note field" (will-messages.md line 63, in a
                        session summary Will pasted on
                        2026-10-09T17:52:14Z). The summary was written
                        by the assistant in another thread, so the
                        wording is not Will's own. The field is
                        defined in
                        _data/schema/sch_trait_descriptive.yaml lines
                        65-73. Every standalone item composes that
                        trait (_data/schema/sch_standalone.yaml line
                        42), and an annotation composes sch_standalone
                        (_data/schema/sch_annotation.yaml lines
                        38-39), so a note item could carry a note
                        field of its own. 71 YAML lines under _data
                        begin with the key note: (grep at HEAD
                        89c74d8). The edit tooling sets note as a
                        prose key by name (src/cc_public/edit/edit.py
                        line 83; src/cc_public/edit/layout.py line
                        79). The field description says the reasoning
                        behind an item belongs in a separate
                        annotation item; under the name note it would
                        point to a separate note
                        (sch_trait_descriptive.yaml lines 69-73). The
                        collision grows with the graph, since each new
                        item can carry the field.

