title:                  Note as the existing name of a field on every item
brief:                  |
                        The descriptive trait already has a field
                        named note, so a type called note would give
                        one word two meanings in the same files.
description:            |
                        Relayed by WTP: "annotation keeps its name,
                        because the descriptive trait already has a
                        note field" (will-messages.md line 63, in a
                        session summary WTP pasted on 2026-10-09). The
                        summary was written by the assistant in
                        another thread, so the wording is not WTP's
                        own. The field is defined in
                        _data/schema/sch_trait_descriptive.yaml lines
                        65-73. Every standalone item composes that
                        trait (_data/schema/sch_standalone.yaml line
                        42), and an annotation composes sch_standalone
                        (_data/schema/sch_annotation.yaml line 38), so
                        a note item could carry a note field of its
                        own. 147 YAML lines under _data begin with the
                        key note: (grep at c71515b0). The edit tooling
                        sets note as a prose key by name
                        (src/cctool/edit/edit.py line 85;
                        src/cctool/edit/layout.py line 93). The field
                        description says the reasoning behind an item
                        belongs in a separate annotation item; under
                        the name note it would point to a separate
                        note (sch_trait_descriptive.yaml lines 69-73).
                        The collision grows with the graph, since each
                        new item can carry the field.

