title:                  Comment already names source and YAML comments
brief:                  |
                        In this repository comment already names the
                        text after a comment marker, which the tooling
                        reads and keeps. A type called comment would
                        share the word with that thing.
description:            |
                        The editor takes an item from a comment header
                        and defines its comment marker as #
                        (src/cc_public/edit/edit.py lines 107-112,
                        131). The extractor has a function that
                        returns the marker that begins a comment line
                        (src/cc_public/graph/extract.py lines 91-92,
                        353-360). The editor builds on ruamel.yaml
                        comment classes (src/cc_public/edit/layout.py
                        lines 58, 91-92). reg_concept.yaml holds 57
                        comment lines, such as the header above each
                        entry (lines 248-249). A recorded annotation
                        uses comments in the YAML sense
                        (_data/decision/dec_tooling_language/ann_round_trip_yaml_would_be_our_own_code.yaml
                        lines 14, 21-22). The id prefix cmt is taken
                        by type_commit
                        (_data/register/reg_data_item_type.yaml lines
                        690-717). ASSUMPTION: review comments in tools
                        such as GitHub would add a third sense; no
                        source names the review tool.

