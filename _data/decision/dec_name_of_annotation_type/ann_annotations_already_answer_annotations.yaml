title:                  Replies between annotations
brief:                  |
                        Annotations already support and challenge
                        other annotations, so reply chains exist.
                        Support chains may not loop back, and no edge
                        records an order, so only the ordering half of
                        the claim holds.
description:            |
                        relation_supports and relation_challenges take
                        an argument as subject and a target of an
                        argument as object, through relation
                        constraints (_data/register/reg_relation.yaml
                        lines 218-228, 250-260;
                        _data/register/reg_relation_constraint.yaml
                        lines 107-145). An annotation plays both roles
                        and an option plays the second
                        (_data/register/reg_data_item_type.yaml lines
                        469-477, 526-529). Example:
                        ann_graphs_will_grow challenges
                        ann_python_is_fast_enough
                        (_data/decision/dec_tooling_language/ann_graphs_will_grow.yaml
                        lines 30-33). WTP expected an annotation
                        bearing on another annotation (maintainer's
                        statement, 2026-10-14, will-messages.md line
                        663). relation_supports is declared acyclic
                        (reg_relation.yaml lines 212-215);
                        relation_challenges is not (lines 233-263). No
                        relation records an order among replies. The
                        cited SysML v2 page on comments mentions no
                        threads or ordering
                        (https://docs.nomagic.com/SYSML2P/2026x/annotations-254422957.html).

