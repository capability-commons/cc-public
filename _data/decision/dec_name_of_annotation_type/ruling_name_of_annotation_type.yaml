title:                  Assertion called an annotation
brief:                  |
                        A single assertion about items is an
                        annotation, as in the W3C Web Annotation
                        Vocabulary. Note already names the descriptive
                        field on every item, and comment already names
                        the text after a comment marker. Ruled by
                        William Payne on 2026-10-22.

