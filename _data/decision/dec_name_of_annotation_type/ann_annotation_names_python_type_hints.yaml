title:                  Python meaning of annotation
brief:                  |
                        In Python, annotation names a type hint, and
                        the tooling is Python with type hints
                        throughout. The code never uses the word in
                        that sense today, so the cost is latent.
description:            |
                        Python glossary, term annotation
                        (https://docs.python.org/3/glossary.html#term-annotation).
                        Type hints, for example
                        src/cc_public/edit/edit.py line 474. Under src
                        the word appears only in the graph sense
                        (src/cc_public/check/check.lp lines 135, 290,
                        418, 551, 567-580; edit.py line 117). The cost
                        grows only if the tooling inspects type hints
                        by name. A weak challenge.

