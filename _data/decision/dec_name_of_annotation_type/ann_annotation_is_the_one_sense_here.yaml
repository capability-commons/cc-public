title:                  One sense of annotation in the data
brief:                  |
                        In the data of the repository annotation
                        designates only the item type, while note and
                        comment each already designate something else.
                        Outside the data it keeps other senses: a
                        SysML relationship, a Python type hint and a
                        JSON Schema result.
description:            |
                        concern_terminological_quality asks whether a
                        term designates one concept, and whether it is
                        already used, here or in a cited source, for
                        something else
                        (_data/register/reg_concern.yaml lines 784,
                        786). Under _data, outside decision folders,
                        every use of annotation is the graph sense
                        (for example _data/schema/sch_option.yaml line
                        30, _data/schema/sch_trait_descriptive.yaml
                        line 73,
                        _data/register/reg_writing_style_rule.yaml
                        line 185). No other concept rates annotation
                        as a term, and shared_term reports no row for
                        it (src/cctool/check/friction.lp lines 66-73;
                        friction run on a copy of c71515b0: one row,
                        for item). concept_annotation already rates
                        note and comment deprecated
                        (_data/register/reg_concept.yaml lines
                        321-325). Note designates the descriptive
                        field (_data/schema/sch_trait_descriptive.yaml
                        lines 65-73), and comment the text after a
                        comment marker (src/cctool/graph/extract.py
                        lines 136-137). Outside the data annotation
                        keeps other senses: the SysML v2 relationship,
                        the Python type hint the extractor reads
                        (extract.py line 997) and JSON Schema results.
                        A related match can mark such a false friend
                        (_data/register/reg_relation.yaml lines
                        1143-1157).

