title:                  Clash with the SysML annotation relationship
brief:                  |
                        In SysML v2 the element that carries text
                        about other elements is a comment, and
                        annotation names the relationship that ties it
                        to them. A SysML partner would map a cc-public
                        annotation to Comment.
description:            |
                        SysML v2: comments are related to annotated
                        elements via the annotation relationship
                        (https://docs.nomagic.com/SYSML2P/2026x/annotations-254422957.html).
                        UML and SysML v1 relate a Comment to its
                        AnnotatedElement
                        (https://support.unicomsi.com/manuals/systemarchitect/11482/Architecting_and_designing/SysML.16.102.html).
                        cc-public takes its logical-level terms from
                        Arcadia, a model-based systems engineering
                        method (memory/arcadia-terminology.md lines
                        8-12), though options and annotations are not
                        Arcadia concepts (line 23). The owner's
                        default is to follow a recognized standard
                        (memory/MEMORY.md line 10, 2026-10-13).
                        ASSUMPTION: the partners of a federation are
                        not yet known, so the weight of this against
                        the W3C match is open. A SysML Comment has no
                        argument edges either.

