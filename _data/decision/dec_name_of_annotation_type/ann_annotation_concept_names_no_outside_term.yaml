title:                  No outside term recorded for annotation
brief:                  |
                        The annotation concept names no outside term
                        it corresponds to, unlike its neighbors, so a
                        partner gets no help mapping it.
description:            |
                        concept_annotation gives a preferred term and
                        two deprecated terms and cites no standard
                        (_data/register/reg_concept.yaml lines
                        296-328). concept_option cites ISO/IEC/IEEE
                        42010:2022, clause 5.8.2 of the 2011 edition,
                        MADR and ISO/IEC/IEEE 15288 (lines 348-357).
                        Other concepts state their Arcadia counterpart
                        or say there is none (lines 600, 669, 714). An
                        outside term is now recorded as a match edge
                        from a concept to an external class
                        (_data/register/reg_relation.yaml lines
                        945-1160), and unmapped_concept advises on
                        type_annotation for want of one
                        (src/cc_public/check/advise.lp lines 266-269;
                        review run on a copy of c71515b0). No external
                        document covers the W3C or SysML vocabularies
                        (_data/external_document). A match edge would
                        fix this without a rename.

