title:                  Tooling that now reads Python type hints
brief:                  |
                        ann_annotation_names_python_type_hints says
                        the code never uses annotation in the Python
                        sense and the cost grows only if the tooling
                        inspects type hints. The extractor now reads
                        the type hint of each parameter and the return
                        type to check signatures.
description:            |
                        _parameters in src/cc_public/graph/extract.py
                        (lines 971-1002) reads arg.annotation, the
                        Python type hint, as the type of each
                        parameter (line 997), and _returns (line 1005)
                        reads the return type. signature_mismatch in
                        src/cc_public/check/check.lp (lines 872-883)
                        compares them with what an interface member
                        states. So the word now has its Python sense
                        in the code that builds the graph. Found in
                        the review of 2026-10-22.

