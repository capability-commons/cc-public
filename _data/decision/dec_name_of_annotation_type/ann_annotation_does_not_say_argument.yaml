title:                  Annotation does not say argument
brief:                  |
                        In everyday use an annotation is a remark, not
                        a claim that supports or challenges an option,
                        so a new user must learn the narrower sense.
                        Note and comment share the same gap.
description:            |
                        The concept entry has to say that an
                        annotation is not a finding, not evidence, and
                        not true for want of an answer
                        (_data/register/reg_concept.yaml lines
                        258-263). Will gave annotations the purpose of
                        an argumentation mechanism (owner's statement,
                        2026-10-13T16:42:36Z, will-messages.md line
                        229). Merriam-Webster defines annotate as "to
                        make or furnish critical or explanatory notes
                        or comment"
                        (https://www.merriam-webster.com/dictionary/annotating).
                        A weak challenge.

