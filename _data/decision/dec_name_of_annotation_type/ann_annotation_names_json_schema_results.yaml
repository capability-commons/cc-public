title:                  JSON Schema meaning of annotation
brief:                  |
                        JSON Schema, which the item schemas use, calls
                        what keywords such as title produce
                        annotations. A reviewer of a schema change may
                        meet both senses, though today the repository
                        uses only the graph sense.
description:            |
                        sch_annotation.yaml declares draft 2020-12 and
                        uses unevaluatedProperties (lines 1, 42). JSON
                        Schema 2020-12 core, sections 7.7 and 11.3
                        (https://json-schema.org/draft/2020-12/json-schema-core).
                        The word appears in three schema files, all in
                        the graph sense (sch_annotation.yaml,
                        sch_option.yaml line 30,
                        sch_trait_descriptive.yaml line 73).
                        ASSUMPTION: no plan to report JSON Schema
                        annotation results. A weak challenge.

