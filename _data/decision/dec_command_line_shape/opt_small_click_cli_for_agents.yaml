title:                  Small click command line for agents
brief:                  |
                        Offer one cctool, built on click in the
                        cc_public package: a small surface of one
                        command group, with one parser and one set of
                        exit statuses, to which commands for checks,
                        queries, edits and review are added. Its
                        conventions for agents: query as argument,
                        stdin or file, tab-separated output or --json,
                        --limit, and errors that say what to fix with
                        exit status 2.

