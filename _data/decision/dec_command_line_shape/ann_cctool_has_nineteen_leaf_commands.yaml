title:                  Nineteen leaf commands under a small surface
brief:                  |
                        The command line now has twenty-eight leaf
                        commands in three levels, and the edit
                        commands overlap with batch, so the surface is
                        not small by count, though it is still one
                        mechanism.
description:            |
                        Commands, by their decorators in
                        src/cc_public/cli/*.py: check, friction, gate,
                        format, new, header, link, unlink, set, unset,
                        remove, rename, batch, import, impact, serve,
                        message new, message check, message draft,
                        history check, query sql, query logic, query
                        jq, query sparql, query text, query
                        predicates, export obsidian and export okf.
                        README.md lines 112-138 list all but import. A
                        query has three input routes: QUERY, - for
                        stdin, or --file (querying.py lines 101-108,
                        457-472). batch accepts eight edit kinds, and
                        each single edit command, and import, passes
                        its operations to the same _run that batch
                        uses (editing.py lines 127, 211, 356, 422,
                        477-518).

