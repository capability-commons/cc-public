title:                  Click range wider than the tests allow
brief:                  |
                        The package admits click from 8.1, but the
                        tests read stderr apart from stdout, which
                        click does only from 8.2.0. Only the lock file
                        keeps the tests working.
description:            |
                        pyproject.toml declares click>=8.1,<9. Tests
                        build CliRunner() with no arguments and assert
                        on result.stderr (src/cc_public/cli/_test/
                        test_editing.py lines 43, 84, 91;
                        test_querying.py lines 46, 55). In click 8.1.8
                        CliRunner mixes stderr by default and
                        Result.stderr raises ValueError (click 8.1.8
                        src/click/testing.py lines 147-150, 184).
                        Click 8.2.0 keeps the streams apart
                        (CHANGES.md). pixi.lock pins 8.5.0. The fix is
                        to raise the lower bound.

