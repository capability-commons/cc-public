title:                  Fault status 2 now given by cctool check
brief:                  |
                        Commit 400f1be "Fix cctool check so that
                        checks that cannot run exit with status 2"
                        catches a rule evaluation fault in cctool
                        check. At 360ec14 the command follows the exit
                        convention of the other commands.
description:            |
                        check catches ErrorDatalog, prints "The checks
                        could not be run" and exits with EXIT_ERROR
                        (src/cctool/cli/checking.py lines 57-61 at
                        360ec14). The gate still counts a stage as
                        passed only on return code 0
                        (src/cctool/gate/gate.py line 181), so no
                        automatic caller yet reads status 2 apart from
                        status 1.

