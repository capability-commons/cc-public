title:                  Twenty-eight leaf commands now
brief:                  |
                        ann_cctool_has_nineteen_leaf_commands says the
                        command line has nineteen leaf commands. It
                        now has twenty-eight.
description:            |
                        By the command decorators in
                        src/cc_public/cli: check and friction
                        (checking.py); new, header, link, unlink, set,
                        unset, remove, rename, batch, import and
                        format (editing.py); gate (gating.py); message
                        new, check and draft (messaging.py); history
                        check and impact (auditing.py); query sql,
                        logic, jq, sparql, predicates and text
                        (querying.py); export obsidian and okf
                        (exporting.py); and serve (serving.py).
                        README.md lines 112-138 list all of them but
                        import. Found in the review of 2026-10-22.

