title:                  Exit status 2 for a fault
brief:                  |
                        The chosen command line gives a fault exit
                        status 2, apart from status 1 for a failed
                        check. The old checker, run directly, gave
                        status 1 for both.
description:            |
                        src/cc_public/cli/group.py lines 31-33. cctool
                        gate, message check and the query commands
                        catch known errors and exit with EXIT_ERROR
                        (src/cc_public/cli/querying.py lines 131, 173,
                        246; gating.py; messaging.py). Commit 12f83b7
                        (pre-squash) records the convention. Before
                        6c8d3d5, check.py returned 1 on a failed check
                        (line 360) and raised ValueError on a bad row
                        (line 307) with no handler around main (lines
                        364-365); an unhandled Python exception exits
                        with status 1 (observed 2026-10-15).

