title:                  Hooks depend on an installed entry point
brief:                  |
                        Each git hook runs cctool, which exists only
                        after pixi installs cc_public in editable
                        mode, so one more part can be missing or
                        stale. Recovery is one pixi install and loses
                        no data.
description:            |
                        cctool is cc_public.cli.command:main
                        (pyproject.toml, [project.scripts]); pixi
                        installs cc_public in editable mode
                        ([tool.pixi.pypi- dependencies]).
                        .githooks/commit-msg line 29,
                        prepare-commit-msg line 31 and pre-push line
                        33 run "pixi run --frozen cctool ...". Before
                        6c8d3d5 the task was "python
                        src/check/check.py .", which needed no package
                        install but still needed pixi. The gate runs
                        the staged copy's own source
                        (src/cc_public/gate/gate.py lines 20-26, 64).
                        ASSUMPTION: a stale editable install, for
                        example after a move, stops cctool starting;
                        not tested.

