                        so that a pip install of cctool runs" raises
                        the lower bound of click to 8.2. At 360ec14
                        the declared range admits no version whose
                        CliRunner the tests cannot use.
description:            |
                        pyproject.toml line 39 at 360ec14:
                        click>=8.2,<9. This is the fix the annotation
                        named.

