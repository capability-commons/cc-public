title:                  No third-party parser for scripts run directly
brief:                  |
                        Running check.py directly took no third-party
                        code for its command line. The chosen shape
                        adds click and a build backend for a job
                        argparse in the standard library can do.
description:            |
                        git show 6c8d3d5^:pyproject.toml declares
                        dependencies = []. check.py read sys.argv
                        through main(sys.argv)
                        (6c8d3d5^:src/check/check.py lines 343,
                        364-365). Commit 6c8d3d5 added click and
                        hatchling. The owner asked for click by name
                        (owner's statement, 2026-10-13T21:57:52Z).
                        argparse handles subcommands and options
                        (https://docs.python.org/3/library/argparse.html).
                        Weak: the extra exposure is one well-kept
                        library.

