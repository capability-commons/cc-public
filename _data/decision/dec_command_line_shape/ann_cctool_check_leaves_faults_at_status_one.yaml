title:                  Fault status missing from cctool check
brief:                  |
                        cctool check catches no error, so a fault in
                        rule evaluation ends as a traceback with
                        status 1, the same as a failed check. The
                        convention is missing from the command the
                        gate runs on every commit.
description:            |
                        src/cc_public/cli/checking.py lines 53-63 has
                        no try around the call to check. check() runs
                        cc_public.graph.datalog.run, which can raise
                        ErrorDatalog (src/cc_public/graph/datalog.py
                        lines 285 and 299). pixi run check is "cctool
                        check" (pyproject.toml). The gate counts a
                        stage as passed only on return code 0 (gate.py
                        line 163), so no automatic caller reads status
                        2 apart from status 1. Cheap to close.

