title:                  Force-multiplier without a bound on change volume
brief:                  |
                        The shape was chosen to multiply what an agent
                        can do, and the maintainer calls the review
                        burden huge. cctool impact lists what a commit
                        touches and cctool serve shows each decision
                        for review, but no command limits or measures
                        the volume of change, so the shape still
                        serves the rate of change more than its
                        review.
description:            |
                        Maintainer's statements, 2026-10-13T21:57:52Z
                        ("force-multiplier") and 2026-10-15T10:59:29Z
                        ("the huge (and practically impossible) review
                        burden that we are generating"). The 32
                        commits after the squash 7dda99e, on
                        2026-10-14, change about 8000 lines; 7dda99e
                        alone adds 11910 (git log --numstat, measured
                        2026-10-15). The agent conventions
                        (tab-separated output, --json, --limit;
                        cli/querying.py lines 53-54, 116-123) serve a
                        program. Two commands now serve a person:
                        cctool impact lists the items a commit or the
                        staged content touches and the items near them
                        (auditing.py lines 159-209), and cctool serve
                        serves a review page for each decision
                        (serving.py lines 37-68). No command caps
                        change or reports its size (README.md lines
                        112-138). ASSUMPTION: no measurement links
                        commit volume to cctool. Scripts run directly
                        do no better here.

