title:                  Force-multiplier without a bound on change volume
brief:                  |
                        The shape was chosen to multiply what an agent
                        can do, and the owner now calls the review
                        burden huge. No command limits, groups or
                        summarises change for a person, so the shape
                        serves the rate of change, not its review.
description:            |
                        Owner's statements, 2026-10-13T21:57:52Z
                        ("force-multiplier") and 2026-10-15T10:59:29Z
                        ("the huge (and practically impossible) review
                        burden that we are generating"). The 32
                        commits after the squash 7dda99e, on
                        2026-10-14, change about 8000 lines; 7dda99e
                        alone adds 11910 (git log --numstat, measured
                        2026-10-15). The agent conventions
                        (tab-separated output, --json, --limit;
                        cli/querying.py lines 46-47, 92-99) serve a
                        program; no command reports the size of a
                        staged change (README.md lines 64-80).
                        ASSUMPTION: no measurement links commit volume
                        to cctool. Scripts run directly do no better
                        here.

