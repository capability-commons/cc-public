title:                  Small click command line for agents
brief:                  |
                        Every tool is a command of one cctool, a click
                        group in the cc_public package, so the
                        commands share one parser, one set of exit
                        statuses and the conventions for agents, and
                        every edit goes through one checked route with
                        a dry-run diff. This is the force-multiplier
                        the maintainer asked for. Scripts run directly
                        would need no parser library, but each would
                        carry its own parsing and exit codes, and the
                        costs found, such as reparsing the tree on
                        each query, would fall on them too. Ruled by
                        William Payne on 2026-10-23.

