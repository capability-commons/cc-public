title:                  Click as a small, permissive dependency
brief:                  |
                        Click is BSD-3-Clause, has no dependencies of
                        its own, is actively released, and is used
                        only through its basic API, so the risk it
                        adds is low and could be undone.
description:            |
                        pyproject.toml at project.dependencies lists
                        click>=8.2,<9; the project is Apache-2.0.
                        Click 8.5.0 is BSD-3-Clause with no required
                        dependencies
                        (https://pypi.org/pypi/click/8.5.0/json) and
                        dropped colorama (CHANGES.md, 8.5.0). Pallets
                        made six releases from 2026-04-03 to
                        2026-08-26. pixi.lock at packages.141.sha256
                        pins the 8.5.0 wheel by sha256. The command
                        modules use only click.group, argument,
                        option, echo, Path, File, IntRange and Choice
                        (grep of src/cctool/cli/*.py). ASSUMPTION: a
                        port to argparse would be straightforward;
                        none has been tried.

