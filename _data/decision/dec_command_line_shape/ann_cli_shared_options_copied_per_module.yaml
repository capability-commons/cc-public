title:                  Shared options copied in each module
brief:                  |
                        The --root option is written out seven times
                        in six modules with differing help, and
                        --limit and --json exist only for queries. A
                        change to a common convention spreads to many
                        files.
description:            |
                        --root in src/cc_public/cli/auditing.py line
                        67, checking.py line 38, editing.py lines 76
                        and 344, gating.py line 39, messaging.py line
                        41 and querying.py line 86. editing.py and
                        querying.py each define their own _option
                        helper; messaging.py uses a constant
                        OPTION_ROOT. group.py holds no shared options.
                        --limit and --json are only in querying.py
                        lines 92-99; cctool check has no --json. A
                        fault of the implementation, not of the shape:
                        moving shared options into group.py answers
                        it.

