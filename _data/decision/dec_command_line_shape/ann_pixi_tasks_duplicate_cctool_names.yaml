title:                  Two names for check and gate
brief:                  |
                        The pixi tasks check and gate are second names
                        for cctool check and cctool gate, and the
                        hooks use both forms, so one job is reached
                        two ways.
description:            |
                        pyproject.toml at tool.pixi.tasks.check and
                        tool.pixi.tasks.gate. pre-commit and
                        pre-merge-commit run "pixi run --locked gate";
                        commit-msg, prepare-commit-msg and pre-push
                        run "pixi run --locked cctool ...".
                        README.md#getting-started gives both forms.
                        The rejected alternative also used a pixi
                        task, so this does not favor it. ASSUMPTION:
                        the tasks exist so a person types one short
                        form for check, test and lint.

