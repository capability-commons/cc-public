title:                  Negligible start-up cost of the click wrapper
brief:                  |
                        The click wrapper adds tens of milliseconds to
                        a check that takes seconds, so it costs
                        nothing that matters against running a script
                        directly.
description:            |
                        Measured 2026-10-15 at 89c74d8 with system
                        Python 3.13 and click 8.5.0: importing click
                        took 51 ms, cctool.cli.command 191 ms, and a
                        full cctool check about 2.9 s. Measured again
                        2026-10-22 on the snapshot, on another
                        machine: importing click takes 21 ms and
                        cctool.check.check 137 ms, and the checks
                        themselves, with no store, take about 39 s.
                        Indicative only. command.py imports every
                        command module eagerly (lines 31-39), so check
                        also loads the commit, gate, edit, export and
                        web code it does not use; a lazy import per
                        command would keep this flat as the tooling
                        grows.

