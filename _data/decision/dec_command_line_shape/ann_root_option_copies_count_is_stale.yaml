title:                  Root option now copied in eight modules
brief:                  |
                        ann_cli_shared_options_copied_per_module says
                        --root is written seven times in six modules
                        and --json exists only for queries. --root is
                        now written eleven times in eight modules, and
                        impact also takes --json.
description:            |
                        --root is declared in
                        src/cc_public/cli/auditing.py lines 69 and
                        180, checking.py 44 and 86, editing.py 82 and
                        424, exporting.py 69, gating.py 39,
                        messaging.py 42, querying.py 109 and
                        serving.py 38. auditing.py line 176 gives
                        cctool impact a --json option. group.py still
                        holds no shared option, so the point itself
                        holds. Found in the review of 2026-10-22.

