title:                  Edits refused for items in source files
brief:                  |
                        The edit commands cannot remove or rename an
                        item that lives in a source file, and rename
                        leaves ids in code unchanged, so some graph
                        changes are made by hand, outside the checked
                        route.
description:            |
                        remove and rename refuse items with prefix
                        pym, pyp, pycls, pyf, lpf, lpp, file or shell
                        and say to "move or remove the file by hand"
                        (src/cctool/edit/edit.py lines 112, 857, 899,
                        1063-1074). rename changes the id in YAML
                        documents, in the strings of the logic
                        programs and in the file name; "Other text
                        outside YAML documents, such as python code,
                        is not changed", and files that still name the
                        old id are listed on stderr
                        (src/cctool/cli/editing.py lines 301-325). A
                        hand edit is checked only when cctool check
                        runs, as in the gate (gate.py line 87). The
                        rejected alternative had no edit commands, so
                        this does not favor it. A gap in the functions
                        built, closed by a move command, not by
                        another shape.

