title:                  Edits refused for items in source files
brief:                  |
                        The edit commands cannot remove or rename an
                        item that lives in a source file, and rename
                        leaves ids in code unchanged, so some graph
                        changes are made by hand, outside the checked
                        route.
description:            |
                        remove and rename refuse items with prefix
                        pym, pyp, lpf or file and say to "move or
                        remove the file by hand"
                        (src/cc_public/edit/edit.py lines 105,
                        774-786). rename: "Text outside documents,
                        such as code, is not changed", and files that
                        still name the old id are listed on stderr
                        (src/cc_public/cli/editing.py lines 285-308).
                        A hand edit is checked only when cctool check
                        runs, as in the gate (gate.py line 64). The
                        rejected alternative had no edit commands, so
                        this does not favour it. A gap in the
                        functions built, closed by a move command, not
                        by another shape.

