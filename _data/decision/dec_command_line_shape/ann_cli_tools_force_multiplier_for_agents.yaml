title:                  Command-line tools as a force-multiplier for agents
brief:                  |
                        Command-line tools multiply what Claude Code
                        can do, so the tooling gets a small-surface
                        but powerful command line.
description:            |
                        Owner's statement, 2026-10-13T21:57:52Z: "One
                        thing we learned from the previous
                        implementation was that command-line tools are
                        very much a force-multiplier with Claude
                        Code - so I want to give you a
                        small-surface-area-but-powerful CLI". On the
                        package layout, same message: "The reasoning
                        behind using this structure is the same as it
                        was for the previous implementation". The
                        agent conventions follow the owner's request
                        of 2026-10-13T22:43:25Z: "Does any current
                        best-practice feed into the design of the
                        CLI?" Commits 6c8d3d5 and 12f83b7
                        (pre-squash).

