title:                  Full re-extraction on every query
brief:                  |
                        Each cctool query is a fresh process that
                        reparses the whole tree, about 0.9 s today,
                        growing with the graph. The agent conventions
                        invite many small queries, and the shape
                        offers no reuse between calls.
description:            |
                        src/cc_public/cli/querying.py lines 127 and
                        169 call extract on the root before each
                        query. Measured 2026-10-15: a one-row SQL
                        query takes 926, 980 and 912 ms; under
                        cProfile most of extract is ruamel.yaml load.
                        ASSUMPTION: agents run several queries on an
                        unchanged tree, and parse time grows about
                        linearly, near 9 s per query at ten times the
                        graph. Scripts run directly share the same
                        cost, so this does not favor them.

