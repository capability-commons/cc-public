title:                  One parser and one exit convention for every command
brief:                  |
                        One click group gives every command the same
                        argument parsing and the same three exit
                        statuses, declared once. Scripts run directly
                        would each carry their own parsing and exit
                        codes.
description:            |
                        EXIT_OK, EXIT_NONCONFORMITY and EXIT_ERROR are
                        declared once in src/cctool/cli/group.py
                        within EXIT_OK, EXIT_NONCONFORMITY and
                        EXIT_ERROR, and every command module exits
                        through them (grep EXIT_ src/cctool/cli/*.py).
                        Each kind of command has its own module
                        (auditing, checking, editing, exporting,
                        gating, messaging, querying, serving), and
                        command.py only imports them (the import lines
                        above main), so a new command module adds one
                        import line. Before 6c8d3d5, the old checker
                        read list_arg[1] by hand and returned 1 or 0
                        itself (git show 6c8d3d5^:src/check/check.py
                        lines 343-365). ASSUMPTION: further scripts
                        would have repeated this; no second script
                        existed before 6c8d3d5 to show it.

