title:                  Datalog queries and checked edits delivered
brief:                  |
                        The chosen command line carries both functions
                        the owner asked for: arbitrary Datalog over
                        the graph, and edits refused if they add a
                        failure. The script run directly before
                        6c8d3d5 offered only a check.
description:            |
                        Owner's statement, 2026-10-13T21:57:52Z, asks
                        for "Datalog-oriented tools that enable you to
                        evaluate arbitrary datalog rules or queries
                        against the graph" and "Editing tools that
                        enforce style and graph-rule conformity".
                        cctool query datalog adds the caller's rules
                        to a program that holds every relation
                        (src/cc_public/cli/ querying.py lines 143-153;
                        graph/datalog.py lines 277-297). Every edit
                        goes through _run, which writes nothing if the
                        edit adds a failure (cli/editing.py lines
                        390-425; edit/edit.py lines 866-917). Before
                        6c8d3d5 the only tool was src/check/check.py
                        (git ls-tree -r 6c8d3d5^). ASSUMPTION: scripts
                        run directly could call the same library
                        functions, so the gain against them lies in
                        what was built after 6c8d3d5, not in the click
                        shape itself.

