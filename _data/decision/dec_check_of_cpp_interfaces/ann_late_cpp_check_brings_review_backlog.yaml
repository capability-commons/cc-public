title:                  Backlog of documents awaiting a late check
brief:                  |
                        Every C++ interface control document recorded
                        before the check exists must be looked at
                        again when the check arrives, together with
                        every mismatch it then finds. With 17 of the
                        18 drafted Patrol documents run in GStreamer
                        or the engine, that lands as one change or run
                        of fixes larger than a reviewer reads in one
                        sitting, where a check built first gives each
                        document its own verdict as it arrives.
description:            |
                        Sources:
                        - The cc-patrol drafts hold 18 interface
                          control documents, 8
                          GStreamer, 9 engine and 1 Python
                          (_sources/cc-patrol-notes/decomposition-readiness.md lines
                          197-199); the context note counts all 18 as C++ surfaces
                          (_sources/context.md line 35), but the drafts give one a
                          Python runtime.
                        - A failure that was there before a change is
                          still reported by
                          the person who makes the change (AGENTS.md#before-you-finish).
                        - The edit commands refuse an edit that adds a
                          failure
                          (AGENTS.md#changing-data-items).
                        - The repository asks that each change be
                          small enough to read
                          in one sitting (AGENTS.md#keep-it-small).
                        - Assumption: some documents recorded before
                          the check will
                          disagree with the code when it first runs.

