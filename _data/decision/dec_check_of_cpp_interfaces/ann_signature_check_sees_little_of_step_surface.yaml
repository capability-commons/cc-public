title:                  Narrow view of a signature check on step interfaces
brief:                  |
                        The drafted Patrol documents are all dataflow
                        step surfaces, and every engine component
                        exports the same C signature of untyped
                        pointers, with slots picked by an enum inside
                        the code. A libclang signature check would
                        find the same five parameters in every
                        component and miss the slot order and types
                        the document states. The engine design checks
                        the types in the generator; nothing yet checks
                        the slot order.
description:            |
                        Sources:
                        - All 18 drafted Patrol documents hold a
                          dataflow_step surface
                          and none holds a native surface (grep over
                          _sources/cc-patrol-notes/draft/icd/*.yaml;
                          _sources/cc-patrol-notes/decomposition-readiness.md line 197).
                        - Every component exports reset, step and
                          finalize with the same
                          five arguments, inputs and outputs as void pointer arrays
                          (_sources/axair-orchestrator/docs/component_interface.md lines
                          21-38).
                        - A component picks its slots by enums it
                          defines, and slot
                          order is the order in the component's spec
                          (_sources/axair-orchestrator/docs/component_interface.md lines
                          49 and 58-59).
                        - Slot order matters to the native engine and
                          nothing says so or
                          checks it today (_sources/mapping.md lines 45-46).
                        - The generator checks types from the specs
                          before compiling and
                          emits a static_assert that the dtype size equals sizeof(T)
                          (_sources/axair-orchestrator/docs/execution_levels.md lines 59
                          and 98-101).
                        - Strength: moderate; existing Patrol step
                          functions are planned
                          as native cpp surfaces, where a signature check would see real
                          parameters.

