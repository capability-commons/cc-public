title:                  C++ interfaces checked from the first
brief:                  |
                        A C++ extractor and signature check arrive no
                        later than the first interface control
                        document with a native cpp surface, so no such
                        document is recorded unchecked. Ruled by WTP
                        on 2026-10-24, as recommended: the ruling on
                        restated signatures accepted the duplication
                        only if it is checked mechanically, and the
                        first native document is the real instance the
                        growth rule asks for. The same check covers
                        native c surfaces, since the engine's
                        component contract has C linkage, and the
                        first Patrol documents with C++ code are
                        expected to have native cpp surfaces. A
                        dataflow step surface names no language and is
                        not covered. Whether cc-patrol records its
                        first native document only after a cc-public
                        tag that carries the check is left open.

