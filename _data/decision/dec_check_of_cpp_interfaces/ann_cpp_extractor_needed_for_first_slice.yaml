title:                  Extractor dependency needed for the first slice anyway
brief:                  |
                        The plan expects every Patrol interface to
                        have a C++ surface, and 17 of the 18 drafts
                        run in GStreamer or the engine, so the
                        extractor and its dependency are not optional
                        for long, and deferring them only defers the
                        same dependency. Taking it from the start
                        means it is chosen and locked once, before C++
                        interfaces pile up unchecked.
description:            |
                        Sources:
                        - Every Patrol interface control document will
                          have a cpp native
                          surface or a dataflow step surface implemented in C++, so a
                          C++ extractor moves from later to needed for the first slice,
                          or the first documents go in unchecked
                          (_sources/cc-patrol-notes/plan.md lines 99-102).
                        - The cc-patrol drafts hold 18 interface
                          control documents, 8
                          GStreamer, 9 engine and 1 Python
                          (_sources/cc-patrol-notes/decomposition-readiness.md line
                          197).
                        - Strength: weak; from the dependency view it
                          argues timing
                          only, not whether the dependency is taken.

