title:                  Condition attached to restated signatures
brief:                  |
                        A member that restates a signature duplicates
                        the code, and the ruling on restated
                        signatures accepted that duplication on
                        condition that it is checked mechanically. A
                        C++ document recorded before its check is the
                        duplication without the condition, so checking
                        from the first follows from a decision already
                        made.
description:            |
                        Sources:
                        - The maintainer accepted the duplication on
                          condition that it
                          is checked mechanically
                          (_data/decision/dec_interface_signature_restated/ruling_interface_signature_restated.yaml at brief).
                        - Today only Python signatures are checked;
                          there is no C++
                          extractor (context note, _sources/context.md line 37).
                        - A rule claims no more than something holds
                          (_data/register/reg_design_rule.yaml at entries.rule_claim_only_what_is_held).

