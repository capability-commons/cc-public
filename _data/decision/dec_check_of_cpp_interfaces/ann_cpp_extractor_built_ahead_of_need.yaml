title:                  An extractor built ahead of any document
brief:                  |
                        Checking from the first puts a second
                        extractor beside the Python one, a new
                        mechanism and a sizable body of new code to
                        read, ahead of any recorded document that
                        shows the shape it needs. Recording documents
                        first lets that code arrive later, in smaller
                        pieces shaped by real documents, though the
                        extractor is needed either way, so the timing
                        changes more than the amount.
description:            |
                        Sources:
                        - The existing extractor reads Python with the
                          ast module
                          (src/cctool/graph/extract.py).
                        - The module that extracts facts from the
                          tree, including the
                          Python signature facts, is 1,575 lines
                          (src/cctool/graph/extract.py, wc -l, 2026-10-22).
                        - libclang is the route the plan names for a
                          C++ extractor
                          (_sources/cc-patrol-notes/plan.md lines 77-80).
                        - The repository asks that each change be
                          small enough to read
                          in one sitting (AGENTS.md#keep-it-small).
                        - Assumption: a C++ extractor through
                          libclang, with its check
                          and tests, is several hundred lines or more.

