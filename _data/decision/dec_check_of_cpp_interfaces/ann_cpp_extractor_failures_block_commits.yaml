title:                  Extractor failures that block commits
brief:                  |
                        A libclang extractor run in the gate is a new
                        part that can fail on code it cannot parse,
                        such as C++20 or CUDA sources, and a failure
                        there stops every commit until it is fixed.
                        Building it before the first document puts
                        that risk on the critical path at once.
description:            |
                        Sources:
                        - libclang is the planned route for the
                          extractor
                          (_sources/cc-patrol-notes/plan.md lines 77-80).
                        - Patrol host code is C++20 and its CUDA is
                          C++17
                          (_sources/cc-patrol-notes/plan.md lines 95-98).
                        - A failure in any gate stage stops the commit
                          (README.md#getting-started).
                        - Assumption: libclang will not parse every
                          Patrol source
                          cleanly without per-file flags.
                        - Strength: weak; it argues for a careful
                          build of the extractor
                          more than for leaving C++ unchecked.

