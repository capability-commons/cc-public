title:                  Size and packaging of the libclang dependency
brief:                  |
                        A libclang extractor adds the Clang libraries,
                        tens of megabytes per platform, and Python
                        bindings whose PyPI packagings are each kept
                        by one person, one with no release since March
                        2024; conda-forge carries current builds of
                        both under a license compatible with
                        Apache-2.0. Adding it edits pyproject.toml,
                        which only the owner can relock, and leaves a
                        new dependency to keep working.
description:            |
                        Sources:
                        - The libclang wheel on PyPI bundles the
                          shared library, has one
                          maintainer, and its latest release is 18.1.1 of 2024-03-17
                          (https://pypi.org/project/libclang/).
                        - The clang package on PyPI has only the
                          bindings, one
                          maintainer, latest 21.1.7 of 2025-12-18
                          (https://pypi.org/project/clang/).
                        - conda-forge carries libclang-cpp22.1 at
                          22.1.8, Apache-2.0
                          WITH LLVM-exception, about 23 MB for linux-64 and 15 to 16 MB
                          for macOS, and python-clang at 23.1.4 under the same license
                          (https://prefix.dev/channels/conda-forge/packages/libclang-cpp22.1;
                          https://prefix.dev/channels/conda-forge/packages/python-clang).
                        - cc-public is licensed Apache-2.0 (LICENSE
                          line 2;
                          pyproject.toml line 40), and its environment already takes
                          clingo from conda-forge (pyproject.toml lines 58 and 66).
                        - Any edit to pyproject.toml makes pixi.lock
                          stale, and only the
                          owner can relock (context note, _sources/context.md line 30).
                        - Strength: moderate; conda-forge's current
                          builds largely
                          answer the packaging risk.

