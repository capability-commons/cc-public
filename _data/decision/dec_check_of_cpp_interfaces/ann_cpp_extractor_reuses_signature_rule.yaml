title:                  Reuse of the existing signature rule
brief:                  |
                        The signature check is a rule over extracted
                        signature facts, so a C++ extractor that emits
                        facts of the same shape can reuse the rule and
                        its failure text. The rule names the python
                        facts and the python function type today, so
                        it must first be made to take a function of
                        either language. The new part to maintain is
                        then the extractor itself.
description:            |
                        Sources:
                        - The signature check joins stated parts with
                          extracted
                          signature facts (src/cctool/check/check.lp lines 872-883).
                        - libclang is the obvious route for a C++
                          extractor
                          (_sources/cc-patrol-notes/plan.md lines 77-80).

