title:                  Header parse time in every commit check
brief:                  |
                        The check stage runs on every commit,
                        data-only commits included, and runs the logic
                        programs afresh each time, so a C++ check that
                        parses headers with libclang adds its parse
                        time to every commit unless its result is
                        cached. Interfaces left unchecked at first
                        cost nothing at the gate.
description:            |
                        Sources:
                        - A data-only commit is still checked and
                          linted (README.md#getting-started).
                        - The verdict store caches only layout and
                          schema verdicts; the
                          checks of the logic programs run afresh each time, and the
                          gate of a push uses no store (README.md#getting-started).
                        - libclang is the planned route to a C++
                          extractor
                          (_sources/cc-patrol-notes/plan.md lines 78-80 and 99-101).
                        - Patrol's code uses GStreamer and CUDA
                          (_sources/cc-patrol-notes/plan.md lines 147-148).
                        - Assumption: parsing a header that includes
                          GStreamer or CUDA
                          headers takes on the order of a second or more per translation
                          unit.
                        - Strength: moderate; a cache keyed on the
                          header text and the
                          check's code, as the store already does for schema verdicts,
                          could remove most of it.

