title:                  Per-member verdict on the review page
brief:                  |
                        With a C++ signature check, the review page of
                        an interface control document with a native
                        C++ surface marks, member by member, whether
                        the code agrees with it, so a reviewer reads a
                        verdict instead of comparing each signature by
                        hand. The 17 drafted Patrol documents that run
                        in GStreamer or the engine, 1,619 lines of
                        YAML in all, are dataflow step surfaces, which
                        the page shows as a drawing and a table of
                        ports, not as signatures. So the verdict
                        reaches the native documents the plan expects,
                        such as the retiming slice, not those drafts.
description:            |
                        Sources:
                        - The review page of an interface control
                          document shows a row
                          for each member and marks whether the code agrees with what
                          the member states (src/cc_public/web/page.py lines 67-75).
                        - Today only Python signatures are compared
                          with code (context
                          note, _sources/context.md line 37;
                          _sources/cc-patrol-notes/plan.md lines 77-80).
                        - The cc-patrol drafts hold 18 interface
                          control documents, 8
                          GStreamer, 9 engine and 1 Python
                          (_sources/cc-patrol-notes/decomposition-readiness.md line
                          197).
                        - The 18 draft documents total 1,712 lines of
                          YAML, and the 17
                          that do not run in Python total 1,619 (wc -l over
                          _sources/cc-patrol-notes/draft/icd/*.yaml, 2026-10-22).

