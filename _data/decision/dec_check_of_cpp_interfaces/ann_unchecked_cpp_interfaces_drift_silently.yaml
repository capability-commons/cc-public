title:                  Silent drift of unchecked C++ interfaces
brief:                  |
                        An interface control document whose C++
                        signatures nothing compares with the code can
                        drift from it with no check failing, and the
                        mismatch then surfaces only when parts are
                        joined or a person notices. The first Patrol
                        slice is planned as a document with a native
                        C++ surface, so the gap opens with the first
                        document.
description:            |
                        Sources:
                        - Today only Python signatures are checked
                          against interface
                          control documents; there is no C++ extractor (context note,
                          _sources/context.md line 37).
                        - The parameter and signature mismatch checks
                          compare stated
                          parts with Python facts only, and their fix text reads change
                          the member if the interface has changed, or the code if it has
                          drifted (src/cc_public/check/check.lp lines 775-825 and
                          841-883).
                        - The schema already admits language cpp on a
                          surface
                          (_data/schema/sch_interface_control_document.yaml lines
                          606-612).
                        - Existing C++ step functions map to documents
                          with a native cpp
                          surface, and the first slice is a retiming document with a cpp
                          surface (_sources/cc-patrol-notes/plan.md lines 49, 55-58 and
                          200).
                        - A rule claims no more than something holds
                          (_data/register/reg_design_rule.yaml lines 44-51).
                        - Limit noted by reliability and functional
                          suitability: the
                          engine's own checks cover dataflow edges, by a hash of the
                          dtype at wiring time and a static_assert on size in generated
                          code, so the gap is widest for native surfaces
                          (_sources/axair-orchestrator/docs/execution_levels.md lines 59,
                          67 and 98-101).

