title:                  One edge shape for every item that holds a reason
brief:                  |
                        The edge that records why an item exists is
                        defined once, in sch_trait_relation, and every
                        item type with edges takes it from there, so
                        one extractor reads every reason in one form.
description:            |
                        sch_trait_relation calls itself "The single
                        traceability mechanism for the whole
                        repository"
                        (_data/schema/sch_trait_relation.yaml lines
                        16-20, 63-79). Eleven schemas, ten item types
                        and sch_register, compose it with allOf;
                        sch_register_entry refers to its $defs/edge
                        "rather than restated, so the two cannot
                        drift" (sch_register_entry.yaml lines 45-66).
                        The extractor reads every edge the same way
                        (src/cc_public/graph/extract.py near line
                        460). ASSUMPTION: the older arrangement also
                        defined the edge once, so this separates
                        composition from copying more than from
                        inheritance.

