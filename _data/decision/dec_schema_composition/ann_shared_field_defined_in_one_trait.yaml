title:                  One definition per shared field
brief:                  |
                        Each shared field bundle and value type is
                        defined in one file, so a change to it is made
                        once and reaches every item type that composes
                        it.
description:            |
                        id_self and guid_self as item fields are
                        defined in
                        _data/schema/sch_trait_identity.yaml lines
                        55-119; the one other declaration of the pair,
                        for a relation's inverse, takes both value
                        types from sch_primitive
                        (sch_regentry_relation.yaml lines 84-90). 20
                        of the 31 schemas $ref sch_standalone, a trait
                        or sch_register_entry, and there are 9 $refs
                        to $defs/id and 6 to $defs/guid (grep at
                        89c74d8). The September review of the previous
                        iteration found "14 register schemas that are
                        one template" among jobs done twice
                        (notes/cc-public-session-context.md, section
                        "cc-public repository review (Sep 17)").

