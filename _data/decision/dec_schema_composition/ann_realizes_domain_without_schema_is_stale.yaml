title:                  Ends of relation_realizes now held by constraints
brief:                  |
                        The old annotation says that relation_realizes
                        has no type_schema in its domain. A relation
                        has no domain now: its ends are governed by
                        relation constraints over roles. The point
                        still holds, since no schema plays the role
                        its source admits.
description:            |
                        _data/register/reg_relation.yaml holds no
                        domain or range field, and
                        ruling_relation_end_governance rules that
                        relations name constraints on roles.
                        relation_realizes names
                        relcon_is_implementation on its source and
                        relcon_is_design_entity on its target
                        (reg_relation.yaml lines 357-388).
                        relcon_is_implementation admits
                        rol_implementation, which python modules,
                        packages, classes and functions, logic program
                        files and predicates, files, shell scripts and
                        dataflow nodes play, and type_schema does not
                        (_data/register/reg_data_item_type.yaml).
                        sch_schema still composes only the 2020-12
                        meta-schema and sch_standalone
                        (_data/schema/sch_schema.yaml lines 43-45).
                        Found in the review of 2026-10-22.

