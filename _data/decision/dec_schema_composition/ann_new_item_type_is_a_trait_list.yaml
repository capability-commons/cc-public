title:                  New item types as schemas that list traits
brief:                  |
                        A new item type is one small schema that lists
                        the traits it takes, so extending the graph
                        with new kinds of item stays in data that any
                        port reads unchanged.
description:            |
                        sch_option adds nothing beyond sch_standalone
                        and sch_trait_relation but a required brief
                        (_data/schema/sch_option.yaml lines 17-21 and
                        47-54). sch_schema states that "a trait
                        declares properties, a library declares only
                        $defs, and a composite declares only allOf"
                        (sch_schema.yaml lines 27-32). ASSUMPTION: an
                        inheritance hierarchy would also scale by
                        adding schemas, so this shows the choice costs
                        no flexibility more than that it gains any.

