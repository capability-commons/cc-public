title:                  Trait fields that cannot be made optional
brief:                  |
                        allOf can only add constraints, so an item
                        that wants a trait's field optional cannot
                        compose the trait. The register entry schema
                        therefore declares relation by hand beside the
                        trait path every other type uses.
description:            |
                        sch_trait_edge makes relation required
                        (_data/schema/sch_trait_edge.yaml lines
                        44-45). sch_register_entry declares its own
                        optional relation and refers to $defs/edge,
                        since composing the trait "would make relation
                        required on every entry in every register"
                        (sch_register_entry.yaml lines 45-66). allOf
                        needs every subschema to pass
                        (https://json-schema.org/understanding-json-schema/reference/combining#allof).
                        The edge shape stays single, since both paths
                        $ref the same $defs/edge.

