title:                  Two mechanisms for every shared shape
brief:                  |
                        Object shape is shared only by allOf over
                        $ref, and value types only by $ref into one
                        $defs library. Schemas themselves become
                        standalone items by the same allOf, with no
                        extra mechanism.
description:            |
                        26 of the 31 files in _data/schema use the
                        allOf keyword; the other five are the four
                        traits and sch_primitive (grep at 89c74d8).
                        sch_standalone only composes identity,
                        descriptive and rights (sch_standalone.yaml at
                        description and allOf). sch_schema composes
                        sch_standalone and the 2020-12 meta-schema
                        (sch_schema.yaml at allOf). The checker uses
                        the stock validator with no project-specific
                        composition logic
                        (src/cctool/check/schema.py). The count stays
                        at two however many types are added.

