title:                  Rethink of inheritance toward one traceability mechanism
brief:                  |
                        Will asked for the schema inheritance to be
                        rethought for a greenfield reimplementation,
                        with one universal traceability mechanism
                        across the repository, and fixed that
                        "composes means allOf".
description:            |
                        Owner's requests in the August review, as
                        recorded in notes/cc-public-session-context.md
                        lines 8-10, an assistant-written summary of
                        Will's sessions, so possibly not his exact
                        words ("Rethink the schema inheritance as
                        preparation for a greenfield
                        reimplementation", "Have one universal
                        traceability mechanism across the whole
                        repository"). Will's own words: "composes
                        means allOf" (W 2026-10-09T17:52:14Z). A
                        further recorded reason, written by an
                        assistant, not by Will, is in
                        _data/schema/sch_primitive.yaml lines 23-28:
                        primitives are separate "so that a value type
                        ... can be reused without pulling in any
                        object shape". The older inheritance
                        arrangement is not in the repository; history
                        starts at bb8c338, which already holds the
                        traits.

