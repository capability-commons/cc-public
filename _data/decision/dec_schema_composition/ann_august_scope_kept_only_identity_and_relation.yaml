title:                  August scope without descriptive and rights traits
brief:                  |
                        The August outcome kept only primitives,
                        identity and relation, and moved descriptive
                        and rights to arc/. Their return to the core
                        rests on the later standalone decision, not on
                        the August request.
description:            |
                        notes/cc-public-session-context.md line 16
                        (scope kept "so we can focus only on the
                        really core key mechanics of traceability")
                        and lines 102-103 ("Descriptive and rights
                        traits are back in the core", listed as not
                        matching yet). The standalone decision:
                        sch_standalone composes identity, description
                        and rights (owner's statement, W
                        2026-10-09T17:52:14Z, will-messages.md line
                        53). So the August reason supports small
                        traits, not the present set of four.

