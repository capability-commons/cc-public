title:                  One shared filter for both schema checks
brief:                  |
                        Commit dfc4e13 "Fix cctool message check so
                        that it reports no spurious fields" moves the
                        filter into one function that the checker and
                        the message check both call. At 360ec14 the
                        message check has the filter, and a new tool
                        can call it rather than write its own.
description:            |
                        cctool.check.schema.errors leaves out
                        unevaluatedProperties errors while any other
                        error remains (src/cctool/check/schema.py
                        lines 280-295 at 360ec14), and the message
                        check calls it (src/cctool/commit/message.py
                        line 274). A field that no schema allows is
                        still reported
                        (src/cctool/commit/_test/test_message.py lines
                        127-130). The spread itself is a property of
                        allOf under 2020-12 and remains for any other
                        validator a partner uses.

