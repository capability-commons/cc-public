title:                  Schema references resolved without the network
brief:                  |
                        Every $ref names a schema by URL, but the
                        checker resolves those URLs from the local
                        files, so a new host needs no network access
                        and no live domain to check the graph.
description:            |
                        References by full URL, for example
                        sch_trait_identity.yaml line 58 and
                        sch_option.yaml lines 48-49. Registry keyed by
                        $id: src/cc_public/check/schema.py lines 90-91
                        and 145-153. The 2020-12 meta-schema comes
                        from the installed jsonschema library (same
                        file lines 56-57). No module under src imports
                        urlopen, requests or httpx (grep at 89c74d8).
                        A port keeps this only if it registers schemas
                        locally the same way.

