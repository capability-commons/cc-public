title:                  Schemas with no traced reason
brief:                  |
                        Each type chooses its traits, so a type can
                        leave out the relation trait without any check
                        noticing. sch_schema does, so the schemas that
                        make up lco_item_graph have no edge to the
                        component or decision that calls for them.
description:            |
                        sch_schema composes the 2020-12 meta-schema
                        and sch_standalone only
                        (_data/schema/sch_schema.yaml lines 41-43). 4
                        of 31 schema files carry a top-level relation
                        field, each empty (grep "^relation:").
                        relation_realizes has no type_schema in its
                        domain (_data/register/reg_relation.yaml lines
                        343-347). The concern's first measure is
                        elements with no traced reason
                        (reg_concern.yaml line 514). ASSUMPTION: a
                        hierarchy with one root that carried relation
                        would give every type a validated place for
                        edges. The gap is cheap to close by composing
                        sch_trait_edge in sch_schema.

