title:                  Register schemas still copied per register
brief:                  |
                        Each register still needs its own schema file
                        that differs from the others mainly in names,
                        so composition alone does not remove the "one
                        template" duplication the September review
                        named.
description:            |
                        Six sch_reg_* schemas of 38 to 43 lines each;
                        sch_reg_concern.yaml and sch_reg_relation.yaml
                        differ only in id, guid, title, prose and one
                        $ref (diff at 89c74d8). The August review
                        decided "every register has the same shape, so
                        there is one register schema"
                        (notes/cc-public-session-context.md, "Base
                        schema review (Aug 24-25)"). JSON Schema
                        2020-12 offers $dynamicRef for a generic
                        schema, which the repository does not use.
                        Keeping the per-register files was itself
                        decided on 2026-10-13, because JSON Schema
                        cannot pick the entry schema from the data and
                        for portability to federated partners
                        (memory/MEMORY.md line 11). Part of each copy
                        is deliberate prose (memory/prose-restating-
                        structure.md, 2026-10-13). A change to the
                        shared shape still touches only
                        sch_register.yaml.

