title:                  Small traits a partner can adopt piecemeal
brief:                  |
                        Because each trait is a separate schema and
                        value types sit in a library with no object
                        shape, a partner can take one piece, such as
                        the guid format or the identity trait, without
                        taking the rest.
description:            |
                        sch_trait_identity holds only id_self and
                        guid_self
                        (_data/schema/sch_trait_identity.yaml at
                        description). Each schema has an absolute $id
                        under https://capability-commons.org/schema/
                        (sch_schema.yaml at properties.$id). The
                        project is meant to be federated: guid_self
                        separates ids that collide "across
                        repositories in the federation"
                        (sch_trait_identity.yaml at description), and
                        binding files are kept for "portability for
                        federated partners" (memory/MEMORY.md line
                        11). sch_primitive has no type, properties or
                        required list (sch_primitive.yaml at brief and
                        description), and every reference to it is a
                        $ref into $defs, never an allOf; for example
                        sch_register_entry.yaml at
                        properties.alias.items takes the id value type
                        from it without composing any object shape
                        (checked by the maintainability and simplicity
                        advocates and by grep at 89c74d8). The gain
                        grows with the number of item types, if the
                        traits stay small and stable.

