title:                  Closed shapes that need a 2019-09 or later validator
brief:                  |
                        A shape built by allOf can only be closed with
                        unevaluatedProperties, which only validators
                        for draft 2019-09 or later understand. Partner
                        tools that stop at draft-07 or OpenAPI 3.0,
                        and any port of the tooling, must find such a
                        validator.
description:            |
                        17 of the 31 files in _data/schema close with
                        unevaluatedProperties: false, for example
                        sch_option.yaml lines 47-56 and
                        sch_register.yaml line 80.
                        additionalProperties cannot see properties
                        declared in allOf branches (JSON Schema
                        2020-12 Core sections 10.3.2.3 and 11.3). The
                        dialect is pinned in sch_schema.yaml lines
                        51-55, and the checker uses
                        Draft202012Validator
                        (src/cctool/check/schema.py lines 56-57 and
                        107). OpenAPI 3.0 has no
                        unevaluatedProperties; 3.1 aligns with 2020-12
                        (spec URLs not fetched). Will said he "may
                        revisit this and port the tooling to Rust or
                        some other language in future" (WTP
                        2026-10-14). The Rust crate jsonschema lists
                        draft 2020-12 among its supported dialects
                        (README of
                        github.com/Stranger6667/jsonschema);
                        ASSUMPTION: its support for
                        unevaluatedProperties is complete. The cost is
                        per tool, not per item, and falls as tools
                        move to 2020-12.

