title:                  No inheritance keyword in JSON Schema
brief:                  |
                        JSON Schema has had no inheritance keyword
                        since draft-04, so a hierarchy would also be
                        built from allOf and $ref and would face the
                        same closing limit, unless it copied inherited
                        fields into each schema.
description:            |
                        The extends keyword of draft-03 (section 5.26,
                        https://json-schema.org/draft-03/draft-zyp-json-schema-03.pdf)
                        is absent from the draft-04 meta-schema on.
                        The JSON Schema guide says allOf cannot
                        "extend" a schema in the sense of
                        object-oriented inheritance, and that
                        additionalProperties blocks extension by allOf
                        (https://json-schema.org/understanding-json-schema/reference/combining
                        and reference/object, "Extending Closed
                        Schemas"). Noted by the compatibility,
                        simplicity and traceability advocates.
                        ASSUMPTION: the older arrangement, which is
                        not in the repository, used allOf rather than
                        copying.

