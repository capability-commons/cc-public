title:                  Verification of sources, not predictions
brief:                  |
                        The verifier confirms that a claim matches its
                        source but does not measure. An unmeasured
                        claim can reach a ruling and be contradicted
                        only afterwards.
description:            |
                        The verifier checked every factual claim
                        against the repository and the web (note
                        advocate-experiment-2-checks-engine.md line
                        9). Argument A5 passed with "core claim
                        unmeasured" (line 29;
                        ann_each_evaluation_pays_a_fixed_cost.yaml).
                        The ruling was committed at 22:15:58Z
                        (6c0a949). A measurement at 22:54:06Z
                        (86df114, ann_clingo_is_slower_at_this_size)
                        found the fixed cost of starting Souffle does
                        not dominate at this size. The ruling did not
                        rest on A5 (W 2026-10-14T22:11:54Z;
                        ruling_cross_item_checks_engine.yaml lines
                        17-19), so the point is moderate. It argues
                        for a measuring step where a claim is cheap to
                        test, not for dropping verification.

