title:                  Merge and verify ahead of review
brief:                  |
                        Separate merge and verify steps remove
                        duplicate premises and check facts before the
                        reviewer sees the draft. Without them, that
                        work falls to whoever merges by hand or to the
                        reviewer, and a fact list must be prepared in
                        advance.
description:            |
                        Pilot advocates worked from "the same list of
                        repository facts", prepared in advance (note
                        advocate-pilot-tooling-language.md line 3).
                        The same round-trip YAML premise came up under
                        three concerns (line 47), and "most of their
                        assumptions were facts that a read-only look
                        would have settled" (line 46). In experiment 2
                        merging cut fifteen proposals to twelve
                        annotations (note
                        advocate-experiment-2-checks-engine.md line
                        8). Across the 33 decisions of the current run
                        with a batch, advocate files total 12,397
                        lines and drafts about 1,600 lines, about 376
                        and 48 per decision (wc -l, 2026-10-15).
                        ASSUMPTION: errors not caught by a verifier
                        reach the review or the tree and cost effort
                        there.

