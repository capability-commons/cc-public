title:                  Merge and checks already done in the pilot
brief:                  |
                        The pilot did merge and check facts, in one
                        pass by the session that ran it. What the
                        chosen process adds is repository access for
                        advocates and separate merge and verify
                        agents, not merging and checking as such.
description:            |
                        Raised by the cost, functional suitability,
                        simplicity and traceability advocates. Note
                        advocate-pilot-tooling-language.md: nine
                        proposals were merged into a draft of eight
                        (lines 3-5), one dropped as a duplicate (line
                        40), and five assumptions were checked against
                        the repository and the web, with one claim
                        softened (lines 28-36). The chosen process
                        gives these jobs to separate agents with their
                        own briefs (templates/merger.md,
                        templates/verifier.md) and gives advocates
                        repository access (note advocate-brief.md
                        lines 5-9). The brief of
                        opt_advocates_with_fact_list now says "no
                        separate merge or verification step" (lines
                        13-15), which matches this reading of the
                        lessons "needs a merge step" and "needs a
                        verification step" (pilot note lines 47-48) as
                        asking for separate, planned steps.

