title:                  Agent per concern with the pilot lessons
brief:                  |
                        Arguments made by one agent per concern give
                        an explainable trace that shows which concern
                        was under- or over-represented. The next run
                        takes in the pilot lessons: repository access,
                        a merge step, a verification step, and review
                        as the bottleneck.
description:            |
                        Maintainer's statement, W
                        2026-10-13T16:42:36Z: arguments "made by
                        'agents', each representing a concern", with
                        "the argument trace being an explainable
                        artifact", so that if a decision is wrong "we
                        can then look at the argument which led to it,
                        and understand which engineering concern was
                        under- or over- represented". Maintainer's
                        statement, W 2026-10-14T21:51:15Z: "Proceed
                        with the next experiment, incorporating the
                        lessons learned from the pilot." The lessons
                        are in note advocate-pilot-tooling-language.md
                        lines 46-49, written by an assistant. The
                        brief is note advocate-brief.md. Pilot
                        arguments f584b4d; experiment 2 c7058e3.

