title:                  Minutes of machine effort per decision
brief:                  |
                        Producing the arguments takes minutes of
                        machine effort per decision, and runs
                        unattended. The merge and verify steps add
                        minutes, small next to the review they save.
description:            |
                        Pilot advocates took about 30 seconds each
                        (note advocate-pilot-tooling-language.md line
                        49). In experiment 2 each advocate took one to
                        two minutes and the verifier about four and a
                        half (note
                        advocate-experiment-2-checks-engine.md line
                        11). The run went on overnight across many
                        decisions while the owner slept (W
                        2026-10-14T23:39:41Z; STATE.md lines 1-4).
                        ASSUMPTION: the cost in currency per month is
                        not recorded; whether runs fall in a flat
                        subscription or are billed per token is
                        unknown.

