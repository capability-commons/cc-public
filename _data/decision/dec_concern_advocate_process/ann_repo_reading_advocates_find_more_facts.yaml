title:                  Fewer wrong facts from repository reading
brief:                  |
                        Advocates that read the repository, followed
                        by a verifier, record fewer wrong or
                        overstated facts than advocates working from a
                        fact list. They also find facts that no fact
                        list held.
description:            |
                        Pilot advocates had no repository or web
                        access; one claim ("no mature Rust round-trip
                        YAML library") was too strong and was softened
                        (note advocate-pilot-tooling-language.md lines
                        30-32 and 48). In experiment 2 the verifier
                        caught one wrong count (132 of 151 test
                        functions, not 151 of 171) and three
                        overstatements, and settled two open
                        assumptions (note
                        advocate-experiment-2-checks-engine.md lines
                        53-55). The corrected count is the one
                        recorded
                        (ann_each_evaluation_pays_a_fixed_cost.yaml).
                        Experiment 2 advocates found that a missing
                        Souffle output file reads as a pass and that a
                        tab or newline in a fact crashes cctool check,
                        which the note says a fact list would not have
                        given (lines 42, 63-65, 69). In the current
                        run the verifiers, not the advocates, found an
                        uncaught DuplicateKeyError and a silently
                        skipped $ref to a missing schema (STATE.md
                        lines 31 and 47).

