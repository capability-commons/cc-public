title:                  Merge step that undoes the split
brief:                  |
                        Each advocate finds the same facts on its own,
                        and a separate merge step exists to remove the
                        duplicates the split creates. One author would
                        state each premise once.
description:            |
                        Each advocate reads the same packet and
                        repository (templates/advocate.md lines 9-13),
                        four or five per decision
                        (templates/drivers.txt). In the pilot one
                        premise came up under three concerns (note
                        advocate-pilot-tooling-language.md line 47).
                        In experiment 2 four advocates raised the
                        Souffle provisioning premise on their own, and
                        fifteen proposals became twelve annotations
                        (note advocate-experiment-2-checks-engine.md
                        lines 8 and 40); the result,
                        ann_souffle_is_outside_the_locked_environment,
                        carries four concern links (c7058e3). The
                        merger's brief is to drop duplicates
                        (templates/merger.md line 19). ASSUMPTION: a
                        single author would need no merge step; no
                        single-author run exists.

