title:                  Advocate output beyond one reviewer
brief:                  |
                        One advocate per driver yields about thirteen
                        proposed annotations per decision, and a
                        person must read each one. Review effort grows
                        with decisions times drivers, the process sets
                        no cap, and the reviewer is one person.
description:            |
                        Each advocate gives one to three annotations
                        (templates/advocate.md line 23). Each decision
                        got one advocate per driver of its subject,
                        two to seven in the run and mostly five
                        (templates/drivers.txt; work/*/adv-*.md), and
                        the components now have five to eight drivers
                        each (_data/logical_component). The finished
                        run proposes 887 annotations in 70 batches, 5
                        to 22 per decision (grep over
                        work/*/batch.yaml); on 2026-10-15 the 33
                        batches then done proposed 379. The tree held
                        29 annotations at 89c74d8 and holds 1352 now
                        (find _data -name 'ann_*.yaml'). In the pilot,
                        review took longer than producing (note
                        advocate-pilot-tooling-language.md line 49);
                        after experiment 2 "Review is still the
                        bottleneck" (note
                        advocate-experiment-2-checks-engine.md line
                        75). The maintainer expects annotations "might
                        quickly explode out of control" (W
                        2026-10-14T21:51:15Z) and reviews in batches
                        of five decisions (W 2026-10-14T23:39:41Z).
                        ASSUMPTION: no review time has been recorded,
                        and no single-author run exists to compare
                        with.

