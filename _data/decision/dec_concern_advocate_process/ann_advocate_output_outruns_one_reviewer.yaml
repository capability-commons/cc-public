title:                  Advocate output beyond one reviewer
brief:                  |
                        One advocate per driver yields about eleven
                        proposed annotations per issue, and a person
                        must read each one. Review effort grows with
                        issues times drivers, the process sets no cap,
                        and the reviewer is one person.
description:            |
                        Each advocate gives one to three annotations
                        (templates/advocate.md line 23). Each issue
                        gets four or five advocates
                        (templates/drivers.txt). The 33 batches of the
                        current run with a batch propose 379
                        annotations in about 11,200 lines (grep and wc
                        -l over work/*/batch.yaml, 2026-10-15); the
                        cost advocate counted 297 over the first 26, 8
                        to 17 per issue. The run covers 68 issues
                        (work/index.txt). The tree holds 29
                        annotations at HEAD 89c74d8. In the pilot,
                        review took longer than producing (note
                        advocate-pilot-tooling-language.md line 49);
                        after experiment 2 "Review is still the
                        bottleneck" (note
                        advocate-experiment-2-checks-engine.md line
                        75). The owner expects annotations "might
                        quickly explode out of control" (W
                        2026-10-14T21:51:15Z) and reviews in batches
                        of five issues (W 2026-10-14T23:39:41Z).
                        ASSUMPTION: the whole run proposes about 780
                        annotations, an extrapolation. ASSUMPTION: no
                        review time has been recorded, and no
                        single-author run exists to compare with.

