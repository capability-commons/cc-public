title:                  Fact checking done twice
brief:                  |
                        Each advocate must source every claim, then a
                        verifier checks every claim again against the
                        same sources. One job is done by two
                        mechanisms.
description:            |
                        Advocates name a source for every claim or
                        mark it an assumption (templates/advocate.md
                        line 17; note advocate-brief.md line 41). The
                        verifier checks every factual claim against
                        the repository, the maintainer's messages, the
                        memory notes and the web
                        (templates/verifier.md line 5), the same
                        sources the advocates get
                        (templates/advocate.md lines 9-15). In
                        experiment 2 the second check corrected one
                        count and narrowed three claims (note
                        advocate-experiment-2-checks-engine.md lines
                        53-54); whether that justifies the extra
                        mechanism is a question for other concerns.

