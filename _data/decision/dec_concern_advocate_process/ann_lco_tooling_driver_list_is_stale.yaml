title:                  Functional suitability now a driver of lco_tooling
brief:                  |
                        ann_advocate_coverage_bound_by_driver_list
                        says lco_tooling is still driven only by
                        maintainability, reliability, performance
                        efficiency, simplicity and dependency risk. It
                        is now also driven by functional suitability
                        and reviewability.
description:            |
                        _data/logical_component/lco_tooling.yaml at
                        edge hold seven relation_is_driven_by edges,
                        the last two to concern_functional_suitability
                        and concern_reviewability.
                        ruling_drivers_of_the_tooling upholds the
                        seven. The general point, that a concern off
                        the driver list is never argued, still holds.
                        Found in the review of 2026-10-22.

