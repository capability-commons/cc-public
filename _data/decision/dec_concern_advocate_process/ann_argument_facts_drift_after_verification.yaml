title:                  Drift of argument facts after verification
brief:                  |
                        Arguments that a verifier passed still needed
                        their facts fixed in each batch, and facts
                        keep shifting as the tree changes. So a
                        fact-check runs on drafts before they are
                        written to the tree, and again on the
                        arguments already there, as part of the daily
                        review.
description:            |
                        On 2026-10-23 each of four batches of
                        decisions landed with a commit that fixed the
                        facts of its arguments (ce5117a6, 5be5be97,
                        6a01d588, 1c12d4c9) and another that brought
                        the briefs of options back in line with the
                        tree (646c9957, eef04ee4, 3c6d8b4d, 683f1be0).
                        Four more fixed annotations so that they match
                        the tree or cite upstream sources (234433f9,
                        cd7abc43, 84698670, 178bd0c1). That is 12 of
                        the 48 commits that day. Line citations drift
                        whenever a cited file changes: the commit that
                        froze the decisions of the test copies had to
                        fix five annotations that cite
                        src/cctool/conftest.py. Found in the daily
                        review of 2026-10-24. The maintainer expects
                        to fact-check often, since facts shift
                        continually (2026-10-24).

