title:                  Coverage bounded by the driver list
brief:                  |
                        The process runs one advocate per listed
                        driver, so a concern missing from the list is
                        never argued and nothing flags the gap. That
                        is the under-representation the argument
                        record was meant to expose.
description:            |
                        The check asks that every driver recorded on
                        the subject is argued, not every concern
                        (commit 3d7ef5b). After experiment 2 the note
                        suggests making concern_functional_suitability
                        a driver of lco_tooling, since reliability
                        excludes whether a result is right (note
                        advocate-experiment-2-checks-engine.md line
                        73; reg_concern.yaml line 118). lco_tooling is
                        still driven by maintainability, reliability,
                        performance efficiency, simplicity and
                        dependency risk only (lco_tooling.yaml lines
                        21-41). So the checks engine was ruled on
                        (6c0a949) with no argument for functional
                        suitability; the nearest,
                        ann_text_file_facts_reject_or_lose_data, was
                        spoke for reliability. Yet 20 uses of four
                        string built-ins moved to string functions
                        called from Python (note line 46; commit
                        6230e98). The maintainer wants a process "to
                        make sure all relevant concerns are
                        considered" (W 2026-10-14T19:33:44Z). A single
                        author has the same gap; this argues for a
                        coverage step more than for another
                        alternative.

