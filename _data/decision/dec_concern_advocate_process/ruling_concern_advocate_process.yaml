title:                  Advocates with merge and verification
brief:                  |
                        Arguments come from one agent per driver
                        concern that reads the repository, so each
                        concern is heard and its links show where each
                        argument came from. A merge step states each
                        shared premise once, a verifier checks facts,
                        and a review against the current tree adds
                        what went stale or unargued before a person
                        rules, since a fact list missed facts and a
                        single author would set concern links only as
                        labels. Ruled by William Payne on 2026-10-22.

