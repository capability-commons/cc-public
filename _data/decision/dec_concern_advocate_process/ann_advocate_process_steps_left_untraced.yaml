title:                  Process steps with no trace in the graph
brief:                  |
                        Each argument passes through a proposal, a
                        merge and a verification, but the tree records
                        only the final annotation. Nothing links it
                        back to the proposals and corrections, and a
                        dropped or merged proposal leaves no item.
description:            |
                        An annotation has no author, time, confidence
                        or verdict field (sch_annotation.yaml at
                        description and usage).
                        relation_speaks_for_concern says which concern
                        an argument speaks for, "not who made it or
                        whether it is sound" (reg_relation.yaml). The
                        experiment 2 merge and corrections are
                        recorded only in notes outside the repository
                        (note advocate-experiment-2-checks-engine.md
                        lines 8 and 51-55); the packet rates
                        confidence medium for this reason. Commit
                        messages f584b4d and c7058e3 carry a summary.
                        The tree checks mentions of item ids, not of
                        files or papers (check.lp). The other
                        alternatives share the gap but have fewer
                        steps to lose. It argues for recording the
                        process in the tree.

