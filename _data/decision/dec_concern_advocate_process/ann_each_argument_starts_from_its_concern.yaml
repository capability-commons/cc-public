title:                  Concern links from origin, not label
brief:                  |
                        In the chosen process each argument comes from
                        an agent whose one job is to argue one named
                        concern, so its concern link is where it came
                        from. A single author does every job and sets
                        the concern links afterwards, as labels.
description:            |
                        Each advocate gets its concern entry, with its
                        excludes line, and is told to stay inside it
                        and that it is not the judge (note
                        advocate-brief.md lines 15-21;
                        templates/advocate.md lines 3-5). In the pilot
                        each advocate stayed within its concern (note
                        advocate-pilot-tooling-language.md line 45).
                        The merger merges and adds no arguments
                        (templates/merger.md line 19); the verifier
                        checks facts and batch rules only
                        (templates/verifier.md lines 5-9); a person
                        determines (W 2026-10-14T19:22:57Z and
                        19:33:44Z). The check refuses a ruling while a
                        driver is unargued (check.lp lines 448-453),
                        but a single author could pass it too; what it
                        cannot see is where an argument came from. The
                        chosen process has more mechanisms in total.
                        ASSUMPTION: a single author would set concern
                        links after writing; no single-author run is
                        recorded.

