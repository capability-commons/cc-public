title:                  Advocates with merge and verification
brief:                  |
                        One agent per driver concern argues from a
                        shared brief, with read-only access to the
                        repository and the web, and keeps premises
                        apart. A merge step removes duplicates, a
                        verifier checks facts, and a person reviews
                        and determines.

