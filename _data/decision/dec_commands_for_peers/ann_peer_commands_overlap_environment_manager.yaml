title:                  Peer commands tied to the environment manager
brief:                  |
                        Setting up, pinning and upgrading a dependency
                        are jobs the environment manager already does,
                        and switching a peer between a release and a
                        local checkout means editing that manager's
                        manifest. A command group would either do
                        those jobs twice or know only pixi's manifest,
                        so a partner would have to adopt pixi to use
                        it, while documented steps can name the change
                        for any manager.
description:            |
                        Sources:
                        - cc-public's environment and its tasks are
                          defined in pixi tables of pyproject.toml
                          (pyproject.toml lines 57-79; README.md lines
                          54-56).
                        - pixi has commands to add, update and upgrade
                          dependencies
                          (https://pixi.sh/latest/reference/cli/pixi/).
                        - The plan recommends a pixi git dependency
                          pinned to a tag, with a path override for
                          local work (_sources/cc-patrol-notes/plan.md
                          lines 69-72).
                        - cctool impact already lists the items a
                          commit adds, removes, renames or changes
                          (AGENTS.md lines 201-204).
                        - Every hook runs through pixi, so a host
                          without pixi cannot commit
                          (_data/decision/dec_environment_manager/ann_hooks_and_guidance_bound_to_pixi.yaml).
                        - Assumption: the command group would be
                          written for pixi first, as the only manager
                          in use. Strength: weak to moderate;
                          switching to a local checkout and applying
                          rename maps are not plainly pixi's jobs, and
                          the commands could support more than one
                          manager or print the steps.

