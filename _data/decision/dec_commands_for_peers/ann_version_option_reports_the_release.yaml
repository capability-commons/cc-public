title:                  Release reported by the version option
brief:                  |
                        Under the version file ruling, the command
                        line reports its version through click's
                        version option, so a peer can see which
                        release its tool is with no peer command,
                        which covers part of what the group's report
                        would do. The version file changes only at a
                        release, so a local checkout reports the
                        version of the last release, and the guidance
                        must still say how to see that a peer runs a
                        checkout rather than the release.
description:            |
                        Sources:
                        - The version is written in one file that the
                          release step edits from the computed bump,
                          and the command line reports it through
                          click's version option
                          (_data/decision/dec_source_of_the_version_number/ruling_version_in_a_version_file.yaml,
                          brief).
                        - Neither is built yet: cctool's only
                          top-level option is --help (cctool --help),
                          and pyproject.toml still states version
                          0.1.0 (pyproject.toml line 39).
                        - The command group "reports which release it
                          pins and what an upgrade would touch"
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - A peer switched to a local checkout runs
                          whatever that checkout holds
                          (_data/decision/dec_commands_for_peers/ann_local_checkout_switch_bypasses_pin.yaml,
                          brief). Strength: weak; it takes away one
                          small command and leaves the harder half of
                          the report.

