title:                  Report of what an upgrade would touch
brief:                  |
                        A command that reports which release a peer
                        pins and what an upgrade would touch lets the
                        peer's maintainer see every item an incoming
                        release changes before accepting it, including
                        items that hold personal data. Manual steps
                        leave that review to what the maintainer
                        remembers to look at, so an unwanted or
                        tampered change is easier to miss. Both
                        options run inside the peer and send none of
                        its data out.
description:            |
                        Sources:
                        - The command group "reports which release it
                          pins and what an upgrade would touch"
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - cctool impact already lists the items a
                          commit adds, removes, renames or changes
                          (AGENTS.md lines 201-204), and cctool edits
                          offer --dry-run to show an edit first
                          (AGENTS.md lines 109-110).
                        - Some federated segments will hold personal
                          data under the GDPR (owner's statement,
                          2026-10-22).
                        - All peers are the owner's own for now
                          (owner's statement, 2026-10-22).
                        - Assumption: a step done by hand from prose
                          is skipped or done partly more often than a
                          step a command does every time, and the
                          commands run locally. Strength: moderate; a
                          real integrity control, though the threat is
                          small while all peers are the owner's.

