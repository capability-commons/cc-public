title:                  Peer setup that waits on open federation decisions
brief:                  |
                        What a peer sets up, and from where, is still
                        open. _data is in the wheel only
                        provisionally, pending the decision on what
                        crosses between segments, and the publishing
                        route is tags now with a channel still to be
                        decided, possibly Axair Systems' own. Steps in
                        the guidance are cheap to rewrite when these
                        are ruled, while a command group built now
                        fixes one answer in tested code and in the
                        declared command line.
description:            |
                        Sources:
                        - The wheel carries _data provisionally: "if
                          we end up with some sort of MCP service or
                          API for the graph, then it's not clear if we
                          SHOULD put _data in the wheel", which waits
                          on the decision on what crosses between
                          segments
                          (_data/decision/dec_who_consumes_a_release/ruling_consumers_by_what_they_consume.yaml,
                          brief; owner's statement, 2026-10-24).
                        - dec_what_crosses_between_segments and
                          dec_publishing_route have no ruling. The
                          route option the owner added is release tags
                          now and a channel later, "possibly a
                          proprietary route such as Axair Systems'
                          own"
                          (_data/decision/dec_publishing_route/opt_publish_tags_now_channel_to_be_decided.yaml,
                          brief).
                        - The group sets up a peer, switches it
                          between a release and a local checkout, and
                          upgrades it
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - Assumption: setting up a peer differs when
                          the release ships _data as files and when a
                          service answers queries for the graph, and
                          when the release comes from a tag and when
                          it comes from a channel. Strength: moderate
                          today, falling as those two decisions are
                          ruled.

