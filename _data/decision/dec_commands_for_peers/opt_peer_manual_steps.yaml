title:                  Documented manual steps
brief:                  |
                        Describe in the guidance the steps for setting
                        up, switching and upgrading a peer, with pixi
                        doing the work: install the tool of a release
                        in an environment of its own from the lock
                        that release publishes, add the parts the peer
                        builds into its product to its own environment
                        with declared ranges, and point either part at
                        a local checkout for local work. Add a cctool
                        command only for a step that a real peer needs
                        and pixi cannot do, such as applying the
                        renames of a release.

