title:                  Faster remedy across every peer
brief:                  |
                        When a release fixes a vulnerability every
                        peer must take the fix, and an upgrade command
                        makes that one repeatable step per peer, which
                        shortens the time to remedy. With only the
                        owner's own peers the saving is small until
                        outside partners join.
description:            |
                        Sources:
                        - The security concern measures "Time to
                          remedy a reported vulnerability, in days."
                          (_data/register/reg_concern.yaml line 165)
                        - "I'd like to be able to respond to reported
                          problems quickly and largely automatically"
                          (owner's statement, 2026-10-22T16:33).
                        - "All peers are my own, so this is acceptable
                          for now." (owner's statement,
                          2026-10-22T16:21) Strength: moderate.

