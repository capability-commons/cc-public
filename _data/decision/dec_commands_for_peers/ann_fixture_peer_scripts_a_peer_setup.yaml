title:                  Fixture peer that scripts a peer's setup
brief:                  |
                        Once a peer can consume cc-public, the ruled
                        release gate installs the built package fresh
                        and runs a fixture peer against it, so code
                        that sets up a peer from a release will exist
                        and be tested at each release whichever option
                        is ruled. A setup command could share that
                        code and its tests, which lowers the cost of
                        the command group. The fixture is set up where
                        the gate chooses, so it tests less than a real
                        peer's setup on other hosts and networks.
description:            |
                        Sources:
                        - Before a release is tagged, the package is
                          built from the tagged tree and installed in
                          a fresh environment, and, once a peer can
                          consume cc-public, a fixture peer checks
                          against it
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml,
                          brief).
                        - The release gate tests both the lock and a
                          fresh resolve of the ranges
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml,
                          brief).
                        - The fixture peer should run the declared
                          commands
                          (_data/decision/dec_declared_public_api/ann_command_behavior_set_by_click.yaml,
                          brief).
                        - The case against the group counts it as new
                          code to read, test and port
                          (_data/decision/dec_commands_for_peers/ann_peer_command_group_ahead_of_need.yaml,
                          brief).
                        - Assumption: the fixture's setup is written
                          in Python in cctool's gate code. Strength:
                          weak; no fixture exists yet, and none can
                          until a peer can consume cc-public.

