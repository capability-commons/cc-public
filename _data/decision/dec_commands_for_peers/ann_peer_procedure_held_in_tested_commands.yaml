title:                  Peer procedure held in tested commands
brief:                  |
                        Manual procedures in this repository already
                        carry traps each reader must learn, nothing in
                        the gate runs documented steps, and steps for
                        a peer would differ by platform and by network
                        access. A command group turns setting up and
                        upgrading a peer into the same few commands on
                        every supported platform, held in code the
                        gate tests.
description:            |
                        Sources:
                        - The worktree procedure is documented as
                          manual shell steps with warnings such as "Do
                          not run git worktree repair or git worktree
                          move" (AGENTS.md lines 20-35), and the
                          bundle procedure warns never to use git
                          format-patch and git am (AGENTS.md lines
                          49-60).
                        - Procedures for agents are kept as skills
                          (AGENTS.md lines 175-182); the tests check
                          only that the commands, pixi tasks and ids
                          the guides name exist, and nothing runs the
                          steps
                          (src/cctool/cli/_test/test_guidance.py
                          lines 15-25 and 151-198), while the gate
                          runs the tests under src only when code is
                          staged (src/cctool/gate/gate.py lines 99
                          and 173-191).
                        - Setting up a peer needs at least a
                          dependency pinned to a release and a path
                          override for local work
                          (_sources/cc-patrol-notes/plan.md lines
                          69-72).
                        - The workspace locks osx-arm64, osx-64 and
                          linux-64 (pyproject.toml line 59), and the
                          atlas VM has no network (context note,
                          _sources/context.md line 30).
                        - The owner will move to main "before outside
                          partners use us" (owner's statement,
                          2026-10-22T16:30).
                        - Assumption: manual steps differ by platform
                          and by network access, so a reader must pick
                          the right variant on each new host.
                          Strength: moderate; the saving grows with
                          the number of peers and hosts, and today
                          there is one peer.

