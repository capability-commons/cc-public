title:                  Peer commands shipped inside the package
brief:                  |
                        If the peer commands ship in cctool, a partner
                        who takes the package already has them, so
                        commands that report the pinned release and
                        what an upgrade would touch help a partner use
                        what it receives with no new tool to install.
description:            |
                        Sources:
                        - The chosen package holds the tooling, the
                          shared data and the engine
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml,
                          brief; owner's statement, 2026-10-22).
                        - The command group sets up a peer, reports
                          its pinned release and what an upgrade would
                          touch, switches between a release and a
                          local checkout, and upgrades it
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - "If it helps to make tooling to help support
                          this, then we should definitely consider
                          it." (owner's comment, 2026-10-22,
                          recorded in the same option's description)
                          Strength: moderate; the gain is real for
                          partners on the same tool stack and smaller
                          for others.

