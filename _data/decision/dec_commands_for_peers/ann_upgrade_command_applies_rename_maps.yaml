title:                  Upgrade command needed by rename maps
brief:                  |
                        If peers absorb renames by maps, some command
                        must apply them, and one upgrade command that
                        pins and applies is one mechanism where manual
                        steps leave the same job to a person. This
                        argues for one command rather than the whole
                        group, and depends on how renames are
                        absorbed.
description:            |
                        Sources:
                        - Under rename maps a command applies the maps
                          of every release in between to the peer
                          (_data/decision/dec_how_peers_absorb_renames/opt_upgrade_by_rename_maps.yaml,
                          brief).
                        - cctool rename already rewrites every YAML
                          document that names an id (AGENTS.md lines
                          124-128). Strength: weak.

