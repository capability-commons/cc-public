title:                  Peer command group
brief:                  |
                        A group of cctool commands sets up a peer,
                        reports which release it pins and what an
                        upgrade would touch, switches it between a
                        release and a local checkout, and upgrades it.
                        Ruled by William Payne on 2026-10-24. This
                        argues for a route that installs cctool
                        system-wide, so that people can create peer
                        repositories easily, which in a way makes it a
                        wrapper for pixi; that route needs decisions
                        of its own.

