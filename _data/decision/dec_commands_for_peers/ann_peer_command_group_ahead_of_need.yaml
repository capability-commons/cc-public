title:                  Command group ahead of its second user
brief:                  |
                        While every peer is the owner's own on a known
                        machine, documented steps cover the one
                        environment that exists, and a command group
                        for setting up, reporting, switching and
                        upgrading is new code to read, test, port to
                        each platform and keep in step with a release
                        process not yet built. The case weakens once a
                        second host or an outside partner appears,
                        which the owner already expects.
description:            |
                        Sources:
                        - "Add a type, relation, field or command only
                          when a real instance needs it, and keep each
                          change small enough to read in one sitting."
                          (AGENTS.md lines 236-238)
                        - cc-patrol, the peer being planned, is
                          private and local to atlas only, and nothing
                          in it is built yet
                          (_sources/cc-patrol-notes/plan.md lines 1-3
                          and 109).
                        - "All peers are my own, so this is acceptable
                          for now." (owner's statement,
                          2026-10-22)
                        - The release process is still to be designed
                          and built (owner's statement,
                          2026-10-22), and no release has ever
                          been made (context note, _sources/context.md
                          line 33).
                        - The owner will move to main before outside
                          partners use cc-public (owner's statement,
                          2026-10-22). Strength: moderate for
                          maintainability, weak for flexibility; the
                          argument is about timing more than need.

