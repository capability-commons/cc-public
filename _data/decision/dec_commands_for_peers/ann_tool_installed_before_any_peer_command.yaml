title:                  First install of the tool before any peer command
brief:                  |
                        Under the consumers ruling, cctool reaches a
                        peer as an application installed in an
                        environment of its own from the lock its
                        release publishes, so no cctool command exists
                        on a host until that install is done. A setup
                        command in cctool cannot make its own first
                        install, so that step is documented, or done
                        by a separate installer, under either option,
                        and the group's setup command covers only what
                        follows it.
description:            |
                        Sources:
                        - What a peer runs, such as cctool and its
                          hooks, is an application installed from the
                          tested lock each release publishes
                          (_data/decision/dec_who_consumes_a_release/ruling_consumers_by_what_they_consume.yaml,
                          brief), in an environment of its own
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml,
                          brief).
                        - No standard installer reads a lock from a
                          dependency, so the split option adds a
                          published environment file and a way to
                          install it for its tool part
                          (_data/decision/dec_who_consumes_a_release/ann_shipped_environment_needs_a_lock_installer.yaml,
                          brief).
                        - The command group "sets up a peer"
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - Assumption: no installer outside cctool is
                          planned; a separate one would be a further
                          tool for a partner to install. Strength:
                          moderate for the setup part; it leaves the
                          case for later commands, such as an upgrade
                          that applies rename maps, untouched.

