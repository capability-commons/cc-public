title:                  Peer commands as promises of the command line
brief:                  |
                        Under the ruled split of the public API, the
                        command line has an interface control document
                        of its own that promises commands, flags, exit
                        statuses and named JSON outputs. Every command
                        of a peer group becomes a member that peers
                        rely on, so after 1.0 a change to it is
                        breaking and waits for a major release. Steps
                        that pixi carries out add no member. Before
                        1.0, which is six months or more away, members
                        change freely, so the cost starts later.
description:            |
                        Sources:
                        - The command line has an interface control
                          document of its own, which promises
                          commands, flags, exit statuses and named
                          JSON outputs, not human-readable text, and
                          is checked against click's own description
                          of each command before 1.0; each document
                          has one required exposure field, peer or
                          internal
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml,
                          brief).
                        - After 1.0, breaking work collects on next
                          until a major release, and 1.0 is "likely to
                          be 6 months or more away"
                          (_data/decision/dec_breaking_work_after_version_one/ruling_breaking_work_after_version_one.yaml,
                          brief).
                        - A command line document makes each command
                          and its parameters a member that the history
                          check can see renamed or removed
                          (_data/decision/dec_declared_public_api/ann_command_members_held_to_click_registrations.yaml,
                          brief).
                        - The group sets up a peer, reports its pinned
                          release and what an upgrade would touch,
                          switches it, and upgrades it
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - Assumption: the group's commands would be
                          declared with exposure peer, since peers run
                          them. Strength: weak before 1.0, moderate
                          after it, growing with each command and flag
                          the group adds.

