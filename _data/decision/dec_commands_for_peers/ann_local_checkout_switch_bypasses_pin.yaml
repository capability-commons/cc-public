title:                  Local checkout switch around the pin
brief:                  |
                        While a peer is switched to a local checkout
                        it runs whatever that checkout holds rather
                        than a pinned release, so the command must
                        make that state visible and easy to leave, or
                        it becomes a quiet way around the pin. The
                        same risk exists in local work without a
                        command, which a command that reports the
                        switch may reduce.
description:            |
                        Sources:
                        - The command group "switches it between a
                          release and a local checkout"
                          (_data/decision/dec_commands_for_peers/opt_peer_command_group.yaml,
                          brief).
                        - The plan recommended "the pixi git
                          dependency pinned to a tag, with a path
                          override for local work"
                          (_sources/cc-patrol-notes/plan.md lines
                          71-72).
                        - "All peers are my own, so this is acceptable
                          for now." (owner's statement,
                          2026-10-22) Strength: weak.

