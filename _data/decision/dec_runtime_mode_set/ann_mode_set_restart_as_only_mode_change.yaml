title:                  Restart as the only way to change mode
brief:                  |
                        With no runtime switching, the only way to
                        move from one configuration to another, such
                        as Patrol's fallback to drawn-on video, is to
                        stop the process and start the other variant,
                        so every change of mode is an outage. Patrol
                        needs no automatic switching today, so the
                        cost is real but not yet incurred.
description:            |
                        Sources:
                        - Patrol's headless output may fall back "to
                          drawn-on video if they
                          cannot be kept in step" (_sources/cc-patrol-notes/draft/README.md
                          lines 6-7); that fallback is a configuration choice, with no
                          automatic switching for now (same file, lines 86-87).
                        - The no-switching option runs one resolved
                          graph and does not
                          switch while it runs
                          (_data/decision/dec_runtime_mode_set/opt_no_runtime_switching_at_first.yaml at brief).
                        - Reliability measures availability and mean
                          time to recover
                          (_data/register/reg_concern.yaml at entries.concern_reliability.measure).
                        - ASSUMPTION: a restart of the engine process
                          with a new
                          configuration takes longer than a switch between steps; neither is
                          measured.
                        Concerns: reliability. Any change set also
                        avoids the restart, but more weakly here,
                        since its other costs are argued elsewhere.
                        Strength: weak now, moderate later; nil while
                        every change of mode is made on the bench, and
                        it grows with fielded systems whose modes
                        change in service.

