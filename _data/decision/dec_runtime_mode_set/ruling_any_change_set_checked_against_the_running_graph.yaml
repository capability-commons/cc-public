title:                  Any change set checked against the running graph
brief:                  |
                        A deployment may apply any change set that
                        checks against the resolved dataflow graph it
                        is running. Ruled by WTP on 2026-10-26,
                        against Claude's recommendation of no
                        switching at first, in keeping with the ruling
                        for one engine with static and dynamic
                        subgraphs. With variants resolved in Python
                        only, cctool computes a change set and the
                        target checks it before applying it, which
                        bears on the open decision on the change set
                        at a step.

