title:                  Size of a shipped mode set
brief:                  |
                        A named set ships every member, so code and
                        data on the target grow with the number of
                        modes, each member is one more generated
                        schedule to build and check, and the permitted
                        switches can grow as the square of the
                        members. Any change set and no switching ship
                        one graph.
description:            |
                        Sources:
                        - "Each runnable variant is one generated
                          static schedule, so the
                          build matrix grows with the number of leaves"
                          (_sources/variants-framing.md line 61).
                        - A change set between modes is the difference
                          of two resolved
                          variants (_sources/variants-framing.md line 55), and one carrying
                          a digest applies only to the exact graph it was made against
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_pins_one_exact_graph.yaml).
                        - Peak memory is a measure of performance
                          efficiency
                          (_data/register/reg_concern.yaml lines 211-214).
                        - ASSUMPTION: with N modes and every switch
                          allowed there are N(N-1)
                          differences; a declared list of allowed switches would bound that.
                        Concerns: performance efficiency. Strength:
                        moderate; weak at Patrol's scale of five
                        runnable variants
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 24-34), of which a deployment would ship
                        few, and stronger at ten times the modes
                        unless members share one superset schedule.

