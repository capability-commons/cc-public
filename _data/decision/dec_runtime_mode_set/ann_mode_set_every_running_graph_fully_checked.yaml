title:                  Every running graph covered by a full check
brief:                  |
                        With a named set of pre-resolved modes or with
                        no switching, every graph a deployment can run
                        was resolved and checked in full before it
                        shipped, which the orchestrator draft asks so
                        that a safety case covers what is deployed.
                        With any change set, a run of accepted change
                        sets can reach a graph no one resolved as a
                        variant, so no simulation run or safety
                        argument covered it ahead of time, and it gets
                        all eleven checks only if each change set is
                        checked in full by cctool.
description:            |
                        Sources:
                        - Within a segment, reconfiguration "should
                          select from a finite set
                          of pre-validated topologies (modes) rather than rewire
                          arbitrarily, so the deployed configuration is always one that a
                          safety case covers"
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          212-215; also lines 169-171). The draft leaves open how such modes
                          are declared and checked (same file, line 233).
                        - The named-set option resolves and checks
                          each member ahead of
                          time, and a change set only switches between members
                          (_data/decision/dec_runtime_mode_set/opt_named_set_of_pre_resolved_modes.yaml at brief); the any-change-set option admits any change set that
                          checks against the running graph
                          (opt_any_change_set_checked_against_the_running_graph.yaml in the
                          same folder, lines 12-15).
                        - Resolved variants are checked by all eleven
                          dataflow checks
                          (_sources/cc-patrol-notes/variants.md lines 86-89); the runtime
                          checks listed so far cover four, three of them among the eleven
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_runtime_checks_cover_part_of_eleven.yaml).
                        - The owner expects the engine to support
                          safety-involved and
                          security-involved systems "to some reasonable degree" (owner's
                          statement, 2026-10-22T20:19, _sources/context.md line 25).
                        - ASSUMPTION: under any change set, the graph
                          after the k-th change
                          set depends on all earlier ones, so the reachable set cannot be
                          enumerated ahead of time.
                        Concerns: safety, reliability. Strength:
                        strong, and grows with scale: the checked set
                        grows linearly with modes, while the
                        reachable, never-checked graphs grow with the
                        change sets applied in the field.

