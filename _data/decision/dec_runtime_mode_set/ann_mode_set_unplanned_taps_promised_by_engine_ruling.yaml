title:                  Unplanned taps the engine ruling promises
brief:                  |
                        The engine ruling keeps a dynamic subgraph so
                        that a user can add logging, recording or
                        telemetry nodes later, and a named set of
                        modes cannot add a tap nobody planned without
                        a new set. A change set checked against the
                        running graph fits that ruling, though the
                        runtime checks drafted so far cover only part
                        of the eleven.
description:            |
                        Sources:
                        - A build with no dynamic nodes leaves out the
                          dynamic machinery
                          unless its user asks for it, "for example to add logging, data
                          recording or telemetry nodes later"
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 12-25).
                        - The runtime option of the change-set
                          decision checks port types,
                          unfed inputs, loops and crossings
                          (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_the_runtime.yaml
                          lines 12-19).
                        - The prior art cited for named sets is
                          AUTOSAR post-build variants
                          (_sources/survey/generative-and-transforms.md lines 13 and 138),
                          which MathWorks documents as activated "on or after the AUTOSAR
                          software component startup", not switched in mid-run
                          (https://www.mathworks.com/help/autosar/ug/configure-post-build-variant-conditions.html).
                          Checked 2026-10-25. So switching between members in mid-run goes
                          beyond what that precedent documents.
                        Concerns: functional suitability. It
                        challenges the named set as the only
                        mechanism, not as one part of one. Strength:
                        moderate; unplanned taps grow with deployments
                        diagnosed in the field.

