title:                  Targets with no code loader
brief:                  |
                        A named set or a single graph can be linked
                        whole ahead of time, so it runs where there is
                        no dlopen or no OS. Any change set that may
                        add a node not in the binary needs a loader on
                        the target, and must fall back to one of the
                        other two where none exists.
description:            |
                        Sources:
                        - The dynamic host loads component libraries
                          with dlopen
                          (_sources/axair-orchestrator/docs/execution_levels.md line 65); a
                          component can also be linked statically and called directly (same
                          file, lines 16-31).
                        - On a target with no OS or no loader, live
                          code needs every version
                          linked ahead of time
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_live_needs_a_code_loader_on_target.yaml).
                        - The owner wants placement to cover systems
                          with no OS (owner's
                          statement, 2026-10-24, as quoted in
                          _data/decision/dec_change_set_at_a_step/ann_change_set_made_where_cctool_is_absent.yaml).
                        - C++17 is planned for embedded reach (owner's
                          statement,
                          2026-10-21, paraphrased in _sources/context.md line 9).
                        - ASSUMPTION: the any-change-set option admits
                          change sets that add
                          nodes; if it were limited to rewiring nodes already linked, this
                          point would fall away.
                        Concerns: flexibility. Strength: strong for
                        the number of platforms; it does not depend on
                        the number of nodes or modes.

