title:                  Adapting a fielded system without a new release
brief:                  |
                        Under a named set or no switching, a mode
                        nobody foresaw, for a new host or a new
                        outside system, needs a new set built and
                        deployed; under any change set the running
                        system can be adapted in place. Loosely
                        coupled systems that join and leave are
                        handled at gateway nodes, outside the
                        segment's topology, so the need is narrower
                        than it looks.
description:            |
                        Sources:
                        - Swarms and fleets have variable numbers of
                          platforms, so a fixed
                          topology cannot be assumed
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          174-176); gateway nodes keep the segment's topology closed (same
                          file, lines 184-195).
                        - The engine is to incorporate "the
                          dynamic-graph capabilities I'd
                          postponed in the past" (owner's statement, 2026-10-20,
                          _sources/context.md line 8).
                        - Flexibility covers adapting the system when
                          its environments
                          change (_data/register/reg_concern.yaml lines 338-342).
                        - Software-defined vehicles are kept current
                          by over-the-air
                          updates through a lifecycle "often spanning 10-15 years"
                          (https://arxiv.org/html/2507.19446v1, section II.A, checked
                          2026-10-25; summarized in
                          _sources/survey/generative-and-transforms.md line 110).
                        Concerns: flexibility. Strength: moderate; it
                        grows with fielded systems and their time in
                        service, and weakens where gateways absorb the
                        change.

