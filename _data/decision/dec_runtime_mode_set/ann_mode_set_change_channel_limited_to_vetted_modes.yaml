title:                  Change channel limited to choosing a vetted mode
brief:                  |
                        Under a named set, the worst a forged or
                        replayed switch message can do is select
                        another member that was already checked; under
                        any change set, the same channel can carry new
                        topology and, where new nodes are loaded, new
                        code. With no switching there is no change
                        channel to attack, while a named set still
                        needs the switch authenticated and must
                        exclude members never meant for service, such
                        as replay.
description:            |
                        Sources:
                        - A digest match proves neither the content
                          nor the sender of a
                          change set
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_proves_neither_content_nor_sender.yaml),
                          and no option there says who may send one
                          (ann_change_set_sender_and_its_record_unstated.yaml in the same
                          folder).
                        - A live change that brings in a node version
                          is a channel for new
                          code into a running process
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_live_is_a_code_loading_channel.yaml).
                        - Patrol takes commands from outside systems
                          through an API,
                          FastAPI to start with
                          (_sources/cc-patrol-notes/draft/README.md lines 88-91).
                        - Patrol's family holds a replay variant that
                          keeps analysis only
                          and feeds it from a clip reader
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines 12-30;
                          listed in _sources/cc-patrol-notes/draft/README.md line 33).
                        - Security asks "What can an attacker reach,
                          and what would it
                          cost?" (_data/register/reg_concern.yaml at entries.concern_security.question.2).
                        - ASSUMPTION: a switch message under the named
                          set carries only a
                          mode name, and the selector rejects names outside the shipped
                          set.
                        Concerns: security, safety. Strength: strong
                        and scale-free for the attack surface; the
                        risk of a wrong mode chosen grows with the
                        number of members, which argues for a small
                        set per deployment.

