title:                  Mode switch with no checker or new code on the target
brief:                  |
                        When the modes are known ahead of time, every
                        check stays in cctool, and the target need not
                        check, parse or load code to switch: every
                        member's nodes can be linked in at build time
                        and a switch is a selection between steps,
                        which enable flags in a frozen schedule may
                        already cover. Under any change set, the
                        target needs a reader for change sets, a code
                        loader for nodes not in the binary, and either
                        a checker that repeats the dataflow rules in a
                        second language or a digest check that pins
                        each change set to one exact graph.
description:            |
                        Sources:
                        - A frozen schedule is generated C++ with
                          static storage and a
                          straight-line list of direct calls, each guarded by a per-node
                          enable flag, "the one thing that can change at runtime"
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          35-40); with LTO small components inline (lines 54-57).
                        - The dynamic host dlopens component
                          libraries, checks every edge at
                          wiring time and steps nodes through function pointers (same file,
                          lines 65-68).
                        - A build with no dynamic nodes leaves out the
                          dynamic machinery
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          lines 22-25).
                        - Runtime checks between steps delay the next
                          step
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_runtime_check_lengthens_step_gap.yaml);
                          a runtime that loads a graph likely needs a parser
                          (_data/decision/dec_first_engine/ann_graph_loading_runtime_needs_a_parser.yaml);
                          checking at the target means rules in two languages or a digest
                          that pins one exact graph
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_rules_kept_in_one_copy.yaml
                          and ann_change_set_digest_pins_one_exact_graph.yaml in the same
                          folder).
                        - Patrol has no automatic switching for now
                          (_sources/cc-patrol-notes/draft/README.md lines 86-87), so no
                          switching adds nothing to the engine.
                        - ASSUMPTION: modes that differ only in which
                          nodes run can share
                          one superset schedule switched by enable flags; modes that differ
                          in wiring need several generated schedules in one binary or the
                          dynamic host. The drafts do not say how a static schedule changes
                          mode.
                        Concerns: performance efficiency (no check in
                        the step gap), dependency risk (no checker,
                        parser or loader on the target),
                        maintainability (engine code needed for each
                        switching scope). Strength: strong against any
                        change set. The named set still costs one
                        checked leaf and schedule per mode, which
                        grows with modes.

