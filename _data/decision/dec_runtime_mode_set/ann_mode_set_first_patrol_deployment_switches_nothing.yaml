title:                  First Patrol deployment that switches nothing
brief:                  |
                        Patrol's first deployment needs no switching
                        while it runs: its fallback to drawn-on video
                        is a separate dataflow variant chosen before
                        the run. No switching is therefore enough for
                        the first instance.
description:            |
                        Sources:
                        - Fallback to drawn-on video "is a
                          configuration choice", the Orin
                          video variant, with "No automatic switching for now"
                          (_sources/cc-patrol-notes/draft/README.md lines 86-87).
                        - The no-switching option runs one resolved
                          graph in the first
                          deployment
                          (_data/decision/dec_runtime_mode_set/opt_no_runtime_switching_at_first.yaml at brief).
                        Concerns: functional suitability. Strength:
                        strong for the first deployment; it says
                        nothing about when switching should arrive.

