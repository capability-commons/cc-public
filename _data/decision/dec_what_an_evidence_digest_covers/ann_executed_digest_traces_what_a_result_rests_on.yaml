title:                  Result traced to the code it ran
brief:                  |
                        Only a digest of what the test executed ties a
                        result to all the code it rests on. Declared
                        code is sparse on dev, so a digest of declared
                        code leaves most of what a result depends on
                        untraced. The other two options share that
                        gap.
description:            |
                        Sources:
                        - Function items are written only where
                          something must point at them
                          [_data/decision/dec_python_definition_items/ruling_python_definition_items.yaml
                          at brief].
                        - On dev, 8 edges of relation_realizes appear
                          in the docstrings of 2 of the 70 python
                          files outside _test folders: 7 from
                          functions of the checker to interface
                          members, and 1 from the top package to
                          lco_tooling [src/cctool, count by grep of
                          id_relation relation_realizes on 2026-10-26,
                          src/cctool/check/check.py and
                          src/cctool/__init__.py].
                        - September found that the closure of a test
                          function covers neither the method nor the
                          adapter, so its evidence does not go stale
                          when the harness changes
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at consequence].
                        - September found that the helper which finds
                          the files a test runs over was not an item
                          and that nothing verified it
                          [origin/main:ddr/ddr_tool_verification.yaml
                          at context].
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (the option needs coverage per test).
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (534 s and two failed tests). Strength:
                          Strong on the trace, and it holds at ten
                          times the size, since declared edges will
                          stay sparse by ruling. Its cost lies with
                          other concerns. It is only as good as the
                          run that measured the coverage.

