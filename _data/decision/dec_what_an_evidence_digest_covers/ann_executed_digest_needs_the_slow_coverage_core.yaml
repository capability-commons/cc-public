title:                  Price of a digest of what ran
brief:                  |
                        A digest of what the test executed needs
                        coverage per test, which only the C tracer
                        core records, at 2.6 times the run time of the
                        suite. A digest of declared code costs a parse
                        the extractor already does, or a hash of text.
description:            |
                        Sources:
                        - The executed digest option needs coverage
                          per test
                          [_data/decision/dec_what_an_evidence_digest_covers/opt_digest_of_what_the_test_executed.yaml
                          at brief].
                        - With a context per test, the sys.monitoring
                          core recorded only 282 contexts for about
                          500 tests, because it turns off a line's
                          event after its first hit, so it cannot give
                          coverage per test [measured by Claude in the
                          cloud container, 2026-10-26].
                        - With a context per test, the C tracer core
                          took 534 s against 209 s without coverage,
                          wrote an 18 MB data file, and made two tests
                          that pass without tracing fail [measured by
                          Claude in the cloud container, 2026-10-26].
                        - Also rests on a source stated once in
                          ann_executed_digest_rests_on_a_fragile_tracer
                          (September's selector set the C tracer
                          core).
                        - Also rests on a source stated once in
                          ann_text_digest_stales_evidence_on_prose_edits
                          (the extractor parses each module).
                          Strength: strong. The factor of 2.6 is
                          measured on today's suite. At ten times the
                          tests the run time grows at least in
                          proportion, and the per-test data file grows
                          with tests times lines reached.

