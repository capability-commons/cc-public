title:                  Data changes invisible to a code digest
brief:                  |
                        A digest over declared code, as syntax or as
                        text, keeps evidence current after a change to
                        the data a test reads. A data-only commit has
                        already broken 112 tests here, so this is a
                        real failure path, not a hypothetical one.
                        Only the digest of what the test executed and
                        read covers it.
description:            |
                        Sources:
                        - A data-only commit that added 13 concepts
                          broke 112 check tests, because those tests
                          copy the repository's registers [owner's
                          statement, 2026-10-25].
                        - Also rests on a source stated once in
                          ann_text_digest_stales_evidence_on_prose_edits
                          (what the declared syntax option covers).
                        - The source-text option covers the same parts
                          as text
                          [_data/decision/dec_what_an_evidence_digest_covers/opt_digest_of_source_text.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_two_new_trackers
                          (the executed option covers data files
                          read).
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_two_new_trackers
                          (September's note on data reads).
                        - September's coverage analysis noted that a
                          narrow digest lets a reading look current
                          while the thing it concluded about is
                          undermined elsewhere
                          [origin/main:ddr/ddr_coverage_analysis.yaml
                          at consequence].
                        - ASSUMPTION: recording the data files a test
                          reads needs a mechanism of its own beside
                          line coverage. Strength: strong on the
                          premise, and stronger at ten times the size,
                          since more data means more tests that depend
                          on it. It does not settle whether the
                          executed option can be measured reliably,
                          which the annotation on a fragile tracer
                          weighs.

