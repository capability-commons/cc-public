title:                  What an evidence digest covers
brief:                  |
                        What does the digest beside an observed result
                        cover, so that the result is reported stale
                        when, and only when, something it depends on
                        has changed?
description:            |
                        September first took the source text, and a
                        reworded description staled the evidence of a
                        requirement nothing about had moved. It then
                        took the syntax tree of each definition with
                        its docstrings removed, over the code declared
                        to implement the requirement and the code of
                        the case.

