title:                  Per-test coverage as a fragile foundation
brief:                  |
                        The executed digest needs coverage per test,
                        and the only core measured to record every
                        test made two passing tests fail and ran 2.6
                        times slower. The cheap core records a line
                        only for the first test to reach it, which
                        yields digests that are silently incomplete.
                        The executed option is safe only if the core
                        is recorded beside the digest and an
                        unsuitable one is refused.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (282 contexts on the default core).
                        - The coverage.py messages include one saying
                          the sys.monitoring core does not yet support
                          dynamic contexts
                          [https://coverage.readthedocs.io/en/7.14.1/messages.html].
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (534 s, 18 MB, two failed tests).
                        - September's selector set the C tracer core
                          for itself, called a map measured on the
                          default core confidently wrong, and refused
                          a map that did not say which core measured
                          it [origin/main:pyproject.toml at the
                          comment on test-changed].
                        - Also rests on a source stated once in
                          ann_text_digest_stales_evidence_on_prose_edits
                          (September's digest of declared syntax).
                          Strength: strong as a limit on the executed
                          option. At ten times the size the 2.6 times
                          cost grows with the suite and the data file
                          with tests times functions (ASSUMPTION). The
                          declared-syntax option has no such
                          dependency.

