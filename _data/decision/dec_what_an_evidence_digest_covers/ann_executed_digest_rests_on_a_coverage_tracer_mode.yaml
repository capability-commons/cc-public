title:                  Evidence currency tied to a coverage tracer mode
brief:                  |
                        A digest of what the test executed needs
                        coverage per test, which only the C tracer
                        core of coverage.py records. Whether evidence
                        is current would then rest on a mode of a
                        third-party library whose default core already
                        behaves differently.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (the option needs coverage per test).
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (282 contexts on the default core).
                        - Also rests on a source stated once in
                          ann_executed_digest_needs_the_slow_coverage_core
                          (534 s, 18 MB, two failed tests).
                        - Also rests on a source stated once in
                          ann_executed_digest_rests_on_a_fragile_tracer
                          (September's selector and its refusal).
                        - coverage.py 7.17.0 is under Apache-2.0
                          [https://pypi.org/pypi/coverage/json].
                        - Neither coverage nor pytest-cov is in the
                          lock file of dev today [pixi.lock, by search
                          for their names]. Strength: Moderate to
                          strong. coverage.py itself is a low risk
                          under a permissive license. The risk is the
                          reliance on a non-default core, whose
                          behavior has already differed from the
                          default and which broke two tests. At ten
                          times the tests the data file and the
                          reliance grow together (ASSUMPTION: the data
                          file grows about linearly with tests).

