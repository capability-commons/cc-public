title:                  Mechanisms behind each digest
brief:                  |
                        The executed digest needs coverage per test
                        and a second way to learn which data files a
                        test read, since executed lines do not show
                        data reads. The declared code digests need
                        only the realizes edges and a parse or a hash.
description:            |
                        Sources:
                        - The executed digest covers every function
                          the test executed, the data files it read,
                          and the statement fields
                          [_data/decision/dec_what_an_evidence_digest_covers/opt_digest_of_what_the_test_executed.yaml
                          at brief].
                        - September noted that a test reads a data
                          item without executing a line that names it,
                          so a map of executed lines cannot see that
                          [origin/main:pyproject.toml at the comment
                          on test-changed].
                        - Code names what it realizes by an edge
                          relation_realizes in its function item
                          [src/cctool/check/check.lp at predicate
                          realized_function].
                        - The syntax digest also strips docstrings
                          from the syntax tree, a step the source text
                          digest does not need
                          [_data/decision/dec_what_an_evidence_digest_covers/opt_digest_of_declared_code_syntax.yaml
                          at brief]. Strength: moderate. The executed
                          digest adds two mechanisms. The source text
                          digest is the narrowest, one step fewer than
                          the syntax digest. Both declared code
                          digests reuse edges the graph already holds.
                          The count does not change at ten times the
                          size.

