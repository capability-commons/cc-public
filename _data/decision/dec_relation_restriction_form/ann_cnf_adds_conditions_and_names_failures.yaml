title:                  Conditions added and failures named in CNF
brief:                  |
                        In conjunctive normal form a new condition is
                        one more restriction, leaving the others
                        untouched, and a failure names the one
                        restriction that failed. In disjunctive form a
                        new condition rewrites every conjunction.
description:            |
                        restriction_violation reports one row per
                        failed restriction
                        (src/cc_public/check/check.lp). Adding "and is
                        not a record" to an end in DNF means adding it
                        to each alternative.

