title:                  Restrictions reused across relations
brief:                  |
                        A restriction in a shared register is written
                        once and named by every relation that needs
                        it. A list in each relation entry repeats it.
description:            |
                        rrs_is_argument restricts the source of
                        r_supports, r_challenges and
                        r_speaks_for_concern; rrs_is_requirement
                        restricts the source of r_has_subject,
                        r_has_actor and r_has_process (reg_relation).

