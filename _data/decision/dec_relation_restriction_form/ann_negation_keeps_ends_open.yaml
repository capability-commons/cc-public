title:                  Negation that keeps ends open
brief:                  |
                        An exclude lets an end say "anything except",
                        which passes partner types cc-public has never
                        seen. A list of allowed types cannot say it.
description:            |
                        A restriction holding only r_excludes literals
                        is open to every type whose items do not play
                        an excluded role (con_relation_restriction).

