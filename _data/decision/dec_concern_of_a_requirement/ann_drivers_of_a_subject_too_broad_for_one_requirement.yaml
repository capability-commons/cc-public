title:                  Drivers of a subject too broad for one requirement
brief:                  |
                        lco_tooling has seven drivers and three
                        requirements, so reading the concern from the
                        subject says that each of them serves all
                        seven. When a driver is dropped or a
                        requirement is changed, nothing then tells
                        which requirements lose their reason, while an
                        edge names exactly those.
description:            |
                        Sources:
                        - lco_tooling has seven edges of
                          relation_is_driven_by.
                          (_data/logical_component/lco_tooling.yaml at
                          edge)
                        - rqt_edit_refuses_new_failure,
                          rqt_format_keeps_formatted_file and
                          rqt_rename_keeps_guid have lco_tooling as
                          subject.
                          (_data/requirement/rqt_edit_refuses_new_failure.yaml
                          at edge.0;
                          _data/requirement/rqt_format_keeps_formatted_file.yaml
                          at edge.0;
                          _data/requirement/rqt_rename_keeps_guid.yaml
                          at edge.0)
                        - The rationale of
                          rqt_format_keeps_formatted_file is one
                          reason, that the layout check means nothing
                          unless a second pass changes nothing.
                          (_data/requirement/rqt_format_keeps_formatted_file.yaml
                          at rationale)
                        - Under the option not recorded, concerns are
                          read from the drivers of the subject.
                          (_data/decision/dec_concern_of_a_requirement/opt_concern_of_a_requirement_not_recorded.yaml
                          at brief)
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                        - Assumption: drivers of a component change
                          over its life. Strength: moderate; it grows
                          with the number of requirements on one
                          subject.

