title:                  Coverage check that starts with most drivers unserved
brief:                  |
                        The thirteen logical components have 75 driver
                        edges between them, and requirements exist on
                        only two of them, so a check that each driver
                        has a requirement serving it would report at
                        least 61 gaps the day it lands. A check with
                        that many standing reports cannot be a
                        failure, and as advice it says little about
                        any one change.
description:            |
                        Sources:
                        - The thirteen logical components have 5, 5,
                          7, 6, 5, 8, 5, 6, 5, 5, 6, 7 and 5 edges of
                          relation_is_driven_by, 75 in all;
                          lco_tooling has 7 and lco_chat 7.
                          (_data/logical_component/*.yaml, counted
                          with grep -c on 2026-10-26)
                        - The four requirements have the subjects
                          lco_tooling and lco_chat only.
                          (_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml
                          at edge.0;
                          _data/requirement/rqt_edit_refuses_new_failure.yaml
                          at edge.0;
                          _data/requirement/rqt_format_keeps_formatted_file.yaml
                          at edge.0;
                          _data/requirement/rqt_rename_keeps_guid.yaml
                          at edge.0)
                        - Under the option a check can ask whether
                          each driver of a logical component has at
                          least one requirement that serves it.
                          (_data/decision/dec_concern_of_a_requirement/opt_requirement_names_the_concerns_it_serves.yaml
                          at brief)
                        - Maintainability asks how readily a change
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                        - Assumption: the check is held for every
                          logical component, not only those with
                          requirements. Strength: moderate; it bears
                          on the check, not on the edge, which stands
                          without it.

