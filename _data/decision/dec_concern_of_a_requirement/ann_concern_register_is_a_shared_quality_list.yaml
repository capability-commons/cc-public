title:                  Concern register as a shared list of qualities
brief:                  |
                        The concern register is the ISO/IEC 25010
                        product quality characteristics plus a few
                        cited others, so an edge from a requirement to
                        a concern classifies it against a published
                        list a partner can map to. A register of
                        categories that each organization fills is the
                        kind of list the schema left out because it
                        would not travel.
description:            |
                        Sources:
                        - The concerns are the ISO/IEC 25010:2023
                          characteristics, plus others that each cite
                          a source.
                          (_data/decision/dec_source_of_concerns/ruling_source_of_concerns.yaml
                          at brief)
                        - Category is left out of the schema because
                          each organization defines its own, so a
                          fixed list would not travel.
                          (_data/schema/sch_requirement.yaml at note)
                        - Under the category option the values come
                          from a register each organization fills.
                          (_data/decision/dec_concern_of_a_requirement/opt_requirement_category_from_a_register.yaml
                          at brief)
                        - The compatibility entry cites ISO/IEC
                          25010:2023 as the characteristic it
                          corresponds to.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.note)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        - Assumption: partners that classify quality
                          requirements do so by ISO/IEC 25010
                          characteristics or something that maps to
                          them. Strength: moderate; the register is
                          local, but its source is not.

