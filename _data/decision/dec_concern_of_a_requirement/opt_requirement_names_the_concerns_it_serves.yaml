title:                  Requirement names the concerns it serves by an edge
brief:                  |
                        A new relation from a requirement to a concern
                        says which concerns it serves; it is optional
                        and may be repeated. It stands in for
                        category: the list is the concern register,
                        which partners already share, and a check can
                        ask whether each driver of a logical component
                        has at least one requirement that serves it.
description:            |
                        Recommended to WTP on 2026-10-26. The name of
                        the relation is to be settled under the naming
                        conventions.

