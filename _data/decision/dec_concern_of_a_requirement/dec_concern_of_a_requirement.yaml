title:                  Concern of a requirement
brief:                  |
                        Does a requirement say which engineering
                        concern it serves, such as maintainability or
                        reliability, and if so, how?
description:            |
                        Nothing in sch_requirement says which concern
                        a requirement serves. Its note leaves out
                        category, attribute A38 of the INCOSE guide,
                        because each organization defines its own list
                        and a fixed one would not travel. Concerns are
                        already a register that logical components
                        name through relation_is_driven_by and that
                        annotations name through
                        relation_speaks_for_concern, so a requirement
                        could name one the same way (WTP agreed this
                        should be drafted, 2026-10-26).

