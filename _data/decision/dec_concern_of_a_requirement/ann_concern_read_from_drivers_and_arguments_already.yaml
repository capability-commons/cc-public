title:                  Concern read from drivers and arguments already
brief:                  |
                        The concern a requirement serves can already
                        be read from the drivers of its subject and
                        from the rationale it must give, as the
                        deployment requirement shows: its rationale
                        cites the GDPR and privacy drives its subject.
                        A new relation, or a category field with its
                        register, adds a mechanism that no requirement
                        needs yet.
description:            |
                        Sources:
                        - Under the option not recorded, the concerns
                          that bear on a requirement are read from the
                          drivers of its subject and from the
                          annotations about it.
                          (_data/decision/dec_concern_of_a_requirement/opt_concern_of_a_requirement_not_recorded.yaml
                          at brief)
                        - The rationale of
                          rqt_chat_deployment_stays_with_data_owner
                          cites the GDPR, and concern_privacy drives
                          lco_chat, its subject.
                          (_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml
                          at rationale and edge.0;
                          _data/logical_component/lco_chat.yaml at
                          edge)
                        - A rationale is required of every
                          requirement.
                          (_data/schema/sch_requirement.yaml at
                          allOf.2.required)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml
                          at brief; AGENTS.md#keep-it-small)
                        - Simplicity asks how many mechanisms a design
                          adds, and whether it does anything another
                          already does.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.0 and
                          entries.concern_simplicity.question.1)
                        - Assumption: a reader can tell the concern
                          from the rationale without an edge.
                          Strength: moderate with four requirements;
                          it weakens as a subject's requirements
                          multiply, since its drivers then say less
                          about each one.

