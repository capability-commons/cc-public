title:                  Category field from a register of categories
brief:                  |
                        A requirement has a category field, attribute
                        A38 of the INCOSE guide, whose values come
                        from a register of categories each
                        organization fills, such as functional,
                        performance, interface and constraint. The
                        category is independent of the concern
                        register.
description:            |
                        The INCOSE attribute as the guide describes
                        it.

