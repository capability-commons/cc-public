title:                  INCOSE category as an attribute of its own
brief:                  |
                        The INCOSE guide lists Type/Category, A38,
                        among its attributes for applicability and
                        reuse, and the provenance ruling took up the
                        INCOSE concepts, so a partner that exchanges
                        INCOSE attributes may expect a category value.
                        An edge to a concern is not that attribute,
                        and the partner would have to map it.
description:            |
                        Sources:
                        - The INCOSE guide attaches 46 attributes to a
                          requirement statement, and lists A38
                          Type/Category among those that show
                          applicability and allow reuse. (INCOSE
                          webinar 144, "The INCOSE GfWR: raising the
                          ante", slide 10,
                          https://www.incose.org/wp-content/uploads/2026/01/webinar_144_the_incose_gfwr_raising_the_ante.pdf)
                        - The provenance of a requirement uses the
                          concepts of the INCOSE guide.
                          (_data/decision/dec_requirement_provenance/ruling_requirement_provenance.yaml
                          at brief)
                        - The same argument was made for status.
                          (_data/decision/dec_requirement_status/ann_partners_may_expect_a_status.yaml
                          at brief and description)
                        - Compatibility asks whether the design can
                          read and use what a partner produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.1)
                        - Assumption: a partner exchanges requirements
                          with their INCOSE attributes. Strength: weak
                          to moderate; status was left out on the same
                          ground
                          (_data/decision/dec_requirement_status/ruling_requirement_status.yaml
                          at brief), and no exchange format is in use
                          today.

