title:                  Concern edge that traces a driver to its requirements
brief:                  |
                        With an edge from a requirement to the concern
                        it serves, each driver of a logical component
                        can be followed to the requirements that serve
                        it and back, and a driver with none shows.
                        Today flexibility drives four logical
                        components and none of them is the subject of
                        any requirement, which neither the drivers of
                        a subject nor a category such as constraint
                        would bring out.
description:            |
                        Sources:
                        - A driver is a concern that a design entity
                          should favor, so that every decision about
                          it is argued for it.
                          (_data/register/reg_relation.yaml at
                          entries.relation_is_driven_by.description)
                        - Under the option a check can ask whether
                          each driver of a logical component has at
                          least one requirement that serves it.
                          (_data/decision/dec_concern_of_a_requirement/opt_requirement_names_the_concerns_it_serves.yaml
                          at brief)
                        - concern_flexibility drives
                          lco_dataflow_engine, lco_federation,
                          lco_item_graph and lco_project_guidance.
                          (_data/logical_component/lco_dataflow_engine.yaml
                          at edge;
                          _data/logical_component/lco_federation.yaml
                          at edge;
                          _data/logical_component/lco_item_graph.yaml
                          at edge;
                          _data/logical_component/lco_project_guidance.yaml
                          at edge)
                        - The four requirements have the subjects
                          lco_tooling and lco_chat only.
                          (_data/requirement/rqt_chat_deployment_stays_with_data_owner.yaml
                          at edge.0;
                          _data/requirement/rqt_edit_refuses_new_failure.yaml
                          at edge.0;
                          _data/requirement/rqt_format_keeps_formatted_file.yaml
                          at edge.0;
                          _data/requirement/rqt_rename_keeps_guid.yaml
                          at edge.0)
                        - Traceability asks whether each need can be
                          traced to what meets it, and counts needs
                          with nothing that meets them; flexibility
                          asks on which platforms the design runs and
                          how it scales.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.1,
                          entries.concern_traceability.measure.1 and
                          entries.concern_flexibility.question)
                        - Assumption: a driver with no requirement is
                          a gap worth seeing, rather than a driver
                          that only decisions need to argue. Strength:
                          strong for traceability as requirements
                          grow; for flexibility it shows the gap but
                          does not fill it.

