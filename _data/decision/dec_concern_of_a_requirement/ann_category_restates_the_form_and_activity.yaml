title:                  Category that restates the form and the activity
brief:                  |
                        The example categories, functional,
                        performance, interface and constraint, sort
                        requirements by kind, which the activity slot
                        already does for interface and a form field
                        would do for function and property. A category
                        register would be a second mechanism for the
                        same sorting.
description:            |
                        Sources:
                        - The category option gives functional,
                          performance, interface and constraint as
                          example values.
                          (_data/decision/dec_concern_of_a_requirement/opt_requirement_category_from_a_register.yaml
                          at brief)
                        - interface is already a value of the activity
                          slot. (_data/schema/sch_requirement.yaml at
                          allOf.2.properties.activity)
                        - Under the open property form decision, a
                          requirement would name its form, function or
                          property.
                          (_data/decision/dec_property_form_of_a_requirement/opt_requirement_form_field_with_a_property_form.yaml
                          at brief)
                        - Simplicity asks whether a design does
                          anything that another mechanism already
                          does. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.1)
                        - Assumption: an organization's own categories
                          would be of this kind, by form, rather than
                          by quality. Strength: moderate if the form
                          field is upheld; weaker otherwise, since
                          only interface then overlaps.

