title:                  Group name with a numbered suffix
brief:                  |
                        A port in a group is named by the group's name
                        and a number, as in Stableflow. Numbers are
                        given when a port is added and are not reused,
                        so removing a port leaves a gap rather than
                        renumbering the rest.
description:            |
                        Stableflow's naming, with numbers kept stable.

