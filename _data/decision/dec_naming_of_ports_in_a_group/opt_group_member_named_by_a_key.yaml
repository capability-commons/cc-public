title:                  Port in a group named by a key in the configuration
brief:                  |
                        The configuration of a dataflow node lists the
                        ports of each group by a key the author
                        chooses, such as the camera or the sink they
                        serve. The order of the list is the order the
                        node implementation sees.
description:            |
                        Named members, as the keys of other lists in
                        the graph schema.

