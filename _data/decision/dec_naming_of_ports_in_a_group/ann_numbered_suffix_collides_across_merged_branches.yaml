title:                  Numbered suffixes that collide across merged branches
brief:                  |
                        Two branches of a graph of edits that each add
                        a port to one group pick the next free number
                        independently, and pick the same one, so the
                        merge meets a conflict that no author made.
                        Numbers that are never reused need the highest
                        number ever given, but a resolved graph is
                        derived and never stored, so nothing holds it.
                        A key chosen by an author, or a name taken
                        from the edge, gives two different additions
                        two different names.
description:            |
                        Sources:
                        - A variant family is a graph of edits, and a
                          merge selects the dataflow variants to
                          merge; which side wins a conflict, such as
                          two upstream variants using the same port of
                          the same node, is to be worked out.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          at brief)
                        - Numbers are given when a port is added and
                          are not reused.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_name_with_a_numbered_suffix.yaml
                          at brief)
                        - Assumption: each branch gives numbers from
                          what its own base holds, since nothing
                          shared counts them. Strength: strong; it
                          grows with the number of branches that touch
                          one group.

