title:                  Keys that name a member by its purpose
brief:                  |
                        A key chosen by the author, such as the camera
                        a port serves, says why the member exists, and
                        stays the same when its source is rewired. A
                        number says nothing of the reason, and a name
                        taken from the edge changes whenever an
                        operation moves the edge's other end. A key is
                        also the natural merge key of the list of
                        members.
description:            |
                        Sources:
                        - The key option names each port of a group by
                          a key the author chooses, such as the camera
                          or the sink it serves.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_named_by_a_key.yaml
                          at brief)
                        - An operation that rewires one end of an edge
                          makes a different edge when edges are
                          identified by their ends.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_rewired_edge_loses_its_trace_under_ends.yaml
                          at brief)
                        - Every list of the graph schema declares a
                          merge key.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/ruling_merge_key_declared_for_every_list.yaml
                          at brief)
                        - Traceability asks whether each element can
                          be traced to the reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                        - Assumption: authors will choose keys that
                          name a purpose rather than a position.
                          Strength: moderate; the gain depends on the
                          keys chosen.

