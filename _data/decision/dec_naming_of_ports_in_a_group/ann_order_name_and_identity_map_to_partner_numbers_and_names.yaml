title:                  Order, name and identity that map to partner numbers, names and rename maps
brief:                  |
                        This option keeps a member's position apart
                        from its name. The Simulink Mux does the same,
                        with a port number by position and a signal
                        name, and a GStreamer request pad is named by
                        a template with a number, which the ordinal
                        default key matches. A peer that builds a
                        variant on a published one and names a member
                        follows its renames through the rename maps,
                        which work by guid, as it does for operations.
                        A key with no guid, or a name taken from the
                        edge, gives a peer nothing to follow.
description:            |
                        Sources:
                        - The Mux block's Number of inputs may be a
                          list of signal names;
                          with a scalar, each input is named signalN, N being its port
                          number. (https://www.mathworks.com/help/simulink/slref/mux.html)
                        - GStreamer's funnel has a sink_%u pad
                          template whose presence is
                          request.
                          (https://gstreamer.freedesktop.org/documentation/coreelements/funnel.html)
                        - Order is the member's position, which may
                          shift; the name is a
                          key never renumbered or reused; identity is a guid.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at brief)
                        - Each release ships its renames as an old id,
                          a new id and the
                          guid, and a command in the peer rewrites each reference.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          at brief)
                        - A peer follows renames of an operation by
                          guid; a local key
                          gives it nothing to follow.
                          (_data/decision/dec_identity_of_a_variant_operation/ann_operation_identity_peers_follow_renames_by_guid.yaml
                          at brief)
                        - Assumption: export gives a Mux the order as
                          port numbers and the
                          keys as signal names, and closes gaps in the ordinals; no
                          exporter exists yet, and no peer yet builds on a published
                          variant. Strength: moderate; the peer gain grows with peers,
                          and the partner mapping is the same as the key option's.

