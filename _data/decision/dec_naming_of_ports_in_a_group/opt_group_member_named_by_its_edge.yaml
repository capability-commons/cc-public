title:                  Port in a group named by the edge it carries
brief:                  |
                        A port in a group has no name of its own.
                        Since each port carries exactly one edge, an
                        input port in a group is named by the source
                        end that feeds it, and an output port in a
                        group by the target end it feeds. Adding or
                        removing an edge adds or removes the port, and
                        nothing is renumbered.
description:            |
                        Follows from one edge per port and from the
                        ruling that an edge is identified by its ends.

