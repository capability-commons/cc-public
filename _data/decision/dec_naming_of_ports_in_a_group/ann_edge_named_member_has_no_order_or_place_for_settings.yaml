title:                  Members named by edges, with no order and no place for settings
brief:                  |
                        A node implementation sees its inputs in a
                        slot order, and a merge or a logger may depend
                        on it, but members named by their edges have
                        no stated order. They also have no place for a
                        setting of one member, such as a label for a
                        logged input, and cannot exist unfed. A key
                        list gives the order and a place for such
                        settings.
description:            |
                        Sources:
                        - On the engine, the slot order is the order
                          the inputs and outputs are listed in the
                          component's spec.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - Under the key option, the order of the list
                          is the order the node implementation sees.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_named_by_a_key.yaml
                          at brief)
                        - The edge option gives a port in a group no
                          name of its own.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_named_by_its_edge.yaml
                          at brief)
                        - Which side wins a conflict in a merge is to
                          be worked out.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - Assumption: some group nodes depend on the
                          order of their inputs, as a merge that
                          settles conflicts by order would. Strength:
                          moderate; a node that treats its inputs as a
                          set loses nothing.

