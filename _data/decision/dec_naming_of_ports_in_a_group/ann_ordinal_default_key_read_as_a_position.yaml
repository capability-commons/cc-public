title:                  Ordinal default keys that read as positions
brief:                  |
                        The option keeps name and order apart, but
                        with ordinals as the default key the two look
                        alike. After one removal the member keyed 3
                        sits at position 2, as in the option's own
                        example of members ending in merge.input.0,
                        merge.input.1 and merge.input.3, so a reader
                        of a configuration or a diff, or whoever
                        labels a logger's columns, can take a key for
                        the slot the node sees. A default key that
                        cannot be read as a number, such as a letter,
                        keeps the separation the option draws, at no
                        cost to its identity, which rests on the guid.
description:            |
                        Sources:
                        - Order is the member's position in its
                          group's list, which the
                          node sees as port 0, 1, 2 and may shift; the name is by default
                          its ordinal when added, never renumbered.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at brief)
                        - The option's example has members whose ids
                          end in merge.input.0,
                          merge.input.1 and merge.input.3.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at description)
                        - On the engine, inputs reach a component as
                          slots numbered in the
                          order its spec lists them.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - Maintainability asks how readily a newcomer
                          can understand the
                          design. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.0)
                        - Assumption: readers meet ordinal keys in
                          configurations and
                          diffs often enough to confuse them with slots. Strength:
                          moderate; it is a cost of the default only, and falls away where
                          authors or generators choose keys of purpose.

