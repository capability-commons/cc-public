title:                  An item with an id and a guid at every end of a group edge
brief:                  |
                        Under this option each port in a group is an
                        item of its own, so an edge end that reaches a
                        group names an item that exists, by id and
                        guid, as every other end does. That answers
                        the gap found on
                        dec_ports_whose_count_comes_from_configuration,
                        where a group member had no interface member
                        for an end to name. A requirement, an
                        annotation or a variant operation can then
                        name one member, and the reference check finds
                        a name that no longer resolves. A key, or a
                        name taken from the edge, gives no item to
                        name.
description:            |
                        Sources:
                        - An end of a dataflow edge names a port by id
                          and guid, and the
                          checker finds an end that names nothing.
                          (_data/schema/sch_dataflow_graph.yaml at description)
                        - A group member has no interface member of
                          its own for an end to
                          name.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/ann_group_member_with_no_interface_member_to_name.yaml
                          at brief)
                        - The identity of an interface member is what
                          lets a requirement
                          or an implementation name one declaration.
                          (_data/schema/sch_interface_member.yaml at description)
                        - This option gives each member an id derived
                          from the node and
                          its key, and a guid that cctool mints.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at description)
                        - Traceability asks whether each element can
                          be traced to the
                          reason it exists.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question.0)
                        - Assumption: something will need to name a
                          single member, such
                          as a requirement on one input of a merge; nothing in the
                          repository names a port or a dataflow node from outside its
                          graph today. Strength: moderate now, and it grows with the
                          number of requirements written against dataflow graphs.

