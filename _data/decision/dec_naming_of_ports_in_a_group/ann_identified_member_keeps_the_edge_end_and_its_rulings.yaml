title:                  An edge end and its rulings left as they are
brief:                  |
                        An edge end holds only id_port and guid_port
                        beside its node, so a key in the configuration
                        has to be carried on the end by a new field,
                        or folded into id_port. An identified member
                        fills id_port and guid_port as any port does,
                        so the end schema, the pair of ends as the
                        merge key of edges, and the one-edge-per-input
                        check stay as they are, and the rename command
                        already renames items held by a node, keeping
                        their guids. It follows from the rulings on
                        edge identity, merge keys and operation
                        identity, rather than adding a second way to
                        name a port.
description:            |
                        Sources:
                        - An end has exactly four fields,
                          id_dataflow_node,
                          guid_dataflow_node, id_port and guid_port, and allows no other.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.end)
                        - A dataflow edge is identified by its two
                          ends, and the pair of
                          ends is its merge key.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - Each variant operation is named by an id
                          with a guid.
                          (_data/decision/dec_identity_of_a_variant_operation/ruling_operation_named_by_id_with_guid.yaml
                          at brief)
                        - An input takes its value from at most one
                          edge.
                          (src/cctool/check/check.lp within input_fed_twice)
                        - Renaming an item renames each item it holds
                          whose id is made
                          from its own, and each keeps its guid.
                          (src/cctool/edit/edit.py within rename and _derived)
                        - Simplicity asks whether a design follows
                          from decisions already
                          made. (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question.2)
                        - Assumption: the key option would carry its
                          key on the end, since
                          an interface member id is shared by every node that presents
                          the interface. Strength: strong; it holds at any number of
                          graphs, since the end shape is fixed once.

