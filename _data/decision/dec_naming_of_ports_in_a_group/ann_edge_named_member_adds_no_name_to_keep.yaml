title:                  Members named by their edges, with no name to keep
brief:                  |
                        An edge is identified by its ends and each
                        port in a group carries one edge, so naming a
                        member by its other end adds no field, no
                        counter and no list, and the count of a group
                        is the number of its edges. A key or a number
                        states the members a second time, beside the
                        edges, and needs checks that every member is
                        fed and every edge names a member. The ends
                        are references, so a rename already rewrites
                        them.
description:            |
                        Sources:
                        - A dataflow edge is identified by its two
                          ends.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - The ends of an edge are references, so a
                          rename keeps the edge.
                          (_data/schema/sch_dataflow_graph.yaml at
                          description)
                        - A check fails an end that names no port, and
                          an input that no edge feeds unless it is
                          optional. (src/cctool/check/check.lp within
                          unknown_port and unfed_input)
                        - The edge option says adding or removing an
                          edge adds or removes the port, and nothing
                          is renumbered.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_named_by_its_edge.yaml
                          at brief)
                        - Assumption: one output port never feeds two
                          members of one group; if it may, the edge
                          name no longer tells them apart. Strength:
                          strong on the count of mechanisms; it holds
                          as long as one edge per port holds.

