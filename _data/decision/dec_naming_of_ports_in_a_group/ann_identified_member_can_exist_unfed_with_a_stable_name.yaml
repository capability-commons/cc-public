title:                  Members that exist before they are fed, with a name that survives a removal
brief:                  |
                        A member is listed in the node's
                        configuration, so it exists whether or not an
                        edge feeds it, and unfed_input reports one
                        that is missing its edge, which a member named
                        by its edge cannot be. Its key is never
                        renumbered, so removing one member changes no
                        other member's name or edges. Its position
                        still shifts, so a node that keeps state by
                        slot, such as a logger's column for each
                        input, sees a different member at a slot after
                        a removal unless it is also given the keys.
description:            |
                        Sources:
                        - An input that no edge feeds fails a check
                          unless the interface
                          states it to be optional. (src/cctool/check/check.lp within
                          unfed_input)
                        - The edge option adds or removes the port
                          with the edge.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_named_by_its_edge.yaml
                          at brief)
                        - Removing a member leaves a gap in the names
                          and none in the
                          order.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at brief)
                        - On the engine, inputs reach a component as
                          an array of slots,
                          in the order its spec lists them.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - Functional suitability asks whether every
                          function that is
                          needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.1)
                        - Assumption: some group nodes keep state or
                          labels by slot.
                          Strength: moderate; a node that treats its inputs as a set loses
                          nothing from the shift.

