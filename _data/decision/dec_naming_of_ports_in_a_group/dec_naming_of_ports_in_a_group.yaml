title:                  Naming of ports in a group
brief:                  |
                        If ports come in groups whose size the
                        configuration sets, how is each port in a
                        group named, so that an edge can say which one
                        it ends at?
description:            |
                        An edge is identified by its two ends, and
                        each end names a dataflow node and a port.
                        Numbering the ports of a group by position
                        renumbers the rest when one is removed, which
                        changes the identity of their edges. In
                        Stableflow a port in a group was named by the
                        group's name with a numbered suffix, which WTP
                        found a bit ad hoc and wants to discuss (WTP,
                        2026-10-26).

