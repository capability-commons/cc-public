title:                  Partner tools that name group ports by number or by name
brief:                  |
                        GStreamer names request pads from a template
                        with a number, as in sink_%u, and Simulink's
                        Mux numbers its inputs by position or takes a
                        list of signal names. A numbered suffix maps
                        to both, and a key maps to the named form of
                        the Mux. A port named by its edge has no
                        counterpart, and gets a number or a name on
                        export.
description:            |
                        Sources:
                        - GStreamer's funnel has a sink_%u pad
                          template whose presence is request.
                          (https://gstreamer.freedesktop.org/documentation/coreelements/funnel.html)
                        - The Mux block's Number of inputs may be a
                          list of signal names; with a scalar, each
                          input is named signalN, N being its port
                          number.
                          (https://www.mathworks.com/help/simulink/slref/mux.html)
                        - The Patrol notes read a fan-out as an
                          implied GStreamer tee.
                          (_sources/cc-patrol-notes/drawing-lessons.md#7-ports-fan-out-and-fan-in)
                        - In Stableflow a port in a group was named by
                          the group's name with a numbered suffix.
                          (_data/decision/dec_naming_of_ports_in_a_group/dec_naming_of_ports_in_a_group.yaml
                          at description)
                        - Assumption: a name made on export need not
                          be stable for import to work. Strength: weak
                          to moderate; export can always number the
                          ports, so the gap is in round trips.

