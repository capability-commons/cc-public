title:                  Mark for items that are not public
brief:                  |
                        Which protective mark does an item carry when
                        it must not be published or passed on, and
                        what does that mark mean?
description:            |
                        The protective mark register holds only
                        mark_public, so every item is marked public. A
                        segment of research notes on WTP's library of
                        papers cannot be: it includes papers WTP has
                        purchased and is obliged to protect from
                        redistribution, and its notes quote them (WTP,
                        2026-10-28). WTP wants this governance decided
                        through the decision process rather than added
                        directly (WTP, 2026-10-28).

