title:                  One plain private mark
brief:                  |
                        An item that must not be published or passed
                        on carries one plain mark, titled Private,
                        with authority cc and level private: it is for
                        the holder of its segment and the tools and
                        agents the holder runs, and is never
                        published, shipped in a release or federated
                        outward. Ruled by WTP on 2026-10-28, as
                        recommended. Government schemes, and anything
                        reminiscent of official marks, stay out until
                        a contract or obligation requires them.

