title:                  Private mark that also serves personal data
brief:                  |
                        A segment that holds personal data must not be
                        published or federated either. A plain private
                        mark, meaning for the holder of the segment
                        and the holder's own tools, covers personal
                        data as well as licensed papers, so one mark
                        serves both without a second scheme.
description:            |
