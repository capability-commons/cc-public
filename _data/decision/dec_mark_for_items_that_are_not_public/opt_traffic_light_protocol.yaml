title:                  Traffic Light Protocol
brief:                  |
                        The register takes the levels of the Traffic
                        Light Protocol 2.0 from FIRST: TLP:CLEAR,
                        which mark_public would match, TLP:GREEN,
                        TLP:AMBER, TLP:AMBER+STRICT and TLP:RED. The
                        corpus of research notes would be
                        TLP:AMBER+STRICT.
description:            |
                        Proposed to WTP on 2026-10-28 as a recognized
                        standard for how far information may be
                        shared, under the default of following
                        standards.

