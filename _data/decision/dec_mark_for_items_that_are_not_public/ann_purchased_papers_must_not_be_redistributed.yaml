title:                  Purchased papers that must not be redistributed
brief:                  |
                        The library of papers behind the research
                        notes includes papers WTP has purchased under
                        terms that oblige him to protect them from
                        redistribution, and the notes quote them. The
                        items must therefore carry a mark that stops
                        them being published, shipped or federated,
                        which mark_public cannot do. Any of the three
                        non-government options gives such a mark.
description:            |
                        Sources:
                        - The segment with the papers can't be public
                          as it includes papers WTP has purchased and
                          is obliged to protect from redistribution;
                          some kind of basic organizational or
                          personal non-public protective mark is
                          needed (WTP, 2026-10-28).
                        - The register holds one entry, mark_public,
                          which may be disclosed to anyone.
                          (_data/register/reg_protective_mark.yaml at
                          entries.mark_public.brief)

