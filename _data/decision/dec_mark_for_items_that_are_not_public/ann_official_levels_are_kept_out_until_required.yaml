title:                  Official levels kept out until a contract requires them
brief:                  |
                        WTP will not apply government protective
                        markings, or anything reminiscent of them,
                        until a contract or an obligation requires
                        them, and will then follow the guidance given.
                        A government scheme adopted now would be
                        applied without that guidance. Confidential is
                        itself a level in several official schemes,
                        such as NATO CONFIDENTIAL, CONFIDENTIAL under
                        United States Executive Order 13526, and
                        VS-VERTRAULICH in Germany, so a mark of that
                        name could be read by a partner as an official
                        classification. Private is not a level of
                        those schemes.
description:            |
                        Sources:
                        - Steer well clear of government protective
                          markings (e.g. UK, Germany, Poland, Ukraine)
                          until there is a contract with them and/or
                          an obligation to apply them; be guided by
                          the guidance received; avoid anything
                          reminiscent of official protective marks
                          (WTP, 2026-10-28).
                        - Executive Order 13526, Classified National
                          Security Information, 2009, section 1.2,
                          names the levels Top Secret, Secret and
                          Confidential.

