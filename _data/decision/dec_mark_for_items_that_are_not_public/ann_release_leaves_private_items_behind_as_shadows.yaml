title:                  Release that leaves private items behind as shadows
brief:                  |
                        A release already ships a shadow of each item
                        it leaves behind, keeping only its id and
                        guid, so that references to it still resolve.
                        A private item needs no new mechanism: the
                        release leaves it behind like any item outside
                        the package, and its content never ships. Only
                        the rule that selects what stays behind gains
                        the mark as a reason.
description:            |
                        Sources:
                        - A release ships the whole of _data, with a
                          shadow of each item it leaves behind; a
                          shadow keeps the id and guid of the item.
                          (src/cctool/release/shadow.py at
                          description)

