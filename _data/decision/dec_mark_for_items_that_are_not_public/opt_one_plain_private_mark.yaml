title:                  One plain private mark
brief:                  |
                        The register gains one entry, titled Private,
                        with authority cc and level private. A private
                        item is for the holder of its segment and the
                        tools and agents the holder runs, and is never
                        published, shipped in a release or federated
                        outward; a release leaves it behind with a
                        shadow, as it does any item it does not ship.
                        Private is a property of the item, not of the
                        repository holding it. Further marks are added
                        only when a contract or partner requires one.
description:            |
                        WTP's leaning: a simple, plain private or
                        confidential mark, not tied to any particular
                        organization or institution (WTP, 2026-10-28).
                        The name avoids levels of official schemes.

