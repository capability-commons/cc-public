title:                  Further marks added as register entries
brief:                  |
                        The register already holds each mark as an
                        entry naming its authority and level, and an
                        item may name several marks, all of which
                        apply. So when a contract or a partner
                        requires a scheme, its marks are added as
                        entries and named on the items concerned,
                        without changing what the private mark means
                        or the items that carry it. Starting with one
                        plain mark closes nothing off.
description:            |
                        Sources:
                        - A protective mark entry names the authority
                          whose rules govern the mark, and the level
                          the mark names within that authority's
                          scheme.
                          (_data/register/reg_protective_mark.yaml at
                          description)
                        - Where an item names several marks, they are
                          conjunctive: every constraint implied by
                          every mark applies, and the most restrictive
                          governs.
                          (_data/register/reg_protective_mark.yaml at
                          usage)
                        - Be guided by the guidance received once
                          there is a contract (WTP, 2026-10-28).

