title:                  Traffic Light levels that add machinery
brief:                  |
                        The Traffic Light Protocol brings five levels,
                        each with its own sharing rule, where the need
                        today is a single distinction between public
                        and not public. Every author marking an item
                        would have to choose among them, and every
                        check would have to know what each allows. One
                        plain mark gives the same protection to the
                        corpus with one rule.
description:            |
                        Sources:
                        - The Traffic Light Protocol seems to meet the
                          requirement but is extra machinery and
                          cognitive burden; WTP leans toward a simple
                          plain private or confidential mark (WTP,
                          2026-10-28).
                        - FIRST, Traffic Light Protocol (TLP) version
                          2.0, 2022, defines TLP:CLEAR, TLP:GREEN,
                          TLP:AMBER, TLP:AMBER+STRICT and TLP:RED.
                          https://www.first.org/tlp/

