title:                  Wrong checker verdicts filed under reliability
brief:                  |
                        Advocates and verifiers have found cases where
                        the checker reports a pass that is not one.
                        Under the five drivers these are filed under
                        reliability, which excludes them, and a ruling
                        about lco_tooling can settle with no argument
                        on correctness.
description:            |
                        A missing output file after Souffle succeeds
                        was read as no failures
                        (notes/advocate-experiment-2-checks-engine.md
                        lines 42 and 65). It is recorded as
                        ann_text_file_facts_reject_or_lose_data, which
                        speaks for concern_reliability only
                        (dec_cross_item_checks_engine). At 89c74d8,
                        schema validation catches
                        referencing.exceptions.Unresolvable and goes
                        on, so a $ref to a missing schema is skipped
                        silently (src/cctool/check/schema.py within
                        _compiled; found by the verifier of
                        notes/past-decisions/18-dec_register_naming.md).
                        That fault is not yet recorded under any
                        concern. Further checker faults are noted in
                        notes/past-decisions/06-dec_register_shape.md
                        and 14-dec_rights_field_forms.yaml.

