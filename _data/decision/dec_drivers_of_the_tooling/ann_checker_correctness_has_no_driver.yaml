title:                  Checker correctness without a driver
brief:                  |
                        The main job of lco_tooling is to give the
                        right verdict on the item graph, and that job
                        belongs to functional suitability, which no
                        chosen driver covers. Adding it gives that job
                        one required concern.
description:            |
                        lco_tooling "checks the item graph against its
                        rules"
                        (_data/logical_component/lco_tooling.yaml at
                        brief). Functional suitability covers "whether
                        each function gives the right result"
                        (_data/register/reg_concern.yaml at
                        entries.concern_functional_suitability.description).
                        Reliability excludes "Whether a result is
                        right" (reg_concern.yaml), as it did at
                        68d1924. The 68d1924 message gives reliability
                        as a driver "because a wrong checker is worse
                        than none", which is the job reliability
                        excludes; that reason was written by an
                        assistant. unargued_driver asks only for
                        drivers (src/cctool/check/check.lp within
                        duplicate_guid). At 89c74d8 no annotation
                        under _data/decision speaks for
                        concern_functional_suitability. The gap was
                        raised in
                        notes/advocate-experiment-2-checks-engine.md
                        line 73 (assistant-written).
                        lco_argumentation, proposed alongside this
                        decision, is driven by functional suitability.

