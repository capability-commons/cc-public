title:                  Tooling drivers recorded without reasons
brief:                  |
                        The five driver edges of lco_tooling carry no
                        reason in the graph. Their reasons live only
                        in an assistant-written commit message, and
                        one names Souffle, which the checks no longer
                        use.
description:            |
                        _data/logical_component/lco_tooling.yaml lines
                        17-42 hold five relation_is_driven_by edges
                        with no reason. The 68d1924 message gives
                        dependency risk "because of Souffle and a
                        development machine with no network". Commit
                        6230e98 (2026-10-14 22:51) moved the checks to
                        clingo; no code under src uses Souffle, which
                        is named there only in tests, as part of the
                        id of a rejected option and as a word to
                        search for. Each driver gates every ruling on
                        lco_tooling (src/cctool/check/check.lp lines
                        448-453). Recording this decision repairs the
                        trace; the point is against the option as
                        first recorded.

