title:                  Clingo port without a cost argument
brief:                  |
                        The largest change to lco_tooling after the
                        drivers were set, the port of the cross-item
                        checks to clingo, was settled with no argument
                        on its effort. Without cost as a driver, a
                        rewrite need not be costed.
description:            |
                        Commit 6230e98 changes 28 files, with 1199
                        lines added and 1110 removed. The annotations
                        of dec_cross_item_checks_engine argue only for
                        the five tooling drivers, and its ruling rests
                        on graph size and pinning
                        (_data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml
                        at brief). The one cost argument on
                        lco_tooling, ann_a_port_costs_a_rewrite, was
                        written in 6592fb5, before 68d1924 set the
                        drivers. This supports
                        opt_include_cost_and_schedule for cost only.

