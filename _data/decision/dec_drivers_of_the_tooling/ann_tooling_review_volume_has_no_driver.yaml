title:                  Review volume missing from the tooling drivers
brief:                  |
                        The tooling is where large, model-made changes
                        land, yet reviewability is not a driver. The
                        reason given for simplicity, failure through
                        growth, is at least in part review volume,
                        which simplicity excludes.
description:            |
                        68d1924 gives simplicity "because the
                        September tree failed through growth"
                        (assistant-written). Reviewers in September
                        were told Will values this: "A prior attempt
                        failed because the LLM generated too much
                        material to review."
                        (notes/cc-public-session-context.md line 45, a
                        summary of earlier sessions; not found in
                        Will's messages of this project). ASSUMPTION:
                        that "prior attempt" is the September tree.
                        concern_simplicity excludes "Ease of judging
                        one change (concern_reviewability)"
                        (_data/register/reg_concern.yaml line 439);
                        reviewability measures size of a change and
                        changes awaiting review (lines 474-475).
                        Commit 6230e98, co-authored by Claude, changes
                        28 files with 1199 insertions and 1110
                        deletions. lc_tooling.yaml lines 17-42 list
                        the five drivers, without reviewability.

