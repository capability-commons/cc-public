title:                  Reading added by each required driver
brief:                  |
                        Each driver of lco_tooling adds one advocate
                        and one required argument to every ruling
                        about it. Concerns that are not drivers can
                        already speak, so adding drivers adds reading
                        that the chosen five avoid.
description:            |
                        unargued_driver refuses a ruling while a
                        driver is unargued
                        (src/cc_public/check/check.lp lines 448-453;
                        .agents/skills/editing-data-items/SKILL.md
                        lines 75-80). No rule limits
                        r_speaks_for_concern to drivers (check.lp
                        lines 565-590), so "may still speak, but are
                        not required" (68d1924) needs no mechanism.
                        Experiment 2 ran one advocate per driver: five
                        advocates, fifteen proposals, twelve
                        annotations, and "Review is still the
                        bottleneck"
                        (notes/advocate-experiment-2-checks-engine.md
                        lines 7-8 and 75, assistant-written). Will:
                        annotations "might quickly explode out of
                        control" (owner's statement,
                        2026-10-14T21:51:15Z). Adding cost and
                        schedule makes seven drivers; adding
                        functional suitability makes six. ASSUMPTION:
                        merging across concerns may make the added
                        load less than one advocate's full share.

