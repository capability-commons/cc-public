title:                  No running bill for the tooling
brief:                  |
                        The tooling runs on free packages, locally or
                        in a session, so its running cost is near
                        zero, and effort to change it is already
                        measured by maintainability. A required cost
                        argument would mostly repeat others.
description:            |
                        concern_cost measures effort in person days
                        and running cost per month
                        (_data/register/reg_concern.yaml at
                        entries.concern_cost.measure); maintainability
                        measures time to make a change (lines
                        355-357). Dependencies are free packages from
                        conda-forge through pixi (pyproject.toml at
                        project, build-system and tool). ASSUMPTION:
                        no hosted CI or paid agent time is charged to
                        the tooling; nothing in the repository names
                        one.

