title:                  Boundary upkeep for each added concern
brief:                  |
                        Each concern must say what it leaves to its
                        neighbours. Sixteen concerns need 22 such
                        boundary lines and 5 aliases, and one boundary
                        was drawn and then undone within 40 minutes.
description:            |
                        Excludes lists and aliases in
                        _data/register/reg_concern.yaml (for example
                        lines 78-82, 437-439, 477-479). Commit 6cabbb1
                        (17:52) split testability out of
                        maintainability "so the two do not overlap";
                        commit 373ff5d (18:31) folded it back after
                        Will asked to "lean more towards being
                        standards-informed" (owner's statement,
                        2026-10-13T18:30:41Z). Assumption: four
                        concerns need fewer boundary lines than
                        sixteen; the first four are not in the
                        history.

