title:                  Boundary upkeep for each added concern
brief:                  |
                        Each concern must say what it leaves to its
                        neighbors. Sixteen concerns need 22 such
                        boundary lines and 5 aliases, and one boundary
                        was drawn and then undone within 40 minutes.
description:            |
                        Excludes lists, now named out_of_scope, and
                        aliases in _data/register/reg_concern.yaml at
                        entries.concern_functional_suitability.out_of_scope,
                        entries.concern_functional_suitability.alias,
                        entries.concern_simplicity.out_of_scope and
                        entries.concern_reviewability.out_of_scope,
                        for example. Commit 6cabbb1 split testability
                        out of maintainability "so the two do not
                        overlap"; commit 373ff5d folded it back after
                        WTP asked to "lean more toward being
                        standards-informed" (maintainer's statement,
                        2026-10-13). Assumption: four concerns need
                        fewer boundary lines than sixteen; the first
                        four are not in the history.

