title:                  Physical concerns with nothing to bear on
brief:                  |
                        Of the physical examples, cost and
                        maintainability are already in the chosen
                        register. Weight and power have no element in
                        cc-public to bear on or measure.
description:            |
                        Will named "cost, weight, power,
                        maintainability" as example concerns
                        (maintainer's statement, 2026-10-13T16:42:36Z,
                        will-messages.md line 229). concern_cost
                        covers money and effort, with running cost in
                        currency per month
                        (_data/register/reg_concern.yaml lines
                        526-550). The six logical components describe
                        records, files, words or tooling, none a
                        physical part
                        (base0/_data/logical_component/*.yaml).
                        Assumption: no part of cc-public has a mass or
                        a power budget; its energy is paid as running
                        cost. Fails if cc-public comes to describe
                        physical products.

