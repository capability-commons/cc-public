title:                  Weight and power left out of the register
brief:                  |
                        WTP named weight and power among the concerns
                        the mechanism should argue for, but the chosen
                        set holds none. For a decision about a
                        physical system, no advocate could show such a
                        concern was under-represented.
description:            |
                        Maintainer's statement, 2026-10-13. WTP then
                        asked for "software-oriented" concerns. No
                        concern covers mass, weight or power
                        (_data/register/reg_concern.yaml). The
                        repository calls itself "A document-oriented
                        engineering system" (base0/README.md line 3).
                        A concern can be added "when an argument first
                        needs it" (lines 34-35), so the gap can close
                        without reversing the decision. Assumption:
                        cc-public will later carry decisions about
                        systems with physical properties; no source
                        states this.

