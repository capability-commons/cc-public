title:                  Separable concerns for tracing a wrong decision
brief:                  |
                        Each entry in the chosen set states what it
                        leaves to the others, so a wrong decision can
                        be traced to one under- or over-represented
                        concern. That is the result the component
                        exists to give.
description:            |
                        The function is stated by Will: when a
                        decision proves wrong, the trace shows which
                        concern was under- or over-represented
                        (maintainer's statement, 2026-10-13T16:42:36Z;
                        restated in _data/register/reg_concern.yaml
                        lines 22-27). Excludes examples: functional
                        suitability hands behavior over time to
                        reliability (line 79); simplicity hands change
                        effort to maintainability (line 438). The nine
                        product characteristics come from one
                        published model, ISO/IEC 25010:2023 (lines
                        63-67). The first four concerns were never
                        committed, so they cannot be checked for
                        separability.

