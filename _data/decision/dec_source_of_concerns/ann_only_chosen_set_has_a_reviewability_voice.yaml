title:                  Reviewability voice only in the chosen set
brief:                  |
                        Only the chosen set gives a concern the job of
                        asking whether each change, including
                        generated material, can be read and judged.
                        That bears on the project's main known
                        failure.
description:            |
                        concern_reviewability came in 6cabbb1 and is
                        not an ISO/IEC 25010:2023 characteristic. Its
                        description names "material that a model
                        generated" and "whether the volume of change
                        stays within what people can review"
                        (_data/register/reg_concern.yaml lines
                        454-459); it cites IEEE 1028-2008 (lines
                        460-465). The September tree "grew 3-8x in two
                        weeks from agent output ... That is why it was
                        restarted"
                        (memory/cc-public-design-principles.md line
                        25). Will's physical examples were "cost,
                        weight, power, maintainability" (maintainer's
                        statement, 2026-10-13T16:42:36Z). The first
                        four concerns were never committed, so whether
                        they held a reviewability concern is not
                        known.

