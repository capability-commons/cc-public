title:                  Three concerns now without an argument
brief:                  |
                        The old annotation says that nine concerns
                        still have no argument speaking for them,
                        traceability among them. Now 16 of the 19
                        concerns have one, and only security, safety
                        and privacy have none.
description:            |
                        _data/register/reg_concern.yaml holds 19
                        concerns. A script over the 1,060 annotation
                        files under _data/decision/ finds a
                        relation_speaks_for_concern edge to every
                        concern but concern_security, concern_safety
                        and concern_privacy. 172 annotation files name
                        concern_traceability. That all sixteen
                        concerns of the time came before the first
                        annotation is history and is not changed.
                        Found in the review of 2026-10-22.

