title:                  Software concerns drawn from standards
brief:                  |
                        The concerns should suit software and come
                        from standards: ISO/IEC 25010:2023 first, then
                        the others, each with a standard behind it.
description:            |
                        Maintainer's statements, 2026-10-13: "remove
                        the four concerns you currently have ... Let's
                        brainstorm some software-oriented ones"
                        (17:12:27Z); "Let's go for the ISO/IEC
                        25010:2023 group first" (17:13:50Z); "Add the
                        other concerns please" (17:51:49Z); "Can we
                        get the other points from standards as well?"
                        (18:31:38Z). Built in commits a6996e8, 6cabbb1
                        and fed3da5 (pre-squash).

