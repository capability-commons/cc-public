title:                  A named source for each concern
brief:                  |
                        Every concern in the chosen set states where
                        it comes from, a standard or a stated reason.
                        The first four concerns left no record of what
                        they were or why.
description:            |
                        The nine ISO/IEC 25010:2023 concerns name
                        their characteristic
                        (base0/_data/register/reg_concern.yaml, for
                        example lines 63-67 and 101-105). The others
                        cite IEEE 1028, ISO/IEC/IEEE 29148, IEC
                        60300-3-3, ISO 21502, ISO/IEC 5230 and ISO/IEC
                        29100 (commit fed3da5 message). Simplicity
                        says no standard defines it and names Brooks'
                        conceptual integrity (lines 418-426). No
                        commit before a6996e8 names a concern_ id (git
                        log -S'concern_' on pre_squash_20261014). Will
                        asked for the four to be removed at
                        2026-10-13T17:12:27Z.

