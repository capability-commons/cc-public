title:                  Drivers bound the concerns per decision
brief:                  |
                        Only the concerns that drive a subject must
                        speak on it, so the cost and the reading load
                        of a deliberation follow the four or five
                        drivers, not the sixteen concerns in the
                        register.
description:            |
                        The register holds 16 concerns
                        (_data/register/reg_concern.yaml lines
                        49-669). A ruling is refused while a driver of
                        the subject is unargued, and no other concern
                        is required to speak
                        (src/cc_public/check/check.lp, check
                        unargued_driver, lines 440-453).
                        r_is_driven_by says other concerns are not
                        expected to speak, "so that a decision is not
                        weighed against every concern there is"
                        (_data/register/reg_relation.yaml lines
                        407-425). Each proposed component has four or
                        five drivers (pd/templates/drivers.txt). With
                        five drivers, dec_tooling_language holds 15
                        annotations in 509 lines. Will warned that
                        annotations "might quickly explode out of
                        control" (owner's statement,
                        2026-10-14T21:51:15Z). Assumption: advocate
                        runs dominate the running cost of
                        argumentation; no measure of that cost exists.
                        Assumption: sixteen concerns speaking on one
                        decision would give about 48 annotations and
                        1,600 lines.

