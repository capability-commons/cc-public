title:                  Cost of citing standards
brief:                  |
                        Drawing each concern from a cited standard
                        costs money to buy standards and effort to
                        read them. Part of it is still owed: some
                        citations rest on public titles and scope
                        only.
description:            |
                        "If there are any important ones that are
                        missing, let me know and I can buy them."
                        (maintainer's statement, 2026-10-13).
                        "purchased docs to follow later" (maintainer's
                        statement, 2026-10-13). IEC 60300-3-3, cited
                        by concern_cost (reg_concern.yaml at
                        entries.concern_cost.description and
                        entries.concern_cost.note), is not among the
                        standards held (pd/memory/MEMORY.md line 3).
                        "Citations so far are from public titles and
                        scope, not full text" (pd/memory/MEMORY.md
                        line 16). The cost is mostly one-off and does
                        not grow with the graph (assumption).

