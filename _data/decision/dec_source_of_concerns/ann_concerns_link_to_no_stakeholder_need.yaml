title:                  Concerns linked to no stakeholder need
brief:                  |
                        A concern is defined as a matter of interest
                        to a stakeholder, but no concern links to a
                        stakeholder or need. Each traces to a
                        standard, not to a need of cc-public.
description:            |
                        concept_concern definition
                        (base0/_data/register/reg_concept.yaml lines
                        326-336). No stakeholder type exists
                        (base0/_data/register/reg_data_item_type.yaml,
                        t_* entries). Every concern has "relation: []"
                        (base0/_data/register/reg_concern.yaml, for
                        example concern_simplicity).

