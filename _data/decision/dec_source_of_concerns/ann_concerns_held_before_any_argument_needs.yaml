title:                  Concerns held before any argument needs them
brief:                  |
                        The register says a concern is added when an
                        argument first needs it, yet all sixteen came
                        before the first annotation, and nine still
                        have no argument speaking for them.
description:            |
                        Rule: "A concern is added here when an
                        argument first needs it."
                        (_data/register/reg_concern.yaml lines 34-35),
                        written in a6996e8, the commit that added nine
                        concerns at once. All sixteen were in the
                        register on 2026-10-13 by 18:31 (a6996e8,
                        6cabbb1, 373ff5d). The first annotations were
                        committed on 2026-10-14 at 16:15 (6592fb5).
                        The 29 annotations in _data/decision/ argue
                        for seven concerns; security, safety, privacy
                        and traceability are among the nine with none
                        (grep of r_argues_for_concern targets).
                        Security, safety, schedule and privacy drive
                        no logical component
                        (pd/templates/drivers.txt). Assumption: the
                        unused share falls as issues are added.

