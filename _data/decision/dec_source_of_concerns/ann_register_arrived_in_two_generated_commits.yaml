title:                  Register arrived in two large generated commits
brief:                  |
                        The register entered the graph as two large
                        changes made by a model, one committed a
                        minute after Will asked for it. Each entry
                        briefs the advocates, so an unread fault
                        recurs in every argument it shapes.
description:            |
                        Commit a6996e8 (2026-10-13T17:18:05Z): 6
                        files, 598 inserted lines, 375 in
                        reg_concern.yaml. Commit 6cabbb1: 262
                        insertions, 4 deletions, dated 17:52:48Z,
                        after "Add the other concerns please." at
                        17:51:49Z (will-messages.md lines 265-267).
                        One entry runs about 40 lines. The entry
                        fields exist "as material for briefing
                        concern-advocate agents" (memory/MEMORY.md
                        line 15). Project guidance: "Don't generate
                        large batches of items without Will reviewing
                        them" (memory/cc-public-design-principles.md
                        line 27). Will asked for changes afterwards
                        (18:30:41Z, 19:49:54Z; commits 373ff5d,
                        7053bfa), so it was read, but not shown to be
                        read in full. Assumption: the entries were
                        drafted before 17:51:49Z, so the one-minute
                        gap measures commit time only.

