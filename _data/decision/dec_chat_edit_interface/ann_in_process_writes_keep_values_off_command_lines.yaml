title:                  Elicited values kept off the command line
brief:                  |
                        Called in process, the bot hands elicited
                        values to the editing module in memory. As a
                        subprocess, the simple commands carry each
                        value as a command-line argument, which puts
                        personal data where other local processes and
                        logs may see it, unless every write goes
                        through batch on stdin.
description:            |
                        The new and header commands take each field as
                        a pair of command-line arguments, --field NAME
                        VALUE (src/cctool/cli/editing.py, lines
                        101-107 and usage at lines 27-31). The set
                        command takes VALUE as an argument, and reads
                        it from stdin only when VALUE is -
                        (src/cctool/cli/editing.py, lines 233 and
                        248-253). The batch command reads its
                        operations from a file or from stdin
                        (src/cctool/cli/editing.py, lines 330-335).
                        The in-process option calls the editing module
                        in the process of the bot
                        (opt_edit_module_in_process, brief). A likely
                        first instance holds member skill profiles,
                        which are personal data (owner's statement).
                        Personal data lives only in private
                        repositories (owner's statement). A Tree reads
                        every document of the tree when it is made
                        (src/cctool/edit/edit.py, lines 174-182), so
                        either option holds the whole private tree in
                        memory while it writes, and a long-lived
                        in-process bot may hold it between writes too.
                        ASSUMPTION: on a default Linux host the
                        arguments of a running process can be read by
                        other local users through ps and
                        /proc/PID/cmdline, and may be kept by process
                        accounting or audit logs. Holds at ten times
                        the size: yes, because each extra write and
                        each extra contributor adds one more command
                        line that carries personal data, while the
                        in-process path adds none.

