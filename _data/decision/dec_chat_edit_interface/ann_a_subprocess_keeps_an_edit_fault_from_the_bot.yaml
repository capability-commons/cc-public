title:                  Subprocess that keeps an edit fault from the bot
brief:                  |
                        Running cctool as a separate process for each
                        write means a crash, hang or leftover state in
                        the editing code ends only that one write.
                        Called in process, the same fault ends the bot
                        and every conversation it holds.
description:            |
                        The command line reads a fresh Tree for each
                        edit and reports the result as exit status 0,
                        1 or 2 (src/cctool/cli/editing.py within
                        _run). A Tree reads every document of the tree
                        when it is made (src/cctool/edit/edit.py
                        within Tree). The checker keeps module-level
                        caches across checks in one process
                        (src/cctool/check/check.py within CACHE_SCHEMA
                        and CACHE_REVIEW). The write replaces staged
                        files one by one with os.replace, so a process
                        killed between two replaces leaves some files
                        new and some old (src/cctool/edit/edit.py
                        within _write). Holds at ten times the size:
                        yes, because more conversations in one bot
                        raise the cost of a fault that ends the bot,
                        though the subprocess must then not be killed
                        during its write.

