title:                  Structured failures from the editing module
brief:                  |
                        In process, apply returns each failure as a
                        row with its check and path, which the bot can
                        map to a field and turn into a question about
                        that field. As a subprocess, the bot gets
                        described lines on stderr and an exit code,
                        text that cctool says may change, and must
                        parse it before it can ask.
description:            |
                        apply returns the failures an edit adds, keyed
                        by check (src/cctool/edit/edit.py within
                        batch). edit.batch makes a list of operations
                        (src/cctool/edit/edit.py, batch at line 992).
                        Failures is a dict of check name to rows
                        (src/cctool/check/check.py within Failures). A
                        schema failure row has the columns id, schema,
                        file, line, path and message
                        (src/cctool/check/schema.py within COLUMNS).
                        The command line prints described failures on
                        stderr and exits with 1 when the edit adds a
                        failure and with 2 when it cannot be made
                        (src/cctool/cli/editing.py, function _run,
                        lines 474-520; src/cctool/cli/group.py within
                        EXIT_OK, EXIT_NONCONFORMITY and EXIT_ERROR).
                        The name of a check is the stable code that
                        scripts match on, and the sentences may change
                        (AGENTS.md#failures-and-errors). The checklist
                        shows what failed a check
                        (opt_checklist_led_conversation brief). The
                        bot source lives in cc-public (owner's
                        statement), and the gate runs the tests when
                        code is staged (AGENTS.md, "Before you
                        finish"). ASSUMPTION: a bot that parses text
                        output can lose the link between a failure and
                        the field that caused it when the wording
                        changes. Holds at ten times the size: yes,
                        because the form of a failure and the shape of
                        the interface do not change with the number of
                        items, and a change to the signature of apply
                        fails a test in the same commit.

