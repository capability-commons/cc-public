title:                  Warm check caches in a long-lived process
brief:                  |
                        The check keeps its schema and review caches
                        only within one process. A bot that calls the
                        editing module in process can hold them warm
                        between writes, while a subprocess per write
                        starts cold each time.
description:            |
                        CACHE_SCHEMA and CACHE_REVIEW are kept between
                        checks in one process, and the review before
                        an edit is found in CACHE_REVIEW when the tree
                        is as it was last checked
                        (src/cctool/check/check.py within
                        CACHE_SCHEMA, CACHE_REVIEW and COUNT_REVIEW).
                        CACHE_REVIEW is keyed by the identity of the
                        document objects (src/cctool/check/check.py
                        within do_review_documents), and a new Tree
                        re-reads every file into new objects
                        (src/cctool/edit/edit.py within Tree;
                        src/cctool/graph/extract.py within
                        is_document, extract and documents). Schema
                        verdicts survive across processes only when
                        the environment variable CC_PUBLIC_STORE names
                        a store, which the commit gate sets
                        (src/cctool/check/store.py, module docstring).
                        The web server already writes through the
                        editing module in its own process and warms
                        the check once at start
                        (src/cctool/web/server.py within submit and
                        _warm). Process start-up was about 0.19 s of a
                        2.25 s dry-run edit on 2026-10-15
                        (_data/decision/dec_editing_by_construction/ann_each_edit_checks_the_whole_tree.yaml).
                        The gain is not automatic: the bot must keep
                        its documents between writes, or the review
                        cache misses because the objects are new.
                        Holds at ten times the size: yes, because the
                        work a warm cache saves grows with the tree,
                        while start-up stays fixed.

