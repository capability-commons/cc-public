title:                  No resolving work for the guid in one repository
brief:                  |
                        Inside one repository readable ids are checked
                        unique, and every trace the tooling follows is
                        keyed by readable id. So an id-only edge would
                        resolve and trace the same today, and the
                        guid's benefit waits until the graph spans
                        repositories.
description:            |
                        duplicate_id fails when one readable id names
                        two items (src/cc_public/check/check.lp lines
                        92-103). The edge fact holds the source, the
                        relation id and the target id, and no guid
                        (src/cc_public/graph/extract.py lines 127-129
                        and 459-462). primary_edge and the edge checks
                        are built from it and match relation ids as
                        strings (src/cc_public/graph/derive.lp lines
                        56-66; check.lp lines 146, 150, 297, 314). The
                        tree holds 203 items and 136 edges (facts
                        extracted at commit 89c74d8). Holds at tenfold
                        size while the graph stays in one repository,
                        and fails once edges cross repositories.
                        Merged from the flexibility and traceability
                        advocates.

