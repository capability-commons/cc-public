title:                  Little resolving work for the guid in one repository
brief:                  |
                        Inside one repository readable ids are checked
                        unique, and every trace the tooling follows is
                        keyed by readable id. The guid's only
                        resolving work here is to find an item whose
                        id has changed, so most of its benefit waits
                        until the graph spans repositories.
description:            |
                        duplicate_id fails when one readable id names
                        two items (src/cctool/check/check.lp within
                        duplicate_id). The edge fact holds the source,
                        the relation id and the target id, and no guid
                        (src/cctool/graph/extract.py within
                        _line_of_file). primary_edge and the edge
                        checks are built from it and match relation
                        ids as strings (src/cctool/graph/derive.lp
                        within primary_edge). The guid finds an item
                        only where its id names nothing, as after a
                        rename (check.lp within dangling_reference and
                        reaches). The tree holds 1862 items and 4494
                        edges. Holds at tenfold size while the graph
                        stays in one repository, and fails once edges
                        cross repositories. Merged from the
                        flexibility and traceability advocates.

