title:                  Id for resolving, guid for disambiguating
brief:                  |
                        Prose and edges name an item by its readable
                        id, and the id resolves. An ambiguous or
                        overloaded id is a nonconformity, and the guid
                        each edge carries tells the items apart so the
                        id can be renamed. Ruled by William Payne on
                        2026-10-22.

