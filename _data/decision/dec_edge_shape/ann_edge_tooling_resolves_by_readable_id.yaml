title:                  Tooling that resolves edges by readable id
brief:                  |
                        As built, the readable id resolves and the
                        guid finds only items whose id names nothing.
                        A stale readable id is still a failure, and an
                        edge to an item in another repository fails as
                        a dangling reference.
description:            |
                        Edge facts are extracted from id_relation and
                        id_target only (src/cc_public/graph/extract.py
                        lines 1146-1149). dangling_reference fails a
                        reference only when neither its id nor its
                        guid names an item, and its id is no alias
                        (src/cc_public/check/check.lp lines 524-529).
                        guid_mismatch reports a guid that differs from
                        the guid of the item its readable id names
                        (same file lines 547-550). outdated_reference
                        fails a reference that uses an alias, or an
                        old id whose guid names an item (same file
                        lines 1082-1091). Tests confirm an absent id
                        is reported and an old id is found by guid
                        (src/cc_public/check/_test/test_check.py lines
                        604-618). The edit tool fills each guid by
                        looking up the readable id
                        (src/cc_public/edit/edit.py lines 217-225 and
                        1339-1348). This contradicts the claim that
                        the guid alone resolves today, not the
                        federation case for carrying a guid. Raised by
                        all five advocates.

