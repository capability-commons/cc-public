title:                  Guid ends that survive a merge of scopes
brief:                  |
                        An edge whose ends resolve by guid keeps
                        leading to the same items when graphs are
                        split across repositories or merged. Edges by
                        readable id alone turn each such move into
                        collisions and renames.
description:            |
                        Readable ids carry no guarantee of uniqueness,
                        and global uniqueness is impossible across a
                        federation; bringing two items into one scope
                        turns a difference into a collision
                        (_data/schema/sch_trait_identity.yaml lines
                        59-64 and 83-99). guid_self tells apart two
                        items whose ids collide (same file lines
                        28-31). Readable ids have no central numbering
                        (memory/cc-public-design-principles.md line
                        14). A linter cannot refresh readable id
                        copies held in foreign repositories
                        (_data/schema/sch_trait_edge.yaml lines
                        116-124). WTP plans to bring in much larger
                        graphs, such as logs, test coverage, ASTs and
                        taint graphs (maintainer's statement,
                        2026-10-13, will-messages.md line 313).
                        ASSUMPTION: a graph that large may be split
                        across repositories or hosts, or have parts
                        merged in. Strength grows with the number of
                        ids and of partner repositories. Merged from
                        the compatibility, flexibility and
                        traceability advocates.

