title:                  Edge schema that now says the id resolves
brief:                  |
                        ann_edge_schema_and_tooling_disagree says the
                        edge schema calls the guid the sole resolvable
                        reference and tells tooling never to resolve
                        by id_target. The edge schema now says the id
                        resolves and the guid disambiguates, which is
                        what the tooling does.
description:            |
                        _data/schema/sch_trait_edge.yaml at
                        description say "Each end is named by readable
                        id and by guid. The id resolves, as it does in
                        prose." Lines 117-124 say of id_target "This
                        is the field that resolves", and lines 131-134
                        say the guid finds the target when the id
                        names nothing. The phrases "sole resolvable
                        reference" and "Never resolve by this field"
                        are no longer in the file. HOW A NAME RESOLVES
                        in _data/schema/sch_trait_identity.yaml at
                        description says the same: a reference
                        resolves by its id. So a newcomer who learns
                        the design from the edge schema learns what
                        the code does. Found in the review of
                        2026-10-22.

