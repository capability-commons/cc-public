title:                  Id for resolving, guid for disambiguating
brief:                  |
                        An edge names each end by readable id and by
                        guid, and prose names an item by its id. The
                        id resolves. An id that is ambiguous or
                        overloaded is a nonconformity, which the
                        checker reports, and the guid tells the items
                        apart so that the id can be renamed.

