title:                  Relation ids open to collision between registers
brief:                  |
                        The relation register is an open vocabulary,
                        so a partner may add a relation whose readable
                        id matches one of ours with a different
                        meaning. Named by id only, the relation an
                        edge records becomes ambiguous after exchange.
description:            |
                        A new relation is an entry in the relation
                        register, an open vocabulary
                        (_data/schema/sch_trait_edge.yaml at usage).
                        Each entry holds the semantics of its
                        relation, its relation constraints and whether
                        it is acyclic, though not yet cardinality
                        (_data/register/reg_relation.yaml at note),
                        and carries a guid_self (for example
                        _data/register/reg_relation.yaml at
                        entries.relation_is_specified_by_schema.guid_self).
                        Direction decides "which item carries the fact
                        when it travels on its own, and in a
                        federation it decides who is able to record
                        the fact at all" (same file at note).
                        ASSUMPTION: partners will add relation entries
                        of their own. No partner register exists yet,
                        so the point is weak today and grows only if
                        the graph spans repositories. Merged from the
                        compatibility and traceability advocates.

