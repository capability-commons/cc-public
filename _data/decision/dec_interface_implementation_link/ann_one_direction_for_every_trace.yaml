title:                  One direction for every trace
brief:                  |
                        Every trace from an implementation to what it
                        implements runs the same way, from the item of
                        the implementation to the item of the
                        specification, as code already names the
                        logical component it realizes. A trace query
                        then needs no special case for interface
                        members.

