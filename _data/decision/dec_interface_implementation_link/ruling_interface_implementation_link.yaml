title:                  How code names the interface member it implements
brief:                  |
                        The item of the code names the member it
                        implements with r_realizes. Generally, the
                        item of an implementation points at the
                        specification it implements, such as an
                        interface control document or a functional
                        specification. Determined by William Payne,
                        who agreed with the recommended option
                        (2026-10-19).

