title:                  Ports whose count comes from configuration
brief:                  |
                        How does a node kind accept a number of inputs
                        or outputs that only its configuration fixes,
                        such as a logger with any number of inputs or
                        a merge of any number of models?
description:            |
                        In Stableflow each port took one edge, and a
                        node implementation could see how many ports
                        were connected and handle them as it chose, so
                        only the configuration said which ports
                        existed; a generic logging block could take
                        any number of inputs. With a data type
                        declared for each port that freedom has to be
                        declared too (WTP, 2026-10-26). The arguments
                        on how the graph of edits is run found that a
                        dataflow step's inputs are fixed, so a merge
                        of any number of models did not fit.

