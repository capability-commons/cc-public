title:                  Port groups whose ports share a type
brief:                  |
                        A node kind may declare port groups whose
                        ports share one data type, with the number of
                        ports set by the configuration of each
                        dataflow node. Ruled by WTP on 2026-10-26; the
                        option is WTP's own proposal.

