title:                  One node kind for each count, copied code
brief:                  |
                        Under fixed ports a node that must take a
                        varying number of inputs is written once for
                        each count, each with its own interface and
                        code, so a change to a logger is made in every
                        copy. The model already multiplies node kinds
                        by port type where it lacks type parameters.
                        Port groups keep one node kind and one
                        interface.
description:            |
                        Sources:
                        - The fixed-ports option writes a separate
                          node kind for each count.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_fixed_ports_only.yaml
                          at brief)
                        - Every dataflow node realizes the interface
                          control document whose step surface it
                          presents.
                          (_data/schema/sch_dataflow_node.yaml at
                          description)
                        - Without type parameters, an inserted node
                          kind is needed for each port type.
                          (_data/decision/dec_where_engine_behavior_lives/ann_inserted_node_kinds_needed_per_port_type.yaml
                          at brief)
                        - Maintainability counts the parts touched by
                          a representative change.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure.1)
                        - Assumption: the collection form of fixed
                          ports avoids the copies, at the cost of a
                          gathering node. Strength: moderate; it grows
                          with the number of counts in use.

