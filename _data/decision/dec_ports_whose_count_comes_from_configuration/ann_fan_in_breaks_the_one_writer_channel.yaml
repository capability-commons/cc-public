title:                  Fan-in against the one-writer channel of a Kahn network
brief:                  |
                        In a Kahn process network each channel has one
                        writer and one reader, and that is what makes
                        the result independent of timing. Several
                        edges into one input make one channel with
                        many writers, so the order in which the node
                        sees their tokens must be fixed by a rule.
                        Edges are identified by their ends, not by
                        their place in a list, so the stated order
                        needs a key or a sort that the option does not
                        give.
description:            |
                        Sources:
                        - "A FIFO cannot be consumed by multiple
                          processes, nor can multiple processes write
                          to a single FIFO", and timing or execution
                          order must not affect the result.
                          (https://en.wikipedia.org/wiki/Kahn_process_networks)
                        - The option hands the node all the tokens
                          that arrived on the port at a step, in a
                          stated order.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_many_edges_on_one_input_port.yaml
                          at brief)
                        - A dataflow edge is identified by its two
                          ends.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - Every list of the graph schema declares a
                          merge key.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/ruling_merge_key_declared_for_every_list.yaml
                          at brief)
                        - Assumption: a sort by the ids of the source
                          ends would give a stated order, but one that
                          changes when a node is renamed. Strength:
                          strong for determinism within a step; it
                          does not apply to nodes that treat their
                          inputs as a set.

