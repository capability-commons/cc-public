title:                  Group members with no interface member for an edge end to name
brief:                  |
                        An end of a dataflow edge names a port by the
                        id and guid of a member of the interface
                        control document, so every end traces to a
                        declared member. A port group declares one
                        member for the group, and its ports exist only
                        in the configuration of each node, so an end
                        at one of them has no member of its own to
                        name. Under fixed ports every end names a
                        declared member, as today.
description:            |
                        Sources:
                        - An end names a dataflow node and a port of
                          the interface the node presents, by id and
                          guid. (_data/schema/sch_dataflow_graph.yaml
                          at $defs.end.properties.id_port and
                          description)
                        - A port is an interface member, with an
                          identity that lets a requirement name one
                          declaration.
                          (_data/schema/sch_interface_member.yaml at
                          description)
                        - A check fails an end that names no port of
                          the node's interface.
                          (src/cctool/check/check.lp within
                          unknown_port)
                        - The number of ports in a group is set by the
                          configuration of each dataflow node.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_port_groups_sharing_a_type.yaml
                          at brief)
                        - Assumption: the naming decision can give
                          group members an identity, which would
                          answer this; it is open. Strength: strong
                          until that decision is made.

