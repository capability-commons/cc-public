title:                  Port groups whose ports share a type
brief:                  |
                        A node kind may declare port groups. Every
                        port in a group shares one data type
                        declaration, and the number of ports in the
                        group is set by the configuration of each
                        dataflow node. The engine still sees one
                        output port, one edge and one input port for
                        every connection, and the node implementation
                        sees how many ports each group has. A node
                        that can make a default value of the group's
                        type makes every port in the group able to
                        close a feedback edge.
description:            |
                        WTP's proposal (WTP, 2026-10-26).

