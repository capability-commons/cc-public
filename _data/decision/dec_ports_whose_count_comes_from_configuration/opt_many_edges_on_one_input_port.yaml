title:                  Many edges on one input port
brief:                  |
                        An input port may be fed by any number of
                        edges of its type, and the engine hands the
                        node all the tokens that arrived on it at a
                        step, in a stated order.
description:            |
                        Fan-in as some dataflow tools allow it, given
                        for comparison.

