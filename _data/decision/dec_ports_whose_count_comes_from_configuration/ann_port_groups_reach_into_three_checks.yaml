title:                  Port groups that reach into three checks and a new decision
brief:                  |
                        Port groups add a construct to the interface
                        schema, a count to the configuration of each
                        node, and a way to name each member. The
                        checks of unknown ports, unfed inputs and port
                        types must then read members as well as
                        declared ports. Fixed ports add nothing, and
                        the many-edges option changes only the rule
                        that an input is fed once.
description:            |
                        Sources:
                        - A port has a type and may be optional, and
                          has no field for a group or a count.
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.port)
                        - The checks of unknown ports and unfed inputs
                          read the ports of the interface a node
                          presents, and the port type check reads the
                          types those ports state.
                          (src/cctool/check/check.lp within
                          unknown_port, unfed_input and
                          port_type_mismatch)
                        - An input takes its value from at most one
                          edge. (src/cctool/check/check.lp within
                          input_fed_twice)
                        - Naming the ports of a group is a decision of
                          its own.
                          (_data/decision/dec_naming_of_ports_in_a_group/dec_naming_of_ports_in_a_group.yaml
                          at brief)
                        - Simplicity counts the distinct mechanisms a
                          design introduces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.0)
                        - Assumption: the many-edges option needs an
                          ordering rule as well, which adds to its
                          count. Strength: moderate; the cost is paid
                          once and does not grow with the number of
                          graphs.

