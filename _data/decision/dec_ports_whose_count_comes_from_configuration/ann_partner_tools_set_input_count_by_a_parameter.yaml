title:                  Partner tools that set an input count by a parameter
brief:                  |
                        Simulink's Mux block takes its number of
                        inputs as a parameter, Houdini's Merge node
                        takes up to 9999 inputs, and GStreamer's
                        funnel makes sink pads on request from one
                        template. Each is one node kind whose input
                        count is set per use, which port groups match.
                        FMI 3.0 sizes array variables by structural
                        parameters, which matches the collection form
                        of fixed ports instead.
description:            |
                        Sources:
                        - The Mux block's Number of inputs is a
                          scalar, vector, cell array or list of signal
                          names, and its inputs are numbered by
                          position.
                          (https://www.mathworks.com/help/simulink/slref/mux.html)
                        - Houdini's Merge node merges a maximum of
                          9999 inputs.
                          (https://www.sidefx.com/docs/houdini/nodes/sop/merge.html)
                        - GStreamer's funnel has a sink_%u pad
                          template whose presence is request.
                          (https://gstreamer.freedesktop.org/documentation/coreelements/funnel.html)
                        - FMI 3.0 adds structural parameters that
                          describe and change array sizes.
                          (https://fmi-standard.org/docs/3.0/)
                        - The Patrol notes read a fan-out as an
                          implied GStreamer tee, and mark appsink and
                          appsrc adapters between runtimes.
                          (_sources/cc-patrol-notes/drawing-lessons.md#7-ports-fan-out-and-fan-in;
                          _sources/cc-patrol-notes/drawing-lessons.md#6-edge-kind-and-policy-as-line-style)
                        - Assumption: graphs will be exchanged with
                          tools of these kinds, of which only
                          GStreamer is in the Patrol drafts. Strength:
                          moderate; it holds for import and export,
                          not for the engine.

