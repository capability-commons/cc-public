title:                  Gathering tokens as work a node can do
brief:                  |
                        Under the many-edges option the engine gathers
                        the tokens of several edges into one input,
                        which a node reading a port group can do
                        itself. The ruling on engine behavior lets a
                        behavior into the engine only when a recorded
                        decision shows that no inserted node can do it
                        within a measured budget. Port groups keep one
                        output port, one edge and one input port at
                        engine level, so the engine gains nothing.
description:            |
                        Sources:
                        - The engine does nothing that a node could
                          do, and a behavior moves into the engine
                          only on a recorded decision with a measured
                          budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief)
                        - The engine hands the node all the tokens
                          that arrived on the port.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_many_edges_on_one_input_port.yaml
                          at brief)
                        - Under port groups the engine still sees one
                          output port, one edge and one input port for
                          every connection.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_port_groups_sharing_a_type.yaml
                          at brief)
                        - Assumption: no measured budget yet shows a
                          node too slow to gather its inputs.
                          Strength: strong while the engine ruling
                          stands.

