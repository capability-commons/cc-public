title:                  Merge and logger nodes with any number of inputs
brief:                  |
                        The ruled variant family merges any number of
                        dataflow variants, and a logger may take any
                        number of inputs, but a dataflow step reads a
                        fixed set of inputs, so neither fits fixed
                        ports. Under fixed ports such a node takes a
                        collection, which needs a gathering node
                        upstream and a fixed capacity, or one node
                        kind for each count. Port groups give one node
                        kind whose count each configuration sets.
description:            |
                        Sources:
                        - A merge selects the dataflow variants to
                          merge.
                          (_data/decision/dec_shape_of_a_variant_family/ruling_family_as_a_graph_of_edits_with_merge.yaml
                          at brief)
                        - A dataflow step reads a fixed set of inputs.
                          (_data/schema/sch_interface_control_document.yaml
                          at $defs.surface_dataflow_step.description)
                        - An input takes its value from at most one
                          edge. (src/cctool/check/check.lp within
                          input_fed_twice)
                        - The decision names a logger with any number
                          of inputs and a merge of any number of
                          models.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/dec_ports_whose_count_comes_from_configuration.yaml
                          at brief)
                        - The fixed-ports option writes a node kind
                          for each count, or takes one input carrying
                          a collection.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_fixed_ports_only.yaml
                          at brief)
                        - Every sequence on the engine has a fixed
                          capacity declared in the component's spec.
                          (_sources/axair-orchestrator/docs/component_interface.md#5-variable-length-data-decided-2026-10-11-fixed-capacity)
                        - Assumption: the merge in the graph of edits
                          is run as a dataflow node, which is not yet
                          ruled. Strength: strong for loggers and
                          merges; it does not apply to node kinds
                          whose inputs are fixed by their function.

