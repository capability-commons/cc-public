title:                  A release declares a maturity that is checked
brief:                  |
                        A release declares the maturity it is for, and
                        the release check refuses it if any code it
                        holds is of lower maturity. A release that
                        claims no maturity, and one that takes the
                        lowest maturity of its code, are rejected.
                        Ruled by WTP on 2026-10-28.

