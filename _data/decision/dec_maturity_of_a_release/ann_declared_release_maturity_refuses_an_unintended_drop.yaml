title:                  A drop in release maturity refused before the tag
brief:                  |
                        WTP decides each release. If a release takes
                        the lowest maturity of what it holds, one low
                        module added late turns an intended product
                        into a demonstration, and the claim of the
                        release falls without any change to the
                        release and with no refusal. A declared
                        maturity that the release check compares with
                        the code refuses that release, so the drop is
                        found before the tag and must be met by a
                        deliberate edit that WTP reads. With no
                        maturity on a release, a consumer cannot tell
                        either kind apart.
description:            |
                        Sources:
                        - WTP decides each release for now
                          [_data/decision/dec_who_may_release/ruling_maintainer_decides_each_release.yaml
                          at brief].
                        - The lowest maturity option claims the lowest
                          maturity of the code a release holds
                          [_data/decision/dec_maturity_of_a_release/opt_release_takes_the_lowest_maturity.yaml
                          at brief].
                        - The declared option has the release check
                          refuse a release if any code it holds is of
                          lower maturity than declared
                          [_data/decision/dec_maturity_of_a_release/opt_release_declares_a_maturity_that_is_checked.yaml
                          at brief].
                        - The no maturity option leaves the maturity
                          of each part visible only in the graph the
                          release holds
                          [_data/decision/dec_maturity_of_a_release/opt_release_claims_no_maturity.yaml
                          at brief].
                        - The release item of 0.1.0 records its brief,
                          version and runtime packages, and no
                          maturity
                          [_data/release/release_cc_public_0_1_0.yaml
                          at brief, version and dependency].
                        - The release check already returns each
                          reason a commit may not be tagged
                          [src/cctool/release/release.py within
                          verify].
                        - All software is written by agents, many at
                          once, and reviewed by one maintainer
                          [owner's statement, 2026-10-28]. Strength
                          for reviewability: Moderate. A computed
                          claim could be shown at release time, which
                          narrows the gap. With no claim the reviewer
                          must read every part. At ten times the size,
                          with more parts changing between releases, a
                          refusal that names the part is the cheaper
                          thing to judge. Strength for reliability:
                          strong if maturity is declared on code at
                          all. It holds at ten times the size, where
                          one low module among many is harder to see
                          by eye.

