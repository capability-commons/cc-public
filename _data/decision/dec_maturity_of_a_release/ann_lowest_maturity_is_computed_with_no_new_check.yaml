title:                  A release maturity computed rather than declared
brief:                  |
                        Taking the lowest maturity of what a release
                        holds is one computation, written into the
                        release item when it is prepared. A declared
                        maturity needs that same computation, a field
                        written by hand, and a new reason to refuse in
                        the release check. No maturity on a release
                        adds nothing.
description:            |
                        Sources:
                        - The lowest maturity option claims the lowest
                          maturity of the code a release holds
                          [_data/decision/dec_maturity_of_a_release/opt_release_takes_the_lowest_maturity.yaml
                          at brief].
                        - The declared option refuses a release if any
                          code it holds is of lower maturity than
                          declared, which needs that lowest value to
                          compare with
                          [_data/decision/dec_maturity_of_a_release/opt_release_declares_a_maturity_that_is_checked.yaml
                          at brief].
                        - Release preparation writes the release item
                          for HEAD from what it computes over the
                          commits since the last tag
                          [src/cctool/release/release.py within
                          prepare].
                        - The release check already returns each
                          reason a commit may not be tagged
                          [src/cctool/release/release.py within
                          verify].
                        - The no maturity option leaves the maturity
                          of each part visible only in the graph the
                          release holds
                          [_data/decision/dec_maturity_of_a_release/opt_release_claims_no_maturity.yaml
                          at brief]. Strength: moderate. The declared
                          option does one more job, checking intent,
                          and that job is what its extra parts buy. At
                          ten times the size the count of parts is the
                          same.

