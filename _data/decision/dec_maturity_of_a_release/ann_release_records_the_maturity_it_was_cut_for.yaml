title:                  A release that states what it was cut for
brief:                  |
                        A declared maturity records the purpose of a
                        release, such as a quick demonstration or a
                        product, and the check ties it back to the
                        parts that must meet it. With no claim, a peer
                        that pins the release finds nothing in the
                        release item that says what it is fit for.
description:            |
                        Sources:
                        - The release item of 0.1.0 records its brief,
                          version and runtime packages, and no
                          maturity
                          [_data/release/release_cc_public_0_1_0.yaml
                          at brief, version and dependency].
                        - The release item exists so that cc-patrol,
                          the first peer, has a release to pin
                          [_data/release/release_cc_public_0_1_0.yaml
                          at brief].
                        - WTP described a quick demonstration on a
                          short timescale, released with a declared
                          maturity that matched the lowest declared
                          maturity of its components [owner's
                          statement, 2026-10-28].
                        - The declared option has the release check
                          refuse a release if any code it holds is of
                          lower maturity than declared
                          [_data/decision/dec_maturity_of_a_release/opt_release_declares_a_maturity_that_is_checked.yaml
                          at brief].
                        - The no maturity option leaves the maturity
                          of each part visible only in the graph the
                          release holds
                          [_data/decision/dec_maturity_of_a_release/opt_release_claims_no_maturity.yaml
                          at brief].
                        - September held that a claim allowed to stand
                          is one that will be believed
                          [origin/main:ddr/ddr_maturity.yaml at
                          alternative]. Strength: Moderate. The lowest
                          maturity option also makes no unsupported
                          claim, but it records the result, not the
                          need. At ten times the size, with more peers
                          pinning releases, a stated purpose matters
                          more.

