title:                  Skip in a gate that the ruling asks to build the C++
brief:                  |
                        The ruling has the gate build and test the C++
                        whenever a commit stages the engine's C++, the
                        generator, pyproject.toml or pixi.lock, and at
                        every push. A test that skips when it finds no
                        toolchain lets exactly those gates pass
                        without building anything, as the review
                        reproduced: 30 passed, 37 skipped, exit
                        0. The relock is the sharpest case, since the
                          ruling builds on a staged pixi.lock so that
                          a change to the compiler is caught next to
                          its cause, and a relock that lost cmake or
                          the compiler would pass by skipping. Both
                          other options fail such a gate.
description:            |
                        Sources:
                        - The gate builds and tests the C++ when a
                          commit stages the
                          engine's C++, the generator, pyproject.toml or pixi.lock, the
                          gate of a push always builds it, and the compiler goes in the
                          default pixi environment.
                          (_data/decision/dec_when_the_gate_builds_cpp/ruling_cpp_built_when_staged.yaml
                          at brief)
                        - An upstream change to the compiler arrives
                          in a commit that
                          stages only pixi.lock or pyproject.toml.
                          (_data/decision/dec_when_the_gate_builds_cpp/ann_relock_changes_compiler_without_cpp.yaml
                          at brief)
                        - With cmake, ninja and c++ off the path, the
                          dataflow tests gave
                          30 passed, 37 skipped and exit 0 (review of 2026-10-29, CC-043;
                          trial 2c777ab9, src/cctool/dataflow/_test/conftest.py, fixture
                          built).
                        - The environment is pinned by version and
                          hash in a committed
                          lock, which ended the silent faults of a rule engine taken from
                          the path.
                          (_data/decision/dec_environment_manager/ruling_environment_manager.yaml
                          at brief)
                        - Functional suitability asks whether the
                          design does anything it
                          should not; dependency risk asks what happens if a part taken
                          from a third party is changed or withdrawn.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question and
                          entries.concern_dependency_risk.question)
                        Strength: strong; the skip option contradicts
                        the ruling, unless it is read as applying only
                        outside the gate, which is the
                        skip-unless-staged option.

