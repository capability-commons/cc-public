title:                  Engine tests where no C++ toolchain is found
brief:                  |
                        When the tests that build and run a C++ engine
                        find no compiler, cmake or ninja, do they
                        skip, or does the run fail?
description:            |
                        ruling_cpp_built_when_staged has the gate
                        build and test the C++ when a commit stages
                        it, and puts the compiler in the default pixi
                        environment. pyproject.toml does not yet
                        declare a compiler, cmake or ninja. In the
                        trial implementation of 2026-10-29 the engine
                        tests skipped silently without them: 37 of its
                        67 tests skipped, and the run still passed
                        (review of 2026-10-29, CC-043).

