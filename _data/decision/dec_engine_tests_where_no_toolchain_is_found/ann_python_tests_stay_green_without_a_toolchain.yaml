title:                  Python tests kept green on a host without the toolchain
brief:                  |
                        The skip options keep a full run green on a
                        host where the toolchain is missing or broken,
                        so a change to the Python alone can still be
                        checked there with one command. Under the
                        failing option such a host shows 37 failures
                        beside the 30 Python passes, and a contributor
                        must know to leave out the engine tests by
                        marker. The case is rare once the toolchain is
                        in the locked environment for every platform
                        the workspace names, and a device session on
                        atlas, with 2 CPUs and calls cut at 180 s, is
                        better served by leaving the engine tests out
                        on purpose than by a skip it did not ask for.
description:            |
                        Sources:
                        - A host without the toolchain can still run
                          every other test.
                          (_data/decision/dec_engine_tests_where_no_toolchain_is_found/opt_engine_tests_skip_without_a_toolchain.yaml
                          at brief)
                        - The trial's dataflow tests split into 30
                          that need no toolchain
                          and 37 that build an engine (review of 2026-10-29, CC-043).
                        - The workspace names the platforms osx-arm64,
                          osx-64 and
                          linux-64, with packages from conda-forge (pyproject.toml at
                          tool.pixi.workspace).
                        - atlas's VM sees 2 CPUs, device tool calls
                          die at 180 s, and the
                          trial adds about a minute to the gate (review of 2026-10-29,
                          CC-089).
                        - Maintainability asks how readily a change
                          can be checked before
                          it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question)
                        ASSUMPTION: conda-forge's compiler packages
                        work on each of those platforms, though on
                        macOS they may still need Apple's SDK from the
                        command line tools. Strength: weak; it is a
                        convenience on hosts that the ruling has made
                        rare.

