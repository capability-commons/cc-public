title:                  Near-zero timings recorded for skipped engine tests
brief:                  |
                        The ruling asks that every build and test run
                        be timed and the timings kept, and it defers
                        both a compiler cache and a build on every
                        code commit until those baselines exist. The
                        gate takes each test's seconds from pytest's
                        JUnit report, which lists a skipped test like
                        any other, with the few milliseconds its skip
                        took, so a gate on a host without the
                        toolchain logs the engine tests as nearly
                        free. The baseline the ruling waits for would
                        then argue for building on every commit from
                        numbers that measured nothing. A test that
                        fails leaves a stage the log records as
                        failed.
description:            |
                        Sources:
                        - Every build and test run should be timed and
                          the timings
                          recorded; a compiler cache waits for baseline timings, and
                          building on every code commit is revisited if clean builds take
                          only seconds.
                          (_data/decision/dec_when_the_gate_builds_cpp/ruling_cpp_built_when_staged.yaml
                          at brief)
                        - The gate logs the wall seconds and the
                          outcome of each stage,
                          and each test's seconds from the JUnit XML that pytest writes,
                          with nothing that marks a skip (src/cctool/gate/timing.py within
                          durations and the module description).
                        - The trial's 67 dataflow tests, which build
                          and run C++
                          engines, take about 67 s of wall time on 4 CPUs (review of
                          2026-10-29, CC-089).
                        - Response time and throughput are measures of
                          performance
                          efficiency.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure)
                        ASSUMPTION: pytest's JUnit report lists a test
                        skipped in its setup as a test case with a
                        skipped element and the time its setup took.
                        Strength: moderate; a timing summary that left
                        out skipped tests would remove the fault, but
                        none does today.

