title:                  Deselection by marker that leaves the test one rule
brief:                  |
                        The gate already chooses its tests by a marker
                        expression drawn from the paths a commit
                        stages, and leaves the prepush tests out of a
                        commit's gate in that way. If the ruled build
                        uses the same mechanism, marking the engine
                        tests and leaving them out when no C++ is
                        staged, then inside the gate an engine test
                        runs only when the ruling wants it built, and
                        a test that then fails without a toolchain
                        needs no further rule. Skipping unless C++ is
                        staged needs the test to learn whether the
                        gate was asked to build, a second signal
                        beside the marker, which every runner from
                        pixi run test to the release gate must set or
                        be read as not asking.
description:            |
                        Sources:
                        - The test stage runs pytest with a marker
                          expression chosen from
                          the staged paths: a push leaves out slow tests, a commit also
                          prepush and fuzz tests, and a commit of data alone runs only
                          the tests marked reads_data
                          (src/cctool/gate/gate.py within stages).
                        - The ruled C++ build follows the pattern of
                          the test stage, which
                          runs only when code is staged.
                          (_data/decision/dec_when_the_gate_builds_cpp/ann_staged_only_build_mirrors_test_rule.yaml
                          at brief)
                        - An engine test may skip without a toolchain
                          only when the gate
                          has not been asked to build C++.
                          (_data/decision/dec_engine_tests_where_no_toolchain_is_found/opt_engine_tests_skip_unless_cpp_is_staged.yaml
                          at brief)
                        - The review proposed engine tests in a marked
                          stage (review of
                          2026-10-29, W-T11).
                        - Simplicity counts the jobs done by more than
                          one mechanism;
                          maintainability asks how far a change in one part spreads to
                          others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure and
                          entries.concern_maintainability.question)
                        ASSUMPTION: the ruled build is implemented as
                        a marker that the gate deselects, not as a
                        skip. Strength: strong if the build is chosen
                        by marker; weaker if the gate ran the engine
                        tests always and relied on skips to keep
                        Python commits fast.

