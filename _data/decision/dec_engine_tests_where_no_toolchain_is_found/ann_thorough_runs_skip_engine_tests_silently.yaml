title:                  Silent skips in the runs meant to be the most thorough
brief:                  |
                        Skipping unless the gate asked still lets
                        engine tests skip in every run that the commit
                        and push gates do not drive: the overnight
                        coverage run, the slow run on each Python, a
                        plain pixi run test, and the full gate before
                        a release, which runs every test on each
                        Python that requires-python admits. Those are
                        the runs a reviewer reads as the fullest
                        evidence, and the review found that the
                        requirement table already overstates what the
                        tests prove. A test that fails without a
                        toolchain makes a green run mean that the
                        engine was built and run, at the cost of the
                        toolchain in every environment those runs use.
description:            |
                        Sources:
                        - The slow task runs the tests in the py312,
                          py313 and py314
                          environments, and the coverage task runs them once under
                          coverage (pyproject.toml at tool.pixi.tasks).
                        - Before a release, every check and test runs
                          with no cached
                          verdicts on each Python that requires-python admits.
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml at
                          brief)
                        - The requirement table overstates what the
                          tests prove, and the
                          review's task asks that a skip of engine tests fail the gate or
                          be declared (review of 2026-10-29, CC-040 and task D14).
                        - Reviewability asks whether a person can read
                          a change in full
                          and judge it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reviewability.question)
                        ASSUMPTION: a toolchain added to the default
                        feature also reaches the py312 to py314
                        environments, which do not leave out the
                        default feature as the tool environment does.
                        Strength: moderate; it bears on runs outside
                        the gate, where a reader may still notice the
                        count of skips, and it would fall if those
                        runs reported skipped engine tests as a
                        failure of their own.

