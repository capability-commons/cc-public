title:                  First role that shuts a type out
brief:                  |
                        If a type with no roles were unrestricted,
                        giving it its first role, for any reason,
                        would silently shut it out of every relation
                        that needs some other role.
description:            |
                        Under that rule a partner that adds one role
                        to a type changes where all of its items may
                        stand, with no edit to any relation and no
                        failure until an existing edge breaks.

