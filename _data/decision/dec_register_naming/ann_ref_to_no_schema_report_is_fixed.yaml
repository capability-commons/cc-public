title:                  Schema reference to no schema now reported
brief:                  |
                        Commit ddcc3e1 "Fix the schema check so that a
                        $ref to no schema is reported" reports a $ref
                        that names no schema. At 360ec14 a rename of
                        the entry schema that missed a reference is
                        caught by the checker, not only by a reader;
                        the naming point itself is unchanged.
description:            |
                        On referencing.exceptions.Unresolvable the
                        schema check adds a schema_violation row
                        against the schema that holds the $ref, once,
                        instead of skipping it
                        (src/cctool/check/schema.py within violations
                        and _unresolved at 360ec14);
                        test_a_schema_ref_to_no_schema_is_reported
                        covers it
                        (src/cctool/check/_test/test_check.py).
                        sch_regentry_type.yaml is still the entry
                        schema of reg_data_item_type (_data/schema/ at
                        360ec14), so the pair still does not rhyme. No
                        code pairs the prefixes.

