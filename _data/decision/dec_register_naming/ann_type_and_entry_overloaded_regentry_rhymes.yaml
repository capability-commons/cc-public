title:                  Overloaded words avoided and names that rhyme
brief:                  |
                        The chosen names keep "type" and "entry" from
                        meaning two things, and regentry tells
                        specific schemas apart from the generic ones
                        and rhymes with sch_reg_*. These are the
                        owner's reasons.
description:            |
                        Owner's statements, on renaming the register
                        in _data/register/reg_type.yaml to
                        reg_data_item_type: "Because the word 'type'
                        is overloaded between programming language
                        types and data item types"
                        (2026-10-13T12:52:27Z); "'Entry' is another
                        overloaded concept. I'd rather use
                        sch_register_entry consistently, as we are
                        definitely going to end up with other sorts of
                        entries elsewhere" (2026-10-13T13:54:30Z); on
                        regentry: "I know it involves creating a
                        neologism and a piece of jargon, but it will
                        be used VERY commonly, and I think that the
                        disambiguation ... will help - as will the
                        common 'rhyming' with sch_reg_*"
                        (2026-10-13T14:52:46Z); "Let's keep bare
                        'entry' deprecated for now"
                        (2026-10-13T15:49:29Z). The 13:54:30Z
                        statement went on "This should include
                        changing sch_entry_* to sch_register_entry_*",
                        so it first argued for
                        opt_sch_register_entry_everywhere; the
                        14:52:46Z statement replaced that with
                        sch_regentry_*. Commits 232f001 and ae6eeff,
                        under tag pre_squash_20261014.

