title:                  Overloaded words avoided and names that rhyme
brief:                  |
                        The chosen names keep "type" and "entry" from
                        meaning two things, and regentry tells
                        specific schemas apart from the generic ones
                        and rhymes with sch_reg_*. These are the
                        maintainer's reasons.
description:            |
                        Maintainer's statements, on renaming the
                        register in _data/register/reg_type.yaml to
                        reg_data_item_type: "Because the word 'type'
                        is overloaded between programming language
                        types and data item types" (2026-10-13);
                        "'Entry' is another overloaded concept. I'd
                        rather use sch_register_entry consistently, as
                        we are definitely going to end up with other
                        sorts of entries elsewhere" (2026-10-13); on
                        regentry: "I know it involves creating a
                        neologism and a piece of jargon, but it will
                        be used VERY commonly, and I think that the
                        disambiguation ... will help - as will the
                        common 'rhyming' with sch_reg_*" (2026-10-13);
                        "Let's keep bare 'entry' deprecated for now"
                        (2026-10-13). The first of these statements
                        went on "This should include changing
                        sch_entry_* to sch_register_entry_*", so it
                        first argued for
                        opt_sch_register_entry_everywhere; a later
                        statement the same day replaced that with
                        sch_regentry_*. Commits 232f001 and ae6eeff,
                        under tag pre_squash_20261014.

