title:                  Register kept apart from the library Registry
brief:                  |
                        Deprecating "registry" keeps the project's
                        word apart from the Registry class of the
                        referencing library the checker uses, so the
                        two vocabularies share one environment without
                        a clash.
description:            |
                        The checker builds a referencing.Registry
                        (src/cctool/check/schema.py within
                        violations); the project depends on
                        jsonschema>=4.23 (pyproject.toml at
                        project.description). concept_register lists
                        "registry" as deprecated
                        (_data/register/reg_concept.yaml at
                        entries.concept_type.alias,
                        entries.concept_type.edge and
                        entries.concept_schema). The held-in relation
                        is renamed from registry to register (commit
                        message of 232f001), and is now
                        relation_has_items_held_in_register (f587284).

