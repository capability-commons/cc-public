title:                  Spelled generic and abbreviated specific register names
brief:                  |
                        Schemas that apply to every register spell the
                        words out, as sch_register and
                        sch_register_entry, and schemas specific to
                        one register abbreviate them, as
                        sch_reg_concept and sch_regentry_concept.
                        Determined by William Payne (2026-10-20).

