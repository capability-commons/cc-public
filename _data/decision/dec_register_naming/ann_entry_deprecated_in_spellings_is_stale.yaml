title:                  Entry admitted beside the two spellings in ids
brief:                  |
                        The old annotation says that entry is
                        deprecated beside the two spellings regentry
                        and register_entry. Now entry is an admitted
                        term for a register entry, used where the
                        register is plain from context.
description:            |
                        concept_register_entry has the preferred term
                        "register entry" and the admitted terms
                        regentry and entry; it lists no deprecated
                        term (_data/register/reg_concept.yaml lines
                        152-167). Its usage says that entry "is used
                        where the register is plain from context, as
                        in 'terminological entry' in ISO 1087" (lines
                        160-162).
                        opt_spelled_generic_abbreviated_specific
                        records that its part on entry was reversed on
                        2026-10-20. The two spellings in schema ids,
                        sch_regentry_* and sch_register_entry, are
                        unchanged. Found in the review of 2026-10-22.

