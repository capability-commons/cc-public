title:                  Entry schema id derived from register schema id
brief:                  |
                        A person who knows a register schema sch_reg_*
                        finds its entry schema by swapping reg for
                        regentry, so a schema to read or change is
                        found without searching.
description:            |
                        Pairs sch_reg_* and sch_regentry_* with the
                        same tail exist for concept, concern,
                        protective_mark, relation and
                        writing_style_rule (_data/schema/ at 89c74d8).
                        The rule is written down in
                        _data/register/reg_concept.yaml lines 131-137.
                        The saving recurs on each lookup and grows
                        with the number of registers.

