title:                  Bare entry now admitted, and term ratings now read by checks
brief:                  |
                        The old annotation says that bare "entry" is
                        deprecated and that no tool reads deprecated
                        terms. Now entry is an admitted term for a
                        register entry, and several checks read the
                        rating of each term.
description:            |
                        concept_register_entry lists entry under
                        term_admitted (_data/register/reg_concept.yaml
                        lines 160-167), and
                        opt_spelled_generic_abbreviated_specific
                        records that the part on entry was reversed on
                        2026-10-20. The extractor maps term_preferred,
                        term_admitted and term_deprecated to a rating
                        in designation facts
                        (src/cc_public/graph/extract.py lines 75-78).
                        term_sense leaves out deprecated terms
                        (src/cc_public/check/check.lp lines
                        1830-1836), term_rated_twice compares ratings
                        (lines 1883-1889), and term_to_link leaves out
                        deprecated terms too
                        (src/cc_public/check/advise.lp lines 219-225).
                        No check reports a deprecated term written in
                        prose or in a name. Found in the review of
                        2026-10-22.

