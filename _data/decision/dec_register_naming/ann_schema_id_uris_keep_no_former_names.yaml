title:                  Schema ids as URIs with no former names kept
brief:                  |
                        Each schema $id embeds its file name and no
                        schema records a former $id, so any further
                        rename would silently break a partner that
                        resolves by $id. The chosen names need to be
                        final, and "for now" suggests they may not be.
description:            |
                        232f001 changes the general entry $id from
                        .../sch_entry.yaml to
                        .../sch_register_entry.yaml; ae6eeff renames
                        the type entry schema and its $id to
                        .../sch_regentry_type.yaml (git show -M). The
                        $id embeds the file name
                        (_data/schema/sch_regentry_type.yaml line 2).
                        The checker resolves references by $id
                        (src/cc_public/check/schema.py lines 145-155).
                        No schema carries an alias field. Owner:
                        "Let's keep bare 'entry' deprecated for now"
                        (2026-10-13T15:49:29Z). ASSUMPTION: the $id
                        URIs are not yet served; the check was refused
                        by the network proxy on 2026-10-15. The point
                        bears equally on every alternative.

