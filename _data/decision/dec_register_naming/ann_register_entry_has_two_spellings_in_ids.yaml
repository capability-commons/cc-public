title:                  Two spellings of register entry to learn
brief:                  |
                        The chosen names spell one concept as regentry
                        in some ids and register_entry in others, with
                        entry deprecated, where one spelling
                        everywhere asks nothing extra of a new reader.
description:            |
                        concept_register_entry has preferred term
                        "register entry", admitted term "regentry" and
                        deprecated term "entry"
                        (_data/register/reg_concept.yaml lines
                        118-144). The maintainer calls regentry "a
                        neologism and a piece of jargon" (2026-10-13).
                        Commit dc5f35f renames entry_key and
                        misplaced_entry to avoid the deprecated form.
                        The cost is learned once.

