title:                  Rename made before any partner held a reference
brief:                  |
                        The names changed in the first two real
                        commits, when no outside system held a
                        reference to a schema id, so the change broke
                        nothing outside.
description:            |
                        232f001 (2026-10-13 14:45 UTC) is the first
                        commit after placeholder bb8c338, and ae6eeff
                        (16:58 UTC) follows it (git log
                        pre_squash_20261014). ASSUMPTION: no partner
                        held a reference to a cc-public schema $id on
                        2026-10-13; nothing in the repository or the
                        owner's messages names one. This does not
                        carry over to a later rename.

