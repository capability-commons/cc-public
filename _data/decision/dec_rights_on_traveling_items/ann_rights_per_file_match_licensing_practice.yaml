title:                  Rights per file as in licensing practice
brief:                  |
                        Each standalone item is one file, except
                        function items, which share their module's
                        file. So the chosen rule puts rights on files,
                        as open-source licensing practice does.
description:            |
                        Registers and schemas hold one standalone item
                        per file with rights at the top
                        (_data/register/reg_concept.yaml).
                        src/cctool/check/check.py holds a module item
                        and six function items, each with its own
                        rights (one is at lines 98-126). The license
                        is an SPDX expression
                        (_data/schema/sch_trait_rights.yaml at
                        properties.license). REUSE asks that each
                        covered file have licensing information
                        (https://reuse.software/spec-3.3/). The YAML
                        keys are not the REUSE SPDX tags, so the REUSE
                        tool does not read them. The point is weaker
                        now that items share a file.

