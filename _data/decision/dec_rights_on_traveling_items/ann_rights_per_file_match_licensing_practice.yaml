title:                  Rights per file as in licensing practice
brief:                  |
                        Each standalone item is one file today, so the
                        chosen rule puts rights on files, as common
                        open-source licensing practice does.
description:            |
                        Registers and schemas hold one standalone item
                        per file with rights at the top
                        (_data/register/reg_concept.yaml lines 1-10).
                        The license is an SPDX expression
                        (_data/schema/sch_trait_rights.yaml lines
                        129-150). The REUSE spec says "Each Covered
                        File MUST have Licensing Information
                        associated with it"
                        (https://reuse.software/spec-3.3/). The YAML
                        keys are not the REUSE SPDX tags, so the REUSE
                        tool does not read them as they stand. The
                        point weakens if several standalone items ever
                        share one file.

