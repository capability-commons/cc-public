title:                  Single entry used apart from its register
brief:                  |
                        An edge or a partner can name one embedded
                        entry by its guid, and that entry carries no
                        rights, so a user of it apart from its
                        register must look up the container. Nothing
                        does that lookup today.
description:            |
                        An edge target may be an embedded item
                        (_data/schema/sch_trait_edge.yaml lines
                        130-137). Partners may hold their own
                        registers (_data/register/reg_concept.yaml
                        lines 29-31;
                        _data/register/reg_protective_mark.yaml lines
                        45-50). The holder is extracted, but no
                        extracted relation holds rights
                        (src/cc_public/graph/extract.py lines
                        118-159). ASSUMPTION: partners will sometimes
                        copy or query single entries.

