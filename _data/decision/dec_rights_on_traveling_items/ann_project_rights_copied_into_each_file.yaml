title:                  Project rights copied into each file
brief:                  |
                        Embedded items inherit rights, but each new
                        standalone item gets the project's rights
                        copied in, so the same rights text now sits in
                        over fifteen hundred files. Two mechanisms do
                        one job.
description:            |
                        src/cctool/edit/edit.py lines 102-105, 470-485
                        and 1204-1215 copy rights from file_pyproject.
                        1535 YAML files and all 96 source items carry
                        "Copyright 2026 William Payne" (grep). Neither
                        recorded alternative removes the copying; the
                        point bears on a third option, inheriting from
                        the project as well.

