title:                  Rights change on a move between registers
brief:                  |
                        An entry moved to another register would take
                        that register's rights without any field of
                        the entry changing.
description:            |
                        An entry is covered by the rights of its
                        holder (_data/schema/sch_register_entry.yaml
                        at description). No cctool command moves an
                        entry between registers
                        (src/cctool/cli/editing.py at 89c74d8).
                        ASSUMPTION: entries may come to move between
                        registers with different rights.

