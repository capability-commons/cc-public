title:                  Conflicting rights of entry and register
brief:                  |
                        With rights on every item, an entry and its
                        register could name different rights for the
                        same file, and a rule would be needed to say
                        which governs.
description:            |
                        No such rule is written in the repository at
                        89c74d8. ASSUMPTION: the rule would be needed;
                        it is not designed or tested.

