title:                  Commit items outside the containment forest
brief:                  |
                        A commit item is neither standalone nor held
                        by another item, and takes its rights from the
                        many files it changes, so the rule as stated
                        does not cover it.
description:            |
                        _data/schema/sch_commit.yaml lines 28-31 and
                        40-43: composes identity, descriptive and
                        relation, not sch_standalone or
                        sch_trait_rights, and is held in the git
                        commit message. Added in 0d2e23a on 2026-10-14
                        (memory/MEMORY.md line 40), after the owner's
                        reason was given. The schema note says what a
                        commit records takes its rights from the files
                        it changes (lines 28-31).

