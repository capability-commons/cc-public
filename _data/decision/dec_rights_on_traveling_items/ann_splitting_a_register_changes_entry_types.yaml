title:                  Register split as a type change
brief:                  |
                        Whether an item may travel alone is fixed by
                        its type, so splitting a register into one
                        file per entry would need a schema change to
                        give entries rights, not just a file move.
description:            |
                        Composing sch_standalone marks a type as
                        standalone (_data/schema/sch_standalone.yaml
                        lines 25-27). The largest register is
                        reg_concept, 2084 lines with 63 entries. The
                        maintainer has restructured storage when it
                        grew (commit 1ba2895), but that moved
                        standalone items. cctool rename moves the file
                        of a standalone item and renames an entry in
                        place (AGENTS.md lines 124-128). No split is
                        planned. ASSUMPTION: linear growth, about
                        21,000 lines at tenfold.

