title:                  Rights attach to what travels
brief:                  |
                        An embedded item always travels with its
                        container and inherits its rights from it, so
                        rights belong on the standalone items that
                        travel on their own.
description:            |
                        Paraphrase of the session summary Will posted
                        at W 2026-10-09T17:52:14Z, from the "Relation
                        graph applications" session (will-messages.md
                        line 53), which reads: "Rights ... attach to
                        what travels, so embedded items carry none."
                        Will introduced the text as a summary from
                        that session, so it may be assistant-written;
                        he posted it as settled. The same message says
                        "travel is what standalone means" (line 63).
                        Stated in schema prose in
                        _data/schema/sch_standalone.yaml lines 21-23,
                        added in bb8c338.

