title:                  Engine called the dataflow engine
brief:                  |
                        The engine that runs dataflow graphs is called
                        the dataflow engine, the clear winner of the
                        deliberation. If it ever needs a brand, it is
                        the Capability Commons Dataflow Engine.
                        Determined by William Payne (2026-10-20).

