title:                  One engine for both execution levels
brief:                  |
                        The successor design builds frozen and dynamic
                        subgraphs from one component source, and loads
                        frozen islands as nodes inside dynamic graphs.
                        Two engine names put a naming boundary through
                        one engine, so a mixed system has no name of
                        its own, and notes and exchanged
                        configurations may have to say which name
                        applies.
description:            |
                        Sources: frozen, dynamic and mixed-language
                        use cases "have to work from the same
                        component source", and "A component is written
                        once" (axair-orchestrator
                        docs/execution_levels.md lines 5-17). "A
                        dynamic graph can then load a whole optimised
                        island as one node. This is the main way the
                        two levels meet" (same file, lines 74-80;
                        decided 2026-10-16). The design calls the
                        levels frozen and dynamic (lines 7-9). The
                        Stableflow requirements already include
                        dynamic reconfiguration: "SHALL support
                        dynamic reconfiguration of systems of interest
                        when permitted by the chosen execution
                        semantics" (pl/stableflow/requirements.rst
                        lines 290-292). sch_system_configuration has
                        one set of sections and no frozen/dynamic
                        split, which shows only that none exists yet.
                        Owner's statement (2026-10-20T12:10:42Z):
                        Stableflow was meant for the non-dynamic
                        version and Dynaflow for the dynamic one.

