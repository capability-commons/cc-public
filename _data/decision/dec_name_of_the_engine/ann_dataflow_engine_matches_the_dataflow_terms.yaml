title:                  Engine name in the family of the dataflow terms
brief:                  |
                        The repository already defines dataflow node,
                        dataflow edge and a dataflow graph as a
                        dataflow graph. "Dataflow engine" is the same
                        family of words, so a reader, a reviewer or a
                        partner understands it without learning a
                        further term.
description:            |
                        Sources: concept_dataflow_node and
                        concept_dataflow_edge have the preferred terms
                        "dataflow node" and "dataflow edge", and
                        concept_dataflow_graph describes a system "as
                        a dataflow graph"
                        (_data/register/reg_concept.yaml).
                        sch_dataflow_graph names its sections
                        dataflow_node and dataflow_edge. At 09cbf25,
                        "dataflow" appears in 22 files, among them
                        check.lp (17 lines), derive.lp (6) and
                        extract.py (23) (git grep -i -c dataflow). The
                        Stableflow README calls a Stableflow system "a
                        distributed data flow graph" (Design Factory,
                        pl/stableflow/README.rst line 239). Names and
                        prose use the preferred term of a concept
                        (AGENTS.md). Maintainer's statement
                        (2026-10-20T12:23:14Z): "most have been
                        exposed to Dataflow", and he leans to "an
                        anodyne and utilitarian "Dataflow engine"".

