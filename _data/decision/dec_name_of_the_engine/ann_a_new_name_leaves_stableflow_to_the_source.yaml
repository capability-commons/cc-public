title:                  New name that leaves Stableflow to the source
brief:                  |
                        Dynaflow appears nowhere in cc-public or its
                        sources, so naming the port Dynaflow leaves
                        the Stableflow prose meaning only the Design
                        Factory original. The dataflow engine has the
                        same advantage, so this does not separate
                        those two.
description:            |
                        Sources: git grep -i dynaflow and git log
                        --all -i --grep=dynaflow find nothing at
                        09cbf25; grep -rni dynaflow finds nothing in
                        the Stableflow and axair-orchestrator designs.
                        The ten prose lines that say Stableflow all
                        name the source
                        (ann_stableflow_already_names_the_source). The
                        source designs themselves would still use
                        Stableflow for both the original and the
                        native port (axair-orchestrator
                        docs/component_interface.md line 1).

