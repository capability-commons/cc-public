title:                  Stableflow signal values kept by the native design
brief:                  |
                        The native design introduces an sf_ prefix,
                        short for Stableflow, and keeps the signal
                        values of pl.stableflow.signal. Under another
                        name, sf_ would be a leftover abbreviation in
                        the code. The point is weak: it bears on code
                        names, not the vocabulary.
description:            |
                        Sources: "typedef int32_t sf_signal; // same
                        values as pl.stableflow.signal"
                        (axair-orchestrator
                        docs/component_interface.md line 30). Python
                        Stableflow components give their dataflow step
                        a different signature (same file, lines 10 and
                        90), so only the signal values carry over.
                        Only the maintainer uses Stableflow
                        (maintainer's statement,
                        2026-10-20T12:10:42Z).

