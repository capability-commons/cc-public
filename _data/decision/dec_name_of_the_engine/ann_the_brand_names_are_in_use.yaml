title:                  Brand names already in use by others
brief:                  |
                        Dynaflow already names packages on PyPI and
                        npm, a finite element program, an engineering
                        software company and a paper on dynamic
                        workflow, and Dynflow names a Ruby workflow
                        gem. Stableflow has fewer uses. A partner
                        could confuse ours with one of these, and the
                        package names are taken if the engine is ever
                        published.
description:            |
                        Sources, checked 2026-10-20: PyPI dynaflow,
                        "AWS Dynamodb backend tracking store for
                        MLFlow" (https://pypi.org/pypi/dynaflow/json);
                        npm dynaflow, "DynamoDB abstraction using
                        rivers", first published 2018-04-25
                        (https://registry.npmjs.org/dynaflow);
                        Dynaflow(TM), a finite element analysis
                        program by Jean H. Prevost at Princeton
                        (https://prevost.blogs.princeton.edu/dynaflow/dynaflow-history/);
                        Dynaflow Research Group, whose BOSfluids
                        software Intergraph resells
                        (worldpipelines.com, 2016-04-19); "DynaFlow:
                        Agent-based Dynamic Workflow Management for
                        P2P Environments", ICEIS 2007; Ruby gem
                        dynflow, a workflow and orchestration engine
                        (https://rubygems.org/gems/dynflow).
                        Stableflow: StableFlow, a software development
                        company in Kharkiv founded in 2009
                        (https://www.g2.com/sellers/stableflow), and
                        "Stable Flow: Vital Layers for Training-Free
                        Image Editing", CVPR 2025; no stableflow
                        package on PyPI. These show names in use, not
                        a trademark or any legal bar. "Nobody but me
                        uses them" (owner's statement,
                        2026-10-20T12:10:42Z) holds for this engine,
                        not for the names.

