title:                  Engine called Dynaflow
brief:                  |
                        Call the engine and its model Dynaflow, on its
                        own, since the engine is to have the
                        dynamic-graph capabilities that were put off
                        in the first iteration.
description:            |
                        Source: owner's statement
                        (2026-10-20T15:07:59Z), "since this engine is
                        intended to incorporate the dynamic-graph
                        capabilities I'd postponed in the past
                        (because they were too difficult for me to
                        implement in the first iteration as a solo
                        dev) - one of the naming options should be
                        "Dynaflow" on it's own."

