title:                  Names checkable against the segment that holds them
brief:                  |
                        The check already refuses an entry that
                        repeats another's id, but it cannot refuse a
                        new id that only looks as if another segment
                        added it. With a stem in every name, a check
                        can compare the stem with the segment the file
                        was read from, so a peer cannot pass its
                        entries off as another's. The two other
                        options leave the origin of a name to the file
                        path alone.
description:            |
                        Sources:
                        - Measured 2026-10-26 in a scratch copy: a
                          peer register that repeats
                          member_william_payne with its id and guid
                          fails repeated_item and
                          misplaced_register_entry under cctool check
                          run on the peer.
                        - duplicate_id and duplicate_guid compare only
                          ids and guids, not the segment that holds an
                          item (src/cctool/check/check.lp within
                          duplicate_id and duplicate_guid).
                        - The union keys each consumed document under
                          a folder named for its segment
                          (src/cctool/graph/extract.py within
                          DIR_CONSUMED; src/cctool/check/segment.py,
                          module docstring at description).
                        - The stem option's terms are cited in
                          ann_reserved_names_add_a_record_and_rule.
                        - The register naming option of qualified ids
                          states a like check for register ids
                          (_data/decision/dec_naming_of_a_peer_register/opt_register_id_qualified_by_its_segment.yaml
                          at brief).
                        - ASSUMPTION: the stem option comes with a
                          check that a name's stem is that of the
                          segment holding it; the option text does not
                          say so. Strength: weak while every peer is
                          WTP's own; moderate at ten times the size
                          with partners. It weighs against the
                          disclosure cost of reserving stems in
                          public, unless stems are opaque.

