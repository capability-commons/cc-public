title:                  Sibling entry ids merged in a shared graph
brief:                  |
                        Reserved prefixes stop two peers choosing one
                        type prefix, but not two peers adding one
                        entry id, such as the concept prefix with
                        patrol_route after it, to a consumed type. No
                        check of cctool can see such a clash today,
                        since a peer check reads only one consumed
                        tree, and the graph view names each item by
                        its id alone, so a store that loads both peers
                        joins the two entries into one node. A segment
                        stem in every added id removes the clash at
                        its source.
description:            |
                        Sources:
                        - Under reserved prefixes, the ids of other
                          entries a peer adds stay unique only across
                          the peer and what it consumes
                          (_data/decision/dec_uniqueness_of_names_across_segments/opt_prefixes_reserved_in_cc_public.yaml
                          at brief).
                        - Under the first option, a clash between two
                          peers is found only when a third segment
                          consumes both
                          (_data/decision/dec_uniqueness_of_names_across_segments/opt_names_unique_across_what_a_segment_consumes.yaml
                          at brief).
                        - The trees a segment may consume are the one
                          cctool package that is running, either its
                          installed release or its checkout
                          (src/cctool/check/segment.py within trees).
                        - The graph view names each item cc:ID under
                          one namespace, with no part for its segment
                          (src/cctool/graph/sparql.py within NS_ITEM
                          and store).
                        - Read 2026-10-26: the fixture peer built in
                          the container for the federation
                          measurements adds an entry of type_concept
                          whose id is the concept prefix with
                          patrol_route after it. The fixture is not
                          part of cc-public.
                        - A graph database segment is planned (owner's
                          statement, 2026-10-24).
                        - ASSUMPTION: a partner or a graph database
                          will load two peers that do not consume each
                          other into one store. Strength: weak with
                          one peer; strong at ten times the peers,
                          since entry ids are far more numerous than
                          type prefixes and the clash surfaces in a
                          partner's store rather than in a check.

