title:                  Upstream reservation before each new peer type
brief:                  |
                        If every prefix must be reserved in cc-public
                        before use, a partner cannot use a new type
                        until cc-public has accepted the entry and the
                        partner has taken up the release that carries
                        it. That is one upstream round trip per type,
                        for every peer in every environment. A stem is
                        reserved once per segment, and unique names
                        across what a segment consumes need no
                        upstream step at all.
description:            |
                        Sources:
                        - Under reserved prefixes, a peer reserves
                          each prefix of a type of its own with an
                          entry in a register of cc-public before it
                          uses it
                          (_data/decision/dec_uniqueness_of_names_across_segments/opt_prefixes_reserved_in_cc_public.yaml
                          at brief).
                        - Peers bring in cc-public as a versioned
                          package
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml
                          at brief).
                        - A segment item names the release it consumes
                          by an edge, and the check compares that edge
                          with the release the consumed tree holds
                          (_data/decision/dec_how_a_segment_declares_itself/ruling_segment_item_records_the_release.yaml
                          at brief).
                        - A peer holds registers of its own for any
                          types it needs, read beside those of the
                          segments it consumes
                          (_data/decision/dec_how_peers_add_vocabulary/ruling_peer_holds_registers_of_its_own.yaml
                          at brief).
                        - The stem option and the owner's statements
                          on private peers and partners are cited in
                          ann_reserved_names_add_a_record_and_rule and
                          ann_reserved_names_disclose_private_segments.
                        - ASSUMPTION: a partner other than WTP cannot
                          count on cc-public accepting a reservation,
                          or on its timing. Strength: weak while every
                          peer is WTP's own; moderate to strong at ten
                          times the partners, since each new type of
                          each partner waits on a cc-public release.

