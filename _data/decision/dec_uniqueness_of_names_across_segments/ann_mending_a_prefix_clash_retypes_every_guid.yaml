title:                  Late prefix clash mended by changing every guid of a type
brief:                  |
                        A clash of type prefixes found only when a
                        third segment reads two peers is mended by
                        renaming one prefix. Every id and guid of that
                        type then changes prefix, which the commit
                        check refuses and the rename maps cannot
                        carry, since they key a rename by the guid. A
                        clash of other entry ids is an ordinary
                        rename, so the cost falls on prefixes.
                        Preventing the clash when the prefix is chosen
                        avoids the repair.
description:            |
                        Sources:
                        - Under this option two peers may clash and
                          the clash is mended in the segment that
                          consumes both, by a rename in one of them
                          (_data/decision/dec_uniqueness_of_names_across_segments/opt_names_unique_across_what_a_segment_consumes.yaml
                          at brief).
                        - A prefix holds no underscore, and every id
                          of a type starts with its prefix
                          (src/cctool/graph/derive.lp within
                          prefix_of; src/cctool/graph/prefix.py within
                          stem).
                        - Every guid is the prefix of its id and 32
                          hex digits (src/cctool/check/check.lp within
                          bad_guid).
                        - Digits of a guid that reappear under another
                          prefix after a commit are reported, with no
                          exception for a renamed prefix
                          (src/cctool/commit/change.lp within
                          retyped_guid).
                        - Rename maps hold an old id, a new id and the
                          guid
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          at brief).
                        - ASSUMPTION: the segment that finds the clash
                          is often not the one that holds the type, so
                          the repair lands in a repository other than
                          the one where the clash is seen. Strength:
                          weak with one peer; strong at ten times the
                          peers, since the pairs that can clash grow
                          with the square of their number, as argued
                          in
                          ann_prefixes_of_sibling_peers_can_collide.

