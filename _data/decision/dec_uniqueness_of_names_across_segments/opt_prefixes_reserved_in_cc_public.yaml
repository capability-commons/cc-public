title:                  Prefixes reserved in cc-public
brief:                  |
                        A peer reserves each prefix of a type of its
                        own with an entry in a register of cc-public
                        before it uses it, so that no two segments
                        that consume cc-public can choose the same
                        prefix. The ids of other entries a peer adds
                        stay unique only across the peer and what it
                        consumes.

