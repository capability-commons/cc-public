title:                  A segment stem in every name a peer adds
brief:                  |
                        Each segment item declares a short stem,
                        unique among the segments that consume
                        cc-public and reserved there. Every prefix of
                        a type a peer defines, and every id of an
                        entry it adds to a consumed type, carries that
                        stem after the prefix, such as the concept
                        prefix, then patrol, then route, for a stem of
                        patrol. A clash can then arise only between
                        stems.

