title:                  Names unique across what a segment consumes
brief:                  |
                        Each prefix and id need be unique only across
                        a segment and what it consumes, as already
                        ruled; a clash between two peers that do not
                        consume each other is found when a third
                        segment consumes both, and is mended there.
                        Ruled by WTP on 2026-10-28.

