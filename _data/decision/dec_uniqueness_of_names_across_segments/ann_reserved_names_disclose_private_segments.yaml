title:                  Disclosure of private segments by reserved names
brief:                  |
                        Reserving a prefix or a stem in cc-public
                        writes the existence of a private segment, and
                        a name that hints at what it holds, into a
                        public register. That register ships in the
                        wheel, and a published wheel cannot be
                        recalled. Names unique only across what a
                        segment consumes leave a private peer's names
                        in the private tree, and a clash is found only
                        by a segment already trusted to read both
                        peers.
description:            |
                        Sources:
                        - The reservation and stem options' own terms
                          are cited in
                          ann_prefix_reservation_ties_partners_to_releases
                          and
                          ann_reserved_names_add_a_record_and_rule;
                          where a clash is found is cited in
                          ann_sibling_ids_merge_into_one_node_in_a_graph.
                        - The wheel carries the data items of the tree
                          under cctool/_data (pyproject.toml at
                          tool.hatch.build.targets.wheel.force-include).
                        - Once a package is published, every peer and
                          the package host keep a copy that WTP cannot
                          withdraw
                          (_data/decision/dec_how_peers_get_cc_public/ann_published_package_cannot_be_recalled.yaml
                          at brief).
                        - The first peer, cc-patrol, is private and
                          local to WTP's machine, with no remote
                          (owner's statement, 2026-10-21); partners'
                          segments are expected (owner's statements,
                          2026-10-24).
                        - The protective mark register allows that the
                          existence of a mark can itself be protected
                          (_data/register/reg_protective_mark.yaml at
                          note).
                        - ASSUMPTION: a prefix or stem such as patrol
                          tells a reader something about what a
                          private segment holds, and a partner may not
                          want its segment's existence public.
                          Strength: moderate today, with one private
                          peer of WTP's own; strong at ten times the
                          size with partners. It weakens if reserved
                          names are opaque, which neither option
                          requires.

