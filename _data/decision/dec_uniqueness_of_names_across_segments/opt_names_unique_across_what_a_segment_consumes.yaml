title:                  Names unique across what a segment consumes
brief:                  |
                        Each prefix and id need be unique only across
                        a segment and what it consumes, as ruled. Two
                        peers that do not consume each other may
                        clash, and the clash is found when a third
                        segment consumes both, and is mended there by
                        a rename in one of them.

