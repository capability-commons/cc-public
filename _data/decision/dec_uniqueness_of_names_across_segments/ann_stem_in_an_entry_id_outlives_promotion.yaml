title:                  Segment stem left in an id after promotion
brief:                  |
                        Under stems, every entry a peer adds to a
                        consumed type carries the peer's stem in its
                        id. When the entry moves into cc-public, as
                        ruled, it either keeps the stem of a segment
                        that no longer holds it, or is renamed in
                        cc-public and in every segment that names it.
                        A promoted peer type is worse: its stem sits
                        in the prefix, so every guid of the type
                        changes.
description:            |
                        Sources:
                        - An entry moves into cc-public when a second
                          segment needs it
                          (_data/decision/dec_how_peers_add_vocabulary/ruling_peer_holds_registers_of_its_own.yaml
                          at brief).
                        - The stem option's terms are cited in
                          ann_reserved_names_add_a_record_and_rule,
                          and the commit check on a retyped guid in
                          ann_mending_a_prefix_clash_retypes_every_guid.
                        - Rename maps let peers absorb a renamed id
                          when the guid is kept
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          at brief). Strength: moderate for entries,
                          which a rename map can carry; strong for
                          promoted types. It grows at ten times the
                          size with the number of promotions.

