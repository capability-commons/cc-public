title:                  How a requirement names a dataflow edge
brief:                  |
                        A requirement may forbid one dataflow edge to
                        lose data. How does a requirement, or a
                        ruling, name one edge?
description:            |
                        rqt_checks_data_loss checks a dataflow edge
                        that a requirement forbids to lose any.
                        ruling_edge_identified_by_its_ends gives an
                        edge no id or guid, on the assumption recorded
                        in ann_edge_id_as_a_link_target that no
                        requirement or ruling targets a single
                        connection; rqt_checks_data_loss now needs
                        one. No relation lets a requirement name the
                        pair of ends (review of 2026-10-29, CC-059).

