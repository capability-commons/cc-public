title:                  Ends held in a requirement that must change with each rewire
brief:                  |
                        An end names a node and a port, and the port
                        is a member of the interface the node
                        presents, so a new version of that interface,
                        which is a new interface control document with
                        members of its own, changes the ends of every
                        edge at its ports. A requirement that holds
                        those ends must then be edited with the graph,
                        and so must one whose edge a later base splits
                        or rewires. A tag carried by the edge, or an
                        id on the edge, leaves the requirement as
                        written, so the change stays in the graph. A
                        plain rename is not the problem, since cctool
                        rename rewrites every YAML document that names
                        the id.
description:            |
                        Sources:
                        - An end names the node and one of the ports
                          of the interface that
                          node presents, by id and guid.
                          (_data/schema/sch_dataflow_graph.yaml at description and
                          $defs.end)
                        - The port at an end is named by the id of a
                          member of the
                          interface, as the value port of icd_printer is in the smoketest
                          graph. (_data/dataflow_graph/dfg_stableflow_smoketest.yaml at
                          dataflow_edge)
                        - A new version of an interface is a new
                          interface control
                          document that supersedes the last.
                          (_data/register/reg_relation.yaml at
                          entries.relation_supersedes.description)
                        - If an edge is its ends, an operation that
                          rewires one end makes a
                          different edge, and insert-on-edge replaces one edge with two.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_rewired_edge_loses_its_trace_under_ends.yaml
                          at brief)
                        - cctool rename changes every YAML document
                          that names the id.
                          (AGENTS.md, on renaming an id)
                        - One maintainability question asks how far a
                          change in one part
                          spreads to others. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question)
                        ASSUMPTION: a no-loss requirement states a
                        need on a stream, such as camera frames
                        reaching the recorder, which outlives a change
                        of node version. Strength: moderate; it grows
                        with interface versions and rewires, and is
                        void for a graph that never changes.

