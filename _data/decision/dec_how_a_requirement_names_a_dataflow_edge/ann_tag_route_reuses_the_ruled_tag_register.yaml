title:                  Tag route that adds nothing beyond the ruled tag register
brief:                  |
                        Dataflow tags are ruled to come from a
                        register whose entries record what each tag
                        means by a link to the requirement or other
                        item it stands for, and edges in the Patrol
                        drafts already carry tags, so reaching a
                        no-loss requirement through a tag needs only
                        the link that register already calls for, and
                        no identity for edges. An id and guid on each
                        edge would add an embedded item type, a naming
                        rule and stable minting for generated edges,
                        and a second key beside the pair of ends that
                        the edge-identity and merge-key rulings made
                        the key. Ends held in the requirement add
                        fields to the closed requirement schema for
                        one kind of requirement: a graph and two ends,
                        each end a node and a port with their guids.
description:            |
                        Sources:
                        - Dataflow tags come from a register whose
                          entries record what each
                          tag means, by a link to the logical component, decision,
                          requirement or interface control document it stands for.
                          (_data/decision/dec_feature_model_or_explicit_family/ruling_registered_dataflow_tags_with_constraints.yaml
                          at brief; _data/register/reg_concept.yaml at
                          entries.concept_dataflow_tag.description)
                        - 5 of the 41 edges of the Patrol base carry a
                          presence tag.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_rewired_edge_loses_its_trace_under_ends.yaml
                          at description)
                        - A dataflow edge is identified by its two
                          ends, and the pair of
                          ends is the merge key for edges.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml
                          at brief)
                        - Edges generated from a table would need
                          their guids kept in the
                          table, and edges made during resolution would need guids from a
                          fixed rule.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_edge_guids_minted_stably_by_generators.yaml
                          at brief)
                        - An end requires the id and guid of its node
                          and of its port, and
                          the requirement schema admits no field it does not declare.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.end;
                          _data/schema/sch_requirement.yaml at unevaluatedProperties)
                        - The reviewer recommends the tag route
                          because it needs no change
                          to edge identity. (review of 2026-10-29, section 7, W-R5)
                        Strength: strong on the count of mechanisms;
                        it weakens if the tag register, ruled but not
                        yet built, is never built, and no relation by
                        which an entry names what it stands for is
                        registered yet.

