title:                  Ends that SSP keeps where edge ids are lost
brief:                  |
                        SSP names a connection by its two ends and
                        lists no key, while DIF gives each edge an id
                        of its own but joins it node to node, so the
                        port at each end is lost, and lets a graph
                        carry attributes of the user's choosing. A
                        requirement that holds an edge's ends finds
                        the edge again after a round trip through SSP,
                        where an id must be invented on import and is
                        lost on export; through DIF an id survives
                        while the ports of the ends do not, and a tag
                        survives only where a format has a free
                        attribute to carry it. Compatibility with SSP
                        therefore leans toward naming the ends and
                        against an edge id, while DIF leans the other
                        way until its edges name ports.
description:            |
                        Sources:
                        - An SSP connection names its start and end
                          element and connector,
                          and its attribute table lists no key.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_partner_formats_name_connections_by_ends.yaml
                          at description)
                        - In DIF, nodes and edges carry unique ids,
                          edges are specified by
                          their source and sink node identifiers, and graphs carry
                          user-defined attributes. (Hsu et al. 2004, DIF: an interchange
                          format for dataflow-based design tools, sections 2 and 2.1, as
                          summarized in
                          /mnt/project-files/notes/literature/part-2/2004-dif-dataflow-interchange-format.md)
                        - DIF joins edges node to node, which loses
                          which port of a
                          multi-port node an edge meets. (same note, on item 9)
                        ASSUMPTION: no partner exchange is planned
                        yet, and an SSP file from a partner tool
                        carries no tag on a connection. Strength:
                        weak; it counts only if an SSP or DIF exchange
                        is built, and the two formats pull opposite
                        ways, so the lean holds only for SSP until
                        DIF's node-to-node edges gain port names.

