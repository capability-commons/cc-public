title:                  Trace from an edge to its requirement through a tag entry
brief:                  |
                        Under the ruled register the link runs from a
                        tag's entry to the requirement it stands for,
                        so an edge that carries the tag traces to the
                        reason it must lose nothing, as a node traces
                        to the interface it realizes. Holding ends in
                        the requirement turns the trace around and
                        puts design detail in the statement of a need,
                        in fields that the graph of items does not
                        hold as edges. The cost of the tag is one step
                        of indirection: the edges that meet a
                        requirement are found by resolving variants,
                        not read off the requirement. The option's
                        wording, that a requirement names the tag,
                        reverses the ruled direction and would need a
                        field or edge on the requirement that the
                        ruled direction does without.
description:            |
                        Sources:
                        - A tag's register entry records what the tag
                          means by an edge to
                          the requirement or other item it stands for.
                          (_data/register/reg_concept.yaml at
                          entries.concept_dataflow_tag.description;
                          _data/decision/dec_feature_model_or_explicit_family/ruling_registered_dataflow_tags_with_constraints.yaml
                          at brief)
                        - A node names the interface it presents with
                          relation_realizes.
                          (_data/schema/sch_dataflow_node.yaml at description)
                        - No relation lets a requirement name a pair
                          of ends. (review of
                          2026-10-29, CC-059)
                        - An edge carries a dataflow tag, and a
                          requirement names the tag,
                          as tags already link to requirements.
                          (_data/decision/dec_how_a_requirement_names_a_dataflow_edge/opt_edge_reached_through_a_dataflow_tag.yaml
                          at brief)
                        - Traceability asks whether each element
                          traces to the reason it
                          exists, and each need to what meets it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_traceability.question)
                        Strength: moderate; the direction is ruled,
                        while finding every edge for one requirement
                        needs a query that resolves variants.

