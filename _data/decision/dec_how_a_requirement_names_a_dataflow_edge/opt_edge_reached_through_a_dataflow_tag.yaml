title:                  Edge reached through a dataflow tag
brief:                  |
                        An edge carries a dataflow tag, and a
                        requirement names the tag, as tags already
                        link to requirements. Every edge with the tag
                        is held to the requirement, and edges keep no
                        identity of their own.

