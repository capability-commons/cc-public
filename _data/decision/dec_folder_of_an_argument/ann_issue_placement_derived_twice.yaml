title:                  Issue placement derived in two places
brief:                  |
                        The issue an item belongs to, and so its
                        folder, is worked out in check.lp and again in
                        edit.py, by different tests. One job is done
                        by two mechanisms that must be kept in step.
description:            |
                        check.lp derives it in decision_of, four
                        clauses over type_of, r_is_option_for,
                        r_is_about and settles
                        (src/cc_public/check/check.lp lines 141-155).
                        edit.py derives it in _folder from the "iss"
                        id prefix, the link names and the folder of a
                        settled option (src/cc_public/edit/edit.py
                        lines 273-297), and says it follows
                        decision_of (lines 115-118). For a
                        determination whose option is not yet in the
                        tree, edit.py falls back to the type folder.
                        Before 1ba2895 both built the path from the
                        type alone. The extra code is small and paid
                        once; decision_of also serves
                        determination_across_decisions. ASSUMPTION: no
                        case where the two disagree has been seen.

