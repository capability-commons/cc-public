title:                  Decision folder that grows only with its deliberation
brief:                  |
                        Every file of one deliberation sits under one
                        path, so a reviewer or an agent can read one
                        deliberation apart from the rest. A type
                        folder grows with the whole graph, while a
                        decision folder grows only with its own
                        deliberation.
description:            |
                        Before 1ba2895, one deliberation spread over
                        _data/annotation/, _data/option/ and
                        _data/ruling/, and _data/annotation/ held 29
                        files for two deliberations (git ls-tree
                        52e3e6d). At 89c74d8 the two decision folders
                        hold 18 and 19 files. misplaced_document keeps
                        every item of a decision in its folder
                        (src/cc_public/check/check.lp lines 169-184),
                        and a ruling may settle the options of one
                        decision only (decisions_mixed_in_ruling). A
                        path limits git diff and git log to one
                        deliberation
                        (https://git-scm.com/docs/git-log). Will plans
                        to review in batches of five (owner's
                        statement, 2026-10-14T23:39:41Z) and expects
                        the project to be driven mainly by agents
                        (owner's statement, 2026-10-14T22:59:35Z). The
                        tooling reads the whole tree by rglob either
                        way (src/cc_public/graph/extract.py line 201),
                        so its run cost is the same under both
                        layouts. ASSUMPTION: one deliberation stays
                        near its present size of about 20 files.
                        ASSUMPTION: an agent gathers a deliberation by
                        listing folders rather than by querying the
                        graph.

