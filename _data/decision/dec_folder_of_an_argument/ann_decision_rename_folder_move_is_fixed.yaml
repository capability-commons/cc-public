title:                  Decision rename now moving its folder
brief:                  |
                        Commit 1b5fc3f "Fix cctool rename so that a
                        decision's folder moves with it" moves every
                        file of the decision's folder to a folder
                        named for the new id. At 360ec14 a decision
                        rename is one command and is not refused as
                        misplaced.
description:            |
                        When the item's file sits in a folder named
                        for it, rename calls _move_folder, which moves
                        each file of that folder
                        (src/cc_public/edit/edit.py lines 762-763,
                        804-821 at 360ec14);
                        test_rename_of_a_decision_moves_its_folder
                        covers it
                        (src/cc_public/edit/_test/test_edit.py line
                        260). The rename still moves every file of the
                        deliberation, so its diff grows with the
                        deliberation.

