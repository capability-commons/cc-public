title:                  One annotation folder for every argument too large
brief:                  |
                        One annotation folder that holds every
                        argument is too large, so each argument gets a
                        folder of its own.
description:            |
                        Owner's statement, 2026-10-14T22:56:42Z: "the
                        annotation directory is beginning to get out
                        of hand." He proposed
                        _data/argument/<id_argument>/ for all data
                        items of one argument, "so we're not lumping
                        every single annotation into one HUGE pile."
                        The folder is named for the decision type, the
                        name he preferred (owner's statement,
                        2026-10-14T22:59:35Z). Commit 1ba2895 message
                        brief, 2026-10-14T23:17Z, restates it: "Will
                        found one annotation folder for every argument
                        too large". At 1ba2895^ the annotation folder
                        held 29 files for two arguments (git ls-tree
                        1ba2895^).

