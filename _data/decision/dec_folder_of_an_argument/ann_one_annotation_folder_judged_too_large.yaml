title:                  One annotation folder for every deliberation too large
brief:                  |
                        One annotation folder that holds every
                        deliberation is too large, so each
                        deliberation gets a folder of its own.
description:            |
                        Maintainer's statement, 2026-10-14T22:56:42Z:
                        "the annotation directory is beginning to get
                        out of hand." He proposed
                        _data/argument/<id_argument>/ for all data
                        items of one deliberation, "so we're not
                        lumping every single annotation into one HUGE
                        pile." The folder was named for the issue
                        type, the name he then preferred (maintainer's
                        statement, 2026-10-14T22:59:35Z); he chose to
                        rename that type decision on 2026-10-20, so
                        the folder is now _data/decision/. Commit
                        1ba2895 message brief, 2026-10-14T23:17Z,
                        restates it: "Will found one annotation folder
                        for every argument too large". At 1ba2895^ the
                        annotation folder held 29 files for two
                        deliberations (git ls-tree 1ba2895^).

