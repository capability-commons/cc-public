title:                  Annotation shared by two decisions refused
brief:                  |
                        A file sits in one folder, so an annotation
                        about two decisions is always reported
                        misplaced for one of them. An argument that
                        bears on two decisions must be written and
                        kept twice.
description:            |
                        relation_is_about allows several edges where
                        an item concerns how two items meet
                        (_data/register/reg_relation.yaml lines
                        160-165). decision_of gives an annotation one
                        fact per decision it is about (check.lp lines
                        148-151), and misplaced_document reports each
                        mismatch (lines 178-183). Tried on a copy of
                        the tree (2026-10-15): a second
                        relation_is_about edge from
                        ann_graphs_will_grow to
                        dec_cross_item_checks_engine gives one
                        misplaced_document failure. Under the type
                        layout every annotation sat in
                        _data/annotation/. ASSUMPTION: some arguments
                        will bear on two decisions; none does today.

