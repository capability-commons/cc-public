title:                  Annotation shared by two decisions refused
brief:                  |
                        A file sits in one folder, so an annotation
                        about two decisions is always reported
                        misplaced for one of them. An argument that
                        bears on two decisions must be written and
                        kept twice.
description:            |
                        relation_is_about allows several edges where
                        an item concerns how two items meet
                        (_data/register/reg_relation.yaml lines
                        177-181). decision_of gives an annotation one
                        fact per decision it is about
                        (src/cc_public/graph/derive.lp lines 139-142),
                        and misplaced_document reports each mismatch
                        (src/cc_public/check/check.lp lines 590-595).
                        argument_across_decisions also fails an
                        annotation that argues an item of another of
                        its decisions (check.lp lines 1378-1384).
                        Tried on a copy of the tree (2026-10-22): a
                        second relation_is_about edge from
                        ann_graphs_will_grow to
                        dec_cross_item_checks_engine gives one
                        misplaced_document failure and three
                        argument_across_decisions failures.
                        argument_across_decisions reads edges, not
                        paths, so it would refuse the same edge under
                        either layout. Under the type layout every
                        annotation sat in _data/annotation/.
                        ASSUMPTION: some arguments will bear on two
                        decisions; none does today.

