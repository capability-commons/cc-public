title:                  Folder that does not bind an annotation's bearing
brief:                  |
                        The decision folder suggests that every
                        annotation bearing on the decision's options
                        is in it, and only those. Only the second is
                        checked, so an annotation outside the folder
                        can still argue its options and count for its
                        drivers, and a reader of the folder does not
                        see it.
description:            |
                        An annotation's folder follows only its
                        relation_is_about edge
                        (src/cctool/graph/derive.lp within
                        decision_of; src/cctool/check/check.lp within
                        misplaced_document). argument_across_decisions
                        fails an annotation of one decision that
                        argues an option of another (check.lp within
                        argument_across_decisions), but it needs a
                        decision on both ends. The driver check counts
                        any annotation that supports or challenges an
                        option for the decision, whatever it is about
                        (check.lp within schema_count and
                        unused_schema). Tried on a copy of the tree
                        (2026-10-22): an annotation in
                        _data/annotation/ about lco_argumentation that
                        supports opt_folder_per_type gives no failure.
                        An annotation not about a decision sits in
                        _data/annotation/
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_annotation.description and
                        entries.type_annotation.usage). The brief of
                        misplaced_document states the aim that
                        everything argued about one decision is kept
                        together (check.lp within misplaced_document).

