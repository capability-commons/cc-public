title:                  Folder that does not bind an annotation's bearing
brief:                  |
                        The decision folder suggests that every
                        annotation bearing on the decision's options
                        is in it, and only those. Neither is checked,
                        so the folder can point a reader to the wrong
                        reason or hide one.
description:            |
                        An annotation's folder follows only its
                        r_is_about edge (check.lp lines 148-151). The
                        driver check counts any annotation that
                        supports or challenges an option for the
                        decision, whatever it is about (check.lp lines
                        423-435). No rule compares the target of
                        r_supports or r_challenges with the
                        annotation's decision (grep of check.lp at
                        89c74d8). An annotation not about a decision
                        sits in _data/annotation/
                        (reg_data_item_type.yaml lines 401-404). The
                        comment at check.lp line 162 states the aim
                        that everything argued about one decision is
                        kept together.

