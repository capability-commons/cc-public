title:                  One placement rule for every type
brief:                  |
                        The type layout places every item by one rule
                        that reads only its type. The issue layout
                        adds a second rule that reads edges, and gives
                        annotations two homes.
description:            |
                        Before 1ba2895, misplaced_document had one
                        clause, expecting _data/ then the type less t_
                        (git show 1ba2895 --
                        src/cc_public/check/check.lp). Now it has two
                        (check.lp lines 169-184). An annotation about
                        an issue goes in the issue's folder, and any
                        other in _data/annotation/
                        (_data/register/reg_data_item_type.yaml lines
                        401-404). Other types keep the type rule.

