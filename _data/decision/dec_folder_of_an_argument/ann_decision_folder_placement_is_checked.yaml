title:                  Decision folder placement checked and tested
brief:                  |
                        The decision layout comes with checks that
                        report a file outside its decision folder and
                        a ruling across two decisions, and cctool new
                        writes into the decision folder. It is
                        enforced, not a convention.
description:            |
                        misplaced_document and
                        decisions_mixed_in_ruling in
                        src/cctool/check/check.lp (commit 1ba2895).
                        Tests: src/cctool/check/_test/test_check.py
                        lines 254, 261 and 276, and
                        src/cctool/edit/_test/test_edit.py line 257.

