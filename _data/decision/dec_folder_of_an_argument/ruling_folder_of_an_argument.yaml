title:                  One folder per decision
brief:                  |
                        Each decision keeps its options, the
                        annotations about it and its ruling in a
                        folder of its own under _data/decision/, so
                        one deliberation can be read, diffed and
                        reviewed apart from the rest. The checks keep
                        each path in step with its edges, and cctool
                        new and rename place the files, so the folder
                        is enforced and cheap to keep. One folder per
                        type grows with the whole graph and was
                        already too large at 29 annotations. Ruled by
                        William Payne on 2026-10-22.

