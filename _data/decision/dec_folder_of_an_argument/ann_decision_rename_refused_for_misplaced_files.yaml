title:                  Decision rename refused by the folder check
brief:                  |
                        cctool rename renames the decision's file but
                        not its folder, so every item of the
                        deliberation is then reported misplaced and
                        the rename is refused. Renaming a decision
                        needs the files moved by hand.
description:            |
                        rename in src/cc_public/edit/edit.py lines
                        722-771 renames a file named for the item in
                        place and moves no folder. Tried on a copy of
                        the tree with dec_tooling_language: "Refused:
                        the edit adds 18 failures", all
                        misplaced_document (2026-10-15).
                        memory/MEMORY.md line 55 notes that a rename
                        of a decision does not move its folder. Under
                        the type layout a decision rename changes one
                        file name and the references to it. The cost
                        grows as decisions are renamed more often.

