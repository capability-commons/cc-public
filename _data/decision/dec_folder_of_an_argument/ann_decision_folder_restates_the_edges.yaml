title:                  Folder that restates the decision edges
brief:                  |
                        Which decision an item belongs to is already
                        in its edges, and the checks read the edges,
                        not the path. The folder records the same fact
                        again and adds no check result and no trace.
description:            |
                        The extractor reads every file by rglob,
                        whatever its folder
                        (src/cc_public/graph/extract.py lines
                        201-205). argued and unargued_driver join on
                        r_is_option_for, with no file path (check.lp
                        lines 423-453). t_decision and r_is_option_for
                        were added in 52e3e6d; options took
                        r_is_option_for and the driver check came to
                        read it in 1ba2895, the same commit as the
                        folder move, and its brief credits the fix to
                        r_is_option_for. The two are separable: the
                        fix reads edges only. The test that two
                        decisions do not count each other's arguments
                        works by edges
                        (src/cc_public/check/_test/test_check.py lines
                        344-355). The second misplaced_document clause
                        exists to keep the path in step with the edges
                        (check.lp lines 178-184).

