title:                  Folder that restates the decision edges
brief:                  |
                        Which decision an item belongs to is already
                        in its edges, and the checks read the edges,
                        not the path. The folder records the same fact
                        again and adds no check result and no trace.
description:            |
                        The extractor reads every file under the root
                        by os.walk, whatever its folder (_files in
                        src/cctool/graph/extract.py within documents
                        and _files). argued and unargued_driver join
                        on relation_is_option_for, with no file path
                        (src/cctool/check/check.lp within
                        schema_count, unused_schema and
                        misnamed_node). type_decision and
                        relation_is_option_for were added in 52e3e6d;
                        options took relation_is_option_for and the
                        driver check came to read it in 1ba2895, the
                        same commit as the folder move, and its brief
                        credits the fix to relation_is_option_for. The
                        two are separable: the fix reads edges only.
                        The test that two decisions do not count each
                        other's arguments works by edges
                        (src/cctool/check/_test/test_check.py within
                        test_a_driver_argued_for_an_alternative_passes).
                        The second misplaced_document clause exists to
                        keep the path in step with the edges (check.lp
                        within misplaced_document).

