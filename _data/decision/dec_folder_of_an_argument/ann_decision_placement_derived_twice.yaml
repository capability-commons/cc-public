title:                  Decision placement derived in two places
brief:                  |
                        The decision an item belongs to, and so its
                        folder, was worked out in check.lp and again
                        in edit.py, by different tests. One job was
                        done by two mechanisms that had to be kept in
                        step.
description:            |
                        check.lp derived it in decision_of, four
                        clauses over has_type, relation_is_option_for,
                        relation_is_about and settles, now in
                        src/cctool/graph/derive.lp within decision_of.
                        When this was argued, edit.py derived it in
                        _folder from the "iss" id prefix of the
                        question type, the link names and the folder
                        of a settled option, and said it followed
                        decision_of. For a ruling whose option was not
                        yet in the tree, edit.py fell back to the type
                        folder. Before 1ba2895 both built the path
                        from the type alone. The extra code is small
                        and paid once; decision_of also serves
                        decisions_mixed_in_ruling and
                        argument_across_decisions. ASSUMPTION: no case
                        where the two disagree has been seen. The
                        point no longer holds: edit.py now writes a
                        new file in the folder of its type and moves
                        it to where misplaced_document says it belongs
                        (NAME_MISPLACED and _place in
                        src/cctool/edit/edit.py within NAME_MISPLACED
                        and _place), so the placement is derived only
                        in decision_of.

