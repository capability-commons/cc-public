title:                  Basis of a ruling in prose only
brief:                  |
                        A ruling does not link to the annotations it
                        rested on, so the arguments it answered can
                        only be recovered from its brief and the
                        repository at its commit.
description:            |
                        sch_ruling adds nothing beyond sch_standalone,
                        sch_trait_edge and a brief
                        (_data/schema/sch_ruling.yaml at description
                        and allOf). Its own edges are relation_upholds
                        and relation_rejects, the only relations whose
                        source must be a ruling
                        (_data/register/reg_relation.yaml at
                        entries.relation_upholds and
                        entries.relation_rejects). relation_supersedes
                        admits only options and interface control
                        documents (lines 275-308).
                        ruling_cross_item_checks_engine names no
                        annotation by edge (lines 21-36).
                        unargued_driver checks the current graph, not
                        the graph at the time
                        (src/cctool/check/check.lp within
                        misnamed_node). ASSUMPTION: walking history
                        per ruling gets harder as history grows; not
                        measured.

