title:                  Basis of a ruling in prose only
brief:                  |
                        A ruling does not link to the annotations it
                        rested on, so the arguments it answered can
                        only be recovered from its brief and the
                        repository at its commit.
description:            |
                        sch_ruling adds nothing beyond sch_standalone,
                        sch_trait_edge and a brief (sch_ruling.yaml
                        lines 18-22, 39-48). Its only edges are
                        r_upholds, r_rejects and r_supersedes
                        (_data/register/reg_relation.yaml lines
                        262-268, 370-371, 397-398).
                        ruling_cross_item_checks_engine names no
                        annotation by edge (lines 12-35).
                        unargued_driver checks the current graph, not
                        the graph at the time (check.lp lines
                        439-454). ASSUMPTION: walking history per
                        ruling gets harder as history grows; not
                        measured.

