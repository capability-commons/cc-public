title:                  Revisable outcomes as conditions change
brief:                  |
                        A decision that was once right can become
                        wrong as conditions change, so the record must
                        let the owner change his mind, as defeasible
                        argumentation allows.
description:            |
                        Owner's statement, 2026-10-14T16:11:18Z. On
                        recording an outcome as a separate item made
                        by someone: "Yes, that does match my thinking"
                        (owner's statement, 2026-10-13T21:39:30Z;
                        memory/lifecycle-and-status.md). The split
                        into a stored act and a computed evaluation is
                        a recorded reason written by an assistant, not
                        by Will (commit 7db4229 message;
                        con_determination in
                        _data/register/reg_concept.yaml lines
                        505-517). Change made in 7db4229 on
                        2026-10-14.

