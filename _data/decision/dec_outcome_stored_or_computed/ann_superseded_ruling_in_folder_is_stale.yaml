title:                  No superseded ruling left in a decision folder
brief:                  |
                        The old annotation says that a superseded
                        ruling stays in the decision folder. Now a
                        decision has at most one ruling, and a change
                        of ruling edits that file in place, so the
                        earlier act is in the history of the file, not
                        in a second ruling.
description:            |
                        The note of type_ruling says "A decision has
                        at most one ruling. A change of ruling edits
                        it in place, and what was ruled before is in
                        the history of its file"
                        (_data/register/reg_data_item_type.yaml lines
                        900-902). ruling_change_of_a_ruling rules the
                        same, and the check competing_rulings reports
                        a second ruling on one decision
                        (src/cctool/check/check.lp lines 1446-1457).
                        relation_supersedes admits only options and
                        interface control documents
                        (_data/register/reg_relation.yaml lines
                        265-297). The rest of the trace holds: upholds
                        and rejects edges name each settled option,
                        and who and when come from the commits
                        (_data/schema/sch_ruling.yaml, note). Found in
                        the review of 2026-10-22.

