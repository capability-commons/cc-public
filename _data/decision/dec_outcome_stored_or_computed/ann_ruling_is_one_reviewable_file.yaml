title:                  A change of outcome as an edit to one file
brief:                  |
                        With a stored ruling, a change of outcome
                        shows up as a small edit to one item that a
                        reviewer can read and judge, and git keeps the
                        earlier text.
description:            |
                        ruling_cross_item_checks_engine is one 36-line
                        file in its decision folder and names the
                        upheld option and both rejected alternatives
                        (_data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml).
                        A change of outcome edits that ruling in
                        place, and git keeps the earlier text, as
                        ruling_change_of_a_ruling settles.

