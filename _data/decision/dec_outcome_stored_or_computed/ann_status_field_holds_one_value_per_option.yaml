title:                  One status value per option
brief:                  |
                        A status gives one value per option, so it
                        cannot settle a set of alternatives in one
                        act, as one ruling does.
description:            |
                        One ruling can uphold one option and reject
                        its alternatives
                        (_data/register/reg_data_item_type.yaml lines
                        898-900). A decision has at most one ruling,
                        and competing_rulings reports a second
                        (src/cctool/check/check.lp lines 1467-1472). A
                        change of ruling edits it in place, so a
                        ruling, like a status edit, keeps the earlier
                        outcome only in git history
                        (ruling_change_of_a_ruling). ASSUMPTION: no
                        status design with history was ever written
                        down.

