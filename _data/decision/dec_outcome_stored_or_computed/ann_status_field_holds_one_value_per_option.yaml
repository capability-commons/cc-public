title:                  One status value per option
brief:                  |
                        A status gives one value per option, so it
                        cannot settle a set of alternatives in one act
                        or keep the earlier outcome when the outcome
                        changes.
description:            |
                        One ruling can uphold one option and reject
                        its alternatives (reg_data_item_type.yaml
                        lines 781-785). A later ruling supersedes the
                        earlier, which stays on record;
                        competing_rulings refuses two current ones
                        (commit 89c74d8; check.lp lines 388-413). A
                        status edit overwrites the value, so the
                        earlier outcome survives only in git history.
                        ASSUMPTION: no status design with history was
                        ever written down.

