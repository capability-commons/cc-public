title:                  Trace from a settled option to an act
brief:                  |
                        A ruling traces each option it settles to one
                        act, with an author and date from its commit
                        and a stated reason in its brief.
description:            |
                        Each settled option is named by an
                        relation_upholds or relation_rejects edge
                        (_data/register/ reg_relation.yaml lines
                        358-404; ruling_cross_item_checks_engine.yaml
                        lines 21-35). A brief is required and who and
                        when come from the commit
                        (_data/schema/sch_ruling.yaml lines 24-25,
                        33-36, 45-46). A superseded ruling stays in
                        the decision folder
                        (_data/register/reg_data_item_type.yaml lines
                        791-796).

