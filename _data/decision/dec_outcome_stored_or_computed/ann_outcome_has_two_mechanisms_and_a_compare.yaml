title:                  Two outcome mechanisms and a comparison
brief:                  |
                        The chosen alternative keeps a stored ruling,
                        a computed evaluation and a comparison between
                        them, which is more to build and keep in step
                        than either other alternative.
description:            |
                        Packet, alternative
                        opt_stored_act_and_computed_evaluation;
                        reg_concept.yaml at
                        entries.concept_ruling.description. The stored
                        half already needs settles
                        (src/cctool/graph/derive.lp within settles)
                        and five checks: src/cctool/check/check.lp
                        within no_option_in_ruling,
                        decisions_mixed_in_ruling, upholds_and_rejects
                        and competing_rulings, and
                        src/cctool/commit/change.lp within
                        unargued_driver. A computed evaluation changes
                        whenever an argument is added
                        (reg_concept.yaml at
                        entries.concept_ruling.description), so on its
                        own it meets the maintainer's wish to change
                        his mind (will-messages.md lines 629-631).

