title:                  Outcome change hidden in a diff
brief:                  |
                        With a computed evaluation only, adding one
                        annotation can change the outcome while no
                        line of the diff says so.
description:            |
                        Under opt_computed_evaluation_only no outcome
                        item exists (packet). Annotations are separate
                        files of 28 to 76 lines each, 21 of them for
                        one decision
                        (_data/decision/dec_cross_item_checks_engine/ann_*.yaml,
                        wc -l). ASSUMPTION: more annotations per
                        decision make an unnoticed change of outcome
                        more likely.

