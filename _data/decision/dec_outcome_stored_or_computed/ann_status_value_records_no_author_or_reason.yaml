title:                  Status with no author or reason
brief:                  |
                        A status value on an option records neither
                        who set it nor why, so an outcome cannot be
                        traced or judged from the graph.
description:            |
                        Commit 44034ef removed the status fields:
                        every value was uniform, nothing read them,
                        and a workable lifecycle needs authority, "a
                        record of who made it and why" and a consumer
                        (commit 44034ef message;
                        memory/lifecycle-and-status.md).

