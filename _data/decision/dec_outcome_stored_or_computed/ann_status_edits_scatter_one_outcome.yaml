title:                  One outcome scattered over many files
brief:                  |
                        With a status field, settling one decision
                        edits a line in every alternative's file,
                        where a ruling settles the set in one new
                        file.
description:            |
                        The removed status was a field on each option
                        (commit 44034ef, diff of
                        _data/schema/sch_decision.yaml, which was then
                        the schema of options). One ruling upholds one
                        option and rejects the rest
                        (_data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml
                        at edge).

