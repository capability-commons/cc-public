title:                  One outcome scattered over many files
brief:                  |
                        With a status field, settling one decision
                        edits a line in every alternative's file,
                        where a determination settles the set in one
                        new file.
description:            |
                        The removed status was a field on each option
                        (commit 44034ef, diff of
                        _data/schema/sch_option.yaml). One
                        determination upholds one option and rejects
                        the rest (det_cross_item_checks_engine.yaml
                        lines 21-36).

