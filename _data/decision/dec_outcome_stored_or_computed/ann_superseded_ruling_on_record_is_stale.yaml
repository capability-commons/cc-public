title:                  Ruling now edited in place, like a status
brief:                  |
                        The old annotation says that a later ruling
                        supersedes the earlier one, which stays on
                        record, while a status edit keeps the earlier
                        outcome only in git history. Now a decision
                        has at most one ruling, and a change of ruling
                        edits it in place, so a ruling also keeps its
                        earlier outcome only in git history.
description:            |
                        ruling_change_of_a_ruling
                        (_data/decision/dec_change_of_a_ruling/, lines
                        12-19) rules that a decision has at most one
                        ruling and that a change of ruling edits it in
                        place. The note of type_ruling says the same
                        (_data/register/reg_data_item_type.yaml lines
                        900-902). The check competing_rulings reports
                        a second ruling on a decision and says to edit
                        the one ruling in place
                        (src/cctool/check/check.lp lines 1446-1457). A
                        ruling cannot be superseded:
                        relation_supersedes admits only items that
                        play rol_supersedable at either end, and only
                        type_option and
                        type_interface_control_document play it
                        (_data/register/reg_relation.yaml lines
                        265-297;
                        _data/register/reg_data_item_type.yaml lines
                        533 and 1262). A ruling still settles a set of
                        alternatives in one act, so that part of the
                        contrast holds. Found in the review of
                        2026-10-22.

