title:                  Judgment that an evaluation cannot give
brief:                  |
                        A computed evaluation cannot give the outcome
                        where the maintainer sets an argument aside
                        for present conditions and names when to
                        revisit. A stored act can, and the driver
                        check acts on it.
description:            |
                        ruling_cross_item_checks_engine says WTP
                        "judged that the graph is too small for the
                        speed argument to count" and that the choice
                        is to be revisited at a larger size
                        (_data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml
                        at title and brief). Computing an evaluation
                        needs a ranking of concerns
                        (reg_concept.yaml), and none exists as data.
                        unargued_driver gates a ruling (check.lp
                        within satisfies); with no stored outcome it
                        has nothing to gate. Maintainer's statements
                        2026-10-14 ("a bit of a process around them")
                        and 2026-10-13; memory/
                        lifecycle-and-status.md.

