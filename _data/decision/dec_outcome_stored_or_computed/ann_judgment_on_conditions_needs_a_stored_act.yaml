title:                  Judgment that an evaluation cannot give
brief:                  |
                        A computed evaluation cannot give the outcome
                        where the owner sets an argument aside for
                        present conditions and names when to revisit.
                        A stored act can, and the driver check acts on
                        it.
description:            |
                        ruling_cross_item_checks_engine says Will
                        "judged that the graph is too small for the
                        speed argument to count" and that the choice
                        is to be revisited at a larger size
                        (ruling_cross_item_checks_engine.yaml lines
                        11-19). Computing an evaluation needs a
                        ranking of concerns (reg_concept.yaml lines
                        511-514), and none exists as data.
                        unargued_driver gates a ruling (check.lp lines
                        438-454); with no stored outcome it has
                        nothing to gate. Owner's statements
                        2026-10-14T19:33:44Z ("a bit of a process
                        around them") and 2026-10-13T21:39:30Z;
                        memory/ lifecycle-and-status.md.

