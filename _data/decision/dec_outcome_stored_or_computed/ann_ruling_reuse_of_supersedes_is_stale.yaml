title:                  Supersedes relation no longer open to a ruling
brief:                  |
                        The old annotation says that a ruling reuses
                        relation_supersedes, among other existing
                        parts. Now a ruling cannot supersede or be
                        superseded: a change of ruling edits the one
                        ruling in place.
description:            |
                        relation_supersedes names
                        relcon_is_supersedable on its source and its
                        target, which admits rol_supersedable
                        (_data/register/reg_relation.yaml lines
                        265-297). Only type_option and
                        type_interface_control_document play that role
                        (_data/register/reg_data_item_type.yaml lines
                        533 and 1262), so an edge of
                        relation_supersedes from or to a ruling fails
                        constraint_violation.
                        ruling_change_of_a_ruling rules that a
                        decision has at most one ruling, edited in
                        place, and the check competing_rulings holds
                        it (src/cc_public/check/check.lp lines
                        1446-1457). The other parts the annotation
                        names, the standalone item, the edges and the
                        commit record, are still what a ruling is
                        built from (_data/schema/sch_ruling.yaml).
                        Found in the review of 2026-10-22.

