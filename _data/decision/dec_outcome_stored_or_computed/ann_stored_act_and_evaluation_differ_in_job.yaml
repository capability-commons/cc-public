title:                  Different jobs for the act and the evaluation
brief:                  |
                        The stored act and the computed evaluation do
                        different jobs: one is a commitment by a
                        person, the other a derived verdict. So the
                        chosen alternative adds a comparison step, not
                        a second answer to one question.
description:            |
                        Abstract argumentation says nothing of who
                        acts on the result; committing to an action is
                        a separate move in a deliberation dialogue
                        (_data/register/reg_concept.yaml lines
                        519-529, citing Dung 1995 and McBurney,
                        Hitchcock and Parsons 2007). Raised by the
                        simplicity advocate against its own point.

