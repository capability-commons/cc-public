title:                  Ruling built from existing parts
brief:                  |
                        A ruling reuses the standalone item, relation
                        edges and the commit record, so its stored
                        half costs little to build and one small file
                        per decision to run.
description:            |
                        sch_ruling adds no field of its own beyond
                        sch_standalone and sch_trait_edge and requires
                        only a brief (_data/schema/sch_ruling.yaml
                        lines 17-21, 38-45). Who and when come from
                        the commits that add and change it (same file,
                        lines 32-35). Commit 7db4229 is 8 files, 230
                        insertions and 10 deletions. Supersession of
                        rulings, added in 89c74d8, was later removed:
                        a change of ruling edits the one ruling in
                        place (ruling_change_of_a_ruling). The checks
                        are settles (src/cc_public/graph/derive.lp
                        lines 115-121) and five rules in
                        src/cc_public/check/check.lp (lines 1185,
                        1221, 1296, 1467, 1536).
                        ruling_cross_item_checks_engine is 36 lines. A
                        status on the option would need a new field,
                        its enum and a new way to record who changed
                        it. ASSUMPTION: clingo time over these rules
                        stays small at ten times the item count; not
                        measured.

