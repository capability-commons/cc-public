title:                  Ruling built from existing parts
brief:                  |
                        A ruling reuses the standalone item, relation
                        edges, r_supersedes and the commit record, so
                        its stored half costs little to build and one
                        small file per decision to run.
description:            |
                        sch_ruling adds no field of its own beyond
                        sch_standalone and sch_trait_relation and
                        requires only a brief
                        (_data/schema/sch_ruling.yaml lines 18-24,
                        37-46). Who and when come from the commit that
                        adds it (same file, lines 33-36). Commit
                        7db4229 is 8 files, 230 insertions and 10
                        deletions; supersession in 89c74d8 added 109
                        insertions in 5 files and reuses the
                        r_supersedes edge already used by options. The
                        checks are a few rules in check.lp (lines
                        319-413, 439-453).
                        ruling_cross_item_checks_engine is 36 lines. A
                        status on the option would need a new field,
                        its enum and a new way to record who changed
                        it. ASSUMPTION: clingo time over these rules
                        stays small at ten times the item count; not
                        measured.

