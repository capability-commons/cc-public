title:                  Stored ruling and computed evaluation
brief:                  |
                        The outcome of a deliberation is a ruling, an
                        item made by someone that upholds or rejects
                        options, one per decision and edited in place.
                        No evaluation of the arguments is stored, and
                        when one is computed it is compared with the
                        ruling and does not replace it, since to
                        evaluate arguments and to commit to an action
                        are separate moves. A status on the option
                        records no author or reason, which is why
                        statuses were removed. The evaluator is still
                        to be built. Ruled by William Payne on
                        2026-10-23.

