title:                  Enforcement value with no named enforcer
brief:                  |
                        The enforcement field is a bare word. It does
                        not say which check, formatter or judge holds
                        the rule, so nothing shows when that tool
                        changes or goes away.
description:            |
                        Enum at
                        _data/schema/sch_regentry_writing_style_rule.yaml
                        lines 53-60. style_commit_title_template reads
                        check with relation []
                        (reg_writing_style_rule.yaml lines 442-444).
                        The check is in
                        src/cc_public/commit/message.py lines 24-26,
                        and no non-test file in src names the rule.
                        ASSUMPTION: an edge from rule to enforcer
                        would let the dangling-reference checks catch
                        a removed enforcer; no such relation was found
                        in reg_relation.yaml.

