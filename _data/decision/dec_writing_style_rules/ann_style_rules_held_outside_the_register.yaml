title:                  Prose rules held outside the register
brief:                  |
                        The ASCII rule lives in AGENTS.md and the
                        70-column wrap lives in the formatter, and
                        neither has a register entry. A writer must
                        read two places, and a change to the rules
                        must update two places.
description:            |
                        The register calls itself "the writing style
                        guide"
                        (_data/register/reg_writing_style_rule.yaml
                        lines 12-15). "Prose fields are ASCII" is in
                        AGENTS.md line 75 only. The formatter wraps
                        prose at 70 columns and sets values at column
                        24 (src/cc_public/edit/layout.py lines 64-67).
                        No entry names ASCII, a wrap width or a
                        column, and none reads formatter.
                        style_plain_text forbids markup but not
                        non-ASCII characters (lines 144-167). Cheap to
                        repair with an ASCII entry and a layout entry
                        marked formatter.

