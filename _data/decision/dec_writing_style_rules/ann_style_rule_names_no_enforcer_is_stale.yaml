title:                  Style rules now name what holds them
brief:                  |
                        The annotation says the enforcement field does
                        not say which tool holds a rule, and that no
                        relation runs from a rule to its enforcer. Now
                        relation_is_held_by does, and the two rules
                        marked check use it.
description:            |
                        relation_is_held_by
                        (_data/register/reg_relation.yaml line 1196)
                        takes relcon_is_rule at its source and
                        relcon_is_implementation at its target. In
                        _data/register/reg_writing_style_rule.yaml,
                        style_commit_title_template is held by
                        pym_cc_public.commit.message (line 494) and
                        style_american_spelling by
                        lpp_cc_public.check.check.word_to_replace
                        (line 1020). The enforcement field is still a
                        bare word. Found in the review of 2026-10-22.

