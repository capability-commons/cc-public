title:                  Partner text with non-ASCII characters
brief:                  |
                        Text a partner supplies with accented letters
                        or typographic punctuation cannot enter a
                        prose field unchanged, so it must be
                        transliterated and loses its original form.
description:            |
                        The repository already needs non-ASCII in one
                        place: the copyright pattern accepts U+00A9
                        and U+2013 (_data/schema/sch_trait_rights.yaml
                        line 98). ASSUMPTION: partner names,
                        quotations and titles often carry such
                        characters.

