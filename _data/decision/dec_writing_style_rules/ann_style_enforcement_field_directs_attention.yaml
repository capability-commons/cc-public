title:                  Enforcement field as a list of unchecked rules
brief:                  |
                        The enforcement field tells a writer and a
                        reviewer which rules no tool checks, so they
                        know where to spend attention.
description:            |
                        Values formatter, check, judge, none; none
                        means the rule "is followed by attention
                        alone"
                        (_data/schema/sch_regentry_writing_style_rule.yaml
                        lines 53-71). ASSUMPTION: a prose guide would
                        carry no per-rule enforcement value. The field
                        itself prevents no mistake; a prose guide with
                        the same list would guard no worse today.

