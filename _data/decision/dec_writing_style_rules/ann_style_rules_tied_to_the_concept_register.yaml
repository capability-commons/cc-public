title:                  Rules tied to the concept register
brief:                  |
                        A rule about words is data in the graph, so it
                        links the concept it means and lists the words
                        it replaces, and checks read both. A prose
                        guide holds a term or a word list only as
                        text.
description:            |
                        style_link_short_terms names
                        concept_identifiable_data_item with an edge of
                        relation_uses_concept
                        (_data/register/reg_writing_style_rule.yaml
                        lines 253-256). The checks unresolved_term,
                        ambiguous_term and unlinked_term read term
                        links against the concept register
                        (src/cctool/check/check.lp lines 1705-1707,
                        1745-1748 and 1934-1937).
                        style_american_spelling lists its replacements
                        as data (reg_writing_style_rule.yaml line
                        509), which word_to_replace reads
                        (src/cctool/graph/extract.py lines 519 and
                        691-708; check.lp lines 1663-1665).
                        style_link_short_terms still reads none (line
                        248), though these checks hold part of it.

