title:                  Example pair for each rule
brief:                  |
                        Each rule carries a sentence that follows it
                        beside the same sentence written to break it,
                        so a writer learns the rule and a reviewer
                        names a breach against one fixed entry.
description:            |
                        follows and breaks are required
                        (_data/schema/sch_regentry_writing_style_rule.yaml
                        lines 26-44). All fourteen entries carry both
                        (_data/register/reg_writing_style_rule.yaml).
                        The register says "The example pair on a rule
                        shows the rule at its smallest" (lines 26-27).
                        A measured exemplar passage "moved nothing"
                        (lines 389-395), but that tested a whole
                        passage, not the pair. ASSUMPTION: the pair
                        helps learning; it is untested.

