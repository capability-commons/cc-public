title:                  Gaps outside the register
brief:                  |
                        The ASCII rule has no register entry and no
                        check, so its gap does not show in the
                        register. The register shows the gaps of the
                        rules it holds, not of all prose rules.
description:            |
                        No register entry mentions ASCII. A case-blind
                        search for "ascii" over the tree finds
                        AGENTS.md#style and two annotations of other
                        decisions (dec_tooling_language and
                        dec_name_of_reference_field_part), and no code
                        in src. The ASCII sweep of 2026-10-09 was a
                        throwaway script (statement relayed by the
                        maintainer, 2026-10-09, will-messages.md line
                        76: "None of it is repeatable"). The em-dash
                        was removed in a one-off commit on request
                        (2026-10-13, commit 09d33bb, pre-squash).
                        Raised by all four advocates.

