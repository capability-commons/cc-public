title:                  Register of style rules with enforcement
brief:                  |
                        Each prose rule is a register entry with an
                        example pair and a record of what holds it, so
                        tools read the rules and checks tie them to
                        their enforcers and to the concept register. A
                        prose guide gives only text. Rules held by
                        attention alone are gaps to close in the
                        register, not a reason to move the rules out
                        of the graph. Ruled by WTP on 2026-10-22.

