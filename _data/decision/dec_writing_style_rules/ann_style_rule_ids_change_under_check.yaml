title:                  Rules with ids in the graph
brief:                  |
                        Each rule is a data item with a stable id, so
                        graph tooling finds it and checks a rename of
                        it. A heading in a prose guide gets neither.
description:            |
                        Type type_writing_style_rule with regex_id
                        ^style_[a-z][a-z0-9_]*$
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_concept). The commit change check
                        reports a renamed id with no alias, with
                        style_commit_title_template as its example
                        (src/cctool/commit/_test/test_change.py). A
                        rule no item follows is a rule to remove
                        (reg_writing_style_rule.yaml at usage), but no
                        check flags an unused rule today: check.lp
                        flags only unused schemas and concepts
                        (src/cctool/check/check.lp within
                        supersession_across_types).

