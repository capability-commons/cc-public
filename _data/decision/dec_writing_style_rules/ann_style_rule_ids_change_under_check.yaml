title:                  Rules with ids in the graph
brief:                  |
                        Each rule is a data item with a stable id, so
                        graph tooling finds it and checks a rename of
                        it. A heading in a prose guide gets neither.
description:            |
                        Type type_writing_style_rule with regex_id
                        ^style_[a-z][a-z0-9_]*$
                        (_data/register/reg_data_item_type.yaml lines
                        336-365). The commit change check reports a
                        renamed id with no alias, with
                        style_commit_title_template as its example
                        (src/cc_public/commit/_test/test_change.py
                        lines 39-40 and 123-137). A rule no item
                        follows is a rule to remove
                        (reg_writing_style_rule.yaml lines 29-31), but
                        no check flags an unused rule today: check.lp
                        flags only unused schemas and concepts
                        (src/cc_public/check/check.lp lines 611-641).

