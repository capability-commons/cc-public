title:                  ASCII prose read by any partner tool
brief:                  |
                        ASCII is a subset of UTF-8, so any partner
                        tool reads ASCII prose without loss.
description:            |
                        RFC 3629 section 3
                        (https://www.rfc-editor.org/rfc/rfc3629).
                        Prose fields are ASCII (AGENTS.md line 75).

