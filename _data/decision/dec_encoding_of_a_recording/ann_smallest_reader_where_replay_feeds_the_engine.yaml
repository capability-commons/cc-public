title:                  Smallest reader to harden where a replay feeds the engine
brief:                  |
                        On replay a recording is input to the engine,
                        and recordings travel between hosts, from a
                        robot to the host that replays its run. The
                        trial's replay took the count of each row on
                        trust and over-read the heap, and its JSON
                        reader, shared with runtime control, crashed
                        on one deeply nested line. A row of fixed
                        layout whose count is checked against a
                        capacity that the header names is the smallest
                        reader to fuzz, much as a harness is generated
                        for each node; JSON lines keep a text parser
                        and a hex decoder in that path, and MCAP adds
                        a third-party parser and two decompressors.
                        None of the options protects a recording
                        against tampering, and MCAP's checksums detect
                        only corruption.
description:            |
                        Sources:
                        - A recording is replayed a day later on
                          another host
                          (_data/test_case/case_control_block_replay.yaml at inputs).
                        - Replay copied as many items as a row's count
                          said, past the bytes
                          the row held: an ASan heap-buffer-overflow (review of 2026-10-29,
                          CC-045; areas/trial-engine.md, TE-17).
                        - The JSON reader that served runtime control
                          and recordings had
                          unbounded recursion, and one line of 200 KB killed the engine
                          (review of 2026-10-29, CC-046; areas/trial-engine.md, TE-16).
                        - The generator writes a fuzz harness for each
                          node kind from its
                          declared interface
                          (_data/decision/dec_fuzzing_of_a_single_node/ruling_harness_generated_from_the_node_interface.yaml
                          at brief).
                        - Each MCAP chunk carries a CRC32 of its
                          records, or zero for none
                          (MCAP Format Specification, https://mcap.dev/spec, Chunk record).
                        - Security asks what an attacker can reach and
                          what it would cost
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question.2).
                        ASSUMPTION: decompressors are a frequent place
                        for memory-safety faults; how far MCAP's C++
                        reader is fuzzed was not checked. Strength:
                        moderate; a library fuzzed by many users may
                        be safer than new code, so this favors the
                        binary log only if its reader is fuzzed from
                        the start.

