title:                  Own binary log with an index
brief:                  |
                        A binary log of our own: a header that names
                        the content digest of the graph and the types
                        of the data dictionary, then rows of fixed
                        layout that each hold the end, the local step,
                        the count and the raw items, with an index for
                        seeking. Small and fast, read by readers that
                        cctool provides.

