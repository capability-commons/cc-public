title:                  Recording cut short by a killed writer, and what stays readable
brief:                  |
                        In the trial a dead peer killed the sender's
                        process before its recording was flushed, so a
                        recording cut short is a case to design for.
                        JSON lines lose at most the last partial line,
                        though the trial's reader skipped broken rows
                        anywhere, not only the last, and rows of fixed
                        layout can be read up to the last whole row,
                        with the index rebuilt by a scan if it is not
                        the only way in. MCAP writes its summary and
                        chunk indexes after the data and makes them
                        optional, so a killed writer loses the index
                        and the chunk it was still filling, and a
                        writer that keeps a chunk index for each chunk
                        until it closes holds more the longer a patrol
                        runs. Each option needs a reader that takes
                        what is whole and reports the rest, and files
                        that close and start again during a run with
                        no natural end.
description:            |
                        Sources:
                        - Killing the receiver killed the sender's
                          process by SIGPIPE, and
                          its recording was not flushed (review of 2026-10-29, CC-016).
                        - The trial's Python reader leaves out a row
                          that is not whole
                          (trial 2c777ab9, src/cctool/dataflow/recording.py, function
                          read), and it skipped broken rows anywhere in a file (review of
                          2026-10-29, areas/trial-model.md, TM-17).
                        - The summary and summary offset sections are
                          optional, the footer
                          marks a missing summary with zero, a Data End record closes the
                          data section, each chunk may carry a CRC, and the chunk indexes,
                          one for every chunk, sit in the summary (MCAP Format
                          Specification, https://mcap.dev/spec).
                        - A robot on patrol has no natural end to its
                          run
                          (_data/decision/dec_overflow_of_events_and_recordings/ann_recorder_reserve_grows_with_the_run.yaml
                          at brief).
                        - Reliability asks whether the design recovers
                          without losing or
                          corrupting data (_data/register/reg_concern.yaml at
                          entries.concern_reliability.question.2).
                        ASSUMPTION: a writer that compresses holds a
                        whole chunk in memory until it writes it, and
                        a writer keeps the index of every chunk in
                        memory until it writes the summary at close;
                        the specification says nothing of recovering a
                        file with no footer, and whether existing MCAP
                        readers accept one was not checked. Strength:
                        moderate; small chunks and files closed at
                        intervals shrink it for MCAP, and a binary log
                        with its only index at the end would share the
                        weakness.

