title:                  Hex text that doubles each recorded camera frame
brief:                  |
                        The recorder's test case records every camera
                        frame, and Patrol's camera runs at 30 Hz on
                        its Orin. Hex spends two characters on each
                        byte, so JSON lines double the bytes written
                        and format text for every row, where either
                        binary option writes the items as they are and
                        MCAP can also compress whole chunks. The
                        trial's text encoding also reached the unit
                        thread: change and admission rows were built
                        there as strings, and the review counted
                        allocations on every admission. A row of fixed
                        layout is a copy of known size wherever it is
                        made, which keeps the recorder's cost off the
                        local step that the requirement protects, and
                        off a processor that units with safety
                        functions may share.
description:            |
                        Sources:
                        - The recorder's case records each frame of a
                          camera source, and
                          the player's case replays 100 local steps of camera frames
                          (_data/test_case/case_recorder_records_outside.yaml at
                          expected_results; _data/test_case/case_player_replays_exactly.yaml
                          at preconditions).
                        - Patrol runs on an NVIDIA Orin with a camera
                          at 30 Hz (WTP,
                          2026-10-28).
                        - The trial wrote each recorded message as a
                          JSON object with the
                          message in hex (trial process log, phase 2); its code formats
                          each row on a writer thread that builds new strings for it, and
                          starts that thread with no call to pin it to a core, where a unit
                          is pinned when the graph names a core (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, functions
                          Recording::open, Recording::run and run_unit;
                          src/cctool/dataflow/engine/include/df/json.hpp, function hex),
                          read from the code.
                        - With recording on, change and admission rows
                          were built as
                          strings on the unit thread, and one admitted outside message
                          cost 4 allocations there (review of 2026-10-29,
                          areas/trial-engine.md, TE-09).
                        - MCAP batches records into chunks that may be
                          compressed with lz4
                          or zstd (MCAP Format Specification, https://mcap.dev/spec, Chunk
                          record).
                        - A recorder that slowed the local step would
                          change the system it
                          records (_data/requirement/rqt_recorder_off_step_path.yaml at
                          rationale).
                        ASSUMPTION: an uncompressed VGA frame in RGB
                        is about 0.9 MB, so hex at 30 Hz is about 55
                        MB/s of text against about 28 MB/s raw. A
                        writer thread left unpinned competes for the
                        processor with units that carry safety
                        functions, and an overrun there delays
                        reaching a safe state. Strength: strong for
                        recordings at camera rate; weak for a
                        recording of small values only, where the text
                        costs little.

