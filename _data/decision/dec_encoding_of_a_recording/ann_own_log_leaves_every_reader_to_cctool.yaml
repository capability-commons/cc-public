title:                  Binary log of our own that leaves every reader to cctool
brief:                  |
                        The binary log of our own adds no third-party
                        code, but everything that reads it is ours to
                        write, test, fuzz and keep in step with each
                        version of the format: the player in C++, the
                        reader in Python, and any tool that lists,
                        slices or compares a file. The review found
                        faults in both of the trial's readers, an
                        over-read in one and rows skipped without
                        notice in the other. MCAP comes with
                        maintained libraries in C++ and Python, and
                        JSON lines can at least be opened in any text
                        tool. The binary format is small, so its
                        readers would be short, but each new use of
                        recordings falls on cctool.
description:            |
                        Sources:
                        - The binary log is read by readers that
                          cctool provides
                          (_data/decision/dec_encoding_of_a_recording/opt_own_binary_log_with_an_index.yaml
                          at brief).
                        - The trial's replay over-read the heap on a
                          bad count, and its
                          Python reader skipped a broken row anywhere in a file, so that a
                          local step vanished with no error (review of 2026-10-29, CC-045;
                          areas/trial-model.md, TM-17).
                        - MCAP has maintained libraries in six
                          languages, Python and C++
                          among them, and a command-line tool that inspects, merges and
                          splits files (https://github.com/foxglove/mcap).
                        - Maintainability counts the parts a
                          representative change touches
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure.1).
                        ASSUMPTION: MCAP's command-line tool and
                        viewers can also filter a file by channel and
                        time, which would serve the comparisons of
                        recordings that the tests make. Strength:
                        moderate; it is the other side of the
                        dependency that MCAP adds, and it weighs more
                        as more tools read recordings.

