title:                  Placement rule independent of the root
brief:                  |
                        The rule fixes only the path below the nearest
                        _data directory, so a subtree stays valid when
                        it moves to another folder or repository.
description:            |
                        Sources: src/cc_public/check/check.lp lines
                        169-182, where the file must match "(.*/)?"
                        before the expected path. Content already sits
                        in other repositories, cc-dtu and cc-dtu-pii
                        (memory cc-folder-layout.md). ASSUMPTION: a
                        role-prefix layout could carry the same
                        relative structure.

