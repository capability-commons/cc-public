title:                  Forward-slash paths in the placement check
brief:                  |
                        The check matches paths with "/", but the
                        reader records native paths, so on Windows the
                        check would report nothing.
description:            |
                        Sources: src/cc_public/graph/extract.py lines
                        201-204; src/cc_public/check/check.lp lines
                        171 and 180; src/cc_public/edit/edit.py lines
                        286-293 use PurePosixPath; Python pathlib
                        docs. Windows is not supported (owner's
                        statement W 2026-10-14T10:11:55Z; README.md
                        line 28). A fault of the code, fixed by
                        as_posix(), not of the decision. Weak today.

