title:                  Shared prefix on every file of a type folder
brief:                  |
                        Every file in a type folder begins with the
                        same prefix, such as sch_ in _data/schema, so
                        the layout carries role both by directory and
                        by a constant prefix on every name.
description:            |
                        Sources: ls _data/schema at 89c74d8; every id
                        begins with the prefix of its type (README.md
                        lines 20-21).

