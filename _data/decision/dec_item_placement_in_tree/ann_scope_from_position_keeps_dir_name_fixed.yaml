title:                  Constant directory name at every level
brief:                  |
                        Scope comes from position, so the directory
                        name stays the same at every level, and each
                        file type has one spelling.
description:            |
                        Owner's statement, W 2026-10-09T17:52:14Z
                        (will-messages.md line 57, "Layout"): "Scope
                        comes from position, so the directory name
                        stays constant at every level. One spelling
                        per file type: .yaml, .json, .xml." The packet
                        also cites "Role may be carried by a
                        directory, never by a constant prefix on every
                        name" (same message, line 55). Will chose the
                        placement check misplaced_document among his
                        rules (memory MEMORY.md, commit fd6323a).

