                        (relation: []); no mention of scope or _test
                        in src/cctool/graph/derive.lp or check.lp; no
                        src/**/_data directory exists. ASSUMPTION: the
                        role-prefix alternative would leave the same
                        links in names, so this argues for an edge or
                        derived fact under either.

