title:                  Decision folders missing from the recorded rule
brief:                  |
                        The decision says a standalone item is at
                        _data/<type without t_>/<id>.yaml, but the
                        check places the items of a deliberation in
                        their decision folder, an exception Will asked
                        for after the rule was recorded.
description:            |
                        Sources: packet.md;
                        src/cc_public/check/check.lp lines 178-183;
                        commit 1ba2895 (2026-10-14). Owner's
                        statement, W 2026-10-14T22:56:42Z: "I think we
                        may need to revisit the rule that every data
                        item of type <foo> goes in a _data/<foo>
                        directory. I think we should make an exception
                        for annotations and options and rulings". The
                        layout of W 2026-10-09T17:52:14Z does not
                        mention decision folders.

