title:                  Decision folders that follow the reason edges
brief:                  |
                        An item of a deliberation sits in the folder
                        of the decision it is an option for or is
                        about, and a check holds it there, so the tree
                        shows each item's reason.
description:            |
                        Sources: src/cctool/check/check.lp within
                        repeated_item, misplaced_module and
                        misplaced_document; commit 1ba2895;
                        _data/decision/dec_tooling_language/. Edges
                        name targets by id and guid, not by path, so a
                        move breaks no trace. Nothing in the packet
                        says the role-prefix alternative groups items
                        by decision.

