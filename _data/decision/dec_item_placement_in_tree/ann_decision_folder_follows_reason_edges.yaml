title:                  Decision folders that follow the reason edges
brief:                  |
                        An argument item sits in the folder of the
                        decision it is an option for or is about, and
                        a check holds it there, so the tree shows each
                        argument's reason.
description:            |
                        Sources: src/cc_public/check/check.lp lines
                        140-154 and 159-183; commit 1ba2895;
                        _data/decision/dec_tooling_language/. Edges
                        name targets by id and guid, not by path, so a
                        move breaks no trace. Nothing in the packet
                        says the role-prefix alternative groups items
                        by decision.

