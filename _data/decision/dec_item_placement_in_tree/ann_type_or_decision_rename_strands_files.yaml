title:                  Files stranded by a type or decision rename
brief:                  |
                        Folders are named for a type or a decision, so
                        a rename changes the right path of every item
                        in the folder, while rename moves only the
                        renamed item's own file.
description:            |
                        Sources: src/cctool/edit/edit.py within
                        remove; memory MEMORY.md line 55 ("rename of a
                        decision does not move its folder"); one
                        decision folder holds 19 files. Types have
                        been renamed (the Datalog module type in
                        6b551e3, later type_logic_program_file, memory
                        datalog-house-style.md line 8), but those
                        types hold source files, not items in a _data
                        type folder, so no type folder has yet been
                        stranded; the risk so far is the decision
                        rename. misplaced_document reports each
                        stranded item, so the break is caught.

