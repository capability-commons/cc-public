title:                  Placement rule kept in three places
brief:                  |
                        The expected path is computed in the check and
                        again in the edit tool, and the whitelist
                        repeats the layout, so a layout change must
                        touch all three in step.
description:            |
                        Sources: src/cc_public/check/check.lp lines
                        159-185; src/cc_public/edit/edit.py lines
                        120-125 and 273-298; .gitignore lines 76-98 in
                        bb8c338. Commit 1ba2895 added the issue branch
                        to both check and edit tool, so the rule now
                        has two branches in each copy. No test
                        compares the copies directly, but edit.apply
                        runs the check on every edit and refuses one
                        that adds a failure (edit.py lines 866-869),
                        so a disagreement between check and edit tool
                        shows as a refused edit; the .gitignore copy
                        is not checked. ASSUMPTION: a role-prefix
                        layout would need the same three copies, so
                        the cost belongs to any checked layout.

