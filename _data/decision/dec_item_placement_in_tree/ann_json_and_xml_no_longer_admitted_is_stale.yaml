title:                  JSON and XML items no longer admitted under _data
brief:                  |
                        ann_json_and_xml_items_are_not_read says the
                        layout admits .json and .xml items, which git
                        keeps but no tool reads. .gitignore now admits
                        only .yaml files under _data, so a JSON or XML
                        item is ignored by git as well as by the
                        reader.
description:            |
                        The one admit rule for _data in .gitignore is
                        "!_data/**/*.yaml" (line 72). .json and .xml
                        are admitted only under src/**/_test, as test
                        fixtures (lines 90 and 91). So the mismatch
                        between what git keeps and what the reader
                        parses is gone for _data. A JSON or XML item
                        is now dropped without a word, as a .yml one
                        is (ann_yml_item_is_dropped_silently). Found
                        in the review of 2026-10-22.

