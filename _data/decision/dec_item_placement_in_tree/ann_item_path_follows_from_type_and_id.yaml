title:                  Item path computed from type and id
brief:                  |
                        The right path of an item follows from its
                        type, its id and its decision edge, so a
                        partner can place a received item without a
                        tool, and one check and the edit tool both use
                        the rule.
description:            |
                        Sources: src/cc_public/check/check.lp lines
                        141-155 and 164-185 (misplaced_document);
                        src/cc_public/edit/edit.py lines 261 and
                        273-293 (cctool new computes the folder);
                        src/cc_public/check/_test/test_check.py lines
                        254-265. The rule is a formula on type and id,
                        so it does not grow with item count. A
                        determination is the exception: it finds its
                        decision only through the option it settles
                        (check.lp lines 153-155). A fixed role prefix
                        could give an equally computable path.

