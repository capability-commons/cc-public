title:                  One path test for the data directory
brief:                  |
                        The reader, the layout printer, the whitelist
                        and the placement check all find items by the
                        one fixed name _data in the path.
description:            |
                        Sources: src/cc_public/graph/extract.py lines
                        80 and 302-304; src/cc_public/edit/layout.py
                        lines 155-158 and 192-195; .gitignore lines
                        79-87 and 99-102; src/cc_public/check/check.lp
                        lines 171 and 180. ASSUMPTION: a role-prefixed
                        name would need each reader to match a prefix
                        pattern rather than one fixed name.

