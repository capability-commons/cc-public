title:                  JSON and XML spellings with no reader
brief:                  |
                        The layout admits .json and .xml items and git
                        keeps them, but only .yaml is parsed as an
                        item, so a JSON or XML item is committed and
                        then ignored.
description:            |
                        Sources: owner's statement W
                        2026-10-09T17:52:14Z; .gitignore lines 79-87
                        and 99-102; src/cc_public/graph/extract.py
                        lines 89-92, 278-290 and 302-309 (other files
                        are read only for a "#" comment header); JSON
                        has no comments (RFC 8259); no .json or .xml
                        file exists in the tree at 89c74d8. It may be
                        intent not yet built; the sources do not say.

