title:                  Decision rename no longer stranding files
brief:                  |
                        Commit 1b5fc3f "Fix cctool rename so that a
                        decision's folder moves with it" moves a
                        decision's folder with the decision. At
                        360ec14 the decision rename, the risk the
                        annotation found so far, strands no file.
description:            |
                        src/cc_public/edit/edit.py lines 762-763,
                        804-821 at 360ec14;
                        src/cc_public/edit/_test/test_edit.py line
                        260. A type is a register entry, and rename
                        moves no folder for an item held in a
                        register, so the type half of the point is
                        unchanged.

