title:                  Decision rename no longer stranding files
brief:                  |
                        Commit 1b5fc3f "Fix cctool rename so that a
                        decision's folder moves with it" moves a
                        decision's folder with the decision. At
                        360ec14 the decision rename, the risk the
                        annotation found so far, strands no file.
description:            |
                        src/cctool/edit/edit.py within remove and
                        rename at 360ec14;
                        src/cctool/edit/_test/test_edit.py within
                        test_a_field_that_names_an_item_at_any_depth_is_given_its_guid.
                        A type is a register entry, and rename moves
                        no folder for an item held in a register, so
                        the type half of the point is unchanged.

