title:                  Silent loss of a .yml item
brief:                  |
                        A YAML item spelled .yml is ignored by git and
                        not read, and no check reports it, though .yml
                        is a standard spelling partner tools produce.
description:            |
                        Sources: .gitignore; git check-ignore -v
                        --no-index at 89c74d8 reports
                        _data/annotation/ann_x.yml as ignored by line
                        37; src/cctool/graph/extract.py within KEY_REF
                        and PREDICATE; check.lp within
                        misplaced_module and misplaced_document; RFC
                        9512 section 2.1; Jekyll reads both spellings
                        (https://jekyllrb.com/docs/datafiles/).
                        ASSUMPTION: some partner tools default to
                        .yml. A check that names any non-whitelisted
                        file under _data removes the harm without
                        changing the decision.

