title:                  Engine owns every buffer
brief:                  |
                        The engine, or the generator in a static
                        build, allocates the buffers of each edge from
                        the port types and frees them when the edge is
                        removed; ports declare nothing about
                        ownership, and a default value comes from
                        whichever end supplies it. Ruled by WTP on
                        2026-10-27, replacing the ruling of 2026-10-26
                        for the declared owning end, which this ruling
                        now rejects. WTP's reasons: either end of a
                        feedback edge may supply its default and an
                        end has only the capacity to supply one, so no
                        owning end can be fixed
                        (ann_default_capacity_does_not_fix_an_owner);
                        and the owning end of an edge reallocating
                        memory, as first planned for Stableflow, does
                        not fit high-integrity systems and standards
                        such as MISRA C, where allocation is tightly
                        controlled
                        (ann_reallocation_at_an_owning_end_against_controlled_allocation).

