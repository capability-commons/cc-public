title:                  Engine owns every buffer
brief:                  |
                        The engine, or the generator in a static
                        build, allocates one buffer set for each edge
                        from the port types, and frees it when the
                        edge is removed. Ports declare nothing about
                        ownership, and a default value, where one is
                        needed, is declared by the port that supplies
                        it.
description:            |
                        The simplest form of central allocation.

