title:                  Producer always owns
brief:                  |
                        The node at the source end of every edge
                        allocates and frees the buffer it writes, and
                        readers point at it, as Stableflow did by
                        convention within a process. A destination
                        default needs a buffer of the consumer's own
                        until the first token arrives.
description:            |
                        Stableflow's usual convention (WTP,
                        2026-10-26).

