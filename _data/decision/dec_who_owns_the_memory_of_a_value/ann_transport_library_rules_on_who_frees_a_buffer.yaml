title:                  Transport libraries with their own rules on who frees a buffer
brief:                  |
                        ZeroMQ sends a buffer without copying it only
                        by taking ownership and calling a free
                        function later, from any thread, and GStreamer
                        returns a pooled buffer to its pool when its
                        last reference goes. A transport node that is
                        to send an edge's buffer without a copy must
                        be able to give that buffer away and accept
                        its release from a thread of the library.
                        Under the engine option every buffer belongs
                        to its edge for the life of the edge, so the
                        transport node must copy. Under the producer
                        or consumer option the release returns to a
                        node that may already be running its next
                        step. None of the four options says how a
                        buffer is lent to a library, so the library's
                        ownership model becomes a constraint the
                        engine meets later.
description:            |
                        Sources:
                        - "0MQ shall take ownership of the supplied
                          buffer"; the deallocation function "will be
                          called from an arbitrary thread".
                          (https://libzmq.readthedocs.io/en/latest/zmq_msg_init_data.html)
                        - "Buffer allocated from a bufferpool will
                          automatically be returned to the pool with
                          gst_buffer_pool_release_buffer() when their
                          refcount drops to 0."
                          (https://developer-old.gnome.org/gstreamer/stable/gstreamer-GstBufferPool.html)
                        - Under the leading transport option,
                          transport libraries are dependencies of the
                          sender and receiver node kinds only.
                          (_data/decision/dec_how_values_cross_execution_units/opt_transport_nodes_inserted_by_a_transform.yaml
                          at brief)
                        - The engine option allocates one buffer set
                          for each edge and frees it when the edge is
                          removed.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_engine_owns_every_buffer.yaml
                          at brief)
                        - Dependency risk asks what the design takes
                          from third parties.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question.0)
                        - Assumption: a send without a copy through
                          such a library will be worth having; no copy
                          has been measured yet. Strength: weak to
                          moderate; it matters for large values such
                          as pictures.

