title:                  Who owns the memory of a value
brief:                  |
                        Which end of a dataflow edge, or which part of
                        the system, is responsible for allocating and
                        freeing the memory a value is held in, and for
                        its default value?
description:            |
                        WTP pointed out that a default value is not
                        only a value but also memory that someone must
                        allocate and free, and had thought of the node
                        that provides a value as responsible for its
                        memory (WTP, 2026-10-26). In Stableflow either
                        the source or the destination end of each edge
                        could be declared the owner, responsible for
                        allocation and default values, because the
                        most fitting owner differed with the topology
                        of fan-in and fan-out; producer ownership was
                        the usual convention (WTP, 2026-10-26). The
                        drafted node contract says a node holds no
                        globals and allocates nothing. With one edge
                        per port and port groups, fan-in and fan-out
                        are done by nodes with port groups rather than
                        by edges. The answer bears on version swaps,
                        re-priming after a rewire, memory tokens and
                        feedback defaults. WTP noted that a buffer set
                        allocated per edge from the declared types
                        limits edges to data of a fixed size, which is
                        a big limitation (WTP, 2026-10-26); how values
                        of varying size are held is a decision of its
                        own, dec_how_values_of_varying_size_are_held,
                        and the two are to be ruled together.

