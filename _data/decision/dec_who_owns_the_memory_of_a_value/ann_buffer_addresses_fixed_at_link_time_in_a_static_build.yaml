title:                  Buffer addresses fixed at link time in a static build
brief:                  |
                        In a frozen build every slot is a link-time
                        constant address of static storage, so the
                        optimizer folds the casts in each node and may
                        inline small nodes into the schedule. Any
                        option where the generator lays out buffers
                        from declarations keeps this, whichever end is
                        named the owner. Allocation by node code gives
                        addresses known only at run time. Moved
                        tokens, which pass a region from one edge to
                        another, also make the address on an edge
                        change from step to step, so a static build
                        that uses them gives up constant addresses on
                        those edges.
description:            |
                        Sources:
                        - The generated file holds static storage for
                          every node's buffers and static const slot
                          arrays, so each inputs[i] is a link-time
                          constant address; with LTO the casts fold to
                          direct references to static buffers and
                          small components inline.
                          (_sources/axair-orchestrator/docs/execution_levels.md#2-frozen-subgraphs-a-generated-schedule)
                        - The producer and consumer options have a
                          node allocate its buffer.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_producer_always_owns.yaml
                          at brief;
                          _data/decision/dec_who_owns_the_memory_of_a_value/opt_consumer_always_owns.yaml
                          at brief)
                        - A moved region is given up by the sender and
                          owned by one reader.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/opt_memory_token_read_only_or_moved.yaml
                          at brief)
                        - Performance efficiency asks how quickly the
                          design responds under expected load.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.question.0)
                        - Assumption: the gain from constant addresses
                          matters most for small nodes called at a
                          high rate; no measurement in the tree shows
                          its size. Strength: moderate.

