title:                  Buffer read by the static side that outlives its dynamic writer
brief:                  |
                        Under same-step slots a static node reads,
                        through a pointer, a buffer that a dynamic
                        node writes. If the producer's end holds that
                        memory and a change set removes or swaps the
                        producer, the static reader holds a pointer to
                        freed memory, which is a use after free,
                        unless the engine updates every pointer first.
                        A buffer tied to the slot, or to an owning end
                        on the static side, lives as long as its
                        reader and keeps the slot's default in place
                        when the dynamic side does not run. Producer
                        ownership fails here. The declared-end option
                        can put the owner on the static side; the
                        engine option can tie the buffer to the slot.
description:            |
                        Sources:
                        - Values cross between the static and dynamic
                          subgraphs in the same step through fixed
                          slots, each with an optional default.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ruling_same_step_through_fixed_slots.yaml
                          at brief)
                        - The fixed-slot option crosses values by
                          handing over buffer pointers.
                          (_data/decision/dec_crossing_between_static_and_dynamic/opt_same_step_through_fixed_slots.yaml
                          at brief)
                        - A static node reading buffers placed by a
                          change set is safe only if the runtime
                          proves at each change that every pointer
                          names a buffer of the right type and size.
                          (_data/decision/dec_crossing_between_static_and_dynamic/ann_crossing_static_reads_buffers_placed_by_change_set.yaml
                          at brief)
                        - Under the producer option readers point at
                          the producer's buffer.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_producer_always_owns.yaml
                          at brief)
                        - A deployment may apply any change set that
                          checks against the graph it runs.
                          (_data/decision/dec_runtime_mode_set/ruling_any_change_set_checked_against_the_running_graph.yaml
                          at brief)
                        - CWE-416: "The product reuses or references
                          memory after it has been freed";
                          consequences include crashes and execution
                          of unauthorized code.
                          (https://cwe.mitre.org/data/definitions/416.html)
                        - Safety asks what state the design falls back
                          to when it fails; security asks what an
                          attacker can reach.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.2 and
                          entries.concern_security.question.2)
                        - Assumption: the static subgraph holds the
                          functions a system most needs to keep
                          running, as a safety function would be.
                          Strength: strong for every edge that enters
                          a slot; it grows with the number of dynamic
                          regions.

