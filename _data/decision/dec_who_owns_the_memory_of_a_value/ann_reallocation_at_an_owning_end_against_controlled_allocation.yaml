title:                  Reallocation at an owning end against tightly controlled allocation
brief:                  |
                        The first plan for Stableflow let the owning
                        end of an edge reallocate its memory when
                        needed. That does not fit high-integrity
                        systems, or coding standards such as MISRA C,
                        under which allocation is tightly controlled
                        and the allocation functions of the C library
                        are not used at all. An owner at one end of
                        each edge invites that reallocation. With the
                        engine, or the generator in a static build,
                        allocating every buffer from the port types,
                        all memory is reserved before the graph runs
                        and changes only when a checked change set
                        adds or removes an edge, so no node and no
                        edge end allocates while running.
description:            |
                        Sources:
                        - The initial plan for Stableflow was for the
                          owning end of an edge to be able to
                          reallocate memory if needed, which does not
                          fit well with high-integrity systems and
                          standards like MISRA C, where allocations
                          are tightly controlled (WTP, 2026-10-27).
                        - MISRA C:2012 Rule 21.3 says that the memory
                          allocation and deallocation functions of
                          stdlib.h shall not be used.
                        - The engine, or the generator in a static
                          build, allocates one buffer set for each
                          edge from the port types, and frees it when
                          the edge is removed.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_engine_owns_every_buffer.yaml
                          at brief)

