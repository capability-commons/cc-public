title:                  Owning end declared, engine allocates
brief:                  |
                        Every edge has exactly one owning end, source
                        or destination, which its port declares, and
                        the engine, not the node, allocates the
                        memory. Ruled by WTP on 2026-10-26, as
                        recommended.

