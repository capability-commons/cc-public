title:                  Owning end declared by the port, memory allocated by the engine
brief:                  |
                        Every edge has exactly one owning end, source
                        or destination, which its port declares, and a
                        check fails an edge with none or with two. The
                        owning end declares the type, size and default
                        value of what the edge carries, and the
                        generator in a static build, or the engine in
                        a dynamic region, allocates and frees the
                        memory from that declaration, so nodes still
                        allocate nothing. A feedback edge needs an
                        owning end that declares a default. A node
                        with an output group that sends one value to
                        many edges owns one buffer and hands each edge
                        a read-only token.
description:            |
                        Proposed to WTP on 2026-10-26, combining
                        Stableflow's declared owner with the drafted
                        rule that nodes allocate nothing.

