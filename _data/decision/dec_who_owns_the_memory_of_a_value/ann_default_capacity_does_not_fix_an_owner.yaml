title:                  Capacity to supply a default that does not fix an owner
brief:                  |
                        Under the ruled rule, either end of a feedback
                        edge may supply its first value, and a port, a
                        port group or a slot declares only a capacity
                        to supply one; having the capacity does not
                        oblige the end to use it. So which end
                        supplies the default cannot be fixed in
                        advance, and an owning end that must declare
                        the default, as the declared-end option has
                        it, cannot be fixed either. With the engine
                        owning every buffer, the default is whichever
                        capable end supplies it, written by the engine
                        into the buffer of the edge, and nothing about
                        ownership is declared.
description:            |
                        Sources:
                        - Either end of a feedback edge needs to be
                          able to supply a default value, so the
                          supplier of default values cannot be
                          uniquely fixed; ends of edges (ports, port
                          groups or slots) have a capacity for
                          supplying default values or not, and the
                          capacity does not mean that they have to
                          supply them (WTP, 2026-10-27).
                        - Each node kind declares, for each of its
                          ports, whether it can supply a default
                          value, and a feedback edge needs at least
                          one end that can.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - The declared-end option has the owning end
                          declare the type, size and default, and
                          requires a feedback edge to have an owning
                          end that declares a default.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_owning_end_declared_engine_allocates.yaml
                          at brief)
                        - Under the engine option, ports declare
                          nothing about ownership, and a default
                          value, where one is needed, is declared by
                          the port that supplies it.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_engine_owns_every_buffer.yaml
                          at brief)

