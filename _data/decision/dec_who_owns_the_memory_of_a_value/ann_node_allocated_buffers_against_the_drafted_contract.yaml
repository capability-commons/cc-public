title:                  Buffers allocated by nodes, against the drafted node contract
brief:                  |
                        The producer and consumer options have a node
                        allocate and free the buffer at its end of
                        each edge. The drafted node contract says a
                        node holds no globals and allocates nothing,
                        and that the framework owns all memory. Under
                        those two options allocation code sits in
                        every node, where the generator cannot size it
                        and a check before start has no declaration to
                        read. The two options where the engine
                        allocates keep the contract, and can still
                        place a buffer at the producer's end, as the
                        draft already does.
description:            |
                        Sources:
                        - The framework owns all memory and passes
                          everything in; the component holds no
                          globals and allocates nothing; outputs[i]
                          points at a buffer the framework allocated.
                          (_sources/axair-orchestrator/docs/component_interface.md#2-component-interface-decided-2026-10-11-untyped-pointers)
                        - "The framework owns all memory and steps
                          nodes in a fixed, deterministic order."
                          (_sources/axair-orchestrator/README.md#axair-orchestrator)
                        - The producer option has the source node
                          allocate and free the buffer it writes; the
                          consumer option has the destination node do
                          so.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_producer_always_owns.yaml
                          at brief;
                          _data/decision/dec_who_owns_the_memory_of_a_value/opt_consumer_always_owns.yaml
                          at brief)
                        - In the declared-end option and the engine
                          option the generator or the engine
                          allocates, so nodes allocate nothing.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_owning_end_declared_engine_allocates.yaml
                          at brief;
                          _data/decision/dec_who_owns_the_memory_of_a_value/opt_engine_owns_every_buffer.yaml
                          at brief)
                        - Maintainability asks how readily a change
                          can be checked before it ships.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                        - Assumption: "allocates and frees" in the
                          producer and consumer options means the
                          node's own code does it, as the briefs say.
                          If it means only that the engine places the
                          buffer at that end, both become special
                          cases of the declared-end option. Strength:
                          strong while the drafted contract stands; it
                          grows with the number of node kinds.

