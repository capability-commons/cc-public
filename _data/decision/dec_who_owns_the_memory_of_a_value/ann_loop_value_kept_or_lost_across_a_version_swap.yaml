title:                  Loop value kept or lost across a version swap
brief:                  |
                        A feedback edge carries a value from one step
                        into the next, so its buffer acts as state.
                        Under the ruled swap at a step, node state is
                        upgraded by the dictionary's mapping, but the
                        drafted rule for feedback defaults primes the
                        edge again after a swap, which restarts a
                        control loop from its default and can step its
                        output. If the memory belongs to the swapped
                        node, as under the producer or consumer
                        option, the value goes with the old version
                        unless it is copied out. If the engine holds
                        the buffer for the edge, the value survives a
                        swap of either end, and can be upgraded by the
                        same mapping as state. Whichever option is
                        ruled should say whether a swap keeps,
                        upgrades or re-primes the value on a feedback
                        edge.
description:            |
                        Sources:
                        - A node version is swapped at a step, with
                          its state upgraded; the old state is kept
                          until the new version completes a step.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief;
                          _data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                          at brief)
                        - Under the drafted port rule the engine
                          primes a feedback edge again after a rewire
                          or a version swap.
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief)
                        - After a rewire or a version swap there is no
                          step before, so something must supply a
                          first value.
                          (_data/decision/dec_default_values_on_feedback_edges/dec_default_values_on_feedback_edges.yaml
                          at description)
                        - A new version of a type maps each field as
                          kept, renamed, converted, or new with a
                          default.
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          at brief)
                        - The engine option ties the buffer to the
                          edge and frees it when the edge is removed.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/opt_engine_owns_every_buffer.yaml
                          at brief)
                        - Safety asks how the design avoids or limits
                          each hazard.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.1)
                        - Assumption: a swap keeps the node's id, so
                          the edge, identified by its ends, persists;
                          and some loops react to a jump in their
                          fed-back value, while for others the default
                          is neutral. Strength: moderate; it bites on
                          swaps of nodes inside control loops.

