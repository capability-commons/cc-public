title:                  Failed step sends messages marked invalid
brief:                  |
                        A unit whose local step fails still runs its
                        senders, and each sends a message marked as
                        not valid. Every unit stays in line, and each
                        reader applies the fail-safe of its port to
                        the invalid message.

