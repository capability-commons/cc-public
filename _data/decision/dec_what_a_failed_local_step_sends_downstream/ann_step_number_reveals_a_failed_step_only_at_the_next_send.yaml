title:                  Failed step that a step number reveals only at the next send
brief:                  |
                        Under the step-number option a failed step
                        sends nothing, so a receiver learns of it only
                        when the sender's next message arrives with a
                        higher number, a full period of the sending
                        unit later, and not at all while the sender
                        keeps failing. Until then the receiving unit
                        waits, and so do the units after it. A message
                        marked invalid reaches the receiver at its
                        usual time, in the step the failure happened,
                        so every reader applies its fail-safe at once
                        and no unit waits longer than in normal
                        running. On a safety path that difference is
                        part of the time to a safe state.
description:            |
                        Sources:
                        - A failed step sends nothing, and a receiver
                          that gets an
                          unexpected number applies its fail-safe for the missing step.
                          (_data/decision/dec_what_a_failed_local_step_sends_downstream/opt_messages_carry_their_local_step.yaml
                          at brief)
                        - A unit whose local step fails still runs its
                          senders, each
                          sending a message marked as not valid.
                          (_data/decision/dec_what_a_failed_local_step_sends_downstream/opt_failed_step_sends_messages_marked_invalid.yaml
                          at brief)
                        - Between units each unit reads exactly one
                          message per input
                          edge per local step, waiting for it.
                          (_data/decision/dec_same_step_or_next_step_reading/opt_reading_derived_by_placement.yaml
                          at brief)
                        - Every producer has a stated maximum rate
                          from which capacity
                          is derived, and overflow is a broken requirement.
                          (WTP, 2026-10-28) ASSUMPTION: a broken maximum stays broken
                          until it is fixed, so a port whose fail-safe fails the step can
                          fail many steps in a row.
                        - Safety is measured by the time to reach a
                          safe state after a
                          failure. (_data/register/reg_concern.yaml at
                          entries.concern_safety.measure)
                        - The review recommended that a failed step
                          still send a message
                          flagged invalid. (review of 2026-10-29, section 7, W-T1)
                        Strength: strong where a reader is on a safety
                        path or its sender can fail repeatedly; weak
                        where failures are rare and isolated.

