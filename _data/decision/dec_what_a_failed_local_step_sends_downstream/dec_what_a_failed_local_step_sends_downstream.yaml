title:                  What a failed local step sends to other units
brief:                  |
                        When a local step fails in one execution unit,
                        what do the units that read from it receive
                        for that step?
description:            |
                        The fail-safe fail_step ends a local step
                        early
                        (dec_behavior_when_a_capacity_is_exceeded). In
                        the trial implementation of 2026-10-29 the
                        senders after the failing node did not run, so
                        a receiver in another unit took the next local
                        step's message as this one's: every downstream
                        unit stayed one step out of line for the rest
                        of the run, and a bounded run never ended
                        (review of 2026-10-29, CC-004). The transport
                        ICD (icd_dataflow_transport) does not say what
                        a failed step sends.

