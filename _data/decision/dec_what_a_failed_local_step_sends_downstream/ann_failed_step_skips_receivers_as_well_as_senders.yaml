title:                  Failed local step that skips receivers as well as senders
brief:                  |
                        In the trial a failed local step returns at
                        the failing node, so every node after it is
                        skipped: its senders, and also any receiver of
                        the same unit that the order placed later. A
                        skipped receiver leaves its message queued, so
                        from then on the failing unit reads that
                        upstream unit one local step late, the mirror
                        of the downstream shift the review measured.
                        The option that sends messages marked invalid
                        names only the senders, so as worded it would
                        leave this upstream shift. A step number on
                        each message catches both directions at
                        whichever receiver sees the mismatch, and
                        stopping the host leaves no later step to
                        shift.
description:            |
                        Sources:
                        - The generated step returns as soon as a node
                          returns non-zero
                          or an overflow with the fail_step fail-safe occurs. (trial
                          2c777ab9, src/cctool/dataflow/generate.py, functions call and
                          overflow)
                        - Receivers are ordinary members of the unit's
                          order, ranked by
                          readiness, then control blocks first, then by name, so a
                          receiver can follow an ordinary node: u2 of the ramp variant runs rx_005, acc,
                          rec_002, rx_006, cb_u2. (trial 2c777ab9,
                          src/cctool/dataflow/generate.py, function unit_order; review
                          of 2026-10-29, CC-001)
                        - Measured downstream: after a failed step in
                          u1, u2's step k
                          read u1's step k+1 message for the rest of the run, with no
                          event. (review of 2026-10-29, CC-004)
                        - A unit whose local step fails still runs its
                          senders.
                          (_data/decision/dec_what_a_failed_local_step_sends_downstream/opt_failed_step_sends_messages_marked_invalid.yaml
                          at brief)
                        - A receiver that gets a number other than the
                          one it expects
                          reports a fault.
                          (_data/decision/dec_what_a_failed_local_step_sends_downstream/opt_messages_carry_their_local_step.yaml
                          at brief)
                        The upstream shift is read from the source,
                        not run: if acc failed in u2, rx_006 would
                        skip that step's host readings and read each
                        later one a step late. Strength: strong
                        against the invalid-mark option as worded, and
                        mended by saying that a failed step still
                        runs, or drains, its receivers too; the
                        step-number option in turn needs a rule for a
                        number lower than expected, which is a late
                        message to discard, not a missing one.

