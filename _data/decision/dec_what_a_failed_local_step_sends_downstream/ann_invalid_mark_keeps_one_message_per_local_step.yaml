title:                  Invalid mark that keeps one message per local step
brief:                  |
                        The records already require exactly one
                        message on each Kahn edge in each local step,
                        and a receiver that delivers one per local
                        step in the order sent. A message marked
                        invalid keeps both true, and the mark can be a
                        flag of the kind the ruling on messages per
                        step already allows a message to carry, on the
                        data channel itself, where the literature puts
                        control tokens. A failed step that sends
                        nothing breaks both clauses, so the
                        step-number option needs them amended. Either
                        way a mark helps only if a reader can tell it
                        from an empty message, and today a dropped
                        message and an empty one look the same, which
                        is the open question on absent and empty
                        messages.
description:            |
                        Sources:
                        - Exactly one message on each Kahn edge in
                          each local step.
                          (_data/interface_control_document/icd_dataflow_edge_message.yaml
                          at surface.data.artifact.cardinality)
                        - The receiver delivers the messages of the
                          edge, exactly one in
                          each local step, in the order the sender sent them.
                          (_data/requirement/rqt_transport_one_message_per_step.yaml at
                          object)
                        - Besides the bounded array, a message may
                          carry an enable flag
                          or a mode flag.
                          (_data/decision/dec_messages_on_a_kahn_edge_per_step/ruling_one_message_per_kahn_edge_per_step.yaml
                          at brief) The edge message ICD mentions such a flag but defines
                          no field. (review of 2026-10-29, CC-061)
                        - Control signals sent on a sibling channel
                          went wrong when delay
                          reordered them, and the authors note that control tokens on the
                          data channel would avoid it. (Tretter et al. 2015, Executing
                          dataflow actors as Kahn processes, section 4.4)
                        - The drop-message fail-safe gives the reader
                          an empty message.
                          (_data/test_case/case_executor_fail_safe.yaml at
                          expected_results)
                        - A truncated obstacle list reads as free
                          space to a planner.
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/ann_truncated_obstacle_list_reads_as_free_space.yaml
                          at brief) Since a reader cannot tell an absent message from an
                          empty one, a dropped obstacle list reads as free space too.
                          (review of 2026-10-29, CC-061)
                        - How a reader tells an absent message from an
                          empty one is open.
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/dec_how_a_reader_tells_absent_from_empty.yaml
                          at brief)
                        Strength: moderate; decisive on how many
                        records change, and conditional on a validity
                        field or flag being defined.

