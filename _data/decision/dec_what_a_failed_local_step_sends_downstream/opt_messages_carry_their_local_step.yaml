title:                  Messages carry the local step that sent them
brief:                  |
                        Every message across units carries the number
                        of the sender's local step. A failed step
                        sends nothing, and a receiver that gets a
                        number other than the one it expects reports a
                        fault and applies its fail-safe for the
                        missing step.

