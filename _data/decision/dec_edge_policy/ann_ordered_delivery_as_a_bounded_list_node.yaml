title:                  Ordered delivery as a bounded list from a node
brief:                  |
                        Under lowering, every value in order up to a
                        stated capacity becomes a node that outputs
                        one bounded list per step, and nothing arrived
                        becomes an empty token by the existing
                        convention, both forms already in the drafts
                        and the form Stableflow used. What the
                        declared policy means is then carried out by a
                        node that checks, tests and a simulated link
                        model can all see, while leaving the edge as
                        it is gives nothing to generate such a node
                        from.
description:            |
                        Sources:
                        - Stableflow messages were mostly lists, which
                          decoupled step rate from message rate at the
                          application level. (the decision's
                          description, drafted from the owner's
                          statement of 2026-10-24T22:43Z,
                          _data/decision/dec_where_engine_behavior_lives/dec_where_engine_behavior_lives.yaml
                          lines 31-33)
                        - A bounded sequence holds a count and a fixed
                          array; every sequence has a fixed capacity,
                          and nothing is allocated on the heap while
                          stepping.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 82, 145-151)
                        - Every packet has an enable flag, cleared at
                          the start of a step and set when the packet
                          carries data. (same file, lines 14-15)
                        - An inbound gateway latches what arrived
                          since the last step; if nothing arrived its
                          output is not enabled, and in simulation it
                          is replaced by a link model.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 190-193)
                        - The new option turns each declared policy
                          into an adapter node before the engine sees
                          the graph.
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml
                          lines 21-24)
                        - In the model the declaration is the same as
                          in the named option, so on this point the
                          two are even. Strength: strong. Each policy
                          is one adapter kind, however many edges use
                          it.

