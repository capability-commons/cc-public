title:                  Edge policy needed by the first Patrol graph
brief:                  |
                        The first real dataflow graph planned with
                        cc-public's dataflow model, Patrol's, states a
                        policy on every edge, and today's edge schema
                        refuses any field beyond its two ends and a
                        direction, while the plan lets the model work
                        start before the engine port lands. Deferring
                        leaves a stated need with nothing in the graph
                        that meets it, and adding the fields now lets
                        the Patrol graph be ported once, in its final
                        shape, rather than ported and then changed
                        again on every edge.
description:            |
                        Sources:
                        - A dataflow edge allows only source, target
                          and an optional direction, and allows no
                          other property.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.dataflow_edge)
                        - The Patrol base graph draft has 41 edges,
                          and each states a policy such as newest
                          frame, latest value, ordered, GStreamer
                          link, RTP or HTTP; a count of policy lines
                          gives 41. (_sources/cc-patrol-notes/draft,
                          the base graph file and its edge section;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 22-23)
                        - The cc-patrol drafts need edge capacity,
                          initial tokens and named adapters. (context
                          note, 2026-10-22, _sources/context.md line
                          35; _sources/cc-patrol-notes/plan.md lines
                          81-84)
                        - The plan's steps 1 to 3 (architecture as
                          items, vocabulary, decisions) can start
                          before the engine port lands.
                          (_sources/cc-patrol-notes/plan.md lines
                          37-38)
                        - The Patrol draft uses old shapes and will be
                          regenerated when ported.
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 235-238)
                        - "A tension is resolved while the change is
                          still cheap. When in doubt, the larger
                          change is made now."
                          (_data/register/reg_design_rule.yaml at entries.rule_resolve_tensions_early.title and entries.rule_resolve_tensions_early.brief)
                        - The later option waits "until the engine
                          runs graphs that need it", so the trigger
                          for meeting the need is at least recorded.
                          (_data/decision/dec_edge_policy/opt_edge_policy_later.yaml at title and brief) Strength: strong for functional
                          suitability (schema fact and policy-bearing
                          edges both checked in files); moderate for
                          maintainability (the rework saved rests on
                          the Patrol port happening soon); weak for
                          traceability (the later option already names
                          its trigger).

