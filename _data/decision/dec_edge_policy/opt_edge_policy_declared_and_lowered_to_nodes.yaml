title:                  Edge policy declared and lowered to nodes
brief:                  |
                        A dataflow edge may declare a delivery policy
                        (the latest value, every value in order up to
                        a stated capacity with a rule for when it is
                        full, or a fold with its function and initial
                        value), with the token it gives when nothing
                        arrived, and a feedback edge states its first
                        value. An edge with no policy carries one
                        token per step, as in Stableflow. A model
                        transform turns each declared policy into an
                        adapter node before the engine sees the graph,
                        so the engine knows only edges of one token
                        per step.
description:            |
                        Drafted from the owner's statement of
                        2026-10-24, that Stableflow kept the engine as
                        simple as possible and did rate decoupling
                        with list messages at the application level.

