title:                  Edge policy later
brief:                  |
                        Leave the dataflow edge as it is for now. Add
                        an edge field only when a graph needs it, such
                        as a named delivery policy when the Patrol
                        graph is ported. Add capacity and initial
                        tokens only once an engine honors them.

