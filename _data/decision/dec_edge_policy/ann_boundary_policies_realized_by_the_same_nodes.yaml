title:                  Product boundaries realized by the same nodes as policies
brief:                  |
                        In the Patrol drafts a policy at a boundary
                        with another product is realized by an adapter
                        at that boundary, such as a GStreamer appsink
                        with the policy's buffering, and pub-sub is
                        reached only through gateway nodes. Lowering
                        makes every policy a node, so a policy at a
                        GStreamer, RTP or DDS boundary and the adapter
                        that realizes it are the same kind of thing;
                        with the engine honoring policies between its
                        own nodes, one policy name has two
                        realizations.
description:            |
                        Sources:
                        - The draft table: GStreamer to engine is
                          realized by "appsink with the policy's
                          buffering"; engine to engine by "the
                          engine's own slot or queue, or its
                          cross-host transport"; a GStreamer fan-out
                          has "a tee and queue inserted".
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 45-51)
                        - Only gateway nodes cross to pub-sub.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 184-188, 226-227)
                        - Simulink, when set to handle rate
                          transitions automatically, "inserts hidden
                          Rate Transition blocks in the block
                          diagram".
                          (https://www.mathworks.com/help/simulink/ug/handle-rate-transitions.html)
                        - The compatibility question: "What must a
                          partner adopt in order to do either?"
                          (_data/register/reg_concern.yaml at entries.concern_compatibility.question)
                        - Limit: line 51 of the Patrol README expects
                          the engine to realize engine-to-engine
                          policies; lowering changes that to an
                          adapter node, and the authored graph is
                          unchanged. Strength: moderate. It grows with
                          the number of boundary edges and outside
                          products, not with internal nodes.

