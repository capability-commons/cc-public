title:                  An engine that honors edge policy is the first version
brief:                  |
                        The later option waits for an engine that
                        honors capacity and initial tokens, and that
                        engine is now the first version: the ruling on
                        first semantics puts Kahn networks and actors
                        in it together, and every place where actors'
                        messages become Kahn tokens needs a stated
                        rule and a fixed capacity. Waiting leaves the
                        first engine with no place in the graph to
                        state that rule, or adds the field while the
                        engine is being built, after the owner asked
                        for the shape to be fixed early.
description:            |
                        Sources: the dataflow engine supports Kahn
                        process networks and actors together from its
                        first version, because it is "VERY hard to
                        change the engine once it's built and you've
                        started using it - so it's best to get the
                        shape right early on"
                        (_data/decision/dec_first_semantics/ruling_first_semantics.yaml
                        lines 12-24). Where messages become tokens, a
                        crossing that keeps them in order, a gateway's
                        buffer and a director's port buffer each need
                        a fixed capacity and a rule for when it is
                        full
                        (_data/decision/dec_crossing_between_kahn_and_actors/ann_bounded_capacity_needed_where_messages_become_tokens.yaml,
                        brief). The later option adds capacity and
                        initial tokens only once an engine honors them
                        (_data/decision/dec_edge_policy/opt_edge_policy_later.yaml,
                        brief). A field is added only when a real
                        instance needs it (AGENTS.md lines 236-238),
                        and the Patrol draft sets a named policy on
                        all 41 of its edges
                        (_data/decision/dec_edge_policy/ann_patrol_graph_needs_edge_policy_in_the_model.yaml,
                        description). Assumption: the first engine is
                        built against the dataflow graph schema, so
                        the schema must hold the rule before the
                        engine reads it. Limit: under the gateway
                        option of the crossing decision the rule could
                        live on a gateway node instead of the edge.
                        Strength: strong; the rule is needed at every
                        crossing, and the number of crossings grows
                        with the actors in a graph.

