title:                  Edge policy fields shaped before the engine transport
brief:                  |
                        The engine exists only as design drafts and
                        its transport between processes is still open,
                        so until it runs graphs a check can hold edge
                        policy only to itself, not to behavior. Fields
                        declared now may be shaped wrongly and need a
                        second change, which would break every peer
                        graph that used them.
description:            |
                        Sources:
                        - "A rule claims no more than something
                          holds." (_data/register/reg_design_rule.yaml
                          lines 44-51)
                        - The engine is design drafts only.
                          (_sources/mapping.md lines 75-76)
                        - Edge transport between processes on one
                          host, ZeroMQ or a shared-memory queue, is
                          open.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 120-128, 222-223)
                        - Before 1.0 the owner accepts churn such as
                          renames and prefix changes. (owner's
                          statement, 2026-10-21, _sources/context.md
                          line 26) Strength: moderate for
                          maintainability (the risk of reshaping is
                          real while transport is undecided); weak for
                          compatibility (before 1.0 such a break is
                          accepted, and only the owner's peers would
                          be affected).

