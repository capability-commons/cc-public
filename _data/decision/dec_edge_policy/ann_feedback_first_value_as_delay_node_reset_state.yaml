title:                  First value of a feedback edge as a delay node's reset state
brief:                  |
                        The drafts have the framework prime feedback
                        buffers on reset. If the first value is
                        lowered to a delay node it becomes that node's
                        reset state, stated in the graph and covered
                        by the node's tests, where under an
                        engine-honored policy the engine keeps the
                        priming; the new option says a feedback edge
                        states its first value but not whether that
                        value is lowered too.
description:            |
                        Sources:
                        - Cross-process and feedback edges point at a
                          buffer the framework fills "and primes on
                          reset".
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 41-44)
                        - "a feedback edge states its first value".
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml
                          lines 18-19)
                        - The only dataflow graph in cc-public has one
                          feedback edge.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                          lines 125-137, as cited in
                          _data/decision/dec_edge_policy/ann_first_value_of_feedback_edge_unstated.yaml)
                          Strength: moderate. Only one recorded graph
                          has a feedback edge today; it holds only if
                          the option says the first value is lowered.

