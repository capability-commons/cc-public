title:                  First values stated once on the edge
brief:                  |
                        The engine options now open need a stated
                        value where none has yet been written: at the
                        first invocation of a feedback edge, and as
                        the explicit empty token when no message
                        arrived at a crossing. An optional input says
                        only that a value may be absent, not what it
                        is. A first value on the edge states it in the
                        graph, where the checks and a reader see it,
                        instead of in the engine.
description:            |
                        Sources: a feedback edge's value comes from
                        the invocation before
                        (_data/schema/sch_dataflow_graph.yaml at
                        $defs.dataflow_edge.properties.direction.description),
                        and nothing states the first one
                        (_data/decision/dec_edge_policy/ann_first_value_of_feedback_edge_unstated.yaml,
                        description). An input can be stated optional,
                        so that "an invocation may run with no value
                        here"
                        (_data/schema/sch_interface_control_document.yaml
                        at $defs.port.allOf.1.properties.optional).
                        The crossing policy option gives "an explicit
                        empty token when none arrived"
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        at brief). The engine draft has the framework
                        prime feedback buffers on reset
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 41-44), so the value lives in engine
                        code. Assumption: a static region that reads
                        from a dynamic one in the same step also needs
                        a stated value for a step where the dynamic
                        writer is absent; the decision on the crossing
                        between static and dynamic nodes does not yet
                        say. Strength: moderate; one recorded graph
                        has a feedback edge today, and the need grows
                        with each feedback edge and crossing.

