title:                  Adapters and delays already expressible without edge fields
brief:                  |
                        A converting node already does what a named
                        adapter on an edge would do, and a feedback
                        edge already means a value from the invocation
                        before, which is one initial token. Adding
                        adapter and initial tokens to the edge now
                        gives two ways to say each.
description:            |
                        Sources:
                        - The fix of the port type mismatch check says
                          to add a node that converts the value.
                          (src/cc_public/check/check.lp lines
                          3014-3017)
                        - A feedback edge closes a loop, and its value
                          comes from the invocation before.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          33-35, 200-203)
                        - The cc-patrol drafts ask for capacity,
                          initial tokens and named adapters on edges.
                          (_sources/cc-patrol-notes/plan.md lines
                          81-84) Strength: moderate; capacity has no
                          existing counterpart, and adapters at a
                          runtime boundary may not be plain nodes.

