title:                  A crossing policy on the edge needs this field
brief:                  |
                        The crossing policy option of the decision on
                        the crossing between Kahn networks and actors
                        is a named delivery policy on the edge, so
                        upholding it there settles this decision in
                        effect. Ruling the two apart leaves one field
                        decided in two places, and its record split
                        between them.
description:            |
                        Sources: the crossing policy option has an
                        edge declare how messages that arrive between
                        steps become a token, "such as the latest
                        value, all of them in order, or a fold, with
                        an explicit empty token when none arrived"
                        (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                        at title and brief). The argument for it uses
                        the delivery policies the Patrol draft already
                        puts on its edges and says that if this
                        decision is deferred, that option brings it
                        forward
                        (_data/decision/dec_crossing_between_kahn_and_actors/ann_kahn_actor_crossing_reuses_patrol_edge_policies.yaml,
                        brief). The edge today has only source, target
                        and direction and refuses any other field
                        (_data/schema/sch_dataflow_graph.yaml at
                        $defs.dataflow_edge). Limit: this holds only
                        if the crossing decision is ruled for the edge
                        option; under gateway nodes or one semantics
                        per composite, the crossing needs no edge
                        field. Strength: moderate; it bears on the
                        order and record of rulings more than on the
                        engine.

