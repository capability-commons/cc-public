title:                  Named adapter as the record of a system boundary
brief:                  |
                        Patrol's graph joins GStreamer, the engine and
                        a Python API, and the named adapter on an edge
                        records how data crosses into and out of those
                        other systems. Declaring it now lets the
                        checks hold each boundary to a policy that
                        suits it, such as a GStreamer link only within
                        one OS process and RTP only between hosts.
description:            |
                        Sources:
                        - The Patrol drafts derive edge kinds from the
                          runtimes at each end, with appsink, appsrc
                          and RTP adapters and the policies each
                          allows.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 40-51)
                        - The drafts imply checks that need the policy
                          stated: a GStreamer link only within one OS
                          process, RTP only between hosts, and a
                          policy suited to its edge kind.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 45-51, 59-63)
                        - Three contracts cross hosts in the mixed
                          variant, all facing outside systems.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 94-96)
                        - The current edge has only its ends and a
                          direction.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.dataflow_edge) Strength: moderate; the need is
                          drafted in detail, but by the owner's own
                          peer, not an outside partner.

