title:                  Policy lowering written in the vocabulary of variant operations
brief:                  |
                        Lowering a declared policy to an adapter node
                        is a generated rewrite of the same kind as the
                        variant operations the ruling adopts, so with
                        an operation that inserts a node on an edge it
                        is a short list of operations applied after
                        the authored ones, by the interpreter the
                        tooling needs anyway. The lowered adapter is
                        then the same thing an author could write by
                        hand, which gives a check that treats a
                        declared policy and a hand-placed adapter as
                        one a common form in which to compare them,
                        and answers part of the challenge that
                        lowering gives two ways to say the same.
description:            |
                        Sources:
                        - A variant holds a base and an ordered list
                          of operations, and the resolved graph is
                          derived and checked.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The lowering option turns each declared
                          policy into an adapter node before the
                          engine sees the graph.
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml at brief)
                        - Lowering gives authors two ways to get a
                          latest-value adapter, and a check that
                          treats the two as one would close the gap.
                          (_data/decision/dec_edge_policy/ann_declared_policy_and_hand_placed_adapter_alike.yaml at brief)
                        - The planned operations hold no insert on an
                          edge. (_sources/cc-patrol-notes/variants.md
                          lines 57-67)
                        - Lowering is a generated pass of the same
                          kind as variant operations.
                          (_sources/variants-framing.md, section 2 and
                          section 4, Q9) Strength: moderate; it rests
                          on the open choice of one vocabulary for
                          authored and generated operations, and on
                          adding the insert operation.

