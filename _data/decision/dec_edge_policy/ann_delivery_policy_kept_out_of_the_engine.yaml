title:                  Delivery policy kept out of the engine
brief:                  |
                        Under lowering, adding or reshaping a delivery
                        policy changes one adapter node kind and its
                        lowering rule, and the engine keeps one kind
                        of edge and one way to buffer, a node and its
                        list type. If the engine honors each named
                        policy itself, every new or reshaped policy is
                        an engine change, and the engine holds a
                        second, engine-side buffer beside list
                        messages.
description:            |
                        Sources:
                        - The new option lowers each declared policy
                          to an adapter node before the engine sees
                          the graph, so the engine knows only edges of
                          one token per step.
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml at title and brief)
                        - The engine is very hard to change once built
                          and in use.
                          (_data/decision/dec_first_semantics/ruling_first_semantics.yaml at brief)
                        - The shape of policy fields may be wrong
                          while the transport between processes is
                          still open.
                          (_data/decision/dec_edge_policy/ann_edge_policy_fields_ahead_of_engine_transport.yaml,
                          brief) Under lowering, a mis-shaped policy
                          is fixed in a node and a transform.
                        - The Patrol draft's policy names mix
                          buffering policies with transports, and its
                          policy for crossing hosts is still a
                          proposal.
                          (_data/decision/dec_edge_policy/ann_patrol_drafts_use_named_policy_only.yaml,
                          description)
                        - The inbound gateway in the drafts is an
                          ordinary node that latches whatever arrived
                          since the last step.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 184-191)
                        - ASSUMPTION: the named option is read as
                          honored by the engine, as the advocates'
                          brief describes it; its own text does not
                          say so. Strength: strong. The engine stays
                          fixed however many edges declare policies,
                          and the cost of a policy change grows only
                          with the number of policy kinds, which a
                          fixed list keeps small.

