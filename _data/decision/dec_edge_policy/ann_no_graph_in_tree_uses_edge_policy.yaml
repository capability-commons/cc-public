title:                  No graph in the tree that uses edge policy
brief:                  |
                        The only dataflow graph in the tree is the
                        Stableflow smoke test, and the need for
                        capacity, initial tokens and adapters is
                        stated only in drafts for a private peer.
                        Fields added now would hold declarations
                        nothing uses and trace to nothing in the
                        graph; waiting adds no mechanism until a real
                        instance needs one.
description:            |
                        Sources:
                        - The dataflow graph folder holds only the
                          Stableflow smoke test.
                          (_data/dataflow_graph/, directory listing)
                        - The dataflow edge has source, target and
                          direction only, and no other property is
                          allowed.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.dataflow_edge)
                        - The need is stated in the cc-patrol plan
                          draft. (_sources/cc-patrol-notes/plan.md
                          lines 81-84)
                        - Patrol code will eventually live in
                          cc-patrol, a private federated peer.
                          (owner's statement, 2026-10-21,
                          _sources/context.md line 9)
                        - "Add a type, relation, field or command only
                          when a real instance needs it." (AGENTS.md#keep-it-small)
                        - The engine is planned C++ with frozen
                          schedules first; nothing is built.
                          (_sources/cc-patrol-notes/plan.md lines
                          103-105; context note, _sources/context.md
                          line 36) Strength: strong for simplicity
                          (the growth rule is explicit); moderate for
                          traceability (the need is real and
                          documented, but held by no item yet). The
                          cc-patrol drafts are a real instance waiting
                          outside the tree.

