title:                  Port type check that holds the type a policy delivers
brief:                  |
                        Every value in order up to a capacity hands
                        the target a list where the source sent one
                        value, so the target port's type must match
                        the policy. Under lowering the adapter's
                        interface states that list type and the port
                        type check that already runs on the resolved
                        graph holds it; under a policy the engine
                        honors, a new rule must relate each policy to
                        the types at both ends.
description:            |
                        Sources:
                        - Stableflow decoupled the step rate from the
                          message rate with list messages at the
                          application level. (the decision's
                          description, drafted from the owner's
                          statement of 2026-10-24,
                          _data/decision/dec_where_engine_behavior_lives/dec_where_engine_behavior_lives.yaml
                          lines 31-33)
                        - The engine draft's list type has its
                          capacity in the type.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          line 82;
                          _sources/axair-orchestrator/docs/execution_levels.md
                          line 91)
                        - A dataflow edge states no data type of its
                          own; the ports at its ends do, and the
                          checker holds them to each other.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          50-52)
                        - In the draft, all eleven dataflow checks run
                          unchanged on each resolved variant.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - Simplicity counts jobs that more than one
                          mechanism does.
                          (_data/register/reg_concern.yaml lines
                          488-490)
                        - ASSUMPTION: the lowering transform runs
                          before the checks, as variant resolution
                          does in the draft. Strength: moderate. It
                          holds at any scale, but rests on the
                          transform existing, and the list type still
                          needs a dictionary entry for each element
                          type unless type parameters are added.

