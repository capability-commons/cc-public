title:                  Edge fields that variant operations cannot yet address
brief:                  |
                        Under the ruling a variant changes its base
                        only through operations, and the drafted write
                        operation addresses keyed sections, but a
                        dataflow edge has no key, only its two ends
                        and a direction. A delivery policy on the edge
                        is a value a variant may need to change, for
                        example when placement makes an edge cross
                        hosts and a different policy then suits it, so
                        any option that adds an edge field now also
                        needs a way for an operation to name an edge;
                        leaving the edge as it is defers that question
                        with it. The Patrol drafts so far avoid the
                        need by holding alternative edges, tagged, in
                        the base and filtering them.
description:            |
                        Sources:
                        - A dataflow edge has a required source and
                          target and an optional direction, and no
                          other field.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.dataflow_edge)
                        - The drafted write operation addresses host
                          and node settings by a dotted address.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 26-32)
                        - The planned remove operation removes one
                          node or edge by id, which edges do not have.
                          (_sources/cc-patrol-notes/variants.md
                          line 67)
                        - The place operation makes edges cross
                          processes or hosts, and the policy has to
                          say what the transport must preserve.
                          (_sources/cc-patrol-notes/variants.md line
                          66 and lines 144-146)
                        - The kind of an edge follows from where its
                          ends run, and a policy must suit its edge
                          kind, such as rtp only between hosts.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 42-51 and 59-61)
                        - The draft base holds a policy on each edge
                          and presence tags the edges that only some variants
                          keep, and the mixed Orin variant drops those
                          by a filter rather than changing a policy.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 3-4 and 431-443;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 22-23)
                        - Edges have no identity, and operations must
                          address them. (_sources/variants-framing.md,
                          section 2 and section 4, Q10) Strength:
                          weak; naming an edge by its two ends, which
                          a rename already keeps, is a small addition,
                          the insert operation needs it whatever is
                          decided here, and no drafted variant yet
                          changes the policy of an edge it keeps.

