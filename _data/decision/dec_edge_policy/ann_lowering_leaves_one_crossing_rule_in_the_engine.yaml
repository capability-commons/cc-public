title:                  One crossing rule still left to the engine under lowering
brief:                  |
                        The new option says the engine knows only
                        edges of one token per step, but an edge from
                        an actor carries messages, so the adapter
                        there takes a varying number of messages
                        between steps, delivered by the engine or read
                        from a queue outside the graph as a gateway
                        does. Lowering removes every crossing rule but
                        that one, and some of Patrol's policy names
                        are transports, such as RTP or a GStreamer
                        link, carried out outside the engine, which
                        the option does not say how to lower; so as
                        worded the option claims more than it
                        delivers.
description:            |
                        Sources:
                        - "so the engine knows only edges of one token
                          per step".
                          (_data/decision/dec_edge_policy/opt_edge_policy_declared_and_lowered_to_nodes.yaml at brief)
                        - The first engine has Kahn networks and
                          actors together.
                          (_data/decision/dec_first_semantics/ruling_first_semantics.yaml at brief)
                        - In the crossing option, messages that arrive
                          between steps become a token at the start of
                          a step.
                          (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml at title and brief)
                        - An inbound gateway's step "turns
                          asynchronous traffic into Kahn tokens".
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 185-186)
                        - Patrol's policies include a GStreamer link
                          and RTP, which GStreamer carries out.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 45-51) Strength: strong as a
                          correction of wording, at any scale. It is
                          met if the option says the engine keeps one
                          primitive crossing, a latched slot or a
                          mailbox, and that transport policies are
                          carried out at the boundary.

