title:                  Declared policy that a DDS gateway can set and match
brief:                  |
                        In DDS and ROS 2, delivery is stated per
                        endpoint as quality of service, such as keep
                        last with a depth, and endpoints match only if
                        their settings are compatible. A policy
                        declared on the edge, whether lowered or
                        honored by the engine, gives a gateway to a
                        DDS partner a stated policy to set and match,
                        where leaving the edge as it is gives nothing
                        to match against.
description:            |
                        Sources:
                        - Keep last: "only store up to N samples,
                          configurable via the queue depth option".
                          "Publications and Subscriptions will only
                          match if the QoS settings are compatible."
                          (https://design.ros2.org/articles/qos)
                        - The earlier note recommends naming the
                          policies after ROS 2 and DDS terms.
                          (/mnt/project-files/notes/engine-shape-2026-10-24/dec_edge_policy.md
                          line 39)
                        - The option to wait leaves the edge with only
                          its ends and direction.
                          (_data/decision/dec_edge_policy/opt_edge_policy_later.yaml at brief and edge;
                          _data/schema/sch_dataflow_graph.yaml at $defs.dataflow_edge)
                        - This overlaps the recorded argument that
                          named policies cover the known graphs, which
                          cites the same standards for coverage, not
                          matching. Strength: moderate. It grows with
                          the number of DDS-facing boundaries.

