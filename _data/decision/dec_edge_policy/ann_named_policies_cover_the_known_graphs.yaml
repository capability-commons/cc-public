title:                  Named policies cover the known graphs with one field
brief:                  |
                        The Patrol draft names a policy on each edge
                        and states no capacity, initial token or
                        adapter, and DDS and ROS 2 likewise name
                        delivery by quality of service policies such
                        as history depth and reliability. A converting
                        node already adapts one port to another. So
                        one field naming a policy from a fixed list,
                        each policy carrying the capacity it needs,
                        covers the known graphs, where three free
                        fields and a second way to adapt give the
                        checks and a reader more to hold.
description:            |
                        Sources: the Patrol draft sets a named policy
                        on its edges and states no capacity or initial
                        token
                        (_data/decision/dec_edge_policy/ann_patrol_drafts_use_named_policy_only.yaml,
                        description). The port type mismatch check's
                        fix is a node that converts the value
                        (src/cctool/check/check.lp lines 3213-3216).
                        ROS 2 states delivery as quality of service
                        policies, among them history (keep last with a
                        depth, or keep all) and reliability
                        (https://docs.ros.org/en/rolling/Concepts/Intermediate/About-Quality-of-Service-Settings.html);
                        the DDS specification defines the HISTORY and
                        RELIABILITY policies that ROS 2 maps them onto
                        (https://www.omg.org/spec/DDS/1.4). Simplicity
                        counts jobs done by more than one mechanism
                        (_data/register/reg_concern.yaml lines
                        488-490). Limit: a policy that keeps every
                        value in order still needs a number, its
                        depth, so the fixed list must allow one.
                        Strength: moderate; the gap between the two
                        options grows with every adapter written as an
                        edge field instead of a node.

