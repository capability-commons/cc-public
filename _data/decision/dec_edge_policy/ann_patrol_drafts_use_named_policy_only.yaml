title:                  Named policies without capacities in the Patrol drafts
brief:                  |
                        The option adds capacity, initial tokens and a
                        named adapter together, but the Patrol drafts
                        fill only a policy name, give no capacity on
                        any edge and have no feedback edge. A capacity
                        declared before any engine honors it is a
                        claim nothing yet makes true; the named policy
                        is the part with a real instance.
description:            |
                        Sources:
                        - No edge in the Patrol base draft or its
                          variant drafts states a capacity or initial
                          tokens, and the base draft has no feedback
                          edge. (_sources/cc-patrol-notes/draft, base
                          and variant files; a search for capacity,
                          initial, token and feedback finds none)
                        - The draft's policy names mix buffering
                          adapters (newest frame, latest value) with
                          transports (RTP, HTTP, GStreamer link).
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 45-51)
                        - The cross-host edge policy (capacity,
                          latest-value or ordered, acknowledgment) is
                          still a proposal to write.
                          (_sources/cc-patrol-notes/variants.md lines
                          144-146)
                        - The engine does not exist yet; its design is
                          in drafts.
                          (_sources/axair-orchestrator/README.md lines
                          12-15; context note, _sources/context.md
                          line 36)
                        - A type, relation or field is added only when
                          a real instance needs it. (AGENTS.md#keep-it-small) Strength: moderate; it challenges
                          the bundle as worded, not the need for a
                          named policy.

