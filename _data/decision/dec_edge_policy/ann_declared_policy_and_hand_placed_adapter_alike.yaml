title:                  Declared policy and hand-placed adapter that say the same
brief:                  |
                        Lowering adds a transform, and it gives
                        authors two ways to get, for example, a
                        latest-value adapter: declare the policy on
                        the edge, or place the same node by hand.
                        Leaving the edge as it is keeps one way; a
                        check that refuses hand-placed adapters of the
                        lowered kinds, or treats the two as one, would
                        close the gap.
description:            |
                        Sources:
                        - A converting node already does what a named
                          adapter on an edge would do, so an edge
                          field for it gives two ways to say it.
                          (_data/decision/dec_edge_policy/ann_adapters_and_delays_already_expressible.yaml,
                          brief)
                        - Variant resolution is planned as a transform
                          in cctool, and the engine never sees
                          variants.
                          (_sources/cc-patrol-notes/variants.md lines
                          36-37, 92-95) ASSUMPTION: lowering would be
                          one more step of that resolution, not a
                          second pipeline; if it is a separate pass,
                          the mechanism count rises by one.
                        - Transformations are not built yet.
                          (_sources/cc-patrol-notes/plan.md lines
                          173-176)
                        - "Add a type, relation, field or command only
                          when a real instance needs it." (AGENTS.md
                          lines 236-238) Strength: moderate. The
                          two-ways risk grows with the edges unless a
                          check closes it.

