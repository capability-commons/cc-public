title:                  Unstated first value of a feedback edge
brief:                  |
                        A feedback edge carries the value from the
                        invocation before, but nothing in the graph
                        says what it carries at the first invocation;
                        the engine drafts leave that to the framework,
                        which primes it on reset. An initial-token
                        declaration on the edge would make the first
                        step's result something the model states and a
                        check can hold.
description:            |
                        Sources:
                        - The schema says a feedback edge's value
                          comes from the invocation before, and says
                          nothing of the first invocation.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          33-35, 193-203)
                        - The engine draft has the framework fill
                          feedback buffers and prime them on reset, as
                          Stableflow does.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 41-44)
                        - The one dataflow graph in cc-public has a
                          feedback edge.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml
                          lines 125-137) Strength: moderate; a real
                          gap in what the model states, but only one
                          recorded graph has a feedback edge today.

