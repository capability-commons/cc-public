title:                  Named delivery policy on the edge now
brief:                  |
                        A dataflow edge carries a delivery policy
                        named from a fixed list. Ruled by WTP on
                        2026-10-27, as recommended, with the option
                        first amended so that the first value a
                        feedback edge carries stays on a port that
                        declares it can supply one (WTP chose to
                        strike it from the edge). The crossing
                        policies between Kahn and actor nodes belong
                        in the same list.

