title:                  Naming rule for adapter nodes that lowering adds
brief:                  |
                        A lowered adapter exists only because an edge
                        declared a policy, and it appears only in the
                        resolved graph, which is derived and never
                        stored, so unless its id or a recorded link
                        names the edge and the policy it is an element
                        with no traced reason, and any outside reader
                        of the resolved graph, such as a viewer, must
                        recognize it. The option does not yet say how
                        lowered nodes are named; a fixed rule deriving
                        the id from the edge and marking the node as
                        generated would answer both, and would then
                        let each lowered node trace both ways as an
                        item, where policy code in the engine traces
                        only through engine source.
description:            |
                        Sources:
                        - A dataflow node id is the id of its graph
                          with the node prefix, then the node's key.
                          (_data/register/reg_data_item_type.yaml at entries.type_dataflow_node)
                        - A node that a variant adds takes its id from
                          the variant's name.
                          (_sources/cc-patrol-notes/variants.md lines
                          79-82) No rule names a node that a transform
                          adds. (search of _data and _sources; none
                          found)
                        - The resolved graph is derived when needed,
                          never stored.
                          (_sources/cc-patrol-notes/variants.md lines
                          36-37)
                        - Each step of the Patrol work "ends with
                          detector_dump parity".
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 173-176) ASSUMPTION: a parity check
                          that compares a run node by node would meet
                          the lowered nodes.
                        - Prior art: ATL and QVT create trace links
                          automatically during a transformation,
                          recording which target elements came from
                          which source elements.
                          (https://arxiv.org/pdf/2305.06764, section
                          2.3.6 and Table 1)
                        - Traceability's measure is elements with no
                          traced reason, by count; the compatibility
                          question asks "Can a partner read and use
                          what the design produces?"
                          (_data/register/reg_concern.yaml at entries.concern_traceability.measure and line 304)
                        - The named option inserts no nodes, so the
                          gap does not arise there. Strength: strong
                          for traceability and weak to moderate for
                          compatibility. The lowered nodes grow with
                          the edges that declare policies, and one
                          naming rule fixes all of them at once.

