title:                  Named delivery policy on the edge now
brief:                  |
                        Add to the dataflow edge now a delivery policy
                        named from a fixed list, such as the latest
                        value, every value in order up to a stated
                        capacity with a stated rule for when it is
                        full, or a fold. The first value a feedback
                        edge carries comes from a port that declares
                        it can supply one, as ruled, and is not
                        written on the edge. A converting node stays
                        the way to adapt one port to another.
description:            |
                        Amended on 2026-10-27: the first value a
                        feedback edge carries was taken out of the
                        list, since the ruling on default values on
                        feedback edges puts it on a port that declares
                        it can supply one.

