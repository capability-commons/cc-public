title:                  Three mechanisms for one rename job
brief:                  |
                        A reference is kept correct across a rename by
                        a guid, by a rewrite of every reference, and
                        by an alias list. Inside the repository the
                        first two do the job, so the alias list and
                        its rules duplicate them.
description:            |
                        Every edge names its target by guid and by
                        readable id (_data/schema/sch_trait_edge.yaml
                        at description). cctool rename rewrites every
                        reference and mention in every YAML document
                        (src/cctool/edit/edit.py within _rename_one
                        and _renamed_documents). The checker reports
                        any later use of an old id. A reference is
                        outdated, found through an alias or its guid,
                        and a mention is outdated where it is an alias
                        and dangling otherwise
                        (src/cctool/check/check.lp). Alias adds its
                        own rules: the exemption in dangling_reference
                        and dangling_mention, alias_in_use,
                        outdated_reference, outdated_mention and
                        rename_without_alias (check.lp;
                        src/cctool/commit/change.lp within
                        rename_without_alias). rename_without_alias
                        already needed an exception for Revert and
                        Reapply (change.lp within
                        rename_without_alias). What alias still serves
                        is text the rewrite cannot reach, such as
                        foreign repositories and imported data. cctool
                        import now brings in outside classes, but
                        keeps their keys in an identifier field and
                        not in alias (src/cctool/cli/editing.py within
                        import_; _data/schema/sch_external_class.yaml
                        at allOf.2.properties.identifier). Weakens
                        once a federation exists, or an import that
                        keeps its keys in alias. From the simplicity
                        advocate.

