title:                  Three mechanisms for one rename job
brief:                  |
                        A reference is kept correct across a rename by
                        a guid, by a rewrite of every reference, and
                        by an alias list. Inside the repository the
                        first two do the job, so the alias list and
                        its rules duplicate them.
description:            |
                        Every edge names its target by guid and by
                        readable id
                        (_data/schema/sch_trait_relation.yaml lines
                        16-24). cctool rename rewrites every reference
                        and mention in every YAML document
                        (src/cc_public/edit/edit.py lines 722-770).
                        The checker reports any later use of an old
                        id, as outdated where it is an alias and as
                        dangling otherwise
                        (src/cc_public/check/check.lp lines 236-239,
                        466-472 and 486-521). Alias adds its own
                        rules: the exemption in dangling_reference and
                        dangling_mention, alias_in_use,
                        outdated_reference, outdated_mention and
                        rename_without_alias (check.lp lines 236-239
                        and 466-521; src/cc_public/commit/change.lp
                        lines 149-165). rename_without_alias already
                        needed an exception for Revert and Reapply
                        (memory/enforcement-approach.md line 12). What
                        alias still serves is text the rewrite cannot
                        reach, such as foreign repositories and
                        imported data. ASSUMPTION: none exists in
                        cc-public today. Weakens once a federation or
                        import exists. From the simplicity advocate.

