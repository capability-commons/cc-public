title:                  Fused number as a second stable key
brief:                  |
                        A number fused into the id gives each item a
                        second stable key beside its guid. It removes
                        the alias list but adds more than it removes.
description:            |
                        Every item carries a guid_self that does not
                        change on rename
                        (_data/schema/sch_trait_edge.yaml lines 16-24;
                        commit f587284 in the pre_squash_20261014
                        history, memory/MEMORY.md line 35). Commit ids
                        already take a generated part from the guid:
                        the id of commit 7520f91 ends in the first hex
                        digits of its guid, so a cheap form with no
                        allocator exists. Other ids are words after a
                        type prefix, matched by a regex per type, such
                        as ^concern_[a-z][a-z0-9_]*$
                        (_data/register/reg_data_item_type.yaml line
                        507). ASSUMPTION: a per-type allocator would
                        be a further mechanism. The point rests mainly
                        on the number duplicating the guid. From the
                        simplicity advocate. The maintainability
                        advocate makes the same point in weighing the
                        ripple cost.

