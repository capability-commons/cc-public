title:                  Rename safety without a fused number
brief:                  |
                        A retired key moves into alias and stored data
                        keeps resolving, so rename safety is had
                        without fusing an allocated number into the
                        id. Alias holds old ids after renames, not
                        synonyms.
description:            |
                        WTP asked "Is the alias list for other
                        synonyms? Or to help track renames?"
                        (maintainer's statement, 2026-10-13,
                        will-messages.md line 173). The outcome is
                        recorded in memory/MEMORY.md line 12: "alias
                        (on every register entry) is for old ids after
                        renames, not synonyms". The reason about fused
                        numbers is recorded in the packet as written
                        by an assistant, not by WTP
                        (_data/schema/sch_register_entry.yaml at
                        properties.alias.description, added in commit
                        bb8c338, in the pre_squash_20261014 history).
                        ASSUMPTION: git names WTP as author of
                        bb8c338, so the repository does not confirm
                        who wrote it. The rename_without_alias check
                        came in 7520f91 and cctool rename in afbcf6f
                        (2026-10-14).

