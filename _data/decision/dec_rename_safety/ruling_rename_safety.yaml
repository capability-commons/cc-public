title:                  Alias list of old ids
brief:                  |
                        A renamed register entry keeps its old id in
                        alias, so an old id met in text or history
                        still leads to the entry, and the guid finds
                        any renamed item from an edge. A number fused
                        into the id would be a second stable key
                        beside the guid, and synonyms belong in the
                        ISO 1087 term fields. Ruled by William Payne
                        on 2026-10-22.

