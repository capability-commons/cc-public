title:                  Rename as one checked command
brief:                  |
                        A rename costs one command, and the checks
                        catch any part of it left undone. This keeps
                        the person hours of a rename low though it
                        touches many files.
description:            |
                        cctool rename changes the id in every YAML
                        document, moves the file of a standalone item,
                        and appends the old id to a register entry's
                        alias (src/cc_public/edit/edit.py lines
                        723-770; commit afbcf6f). It lists each file
                        whose text outside the rewritten YAML document
                        still names the old id
                        (src/cc_public/cli/editing.py lines 285-308).
                        rename_without_alias and unannounced_rename
                        check the commit
                        (src/cc_public/commit/change.lp lines 149-165;
                        commit 7520f91). outdated_reference,
                        outdated_mention, alias_in_use and
                        guid_mismatch check the tree
                        (src/cc_public/check/check.lp lines 243-256
                        and 476-521). A rename keeps the type prefix
                        (edit.py lines 733-735). Before the tool, one
                        rename touched 7 files by hand (commit
                        6b551e3, pre_squash_20261014 history). Weakens
                        if much text naming ids lives outside YAML
                        documents. From the maintainability advocate.

