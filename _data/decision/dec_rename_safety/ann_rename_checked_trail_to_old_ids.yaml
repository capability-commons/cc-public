title:                  Checked trail from a new id to its old ids
brief:                  |
                        For register entries, the alias list keeps a
                        checked link from the current id to every
                        earlier id. An old id met in a commit message
                        or note still leads to the live entry.
description:            |
                        rename_without_alias reports a register entry
                        renamed without its old id in alias
                        (src/cctool/commit/change.lp within
                        unannounced_rename and rename_without_alias;
                        commit 7520f91). cctool rename appends the old
                        id (src/cctool/edit/edit.py within remove;
                        commit afbcf6f). An alias is not reported as
                        dangling (src/cctool/check/check.lp within
                        member_stem). A relation entry renamed in
                        commit f587284 (pre_squash_20261014 history)
                        keeps its old id as an alias
                        (_data/register/reg_relation.yaml at
                        entries.relation_has_items_held_in_register.title
                        and
                        entries.relation_has_items_held_in_register.brief).
                        Commit messages are not rewritten, and
                        unannounced_rename requires a rename to be
                        named in its commit (change.lp within
                        unannounced_rename). Grows with more renames
                        and more old commits. From the traceability
                        advocate.

