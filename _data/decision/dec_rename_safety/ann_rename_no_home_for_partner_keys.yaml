title:                  No home for a partner's keys
brief:                  |
                        Reading a partner's data that names a local
                        entry by the partner's own string needs a
                        mapping. The alias schema text, as first
                        written, admits such strings beside old ids,
                        and the chosen reading gives that use no other
                        place.
description:            |
                        The alias description admits "legacy strings
                        appearing in imported data"
                        (_data/schema/sch_register_entry.yaml at
                        properties.alias.description). A concept from
                        a partner names an entry in the partner's
                        register (_data/register/reg_concept.yaml at
                        usage). This bears on imported keys only, not
                        on terms, which have their own fields. Aliases
                        share the key namespace of live entries (same
                        schema lines 79-80), so more partner keys
                        raise the collision risk in
                        _data/schema/sch_trait_identity.yaml at
                        properties.id_self.description. The advocate
                        suggests a separate mapping keyed by partner
                        may serve better than either recorded
                        alternative. From the compatibility advocate.

