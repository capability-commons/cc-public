title:                  Alias schema text wider than the outcome
brief:                  |
                        The schema lets alias hold legacy strings from
                        imported data, which are not old ids of this
                        repository's entries. The recorded outcome
                        limits alias to old ids.
description:            |
                        _data/schema/sch_register_entry.yaml at
                        properties.alias.description say alias holds
                        "historical spellings this entry has been
                        renamed away from, and legacy strings
                        appearing in imported data". memory/MEMORY.md
                        line 12 says alias "is for old ids after
                        renames, not synonyms". One of the two is out
                        of step. Raised by the maintainability and
                        traceability advocates.

