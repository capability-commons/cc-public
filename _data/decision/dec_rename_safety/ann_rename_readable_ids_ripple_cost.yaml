title:                  Ripple cost of renaming a readable id
brief:                  |
                        A rename touches every file that names the
                        item, where an id with an allocated number
                        would let the title change in one place. The
                        chosen design accepts the wider change.
description:            |
                        cctool rename rewrites the id in every YAML
                        document that names it
                        (src/cc_public/edit/edit.py lines 742-755).
                        Every reference already carries an immutable
                        guid beside the readable id
                        (src/cc_public/graph/extract.py lines
                        123-126). ASSUMPTION: under allocated numbers
                        a change to the readable part would not change
                        the id. No design for that alternative exists
                        to confirm it. Parts touched grow with the
                        number of mentions; person hours grow little
                        while the tool does the rewrite. The advocate
                        judges this a real cost but not a reason to
                        reverse the decision. From the maintainability
                        advocate.

