title:                  Criticality carried by edges already in the trace
brief:                  |
                        A criticality derived onto code is only as
                        complete as the edges from requirement to
                        code, and it makes a missing edge matter. With
                        no criticality, the ruled clause that a
                        critical requirement needs a verifier stating
                        its procedure has nothing to apply to.
description:            |
                        Sources:
                        - September derived criticality along
                          relations that declare responsibility,
                          taking the greatest among the requirements
                          that reach an item
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - On dev a requirement names a logical
                          component as its subject, and only
                          pyp_cctool realizes a component
                          [_data/requirement/rqt_rename_keeps_guid.yaml
                          at edge relation_has_subject, and
                          src/cctool/__init__.py at the docstring
                          item].
                        - Once criticality exists, a critical
                          requirement must have a verifier whose item
                          states the procedure and what shows success
                          [_data/decision/dec_when_a_test_case_item_is_written/ruling_when_a_test_case_item_is_written.yaml
                          at brief].
                        - Each September level said which level of
                          DO-178C, IEC 62443 and ISO/SAE 21434 it
                          corresponds to
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - September said the repository is a tool,
                          takes no level from the rule, and is
                          accounted for by tool qualification, and
                          that the lever is for the segments that hold
                          what is built with the tool
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision and consequence]. Strength:
                          Moderate. Both derived options trace a level
                          to a requirement and, for two dimensions,
                          each level to the standard that names it. On
                          cc-public the levels stay at base, so the
                          gain is for peer segments. At ten times the
                          size the derivation matters more, since hand
                          copied levels drift.

