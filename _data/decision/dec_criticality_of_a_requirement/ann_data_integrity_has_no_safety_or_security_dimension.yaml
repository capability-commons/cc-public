title:                  No dimension for a requirement that guards the data
brief:                  |
                        The requirements that keep the graph sound,
                        such as rqt_edit_refuses_new_failure, are
                        about faults and data integrity, not harm to a
                        third party or a compromise. Safety and
                        security dimensions give them nowhere to
                        declare a level, and September's rule gave the
                        tooling no level at all. One criticality on
                        one scale lets such a requirement be marked
                        critical and so earn a verifier that states
                        its procedure.
description:            |
                        Sources:
                        - rqt_edit_refuses_new_failure says the
                          tooling makes no edit that would add a
                          failure to the tree, so that an edit leaves
                          the tree as sound as it found it, and its
                          subject is lco_tooling
                          [_data/requirement/rqt_edit_refuses_new_failure.yaml
                          at brief, rationale and edge].
                        - September's two dimensions are safety, as
                          harm to a third party, and security, as
                          compromise or disclosure
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - September said the repository is a tool,
                          takes no level from the rule, and is
                          accounted for by tool qualification, and
                          that the lever is for the segments that hold
                          what is built with the tool
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision and consequence].
                        - The one criticality option declares one
                          criticality on one scale and takes the
                          greatest onto code
                          [_data/decision/dec_criticality_of_a_requirement/opt_one_criticality_derived_onto_code.yaml
                          at brief].
                        - Once criticality exists, a critical
                          requirement must have a verifier whose item
                          states the procedure and what shows success
                          [_data/decision/dec_when_a_test_case_item_is_written/ruling_when_a_test_case_item_is_written.yaml
                          at brief].
                        - The no criticality option verifies every
                          requirement to the same standard
                          [_data/decision/dec_criticality_of_a_requirement/opt_no_criticality.yaml
                          at brief]. Strength: moderate. It depends on
                          the one scale meaning how bad an unmet
                          obligation is in general, and on dropping
                          the exemption of the tooling. A third
                          dimension for integrity would also answer
                          it, at the cost of another field. At ten
                          times the size more requirements guard data,
                          so the point grows.

