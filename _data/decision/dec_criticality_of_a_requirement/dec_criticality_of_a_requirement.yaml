title:                  Criticality of a requirement
brief:                  |
                        Does a requirement carry a criticality, saying
                        how bad it is if the obligation is unmet, and
                        how does it reach the code?
description:            |
                        September recorded a criticality declared on
                        each requirement in two dimensions, safety and
                        security, five levels each, with each level's
                        demands in a register and the code taking the
                        greatest criticality of the requirements it
                        implements
                        (origin/main:ddr/ddr_criticality.yaml at
                        decision). It said the tooling itself takes no
                        level, since tool qualification accounts for
                        it. The ruling on test cases asks that a
                        critical requirement's verifier state its
                        procedure once criticality exists.

