title:                  Safety and security criticality, derived onto the code
brief:                  |
                        As September recorded: a requirement may
                        declare a safety and a security criticality,
                        each on a spaced scale of five levels, and
                        code takes the greatest of each among the
                        requirements it realizes. What a level demands
                        is held in a register, not in a check.

