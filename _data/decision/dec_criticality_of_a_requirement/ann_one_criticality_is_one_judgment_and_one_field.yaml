title:                  One criticality judgment and field per requirement
brief:                  |
                        A criticality marks which requirements need a
                        procedure a person can read, so one reviewer
                        can spend attention where it counts. Two
                        dimensions mean two fields on a requirement,
                        ten register entries and two derivations onto
                        the code, and ask the reviewer to judge two
                        levels on each requirement. One criticality
                        means one field, about five entries and one
                        derivation. A change to either level moves
                        demands on code that the diff does not show.
description:            |
                        Sources:
                        - The two dimension option lets a requirement
                          declare a safety and a security criticality,
                          five levels each
                          [_data/decision/dec_criticality_of_a_requirement/opt_criticality_in_two_dimensions_derived_onto_code.yaml
                          at brief].
                        - The one criticality option declares one
                          criticality on one scale and takes the
                          greatest onto code
                          [_data/decision/dec_criticality_of_a_requirement/opt_one_criticality_derived_onto_code.yaml
                          at brief].
                        - September's two-dimension design holds ten
                          register entries, a level for each dimension
                          on a requirement, a responsibility
                          declaration on the relation register, and an
                          effective level computed for each dimension
                          [origin/main:ddr/ddr_criticality.yaml at
                          consequence].
                        - September derived criticality along
                          relations that declare responsibility,
                          taking the greatest among the requirements
                          that reach an item
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - September rejected one dimension because it
                          applies each dimension's objectives to items
                          only the other made critical
                          [origin/main:ddr/ddr_criticality.yaml at
                          alternative].
                        - September said a further dimension is cheap
                          to add once the register holds what a
                          dimension means
                          [origin/main:ddr/ddr_criticality.yaml at
                          rationale].
                        - Once criticality exists, a critical
                          requirement must have a verifier whose item
                          states the procedure and what shows success
                          [_data/decision/dec_when_a_test_case_item_is_written/ruling_when_a_test_case_item_is_written.yaml
                          at brief].
                        - Dev holds four requirement items and no
                          criticality type [_data/requirement/, four
                          files, measured by Claude in the cloud
                          container, 2026-10-28].
                        - The guidance asks that a field be added only
                          when a real instance needs it
                          [AGENTS.md#keep-it-small].
                        - All software is reviewed by one maintainer
                          [owner's statement, 2026-10-28]. Strength
                          for reviewability: Weak to moderate. It
                          halves the levels to judge, but September's
                          reason for two dimensions serves other
                          concerns and may outweigh it. The hidden
                          effect of a level change on code applies to
                          both derived options and needs the derived
                          level reported. At ten times the size the
                          count of judgments grows with requirements.
                          Strength for simplicity: strong on the
                          count. With four requirements and none built
                          for a vehicle, nothing yet needs a second
                          dimension, and September's own words say one
                          can be added later. At ten times the size
                          the derivation runs once per dimension over
                          every item, so a second one doubles that
                          work.

