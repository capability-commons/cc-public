title:                  One criticality, derived onto code
brief:                  |
                        A requirement may declare one criticality, on
                        one scale, and code takes the greatest
                        criticality among the requirements it
                        realizes. Criticality in two dimensions, and
                        no criticality, are rejected. Ruled by WTP on
                        2026-10-28.

