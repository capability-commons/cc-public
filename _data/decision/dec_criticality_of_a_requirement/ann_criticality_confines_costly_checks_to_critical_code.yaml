title:                  Costly verification only where failure matters
brief:                  |
                        With no criticality, every requirement is
                        verified to the same standard, so the
                        overnight run must give all code the most
                        stringent checks or none. A criticality
                        derived onto the code lets it give the costly
                        checks only to code that realizes a critical
                        requirement. Deriving it is one maximum over
                        the code's edges to requirements, which costs
                        little.
description:            |
                        Sources:
                        - The no criticality option verifies every
                          requirement to the same standard
                          [_data/decision/dec_criticality_of_a_requirement/opt_no_criticality.yaml
                          at brief].
                        - Both derived options have code take the
                          greatest criticality among the requirements
                          it realizes
                          [_data/decision/dec_criticality_of_a_requirement/opt_one_criticality_derived_onto_code.yaml
                          and
                          opt_criticality_in_two_dimensions_derived_onto_code.yaml
                          at brief].
                        - A dimension a requirement does not declare
                          is at its base level, which requires nothing
                          beyond the base
                          [origin/main:ddr/ddr_criticality.yaml at
                          decision].
                        - The slow run took 17 min 8 s real on an
                          8-core machine, and most of the full gate's
                          time is in tests marked slow, which grow
                          with the data
                          [_data/decision/dec_release_gate/ann_first_release_gate_took_17_to_26_minutes.yaml
                          at brief and description].
                        - Dev holds four requirement items and no
                          criticality type [_data/requirement/, four
                          files, measured by Claude in the cloud
                          container, 2026-10-28].
                        - ASSUMPTION: the overnight run selects costly
                          checks by the derived criticality. Strength:
                          moderate. Today there are few requirements,
                          so the saving is small. At ten times the
                          size the derivation stays linear in edges
                          while the cost of verifying everything to
                          the top standard grows with the whole tree.
                          Cost does not separate one dimension from
                          two.

