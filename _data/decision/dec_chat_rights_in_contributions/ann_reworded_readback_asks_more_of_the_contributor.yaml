title:                  Readback of the contributor's own words
brief:                  |
                        Rewording every answer means the contributor
                        confirms text they did not write, which takes
                        more attention and lets shifts in meaning
                        pass. One assent question per contributor lets
                        the bot keep their words, so the readback is
                        mostly recognition.
description:            |
                        The facts-only option records the facts a
                        contributor gives, reworded by the bot, and
                        asks for no assent
                        (_data/decision/dec_chat_rights_in_contributions/opt_record_facts_only.yaml,
                        brief). The assent option asks each
                        contributor once to agree that what they
                        supply is recorded under the license of the
                        repository
                        (_data/decision/dec_chat_rights_in_contributions/opt_one_time_assent.yaml,
                        brief). The owner intends a readback to the
                        contributor before the item is written to the
                        branch of the bot
                        (_data/decision/dec_chat_review_gates/opt_readback_and_branch_review.yaml,
                        brief, and owner's statement). The readback
                        happens after any automated checks and
                        corrections are applied (owner's statement).
                        ASSUMPTION: a person checks text faster and
                        more reliably when it is in their own words
                        than when it is a paraphrase they must compare
                        with what they meant. ASSUMPTION: the assent
                        question costs one turn per contributor, asked
                        once, and needs a plain-language summary of
                        the license to be understood. The concern
                        measures time to complete a task and errors
                        per task (_data/register/reg_concern.yaml at
                        entries.concern_interaction_capability.measure).
                        Holds at ten times the size: yes, because the
                        assent is asked once per contributor while the
                        cost of checking a paraphrase recurs in every
                        readback of every item.

