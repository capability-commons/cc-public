title:                  No judgment per item needed for uniform rights fields
brief:                  |
                        When rights come from the project item, the
                        reviewer can skip them. A contributor name in
                        each copyright field makes the rights of every
                        item a thing to read and check.
description:            |
                        Every standalone item carries a copyright
                        field (_data/schema/sch_trait_rights.yaml at
                        required; for example
                        _data/decision/dec_chat_host/dec_chat_host.yaml
                        at copyright), and a register entry is covered
                        by the rights of its register
                        (_data/schema/sch_register_entry.yaml,
                        description). The copyright option names the
                        contributor in the copyright field of each
                        item they supply
                        (_data/decision/dec_chat_rights_in_contributions/opt_contributor_in_copyright_field.yaml
                        at brief). The assent option asks each
                        contributor once and keeps the assent in
                        private (opt_one_time_assent.yaml at brief).
                        The facts option records only facts, reworded
                        by the bot, with no assent
                        (opt_record_facts_only.yaml at brief).
                        ASSUMPTION: a reviewer of a reworded item
                        cannot tell whether the wording kept the facts
                        unless the words of the contributor are at
                        hand. Holds at ten times the size: yes,
                        because a field that differs per item costs a
                        check per item, while a uniform field costs
                        nothing however many items there are.

