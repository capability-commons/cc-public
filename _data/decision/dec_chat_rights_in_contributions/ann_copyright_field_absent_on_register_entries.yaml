title:                  Copyright field only on standalone items
brief:                  |
                        cctool gives rights fields only to a
                        standalone item, so naming the contributor in
                        the copyright field cannot work for a type
                        held in a register. The option covers only
                        part of the types a bot may serve.
description:            |
                        A new standalone item takes copyright, license
                        and protective_mark from file_pyproject
                        (src/cctool/edit/edit.py lines 104-105 and
                        1204-1216). Rights are added only when the
                        item has no register, and a register entry
                        gets an alias list instead
                        (src/cctool/edit/edit.py lines 470-472 and
                        484-490). A field given to cctool new is
                        applied after the rights, so a standalone item
                        can carry a copyright other than the default
                        (src/cctool/edit/edit.py lines 485-487). Bots
                        are meant to populate items of various types
                        (owner's statement). Holds at ten times the
                        size: yes, because the split between
                        standalone and register types does not change
                        with the number of items.

