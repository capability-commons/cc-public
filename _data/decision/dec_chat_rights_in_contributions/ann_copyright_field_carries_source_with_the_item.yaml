title:                  Source of the wording held in the item itself
brief:                  |
                        Naming the contributor in the copyright field
                        puts the source of an item in a schema-checked
                        field that travels with the item. The other
                        options keep that link only in private or in
                        git history.
description:            |
                        The copyright field says who owns the item, as
                        a full notice with year and owner
                        (_data/schema/sch_trait_rights.yaml lines
                        95-103). New standalone items today take their
                        rights from file_pyproject
                        (src/cctool/edit/edit.py line 104 and function
                        _rights at lines 1204-1215), so every item
                        names the same owner. Who and when of an item
                        come from the commit that adds it
                        (_data/decision/dec_author_and_time_of_items),
                        and items copied without history lose them
                        (ann_author_and_time_lost_in_copies_without_history).
                        opt_one_time_assent keeps the assent in
                        private, and opt_record_facts_only asks for no
                        assent (their option files). The owner of the
                        rights and the source of the facts are
                        different ideas, so the field is an imperfect
                        place for provenance (ASSUMPTION). Holds at
                        ten times the size: yes, because the field is
                        per item and needs no lookup outside the item.

