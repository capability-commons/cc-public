title:                  Contributor name in every item
brief:                  |
                        Naming the contributor in the copyright field
                        writes a personal name into each item they
                        supply, which is the most personal data fields
                        of the three options. Recording reworded facts
                        with no assent holds no field about the
                        contributor at all.
description:            |
                        The option names the contributor in the
                        copyright field of each item they supply
                        [_data/decision/dec_chat_rights_in_contributions/opt_contributor_in_copyright_field.yaml,
                        brief]. The one-time assent option keeps the
                        assent in private
                        [_data/decision/dec_chat_rights_in_contributions/opt_one_time_assent.yaml,
                        brief]. The facts-only option records facts
                        reworded by the bot and asks for no assent
                        [_data/decision/dec_chat_rights_in_contributions/opt_record_facts_only.yaml,
                        brief]. The concern measures personal data
                        fields held, by count
                        [_data/register/reg_concern.yaml lines
                        741-742]. Personal data lives only in private
                        repositories [owner's statement]. Holds at ten
                        times the size: yes, because the copyright
                        field grows with every item, while an assent
                        record grows only with contributors and the
                        facts-only option holds none.

