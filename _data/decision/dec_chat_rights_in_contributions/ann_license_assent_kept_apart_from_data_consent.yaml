title:                  License assent separate from data protection consent
brief:                  |
                        One-time assent gives one recorded moment per
                        contributor where the terms are set, which the
                        project can show later. It works only if the
                        assent is a license grant alone, because data
                        protection consent can be withdrawn at any
                        time and must be asked for separately from
                        other matters.
description:            |
                        Consent is one lawful basis for processing,
                        and legitimate interests is another [UK GDPR
                        Art 6(1)(a) and 6(1)(f),
                        https://www.legislation.gov.uk/eur/2016/679/chapter/II].
                        Where a written declaration covers other
                        matters, the request for consent must be
                        clearly distinguishable from them [UK GDPR Art
                        7(2), same URL]. Consent can be withdrawn at
                        any time, as easily as it was given [UK GDPR
                        Art 7(3), same URL]. Where processing rests on
                        consent, the controller must be able to show
                        that the person consented [UK GDPR Art 7(1),
                        same URL]. At collection the controller must
                        state the purposes and the lawful basis [UK
                        GDPR Art 13(1)(c),
                        https://www.legislation.gov.uk/eur/2016/679/article/13].
                        The assent option asks each contributor once
                        to agree that what they supply is recorded
                        under the license of the repository, and keeps
                        the assent in private
                        [_data/decision/dec_chat_rights_in_contributions/opt_one_time_assent.yaml,
                        brief]. cc-public is published under
                        Apache-2.0 [LICENSE]. New standalone items
                        take copyright and license from the segment
                        item of the tree [src/cctool/edit/edit.py
                        within _rights]. ASSUMPTION: a license grant
                        is meant to last, so it should not rest on a
                        basis the person can withdraw. ASSUMPTION: the
                        assent record itself, who agreed and when, is
                        personal data with its own retention period.
                        Holds at ten times the size: yes, because the
                        record grows with contributors, not items, and
                        one assent per person stays one record.

