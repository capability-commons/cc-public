title:                  Consumed trees restated in every invocation
brief:                  |
                        With roots on the command line, what a peer
                        consumes is restated in every task, hook and
                        script that runs a command. A change to what
                        is consumed, or where it is read from, touches
                        each of them. The previous iteration found
                        this pattern fragile when first used from a
                        consumer.
description:            |
                        Sources:
                        - cc-public runs its commands through pixi
                          tasks and git hooks (pyproject.toml header,
                          lines 18-28).
                        - In the previous iteration, three of the six
                          faults found when the tool was first tried
                          from a consumer segment were about how
                          commands named their trees (legacy
                          ddr_one_name_for_a_tree.yaml lines 26-44).
                        - Its fix meant every task list naming the
                          commands had to change with them (legacy
                          ddr_one_name_for_a_tree.yaml lines 145-148).
                        - The consumes-edges option reads consumed
                          content from the installed package, or from
                          a local checkout while the peer is switched
                          to one
                          (_data/decision/dec_how_a_segment_declares_itself/opt_segment_item_with_consumes_edges.yaml,
                          brief).
                        - ASSUMPTION: the path to an installed
                          package's _data differs by environment and
                          host, so a root naming it would differ on
                          atlas and in the cloud container. Strength:
                          moderate today with one peer and few tasks;
                          it grows with each peer, task and consumed
                          segment.

