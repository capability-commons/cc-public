title:                  A segment item that records the release consumed
brief:                  |
                        Each segment holds one segment item whose
                        consumes edge names the release item of each
                        segment it consumes, by id and guid, rather
                        than a version string, so the declaration is a
                        plain edge in the graph and not tied to pixi
                        or pyproject.toml, and moves unchanged to a
                        graph database. The check compares the edge
                        with the release items the consumed tree
                        holds, reading neither pixi nor
                        pyproject.toml, and the peer command that
                        upgrades a peer rewrites the edge as it moves
                        the pin. A disagreement is a failure while the
                        peer is on a release, and a notice while it is
                        switched to a local checkout, which may hold
                        no release item. Restating the pin is
                        acceptable because it is mechanically checked.
                        Ruled by William Payne on 2026-10-24.

