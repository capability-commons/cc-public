title:                  A consumed release recorded beyond the pixi files
brief:                  |
                        Ids change between releases and each release
                        ships its renames, so a reader must know which
                        release a segment's references were written
                        against. When only the pixi manifest and lock
                        record the release, a partner must read pixi's
                        files to learn it, and a pin there assumes
                        pixi installs the tool. The maintainer wants a
                        route that installs cctool system-wide, and
                        under it nothing in the peer says which
                        release it expects. A release recorded on the
                        segment item is read from the data, travels
                        with the peer under any route, and the check
                        reports when the installed tool differs from
                        it.
description:            |
                        Sources:
                        - The consumes-edges option records which
                          release is consumed only in the peer's pixi
                          manifest and lock
                          (_data/decision/dec_how_a_segment_declares_itself/opt_segment_item_with_consumes_edges.yaml
                          lines 12-19).
                        - The records-release option records the
                          release on each consumes edge, and a check
                          compares it with the installed package
                          (_data/decision/dec_how_a_segment_declares_itself/opt_segment_item_records_the_release.yaml
                          lines 12-17).
                        - Each release ships the renames it makes, and
                          a command in the peer rewrites each
                          reference to the id its guid names in the
                          release it takes
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 13-17).
                        - cc-public's environment is managed by pixi
                          (pyproject.toml lines 19-27 and 64-66).
                        - The maintainer wants a route that installs
                          cctool system-wide so that people can create
                          peer repositories easily, which needs
                          decisions of its own (owner's statement,
                          2026-10-24;
                          _data/decision/dec_commands_for_peers/ruling_peer_command_group.yaml
                          lines 17-22).
                        - The peer command group switches a peer
                          between a release and a local checkout
                          (_data/decision/dec_commands_for_peers/ruling_peer_command_group.yaml
                          lines 12-16).
                        - ASSUMPTION: a partner that reads a segment
                          with its own tooling does not use pixi.
                        - ASSUMPTION: a system-wide install may serve
                          several peers that pin different releases.
                        - ASSUMPTION: while a peer is switched to a
                          local checkout, the comparison needs a rule
                          of its own, since the installed code is then
                          not a release. Strength: moderate; the
                          install route it rests on is not yet
                          decided, and it holds at ten times the
                          segments and peers, when readers must map
                          ids across many releases and installs on one
                          machine are shared.

