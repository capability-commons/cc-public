title:                  Each fact of a segment recorded once
brief:                  |
                        A segment item with consumes edges puts what a
                        segment consumes in the graph, where the rules
                        already read edges, and leaves which release
                        is taken to the pixi manifest and lock.
                        Recording the release on the item too states
                        one fact twice and adds a check to keep the
                        two in step. The project file moves
                        consumption out of the graph into TOML, which
                        cctool does not read today, beside the
                        dependency entry that already names the
                        package.
description:            |
                        Sources:
                        - The rules read relations as edges, either
                          way round (src/cctool/graph/derive.lp lines
                          62-68).
                        - The ruled peer command group already reports
                          which release a peer pins
                          (_data/decision/dec_commands_for_peers/ruling_peer_command_group.yaml
                          lines 12-16).
                        - No module of the tool imports tomllib or
                          reads pyproject.toml as TOML; only a test
                          does (grep over src/cctool;
                          src/cctool/cli/_test/test_guidance.py lines
                          35 and 176).
                        - cc-public's pyproject.toml names its
                          packages for pixi in a tool.pixi table
                          (pyproject.toml lines 68-70,
                          tool.pixi.pypi-dependencies).
                        - ASSUMPTION: a peer such as cc-patrol keeps
                          its pixi manifest in pyproject.toml, as
                          cc-public does.
                        - In the previous iteration a segment item
                          cost a type, a schema, a relation and a
                          check (legacy ddr_segment.yaml lines
                          104-106). Strength: strong for the
                          release-recording option, whose extra check
                          exists only to hold the duplicate; moderate
                          against the project file, which saves the
                          type and schema but adds a reader.

