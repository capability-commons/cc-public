title:                  No direction to keep private ids out of cc-public
brief:                  |
                        With roots named on the command line, a
                        reference may run into any tree named, so when
                        a cc-public checkout and a private peer are
                        named together nothing refuses a cc-public
                        item that names a peer item. That reference
                        writes the private id and guid into cc-public.
                        A declared consumption gives the check a
                        direction to refuse it at once, as the ruled
                        downward consumption needs. Each declaring
                        option gives that direction, so the choice
                        among them is not a security one.
description:            |
                        Sources:
                        - The September iteration refused, as
                          critical, a reference into a
                          segment that consumes the holder's own, which kept the core free
                          of its consumers (legacy ddr_segment.yaml lines 47-53 and 82-86).
                        - A reference records the id and guid of what
                          it names in the
                          holder's file (src/cctool/graph/extract.py within PREDICATE).
                        - cc-patrol is private (owner's statement,
                          2026-10-21).
                        - The release gate runs cctool check on the
                          _data the package ships
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml at brief), where a reference to a peer item would not resolve and
                          fail as dangling (src/cctool/check/check.lp within dangling_reference).
                        Strength: moderate; the release gate still
                        catches such a reference late, so the gain is
                        refusing it where it is written, and at ten
                        times the peers the number of trees named
                        together grows.

