title:                  A segment item with consumes edges
brief:                  |
                        Each segment holds one segment item in its own
                        tree, with an edge to the segment item of each
                        segment it consumes. Which release is consumed
                        is recorded only in the peer's pixi manifest
                        and lock. The consumed content is read from
                        the installed package's _data, or from a local
                        checkout while the peer is switched to one.

