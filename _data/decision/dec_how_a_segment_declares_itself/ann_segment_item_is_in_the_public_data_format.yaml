title:                  A declaration in the public data format
brief:                  |
                        A segment item is written in the data format,
                        which is the part of cc-public that is public.
                        A partner with its own tooling reads which
                        segments a segment consumes the same way it
                        reads any other item. A table for cctool in
                        pyproject.toml is tool configuration outside
                        that format, and roots named on the command
                        line leave no record a partner can read at
                        all.
description:            |
                        Sources:
                        - The data format is public, and names YAML
                          1.2 and JSON Schema 2020-12
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml at brief).
                        - The project-file option declares a segment
                          in a table for cctool in pyproject.toml, and
                          no data item declares it
                          (_data/decision/dec_how_a_segment_declares_itself/opt_segment_declared_in_project_file.yaml at brief).
                        - The command-line option declares nothing,
                          and each command takes its trees as repeated
                          root options
                          (_data/decision/dec_how_a_segment_declares_itself/opt_roots_named_on_the_command_line.yaml at brief).
                        - In cc-public's pyproject.toml, the tables
                          hold project, build, pixi, test and lint
                          settings, and only the comment header is an
                          item (pyproject.toml at project, build-system and tool).
                        - In the previous iteration, a consuming
                          segment may replace the tool, and what no
                          segment can do without is the data (legacy
                          ddr_tooling_travels.yaml lines 47-60).
                          Strength: moderate; it holds at ten times
                          the partners, and grows as more of them
                          bring their own tooling.

