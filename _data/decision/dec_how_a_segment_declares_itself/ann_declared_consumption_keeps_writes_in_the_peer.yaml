title:                  Writes kept out of a consumed tree
brief:                  |
                        With roots on the command line, which tree a
                        command writes to rests on the order of the
                        options, and the September iteration found a
                        consumer's item landing in the core, placed by
                        a rule that counted across every root, with
                        nothing reporting it. An item written into a
                        cc-public checkout takes cc-public's rights,
                        the public mark among them, and personal data
                        in it would ship in the next wheel. A
                        declaration of what is consumed lets a writing
                        command refuse every consumed tree, whatever
                        the order.
description:            |
                        Sources:
                        - Under the roots option the first root named
                          is the tree worked on
                          (_data/decision/dec_how_a_segment_declares_itself/opt_roots_named_on_the_command_line.yaml,
                          brief).
                        - In the September iteration a consumer
                          running the prescribed
                          invocation wrote its item into the core, and neither fault found
                          was reported by anything (legacy ddr_item_rights.yaml lines 40-53).
                        - A new item takes its copyright, license and
                          protective mark from
                          the file_pyproject item of its tree (src/cctool/edit/edit.py lines
                          106-109 and 1649-1660), and cc-public's carries the public mark
                          (pyproject.toml lines 1-11).
                        - Personal data lives only in private
                          repositories (owner's
                          statement, 2026-10-22).
                        - cc-public's _data ships in the wheel
                          (owner's statement,
                          2026-10-24).
                        - ASSUMPTION: a declaring option would be
                          built so that writing
                          commands refuse a consumed tree; no option text says so.
                        Strength: moderate; it arises only while a
                        checkout of a consumed segment is named, but
                        every peer that works on cc-public meets it,
                        and it grows with the number of peers.

