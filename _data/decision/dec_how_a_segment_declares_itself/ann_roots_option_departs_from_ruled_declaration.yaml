title:                  Roots option at odds with the ruled declaration
brief:                  |
                        The ruled option has each repository declare a
                        segment and what it consumes, with references
                        never running upward or sideways. Roots named
                        on the command line declare nothing and let a
                        reference run into any tree named, so the
                        direction rule has nothing to read. The option
                        adds the fewest mechanisms, but it does not
                        follow from the decision already made, and the
                        direction would need a mechanism of its own
                        later.
description:            |
                        Sources:
                        - References across instances are ruled as
                          segments with directional consumption
                          (_data/decision/dec_references_across_instances/ruling_references_across_instances.yaml
                          lines 12-17).
                        - That option has each repository declare a
                          segment and the segments it consumes, and a
                          reference never runs upward or sideways
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 12-18).
                        - The roots option lets a reference run into
                          any tree named
                          (_data/decision/dec_how_a_segment_declares_itself/opt_roots_named_on_the_command_line.yaml,
                          brief).
                        - Every --root option takes a single directory
                          today: 28 commands take one, from 11
                          declarations, and none is multiple=True
                          (src/cctool/cli, for example
                          src/cctool/cli/editing.py lines 84-90).
                          Strength: strong while the direction ruling
                          stands, and the same at ten times the size.

