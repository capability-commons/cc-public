title:                  Recorded release as visibility, not integrity
brief:                  |
                        A segment item that records the release
                        consumed, compared with the installed package,
                        makes a peer that runs on another release or
                        on a local checkout show it in its own check.
                        The pixi lock already holds a hash for each
                        locked package, which is the stronger
                        integrity control, and the ruled command group
                        already reports the pin. So the recorded
                        release adds visibility of a switch, and
                        nothing that verifies what was installed.
description:            |
                        Sources:
                        - A command that switches to a local checkout
                          must make that state
                          visible, or it becomes a quiet way around the pin
                          (_data/decision/dec_commands_for_peers/ann_local_checkout_switch_bypasses_pin.yaml,
                          brief).
                        - pixi.lock records a sha256 hash for each
                          package it locks
                          (_data/decision/dec_how_peers_get_cc_public/ann_package_hash_lets_peer_verify_release.yaml,
                          description).
                        Strength: weak; the gain is a second, checked
                        place where a switch shows, and it holds
                        unchanged at ten times the size.

