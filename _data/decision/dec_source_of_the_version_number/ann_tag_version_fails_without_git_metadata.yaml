title:                  Version lookup without git metadata
brief:                  |
                        A version read from the tag needs git metadata
                        at build time, so a partner who builds from a
                        source archive or another copy without the tag
                        gets an error or a fallback version unless
                        archive support is set up. A version written
                        in pyproject.toml is present in every copy of
                        the tree.
description:            |
                        Sources: hatch-vcs raises an error when it
                        cannot detect a version and no fallback is set
                        (https://github.com/ofek/hatch-vcs/blob/master/README.md
                        line 61). hatch-vcs takes the version through
                        setuptools-scm, which needs the repository
                        metadata, a fallback_version or
                        SETUPTOOLS_SCM_PRETEND_VERSION
                        (https://setuptools-scm.readthedocs.io/en/latest/config/),
                        and supports git archives only with a
                        .git_archival.txt set up
                        (https://github.com/pypa/setuptools-scm/blob/main/docs/usage.md
                        lines 546-556). The build backend is hatchling
                        (pyproject.toml lines 53-55). Assumptions: a
                        tag-derived version would use hatch-vcs or a
                        similar plugin, and some route peers use may
                        lack the tag. Strength: moderate; the fault
                        has a standard guard (fail the build when no
                        tag is found) and the release gate's fresh
                        install would catch it.

