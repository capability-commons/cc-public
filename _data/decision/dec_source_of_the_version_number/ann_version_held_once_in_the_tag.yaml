title:                  Single holder of the version number
brief:                  |
                        Read from the tag, the version has one holder,
                        so the tag and the package metadata cannot
                        disagree and every version traces to one
                        release. Written in pyproject.toml, it has two
                        holders that a hand edit at each release must
                        keep equal, and that edit can drift.
description:            |
                        Sources: the decision asks where the version
                        should be held "so that the tag and the
                        package agree"
                        (_data/decision/dec_source_of_the_version_number/dec_source_of_the_version_number.yaml
                        lines 11-15). pyproject.toml says version
                        0.1.0 and no release has been made
                        (pyproject.toml line 38; context note,
                        _sources/context.md line 33). hatch-vcs is a
                        hatchling plugin that sets the version from
                        git tags (https://github.com/ofek/hatch-vcs).
                        For a partner who installs a built package,
                        both options put the version in the package
                        metadata, so agreement of tag and metadata is
                        what the partner's resolver relies on. The tag
                        must exist in either option, so the pyproject
                        field is the only copy that can be removed.
                        Strength: strong for simplicity, moderate
                        otherwise, since a check or the release gate's
                        build from the tag could hold the two equal.

