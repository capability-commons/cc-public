title:                  Version from the tag that changes at every commit
brief:                  |
                        Read from the tag, the version of a commit
                        after a release is not the release number but
                        one made from the next version, the distance
                        from the tag and the commit hash, so it
                        changes at every commit. The lock records the
                        version of the local package, so if pixi
                        compares that version, each commit makes the
                        lock stale and every hook run with --locked
                        refuses; if it does not, the lock holds a
                        version that is wrong between releases. A
                        version written in pyproject.toml stays the
                        same between releases. A short test with pixi
                        settles which holds.
description:            |
                        Sources: the default scheme of setuptools-scm
                        gives the tag itself at a tagged commit, and
                        "{next_version}.dev{distance}+{scm
                        letter}{revision hash}" at a later one, with a
                        date added when the working copy has changes
                        (https://setuptools-scm.readthedocs.io/en/latest/usage/,
                        section "Default versioning scheme").
                        hatch-vcs takes the version through
                        setuptools-scm, which it requires at 8.2.0 or
                        later (https://pypi.org/pypi/hatch-vcs/json,
                        requires_dist). The lock records the local
                        package at version 0.1.0 with a sha256
                        (pixi.lock lines 722-725). Every hook runs
                        pixi with --locked (.githooks/pre-commit line
                        30; .githooks/pre-push line 33), and a
                        manifest changed without a new lock is refused
                        (_data/decision/dec_environment_manager/ruling_environment_manager.yaml
                        lines 13-19). pixi checks that "All hashes for
                        the pypi editable packages are correct"
                        (https://pixi.prefix.dev/dev/workspace/lock_file/).
                        Lock file version 7 removes the input hashes
                        of source trees, and its satisfiability check
                        agrees with the resolution
                        (https://prefix.dev/blog/lock-file-v7); this
                        lock is at version 6 (pixi.lock line 1).
                        Assumptions: under lock version 6 pixi
                        compares only the hash of the manifest, so a
                        changing version leaves the lock fresh but
                        wrong; under version 7 it may compare the
                        version and refuse. Not tested in this review,
                        since the pixi on the review machine only runs
                        tasks. Strength: moderate; a test of a few
                        minutes settles it, and a local scheme with no
                        local version narrows the change to the
                        distance but does not remove it.

