title:                  Version in a version file
brief:                  |
                        The version is written in one file in the tree
                        that hatchling reads when the package is
                        built, and the release step edits it from the
                        computed bump. Ruled by WTP on 2026-10-24, as
                        recommended. The file is a small module in the
                        cctool package with its own item, and the
                        command line reports it through Click's
                        version option. pixi is to be upgraded from
                        0.66 soon, as a separate step.

