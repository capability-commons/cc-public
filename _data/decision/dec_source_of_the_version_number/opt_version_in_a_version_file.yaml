title:                  Version written in a version file
brief:                  |
                        The version is written in one file in the tree
                        that hatchling reads when the package is
                        built, and the release step edits it from the
                        computed bump. pyproject.toml declares the
                        version dynamic, so the edit needs no relock
                        and no build plugin.

