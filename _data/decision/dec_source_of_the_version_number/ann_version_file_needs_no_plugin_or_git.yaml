title:                  Version file read without a plugin or git metadata
brief:                  |
                        A version file is read by hatchling itself, so
                        it adds no build plugin, and a build from an
                        archive with no git metadata still finds its
                        version. Like a version in pyproject.toml, it
                        sits in the tree where an item can hold it and
                        a check can hold the release tag equal to it,
                        which a version read from the tag cannot
                        offer.
description:            |
                        Sources: hatchling's built-in version source
                        "regex" reads the version from a file named by
                        path (https://hatch.pypa.io/latest/version/,
                        "Configuration"), and it built version 0.2.0
                        from an edited file with no plugin in the
                        review of 2026-10-24. The tag option needs
                        hatch-vcs, which requires setuptools-scm 8.2.0
                        or later
                        (_data/decision/dec_source_of_the_version_number/ann_tag_version_adds_a_build_plugin.yaml,
                        description), and fails where no git metadata
                        is found unless a fallback is set
                        (ann_tag_version_fails_without_git_metadata.yaml
                        in the same folder). A version in the tree is
                        seen by the graph
                        (ann_version_in_tree_is_seen_by_the_graph.yaml
                        in the same folder). The package build has
                        only the hatchling backend today
                        (pyproject.toml at build-system). Assumption:
                        the file is a Python module under src/cctool,
                        so it needs a module docstring item like every
                        other module, or a file outside src with a
                        pattern set for it. Limit: the version is then
                        held twice, in the file and in the release
                        tag, so a check must hold the two equal; the
                        tag option holds it once. Strength: moderate;
                        the plugin and the git metadata cost stay the
                        same at any scale, and the second copy is
                        checked at one point.

