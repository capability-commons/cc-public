title:                  Possible resolve-time cost of a dynamic version
brief:                  |
                        A version read from git at build time is
                        dynamic metadata, which a resolver can learn
                        only by running the build backend, and that
                        may add work whenever an environment is
                        checked or installed. This point is not
                        verified.
description:            |
                        Sources: the package is built by hatchling
                        (pyproject.toml at build-system) and installed
                        as an editable path dependency (pyproject.toml
                        at
                        tool.pixi.feature.tool.pypi-dependencies.cc_public).
                        pixi lock file version 7 removed input hashes
                        for source trees, and the satisfiability check
                        now agrees with the resolution
                        (https://prefix.dev/blog/lock-file-v7); this
                        repository's lock is at version 6 (pixi.lock).
                        Assumption: pixi must build or query metadata
                        to learn a dynamic version, at lock time or at
                        --locked checks; the sources checked do not
                        confirm this. Strength: weak; the claim is
                        unverified and the cost, if real, is likely
                        seconds.

