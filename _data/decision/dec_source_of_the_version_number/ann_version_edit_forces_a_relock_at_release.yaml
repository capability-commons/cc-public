title:                  Relock forced by a version edit at each release
brief:                  |
                        Any edit to pyproject.toml makes pixi.lock
                        stale, so a version written there means a code
                        gate run of about 78 s instead of 10 s and a
                        relock at every release, urgent patches
                        included. The pre-push hook refuses until
                        someone with network access relocks against
                        the live package indexes, which atlas cannot
                        do. Reading the version from the tag edits
                        nothing, so it should avoid all three, though
                        whether the lock stays stable with a version
                        read from tags is untested.
description:            |
                        Sources: pixi.lock hashes the local package's
                        metadata; any edit to pyproject.toml makes the
                        lock stale and the pre-push hook, run with
                        --locked, refuses; the atlas VM has no
                        network, so only the owner can relock (context
                        note, _sources/context.md line 30). Every hook
                        runs pixi with --locked (.githooks/pre-commit;
                        .githooks/pre-push). The lock records the
                        local package's version and a sha256 of its
                        metadata (pixi.lock). The gate treats src,
                        pyproject.toml, pixi.lock and .githooks as
                        code and runs the tests only when one is
                        staged (src/cctool/gate/gate.py within
                        TUPLE_CODE; README.md#getting-started). A code
                        commit takes about 78 s in the gate and a
                        data-only commit about 10 s (context note,
                        _sources/context.md line 31). Assumptions: a
                        relock that changes only the local version
                        keeps the other locked versions where they
                        still satisfy their ranges; whether a version
                        read from tags leaves the lock stable between
                        tags is not checked. Limit: the lock is at
                        version 6 (pixi.lock), and lock file version 7
                        removes the input hashes of source trees
                        (https://prefix.dev/blog/lock-file-v7), which
                        may change this. Strength: strong on observed
                        behavior.

