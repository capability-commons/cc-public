title:                  Lock made stale by a pyproject edit and not by a dynamic version
brief:                  |
                        With the pixi the project uses, any edit to
                        pyproject.toml, even its description, makes
                        the lock stale, so a version written there
                        needs a relock at each release. A version that
                        is dynamic, from the tag or from a version
                        file, left the lock fresh across later commits
                        and a new tag, and the built package took the
                        new version.
description:            |
                        Sources: a test in the review of 2026-10-24 on
                        scratch clones of dev at dd17313b, with pixi
                        0.66.0, the version in the owner's environment
                        (.pixi/envs/default/conda-meta/pixi on the
                        owner's machine). A version edit from 0.1.0 to
                        0.2.0 in pyproject.toml, and separately a
                        description edit, each made pixi install
                        --locked refuse with "lock-file not up-to-date
                        with the workspace". With hatch-vcs (version
                        dynamic, read from the tag) relocked once,
                        pixi install --locked passed after one more
                        commit, after a new tag v0.2.0, and in a fresh
                        clone, and a wheel built one commit after
                        v0.2.0 was version 0.2.1.dev1 with the commit
                        hash. With hatchling's own path source reading
                        a version file, relocked once, an edit of that
                        file from 0.1.0 to 0.2.0 left pixi install
                        --locked passing and the wheel was version
                        0.2.0. The lock records the local package at
                        version 0.1.0 (pixi.lock lines 722-725), and
                        every hook runs pixi with --locked
                        (.githooks/pre-commit line 30;
                        .githooks/pre-push line 33). Limits: the
                        editable install in a pixi environment kept
                        the version it was built with until
                        reinstalled, so only a built package shows the
                        exact version; pixi 0.83.0, which offers lock
                        format 7, refused neither edit, so an upgrade
                        of pixi would remove the relock cost of the
                        pyproject option. Strength: strong; it is
                        measured on the owner's pixi, and the relock
                        cost repeats at every release.

