title:                  Version visible to the graph when held in the tree
brief:                  |
                        pyproject.toml is itself an item, so a version
                        written there is in the tree that the checks
                        and queries read, and the commit that sets it
                        carries a commit item. A version read only
                        from a tag lives in git refs, which the
                        extractor never reads, and a copy of the tree
                        without .git names at most its commit, not its
                        release.
description:            |
                        Sources: pyproject.toml carries an item header
                        of its own (pyproject.toml). The extractor
                        skips the .git directory
                        (src/cctool/graph/extract.py within
                        SET_DIR_SKIP). git archive writes the tree
                        structure of the named tree and, in a tar
                        file, the commit id, and says nothing of tags
                        (https://git-scm.com/docs/git-archive).
                        Assumption: tools that read the version from a
                        tag need extra set-up to give a version when
                        built from an archive. Strength: weak, since a
                        release item that names the version would give
                        the graph the version without a second holder.

