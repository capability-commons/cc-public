title:                  Build plugin needed to read the version from the tag
brief:                  |
                        Reading the version from a git tag needs a
                        version-source plugin for hatchling, such as
                        hatch-vcs, and a dynamic version field, which
                        adds a third-party build dependency that every
                        build of the package must resolve. Writing the
                        version in pyproject.toml needs nothing beyond
                        hatchling.
description:            |
                        Sources: the build backend is hatchling, with
                        no other build requirement (pyproject.toml
                        lines 53-55). hatch-vcs is an MIT licensed
                        hatchling plugin that takes the version from
                        VCS tags; its latest release is 0.5.0 of
                        2025-05-27, and it takes setuptools-scm
                        parameters
                        (https://pypi.org/project/hatch-vcs).
                        pixi.lock hashes the local package's metadata
                        (context note, _sources/context.md line 30).
                        hatch-vcs requires setuptools-scm>=8.2.0
                        (https://pypi.org/pypi/hatch-vcs/json,
                        requires_dist), so the build gains two
                        packages. Assumption: a dynamic version may
                        interact with how pixi.lock records the local
                        package, which nobody has tested here.
                        Strength: moderate for dependency risk, weak
                        for simplicity, since one small plugin weighs
                        against a standing duplicate.

