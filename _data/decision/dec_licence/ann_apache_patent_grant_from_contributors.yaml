title:                  Express patent grant from contributors
brief:                  |
                        Apache-2.0 gives an express patent licence
                        from each contributor and takes contributions
                        in under the same terms, while MIT has no
                        patent clause.
description:            |
                        Apache-2.0 section 3 (patent licence and its
                        termination) and section 5 (contributions
                        under the licence unless stated otherwise)
                        (https://www.apache.org/licenses/LICENSE-2.0.txt;
                        repo LICENSE line 74 onward). MIT text:
                        https://opensource.org/license/mit. The gain
                        is small while Will is the only copyright
                        holder (NOTICE line 2), and grows with outside
                        contributions. ASSUMPTION: the legacy
                        repository, from which code was ported
                        (memory/MEMORY.md lines 37, 44), was itself
                        under Apache-2.0, so ported code needs no
                        relicensing.

