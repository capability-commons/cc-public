title:                  Licence written into every item
brief:                  |
                        The licence is a required field of every
                        standalone item and a header of every source
                        file, so a change of licence now touches over
                        a hundred files. This favours keeping the
                        chosen licence.
description:            |
                        license is required on standalone items
                        (_data/schema/sch_trait_rights.yaml lines 22,
                        46-49). git grep at 89c74d8 finds "license:
                        Apache-2.0" in 122 tracked files besides
                        pixi.lock, pyproject.toml among them (line 6,
                        and line 37 too), plus LICENSE and README.md
                        line 87. NOTICE does not name the licence. New
                        items copy the value
                        (src/cc_public/edit/edit.py lines 94-98). The
                        edit is mechanical with cctool batch
                        (README.md lines 80-83), so the cost is in the
                        spread of the change, not its difficulty. The
                        spread grows with the graph. Every item said
                        Apache-2.0 from bb8c338, before LICENSE was
                        added in a0b3f50.

