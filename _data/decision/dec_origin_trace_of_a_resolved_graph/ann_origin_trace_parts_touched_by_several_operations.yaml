title:                  Parts touched by several operations
brief:                  |
                        A node added by one operation, placed by
                        another and written by a third has three
                        reasons, and a later write can override an
                        earlier one. A last-producer trace keeps only
                        the winner, so why a node exists, and why an
                        earlier write has no effect, are still found
                        by hand. A trace of every touching operation
                        keeps the chain, at the cost of a list in
                        place of one entry per part.
description:            |
                        Sources:
                        - The mixed Orin variant places nodes of its
                          base by tag after
                          filtering. (_sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 22-35)
                        - The replay variant adds nodes and then joins
                          them.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_replay.yaml lines
                          28-63)
                        - The abstract Orin variant writes the
                          analysis profile that its
                          children inherit. (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 30-32)
                        - Last-writer-wins stacks can undo an earlier
                          layer with no record
                          of the conflict. (_sources/survey/generative-and-transforms.md
                          line 154)
                        - Two included deltas touching one key need
                          both operations named.
                          (_data/decision/dec_shape_of_a_variant_family/ann_one_chain_of_origins_per_resolved_element.yaml
                          lines 12-19)
                        - ASSUMPTION: a child may later write the same
                          setting. Strength: moderate to strong;
                          chains grow with included units, lowering
                          stages and overrides.

