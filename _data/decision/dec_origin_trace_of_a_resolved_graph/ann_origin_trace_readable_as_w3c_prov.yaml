title:                  An origin trace a provenance tool can read
brief:                  |
                        W3C PROV already has the shape of an origin
                        trace: an entity generated by an activity,
                        derived from another with the activity
                        qualified, and invalidated by an activity,
                        which covers removals. A trace in either
                        recorded form maps onto it, so a partner's
                        provenance tool could read it. No trace gives
                        a partner nothing.
description:            |
                        Sources:
                        - Generation is the completion of production
                          of a new entity by an
                          activity (section 4.1); wasGeneratedBy and wasInvalidatedBy give
                          the activities that led to the generation or invalidation of an
                          entity (section 3.2); and a qualified derivation names its
                          activity with hadActivity (section 3.3, a non-normative example).
                          (PROV-O, W3C Recommendation, 30 April 2013,
                          https://www.w3.org/TR/prov-o/)
                        Strength: weak to moderate; it depends on a
                        partner using PROV.

