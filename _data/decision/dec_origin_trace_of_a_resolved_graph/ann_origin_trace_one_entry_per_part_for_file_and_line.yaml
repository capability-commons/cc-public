title:                  One trace entry per part in place of file and line
brief:                  |
                        A trace of the operation that last produced
                        each part gives that part the file and line of
                        the operation, so the existing failure columns
                        keep working with one mechanism and one entry
                        per part. No trace leaves a failure on a
                        resolved part with no file and line to fix. A
                        trace of every touching operation keeps a list
                        per part that no current need reads.
description:            |
                        Sources:
                        - The foreign node, unknown port and port type
                          mismatch checks
                          carry file and line. (src/cctool/check/check.lp lines 3166, 3208
                          and 3345)
                        - The resolved graph is never stored, so its
                          edges have no file and
                          line.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_duplicate_edges_need_a_join_precondition.yaml
                          lines 12-21)
                        - Each failure says what is wrong and how to
                          fix it.
                          (_data/decision/dec_failure_report_form/ruling_failure_report_form.yaml
                          lines 12-15)
                        - An element produced inside a composite has
                          two origins, the
                          composite and the core operation within it, so one entry per part
                          holds only if composites are not ruled in.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_composite_traces_through_two_levels.yaml
                          lines 12-20)
                        - The simplicity measure counts distinct
                          mechanisms and jobs done
                          by more than one mechanism. (_data/register/reg_concern.yaml lines
                          489-490)
                        Strength: strong; the record is one entry per
                        part at any scale.

