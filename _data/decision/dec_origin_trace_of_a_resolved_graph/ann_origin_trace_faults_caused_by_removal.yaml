title:                  Faults caused by a removal
brief:                  |
                        Some Patrol faults would come from a removal:
                        a filter drops the only edge into a required
                        input, and the unfed input check fires on a
                        node whose own trace shows only the base. Both
                        trace options record origins only for parts
                        that are present, so they name the filter only
                        if the resolver also records what each
                        operation removed. No trace names nothing.
description:            |
                        Sources:
                        - The unfed input check is a negation: a
                          required input with no
                          edge. (src/cctool/check/check.lp within unfed_input)
                        - A presence tag filter removes the nodes that
                          carry the presence tag, with their edges,
                          and the edges that carry it.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 21-25; _sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 40-43)
                        - Failures should name the variant and the
                          operation that
                          introduced the fault. (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - Both trace options record, for each part of
                          the resolved graph,
                          the operations that produced or touched it. (the two trace
                          options, briefs)
                        Strength: strong; removals grow with
                        presence-tag-driven filtering. The support for
                        either trace holds only if removals are
                        recorded.

