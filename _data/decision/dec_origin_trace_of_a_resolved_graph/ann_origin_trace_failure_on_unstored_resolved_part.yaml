title:                  Failures on resolved parts with no file and line
brief:                  |
                        A resolved dataflow graph is never stored, so
                        a failure on one of its parts has no file and
                        line, and without a trace it is traced by hand
                        up the chain of variants to the base. Either
                        trace maps the part back to the base item or
                        operation, so the failure names the line to
                        fix, as the drafts ask, at the cost of a
                        record emitted by each operation kind in the
                        interpreter.
description:            |
                        Sources:
                        - Each failure says what is wrong and how to
                          fix it.
                          (_data/decision/dec_failure_report_form/ruling_failure_report_form.yaml
                          lines 13-14)
                        - The upheld option prints each failure as its
                          file and line, the
                          name of the check and a sentence on what it records.
                          (_data/decision/dec_failure_report_form/opt_failures_say_what_and_how.yaml
                          lines 13-17)
                        - A dataflow edge fact carries file and line.
                          (src/cctool/graph/extract.py lines 329-330 and 1798-1806)
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-16)
                        - Failures should name the variant and the
                          operation that
                          introduced the fault. (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - The mixed Orin variant resolves through the
                          abstract Orin variant
                          to the Patrol base. (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - Spack gives each directive a condition id so
                          that a failure names
                          its cause. (https://arxiv.org/abs/2210.08404, as summarized in
                          _sources/survey/product-lines.md lines 88-90)
                        - Maintainability asks how readily a newcomer
                          understands the
                          design. (_data/register/reg_concern.yaml line 394)
                        Strength: strong; every resolved part of every
                        leaf is affected, and hand tracing grows with
                        chain depth.

