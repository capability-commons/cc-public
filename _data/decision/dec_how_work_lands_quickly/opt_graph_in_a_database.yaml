title:                  Much of the graph moves to a database
brief:                  |
                        The registers and the items that change most
                        often move out of the files into a graph
                        database or a document store such as MongoDB,
                        which threads write to directly. Concurrent
                        writes to different entries never conflict,
                        and git keeps the code and the rest of the
                        data.

