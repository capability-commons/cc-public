title:                  A queue keeps WTP the one who lands
brief:                  |
                        WTP wants to be the author and committer of
                        everything that lands, and to be happy to put
                        his name to it. A queue run by WTP's own
                        command keeps him the one who signs and lands
                        each commit, and each bundle still lands as
                        its own commits, so each change can be read on
                        its own. The folder of bounced bundles, with
                        the reason for each, shows what did not land
                        and why, where today a failed landing shows
                        only in WTP's terminal.
description:            |
                        Sources:
                        - WTP's statement on authorship (WTP,
                          2026-10-28).
                        - Commits are signed when they land, because a
                          remote session holds no team member's key
                          [AGENTS.md#working-beside-other-agents].

