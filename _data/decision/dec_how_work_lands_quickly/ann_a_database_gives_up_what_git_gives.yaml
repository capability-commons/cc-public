title:                  A database gives up what git gives
brief:                  |
                        Every commit carries an item, is signed by a
                        team member and is checked against the commit
                        before it: renames must be announced and keep
                        an alias, removals must be announced, and a
                        review names the blob of each file it saw. All
                        of that reads git. Items held in a database
                        leave that trail, so who changed what, and
                        why, would need a history of its own, and a
                        review could no longer name what it saw by a
                        git blob.
description:            |
                        Sources:
                        - The before and after check of a commit, with
                          unannounced_rename, rename_without_alias and
                          unannounced_removal
                          [src/cctool/commit/change.lp].
                        - Every commit pushed must be signed by a team
                          member's key
                          [AGENTS.md#working-beside-other-agents].
                        - WTP took the point that a database gives up
                          what git gives (WTP, 2026-10-29).

