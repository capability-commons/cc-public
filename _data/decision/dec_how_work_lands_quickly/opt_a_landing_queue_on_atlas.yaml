title:                  A landing queue on atlas
brief:                  |
                        Threads leave their bundles in a queue folder
                        on atlas, each under a new name. One command,
                        run by WTP and later perhaps by a timer, lands
                        them one at a time in the order they arrived,
                        each replayed onto dev as it then stands. A
                        bundle that replays and passes its checks
                        lands. One that conflicts or fails is moved to
                        a folder of bounced bundles with the reason,
                        and only its thread rebases. When the queue is
                        empty, one push sends everything that landed.

