title:                  One file per entry changes what an entry is
brief:                  |
                        A register entry is embedded in its register
                        and travels with it, so it carries no rights
                        of its own, while a standalone item carries
                        identity, description and rights. A file for
                        each entry either makes every entry
                        standalone, with its own copyright, license
                        and mark, or needs a new kind of file that is
                        part of a register. Either way the extractor,
                        the layout, the placement check and each
                        command that edits a register change, across
                        12 registers and 23 interface control
                        documents, about 19,000 lines in all.
description:            |
                        Sources:
                        - A register entry is embedded in its register
                          and carries no rights of its own
                          [_data/register/reg_concept.yaml at
                          entries.concept_register_entry.description].
                        - A standalone item carries identity,
                          description and rights; an embedded item
                          inherits its rights
                          [_data/schema/sch_standalone.yaml at
                          description].
                        - Counted with wc on dev at 9449dfac
                          (2026-10-29).

