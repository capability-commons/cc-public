title:                  A wrong merge passes silently
brief:                  |
                        A conflict stops a replay and asks for a
                        person. A merge driver that keys entries
                        wrongly, or keeps one side of a changed entry,
                        reports success and the replay goes on. The
                        history check that landing runs reads each
                        replayed commit, so a merge that leaves a
                        broken reference or a misshapen entry fails
                        there, but one that quietly keeps an older
                        value of a field is not caught by any check.
description:            |
                        Sources:
                        - Landing checks the replayed commits as
                          cctool history check does, in a fresh
                          process with the code they hold
                          [src/cctool/commit/repo.py within land].

