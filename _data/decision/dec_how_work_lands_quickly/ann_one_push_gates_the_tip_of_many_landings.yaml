title:                  One push gates the tip of many landings
brief:                  |
                        The pre-push hook runs the gate on the tip of
                        what a push sends. The 78 gate runs with tests
                        logged on atlas from 2026-10-24 to 2026-10-29
                        took a median of 136 seconds, and the longest
                        346. Landing and pushing each bundle in turn
                        pays that once per bundle. A queue that lands
                        several and pushes once pays it once.
description:            |
                        Sources:
                        - The pre-push hook runs cctool history check
                          with --gate [.githooks/pre-push].
                        - The gate logs each run's timings in the git
                          directory, shared by every worktree
                          [src/cctool/gate/gate.py within timing_log];
                          the figures are from that log on atlas
                          (2026-10-29), taking the longest stage of
                          each run.

