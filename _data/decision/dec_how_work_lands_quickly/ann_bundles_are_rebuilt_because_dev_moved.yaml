title:                  Bundles are rebuilt because dev moved
brief:                  |
                        On 2026-10-29 the folders on atlas held 92
                        bundle files. One thread alone made 19 of them
                        on 2026-10-28 and 2026-10-29, of which 7 were
                        copies of dev taken only to rebase on, and
                        four of its bundles were made again under new
                        names after dev moved. A queue replays each
                        bundle onto dev as it stands when its turn
                        comes, so a thread makes a bundle again only
                        when a replay really conflicts, and needs no
                        copy of dev to do it.
description:            |
                        Sources:
                        - Counted in /media/wtp/Data1/dev/cc and its
                          _bundles folder on atlas (2026-10-29).
                        - cctool repo land replays the commits onto
                          the current branch, so that a branch made on
                          an older base lands as if made on this one
                          [b45cde7c:src/cctool/commit/repo.py within land].

