title:                  A database has no textual conflicts
brief:                  |
                        Writes to different entries in a database
                        never conflict, and a thread sees the others'
                        work as soon as it is written, with no rebase
                        and no bundle. That removes the friction at
                        its root for the data it holds, which is why
                        WTP considered it. It does nothing for the
                        code, where three of the five busiest files
                        are.
description:            |
                        Sources:
                        - WTP's statement on landing friction (WTP,
                          2026-10-29).

