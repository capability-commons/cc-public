title:                  A merge driver lives in each clone's settings
brief:                  |
                        The line in .gitattributes travels with the
                        repository, but the command it names must be
                        set in each clone's git settings, which a
                        clone does not copy. pixi run hooks already
                        sets core.hooksPath that way, so it can set
                        the driver too. Every clone that rebases needs
                        it, the container of each remote session
                        included, or its rebases conflict as before.
description:            |
                        Sources:
                        - The pixi task hooks runs git config
                          core.hooksPath .githooks [pyproject.toml at
                          hooks].

