title:                  Register files merge entry by entry
brief:                  |
                        A git merge driver, named in .gitattributes
                        and set up by pixi run hooks, merges a
                        register or interface control document entry
                        by entry, keyed by id, and lays out the
                        result. Two branches that add or change
                        different entries of the same file then replay
                        without a conflict. Only a change by both
                        sides to the same entry conflicts, as it does
                        now.

