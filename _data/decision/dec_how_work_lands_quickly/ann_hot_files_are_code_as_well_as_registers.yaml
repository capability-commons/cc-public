title:                  The busiest files are code as well as registers
brief:                  |
                        Of the 103 commits written on 2026-10-28 and
                        2026-10-29, the files most often changed were
                        the tests of the checks (12 commits), the
                        logic program of the checks (10), the
                        extractor (9), the register of relations (8)
                        and the interface control document of the
                        checks (8). Merging registers by entry, or
                        splitting them, removes the conflicts in the
                        fourth and fifth, not in the first three,
                        where threads that add checks both add to the
                        end of the same file.
description:            |
                        Sources:
                        - Counted with git log on dev at 9449dfac, by
                          author date (2026-10-29):
                          src/cctool/check/_test/test_check.py,
                          src/cctool/check/check.lp,
                          src/cctool/graph/extract.py,
                          _data/register/reg_relation.yaml,
                          _data/interface_control_document/icd_cctool_check.yaml.

