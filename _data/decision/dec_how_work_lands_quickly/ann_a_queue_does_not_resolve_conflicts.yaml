title:                  A queue does not resolve conflicts
brief:                  |
                        A queue removes the waiting on bundles that
                        replay cleanly, but a bundle that conflicts
                        still goes back to its thread. So does one
                        that replays cleanly but fails its checks,
                        because two threads changed things that work
                        apart and not together. That second kind is
                        caught today too, by the history check that
                        cctool repo land runs on the replayed commits,
                        and the queue keeps that check. Bundles that
                        depend on one another must also arrive in
                        order, or the later one bounces.
description:            |
                        Sources:
                        - A replay that conflicts, or a check that
                          fails, leaves the current branch where it
                          was [b45cde7c:src/cctool/commit/repo.py within land].

