title:                  Schedule that ignores partner readiness
brief:                  |
                        A fixed schedule cuts a release whether or not
                        a breaking change is ready to be bundled or
                        partners are ready to take it, which works
                        against holding breaking changes for one major
                        release.
description:            |
                        Sources: the owner expects to bundle breaking
                        changes into one major release after 1.0
                        (owner's statement, 2026-10-22,
                        _sources/context.md line 16). The scheduled
                        option cuts releases on a fixed schedule
                        (_data/decision/dec_who_may_release/opt_scheduled_release.yaml
                        lines 12-13). Strength: weak; a schedule could
                        cut only minor and patch releases and leave
                        majors to a person.

