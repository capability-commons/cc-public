title:                  Release automation ahead of its machinery
brief:                  |
                        No release has been made, the repository has
                        no CI, every gate runs as a local hook, and
                        the telemetry the owner ties automation to
                        does not exist. Triggered or scheduled
                        releases now would add a trigger or timer and
                        a hosted service, let a fault in untried
                        release machinery publish broken releases with
                        nobody watching, and could name only passing
                        checks, not the reported problem a release
                        answers. A person running a scripted release
                        keeps one path and a check in the loop until
                        the machinery has a record.
description:            |
                        Sources: no release has ever been made
                        (context note, _sources/context.md line 33).
                        The repository root holds .githooks and no
                        .github or other CI configuration (listing of
                        the repository;
                        _data/decision/dec_commit_gate/ann_ci_only_needs_a_new_mechanism.yaml
                        at description). The gate runs from git hooks
                        that pixi run hooks turns on
                        (README.md#getting-started; pyproject.toml at
                        tool.pixi.tasks.hooks). "It should stay my
                        decision for now." and "Point and patch
                        releases may get a level of automation,
                        depending on how we build out our telemetry
                        infrastructure." (owner's statement,
                        2026-10-22). "Add a type, relation, field or
                        command only when a real instance needs it."
                        (AGENTS.md#keep-it-small). The triggered
                        option cuts minor and patch releases
                        automatically from the start when the checks
                        pass
                        (_data/decision/dec_who_may_release/opt_triggered_minor_and_patch_now.yaml
                        at title and brief). Assumptions: an automatic
                        trigger would run on a hosted CI service; no
                        telemetry or problem-report item type exists
                        in the tree. Strength: strong for reliability
                        and simplicity; weak for dependency risk,
                        since the service could be self-hosted, and
                        for traceability, since commit items still
                        trace a triggered release to its changes.

