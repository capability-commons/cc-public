title:                  Release gate runs multiplied by triggered releases
brief:                  |
                        A release triggered whenever the checks pass
                        may run the release gate on every passing
                        change rather than only on changes a person
                        chooses to ship. If the release gate is the
                        full gate, the compute spent grows with the
                        commit rate.
description:            |
                        Sources: the full gate option runs every test
                        with no cached verdicts, builds the package
                        and installs it fresh
                        (_data/decision/dec_release_gate/opt_full_gate_and_smoke_test.yaml).
                        The slow run is "too slow for every commit"
                        (README.md#getting-started). Assumption: a
                        trigger would fire on each change that lands
                        on the release line and is eligible for a
                        minor or patch bump. Strength: weak; a trigger
                        could batch changes, and compute is cheap on a
                        one-maintainer project.

