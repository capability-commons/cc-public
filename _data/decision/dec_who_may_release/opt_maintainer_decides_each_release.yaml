title:                  Each release decided by the maintainer
brief:                  |
                        The maintainer decides and runs each release,
                        and a major release always needs a person; the
                        release is scripted so that minor and patch
                        releases may later be triggered automatically.
description:            |
                        Source: maintainer's comment
                        (2026-10-22T16:33:05Z), "It should stay my
                        decision for now. Major releases require
                        coordination and will likely always require
                        human involvement. Point and patch releases
                        may get a level of automation, depending on
                        how we build out our telemetry
                        infrastructure."

