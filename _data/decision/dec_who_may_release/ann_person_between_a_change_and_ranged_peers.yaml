title:                  Person between a change and the peers that admit it
brief:                  |
                        Peers pinned to a SemVer range take every
                        minor and patch release automatically, so an
                        automatic release passes on whatever the last
                        relock or a misclassified change brought in
                        with no person deciding it is acceptable. A
                        major release changes what partners must adapt
                        to and needs timing with them, so a person
                        deciding each release keeps that judgment in
                        the loop.
description:            |
                        Sources: "Major releases require coordination
                        and will likely always require human
                        involvement." and "It should stay my decision
                        for now." (owner's statement, 2026-10-22,
                        _sources/context.md line 24). Under SemVer,
                        minor and patch releases are backward
                        compatible, and peers taking ranges below the
                        next major admit them all
                        (https://semver.org/, items 6-8;
                        pyproject.toml at project.dependencies for the
                        same practice with most dependencies). The
                        triggered option cuts minor and patch releases
                        automatically from the start when the checks
                        pass
                        (_data/decision/dec_who_may_release/opt_triggered_minor_and_patch_now.yaml).
                        The bump is to be computed from commit items
                        (_data/decision/dec_version_scheme/opt_semver_computed.yaml
                        at brief). Strength: moderate; checks catch
                        upstream changes that break tests but not
                        those the tests miss, and with a correct
                        computed bump automatic minor and patch
                        releases would not harm a ranged partner.

