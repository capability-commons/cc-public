title:                  Single point of failure in the maintainer
brief:                  |
                        If only the maintainer can cut a release, a
                        fix cannot ship while he is unavailable, and
                        only he can relock today. This counts against
                        the maintainer option unless its scripted path
                        for minor and patch releases is built early.
description:            |
                        Sources: under the maintainer option the
                        maintainer decides and runs each release
                        (_data/decision/dec_who_may_release/opt_maintainer_decides_each_release.yaml
                        lines 13-16). Only the owner can relock, since
                        atlas has no network (context note,
                        _sources/context.md line 30). Strength: weak;
                        with all peers the owner's own, his absence
                        also pauses the demand.

