title:                  Scheduled release with no traced need
brief:                  |
                        A release cut because a date came may hold
                        nothing that called for it, so it can exist
                        with no reason. A release the maintainer
                        decides on, or one triggered by passing checks
                        over new commits, traces to the commits and to
                        the person or rule that started it.
description:            |
                        Sources: the scheduled option cuts releases on
                        a fixed schedule
                        (_data/decision/dec_who_may_release/opt_scheduled_release.yaml
                        lines 11-13). An annotated tag records its
                        tagger and date
                        (https://git-scm.com/docs/git-tag). The owner
                        wants to respond "to reported problems quickly
                        and largely automatically" (owner's statement,
                        2026-10-22). Strength: moderate; a schedule
                        could skip a date when nothing changed.

