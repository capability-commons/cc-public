title:                  Period of latency added to fixes by a schedule
brief:                  |
                        Under a fixed schedule a finished fix waits
                        for the next slot, which adds up to a whole
                        period to the time to recover from a broken
                        release. A triggered release ships the fix
                        when the checks pass, and a scripted release a
                        person starts falls between the two.
description:            |
                        Sources: the scheduled option cuts releases on
                        a fixed schedule
                        (_data/decision/dec_who_may_release/opt_scheduled_release.yaml
                        line 13). The triggered option cuts minor and
                        patch releases when the checks pass
                        (_data/decision/dec_who_may_release/opt_triggered_minor_and_patch_now.yaml).
                        The maintainer option is scripted so minor and
                        patch releases may later be triggered
                        (_data/decision/dec_who_may_release/opt_maintainer_decides_each_release.yaml).
                        "I'd like to be able to respond to reported
                        problems quickly and largely automatically"
                        (owner's statement, 2026-10-22T16:33).
                        Strength: moderate; the delay depends on a
                        period nobody has set, and an out of band
                        patch would soften it, which the option does
                        not provide.

