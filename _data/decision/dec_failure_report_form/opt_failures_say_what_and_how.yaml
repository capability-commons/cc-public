title:                  Each failure says what is wrong and how to fix it
brief:                  |
                        Each check states, beside its declaration, a
                        sentence of what a row records and the usual
                        fix. cctool prints each failure as its file
                        and line, the name of the check and that
                        sentence, then the fix once. An error says
                        what to give instead.

