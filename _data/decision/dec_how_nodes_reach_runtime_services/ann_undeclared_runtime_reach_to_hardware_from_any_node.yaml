title:                  Undeclared reach to hardware from any node
brief:                  |
                        With an undeclared runtime parameter, every
                        node can reach every service, hardware
                        included, so a defect or a compromised node
                        kind anywhere in the graph can act on
                        actuators or registers, and a review must read
                        every node's code to know which can. Declared
                        capabilities let cctool confine hardware
                        access to the nodes that need it, such as
                        control nodes, and the trace shows each use;
                        source and sink nodes confine it to whatever
                        the graph wires. Neither stops C++ code from
                        touching hardware some other way, so the gain
                        is in what checks and reviews can see, not in
                        enforcement.
description:            |
                        Sources:
                        - Under the undeclared option nothing outside
                          the node shows which nodes depend on the
                          runtime.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_runtime_parameter_undeclared.yaml
                          at description)
                        - The declared option lets cctool check where
                          capabilities are used and confine them to
                          control nodes.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_runtime_parameter_with_declared_capabilities.yaml
                          at brief)
                        - C++ is an inherently unsafe language, so
                          processes in one address space cannot be
                          prevented from modifying each other's state
                          (Vrba et al. 2009, The Nornir run-time
                          system, section on message transport).
                        - Security asks who can read or change what
                          and how that is enforced; safety asks how
                          each hazard is avoided or limited.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question and
                          entries.concern_safety.question) Strength:
                          strong for review and audit; it would be
                          stronger still if the build linked hardware
                          access only into declared node kinds.

