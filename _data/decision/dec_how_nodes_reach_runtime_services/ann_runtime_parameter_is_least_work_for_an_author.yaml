title:                  Runtime parameter as the least work for a node author
brief:                  |
                        For the person writing a node, the undeclared
                        parameter is the least work: call what is
                        needed, as in Stableflow. A declared
                        capability adds one line to the node kind. A
                        source port adds a port and an edge in each
                        graph that uses the node, unless a transform
                        wires service sources by port type, which
                        would bring the burden back to one
                        declaration. WTP wants nothing clever that
                        burdens authors, so the lean toward source
                        ports holds only if that wiring is automatic.
description:            |
                        Sources:
                        - In WTP's past practice a node's step
                          received a runtime API as an escape hatch;
                          WTP wants the approach pragmatic, as simple
                          as feasible and without mechanisms that
                          burden node authors (WTP, 2026-10-28).
                        - Under source ports a node that needs a
                          service is wired to it by an edge.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_runtime_services_as_source_ports.yaml
                          at brief)
                        - Time to make a representative change is a
                          measure of maintainability.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure)
                          ASSUMPTION: a transform can insert and wire
                          a service source for each node kind that
                          declares a service input, as transport nodes
                          are inserted by a transform. Strength:
                          moderate; it falls away if service wiring is
                          generated.

