title:                  Occupancy sources already proposed for overload control
brief:                  |
                        The degraded-mode proposal already has the
                        engine expose queue occupancy, and the
                        platform temperature, as source ports, as a
                        recorded exception. Choosing source ports for
                        runtime services makes that the one mechanism
                        for every service; choosing a runtime
                        parameter leaves two ways to reach the same
                        occupancy, which a maintainer must keep
                        consistent and a reader must check both of.
                        Probes inserted as nodes by a transform, as
                        the TensorFlow debugger does, are the same
                        pattern again.
description:            |
                        Sources:
                        - The engine exposes queue occupancy, and the
                          platform temperature, as source ports, a
                          recorded exception under the minimal engine.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief)
                        - The engine exposes occupancy as source
                          ports, a recorded exception (WTP,
                          2026-10-28).
                        - tfdbg watches values by inserting nodes into
                          the runtime graph rather than adding hooks
                          to the engine (Cai et al. 2016, TensorFlow
                          debugger, section 3).
                        - Maintainability asks how far a change in one
                          part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question)
                          Strength: moderate; it holds if the
                          mode-port option is upheld, and lapses if
                          overload is answered another way.

