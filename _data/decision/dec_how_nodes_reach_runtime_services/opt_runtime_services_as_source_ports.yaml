title:                  Runtime services as source ports
brief:                  |
                        There is no runtime parameter. Each service is
                        a source node supplied by the engine or the
                        platform, such as queue occupancy or
                        temperature, and a node that needs it is wired
                        to it by an edge.
description:            |
                        Keeps nodes as plain functions over inputs and
                        state, and puts every dependency in the graph.
                        A service that has to act, such as setting a
                        hardware register, does not fit a source and
                        would need a sink node or an actor.

