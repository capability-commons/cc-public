title:                  How nodes reach runtime services
brief:                  |
                        How does a node reach things outside its ports
                        and state, such as queue occupancy, hardware
                        or the clock, when it really needs them?
description:            |
                        In Stableflow the step function of a node took
                        a runtime parameter as an escape hatch: the
                        runtime exposed an API for things like queue
                        occupancy and access to hardware (WTP,
                        2026-10-28). Every lasting dataflow system
                        keeps nodes as plain functions over inputs and
                        state (Lee and Parks 1995; Lee 2006), so a
                        node that reads the runtime directly hides an
                        input from checks and replay.

