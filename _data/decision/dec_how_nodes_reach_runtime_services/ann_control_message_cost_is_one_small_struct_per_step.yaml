title:                  Control message that costs one small struct per step
brief:                  |
                        The control block writes one struct per
                        execution unit per step, and nodes in the unit
                        can read it in place, so the cost does not
                        grow with the number of services a node uses
                        or the number of nodes that use them. It is
                        cheaper than one source node and edge per
                        service, and close to a runtime call. Sharing
                        it read-only is one of the memory-token
                        exceptions the ruling on carrying values
                        expects.
description:            |
                        Sources:
                        - A service as a source node produces a
                          message every step, so its cost is paid each
                          step even when no reader uses the value.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_service_source_runs_each_step_whether_read_or_not.yaml
                          at brief)
                        - Memory tokens are expected as exceptions,
                          for example to support shared read-only
                          memory.
                          (_data/decision/dec_how_a_value_is_carried_along_an_edge/ruling_value_copied_into_each_queue.yaml
                          at brief) Strength: weak; the costs of all
                          options are small against a 33 ms step.

