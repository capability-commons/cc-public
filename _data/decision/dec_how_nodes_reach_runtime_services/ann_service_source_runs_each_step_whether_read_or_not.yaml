title:                  Service source that runs each step whether read or not
brief:                  |
                        A service as a source node produces a message
                        every step, so its cost is paid each step even
                        when no reader uses the value, while a runtime
                        call costs only when made. For occupancy and
                        temperature the message is a few numbers and
                        the cost is small, and it is paid once per
                        step rather than per message; per-message
                        accounting in Nornir doubled the cost of each
                        transfer. A transform can leave out a source
                        with no reader. The point weighs slightly for
                        the parameter, and the measurement on the Orin
                        settles it.
description:            |
                        Sources:
                        - Nornir's accounting raised the cost of a
                          message transfer from about 0.68 to 1.4
                          microseconds (Vrba et al. 2009, The Nornir
                          run-time system, section on accounting).
                        - Each Kahn edge carries one message per step
                          (WTP, 2026-10-28).
                        - Performance efficiency covers throughput and
                          the processor time the system uses.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.description)
                          ASSUMPTION: occupancy for a whole execution
                          unit fits in one small message, and the
                          engine reads it from buffer indices it
                          already holds. Strength: weak; under a dozen
                          small sources per step the difference is
                          unlikely to show against a 33 ms step.

