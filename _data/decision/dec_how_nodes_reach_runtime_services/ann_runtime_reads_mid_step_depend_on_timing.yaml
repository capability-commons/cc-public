title:                  Runtime reads mid-step whose values depend on timing
brief:                  |
                        A node that calls the runtime during its step
                        reads a value at whatever moment the call
                        happens, and queue occupancy or the clock
                        changes as other execution units run, so the
                        same inputs and state give different outputs
                        from run to run. Declaring and recording the
                        capability makes such a run replayable from
                        the log, but not reproducible from its inputs,
                        and a test cannot set the value. A source port
                        is sampled once at the step boundary and
                        arrives as an input processed in the node's
                        own turn, so the node stays a function of its
                        inputs and state.
description:            |
                        Sources:
                        - Every lasting dataflow system keeps nodes as
                          plain functions over inputs and state, and a
                          node that reads the runtime directly hides
                          an input from checks and replay.
                          (_data/decision/dec_how_nodes_reach_runtime_services/dec_how_nodes_reach_runtime_services.yaml
                          at description)
                        - Futures and callbacks that complete outside
                          an actor's serial turn break its serial
                          semantics; a reply should arrive as an event
                          on a typed input (Prokopec and Odersky 2016,
                          Reactors, channels, and event streams,
                          section 4.2).
                        - The declared option records every value the
                          runtime returns in the trace.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_runtime_parameter_with_declared_capabilities.yaml
                          at brief)
                        - Functional suitability asks whether each
                          function gives the right result.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question)
                          ASSUMPTION: Patrol's Kahn steps run on
                          several execution units at once, so
                          occupancy read mid-step is moving. Strength:
                          strong for occupancy and the clock; weak for
                          values fixed during a run, such as a
                          hardware identity.

