title:                  Growing control message that changes every node interface
brief:                  |
                        The control message is part of the C contract
                        every node meets, so adding a service field
                        changes a struct that every node kind is built
                        against. A node built earlier, or by a
                        partner, and loaded in a live swap may then
                        read fields at the wrong offsets. Source ports
                        add a service without touching any node that
                        does not use it. The control message needs a
                        rule for growth, such as fields only appended
                        with a size or version field at the start, or
                        a fixed core with services in a table of
                        declared entries.
description:            |
                        Sources:
                        - The node interface is stated in C, and C++
                          nodes in the static subgraph are called
                          directly by the generated schedule.
                          (_data/decision/dec_language_of_the_node_interface/ruling_c_contract_with_direct_cpp_calls.yaml
                          at brief)
                        - A live swap loads version n+1 of a node into
                          the running process, and a C contract makes
                          a swapped node depend only on the struct
                          layouts the generator wrote.
                          (_data/decision/dec_language_of_the_node_interface/ann_stable_binary_interface_for_code_loaded_live.yaml
                          at brief) ASSUMPTION: the set of services
                          grows after the first nodes are built.
                          Strength: moderate; it is the strongest
                          objection, and a growth rule answers it.

