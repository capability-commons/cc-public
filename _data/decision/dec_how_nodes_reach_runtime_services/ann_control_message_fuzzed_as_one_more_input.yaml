title:                  Control message fuzzed as one more input
brief:                  |
                        The generated fuzz harness can fill the
                        control message like any other input, so a
                        node is fuzzed with clock jumps, a wall clock
                        that goes backward, sudden mode changes and
                        full queues. A runtime parameter hides these
                        from the harness, and source ports give the
                        same reach at the cost of a port per service.
description:            |
                        Sources:
                        - The generator writes a fuzz harness for each
                          node kind from its declared interface.
                          (_data/decision/dec_fuzzing_of_a_single_node/ruling_harness_generated_from_the_node_interface.yaml
                          at brief)
                        - A runtime service reached through an
                          undeclared parameter is an input the harness
                          cannot generate.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_hidden_runtime_inputs_escape_the_fuzz_harness.yaml
                          at brief) ASSUMPTION: the harness is told
                          which ranges each field of the control
                          message may take, such as a monotonic clock
                          that never decreases. Strength: moderate.

