title:                  Services, states, modes and time in a control message
brief:                  |
                        A node reaches runtime services through one
                        control message it receives at each step,
                        which carries the current time, monotonic and
                        wall-clock, the mode flag, other
                        application-specific states and modes, and the
                        readings of runtime services such as queue
                        occupancy or processor temperature. The
                        message is written by a control block for each
                        execution unit and each host, the only nodes
                        privileged to read time and runtime services,
                        so services do not multiply edges, and every
                        value a node sees from outside arrives as data
                        that the replay log records.
description:            |
                        WTP's proposal: limit the proliferation of
                        edges by bundling services together with the
                        mode parameter, time stamps and
                        application-specific states and modes in the
                        control signal; the per-execution-unit and
                        per-host control blocks then need to be
                        special or privileged to access time and
                        runtime service data, which is not much
                        different from data appearing on an edge
                        controlled by the engine (WTP, 2026-10-29).
                        The decision stays open for discussion (WTP,
                        2026-10-29).

