title:                  Runtime API that binds node code to each target
brief:                  |
                        A runtime parameter is an engine API that
                        every target, simulator and replay harness
                        must implement in full, and every node that
                        calls it is bound to it, so a change to the
                        API touches every such node. BlockFactory
                        shows the narrow form of this working: one
                        context object lets the same block run in
                        Simulink, simulation and on the robot. Source
                        ports go further: node code depends on no
                        engine API at all, and the platform-specific
                        part sits in a source or sink node that a
                        variant swaps per target. Both
                        runtime-parameter options carry this cost
                        equally; declaring the capabilities does not
                        shrink the API.
description:            |
                        Sources:
                        - In BlockFactory a block reaches the engine
                          only through one narrow interface, and the
                          same plugin runs in Simulink, in a Gazebo
                          simulation and on the real robot (Ferigo et
                          al. 2020, A generic synchronous dataflow
                          architecture to rapidly prototype and deploy
                          robot controllers, as noted in round 2).
                        - The same authors found that hidden block
                          state forced the step size to be passed by
                          hand as a parameter (Ferigo et al. 2020, as
                          noted in round 2).
                        - Shared objects are managed by one process
                          responsible for all accesses to them,
                          reached through channels (Kahn and MacQueen
                          1977, Coroutines and networks of parallel
                          processes, as noted in round 2).
                        - The engine is a new C++ engine aiming for
                          embedded reach (WTP, 2026-10-28).
                        - Flexibility measures the effort to install
                          on a new platform; dependency risk asks what
                          happens when a part one depends on changes.
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.measure and
                          entries.concern_dependency_risk.question)
                          Strength: moderate; it grows with the number
                          of targets and with node kinds written by
                          others against the API.

