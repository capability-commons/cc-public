title:                  Every node that sees every reading
brief:                  |
                        If every node receives the whole control
                        message, nothing outside a node's code shows
                        which readings it depends on, which is the
                        fault the decision set out to remove from the
                        runtime parameter, moved into a struct. Checks
                        and replay still see the values, but cctool
                        cannot tell which nodes a change of mode or a
                        temperature reading can affect, and a node
                        from a partner can read the host's state
                        without asking. Declaring per node kind which
                        fields it reads, and giving it only those,
                        removes the objection at the cost of one line
                        per field.
description:            |
                        Sources:
                        - A node that reads the runtime directly hides
                          an input from checks and replay.
                          (_data/decision/dec_how_nodes_reach_runtime_services/dec_how_nodes_reach_runtime_services.yaml
                          at description)
                        - Declared capabilities let cctool confine
                          access to the nodes that need it.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_undeclared_runtime_reach_to_hardware_from_any_node.yaml
                          at brief) Strength: moderate; it is a
                          condition on how the option is built rather
                          than a reason against it.

