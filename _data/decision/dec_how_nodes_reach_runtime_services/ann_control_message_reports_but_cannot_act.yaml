title:                  Control message that reports but cannot act
brief:                  |
                        The control message carries readings into a
                        node, so it does nothing for services that
                        act, such as setting a clock frequency or a
                        hardware register, or that answer a request
                        within the step. Those still need a sink node,
                        an actor, or a privileged control block that
                        takes commands, as under source ports, so this
                        option shares the source-port option's real
                        cost and settles only the reporting half of
                        the question.
description:            |
                        Sources:
                        - Some services act rather than report, and a
                          source port cannot carry them.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_services_that_act_fit_a_parameter_better_than_a_port.yaml
                          at brief)
                        - The control message carries the time, the
                          mode flag, application states and modes, and
                          readings of runtime services.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_services_in_a_control_message.yaml
                          at brief) Strength: moderate; it depends on
                          how many acting services Patrol needs.

