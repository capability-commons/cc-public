title:                  Services that act, which fit a parameter better than a port
brief:                  |
                        Some services act rather than report, such as
                        setting a hardware register or a clock
                        frequency, and some answer a request with a
                        value the node needs in the same step. A
                        source port cannot carry them: an action needs
                        a sink node, and a request and reply through
                        an actor take at least a step, about 33 ms at
                        Patrol's camera rate. A runtime parameter does
                        both within the step with one call. This is
                        the source-port option's real cost, and the
                        declared capability keeps the parameter
                        visible while paying it; the lean depends on
                        how many such services Patrol actually needs.
description:            |
                        Sources:
                        - A service that has to act does not fit a
                          source and would need a sink node or an
                          actor.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_runtime_services_as_source_ports.yaml
                          at description)
                        - When a gap handles only the messages waiting
                          as it opens, a request and its reply between
                          actors take two steps.
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_admission_at_the_gap_start_adds_a_step_per_hop.yaml
                          at brief)
                        - The camera runs at 30 Hz; in Stableflow the
                          runtime parameter gave access to hardware
                          (WTP, 2026-10-28).
                        - Response time is a measure of performance
                          efficiency. (_data/register/reg_concern.yaml
                          at
                          entries.concern_performance_efficiency.measure)
                          ASSUMPTION: actions on hardware can usually
                          wait for the step boundary, as a sink node
                          writes them, and same-step request and reply
                          services are few. Strength: moderate; it
                          rises if a node needs a same-step answer
                          from hardware, and falls if every action can
                          be a sink.

