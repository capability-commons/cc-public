title:                  Runtime parameter with declared capabilities
brief:                  |
                        The step function takes a runtime parameter,
                        as in Stableflow, but each node kind declares
                        which of its capabilities it uses, and the
                        runtime records every value it returns in the
                        trace. cctool can then check where the
                        capabilities are used, confine them to control
                        nodes, and forbid them in a graph whose nodes
                        are required to have no state.
description:            |
                        WTP's practice in Stableflow (WTP,
                        2026-10-28), with the declarations and
                        recording proposed so that the escape hatch
                        stays visible to checks and replay.

