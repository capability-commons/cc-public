title:                  Hidden runtime inputs that escape the fuzz harness
brief:                  |
                        A node fuzzed in its own harness can be
                        explored only through inputs the harness can
                        see. A runtime service reached through an
                        undeclared parameter is an input the harness
                        cannot generate, so the node's behavior on it
                        goes unfuzzed. Services as source ports are
                        ordinary inputs the harness feeds; declared
                        capabilities tell the generator which services
                        to stand in for.
description:            |
                        Sources:
                        - The aim of isolating individual nodes in
                          their own test harness and fuzzing them
                          individually (WTP, 2026-10-28).

