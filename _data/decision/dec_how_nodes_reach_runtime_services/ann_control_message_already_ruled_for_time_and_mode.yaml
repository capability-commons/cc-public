title:                  Control message already ruled for time and mode
brief:                  |
                        The ruling on overload already gives each node
                        a control message at each step with the time
                        and the mode. Putting service readings in the
                        same message adds fields to a mechanism that
                        exists, where source ports add a second way in
                        for values of the same kind and a runtime
                        parameter adds a third. One input per node
                        also answers the author's burden: a node that
                        needs occupancy reads a field, with no port to
                        add and no edge to wire in each graph.
description:            |
                        Sources:
                        - The mode may be part of a broader control
                          message given to each node at each step,
                          carrying the current time, the mode flag and
                          other application-specific states and modes.
                          (_data/decision/dec_response_to_sustained_overload/ruling_degraded_mode_through_a_mode_port.yaml
                          at brief)
                        - A source port adds a port and an edge in
                          each graph that uses the node, unless a
                          transform wires service sources.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_runtime_parameter_is_least_work_for_an_author.yaml
                          at brief)
                        - WTP proposed bundling services with the mode
                          and time stamps to limit the proliferation
                          of edges (WTP, 2026-10-29). Strength:
                          strong.

