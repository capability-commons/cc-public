title:                  Control message sampled once at the step boundary
brief:                  |
                        The control block reads time, modes and
                        service readings once, before the step, and
                        every node in the unit sees the same values
                        for that step. A node stays a function of its
                        inputs, its state and the control message, so
                        a test can set any reading, and replay feeds
                        the recorded message back without asking the
                        runtime anything. This keeps the strength of
                        source ports against a runtime call made
                        mid-step.
description:            |
                        Sources:
                        - A node that calls the runtime during its
                          step reads a value at whatever moment the
                          call happens, so the same inputs and state
                          give different outputs from run to run.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_runtime_reads_mid_step_depend_on_timing.yaml
                          at brief)
                        - Calling the system's time functions would
                          break determinism, so the time is supplied
                          rather than read.
                          (_data/decision/dec_response_to_sustained_overload/ruling_degraded_mode_through_a_mode_port.yaml
                          at brief)
                        - A run with live changes is replayed from a
                          recorded log of outside inputs.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml
                          at brief) Strength: strong for occupancy and
                          the clock.

