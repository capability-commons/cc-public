title:                  Control blocks that hold the only platform code
brief:                  |
                        Only the control block of each execution unit
                        and each host reads the clock, the queues and
                        the hardware sensors, so the code that differs
                        between a laptop, an Orin and a Raspberry Pi
                        sits in those blocks, which a variant can swap
                        per target. Node code depends on a struct, not
                        an engine API, and a review of what can reach
                        the platform reads a few control blocks rather
                        than every node.
description:            |
                        Sources:
                        - The per-execution-unit and per-host control
                          blocks are the only nodes privileged to read
                          time and runtime services.
                          (_data/decision/dec_how_nodes_reach_runtime_services/opt_services_in_a_control_message.yaml
                          at brief)
                        - A runtime parameter is an engine API that
                          every target must implement in full, and
                          every node that calls it is bound to it.
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_runtime_api_binds_node_code_to_each_target.yaml
                          at brief)
                        - Target platforms range from an Ubuntu
                          workstation to a Raspberry Pi 5 (WTP,
                          2026-10-29). Strength: moderate; it grows
                          with the number of targets.

