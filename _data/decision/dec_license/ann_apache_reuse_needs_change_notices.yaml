title:                  Change notices and NOTICE text on reuse
brief:                  |
                        Apache-2.0 asks a reuser who changes files to
                        mark each changed file and to carry the NOTICE
                        text, while MIT asks only that the notice is
                        kept. Each extra step is effort and a step a
                        reuser can forget.
description:            |
                        Apache-2.0 sections 4(b) and 4(d) (LICENSE
                        lines 98-99, 107-122). MIT requires only the
                        copyright and permission notice in copies
                        (https://opensource.org/license/mit). Items
                        are designed to travel on their own
                        ("Standalone and embedded" in a session
                        summary written by an assistant in another
                        thread, which Will pasted at
                        2026-10-09T17:52:14Z). The duty binds reusers,
                        not Will as sole holder. ASSUMPTION: reusers
                        copy single items; no source records how reuse
                        happens. The cost is small while NOTICE holds
                        two lines.

