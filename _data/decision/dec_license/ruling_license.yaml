title:                  Apache License 2.0 with the legacy NOTICE
brief:                  |
                        Apache-2.0 is the license the tree already
                        carries, and it adds an express patent grant
                        from each contributor that MIT lacks. Its
                        costs, change notices for reusers and no
                        mixing with GPL-2.0-only work, fall on no
                        partner or dependency on record, and either
                        license fits the dependencies and the install
                        channels. Ruled by WTP on 2026-10-23.

