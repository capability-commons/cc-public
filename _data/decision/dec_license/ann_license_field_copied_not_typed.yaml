title:                  License field copied, not typed by authors
brief:                  |
                        cctool copies the license of a new item from
                        one item, so authors spend no time on it and a
                        shorter license would save them nothing.
description:            |
                        A new standalone item takes its rights from
                        the item file_pyproject
                        (src/cc_public/edit/edit.py lines 94-98, 951).
                        AGENTS.md tells agents to use cctool commands,
                        which fill in rights (lines 38-41). The
                        license is a bare SPDX identifier
                        (_data/schema/sch_trait_rights.yaml lines
                        129-138), and "Apache-2.0" and "MIT" are both
                        such identifiers (https://spdx.org/licenses/).
                        Holds while all items share one license.

