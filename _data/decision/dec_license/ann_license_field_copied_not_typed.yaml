title:                  License field copied, not typed by authors
brief:                  |
                        cctool copies the license of a new item from
                        one item, so authors spend no time on it and a
                        shorter license would save them nothing.
description:            |
                        A new standalone item takes its copyright,
                        license and protective mark from the item
                        file_pyproject (src/cctool/edit/edit.py).
                        AGENTS.md tells agents to prefer cctool
                        commands, which fill in rights
                        (AGENTS.md#changing-data-items). The license
                        is an SPDX expression, usually a bare
                        identifier (_data/schema/sch_trait_rights.yaml
                        at properties.license), and "Apache-2.0" and
                        "MIT" are both such identifiers
                        (https://spdx.org/licenses/). Holds while all
                        items share one license.

