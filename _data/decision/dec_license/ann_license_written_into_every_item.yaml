title:                  License written into every item
brief:                  |
                        The license is a required field of every
                        standalone item and a header of every source
                        file, so a change of license now touches over
                        two thousand files. This favors keeping the
                        chosen license.
description:            |
                        license is required on standalone items
                        (_data/schema/sch_trait_rights.yaml at
                        description and required). grep -rl for
                        "license: Apache-2.0" at 9119fe46 finds 2245
                        files besides pixi.lock, against 122 at
                        89c74d8; pyproject.toml is among them (in its
                        header comment, and pyproject.toml at
                        project.license too). LICENSE and
                        README.md#license name it as well. NOTICE does
                        not name the license. New items copy the value
                        (src/cctool/edit/edit.py within
                        TUPLE_KEY_RIGHTS and _rights). The edit is
                        mechanical with cctool batch
                        (README.md#cctool), so the cost is in the
                        spread of the change, not its difficulty. The
                        spread grows with the graph. Every item said
                        Apache-2.0 from bb8c338, before LICENSE was
                        added in a0b3f50.

