title:                  Install channels open to either license
brief:                  |
                        The channels through which cc-public would
                        reach a new platform (conda-forge, PyPI,
                        Debian main) take Apache-2.0 and MIT alike, so
                        the license does not limit where cc-public can
                        be installed.
description:            |
                        The pixi workspace uses the conda-forge
                        channel and targets osx-arm64, osx-64 and
                        linux-64 (pyproject.toml at
                        tool.pixi.workspace.channels and
                        tool.pixi.workspace.platforms). conda-forge
                        asks that the license field is correct,
                        recommends an SPDX identifier with
                        "Apache-2.0" as its example, asks for a
                        license file where the license requires one,
                        and lists no excluded permissive license
                        (https://conda-forge.org/docs/maintainer/adding_pkgs,
                        fetched 2026-10-15). Debian lists both the
                        Apache License and Expat/MIT-style licenses
                        among the licenses found in Debian main
                        (https://www.debian.org/legal/licenses/index.en.html,
                        fetched 2026-10-15). PyPI takes the license as
                        any SPDX expression in License-Expression
                        (https://peps.python.org/pep-0639/, PEP 639).
                        pyproject.toml declares license = "Apache-2.0"
                        (line 40) and LICENSE is in the repository
                        (commit a0b3f50). The stated platform limits
                        are technical: development is supported on
                        Linux and on macOS with Apple silicon, Intel
                        Macs are locked but untested, and Windows is
                        not supported because of symbolic links and a
                        POSIX shell (README.md#getting-started). The
                        point favors neither option over the other.
                        ASSUMPTION: cc-public is not yet published to
                        any package channel, and no source records a
                        plan to publish it.

