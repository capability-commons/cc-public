title:                  Permissive dependencies fit either licence
brief:                  |
                        Every dependency of cc-public is under a
                        permissive licence, under the GCC runtime
                        exception, or (ld_impl, GPL-3.0-only) a build
                        tool, so Apache-2.0 and MIT are equally open
                        on this side.
description:            |
                        Runtime dependencies: click, jsonschema and
                        ruamel.yaml (pyproject.toml lines 39-41).
                        Environment: clingo, python, pytest and ruff
                        (pyproject.toml lines 57-61). PyPI gives click
                        as BSD-3-Clause and jsonschema, its
                        dependencies and ruamel.yaml as MIT
                        (https://pypi.org/pypi/<name>/json, read
                        2026-10-15). clingo is MIT (pixi.lock lines
                        191-203). The GPL-3.0 entries are ld_impl and
                        libgcc, libgomp and libstdcxx, the last three
                        WITH GCC-exception-3.1 (pixi.lock lines 299,
                        394, 404, 509). Dependencies are fetched by
                        pixi, not copied into the repository.
                        ASSUMPTION: these toolchain terms, including
                        the plain GPL-3.0 of the ld_impl linker, place
                        no condition on the licence of cc-public
                        source; not checked with counsel. Each new
                        dependency needs the same check.

