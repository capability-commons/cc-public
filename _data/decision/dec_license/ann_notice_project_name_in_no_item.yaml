                        NOTICE lines 1-2: "Capability Commons" and
                        "Copyright 2026 William Payne". The second
                        matches the copyright field of every item. The
                        first is the title of pyp_cctool
                        (src/cctool/__init__.py line 14) and is in no
                        copyright or license field (grep of the
                        snapshot at 9119fe46). An item copied alone,
                        other than that one, does not carry it. NOTICE
                        is that of the legacy repository (commit
                        a0b3f50 message).

