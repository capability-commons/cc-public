title:                  Copyleft libraries now in the locked environments
brief:                  |
                        ann_permissive_dependencies_fit_any_license
                        says every dependency is permissive, under the
                        GCC runtime exception, or the ld_impl build
                        tool. The lock now also holds GNU readline
                        under GPL-3.0-only and two LGPL libraries, in
                        the environments of the slow test run.
description:            |
                        pixi.lock lists readline-8.3 with license
                        GPL-3.0-only for linux-64, osx-64 and
                        osx-arm64 (pixi.lock at packages.37,
                        packages.90 and packages.124), libnsl-2.0.1
                        with LGPL-2.1-only (pixi.lock at packages.20)
                        and libxcrypt-4.4.38 with LGPL-2.1-or-later
                        (pixi.lock at packages.28). readline comes
                        with the Python 3.12 to 3.14 builds of the
                        py312, py313 and py314 environments on every
                        platform (pixi.lock at
                        environments.py312.packages.linux-64,
                        environments.py313.packages.linux-64 and
                        environments.py314.packages.linux-64 for
                        linux-64). libnsl and libxcrypt come only with
                        that of py312 on linux-64 (pixi.lock at
                        environments.py312.packages.linux-64). None is
                        in the default environment. The runtime
                        dependencies are now seven, not three
                        (pyproject.toml at project.dependencies).
                        Whether these libraries place any condition on
                        the license of cc-public is not checked here.
                        Found in the review of 2026-10-22.

