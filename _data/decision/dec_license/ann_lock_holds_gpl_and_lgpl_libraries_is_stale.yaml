title:                  Copyleft libraries now in the locked environments
brief:                  |
                        ann_permissive_dependencies_fit_any_license
                        says every dependency is permissive, under the
                        GCC runtime exception, or the ld_impl build
                        tool. The lock now also holds GNU readline
                        under GPL-3.0-only and two LGPL libraries, in
                        the environments of the slow test run.
description:            |
                        pixi.lock lists readline-8.3 with license
                        GPL-3.0-only for linux-64, osx-64 and
                        osx-arm64 (lines 2510-2539), libnsl-2.0.1 with
                        LGPL-2.1-only (lines 1590-1596) and
                        libxcrypt-4.4.38 with LGPL-2.1-or-later (lines
                        1786-1792). readline comes with the Python
                        3.12 to 3.14 builds of the py312, py313 and
                        py314 environments on every platform (lines
                        213, 375 and 539 for linux-64). libnsl and
                        libxcrypt come only with that of py312 on
                        linux-64 (lines 195 and 200). None is in the
                        default environment. The runtime dependencies
                        are now seven, not three (pyproject.toml at
                        project.dependencies). Whether these libraries
                        place any condition on the license of
                        cc-public is not checked here. Found in the
                        review of 2026-10-22.

