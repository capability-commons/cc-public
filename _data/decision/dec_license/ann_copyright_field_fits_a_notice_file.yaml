title:                  Copyright field ready for a NOTICE file
brief:                  |
                        Each standalone item carries a full copyright
                        notice and an SPDX licence, so one item can
                        travel to a partner with the notice that
                        Apache-2.0 asks it to carry.
description:            |
                        Apache-2.0 sections 4(a) and 4(d) require a
                        copy of the licence and the NOTICE
                        attributions to go with derivative works
                        (LICENSE lines 95-96, 107-122). The copyright
                        field "is written in full so that it can be
                        copied verbatim into a NOTICE file or a source
                        header" (_data/schema/sch_trait_rights.yaml
                        lines 105-108). The license field is an SPDX
                        expression (same file, lines 129-155). Both
                        are required on standalone items (lines
                        46-49).

