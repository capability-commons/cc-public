title:                  Copyright field ready for a NOTICE file
brief:                  |
                        Each standalone item carries a full copyright
                        notice and an SPDX license, so one item can
                        travel to a partner with the notice that
                        Apache-2.0 asks it to carry.
description:            |
                        Apache-2.0 sections 4(a) and 4(d) require a
                        copy of the license and the NOTICE
                        attributions to go with derivative works
                        (LICENSE). The copyright field "is written in
                        full so that it can be copied verbatim into a
                        NOTICE file or a source header"
                        (_data/schema/sch_trait_rights.yaml at
                        properties.copyright.description). The license
                        field is an SPDX expression (same file, lines
                        129-155). Both are required on standalone
                        items (lines 46-49).

