title:                  Stable binary interface for code loaded live
brief:                  |
                        A live swap loads version n+1 of a node into
                        the running process, on Linux by dlopen. The C
                        binary interface is stable across compilers
                        and their versions, while the C++ one depends
                        on the compiler, its standard library and
                        their settings, so a node built later or by a
                        partner may not load safely beside the engine.
                        A C contract makes a swapped node depend only
                        on the struct layouts the generator wrote, and
                        keeps the engine free of a binding tool.
description:            |
                        Sources:
                        - Both live swaps need version n+1's code in
                          the running process; on Linux that is
                          dlopen.
                          (_data/decision/dec_swap_of_a_node_version/ann_swap_live_needs_a_code_loader_on_target.yaml
                          at brief)
                        - A node version is swapped at a step, with
                          its state upgraded.
                          (_data/decision/dec_swap_of_a_node_version/ruling_swap_at_a_step_with_state_upgrade.yaml
                          at brief) ASSUMPTION: C++ has no standard
                          binary interface, and mixing standard
                          libraries or compiler versions across a
                          shared-library boundary is a known source of
                          faults; this is common knowledge, not
                          checked against a specific source here.
                          Strength: strong wherever code is loaded at
                          run time.

