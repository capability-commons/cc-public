title:                  Two calling paths to keep alike
brief:                  |
                        Calling C++ nodes directly in the static
                        subgraph and through C entry points elsewhere
                        gives every C++ node two paths into its step,
                        which must behave alike and both be tested.
                        One C contract for every node means one path,
                        which the generated fuzz harness and the
                        engine both exercise.
description:            |
                        Sources:
                        - The generator writes a fuzz harness for each
                          node kind from its declared interface.
                          (_data/decision/dec_fuzzing_of_a_single_node/ruling_harness_generated_from_the_node_interface.yaml
                          at brief) ASSUMPTION: both paths are
                          generated from the same declaration, which
                          keeps the difference small but not zero.
                          Strength: moderate.

