title:                  Generated typed wrappers that keep the C interface safe
brief:                  |
                        A hand-written C interface tends toward
                        untyped pointers and casts, which coding
                        standards for safety-related software restrict
                        and reviewers distrust. If the generator
                        writes both sides of each node's interface
                        from its declaration, the author never handles
                        the raw C structs, and the types are checked
                        on each side; a C++-only interface gets that
                        typing from the language without generated
                        code.
description:            |
                        Sources:
                        - The ruling on memory ownership gives as a
                          reason that reallocation clashes with coding
                          standards such as MISRA C, where allocation
                          is tightly controlled.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief) ASSUMPTION: MISRA C and MISRA C++
                          restrict conversions from void pointers to
                          object pointers. Strength: moderate; it
                          makes generated wrappers a condition of the
                          C options rather than a reason against them.

