title:                  Language of the node interface
brief:                  |
                        In what form is the interface between the
                        engine and a node stated, so that nodes
                        written in different languages can run in one
                        engine?
description:            |
                        WTP wants nodes implemented in whatever
                        language one wants (WTP, 2026-10-28), and
                        asked for the language-neutral node interface
                        to be recorded as a decision (WTP,
                        2026-10-29). The interface carries the step
                        call, the arrays on each port, the node's
                        state and the control message with the current
                        time and mode.

