title:                  Calls through C entry points that block inlining
brief:                  |
                        The static subgraph's schedule is generated as
                        plain C++17 calls fixed at build time, so the
                        compiler can inline small nodes into the
                        schedule and optimize across them. A call
                        through a C entry point in another translation
                        unit cannot be inlined without link-time
                        optimization, which costs little for a node
                        that does real work and more for many tiny
                        nodes. Direct C++ calls in the static subgraph
                        keep that speed while the C contract stays the
                        rule elsewhere.
description:            |
                        Sources:
                        - The static subgraph's schedule is generated
                          as plain C++17 calls and fixed at build
                          time.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          at brief) ASSUMPTION: some graphs have many
                          small nodes, such as unit conversions or
                          gates, whose cost is comparable to a call.
                          Strength: moderate; small for graphs of
                          heavy nodes such as camera processing.

