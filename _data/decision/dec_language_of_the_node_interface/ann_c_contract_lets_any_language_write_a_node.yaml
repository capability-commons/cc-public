title:                  C contract that lets any language write a node
brief:                  |
                        Almost every language that can be compiled,
                        and Python through ctypes or cffi, can call
                        and expose functions with the C calling
                        convention, so a C contract lets nodes in C,
                        C++, Rust or Python sit in one graph without
                        each author writing a binding. A C++ interface
                        leaves each other language to wrap itself,
                        which in practice means few nodes outside C++.
description:            |
                        Sources:
                        - The nodes are also implemented in whatever
                          language one wants (WTP, 2026-10-28).
                          ASSUMPTION: the C calling convention is the
                          one interface that every widely used systems
                          language and Python can both call and
                          expose; this is common knowledge, not
                          checked against each language's
                          documentation here. Strength: strong, given
                          WTP's aim.

