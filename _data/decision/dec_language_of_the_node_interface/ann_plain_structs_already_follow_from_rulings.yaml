title:                  Plain structs that already follow from the rulings
brief:                  |
                        What crosses the interface is already plain
                        data under the rulings: each message is a
                        bounded array of fixed-size elements, the
                        engine owns every buffer, and a node's state
                        is typed data the engine holds. All of it maps
                        directly onto C structs with no hidden
                        pointers or ownership, so a C contract
                        expresses everything a node needs and loses
                        nothing a C++ interface would carry.
description:            |
                        Sources:
                        - Each message on an edge is an array of
                          elements of one fixed-size type, up to a
                          capacity the port declares.
                          (_data/decision/dec_how_values_of_varying_size_are_held/ruling_bounded_array_of_fixed_size_elements.yaml
                          at brief)
                        - The engine owns every buffer.
                          (_data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief)
                        - A node's state is typed data.
                          (_data/decision/dec_form_of_node_state/ruling_state_as_typed_data.yaml
                          at brief) Strength: strong.

