title:                  C contract with direct C++ calls
brief:                  |
                        The node interface is stated in C as in the
                        option for every node, and that is the
                        contract every node meets. Where a node
                        written in C++ runs in the static subgraph,
                        the generated schedule calls its C++ step
                        directly instead, so the compiler can inline
                        it; the C entry points are used across
                        languages, for code loaded at run time and in
                        fuzz harnesses.
description:            |
                        A refinement of the C interface that keeps the
                        speed of plain generated calls.

