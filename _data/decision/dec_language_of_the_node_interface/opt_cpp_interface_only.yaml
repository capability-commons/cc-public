title:                  C++ interface only
brief:                  |
                        The node interface is a C++17 interface of
                        classes and templates. A node in another
                        language must be wrapped in C++ by its author,
                        with whatever binding tool suits it.
description:            |
                        The simplest choice for an engine written in
                        C++17.

