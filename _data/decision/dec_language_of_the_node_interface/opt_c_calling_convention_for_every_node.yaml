title:                  C calling convention for every node
brief:                  |
                        The node interface is stated in C: plain
                        structs for the port arrays, the typed state
                        and the control message, and functions with
                        the C calling convention for the step and the
                        state upgrade. The generator writes typed
                        wrappers for each node kind from its declared
                        interface, so a C++ author writes ordinary
                        typed C++ and a Rust or Python author does the
                        same in their language. The engine calls every
                        node through this interface.
description:            |
                        Proposed to WTP on 2026-10-28 in the
                        discussion of Lingua Franca.

