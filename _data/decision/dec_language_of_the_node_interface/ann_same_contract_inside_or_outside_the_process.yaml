title:                  Same contract inside or outside the process
brief:                  |
                        A node from an untrusted source loaded into
                        the engine's process can read and write
                        anything there, whatever the interface; the
                        boundary that contains it is a separate
                        execution unit, a process of its own reached
                        by queues. With a contract of plain structs,
                        the same node runs in process or in a separate
                        unit with only its placement changed, so
                        isolating an untrusted node costs a placement
                        decision, not a rewrite.
description:            |
                        Sources:
                        - Between execution units an edge is a bounded
                          queue.
                          (_data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at brief) ASSUMPTION: some nodes will come
                          from partners or other parties the holder
                          does not fully trust. Strength: moderate.

