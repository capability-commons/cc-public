title:                  A content digest that cctool already knows how to make
brief:                  |
                        cctool already digests each item as sorted
                        JSON hashed with blake2b, so applying the same
                        function to a resolved graph gives a content
                        digest with no new mechanism. Two digests with
                        a recorded mapping add an input list and a
                        stored record, under a ruling that stores
                        nothing resolved, and no instance yet needs
                        caching.
description:            |
                        Sources:
                        - Item digests are json.dumps with sorted keys
                          hashed with blake2b.
                          (src/cctool/commit/impact.py lines 150-160)
                        - The verdict store keys a verdict by a digest
                          of cctool's code and versions, an input key
                          of the kind the input-digest option needs.
                          (src/cctool/check/store.py lines 17-28)
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 12-16)
                        - A type, relation, field or command is added
                          only when a real instance needs it.
                          (_data/decision/dec_growth_policy/ruling_growth_policy.yaml
                          lines 13-17)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: strong; one digest function serves
                          any number of graphs.

