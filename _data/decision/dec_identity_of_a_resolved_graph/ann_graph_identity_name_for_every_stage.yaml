title:                  Name for every stage of the graph of edits
brief:                  |
                        With caching at each stage, the models that
                        pass between stages, a built-on
                        [[dataflow variant]] or the output of a
                        [[delta module]] applied inside one, are
                        things a cache holds and a trace must name. A
                        pair of digests names each stage both by what
                        went in and by what came out; a variant id,
                        alone or with a commit, names only the
                        dataflow variants, not a stage inside an
                        [[operation list]].
description:            |
                        Sources:
                        - WTP wants caching at each stage of the graph
                          of transforms (WTP, 2026-10-26).
                          (_data/decision/dec_identity_of_a_resolved_graph/dec_identity_of_a_resolved_graph.yaml
                          at description)
                        - A delta module is a named subgraph of
                          variant operations applied like a single
                          variant operation.
                          (_data/decision/dec_vocabulary_of_variant_operations/ruling_closed_core_with_one_reuse_item.yaml
                          at brief)
                        - The two-digest option gives a resolved
                          dataflow graph an input digest and a content
                          digest and records the mapping; the variant
                          options name it by the id of its dataflow
                          variant, with or without the commit.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_named_by_variant_id.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_named_by_variant_and_commit.yaml
                          at brief)
                        - Traceability means each element can be
                          followed to the need that called for it and
                          back again. (_data/register/reg_concern.yaml
                          at entries.concern_traceability.description)
                          Strength: moderate; it matters once a stage
                          inside a delta module is cached or cited,
                          and the options are worded for a whole
                          resolved dataflow graph, so each would have
                          to be read as applying per stage.

