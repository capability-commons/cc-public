title:                  A variant id that names a moving graph
brief:                  |
                        A variant's resolved graph changes whenever
                        its own operations, an ancestor, a dictionary
                        entry or an interface control document under
                        it changes, and nothing fails. A run or
                        deployment named by the variant id alone
                        traces to whatever the variant resolves to
                        today, not to what ran, and every record that
                        used the id must be rechecked by hand.
description:            |
                        Sources:
                        - The resolved graph is derived, never stored.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - Runs, deployments, change sets and replay
                          logs all need to say exactly which graph
                          they mean.
                          (_data/decision/dec_identity_of_a_resolved_graph/dec_identity_of_a_resolved_graph.yaml,
                          description)
                        - A variant's base may be another variant, and
                          three Patrol variants have the superset Orin variant as base.
                          (_sources/cc-patrol-notes/variants.md lines
                          90-91;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - Port types and dictionary entries are
                          versioned items that upgrade.
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml at brief) Strength: strong; with more
                          variants and deeper chains, one edit to a
                          shared ancestor silently changes the meaning
                          of more variant ids.

