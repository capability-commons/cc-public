title:                  An input digest that changes when only the resolver changes
brief:                  |
                        In the two-digest option the input digest
                        covers the resolver version, so a resolver
                        change gives every graph a new input name even
                        where the output does not; the single
                        input-digest option leaves the resolver out,
                        so a resolver change that alters the output
                        keeps the old name, and the name no longer
                        says what ran. A content digest names exactly
                        what was run, and the paired digests cite it
                        for runs while also saying what was asked for;
                        each is right only if the resolver is
                        hermetic.
description:            |
                        Sources:
                        - The two-digest option's input digest covers
                          the resolver version, while the single
                          input-digest option's covers the chain of
                          bases, the operations and the interface and
                          dictionary versions they refer to, not the
                          resolver.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml
                          and opt_resolved_graph_input_digest.yaml,
                          briefs)
                        - Input-addressed outputs rename everything
                          downstream when any input changes, and
                          content addresses depend only on name and
                          content.
                          (https://nix.dev/manual/nix/2.28/store/derivation/outputs/content-address,
                          as summarized in
                          _sources/survey/generative-and-transforms.md
                          line 156)
                        - The two-digest option has runs and
                          deployments cite the content digest.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml,
                          brief)
                        - Digests drift if the resolver reads the
                          environment, the clock or unordered dicts.
                          (_sources/survey/generative-and-transforms.md
                          line 157) Strength: strong; more resolver
                          releases and more cited runs make the splits
                          more frequent.

