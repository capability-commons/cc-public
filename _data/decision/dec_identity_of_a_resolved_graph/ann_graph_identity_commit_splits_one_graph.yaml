title:                  Variant and commit that split one graph and miss uncommitted runs
brief:                  |
                        A variant id with a commit never goes stale,
                        but it gives one unchanged graph a new name at
                        every commit, cannot name a graph resolved
                        from an uncommitted tree, and cannot be
                        computed by a target from the graph it runs. A
                        content digest changes exactly when the
                        resolved graph does.
description:            |
                        Sources:
                        - Every commit carries a commit item. (context
                          note, _sources/context.md line 34)
                        - Patrol's first measurement is the cost of
                          software encoding beside the detector on the
                          Orin.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 71-74) ASSUMPTION: such runs will be
                          made while a variant is still being edited,
                          before it is committed.
                        - A content digest names the canonical form,
                          so two variants that resolve alike share one
                          name.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_content_digest.yaml,
                          brief)
                        - An open change-set option has the runtime
                          check the digest of the graph a change set
                          was checked against.
                          (_data/decision/dec_change_set_at_a_step/opt_change_set_checked_by_cctool_first.yaml,
                          brief) Strength: strong; more commits mean
                          more names for one graph.

