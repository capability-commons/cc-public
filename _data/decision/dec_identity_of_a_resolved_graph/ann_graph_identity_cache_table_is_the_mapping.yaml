title:                  Cache table that is the recorded mapping
brief:                  |
                        A cache keyed by input digest that holds each
                        stage's output already maps each input digest
                        to the model, and so to its content digest,
                        which is the mapping the two-digest option
                        records. Once caching at each stage is wanted,
                        the stored record counted against that option
                        is the cache itself, while a content digest
                        alone still needs an input key for the cache,
                        a second mechanism beside it.
description:            |
                        Sources:
                        - The two-digest option records the mapping
                          from each input digest to the content digest
                          it gave, and caching and staleness use the
                          input digest.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml
                          at brief)
                        - An earlier annotation counts the input list
                          and the stored record against that option,
                          adding that no instance yet needs caching.
                          (_data/decision/dec_identity_of_a_resolved_graph/ann_graph_identity_digest_cctool_already_makes.yaml
                          at brief)
                        - WTP wants caching at each stage (WTP,
                          2026-10-26).
                          (_data/decision/dec_identity_of_a_resolved_graph/dec_identity_of_a_resolved_graph.yaml
                          at description)
                        - The verdict store already keeps results
                          under a key of input digests, in a directory
                          that can be absent.
                          (src/cctool/check/store.py within key and
                          load)
                        - Simplicity counts distinct mechanisms
                          introduced and jobs done by more than one
                          mechanism. (_data/register/reg_concern.yaml
                          at entries.concern_simplicity.measure.0 and
                          entries.concern_simplicity.measure.1)
                          Strength: moderate; it rests on caching
                          being built, and a cache of resolved models
                          sits uneasily with the ruling that the
                          resolved graph is derived and never stored,
                          unless a cache that may be dropped does not
                          count as storing.

