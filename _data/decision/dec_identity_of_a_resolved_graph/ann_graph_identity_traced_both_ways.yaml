title:                  A graph name that leads back to what was asked for and forward to what came out
brief:                  |
                        Traceability runs both ways, from a run to the
                        inputs that made its graph and from those
                        inputs to the graph they gave. An input digest
                        alone loses what came out, a content digest
                        alone loses what was asked for, and a variant
                        with a commit gives the inputs only by
                        resolving again; the paired digests with the
                        mapping recorded give both.
description:            |
                        Sources:
                        - Traceability means each element can be
                          followed to the need that called for it and
                          back again. (_data/register/reg_concern.yaml
                          lines 556-560)
                        - A content-addressed Nix output depends only
                          on the derivation's name, data and method,
                          and an input-addressed one changes when any
                          input changes.
                          (https://nix.dev/manual/nix/2.28/store/derivation/outputs/content-address)
                        - A Nix realization record associates a
                          derivation output with the store path it
                          produced, because outputs are a product of
                          the build.
                          (https://tweag.io/blog/2021-12-02-nix-cas-4)
                        - A content digest alone cannot say what was
                          asked for.
                          (_sources/survey/generative-and-transforms.md
                          line 156) Strength: strong; sharing evidence
                          across variants that resolve alike needs the
                          content side, and staleness needs the input
                          side. The variant and commit name serves
                          only as an input-side name.

