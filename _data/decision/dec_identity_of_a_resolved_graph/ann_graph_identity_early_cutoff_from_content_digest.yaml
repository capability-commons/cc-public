title:                  Early cutoff from the content digest of each stage
brief:                  |
                        With input digests alone, an edit that leaves
                        its stage's output unchanged, such as a filter
                        on a [[dataflow tag]] no part carries, still
                        gives every stage downstream a new key, so
                        each recomputes and every run cited against
                        them looks stale. Keying each stage by the
                        content digest of the stage before it, as a
                        resolved Nix derivation does, stops the change
                        where the output stops changing; that needs
                        both digests at each stage.
description:            |
                        Sources:
                        - Early cutoff: when a task's result is
                          unchanged from the previous build, the tasks
                          that depend on it need not run. (Mokhov,
                          Mitchell and Peyton Jones, Build systems a
                          la carte, JFP 2020, section 2.3,
                          https://www.microsoft.com/en-us/research/uploads/prod/2020/04/build-systems-jfp.pdf)
                        - For early cutoff Nix builds the resolved
                          derivation, "the same derivation but where
                          all the inputs are replaced by their
                          content-addressed path", and records which
                          path each output maps to.
                          (https://tweag.io/blog/2021-12-02-nix-cas-4)
                        - The input digest of the input-digest option
                          covers the chain of bases and the variant
                          operations; the two-digest option keeps both
                          digests and records the mapping.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_digest.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml
                          at brief)
                        - A filter removes the nodes and edges that
                          carry an excluded tag, and removes nothing
                          when none does.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          within resolve)
                        - Maintainability asks how far a change in one
                          part spreads to others; functional
                          suitability asks whether each function gives
                          the right result.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1
                          and
                          entries.concern_functional_suitability.question.0)
                          Strength: moderate to strong; it grows with
                          the depth of the graph of edits, and it
                          holds only if each stage's key is built from
                          the content digest of the stage before,
                          which the two-digest option allows but does
                          not say.

