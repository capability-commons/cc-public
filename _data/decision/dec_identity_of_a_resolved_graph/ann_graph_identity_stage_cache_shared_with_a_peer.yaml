title:                  Stage cache shared with a peer
brief:                  |
                        A peer that builds on a [[dataflow variant]]
                        of cc-public could reuse the cached models of
                        its shared stages only if both compute the
                        same key. An input digest that covers the code
                        of the resolver differs whenever the two run
                        different releases of cctool, as the verdict
                        store's code digest does at every change to
                        cctool, while a content digest of a shared
                        stage compares equal across releases that
                        resolve it alike.
description:            |
                        Sources:
                        - The code digest of the verdict store covers
                          every python module and logic program of
                          cctool and the versions of python and its
                          libraries. (src/cctool/check/store.py within
                          code)
                        - The two-digest option's input digest covers
                          the resolver version, and runs and
                          deployments cite the content digest.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml
                          at brief)
                        - Peers take cc-public as a versioned package.
                          (_data/decision/dec_how_peers_get_cc_public/ruling_peers_take_a_versioned_package.yaml
                          at brief)
                        - Constructive traces keep the result as well
                          as its hash, which lets results be shared
                          through a cloud cache. (Mokhov, Mitchell and
                          Peyton Jones, Build systems a la carte, JFP
                          2020, section 5.3,
                          https://www.microsoft.com/en-us/research/uploads/prod/2020/04/build-systems-jfp.pdf)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        - ASSUMPTION: a peer would share a cache with
                          cc-public; none does, and a peer one release
                          behind may differ in renames too, as the
                          annotation on digests that change on a
                          rename argues. Strength: weak now, with one
                          peer and no cache; it falls away for the
                          input digest of the input-digest option,
                          which leaves the resolver out, at the cost
                          the annotation on a resolver change argues.

