title:                  An input digest right only while its list of inputs is complete
brief:                  |
                        An input digest is correct only if it covers
                        everything the resolver reads, so each new
                        operation that reads a new kind of item, such
                        as a substitute reading a node definition,
                        must also extend the digest, and an omission
                        gives a wrong match with no error. A content
                        digest is computed from the output and needs
                        no such list, though both need a canonical
                        form kept in step with the schema.
description:            |
                        Sources:
                        - The input digest covers the chain of bases,
                          the operations, the dictionary and interface
                          versions they refer to and, in the
                          two-digest option, the resolver version.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_digest.yaml
                          and
                          opt_resolved_graph_input_and_content_digests.yaml,
                          briefs)
                        - Insert-on-edge and substitute, not yet
                          drafted, are proposed for the core.
                          (_sources/variants-framing.md lines 53, 56
                          and 94)
                        - A digest computed alike in Python and C++
                          means every field added to the model is
                          added to both.
                          (_data/decision/dec_change_set_at_a_step/ann_change_set_digest_needs_matching_code_on_target.yaml,
                          brief)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                        - ASSUMPTION: cctool has no sandbox that
                          records what the resolver reads, as Bazel
                          and Nix do, so the input list is kept by
                          hand. Strength: moderate; it grows with
                          operation kinds and kinds of referenced
                          item, not with variants, and its weight
                          falls if caching and staleness, the input
                          digest's uses, are not needed soon.

