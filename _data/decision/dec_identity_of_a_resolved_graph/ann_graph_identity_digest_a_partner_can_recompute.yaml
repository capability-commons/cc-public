title:                  A graph name a partner can recompute
brief:                  |
                        A content digest of a published canonical form
                        can be recomputed by anyone who holds the
                        resolved graph, without cctool and without the
                        repository. An input digest can be checked
                        only from the inputs it covers, which the
                        repository holds, and where it includes the
                        resolver version only by running the same
                        cctool, and a variant id or commit needs the
                        repository at that commit, which for Patrol
                        will be private.
description:            |
                        Sources:
                        - Hashing and signing need the data expressed
                          in an invariant format. (RFC 8785, JSON
                          Canonicalization Scheme,
                          https://www.rfc-editor.org/rfc/rfc8785,
                          abstract)
                        - The two-digest option has runs and
                          deployments cite the content digest; an
                          input digest covers the chain of bases, the
                          operations and the versions they refer to,
                          and in the two-digest option the resolver
                          version.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_and_content_digests.yaml
                          and opt_resolved_graph_input_digest.yaml,
                          briefs)
                        - Patrol code will live in cc-patrol, a
                          private federated peer. (owner's statement,
                          2026-10-21, paraphrased in
                          _sources/context.md line 9)
                        - One compatibility measure is the number of
                          tools a partner must install to take part.
                          (_data/register/reg_concern.yaml at entries.concern_compatibility.measure.1)
                          Strength: moderate; it grows with the
                          partners who receive runs or deployments,
                          and matters little while every peer is the
                          owner's (owner's statement,
                          2026-10-22, _sources/context.md line
                          15).

