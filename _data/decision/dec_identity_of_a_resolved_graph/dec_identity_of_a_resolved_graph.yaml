title:                  Identity of a resolved dataflow graph
brief:                  |
                        How is one exact resolved dataflow graph
                        named, so that a run, a deployment, a change
                        set or a replay can say which graph it used?
description:            |
                        Under the ruling the resolved dataflow graph
                        is derived and never stored, so nothing in the
                        tree holds it; runs, deployments, change sets
                        and replay logs all need to say exactly which
                        graph they mean (_sources/variants-framing.md,
                        sections 2 and 4, Q5). WTP wants the variant
                        family to work like a generative graph-based
                        editor such as Houdini, a graph of transforms
                        that can be edited and played with caching at
                        each stage (WTP, 2026-10-26), and a cache at
                        each stage needs a key that is known before
                        the stage is computed.

