title:                  Stage cache key known before the stage is computed
brief:                  |
                        A cache at each stage is looked up before the
                        stage runs, so its key must be known from what
                        goes in. An input digest is; a content digest
                        is known only once the stage has run; a
                        variant id stays the same when what is
                        upstream changes, so a cache named by it
                        returns a stale model, as the Houdini disk
                        cache does; and a variant and commit misses at
                        every commit and cannot key an edit not yet
                        committed.
description:            |
                        Sources:
                        - A cache at each stage needs a key that is
                          known before the stage is computed (WTP,
                          2026-10-26).
                          (_data/decision/dec_identity_of_a_resolved_graph/dec_identity_of_a_resolved_graph.yaml
                          at description)
                        - The input digest covers the chain of bases,
                          the variant operations and the versions they
                          refer to; the content digest is of the
                          canonical form of the resolved dataflow
                          graph.
                          (_data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_input_digest.yaml
                          at brief;
                          _data/decision/dec_identity_of_a_resolved_graph/opt_resolved_graph_content_digest.yaml
                          at brief)
                        - The File Cache SOP names its files by base
                          name, version and frame, and when its input
                          changes the user must turn off Load from
                          Disk to see the result.
                          (https://www.sidefx.com/docs/houdini/nodes/sop/filecache.html)
                        - A variant id with a commit gives one
                          unchanged graph a new name at every commit
                          and cannot name a graph resolved from an
                          uncommitted tree.
                          (_data/decision/dec_identity_of_a_resolved_graph/ann_graph_identity_commit_splits_one_graph.yaml
                          at brief)
                        - Functional suitability asks whether each
                          function gives the right result.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question.0)
                          Strength: strong for a cache key; it says
                          nothing about the name a run cites, which
                          may differ from the cache key, as the paired
                          digests allow.

