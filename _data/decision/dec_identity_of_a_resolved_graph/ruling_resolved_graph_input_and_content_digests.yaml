title:                  Resolved graph with input and content digests
brief:                  |
                        A resolved dataflow graph has an input digest
                        and a content digest, with the mapping from
                        each input digest to the content digest it
                        gave recorded. Ruled by WTP on 2026-10-26. WTP
                        first chose the content digest alone, then
                        upheld this option on Claude's recommendation:
                        a cache at each stage of the graph of edits
                        needs a key known before the stage runs, which
                        only the input digest gives, while the content
                        digest still names the graph and stops an
                        unchanged result from recooking what follows.

