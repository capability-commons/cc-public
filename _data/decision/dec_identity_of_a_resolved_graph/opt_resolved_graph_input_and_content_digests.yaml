title:                  Input and content digests with the mapping recorded
brief:                  |
                        A resolved dataflow graph has an input digest,
                        over its chain of bases, its variant
                        operations, the dictionary and interface
                        control document versions they refer to and
                        the resolver version, and a content digest of
                        its canonical form. The mapping from each
                        input digest to the content digest it gave is
                        recorded. Runs and deployments cite the
                        content digest, and caching and staleness use
                        the input digest.
description:            |
                        Ranked first in the variants survey
                        (_sources/survey/README.md lines 37-40), from
                        Nix content-addressed derivations and their
                        realization records, and Bazel's action cache
                        and content store
                        (_sources/survey/generative-and-transforms.md
                        line 122).

