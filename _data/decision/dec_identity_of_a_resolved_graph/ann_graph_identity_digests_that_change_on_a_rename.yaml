title:                  Digests that change on a rename
brief:                  |
                        Rename maps rewrite every reference id, and
                        renames are routine before 1.0. If the
                        canonical form spells ids, a rename changes
                        the digest of a graph whose content is
                        unchanged, so a peer one release behind
                        computes a different digest and every run
                        cited across the rename looks stale. A digest
                        over guids, or over ids mapped back through
                        the rename maps, keeps a rename a pure
                        refactoring; no digest option says which.
description:            |
                        Sources:
                        - Each release ships its renames, as an old
                          id, a new id and the guid, and a peer
                          command rewrites each reference.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief)
                        - The owner tolerates renames and prefix
                          changes before 1.0. (owner's statement,
                          2026-10-21, paraphrased in
                          _sources/context.md line 26)
                        - An edge end carries both an id and a guid.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.end)
                        - The survey proposes that a rename come out
                          as a pure refactoring of the family.
                          (_sources/survey/product-lines.md lines
                          206-210)
                        - ASSUMPTION: no option yet says whether the
                          canonical form holds ids or guids. Strength:
                          strong; it grows with renames and with cited
                          runs. It is a condition on all three digest
                          options, not a reason to prefer a name
                          without a digest.

