title:                  Cost of a save and load through bytes at a move or upgrade
brief:                  |
                        Opaque state is paid for at each move or
                        upgrade: the node saves its state to bytes and
                        loads it again, inside the step at which the
                        change happens, which costs at least a copy
                        plus encoding. A field mapping over a typed
                        block of known size is a bounded copy.
description:            |
                        Sources: opaque state has hooks to save it to
                        bytes and load it, called when the engine
                        moves or upgrades the node
                        (_data/decision/dec_form_of_node_state/opt_state_opaque_with_hooks.yaml
                        at brief); typed state lets the engine upgrade
                        it (opt_state_as_typed_data.yaml at brief);
                        the swap at a step upgrades state at the start
                        of a step
                        (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                        at brief), so the save and load would fall
                        inside that step. Assumption: a save and load
                        through bytes costs at least a copy of the
                        state plus encoding, more than a field mapping
                        over a typed block. Strength: moderate; it is
                        paid per swap, not per step, so it does not
                        grow with node count, but it grows with state
                        size.

