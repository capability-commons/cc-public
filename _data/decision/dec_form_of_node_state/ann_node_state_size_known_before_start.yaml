title:                  Fixed-size state known before the system starts
brief:                  |
                        Typed state, held by the engine or on a
                        feedback edge, has a size known before the
                        system starts, so nothing is allocated while
                        stepping and a node cannot run out of memory
                        mid-step. Opaque state inside a node's own C++
                        object may allocate as it likes, unless a rule
                        the engine cannot enforce forbids it.
description:            |
                        Sources: every buffer the framework allocates
                        has a size known before the system starts,
                        "and nothing is allocated on the heap while
                        stepping"
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 145-151); the framework owns all memory
                        (_sources/axair-orchestrator/README.md lines
                        5-7); opaque state lives in the node's own C++
                        object
                        (_data/decision/dec_form_of_node_state/opt_state_opaque_with_hooks.yaml
                        lines 12-16). The owner wants the engine to
                        reach embedded systems, some with no OS
                        (owner's statement, 2026-10-24). Assumption: a
                        node's own C++ object is outside the memory
                        the framework owns and sizes. Strength:
                        moderate; it matters most on embedded targets.

