title:                  Engine-held state passed by pointer each step
brief:                  |
                        Typed state the engine holds is one fixed-size
                        block handed to the node by pointer each step,
                        with no copy in the steady state, and a
                        snapshot or upgrade is a bounded copy of known
                        size. State on a feedback edge needs either a
                        copy of the whole state each step or two
                        buffers swapped each step, which doubles the
                        memory for state.
description:            |
                        Sources: typed state is held by the engine and
                        handed to the node at each step
                        (_data/decision/dec_form_of_node_state/opt_state_as_typed_data.yaml
                        at brief); in the earlier design state is one
                        block the framework allocates
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 47-48), every buffer has a size known
                        before the system starts (same file, lines
                        148-151), and feedback edges point at a buffer
                        the framework fills and primes on reset (lines
                        42-44). Assumption: state on a feedback edge
                        needs a copy or a double buffer per step,
                        since the value read must be the one written
                        in the step before. Strength: strong; the
                        per-step cost is constant per node under typed
                        state, while the feedback-edge cost grows with
                        total state size.

