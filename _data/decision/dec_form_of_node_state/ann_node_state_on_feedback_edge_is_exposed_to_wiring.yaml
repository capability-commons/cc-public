title:                  Node state exposed to every graph that wires the node
brief:                  |
                        When state is an output fed back on an edge,
                        it becomes part of each graph that uses the
                        node. A second edge could carry it to another
                        node, which would then depend on the first
                        node's internals; a change set that moves or
                        removes the edge moves or drops the state; and
                        adding a state field edits the node's
                        interface and every graph and variant that
                        configures it. Typed state held by the engine
                        stays with the node and in its interface's
                        state section.
description:            |
                        Sources: under this option a node holds no
                        state; what it carries forward is an output
                        fed back on a feedback edge
                        (_data/decision/dec_form_of_node_state/opt_state_on_a_feedback_edge.yaml
                        at brief). The interface schema's dataflow
                        step surface keeps a separate state group,
                        "What the step reads and writes between
                        invocations"
                        (_data/schema/sch_interface_control_document.yaml
                        at
                        $defs.surface_dataflow_step.properties.state).
                        Feedback edges point at a buffer the framework
                        fills and primes on reset
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 42-44), and a rewire is a pointer swap
                        plus a reset of the affected nodes
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 70-72). Patrol's drafts hold one base
                        graph and six variants
                        (_sources/cc-patrol-notes/draft/README.md
                        lines 22-34). Assumptions: nothing in the
                        current model stops a second edge from leaving
                        the same output port; a reset or reprimed
                        feedback buffer loses the value the node
                        carried. Strength: strong for the spread of a
                        state change, which grows with the number of
                        graphs that configure the node (variants that
                        inherit edges from a base reduce but do not
                        remove it); moderate for the other two, which
                        a check tying a state output to its own input,
                        and one that a change set keeps every
                        state-carrying feedback edge, would answer.

