title:                  State upgrade by the dictionary's mapping, refused before it is tried
brief:                  |
                        State as typed data lets the engine apply the
                        data dictionary's field mappings itself, so a
                        new node version needs only a mapping, and an
                        upgrade with a new field that has no default
                        can be refused by a check before it is
                        attempted, as the owner asks. With opaque
                        state, each node version carries hand-written
                        upgrade code inside its hooks, with its own
                        tests, and no check can see whether it is
                        right. This rests on the data dictionary
                        carrying mappings.
description:            |
                        Sources: the owner assumes that node state's
                        type is given by a data dictionary item, says
                        the dictionary "needs to support mappings for
                        automatic data upgrades (where possible ...)",
                        and an upgrade with new fields without
                        defaults "should be blocked before it's
                        attempted" (owner's statement, 2026-10-24,
                        /home/claude/work/advocates/engine2/owner-2026-10-24.md
                        line 24). Typed state is held by the engine
                        and handed to the node at each step, so the
                        engine can copy, inspect and upgrade it
                        (_data/decision/dec_form_of_node_state/opt_state_as_typed_data.yaml
                        at brief). Opaque state is saved to bytes by
                        the node's own hooks
                        (opt_state_opaque_with_hooks.yaml at brief).
                        Patrol's algorithm layer already holds
                        explicit state structs such as SmallState,
                        RegistrationState and ChainState
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 128-130). Erlang/OTP's hot upgrade has
                        each process transform its state in a
                        code_change callback written per module
                        (https://www.erlang.org/doc/system/appup_cookbook.html),
                        which shows the opaque form works at the cost
                        of code per module. Automatic mappings exist
                        only if the data dictionary carries upgrades,
                        fully under dictionary items with upgrades and
                        in part under an external schema language;
                        this argument rests on that decision and on
                        the swap decision, which is the main user of
                        the upgrade. Strength: strong, and stronger
                        with scale: upgrade code under the opaque form
                        grows with nodes times versions, under the
                        typed form it is fixed engine code plus one
                        mapping per version.

