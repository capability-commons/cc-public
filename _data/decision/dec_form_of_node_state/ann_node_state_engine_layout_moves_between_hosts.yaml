title:                  State moved to another execution unit or host by the engine alone
brief:                  |
                        When the engine lays out the state, it can
                        copy it to another process, a mapped file or
                        another host, so a node can be moved or
                        restored elsewhere with no help from the node.
                        Opaque state moves only through each node's
                        own hooks. A plain copy between hosts still
                        needs matching byte order and alignment.
description:            |
                        Sources: typed state is held by the engine,
                        which can copy it
                        (_data/decision/dec_form_of_node_state/opt_state_as_typed_data.yaml
                        at brief); feedback-edge state is typed like
                        any port (opt_state_on_a_feedback_edge.yaml at
                        brief); opaque state is saved and loaded by
                        the node's hooks
                        (opt_state_opaque_with_hooks.yaml at brief).
                        State is one framework-allocated block
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 47-48), edge data is standard-layout,
                        trivially copyable and fixed size
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 84-86), and state in mapped files would
                        let a crashed process resume from its last
                        committed step (execution_levels.md lines
                        149-151). Patrol's two named hosts are a
                        Lenovo Legion gaming laptop and a Jetson Orin
                        Nano (_sources/cc-patrol-notes/plan.md lines
                        128-131). Assumptions: the laptop is x86-64
                        and the Orin is ARM64, and both are
                        little-endian, so a plain layout copies
                        between them if alignment rules match; a
                        big-endian target would need conversion. This
                        rests on the form of the data dictionary,
                        which fixes how the layout is described.
                        Strength: strong; the engine's one copy path
                        serves every node, so it holds at ten times
                        the nodes.

