title:                  Patrol state that is not plain data
brief:                  |
                        Two of Patrol's drafted node states are
                        spelled opaque, the analysis node's including
                        detector history on the GPU, and another holds
                        shared immutable frames. Typed data the engine
                        copies, or a value on a feedback edge, does
                        not yet say how such state is held, so the
                        first user's main node falls outside them
                        unless nodes are restructured or an escape
                        hatch is added, which is a second mechanism to
                        maintain. Opaque state with hooks covers it
                        and costs nothing extra while stepping.
description:            |
                        Sources: Patrol's analysis state is
                        "Registration, detector history on the GPU,
                        chains, marks, target and box tracking", typed
                        opaque
                        (_sources/cc-patrol-notes/draft/icd/icd_patrol_analysis.yaml
                        lines 129-140); the layout node's state is
                        typed opaque (draft/icd/icd_patrol_layout.yaml
                        lines 69-80); the frame history node's state
                        is the last frames, each immutable and shared,
                        typed as an array of eight frame steps
                        (draft/icd/icd_patrol_frame_history.yaml lines
                        79-90). Patrol's detector holds GPU state
                        that, when dropped, makes the next frame
                        allocate again
                        (_sources/cc-patrol-notes/decomposition-readiness.md
                        lines 100-106). Everything that crosses an
                        edge in the Stableflow drafts is plain,
                        trivially copyable, fixed-size data
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 84-86). The form of state is hard to
                        change once the engine is in use (owner's
                        statement, 2026-10-24). Assumption: memory on
                        a GPU cannot be held as a host-side value the
                        engine copies and hands to the node each step
                        without a copy between devices. Strength:
                        moderate. It rests on one system's drafts, and
                        the opaque spellings may be placeholders; but
                        that system is the first user. A typed form
                        with a declared opaque part for device
                        resources, such as a handle plus host-side
                        data, would answer it; no option states that
                        yet.

