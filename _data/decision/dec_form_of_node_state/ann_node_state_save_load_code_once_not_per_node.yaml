title:                  Save and load code written once by the engine, not once per node
brief:                  |
                        When state is typed data or a value on a
                        feedback edge, the engine knows its layout, so
                        one engine routine copies, saves, restores and
                        resets the state of every node. With opaque
                        state, each stateful node type carries its own
                        save and load hooks, so the count of byte
                        formats, deserializers, serialization
                        libraries and recovery paths grows with the
                        number of node types, and the engine can check
                        none of them.
description:            |
                        Sources: typed state is held by the engine,
                        which can copy, inspect and upgrade it
                        (_data/decision/dec_form_of_node_state/opt_state_as_typed_data.yaml
                        at brief); feedback-edge state is an output
                        typed like any other port
                        (opt_state_on_a_feedback_edge.yaml at brief);
                        opaque state lives in the node's C++ object
                        with hooks to save it to bytes and load it
                        (opt_state_opaque_with_hooks.yaml at brief).
                        In the Stableflow drafts state is one block
                        the framework allocates so it can snapshot or
                        zero it
                        (_sources/axair-orchestrator/docs/component_interface.md
                        lines 47-48), coroutines were rejected because
                        they hide their frame so state could not be
                        inspected, snapshotted or reset
                        deterministically (same file, lines 92-94),
                        state stays explicit, fixed size and
                        snapshottable (lines 159-160), and everything
                        on an edge is standard-layout, trivially
                        copyable and fixed size
                        (_sources/axair-orchestrator/docs/execution_levels.md
                        lines 84-86). Feedback buffers are static
                        storage in the frozen schedule
                        (execution_levels.md line 37). State blocks in
                        mapped files would let a crashed process
                        resume and serve as a post-mortem record of
                        what each node held (execution_levels.md lines
                        149-151). Consequences per concern.
                        Reliability: recovery needs a whole copy taken
                        at a step boundary, which the engine can
                        double-buffer and restore the same way for
                        every node, while hooks run at the moment the
                        node may be faulty and an object may hold heap
                        pointers that do not survive a restart.
                        Safety: reset to a known value, a copy to go
                        back after a failed change, and a record of
                        what each node held after a fault all rest on
                        hooks the engine cannot check under the opaque
                        form. Security: a saved or upgraded state is
                        read back by one engine routine instead of one
                        loader per node, each a deserializer a
                        tampered state file can attack (CWE-502,
                        https://cwe.mitre.org/data/definitions/502.html).
                        Dependency risk: the engine's copy code needs
                        no serialization library, while each node
                        author may bring one, and the concern counts
                        direct and indirect dependencies
                        (_data/register/reg_concern.yaml at
                        entries.concern_dependency_risk.measure), each
                        needing a license check
                        (_data/decision/dec_license/ann_permissive_dependencies_fit_any_license.yaml,
                        description). Flexibility: whether a node's
                        bytes survive a change of compiler,
                        architecture or host is settled node by node,
                        so a new platform means checking every node's
                        hooks, and the concern measures the effort to
                        install on a new platform (reg_concern.yaml at
                        entries.concern_flexibility.measure).
                        Simplicity, a non-driver here: the count of
                        upgrade mechanisms is one instead of one per
                        stateful node type (reg_concern.yaml at
                        entries.concern_simplicity.measure).
                        Assumptions: node authors would reach for
                        libraries such as Boost.Serialization or
                        cereal rather than write bytes by hand; a C++
                        object may hold pointers or padding whose
                        bytes differ between builds. This rests in
                        part on the form of the data dictionary: under
                        an external schema language, upgrading typed
                        state is that library's code. Erlang/OTP shows
                        the opaque form works in practice, with a
                        code_change callback written per module
                        (https://www.erlang.org/doc/system/appup_cookbook.html).
                        Strength: strong, and stronger at ten times
                        the nodes, since the per-node code multiplies
                        while the engine's routine stays one.

