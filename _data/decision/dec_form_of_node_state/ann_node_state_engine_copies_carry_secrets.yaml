title:                  Secrets carried wherever the engine copies state
brief:                  |
                        A node may hold a secret, such as a session
                        key, in its state. If the engine holds and
                        copies state, or state is a token on a
                        feedback edge, the secret goes wherever the
                        engine copies state or tokens: saved state,
                        replay logs, inspection tools, edges between
                        processes. The chosen form should let a type
                        mark fields the engine must not record or
                        export.
description:            |
                        Sources: typed state lets the engine copy and
                        inspect it
                        (_data/decision/dec_form_of_node_state/opt_state_as_typed_data.yaml
                        lines 12-16); state on a feedback edge is an
                        output typed like any port, part of the graph
                        (opt_state_on_a_feedback_edge.yaml lines
                        12-16); the replay log option records every
                        value that entered the graph from outside
                        (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                        lines 12-19). Some federated segments may hold
                        personal data, such as PII on DTU members
                        under the GDPR (owner's statement,
                        2026-10-22T20:19, _sources/context.md line
                        25). Strength: moderate; it is a condition on
                        the typed forms that a field marking would
                        meet, and it rests on the outcome of the
                        replay decision and on the form of the data
                        dictionary, which would carry the marking.

