title:                  Link between a variant and an option
brief:                  |
                        How does a dataflow variant, such as a
                        simulation variant, relate to the option of a
                        decision that it is used to try?
description:            |
                        The owner at 2026-10-24T23:00Z expects
                        variants to be most useful as dataflow
                        simulations, world models that support or
                        oppose simulation-backed decisions, and the
                        Patrol drafts already plan one option per
                        variant with annotations citing runs
                        (_sources/variants-framing.md, sections 3 and
                        4, Q3;
                        _sources/cc-patrol-notes/draft/README.md lines
                        98-113).

