title:                  One relation as the only new part the link needs
brief:                  |
                        Citing a variant in an annotation's sources
                        adds nothing, and a tried-by relation adds one
                        register entry. The option with a
                        comparability check adds that relation plus a
                        check, run fields and a resolved-graph
                        difference tool, none of which exist, and
                        making the variant the option merges two item
                        types the register keeps apart.
description:            |
                        Sources:
                        - Every annotation gives its sources in its
                          description, and an annotation has no field
                          beyond identity, descriptive fields, rights
                          and edges. (_data/schema/sch_annotation.yaml
                          lines 18-30)
                        - Relations are register entries that carry
                          relation constraints as edges.
                          (_data/register/reg_relation.yaml lines
                          205-237, the supports entry as an example of
                          the form)
                        - The Patrol notes ask for one relation from
                          an option to the variant that tries it, and
                          say it is not needed until the first
                          experiment runs.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 112-113)
                        - The check needs variants of sibling options
                          to share scenario, measures, seed policy and
                          fidelity, and their resolved graphs to
                          differ only in the option's operations.
                          (_data/decision/dec_variant_and_option/opt_option_tried_by_variant_with_comparability_check.yaml
                          lines 12-19) The difference tool is listed
                          as a need, not as something that exists.
                          (_sources/variants-framing.md line 70) The
                          survey sizes the check "medium".
                          (_sources/survey/simulation-backed-decisions.md
                          line 141)
                        - "An option is not an annotation ... an
                          option proposes something", a candidate
                          answer held so it can be argued over.
                          (_data/register/reg_concept.yaml lines
                          403-413) A variant holds a base and an
                          ordered list of operations.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-16)
                        - _data holds one dataflow graph and no
                          variant, run or run schema. (directory
                          listing of _data in the snapshot;
                          _sources/survey/README.md line 80)
                        - Simplicity counts distinct mechanisms
                          introduced; cost counts development effort
                          in person days. A type, relation, field or
                          command is added only when a real instance
                          needs it. (_data/register/reg_concern.yaml
                          lines 489-490 and 611-617;
                          _data/decision/dec_growth_policy/ruling_growth_policy.yaml
                          lines 13-17)
                        - The owner wants the variant mechanism
                          "simple and elegant" and to "avoid a
                          proliferation of complication". (owner's
                          statement, 2026-10-25T05:45Z,
                          _sources/owner-2026-10-25-morning.md line 5)
                          Strength: strong against merging variant and
                          option and against the bundled check, at any
                          scale. Between citing and the relation,
                          citing adds nothing today, but at ten times
                          the variants only the relation answers which
                          variants tried an option, so the relation
                          becomes the simpler choice once the first
                          experiment runs. The check's cost is mostly
                          a one-off build, with upkeep that grows with
                          the run fields.

