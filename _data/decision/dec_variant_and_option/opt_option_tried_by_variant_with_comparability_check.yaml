title:                  Relation from an option to the variants that try it, with a comparability check
brief:                  |
                        A new relation says that an option is tried by
                        a dataflow variant, and a check requires that
                        the variants trying sibling options of one
                        decision share their scenario, measures, seed
                        policy and fidelity, and that their resolved
                        dataflow graphs differ only in the operations
                        of the option.
description:            |
                        The survey says the relation alone is not
                        enough without this check
                        (_sources/survey/README.md lines 69-72), from
                        SysML v2 trade studies
                        (_sources/survey/simulation-backed-decisions.md
                        line 141).

