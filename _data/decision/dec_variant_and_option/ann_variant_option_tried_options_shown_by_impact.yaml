title:                  Tried options shown to the reviewer of a variant change
brief:                  |
                        The commit impact command lists what a commit
                        touches and the untouched items linked to it,
                        so an edge from option to variant puts the
                        tried options in front of whoever reviews a
                        change to the variant. A citation in prose is
                        not a link and does not appear.
description:            |
                        Sources:
                        - The impact command lists what a commit adds,
                          removes, renames or changes, and the
                          untouched items linked to them, and agents
                          are told to read it before reviewing a
                          change. (AGENTS.md lines 201-204;
                          src/cctool/commit/impact.py lines 14-25)
                        - Its walk follows links, one step by default.
                          (src/cctool/commit/impact.py line 50)
                        - Under the no-link option the variant is
                          named only in an annotation's sources.
                          (_data/decision/dec_variant_and_option/opt_annotations_cite_variants.yaml
                          lines 12-16) Strength: strong; it holds at
                          any number of variants, and what the
                          reviewer would not see grows with them.

