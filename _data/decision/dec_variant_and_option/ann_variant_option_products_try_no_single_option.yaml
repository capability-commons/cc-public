title:                  Variants that try no single option
brief:                  |
                        Some variants are member products that record
                        settled answers differing by member product,
                        and one variant can bind several decisions at
                        once. A relation from option to variant lets a
                        member product variant try nothing and a test
                        variant try options of two decisions; making
                        the variant the option forces every member
                        product to be an option of some decision, and
                        of only one.
description:            |
                        Sources:
                        - Some variants reflect "settled decisions
                          that are not mutually compatible within one
                          system configuration", such as a platform
                          with two cameras and one with one. (owner's
                          statement, 2026-10-25,
                          _sources/owner-2026-10-25-morning.md line 5)
                        - The Legion draft is Patrol on the customer's
                          Legion laptop, and the Orin draft is what
                          every headless Orin dataflow variant shares.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 12-16;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 12-17)
                        - The mixed Orin draft has the superset Orin
                          variant as base and picks an output mode, so
                          it binds the platform and the output mode
                          together.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin_mixed.yaml
                          lines 12-18)
                        - One variant may bind several decisions at
                          once. (_sources/variants-framing.md line
                          106)
                        - An option is "one candidate answer to a
                          decision", held so it can be argued over,
                          and an option item carries one edge to one
                          decision. (_data/register/reg_concept.yaml at entries.concept_option;
                          _data/decision/dec_variant_and_option/opt_variant_is_the_option.yaml,
                          edge section)
                        - The Patrol notes ask for "one relation from
                          an option to the variant that tries it".
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 112-113) Strength: strong; at ten
                          times the variants, the share of member product and
                          test variants that try no single option
                          grows, and the conflict with the
                          variant-as-option reading grows with it.

