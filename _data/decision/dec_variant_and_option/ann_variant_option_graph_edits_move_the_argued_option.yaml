title:                  An argued option that changes with every graph edit
brief:                  |
                        If the variant is the option, each edit to its
                        operations changes the thing every annotation
                        on the option supports or challenges, so a
                        reviewer of a small graph edit must also judge
                        whether each existing argument still applies.
description:            |
                        Sources:
                        - Support and challenge target an annotation
                          or an option.
                          (_data/register/reg_relation.yaml at entries.relation_supports and entries.relation_challenges)
                        - The Patrol drafts reached v4 by 2026-10-22,
                          with v2 and v3 dated 2026-10-21.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 3, 80 and 15)
                        - Reviewability asks whether a change carries
                          only what it needs.
                          (_data/register/reg_concern.yaml at entries.concern_reviewability.question.1)
                          Strength: moderate; it grows with the number
                          of annotations per option.

