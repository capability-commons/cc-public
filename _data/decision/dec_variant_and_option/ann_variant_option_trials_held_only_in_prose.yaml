title:                  Trials of an option held only in prose
brief:                  |
                        With no link, the variants that tried an
                        option are named only in the prose sources of
                        annotations, and a check sees them only as ids
                        that an annotation's prose mentions, which
                        does not say whether the variant tried the
                        option or was cited for another reason; so no
                        check can reliably find an option with no run,
                        a variant whose option was ruled out, or the
                        reason for a variant no annotation cites yet.
                        With a relation, which variants tried an
                        option and which options a variant tries are
                        both queries over edges.
description:            |
                        Sources:
                        - Under the no-link option, an annotation
                          names the variant and run it rests on in its
                          sources.
                          (_data/decision/dec_variant_and_option/opt_annotations_cite_variants.yaml
                          lines 12-16)
                        - What an annotation is about and what it
                          argues with are edges, and its description
                          carries reasoning.
                          (_data/schema/sch_annotation.yaml lines
                          23-30)
                        - The checks are logic programs over facts the
                          extractor takes from the tree, among them
                          one row per edge.
                          (src/cctool/graph/extract.py lines 18-31 and
                          222-224) An id named in prose yields only a
                          mention fact, which records that a field
                          names the id and nothing of its role.
                          (src/cctool/graph/extract.py lines 301-304)
                        - The Patrol notes give a variant its reason
                          in its brief and description.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 102-103)
                        - Traceability asks whether each need can be
                          traced to what meets it, and counts elements
                          with no traced reason.
                          (_data/register/reg_concern.yaml lines
                          569-576) Strength: strong; with ten times
                          the variants and runs, a tie held in prose
                          must be found by reading every annotation,
                          while an edge query does not grow with the
                          reader's effort. It matters only once runs
                          exist.

