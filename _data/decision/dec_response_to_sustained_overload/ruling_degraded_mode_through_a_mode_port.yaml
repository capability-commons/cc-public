title:                  Degraded mode through a mode port
brief:                  |
                        Sustained overload is answered by a degraded
                        mode selected through a mode port. Ruled by
                        WTP on 2026-10-28, as recommended, with a
                        change: the mode may be part of a broader
                        control message given to each node at each
                        step, carrying the current time, both
                        monotonic and wall-clock, the mode flag and
                        any other application-specific states and
                        modes. Calling the system's time functions
                        would break determinism, so the time is
                        supplied rather than read. This is an
                        application-level convention more than a
                        mechanism the engine provides.

