title:                  Mode switch lag that the capacity margin must absorb
brief:                  |
                        Under the mode port, the control node must see
                        a sustained overrun before it acts, hysteresis
                        delays it further, and the change then takes a
                        stated number of steps to reach every node.
                        Queues keep growing for that whole time, so
                        the derived capacity needs a margin for the
                        switch lag as well as for jitter, which costs
                        memory on every edge it covers. Engine
                        shedding acts on the step it falls behind and
                        needs no such margin. The cost is bounded and
                        computable from the stated lag, so it weighs
                        against the mode port only modestly.
description:            |
                        Sources:
                        - Capacity is derived as maximum rate times
                          step period plus a jitter margin; occasional
                          overruns are absorbed by that margin; the
                          control node switches with hysteresis (WTP,
                          2026-10-28).
                        - The mode-port option states a requirement
                          that a change reaches every node within a
                          stated number of steps.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief)
                        - Without priority for events, a reactive
                          process network may postpone an event for
                          arbitrary periods, so the delay has to be
                          bounded explicitly (Geilen and Basten 2004,
                          Reactive process networks, section 5.4).
                        - DKPN's dynamic-priority policy reacts to
                          load by reading FIFO fill levels normalized
                          by capacity (Arras et al. 2016, DKPN, as
                          noted in round 2).
                        - Peak memory in megabytes is a measure of
                          performance efficiency.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure)
                          ASSUMPTION: the switch lag is a few steps,
                          so the extra margin is a few messages per
                          covered edge. Strength: moderate; it grows
                          with the lag in steps and the size of the
                          messages on the edges that fill during it.

