title:                  Mode flag on a port that keeps an overloaded run replayable
brief:                  |
                        With the mode flag on an ordinary port fed by
                        one control node and changing only at a step,
                        every switch is a value on an edge that the
                        trace records, and between switches the
                        network stays a plain Kahn network. A run that
                        degraded can then be replayed and its switch
                        points tested like any other input. Under
                        engine load shedding, what is dropped depends
                        on how fast each step ran, so the same inputs
                        give different outputs on another machine,
                        under a debugger, or in simulation. A fault
                        alone keeps replay, but only up to the fault.
description:            |
                        Sources:
                        - Between events a reactive process network
                          still obeys the Kahn principle, and the
                          events themselves travel on the same
                          channels as the data, distinguished only at
                          the receiver (Geilen and Basten 2004,
                          Reactive process networks, sections 3.2.6
                          and 5.5).
                        - In Lingua Franca a mode change takes effect
                          only after the current tag, and determinism
                          is defined for the same sequence of tagged
                          inputs, so a mode switch replays
                          (Schulz-Rosengarten et al. 2023, Polyglot
                          modal models through Lingua Franca, section
                          4.2).
                        - Back-pressure should not carry meaning; only
                          the data path determines results (Miranda et
                          al. 2010, Erbium, section on termination).
                        - The shedding option drops by timing, so a
                          run cannot be replayed from its inputs
                          alone.
                          (_data/decision/dec_response_to_sustained_overload/opt_load_shedding_by_the_engine.yaml
                          at description)
                        - The replay log option records every value
                          that entered the graph from outside.
                          (_data/decision/dec_replay_of_a_run_with_live_changes/opt_replay_from_a_recorded_log.yaml
                          at brief) ASSUMPTION: occupancy and
                          temperature enter as source ports whose
                          values the replay log records, so the
                          control node's decisions replay too.
                          Strength: strong; it would weaken only if
                          the engine logged every shed step, which
                          makes replay follow the log rather than the
                          inputs.

