title:                  Overrun fault still needed beneath degraded mode
brief:                  |
                        The mode-port option leaves its guarantee to
                        requirements and tests, and the engine
                        promises nothing. If the cheaper mode still
                        overruns, because throttling worsens or a
                        bound was wrong, the queues keep filling and
                        only the overflow fail-safe on each port
                        catches it, after data is already lost. The
                        fault-only option's mechanism, measuring each
                        step against its period and raising a fault on
                        a sustained overrun, is the last resort that
                        degraded mode still needs; Lingua Franca pairs
                        a deadline with a miss handler for the same
                        reason. The point favors keeping that
                        measurement whichever option is upheld, rather
                        than the fault-only option alone.
description:            |
                        Sources:
                        - The mode-port option makes emptying queues
                          and the time to reach every node
                          requirements with tests as evidence, and the
                          engine guarantees nothing about them.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief)
                        - The fault-only option measures each step
                          against its period and raises a fault on a
                          sustained overrun.
                          (_data/decision/dec_response_to_sustained_overload/opt_overload_raised_as_a_fault_only.yaml
                          at brief)
                        - Lingua Franca attaches a handler to a missed
                          deadline that may raise an alarm or switch
                          to a safe degraded mode (Lohstroh et al.
                          2021, Toward a Lingua Franca for
                          deterministic concurrent systems, section
                          3.7).
                        - KPN semantics give no bound on execution
                          time, so a step-time bound must be stated
                          and measured separately (Dulloo and Marquet
                          2004, Design of a real-time scheduler for
                          Kahn process networks on multiprocessor
                          systems, as noted in round 2).
                        - Overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                        - Safety asks what state the system falls back
                          to when it fails.
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question) Strength:
                          strong as a requirement on the upheld
                          option; it is answered by adding the overrun
                          fault to the mode-port option, and then no
                          longer challenges it.

