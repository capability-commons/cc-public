title:                  Induced overload that chooses what the engine drops
brief:                  |
                        Anyone who can raise the load, by flooding an
                        input from outside or heating the processor,
                        can trigger the overload response. Under
                        engine shedding that hands an attacker a lever
                        on what data is lost, with nothing in the
                        graph or trace saying why a step went missing.
                        Under the mode port the response is designed
                        and tested in advance, only the one control
                        node can set the flag, and the trace records
                        the measured values that made it switch. Input
                        beyond a producer's stated maximum rate is
                        overflow at the port, not overload, so its
                        declared fail-safe applies first.
description:            |
                        Sources:
                        - Each mode flag has one writer, and whatever
                          raised it is visible in the graph and the
                          trace.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief and description)
                        - BPDF gives each boolean parameter a single
                          modifier actor (Bebelis et al. 2013, BPDF,
                          section 2.2).
                        - Every producer has a stated maximum rate and
                          overflow is a broken requirement with a
                          declared fail-safe (WTP, 2026-10-28).
                        - Security asks whether every action can be
                          traced and what an attacker can reach.
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question)
                          ASSUMPTION: some of Patrol's inputs, such as
                          commands over a network, are reachable by
                          others. Strength: moderate; an attacker who
                          can force degraded mode still degrades the
                          robot under any option, so the gain is in
                          predictability and accountability.

