title:                  Fault-only response that stops Patrol in its common overload
brief:                  |
                        On the Orin the expected overload is the
                        camera at 30 Hz outrunning inference, possibly
                        made worse by thermal throttling, so it is a
                        condition of service, not a rare failure.
                        Raising a fault and leaving the rest to fault
                        handling gives no way to go on at reduced
                        quality, so Patrol would stop or restart
                        whenever inference falls behind. A cheaper
                        mode keeps the robot doing its task, with
                        fewer detections or a lower inference rate.
                        The fault-only option suits graphs where an
                        overrun is never expected in service, which
                        Patrol's is not.
description:            |
                        Sources:
                        - Patrol, on an NVIDIA Orin with a camera at
                          30 Hz, is the engine's first user; degraded
                          mode is for a step that consistently takes
                          longer than its period, triggered by a
                          control node watching queue sizes or
                          processor temperature (WTP, 2026-10-28).
                        - Overload where a producer outruns a
                          consumer, camera rate against inference, is
                          called the common case on the Orin.
                          (/mnt/project-files/notes/literature/part-2/README.md,
                          part 4 of the section on the one thing that
                          changes a ruling)
                        - The fault-only option is enough only where
                          an overrun is never expected in service and
                          gives no way to keep running at reduced
                          quality.
                          (_data/decision/dec_response_to_sustained_overload/opt_overload_raised_as_a_fault_only.yaml
                          at description)
                        - Availability in percent of scheduled time is
                          a measure of reliability.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reliability.measure)
                          ASSUMPTION: Patrol's mission tolerates
                          reduced detection quality for a while better
                          than a stop. Strength: strong for Patrol;
                          weak for a graph whose load is fixed and
                          proven to fit its period.

