title:                  Response to sustained overload
brief:                  |
                        What happens when a step consistently takes
                        longer than its period, so that work arrives
                        faster than it is done?
description:            |
                        This is overload, as when a camera's rate
                        outruns inference on an Orin, and it differs
                        from a capacity deadlock caused by topology
                        and rates. An occasional overrun is absorbed
                        by the margin in the capacity (WTP,
                        2026-10-28). Precedents for a planned response
                        include mode switches at iteration boundaries
                        in scenario-aware dataflow (Theelen et al.
                        2006), mixed-criticality scheduling (Vestal
                        2007), imprecise computation (Liu et al. 1991)
                        and load shedding in stream processors such as
                        Aurora and Borealis.

