title:                  Load shedding by the engine
brief:                  |
                        The engine drops whole steps, or messages on
                        edges marked as sheddable, when it falls
                        behind, and nodes know nothing of it.
description:            |
                        The approach of stream processors such as
                        Aurora and Borealis. It needs no node code,
                        but puts a policy in the engine, against the
                        ruling on where engine behavior lives, and
                        what is dropped depends on timing, so a run
                        cannot be replayed from its inputs alone.

