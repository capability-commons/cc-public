title:                  Shedding policy carried in every engine build and target
brief:                  |
                        Load shedding is a policy in the engine, so
                        its code, its timing measurements and its
                        choice of what to drop are in every build and
                        must work on every target, including one with
                        no operating system, and changing the policy
                        is an engine change. The mode-port option
                        keeps the policy in a control node that is
                        fixed, replaced or tuned like any other node,
                        and needs from the engine only the occupancy
                        source ports, a small recorded exception.
                        Fault-only adds the least to the engine, a
                        step timer and a fault. The minimal-engine
                        ruling admits shedding only if no node can do
                        it within a measured budget, and nothing yet
                        shows that a control node cannot.
description:            |
                        Sources:
                        - The engine does nothing a node could do, and
                          a behavior moves into it only when a
                          recorded decision shows no inserted node can
                          do it within a measured budget.
                          (_data/decision/dec_where_engine_behavior_lives/ruling_minimal_engine_with_recorded_exceptions.yaml
                          at brief)
                        - Code in the engine is in every build and on
                          every target, and every change to it is an
                          engine change.
                          (_data/decision/dec_where_engine_behavior_lives/ann_service_code_in_every_engine_build_and_target.yaml
                          at brief)
                        - The shedding option puts a policy in the
                          engine, against the ruling on where engine
                          behavior lives.
                          (_data/decision/dec_response_to_sustained_overload/opt_load_shedding_by_the_engine.yaml
                          at description)
                        - The engine is a new C++ engine aiming for
                          embedded reach (WTP, 2026-10-28). Strength:
                          strong; it would weaken only if a
                          measurement showed the control node's
                          reaction too slow for the budget, which
                          would then be the recorded exception.

