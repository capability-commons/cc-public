title:                  Overload raised as a fault only
brief:                  |
                        The engine measures each step against its
                        period and raises a fault on a sustained
                        overrun; what happens next is left to the
                        system's own fault handling.
description:            |
                        The smallest engine, and enough where an
                        overrun is never expected in service. It gives
                        no way to keep running at reduced quality.

