title:                  Engine shedding that cannot tell which data feeds a safety function
brief:                  |
                        An engine that drops whole steps, or messages
                        on edges marked sheddable, does not know which
                        outputs a safety function depends on, so a
                        dropped step can starve an obstacle stop as
                        readily as a logger. Mixed-criticality
                        scheduling keeps the high-criticality work and
                        sheds the rest; the mode port does the same by
                        construction, since a node with no mode port
                        never degrades and the designer chooses which
                        nodes have one. Marking edges sheddable
                        recovers some of this, but the choice is
                        spread over edges and the effect of a drop on
                        downstream nodes is not stated anywhere.
description:            |
                        Sources:
                        - Mixed-criticality scheduling (Vestal 2007)
                          is one of the precedents the decision names
                          for a planned response.
                          (_data/decision/dec_response_to_sustained_overload/dec_response_to_sustained_overload.yaml
                          at description) ASSUMPTION: as usually
                          described, mixed-criticality scheduling
                          keeps the high-criticality work under
                          overload and sheds the rest; no literature
                          note covers it.
                        - A node with no mode port never degrades, and
                          a switched-off node sends an empty list.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief and description)
                        - Shedding drops whole steps, or messages on
                          sheddable edges, and nodes know nothing of
                          it.
                          (_data/decision/dec_response_to_sustained_overload/opt_load_shedding_by_the_engine.yaml
                          at brief)
                        - In a block diagram with triggers, a block
                          that is not fired holds its last output,
                          starting from a value the user gives
                          (Lublinerman and Tripakis 2008, Translating
                          data flow to synchronous block diagrams, as
                          noted in round 2), where a node switched off
                          by the mode port sends an empty list; what a
                          stopped node emits is a choice with effects
                          downstream.
                        - Safety asks how each hazard is avoided or
                          limited. (_data/register/reg_concern.yaml at
                          entries.concern_safety.question) ASSUMPTION:
                          Patrol's graph mixes safety functions with
                          work that may degrade, such as full-rate
                          inference or recording. Strength: strong
                          against dropping whole steps; moderate
                          against sheddable edges, which a check could
                          confine away from safety paths.

