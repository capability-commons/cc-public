title:                  Temperature source that ties degraded mode to a platform
brief:                  |
                        The mode-port option reads processor
                        temperature from the platform, which on the
                        Orin means NVIDIA's own interfaces and on a
                        later target means another vendor's. That
                        dependence is real but sits in one source node
                        per platform, swapped by a variant, and queue
                        occupancy comes from the engine with no third
                        party at all. Engine shedding and fault-only
                        need only a clock. No option takes a
                        third-party library, so the options are close
                        under dependency risk, with the mode port's
                        platform exposure contained.
description:            |
                        Sources:
                        - The platform exposes temperature as a source
                          port.
                          (_data/decision/dec_response_to_sustained_overload/opt_degraded_mode_through_a_mode_port.yaml
                          at brief)
                        - Patrol runs on an NVIDIA Orin; the engine
                          targets embedded reach (WTP, 2026-10-28).
                        - Dependency risk asks what happens if a third
                          party's part is changed or withdrawn.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question)
                          ASSUMPTION: the Orin exposes temperature
                          through vendor-specific interfaces of its
                          Linux board support package, and another
                          target would expose it differently or not at
                          all. ASSUMPTION: a control node can still
                          trigger on occupancy alone where no
                          temperature source exists. Strength: weak;
                          it decides nothing between the options and
                          marks where porting work falls.

