title:                  Run fields with no place in the annotation schema
brief:                  |
                        An annotation carries nothing beyond the
                        standalone fields and its edges, so inline run
                        fields have no home without a change to the
                        annotation schema, and they are not facts an
                        edge can reach.
description:            |
                        Sources:
                        - Identity, the descriptive fields and rights
                          come from the
                          standalone schema, the edges from the edge trait, and an
                          annotation carries nothing beyond them.
                          (_data/schema/sch_annotation.yaml at description)
                        Strength: strong; it holds for the first
                        inline run.

