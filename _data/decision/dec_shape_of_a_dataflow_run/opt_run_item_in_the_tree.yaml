brief:                  |
                        A dataflow run is an item in _data, in the
                        style of a SED-ML experiment record, naming
                        its variant and resolved digest, parameter
                        bindings, input data by digest, seeds, host
                        and engine build, with its outputs as a table
                        of named measures.

