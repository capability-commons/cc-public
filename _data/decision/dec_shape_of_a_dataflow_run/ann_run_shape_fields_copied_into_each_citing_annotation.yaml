title:                  Run fields copied into each citing annotation
brief:                  |
                        With no run record, each annotation that draws
                        on a run carries its fields, and the survey's
                        pattern puts at least two annotations on one
                        run, the measured claim and its
                        interpretation. The copies can disagree, a
                        correction touches each one, and there is no
                        item to trace to. One record, in the tree or
                        in a store, holds the fields once.
description:            |
                        Sources:
                        - An annotation that draws on a run carries
                          the run's fields
                          itself. (the inline option, brief)
                        - The survey proposes one annotation for what
                          a run measured and a
                          second that interprets it. (_sources/survey/README.md lines 57-60)
                        - Maintainability counts parts touched by a
                          representative change.
                          (_data/register/reg_concern.yaml line 400)
                        - Simplicity counts jobs done by more than one
                          mechanism.
                          (_data/register/reg_concern.yaml lines 489-490)
                        Strength: strong; copies grow with annotations
                        per run. The store is challenged on other
                        grounds.

