title:                  A run record the checks can read
brief:                  |
                        The proposed staleness and comparability
                        checks read a variant's resolved digest and a
                        run's scenario, measures and seed policy, and
                        the checks read facts extracted from the tree.
                        A run item puts them there, held to its schema
                        and references by the checker that exists, and
                        reached by a rename. A record in an artifact
                        store is a second storage mechanism that the
                        checks do not read, in a store that does not
                        exist, and a digest that names nothing there
                        fails no check.
description:            |
                        Sources:
                        - A run records host, commits, inputs and
                          rates, latency, frame
                          age, CPU and GPU load. (_sources/cc-patrol-notes/draft/README.md
                          lines 104-106)
                        - The extractor reads the YAML files under a
                          _data directory and
                          returns the facts they hold, which the logic programs are
                          grounded on. (src/cctool/graph/extract.py lines 19-25;
                          src/cctool/graph/logic.py lines 390-392)
                        - The staleness option reads the variant's
                          resolved digest, and the
                          comparability option the scenario, measures, seed policy and
                          fidelity of runs.
                          (_data/decision/dec_staleness_of_run_evidence/opt_stale_on_any_digest_change.yaml
                          lines 12-16;
                          _data/decision/dec_comparability_of_runs_across_options/opt_comparability_check_over_sibling_runs.yaml
                          lines 12-18)
                        - The rename command rewrites every whole-id
                          match in YAML text.
                          (src/cctool/edit/edit.py lines 1086-1106)
                        - A new item type adds a prefix, a schema, a
                          register entry and a
                          folder.
                          (_data/decision/dec_how_variants_are_held/ann_new_variant_type_adds_parts.yaml
                          lines 12-17)
                        - The Patrol draft adds the run type at the
                          first experiment.
                          (_sources/cc-patrol-notes/draft/README.md lines 112-113)
                        - ASSUMPTION: no artifact store exists for
                          cc-public; none appears
                          in pyproject.toml or src.
                        Strength: strong for the measure table. At ten
                        times the runs the volume in _data may favor a
                        store for bulk outputs, which no option
                        separates from the measures.

