title:                  A run reachable from both ends
brief:                  |
                        A run item is a link target that options,
                        annotations and variants reach by edges, and
                        from which the variant is reached by its
                        fields. A record in an artifact store is
                        reached only one way, by digest from an
                        annotation, so no query over the tree can list
                        the runs of a variant.
description:            |
                        Sources:
                        - MIASE: all models used in the experiment
                          must be identified,
                          accessible and fully described, and any pre-processing change to
                          a model must be described.
                          (https://en.wikipedia.org/wiki/Minimum_information_about_a_simulation_experiment)
                        - The store option refers to a run by content
                          digest from an
                          annotation. (the store option, brief)
                        Strength: strong; with ten times the runs,
                        one-way links cannot answer which runs of this
                        variant exist.

