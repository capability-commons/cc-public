title:                  Runs that travel with the package
brief:                  |
                        The _data tree ships in the package, so a run
                        item reaches every consumer with the
                        annotations that cite it. A record in an
                        artifact store does not ship, and a released
                        annotation would cite a digest consumers
                        cannot resolve. A run item in the style of a
                        SED-ML task, which pairs a model with
                        simulation settings, has a standard
                        counterpart for export, and inline fields have
                        none.
description:            |
                        Sources:
                        - cc-public's _data ships in the package.
                          (_data/decision/dec_what_crosses_between_segments/ruling_segments_exchange_files_until_needed.yaml at brief)
                        - The owner ships the whole of _data. (owner's
                          statement,
                          2026-10-22, _sources/context.md line 22)
                        - A SED-ML task combines a model and a
                          simulation setting, and
                          SED-ML is not specific to particular simulation tools.
                          (https://sed-ml.org/)
                        Strength: strong; unresolvable citations grow
                        with released runs.

