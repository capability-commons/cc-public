title:                  Engine interface outside the data and commands
brief:                  |
                        The C++ engine and its generator ship in the
                        package peers install, and the first peer's
                        plan has its nodes built against the engine's
                        C-linkage interface, so that interface is
                        planned to be something a partner uses
                        directly. The data-and-commands option names
                        only the data format and the command line,
                        which leaves the engine interface free to
                        change in a minor release; interface control
                        documents cover it through native c and cpp
                        surfaces, and the everything-shipped option
                        covers it with all else.
description:            |
                        Sources:
                        - The engine, with its generator, ships in the
                          same package that peers install
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml,
                          brief).
                        - Patrol's nodes are native C++ step functions
                          called by the engine; the plan recommends
                          the
                          engine and node ABI stay C++17 with C linkage, with Patrol nodes C++20 behind that ABI
                          (_sources/cc-patrol-notes/plan.md lines 88-98).
                        - The data-and-commands option names schemas,
                          registers, ids of types and relations, and
                          the
                          cctool command line as public, and Python modules as internal; it says nothing of C or C++
                          (_data/decision/dec_declared_public_api/opt_public_api_is_data_and_commands.yaml at brief).
                        - The interface control document schema has
                          native surfaces in python, c and cpp
                          (_data/schema/sch_interface_control_document.yaml at $defs.surface_native), and the C++ signature check
                          is ruled no later than the first document with a native cpp surface, covering native c too
                          (_data/decision/dec_check_of_cpp_interfaces/ruling_cpp_interfaces_checked_from_the_first.yaml,
                          brief).
                        - The engine is not built yet; src holds only
                          the cctool package (listing of src).
                        - Assumption: the C++ the generator writes
                          from a dataflow graph is compiled into a
                          peer's
                          product, so its form is part of what a peer builds against (plan.md lines 103-105).
                        Depends on: who consumes a release (whether
                        what a peer builds in is a library with
                        declared ranges),
                        _data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml.
                        Strength: strong, and stronger with ten times
                        the peers, since each further peer compiles
                        against the same interface and the
                        data-and-commands option gives none of them a
                        signal when it breaks. It would weaken only if
                        that option were amended to name the engine
                        interface.

