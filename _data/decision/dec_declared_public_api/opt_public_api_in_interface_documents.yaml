title:                  Public API in interface control documents
brief:                  |
                        The public API is what the interface control
                        documents declare: the cctool commands, the
                        Python interfaces peers call, and the schemas,
                        registers and ids of the data. A change to
                        anything an interface control document
                        declares is judged against it, and anything no
                        such document declares may change in a minor
                        release.

