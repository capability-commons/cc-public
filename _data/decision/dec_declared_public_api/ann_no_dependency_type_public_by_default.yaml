title:                  Dependency types kept out of the public API unless a document opts in
brief:                  |
                        Under the option, Python is public only where
                        a document declares it public, so the check
                        interface, which names a cctool type holding
                        ruamel.yaml round-trip objects, can stay
                        internal, and no type of pyoxigraph,
                        referencing, htpy or ruamel.yaml, all below
                        1.0, is public by default. The
                        interface-documents option makes that
                        interface public on the day of the ruling, and
                        the everything-shipped option makes every such
                        type public.
description:            |
                        Sources:
                        - The option: code is "public only where an
                          interface control document declares it
                          public, and
                          private otherwise"
                          (_data/decision/dec_declared_public_api/opt_public_api_split_by_kind.yaml at brief).
                        - Interface documents: "A change to anything
                          an interface control document declares is
                          judged
                          against it"
                          (_data/decision/dec_declared_public_api/opt_public_api_in_interface_documents.yaml at brief).
                        - The check interface is the seam through
                          which cctool's own command line, commit gate
                          and
                          editing commands check, and its functions take a parameter typed as cctool's Documents type
                          (_data/interface_control_document/icd_cctool_check.yaml at description, surface.python.native.function.check_documents.parameter and surface.python.native.function.do_review_documents.parameter),
                          whose values are documents read into ruamel.yaml's round-trip types (src/cctool/graph/parse.py within load; src/cctool/graph/extract.py within Documents).
                        - The runtime ranges are pyoxigraph below 0.6,
                          referencing below 1, htpy below 27 and
                          ruamel.yaml below 0.20 (pyproject.toml at project.dependencies); under major version zero "Anything MAY
                          change at any time" (https://semver.org/, item 4).
                        - When a dependency's types are exposed in a
                          crate's API, "a semver incompatible upgrade
                          of these
                          dependencies is a breaking change for this package"
                          (https://rust-lang.github.io/rfcs/3516-public-private-dependencies.html).
                        Strength: strong, and stronger with ten times
                        the modules and documents, since the exposed
                        dependency types grow only with the documents
                        someone chooses to mark public. It holds only
                        if the check interface is marked internal and
                        the closure rule already recorded for declared
                        members is adopted for each document marked
                        public.

