title:                  Major releases for changes no peer sees
brief:                  |
                        Under everything-shipped, any rename or
                        removal of a shipped item, command or module
                        is breaking, and most of what ships is
                        decision records and internal Python no peer
                        is known to use. Majors then come for changes
                        that touch no peer, so the version stops
                        telling a peer whether an upgrade affects it,
                        and a fix or a speedup that moves or renames
                        anything internal waits a whole major cycle
                        instead of shipping as a patch or minor
                        release.
description:            |
                        Sources:
                        - The everything-shipped option makes the
                          removal or rename of any item, command or
                          module
                          breaking (_data/decision/dec_declared_public_api/opt_public_api_is_everything_shipped.yaml at brief).
                        - The package ships the whole of _data
                          (owner's statement, 2026-10-22). About
                          2,260 of
                          about 2,680 id lines under _data are under _data/decision (advocate's count of this snapshot).
                        - src/cctool holds 57 modules and about 700
                          function and class definitions outside
                          tests, about
                          350 of them without a leading underscore (advocate's count).
                        - Owner's statement, 2026-10-22: most
                          changes to the graph "will eventually be
                          confined to
                          partner segments", and _data "corresponds to the public segment".
                        - A peer under SemVer can accept every release
                          below the next major
                          (_data/decision/dec_version_scheme/ann_semver_lets_peers_pin_a_safe_range.yaml, brief); after
                          1.0, breaking work waits on next until a major release
                          (_data/decision/dec_breaking_work_after_version_one/ruling_breaking_work_after_version_one.yaml);
                          a major release needs coordination and a person, and the owner wants "to be able to respond to
                          reported problems quickly and largely automatically" (owner's statement, 2026-10-22).
                        - "performance DOES still matter a lot, as we
                          will need to be able to respond quickly to
                          things" (owner's statement, 2026-10-22). The commit gate takes about 78 s for a code
                          commit (context note); extracting the snapshot took 12.8 s in the advocate's container.
                        - Under the other two options, Python modules
                          that no document declares may change in a
                          minor
                          release, or in any release (the two option files, lines 17-20 and 15-16).
                        - PEP 8: "All undocumented interfaces should
                          be assumed to be internal"
                          (https://peps.python.org/pep-0008/); SemVer asks that the public API be "precise and
                          comprehensive" (https://semver.org/, item 1).
                        - Assumption: no peer references cc-public
                          decision records; the cc-patrol drafts
                          reference
                          cc-public only by its public mark and its realizes relation (grep of the drafts).
                        - Assumption: some fixes and speedups remove
                          or rename a module, a check predicate or an
                          item.
                          Restructuring that renames nothing is unaffected under every option.
                        Strength: strong, and grows with items, code
                        and peers: more of each means more majors no
                        peer needed and more fixes that touch
                        something this option makes public. The cost
                        of the next branch growing during a major
                        cycle is a separate point, already recorded
                        under the version scheme.

