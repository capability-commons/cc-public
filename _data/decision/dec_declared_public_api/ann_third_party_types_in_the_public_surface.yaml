title:                  Third-party types in the public surface
brief:                  |
                        Several public-looking cctool functions take
                        or return types of cctool's own dependencies,
                        three of which are below 1.0. Under
                        everything-shipped all of them are public, so
                        a semver-incompatible upgrade of pyoxigraph,
                        referencing, htpy or ruamel.yaml becomes a
                        breaking change of cc-public; the
                        data-and-commands option keeps every
                        dependency behind the boundary, and interface
                        documents expose only what declared members
                        name.
description:            |
                        Sources:
                        - cctool.graph.sparql.store returns a
                          pyoxigraph Store (src/cctool/graph/sparql.py within store),
                          cctool.graph.sparql.value takes pyoxigraph terms (line 161), cctool.check.schema.registry_of
                          returns a referencing Registry (src/cctool/check/schema.py within registry_of), and cctool.web.step.figure
                          returns an htpy Element (src/cctool/web/step.py within figure). Documents carries ruamel.yaml
                          round-trip objects (src/cctool/graph/extract.py within YAML and Documents). These are found by type
                          annotations alone, so they are a lower bound.
                        - The runtime ranges are click below 9, clingo
                          below 6, htpy below 27, jsonschema below 5,
                          pyoxigraph below 0.6, referencing below 1 and ruamel.yaml below 0.20 (pyproject.toml at project.dependencies).
                        - SemVer: under major version zero "Anything
                          MAY change at any time"
                          (https://semver.org/, item
                          4); updating one's own dependencies without changing the public API "would be considered
                          compatible since it does not affect the public API" (https://semver.org/, FAQ).
                        - Rust: when a dependency's types are exposed
                          in a crate's API, "a semver incompatible
                          upgrade of
                          these dependencies is a breaking change for this package"
                          (https://rust-lang.github.io/rfcs/3516-public-private-dependencies.html).
                        - Only the owner can relock, and a
                          pyproject.toml edit makes the lock stale
                          (context note).
                        - A Lock commit that pulls in a breaking
                          upstream release can be counted as minor or
                          patch is
                          already recorded (_data/decision/dec_version_scheme/ann_commit_verbs_do_not_say_what_breaks.yaml);
                          this annotation is about which upgrades are breaking at all.
                        - The support for interface documents holds
                          subject to the closure rule argued in the
                          annotation
                          on types a declared member names.
                        Strength: strong; with ten times the modules,
                        everything-shipped ties cc-public's major
                        releases to the release cadence of every
                        dependency whose types any module shows.

