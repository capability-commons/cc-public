title:                  Breaks traced to a member and an interface version
brief:                  |
                        Each interface control document carries its
                        own version, and a new version supersedes the
                        old one by an edge, so a major bump of the
                        package can name the members and interface
                        versions that called for it. Neither
                        everything-shipped nor data-and-commands
                        records a version beneath the package.
description:            |
                        Sources:
                        - Every interface control document requires an
                          interface version
                          (_data/schema/sch_interface_control_document.yaml at allOf.2.required and allOf.2.properties), and all four are at 1.0
                          (icd_cctool_check.yaml just after description, icd_printer.yaml at version_interface, 8a40b7e7:_data/interface_control_document/icd_process_controller.yaml at version_interface,
                          8a40b7e7:_data/interface_control_document/icd_system_controller.yaml at version_interface, under _data/interface_control_document).
                        - A new version of an interface is a new
                          document that names the one it replaces with
                          the
                          supersedes relation (sch_interface_control_document.yaml at note), and a check limits
                          supersession to items of the same type (src/cctool/check/check.lp within supersession_across_types).
                        - The impact rules report each item a commit
                          changes, by digest, embedded members
                          included
                          (src/cctool/commit/impact.lp within touched).
                        - The owner wants the notes generated
                          mechanically from the graph (owner's
                          statement,
                          2026-10-22).
                        - Kubernetes ties removal to a version of the
                          part removed: "API elements may only be
                          removed by
                          incrementing the version of the API group" (Rule 1,
                          https://unofficial-kubernetes.readthedocs.io/en/latest/home/deprecation-policy/).
                        Strength: moderate, growing with the number of
                        interfaces, since a single package number says
                        less as the package grows. Under
                        everything-shipped, renames and removals of
                        items still trace to their commits
                        (_data/decision/dec_version_scheme/ann_bump_follows_from_checked_commit_items.yaml).
                        No check yet holds a change to a member to a
                        new interface version, so that trace is only
                        as good as the person editing it.

