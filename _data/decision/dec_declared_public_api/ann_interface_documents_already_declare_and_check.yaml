title:                  Interface documents as the declaration already in place
brief:                  |
                        The repository already has a mechanism that
                        states a boundary member by member and holds
                        it to the code: the interface control
                        document, linked from code by the realizes
                        relation and checked for names, order and
                        types. Declaring the public API as what those
                        documents state adds a rule but no new record
                        for the Python, C and C++ surfaces.
                        Everything-shipped needs a second way to find
                        changes across a code boundary that has no
                        items, and data-and-commands, which needs no
                        code boundary today, would need a second way
                        to state one as soon as it covers the engine.
description:            |
                        Sources:
                        - An interface control document is "a
                          versioned contract for one interface, made
                          of surfaces
                          whose members can each be pointed at" (_data/schema/sch_interface_control_document.yaml at brief), and carries an interface version (same file at allOf.2.properties.version_interface).
                        - Code names the member it implements with the
                          realizes relation, so the document names no
                          implementation (same file at note); the graph follows that edge to derive the code that
                          bears on a dataflow node realizing the interface (src/cctool/graph/derive.lp within bears_on).
                        - A function member restates its signature,
                          and two checks hold it to the code
                          (_data/decision/dec_interface_signature_restated/ruling_interface_signature_restated.yaml,
                          brief); C++ and C native surfaces get the same check no later than their first document
                          (_data/decision/dec_check_of_cpp_interfaces/ruling_cpp_interfaces_checked_from_the_first.yaml,
                          brief).
                        - The impact rules already list each item a
                          commit adds, removes, renames or changes
                          (src/cctool/commit/impact.lp within touched); no bump computation exists yet in src/cctool (grep).
                        - The engine ships in the same package as the
                          tooling, and its node ABI is planned with C
                          linkage
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml,
                          brief; _sources/cc-patrol-notes/plan.md lines 90-96); the data-and-commands option names no
                          rule for the engine's surface.
                        Strength: holds at ten times the items, since
                        the declaration grows with the boundary, not
                        with the code behind it; weaker for the
                        command line and the data, where the
                        annotations on commands without an item and on
                        the data format stated twice apply.

