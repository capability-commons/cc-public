title:                  New extractor for the command line document
brief:                  |
                        A command line document restates what the code
                        already says, and a restatement is accepted
                        only if checked mechanically, which the
                        existing parameter checks cannot do because
                        they compare Python parameter names, not flag
                        spellings. The smallest check reads click's
                        own description of each command, one new
                        extractor of a new kind, since it imports code
                        where today's extraction parses source.
description:            |
                        Sources:
                        - A restated signature is accepted on
                          condition that it is checked mechanically
                          (_data/decision/dec_interface_signature_restated/ruling_interface_signature_restated.yaml,
                          brief).
                        - The parameter and signature checks apply
                          only to a Python function item that realizes
                          a
                          member, and compare Python parameter names and positions (src/cctool/check/check.lp lines
                          772-775 and 814-886).
                        - A click option's Python name can differ from
                          its command line spelling: --json binds
                          is_json
                          (src/cctool/cli/querying.py lines 121-123). Spellings, types, defaults and help text are in
                          the decorators, not the signature (src/cctool/cli/checking.py lines 43-50).
                        - click's core objects have had a to_info_dict
                          method since click 8.0.0
                          (https://click.palletsprojects.com/en/stable/changes/, version 8.0.0);
                          cctool requires click 8.2 or later (pyproject.toml line 43). With click 8.5.0 it returned
                          each parameter's name, opts, type, required, default, multiple, is_flag and hidden for a test
                          command (advocate's run).
                        - Python facts are extracted today by parsing
                          source (src/cctool/graph/extract.py line
                          1134),
                          not by importing it. Assumption: importing the command module at check time is acceptable;
                          if not, parsing click decorators from the syntax tree is more code.
                        - The surface forms are closed and extended by
                          a deliberate schema change
                          (_data/decision/dec_interface_surface_scope/ann_a_new_form_is_a_deliberate_change.yaml,
                          brief).
                        Strength: strong as a cost, growing with the
                        number of commands, 29 today plus any peer
                        group; an unchecked command document would be
                        a second statement of the command line free to
                        drift. It sizes the cost as one surface form
                        and one extractor, no new tool. It bears
                        equally on the interface-documents option as
                        worded, which also claims to declare the
                        commands.

