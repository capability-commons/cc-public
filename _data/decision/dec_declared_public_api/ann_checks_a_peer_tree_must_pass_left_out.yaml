title:                  Rules a peer's tree must pass, left out of every option
brief:                  |
                        A peer's gate runs cc-public's checks over the
                        peer's own tree, so a minor release that adds
                        a check or tightens a schema can fail a peer
                        tree that passed before and stop its commits,
                        though nothing was renamed or removed. None of
                        the three options counts that as breaking, and
                        the bump cannot trace the peer's new failure
                        to any declared element.
description:            |
                        Sources:
                        - cc-patrol's gate checks the union of both
                          roots and needs cctool check over two roots
                          (_sources/cc-patrol-notes/plan.md lines 18-21 and 65-68).
                        - check.lp shows 82 checks, where each row is
                          one failure, and advise.lp 9 kinds of advice
                          (src/cctool/check/check.lp; grep of show statements). Advice is reported but neither
                          fails the check nor refuses an edit, and a check is either a failure or advice, never both
                          (src/cctool/check/check.py; _data/interface_control_document/icd_cctool_check.yaml at surface.python.native.function.review.guarantee).
                        - cctool runs in a peer's commit hooks, which
                          fail closed
                          (_data/decision/dec_who_consumes_a_release/ann_peer_runs_the_set_the_release_gate_tested.yaml).
                        - From 1.0, peers can accept every release
                          below the next major
                          (_data/decision/dec_version_scheme/ann_semver_lets_peers_pin_a_safe_range.yaml).
                        - A new check or a tightened schema adds or
                          changes items and renames or removes none
                          (src/cctool/commit/change.lp within before_guid and added), so a bump computed from them would read it as
                          minor; no bump computation exists yet.
                        - The check interface declares the check
                          functions and the shape of their failures,
                          but not
                          which checks exist (icd_cctool_check.yaml at declaration and surface.python.native.function).
                        - The data-and-commands option says the
                          commands are public but not whether a
                          passing check is
                          part of what a command promises (opt_public_api_is_data_and_commands.yaml, brief).
                        - Related: behavior changes that touch no id
                          are already recorded under the version
                          scheme
                          (_data/decision/dec_version_scheme/ann_commit_verbs_do_not_say_what_breaks.yaml).
                        Depends on: who consumes a release; under the
                        end-user option a peer still takes the new
                        checks with each release it installs, though
                        it chooses when. Strength: strong; with ten
                        times the peers, one tightened rule stops ten
                        gates at once. A condition that would answer
                        it under any option: a new or tightened check
                        arrives as advice in a minor release and
                        becomes a failure only in a major one.

