title:                  Command line with no item and no surface form
brief:                  |
                        The cctool commands are neither items nor a
                        surface form an interface control document can
                        hold, so the history check cannot see a
                        command renamed or removed, and nothing in the
                        graph can say why a command exists. All three
                        options count the commands as public, so each
                        needs one new mechanism here: per-command
                        items, a command surface in the document
                        schema, or a reading of the click
                        registrations; the interface-documents option
                        also claims, in its own wording, that
                        documents declare the commands, which the
                        schema cannot yet express.
description:            |
                        Sources:
                        - A surface is exactly one of native, dataflow
                          step or artifact, and a native surface names
                          one
                          of python, c or cpp (_data/schema/sch_interface_control_document.yaml at description, $defs.surface.propertyNames.enum and $defs.surface_native.properties.language). None is a command line.
                        - cctool has 39 commands in 7 click groups,
                          and no command is an item; the command
                          modules
                          under src/cctool/cli carry module items only (advocates' grep and extract of this snapshot).
                        - A class or function gets an item only when
                          something must point at it (AGENTS.md#changing-data-items); renames and removals are detected on items by guid (src/cctool/commit/change.lp within before_guid and added).
                        - The commands and their arguments are listed
                          in prose only (README.md#cctool).
                        - The interface-documents option says the
                          documents declare "the cctool commands"
                          (_data/decision/dec_declared_public_api/opt_public_api_in_interface_documents.yaml, brief).
                        Strength: holds at any scale and grows with
                        the number of commands and options; the gap is
                        one mechanism whichever option is chosen, so
                        it does not separate them, but every option is
                        incomplete until it is closed.

