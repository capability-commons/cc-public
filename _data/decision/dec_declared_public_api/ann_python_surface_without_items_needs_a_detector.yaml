title:                  Second detector for a code surface without items
brief:                  |
                        The history check sees only renames and
                        removals of items, and a function or class
                        gets an item only when something points at it,
                        so under everything-shipped most of the public
                        Python surface is invisible to it and a
                        removal reaches range-pinned peers in a minor
                        release. Closing that gap needs an item on
                        every definition, against a ruling, or a
                        third-party API-diff tool beside the history
                        check, which is a second mechanism, a new
                        dependency and a cost that grows with the
                        code; declared document members are items
                        already held to the code, and the
                        data-and-commands option has no Python surface
                        to watch.
description:            |
                        Sources:
                        - The commit checks derive added, removed and
                          renamed items by guid, including embedded
                          items
                          such as interface members (src/cctool/commit/change.lp lines 92-114 and 195-214).
                        - A class or function has an item only when
                          something must point at it
                          (_data/decision/dec_python_definition_items/ruling_python_definition_items.yaml, brief;
                          AGENTS.md lines 110-113).
                        - src holds 225 top-level functions without a
                          leading underscore and 37 classes outside
                          tests;
                          the graph holds 6 python function items, all in src/cctool/check/check.py, and 29 interface
                          member items (advocates' counts of this snapshot). No module sets an export list.
                        - parameter_mismatch and signature_mismatch
                          fail a commit whose realizing function
                          differs from
                          its member in names, order, types, defaults or return type (src/cctool/check/check.lp lines
                          744-886; _data/decision/dec_interface_signature_restated/ruling_interface_signature_restated.yaml);
                          the C++ check is ruled from the first native document, and its libclang dependency is already
                          argued (_data/decision/dec_check_of_cpp_interfaces/ann_libclang_dependency_size_and_packaging.yaml).
                        - After 1.0, a push that moves the release
                          line over a breaking commit fails the
                          history check
                          (_data/decision/dec_breaking_work_after_version_one/ruling_breaking_work_after_version_one.yaml).
                        - griffe can diff a Python package's API
                          between versions and reports removed
                          modules, classes
                          and functions, but lists changed parameter types as not yet done
                          (https://pypi.org/project/griffe/0.46.0/); cargo-semver-checks says it does not yet catch type
                          changes of a function parameter (https://github.com/obi1kenobi/cargo-semver-checks). Neither is
                          in the environment (pyproject.toml lines 43-78).
                        - The simplicity measure counts jobs done by
                          more than one mechanism
                          (_data/register/reg_concern.yaml lines 488-490).
                        - The commit check that finds renames and
                          removals is already paid for
                          (_data/decision/dec_breaking_work_after_version_one/ann_breaking_commit_detection_is_already_paid_for.yaml).
                        - Assumption: the owner would want undeclared
                          definitions checked mechanically, as he
                          required
                          of restated signatures; if he accepts them unchecked, the dependency cost goes and the cost
                          moves to the accuracy of the computed bump.
                        - Assumption: an API diff over 57 modules
                          takes seconds; not measured. Strength:
                          strong for reliability, traceability and
                          simplicity, growing with the number of
                          functions; moderate for dependency risk;
                          weak for performance efficiency, where the
                          difference is seconds per push. The
                          interface-documents option holds only once
                          the commands and data get documents, as
                          argued in the annotation on commands without
                          an item. This is a different point from
                          behavior changes that touch no id, recorded
                          under the version scheme.

