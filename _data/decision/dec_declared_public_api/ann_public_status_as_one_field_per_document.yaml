title:                  Public status held once, as one required field per document
brief:                  |
                        The option needs every interface control
                        document to say whether it is offered to
                        peers, and the schema has no such field today.
                        The smallest form is one required field at the
                        document's top level beside the interface
                        version, not one per surface or member, with a
                        name distinct from the protective mark, which
                        already says public with the meaning that
                        anyone may read it.
description:            |
                        Sources:
                        - The option: documents "are to carry enough
                          to tell public seams from internal ones"
                          (_data/decision/dec_declared_public_api/opt_public_api_split_by_kind.yaml lines 31-33), and
                          undeclared code is private (owner's statement, 2026-10-24T18:09Z).
                        - The schema has no field saying whether a
                          document is offered to peers (advocate's
                          grep for
                          public, internal, visibility, peer and partner). Its top level admits no unnamed property, so a
                          new field is a schema change; it would sit with the interface version and the surfaces
                          (_data/schema/sch_interface_control_document.yaml lines 83-115).
                        - A surface is an object with exactly one key
                          naming its form, and each form's definition
                          admits no other properties (same file, lines 564-589, 593, 691 and 818), so a per-surface
                          field would go in three places, not one.
                        - The version is held per document, and a new
                          version is a new document that supersedes
                          the old
                          (same file, lines 58-60 and 85-90), so a per-document status changes only where the version
                          does.
                        - Every member is an item with its own
                          identity, 29 member items today
                          (_data/schema/sch_interface_member.yaml lines 18-37;
                          _data/decision/dec_declared_public_api/ann_python_surface_without_items_needs_a_detector.yaml),
                          so a per-member status would be one more field on each.
                        - Every document already carries the
                          protective mark mark_public, meaning "May be
                          disclosed to
                          anyone" (_data/interface_control_document/icd_cctool_check.yaml lines 6-9;
                          _data/register/reg_protective_mark.yaml lines 67-77). A second field called public would give
                          one word two meanings; a name such as exposure, with values peer and internal, avoids it
                          (advocate's suggestion; assumption that confusion is likely, as no partner has misread it).
                        - Rules the checks could then hold: a
                          superseding document states its own status,
                          a change from
                          peer to internal counts as a removal and is breaking, and the bump reads the status before
                          counting a member's rename or removal as breaking.
                        Strength: holds at ten times the documents,
                        since it is one field per document; it weakens
                        only if a document must mix public and
                        internal members, which splitting the document
                        answers without a second mechanism. A required
                        field leaves no default to reason about; an
                        optional field defaulting to internal also
                        follows the owner's statement.

