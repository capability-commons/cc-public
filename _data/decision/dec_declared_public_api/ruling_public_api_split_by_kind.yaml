title:                  Public API split by kind
brief:                  |
                        The data format is public. Python, C and C++
                        code is public only where an interface control
                        document declares it public, and private
                        otherwise; the command line has an interface
                        control document of its own and is treated the
                        same way. Ruled by William Payne on
                        2026-10-24, with the conditions recommended.
                        After 1.0, a schema change that can reject a
                        document the previous release accepted, or
                        that adds to a closed object or enum, is
                        breaking. Each check declares its severity in
                        the check interface document, so that a move
                        from advice to failure is a change the
                        computed bump sees. The maintainer may let a
                        check that fixes a reported fault fail in a
                        minor release, recorded on the release item.
                        The command line document is recorded and
                        checked against click's own description of
                        each command before 1.0, and promises
                        commands, flags, exit statuses and named JSON
                        outputs, not human-readable text. Each
                        interface control document has one required
                        exposure field, peer or internal, and a public
                        member names only public declarations or the
                        standard library. The data format names YAML
                        1.2 and JSON Schema 2020-12. Anything not
                        declared public is private. After 1.0, a new
                        or tightened check lands as advice in a minor
                        release and fails only in a major one; before
                        1.0, checks are added and tightened freely.
                        Whether the query and fact vocabulary is
                        public waits on the decision on what crosses
                        between segments.

