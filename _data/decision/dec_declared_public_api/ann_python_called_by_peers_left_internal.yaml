title:                  Python a peer calls, left internal
brief:                  |
                        A peer that calls cc-public's Python takes
                        cc-public as a dependency of its own product.
                        Under the data-and-commands option every
                        Python module may change in any release, so a
                        peer that imports one can be broken by a patch
                        release and must pin exactly or vendor the
                        code; the other two options give that call a
                        SemVer promise. Whether any peer imports
                        Python is still open.
description:            |
                        Sources:
                        - The data-and-commands option: "the Python
                          modules are internal and may change in any
                          release"
                          (_data/decision/dec_declared_public_api/opt_public_api_is_data_and_commands.yaml at brief).
                        - The variants proposal ports the fluent API
                          into cc-public as a Python interpreter that
                          "stays
                          usable directly from tests" (_sources/cc-patrol-notes/variants.md lines 36-40).
                        - The split option for who consumes a release
                          names a Python interface among what a peer
                          imports or builds in, as a library with declared ranges
                          (_data/decision/dec_who_consumes_a_release/opt_consumers_by_what_they_consume.yaml, brief).
                        - A peer pinning a SemVer range takes every
                          minor and patch release
                          (_data/decision/dec_who_may_release/ann_person_between_a_change_and_ranged_peers.yaml, brief).
                        - Assumption: some peer will import cctool
                          Python; today the first peer's scripts
                          import none of
                          it (_sources/cc-patrol-notes/draft/tools/validate.py line 1 and the other scripts there).
                        Depends on: who consumes a release, which is
                        open, and commands for peers, if a peer
                        command group is how peers would otherwise
                        reach the same behavior. Strength: moderate
                        today, since no peer imports cctool yet;
                        strong at ten times the peers if any of them
                        builds on a Python interface.

