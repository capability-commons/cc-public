title:                  Behavior under faults and load, stated only in documents
brief:                  |
                        Dataflow step and artifact surfaces state how
                        an interface behaves on failure, under back
                        pressure, under concurrency and across
                        restarts. Under the interface-documents option
                        those statements are part of the public API,
                        so a change to them is judged against it; the
                        data-and-commands option does not cover the
                        engine at all, and everything-shipped judges
                        only removals and renames.
description:            |
                        Sources:
                        - A dataflow step surface may state
                          persistence, failure, back pressure and
                          concurrency
                          (_data/schema/sch_interface_control_document.yaml at $defs.surface_dataflow_step.properties), and an artifact surface may
                          state failure, availability and retention (same file at $defs.surface_artifact.properties); each is prose (same file at $defs.semantics).
                        - Three of the four documents use the dataflow
                          step form
                          (_data/interface_control_document/icd_printer.yaml at surface.step.dataflow_step,
                          8a40b7e7:_data/interface_control_document/icd_process_controller.yaml at surface.step.dataflow_step,
                          8a40b7e7:_data/interface_control_document/icd_system_controller.yaml at surface.step.dataflow_step).
                        - The engine and its generator ship in the
                          package peers install
                          (_data/decision/dec_source_layout_for_two_languages/ruling_source_layout_for_two_languages.yaml).
                        - The data-and-commands option says nothing
                          about the C++ engine or the generator
                          (_data/decision/dec_declared_public_api/opt_public_api_is_data_and_commands.yaml at brief).
                        - The engine is on the hot path of a peer's
                          product, on hosts from a laptop to a Jetson
                          (_data/decision/dec_who_consumes_a_release/ann_engine_built_for_its_target_host.yaml).
                        Depends on: who consumes a release; it matters
                        only if peers build the engine into their
                        products. Strength: moderate. The statements
                        are prose and nothing checks them against the
                        code, so a behavior change that leaves the
                        document unedited goes unseen under every
                        option; under interface documents the
                        statement at least exists to be judged
                        against. It grows with the number of peer step
                        implementations.

