title:                  Internal seams frozen as public API
brief:                  |
                        Not every interface control document describes
                        a peer-facing boundary: the check interface is
                        the seam through which cctool's own command
                        line, commit gate and editing commands check,
                        and the other three are dataflow steps ported
                        from a test library. Under the
                        interface-documents option all of them become
                        public API on the day of the ruling, so the
                        option needs a way to tell a peer-facing
                        document from an internal one, or internal
                        changes cost peers a major release.
description:            |
                        Sources:
                        - The check interface: "The command line, the
                          commit gate and the editing commands all
                          check
                          through this interface" (_data/interface_control_document/icd_cctool_check.yaml at description).
                        - The printer, process controller and system
                          controller documents are dataflow steps
                          ported
                          from the Stableflow test library (note fields: _data/interface_control_document/icd_printer.yaml at note, 8a40b7e7:_data/interface_control_document/icd_process_controller.yaml at note, 8a40b7e7:_data/interface_control_document/icd_system_controller.yaml at note).
                        - The interface-documents option makes public
                          whatever the documents declare
                          (_data/decision/dec_declared_public_api/opt_public_api_in_interface_documents.yaml, brief).
                        - A peer under SemVer can accept every release
                          below the next major
                          (_data/decision/dec_version_scheme/ann_semver_lets_peers_pin_a_safe_range.yaml, brief), so each
                          needless major is a release every peer must assess by hand.
                        Strength: moderate today, with four documents;
                        it grows with the number of internal seams
                        that are documented for checking rather than
                        for peers. A mark on each document saying it
                        is offered to peers would answer it.

