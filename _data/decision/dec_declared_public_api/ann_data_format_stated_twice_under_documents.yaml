title:                  Data format stated twice under interface documents
brief:                  |
                        The schemas and registers are already items
                        that state the data format, and the
                        data-and-commands option names them directly
                        as public. The interface-documents option, as
                        worded, has documents declare the schemas,
                        registers and ids of the data, so a document
                        that restates them does one job twice; an
                        artifact surface that names a schema and its
                        version by reference would keep it to one
                        statement.
description:            |
                        Sources:
                        - _data/schema holds the JSON Schema of every
                          type of item, and _data/register the
                          registers of
                          concepts, concerns, types and relations (README.md lines 14-15); every item has an id and a
                          guid (README.md lines 34-35).
                        - An artifact member's payload names the
                          schema it conforms to, with that schema's
                          version
                          (_data/schema/sch_interface_control_document.yaml lines 505-531).
                        - The interface-documents option: documents
                          declare "the schemas, registers and ids of
                          the data"
                          (_data/decision/dec_declared_public_api/opt_public_api_in_interface_documents.yaml, brief).
                        - The simplicity measure counts jobs done by
                          more than one mechanism
                          (_data/register/reg_concern.yaml lines 488-490).
                        Strength: moderate; it holds at any scale but
                        is removed by a wording choice in the
                        interface-documents option, pointing at the
                        schemas rather than restating them.

