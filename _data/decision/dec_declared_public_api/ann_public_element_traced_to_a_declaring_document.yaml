title:                  Public elements traced to a declaring document
brief:                  |
                        Under interface documents, each public element
                        is a member that the realizing code points at,
                        so the reason for its public status is in the
                        graph. Under everything-shipped an element is
                        public because the wheel packs it, which adds
                        public elements no need calls for, and under
                        data-and-commands an element is public because
                        a sentence names its kind, so no edge records
                        why it is public. Commands are not items under
                        any option, so interface documents share that
                        gap for the command line until a command
                        surface exists.
description:            |
                        Sources:
                        - Code names the member it realizes with the
                          realizes relation
                          (_data/schema/sch_interface_control_document.yaml lines 60-64), as check.py does for the module
                          member of the check interface (src/cctool/check/check.py lines 35-40).
                        - The wheel packs src/cctool whole
                          (pyproject.toml lines 61-62).
                        - No cctool command is an item (advocate's
                          extract of this snapshot), so no edge can
                          say why a
                          command exists or which peer relies on it.
                        - The check interface names no reason of its
                          own: its edge list is empty
                          (_data/interface_control_document/icd_cctool_check.yaml line 266).
                        - The first peer's plan asks for commands,
                          schemas and ids, not for most of what ships
                          (_sources/cc-patrol-notes/plan.md lines 60-76).
                        - PEP 8: "Documented interfaces are considered
                          public ... All undocumented interfaces
                          should be
                          assumed to be internal" (https://peps.python.org/pep-0008/, Public and Internal Interfaces).
                        Strength: strong, with a condition. With ten
                        times the code, everything-shipped adds public
                        elements with no traced reason, and
                        data-and-commands leaves the command surface
                        untraceable. Interface documents meet the
                        measure only if each document then gains an
                        edge to the need or decision behind it; today
                        none has one.

