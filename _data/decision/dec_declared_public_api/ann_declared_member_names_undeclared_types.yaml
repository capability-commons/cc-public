title:                  Types a declared member names but no document declares
brief:                  |
                        The one Python interface control document
                        already types a parameter as a type from a
                        module no document declares, and the values of
                        that type are ruamel.yaml round-trip objects.
                        Under the interface-documents option as
                        worded, anything no document declares may
                        change in a minor release, so a minor release
                        could change what a declared function takes;
                        that option needs a rule that whatever a
                        declared member names is declared too.
description:            |
                        Sources:
                        - The check interface declares check_documents
                          and review_documents with a parameter whose
                          type
                          is spelled cctool.graph.extract.Documents
                          (_data/interface_control_document/icd_cctool_check.yaml lines 141-153 and 195-207).
                        - cctool.graph.extract defines Documents as
                          dict of str to a tuple of typing.Any and int
                          (src/cctool/graph/extract.py line 395), and reads documents with the ruamel.yaml round-trip
                          loader (src/cctool/graph/extract.py line 55).
                        - No interface control document declares
                          cctool.graph.extract; the four documents are
                          the check
                          interface (module cctool.check.check) and three dataflow step documents (listing of
                          _data/interface_control_document).
                        - The interface-documents option: "anything no
                          such document declares may change in a minor
                          release" (_data/decision/dec_declared_public_api/opt_public_api_in_interface_documents.yaml
                          lines 17-20).
                        - Prior art: Rust treats a dependency whose
                          types appear in a crate's public API as part
                          of that
                          API, so "a semver incompatible upgrade of these dependencies is a breaking change for this
                          package" (https://rust-lang.github.io/rfcs/3516-public-private-dependencies.html). PEP 8 treats
                          imported names as implementation details unless documented
                          (https://peps.python.org/pep-0008/, Public and Internal Interfaces).
                        - Under the data-and-commands option no Python
                          member is public, so the question does not
                          arise
                          there; it does not bear on that option. Everything-shipped avoids the gap only by making every
                          module public, ruamel.yaml types included, whose costs are argued in other annotations, so this
                          annotation does not bear on it either.
                        - Assumption: a caller can pass plain dicts in
                          place of round-trip objects; not checked,
                          and if
                          false, ruamel.yaml is in the declared surface today.
                        Strength: moderate, growing with the number of
                        declared Python members and the types they
                        name. It is a gap in the wording, closed by
                        one rule a check could enforce: each type
                        spelling in a declared member resolves to a
                        declared declaration or to the standard
                        library.

