title:                  Public API split by kind
brief:                  |
                        The data format, its schemas, registers and
                        the ids of its types and relations, is public.
                        Python, C and C++ code is public only where an
                        interface control document declares it public,
                        and private otherwise. The command line has an
                        interface control document of its own and is
                        treated in the same way, which may need the
                        interface control document schema to describe
                        command line interfaces.
description:            |
                        Source: the owner's statement of
                        2026-10-24T18:09Z, accepting the
                        recommendation to add this option: "the data
                        format is public, and the Python, C or C++ are
                        public only when the corresponding Interface
                        Control Document declares them to be public.
                        Otherwise they are private. The command line
                        interface will ALSO have an Interface Control
                        Document". Interface control documents are to
                        carry enough to tell public seams from
                        internal ones. A new or tightened check lands
                        as advice in a minor release and becomes a
                        failure only in a major release, but only
                        after version 1.0; before 1.0 checks are added
                        and tightened freely.

