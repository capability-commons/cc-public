title:                  Promotion of advice to a failure, with no declared element behind it
brief:                  |
                        After 1.0 the option makes moving a check from
                        advice to failure a major change, but whether
                        a check is advice depends only on which file
                        holds it, so a promotion is a move between
                        files that changes the check's id, and a
                        tightened rule keeps an old failure form and a
                        new advice form side by side for a whole major
                        cycle. A check is none of the option's public
                        kinds and the check interface does not list
                        the checks, so the computed bump cannot see a
                        promotion as breaking or name it in the notes.
description:            |
                        Sources:
                        - After 1.0 a new or tightened check is advice
                          in a minor release and a failure only in a
                          major
                          one (_data/decision/dec_declared_public_api/opt_public_api_split_by_kind.yaml at description;
                          owner's statement, 2026-10-24). Before 1.0 checks are added and tightened freely, so
                          none of this applies yet.
                        - Whether a check's rows are advice or
                          failures depends only on whether advise.lp
                          declares it
                          (src/cctool/check/check.py within _review).
                        - A check's id is made of the prefix, its file
                          name and the predicate name
                          (_data/register/reg_data_item_type.yaml at entries.type_logic_program_predicate; src/cctool/check/advise.lp within unresolved_mark;
                          src/cctool/check/check.lp within parameter_member). A move from advise.lp to check.lp therefore changes the
                          id, which the commit rules see as a rename by guid; a tightened rule changes only content,
                          reported by digest (src/cctool/commit/change.lp within added; src/cctool/commit/impact.lp within touched).
                        - Under the option, what is public is the data
                          format, the command line and declared
                          Python, C
                          and C++ (option lines 13-21), so a bump computed against that declaration would treat the
                          moved predicate as a private change. Assumption: no bump computation exists yet to confirm
                          this.
                        - The check interface declares the check
                          functions and the shape of their failures,
                          not which
                          checks exist or which are advice (_data/interface_control_document/icd_cctool_check.yaml at declaration and surface.python.native.function). check.lp has 70 show statements and advise.lp 8 (grep of the
                          snapshot).
                        - The simplicity measure counts jobs done by
                          more than one mechanism
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure).
                        - The owner wants the bump and the notes
                          determined mechanically from the graph
                          (owner's
                          statements, 2026-10-22).
                        Strength: zero before 1.0, which is six months
                        or more away (owner's statement, 2026-10-24);
                        after 1.0 strong for traceability, since with
                        ten times the checks promotions become routine
                        at each major and each one left out of the
                        computed bump either stops every peer gate in
                        a minor release or depends on a person
                        remembering it; moderate for simplicity.
                        Answered by one severity fact per check in
                        place of the two-file split, declared in the
                        check interface document, so a promotion or
                        tightening is a change to a public member; or,
                        at least, a rule that a check's move from
                        advice to failure is breaking.

