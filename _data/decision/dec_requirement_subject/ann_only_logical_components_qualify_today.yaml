title:                  Three types that play the role today
brief:                  |
                        Logical components, interface control
                        documents and interface members play the role
                        today, so a subject of another kind, such as
                        an operational or physical element, needs its
                        type given the role first.
description:            |
                        cc-public has no physical or operational
                        component types yet. An open target would
                        accept such items as soon as they exist.

