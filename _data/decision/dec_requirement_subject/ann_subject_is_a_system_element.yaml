title:                  Subject as a system element
brief:                  |
                        A requirement is an obligation on a system or
                        system element. A commit, a concept or an
                        option can be named, but cannot be a subject.
description:            |
                        ISO/IEC/IEEE 29148:2011 clause 5.2.4 names the
                        subject as the system, the software and the
                        like. With the target open, a requirement on a
                        commit passed the checker.

