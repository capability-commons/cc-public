title:                  Partner subjects that play the role
brief:                  |
                        The restriction names a role, not cc-public's
                        types, so a partner's system element can be a
                        subject once its type plays rol_design_entity.
description:            |
                        rrs_is_design_entity admits rol_design_entity,
                        which type_logical_component plays today.

