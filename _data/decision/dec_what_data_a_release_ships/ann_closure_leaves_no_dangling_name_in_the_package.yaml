title:                  A closed set cannot dangle in the package
brief:                  |
                        A set closed under naming holds every item
                        that any of its members names, so the shipped
                        data cannot fail the ruled release check on a
                        dangling mention or reference. The guarantee
                        comes from how the set is built, not from
                        rewording text by hand. It holds only if the
                        shipped code is among the starting points,
                        because the code ships whole and names
                        rulings.
description:            |
                        Sources:
                        - A dangling reference is an edge target that
                          names no item, no guid and no old id
                          (src/cctool/check/check.lp within dangling_reference).
                        - The release gate checks that the built
                          package holds _data and that cctool check
                          passes on the _data it ships
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml
                          at brief).
                        - Also rests on sources stated once in
                          ann_code_cites_rulings_that_folders_leave_behind
                          (what a dangling mention is; the rulings
                          that shipped code names) and in
                          ann_shipped_code_names_rulings_left_behind
                          (the wheel holds the whole of src/cctool
                          except the tests).
                        - The closure option starts from the items a
                          peer may name and ships those and every item
                          they name in turn
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_the_closure_of_what_a_peer_may_name.yaml
                          at brief).
                        - The 13 mentions that dangle today all sit in
                          annotations in decision folders, and no item
                          outside the decision folders names a
                          decision, option, annotation or ruling by an
                          edge (grep of _data, 2026-10-25; context
                          file).
                        - ASSUMPTION: the closure is computed with the
                          same mention and reference facts that the
                          check uses, so the two cannot disagree.
                          Strength: strong if the code is a starting
                          point, and it grows stronger at ten times
                          the size, since a closure costs no more care
                          as items are added while hand rewording
                          does.

