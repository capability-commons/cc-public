title:                  All data items with a rule against naming what stays behind
brief:                  |
                        The package ships the whole of _data, as
                        today. A check of the tree fails any data item
                        that names an item the package leaves behind,
                        such as the item of pyproject.toml or of a git
                        hook, and the mentions that do so today are
                        reworded.

