title:                  Selection by rule tied to the hatchling hook interface
brief:                  |
                        Shipping all data needs no change to the
                        build, and shipping named folders needs only
                        more lines in the hatchling force-include
                        table. Choosing items by a type field or by a
                        closure needs code that runs at build time. In
                        hatchling that is a custom build hook, a class
                        that subclasses a hatchling plugin interface,
                        which is one more part of a third-party tool
                        the release then rests on. The extra exposure
                        goes away if cctool itself stages the chosen
                        items before the build.
description:            |
                        Sources:
                        - The wheel takes _data through the
                          force-include table of hatchling
                          (pyproject.toml at tool.hatch.build.targets.wheel.force-include), and hatchling
                          is the build backend (pyproject.toml at
                          build-system.build-backend). The build-system table requires
                          hatchling with no version bound
                          (pyproject.toml at build-system.requires); only the pixi
                          development environment holds it at
                          >=1.32,<2 (pyproject.toml at tool.pixi.pypi-dependencies.hatchling).
                        - Force-include maps files or directories to
                          paths in the package and includes directory
                          contents recursively
                          (https://hatch.pypa.io/latest/config/build/,
                          File selection, Forced inclusion).
                        - The only built-in build hook is the custom
                          hook, code that runs at stages of the build
                          (https://hatch.pypa.io/latest/config/build/,
                          Build hooks).
                        - A custom build hook is a class in a python
                          file, by default hatch_build.py, that
                          inherits from BuildHookInterface in
                          hatchling.builders.hooks.plugin.interface
                          (https://hatch.pypa.io/latest/plugins/build-hook/custom/).
                        - The hatchling page does not say whether the
                          exclude option applies to force-included
                          paths
                          (https://hatch.pypa.io/latest/config/build/).
                        - ASSUMPTION: the build hook interface may
                          change within the range the development
                          environment holds less often than not; its
                          change history was not checked, and the
                          build-system table itself sets no range.
                          Strength: weak to moderate; it is a cost of
                          how the rule is wired, not of the rule, and
                          staging by cctool removes it. It does not
                          grow at ten times the size, because the
                          number of build interfaces used stays the
                          same.

