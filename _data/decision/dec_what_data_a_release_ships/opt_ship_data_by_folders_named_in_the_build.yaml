title:                  Data folders named in the build
brief:                  |
                        The build configuration names the folders of
                        _data that ship, such as the registers and
                        schemas, and leaves the rest, such as the
                        decisions and their arguments, behind. The
                        release gate checks the shipped data, as
                        ruled.

