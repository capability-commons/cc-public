title:                  Shipped decisions paid for in every peer check
brief:                  |
                        A peer checks its own tree together with the
                        _data of the cc-public package it consumes, so
                        every data item that ships is read and checked
                        again in every check of every peer. Decisions
                        are most of _data and grow with every
                        argument, while what a peer may name grows
                        slowly. Shipping all of _data costs each peer
                        about three and a half times the check time
                        and about two and a half times the memory of
                        shipping it without the decisions, and about
                        twelve times the package size.
description:            |
                        Sources:
                        - The check of a segment reads each consumed
                          tree beside its own and
                          checks the two together, and an installed release is read from
                          the package's _data (src/cctool/check/segment.py within trees and
                          union).
                        - The wheel ships the whole of _data today
                          (pyproject.toml at
                          tool.hatch.build.targets.wheel.force-include).
                        - _data holds 2665 YAML files, 2500 of them
                          under _data/decision
                          (context file, counts in the snapshot); by bytes, 5.76 MB of the
                          6.64 MB of YAML is under _data/decision (measured on the snapshot,
                          2026-10-25, with find and wc -c).
                        - Deflated as in a zip, all of _data is 3.02
                          MB and _data without
                          the decision folder is 0.24 MB (measured on the snapshot,
                          2026-10-25, with Python zipfile).
                        - cctool check over a copy of the tree takes
                          34.3 s and 211 MB peak
                          memory, and over a copy without _data/decision takes 9.7 s and
                          87 MB, on a 4-processor container (measured 2026-10-25, one run
                          each).
                        - cc-patrol, the first peer, follows frequent
                          0.y.z tags (owner's
                          statement, 2026-10-24).
                        - ASSUMPTION: a peer's check over the union
                          costs roughly what
                          cc-public's own check costs over the same consumed items; this was
                          not measured with a real peer.
                        Strength: strong for any option that leaves
                        the decision folders behind, and it grows at
                        ten times the size, since the decisions grow
                        with every argued choice while the registers
                        and schemas do not.

