title:                  Names of build files that a peer can use
brief:                  |
                        With shadows, the package that a peer reads
                        holds an entry for each item left behind that
                        cc-public names. The shipped arguments reach
                        the peer with their names intact, and a peer
                        item may name those items too. Under the rule
                        against naming what stays behind, the names
                        are reworded instead, and a peer item that
                        names, say, the item of pyproject.toml still
                        fails in the peer's own check. The same cctool
                        package that ships the shadows reads them, so
                        a peer installs nothing new.
description:            |
                        Sources:
                        - A copy that holds only _data and src/cctool
                          without its tests gives 12 dangling mention
                          rows in 8 annotations, all in decision
                          folders, naming 3 items that the package
                          leaves behind: 9 of file_pyproject, 2 of
                          shell_githooks_pre_merge_commit and 1 of
                          file_gitignore (measured 2026-10-25 with
                          cctool check on a copy of the snapshot).
                        - A row of a peer check that names only
                          consumed items is a notice, while a peer's
                          own item that names a consumed item which
                          did not ship fails as a dangling mention or
                          reference (src/cctool/check/segment.py
                          within attribute; context file).
                        - In the new option, references and mentions
                          from shipped items and from a peer resolve to the shadow, while a name that nothing
                          holds still fails
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_with_shadows_of_what_stays_behind.yaml
                          at brief; context file).
                        - The rule option fails any data item that
                          names an item the package leaves behind, and
                          rewords the mentions that do so today
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_naming_nothing_left_behind.yaml
                          at brief).
                        - Also rests on a source stated once in
                          ann_shadow_with_copied_ids_reads_as_a_repeated_item
                          (a peer reads the consumed tree from the
                          installed package of the running cctool).
                        - The items of pyproject.toml and the hooks
                          exist and are part of the graph, and cannot
                          be made to vanish from parts of it, and what
                          is an internal reference in one peer needs a
                          way to become an external reference in
                          another (owner's statement, 2026-10-25,
                          later the same day).
                        - ASSUMPTION: no peer tree was read, so
                          whether cc-patrol names any of these three
                          items today is not known. Strength:
                          moderate; only three items have a shadow today, and a peer that names none of them
                          gains only the absence of 12 notices; at ten
                          times the size more arguments name build
                          files, hooks and tests, so more names reach
                          a peer intact, but only for items that
                          cc-public itself names.

