title:                  Peers depending on items that change without a bump
brief:                  |
                        Whatever ships is something a peer can come to
                        depend on. The computed bump watches only the
                        schemas and registers, so the decision items
                        can be reworded, renamed or removed in any
                        release with no signal to the peer. Shipping
                        all data puts about 2500 such items within a
                        peer's reach. Shipping the closure of what a
                        peer may name keeps what a peer can take close
                        to the items that carry a promise, so a change
                        upstream is less likely to break a peer
                        unseen.
description:            |
                        Sources:
                        - The computed bump looks only at items under
                          _data/schema/ and _data/register/, and a
                          removal or rename there is breaking
                          (src/cctool/release/release.py within TUPLE_DIR_SUPPORT, SET_DELTA_BREAKS
                          and level).
                        - A supported item carries a stability
                          promise; an unsupported one is usable
                          without one
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml
                          at brief).
                        - The ship-all option itself rewords the 13
                          mentions that name items left behind
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_naming_nothing_left_behind.yaml
                          at brief; context file, 2026-10-25), an
                          example of decision content changing between
                          releases.
                        - The closure option ships register entries,
                          schemas and supported interfaces and what
                          they name in turn
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_the_closure_of_what_a_peer_may_name.yaml
                          at brief).
                        - Also rests on sources stated once in
                          ann_shipped_decisions_multiply_each_peer_check_cost
                          (2500 of the 2665 YAML files are under
                          _data/decision; cc-patrol follows frequent
                          0.y.z tags). Strength: moderate; it speaks
                          for the dependency a peer segment takes on
                          cc-public, and it pulls against keeping
                          every item nameable. It grows at ten times
                          the size, since the unwatched items are the
                          part of _data that grows fastest.

