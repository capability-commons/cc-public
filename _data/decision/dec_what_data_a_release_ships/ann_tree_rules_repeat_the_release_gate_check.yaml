title:                  A tree rule doing the release gate's job twice
brief:                  |
                        The all-data option and the type-field option
                        each add a check of the tree that fails an
                        item naming what does not ship. The ruled
                        release gate already does that job, by
                        checking the data the package ships. The
                        type-field option also adds a new field to
                        every type entry and to the schema of the type
                        register, so it adds two mechanisms where the
                        folder list adds none.
description:            |
                        Sources:
                        - The type-field option records in each type
                          entry whether its items
                          ship, and adds a check of the tree that fails an item of a shipped
                          type naming one that does not
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_data_by_a_field_of_each_type.yaml,
                          brief).
                        - The type register holds 36 type entries
                          (_data/register/reg_data_item_type.yaml at entries).
                        - Also rests on sources stated once in
                          ann_rewording_drops_checked_links_to_build_files (the all-data
                          option adds a check of the tree that fails any data item that
                          names an item the package leaves behind) and in
                          ann_closure_leaves_no_dangling_name_in_the_package (the release
                          gate checks the _data the package ships; the 13 mentions of items
                          that do not ship are all in annotations in decision folders).
                        Strength: moderate; the tree rule does catch a
                        bad mention at commit rather than at release,
                        which another concern may value, but as a
                        mechanism it repeats one already ruled. The
                        count does not change at ten times the size.

