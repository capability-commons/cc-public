title:                  All data items with shadows of what stays behind
brief:                  |
                        A release ships the whole of _data. For each
                        item that the package leaves behind but a
                        shipped item names, the build adds a shadow
                        that holds only the item's id, guid and type
                        and the federated segment that holds it, so
                        that a name across a segment boundary resolves
                        and a name that nothing holds still fails.
                        Ruled by WTP on 2026-10-25, who rejected the
                        other four options: a field of each type is
                        not workable, the closure would likely pull in
                        everything, the folder list did not convince,
                        and a rule against naming what stays behind
                        would fail constantly. Items left behind do
                        exist and are part of the graph, so names of
                        them are expected across a boundary, and
                        designed for, rather than removed. WTP chose
                        the word shadow, after the shadow boards of
                        5S: everything has its place, and what is
                        missing shows as the shadow of what it is.
                        Shadows are kept minimal, with no title or
                        brief, as WTP agreed.

