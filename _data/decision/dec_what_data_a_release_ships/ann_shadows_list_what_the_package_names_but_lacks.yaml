title:                  A counted list of what the package names but lacks
brief:                  |
                        Each shadow records an item that the shipped
                        content depends on but does not hold, and the
                        segment that holds it. So the package itself
                        states how many such dependencies it has,
                        three today, and who holds each. The rule
                        against naming what stays behind brings that
                        count to zero by rewording, which hides the
                        dependencies rather than removing them.
description:            |
                        Sources:
                        - Each shadow holds the id, the guid and the
                          type of an item left behind and the
                          federated segment that holds it, today
                          always segment_cc_public
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_with_shadows_of_what_stays_behind.yaml
                          at brief; context file).
                        - Also rests on sources stated once in
                          ann_shadows_let_a_peer_name_items_left_behind
                          (the shipped data names three items that do
                          not ship; the rule option fails any data
                          item that names an item the package leaves
                          behind and rewords the mentions that do so
                          today; the items of pyproject.toml and the
                          hooks exist and are part of the graph,
                          owner's statement).
                        - Also rests on a source stated once in
                          ann_rewording_drops_checked_links_to_build_files
                          (a mention said in prose without the prefix
                          is not read as a mention, so it is not
                          checked).
                        - Also rests on a source stated once in
                          ann_shadow_with_copied_ids_reads_as_a_repeated_item
                          (a segment that keeps some items private may
                          ship shadows of them). Strength: weak to
                          moderate; three items, all held by cc-public
                          itself, so the list names no other party
                          yet. It grows in worth at ten times the
                          size, with more segments and with private
                          items, where the holder recorded on each shadow is a party other than the package's
                          own segment.

