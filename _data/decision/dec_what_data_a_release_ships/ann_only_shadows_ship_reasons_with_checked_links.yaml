title:                  Reasons shipped with their links still checked
brief:                  |
                        Only the proxy option ships every decision and
                        also keeps each name of a build file, a hook
                        or the ignore file as a checked id in the
                        package. The all-data rule ships the reasons
                        but turns those names into prose. The folder
                        and closure options keep the names checked
                        only in the tree, because the arguments that
                        hold them stay behind. With proxies a reader
                        of the package can follow each argument to its
                        subject and to the segment that holds it.
description:            |
                        Sources:
                        - Also rests on sources stated once in
                          ann_package_without_decisions_holds_no_reasons
                          (the folder and closure options leave the
                          decisions, and so the reasons, behind) and
                          in
                          ann_rewording_drops_checked_links_to_build_files
                          (the all-data rule turns checked mentions
                          into prose).
                        - The proxy option ships the whole of _data,
                          and each proxy holds the id, the guid, the
                          type and the federated segment that holds
                          the item
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_with_shadows_of_what_stays_behind.yaml
                          at brief; context file).
                        - Also rests on sources stated once in
                          ann_shadows_let_a_peer_name_items_left_behind
                          (today 12 mentions in 8 annotations name 3
                          items the package leaves behind; the owner
                          holds that pyproject.toml and the hooks
                          exist and are part of the graph, and that a
                          reference internal to one peer must become
                          an external reference in another) and in
                          ann_shadow_items_satisfy_dangling_rules_unchanged
                          (with a stand-in for each, no dangling
                          mention remains in a check of the package).
                        - segment_cc_public is the federated segment
                          item of cc-public
                          (_data/federated_segment/segment_cc_public.yaml).
                          Strength: moderate to strong; it holds at
                          ten times the size, since every new name of
                          an item left behind stays a checked link in
                          the shipped reasons, while the other options
                          lose either the reasons or the check.

