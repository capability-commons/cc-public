title:                  Rewording drops checked links to build files
brief:                  |
                        Shipping everything with a rule against naming
                        what stays behind turns 13 checked links into
                        prose. A mention by id is checked against the
                        graph, and prose is not. The rule also bars
                        every later argument from naming
                        pyproject.toml, a git hook or a test by id,
                        though these are the subjects of decisions.
description:            |
                        Sources:
                        - The all-data option fails any data item that
                          names an item the package leaves behind, and
                          rewords the mentions that do so today
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_naming_nothing_left_behind.yaml
                          at brief).
                        - Today 11 annotations name file_pyproject,
                          one of them twice, for 12 mentions, and 1
                          names shell_githooks_pre_merge_commit, so 13
                          mentions in 12 annotations (grep of _data,
                          2026-10-25), for example as the source of
                          the rights a new item takes
                          (_data/decision/dec_license/ann_license_field_copied_not_typed.yaml
                          at description; context file).
                        - The fix for a dangling mention includes
                          saying it in prose without the prefix
                          (src/cctool/check/check.lp within dangling_mention).
                        - Only a word with the prefix of a known type
                          is read as a mention
                          (src/cctool/check/check.lp within dangling_mention).
                        - A mention by an old id is flagged as an
                          outdated mention (src/cctool/check/check.lp
                          within outdated_mention).
                        - Also rests on a source stated once in
                          ann_folder_list_reuses_selection_by_path
                          (the tests are left out of the wheel).
                        - The owner finds it unsuitable to ship
                          pyproject.toml or githooks or references to
                          them (owner's statement, 2026-10-25).
                        - In the folders and closure options the
                          annotations stay behind, so their mentions
                          can keep their ids in the tree
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_data_by_folders_named_in_the_build.yaml
                          at brief;
                          opt_ship_the_closure_of_what_a_peer_may_name.yaml
                          at brief). Strength: moderate; 13 links
                          is small today, but at ten times the size
                          the rule bars more arguments about build
                          files, hooks and tests from naming their
                          subject.

