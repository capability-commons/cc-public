title:                  Shadows that cost nothing and save nothing
brief:                  |
                        The shadows themselves are almost free: three
                        small files, with no measurable change in
                        check time or memory. But the option still
                        ships every decision, so each check of every
                        peer pays the full cost of the shipped data,
                        several times the time of a package without
                        the decisions. Finding what stays behind adds
                        one extraction per release at build time,
                        which is small next to that.
description:            |
                        Sources:
                        - The option ships the whole of _data and adds
                          a shadow for each item that the package
                          leaves behind but a shipped item names
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_with_shadows_of_what_stays_behind.yaml
                          at brief).
                        - The check of a segment reads each consumed
                          tree beside its own and checks the two
                          together, and an installed release is read
                          from the package's _data
                          (src/cctool/check/segment.py within trees
                          and union).
                        - A copy of the snapshot without
                          pyproject.toml, .gitignore, .githooks and
                          the tests, as the wheel holds it, takes 39.9
                          s and 228 MB peak memory for cctool check;
                          with three shadow files added it takes 39.7 s
                          and 227 MB; the whole tree takes 39.4 s and
                          228 MB (measured 2026-10-25 on a 4-processor
                          container, one run each).
                        - The three shadow files, for file_pyproject,
                          file_gitignore and
                          shell_githooks_pre_merge_commit, hold 938
                          bytes in all, with the guids of their type
                          and segment as checked and timed, against
                          3.02 MB for all of _data deflated (measured
                          2026-10-25;
                          ann_shipped_decisions_multiply_each_peer_check_cost
                          for the deflated size).
                        - Also rests on a source stated once in
                          ann_shipped_decisions_multiply_each_peer_check_cost
                          (a check of a copy without _data/decision
                          takes 9.7 s and 87 MB).
                        - Extracting the facts of the package copy
                          takes 10.5 s and 151 MB and finds exactly
                          those three names; extracting the whole
                          tree, to find their guids and types, takes
                          11.1 s and 157 MB (measured 2026-10-25 with
                          cctool.graph.extract.extract, one run each).
                        - cc-patrol, the first peer, follows frequent
                          0.y.z tags (owner's statement, 2026-10-24).
                        - ASSUMPTION: a peer's check over the union
                          costs roughly what cc-public's own check
                          costs over the same consumed items; this was
                          not measured with a real peer. Strength:
                          strong for the per-peer cost, which the shadows leave as it is for shipping all
                          data; at ten times the size the shadows grow only with names that cross the package line,
                          while the decisions, and so each peer check,
                          grow with every argument.

