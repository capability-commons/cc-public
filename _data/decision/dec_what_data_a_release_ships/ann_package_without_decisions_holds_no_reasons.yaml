title:                  A package without decisions holds no reasons
brief:                  |
                        Each trace from a component or rule to its
                        reason runs from the decision to its subject,
                        not back. A package that leaves the decisions
                        behind holds the components and code with
                        nothing in it that says why they exist. A
                        closure from what a peer may name keeps at
                        most a few decisions, reached through rulings
                        the code cites, and none of their arguments.
description:            |
                        Sources:
                        - Decisions point at their subject with
                          relation_is_about
                          (_data/decision/dec_what_data_a_release_ships/dec_what_data_a_release_ships.yaml
                          at edge.0).
                        - lco_release names only its driving concerns
                          by edge
                          (_data/logical_component/lco_release.yaml
                          at edge).
                        - No item outside the decision folders names a
                          decision, option, annotation or ruling by an
                          edge (grep of _data, 2026-10-25).
                        - Also rests on a source stated once in
                          ann_closure_adds_a_graph_walk_to_a_static_build
                          (the registers, schemas, ICDs and components
                          mention no decision item except one advice
                          name).
                        - An annotation names the options it supports
                          or challenges, and an option names only its
                          decision
                          (_data/decision/dec_what_crosses_between_segments/ann_consumed_content_held_locally_for_the_gate.yaml,
                          edge;
                          _data/decision/dec_release_gate/opt_full_gate_and_smoke_test.yaml
                          at edge).
                        - A ruling names the options it upholds and
                          rejects
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml
                          at edge).
                        - The whole tree, decisions included, stays in
                          the repository: each option chooses only
                          what the build copies into the package (the
                          four option files in
                          _data/decision/dec_what_data_a_release_ships,
                          brief).
                        - ASSUMPTION: a peer that reads cc-public
                          offline, through the installed package, has
                          no other copy of the decisions to hand.
                          Strength: moderate; the reasons stay in the
                          repository, so the loss is in what a peer
                          reads beside its own tree, and at ten times
                          the size the share of shipped items with no
                          traced reason stays near all of them.

