title:                  Shadow ids reused, unlike those of a proxy
brief:                  |
                        The graph already has proxies, and their rule
                        is that a proxy's id and guid address the
                        proxy, not the thing it stands for. A shadow
                        also stands for an item held elsewhere, but it
                        takes the id and guid of that item, unlike a
                        proxy. So the option either redefines the
                        concept of a proxy to cover shadows or keeps
                        two kinds of stand-in side by side, which do
                        one job in two ways. Giving each shadow an id
                        of its own would keep one identity rule, but
                        every mention would then have to name the
                        shadow, which brings back the rewording.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_shadow_with_copied_ids_reads_as_a_repeated_item
                          (the id and guid of a proxy address the
                          proxy, not the thing it points at).
                        - The owner of the thing a proxy points at is
                          recorded on the proxy
                          (_data/register/reg_concept.yaml at
                          entries.concept_proxy.description).
                        - External documents are proxies with their
                          own id, an outside identifier and the owner
                          of the referent
                          (_data/external_document/extdoc_dung_1995.yaml
                          at identifier and referent_owner);
                          _data/external_document,
                          _data/external_class and
                          _data/external_relation hold 54 files, 34,
                          15 and 5 (count of files, 2026-10-25).
                        - A shadow holds the id, the guid, the
                          type and the segment of the item left
                          behind, and no owner
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_with_shadows_of_what_stays_behind.yaml
                          at brief; context file).
                        - The existing dangling rules accept a shadow
                          only because it carries the same id or guid
                          as the name (src/cctool/check/check.lp
                          within dangling_mention).
                        - ASSUMPTION: a shadow with an id of its own
                          could resolve the old name only through an
                          alias or a new rule, since a mention of
                          file_pyproject names that id; this was not
                          tried. Strength: moderate; it is a cost in
                          concepts, not in code, and the redefinition
                          is one edit to one register entry. It does
                          not grow at ten times the size, but each
                          later use the conversation named for shadows, such as private items or a graph
                          database, would inherit whichever identity rule is chosen.

