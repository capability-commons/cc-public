title:                  New names across the package line absorbed while typos still fail
brief:                  |
                        The set of items that the package leaves
                        behind but shipped items name grows as
                        arguments are written: a third such item
                        appeared on the day this decision was opened.
                        Under the rule that bars such names, each new
                        one fails the release until someone rewords
                        it. With proxies the build adds a stand-in and
                        the release passes, while a name that no item
                        holds still fails, as a check of a scratch
                        package with stand-ins and a planted
                        misspelling shows.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_shadows_let_a_peer_name_items_left_behind
                          (a check of a copy of the package, laid out
                          as the wheel holds it, finds 12 dangling
                          mentions in 8 annotations naming 3 items
                          that the package leaves behind; the all-data
                          option fails any data item that names an
                          item the package leaves behind).
                        - Also rests on a source stated once in
                          ann_shadow_set_follows_upstream_text_not_peer_needs
                          (the facts gathered earlier on 2026-10-25
                          list only two such items, and file_gitignore
                          is named only by
                          ann_file_and_annotation_types_split_across_package).
                        - The owner expects that option to fail
                          constantly (owner's statement, 2026-10-25).
                        - Also rests on sources stated once in
                          ann_shadow_items_satisfy_dangling_rules_unchanged
                          (with a stand-in for each of the 3 items,
                          the check of the copy finds no dangling
                          mention; a mention dangles only when it
                          names no item, no guid and no old id) and in
                          ann_shadows_add_a_generator_and_a_schema_exemption
                          (the rows left are schema and placement rows
                          about the stand-ins themselves: the schema
                          rows are the check the proxy option exempts,
                          and the placement rows go away when each
                          stand-in sits in the folder of its type, as
                          measured in
                          ann_shadow_items_satisfy_dangling_rules_unchanged).
                        - The proxy option makes a proxy only for an
                          item that a shipped item names, and a name
                          that nothing holds still fails
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_all_data_with_shadows_of_what_stays_behind.yaml
                          at brief).
                        - With the stand-ins in place, a misspelling
                          of file_pyproject planted in one annotation
                          of the copy still fails as a dangling
                          mention (check of a scratch copy of the
                          package, 2026-10-25).
                        - The release gate checks that cctool check
                          passes on the _data the package ships
                          (_data/decision/dec_release_gate/ruling_release_gate.yaml
                          at brief).
                        - ASSUMPTION: the build finds what is left
                          behind with the same mention and reference
                          facts that the check uses, so a name the
                          build misses is still caught by the release
                          gate. Strength: strong; at ten times the
                          size more arguments name build files, hooks
                          and tests, and each is a failed release
                          under the all-data rule but costs nothing
                          here.

