title:                  Shipped code cites rulings that folders leave behind
brief:                  |
                        The code always ships, and its text names
                        rulings that live in the decision folders. If
                        the build leaves those folders behind, the
                        shipped package fails the ruled release check
                        on its first run. Each later docstring that
                        cites a ruling breaks the release again, and
                        the fault shows only at release time, not at
                        commit time.
description:            |
                        Sources:
                        - The folders option leaves the decisions and
                          their arguments behind
                          (_data/decision/dec_what_data_a_release_ships/opt_ship_data_by_folders_named_in_the_build.yaml
                          at brief).
                        - Rulings travel in the folder of the decision
                          whose options they settle
                          (_data/register/reg_data_item_type.yaml
                          at entries.type_ruling.note).
                        - Shipped docstrings name
                          ruling_cpp_built_when_staged and
                          ruling_maintainer_decides_each_release
                          (src/cctool/gate/gate.py;
                          src/cctool/release/release.py).
                          release.py just after TUPLE_LEVEL also names
                          ruling_public_api_split_by_kind, but in a
                          code comment, which the extractor does not
                          read as a mention
                          (src/cctool/graph/extract.py within parse, _docstring
                          and _document_of), so it cannot dangle.
                        - Any word with the prefix of a known type
                          that names no item is a dangling mention,
                          and ruling is such a prefix
                          (src/cctool/check/check.lp within dangling_mention;
                          _data/register/reg_data_item_type.yaml at
                          entries.type_ruling.prefix).
                        - A peer's own item that names a consumed item
                          which did not ship fails as a dangling
                          mention or reference
                          (src/cctool/check/segment.py within union and attribute;
                          context file).
                        - The gate before each commit runs its stages
                          in a copy of the staged content of the
                          repository, where the decision folders exist
                          (src/cctool/gate/gate.py within gate and
                          copy_staged), and the wheel tests check only which
                          files the wheel holds, not cctool check on
                          them (src/cctool/_test/test_wheel.py within
                          test_the_wheel_holds_every_file_of_data_under_cctool_data, test_the_wheel_holds_every_module_and_logic_program_of_cctool and test_the_wheel_holds_no_test_and_no_fixture), so neither catches this.
                        - Also rests on sources stated once in
                          ann_shipped_code_names_rulings_left_behind
                          (the wheel holds the whole of src/cctool
                          except the tests) and in
                          ann_closure_leaves_no_dangling_name_in_the_package
                          (the release gate checks the _data the
                          package ships). Strength: strong; two
                          citations fail today, and at ten times the
                          size more code and more peer items cite
                          rulings, so the failures grow with the tree.

