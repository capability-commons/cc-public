title:                  All data items with shadows of the items that stay behind
brief:                  |
                        The package ships the whole of _data. The
                        build adds, for each item that the package
                        leaves behind but a shipped item names, such
                        as the item of pyproject.toml or of a git
                        hook, a shadow that holds only its id, its
                        guid, its type and the federated segment that
                        holds it. A reference to a shadow resolves, so
                        a reference across a segment boundary is
                        expected and is not a fault, while a name that
                        nothing holds still fails. A shadow has no
                        schema of its own to meet, and is never
                        edited.

