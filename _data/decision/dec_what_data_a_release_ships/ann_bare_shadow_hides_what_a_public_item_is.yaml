protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  A bare proxy of a public item
brief:                  |
                        A minimal proxy ends the trace from a shipped
                        argument at an id, a type and a segment. All
                        three items it would stand for today are
                        public, and each has a title and a brief in
                        its header, so carrying them would reveal
                        nothing private. As agreed, a reader of the
                        package learns that the subject exists but not
                        what it is, and must go to the tree of
                        cc-public to find out.
description:            |
                        Sources:
                        - A proxy holds only the id, the guid, the
                          type and the segment, with no title and no
                          brief, so that a private item reveals only
                          that it exists; the owner agreed the proxies
                          be minimal (context file; owner's statement,
                          2026-10-25).
                        - file_pyproject, file_gitignore and
                          shell_githooks_pre_merge_commit each carry
                          the mark mark_public, a title and a brief in
                          the comment header of their file
                          (pyproject.toml; .gitignore;
                          .githooks/pre-merge-commit).
                        - ann_license_field_copied_not_typed names
                          file_pyproject as the item a new item takes
                          its rights from
                          (_data/decision/dec_license/ann_license_field_copied_not_typed.yaml
                          at description).
                        - Each item carries a protective mark, and
                          mark_public is the mark of all three items
                          above (pyproject.toml; .gitignore;
                          .githooks/pre-merge-commit).
                        - ASSUMPTION: a reader of an installed package
                          often has no checkout of cc-public to hand.
                        - ASSUMPTION: a proxy could carry the title
                          and brief when the item is public and stay
                          bare when it is not, at the cost of one more
                          rule in the build. Strength: weak to
                          moderate; the gap is three items today, and
                          at ten times the size more public items are
                          proxied, so more traces in the package end
                          at a bare id.

