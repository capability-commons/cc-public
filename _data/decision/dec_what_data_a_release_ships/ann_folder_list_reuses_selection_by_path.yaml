title:                  Shipped folders chosen by the selection already in the build
brief:                  |
                        Naming the shipped folders in the build adds
                        no new mechanism. The build already picks what
                        ships by path, the release step already names
                        the supported folders by path, and the ruled
                        release gate already fails a shipped item that
                        names one left behind. Only the two mentions
                        of rulings in shipped code need rewording.
description:            |
                        Sources:
                        - The wheel build picks what ships by path:
                          the package folder, an
                          exclude list of test paths, and a force-include of _data
                          (pyproject.toml at tool.hatch.build.targets.wheel and tool.hatch.build.targets.wheel.force-include).
                        - The release step names the supported data by
                          folder, as
                          _data/schema/ and _data/register/ (src/cctool/release/release.py
                          within TUPLE_DIR_SUPPORT).
                        - With _data/decision removed from a copy of
                          the tree, cctool check
                          fails only on dangling mentions in docstrings: of
                          ruling_cpp_built_when_staged (src/cctool/gate/gate.py), of
                          ruling_maintainer_decides_each_release
                          (src/cctool/release/release.py), and one in a test file
                          that does not ship (measured 2026-10-25).
                        - The tests are left out of the wheel
                          (pyproject.toml at tool.hatch.build.targets.wheel.exclude).
                        - Also rests on a source stated once in
                          ann_closure_leaves_no_dangling_name_in_the_package (the release
                          gate checks that the built package holds _data and that cctool
                          check passes on the _data it ships).
                        Strength: strong; at ten times the size the
                        list of folders stays about as short, because
                        it grows with kinds of folder, not with items.

