title:                  Report items pile up on dev
brief:                  |
                        A daily review, a nightly run and a daily
                        queue summary would add over a thousand items
                        a year to dev, and each would cost a landing
                        run of the queue.
description:            |
                        Sources:
                        - Three reports a day, a review, a night and a
                          queue summary, come to about 1,100 items a
                          year.
                        - The same argument, made for one item a
                          night, was raised against keeping an item
                          for each governed run
                          [_data/decision/dec_home_of_observed_evidence/ann_governed_run_items_accumulate_in_the_tree.yaml
                          at brief], an option that
                          ruling_home_of_observed_evidence rejected.

