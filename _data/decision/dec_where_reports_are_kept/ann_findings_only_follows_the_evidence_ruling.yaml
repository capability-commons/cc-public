title:                  Only findings as items follows the evidence ruling
brief:                  |
                        Keeping run output in the git directory and
                        only what needs a person in the graph is what
                        ruling_home_of_observed_evidence chose for
                        test evidence, so one rule would cover every
                        kind of report. It leaves the review reports
                        themselves unreachable from the graph, which
                        is what WTP asked to change.
description:            |
                        Sources:
                        - ruling_home_of_observed_evidence keeps
                          observations in a local store and records
                          only a digest and counts at a release
                          [_data/decision/dec_home_of_observed_evidence/ruling_home_of_observed_evidence.yaml
                          at brief].

