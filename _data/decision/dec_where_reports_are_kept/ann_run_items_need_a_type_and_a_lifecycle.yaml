title:                  Run items need a new type and a lifecycle for findings
brief:                  |
                        The option adds a type for the run, a renderer
                        for the report, and a way to retire
                        annotations that no longer apply, which is
                        more to build and to keep working than leaving
                        reports as files.
description:            |
                        Sources:
