title:                  Reports in a branch of their own
brief:                  |
                        Reports are items in a branch or repository of
                        their own, a segment that consumes cc-public,
                        and each names the dev commit it is about. dev
                        never carries them, and loading both segments
                        shows them beside the items they are about.

