title:                  One run_review item a day is small beside a report item per run
brief:                  |
                        A thin run_review item each day, about 365 a
                        year, holds no prose, so it adds far less to
                        every load of the tree than a report item for
                        each review, night and summary.
description:            |
                        Sources:
                        - Reports as items come to about 1,100 a year
                          [_data/decision/dec_where_reports_are_kept/ann_report_items_pile_up_on_dev.yaml
                          at description].

