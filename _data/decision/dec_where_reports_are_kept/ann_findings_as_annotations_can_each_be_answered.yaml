title:                  Findings as annotations can each be answered
brief:                  |
                        A finding that is one annotation with one
                        assertion can be answered, challenged or
                        removed on its own, and a rendered report is
                        never out of step with them, where a stored
                        report goes stale as its findings are acted
                        on.
description:            |
                        Sources:
                        - A lesson learned is already recorded as an
                          annotation about what it concerns
                          [.agents/skills/reviewing-the-repository/SKILL.md#recording-findings].

