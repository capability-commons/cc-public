title:                  Where reports are kept
brief:                  |
                        Where are the reports of reviews, of the
                        landing queue and of the night runner kept,
                        and how does the graph reach them?
description:            |
                        WTP asked on 2026-10-31 for a systematic look
                        at where reports go, so that they can be tied
                        into the graph where that is possible (WTP,
                        2026-10-31): "I think we need a bit of a
                        systematic think about where reports like this
                        go, so we can tie them into the knowledge
                        graph if possible."

                        What the project reports today, and where each
                        report is kept:
                        - Daily and weekly review reports and
                          retrospectives are Markdown files in the
                          reviews folder of the project's shared notes
                          folder, outside the repository, which cloud
                          sessions see as
                          /mnt/project-files/notes/reviews
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-report].
                          Nothing in the graph names them. A finding
                          that needs a choice becomes a decision, a
                          lesson becomes an annotation, and a design
                          rule becomes a register entry
                          [.agents/skills/reviewing-the-repository/SKILL.md#recording-findings].
                        - The landing queue rewrites a summary of each
                          UTC day in .git/cctool_queue_summary
                          [src/cctool/queue/report.py within
                          write_summary], appends every move to the
                          journal .git/cctool_queue.jsonl
                          [src/cctool/queue/patch.py within journal],
                          and keeps a record of each patch in
                          .git/cctool_queue [src/cctool/queue/patch.py
                          within write].
                        - Each landing run writes a gate result for
                          the commit it tested in
                          .git/cctool_gate_result
                          [src/cctool/gate/result.py within write].
                        - Each run of the gate appends its stages,
                          test durations and failed tests to
                          .git/cctool_timing.jsonl
                          [src/cctool/gate/timing.py within append].
                        - The overnight property tests keep the
                          examples that failed in
                          .git/cctool_hypothesis
                          [src/cctool/_test/test_property.py within
                          DIR_DATABASE], and the coverage task leaves
                          .coverage in the checkout.
                        - The night runner is planned and not built.
                          ruling_where_test_evidence_is_measured puts
                          the measurement of coverage, profiles and
                          budgets in it, and
                          ruling_home_of_observed_evidence keeps what
                          a run observes in a local store in the git
                          directory, with only a digest and counts
                          recorded at a release.
                        - In the graph, a review item records that
                          items passed a review for a maturity level
                          [_data/register/reg_data_item_type.yaml at
                          entries.type_review], annotations record
                          lessons, and each commit message holds a
                          commit item.

                        Everything in the git directory exists only on
                        atlas, and a cloud session cannot read it.

