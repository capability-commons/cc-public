title:                  A run item with finding annotations
brief:                  |
                        Each review is one small run item: its date,
                        its kind, the commits it covered, the budget
                        it had and spent, each candidate it examined
                        with its score and signals, and a summary of
                        the night it followed, with the digests of the
                        logs it read. Each finding is an annotation
                        linked to the run and to the item it is about.
                        cctool renders the prose report from these, so
                        it is never stored, and the machine logs stay
                        in the git directory.

