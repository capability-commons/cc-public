title:                  Only findings become items
brief:                  |
                        Machine logs stay in the git directory and
                        review reports stay in the notes folder, as
                        now. Only what a person must act on or keep
                        becomes an item: a decision, an annotation, a
                        review, a register entry, or the digest and
                        counts a release records.

