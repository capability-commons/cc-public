title:                  A segment of reports keeps dev lean
brief:                  |
                        Reports in a segment of their own can be items
                        with full text and edges to the items they are
                        about, while dev and every load of the core
                        tree stay the size they are. Segments that
                        consume cc-public already exist, so no new
                        mechanism is needed to read them together.
description:            |
                        Sources:
                        - Each segment holds one segment item whose
                          consumes edge names the release of each
                          segment it consumes
                          [_data/decision/dec_how_a_segment_declares_itself/ruling_segment_item_records_the_release.yaml
                          at brief].

