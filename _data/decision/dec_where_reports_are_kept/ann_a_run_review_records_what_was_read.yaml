title:                  A run_review item records what was read as well as what was found
brief:                  |
                        Only a record of the candidates a review
                        examined, and of those it did not, shows
                        whether a quiet area was checked and found
                        clean or never looked at, and lets the choice
                        of what to read be measured against what it
                        found.
description:            |
                        Sources:
                        - The daily review today lists findings and
                          the commits it read, and nothing names the
                          items it did not reach
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-report].

