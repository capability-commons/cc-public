title:                  The night keeps its record and its review report in the git directory
brief:                  |
                        Since 2fc407a the night is built, so the
                        description of this decision, which says it is
                        planned and not built, no longer holds. The
                        night writes its record to .git/cctool_night
                        and the report of its daily review to
                        .git/cctool_review on atlas, where neither the
                        graph nor a cloud session reaches them, while
                        the review skill still puts the report in the
                        reviews folder of the shared notes folder. So
                        a daily report has two homes until this
                        decision is ruled.
description:            |
                        Sources:
                        - The night writes its record under DIR_RECORD
                          and the report of its review under
                          DIR_REVIEW, in the git directory
                          [src/cctool/queue/night.py within review].
                        - README.md says the report of the review is
                          kept in .git/cctool_review
                          [README.md#the-night].
                        - The review skill puts each report in the
                          reviews folder of the shared notes folder
                          [.agents/skills/reviewing-the-repository/SKILL.md#the-report].
                        - The description of the decision says the
                          night runner is planned and not built
                          [_data/decision/dec_where_reports_are_kept/dec_where_reports_are_kept.yaml
                          at description].

                        Found in the daily review of 2026-10-31, the
                        first that the night ran. No earlier report
                        could be read from .git/cctool_review, so the
                        review had no previous report to start its
                        range from.

