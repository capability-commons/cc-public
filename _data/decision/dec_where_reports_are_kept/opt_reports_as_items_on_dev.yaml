title:                  Reports as items on dev
brief:                  |
                        Each report is an item of a report type, one
                        for each run or review, committed to dev
                        through the landing queue. It names what it
                        reports on by edges, such as the commit a
                        night tested or the items a review found
                        something in, and its text is a field of the
                        item.

