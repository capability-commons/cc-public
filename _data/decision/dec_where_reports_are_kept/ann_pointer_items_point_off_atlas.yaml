title:                  Pointer items point at files only atlas holds
brief:                  |
                        A pointer item to a file in the git directory
                        names something that a clone, a cloud session
                        or the review pages cannot open, so the graph
                        can say that a report exists but not what it
                        says.
description:            |
                        Sources:
                        - The queue summary, the journal, the gate
                          results and the timing log are all in the
                          git directory on atlas
                          [src/cctool/queue/report.py within
                          write_summary, src/cctool/gate/result.py
                          within write].

