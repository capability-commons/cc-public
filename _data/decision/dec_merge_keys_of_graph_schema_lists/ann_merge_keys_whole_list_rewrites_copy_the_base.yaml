title:                  Whole-list rewrites that copy the base's list into the variant
brief:                  |
                        Replacing an unkeyed list whole means a
                        variant that changes one edge rewrites all 41,
                        and one that adds a tag restates the base's
                        tags. The variant then holds a copy of the
                        base's list, so a later change to it in the
                        base is silently overridden in every such
                        variant, and the rewriting operation becomes
                        the origin of every element in the list, so
                        unchanged elements lose their trace to the
                        base; the drafts' join and filter touch single
                        edges instead.
description:            |
                        Sources:
                        - Edges are an array and node edges are an
                          array; hosts, OS processes and dataflow
                          nodes are keyed maps.
                          (_data/schema/sch_dataflow_graph.yaml at allOf.2.properties; _data/schema/sch_dataflow_node.yaml at properties.edge)
                        - The drafts add tag lists on nodes and edges.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 1-4)
                        - The Patrol base has 41 edges.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 22-23)
                        - Merge patch cannot replace just some of the
                          values in an array. (RFC 7396, section 2,
                          https://www.rfc-editor.org/rfc/rfc7396)
                        - The sketch's join appends one edge, and its
                          filter drops single edges.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 40-43 and 64-66) Strength: strong;
                          whole-list copies grow with variants times
                          list length.

