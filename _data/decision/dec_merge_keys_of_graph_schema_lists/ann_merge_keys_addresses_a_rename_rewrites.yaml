title:                  Addresses that a rename rewrites
brief:                  |
                        An address that names an element by its id is
                        rewritten by the rename command, while one
                        built from local keys and field names is not,
                        and the drafts write such addresses, one
                        naming a field the schema calls by another
                        name. Only the whole-list option says that
                        elements with an id are addressed by that id;
                        the two keyed options are silent on whether
                        the key is the id.
description:            |
                        Sources:
                        - The rename command rewrites whole ids in
                          text, and changes a node's map key with its
                          id; a dotted path of local keys holds no id.
                          (src/cctool/edit/edit.py within PATTERN_WHOLE_ID and _rename_all and _renamed_documents)
                        - The Orin draft writes
                          dataflow_node.analysis.config.profile.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 30-32)
                        - The schema names a node's settings field
                          settings, not config.
                          (_data/schema/sch_dataflow_node.yaml at properties.settings)
                        - Lists whose elements have an id are
                          addressed by that id.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/opt_unkeyed_lists_replaced_whole.yaml,
                          brief) Strength: strong; every node rename
                          breaks each key-path address to it, and
                          those grow with variants. It supports the
                          whole-list option on this point only.

