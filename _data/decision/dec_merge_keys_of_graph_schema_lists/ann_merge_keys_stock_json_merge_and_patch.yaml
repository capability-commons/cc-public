title:                  Whole replacement and keyed members as the JSON standards do them
brief:                  |
                        Replacing unkeyed lists whole is exactly JSON
                        Merge Patch, so a partner can apply such
                        operations with a stock implementation, and
                        keyed lists turn elements into members with
                        stable paths that JSON Patch can also address,
                        while index paths into an array shift. Both
                        the every-list and the replace-whole options
                        therefore have a standard counterpart.
description:            |
                        Sources:
                        - Merge patch replaces an array whole, and
                          null values in the patch remove existing
                          values. (RFC 7396, sections 1 and 2,
                          https://www.rfc-editor.org/rfc/rfc7396)
                        - Removing an array element in JSON Patch
                          shifts the elements above it. (RFC 6902,
                          section 4.2,
                          https://www.rfc-editor.org/rfc/rfc6902)
                          Strength: weak to moderate; the functional
                          cost of whole replacement outweighs it
                          unless JSON-level exchange becomes a
                          requirement. Keys added as needed have
                          whichever counterpart the list has at the
                          time.

