title:                  Merge keys of the lists in the dataflow graph schema
brief:                  |
                        How does a variant operation address one
                        element of a list in the dataflow graph
                        schema, such as a node, port, edge, setting,
                        host or tag?
description:            |
                        Without a declared element identity, write and
                        remove on a list are ill-defined, as strategic
                        merge patch and Kustomize show
                        (_sources/survey/README.md lines 19 and 41-44;
                        _sources/survey/generative-and-transforms.md
                        line 130). The scout asked for this beyond
                        edges, for node relation lists and tag lists
                        too (_sources/four-decisions-argued.md line
                        801). It bears on
                        dec_identity_of_a_dataflow_edge and
                        dec_how_peers_absorb_renames.

