title:                  Elements that keep their own origin when a neighbor changes
brief:                  |
                        A key per element lets an operation touch one
                        element and leaves the rest traced where they
                        were. Keys for every list give that
                        everywhere; keys added as needed give it too,
                        provided no operation may write an unkeyed
                        list whole in the meantime.
description:            |
                        Sources:
                        - Merge patch cannot patch part of an array.
                          (RFC 7396, section 2,
                          https://www.rfc-editor.org/rfc/rfc7396)
                        - Tags are lists on nodes and edges in the
                          drafts.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 3-4 and 59)
                        - Until a list declares a key, no operation
                          may address one of its elements.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/opt_merge_keys_added_as_operations_need_them.yaml,
                          brief) Strength: strong; lists and variants
                          both grow.

