title:                  One key rule for the few lists left
brief:                  |
                        Three of the four sections of a dataflow graph
                        are already keyed maps, and the lists left,
                        the edges, a node's item edges and the drafts'
                        tag lists, each have a natural key: the ends,
                        the relation and target, and the value. One
                        rule declaring keys for every list costs about
                        three declarations, while adding keys as
                        operations need them applies the same
                        mechanism piecemeal, with a period where some
                        lists cannot be addressed.
description:            |
                        Sources:
                        - host, os_process and dataflow_node are maps
                          keyed by a short local name, and
                          dataflow_edge is an array.
                          (_data/schema/sch_dataflow_graph.yaml at allOf.2.properties)
                        - A dataflow node has an edge array.
                          (_data/schema/sch_dataflow_node.yaml at properties.edge)
                        - Until a list declares a key, no operation
                          may address one of its elements.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/opt_merge_keys_added_as_operations_need_them.yaml,
                          brief)
                        - Machinery that grows to carry exceptions
                          hides the problem.
                          (_data/register/reg_design_rule.yaml at entries.rule_fix_the_rule_not_the_exceptions.description)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure.0)
                          Strength: strong; the rule is one rule
                          whatever the number of lists.

