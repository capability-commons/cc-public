title:                  Keys added when an operation first needs them, with nothing to migrate
brief:                  |
                        A key added when an operation first needs to
                        address a list costs one schema change with no
                        operation to migrate, since none could address
                        the list before. Keys declared for every list
                        up front are kept for lists no operation
                        touches, and no Patrol variant yet addresses
                        one element of a list.
description:            |
                        Sources:
                        - Until a list declares a key, no operation
                          may address one of its elements.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/opt_merge_keys_added_as_operations_need_them.yaml,
                          brief)
                        - The schema has two lists of objects in a
                          graph, the dataflow edges and each node's
                          edge list.
                          (_data/schema/sch_dataflow_graph.yaml lines
                          98-106; _data/schema/sch_dataflow_node.yaml
                          lines 70-79)
                        - No Patrol variant addresses one element of a
                          list.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_no_variant_yet_names_a_single_edge.yaml,
                          brief) Strength: moderate; the saving is
                          small with few lists.

