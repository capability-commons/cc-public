title:                  Natural keys for each unkeyed list, and a substitute that waits on one
brief:                  |
                        Natural keys exist for every unkeyed list, the
                        ends for an edge, the relation and target for
                        an item edge, and the value for a tag, so
                        either keyed option can address single
                        elements. Keys added as needed would block a
                        substitute that changes a node's realized
                        interface until the node's edge list is keyed.
description:            |
                        Sources:
                        - dataflow_edge is an array, and a node's
                          settings are keyed by name while its edges
                          are an array.
                          (_data/schema/sch_dataflow_graph.yaml at allOf.2.properties.dataflow_edge; _data/schema/sch_dataflow_node.yaml at properties)
                        - The drafts add tag lists on nodes and edges.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          lines 1-4)
                        - A swap of a node version is a substitution.
                          (_sources/variants-framing.md line 56)
                          Strength: strong for keyed lists over whole
                          replacement; weak between the two keyed
                          options.

