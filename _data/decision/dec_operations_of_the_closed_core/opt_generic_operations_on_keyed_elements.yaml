title:                  Generic operations on keyed elements
brief:                  |
                        A few generic operations, add, remove and set,
                        on any element of the graph document, which an
                        operation names by its list in the schema and
                        its merge key, plus merge and the application
                        of a delta module. Authors and lowering use
                        the same few, and a new field in the graph
                        schema needs no new operation.

