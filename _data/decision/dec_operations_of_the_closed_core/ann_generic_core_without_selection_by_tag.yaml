title:                  Generic core with no operation that selects parts by tag
brief:                  |
                        The ruling on dataflow tags has variant
                        operations select parts by tag, and the Patrol
                        drafts and the trial both filter by tag: the
                        trial's filter removed every node that had a
                        tag, with each edge and record that named one.
                        The option of generic operations on keyed
                        elements names each element by its list and
                        merge key and has no operation that selects by
                        tag, so a variant that drops a tagged
                        subsystem must list every node and edge, and
                        must change whenever the base tags another
                        part. Both other options keep filter by tag,
                        whose reason traces to the ruling.
description:            |
                        Sources:
                        - Variant operations and views select parts by
                          tag.
                          (_data/decision/dec_feature_model_or_explicit_family/ruling_registered_dataflow_tags_with_constraints.yaml at brief)
                        - The Patrol drafts use add, join, filter,
                          write, host and place.
                          (_data/decision/dec_operations_of_the_closed_core/dec_operations_of_the_closed_core.yaml at description)
                        - Every Patrol variant draft begins with a
                          filter that removes the
                          nodes carrying a presence tag, with their edges.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_edge_positions_shift_on_every_edit.yaml at description)
                        - The trial's filter removes every node that
                          has the tag, with the
                          edges and records that name those nodes, and fails if no node has
                          it. (trial 2c777ab9, src/cctool/dataflow/resolve.py, functions
                          _filter and _drop_nodes)
                        - The generic option has add, remove and set
                          on an element named
                          by its list and merge key, plus merge and the application of a
                          delta module.
                          (_data/decision/dec_operations_of_the_closed_core/opt_generic_operations_on_keyed_elements.yaml at brief)
                        ASSUMPTION: a delta module cannot stand in for
                        filter, since its operations also name
                        elements by key and so cannot select by tag.
                        Strength: strong; it falls away only if remove
                        may take a tag in place of a key, which is a
                        named operation by another name.

