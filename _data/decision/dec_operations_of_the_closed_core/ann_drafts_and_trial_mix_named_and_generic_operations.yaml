title:                  Drafts and trial that both mix named operations with a dotted write
brief:                  |
                        The first user's drafts use add, join, filter,
                        write, host and place, a write of a setting on
                        a dotted address among named operations, and
                        the trial ended with the same mix, its write
                        reaching any path. The hybrid option keeps
                        that shape, with set in place of write and
                        with join, cut, place and filter named, so the
                        drafts and the trial's eighteen example
                        variants carry over with renames, and a
                        partner who knows JSON Patch recognizes add,
                        remove and set on keyed maps. The generic
                        option has no filter and turns place into a
                        set of a field. The per-part option keeps a
                        write of a setting, which covers the drafts as
                        far as the records show, but not the trial's
                        examples, which also write a unit's period and
                        core, a node's fail-safe and the replay flag.
                        JSON Patch helps only in part under any
                        option, since it reaches an array element by
                        its index while edges are keyed by their ends.
description:            |
                        Sources:
                        - The Patrol drafts use add, join, filter,
                          write, host and place.
                          (_data/decision/dec_operations_of_the_closed_core/dec_operations_of_the_closed_core.yaml at description)
                        - A write in the drafts addresses a setting by
                          a dotted string.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_every_reader_must_know_each_operation.yaml at description)
                        - The trial's core was add host, add unit,
                          remove unit, add node,
                          remove node, place, write, unset, join, cut, filter, record and
                          merge. (trial process log, phase 1)
                        - All eighteen example variants of the trial
                          resolve, lower and
                          pass every check. (review of 2026-10-29, areas/trial-model.md,
                          section 5)
                        - The trial's example variants write paths
                          such as a unit's
                          period and core, a node's fail-safe and the flag that asks for
                          recording for replay, beside a node's setting. (trial 2c777ab9,
                          the write operations in
                          src/cctool/dataflow/_test/_example/dataflow_variant/)
                        - Under the per-part option the core has a
                          write and an unset of
                          a setting.
                          (_data/decision/dec_operations_of_the_closed_core/opt_one_operation_per_kind_of_part.yaml at brief)
                        - Generic add, remove and write correspond to
                          JSON Patch add,
                          remove and replace on keyed maps.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_vocab_generic_operations_map_onto_json_patch.yaml at brief)
                        - JSON Pointer refers to an array element by
                          its zero-based index.
                          (RFC 6901, section 4, https://www.rfc-editor.org/rfc/rfc6901)
                        - A dataflow edge is identified by its two
                          ends.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml at brief)
                        - Patrol is the first user. (WTP, 2026-10-28)
                          ASSUMPTION: each of the trial's operations
                          maps onto one operation of the hybrid option
                          by a rename or by naming its list, as add
                          host becomes an add on the list of hosts.
                          Strength: moderate; the drafts are notes
                          rather than records, and no exchange with a
                          partner is planned yet.

