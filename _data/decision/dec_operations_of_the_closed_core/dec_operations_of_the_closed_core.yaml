title:                  Operations of the closed core
brief:                  |
                        The closed core of variant operations is ruled
                        to be fixed in the schema, but no schema names
                        the operations. Which operations make up the
                        core?
description:            |
                        ruling_closed_core_with_one_reuse_item fixes
                        the core in the schema, with merge and its
                        commands that join edges, and makes the delta
                        module the one item for reuse.
                        ruling_merge_key_declared_for_every_list makes
                        every element of a list addressable by its
                        key, ruling_edge_identified_by_its_ends names
                        an edge by its ends, and
                        ruling_one_vocabulary_for_authoring_and_lowering
                        has lowering write the same operations as
                        authors do. No schema of a variant exists yet
                        (icd_dataflow_items). The Patrol drafts use
                        add, join, filter, write, host and place. The
                        trial implementation of 2026-10-29 used
                        thirteen operations, one for each kind of part
                        and change, and left merge outside the input
                        digest (review of 2026-10-29, CC-007).

