title:                  Generic write that bypassed the rules of the named operations
brief:                  |
                        The trial's core had named operations with
                        preconditions of their own beside a generic
                        write on any path, and in the review's probes
                        the write reached what the named operations
                        guard. It created a unit on a host that does
                        not exist, which adding a unit refuses, and
                        lowering gave that unit no control block, so
                        the node placed there would never run; it
                        created a node with no node type, which
                        crashed the check; and of the three ways that
                        bypassed the binding-time check, two were
                        writes of a whole node or of a node's settings
                        map. Under the generic option every change
                        goes through set, so the preconditions of set
                        must cover what place and add check; under the
                        hybrid option two routes reach one field
                        unless the option says which fields only a
                        named operation may write. Under one operation
                        for each kind of part there is no second
                        route.
description:            |
                        Sources:
                        - The trial's thirteen operations include
                          write and unset on any
                          path, and write needs only the parent of its path to exist.
                          (trial process log, phase 1; trial 2c777ab9,
                          src/cctool/dataflow/resolve.py, functions _write and _parent)
                        - A write of a unit with a host that does not
                          exist, followed by a
                          place, passes every check, and lowering adds no control block
                          for that unit, from which the review concludes that the node
                          never runs; a write of a new node with only a unit makes the
                          check raise. (review of 2026-10-29, CC-041, detail TM-12, with
                          the probe logs areas/trial-model-logs/p20_misc.out and
                          p05_resolver.out)
                        - Adding a node with a setting, writing a
                          node's settings map and
                          writing a whole node all bypass the binding-time check. (review
                          of 2026-10-29, CC-025, detail TM-08)
                        - Generic writes would reach the identity and
                          placement fields of
                          a node and move it past the rules of place.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_vocab_generated_writes_reach_identity_fields.yaml at brief)
                        - The hybrid option has generic add, remove
                          and set, plus named
                          operations where a change has a rule of its own, such as place
                          for placement.
                          (_data/decision/dec_operations_of_the_closed_core/opt_generic_core_with_named_graph_operations.yaml at brief)
                        Strength: moderate to strong; it weakens if
                        set may only change a field that exists and
                        that no named operation governs, and if add
                        requires every reference an element holds to
                        resolve.

