title:                  Per-part core that kept a generic write and grows with the schema
brief:                  |
                        Lowering is ruled to write its rewrites in the
                        operations that authors use, and it writes
                        fields no author writes, such as the capacity
                        of each port. The trial's thirteen operations,
                        nominally one for each kind of part, kept a
                        generic write, and its lowering used that
                        write for capacities beside adding nodes,
                        joining and cutting. Under one operation for
                        each kind of part, each field that lowering
                        derives and each list the schema gains, such
                        as execution units, members of a port group or
                        records, needs operations of its own with
                        fields and preconditions, and each is one more
                        operation that the checks, renames, origin
                        records and change sets must understand. The
                        generic and hybrid options reach a new field
                        or list with the operations they already have.
description:            |
                        Sources:
                        - Generated transforms are written as variant
                          operations and
                          applied by the same interpreter as authored ones.
                          (_data/decision/dec_authored_operations_and_lowering/ruling_one_vocabulary_for_authoring_and_lowering.yaml at brief)
                        - The trial's lowering emits operations that
                          add nodes, join and
                          cut edges, and write each node's map of capacities. (trial
                          2c777ab9, src/cctool/dataflow/lower.py, the calls of emit)
                        - The trial's core includes write and unset on
                          any path. (trial
                          process log, phase 1)
                        - How execution units enter the graph schema
                          is still open
                          (dec_execution_units_in_the_graph_schema), and a variant
                          operation that adds a member of a port group mints its guid.
                          (_data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml at description)
                        - Checks, rename maps, dictionary upgrades,
                          origin records and
                          change sets must each interpret every operation they meet.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_every_reader_must_know_each_operation.yaml at brief)
                        - The simplicity measure counts the distinct
                          mechanisms a design
                          introduces.
                          (_data/register/reg_concern.yaml at entries.concern_simplicity.measure)
                        Strength: moderate to strong; it grows with
                        each lowering step and each list added to the
                        schema, and it falls away only if the per-part
                        option keeps a generic write for derived
                        fields, which makes it the hybrid.

