title:                  Merge written part by part that dropped the parts it did not list
brief:                  |
                        The trial's merge copied hosts, units and
                        nodes in one loop and edges in another, and
                        lost what neither listed: the merged variant's
                        records and replay flag vanished, an edge's
                        delivery policy was replaced by the base
                        edge's with no conflict reported, since edges
                        were not compared, and the merged node's
                        origin held only the merge. A merge defined
                        once over every keyed list of the schema,
                        comparing elements by their declared merge
                        key, carries a new list by construction and
                        gives the open question of conflicts between
                        merged variants one place to detect a clash.
                        The generic and hybrid options define their
                        operations over keyed elements; under one
                        operation for each kind of part, merge is one
                        more operation whose handling is specific to
                        each part.
description:            |
                        Sources:
                        - The trial's merge loses the merged variant's
                          records and replay
                          flag, replaces an edge's delivery policy with the base edge's,
                          compares hosts, units and nodes but not edges, and gives the
                          merged node only the merge as origin. (review of 2026-10-29,
                          CC-007, detail TM-03, reproduced in
                          areas/trial-model-logs/p06_merge.out; trial 2c777ab9,
                          src/cctool/dataflow/resolve.py, function _merge)
                        - Every list of the graph schema declares a
                          merge key.
                          (_data/decision/dec_merge_keys_of_graph_schema_lists/ruling_merge_key_declared_for_every_list.yaml at brief)
                        - The resolver records every operation that
                          touched each part, in
                          order.
                          (_data/decision/dec_origin_trace_of_a_resolved_graph/ruling_trace_of_every_touching_operation.yaml at brief)
                        - Under the per-part option the fields and
                          preconditions of each
                          operation are specific to its part.
                          (_data/decision/dec_operations_of_the_closed_core/opt_one_operation_per_kind_of_part.yaml at brief)
                        - An argument on the open conflict decision
                          treats refusing a
                          conflicting merge as a precondition of the merge, which the
                          resolver already checks.
                          (_data/decision/dec_conflict_between_merged_variants/ann_merge_conflict_as_a_failed_precondition.yaml at brief)
                        ASSUMPTION: under the generic options merge is
                        written as a walk over each keyed list of the
                        schema, not as code for each section.
                        Strength: moderate; the trial's omissions are
                        bugs any option could fix, but only a merge
                        over declared keys stays complete as the
                        schema grows.

