title:                  One operation for each kind of part
brief:                  |
                        A named operation for each kind of part and
                        change, such as add or remove a host, a unit
                        or a node, place a node, write or unset a
                        setting, join or cut an edge, tag or untag a
                        part, filter by tag, and merge, as in the
                        Patrol drafts and the trial. The fields and
                        preconditions of each operation are specific
                        to its part.

