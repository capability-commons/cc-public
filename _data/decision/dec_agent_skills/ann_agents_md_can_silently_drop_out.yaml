title:                  AGENTS.md dropping out of Claude Code
brief:                  |
                        Claude Code reads AGENTS.md only under
                        conditions a contributor can break without
                        knowing, so procedures held only there can
                        silently fail to reach it.
description:            |
                        Claude Code reads AGENTS.md only when there is
                        no CLAUDE.md, .claude/CLAUDE.md or
                        CLAUDE.local.md in the working directory or
                        above. A CLAUDE.local.md stops it unless a
                        setting is changed. It needs v2.1.277 or
                        later, and some sessions, such as the first
                        after an upgrade, read CLAUDE.md files only
                        (https://code.claude.com/docs/en/memory,
                        sections "When Claude Code reads AGENTS.md"
                        and "When AGENTS.md support is unavailable",
                        fetched 2026-10-15). .gitignore line 37
                        ignores every file not listed, and lines 58-75
                        do not list CLAUDE.local.md, so such a file
                        stays local and unseen. AGENTS.md is kept
                        under every alternative; this bears on putting
                        all procedure there.

