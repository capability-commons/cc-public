title:                  Undocumented link on the whole skills directory
brief:                  |
                        Claude Code documents a link for each skill
                        folder inside .claude/skills, not for
                        .claude/skills itself, so the layout rests on
                        behavior no vendor promises, and nothing in
                        the repository checks that Claude Code still
                        sees the skills.
description:            |
                        .claude/skills is committed as a symbolic
                        link, git mode 120000, to ../.agents/skills
                        (7f3412f, pre-squash). The skills page lists
                        project skills at
                        .claude/skills/<skill-name>/SKILL.md and says
                        a <skill-name> entry may be a link
                        (https://code.claude.com/docs/en/skills,
                        "Symlinked folders", fetched 2026-10-15). It
                        does not mention .agents/skills. No code under
                        src/ refers to symlink or islink. ASSUMPTION:
                        the directory link works in Claude Code today;
                        no advocate tested it. A per-skill link, or a
                        check that both paths give the same SKILL.md
                        files, would rest on documented behavior or
                        detect a failure.

