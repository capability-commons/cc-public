title:                  Procedure loaded when an edit is refused
brief:                  |
                        A skill puts the cctool procedure and its
                        traps in front of the agent when it starts an
                        edit or an edit is refused, and costs only a
                        short description otherwise, where AGENTS.md
                        is read whole in every session.
description:            |
                        Claude Code loads each skill's name and
                        description at start, about 100 tokens, and
                        reads the body only when a request matches
                        (https://platform.claude.com/docs/agents-and-tools/agent-skills/overview).
                        Codex does the same
                        (https://learn.chatgpt.com/docs/build-skills).
                        The description of editing-data-items says to
                        read it before edits and ALWAYS when cctool
                        refuses an edit or check fails (SKILL.md lines
                        3-8). It lists traps by check name, such as
                        unused_concept and unargued_driver, with the
                        fix (SKILL.md lines 57-80). AGENTS.md is 93
                        lines and loads at session start. ASSUMPTION:
                        future descriptions keep matching the tasks.

