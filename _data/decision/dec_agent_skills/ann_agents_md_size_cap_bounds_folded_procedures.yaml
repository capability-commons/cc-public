title:                  Size ceiling on procedures folded into AGENTS.md
brief:                  |
                        Codex stops reading instruction files once
                        their combined size reaches 32 KiB by default,
                        so putting every tool procedure in AGENTS.md
                        has a ceiling on the procedures themselves;
                        skills have a budget only on their list of
                        names and descriptions, and load bodies one at
                        a time.
description:            |
                        Codex reads AGENTS.md files up to
                        project_doc_max_bytes, 32 KiB by default, and
                        "stops adding files once the combined size
                        reaches the limit"
                        (https://learn.chatgpt.com/docs/agent-configuration/agents-md,
                        redirected from
                        https://developers.openai.com/codex/guides/agents-md,
                        fetched 2026-10-15). AGENTS.md is 4602 bytes
                        and SKILL.md 6283 bytes (wc -c at 89c74d8);
                        folded together they come to 10885 bytes,
                        about a third of the limit, for one tool
                        procedure. Skills load a body only when a
                        skill is chosen
                        (ann_skill_loads_when_cctool_refuses_an_edit
                        covers the per-session cost; this adds the
                        hard limit). Codex does cap the initial list
                        of skill names and descriptions, by default at
                        2% of the context window or 8,000 characters,
                        shortening or omitting entries beyond it, but
                        states no limit on SKILL.md bodies
                        (https://learn.chatgpt.com/docs/build-skills,
                        fetched 2026-10-15). ASSUMPTION: more tool
                        procedures will come; none is planned in the
                        sources read.

