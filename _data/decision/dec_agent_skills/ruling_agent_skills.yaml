title:                  Skills in .agents with a .claude link
brief:                  |
                        Procedures for the tools are skills in
                        .agents/skills in the open Agent Skills
                        format, and .claude/skills is a link to that
                        directory, so Codex and Claude Code read one
                        copy, as chosen on 2026-10-14. Skills only in
                        .claude would leave Codex without them, and
                        AGENTS.md alone would load every procedure in
                        every session and come near the Codex size
                        limit. Ruled by WTP on 2026-10-23.

