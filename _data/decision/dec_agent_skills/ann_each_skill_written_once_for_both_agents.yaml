title:                  Each skill written once for both agents
brief:                  |
                        Codex reads .agents/skills and Claude Code
                        reads .claude/skills, so one directory with a
                        link gives both agents the same skills from
                        one copy, with no setup and no second copy to
                        keep.
description:            |
                        Codex scans .agents/skills from the working
                        directory up to the repository root
                        (https://learn.chatgpt.com/docs/build-skills,
                        redirected from
                        https://developers.openai.com/codex/skills,
                        fetched 2026-10-15). Claude Code loads project
                        skills from .claude/skills and reads nothing
                        under .agents/ as instructions
                        (https://code.claude.com/docs/en/skills;
                        https://code.claude.com/docs/en/memory,
                        section "When Claude Code reads AGENTS.md").
                        In the repository .claude/skills links to
                        ../.agents/skills (7f3412f), and AGENTS.md
                        lines 57-62 state the layout. The project
                        memory (memory/MEMORY.md line 38) says remote
                        tools cannot write under .claude/, and all 10
                        commits that changed SKILL.md went through the
                        .agents path. Weakens only if a partner uses
                        an agent that reads neither path (ASSUMPTION:
                        which other agents read .agents/skills is not
                        checked).

