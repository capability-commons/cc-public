title:                  Skills path shared by many agent hosts
brief:                  |
                        Many agent hosts beyond Codex share
                        .agents/skills as their project skills path,
                        so moving cc-public to another agent likely
                        needs no change to where the skills live,
                        where .claude/skills alone serves one vendor.
description:            |
                        The manual page of gh skill install says that
                        at project scope several agents "share the
                        .agents/skills directory", including GitHub
                        Copilot, Cursor, Codex, Gemini CLI,
                        Antigravity, Amp, Cline, OpenCode and Warp
                        (https://man.archlinux.org/man/gh-skill-install.1.en,
                        fetched 2026-10-15). The skill uses only the
                        two required fields of the open format
                        (.agents/skills/editing-data-items/SKILL.md).
                        This checks the assumption left open in
                        ann_each_skill_written_once_for_both_agents.
                        ASSUMPTION: each listed host loads the skill
                        as Codex does; the page states the shared
                        install path, not how each host loads it.
                        Grows with the number of hosts partners may
                        bring.

