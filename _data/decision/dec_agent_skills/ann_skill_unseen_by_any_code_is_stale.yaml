title:                  Agent guides now read by a test
brief:                  |
                        ann_skill_restates_agents_md_commands says no
                        Python file refers to .agents or SKILL.md, so
                        nothing checks the restated commands. A test
                        now reads AGENTS.md and every SKILL.md and
                        fails on any command, task, id or path the
                        code lacks.
description:            |
                        src/cc_public/cli/_test/test_guidance.py reads
                        AGENTS.md and .agents/skills/*/SKILL.md
                        (TUPLE_GUIDE) and has
                        test_every_cctool_command_in_the_guides_exists,
                        test_every_pixi_task_in_the_guides_exists,
                        test_every_id_in_the_guides_names_an_item,
                        test_every_other_name_in_the_guides_is_a_check_predicate_or_field
                        and test_every_path_in_the_guides_exists. It
                        catches a stale name in either guide, but it
                        does not check that the two guides agree, and
                        cctool check still does not read them. Found
                        in the review of 2026-10-22.

