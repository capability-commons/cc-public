title:                  Skills tied to a checkout that keeps links
brief:                  |
                        Claude Code gets the skills only through a
                        symbolic link, so on a clone where git does
                        not make links the skills would vanish for
                        Claude Code, presumably without any error
                        (assumed, not tested).
description:            |
                        .claude/skills is the only entry of git mode
                        120000 in the tree (git ls-files -s at
                        89c74d8), added in 7f3412f (pre-squash). With
                        core.symlinks false, git checks a link out as
                        a plain file holding the link text, and git
                        clone sets it false where the file system
                        needs it (git Documentation/config/core.txt
                        lines 237-246, v2.43.0). Claude Code loads
                        project skills from
                        .claude/skills/<skill-name>/SKILL.md
                        (https://code.claude.com/docs/en/skills,
                        fetched 2026-10-15). Will asked "Can git store
                        symbolic links?" at 2026-10-14T10:11:03Z and
                        at 10:11:55Z asked for a note that Windows is
                        not supported; README.md lines 28-30 give the
                        links as the first reason. The cost is small
                        today, since the pixi platforms are osx-arm64
                        and linux-64 only (pyproject.toml line 52) and
                        the git hooks need /bin/sh. It grows if the
                        platforms widen or an agent runs where links
                        are not kept, since the link is the one
                        barrier that fails silently. A check that
                        .claude/skills resolves to the same SKILL.md
                        files would guard it while keeping the layout.
                        ASSUMPTION: Claude Code finds no skills when
                        .claude/skills is a plain file; not tested.

