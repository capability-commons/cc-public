title:                  Pixi environment now locked for three platforms
brief:                  |
                        ann_skills_link_lost_without_git_symlinks says
                        the pixi platforms are osx-arm64 and linux-64
                        only. The environment is now also locked for
                        osx-64.
description:            |
                        pyproject.toml line 59 lists osx-arm64, osx-64
                        and linux-64, and pixi.lock holds osx-64
                        packages (for example line 96). README.md
                        lines 47-52 say Intel Macs are locked but
                        untested and so unsupported, and Windows is
                        still unsupported because the repository holds
                        symbolic links. Found in the review of
                        2026-10-22.

