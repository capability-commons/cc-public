title:                  Skills resting on an open format
brief:                  |
                        The skills use only the two required fields of
                        the open Agent Skills format, so losing either
                        agent leaves the other working and leaves
                        plain Markdown that AGENTS.md points to.
description:            |
                        The format requires only name and description
                        in YAML front matter, with a free Markdown
                        body (https://agentskills.io/specification).
                        Codex and Claude Code both build on it
                        (https://learn.chatgpt.com/docs/build-skills;
                        https://code.claude.com/docs/en/skills).
                        .agents/skills/editing-data-items/SKILL.md use
                        only those two fields.
                        AGENTS.md#working-beside-other-agents name the
                        directory and the skill. Weakens if skills
                        start to use vendor extensions such as
                        allowed-tools, which the specification marks
                        experimental.

