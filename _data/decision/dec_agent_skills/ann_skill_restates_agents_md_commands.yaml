title:                  Commands stated in both AGENTS.md and the skill
brief:                  |
                        The skill restates the cctool commands and
                        rules that AGENTS.md also states, so a reader
                        meets them twice and a change must be made in
                        both by hand, with nothing to check that the
                        two agree.
description:            |
                        Commands: AGENTS.md#changing-data-items and
                        .agents/skills/editing-data-items/SKILL.md#which-command.
                        The guid rule: AGENTS.md#changing-data-items
                        and SKILL.md lines 57-58 and 134-138. The
                        rename rule: AGENTS.md#changing-data-items and
                        SKILL.md lines 127-130. SKILL.md line 13 makes
                        AGENTS.md the reference, which keeps them from
                        conflicting today. A test reads AGENTS.md and
                        every SKILL.md and fails on any cctool
                        command, pixi task, id, name or path that the
                        code lacks
                        (src/cctool/cli/_test/test_guidance.py), but
                        nothing checks that the two guides say the
                        same thing, and cctool check does not read
                        them (grep for AGENTS and SKILL in
                        src/cctool/check finds nothing). SKILL.md
                        names 14 failure ids, 12 from
                        src/cctool/check/check.lp and 2
                        (schema_violation, unformatted_file) from
                        check.py. SKILL.md changed in 10 of 33 commits
                        from 7dda99e to 89c74d8, AGENTS.md in 7.
                        Shared commands were changed in both by hand
                        in the same commit in afbcf6f and 29cb646, but
                        af6ec6e added unlink and unset to SKILL.md
                        alone, and AGENTS.md listed them only from
                        29cb646, two commits later. Bears equally on
                        opt_skills_in_claude_dir. It is cured by
                        moving procedure out of AGENTS.md, not by
                        dropping skills.

