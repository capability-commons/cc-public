title:                  Skills used by a colleague and read by two agents
brief:                  |
                        A colleague already uses skills to capture how
                        tools are used, and both Codex and Claude Code
                        read skills, so skills suit cc-public for
                        either agent.
description:            |
                        Maintainer's reason. WTP, 2026-10-14: "my
                        colleague uses skills in ... would it be
                        suitable and appropriate and effective for us
                        to create skills files in cc-public to capture
                        how the command line tools should be used?".
                        He took skills to be Claude-specific ("If
                        we're Claude-specific with skills anyway, then
                        let's rename AGENTS.md to CLAUDE.md"). Then:
                        "Apparently OpenAI Codex can also use skills,
                        and both Claude Code and Codex can use
                        AGENTS.md - So that changes my decision".
                        Built in 6255160 and 7f3412f (pre-squash).

