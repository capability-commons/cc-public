title:                  Readback as the chance to correct
brief:                  |
                        A readback shows a person what will be
                        recorded about them and lets them correct it
                        before it lands. Writing with no readback
                        denies them that chance until after the fact.
description:            |
                        The privacy concern asks whether a person can
                        see, correct and remove their own data
                        [_data/register/reg_concern.yaml lines
                        736-739]. ISO/IEC 29100 sets out individual
                        participation as a privacy principle
                        [_data/register/reg_concern.yaml lines
                        728-734]. Two options read the item back to
                        the contributor before it is written
                        [_data/decision/dec_chat_review_gates/opt_readback_and_branch_review.yaml
                        and opt_readback_then_dev.yaml, briefs]. The
                        branch-only option writes the item with no
                        readback
                        [_data/decision/dec_chat_review_gates/opt_branch_review_only.yaml,
                        brief]. A likely first instance is member
                        skill profiles, which hold personal data
                        [context.md lines 59-60]. Holds at ten times
                        the size: yes, because a readback is one step
                        per item and a reviewer's ability to check the
                        facts of each person does not grow with
                        volume.

