title:                  Readback after the checks, then review of the branch
brief:                  |
                        The bot reads the item back to the contributor
                        once the automated checks and corrections have
                        been applied, writes it to its branch, and
                        lands it only after that branch is reviewed.
                        Ruled by William Payne on 2026-10-22.

