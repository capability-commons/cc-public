title:                  Readback confirms an item with its source
brief:                  |
                        Only the contributor can confirm the facts
                        they gave, and a readback asks them while they
                        are still in the conversation. Review of the
                        branch alone lands items that the source never
                        saw, and a reviewer who spots a doubtful fact
                        must go back to a contributor who has left.
description:            |
                        Two options read the item back to the
                        contributor before it lands
                        (_data/decision/dec_chat_review_gates/opt_readback_and_branch_review.yaml,
                        brief)
                        (_data/decision/dec_chat_review_gates/opt_readback_then_dev.yaml,
                        brief). The third writes the item with no
                        readback and relies on review of the branch
                        (_data/decision/dec_chat_review_gates/opt_branch_review_only.yaml,
                        brief). Data in the graph is expected to be
                        almost entirely LLM generated, and humans
                        mainly inspect and review (owner's statement).
                        The checks run by the edit commands test the
                        item against the graph, not against what the
                        contributor said (src/cc_public/edit/edit.py,
                        function apply at line 1075). ASSUMPTION: the
                        reviewer of the branch of the bot is not the
                        person who holds the facts, for example a
                        member's own skills. A reviewer of the branch
                        did not take part in the conversation
                        (ASSUMPTION). A readback leaves a trace only
                        if its outcome is recorded, for example in the
                        transcript or the commit item (ASSUMPTION).
                        Holds at ten times the size: yes, because each
                        extra contributor adds facts that only that
                        contributor can confirm, one readback costs
                        one message per item, and a reviewer's
                        distance from each source grows with the
                        number of contributors.

