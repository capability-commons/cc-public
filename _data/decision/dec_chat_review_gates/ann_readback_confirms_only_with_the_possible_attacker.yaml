protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  No independent check from readback
brief:                  |
                        Readback asks the same person who supplied the
                        text, so it cannot catch a contributor who
                        means harm. Only a human review of the branch
                        stands between untrusted chat input and dev.
description:            |
                        Under opt_readback_then_dev, an item lands on
                        dev once the contributor confirms and the
                        checks pass [opt_readback_then_dev.yaml
                        brief]. The checks test the graph for
                        consistency, not whether a statement is true
                        or was meant to be supplied
                        (src/cctool/check/check.lp;
                        src/cctool/edit/edit.py). A new standalone
                        item takes its protective_mark, with copyright
                        and license, from file_pyproject
                        [src/cctool/edit/edit.py within MAP_KEY_FIXED,
                        SET_KEY_FIXED and _redotted]. The only mark in
                        the register is mark_public
                        [_data/register/reg_protective_mark.yaml at
                        entries]. The register says mark_public is
                        affirmative and not a default
                        [_data/register/reg_protective_mark.yaml at
                        entries.mark_public.usage]. ASSUMPTION: text a
                        contributor supplies can carry instructions
                        aimed at the LLM that drafts the item or at
                        later agents that read the graph. Holds at ten
                        times the size: yes, because more contributors
                        raise the chance that one acts in bad faith,
                        though review load also grows.

