title:                  Recorded readback as evidence of accuracy
brief:                  |
                        The law asks the controller to take every
                        reasonable step to keep personal data
                        accurate, and to be able to show it. A
                        readback whose outcome is recorded is such a
                        step with a record. Review of the branch alone
                        has no step in which the person the data is
                        about confirms it.
description:            |
                        Personal data must be accurate, and every
                        reasonable step must be taken to erase or
                        correct inaccurate data without delay [UK GDPR
                        Art 5(1)(d),
                        https://www.legislation.gov.uk/eur/2016/679/chapter/II].
                        The controller must be able to show that it
                        complies [UK GDPR Art 5(2), same URL]. A
                        person may have inaccurate data about them
                        corrected and incomplete data completed [UK
                        GDPR Art 16,
                        https://www.legislation.gov.uk/eur/2016/679/article/16].
                        Two options read the item back to the
                        contributor before it lands
                        [_data/decision/dec_chat_review_gates/opt_readback_and_branch_review.yaml
                        and opt_readback_then_dev.yaml, briefs]. The
                        branch-only option writes the item with no
                        readback
                        [_data/decision/dec_chat_review_gates/opt_branch_review_only.yaml,
                        brief]. The readback happens after any
                        automated checks and corrections [owner's
                        statement]. Data in the graph is expected to
                        be almost entirely LLM generated [owner's
                        statement]. A likely first instance is member
                        skill profiles, which hold personal data
                        [context.md lines 59-60]. ASSUMPTION: the
                        contributor is often the person the item is
                        about, as with a member's own skill profile.
                        ASSUMPTION: the bot records the outcome of
                        each readback, for example in the commit item,
                        otherwise the step leaves no evidence. Holds
                        at ten times the size: yes, because each item
                        still needs its own confirmation, and a
                        reviewer of the branch cannot confirm facts
                        about each of ten times as many people.

