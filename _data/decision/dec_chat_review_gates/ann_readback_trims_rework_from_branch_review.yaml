title:                  Readback trims rework from the branch under review
brief:                  |
                        With readback, an item reaches the branch
                        already confirmed, so the reviewer reads one
                        small commit per item rather than an item plus
                        later fixes.
description:            |
                        One commit does one thing (AGENTS.md, line
                        87). Each change should be small enough to
                        read in one sitting (AGENTS.md, line 219-221).
                        An item file of the option type is about 20
                        lines long
                        (_data/decision/dec_chat_review_gates/opt_readback_then_dev.yaml,
                        22 lines). Readback reads the item back to the
                        contributor to confirm before it is written to
                        the branch
                        (opt_readback_and_branch_review.yaml, line
                        13-16). The owner expects an eval to give
                        feedback when information is insufficient,
                        inaccurate or poorly phrased (owner's
                        statement). ASSUMPTION: without readback, a
                        share of items need a second commit that
                        corrects them, and that adds to the count of
                        changes awaiting review. Holds at ten times
                        the size: yes, because the count of changes
                        awaiting review is the measure that grows
                        first, and each correction avoided is one
                        change fewer in the queue.

