title:                  Readback by the person who holds the facts
brief:                  |
                        Only the contributor knows whether a captured
                        item says what they meant, so a readback is
                        the one gate that checks the content against
                        its source. Review of the branch alone checks
                        form, not truth.
description:            |
                        The bot elicits fields from a person and
                        proposes the item itself (adv/context.md lines
                        4-7). ASSUMPTION: the reviewer of the branch
                        was not in the conversation and cannot tell
                        whether a skill entry matches what the member
                        said. Branches land only when their work is
                        agreed (AGENTS.md line 40). Holds at ten times
                        the size: yes, because each item still has one
                        source who can confirm it, and a reviewer sees
                        more items with no more knowledge of each.

