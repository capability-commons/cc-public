title:                  No person to judge an item landed straight on dev
brief:                  |
                        Under readback then dev, no maintainer reads
                        an item before it lands, so the change is
                        never judged by a reviewer. Both branch
                        options keep a person between the bot and dev.
description:            |
                        Readback then dev lands an item once the
                        contributor confirms and the checks pass
                        (_data/decision/dec_chat_review_gates/opt_readback_then_dev.yaml
                        at brief). The two other options write to the
                        branch of the bot and rely on review of that
                        branch (opt_branch_review_only.yaml at brief;
                        opt_readback_and_branch_review.yaml at brief).
                        The repository rule is to land a branch only
                        when its work is agreed
                        (AGENTS.md#working-beside-other-agents). Data
                        in the graph is expected to be almost entirely
                        LLM generated, and humans mainly inspect and
                        review it (owner's statement). Major decisions
                        stay with the maintainer (owner's statement).
                        A likely first contributor is a member of a
                        volunteer team, not the maintainer
                        (context.md, line 59-60). The checks refuse an
                        edit that adds a check failure, so they test
                        form and consistency against the graph, not
                        whether a fact is true
                        (src/cctool/edit/edit.py). Holds at ten times
                        the size: yes, because the gap is one of kind,
                        not volume. At ten times the size the branch
                        queue grows, but readback then dev answers
                        that by removing review, not by making it fit.

