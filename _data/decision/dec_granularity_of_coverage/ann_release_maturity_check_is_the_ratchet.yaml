title:                  The release maturity check as the ratchet on coverage
brief:                  |
                        A coverage ratchet is not needed. Each
                        module's coverage only has to meet what its
                        declared maturity requires, and the ruled
                        check of the maturity a release declares
                        refuses a release whose modules fall short of
                        it, so coverage cannot fall below what a
                        release claims. A per-module record checked
                        against the declared maturity is enough for
                        now.
description:            |
                        WTP's argument (WTP, 2026-10-28). It rests on
                        ruling_maturity_of_code (maturity declared on
                        each source file) and
                        ruling_maturity_of_a_release (a release
                        declares a maturity, and a check holds it to
                        it).

