title:                  Ratchet state that can be lost or moved
brief:                  |
                        A ratchet per module compares against a value
                        last recorded for each module, so it is only
                        as reliable as the place that keeps that
                        value. If it lives in a local store, a lost
                        store resets every ratchet without a word. If
                        code moves between modules, a module's
                        coverage can fall with no loss of tests.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_coverage_floor_is_one_number_and_one_flag
                          (the ratchet option's recorded value).
                        - Under the plan WTP said to proceed with,
                          observations live in a local evidence store
                          read as facts [owner's statement,
                          2026-10-25], and the gate keeps its local
                          stores in the git directory, which no commit
                          records [src/cctool/gate/gate.py at
                          functions store and timing_log,
                          src/cctool/gate/timing.py at module
                          docstring].
                        - The existing check store returns nothing
                          when it cannot be read
                          [src/cctool/check/store.py at function
                          load].
                        - The ratchet option does not say where the
                          value last recorded for each module is kept
                          [_data/decision/dec_granularity_of_coverage/opt_coverage_ratchet_per_module.yaml
                          at brief].
                        - ASSUMPTION: moving a well tested function
                          out of a module lowers that module's
                          percentage even when no test is lost.
                          Strength: moderate, and conditional on where
                          the value is kept. With a committed record
                          the first point falls away. The second holds
                          at ten times the size, since refactors touch
                          more modules.

