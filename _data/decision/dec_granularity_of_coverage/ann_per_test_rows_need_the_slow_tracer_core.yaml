title:                  Rows per test that need the slow non-default core
brief:                  |
                        A suite floor or a module ratchet needs only
                        aggregate branch coverage, which the default
                        sys.monitoring core gives for about 6 percent
                        on Python 3.14 or later. Rows per test and
                        function need the C tracer core, a heavier and
                        less used path of the same library, at 2.6
                        times the run time and an 18 MB data file.
description:            |
                        Sources:
                        - Branch coverage with the sys.monitoring core
                          on Python 3.14 took 221 s against 209 s
                          without coverage, about 6 percent [measured
                          by Claude in the cloud container,
                          2026-10-26].
                        - Single runs differ by up to about 10 percent
                          from noise [measured by Claude in the
                          cloud container, 2026-10-26].
                        - On Python 3.13 sys.monitoring has no branch
                          support, and atlas runs Python 3.15
                          [measured by Claude in the cloud container,
                          2026-10-26].
                        - Coverage per test needs the C tracer core,
                          which took 534 s, 2.6 times the base, wrote
                          an 18 MB data file and made two tests that
                          pass without tracing fail [measured by
                          Claude in the cloud container, 2026-10-26].
                        - coverage.py records a separate dynamic
                          context per test function when
                          dynamic_context is test_function
                          [https://coverage.readthedocs.io/en/latest/contexts.html].
                        - coverage.py 7.17.0 is under Apache-2.0, and
                          pytest-cov 7.1.0 is under MIT and needs
                          coverage, pluggy and pytest
                          [https://pypi.org/pypi/coverage/json,
                          https://pypi.org/pypi/pytest-cov/json].
                        - Neither coverage nor pytest-cov is in the
                          lock file of dev today [pixi.lock, by search
                          for their names]. Strength for
                          concern_dependency_risk: Moderate. Every
                          option adds coverage.py, so the new
                          dependency itself does not separate them.
                          What separates them is the path within it.
                          The aggregate options use the default core,
                          and rows per test rely on a core that has
                          broken tests here. The point holds at ten
                          times the size and grows with the data file.
                          Strength for concern_performance_efficiency:
                          strong. The 6 percent figure sits inside
                          the noise, and the factor of 2.6 does not.
                          At ten times the tests the factor holds and
                          the per-test data grows with tests times
                          lines reached.

