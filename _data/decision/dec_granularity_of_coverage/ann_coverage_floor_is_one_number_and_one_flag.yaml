title:                  Mechanisms of each coverage granularity
brief:                  |
                        A floor for the suite is one number checked by
                        one flag of the coverage tool. A ratchet per
                        module reuses the idea of the term ratchets
                        but keeps a recorded value per module. Rows
                        per test add a fact kind, a core and rules.
description:            |
                        Sources:
                        - September gated with one floor of 87 percent
                          branch coverage through the coverage
                          tool's fail-under option
                          [origin/main:pyproject.toml at the comment
                          on the coverage floor and the coverage
                          tasks].
                        - Term ratchets on dev keep a count that may
                          fall and may not rise
                          [_data/decision/dec_granularity_of_coverage/dec_granularity_of_coverage.yaml
                          at description].
                        - The ratchet option records coverage per
                          module and compares it with the last
                          recorded value
                          [_data/decision/dec_granularity_of_coverage/opt_coverage_ratchet_per_module.yaml
                          at brief].
                        - The rows option records per test the
                          function executed and the lines and branches
                          reached, and has rules over the graph use
                          them
                          [_data/decision/dec_granularity_of_coverage/opt_coverage_rows_per_test_and_function.yaml
                          at brief].
                        - WTP asked that code coverage become part of
                          the graph [owner's statement, 2026-10-25].
                          Strength: moderate. The floor adds one
                          mechanism and the ratchet two, a store of
                          values and a comparison. The rows add a fact
                          kind, a slower coverage core and rules to
                          read them. WTP's wish to put coverage in the
                          graph is the real case for rows, and it
                          belongs to another concern. The count holds
                          at ten times the size.

