title:                  Coverage drop named by its module
brief:                  |
                        A ratchet per module says which module lost
                        coverage, as the term ratchets already say
                        which count rose. A suite floor says only that
                        the total fell, and September had to tune it
                        by hand in long comments.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_coverage_floor_is_one_number_and_one_flag
                          (term ratchets on dev).
                        - September's suite floor stood at 87 percent
                          branch coverage with 0.12 of a point of
                          headroom, about thirteen statements or
                          branch exits, and its level was argued over
                          in comments of pyproject.toml across several
                          measurements [origin/main:pyproject.toml at
                          the comment above tool.mypy].
                        - September noted that the floor says nothing
                          about whether a change carried its own
                          tests, and added diff-cover for changed
                          lines [origin/main:pyproject.toml at the
                          comment above tool.mypy].
                        - The tooling has about 70 python modules
                          outside the test folders [src/cctool, by
                          count of python files not under _test].
                        - Coverage rows per test needed 1543 contexts
                          and an 18 MB data file for about 500 tests
                          [measured by Claude in the cloud container,
                          2026-10-26]. Strength: Moderate. The ratchet
                          keeps one number per module, about 70 today,
                          and a failure points at one part. The floor
                          is one number but a failure points nowhere,
                          and its level needs judgment each time it
                          moves. Rows per test hold far more data, and
                          the rules over them are new code to keep. At
                          ten times the modules the ratchet holds ten
                          times the numbers, which is still small,
                          while rows per test grow with tests times
                          functions.

