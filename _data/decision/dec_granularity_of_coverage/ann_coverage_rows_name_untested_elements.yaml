title:                  Coverage rows that name the element
brief:                  |
                        Rows per test and function let rules name each
                        function that no test reaches. They also let
                        rules name each realizing function that no
                        test verifying its member reaches. A suite
                        percentage or a module ratchet cannot name the
                        element. Coverage shows reach and not
                        verification.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_coverage_floor_is_one_number_and_one_flag
                          (what the rows option records).
                        - The floor option reduces coverage to one
                          percentage for the suite
                          [_data/decision/dec_granularity_of_coverage/opt_coverage_floor_for_the_suite.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_coverage_floor_is_one_number_and_one_flag
                          (the ratchet option per module).
                        - Code names the interface member it realizes
                          by relation_realizes in its function item
                          [_data/decision/dec_interface_implementation_link/ruling_interface_implementation_link.yaml
                          at brief].
                        - September rejected inferring verification
                          from coverage, because a line executed is
                          not a requirement observed
                          [origin/main:ddr/ddr_verification_evidence.yaml
                          at alternative].
                        - Also rests on a source stated once in
                          ann_suite_floor_is_deterministic_and_cheap
                          (282 contexts on the default core).
                          Strength: Strong for tracing code to the
                          tests that reach it, and it holds at ten
                          times the size, where a percentage hides
                          more. Weak as a trace to needs, since reach
                          is not verification.

