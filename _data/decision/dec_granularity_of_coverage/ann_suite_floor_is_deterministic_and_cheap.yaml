title:                  Deterministic floor against fragile rows
brief:                  |
                        A suite floor is measured on the cheap core,
                        repeated exactly in two runs on one commit,
                        and adds about 6 per cent to the run. Rows per
                        test and function need the C tracer, which
                        changed the outcome of two tests and took 2.6
                        times as long. Gating on the floor keeps the
                        gate working while rows are still unproven.
description:            |
                        Sources:
                        - Two runs of branch coverage on one commit
                          agreed exactly, at 87.12 per cent, and three
                          later gate runs gave 88.03, 88.07 and 88.08
                          per cent [origin/main:pyproject.toml at the
                          comment on the coverage floor].
                        - Also rests on a source stated once in
                          ann_per_test_rows_need_the_slow_tracer_core
                          (221 s against 209 s).
                        - Per-test contexts on the sys.monitoring core
                          recorded 282 contexts for about 500 tests,
                          and on the C tracer core took 534 s and made
                          two passing tests fail [measured by Claude
                          in the cloud container, 2026-10-26].
                        - Also rests on a source stated once in
                          ann_per_test_rows_need_the_slow_tracer_core
                          (Python 3.13 and atlas on 3.15).
                        - The rows option gates no work on a
                          percentage and leaves the rules to use the
                          rows
                          [_data/decision/dec_granularity_of_coverage/opt_coverage_rows_per_test_and_function.yaml
                          at brief].
                        - Also rests on a source stated once in
                          ann_module_ratchet_says_where_coverage_fell
                          (0.12 of a point of headroom). Strength:
                          strong for what gates the work. It holds at
                          ten times the size, since the floor's cost
                          stays a fixed fraction. It does not argue
                          against recording rows overnight for rules
                          that only advise.

