title:                  Coverage judged per change, not per suite
brief:                  |
                        To judge a change, a reviewer needs to know
                        whether the lines it touched are tested. A
                        suite floor cannot say, and September added
                        changed line coverage for that reason. Rows
                        per test and function can answer it for the
                        functions a change touched, as long as the
                        rows stay out of the diff.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_module_ratchet_says_where_coverage_fell
                          (the 87 per cent floor and its room).
                        - Also rests on a source stated once in
                          ann_module_ratchet_says_where_coverage_fell
                          (the floor says nothing about a change).
                        - Also rests on a source stated once in
                          ann_coverage_floor_is_one_number_and_one_flag
                          (what the rows option records).
                        - Also rests on a source stated once in
                          ann_per_test_rows_need_the_slow_tracer_core
                          (an 18 MB data file).
                        - ASSUMPTION: the ratchet option keeps its
                          last recorded value per module in a
                          committed file, so a change that moves
                          coverage also changes that file. Strength:
                          Moderate. The floor fails the reviewer at
                          any size, and at ten times the size its room
                          hides more. The rows option helps review
                          only if its data stays out of commits, which
                          depends on dec_home_of_observed_evidence.

