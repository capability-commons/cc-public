title:                  Coverage per module checked against its declared maturity
brief:                  |
                        Coverage is recorded per module and checked
                        against what the module's declared maturity
                        requires, with no ratchet; the check of a
                        release's declared maturity holds the level
                        up. A coverage ratchet per module, a coverage
                        floor for the suite, and coverage rows per
                        test and function are rejected. Ruled by WTP
                        on 2026-10-28.

