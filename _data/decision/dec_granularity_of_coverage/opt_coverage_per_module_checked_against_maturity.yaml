title:                  Coverage per module checked against its declared maturity
brief:                  |
                        Coverage is recorded per module and checked
                        against the coverage that the module's
                        declared maturity requires. Nothing is kept
                        from one run to compare with the next: the
                        check of the maturity a release declares is
                        what holds the level up.

