title:                  Faults inside wrapped third-party code at settings no graph binds
brief:                  |
                        A node type that wraps a library, such as an
                        inference runtime or a camera SDK, passes some
                        settings straight into it. Fed raw bytes, its
                        harness reports faults deep inside that
                        library for values no graph can bind, which
                        the project cannot fix and must triage by
                        hand, and which bury the faults in the
                        wrapper's own checks. Within a declared range
                        the harness reaches the library only with
                        values a graph could send, so what it finds is
                        either the wrapper's fault or a vendor fault
                        that matters. Raw bytes keep one real use
                        there: they show whether the wrapper validates
                        what it passes on.
description:            |
                        Sources:
                        - A raw-bytes harness reports a fault even
                          where no graph could
                          bind the value.
                          (_data/decision/dec_settings_a_fuzz_harness_varies/opt_harness_varies_settings_as_raw_bytes.yaml
                          at brief)
                        - The engine is a new C++ engine targeting
                          embedded reach, and
                          Patrol, on an NVIDIA Orin, is its first user (WTP, 2026-10-28).
                        - Dependency risk asks what the design takes
                          from third parties.
                          (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question)
                        ASSUMPTION: Patrol will have node types that
                        wrap third-party libraries, such as an
                        inference runtime on the Orin's GPU, and pass
                        settings such as a model path, a batch size or
                        a thread count into them. Strength: weak; it
                        rests on how many node types wrap libraries,
                        and on whether their settings reach the
                        library unchecked.

