title:                  Faults reported in correct nodes from raw setting bytes
brief:                  |
                        Fed settings as raw bytes, the trial's
                        harnesses reported faults that were not the
                        nodes'. The burst harness hung on a node the
                        review judged correct, because its item count
                        came from the fuzzer as a 64-bit integer, and
                        the second accumulator tripped the
                        undefined-behavior sanitizer on a bool that
                        the harness itself filled with 232, a fault
                        the review put on the harness. The harness
                        case expects no crash in a correct node, so
                        raw bytes can fail it on a correct node, and a
                        hung harness spends the gate's time on one
                        input. Holding settings at bound values, or
                        within a declared range and kind, removes
                        both, and the same driver varied the inputs
                        well.
description:            |
                        Sources:
                        - The generated harness took the settings from
                          the fuzzer's bytes
                          with no regard to type, default or binding (trial 2c777ab9,
                          src/cctool/dataflow/generate.py, the fuzz harness template and
                          its take function).
                        - The burst harness hung, completing one run
                          in 60 seconds,
                          because count came from fuzz bytes; the second accumulator's
                          harness gave a UBSan load of value 232 for a bool, a fault the
                          harness made; the plain driver fed input counts from 0 to 8
                          evenly (review of 2026-10-29, CC-022; area report trial-gen,
                          TRIAL-GEN-07).
                        - The harness runs under a fuzzer and reports
                          no crash in a
                          correct node.
                          (_data/test_case/case_generator_fuzz_harness.yaml at
                          expected_results)
                        - A gate stage that runs past 600 s is stopped
                          and fails
                          (src/cctool/gate/gate.py within SECONDS_STAGE).
                        - Throughput is one measure of performance
                          efficiency.
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure)
                        Strength: strong for settings whose type has
                        invalid bit patterns or that size a loop; weak
                        for a plain numeric setting that the node
                        checks itself.

