title:                  Settings a fuzz harness varies
brief:                  |
                        A fuzz harness for one node type varies its
                        inputs. Does it also vary the node's settings,
                        and if so within which bounds?
description:            |
                        dec_fuzzing_of_a_single_node is ruled. In the
                        trial implementation of 2026-10-29 the
                        harnesses fed settings as raw bytes, so they
                        reported faults for settings that no graph can
                        bind, and the harness for the standard mode
                        controller never linked (review of 2026-10-29,
                        CC-022).

