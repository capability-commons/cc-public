title:                  A range to declare for every setting of every node type
brief:                  |
                        The interface schema gives a setting a type,
                        an optional flag and a default, and no range,
                        and neither the trial's node types nor its
                        dictionary declare one. Varying settings
                        within declared ranges therefore needs a new
                        field, and a value in it for each setting of
                        each node type, kept in step with the code
                        that reads the setting, which is the kind of
                        burden on node authors WTP wants kept small.
                        Holding settings at bound values needs no new
                        declaration. A default softens the cost:
                        decode by type alone, a bool from one bit and
                        an enumeration from its members, and read a
                        missing range as the whole of the type.
description:            |
                        Sources:
                        - A setting has a type, whether a
                          configuration may leave it out,
                          and a default.
                          (_data/schema/sch_interface_control_document.yaml at
                          $defs.setting)
                        - No node type or dictionary entry of the
                          trial declares a range
                          (trial 2c777ab9, src/cctool/dataflow/standard/,
                          src/cctool/dataflow/_test/_example/node_kind/ and
                          src/cctool/dataflow/_test/_example/data_dictionary/).
                        - WTP wants the approach as simple as
                          feasible, avoiding clever
                          mechanisms that burden node authors (WTP, 2026-10-28).
                        - The review's smallest correction decodes a
                          bool from one bit,
                          and clamps integers to a range for each setting or fixes them
                          at their defaults where they are bound at build (review of
                          2026-10-29, area report trial-gen, TRIAL-GEN-07).
                        - BPDF asks the programmer to state a maximal
                          value for each
                          integer parameter of its rates, so declared bounds are a known
                          cost in parametric dataflow (Bebelis et al. 2013, BPDF, section
                          2.2, as noted in round 2).
                        - Maintainability is measured by the time to
                          make a
                          representative change.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure)
                        Strength: moderate; it falls if a range is
                        optional, with a typed default, and rises with
                        the number of node types written by others.

