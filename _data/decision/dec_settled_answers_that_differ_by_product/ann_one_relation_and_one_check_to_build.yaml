title:                  Build cost of one relation and one check over variants
brief:                  |
                        Beyond the dataflow variant type, which is
                        already committed, this option costs one
                        relation entry and one clingo check, with no
                        change to the ruling schema, the review
                        request, the pages or search. Its check cannot
                        be finished until the tooling can tell a
                        complete variant, an open decision.
description:            |
                        Sources:
                        - The edge needs a new relation, and a check
                          holds over complete dataflow variants.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief and description)
                        - Relations are register entries that carry
                          their constraints as edges, such as the
                          constraint that an upholds edge goes from a
                          ruling to an option.
                          (_data/register/reg_relation.yaml at
                          entries.relation_upholds.edge)
                        - The tools already show several upheld
                          options of one ruling.
                          (src/cctool/web/argument.py within
                          Graph.decision; src/cctool/web/page.py
                          within _settlement;
                          src/cctool/web/request.py within _rule)
                        - The variant type is ruled, and the earlier
                          argument noted its cost is already
                          committed.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          at brief;
                          _data/decision/dec_settled_answers_that_differ_by_product/ann_no_item_names_a_product_yet.yaml
                          at brief)
                        - Whether a variant is complete is open.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/dec_how_a_variant_is_known_abstract_or_superset.yaml
                          at brief)
                        - Assumption, the advocate's estimate and not
                          measured: about 1 to 3 person-days including
                          tests once the variant type exists, against
                          the earlier estimates of 3 to 5 for named
                          rulings and 5 to 8 for one ruling with
                          pairings.
                          (_data/decision/dec_settled_answers_that_differ_by_product/ann_option_product_pairing_outside_edge_form.yaml
                          at description) Strength: a one-time cost
                          that does not grow with member products; the
                          running cost is the variant edits that each
                          split of a decision needs, argued in the
                          annotation on a second upheld option.

