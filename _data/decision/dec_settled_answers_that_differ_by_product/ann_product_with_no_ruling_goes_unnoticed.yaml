title:                  New product with no answer, unnoticed by any check
brief:                  |
                        None of the three options that record a ruling
                        for each product's answer requires every
                        product of the family to have one. A new
                        product can be left with no answer to a
                        question ruled by product, or, with a decision
                        for each product, with no decision at all, and
                        no check says so.
description:            |
                        Sources:
                        - Neither the option with one ruling nor the
                          option with named rulings, as written,
                          requires every product of the family to be
                          covered.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_ruling_with_an_option_per_product.yaml
                          lines 13-18;
                          opt_ruling_names_the_products_it_holds_for.yaml
                          lines 13-19)
                        - With a decision for each product, a new
                          product needs a new decision.
                          (opt_one_decision_for_each_product.yaml
                          lines 12-17, same folder)
                        - No such check exists today. (assumption:
                          from reading the ruling checks in
                          src/cctool/check/check.lp lines 1341-1469
                          and 1607-1643)
                        - The framing study says the product line also
                          needs a check over all leaves.
                          (_sources/variants-framing.md line 67)
                          Strength: grows with the number of products,
                          but it is cheap to fix: one check for a
                          product of the family with no ruling on a
                          decision ruled by product.

