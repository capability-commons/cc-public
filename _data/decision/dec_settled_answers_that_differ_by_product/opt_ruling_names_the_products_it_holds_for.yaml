title:                  Ruling that names the member products it holds for
brief:                  |
                        A ruling may name the member products of a
                        variant family that it holds for, and a
                        decision may then have one ruling for each,
                        all argued from the one set of annotations on
                        the decision. At most one ruling names any
                        member product, and a ruling that names no
                        member product holds for every member product
                        that no other ruling names, so a family-wide
                        default can stand with overrides for some
                        member products.

