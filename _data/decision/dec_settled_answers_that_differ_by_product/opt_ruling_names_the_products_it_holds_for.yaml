title:                  Ruling that names the products it holds for
brief:                  |
                        A ruling may name the products of a variant
                        family that it holds for, and a decision may
                        then have one ruling for each product, all
                        argued from the one set of annotations on the
                        decision. At most one ruling holds for any
                        product, and a ruling that names no product
                        holds for every product, as rulings do today.

