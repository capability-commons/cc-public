title:                  New member product with no answer caught by the variant check
brief:                  |
                        A new member product, added as a complete
                        dataflow variant without an edge to an upheld
                        option, fails the check at once for each
                        decision whose ruling upholds more than one
                        option; as worded, no other option flags it,
                        though named rulings give it the family-wide
                        default where one stands. It is not caught
                        where a decision upholds only one option and
                        the new product needs another, and the check
                        cannot be written before the dataflow variant
                        type exists and the tooling can tell a
                        complete variant.
description:            |
                        Sources:
                        - A check holds that each complete dataflow
                          variant takes exactly one upheld option of
                          each decision whose ruling upholds more than
                          one.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief)
                        - The earlier argument found that none of the
                          three options that record a ruling for each
                          product's answer requires every product to
                          have one.
                          (_data/decision/dec_settled_answers_that_differ_by_product/ann_product_with_no_ruling_goes_unnoticed.yaml
                          at brief)
                        - The variant type is ruled but has no schema
                          or folder in _data yet.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          at brief; directory listing of _data/schema
                          in this snapshot)
                        - Whether a dataflow variant is abstract,
                          superset or complete is an open decision.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/dec_how_a_variant_is_known_abstract_or_superset.yaml
                          at brief)
                        - Functional suitability asks whether every
                          function that is needed is present.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question)
                          Strength: holds and grows with the number of
                          products, since every new product is checked
                          against every decision ruled by product. The
                          option does not say whether an edge on an
                          abstract variant holds for its descendants,
                          as the Orin draft is shared by three; until
                          it does, a leaf can be caught for an answer
                          its base already gives.

