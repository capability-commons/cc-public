title:                  Shared arguments copied into a decision for each product
brief:                  |
                        With one decision for each product, one
                        question becomes as many decisions as there
                        are products, nothing records that they ask
                        the same question, and an argument that bears
                        on every product must be written once in each,
                        because an annotation may not argue the
                        options of another decision. Keeping one
                        decision with one set of annotations, as the
                        two options with per-product rulings do,
                        writes each argument once and makes a new
                        product a small change.
description:            |
                        Sources:
                        - This option asks the question once for each
                          product, as a separate decision about that
                          product, each with its own options,
                          annotations and single ruling.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_decision_for_each_product.yaml at brief)
                        - The check on arguments across decisions
                          refuses an annotation whose supports or
                          challenges edge targets an item of another
                          decision. (src/cctool/check/check.lp within decision_about_non_component and argument_across_decisions)
                        - Everything argued about a decision goes in
                          the folder of that decision.
                          (src/cctool/check/check.lp within misplaced_module and misplaced_document)
                        - An option cannot be upheld while a driver of
                          its decision has not argued it, so under
                          this option that work is repeated for each
                          product's decision.
                          (src/cctool/commit/change.lp within unargued_driver)
                        - The owner asks for a mechanism that is
                          "simple and elegant" and avoids "a
                          proliferation of complication". (owner's
                          statement, 2026-10-25T05:45Z,
                          _sources/owner-2026-10-25-morning.md line 5)
                        - The option with one ruling keeps one
                          decision and one ruling, and the option with
                          named rulings argues every product's ruling
                          from the one set of annotations on the
                          decision, and, as that option is worded, a
                          ruling may name more than one product, so
                          products that share an answer can share one
                          ruling.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_ruling_with_an_option_per_product.yaml at brief;
                          opt_ruling_names_the_products_it_holds_for.yaml)
                        - Each option and annotation is its own YAML
                          file of about twenty to thirty lines. (for
                          example
                          _data/decision/dec_settled_answers_that_differ_by_product/opt_one_decision_for_each_product.yaml,
                          24 lines)
                        - In value-based argumentation, audiences
                          differ only in how they order values, and
                          the same set of arguments can be accepted by
                          one audience and rejected by another; a
                          product behaves like an audience. (T. J. M.
                          Bench-Capon, "Persuasion in Practical
                          Argument Using Value-based Argumentation
                          Frameworks", Journal of Logic and
                          Computation 13(3), 2003, pages 429-448, doi
                          10.1093/logcom/13.3.429, author's copy at
                          https://cgi.csc.liv.ac.uk/~tbc/publications/jcl03.pdf,
                          Section 5 and the two-audience example of
                          Section 6;
                          _data/decision/dec_settled_answers_that_differ_by_product/dec_settled_answers_that_differ_by_product.yaml at description)
                        - None of the 36 relations in the relation
                          register marks two decisions as posing the
                          same question for different products.
                          (_data/register/reg_relation.yaml, every
                          entry) Strength: grows with scale. At ten
                          times the products there are ten times the
                          copies of each shared argument, which can
                          drift apart with no check to notice, and one
                          correction to a shared argument is a change
                          for each product. In this option's favor,
                          each single decision stays as small to read
                          as today.

