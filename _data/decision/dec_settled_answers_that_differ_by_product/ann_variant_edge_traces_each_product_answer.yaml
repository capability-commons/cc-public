title:                  Edge from each member product's variant to the answer it takes
brief:                  |
                        Each complete dataflow variant names the
                        upheld option it takes, so the difference a
                        member product carries can be followed from
                        the variant to the option and its arguments,
                        and back from the option to every member
                        product that takes it. The earlier argument
                        against keeping the difference only in variant
                        operations said it would weaken if variants
                        gained an edge to the options they take, and
                        this option adds that edge.
description:            |
                        Sources:
                        - Each dataflow variant has an edge to the
                          upheld option it takes, and a check holds
                          that each complete dataflow variant takes
                          exactly one upheld option of each decision
                          whose ruling upholds more than one.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief)
                        - The argument that a settled member product
                          answer
                          has no ruling behind it under variant
                          operations alone ends: "It would weaken if
                          variants later gained an edge to the options they take."
                          (_data/decision/dec_settled_answers_that_differ_by_product/ann_settled_product_answer_with_no_ruling.yaml
                          at description)
                        - Traceability counts elements with no traced
                          reason and needs with nothing that meets
                          them. (_data/register/reg_concern.yaml at
                          entries.concern_traceability.measure)
                        - The Patrol variant drafts already carry a
                          relation list on each variant, empty today.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml,
                          its relation field)
                        - The edge is an ordinary edge, so the impact
                          of a change follows it like any other link.
                          (src/cctool/commit/impact.lp within link)
                          Strength: holds and grows at ten times the
                          member products, since each member product's answer stays
                          one edge that names its reason. It traces
                          which answer a member product takes, not why that
                          member product takes it; see the annotation on one
                          brief for every member product's answer. The edge
                          states the answer; nothing checks it against
                          the variant operations that bring it about.

