title:                  Upheld alternatives that read as holding together
brief:                  |
                        An upholds edge says an option holds, and the
                        options of a decision are its alternatives, so
                        a ruling that upholds two of them reads as
                        both holding at once. Nothing on the decision
                        or ruling says the decision is ruled by
                        product, and which product takes which option
                        is shown only in variant files, which no
                        review page lists. The two options that name
                        products in the ruling show that pairing where
                        the reviewer reads the ruling.
description:            |
                        Sources:
                        - "The ruling identified by SOURCE settles
                          that the option identified by TARGET holds".
                          (_data/register/reg_relation.yaml at
                          entries.relation_upholds.description)
                        - "The options for a decision are its
                          alternatives." (src/cctool/check/check.lp
                          within option_count)
                        - The decision list and the rulings panel show
                          every upheld option with no product.
                          (src/cctool/web/page.py within _settlement
                          and _rulings)
                        - Under this option the only mark of a
                          decision ruled by product is that its ruling
                          upholds more than one option.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief)
                        - The one-ruling option pairs each upheld
                          option with its member products in a field
                          of the ruling, and named rulings name their
                          member products.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_ruling_with_an_option_per_product.yaml
                          at brief;
                          opt_ruling_names_the_products_it_holds_for.yaml,
                          same folder)
                        - Reviewability asks whether a person can read
                          a change in full and judge it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reviewability.question)
                          Strength: moderate and fixed in size. A
                          brief that says the decision is ruled by
                          product, or a page that lists the variants
                          that take each option, would answer most of
                          it.

