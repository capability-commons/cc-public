title:                  Absent edge from a variant to an option infers nothing
brief:                  |
                        The edge from a dataflow variant to the upheld
                        option it takes is optional. Where it is
                        present, the option is there and is upheld.
                        Where it is absent, nothing is inferred, other
                        than that the dataflow variant has not yet
                        been argued against that decision, or does not
                        need to be. So a replay variant or an
                        experiment on an open decision need take no
                        answer, and no check has to tell a member
                        member product from other complete dataflow
                        variants.
description:            |
                        Source: WTP's answer to this argument when
                        upholding the option (WTP, 2026-10-25).

