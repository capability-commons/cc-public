title:                  Second link between a variant and an option
brief:                  |
                        The open decision on how a variant relates to
                        an option it is used to try weighs a relation
                        from an option to the variants that try it;
                        this option adds a relation from a variant to
                        the upheld option it takes. If both are
                        upheld, two relations join the same two types
                        in opposite directions, told apart by whether
                        the option is open or upheld, and a variant
                        that tried an option later upheld must move
                        from one to the other.
description:            |
                        Sources:
                        - The edge needs a new relation from a
                          dataflow variant to an option.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at description)
                        - The open decision asks how a dataflow
                          variant relates to the option it is used to
                          try, and two of its options add a relation
                          from an option to the variants that try it.
                          (_data/decision/dec_variant_and_option/dec_variant_and_option.yaml
                          at brief;
                          _data/decision/dec_variant_and_option/opt_option_tried_by_variant_relation.yaml
                          at brief;
                          opt_option_tried_by_variant_with_comparability_check.yaml,
                          same folder)
                        - An argument on that decision already holds
                          that some variants are member products that try no
                          single option.
                          (_data/decision/dec_variant_and_option/ann_variant_option_products_try_no_single_option.yaml
                          at brief)
                        - The framing study separates variation that
                          is open and bound later from variation that
                          is settled and plural.
                          (_sources/variants-framing.md, section 1,
                          the addition of 2026-10-25)
                        - Simplicity asks whether the design does
                          anything another mechanism already does.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.question)
                          Strength: modest. The jobs differ, trying an
                          open option against taking a settled one, so
                          this is not one job done twice, but a reader
                          must learn two links between the same types.
                          It vanishes if the other decision upholds
                          citing variants in annotations, and could
                          shrink if both decisions shared one relation
                          whose meaning follows the option's standing,
                          at the cost of an edge whose meaning changes
                          when a ruling does.

