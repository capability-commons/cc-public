title:                  Every product's answer read in one file
brief:                  |
                        One ruling for the family lets a reviewer read
                        every product's answer in one file, as the
                        earlier argument for editing a ruling in place
                        valued. Rulings that name their products
                        spread the family's answers over several
                        files, so a family-wide reading needs a
                        derived view that is not built today.
description:            |
                        Sources:
                        - A reviewer reads the single ruling of a
                          decision and need not work out which of
                          several governs, and a change of ruling
                          shows as a diff of that file.
                          (_data/decision/dec_change_of_a_ruling/ann_one_file_shows_the_ruling.yaml
                          lines 11-16)
                        - The option with one ruling says one file
                          shows how the whole family answers the
                          decision.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_ruling_with_an_option_per_product.yaml
                          lines 13-18)
                        - Under named rulings at most one ruling holds
                          for any product, which keeps the question of
                          which ruling governs answerable for each
                          product, though not by reading one file.
                          (opt_ruling_names_the_products_it_holds_for.yaml
                          lines 17-19, same folder)
                        - Assumption: no page today lists a decision's
                          rulings product by product. Strength: at ten
                          times the products, the one file grows long
                          while each diff stays small, and named
                          rulings mean ten times the ruling files. Not
                          decisive alone.

