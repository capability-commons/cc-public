title:                  Existing mechanisms only, with no new relation, field or check
brief:                  |
                        Keeping the difference in variant operations
                        uses only mechanisms already ruled, one ruling
                        for each decision and variants as a base plus
                        operations, and adds no relation, field or
                        check. A decision for each member product also
                        leaves the rules unchanged, though it does one
                        job many times.
description:            |
                        Sources:
                        - A variant holds a base and an ordered list
                          of operations.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - The check on competing rulings allows at
                          most one ruling for each decision.
                          (src/cctool/check/check.lp within competing_rulings)
                        - The option with a decision for each member
                          product
                          keeps the rules for rulings as they are.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_decision_for_each_product.yaml at brief)
                        - The simplicity concern counts distinct
                          mechanisms the design introduces and jobs
                          done by more than one mechanism.
                          (_data/register/reg_concern.yaml, the
                          simplicity entry, measure) Strength: holds
                          at any scale, since nothing is added that
                          grows. Whether variant operations alone do
                          the job is a separate question.

