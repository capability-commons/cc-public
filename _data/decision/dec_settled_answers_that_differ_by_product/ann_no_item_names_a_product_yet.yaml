title:                  No item yet that names a product
brief:                  |
                        Both options that settle a decision
                        differently by product must name a product,
                        and nothing in the repository can be named
                        that way yet: the dataflow variant type is
                        ruled but has no schema or folder, and the
                        framing study advises against calling one
                        resolved variant a product. Either option
                        first needs that item and a rule for what it
                        is.
description:            |
                        Sources:
                        - The folders of _data are annotation,
                          dataflow_graph, decision, external_class,
                          external_document, external_relation,
                          interface_control_document,
                          logical_component, register, release,
                          requirement, schema and segment; none holds
                          variants or products. (directory listing of
                          _data in this snapshot)
                        - The variant type is ruled, and its ruling
                          says it is worth thought before it is built.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 13-23)
                        - The framing study advises: "Avoid product
                          for one resolved variant".
                          (_sources/variants-framing.md line 43)
                        - A product could be a leaf variant or an
                          abstract variant shared by several leaves,
                          as the Orin variant is by three.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 26-34)
                        - The option that keeps the difference in
                          variant operations depends on the same
                          variant type, but that cost is already
                          committed by the variant ruling. (same
                          ruling, lines 13-18) Strength: holds at any
                          scale; it is paid once, but the choice of
                          what a product is shapes every later
                          decision ruled by product.

