title:                  Each variant names the upheld option it takes
brief:                  |
                        The decision keeps its one ruling, which
                        upholds every option that some member product
                        uses. Each dataflow variant has an edge to the
                        upheld option it takes, and a check holds that
                        each complete dataflow variant takes exactly
                        one upheld option of each decision whose
                        ruling upholds more than one. The dataflow
                        variant stands for the product, so no product
                        item and no product field on a ruling is
                        needed.
description:            |
                        Proposed by both advocates on this decision,
                        after the decision model of the DOPLER
                        approach, in which each product is derived by
                        answering the decisions of a variability model
                        (_sources/survey/product-lines.md). The ruling
                        schema already lets one ruling uphold several
                        options (_data/schema/sch_ruling.yaml), and no
                        check limits a ruling to one upheld option.
                        WTP asked for it to be an option that can be
                        upheld (WTP, 2026-10-25). The edge needs a new
                        relation from a dataflow variant to an option.

