title:                  Each variant names the upheld option it takes
brief:                  |
                        The decision keeps its one ruling, which
                        upholds every option that some member product
                        uses. A dataflow variant may have an edge to
                        the upheld option it takes. Where the edge is
                        present, its target is an upheld option, and a
                        dataflow variant takes at most one option of
                        each decision. Where it is absent, nothing is
                        inferred, other than that the dataflow variant
                        has not yet been argued against that decision,
                        or needs no argument. The dataflow variant
                        stands for the product, so no product item and
                        no product field on a ruling is needed.
description:            |
                        Proposed by both advocates on this decision,
                        after the decision model of the DOPLER
                        approach, in which each product is derived by
                        answering the decisions of a variability model
                        (_sources/survey/product-lines.md). The ruling
                        schema already lets one ruling uphold several
                        options (_data/schema/sch_ruling.yaml), and no
                        check limits a ruling to one upheld option.
                        WTP asked for it to be an option that can be
                        upheld (WTP, 2026-10-25). When upholding it,
                        WTP made the edge optional: where it is
                        present the option is there and upheld, and
                        where it is absent nothing is inferred (WTP,
                        2026-10-25). The edge is
                        relation_takes_option.

