title:                  Own brief and history for each product's answer
brief:                  |
                        A ruling that names its products gives each
                        product's answer its own brief and its own
                        commit history, so the reason for one
                        product's answer, and who ruled it and when,
                        can be read directly. Under one ruling for the
                        family, the history of one product's answer is
                        mixed into the history of the whole file.
description:            |
                        Sources:
                        - Who made a ruling, and when, is recorded by
                          the commits that add and change it, not by a
                          field, and a ruling's brief states what was
                          ruled. (_data/schema/sch_ruling.yaml lines
                          23-35)
                        - A change of ruling edits the ruling in
                          place, and git keeps its history.
                          (_data/decision/dec_change_of_a_ruling/ruling_change_of_a_ruling.yaml
                          lines 13-19)
                        - Named rulings allow one ruling for each
                          product, all argued from the one set of
                          annotations.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_ruling_names_the_products_it_holds_for.yaml
                          lines 13-19)
                        - Under one ruling, a change of answer for one
                          product is an edit of that one file.
                          (opt_one_ruling_with_an_option_per_product.yaml
                          lines 13-18, same folder)
                        - In value-based argumentation an audience is
                          a preference ordering on values; an argument
                          acceptable to some audience is subjectively
                          acceptable, and to every audience
                          objectively acceptable. A per-product brief
                          is where one audience's ordering can be
                          stated. (T. J. M. Bench-Capon, Journal of
                          Logic and Computation 13(3), 2003, pages
                          429-448, doi 10.1093/logcom/13.3.429,
                          Definition 5.2 and Section 6, Definitions
                          6.1 and 6.2; author's copy at
                          https://cgi.csc.liv.ac.uk/~tbc/publications/jcl03.pdf)
                          Strength: holds and strengthens at ten times
                          the products, since one file then mixes ten
                          histories.

