title:                  Difference held only in the variant operations
brief:                  |
                        The decision graph records only the shared
                        decision, such as designing the software once
                        and adapting it to each variant, and the
                        difference between member products lives only
                        in the operations of each dataflow variant.
                        The question for each member product is not
                        raised as a decision, and has no ruling.

