title:                  Settled member product answer with no ruling behind it
brief:                  |
                        When the difference between member products
                        lives only in variant operations, nothing in
                        the decision graph says that each member
                        product's answer is settled, or why. An
                        operation that drops a node for one member
                        product points at no ruling, so its reason is
                        at best a comment, and a reviewer cannot tell
                        a deliberate difference from a slip or from an
                        open choice a variant is trying out.
description:            |
                        Sources:
                        - This option records only the shared
                          decision, and the difference lives only in
                          the operations of each dataflow variant,
                          with no ruling for each member product.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_difference_held_only_in_variant_operations.yaml at brief)
                        - The owner calls each member product's answer
                          settled: "we effectively have two settled
                          outcomes to the question of how many
                          cameras", and "We will definitely need some
                          sort of mechanism". (owner's statement,
                          2026-10-25,
                          _sources/owner-2026-10-25-morning.md line 5)
                        - The framing study separates variation that
                          is open and bound later from variation that
                          is settled and plural.
                          (_sources/variants-framing.md lines 20-22)
                        - A variant holds a base and an ordered list
                          of operations; the operations are entries of
                          the variant, not items with edges of their
                          own.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief)
                        - In the Patrol drafts the reason for the
                          Legion variant's filter is a YAML comment,
                          and the relation list of both the Legion and
                          the Orin variant is empty.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 21-27;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          lines 23-24 and 34)
                        - The same drafts use the same filter
                          operation for settled differences, such as
                          which decoder a host has, and for
                          experiments: headless output is undecided
                          and variants are documented experiments.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 6-9 and 26-34)
                        - A presence tag filter removes the nodes that
                          carry the presence tag, with their edges, so
                          one list entry can remove several
                          nodes.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_legion.yaml
                          lines 21-25)
                        - The drafts already disagree on a presence
                          tag's
                          spelling, display_local in one note and
                          local_display in the base, which a reader of
                          the filter alone would not catch.
                          (_sources/variants-framing.md line 67;
                          _sources/cc-patrol-notes/variants.md line
                          107;
                          _sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          line 100)
                        - Assumption: some settled differences, such
                          as whether a rear camera is fitted, are
                          facts about hardware or the bill of
                          materials as well as about the dataflow, and
                          an operation records only their effect on
                          the graph.
                        - Assumption: a reason not recorded when it is
                          decided costs more to rebuild later than to
                          write down at the time. Strength: holds and
                          grows at ten times the member products, since each
                          member product adds operations whose reasons are
                          not traced. It would weaken if variants
                          later gained an edge to the options they take.

