title:                  Second upheld option that must edit every member product's variant
brief:                  |
                        When a decision first gets a second upheld
                        option, the check fails for every complete
                        dataflow variant of the family until each
                        names the option it takes, so a change of
                        answer for one member product becomes an edit
                        of every member product's variant in one
                        commit. Under named rulings the same change is
                        one new ruling that overrides the default for
                        that member product.
description:            |
                        Sources:
                        - The check holds only for decisions whose
                          ruling upholds more than one option, and
                          then for each complete dataflow variant.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief)
                        - A ruling that names no member product holds
                          for every member product that no other
                          ruling names, so a family-wide default can
                          stand with overrides.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_ruling_names_the_products_it_holds_for.yaml
                          at brief)
                        - Reviewability measures the size of a change,
                          in lines; cost counts development effort.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reviewability.measure and
                          entries.concern_cost.measure) Strength:
                          grows with the number of member products, one short
                          edge for each variant, each easy to judge;
                          it is paid once for each decision that
                          splits. It would shrink if a variant with no
                          edge were taken to keep a default option, at
                          the cost of a rule the option does not
                          state.

