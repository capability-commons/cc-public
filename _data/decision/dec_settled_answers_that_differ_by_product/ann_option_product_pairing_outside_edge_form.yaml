title:                  Pairing of option and products that no edge can carry
brief:                  |
                        A single ruling that pairs each upheld option
                        with products needs a structure the ruling
                        cannot hold today: an edge has only its
                        relation and target, and a ruling carries
                        nothing beyond its descriptive fields and
                        edges. So the pairing needs a new ruling field
                        that restates what its edges say, or an
                        extension of the edge form every item shares,
                        and every reader of the upholds edge must
                        learn it. Rulings that name their products
                        need only one ordinary new edge and keep
                        today's ruling shape.
description:            |
                        Sources:
                        - An edge has exactly id_relation,
                          guid_relation, id_target and guid_target,
                          with no additional properties allowed.
                          (_data/schema/sch_trait_edge.yaml at $defs.edge.properties)
                        - A ruling carries nothing beyond the
                          standalone fields and its edges, which
                          options it upholds or rejects are edges, not
                          fields, and no unevaluated property is
                          allowed. (_data/schema/sch_ruling.yaml at description and unevaluatedProperties)
                        - This option has one ruling uphold several
                          options, each paired with the products it
                          holds for.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_one_ruling_with_an_option_per_product.yaml at brief)
                        - The upholds edge is read in derive.lp,
                          text.py, argument.py,
                          src/cctool/web/page.py within _decisions_of
                          and _rulings, request.py,
                          change.lp, advise.lp and check.lp, all under
                          src/cctool. (grep of the upholds relation in
                          src/cctool, tests excluded)
                        - A ruling may not both uphold and reject one
                          option. (src/cctool/check/check.lp) This bears only if the single
                          ruling also records that an option is
                          rejected for the other products; a ruling
                          that only upholds an option for each product
                          does not trip it, and no check limits a
                          ruling to one upheld option.
                        - All 134 rulings in this snapshot uphold
                          exactly one option. (count of
                          _data/decision/*/ruling_*.yaml with a grep
                          for the upholds relation in each)
                        - The option with named rulings adds one
                          relation from a ruling to the products it
                          holds for, and changes the
                          at-most-one-ruling check from each decision
                          to each product.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_ruling_names_the_products_it_holds_for.yaml at brief; src/cctool/check/check.lp)
                        - Assumption, the advocate's estimate and not
                          measured: named rulings take about 3 to 5
                          person-days including tests, one ruling with
                          pairings about 5 to 8, because every reader
                          of the upholds edge changes. Strength: holds
                          at ten times the products. The added parts
                          of named rulings stay fixed in number; the
                          paired structure of one ruling gets longer
                          with every product, though it stays one
                          mechanism.

