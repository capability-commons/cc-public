title:                  Complete variants that are not member products held to take an answer
brief:                  |
                        The check runs over every complete dataflow
                        variant, but not every complete variant is a
                        member product: of the five runnable Patrol
                        drafts, one is a replay variant and three are
                        experiments on an undecided output mode. So
                        either every simulation and test variant must
                        also take an answer, or the check needs a way
                        to tell a member product from other complete
                        variants, which the option says is not needed.
description:            |
                        Sources:
                        - The check holds that each complete dataflow
                          variant takes exactly one upheld option of
                          each decision whose ruling upholds more than
                          one, and the dataflow variant stands for the
                          member product, so no member product item is needed.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief)
                        - A product is a member product represented by
                          one complete dataflow variant.
                          (_data/decision/dec_settled_answers_that_differ_by_product/dec_settled_answers_that_differ_by_product.yaml
                          at description)
                        - The Patrol drafts have five runnable
                          variants, Legion, three Orin leaves and a
                          replay variant; headless output is undecided
                          between three modes, and variants are meant
                          as documented experiments.
                          (_sources/cc-patrol-notes/draft/README.md,
                          the opening notes of draft v2 and the Files
                          section)
                        - The replay variant is a simulation variant
                          that swaps the camera for a clip reader.
                          (_sources/variants-framing.md, section 3,
                          Simulation variants for simulation-backed
                          decisions)
                        - Functional suitability asks whether the
                          design does anything it should not.
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question)
                          Simplicity counts distinct mechanisms the
                          design introduces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure)
                          Strength: moderate. Making a replay variant
                          take an answer may be right, since it
                          replays one member product's sensors, but an
                          experiment on an open decision has no
                          settled answer to take. Grows with the share
                          of simulation and test variants.

