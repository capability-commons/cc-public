title:                  Settled answers that differ by member product
brief:                  |
                        How is a decision recorded when it is settled
                        with a different answer for each member
                        product of a variant family, because the
                        answers cannot coexist in one system?
description:            |
                        Source: the owner's comment of
                        2026-10-25T05:45Z on the framing study. A
                        variant is not only the record of how open
                        decisions were bound for one system: it can
                        also reflect "settled decisions that are not
                        mutually compatible within one system
                        configuration". His example is an autonomous
                        platform with a high-end variant that has
                        forward and rear cameras and a cost-optimized
                        variant that has only a forward camera, so "we
                        effectively have two settled outcomes to the
                        question of 'how many cameras'", while the
                        software is designed and validated once and
                        adapted to both. He asks for a mechanism that
                        is "simple and elegant" and avoids "a
                        proliferation of complication", and notes that
                        how such decisions are allocated to logical
                        components is still to be determined. Today
                        the check competing_rulings allows at most one
                        ruling per decision. In value-based
                        argumentation (Bench-Capon 2003) an audience
                        is one ordering of values, and the same
                        arguments can be accepted by one audience and
                        rejected by another; a member product of the
                        family behaves like an audience. Here a member
                        product is a member product of the variant
                        family, represented by one complete dataflow
                        variant; an abstract or superset dataflow
                        variant, such as the Orin variant with its
                        three descendants, is not a member product
                        (WTP, 2026-10-25).

