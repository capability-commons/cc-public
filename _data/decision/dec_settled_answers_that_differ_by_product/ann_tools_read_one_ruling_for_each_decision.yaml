title:                  Tools that read one ruling and one standing for each option
brief:                  |
                        The web pages, the review requests and the
                        search assume one ruling for each decision and
                        one standing for each option, so until they
                        take a product into account they would show a
                        wrong answer for some products under either
                        option that settles a decision differently by
                        product. The option with a decision for each
                        product and the option that keeps the
                        difference in variant operations work with the
                        tools as they are and cost nothing to build.
description:            |
                        Sources:
                        - The review request takes the first ruling of
                          the decision as "the one ruling", a request
                          to rule always changes that ruling when
                          there is one, and a new ruling's id is made
                          from the decision's id alone, so a review
                          request cannot make a second ruling.
                          (src/cctool/web/request.py)
                        - To uphold or reject an option changes the
                          one ruling of the decision in place of what
                          it was before. (src/cctool/web/request.py; src/cctool/web/page.py within _controls)
                        - Each option gets one standing, open, upheld
                          or rejected, set from every ruling of the
                          decision. (src/cctool/web/argument.py within Graph.decision) Search derives one standing for
                          each option in the same way.
                          (src/cctool/graph/text.py)
                        - Under either per-product option, an option
                          upheld for one product and open or rejected
                          for another has no single correct standing.
                          (inference from the two option texts,
                          _data/decision/dec_settled_answers_that_differ_by_product/opt_one_ruling_with_an_option_per_product.yaml at brief and
                          opt_ruling_names_the_products_it_holds_for.yaml)
                        - The option with a decision for each product
                          keeps the rules for rulings as they are.
                          (opt_one_decision_for_each_product.yaml, same folder) Strength: does not
                          grow with scale. It is a one-time build
                          obligation that goes away once the tools
                          take a product into account.

