title:                  Each variant names the upheld option it takes
brief:                  |
                        A ruling on this decision may uphold several
                        options, each a viable path that a member
                        product may take, and a dataflow variant names
                        the upheld option it takes with
                        relation_takes_option. The edge is optional:
                        where it is present, the option is there and
                        is upheld; where it is absent, nothing is
                        inferred, other than that the dataflow variant
                        has not yet been argued against that decision,
                        or needs no argument. Ruled by WTP on
                        2026-10-25, with the edge made optional. WTP
                        noted that this changes the meaning of a
                        decision a little, since several upheld
                        options are each a viable path that variants
                        can point to as the reason they are as they
                        are, and asked for the concept register to be
                        made to match (WTP, 2026-10-25).

