title:                  One relation and one check, with no member product item or ruling field
brief:                  |
                        This option adds one relation from a dataflow
                        variant to an option and one check, and keeps
                        one ruling for each decision in today's shape,
                        since the ruling schema already lets one
                        ruling settle several options. The one-ruling
                        option adds a ruling field that every reader
                        of upholds must learn, and named rulings add a
                        relation and change the check on competing
                        rulings.
description:            |
                        Sources:
                        - The edge needs a new relation from a
                          dataflow variant to an option, and no
                          member product item and no member product field on a
                          ruling is needed.
                          (_data/decision/dec_settled_answers_that_differ_by_product/opt_variant_names_the_upheld_option_it_takes.yaml
                          at brief and description)
                        - Which options are upheld are edges, not
                          fields, "so that one ruling can settle a set
                          of alternatives at once".
                          (_data/schema/sch_ruling.yaml at
                          description)
                        - A decision has at most one ruling.
                          (src/cctool/check/check.lp within
                          competing_rulings)
                        - The earlier argument found the one-ruling
                          pairing needs a structure no edge can carry,
                          and named rulings one ordinary new edge and
                          a changed check.
                          (_data/decision/dec_settled_answers_that_differ_by_product/ann_option_product_pairing_outside_edge_form.yaml
                          at brief and description)
                        - Simplicity counts distinct mechanisms
                          introduced and asks whether a design follows
                          from decisions already made.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure and
                          entries.concern_simplicity.question)
                          Strength: holds at any scale, since the
                          added parts stay fixed in number. It depends
                          on the dataflow variant type, as every
                          option that names a member product does, and on the
                          check telling a member product from other
                          complete variants.

