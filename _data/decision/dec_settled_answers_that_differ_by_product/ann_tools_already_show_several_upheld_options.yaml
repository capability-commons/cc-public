title:                  Tools that already show every option a ruling upholds
brief:                  |
                        The decision page, the rulings panel, the
                        standing of each option, search and the review
                        request already handle one ruling that upholds
                        several options, and no check limits a ruling
                        to one. So this option shows a correct
                        family-wide answer, every option some member
                        product takes marked upheld, with no change to
                        the tools, though none of the 134 rulings has
                        used that path yet.
description:            |
                        Sources:
                        - Each option upheld by any ruling of the
                          decision gets the standing upheld.
                          (src/cctool/web/argument.py within
                          Graph.decision)
                        - The decision list shows the titles of every
                          upheld option, and the rulings panel lists
                          every option a ruling upholds.
                          (src/cctool/web/page.py within _settlement
                          and _rulings)
                        - Search lists every upheld option of a
                          decision. (src/cctool/graph/text.py within
                          SQL_FOUND)
                        - A request to uphold keeps the decision's one
                          ruling and the standing of the other
                          options, and its test leaves two options
                          upheld. (src/cctool/web/request.py within
                          _rule; src/cctool/web/_test/test_request.py
                          within
                          test_an_uphold_sent_changes_the_ruling_in_place)
                        - The impact of a commit follows links of
                          every relation alike.
                          (src/cctool/commit/impact.lp within link)
                        - No check limits the number of options a
                          ruling upholds; the ruling checks require at
                          least one settled option, no option both
                          upheld and rejected, and at most one ruling
                          per decision. (src/cctool/check/check.lp
                          within no_option_in_ruling,
                          upholds_and_rejects and competing_rulings)
                          The ruling schema keeps settled options as
                          edges "so that one ruling can settle a set
                          of alternatives at once".
                          (_data/schema/sch_ruling.yaml at
                          description)
                        - All 134 rulings in this snapshot uphold
                          exactly one option. (count of
                          _data/decision/*/ruling_*.yaml with a grep
                          for the upholds relation in each) Strength:
                          holds at any scale for showing which options
                          are upheld; it does not show which member product
                          takes which, which needs the variants. Since
                          no real ruling upholds two options yet, the
                          path is covered by one test only.

