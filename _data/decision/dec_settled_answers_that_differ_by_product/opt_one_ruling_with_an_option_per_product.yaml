title:                  One ruling with an option for each product
brief:                  |
                        A decision keeps a single ruling, and that
                        ruling may uphold several options, each
                        paired, in a new field of the ruling, with the
                        member products of the variant family it holds
                        for. An option not paired with a member
                        product is not upheld for it. One file shows
                        how the whole family answers the decision, and
                        a change of answer for one member product is
                        an edit of that file.

