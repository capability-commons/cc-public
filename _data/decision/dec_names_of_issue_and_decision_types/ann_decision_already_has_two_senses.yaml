title:                  Two senses of decision already in use
brief:                  |
                        The type term "decision" names each candidate,
                        but definitions, a style rule and the review
                        tool also use "decision" for the whole
                        question weighed across the candidates. If
                        both names are kept, one term keeps two
                        senses, twice on the same review page.
description:            |
                        Sources: t_option says alternatives are
                        decisions that answer the same issue
                        (_data/register/reg_data_item_type.yaml), and
                        r_is_option_for says the same
                        (_data/register/reg_relation.yaml). In the
                        question sense: con_concern says "a decision
                        weighs the concerns its arguments speak for"
                        (_data/register/reg_concept.yaml);
                        r_is_driven_by says "every decision about the
                        logical component is argued" for its drivers;
                        style_record_the_decision says "A design
                        decision says what was chosen, what was not,
                        and why"; dec_subject_of_a_decision is titled
                        "Subject of a design decision"; the review
                        tool heads each issue page "Decision matrix",
                        with a column for each decision
                        (src/cc_public/web/page.py). No check can tell
                        the two senses apart in prose.

