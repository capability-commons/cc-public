title:                  One part of a graph spelled three ways in the trial
brief:                  |
                        With no ruled address, the trial wrote one
                        setting as a four-part dotted path in the
                        origin trace, as node and setting joined by a
                        period in a failure of the binding-time check,
                        and as a node and a name apart in other rows
                        of failures, and wrote an edge as its ends
                        joined by an arrow. A reader going from a
                        failure to the operations that made the part
                        must translate between them, and the
                        binding-time check found its parts by
                        splitting operation paths at periods and
                        keeping those of four parts, which missed the
                        three other ways to bind a setting that the
                        review tried; the review's fix reads the
                        origin trace instead. One form for the trace,
                        failures and change sets is the gain whichever
                        option is upheld; a structured key is compared
                        field by field, while a path string works as a
                        key only if every writer spells it one
                        canonical way.
description:            |
                        Sources:
                        - The origin trace is keyed by dotted paths
                          for hosts, units,
                          nodes, settings and edges, an edge by its ends joined by an
                          arrow. (trial 2c777ab9, src/cctool/dataflow/resolve.py, function
                          _leaves; src/cctool/dataflow/items.py, function edge_key)
                        - A failure of the binding-time check names a
                          setting as node and
                          setting joined by a period, as the review's probe log shows, and
                          by reading the code the rows for an unknown or missing setting
                          hold a node and a name apart. (trial 2c777ab9,
                          src/cctool/dataflow/checks.py, functions check_variant and
                          _check_nodes; review of 2026-10-29,
                          areas/trial-model-logs/p10_checks.out)
                        - The binding-time check sees only a write of
                          a four-part path, and
                          the fix derives bound settings from the origin trace. (review of
                          2026-10-29, CC-025, detail TM-08)
                        - A reviewer of a variant, and a failure
                          report, need to know which
                          operation made each part.
                          (_data/requirement/rqt_resolver_records_origin.yaml at rationale)
                        Strength: moderate; it shows the cost of
                        having no form more than it separates the
                        options, and leans to the structured key only
                        through the canonical spelling a path string
                        needs.

