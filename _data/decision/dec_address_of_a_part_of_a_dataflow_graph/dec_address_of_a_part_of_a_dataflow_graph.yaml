title:                  Address of a part of a dataflow graph
brief:                  |
                        The origin trace, reports of failures, change
                        sets and dataflow tags all name a part of a
                        graph, such as a node, a setting of a node, a
                        port or an edge. How is the address of such a
                        part written?
description:            |
                        ruling_trace_of_every_touching_operation
                        records the origin of every part.
                        ruling_merge_key_declared_for_every_list and
                        ruling_edge_identified_by_its_ends say how an
                        element of a list is identified, and
                        ruling_group_member_as_an_identified_port
                        gives a port in a group an id and a guid.
                        Nothing says how the address of a part, which
                        may lie inside an element, is written. The
                        trial implementation of 2026-10-29 used dotted
                        strings, with an edge written as its two ends
                        joined by an arrow (trial process log, phase
                        1).

