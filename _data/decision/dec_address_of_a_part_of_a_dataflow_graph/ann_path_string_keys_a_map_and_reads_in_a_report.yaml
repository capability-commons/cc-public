title:                  Path string that keys a map and reads plainly in a report
brief:                  |
                        A path string, unlike a structured key, can be
                        the key of a JSON or YAML map, which is how
                        the trial held and cached its origin trace, a
                        map from each address to its operations, and
                        it reads in a line of a failure report as it
                        is written. cctool's own edits already address
                        a field of an item by a dotted path. A
                        structured key cannot key a map, so the trace
                        becomes a list of records that the canonical
                        form must put in a fixed order, the kind of
                        rule the trial got wrong when it sorted arrays
                        whose order is meaning. The dotted paths that
                        exist, though, reach a list element by its
                        index, as JSON Pointer does, so an edge named
                        by its ends still needs grammar of its own.
description:            |
                        Sources:
                        - The trial's resolved graph holds its origin
                          as a map from path to
                          operations, and caches it as JSON. (trial 2c777ab9,
                          src/cctool/dataflow/resolve.py, class ResolvedGraph and function
                          _to_cache)
                        - An edit splits a path into a field and parts
                          at periods, and a
                          part reaches a list element by its index.
                          (src/cctool/edit/edit.py within _path and _index)
                        - The trial's canonical form sorted every
                          array with a merge key,
                          ordered or not, and two different inputs shared a digest. (review
                          of 2026-10-29, CC-005)
                        - JSON Pointer refers to an array element by
                          its zero-based index.
                          (RFC 6901, section 4, https://www.rfc-editor.org/rfc/rfc6901)
                        - The maintainability question asks how
                          readily a newcomer can
                          understand the design.
                          (_data/register/reg_concern.yaml at entries.concern_maintainability.question)
                        Strength: moderate for simplicity and
                        readability; it is reduced by the escapes a
                        path needs over ids that hold periods.

