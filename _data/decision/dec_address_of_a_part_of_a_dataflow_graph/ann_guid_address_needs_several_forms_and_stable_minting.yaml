title:                  Guid addresses that need several forms and guids minted alike each run
brief:                  |
                        Under addresses by guid, only nodes, members
                        of port groups and operations have a guid of
                        their own. An edge is identified by its ends,
                        by a ruling that passed over
                        opt_edge_identified_by_id_with_guid, so it has
                        no guid and no single nearest part with one;
                        an ordinary port's guid is that of its
                        interface's member, shared by every node that
                        presents the interface; a setting is a path
                        from its node. That gives at least three forms
                        of address beside the guid itself, and the
                        option does not say how an edge is written.
                        Every node that lowering adds, such as a
                        sender, receiver, adapter or control block,
                        would need a guid minted the same way on every
                        run, since lowering is deterministic, and a
                        report would still need the id beside each
                        guid to be read. A structured key has one
                        form, the list, its merge key and a path, and
                        uses the guids that merge keys already hold.
description:            |
                        Sources:
                        - A dataflow edge is identified by its two
                          ends.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ruling_edge_identified_by_its_ends.yaml at brief)
                        - An end names the port of the interface the
                          node presents, by the
                          id and guid of that interface's member.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.end;
                          _data/dataflow_graph/dfg_stableflow_smoketest.yaml at dataflow_edge)
                        - A port in a group is a port in its own
                          right, with an id and a
                          guid.
                          (_data/decision/dec_naming_of_ports_in_a_group/ruling_group_member_as_an_identified_port.yaml at brief)
                        - The same resolved graph and version of
                          lowering always give the
                          same lowered graph.
                          (_data/interface_control_document/icd_dataflow_lowering.yaml at surface.data.artifact.determinism)
                        - Each run of a generator must give a member
                          the guid it had
                          before, by storing it or by a fixed rule.
                          (_data/decision/dec_naming_of_ports_in_a_group/ann_generated_members_need_stable_guids_and_rename_entries.yaml at brief)
                        - The trial wrote guids by hand, against the
                          repository's rule.
                          (review of 2026-10-29, CC-026)
                        Strength: moderate to strong for simplicity;
                        it weakens if guids of generated parts are
                        derived from their origin by a fixed rule,
                        which is itself one more mechanism.

