title:                  Renames that reach reference fields and miss ids inside path strings
brief:                  |
                        Some addresses are stored: an operation names
                        the part of its base that it changes, and a
                        requirement or a tag's entry may name a part.
                        The ruled rename maps rewrite each reference
                        field to the id its guid names and each
                        mention of a whole id, and on dev both the
                        rename and the check of mentions pass over an
                        id that follows a period, so an id after the
                        first in a dotted path string, such as the
                        port after its node or the second end of an
                        edge, is neither rewritten nor reported. A
                        path built from a node's local key holds no id
                        at all, though a rename changes that key. A
                        structured key whose fields are id and guid
                        pairs, as dev's edge ends are, is rewritten
                        and checked by the machinery that exists, and
                        a guid needs no rewrite. Derived addresses,
                        such as the origin trace and reports of
                        failures, are recomputed after a rename, so
                        the point bears only on stored ones.
description:            |
                        Sources:
                        - Each release ships its renames as an old id,
                          a new id and the
                          guid, and a peer rewrites each reference and each prose mention.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml at brief)
                        - A rename matches an id as a whole word only
                          where no period comes
                          before it. (src/cctool/edit/edit.py within PATTERN_WHOLE_ID)
                        - The check of mentions reads no id that
                          follows a period.
                          (src/cctool/graph/extract.py within REGEX_MENTION)
                        - A dataflow node is filed under the last part
                          of its id, so a
                          rename changes its key. (src/cctool/edit/edit.py within
                          _rename_all)
                        - The ends of an edge are references, so the
                          checker finds an end
                          that names nothing and a rename keeps the edge.
                          (_data/schema/sch_dataflow_graph.yaml at description)
                        - A write in the drafts addresses a setting by
                          a dotted string.
                          (_data/decision/dec_vocabulary_of_variant_operations/ann_every_reader_must_know_each_operation.yaml at description)
                        ASSUMPTION: an operation names its target with
                        the address form this decision rules.
                        Strength: moderate to strong for every stored
                        address; none for the origin trace and
                        reports, which are derived.

