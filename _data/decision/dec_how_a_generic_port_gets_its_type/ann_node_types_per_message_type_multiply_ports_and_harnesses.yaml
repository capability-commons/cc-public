title:                  Node types, port members and harnesses multiplied by message type
brief:                  |
                        One node type for each message type means a
                        transform makes a sender, a receiver,
                        adapters, a recorder and a player for every
                        type that crosses a unit, is adapted or is
                        recorded. Ports are interface members with ids
                        and guids that edge ends name, so each
                        generated type needs port members minted by
                        the transform, and the fuzz requirement asks
                        for a harness for each implementation a node
                        can use. An earlier argument counted the same
                        cost and noted that it falls away with type
                        parameters. A type parameter keeps one node
                        type and one interface, and binding it on each
                        configured node follows the ruled pattern of
                        port groups, where the interface declares a
                        group once and each configured node sets its
                        count.
description:            |
                        Sources:
                        - A transform makes a node type for each type
                          of message it needs,
                          from a template.
                          (_data/decision/dec_how_a_generic_port_gets_its_type/opt_one_node_type_for_each_message_type.yaml
                          at brief)
                        - An edge end names its port by member id and
                          guid.
                          (_data/schema/sch_dataflow_graph.yaml at $defs.end)
                        - A fuzz harness is required for each
                          implementation a dataflow
                          node can use. (_data/requirement/rqt_generator_fuzz_harness.yaml
                          at object)
                        - Without type parameters, the generator
                          writes one node kind, or
                          one dictionary entry, for each recorded or buffered type, a cost
                          bounded by the number of types.
                          (_data/decision/dec_where_engine_behavior_lives/ann_inserted_node_kinds_needed_per_port_type.yaml
                          at brief and description)
                        - The interface declares a port group once,
                          and the configuration
                          of each dataflow node lists its members.
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/opt_port_groups_sharing_a_type.yaml
                          at brief, upheld by ruling_port_groups_sharing_a_type;
                          _data/decision/dec_naming_of_ports_in_a_group/opt_group_member_as_an_identified_port.yaml
                          at description)
                        - Maintainability counts the parts a change
                          touches, and simplicity
                          the distinct mechanisms. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.measure.1 and
                          entries.concern_simplicity.measure.0)
                        Strength: moderate; the generated items cost
                        no hand work, and their number grows with the
                        types in use, not with the nodes.

