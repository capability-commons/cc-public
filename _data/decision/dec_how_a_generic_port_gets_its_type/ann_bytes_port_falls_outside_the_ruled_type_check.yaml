title:                  Edges at a bytes port that the ruled type check cannot judge
brief:                  |
                        Port types name dictionary entries and every
                        edge is checked against them, on the resolved
                        graph and again on the lowered one, where the
                        senders, receivers, adapters and recorders
                        sit. With bytes and a tag, an edge from a
                        concrete output into a sender names two
                        different declarations, so the requirement on
                        port types needs an exemption, and the edge
                        from a receiver into its consumer can be
                        checked only at run time, by the tag. A type
                        parameter bound by lowering, or a node type
                        made for each message type, leaves a concrete
                        type on every port of the lowered graph, so
                        the existing rule runs unchanged once the
                        bound type is substituted.
description:            |
                        Sources:
                        - Port types name entries of data
                          dictionaries, and edges are
                          checked against those entries.
                          (_data/decision/dec_port_types/ruling_port_types_from_data_dictionaries.yaml
                          at brief)
                        - A failure names an edge whose two ends name
                          different
                          declarations in the dictionary, and the dataflow rules run on
                          each complete variant as resolved and as lowered.
                          (_data/requirement/rqt_checks_port_types.yaml at condition and
                          object; _data/requirement/rqt_checks_every_complete_variant.yaml
                          at object)
                        - The port type rule compares the types stated
                          on the ports at the
                          two ends of an edge. (src/cctool/check/check.lp within
                          port_type_mismatch)
                        - The generic spellings in the interfaces
                          would fail every
                          inserted adapter or sender, and the review asks for a dictionary
                          entry or a declared type parameter for each generic port.
                          (review of 2026-10-29, CC-065;
                          /mnt/project-files/notes/reviews/2026-10-29-full-review/areas/records.md,
                          REC-16)
                        - Only a node that interprets the bytes
                          declares a type.
                          (_data/decision/dec_how_a_generic_port_gets_its_type/opt_bytes_with_a_type_tag.yaml
                          at brief)
                        Strength: strong; it follows from a ruling and
                        two requirements, and weakens only if WTP
                        accepts run-time checking for inserted nodes.

