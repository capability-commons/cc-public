title:                  Sender that must know its type to encode for another process
brief:                  |
                        Two of the three options open for the encoding
                        between OS processes convert each message at
                        the sender and the receiver, to a canonical
                        layout or to CDR so that other tools can read
                        it, and both need the message's type where the
                        conversion is generated. A sender bound to one
                        type, by a parameter or as a node type of its
                        own, gets a converter generated for that type.
                        A sender that carries bytes with a tag needs a
                        table of converters for every type, chosen at
                        run time by the tag, or works only with the
                        raw memory layout. Partner tools also bind a
                        generic block for each use: Simulink blocks
                        can inherit their data type from the signals
                        they connect to, which a type parameter
                        mirrors.
description:            |
                        Sources:
                        - The open options are a canonical layout
                          converted by generated
                          code at the sender and the receiver, a standard serialization
                          such as CDR generated from the dictionary types so that other
                          tools can read the messages, and the memory layout with a check
                          that both ends share one dictionary digest.
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/opt_canonical_layout_from_the_dictionary.yaml,
                          _data/decision/dec_encoding_of_a_message_between_os_processes/opt_standard_serialization.yaml
                          and
                          _data/decision/dec_encoding_of_a_message_between_os_processes/opt_memory_layout_on_the_wire.yaml
                          at brief)
                        - Simulink blocks can inherit data types from
                          the signals they are
                          connected to, by a rule set on the block. (MathWorks, Data type
                          inheritance rules in Simulink,
                          https://www.mathworks.com/help/simulink/ug/data-type-inheritance-rules-in-simulink.html)
                        - Compatibility asks whether a partner can
                          read and use what the
                          design produces. (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                        ASSUMPTION: the converters are generated from
                        dictionary entries, as the trial generated
                        structs and upgrade functions from them.
                        Strength: moderate; it bears only if the
                        encoding decision picks a converting option.

