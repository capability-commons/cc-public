title:                  One sender for every type, with a tag a receiver can check
brief:                  |
                        With bytes and a tag, the sender, receiver,
                        recorder and player are each one compiled node
                        that never needs a type, so no code or harness
                        is generated for each type, and one harness
                        can feed them bytes directly, where the trial,
                        as its generator reads, gave its generic nodes
                        no harness at all. A tag also lets a receiver
                        refuse a message from a sender built for
                        another type, a mix the trial's TCP framing
                        could not see, since it carried only a count.
                        Against this, the review's fix for that
                        framing adds a header with a channel and a
                        size, which catches a crossed channel or a
                        size that differs without a type, and the
                        memory-layout encoding already checks that
                        both ends share one dictionary.
description:            |
                        Sources:
                        - A generic port carries the bytes of a
                          message and a tag, so
                          recorders and transports never need to know a type.
                          (_data/decision/dec_how_a_generic_port_gets_its_type/opt_bytes_with_a_type_tag.yaml
                          at brief)
                        - As its generator reads, the trial generated
                          a harness only for
                          kinds of node whose role is ordinary, which no generic kind has,
                          and gave a generic port no item type in the generated header of
                          its kind. (trial
                          2c777ab9, src/cctool/dataflow/generate.py, functions generate,
                          _fuzz and _port_type; src/cctool/dataflow/standard/node_kind/,
                          the role of each generic kind)
                        - The trial's TCP framing was a bare count
                          with no magic, step or
                          size, and the fix adds a header with magic, channel, step and
                          size. (review of 2026-10-29, CC-016)
                        - The memory-layout encoding checks that both
                          ends were built from
                          the same dictionary digest.
                          (_data/decision/dec_encoding_of_a_message_between_os_processes/opt_memory_layout_on_the_wire.yaml
                          at brief)
                        - Maintainability asks how readily a change
                          can be checked before
                          it ships. (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.2)
                        Strength: weak to moderate; the guard is real,
                        but the framing fix and the encoding decision
                        give most of it, and the type check on the
                        graph is lost (see
                        ann_bytes_port_falls_outside_the_ruled_type_check,
                        in this batch).

