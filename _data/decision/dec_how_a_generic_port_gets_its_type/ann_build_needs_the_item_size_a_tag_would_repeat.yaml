title:                  Item size the build needs before any tag is read
brief:                  |
                        The engine allocates the buffer of every edge
                        from the port's type and capacity before the
                        first local step, and a message is an array of
                        items of one fixed-size type. The item size of
                        a generic port is therefore fixed when the
                        engine is built, whatever the option, and the
                        trial's generator sized each channel from the
                        type its node was given. A tag on every
                        message then states at run time what the build
                        already knows, a second mechanism for one job,
                        while a type parameter states it once, where
                        lowering writes it.
description:            |
                        Sources:
                        - Engine memory allocates the buffer for every
                          edge from the port
                          types and capacities, as items of one fixed-size type in a buffer
                          for the whole capacity.
                          (_data/interface_control_document/icd_dataflow_edge_message.yaml
                          at description and
                          surface.data.artifact.artifact.message.encoding)
                        - Every buffer is allocated before the first
                          local step, from the
                          declarations.
                          (_data/requirement/rqt_memory_before_first_step.yaml at object
                          and qualifier;
                          _data/decision/dec_who_owns_the_memory_of_a_value/ruling_engine_owns_every_buffer.yaml
                          at brief)
                        - The trial's generator wrote each channel's
                          item size from the
                          type given to its sender, and each array carries its item size.
                          (trial 2c777ab9, src/cctool/dataflow/generate.py, function
                          _host; src/cctool/dataflow/engine/include/df/node.h, struct
                          df_array)
                        - Simplicity counts jobs done by more than one
                          mechanism.
                          (_data/register/reg_concern.yaml at
                          entries.concern_simplicity.measure.1)
                        Strength: moderate; a tag adds a guard at a
                        process boundary, so it is not pure
                        duplication (see
                        ann_type_tag_lets_one_sender_serve_every_type,
                        in this batch).

