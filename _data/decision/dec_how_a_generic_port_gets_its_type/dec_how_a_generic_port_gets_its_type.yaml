title:                  How a generic port gets its type
brief:                  |
                        Senders, receivers, recorders, players and
                        delivery adapters work on messages of any
                        type. How does such a port get the type of the
                        edge it sits on?
description:            |
                        ruling_port_types_from_data_dictionaries has
                        port types name entries of a data dictionary,
                        with edges checked against them. Lowering
                        inserts senders and receivers
                        (ruling_transport_nodes_inserted_by_a_transform),
                        and recorders and delivery adapters sit on
                        edges of any type (icd_dataflow_transport,
                        icd_dataflow_recorder,
                        icd_dataflow_delivery_adapter). The trial
                        implementation of 2026-10-29 wrote a wildcard
                        as the port type of such a kind of node, and a
                        parameter on each node that lowering filled
                        from the edge (trial process log, phase 1).

