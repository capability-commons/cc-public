title:                  GStreamer caps that match by intersection, not spelling
brief:                  |
                        GStreamer caps match by intersection, not
                        equal text, so a spelling check fails edges
                        that do match, or needs exceptions. Typed
                        dictionary entries give a place for a matching
                        rule per kind of type, though the caps case
                        needs such a rule under either option.
description:            |
                        Sources:
                        - Caps compatibility is intersection, not
                          equal spelling, so the port type check needs
                          a GStreamer rule.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 59-63)
                        - One port is spelled as a caps list.
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 225-228)
                        - "A rule that keeps needing exceptions is
                          changed so that it no longer needs them."
                          (_data/register/reg_design_rule.yaml at entries.rule_fix_the_rule_not_the_exceptions) Strength: moderate; it applies to the
                          GStreamer ports of the mixed-engine graph, not to
                          every port.

