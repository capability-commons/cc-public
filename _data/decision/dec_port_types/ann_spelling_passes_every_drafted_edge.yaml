title:                  Spelling check that passes every drafted edge today
brief:                  |
                        Equal spelling already checks the recorded
                        smoke test and all 41 edges of the Patrol
                        draft without a false failure. As a first
                        check it gives a usable result until data
                        dictionaries exist.
description:            |
                        Sources:
                        - All 41 edges of the Patrol base draft join
                          an output to an input, and the two ends of
                          every edge spell the same type.
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 209-210;
                          _sources/cc-patrol-notes/draft/tools/edgecheck.py)
                        - Those ports were spelled to match on
                          purpose, including caps lists at runtime
                          boundaries.
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 225-228)
                        - Every port joined by an edge of the smoke
                          test is spelled dict, so its three edges
                          pass.
                          (_data/dataflow_graph/dfg_stableflow_smoketest.yaml at dataflow_edge;
                          _data/interface_control_document/icd_process_controller.yaml at surface.step.dataflow_step.input.ctrl and surface.step.dataflow_step.output; icd_system_controller.yaml at surface.step.dataflow_step.input.feedback and surface.step.dataflow_step.output; icd_printer.yaml at surface.step.dataflow_step.input.value)
                          Strength: weak; the edges pass because their
                          authors made the spellings match, which is
                          the weakness the annotations for
                          dictionaries name.

