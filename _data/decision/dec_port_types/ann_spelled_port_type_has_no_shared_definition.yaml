title:                  Spelled port types with no shared definition
brief:                  |
                        A port type held as text can be compared but
                        not followed: one payload is used by seven
                        Patrol interfaces but declared in only one,
                        and the other six spell it again with nothing
                        tying the spellings together, and in the
                        repository distinct payloads already share one
                        spelling. A data dictionary entry held as an
                        item is defined and changed once, follows
                        renames, and gives ports, edges and
                        requirements one identity to point at.
description:            |
                        Sources:
                        - The port type check fires when the stated
                          types of the two ports of an edge differ as
                          text. (src/cctool/check/check.lp lines
                          2996-3034)
                        - The stated type of a port is the spelling
                          field of its type reference only.
                          (src/cctool/graph/extract.py lines 1443,
                          1555-1564)
                        - "The analysis result is used by seven ICDs
                          but can be declared only inside one; the
                          others spell AnalysisResult and rely on
                          equal spelling."
                          (_sources/cc-patrol-notes/decomposition-readiness.md
                          lines 220-224)
                        - Three ports of the process controller ICD, a
                          control packet, its copy and a
                          load-and-exceptions report, are all spelled
                          dict.
                          (_data/interface_control_document/icd_process_controller.yaml
                          lines 42-50, 54-63, 65-73)
                        - A type reference may name a declaration only
                          of the same document; otherwise it is a
                          spelling.
                          (_data/schema/sch_interface_control_document.yaml
                          lines 119-145)
                        - An interface member's identity lets a
                          requirement name one declaration.
                          (_data/schema/sch_interface_member.yaml
                          lines 25-27)
                        - cctool rename rewrites every reference to a
                          renamed id. (src/cctool/edit/edit.py
                          lines 1014-1034) Strength: strong; the
                          duplication is measured in real drafts and
                          the shared spelling is in the repository.

