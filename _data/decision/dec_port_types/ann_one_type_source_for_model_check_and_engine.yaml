title:                  One type source for the model check and the engine
brief:                  |
                        The engine drafts check edges by a type id
                        that hashes the data layout, generated with
                        the C++ struct from a data dictionary spec, so
                        a reordered or resized struct is a different
                        type. A spelling cannot carry that, so the
                        model's check and the engine's could disagree
                        about the same edge; port types that name
                        dictionary entries let one entry drive both
                        checks, the generated C++ and its Python view.
description:            |
                        Sources:
                        - The type id is a hash of the canonical dtype
                          description (field names, types, shapes,
                          offsets); tentatively decided 2026-10-16.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 98-99, 224-225)
                        - "The data dictionary already maps types to
                          NumPy ..., so the generator can emit both
                          the C++ struct and its canonical dtype
                          string from the same spec."
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 95-96)
                        - The engine's component spec uses the data
                          dictionary syntax for slot order, buffer
                          sizes, presets and type checking.
                          (_sources/axair-orchestrator/docs/component_interface.md
                          lines 16-19, 100-113)
                        - The type id is shared by C++ and Python.
                          (_sources/axair-orchestrator/docs/execution_levels.md
                          lines 82-103)
                        - A port type has nowhere today to name a data
                          dictionary id or a dtype hash.
                          (_sources/mapping.md lines 47-48) Strength:
                          strong for functional suitability,
                          simplicity and compatibility (two notions of
                          type equality otherwise); moderate for
                          maintainability, since it rests on a
                          decision recorded as tentative.

