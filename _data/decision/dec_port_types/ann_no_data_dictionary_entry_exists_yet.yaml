title:                  No data dictionary entry yet to trace to
brief:                  |
                        No data dictionary item exists in the tree,
                        and the Patrol drafts treat dictionaries as
                        later work. A port type that had to name an
                        entry would have nothing in the tree to trace
                        to until one is written, and a dictionary type
                        added now would be an element no item in the
                        tree yet calls for.
description:            |
                        Sources:
                        - The Patrol ICD draft spells port types as
                          payload names because cc-public has no data
                          dictionaries yet.
                          (_sources/cc-patrol-notes/draft/icd-list.md
                          lines 3-5)
                        - The Patrol plan maps channel contracts to
                          ICDs, "later data dictionaries".
                          (_sources/cc-patrol-notes/plan.md line 48)
                        - "Add a type, relation, field or command only
                          when a real instance needs it." (AGENTS.md#keep-it-small) Strength: weak; the Patrol
                          drafts already list the payloads that would
                          become the first entries.

