title:                  Overlap of dictionaries with ICD shared declarations
brief:                  |
                        An interface control document already holds
                        declarations its surfaces share, and a type
                        reference may name one. Data dictionary items
                        would be a second home for type declarations
                        unless the ICD declarations move into them.
description:            |
                        Sources:
                        - An ICD carries the declarations its surfaces
                          share, and a type reference names a
                          declaration the document shares, or the
                          spelling the surface language uses, or both.
                          (_data/schema/sch_interface_control_document.yaml at description)
                        - The port type check compares the stated type
                          at each end of an edge for equality.
                          (src/cctool/check/check.lp within port_type_mismatch) Strength: moderate; the overlap
                          is real but can be removed by folding the
                          shared declarations into the dictionary.

