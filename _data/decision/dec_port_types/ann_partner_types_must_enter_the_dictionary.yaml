title:                  Partner types that must first enter the dictionary
brief:                  |
                        If ports must name data dictionary entries, a
                        partner whose types are written in another
                        interface language must first write them as
                        cc-public dictionary items to connect a port.
                        Spelling admits the partner's own type names
                        as they are.
description:            |
                        Sources:
                        - A type reference may give a declaration the
                          document shares, the spelling of the surface
                          language, or both.
                          (_data/schema/sch_interface_control_document.yaml
                          lines 45-49, 119-145)
                        - Patrol's console reads the published track
                          stream "like any outside system".
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 82-85)
                        - Assumption: some partners describe their
                          payloads in another interface language, such
                          as Protocol Buffers or ROS messages.
                          Strength: weak; keeping spelling beside the
                          dictionary entry, as the type reference
                          already allows, removes most of the cost.

