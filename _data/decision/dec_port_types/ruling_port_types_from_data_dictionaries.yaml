title:                  Port types from data dictionaries
brief:                  |
                        Port types name entries of data dictionaries
                        held as items, with the spelling of the
                        surface language kept beside the entry, and
                        edges are checked against those entries; the
                        dictionary type is added with its first real
                        entries, and until then the check compares
                        spellings. Ruled by WTP on 2026-10-24, after
                        the ruling on the form of the data dictionary.

