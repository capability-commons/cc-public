title:                  Language-neutral node interface
brief:                  |
                        A node interface stated as a C calling
                        convention, with the step, the port arrays and
                        the control message, can be met by C, C++,
                        Rust or any language with a foreign function
                        interface, so nodes in different languages
                        share one graph and one engine. A call through
                        that interface costs about what any function
                        call costs. A node written in a language with
                        a garbage collector may still break the static
                        memory and timing of a unit, so which
                        languages a unit admits belongs in its
                        configuration. The library option tends to
                        favor nodes in its own host language.
description:            |
                        Sources:
                        - The nodes are also implemented in whatever
                          language one wants (WTP, 2026-10-28).
                        - The static subgraph's schedule is generated
                          as plain C++17 calls and fixed at build
                          time.
                          (_data/decision/dec_first_engine/ruling_one_engine_with_static_and_dynamic_subgraphs.yaml
                          at brief) ASSUMPTION: Rust and other systems
                          languages can expose functions with the C
                          calling convention, as they commonly do.
                          Strength: moderate.

