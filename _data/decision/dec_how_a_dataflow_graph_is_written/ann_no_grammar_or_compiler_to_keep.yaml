title:                  No grammar or compiler to keep
brief:                  |
                        A coordination language brings a grammar, a
                        parser, a compiler, error messages and, for
                        people to use it comfortably, editor support,
                        all of which someone must keep working as the
                        language grows. Configuration data needs a
                        schema and the YAML and JSON parsers that
                        already exist in every wrapper language. The
                        project is small, so a language of its own
                        would be the largest piece of tooling it owns.
description:            |
                        Sources:
                        - Lingua Franca's compiler generates the
                          program that coordinates reactions written
                          in the target language (Lohstroh et al.
                          2021, Toward a Lingua Franca for
                          deterministic concurrent systems).
                        - WTP wants the approach pragmatic and as
                          simple as feasible (WTP, 2026-10-28).
                          ASSUMPTION: the project's tooling is
                          maintained by WTP with agents, without a
                          team to own a compiler. Strength: strong for
                          a small project; weaker if a larger
                          community adopted the engine and wanted a
                          language.

