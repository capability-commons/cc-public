title:                  Abstraction that a language gives and data lacks
brief:                  |
                        A language offers named reusable parts,
                        parameters, expressions and loops, so a graph
                        of a hundred similar nodes is a few lines.
                        Plain data offers none of these, and projects
                        that configure systems in data often grow
                        templating or expressions inside it, inventing
                        a weaker language by accident. Under the data
                        option, reuse must come from the variant
                        machinery, its operations and parameters, and
                        the schema must refuse expressions in values.
description:            |
                        Sources:
                        - Variants are built by a graph of edits of
                          variant operations, merges and delta
                          modules.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief) ASSUMPTION: the variant operations
                          and their parameters cover the reuse that
                          graphs need; no large graph has yet been
                          written this way. Strength: moderate; it is
                          the main cost of the data option and the
                          main risk to watch.

