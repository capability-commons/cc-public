title:                  Coordination language of its own
brief:                  |
                        Graphs are written in a coordination language
                        with its own syntax and compiler, as in Lingua
                        Franca, where the bodies of reactions are
                        written in a target language such as C, C++,
                        Python, Rust or TypeScript and the compiler
                        generates the program that runs them.
description:            |
                        The approach of Lingua Franca (Lohstroh et al.
                        2021, Toward a Lingua Franca for deterministic
                        concurrent systems).

