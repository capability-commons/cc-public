title:                  Graph as configuration data
brief:                  |
                        A dataflow graph is a data item whose shape
                        one schema defines, written in YAML or JSON,
                        or in XML through a mapping, and produced or
                        edited by whatever wrapper language its user
                        prefers. There is no coordination language:
                        the schema and the rulings on the dataflow
                        model carry the semantics a language would
                        otherwise define. Nodes may be written in any
                        language behind one language-neutral node
                        interface, a C calling convention for the
                        step, the port arrays and the control message.
description:            |
                        WTP's statement of how the engine differs from
                        Lingua Franca (WTP, 2026-10-28).

