title:                  Graph data checked and transformed as an item
brief:                  |
                        A dataflow graph is already a data item in the
                        checked graph, so rules follow data from node
                        to node and decisions can be about one
                        arrangement of a model; the graph of edits
                        that builds variants is itself a dataflow
                        graph whose tokens are dataflow models. Both
                        rest on the graph being data that tools can
                        read and rewrite. A graph in a language must
                        first be parsed into such data, and a graph
                        built by a program exists only once that
                        program has run, so neither can be checked,
                        varied or cached as an item without an extra
                        step.
description:            |
                        Sources:
                        - A dataflow graph puts the model of a system
                          in the graph of items, so that rules can
                          follow data from dataflow node to dataflow
                          node, and a decision or an argument can be
                          about one arrangement of a model.
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_dataflow_graph.usage)
                        - The graph of edits is itself a dataflow
                          graph, and a dataflow model is the token on
                          each edge.
                          (_data/decision/dec_how_the_graph_of_edits_is_run/opt_graph_of_edits_as_a_dataflow_graph_with_caches.yaml
                          at brief) Strength: strong; it follows from
                          rulings already made.

