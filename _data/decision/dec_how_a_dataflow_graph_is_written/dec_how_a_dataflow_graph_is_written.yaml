title:                  How a dataflow graph is written
brief:                  |
                        Is a dataflow graph written as configuration
                        data that any wrapper language can produce, in
                        a coordination language of its own, or through
                        a library in one host language?
description:            |
                        WTP compared the engine with Lingua Franca: it
                        feels a lot like it, but without trying to
                        invent a new language; configuration is held
                        in data structures, represented in YAML, JSON
                        or XML, managed and controlled by whatever
                        wrapper language one wants, such as Python,
                        Rust or TypeScript, and the nodes are also
                        implemented in whatever language one wants
                        (WTP, 2026-10-28). WTP asked for this to be
                        recorded as a decision (WTP, 2026-10-28).
                        Lingua Franca is under a BSD license, so its
                        code could be borrowed, but WTP prefers taking
                        lessons learned rather than verbatim code: the
                        project maintains its own implementation,
                        driven by its own design decisions (WTP,
                        2026-10-28).

