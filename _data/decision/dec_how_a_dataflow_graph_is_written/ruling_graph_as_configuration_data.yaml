title:                  Graph as configuration data
brief:                  |
                        A dataflow graph is configuration data that
                        any wrapper language can produce. Ruled by WTP
                        on 2026-10-29, with a note: a tiny embedded
                        expression language, analogous to the
                        hyperscript that accompanies htmx, is a
                        perfectly valid compromise and escape hatch if
                        one is needed.

