title:                  Graph checked before it runs
brief:                  |
                        A graph held as data is checked at each
                        commit, and a change set is checked before it
                        is sent, so a graph with an unfed input or a
                        loop without a first value never reaches a
                        target. A coordination language's compiler can
                        check as much. A graph built by a program is
                        known only when the program runs, possibly on
                        the target, so its faults show there, and a
                        safety case cannot rest on a check made before
                        deployment.
description:            |
                        Sources:
                        - cctool check already finds unfed inputs,
                          inputs fed twice and port type mismatches in
                          dataflow graph items, by the rules
                          lpp_cctool.check.check.unfed_input,
                          lpp_cctool.check.check.input_fed_twice and
                          lpp_cctool.check.check.port_type_mismatch.
                        - A swap whose state cannot be upgraded is
                          refused by a check before it is sent.
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                          at brief) Strength: strong for
                          safety-related graphs.

