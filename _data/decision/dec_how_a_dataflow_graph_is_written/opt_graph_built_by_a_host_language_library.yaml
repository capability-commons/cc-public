title:                  Graph built by a host language library
brief:                  |
                        Graphs are built by calls to a library in one
                        host language, such as Python, so that a graph
                        is whatever a program constructs when it runs,
                        as ROS 2 launch files written in Python
                        construct a system.
description:            |
                        The usual practice of frameworks that
                        configure a system from code.

