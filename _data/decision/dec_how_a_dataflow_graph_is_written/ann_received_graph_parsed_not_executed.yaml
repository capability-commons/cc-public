title:                  Received graph that is parsed, not executed
brief:                  |
                        A graph or change set received from a partner,
                        or sent to a target, is untrusted input. As
                        data it is parsed by a safe loader and checked
                        against a schema, and nothing in it runs. A
                        graph built by a host-language library is a
                        program, so loading a received graph means
                        running received code. A coordination language
                        is parsed too, by its own parser, which is new
                        code to harden.
description:            |
                        Sources:
                        - A change set is applied at the start of a
                          step, and change sets arrive while the
                          system runs.
                          (_data/decision/dec_swap_of_a_node_version/opt_swap_at_a_step_with_state_upgrade.yaml
                          at brief) ASSUMPTION: graphs and change sets
                          will cross between federated segments and to
                          targets over a network. Strength: strong
                          wherever graphs cross a trust boundary.

