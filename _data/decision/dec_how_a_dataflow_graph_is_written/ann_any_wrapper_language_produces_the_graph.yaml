title:                  Any wrapper language that produces the graph
brief:                  |
                        Data in YAML or JSON can be produced by a
                        Python script, a Rust tool, a TypeScript
                        service or a person with an editor, so each
                        user manages graphs in the language they
                        already use. A library ties every user to its
                        host language, and a coordination language
                        ties them to its own syntax and tools.
description:            |
                        Sources:
                        - Configuration is managed and controlled by
                          whatever wrapper language one wants, such as
                          Python, Rust or TypeScript (WTP,
                          2026-10-28). Strength: moderate; it matters
                          most for federated partners, who bring their
                          own languages.

