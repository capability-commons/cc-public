title:                  Preconditions of variant operations
brief:                  |
                        Does each variant operation state what must
                        exist and what must be absent before it
                        applies, and what happens when that does not
                        hold?
description:            |
                        Survey idea 3 (_sources/survey/README.md lines
                        45-48), from graph transformation rules with
                        negative application conditions and the test
                        operation of JSON patch
                        (_sources/survey/generative-and-transforms.md
                        line 118). The scout notes that the sketch
                        asserts them for write and that the join
                        precondition in the duplicate-edge annotation
                        depends on them
                        (_sources/four-decisions-argued.md line 802).

