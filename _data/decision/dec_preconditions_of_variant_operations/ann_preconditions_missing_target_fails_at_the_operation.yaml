title:                  A missing target that fails at the operation that names it
brief:                  |
                        When an ancestor drops a node a child writes
                        to, or a rename or retirement takes away what
                        a remove names, or a filter names a tag no
                        element carries, a precondition fails at the
                        operation and names it. With idempotent
                        operations the operation silently does
                        nothing, stays with no effect and no reason,
                        and the fault shows later as a check on the
                        resolved graph, which cannot name the
                        operation, or not at all. The draft resolver
                        already asserts this for write.
description:            |
                        Sources:
                        - The sketch asserts that a write's target is
                          declared, and its filter drops what matches
                          and reports nothing.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 33-49)
                        - An operation that names a missing node,
                          port, process or setting is itself a
                          failure, and failures name the variant and
                          the operation.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - Retiring a tag, removing a base node or
                          renaming a port leaves dangling operations.
                          (_sources/survey/product-lines.md line 309,
                          after Passos et al.,
                          https://www.se.cs.uni-saarland.de/publications/docs/PTD+16.pdf)
                        - The idempotent option lets only the checks
                          on the resolved graph fail.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_idempotent_operations_without_preconditions.yaml,
                          brief)
                        - Remove's target must exist, and a failed
                          operation fails the whole patch. (RFC 6902,
                          sections 4.2 and 5,
                          https://www.rfc-editor.org/rfc/rfc6902)
                        - The duplicate-edge annotation already
                          depends on a precondition on join.
                          (_data/decision/dec_identity_of_a_dataflow_edge/ann_duplicate_edges_need_a_join_precondition.yaml,
                          brief)
                        - Each failure says what is wrong and how to
                          fix it.
                          (_data/decision/dec_failure_report_form/ruling_failure_report_form.yaml
                          lines 12-15)
                        - Traceability asks whether anything exists
                          that nothing calls for.
                          (_data/register/reg_concern.yaml line 572)
                          Strength: strong; silent no-ops grow with
                          chain depth, variants, tags and base
                          changes. Kept in the interpreter, the cost
                          is one rule per operation kind, not per
                          variant.

