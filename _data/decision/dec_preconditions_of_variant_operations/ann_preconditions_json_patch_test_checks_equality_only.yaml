title:                  A test of absence that JSON Patch cannot carry
brief:                  |
                        In JSON Patch remove fails on a missing
                        target, add on an existing member replaces it,
                        and test checks only that a value equals a
                        given one, so an assertion of absence cannot
                        be written as a JSON Patch, and the test
                        option's claim to assert what must not exist
                        "as in JSON patch" goes beyond what JSON Patch
                        does. None of the three options exports to
                        JSON Patch without loss.
description:            |
                        Sources:
                        - RFC 6902 sections 4.1, add replaces an
                          existing member, 4.2, remove's target must
                          exist, 4.6, test checks equality, and 5, a
                          failed operation fails the whole patch.
                          (https://www.rfc-editor.org/rfc/rfc6902)
                        - The test option's brief.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_explicit_test_operation.yaml,
                          brief) Strength: weak; it bears on wording
                          more than on choice, and does not separate
                          the other two options.

