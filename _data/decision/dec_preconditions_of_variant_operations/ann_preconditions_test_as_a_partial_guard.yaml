title:                  A test operation as a partial guard against silent no-ops
brief:                  |
                        A test operation does catch a filter whose
                        presence tag no element carries, or an absent
                        target, where an author writes one, which
                        idempotent operations never do. It is a
                        partial guard, weaker than a precondition on
                        every operation.
description:            |
                        Sources:
                        - A test operation lets a variant assert what
                          must or must not exist at a point in its
                          list.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_explicit_test_operation.yaml,
                          brief)
                        - The sketch's filter drops what matches and
                          reports nothing.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          lines 33-43) Strength: weak; its cover
                          depends on authors' care.

