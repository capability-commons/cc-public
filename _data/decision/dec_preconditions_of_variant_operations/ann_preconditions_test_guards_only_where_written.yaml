title:                  A test operation that guards only where an author writes one
brief:                  |
                        A test operation guards only where an author
                        remembers to add one, the failures it misses
                        fall to the resolved-graph checks, and it
                        restates the address of the operation it
                        guards, so a changed address must change in
                        two places. It adds an operation kind where a
                        precondition inside the interpreter adds none,
                        though it can be added later beside built-in
                        preconditions, as JSON Patch has both.
description:            |
                        Sources:
                        - Operations state no preconditions of their
                          own, and a test operation asserts what must
                          or must not exist.
                          (_data/decision/dec_preconditions_of_variant_operations/opt_explicit_test_operation.yaml,
                          brief)
                        - JSON Patch's test checks that a value at the
                          target equals a given value, beside
                          preconditions on remove, replace and move.
                          (RFC 6902, sections 4.2 and 4.6,
                          https://www.rfc-editor.org/rfc/rfc6902)
                        - The sketch asserts a precondition for write
                          inside the interpreter.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py
                          line 49)
                        - The simplicity measure counts distinct
                          mechanisms introduced.
                          (_data/register/reg_concern.yaml line 489)
                          Strength: moderate; it grows with
                          operations.

