title:                  Import rule over the graph
brief:                  |
                        The extractor records each import between
                        modules as a fact, modules belong to logical
                        components by edges, a relation between
                        components says which may depend on which, and
                        a rule reports an import the components do not
                        allow. The rule starts as advice, since
                        imports already run both ways between some
                        parts. import-linter contracts, and no check
                        of imports, are rejected. Ruled by WTP on
                        2026-10-28 at 14:08 UTC, by writing "Uphold
                        opt_import_rule_over_the_graph as
                        recommended".

