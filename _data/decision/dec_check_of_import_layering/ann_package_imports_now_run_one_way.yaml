title:                  Package imports that now run one way
brief:                  |
                        ann_unchecked_imports_already_run_both_ways
                        says that two pairs of packages import each
                        other. That is no longer so. The layout
                        printer and the release record, the two
                        modules the checker imported from the editor
                        and the release package, now live in the
                        checker, and the packages of cctool import one
                        another in one direction only, so the import
                        rule over the graph need not start by excusing
                        any pair.
description:            |
                        The layout printer is now
                        src/cctool/check/layout.py and the release
                        record is src/cctool/check/release_record.py.
                        The checker imports only the graph package
                        [src/cctool/check/check.py at its imports].
                        Read with ast over src, leaving out tests and
                        fixtures, the imports between packages are:
                        check on graph; edit and gate on check; commit
                        on check and gate; release on check, commit,
                        edit and gate; web on check, edit and
                        requirement; cli on the rest. No package
                        reaches itself through them, and there was
                        already no cycle between modules [measured by
                        Claude in the cloud container, 2026-10-28].
                        Nothing yet checks that it stays so.

