title:                  Package order held by the import rule
brief:                  |
                        The annotation says nothing yet checks that
                        the imports between packages keep running one
                        way. Now the advice import_not_allowed reports
                        an import that no edge of
                        relation_may_depend_on allows, and it gives no
                        rows today.
description:            |
                        See src/cctool/check/advise.lp within
                        import_not_allowed, and the edges of
                        relation_may_depend_on between the parts of
                        lco_tooling. It is advice, so it reports and
                        does not fail. Found in the weekly review of
                        2026-10-29.

