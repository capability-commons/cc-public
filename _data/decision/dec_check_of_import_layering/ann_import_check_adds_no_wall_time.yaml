title:                  Gate time of an import check
brief:                  |
                        The stages of the gate run side by side, and
                        the test stage takes minutes. An import check
                        in the lint stage or in the check stage
                        finishes well before the tests, so neither
                        choice adds measurable wall time.
description:            |
                        Sources:
                        - The gate runs its stages side by side in a
                          thread pool [src/cctool/gate/gate.py at
                          function gate and the module docstring].
                        - The tests the commit gate runs took 209 s in
                          the container [measured by Claude in the
                          cloud container, 2026-10-26].
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (the extractor parses each module).
                        - Dev has 70 python modules outside the test
                          folders [count of python files under
                          src/cctool excluding _test on the snapshot].
                        - ASSUMPTION: import-linter builds its own
                          import graph, so it reads the 70 modules a
                          second time. Strength: weak. Both checks
                          take seconds at 70 modules. At ten times the
                          modules the graph rule reads no file twice.
                          import-linter reads them again, but it runs
                          beside the test stage, so wall time still
                          does not change.

