title:                  September contract naming packages dev lacks
brief:                  |
                        September's import-linter contract names the
                        root package cc_public and twelve layers of
                        its packages, while dev's code is the cctool
                        package with other subpackages. The contract
                        must be rewritten, not brought across, and a
                        copied contract would fail at once. A rule
                        over the graph takes its layers from component
                        edges, which do not exist yet, so it gives no
                        result until they are written.
description:            |
                        Sources:
                        - September's import-linter configuration sets
                          root_package to cc_public and lists layers
                          such as cc_public.workflow and
                          cc_public.evidence
                          [origin/main:pyproject.toml at
                          tool.importlinter].
                        - Dev's code is under src/cctool, with
                          packages such as check, cli, commit, edit,
                          gate, graph, release, requirement and web
                          [src/cctool, directory listing].
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (what the graph rule option needs).
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (components by convention on dev).
                        - WTP named September's gate and code-quality
                          tooling as the next theme to bring across,
                          after the federation work [owner's
                          statement, 2026-10-25]. Strength: moderate.
                          It bears on effort to a correct result, not
                          on which option is right in the end. It does
                          not change at ten times the size.

