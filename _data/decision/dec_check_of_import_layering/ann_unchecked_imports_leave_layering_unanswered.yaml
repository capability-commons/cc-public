title:                  Layering with nothing to check it
brief:                  |
                        With no import check, nothing answers whether
                        a module depends on a part it should not. Both
                        checks answer it, and import-linter also
                        follows chains through other modules, which a
                        rule over the graph must reproduce to give the
                        same result. Neither sees an import made by
                        name at run time, and one module makes two
                        such imports today.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (nothing checks imports on dev).
                        - The import-linter layers contract includes
                          indirect imports, that is chains of imports
                          via other modules
                          [https://import-linter.readthedocs.io/en/stable/contract_types/layers/].
                        - The graph module of facts imports
                          cctool.cli.command and cctool.check.check by
                          name at run time, because each imports it in
                          turn [src/cctool/graph/tool.py at
                          NAME_COMMAND, NAME_CHECK and functions facts
                          and _command_line].
                        - The import-linter layers page does not
                          mention imports made at run time
                          [https://import-linter.readthedocs.io/en/stable/contract_types/layers/].
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (the extractor parses each module).
                        - ASSUMPTION: a rule over the graph reports an
                          indirect chain only if it is written to
                          follow one. Strength: strong against having
                          no check. It grows at ten times the size,
                          where more modules make a wrong-way import
                          harder to see in review.

