title:                  Check of import layering
brief:                  |
                        How is it checked that a module imports only
                        from the parts of the tooling it may depend
                        on?
description:            |
                        September configured import-linter with a
                        contract of layers in pyproject.toml. On dev
                        nothing checks imports, and modules are items
                        whose packages sit under logical components
                        only by convention.

