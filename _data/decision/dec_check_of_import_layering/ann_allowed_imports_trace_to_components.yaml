title:                  Allowed dependencies traced to components
brief:                  |
                        A rule over the graph makes each module's
                        component an edge, and each allowed dependency
                        a relation between components. Each allowed
                        import then traces to a component and the
                        concerns that drive it. A layer list in
                        pyproject.toml names packages that no graph
                        item explains.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (components by convention, no import check).
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (only the root package names lco_tooling).
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (what the graph rule option adds).
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (September's twelve layers).
                        - A logical component on dev names its driving
                          concerns by relation_is_driven_by, as
                          lco_verification does
                          [_data/logical_component/lco_verification.yaml
                          at edge]. Strength: Strong, and stronger at
                          ten times the size, when the layer list
                          grows and the reasons for its order are
                          lost. The no check option leaves the
                          dependency direction with no traced reason
                          at all.

