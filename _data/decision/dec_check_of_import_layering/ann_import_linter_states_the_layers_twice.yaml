title:                  Layers declared in two places
brief:                  |
                        An import rule over the graph states which
                        part may depend on which once, beside the
                        logical components that already hold the
                        modules. import-linter states the same layers
                        again in pyproject.toml, a second place that
                        can drift from the components. The graph rule
                        costs more to build now: import facts,
                        component edges and a relation between
                        components.
description:            |
                        Sources:
                        - September declared one layers contract for
                          import-linter in pyproject.toml, a list of
                          twelve layers of package names
                          [origin/main:pyproject.toml at
                          tool.importlinter].
                        - An import-linter layers contract lists layer
                          modules from highest to lowest, and siblings
                          on one line separated by pipes
                          [https://import-linter.readthedocs.io/en/v2.1/contract_types.html].
                        - On dev, modules sit under logical components
                          only by convention, and nothing checks
                          imports
                          [_data/decision/dec_check_of_import_layering/dec_check_of_import_layering.yaml
                          at description].
                        - Only the top package realizes a logical
                          component today, lco_tooling, and a
                          subpackage such as the checker has no edge
                          [src/cctool/__init__.py at module docstring
                          edge, src/cctool/check/__init__.py at module
                          docstring edge].
                        - The extractor parses python modules but
                          records no import between them
                          [src/cctool/graph/extract.py at function
                          definitions, by search for ast.Import].
                        - The graph rule option adds import facts,
                          edges from modules to components and a
                          relation between components
                          [_data/decision/dec_check_of_import_layering/opt_import_rule_over_the_graph.yaml
                          at brief].
                        - No relation in the register says that one
                          component may depend on another
                          [_data/register/reg_relation.yaml, list of
                          entries].
                        - relation_is_part_of already records a
                          breakdown of logical components
                          [_data/register/reg_relation.yaml at
                          entries.relation_is_part_of].
                        - Dev's lint stage runs ruff alone, and
                          import-linter is not a dependency on dev
                          [src/cctool/gate/gate.py at TUPLE_STAGE,
                          pyproject.toml at dependencies and
                          tool.pixi.dependencies, pixi.lock with no
                          entry for import-linter].
                        - cctool impact lists the items a change
                          touches and the items linked to them
                          [AGENTS.md at section Finding things out].
                          Strength for concern_maintainability:
                          Moderate. With the rule over the graph a
                          change to the architecture is one edit in
                          the graph that impact can show. With
                          import-linter it is an edit in a table that
                          names packages, not components. The build
                          cost of the graph rule is real: import
                          facts, a relation, a rule and an edge on
                          each package. At ten times the packages the
                          second place to keep grows with them, which
                          favors the graph rule. Strength for
                          concern_simplicity: moderate. No check is
                          the fewest mechanisms, at the cost of
                          nothing checking imports. import-linter adds
                          a tool and a second statement of the layers.
                          The graph rule adds three things to one
                          place. Two statements of layering drift
                          further apart as modules grow tenfold.

