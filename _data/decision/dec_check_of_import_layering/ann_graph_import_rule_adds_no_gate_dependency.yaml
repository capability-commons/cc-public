title:                  Gate availability under each import check
brief:                  |
                        An import cycle can stop the command line from
                        loading, and the code already works around one
                        by importing at run time, so a check of
                        direction guards the tool's availability. A
                        rule over the graph runs inside the check
                        stage on syntax trees the extractor already
                        builds, while import-linter adds a third-party
                        tool to the lint stage whose own failure would
                        stop the gate.
description:            |
                        Sources:
                        - The graph module of facts defers its imports
                          of the command line and the checks because
                          each of those imports it in turn
                          [src/cctool/graph/tool.py at module
                          docstring].
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (the lint stage runs ruff only).
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (the extractor parses each module).
                        - The check store keeps only what the layout
                          check and schema validation found, and
                          reuses those verdicts for files unchanged
                          since the last check by the same code; it
                          keeps no result of the rules
                          [src/cctool/check/store.py at module
                          docstring].
                        - The extractor reuses the documents of a file
                          whose digest is unchanged
                          [src/cctool/graph/extract.py at MAP_READ and
                          its comment].
                        - September pinned import-linter at 2.15 or
                          later, below 3 [origin/main:pyproject.toml
                          at optional dependency lint].
                        - Atlas runs Python 3.15 [measured by Claude
                          in the cloud container, 2026-10-26].
                        - ASSUMPTION: Python raises an error at load
                          time when two modules import each other at
                          top level and one uses a name the other has
                          not yet defined.
                        - import-linter 2.15 is pure python, needs
                          Python 3.10 or later and lists versions up
                          to 3.14; grimp 3.17 lists Python 3.15 and
                          ships cp315 wheels for linux x86_64, but for
                          macOS only free-threaded cp315t wheels
                          [https://pypi.org/pypi/import-linter/json,
                          https://pypi.org/pypi/grimp/json]. Strength:
                          moderate. A rule over the graph is new code
                          that must itself be verified, which counts
                          against it. At ten times the size both
                          options scale. The rule shares the
                          extractor's reuse of unchanged documents,
                          but the check store does not keep the
                          results of rules, so the rule runs afresh on
                          each check.

