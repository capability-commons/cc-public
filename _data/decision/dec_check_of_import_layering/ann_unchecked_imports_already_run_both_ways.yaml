title:                  Package imports that already run both ways
brief:                  |
                        With nothing checking imports, two pairs of
                        packages already import each other. A change
                        in one of each pair can spread to the other,
                        and either kind of check would have to start
                        by fixing or excusing them.
description:            |
                        Sources:
                        - The checker imports the editor and the
                          release package [src/cctool/check/check.py,
                          the imports of cctool.edit.layout and
                          cctool.release.record].
                        - The editor imports the checker
                          [src/cctool/edit/edit.py, the import of
                          cctool.check.check, and
                          src/cctool/edit/layout.py, the import of
                          cctool.check.store].
                        - The release package imports the checker
                          [src/cctool/release/release.py, the import
                          of cctool.check.check].
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (nothing checks imports on dev).
                        - The option of no check relies on review and
                          the tests to catch a dependency that runs
                          the wrong way
                          [_data/decision/dec_check_of_import_layering/opt_no_import_check.yaml
                          at brief].
                        - The maintainability concern asks how far a
                          change in one part spreads to others
                          [_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question].
                          Strength: Strong against no check. The
                          mutual imports exist now and no review or
                          test has reported them. A layers contract,
                          or a rule over components, would fail on day
                          one until they are fixed or listed as
                          exceptions. At ten times the packages the
                          number of pairs that can tangle grows faster
                          than the packages.

