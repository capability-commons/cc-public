title:                  New third-party packages for an import check
brief:                  |
                        import-linter brings import-linter, grimp and
                        rich into the development environment, none of
                        which is in the lock today, and grimp ships
                        compiled Rust wheels per platform. A rule over
                        the graph needs only clingo and the standard
                        ast module, which cc-public already depends
                        on.
description:            |
                        Sources:
                        - import-linter 2.15 is under the BSD 2-Clause
                          license and requires click, grimp 3.17 or
                          later, rich 14.2 or later and
                          typing-extensions
                          [https://pypi.org/pypi/import-linter/json].
                        - import-linter lists one author, David Seddon
                          [https://pypi.org/pypi/import-linter/json at
                          author_email].
                        - grimp 3.17 is under the BSD 2-Clause
                          license, is classified as written in Rust,
                          and ships wheels per platform, including
                          macOS x86_64
                          [https://pypi.org/pypi/grimp/json].
                        - None of import-linter, grimp or rich is in
                          the lock file of dev today, while click and
                          typing_extensions are [pixi.lock, by search
                          for their names].
                        - Dev builds for osx-arm64, osx-64 and
                          linux-64 [pyproject.toml at
                          tool.pixi.workspace].
                        - clingo is a runtime dependency of cctool,
                          and the extractor already imports ast
                          [pyproject.toml at project dependencies,
                          src/cctool/graph/extract.py at its imports].
                        - The option of no check adds no dependency
                          [_data/decision/dec_check_of_import_layering/opt_no_import_check.yaml
                          at brief]. Strength: Moderate. The licenses
                          are permissive (ASSUMPTION: BSD 2-Clause is
                          compatible with distributing cc-public under
                          Apache-2.0, as is usual for permissive
                          licenses). The risk is three new packages,
                          one with a compiled core that must keep
                          building for each platform, and a project
                          with one listed author. The tool is a
                          development dependency only, so a withdrawal
                          stops the check and not the shipped tool.
                          The count does not grow with the size of
                          cc-public.

