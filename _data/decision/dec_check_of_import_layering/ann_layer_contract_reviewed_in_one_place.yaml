title:                  Layer contract readable in one place
brief:                  |
                        With no check, a reviewer must catch every
                        wrong-way import by reading. import-linter
                        puts the whole rule in one list of about a
                        dozen lines. The rule over the graph first
                        adds a component edge to each package or
                        module, a change spread over many files.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_unchecked_imports_already_run_both_ways
                          (no check relies on review and tests).
                        - Also rests on a source stated once in
                          ann_import_linter_states_the_layers_twice
                          (September's twelve layers).
                        - Also rests on a source stated once in
                          ann_import_check_adds_no_wall_time (70
                          python modules).
                        - An edge in a docstring item takes four lines
                          [src/cctool/__init__.py at module docstring
                          edge].
                        - ASSUMPTION: the rule needs a component edge
                          on each package item, which is about ten
                          edges, rather than on each module, which is
                          about 70. Strength: Moderate against no
                          check, and moderate against the first change
                          the graph rule needs. At ten times the size
                          the case for import-linter weakens, since
                          the graph rule's edges then arrive one at a
                          time with each new module or package.

