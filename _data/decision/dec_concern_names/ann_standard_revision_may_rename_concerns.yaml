title:                  Renames forced by later editions of 25010
brief:                  |
                        Tying ids and titles to one edition of ISO/IEC
                        25010 means a revision that renames a
                        characteristic brings another rename like
                        7053bfa. Plain names do not change when the
                        standard does.
description:            |
                        Between 25010:2011 and 25010:2023 portability
                        became flexibility, usability moved to the
                        quality in use model with interaction
                        capability as the product characteristic, and
                        flexibility gained scalability
                        (memory/MEMORY.md line 4; 7053bfa message).
                        Interoperability was already part of
                        compatibility in 2011. Usability and
                        portability, two of the plain names, are 2011
                        names. Three chosen names are the same in both
                        editions. ASSUMPTION: 25010 will be revised
                        again within the life of cc-public, may rename
                        characteristics, and the project would follow.
                        No source gives a date. Editions are years
                        apart.

