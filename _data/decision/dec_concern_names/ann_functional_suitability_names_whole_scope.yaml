title:                  Standard name covering the described scope
brief:                  |
                        The title Correctness named only part of what
                        its own description covered. Functional
                        suitability names the whole scope, so an
                        advocate reading the title is less likely to
                        argue only accuracy.
description:            |
                        Before the rename, the entry titled
                        Correctness described "whether each function
                        gives the right result, does everything it is
                        meant to do, and does nothing it is not meant
                        to do" (fed3da5,
                        _data/register/reg_concern.yaml). Its
                        questions ask about completeness too (current
                        file lines 70-72). In 25010:2023 correctness
                        is a part of functional suitability, beside
                        completeness and appropriateness
                        (memory/MEMORY.md line 4;
                        https://iso25000.com/index.php/en/iso-25000-standards/iso-25010).
                        Advocates are briefed from the concern entry
                        (templates/advocate.md line 10). ASSUMPTION:
                        an advocate weighs the title when it decides
                        what ground its concern covers. Not tested.

