title:                  Old plain ids kept as checked aliases
brief:                  |
                        Each renamed concern keeps its guid and lists
                        its old id as an alias. An old reference can
                        be followed to the current entry, and the
                        checker reports it with the new id.
description:            |
                        guid_self is unchanged across 7053bfa (git
                        show 7053bfa, reg_concern.yaml hunk at line
                        46). Old ids are in alias
                        (_data/register/reg_concern.yaml lines 81-82,
                        197, 241, 285, 325). A mention of the old
                        Correctness id is reported as outdated_mention
                        and an edge to it as outdated_reference, each
                        naming concern_functional_suitability
                        (src/cctool/check/_test/test_check.py lines
                        573-588). An alias used as an id is reported
                        as alias_in_use (src/cctool/check/check.lp
                        line 482). The extractor turns each alias into
                        a fact (src/cctool/graph/extract.py lines
                        151-152, 421-422). These checks came later:
                        the tree at 7053bfa holds no src/ files, so no
                        checker or cctool existed then (git ls-tree -r
                        7053bfa). Text outside the graph, such as chat
                        and older commit messages, still names the old
                        ids.

