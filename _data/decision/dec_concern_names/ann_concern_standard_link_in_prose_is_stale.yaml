title:                  Concerns now citing their standard by an edge
brief:                  |
                        ann_concern_trace_to_standard_is_prose says
                        the link from a concern to its standard is
                        free text, each concern has an empty edge
                        list, and no type stands for a standard.
                        Concerns now cite standards by relation_cites
                        edges to external document items.
description:            |
                        In _data/register/reg_concern.yaml, 18 of the
                        19 concerns carry a relation_cites edge; all
                        nine ISO/IEC 25010 concerns cite
                        extdoc_iso_iec_25010_2023, and only
                        concern_simplicity has none.
                        type_external_document (prefix extdoc) is in
                        _data/register/reg_data_item_type.yaml, and
                        _data/external_document holds 17 such items.
                        relation_cites constrains its target to
                        relcon_is_proxy, which constraint_violation
                        checks. Found in the review of 2026-10-22.

