title:                  Functional suitability questions brought in line
brief:                  |
                        Commit 8641a04 "Fix
                        concern_functional_suitability so that its
                        questions match its description" adds a
                        question on helping users complete their
                        tasks. At 360ec14 the brief no longer
                        disagrees with itself on that part.
description:            |
                        The questions now ask whether each function
                        gives the right result, whether every needed
                        function is present and whether the functions
                        help users complete their tasks, one for each
                        part of the description
                        (_data/register/reg_concern.yaml at
                        entries.concern_functional_suitability.description
                        and
                        entries.concern_functional_suitability.question
                        at 360ec14). "Does the design do anything it
                        should not?" is still the fourth question.

