title:                  Prose under standard names needs the full text
brief:                  |
                        Accurate plain prose under a standard name
                        needs the standard's own definitions, and only
                        a preview of 25010:2023 was held when the
                        names were chosen.
description:            |
                        The 25010:2023 copy held was a preview to
                        clause 3.4, with purchased copies to follow
                        (maintainer's statement 2026-10-13T19:47:13Z;
                        memory/MEMORY.md line 4). Concern citations so
                        far are from public titles and scope
                        (memory/MEMORY.md line 16). Weak: the purchase
                        follows from the standards-informed default,
                        not from the naming choice alone, and the cost
                        is one-off per edition.

