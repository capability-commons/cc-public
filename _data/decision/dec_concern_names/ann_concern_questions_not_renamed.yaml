title:                  Question list left behind by the rename
brief:                  |
                        The rename rewrote the functional suitability
                        description to the standard's three parts but
                        kept the old question list, so the advocate's
                        brief disagrees with itself.
description:            |
                        7053bfa dropped "does nothing it is not meant
                        to do" and added "whether the functions help
                        users complete their tasks" (git show
                        7053bfa). The questions still ask "Does the
                        design do anything it should not?" and none
                        asks about helping users complete tasks
                        (_data/register/reg_concern.yaml lines 70-72).
                        In the same commit compatibility and
                        flexibility did get new questions. This
                        challenges the change as carried out, not the
                        choice itself. It is a one-entry fix.

