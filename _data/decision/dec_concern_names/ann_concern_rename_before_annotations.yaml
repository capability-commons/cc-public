title:                  Small rename before any annotation named a concern
brief:                  |
                        The switch to standard names was one small
                        change made before any annotation pointed at a
                        concern. The same rename later would touch
                        every annotation that names the renamed
                        concerns.
description:            |
                        7053bfa changes 3 files, 83 insertions and 61
                        deletions (git show --stat 7053bfa). Its tree
                        holds no ann_ files (git ls-tree -r
                        --name-only 7053bfa). At HEAD 89c74d8, 24 of
                        29 annotation files carry an
                        r_speaks_for_concern edge, and the five new
                        ids appear in 9 files, 5 of them annotations
                        (grep over the clone). The owner concurred at
                        2026-10-13T19:52:10Z and the commit is dated
                        19:54:00 the same day. cctool rename and the
                        alias checks keep a later rename mechanical
                        (src/cc_public/edit/edit.py lines 722-727),
                        but its diff grows with the graph.

