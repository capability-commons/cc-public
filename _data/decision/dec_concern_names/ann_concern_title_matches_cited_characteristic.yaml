title:                  One name for each concern and its cited source
brief:                  |
                        Under plain names, five concerns had a title
                        in their own words and a note citing a
                        different 25010 characteristic. Standard names
                        make the title, id and cited characteristic
                        the same.
description:            |
                        Before 7053bfa the titles were Correctness,
                        Performance, Usability, Interoperability and
                        Portability, while each note said it
                        "Corresponds to" functional suitability,
                        performance efficiency, interaction
                        capability, compatibility and flexibility of
                        ISO/IEC 25010:2023 (git show
                        7053bfa^:_data/register/reg_concern.yaml,
                        lines 54/64, 165/175, 202/212, 238/248,
                        274/284). Reliability, Security,
                        Maintainability and Safety already matched, so
                        plain names left the nine 25010 concerns under
                        two naming rules. After 7053bfa every such
                        title matches its note
                        (_data/register/reg_concern.yaml lines 64,
                        102, 141, 178, 223, 265, 306, 345, 381). In
                        25010:2023 interoperability is part of
                        compatibility, correctness part of functional
                        suitability, and usability belongs to ISO/IEC
                        25019 (memory/MEMORY.md line 4). A mismatch
                        would repeat in every annotation that argues
                        for the concern.

