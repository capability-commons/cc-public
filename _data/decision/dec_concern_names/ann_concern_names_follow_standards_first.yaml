title:                  Maintainer's concurrence with standard names
brief:                  |
                        The maintainer chose the standard names. The
                        record gives no reason specific to naming; his
                        general reason is that a standards-informed
                        position is a good starting point.
description:            |
                        Maintainer's statement, 2026-10-13: "OK. I
                        concur. Use the standard names and update the
                        repository to bring it into line." This
                        answers his question: "Plain or
                        standards-compliant? And why?" The argument he
                        concurred with is not in the record. His
                        general reason is decision B2, maintainer's
                        statement 2026-10-13: "lean more toward being
                        standards-informed, which I think is a good
                        starting position". Change: 7053bfa.

