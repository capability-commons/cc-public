title:                  Merge step needed to share premises
brief:                  |
                        Arguments are gathered one concern at a time,
                        so a premise is shared only if someone notices
                        the overlap and merges it, an extra step on
                        every issue.
description:            |
                        In the process used to record these arguments,
                        each advocate speaks for one concern and is
                        asked to keep premises neutral "so another
                        concern could rest on it too" (advocate
                        template, lines 3 and 27, kept in the working
                        session, not in the repository). ASSUMPTION:
                        later issues are argued the same way.
                        ASSUMPTION: the merge effort per issue grows
                        with the number of advocates; it is not
                        measured. It reduces the saving but is paid
                        once, where duplicates would be kept.

