title:                  Concern edges with no text of their own
brief:                  |
                        A shared annotation states its fact once but
                        not why it bears on each concern, so a
                        reviewer cannot judge from the text whether
                        each concern edge is warranted.
description:            |
                        ann_souffle_is_outside_the_locked_environment
                        speaks for four concerns (lines 41-59) and its
                        brief and description name none of them (lines
                        11-27). A concern edge is ids and guids only.
                        The edge "says which concern an argument
                        speaks for, not who made it or whether it is
                        sound" (_data/register/reg_relation.yaml lines
                        287-288). ASSUMPTION: which advocate proposed
                        which edge of a merged annotation is kept only
                        in the session, not in the repository.

