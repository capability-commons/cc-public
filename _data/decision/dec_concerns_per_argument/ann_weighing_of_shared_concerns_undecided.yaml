title:                  Weighing of shared concerns left undecided
brief:                  |
                        Nothing yet says how the several concerns of
                        one annotation are weighed together, so an
                        evaluation of the graph could not yet say
                        which concern carried a decision. With one
                        concern per argument, the weighing reduces to
                        ranking the concerns, as in value-based
                        argumentation.
description:            |
                        "How the concerns of one annotation are
                        weighed together is left to the evaluation"
                        (_data/register/reg_relation.yaml at
                        entries.relation_supersedes.edge, which also
                        cite Bench-Capon 2003 for one value per
                        argument). No code in src weighs concerns: the
                        rules that read relation_speaks_for_concern
                        are argued, argument_without_concern and the
                        check that an annotation bearing on no option
                        names no concern (src/cctool/check/check.lp).
                        The stated purpose is to "understand which
                        engineering concern was under- or over-
                        represented" (maintainer's statement,
                        2026-10-13). ASSUMPTION: evaluation may later
                        be automated, which would make the weighing
                        rule a mechanism to build.

