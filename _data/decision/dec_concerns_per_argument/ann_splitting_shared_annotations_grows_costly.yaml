title:                  Reversal cost that grows with the data
brief:                  |
                        Going back to exactly one concern means
                        splitting every shared annotation into one
                        annotation per concern, and that work grows
                        with each one written.
description:            |
                        Each rule change was small in code: d03026b
                        touched 6 files (+57, -29) and aa23286 4 files
                        (+57, -31), by git --stat. d03026b also needed
                        two data items edited by hand. Four
                        annotations now speak for more than one
                        concern (at 89c74d8). Maintainer's statement,
                        2026-10-14T18:58:47Z: "let's try it and see
                        where it leads us". No edit command splits an
                        annotation; a split takes new, link and unlink
                        operations for each copy
                        (src/cctool/cli/editing.py).

