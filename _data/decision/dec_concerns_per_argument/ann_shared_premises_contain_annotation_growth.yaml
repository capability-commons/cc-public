title:                  Shared premises contain annotation growth
brief:                  |
                        A premise several concerns rest on is written,
                        read and kept once, not once per concern,
                        which keeps the number of annotations in hand.
description:            |
                        Maintainer's statement, 2026-10-14T21:51:15Z:
                        "Maybe we should allow more than one concern
                        per annotation and share them across concerns.
                        I do feel that annotations might quickly
                        explode out of control, so this is probably
                        going to be a wise step to contain the
                        explostion". The commit that made the change
                        gives the same reason: a shared premise "is
                        stated and challenged once, and the number of
                        annotations stays in hand" (commit aa23286).
                        Proposed also by the advocates for cost,
                        reviewability and simplicity.

