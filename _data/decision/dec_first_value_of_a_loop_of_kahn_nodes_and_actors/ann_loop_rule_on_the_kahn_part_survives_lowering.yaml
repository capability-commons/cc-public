title:                  Loop rule computed on the Kahn part, unchanged by lowering
brief:                  |
                        Under the absent option, whether a feedback
                        edge needs a default depends only on loops
                        among Kahn nodes, that is, on the graph with
                        the edges into actors left out, the graph the
                        trial's ordering check already used. Under the
                        needs-a-default option, a loop of actors
                        placed across two units gains an inserted
                        sender and receiver and becomes a mixed loop
                        that the lowered check refuses for a default
                        the authored loop never needed, as lowering's
                        own wiring broke the build with a mode
                        controller in the trial. The checks, as read,
                        also show the cost of the present wording: the
                        trial's passes a mixed loop with no edge
                        marked and fails it once an author marks an
                        edge with a Kahn end as feedback with no
                        default, and dev's refuses it unmarked.
description:            |
                        Sources:
                        - Wherever placement splits an edge, lowering
                          puts a sender and a
                          receiver on it, each invoked once in every local step
                          (_data/requirement/rqt_lowering_inserts_transport.yaml at brief;
                          _data/interface_control_document/icd_dataflow_transport.yaml at
                          surface.sender.dataflow_step.invocation and
                          surface.receiver.dataflow_step.invocation).
                        - The needs-a-default option requires a
                          default of any loop that
                          passes through a Kahn node
                          (_data/decision/dec_first_value_of_a_loop_of_kahn_nodes_and_actors/opt_mixed_loop_needs_a_default.yaml
                          at brief).
                        - An inserted Kahn node brings a loop of
                          actors under the default
                          rule
                          (_data/decision/dec_first_value_of_an_actor_loop/ann_inserted_kahn_node_changes_the_rule_of_a_loop.yaml
                          at brief).
                        - Lowering's own feedback edge from the mode
                          controller failed the
                          lowered default check (review of 2026-10-29, CC-023).
                        - The trial's ordering check leaves out edges
                          into actors, and its
                          default check exempts a feedback edge only when both ends are
                          actors, as read from the code (trial 2c777ab9,
                          src/cctool/dataflow/checks.py, functions order_loops and
                          _check_loops).
                        - Dev's check refuses any loop with no
                          feedback edge and knows nothing
                          of actors (repository src/cctool/check/check.lp, rule
                          feedforward_loop).
                        - Development will move nodes between units
                          until they are balanced
                          (WTP, 2026-10-28, as recorded in
                          _data/decision/dec_same_step_or_next_step_reading/ruling_reading_derived_by_placement.yaml
                          at description).
                        - Flexibility asks whether the design can be
                          scaled as the load
                          changes; maintainability asks how far a change in one part spreads
                          (_data/register/reg_concern.yaml at
                          entries.concern_flexibility.question and
                          entries.concern_maintainability.question).
                        ASSUMPTION: an edge between two actors in
                        different units is split by transport like any
                        other edge; the records do not yet say how
                        actors in two units exchange messages.
                        Strength: moderate; it rests on lowering
                        inserting Kahn nodes into paths between
                        actors, which the records imply but do not
                        state for actors.

