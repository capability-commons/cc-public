title:                  Engine recheck of change sets with no search through actors
brief:                  |
                        The engine repeats the checks that keep it
                        safe on every change set it receives, since a
                        change set could be stale or corrupted in
                        transit. Under the absent option a change set
                        that closes a loop through an actor with no
                        default cannot stall the engine, because the
                        crossing supplies an empty token, so nothing
                        about such loops needs repeating. Under the
                        needs-a-default option the engine must either
                        search for loops through actor routes in every
                        change set it receives, more code exposed to
                        input from outside, or accept change sets that
                        cctool would refuse, which the ruling that
                        both check a change set means to avoid.
description:            |
                        Sources:
                        - The engine does not trust a change set
                          because cctool checked it,
                          and repeats the checks that keep it safe, which are cheap to repeat
                          (_data/requirement/rqt_dynamic_rechecks.yaml at brief and
                          rationale).
                        - A change set is checked by cctool before it
                          is sent and by the
                          runtime before it is applied
                          (_data/decision/dec_change_set_at_a_step/ruling_change_set_checked_by_both.yaml
                          at brief).
                        - Crafted runtime control input has crashed
                          the trial engine (review
                          of 2026-10-29, CC-046).
                        - Security asks what an attacker can reach and
                          what it would cost
                          (_data/register/reg_concern.yaml at
                          entries.concern_security.question).
                        ASSUMPTION: under either option the engine
                        would recheck loops among Kahn nodes, since
                        such a loop with no first value stalls a unit.
                        Strength: weak; a search for loops is small
                        code, and the engine's recheck list does not
                        yet cover feedback defaults under either
                        option.

