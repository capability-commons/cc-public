title:                  Empty first value that needs no value of the loop's type
brief:                  |
                        An empty token is a count of 0 and needs no
                        value of the type the edge carries. A default
                        needs a node that can make a value of that
                        type, and some types may have no value that is
                        right as a first value everywhere, such as a
                        camera frame or a handle to a resource. Where
                        such a type is defined by or wraps a
                        third-party library, the needs-a-default
                        option makes the loop's first value depend on
                        that library's code at start-up and after
                        every swap, and a change in the library
                        changes it. The absent option takes nothing
                        from the library for the first step of a mixed
                        loop.
description:            |
                        Sources:
                        - A node that can make a default value of a
                          type makes every port of
                          that type able to supply one, and the engine primes the edge again
                          after a rewire or a version swap
                          (_data/decision/dec_default_values_on_feedback_edges/opt_default_from_a_port_that_declares_it.yaml
                          at brief).
                        - An existing argument assumes that some
                          types, such as a frame from
                          a camera or a handle to a resource, have no value right as a first
                          value everywhere
                          (_data/decision/dec_default_values_on_feedback_edges/ann_first_value_chosen_per_use_not_per_type.yaml
                          at description).
                        - A count of 0 means nothing arrived
                          (_data/interface_control_document/icd_dataflow_edge_message.yaml
                          at surface.data.artifact.artifact.message.convention).
                        - Dependency risk asks what happens if
                          something taken from a third
                          party changes (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question).
                        ASSUMPTION: some type that crosses between
                        actors and Kahn nodes in Patrol wraps a
                        third-party library, such as a tensor of an
                        inference runtime. Strength: weak; it rests on
                        types not yet drafted, and it falls away if an
                        empty default counts as a default under the
                        needs-a-default option.

