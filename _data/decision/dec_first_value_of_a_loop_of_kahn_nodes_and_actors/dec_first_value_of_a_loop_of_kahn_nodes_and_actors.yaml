title:                  First value of a loop of Kahn nodes and actors
brief:                  |
                        A loop that passes through both Kahn nodes and
                        actors: must its feedback edge have a default,
                        as a Kahn loop's must, or may it start absent,
                        as a loop of actors may?
description:            |
                        The upheld option on the first value of an
                        actor loop says that a loop which mixes Kahn
                        nodes and actors keeps the default rule
                        (opt_actor_loops_may_start_absent), and
                        opt_default_from_a_port_that_declares_it
                        refuses a feedback edge with no end that can
                        supply a default, including one across the
                        boundary between Kahn and actor nodes. Yet
                        rqt_checks_feedback_default applies only to a
                        loop that holds no actor, and
                        ruling_actor_loops_may_start_absent gives rise
                        to no requirement.
                        ann_empty_crossing_token_already_opens_a_mixed_loop
                        argues that the requirement's rule is the
                        sound one (review of 2026-10-29, CC-054).

