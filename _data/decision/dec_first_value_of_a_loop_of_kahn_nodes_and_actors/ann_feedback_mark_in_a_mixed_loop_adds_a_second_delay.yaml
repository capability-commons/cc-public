title:                  Second step of delay when a mixed loop's mark lands on a Kahn edge
brief:                  |
                        A pass around a loop through an actor already
                        takes one local step, since what a Kahn node
                        writes in step s is handled in the gap after
                        it and read in step s+1. Dev's check refuses
                        any loop with no feedback edge, and the
                        needs-a-default option does not say which edge
                        of a mixed loop carries the default. If the
                        mark lands on an edge between two Kahn nodes,
                        that edge also reads the previous step, and
                        each pass takes two local steps, about 66 ms
                        at Patrol's camera rate instead of 33. Under
                        the absent option the crossing can be the
                        loop's only delay.
description:            |
                        Sources:
                        - Actors run in the gaps between local steps,
                          and an edge from actors
                          to a Kahn node gives the one message the next local step reads
                          (_data/decision/dec_how_actors_are_run/ruling_actors_between_steps.yaml
                          at brief;
                          _data/interface_control_document/icd_dataflow_actor_message.yaml
                          at surface.data.artifact.batching).
                        - A feedback edge carries the message of the
                          previous local step
                          (_data/requirement/rqt_executor_feedback_previous.yaml at object).
                        - Dev's check refuses a loop of feedforward
                          edges, with no exception
                          for actors (repository src/cctool/check/check.lp, rule
                          feedforward_loop).
                        - At Patrol's camera rate of 30 Hz a local
                          step is about 33 ms
                          (_data/decision/dec_messages_handled_in_an_actor_gap/ann_admission_at_the_gap_start_adds_a_step_per_hop.yaml
                          at brief).
                        - Response time is a measure of performance
                          efficiency
                          (_data/register/reg_concern.yaml at
                          entries.concern_performance_efficiency.measure).
                        ASSUMPTION: authors mark whichever edge is
                        convenient, since nothing tells them to mark
                        the crossing. Strength: weak to moderate; it
                        vanishes if the default rule names the
                        crossing from the actor as the edge that
                        carries the default.

