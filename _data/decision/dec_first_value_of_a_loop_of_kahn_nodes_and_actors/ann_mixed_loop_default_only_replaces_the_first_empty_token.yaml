title:                  Default at an actor crossing that only replaces the first empty token
brief:                  |
                        In a loop through an actor, the edge from the
                        actor into a Kahn node gives an explicit empty
                        token in any local step in which the actor
                        sent nothing, so the Kahn read never waits and
                        the loop cannot deadlock; the small model that
                        the review links to the actor loop ruling
                        showed the Kahn node reading the empty token
                        at step 0 and the actor's replies after. A
                        required default would therefore change only
                        the first local step, and the Kahn node must
                        still handle the empty token at every later
                        step in which the actor has not answered. What
                        the default puts there is a value no actor
                        sent, which the Kahn node cannot tell from a
                        real answer.
description:            |
                        Sources:
                        - A crossing turns the messages that arrived
                          into one token at the
                          start of a step, with an explicit empty token when none arrived
                          (_data/decision/dec_crossing_between_kahn_and_actors/opt_crossing_policy_on_the_edge.yaml
                          at brief).
                        - The default rule exists because a loop with
                          no first value
                          deadlocks at its first local step
                          (_data/requirement/rqt_checks_feedback_default.yaml at rationale).
                        - In the model of a Kahn node and an actor in
                          a loop with no first
                          value anywhere, the Kahn node read the empty token at step 0 and
                          the reply to step s at step s+1
                          (/mnt/project-files/notes/literature/actor-loop-experiments.py,
                          experiment E4, run again on 2026-10-29); the script only states,
                          without modeling it, that a loop of Kahn nodes alone with no first
                          value never runs a step (E5). The review notes that no record
                          holds the experiments the actor loop ruling cites, and that this
                          script is only in shared notes (review of 2026-10-29, CC-064).
                        - The trial zeroes an actor's outputs when its
                          gap opens and copies
                          them into Kahn inputs in the next local step, and its loop check
                          treats an edge into an actor as closing no loop (review of
                          2026-10-29, area report trial-engine, section 3; trial 2c777ab9,
                          src/cctool/dataflow/checks.py, function order_loops).
                        - The empty crossing token already opens a
                          mixed loop
                          (_data/decision/dec_first_value_of_an_actor_loop/ann_empty_crossing_token_already_opens_a_mixed_loop.yaml
                          at brief).
                        - Functional suitability asks whether the
                          design does anything it
                          should not; safety asks how the design avoids each hazard
                          (_data/register/reg_concern.yaml at
                          entries.concern_functional_suitability.question and
                          entries.concern_safety.question).
                        ASSUMPTION: a Kahn node that reads an actor's
                        answer, such as a planner's route, acts on a
                        default as it would on an answer. Strength:
                        moderate; it holds while every crossing policy
                        states its empty token, and the experiment is
                        a model of the rulings, not the engine.

