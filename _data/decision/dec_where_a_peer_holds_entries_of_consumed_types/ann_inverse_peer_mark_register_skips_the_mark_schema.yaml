title:                  Peer marks under the inverse option without authority or level
brief:                  |
                        The inverse option has the same schema gap
                        that round 1 found in the register-naming
                        option. A peer register that names
                        type_protective_mark by the inverse edge, and
                        names no schema, holds a mark with no
                        authority and no level, and cctool check
                        passes it. The option as written adds no rule
                        that ties the peer register to the mark
                        schema.
description:            |
                        Sources:
                        - Measured 2026-10-28 in a scratch copy: with
                          the inverse reading added to a copy of
                          cc-public, a peer register marked
                          mark_private that names type_protective_mark
                          by the inverse, has no edge of
                          relation_is_specified_by_schema, and holds
                          one mark with no authority and no level,
                          gives no failure under cctool check on the
                          peer except the fixture's mention of a
                          concept that copy no longer holds.
                        - Measured 2026-10-28 in the same copy: the
                          register is checked against sch_register,
                          the schema that type_register names for
                          every register, and not against
                          sch_reg_protective_mark.
                        - Measured 2026-10-28 in the same copy: with
                          the peer register naming
                          sch_reg_protective_mark, the same mark
                          fails, as authority and level are required.
                        - How a document takes its schema is cited in
                          ann_inverse_peer_entries_keep_shape_only_by_a_rule
                          (src/cctool/graph/derive.lp within
                          document_schema).
                        - That the inverse option changes no code of
                          the placement check is cited in
                          ann_cctool_new_picks_a_register_by_sort_order.
                        - The same gap under the register-naming
                          option is argued in
                          ann_peer_mark_register_skips_the_mark_schema.
                          Strength: strong, since it is measured, and
                          it holds at ten times the size for every
                          consumed type whose entries a schema
                          constrains. It falls if the option adds a
                          rule that ties the register to the type's
                          schema, as measured in
                          ann_home_schema_rule_needs_the_type_edge.

