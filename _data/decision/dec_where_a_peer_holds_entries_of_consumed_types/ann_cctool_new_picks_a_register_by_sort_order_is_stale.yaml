title:                  cctool new choosing the register of the edited tree
brief:                  |
                        The annotation says cctool new takes the first
                        register it finds in sorted order. Now cctool
                        new takes the register held in the tree being
                        edited, and refuses when that tree holds more
                        than one.
description:            |
                        _register (src/cctool/edit/edit.py within
                        _register) keeps only the registers whose file
                        no consumed segment holds, and raises an error
                        naming them when more than one is left. Found
                        in the weekly review of 2026-10-29.

