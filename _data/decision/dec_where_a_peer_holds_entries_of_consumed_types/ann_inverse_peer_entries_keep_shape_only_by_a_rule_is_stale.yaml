title:                  Shape of peer entries held by a check
brief:                  |
                        The annotation says no rule yet keeps the
                        entries of a peer register in the shape of the
                        home register. Now
                        peer_register_schema_differs holds it, so the
                        shape no longer rests on a rule still to be
                        written.
description:            |
                        See src/cctool/check/check.lp within
                        peer_register_schema_differs. Found in the
                        weekly review of 2026-10-29.

