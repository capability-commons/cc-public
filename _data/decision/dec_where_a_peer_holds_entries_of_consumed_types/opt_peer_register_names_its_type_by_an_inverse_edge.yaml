title:                  Peer registers that name their type by an inverse edge
brief:                  |
                        The register entry of
                        relation_has_items_held_in_register gains an
                        embedded inverse, so a register may name the
                        type whose entries it holds. Each type entry
                        keeps naming its register in cc-public, and a
                        register in a peer names the consumed type by
                        the inverse edge. The placement check and
                        cctool new then accept the peer register as
                        one that holds the type, with no change to
                        their code, as measured by two advocates on
                        2026-10-26.

