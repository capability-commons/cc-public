title:                  Commit authors of a peer checked through one relation
brief:                  |
                        The commit checks authenticate an author and a
                        signing key against reg_team_member alone, so
                        a private member of a peer fails them under
                        every option. Under the inverse option the
                        check can find every register of members by
                        the one relation it already uses for
                        placement, and so check private members
                        without naming them in public. Under the
                        option of peer types the members have a type
                        cc-public does not know, so its checks cannot
                        authenticate them.
description:            |
                        Sources:
                        - The commit hooks refuse an author who is not
                          the git_author of a member, and report a
                          commit not signed with a member's
                          git_signing_key
                          (_data/register/reg_team_member.yaml at
                          description).
                        - The checks read only the document whose id
                          is reg_team_member
                          (src/cctool/commit/message.py within
                          ID_MEMBERS, _authors and _signing_keys).
                        - Measured 2026-10-28 in a scratch copy of a
                          peer that holds a private member by the
                          inverse edge: author_violations refuses that
                          member's git_author, and the member lookup
                          returns only the guid of
                          member_william_payne.
                        - That a query over primary_edge for
                          relation_has_items_held_in_register from
                          type_team_member returns both
                          reg_team_member and the peer's register is
                          measured in
                          ann_inverse_member_register_keeps_private_people_private.
                        - Under the option of peer types, a peer holds
                          no entries of a consumed type
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_defines_types_for_entries_of_its_own.yaml
                          at brief).
                        - The lookup problem for privacy is argued in
                          ann_peer_types_leave_private_members_unresolved;
                          this premise set is about authenticating who
                          acts.
                        - ASSUMPTION: the commit checks would be
                          changed to read members by the relation
                          rather than by register id. Strength:
                          moderate; every option needs a change to the
                          checks, and the inverse option makes it a
                          query over data already held. It holds at
                          ten times the size, as each private peer
                          with its own people meets it.

