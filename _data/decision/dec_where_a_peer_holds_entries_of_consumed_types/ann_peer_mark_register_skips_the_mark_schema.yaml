protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Peer marks held without the mark schema
brief:                  |
                        The schema that checks a register entry is the
                        one its register names, not one its type
                        names. If a peer register only has to name the
                        types it holds, a peer can hold protective
                        marks with no authority and no level, and they
                        pass every check. A register that extends a
                        consumed register takes that register's
                        schema, so a peer mark must still name its
                        authority and level.
description:            |
                        Sources:
                        - A register document takes its schema from
                          its own edge of
                          relation_is_specified_by_schema, and its
                          entries are checked as part of it
                          (src/cctool/graph/derive.lp within
                          document_schema).
                        - The schema of the protective mark register
                          checks each entry against the mark entry
                          schema, which requires authority and level
                          (_data/schema/sch_reg_protective_mark.yaml
                          at allOf;
                          _data/schema/sch_regentry_protective_mark.yaml
                          at required).
                        - Measured 2026-10-26 in a scratch copy: a
                          peer register with no schema edge, holding
                          one entry of type_protective_mark with no
                          authority and no level, fails only
                          misplaced_register_entry and
                          unformatted_file under cctool check run on
                          the peer.
                        - Under the option where registers name their
                          types, the placement check asks only that
                          the register an entry sits in names its type
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_register_names_the_types_it_holds.yaml
                          at brief).
                        - Under the extending option, a peer register
                          takes the schema of the consumed register it
                          extends
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_extends_a_consumed_register.yaml
                          at brief).
                        - A mark reference counts as resolved when any
                          item holds its id or guid, whatever that
                          item's type (src/cctool/check/advise.lp
                          within unresolved_mark).
                        - The protective mark register is a controlled
                          list in which each mark names its authority
                          and its level
                          (_data/register/reg_protective_mark.yaml at
                          description). Strength: strong for marks,
                          and the same gap opens for every consumed
                          type whose entries a schema constrains; it
                          holds at ten times the size. It falls if the
                          option where registers name their types also
                          requires the consumed register's schema,
                          which neither option text says today.

