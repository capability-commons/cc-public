title:                  Schema restated by every inverse peer register
brief:                  |
                        Under the inverse option a peer register
                        states its type by one edge and its schema by
                        another, and a check must keep the two in
                        step. An extending register gets both from one
                        edge. When cc-public changes the schema of a
                        home register, every inverse peer register
                        fails until it is edited, while an extending
                        register follows with no edit.
description:            |
                        Sources:
                        - That an extending register takes the schema
                          of the consumed register it extends is cited
                          in
                          ann_inverse_peer_entries_keep_shape_only_by_a_rule.
                        - Under the inverse option, the inverse edge
                          names only the type; the schema comes from
                          the register's own schema edge
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_names_its_type_by_an_inverse_edge.yaml
                          at brief; how a register takes its schema is
                          cited in
                          ann_inverse_peer_entries_keep_shape_only_by_a_rule).
                        - The trial rule that keeps the two in step,
                          and its results, are given in
                          ann_home_schema_rule_needs_the_type_edge
                          (measured 2026-10-28).
                        - Measured 2026-10-28: with the trial rule in
                          place, pointing the schema edge of
                          reg_concept at sch_register in a copy of
                          cc-public made the peer check fail the
                          fixture peer's concept register, which still
                          named sch_reg_concept.
                        - The extending option adds a new edge, a
                          placement rule that accepts it, and a rule
                          for which register cctool new writes into
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_extends_a_consumed_register.yaml
                          at brief). Strength: moderate. The extending
                          option pays once, in code, with a new
                          relation and more rule changes than the
                          inverse option plus one check; the inverse
                          option pays per peer register, in data, each
                          time a home schema changes. A rename of a
                          schema is carried by rename maps; a change
                          to another schema is not. It grows at ten
                          times the size, with peers times registers.

