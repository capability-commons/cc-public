title:                  Peer register held to the schema of the home register
brief:                  |
                        The annotation says cctool check passes a peer
                        register that gives no schema for its entries.
                        Now the check peer_register_schema_differs
                        fails a peer register whose schema is not that
                        of the type's own register.
description:            |
                        The rule reads the home register from the
                        type's own edge, and fails a peer register
                        that has no edge of
                        relation_is_specified_by_schema to the same
                        schema (src/cctool/check/check.lp within
                        peer_register_schema_differs). Found in the
                        weekly review of 2026-10-29.

