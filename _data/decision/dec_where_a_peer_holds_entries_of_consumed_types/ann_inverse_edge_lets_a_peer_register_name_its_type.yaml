title:                  Peer register named by an existing inverse edge
brief:                  |
                        Naming a peer register's type by an inverse
                        edge needs no new mechanism. The graph already
                        reads an edge recorded with an embedded
                        inverse as the primary edge, and both the
                        placement check and cctool new already follow
                        it. One inverse added to the entry of
                        relation_has_items_held_in_register in
                        cc-public, and one edge in the peer register,
                        clear the placement failure with no change to
                        code, while an extending register adds a
                        second relation and a second placement clause
                        for the same job.
description:            |
                        Sources:
                        - An edge recorded with an inverse is read as
                          the primary edge in the opposite direction
                          (src/cctool/graph/derive.lp within
                          primary_edge).
                        - The placement check asks only for a primary
                          edge of relation_has_items_held_in_register
                          from the type to the register
                          (src/cctool/check/check.lp within
                          misplaced_register_entry).
                        - cctool new finds the register of a new entry
                          from that relation in either direction,
                          including through an inverse
                          (src/cctool/edit/edit.py within _register).
                        - The relation register says an inverse is
                          minted when an item wants to record an edge
                          that way, and that in a federation the
                          direction decides who is able to record the
                          fact at all
                          (_data/register/reg_relation.yaml at note).
                        - The entry of
                          relation_has_items_held_in_register embeds
                          no inverse today
                          (_data/register/reg_relation.yaml at
                          entries.relation_has_items_held_in_register).
                        - Measured 2026-10-26 on copies in a scratch
                          folder: with an inverse reading added to
                          that entry in a copy of cc-public, and an
                          edge of that inverse from the fixture peer's
                          concept register to type_concept in a copy
                          of the peer fixture, the peer check went
                          from 6 failures to 5 and
                          misplaced_register_entry was gone; the type
                          entry kept its edge, and the rest were the
                          fixture's missing fields and layout.
                        - Measured 2026-10-26: in that peer, cctool
                          new with --dry-run for a new concept printed
                          a diff that adds the entry to the peer's
                          concept register (a dry run writes nothing);
                          in the unchanged fixture it refused, because
                          reg_concept is held by a consumed segment.
                        - The extending option adds an edge naming the
                          extended register, a placement rule that
                          accepts it, and a rule for which register
                          cctool new writes into
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_extends_a_consumed_register.yaml
                          at brief).
                        - Under the inverse option, each type entry
                          keeps naming its register in cc-public, and
                          a peer register names the consumed type by
                          the inverse edge
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_names_its_type_by_an_inverse_edge.yaml
                          at brief). Strength: strong for the first
                          peer, since it is measured. At ten times the
                          size it weakens where one tree reads two
                          registers that name the same type, because
                          cctool new takes the first edge in sorted
                          order and may pick a register of a consumed
                          segment.

