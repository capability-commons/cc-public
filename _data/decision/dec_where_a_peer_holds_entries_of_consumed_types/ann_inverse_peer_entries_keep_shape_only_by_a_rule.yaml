title:                  Shared entry shape under the inverse edge
brief:                  |
                        Under the inverse edge option a peer register
                        chooses its own schema, so a peer concept can
                        reach a partner without a preferred term,
                        which every consumed concept has. One added
                        rule, that a register holding a type names the
                        same schema as the register the type entry
                        names, closes the gap and was measured to
                        work. The option text does not include that
                        rule today, while the extending option takes
                        the consumed register's schema by its text.
description:            |
                        Sources:
                        - A register document takes its schema from
                          its type and from its own edge of
                          relation_is_specified_by_schema, and its
                          entries are checked as part of it
                          (src/cctool/graph/derive.lp within
                          document_schema).
                        - A concept entry must have term_preferred
                          (_data/schema/sch_regentry_concept.yaml at
                          required).
                        - Measured 2026-10-28 in a scratch copy of the
                          peer fixture, checked against a scratch copy
                          of the snapshot with the inverse added: a
                          peer register with no schema edge, naming
                          type_concept by the inverse, holding one
                          concept entry with no term_preferred, failed
                          only on its own missing register fields
                          under sch_register and on layout; no failure
                          named term_preferred or placement.
                        - The rule that closes the gap, and its
                          measurements, are given in
                          ann_home_schema_rule_needs_the_type_edge.
                        - That the inverse option needs no change to
                          the code of the placement check or cctool
                          new is cited in
                          ann_cctool_new_picks_a_register_by_sort_order.
                        - Under the extending option a peer register
                          takes the schema of the consumed register it
                          extends
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_extends_a_consumed_register.yaml
                          at brief). Strength: moderate as the option
                          stands; it falls if the rule joins the
                          option, at the cost of one rule in check.lp.
                          It holds at ten times the size, since each
                          peer register of a shared type is a place
                          the shape can drift.

