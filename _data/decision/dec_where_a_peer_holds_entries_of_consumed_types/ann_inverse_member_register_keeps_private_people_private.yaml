protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Private team members held by an inverse edge
brief:                  |
                        Under the inverse option a private peer holds
                        people it must not name in public as entries
                        of type_team_member, in a register document of
                        its own that carries mark_private. The check
                        accepts that register, cctool new writes a new
                        member into it, and cc-public gains only the
                        inverse reading, with nothing about the peer
                        or its people. One query over the existing
                        relation finds both the public and the private
                        register of members.
description:            |
                        Sources:
                        - The team member register is public, and a
                          member who should not be named in public is
                          held in the team member register of a
                          private repository instead
                          (_data/register/reg_team_member.yaml at
                          note).
                        - A team member entry holds a git_author with
                          a name and an email address, and a
                          git_signing_key
                          (_data/register/reg_team_member.yaml at
                          entries.member_william_payne).
                        - A mark is a property of the item, not of the
                          repository that holds it, and mark_private
                          is for an item holding personal data
                          (_data/register/reg_protective_mark.yaml at
                          entries.mark_private.note and
                          entries.mark_private.usage).
                        - Measured 2026-10-28 in a scratch copy: with
                          an inverse reading added to the entry of
                          relation_has_items_held_in_register in a
                          copy of cc-public, and a peer register
                          marked mark_private that names
                          type_team_member by that inverse and holds
                          one member with a git_author, cctool check
                          on the peer reports no
                          misplaced_register_entry; the one failure
                          left is the fixture's mention of a concept
                          that copy no longer holds.
                        - Measured 2026-10-28 in the same copy: cctool
                          new with --dry-run for a second member
                          prints a diff that adds it to the peer's
                          private register, not to reg_team_member.
                        - Measured 2026-10-28 in the same copy: a
                          logic query for every register R with
                          primary_edge from type_team_member to R by
                          relation_has_items_held_in_register returns
                          both reg_team_member and the peer's
                          register.
                        - An edge is held by the item that records it,
                          so the direction decides who is able to
                          record the fact in a federation
                          (_data/register/reg_relation.yaml at note).
                          Strength: strong for one private peer, since
                          it is measured end to end. It holds at ten
                          times the size, because each private peer
                          records its own edge in its own document and
                          cc-public never changes per peer.

