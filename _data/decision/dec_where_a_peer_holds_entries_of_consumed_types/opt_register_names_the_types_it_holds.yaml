title:                  Registers that name the types they hold
brief:                  |
                        The edge between a type and its register is
                        turned round: each register names the types
                        whose entries it holds, and a type entry names
                        no register. Any segment may hold a register
                        of entries of a consumed type, and the
                        placement check asks only that the register an
                        entry sits in names its type. cctool new
                        writes an entry into the register of its type
                        in the segment being edited.

