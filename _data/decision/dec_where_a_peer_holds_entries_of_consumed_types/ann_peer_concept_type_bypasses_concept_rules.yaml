title:                  A second concept type beside type_concept
brief:                  |
                        A peer type for its own concepts does the job
                        type_concept already does, so the system holds
                        two types for one kind of item. Several rules
                        and tools name type_concept or its prefix
                        directly, so they do not apply to the peer's
                        type unless each is repeated for it. The same
                        holds for any other consumed type a peer
                        copies, such as concerns.
description:            |
                        Sources:
                        - Under this option a peer that needs a
                          concept defines a type of its own, with its
                          own prefix and register
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_defines_types_for_entries_of_its_own.yaml
                          at brief).
                        - Rules that name type_concept by id: a
                          concept uses every other concept
                          (src/cctool/check/check.lp within
                          uses_concept), the brief of a concept is a
                          strict field (src/cctool/check/check.lp
                          within strict_field), and every concept is
                          named by some other item
                          (src/cctool/check/check.lp within
                          unused_concept).
                        - The advice on a missing genus names
                          type_concept by id
                          (src/cctool/check/advise.lp within
                          unrecorded_genus).
                        - Code takes the concept prefix from the map
                          of type_concept to widen a search and to
                          list the concepts an item uses
                          (src/cctool/graph/text.py within
                          PREFIX_CONCEPT; src/cctool/web/argument.py
                          within PREFIX_CONCEPT).
                        - Code takes the concern prefix the same way
                          (src/cctool/web/request.py within
                          PREFIX_CONCERN). Strength: moderate for one
                          peer type; strong at ten times the size,
                          since each peer copy of a consumed type
                          multiplies the rules that would need a
                          second clause.

