title:                  Where a peer holds entries of consumed types
brief:                  |
                        Where does a peer hold a register entry of a
                        type that a consumed segment defines, such as
                        a concept or a concern of its own, given that
                        today the type entry names the one register
                        that holds its items, and the check fails an
                        entry held anywhere else?

