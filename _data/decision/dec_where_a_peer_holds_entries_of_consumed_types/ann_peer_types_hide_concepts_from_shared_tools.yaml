title:                  Peer concepts and concerns unseen by shared tools
brief:                  |
                        The tools of cc-public find concepts and
                        concerns by their type or prefix. A concept or
                        concern that a peer holds under a type of its
                        own is not found by them, so the term checks,
                        the argument pages and the concern lists do
                        not use what a peer produces, and a partner
                        must learn each peer's types to read its
                        vocabulary. Under the options that keep the
                        consumed type, a measured peer concept is
                        already read as a concept by the shared term
                        checks.
description:            |
                        Sources:
                        - The rules and tools that name type_concept
                          or the concept and concern prefixes directly
                          are cited in
                          ann_peer_concept_type_bypasses_concept_rules.
                        - A relation constraint such as
                          relcon_is_concern is satisfied by any type
                          that plays rol_concern, not only by
                          type_concern
                          (_data/register/reg_relation_constraint.yaml
                          at entries.relcon_is_concern.description).
                        - Measured 2026-10-26 in a scratch copy: with
                          the peer fixture's register allowed to hold
                          type_concept entries, a dry run of cctool
                          new for a second peer concept reports that
                          its brief uses the term "patrol route",
                          which only the fixture's peer concept
                          defines, without a link.
                        - Partners' segments are expected among the
                          peers (owner's statement, 2026-10-24).
                          Strength: moderate; each tool could be
                          changed to read roles instead of type ids,
                          but every such tool, and every partner tool,
                          must then learn that rule. It holds at ten
                          times the size, since each peer adds types
                          the shared tools do not know.

