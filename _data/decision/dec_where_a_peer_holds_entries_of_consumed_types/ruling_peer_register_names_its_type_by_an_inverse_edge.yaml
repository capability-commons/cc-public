title:                  Peer registers that name their type by an inverse edge
brief:                  |
                        A register in a peer names the consumed type
                        whose entries it holds by an embedded inverse
                        of relation_has_items_held_in_register, and
                        each type entry keeps naming its own register.
                        The effective register of a type, as a segment
                        reads it, is the union of every register that
                        names the type along that segment's chain of
                        consumed segments back to cc-public, so each
                        segment has its own register and those
                        upstream of it. Every id stays unique across
                        that union, as already ruled; a downstream
                        entry does not override an upstream one,
                        though overriding may be added later. Ruled by
                        WTP on 2026-10-28.

