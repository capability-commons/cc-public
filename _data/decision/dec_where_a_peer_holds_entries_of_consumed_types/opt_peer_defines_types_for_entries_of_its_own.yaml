title:                  Types of the peer for entries of its own
brief:                  |
                        A peer holds no entries of a consumed type.
                        Where it needs a concept, a concern or another
                        entry of its own, it defines a type of its
                        own, with its own prefix and register, and the
                        placement rule stays as it is. An entry moves
                        into cc-public, under the consumed type, when
                        a second segment needs it.

