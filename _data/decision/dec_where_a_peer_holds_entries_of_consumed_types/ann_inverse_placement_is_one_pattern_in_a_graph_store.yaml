title:                  Placement as one pattern in a graph store
brief:                  |
                        A graph database segment and an MCP server are
                        planned. Under the inverse edge option, where
                        the entries of a type may be held is one edge
                        pattern that the graph store cctool already
                        uses answers in either direction, as measured.
                        Under the extending option the same answer
                        needs the type's edge and then a chain of
                        extending edges, a second rule that each new
                        host must carry.
description:            |
                        Sources:
                        - A graph database segment and an MCP server
                          are planned (owner's statements,
                          2026-10-24).
                        - cctool loads items into an in-memory
                          Oxigraph store as RDF triples; how it
                          records each inverse is cited in
                          ann_shared_query_readers_see_an_inverse_placement
                          (src/cctool/graph/sparql.py within store).
                        - Measured 2026-10-28 in the single-tree
                          scratch copy with the inverse: one SPARQL
                          triple pattern from type_concept by
                          relation_has_items_held_in_register returned
                          reg_concept and the second register, and the
                          pattern by the inverse returned the same
                          two.
                        - What the extending option adds to the
                          placement check is cited in
                          ann_inverse_peer_register_restates_its_schema.
                        - ASSUMPTION: a segment held in a graph
                          database runs its placement check as a query
                          over its own store rather than through
                          check.lp. Strength: weak today, since every
                          segment is files and a property path covers
                          the extending case; it rises when the first
                          segment not held as files is built, and
                          holds at ten times the size.

