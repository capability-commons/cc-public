protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  A mark-type rule that peer mark types would break
brief:                  |
                        The check accepts any item as a protective
                        mark, even a concept. A rule that a mark
                        reference must name an entry of
                        type_protective_mark closes that hole, and it
                        passes a peer's own marks under every option
                        that keeps the consumed type. Where a peer
                        defines a mark type of its own, its marks have
                        another type, so the rule would fail every one
                        of them, or would have to learn each peer's
                        type.
description:            |
                        Sources:
                        - A mark reference counts as resolved when any
                          item holds its id or guid, whatever that
                          item's type (src/cctool/check/advise.lp
                          within unresolved_mark).
                        - Measured 2026-10-28 in a scratch copy: a
                          peer segment item that carries
                          concept_federated_segment as a protective
                          mark passes cctool check, with no failure
                          about the mark.
                        - Measured 2026-10-28 in the same copy,
                          through cctool.graph.logic.run: a rule that
                          reports a mark reference whose target's type
                          is not type_protective_mark gives one row,
                          for concept_federated_segment, no row for a
                          peer mark held by the inverse edge, and no
                          row over cc-public.
                        - The type of an id is the type whose prefix
                          it has (cited in
                          ann_a_peer_type_entry_is_itself_a_consumed_type).
                        - Under the option of peer types, a peer
                          defines a type of its own with its own
                          prefix for entries it needs (cited in
                          ann_peer_type_entries_fail_the_placement_rule).
                        - A mark from a federated partner may be held
                          in that partner's own register
                          (_data/register/reg_protective_mark.yaml at
                          note).
                        - An unresolvable mark must be treated as more
                          restrictive than any resolvable one
                          (_data/register/reg_protective_mark.yaml at
                          note). Strength: moderate; the hole is in
                          every option today, but only the option of
                          peer types blocks the simple fix. It holds
                          at ten times the size, since each partner
                          with marks of its own adds a type the rule
                          would need to know.

