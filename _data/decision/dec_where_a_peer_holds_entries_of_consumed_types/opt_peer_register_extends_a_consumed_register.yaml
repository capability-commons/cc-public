title:                  Peer registers that extend a consumed register
brief:                  |
                        A register in a peer names, by a new edge, the
                        consumed register it extends, such as
                        reg_concept, and takes that register's schema.
                        The type entry keeps naming its one register,
                        and the placement check also accepts an entry
                        held in a register that extends it. cctool new
                        writes an entry into the extending register of
                        the segment being edited.

