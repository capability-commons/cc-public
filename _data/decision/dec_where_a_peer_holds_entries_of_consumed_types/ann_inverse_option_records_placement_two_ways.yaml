title:                  One placement fact recorded in two directions
brief:                  |
                        The inverse option needs no new code, but it
                        gives one fact two ways to be recorded: on the
                        type entry in cc-public and on the register in
                        a peer. Nothing checks that a fact is recorded
                        only once, and recording it both ways passes
                        the check. Registers that name their types
                        record placement in one direction everywhere.
description:            |
                        Sources:
                        - That no relation entry in cc-public embeds
                          an inverse today, though the schema allows
                          one, and that an edge may be recorded in
                          either direction and tooling reads it in
                          both, is sourced in
                          ann_first_inverse_in_the_data_misses_raw_readers.
                        - Under the inverse option, each type entry
                          keeps naming its register in cc-public, and
                          a peer register names the consumed type by
                          the inverse edge
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_names_its_type_by_an_inverse_edge.yaml
                          at brief).
                        - Measured 2026-10-28: in a copy of cc-public
                          with the inverse added, an edge of the
                          inverse from reg_concept to type_concept,
                          beside the edge type_concept already
                          records, left cctool check at 0 failures.
                        - The checks for things stated twice are
                          duplicate_prefix, duplicate_id,
                          duplicate_guid, repeated_item,
                          shared_exact_match, term_rated_twice and
                          input_fed_twice, with the advice
                          redundant_hierarchy_edge; none compares an
                          edge with its inverse
                          (src/cctool/check/check.lp within each of
                          those predicates; src/cctool/check/advise.lp
                          within redundant_hierarchy_edge; listed
                          2026-10-28 from the shown predicates of both
                          files).
                        - Under the option of registers that name
                          their types, each register names its types
                          and no type entry names a register (cited in
                          ann_turned_edge_touches_every_register_and_new).
                          Strength: moderate. It adds a convention,
                          not a mechanism, and a one-rule check could
                          forbid the second direction, which is itself
                          one more rule. It holds for registers that
                          name their types only if the turned edge is
                          a relation whose source is the register, not
                          an inverse. It holds at ten times the size,
                          since each new register can pick either
                          direction.

