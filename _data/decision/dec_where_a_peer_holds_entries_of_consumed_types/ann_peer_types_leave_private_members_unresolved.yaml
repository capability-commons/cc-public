title:                  Private team members outside the member type
brief:                  |
                        A person who must not be named in public
                        belongs in the team member register of a
                        private peer. If a peer may hold no entries of
                        a consumed type, such a person becomes an
                        entry of a peer type that no member lookup
                        knows, and the only way to count as a team
                        member is to be listed in public. The other
                        options keep the person an entry of
                        type_team_member in the peer, which a lookup
                        can find by the type or by the register that
                        names or extends it.
description:            |
                        Sources:
                        - The team member register is public, and a
                          member who should not be named in public is
                          held in the team member register of a
                          private repository instead
                          (_data/register/reg_team_member.yaml at
                          note).
                        - The commit message check finds the members
                          by the register id reg_team_member, and
                          takes the first document with that id
                          (9449dfac:src/cctool/commit/message.py within
                          ID_MEMBERS and _members).
                        - Measured 2026-10-26 in a scratch copy: a
                          peer register of team members holding one
                          member sits in the union beside cc-public's
                          register, the member lookup over that union
                          returns only the guid of cc-public's member,
                          and cctool check fails the peer entry as
                          misplaced_register_entry.
                        - Under the option where a peer defines types
                          of its own, a peer holds no entries of a
                          consumed type
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_defines_types_for_entries_of_its_own.yaml
                          at brief).
                        - Under the register-naming and extending
                          options, an entry of a consumed type sits in
                          a peer register that names the type, or that
                          names the consumed register it extends
                          (_data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_register_names_the_types_it_holds.yaml
                          at brief;
                          _data/decision/dec_where_a_peer_holds_entries_of_consumed_types/opt_peer_register_extends_a_consumed_register.yaml
                          at brief).
                        - Personal data lives only in private
                          repositories, and some segments may hold
                          personal data under the GDPR (owner's
                          statement, 2026-10-22, quoted in
                          _data/decision/dec_how_peers_add_vocabulary/ann_private_members_held_in_the_peer.yaml
                          at description). Strength: moderate; every
                          option needs a change to the member lookup,
                          as measured, but only the option of peer
                          types gives that lookup nothing to follow.
                          It holds at ten times the size, since every
                          peer with people of its own meets it.

