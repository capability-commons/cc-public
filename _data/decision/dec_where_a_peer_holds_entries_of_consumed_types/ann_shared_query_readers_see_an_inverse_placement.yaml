title:                  One placement fact for every shared query reader
brief:                  |
                        Under the inverse edge option, the SQL, SPARQL
                        and logic readers that cctool offers all
                        return a register that names its type by the
                        inverse, and they return it in the ordinary
                        reading from the type. A partner who asks
                        where the entries of a type are held gets
                        every register with the query it would write
                        today. The type entry keeps its own edge, so a
                        reader of the type entry still finds the
                        consumed register. Under the extending option
                        the same partner must learn a new relation and
                        follow it one step further.
description:            |
                        Sources:
                        - An edge recorded with an inverse is read as
                          the primary edge in the opposite direction
                          (src/cctool/graph/derive.lp within
                          primary_edge).
                        - The SPARQL store records each inverse
                          relation the other way round, so that a
                          query may use either
                          (src/cctool/graph/sparql.py within store).
                        - Measured 2026-10-28 in a scratch copy of the
                          snapshot, with an inverse added to the entry
                          of relation_has_items_held_in_register and a
                          second concept register that names
                          type_concept only by that inverse: cctool
                          query sparql for the registers that
                          type_concept has items held in, cctool query
                          sql over primary_edge, and cctool query
                          logic over primary_edge each returned
                          reg_concept and the second register.
                        - In the same copy cctool check on cc-public
                          itself still gave 0 failures, and
                          type_concept kept its edge to reg_concept
                          (_data/register/reg_data_item_type.yaml at
                          entries.type_concept.edge).
                        - The extending option adds a new edge naming
                          the extended register, and the placement
                          check also accepts an entry held in a
                          register that extends it (cited in
                          ann_inverse_peer_register_restates_its_schema).
                        - The data format is public, and the query and
                          fact vocabulary is unsupported
                          (_data/decision/dec_declared_public_api/ruling_public_api_split_by_kind.yaml
                          at brief).
                        - Partners' segments are expected among the
                          peers (owner's statement, 2026-10-24).
                          Strength: moderate; it is measured, but the
                          query vocabulary is unsupported, so a
                          partner may not rely on these readers. It
                          holds at ten times the size, since each new
                          peer register is found by the same query.

