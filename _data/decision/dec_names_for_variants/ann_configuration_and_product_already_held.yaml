title:                  Configuration and product already held for other senses
brief:                  |
                        The plain option takes configuration and
                        product without qualification, but the
                        register already keeps configuration for its
                        systems engineering sense on the dataflow
                        graph and uses data product in its
                        MIL-STD-963C sense, and outside the repository
                        configuration means at least three things.
                        Each word would then name two or more concepts
                        in one repository and in what it exports; the
                        qualified option uses neither word.
description:            |
                        Sources:
                        - The dataflow graph concept keeps "system
                          configuration" as an alias in its systems
                          engineering sense and cites ISO/IEC/IEEE
                          24765 for configuration as the arrangement
                          of a system or component.
                          (_data/register/reg_concept.yaml at entries.concept_dataflow_graph)
                        - The register's note on data item uses data
                          product in the sense MIL-STD-963C defines.
                          (_data/register/reg_concept.yaml at entries.concept_data_item.note)
                        - The option uses its terms "without
                          qualification, such as product,
                          configuration and delta".
                          (_data/decision/dec_names_for_variants/opt_plain_product_line_terms.yaml at brief)
                        - In product line engineering a configuration
                          is a selection of features, which the
                          framing study ties to the bill-of-features
                          of ISO/IEC 26580; the public preview of the
                          standard shows bill-of-features only as
                          clause headings, not its definition.
                          (_sources/variants-framing.md line 38;
                          https://webstore.ansi.org/preview-pages/ISO/preview_ISO+IEC+26580-2021.pdf)
                        - AUTOSAR uses configuration for parameter
                          values bound at pre-compile, link or
                          post-build time.
                          (https://autosar.org/fileadmin/standards/R4.2.2/CP/AUTOSAR_TPS_ECUConfiguration.pdf,
                          configuration classes PreCompile, Link and
                          PostBuild; also summarized in
                          _sources/survey/generative-and-transforms.md
                          lines 106-107)
                        - Where a word has two entrenched senses,
                          every use of it as a term says which sense
                          it has. (_data/register/reg_design_rule.yaml at entries.rule_qualify_an_entrenched_overloaded_term.brief) Strength: strong; every
                          variant item, check message and annotation
                          would use these words, so the clash grows
                          with the number of variants and readers.

