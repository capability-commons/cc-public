title:                  Qualified terms with every clash resolved
brief:                  |
                        The variant terms are the qualified terms of
                        opt_qualified_terms_with_clashes_resolved,
                        with each clash resolved by qualifying one
                        side or both, and the four states abstract,
                        superset, hybrid and complete. Ruled by WTP on
                        2026-10-25, as recommended. Everything in the
                        tree is to be brought into line with these
                        terms, so that ambiguity stays under control
                        (WTP, 2026-10-25).

