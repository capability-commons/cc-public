title:                  State names for both directions in which a base is specialized
brief:                  |
                        The option with every clash resolved names
                        each direction in which a base is specialized:
                        abstract when blocks must be added, superset
                        when they must be removed, hybrid when both
                        apply and complete when neither does, so it
                        answers WTP's point that abstract has the
                        wrong etymology for a superset base, and a
                        check message can say which way a variant
                        falls short instead of only that it is not
                        run. The other three options name no state at
                        all, which leaves the one drafted abstract
                        field, unable to tell the two cases apart, as
                        the only word a reader or a message has.
description:            |
                        Sources:
                        - Abstract fits a base that lacks blocks or
                          chains, which are added to realize it, but
                          has the wrong etymology for a superset base
                          whose surplus blocks and chains are tailored
                          away, and many bases will be both. (WTP,
                          2026-10-25)
                        - The option defines abstract, superset,
                          hybrid and complete for a dataflow variant,
                          and says the state belongs to the dataflow
                          variant itself.
                          (_data/decision/dec_names_for_variants/opt_qualified_terms_with_clashes_resolved.yaml
                          at brief)
                        - "positive variability starts with a minimal
                          core and selectively adds additional parts";
                          "negative variability selectively takes away
                          parts of a creative construction model".
                          (Groher and Voelter, Aspect-oriented
                          model-driven software product line
                          engineering, sections 3.1 and 3.2,
                          https://voelter.de/data/articles/TAOSD.pdf)
                        - The framing study takes abstract from the OO
                          abstract class
                          (_sources/variants-framing.md#1-the-framing,
                          table of proposed terms, row abstract), and
                          "An abstract class is a class that is
                          incomplete, or to be considered incomplete"
                          (Java Language Specification SE 17, 8.1.1.1,
                          https://docs.oracle.com/javase/specs/jls/se17/html/jls-8.html),
                          which is the lacking sense, not the superset
                          sense.
                        - In the drafts one field, abstract set to
                          true, marks both the Patrol base and the
                          intermediate Orin variant.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at brief and abstract;
                          _sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          at brief and abstract) The open decision on
                          how the state is known says that field
                          cannot tell the two cases apart.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/dec_how_a_variant_is_known_abstract_or_superset.yaml
                          at description)
                        - The plain, graphics and first qualified
                          options name no state of a variant.
                          (_data/decision/dec_names_for_variants/opt_plain_product_line_terms.yaml
                          at brief;
                          _data/decision/dec_names_for_variants/opt_graphics_tool_terms.yaml
                          at brief;
                          _data/decision/dec_names_for_variants/opt_qualified_variant_terms.yaml
                          at brief)
                        - The Patrol drafts ask that failures name the
                          variant and the operation that introduced
                          the fault.
                          (_sources/cc-patrol-notes/variants.md#2-proposal-for-cc-public,
                          point 5)
                        - Terminological quality asks whether a term
                          designates one concept and says what it is
                          to a reader who has not met it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_terminological_quality.question.0
                          and
                          entries.concern_terminological_quality.question.1)
                          Interaction capability asks how much time
                          and attention a task takes a person.
                          (_data/register/reg_concern.yaml at
                          entries.concern_interaction_capability.question.0)
                        - ASSUMPTION: a message that names the state
                          and so its direction saves the user from
                          reading the operation list; no task has been
                          timed. Strength: strong for terminological
                          quality, since every base and intermediate
                          variant has one of the states and the gap
                          grows with the family; moderate for
                          interaction capability, which rests on the
                          assumption.

