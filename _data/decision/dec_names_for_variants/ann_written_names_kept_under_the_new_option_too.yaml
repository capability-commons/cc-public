title:                  Names already written that the new option also keeps
brief:                  |
                        The annotation on names already written
                        compares the qualified option with "either
                        other option", but there are now three others,
                        and its argument holds for the option with
                        every clash resolved as well: the dfv prefix,
                        the folder and the qualified terms stay. The
                        one exception is the drafted abstract field,
                        which that option renames to superset for both
                        Patrol items that carry it.
description:            |
                        Sources:
                        - "under either other option the drafts, the
                          prefix and the lines of those records that
                          use the qualified terms change".
                          (_data/decision/dec_names_for_variants/ann_qualified_terms_keep_names_already_written.yaml
                          at brief)
                        - The new option keeps dataflow variant,
                          variant operation, resolved dataflow graph,
                          variant family and simulation variant.
                          (_data/decision/dec_names_for_variants/opt_qualified_terms_with_clashes_resolved.yaml
                          at brief)
                        - Both drafted abstract items are superset
                          bases.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py,
                          run on the Patrol base and the Orin variant,
                          2026-10-25)

