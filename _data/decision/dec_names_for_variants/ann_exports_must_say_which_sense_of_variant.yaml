title:                  Two outside senses of variant that an export keeps apart
brief:                  |
                        The partner standards closest to this work use
                        variant in two senses: in SSP 2.0 a whole
                        alternative system structure, in SysML v2 one
                        alternative at one variation. The repository's
                        exports write its own field names as
                        frontmatter, so a qualified term lets a
                        partner read which sense is meant; the plain
                        terms leave it unstated, and no exchange
                        format cc-public has reason to use speaks of
                        stacks, modifiers or cooking.
description:            |
                        Sources:
                        - In SSP 2.0 a package may hold several SSD
                          files with one named default, and tools not
                          supporting variants ignore the others.
                          (https://ssp-standard.org/docs/2.0,
                          chapter 3)
                        - In SysML v2 a variant is a VariantMembership
                          of a variation. (Weilkiens et al., INCOSE IS
                          2025,
                          https://www.incose.org/wp-content/uploads/legacy/presentation/is2025-pdf/Paper-212.pdf,
                          as summarized in
                          _sources/survey/product-lines.md lines 35
                          and 156-159)
                        - The register names a variant of a system as
                          a whole thing derived from a dataflow graph,
                          which is the SSP sense.
                          (_data/register/reg_concept.yaml lines
                          1195-1199)
                        - The Obsidian and OKF exports write the
                          repository's own fields as frontmatter.
                          (_data/decision/dec_follow_standards_by_default/ann_repository_exports_obsidian_and_okf.yaml
                          lines 11-35)
                        - A later rename reaches peers through each
                          release's rename map, so each change of term
                          adds entries that every peer's upgrade must
                          apply.
                          (_data/decision/dec_how_peers_absorb_renames/ruling_upgrade_by_rename_maps.yaml
                          lines 11-17)
                        - ASSUMPTION: no exchange format cc-public
                          reads or writes (SSP, FMI, SED-ML, SysML v2,
                          AUTOSAR) uses the graphics tool terms;
                          checked only in the parts of SSP 2.0 the
                          advocate read. Strength: strong; it grows
                          with the number of exchange formats and
                          peers, not with the number of variants.

