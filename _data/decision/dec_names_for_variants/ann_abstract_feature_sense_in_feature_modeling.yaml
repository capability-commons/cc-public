title:                  Abstract feature, an established sense of abstract in feature modeling
brief:                  |
                        Feature modeling already calls a feature
                        abstract when it is mapped to no
                        implementation artifact, and an open option
                        would make the drafted tags features, so
                        abstract would then name two product line
                        concepts. The fix is the one the qualify rule
                        prescribes, which the option does not yet
                        state: always write abstract dataflow variant,
                        and register both senses, so that a bare link
                        to abstract fails the ambiguous-term check.
description:            |
                        Sources:
                        - "We define a feature as abstract, if and
                          only if it is not mapped to any
                          implementation artifacts. We call all other
                          features non-abstract or concrete." (Thum,
                          Kastner, Erdweg and Siegmund, Abstract
                          features in feature modeling, SPLC 2011,
                          pages 191-200,
                          https://pl.cs.uni-tuebingen.de/publications/thuem11abstract/;
                          quoted from section IV-A of the copy at
                          https://www.academia.edu/22167366/Abstract_Features_in_Feature_Modeling)
                        - The framing study proposes the tags as "tag,
                          later feature", after ISO/IEC 26580.
                          (_sources/variants-framing.md#1-the-framing,
                          table of proposed terms, row tag)
                        - One open option is a feature model that
                          generates variants.
                          (_data/decision/dec_feature_model_or_explicit_family/opt_feature_model_generates_variants.yaml
                          at title)
                        - Where a word has two entrenched senses, both
                          are kept and every use of it as a term says
                          which sense it has.
                          (_data/register/reg_design_rule.yaml at
                          entries.rule_qualify_an_entrenched_overloaded_term.brief)
                        - The ambiguous-term check fails a bare wiki
                          link where the item uses two concepts with
                          that term; it does not see unlinked prose.
                          (src/cctool/check/check.lp within
                          ambiguous_term)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                          Strength: moderate; the clash holds only if
                          features are adopted, and it is cheap to
                          settle by writing the qualified form. The
                          other three options do not make abstract a
                          term, so this does not bear on them.

