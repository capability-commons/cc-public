title:                  Names for variants and their parts
brief:                  |
                        Which terms does the repository use for a
                        variant, its operations, the graph it resolves
                        to and the set of variants of one base?
description:            |
                        Several obvious words clash with the concept
                        register: tree already means the repository
                        tree, configuration is kept for its systems
                        engineering sense, and one run of a dataflow
                        step is already called an invocation
                        (_sources/variants-framing.md, section 1,
                        table of terms, and section 4, Q8). The ruling
                        to follow standards by default and the rule to
                        qualify overloaded terms both bear on the
                        choice.

