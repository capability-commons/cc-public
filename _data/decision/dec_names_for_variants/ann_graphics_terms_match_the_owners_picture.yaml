title:                  The owner's own picture of a graphics tool
brief:                  |
                        The owner described the ruled form as like a
                        generative art tool with a graph of
                        operations, so graphics tool terms would be
                        familiar to him at first sight, and stack
                        shows order, which neither delta nor operation
                        list does. The weight depends on who else
                        reads the repository, which is not recorded,
                        and the owner's earlier tool used add, join,
                        filt and write, not graphics terms.
description:            |
                        Sources:
                        - "it will be a bit like paintshop or any
                          other generative art tool with a graph of
                          operations that produces a final product".
                          (owner's statement, 2026-10-24,
                          _sources/owner-2026-10-24-late.md line 3)
                        - "Modifiers are evaluated top to bottom in
                          the panel."
                          (https://archive.blender.org/wiki/2015/index.php/Manual/Modifier_Stack)
                        - The operation names of the owner's earlier
                          tool are add, join, filt and write.
                          (_sources/cc-patrol-notes/variants.md lines
                          15-20)
                        - ASSUMPTION: partners and later contributors
                          are systems or software engineers more than
                          graphics tool users. Strength: weak; it
                          rests on one reader and holds less well as
                          readers are added.

