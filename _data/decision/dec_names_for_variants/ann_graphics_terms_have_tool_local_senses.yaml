title:                  Graphics tool terms with tool-local senses
brief:                  |
                        Stack, modifier and cook come from one family
                        of modeling tools and no standard defines
                        them, while the framing study gives a standard
                        or established source for most of the
                        qualified terms. In Houdini, cook means
                        evaluating the nodes to compute a result,
                        which in cc-public is running a graph, not
                        resolving its structure, and stack already
                        means a software stack in the repository, so a
                        newcomer meets a familiar word with the wrong
                        meaning.
description:            |
                        Sources:
                        - Where a recognized standard covers the
                          ground, its structure is the starting
                          position.
                          (_data/decision/dec_follow_standards_by_default/ruling_follow_standards_by_default.yaml at brief) ISO/IEC 26550 and 26580 cover
                          product lines. (_sources/variants-framing.md
                          lines 160-161)
                        - The graphics option takes its terms from
                          procedural graphics tools.
                          (_data/decision/dec_names_for_variants/opt_graphics_tool_terms.yaml at brief)
                        - The framing study's table gives a source for
                          each qualified term except simulation
                          variant and dataflow run, and does not list
                          stack, modifier or cook.
                          (_sources/variants-framing.md lines 28-41)
                        - "In Houdini, cooking refers to evaluating
                          the nodes in the networks to compute the
                          state of the scene in the current frame."
                          (https://sidefx.com/docs/houdini/basics/cooking.html)
                        - A resolved graph is derived from a base and
                          operations, never stored, and checked.
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml at brief) One run of a dataflow step is
                          an invocation.
                          (_data/register/reg_concept.yaml at entries.concept_dataflow_step.description)
                        - Stack is used for a set of dependencies
                          brought in by a fallback.
                          (_data/decision/dec_agent_cross_examination/ann_colbert_fallback_brings_a_second_stack.yaml at title) Strength: strong for cook, moderate
                          for stack and modifier; the misreading holds
                          whatever the number of variants, and more
                          variants mean more readers.

