title:                  Member product and shared asset superset as written in ISO/IEC 26580
brief:                  |
                        The two product line terms the new option
                        borrows, member product and the superset of a
                        shared asset superset, both appear in the
                        public preview of ISO/IEC 26580, so a partner
                        who works to that standard meets familiar
                        words. The preview shows member product only
                        in its introduction and the superset only in
                        clause headings, so the definitions are
                        unread.
description:            |
                        Sources:
                        - "... automated configuration of member
                          product instances", and "testing of
                          configured member products and
                          member-product-specific assets". (ISO/IEC
                          26580:2021, Introduction,
                          https://webstore.ansi.org/preview-pages/ISO/preview_ISO+IEC+26580-2021.pdf)
                        - Shared asset supersets are the headings of
                          clauses 6.2.4, 7.5 and 8.5, and clause 3,
                          terms and definitions, is not in the
                          preview. (same)
                        - The public page for ISO/IEC 26550:2015 does
                          not use member product.
                          (https://www.evs.ee/en/iso-iec-26550-2015,
                          checked 2026-10-25)
                        - The option cites the preview of ISO/IEC
                          26580 for member product and calls a
                          superset base the shared asset superset of
                          that standard.
                          (_data/decision/dec_names_for_variants/opt_qualified_terms_with_clashes_resolved.yaml
                          at description)
                        - Compatibility asks whether a partner can
                          read and use what the design produces.
                          (_data/register/reg_concern.yaml at
                          entries.concern_compatibility.question.0)
                          Strength: weak to moderate; it shows the
                          words are the standard's, not that the
                          standard means by them what the option
                          means.

