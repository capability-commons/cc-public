title:                  Delta clash settled by the option with every clash resolved
brief:                  |
                        The annotation on the two senses of delta says
                        the clash disappears if delta is kept for the
                        included unit only. The option with every
                        clash resolved now does this and more:
                        operation list for a dataflow variant's own
                        list, delta module for the included unit, and
                        bare delta not used as a term.
description:            |
                        Sources:
                        - The annotation's strength note: the two
                          senses "disappear if the owner keeps delta
                          for the included unit only".
                          (_data/decision/dec_names_for_variants/ann_delta_given_two_senses_across_the_options.yaml
                          at description)
                        - The option uses operation list and delta
                          module and does not use bare delta as a
                          term.
                          (_data/decision/dec_names_for_variants/opt_qualified_terms_with_clashes_resolved.yaml
                          at brief)

