title:                  Superset bases behind both Patrol items drafted as abstract
brief:                  |
                        Resolving the drafts shows that both items
                        marked abstract, the Patrol base and the Orin
                        variant, hold surplus alternatives and lack
                        nothing, so in the new option's terms both are
                        superset bases. Under that option a reviewer
                        who reads the state in a diff learns whether
                        blocks are still to be added or alternatives
                        still to be removed; under the other three a
                        reviewer reads only abstract, which here means
                        the opposite of what the drafts hold.
description:            |
                        Sources:
                        - The base holds every node Patrol can run on
                          every platform and in every output mode, is
                          not runnable itself and is marked abstract.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at brief and abstract) "The base is a
                          superset holding both platform adapters and
                          both display paths."
                          (_sources/cc-patrol-notes/variants.md#3-patrol-with-this-mechanism)
                        - The Orin variant is marked abstract and its
                          variants choose what goes out.
                          (_sources/cc-patrol-notes/draft/dfv_patrol_orin.yaml
                          at brief and abstract)
                        - The throwaway resolver, run by the verifier
                          on a scratch copy on 2026-10-25, reports six
                          inputs fed twice in the base and four in the
                          Orin variant, and no required input unfed in
                          either.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py,
                          run on the Patrol base and the Orin variant)
                          The five runnable variants feed every
                          required input exactly once.
                          (_sources/cc-patrol-notes/draft/README.md#what-resolving-them-showed-resolvedtxt)
                        - The option defines superset as holding
                          surplus or alternative blocks or chains that
                          must be removed.
                          (_data/decision/dec_names_for_variants/opt_qualified_terms_with_clashes_resolved.yaml
                          at brief)
                        - Reviewability asks whether a person can read
                          a change in full and judge it.
                          (_data/register/reg_concern.yaml at
                          entries.concern_reviewability.question.0)
                        - ASSUMPTION: no Patrol draft is abstract in
                          the new option's lacking sense, so the first
                          port exercises superset but not abstract;
                          the resolver checks inputs against its own
                          table of ports, not the drafted interface
                          control documents. Strength: moderate; it
                          rests on six drafts, but those drafts are
                          the first port.

