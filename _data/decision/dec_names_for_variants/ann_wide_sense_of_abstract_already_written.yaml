title:                  Items already written in the drafted wide sense of abstract
brief:                  |
                        The new option narrows abstract to the lacking
                        sense, but about 38 decision items outside
                        this decision already use abstract in the
                        drafted sense of any variant that is only
                        built on, and several of them carry it in
                        their ids, such as
                        opt_every_non_abstract_variant_checked and
                        opt_single_base_including_abstract_variants.
                        Ruling the option means rewording those items,
                        and renaming the ids, in one change a reviewer
                        must read; the other three options leave them
                        as written, though they also leave the word
                        ambiguous.
description:            |
                        Sources:
                        - A grep on 2026-10-25 by the verifier for
                          abstract next to variant, graph, base,
                          intermediate, parent or flag, and for
                          non-abstract and marked abstract, found 38
                          files under _data/decision outside the two
                          decisions on names and on how a state is
                          known, in 15 decisions, the most in the
                          decisions on which resolved graphs are
                          checked, on the identity of a dataflow edge
                          and on the shape of a variant family; some
                          hits are only edges to an option whose id
                          holds the word.
                        - The option for every non-abstract variant
                          checks "each dataflow variant not marked
                          abstract".
                          (_data/decision/dec_which_resolved_graphs_are_checked/opt_every_non_abstract_variant_checked.yaml
                          at brief)
                        - The family-shape option lets a variant
                          "include abstract dataflow variants".
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_including_abstract_variants.yaml
                          at brief) Several annotations call the Orin
                          variant abstract, which the new option would
                          call superset.
                          (_data/decision/dec_shape_of_a_variant_family/ann_family_abstract_variant_as_parent_and_mixin.yaml
                          at description)
                        - A tension is resolved while the change is
                          still cheap.
                          (_data/register/reg_design_rule.yaml at
                          entries.rule_resolve_tensions_early)
                        - A maintainability question asks how far a
                          change in one part spreads to others.
                          (_data/register/reg_concern.yaml at
                          entries.concern_maintainability.question.1)
                          Strength: moderate; the rewording is cheap
                          now and grows with every variant item
                          written in the wide sense before the ruling.

