title:                  Searches that find only variant items
brief:                  |
                        A search for a qualified term returns only
                        variant items, while a search for
                        configuration as a whole word returns 78
                        files, most of them about other things. The
                        qualified terms take more words in prose but
                        not in YAML, since the item prefix carries the
                        qualifier and fields keep short names such as
                        base and operation.
description:            |
                        Sources:
                        - A case-insensitive grep on 2026-10-25 for
                          the qualified terms under _data: 63 lines in
                          37 files, 60 of them in the variant
                          decisions and 3 in annotations on engine and
                          placement decisions. (trace-review-terms
                          advocate, N5, repeated by the verifier)
                        - A case-insensitive whole-word grep for
                          configuration under _data: 78 files (84
                          counting forms such as configurations), the
                          largest groups in the decisions on the first
                          engine, on where engine behavior lives and
                          on swapping a node version. (same)
                        - The draft variant item uses the fields base
                          and operation under the prefix dfv.
                          (_sources/cc-patrol-notes/variants.md lines
                          43-48 and 74)
                        - ASSUMPTION: the number of unrelated hits
                          stands in for the time a search takes; no
                          task has been timed. Strength: moderate; the
                          gap widens as more items use configuration
                          in its systems engineering sense.

