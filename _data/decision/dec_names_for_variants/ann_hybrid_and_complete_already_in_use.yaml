title:                  Hybrid and complete, two state names already in use
brief:                  |
                        Hybrid already describes Patrol's mixed
                        GStreamer and Dataflow engine graph, a
                        different sense from a hybrid dataflow
                        variant, and a Patrol variant can be hybrid in
                        both senses at once. Complete is the
                        register's own word for a dataflow graph,
                        which it says is complete enough to be run,
                        though the Patrol base is a dataflow graph
                        that is not; each clash costs one qualifier or
                        one sentence of the register if it is settled
                        before items are written.
description:            |
                        Sources:
                        - "Patrol is a hybrid system", and the drafts'
                          section on hybrid nodes and edges is about
                          GStreamer, engine and Python nodes.
                          (_sources/cc-patrol-notes/draft/README.md#patrol-base-graph-and-variants-drafts-v4
                          and
                          _sources/cc-patrol-notes/draft/README.md#hybrid-nodes-and-edges)
                        - An annotation calls the ports of that graph
                          "the GStreamer ports of the hybrid graph".
                          (_data/decision/dec_port_types/ann_gstreamer_caps_match_by_intersection.yaml
                          at description)
                        - "A dataflow graph is complete enough to be
                          run." (_data/register/reg_concept.yaml at
                          entries.concept_dataflow_graph.description)
                        - The Patrol base is a dataflow graph that is
                          not runnable itself.
                          (_sources/cc-patrol-notes/draft/dfg_patrol.yaml
                          at brief and abstract)
                        - The option names a dataflow variant hybrid
                          when it is both abstract and superset, and
                          complete when it is neither.
                          (_data/decision/dec_names_for_variants/opt_qualified_terms_with_clashes_resolved.yaml
                          at brief)
                        - Terminological quality asks whether a term
                          is already used, here or in a cited source,
                          for something else.
                          (_data/register/reg_concern.yaml at
                          entries.concern_terminological_quality.question.2)
                          Strength: moderate; each clash is cheap to
                          fix in the wording. The other three options
                          use neither word as a term.

