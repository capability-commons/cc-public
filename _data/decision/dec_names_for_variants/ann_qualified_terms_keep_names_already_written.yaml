title:                  Names already written in the qualified terms
brief:                  |
                        The Patrol drafts already give the variant
                        type the prefix dfv and a folder named for
                        dataflow variants, and the decision records
                        for variants are written in the qualified
                        terms. Under the qualified option all of these
                        stay as they are; under either other option
                        the drafts, the prefix and the lines of those
                        records that use the qualified terms change in
                        one rename that a reviewer must read and judge
                        before the first variant is ported.
description:            |
                        Sources:
                        - The six draft variants are files and ids
                          under the dfv prefix.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 24-34)
                        - The draft proposes the prefix dfv and a
                          folder named for dataflow variants.
                          (_sources/cc-patrol-notes/variants.md lines
                          74-75)
                        - The dataflow graph schema qualifies node,
                          edge and process because the graph of items
                          has nodes and edges of its own.
                          (_data/schema/sch_dataflow_graph.yaml at note)
                        - A case-insensitive grep on 2026-10-25 for
                          the qualified terms found 63 lines in 37
                          files under _data/decision: 60 in the
                          variant decisions and 3 in annotations on
                          the decisions on the first engine, the home
                          of the engine code and the spread of Kahn
                          steps across cores. The ids of the
                          vocabulary and family-shape decisions also
                          contain qualified terms. (trace-review-terms
                          advocate, N7, repeated by the verifier)
                        - A tension is resolved while the change is
                          still cheap, and "the term is renamed in
                          every file now, while forty files use it".
                          (_data/register/reg_design_rule.yaml at entries.rule_resolve_tensions_early)
                        - The framing study puts this decision first,
                          while nothing depends on it.
                          (_sources/variants-framing.md line 152)
                          Strength: moderate for maintainability, weak
                          for reviewability; the rename is cheap today
                          and grows with every item written before the
                          ruling.

