title:                  Qualified terms with every clash resolved
brief:                  |
                        The qualified terms, with each clash resolved
                        by qualifying one side or both. Dataflow
                        variant (variant where the dataflow sense is
                        clear), abstract dataflow variant for one that
                        is only built on, base, variant operation,
                        operation list for a dataflow variant's own
                        ordered list of variant operations, delta
                        module for a named list of variant operations
                        that dataflow variants include, resolved
                        dataflow graph, variant family, simulation
                        variant, and dataflow run for one run of one
                        resolved dataflow graph. Tags on dataflow
                        nodes are presence tags, and the tag that
                        names a release is a git tag. A product of a
                        product line is a member product, realized by
                        one or more dataflow variants. Bare delta,
                        configuration, product and tag are not used as
                        terms.
description:            |
                        Source: the owner's statement of
                        2026-10-25T05:50Z, agreeing with the terms the
                        framing study suggests and asking for clashes
                        to be resolved "with extra qualification on
                        both sides (or one side, as appropriate)"
                        (_sources/owner-2026-10-25-morning.md). The
                        study lists the terms and their clashes in its
                        table of proposed terms
                        (_sources/variants-framing.md). Delta module
                        is the term of delta-oriented programming
                        (Schaefer, Bettini, Bono, Damiani and
                        Tanzarella, SPLC 2010,
                        https://research.chalmers.se/en/publication/124332).
                        Presence condition, which a presence tag
                        stands for, is the term of annotative
                        variability. Member product is taken to be the
                        term of ISO/IEC 26550 for one product of a
                        product line; this is an assumption, as the
                        full text was not checked.

