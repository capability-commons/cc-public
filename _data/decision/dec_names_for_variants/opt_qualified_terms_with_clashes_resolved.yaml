title:                  Qualified terms with every clash resolved
brief:                  |
                        The qualified terms, with each clash resolved
                        by qualifying one side or both.
                        [[Dataflow variant]] ([[variant]] where the
                        dataflow sense is clear), [[base]],
                        [[variant operation]], [[operation list]] for
                        a dataflow variant's own ordered list of
                        variant operations, [[delta module]] for a
                        named list of variant operations that dataflow
                        variants include, [[resolved dataflow graph]],
                        [[variant family]], [[simulation variant]],
                        and [[dataflow run]] for one run of one
                        resolved dataflow graph. A dataflow variant is
                        abstract ([[abstract dataflow variant]]) when
                        it lacks functional blocks or chains that must
                        be added to it, superset
                        ([[superset dataflow variant]]) when it holds
                        surplus or alternative blocks or chains that
                        must be removed from it, hybrid
                        ([[hybrid dataflow variant]]) when it is both,
                        and complete ([[complete dataflow variant]])
                        when it is neither. The state belongs to the
                        dataflow variant itself: a descendant that
                        adds a block which fills no gap does not make
                        its base abstract. Every dataflow variant has
                        a resolved dataflow graph, and only a complete
                        one is run. Tags on dataflow nodes are
                        [[presence tags]], and the tag that names a
                        release is a git tag. A product of a product
                        line is a [[member product]], built from one
                        or more dataflow variants. Bare delta,
                        configuration, product, tag and operational
                        are not used as terms.
description:            |
                        Source: WTP agreed with the terms the framing
                        study suggests and asked for clashes to be
                        resolved with extra qualification on one side
                        or both (WTP, 2026-10-25), and the study lists
                        the terms and their clashes in its table of
                        proposed terms (_sources/variants-framing.md).
                        WTP then pointed out that abstract fits a base
                        that lacks blocks or chains, which are added
                        to realize it, but has the wrong etymology for
                        a superset base whose surplus blocks and
                        chains are removed to tailor it, and that many
                        bases will be both (WTP, 2026-10-25). The two
                        directions are the positive and negative
                        variability of product line engineering
                        (Voelter and Groher, Product line
                        implementation using aspect-oriented and
                        model-driven software development, SPLC 2007;
                        Groher and Voelter, Aspect-oriented
                        model-driven software product line
                        engineering, Transactions on Aspect-Oriented
                        Software Development VI, 2009). A superset
                        base is the shared asset superset of ISO/IEC
                        26580, also called a 150 percent model.
                        Operational is left out because Arcadia uses
                        it for its operational analysis level (WTP,
                        2026-10-25). Realize names the act in plain
                        words only; the register already uses it for
                        an implementation that realizes a logical
                        component. Delta module is the term of
                        delta-oriented programming (Schaefer, Bettini,
                        Bono, Damiani and Tanzarella, SPLC 2010,
                        https://research.chalmers.se/en/publication/124332).
                        Presence condition, which a presence tag
                        stands for, is the term of annotative
                        variability. Member product is the term of
                        ISO/IEC 26580 for one product of a product
                        line, as its public preview uses it
                        (https://webstore.ansi.org/preview-pages/ISO/preview_ISO+IEC+26580-2021.pdf).
                        Adding what an abstract dataflow variant lacks
                        is [[variant realization]], and removing what
                        a superset one holds in surplus is
                        [[variant tailoring]]; neither is
                        [[component realization]].

