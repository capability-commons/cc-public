title:                  Delta given two senses across the options
brief:                  |
                        The qualified option uses delta for a
                        variant's whole list of operations, the
                        included-deltas option of the family-shape
                        decision uses it for a separate named list
                        that a variant includes, cctool already uses
                        it for the kind of change made to one item,
                        and delta-oriented programming uses it for one
                        module applied to a core. The plain option
                        adopts delta with no sense stated, and the
                        qualified option gives delta a sense, one
                        whole list per variant, that differs from the
                        included delta items, so a reader of a diff
                        that says delta cannot tell whether it changes
                        one variant or every variant that includes the
                        item.
description:            |
                        Sources:
                        - "delta for a variant's whole list of
                          operations".
                          (_data/decision/dec_names_for_variants/opt_qualified_variant_terms.yaml
                          lines 15-16)
                        - The plain option lists delta among its
                          terms.
                          (_data/decision/dec_names_for_variants/opt_plain_product_line_terms.yaml
                          lines 13-15)
                        - A variant "may include named delta items,
                          each an ordered list of variant operations,
                          applied in a stated order before its own".
                          (_data/decision/dec_shape_of_a_variant_family/opt_single_base_with_included_deltas.yaml
                          lines 13-17)
                        - A composite operation is "a named, reusable
                          list of core operations", a second term for
                          the same includable list.
                          (_data/decision/dec_vocabulary_of_variant_operations/opt_closed_core_with_composite_operations.yaml
                          lines 13-18)
                        - cctool impact lists each touched item with
                          the keys id, delta, was, file and line,
                          where delta is added, removed, renamed or
                          changed.
                          (_data/interface_control_document/icd_cctool_command_line.yaml
                          lines 659-660; src/cctool/commit/impact.lp
                          lines 100-123)
                        - "A product line is represented by a core
                          module and a set of delta modules."
                          (Schaefer et al. 2010, abstract,
                          https://research.chalmers.se/en/publication/124332)
                          The framing study draws the qualified
                          option's sense from delta modeling.
                          (_sources/variants-framing.md line 32)
                        - In delta lines, two operations that touch
                          one element give different products in
                          different orders.
                          (_sources/survey/product-lines.md line 323)
                        - ASSUMPTION: a reviewer reading a diff line
                          that says only delta cannot tell from that
                          line which of the two senses is meant.
                          Strength: strong; the two senses meet in
                          every variant that has both its own
                          operations and included items, and disappear
                          if the owner keeps delta for the included
                          unit only.

