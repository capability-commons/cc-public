title:                  Qualified terms formed as the register forms them
brief:                  |
                        The qualified option names variant parts the
                        way the register already names dataflow node
                        and dataflow edge, and avoids words already
                        taken: variant family avoids tree, and
                        simulation variant avoids world model. One
                        part needs a sentence of definition, since
                        dataflow run sits beside invocation, so the
                        option should say that a dataflow run is a run
                        of one resolved dataflow graph.
description:            |
                        Sources:
                        - Dataflow node and dataflow edge are
                          qualified because node is an overloaded word
                          and the bare edge means any edge of the
                          graph. (_data/register/reg_concept.yaml
                          lines 1257-1259 and 1311-1313)
                        - In SysML v2 bare variant has a second,
                          entrenched sense. (Weilkiens et al., INCOSE
                          IS 2025, as summarized in
                          _sources/survey/product-lines.md lines 35
                          and 157)
                        - Tree already means the repository tree: a
                          commit is one recorded change to the tree, a
                          release a numbered baseline of it.
                          (_data/register/reg_concept.yaml lines 605
                          and 2842)
                        - The ruling speaks of dataflow simulations
                          used as world models
                          (_data/decision/dec_how_variants_are_held/ruling_variant_type_with_operations.yaml
                          lines 21-22), while world models in machine
                          learning are learned simulators. (Ha and
                          Schmidhuber 2018,
                          https://arxiv.org/abs/1803.10122v1, as cited
                          in _sources/variants-framing.md line 39)
                        - "One run of a dataflow step is an
                          invocation."
                          (_data/register/reg_concept.yaml lines
                          2024-2025) Strength: strong; each new
                          variant concept can be formed the same way,
                          whatever the count.

