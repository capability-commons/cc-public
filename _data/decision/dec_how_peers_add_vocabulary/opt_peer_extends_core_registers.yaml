title:                  Extension files for the consumed registers
brief:                  |
                        A peer adds entries to the registers of a
                        consumed segment through extension files in
                        its own tree, each named for the register it
                        extends, so that each register is read as the
                        consumed segment's entries followed by the
                        peer's. The peer holds no registers of its
                        own.

