title:                  Registers of the peer's own
brief:                  |
                        A peer holds registers of its own for any
                        types, relations, concepts and other entries
                        it needs, read beside those of the segments it
                        consumes, with every prefix and id unique
                        across the peer and what it consumes; an entry
                        moves into cc-public when a second segment
                        needs it. Ruled by WTP on 2026-10-24.

