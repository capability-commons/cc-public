title:                  Registers of the peer's own
brief:                  |
                        A peer holds registers of its own in its own
                        tree, for types, relations, concepts and any
                        other entries it needs, and the check reads
                        them beside the registers of the segments it
                        consumes. Every prefix and id is unique across
                        the peer and every segment it consumes. An
                        entry moves into cc-public when a second
                        segment needs it.

