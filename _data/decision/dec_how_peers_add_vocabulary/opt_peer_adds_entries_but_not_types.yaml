title:                  Entries in the peer, types and relations upstream
brief:                  |
                        A peer may hold register entries of its own
                        for concepts, concerns, design rules, team
                        members and similar entries, but every type,
                        relation, role and relation constraint lives
                        in cc-public, because code and checks depend
                        on them. A peer that needs a new type or
                        relation proposes it upstream and takes it up
                        with the release that carries it.

