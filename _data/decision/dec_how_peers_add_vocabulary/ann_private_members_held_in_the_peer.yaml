title:                  Private team members held in the peer
brief:                  |
                        All vocabulary upstream puts every team member
                        a peer needs into cc-public, whose team member
                        register is public and ships in the wheel. A
                        member who should not be named in public then
                        has no home, and a commit trailer in the peer
                        can name only members that cc-public holds.
                        The options that let a peer hold entries of
                        its own keep such members, and their names, in
                        the private tree.
description:            |
                        Sources:
                        - The team member register says every entry in
                          it is public, and
                          that a member who should not be named in public is held in the
                          team member register of a private repository instead
                          (_data/register/reg_team_member.yaml lines 26-30).
                        - cctool message check reads the team member
                          register of the tree
                          it checks, so a Contributor trailer resolves only where its member
                          is held (_data/register/reg_team_member.yaml lines 22-25).
                        - A team member entry has an id and a title
                          formed from the
                          person's name, for example member_william_payne
                          (_data/register/reg_team_member.yaml lines 37-40).
                        - The upstream option has every register entry
                          live in cc-public
                          and a peer hold only instances
                          (_data/decision/dec_how_peers_add_vocabulary/opt_all_vocabulary_upstream.yaml,
                          brief).
                        - cc-public's _data ships in the wheel
                          (owner's statement,
                          2026-10-24).
                        - Once a package is published, every peer and
                          the package host keep
                          a copy that the maintainer cannot withdraw
                          (_data/decision/dec_how_peers_get_cc_public/ann_published_package_cannot_be_recalled.yaml,
                          brief).
                        - Personal data lives only in private
                          repositories, and some
                          segments may hold personal data under the GDPR (owner's statement,
                          2026-10-22).
                        Strength: strong; the register already states
                        the rule, and at ten times the size every new
                        peer with people of its own meets it again.

