title:                  Extension files that presume a file tree
brief:                  |
                        Extension files are named for the register
                        they extend, so the mechanism is a convention
                        about files. A segment backed by a graph
                        database holds items, not file names, and
                        would need a second way to say which register
                        an entry extends. Registers of a peer's own
                        are ordinary items, and can be held wherever
                        items are held.
description:            |
                        Sources:
                        - Under the extension-file option, each
                          extension file sits in the peer's tree and
                          is named for the register it extends
                          (_data/decision/dec_how_peers_add_vocabulary/opt_peer_extends_core_registers.yaml at brief).
                        - A register entry is recorded against the id
                          of the register item that holds it
                          (src/cctool/graph/extract.py within _header).
                        - Partner segments are likely to use a graph
                          database or similar as their backing
                          (owner's statement, 2026-10-22).
                        - For today's purposes what crosses is files,
                          with an MCP server soon and a graph-database
                          backend eventually (owner's statement,
                          2026-10-24).
                        - ASSUMPTION: a segment held in a graph
                          database stores items and their fields, and
                          keeps no file names. Strength: weak today,
                          since every segment is files; it rises when
                          the first segment not held as files is
                          planned, and holds at ten times the size.

