title:                  Peer restatement of a consumed entry unreported
brief:                  |
                        The duplicate id rule fires only when the two
                        guids differ, and the duplicate guid rule only
                        when the two ids differ, so a peer entry that
                        repeats a consumed entry's id and guid is
                        reported by neither. Extension files read a
                        register as the consumed entries followed by
                        the peer's, which invites a peer to restate an
                        entry, such as the public mark, with other
                        text. Registers of the peer's own require
                        every id to be unique across the union, which
                        the check can hold once it also refuses one id
                        and guid in two files.
description:            |
                        Sources:
                        - duplicate_id requires two different guids
                          for one id
                          (src/cctool/check/check.lp lines 425-428).
                        - duplicate_guid requires two different ids
                          for one guid
                          (src/cctool/check/check.lp lines 463-466).
                        - The item fact holds the id, guid, holder,
                          file and line, so two
                          copies of an entry in two files are two facts with the same id
                          and guid (src/cctool/graph/extract.py lines 202-205 and
                          1278-1282).
                        - The public mark says an item may be
                          published, forwarded and
                          quoted without further permission
                          (_data/register/reg_protective_mark.yaml lines 67-77).
                        - ASSUMPTION: no option says which of two
                          entries with one id a
                          reader takes; a reader that keeps the last one read would take
                          the peer's.
                        Strength: moderate; the gap exists today in
                        one tree, but federation is the first case
                        where a second author writes into the same
                        names, and at ten times the peers it is a
                        cheap rule to hold early.

