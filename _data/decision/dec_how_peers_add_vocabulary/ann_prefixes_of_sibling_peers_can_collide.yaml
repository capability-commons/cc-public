title:                  Prefixes of sibling peers that may collide
brief:                  |
                        If each peer may add its own types, two peers
                        that do not consume each other can choose the
                        same prefix, and nothing checks that until a
                        third segment or a partner reads both
                        together. Their items then cannot be combined
                        without a rename. Allocating every prefix in
                        cc-public removes this for types, though not
                        for the ids of other register entries a peer
                        adds.
description:            |
                        Sources:
                        - The own-registers option requires each
                          prefix and id to be unique across the peer
                          and every segment it consumes, not across
                          segments beside it
                          (_data/decision/dec_how_peers_add_vocabulary/opt_peer_holds_registers_of_its_own.yaml
                          lines 13-20).
                        - The extension-file option lets a peer add
                          entries to the registers of a consumed
                          segment, and does not restrict which
                          registers
                          (_data/decision/dec_how_peers_add_vocabulary/opt_peer_extends_core_registers.yaml
                          lines 12-19).
                        - A reference may run within a segment or into
                          one it consumes, never upward or sideways
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 13-16).
                        - The duplicate prefix finding is computed
                          only over the types in the union the check
                          reads (src/cctool/check/check.lp lines
                          179-182).
                        - Every id of a type starts with its prefix
                          and an underscore
                          (src/cctool/graph/prefix.py lines 71-78).
                        - ASSUMPTION: two segments that do not consume
                          each other may later be consumed together by
                          a third, or read together by a partner.
                          Strength: weak with one peer; strong at ten
                          times the peers, since the pairs that can
                          collide grow with the square of their
                          number.

