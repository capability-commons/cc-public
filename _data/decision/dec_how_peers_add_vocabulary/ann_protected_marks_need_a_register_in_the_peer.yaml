protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Protected marks in a register of the peer
brief:                  |
                        The protective mark register holds a mark
                        whose existence is itself protected in a
                        register for its authority, and expects a
                        partner's marks to resolve only in the
                        partner's register. All vocabulary upstream
                        would publish every such mark in cc-public.
                        Extension files give a peer no register of its
                        own, so a protected mark could only extend the
                        public register. A peer that holds registers
                        of its own, or entries of its own in such a
                        register, keeps those marks private.
description:            |
                        Sources:
                        - A mark is held in an authority specific
                          register only where the
                          existence of the mark is itself protected
                          (_data/register/reg_protective_mark.yaml lines 35-41).
                        - A mark from a federated partner may name an
                          entry held in that
                          partner's register and not in this one, and an unresolvable mark
                          is treated as more restrictive than any resolvable one
                          (_data/register/reg_protective_mark.yaml lines 43-53).
                        - The check reports a mark that no register
                          holds as advisory, and
                          a reference in the mark field is never a dangling reference
                          (src/cctool/check/advise.lp lines 75-79;
                          src/cctool/check/check.lp lines 963-968).
                        - The extension option has a peer add entries
                          to the registers of a
                          consumed segment and hold no registers of its own
                          (_data/decision/dec_how_peers_add_vocabulary/opt_peer_extends_core_registers.yaml,
                          brief).
                        - The register in the snapshot holds only the
                          public mark
                          (_data/register/reg_protective_mark.yaml lines 62-94).
                        - cc-patrol is private and local to atlas,
                          with no remote (owner's
                          statement, 2026-10-21).
                        Strength: moderate; no protected mark exists
                        yet, but the register's own rule expects them,
                        and at ten times the size, with partner
                        authorities, it matters more.

