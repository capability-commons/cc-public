title:                  Extension files as a second kind of register file
brief:                  |
                        Keeping all vocabulary upstream adds no
                        mechanism: the union is read as one tree and
                        every existing check applies. Extension files
                        add a file that continues another item rather
                        than being one, so the reader needs a merge
                        step, the identity checks need an exception,
                        and file names gain a meaning they do not have
                        today. Registers of the peer's own reuse the
                        existing register form.
description:            |
                        Sources:
                        - Documents are read per file and keyed by the
                          file's path relative to the root
                          (src/cctool/graph/extract.py lines 466-470).
                        - Every item has one id and one guid, and
                          duplicate_id fails two items with one id
                          (src/cctool/check/check.lp lines 425-428).
                        - Each register today is one item in one file,
                          such as reg_concept (_data/register/, ten
                          files for ten registers).
                        - The extension option reads each register as
                          the consumed entries followed by the peer's
                          (_data/decision/dec_how_peers_add_vocabulary/opt_peer_extends_core_registers.yaml,
                          brief).
                        - The previous iteration grew faster than it
                          could be reviewed, so a type, relation,
                          field or command is added only when a real
                          instance needs it (AGENTS.md lines 236-238).
                          Strength: strong as a count of mechanisms,
                          and it holds at ten times the size; it says
                          nothing of the cost of the upstream round
                          trip, which another annotation weighs.

