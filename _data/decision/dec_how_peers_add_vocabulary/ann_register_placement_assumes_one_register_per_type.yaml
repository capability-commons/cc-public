title:                  Register placement tied to one register per type
brief:                  |
                        The check and the new command both assume that
                        the items of a type sit in the one register
                        that the type names. A peer register that
                        holds concepts, concerns or other entries of a
                        cc-public type fails the placement check, and
                        cctool new would try to write the entry into
                        cc-public's register. Both options that let a
                        peer hold such entries must first change that
                        rule, the edit code and the relation behind
                        them, so the change does not stay in the peer.
description:            |
                        Sources:
                        - The check misplaced_register_entry fails a
                          register entry whose type does not name that
                          register by
                          relation_has_items_held_in_register
                          (src/cctool/check/check.lp lines 628-633).
                        - The type_concept entry names reg_concept by
                          that relation, on the type entry itself, in
                          cc-public
                          (_data/register/reg_data_item_type.yaml
                          lines 318 and 356).
                        - The register entry of
                          relation_has_items_held_in_register embeds
                          no inverse, so only the type entry can state
                          the edge (_data/register/reg_relation.yaml
                          lines 134-166; src/cctool/graph/derive.lp
                          lines 62-68).
                        - When it makes a new entry, cctool finds the
                          register from that same edge and takes the
                          first one it finds (src/cctool/edit/edit.py
                          lines 1629-1645).
                        - Under the ruled direction, a reference runs
                          only into a segment consumed, never upward
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 12-18), so cc-public's type entry
                          cannot name a peer's register.
                        - Extension files keep each entry inside the
                          register its type names, as read
                          (_data/decision/dec_how_peers_add_vocabulary/opt_peer_extends_core_registers.yaml,
                          brief). Strength: strong for entries of
                          cc-public types and the same at ten times
                          the size; it does not touch a peer type
                          whose entries sit in a register the peer
                          type itself names.

