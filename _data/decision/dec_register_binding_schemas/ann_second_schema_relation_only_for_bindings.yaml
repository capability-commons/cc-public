title:                  A schema relation kept only for bindings
brief:                  |
                        The bindings need a second way to select a
                        schema, r_is_specified_by_schema, beside the
                        type edge every other item uses. Only
                        registers use it, and only to name their
                        binding.
description:            |
                        Domain t_register only
                        (_data/register/reg_relation.yaml lines
                        64-82). Every type names exactly one schema
                        for its items (src/cc_public/check/check.lp
                        lines 596-604). One derive rule per mechanism
                        (src/cc_public/graph/derive.lp lines 78-85);
                        unused_schema names both
                        (src/cc_public/check/check.lp lines 614-618).
                        The relation dates from the placeholder commit
                        bb8c338, where types also used it; f587284
                        (pre-squash) moved types to
                        r_has_items_specified_by_schema and narrowed
                        its domain to t_register. Dropping the
                        bindings would need the checker to apply an
                        entry schema per table entry and close each
                        entry, which sch_reg_* does today. ASSUMPTION:
                        that is one Datalog rule and a small change to
                        src/cc_public/check/schema.py; not sized. From
                        the simplicity advocate.

