title:                  Entry schema choice by listed cases
brief:                  |
                        JSON Schema 2020-12 can pick an entry schema
                        from the data, with if/then on a register's id
                        or with patternProperties on the key prefix,
                        if one schema lists every case. What it cannot
                        do is build a $ref from data or read the
                        mapping from another YAML document.
description:            |
                        https://json-schema.org/draft/2020-12/json-schema-core#section-10.2.2
                        (if/then), section 10.3.2.2
                        (patternProperties), section 8.2.3.1 ($ref is
                        a static reference). Entry keys carry their
                        type prefix (_data/schema/sch_register.yaml
                        lines 68-72). So the limit is that selection
                        needs a central list, not that selection is
                        impossible. Raised by all five advocates.

