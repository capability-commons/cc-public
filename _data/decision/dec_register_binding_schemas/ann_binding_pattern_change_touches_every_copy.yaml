title:                  Binding pattern copied into every register
brief:                  |
                        Each new register needs another near-identical
                        binding file, and a change to the binding
                        pattern must be made once per register.
description:            |
                        That the sch_reg_* files are near-copies is
                        recorded with the decisions on register shape
                        and on schema composition. There are nine
                        today, one per register
                        (_data/schema/sch_reg_*.yaml). Commit 97291f6
                        (pre-squash) touched all six sch_reg_* files
                        then present for one change. After it, eight
                        of the nine sch_regentry_* usage fields still
                        say "Composed with sch_register_entry by
                        sch_reg_*"
                        (_data/schema/sch_regentry_concern.yaml at
                        usage and seven others), while each entry
                        schema now composes sch_register_entry itself
                        (sch_regentry_concern.yaml at allOf).
                        ASSUMPTION: generating the binding files would
                        remove most of the cost; no generator exists.
                        Merged from the flexibility and
                        maintainability advocates.

