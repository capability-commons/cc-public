title:                  Binding pattern copied into every register
brief:                  |
                        Each new register needs another near-identical
                        binding file, and a change to the binding
                        pattern must be made once per register.
description:            |
                        That the six sch_reg_* files are near-copies
                        is recorded with the issues on register shape
                        and on schema composition. Commit 97291f6
                        (pre-squash) touched all six sch_reg_* files
                        for one change. After it, five sch_regentry_*
                        usage fields still say "Composed with
                        sch_register_entry by sch_reg_*"
                        (_data/schema/sch_regentry_concern.yaml lines
                        26-29 and four others), while each entry
                        schema now composes sch_register_entry itself
                        (sch_regentry_concern.yaml lines 74-75).
                        ASSUMPTION: generating the binding files would
                        remove most of the cost; no generator exists.
                        Merged from the flexibility and
                        maintainability advocates.

