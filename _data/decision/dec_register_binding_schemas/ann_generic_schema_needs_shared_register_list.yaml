title:                  Shared register list edited by every register
brief:                  |
                        Without binding files, the choice of entry
                        schema moves into one shared schema or into
                        shared checker code, so every new register
                        edits a shared part. With them, a new register
                        adds only its own files.
description:            |
                        JSON Schema 2020-12 can choose a subschema by
                        instance data only by listing each case, for
                        example with if/then and const
                        (https://json-schema.org/draft/2020-12/json-schema-core#section-10.2.2).
                        A register's id is at its root
                        (_data/register/reg_concern.yaml line 1), so
                        the list would sit in sch_register. The other
                        route is new checker code; no third route was
                        found in src/cc_public/check/schema.py or
                        derive.lp (ASSUMPTION). Each binding refers
                        only outward
                        (_data/schema/sch_reg_concern.yaml lines
                        24-36). cc-public is federated
                        (memory/cc-public-design-principles.md lines
                        14, 21). ASSUMPTION: partners outside this
                        repository would add registers; none exists
                        today. Merged from the compatibility and
                        maintainability advocates.

