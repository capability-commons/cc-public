title:                  Full register check with any standard validator
brief:                  |
                        With a binding file, a register and its
                        entries are checked completely in one pass by
                        any JSON Schema 2020-12 validator. Without it,
                        the register-specific entry fields are checked
                        only if cc-public's own checker gains a rule
                        to apply each entry schema.
description:            |
                        sch_reg_concern composes sch_register and
                        sch_regentry_concern with standard keywords
                        only (allOf, $ref, properties,
                        additionalProperties, unevaluatedProperties)
                        (_data/schema/sch_reg_concern.yaml at allOf).
                        sch_register types each table value only as
                        sch_register_entry
                        (_data/schema/sch_register.yaml at
                        allOf.2.properties.entries.additionalProperties),
                        which leaves an entry open
                        (_data/schema/sch_register_entry.yaml at
                        allOf). The checker pairs schemas with YAML
                        documents in clingo
                        (src/cctool/graph/derive.lp within
                        document_schema) and applies them with the
                        jsonschema 2020-12 validator, extended only so
                        that pattern is read as JSON Schema reads it
                        (src/cctool/check/schema.py within Validator).
                        On a copy of the tree, a stray field in a
                        concern entry is reported under
                        sch_reg_concern, and passes unreported once
                        the binding edge is removed. The toolchain is
                        declared for osx-arm64, osx-64 and linux-64
                        (pyproject.toml at
                        tool.pixi.workspace.platforms). ASSUMPTION: a
                        partner also needs the schema files locally,
                        since the $id URLs could not be fetched here.
                        Merged from the compatibility and flexibility
                        advocates.

