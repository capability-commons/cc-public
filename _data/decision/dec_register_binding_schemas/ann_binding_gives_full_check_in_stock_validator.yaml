title:                  Full register check with any standard validator
brief:                  |
                        With a binding file, a register and its
                        entries are checked completely in one pass by
                        any JSON Schema 2020-12 validator. Without it,
                        the register-specific entry fields are checked
                        only if cc-public's own checker gains a rule
                        to apply each entry schema.
description:            |
                        sch_reg_concern composes sch_register and
                        sch_regentry_concern with standard keywords
                        only (allOf, $ref, properties,
                        additionalProperties, unevaluatedProperties)
                        (_data/schema/sch_reg_concern.yaml lines
                        24-38). sch_register types each table value
                        only as sch_register_entry
                        (_data/schema/sch_register.yaml lines 77-78).
                        The checker pairs schemas with documents in
                        clingo (src/cc_public/graph/derive.lp lines
                        69-85) and applies them with the stock
                        jsonschema Draft202012Validator
                        (src/cc_public/check/schema.py line 107). The
                        toolchain is declared for osx-arm64 and
                        linux-64 only (pyproject.toml line 52).
                        ASSUMPTION: a partner also needs the schema
                        files locally, since the $id URLs could not be
                        fetched here. Merged from the compatibility
                        and flexibility advocates.

