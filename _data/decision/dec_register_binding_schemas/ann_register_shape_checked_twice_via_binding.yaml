title:                  Register shape checked twice
brief:                  |
                        Each register is validated against
                        sch_register through its type and again
                        through its binding. A fault in the shared
                        register shape is found twice, and the checker
                        drops one of the two reports.
description:            |
                        type_register names sch_register
                        (_data/register/reg_data_item_type.yaml at
                        entries.type_register.edge). Each binding
                        composes sch_register
                        (_data/schema/sch_reg_concern.yaml at
                        allOf.0.$ref). A YAML document meets both its
                        type's schema and its own
                        (src/cctool/graph/derive.lp within
                        document_schema), so a register is validated
                        against both. The checker then keeps one row
                        per fault, the one under the schema that
                        reaches more schemas
                        (src/cctool/check/schema.py within _once). A
                        test expects one schema_violation row, under
                        sch_reg_concern, for one bad title in
                        reg_concern
                        (src/cctool/check/_test/test_check.py within
                        test_a_violation_inside_a_register_is_reported_once_at_its_line).
                        It could be simplified inside the chosen
                        option by dropping the allOf on sch_register
                        from the bindings. ASSUMPTION: validation
                        stays complete, since the type edge still
                        applies sch_register. From the simplicity
                        advocate; the maintainability advocate cites
                        the same test.

