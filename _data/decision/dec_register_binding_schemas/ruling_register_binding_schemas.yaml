title:                  One binding schema per register
brief:                  |
                        Each register names its own schema, which
                        composes the shared register shape with the
                        shape of its entries and closes each entry.
                        Any standard JSON Schema validator can then
                        check a register in full, and a new register
                        adds only its own files. Ruled by WTP on
                        2026-10-22.

