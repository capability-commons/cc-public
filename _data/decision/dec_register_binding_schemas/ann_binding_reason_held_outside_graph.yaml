title:                  Binding reason held outside the graph
brief:                  |
                        The nine binding schemas carry no link to the
                        reason they exist, which is held only in a
                        memory note and in this decision.
                        sch_reg_relation went about 20 hours with no
                        reason from Will until he kept it.
description:            |
                        sch_reg_concern holds only identity, prose and
                        allOf (_data/schema/sch_reg_concern.yaml lines
                        1-38). Outside this decision, no file names
                        either of its options (grep of _data and src).
                        The memory note says sch_reg_relation was
                        "added unasked (Will may remove)"
                        (memory/MEMORY.md line 17); it was added in
                        232f001 on 2026-10-13 and kept on WTP
                        2026-10-14. Recording this decision closes
                        most of the gap. From the traceability
                        advocate.

