title:                  Partners still bound to cc-public conventions
brief:                  |
                        A binding file helps a partner only once the
                        partner knows which schema applies and holds
                        the schema files, and both come from cc-public
                        conventions. This holds for either option.
description:            |
                        The schema to apply is named by
                        r_is_specified_by_schema, an edge type of
                        cc-public's own relation register
                        (_data/register/reg_concern.yaml lines 39-42).
                        ASSUMPTION: standard JSON Schema has no way
                        for an instance to name its schema in this
                        form. The checker resolves $ref from local
                        files, not by fetching the $id URLs
                        (src/cc_public/check/schema.py lines 145-153).
                        ASSUMPTION: capability-commons.org does not
                        serve the files; a fetch was blocked here
                        (403). From the compatibility advocate.

