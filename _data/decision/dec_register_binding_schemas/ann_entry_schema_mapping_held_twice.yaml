title:                  Entry schema mapping held twice
brief:                  |
                        The type register already names the entry
                        schema of each register's entry type, so each
                        binding file and the edge that selects it
                        restate a link the graph already holds.
description:            |
                        r_has_items_specified_by_schema names the six
                        sch_regentry_* schemas
                        (_data/register/reg_data_item_type.yaml lines
                        92, 233, 279, 330, 378, 520). The entries of
                        one register share one type prefix
                        (_data/schema/sch_register.yaml lines 68-72).
                        Each sch_reg_* only composes sch_register with
                        one sch_regentry_* and closes the entry
                        (_data/schema/sch_reg_concern.yaml lines
                        24-38). The checker already selects schemas
                        from graph edges
                        (src/cc_public/graph/derive.lp lines 78-85).
                        From the simplicity advocate.

