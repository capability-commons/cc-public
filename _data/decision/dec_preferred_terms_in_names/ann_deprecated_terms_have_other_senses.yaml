title:                  Deprecated terms with ordinary senses
brief:                  |
                        Several deprecated terms are ordinary words
                        that code needs in other senses, so whether a
                        name breaks the rule depends on its meaning,
                        not its spelling. AGENTS.md now holds a term
                        to its concept's sense where it is used as a
                        term, such as in an id, but does not say
                        whether every word of an id counts as a term.
description:            |
                        AGENTS.md#changing-data-items: "Never use a
                        term it lists as deprecated. A term is held to
                        its concept's sense where it is used as a
                        term: in an id, a requirement slot, a title or
                        a link." The maintainer's question is
                        narrower: names that "refer to a concept we
                        have defined" (2026-10-14). Deprecated terms
                        include registry, list and table for
                        concept_register, term, keyword and tag for
                        concept_concept, note and comment for
                        concept_annotation, kind and class for
                        concept_type, and label for
                        concept_protective_mark
                        (_data/register/reg_concept.yaml at entries).
                        Entry is now an admitted term of
                        concept_register_entry (reg_concept.yaml at
                        entries.concept_register_entry.brief). Yet
                        "note" is a field of every item
                        (_data/schema/sch_trait_descriptive.yaml at
                        properties.note), "table" is a field of every
                        register, the register's own fields are
                        term_preferred and term_deprecated, code names
                        a jsonschema registry
                        (src/cctool/check/schema.py within
                        registry_of) and uses list_ prefixes, and ids
                        such as opt_alias_list_of_old_ids carry list.
                        A deprecated term is one not used to designate
                        that concept
                        (_data/schema/sch_regentry_concept.yaml at
                        note and
                        properties.term_deprecated.description). The
                        maintainer keeps "term" for the representation
                        of a concept (2026-10-13).

