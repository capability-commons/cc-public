title:                  Renamed ids that partners may hold
brief:                  |
                        Renaming to follow a new deprecation keeps the
                        old id as an alias for a register entry, but
                        not for a standalone item, so a partner that
                        refers to a standalone item by id loses it.
description:            |
                        cctool rename keeps the old id in the alias
                        list of a register entry (AGENTS.md lines
                        49-53), and rename_without_alias applies only
                        to embedded items, such as register entries
                        (src/cc_public/commit/change.lp lines
                        148-166). A guid never changes (AGENTS.md
                        lines 44-45). The renames in dc5f35f touched
                        Datalog names, not data item ids. ASSUMPTION:
                        Datalog fact names are internal and do not
                        reach partners. If partners refer by guid, the
                        point shrinks to a documentation matter.

