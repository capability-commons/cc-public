title:                  One term in use for each concept
brief:                  |
                        A preferred term in each name that refers to a
                        concept keeps one term in use for that
                        concept, and holding a deprecated term to its
                        concept's sense leaves the word free for its
                        other senses, as ISO 704 and ISO 1087 ask of
                        terms.
description:            |
                        concern_terminological_quality asks whether
                        each term designates one concept, and counts
                        concepts with more than one term in use
                        (_data/register/reg_concern.yaml at
                        entries.concern_terminological_quality.brief
                        and
                        entries.concern_terminological_quality.measure).
                        ISO 1087 rates a deprecated term as undesired
                        for its concept, not as a banned word
                        (_data/schema/sch_regentry_concept.yaml at
                        note and
                        properties.term_deprecated.description), and
                        the register notes that one term may name
                        several concepts
                        (_data/register/reg_concept.yaml at note). The
                        tooling already reports terms that two
                        concepts share (shared_term,
                        src/cctool/check/friction.lp within
                        shared_term) and fails a term rated twice
                        (term_rated_twice, src/cctool/check/check.lp
                        within term_rated_twice), but nothing counts
                        names that use a deprecated term for its
                        concept. Free naming lets several terms for
                        one concept come into use, and an every-word
                        rule would register words that designate no
                        concept.

