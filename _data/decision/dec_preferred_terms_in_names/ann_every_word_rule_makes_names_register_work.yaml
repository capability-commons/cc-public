title:                  Register work for each new word
brief:                  |
                        Identifiers carry grammar and programming
                        words that are not concepts, so registering
                        every word makes each new name a register task
                        or a new exception.
description:            |
                        Relation ids carry grammar words, for example
                        r_has_items_held_in_register
                        (_data/register/reg_relation.yaml line 116).
                        Python names carry list_ prefixes
                        (src/cc_public/edit/edit.py lines 235-236) and
                        set_ and map_ prefixes
                        (src/cc_public/check/schema.py lines 88-94). A
                        new concept must be named by another item in
                        the same batch (AGENTS.md lines 46-47;
                        unused_concept, check.lp lines 638-643), and
                        one concept entry takes about 30 lines of
                        YAML. ASSUMPTION: an exemption list would need
                        its own upkeep.

