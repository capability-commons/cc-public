title:                  Register work for each new word
brief:                  |
                        Identifiers carry grammar and programming
                        words that are not concepts, so registering
                        every word makes each new name a register task
                        or a new exception.
description:            |
                        Relation ids carry grammar words, for example
                        relation_has_items_held_in_register
                        (_data/register/reg_relation.yaml at
                        entries.relation_has_items_specified_by_schema.description).
                        Python names carry list_ prefixes
                        (src/cctool/edit/edit.py) and set_ and map_
                        prefixes (src/cctool/check/schema.py within
                        ecma). A new concept must be named by another
                        item in the same batch
                        (AGENTS.md#working-beside-other-agents;
                        unused_concept, check.lp), and one concept
                        entry takes about 30 lines of YAML.
                        ASSUMPTION: an exemption list would need its
                        own upkeep.

