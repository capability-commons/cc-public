title:                  Preferred terms in names and prose
brief:                  |
                        A name or text that refers to a registered
                        concept uses its preferred term or an admitted
                        one, and never a term deprecated for that
                        concept, as ISO 1087 rates a term only for its
                        concept. A word used in another sense keeps
                        that sense. Registering every word would make
                        terms of grammar words and of names we do not
                        own, and free naming would let one concept go
                        by several names. Ruled by William Payne on
                        2026-10-22.

