title:                  Sense qualifier now in the rule on deprecated terms
brief:                  |
                        The old annotation says that the rule in
                        AGENTS.md has no qualifier on meaning, and
                        lists entry among the deprecated terms. Now
                        AGENTS.md holds a term to its concept's sense
                        only where it is used as a term, and entry is
                        an admitted term.
description:            |
                        AGENTS.md lines 129-133 still say "Never use a
                        term it lists as deprecated", and then "A term
                        is held to its concept's sense where it is
                        used as a term: in an id, a requirement slot,
                        a title or a link. Elsewhere an everyday word,
                        such as keep or refuse, keeps its everyday
                        senses." concept_register_entry lists entry
                        under term_admitted, beside regentry
                        (_data/register/reg_concept.yaml lines
                        160-167). The other terms the annotation lists
                        are still deprecated: registry, list and table
                        for concept_register, term, keyword and tag
                        for concept_concept, note and comment for
                        concept_annotation, kind and class for
                        concept_type, and label for
                        concept_protective_mark. Whether a code name
                        such as list_ prefixes counts as an id is not
                        spelled out. Found in the review of
                        2026-10-22.

