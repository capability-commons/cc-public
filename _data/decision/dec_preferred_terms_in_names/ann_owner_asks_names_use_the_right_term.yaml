title:                  Owner's question on registered terms in names
brief:                  |
                        The owner asks whether variable names which
                        refer to a registered concept use its right
                        term, in part or in whole, after finding the
                        earlier names hard to read.
description:            |
                        Owner's statement, 2026-10-14T07:10:30Z
                        (will-messages.md line 449): "When the
                        variable names refer to a concept we have
                        defined in our concept register, do they use
                        the right term? (As a part or as a whole of
                        the variable name)." The same message says
                        clearer variable names are "MUCH improved".
                        The stricter rule is "proposed, not yet
                        enforced" in an assistant-written summary the
                        owner relayed on 2026-10-09T17:52:14Z
                        (will-messages.md line 55).

