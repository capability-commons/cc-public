title:                  Foreign vocabularies in identifiers
brief:                  |
                        Registering every word reaches names the
                        project does not own, such as JSON Schema
                        keywords and the terms of a partner's
                        register, which cannot be renamed without
                        breaking the tools that read them.
description:            |
                        Every schema uses JSON Schema 2020-12 keywords
                        such as $schema, allOf and
                        unevaluatedProperties
                        (_data/schema/sch_annotation.yaml lines 1-2,
                        38-42). A concept from a partner names an
                        entry in their register
                        (_data/register/reg_concept.yaml lines 29-31).
                        The owner fixes a rule that keeps needing
                        exceptions in the rule itself (memory
                        enforcement-approach.md). ASSUMPTION: the rule
                        covers field names in data and schema files,
                        not only ids.

