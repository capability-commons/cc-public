title:                  Mechanical check in place of review judgment
brief:                  |
                        An enforced every-word rule could be checked
                        by the tooling, so a reviewer would no longer
                        judge each name by hand.
description:            |
                        Today no check tests names against the
                        register (check.lp lines 635-643), and the
                        stricter rule is "proposed, not yet enforced"
                        (an assistant-written summary relayed by the
                        owner, 2026-10-09T17:52:14Z). ASSUMPTION:
                        review time scales with the names touched.

