title:                  Unchecked naming rule
brief:                  |
                        No check tests a name against the preferred or
                        deprecated terms, so the rule on names rests
                        on review, and names already drift from it. A
                        reviewer must judge each name by hand.
description:            |
                        Rule: AGENTS.md lines 129-133. The term fields
                        are read into designation facts
                        (src/cctool/graph/extract.py lines 75-78) for
                        the link checks and the strict fields
                        (unlinked_term, src/cctool/check/check.lp line
                        1932; term_to_link, src/cctool/check/advise.lp
                        line 217), but no check tests an id or a code
                        name against them, and a deprecated term is
                        read only to be left out (check.lp lines 1834
                        and 2493). Names drift:
                        src/cctool/web/network.py lines 78-80 and
                        422-428 call the type of an item its kind
                        (map_kind, KIND_ANNOTATION), and
                        src/cctool/graph/extract.py lines 325 and 1042
                        say "the prefix of its kind", though kind is
                        deprecated for concept_type
                        (_data/register/reg_concept.yaml lines 85-87).
                        The one check of record is cctool history
                        check (memory enforcement-approach.md,
                        maintainer's decision of 2026-10-14).
                        ASSUMPTION: review attention per line does not
                        grow with the code.

