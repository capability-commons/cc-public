title:                  Unchecked naming rule
brief:                  |
                        No check tests a name against the preferred or
                        deprecated terms, so the rule on names rests
                        on review, and names already drift from it. A
                        reviewer must judge each name by hand.
description:            |
                        Rule: AGENTS.md#changing-data-items. The term
                        fields are read into designation facts
                        (src/cctool/graph/extract.py within
                        RATING_DEPRECATED and MAP_TERM_RATING) for the
                        link checks and the strict fields
                        (unlinked_term, src/cctool/check/check.lp
                        within unlinked_term; term_to_link,
                        src/cctool/check/advise.lp within
                        term_to_link), but no check tests an id or a
                        code name against them, and a deprecated term
                        is read only to be left out (check.lp within
                        term_sense and false_friend). Names drift:
                        src/cctool/web/network.py call the type of an
                        item its kind (map_kind, KIND_ANNOTATION), and
                        src/cctool/graph/extract.py within
                        definition_id say "the prefix of its kind",
                        though kind is deprecated for concept_type
                        (_data/register/reg_concept.yaml just after
                        entries.concept_type.edge). The one check of
                        record is cctool history check (memory
                        enforcement-approach.md, maintainer's decision
                        of 2026-10-14). ASSUMPTION: review attention
                        per line does not grow with the code.

