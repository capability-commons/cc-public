title:                  Preferred terms in names and prose
brief:                  |
                        Names and prose that refer to a registered
                        concept use its preferred term or an admitted
                        term, and never a term deprecated for that
                        concept. A word used in another sense keeps
                        that sense.
description:            |
                        Stated in AGENTS.md#changing-data-items and in
                        the usage of the concept register
                        (_data/register/reg_concept.yaml at usage),
                        first written in a0b3f50 and since given its
                        sense qualifier. Applied in dc5f35f, where
                        entry_key became register_entry_key and
                        misplaced_entry became
                        misplaced_register_entry.

