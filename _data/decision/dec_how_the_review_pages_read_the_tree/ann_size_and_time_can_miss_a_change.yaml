title:                  Size and time can miss a change
brief:                  |
                        A file rewritten with the same size and the
                        same time of change looks unchanged, so a page
                        could show the tree as it was. Times are kept
                        to the nanosecond on the file systems used, so
                        this needs two writes within one tick of the
                        clock.
description:            |
                        Editors, git and cctool all set the time of
                        change when they write. Assumption: a shared
                        folder of the device VM keeps times finer than
                        a second; not checked. A digest of each file
                        would not miss, but costs about what the read
                        does now. Strength: weak.

