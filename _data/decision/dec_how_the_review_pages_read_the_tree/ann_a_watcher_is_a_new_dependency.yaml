title:                  A watcher is a new dependency
brief:                  |
                        Watching the file system needs a package such
                        as watchdog, which works differently on macOS
                        and Linux, and may get no events for a folder
                        shared into a VM, as the tree is on atlas.
description:            |
                        Assumption: the shared folder of the device VM
                        does not pass on change events; not tested.
                        Strength: mid.

