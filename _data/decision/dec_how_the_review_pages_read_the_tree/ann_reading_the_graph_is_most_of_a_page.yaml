title:                  Reading the graph is most of a page
brief:                  |
                        Of the 450 to 1,000 ms a page takes, 420 to
                        850 ms goes on reading the tree into a graph,
                        which is the same for every page until a file
                        changes. Making the page is 15 to 200 ms.
description:            |
                        Measured with the Server-Timing of each
                        response, best of three, warm, in a cloud
                        container on dev at bbaeeba. Strength: strong;
                        it is measured, and the share grows with the
                        tree, since the read is linear in the files
                        and the page is not.

