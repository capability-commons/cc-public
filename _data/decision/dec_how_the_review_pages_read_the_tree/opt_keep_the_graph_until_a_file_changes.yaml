title:                  Keep the graph until a file changes
brief:                  |
                        The server keeps the last graph it read, and
                        the interface facts, with the size and time of
                        change of every file of the tree. Each request
                        walks the tree for those, and reads it again
                        only if one differs or a file came or went. A
                        form submit drops the graph.

