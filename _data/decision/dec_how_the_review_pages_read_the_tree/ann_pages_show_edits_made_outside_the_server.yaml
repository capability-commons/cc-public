title:                  Pages show edits made outside the server
brief:                  |
                        Agents edit the tree with cctool batch and
                        editors while the server runs, and a page
                        should show those edits when it is loaded.
                        Reading afresh and comparing file times both
                        do; a watcher does only while its events
                        arrive; a database does only if every writer
                        brings it up to date, or if it is checked
                        against the files.

