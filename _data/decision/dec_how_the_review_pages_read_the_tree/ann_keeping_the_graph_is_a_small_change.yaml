title:                  Keeping the graph is a small change
brief:                  |
                        Keeping the graph with the file times is a few
                        dozen lines in the server, with no new
                        dependency and nothing written to disk, and
                        the timing log shows whether it works.
description:            |
                        Assumption: a graph is not changed by the
                        pages made from it, so threads may share it;
                        the pages read it only, but this is not
                        enforced. Strength: mid.

