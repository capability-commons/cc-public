title:                  Keep the facts of the tree in a database
brief:                  |
                        A SQLite file beside the check store holds the
                        items, edges and mentions of each file, keyed
                        by the digest of the file, and is brought up
                        to date for each file that changed. The
                        server, the check and the query commands all
                        read it.

