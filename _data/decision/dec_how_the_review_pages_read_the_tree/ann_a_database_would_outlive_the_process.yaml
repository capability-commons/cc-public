title:                  A database would outlive the process
brief:                  |
                        A graph in memory is lost when the server
                        stops, so the first page after a start still
                        waits about 10 s, and every cctool command
                        reads the tree again. Facts kept on disk would
                        serve every process, which a graph in memory
                        cannot.
description:            |
                        This bears more on the speed of cctool as a
                        whole, such as the gate and merges, than on
                        the pages, and may be better decided there.
                        Strength: mid.

