title:                  A database is a second copy of the tree
brief:                  |
                        A database of facts is a second copy of the
                        tree, with its own schema to keep in step with
                        the extractor and its own ways to be out of
                        date. The pages are made from python objects,
                        so a page would still build them from the
                        rows, which a graph kept in memory does not
                        need.
description:            |
                        The check store under .git already keeps
                        layout and schema verdicts by file digest, and
                        the query commands build SQLite in memory from
                        the facts. Strength: mid; the cost is in
                        upkeep, not measured.

