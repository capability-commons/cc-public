title:                  A walk of the file times takes 20 ms
brief:                  |
                        Walking the tree for the size and time of
                        change of its 4,100 files, skipping the
                        folders that the read skips, takes 18 to 21
                        ms, so a page that finds nothing changed costs
                        that and the 15 to 200 ms of making it.
description:            |
                        Measured with os.walk and os.stat in a cloud
                        container. Assumption: the device VM on atlas,
                        which reads the tree through a shared folder,
                        may stat files more slowly; not measured
                        there. Strength: mid.

