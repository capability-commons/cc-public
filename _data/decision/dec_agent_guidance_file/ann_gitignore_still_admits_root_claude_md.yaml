title:                  Root CLAUDE.md still admitted by .gitignore
brief:                  |
                        The .gitignore still admits a root CLAUDE.md
                        beside AGENTS.md, so a committed CLAUDE.md
                        that shadows AGENTS.md is not stopped.
description:            |
                        Source: repo/.gitignore line 66 "!/AGENTS.md"
                        and line 67 "!/CLAUDE.md". The same line would
                        let a one-line importing CLAUDE.md be
                        committed.

