title:                  AGENTS.md skipped in a directory added to a session
brief:                  |
                        When cc-public is added with --add-dir to a
                        Claude Code session rooted in another
                        repository, its CLAUDE.md can load but its
                        AGENTS.md does not, so that session gets none
                        of the guidance.
description:            |
                        With
                        CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD
                        set, an added directory's CLAUDE.md loads but
                        its AGENTS.md does not:
                        https://code.claude.com/docs/en/memory, "Where
                        AGENTS.md differs from CLAUDE.md", fetched
                        2026-10-15. Codex reads AGENTS.md only on the
                        chain to its working directory (openai/codex
                        codex-rs/core/src/agents_md.rs lines 7-18,
                        60-110, fetched 2026-10-15). cc-dtu and
                        cc-dtu-pii are content repositories beside
                        cc-public (pd/memory/cc-folder-layout.md line
                        14). ASSUMPTION: agents will sometimes work in
                        a content repository with cc-public added; WTP
                        has not said so. ASSUMPTION, not checked:
                        Codex reads no AGENTS.md from a directory
                        added another way. Without that variable an
                        added directory's CLAUDE.md does not load
                        either (same page, "Load from additional
                        directories"). With it, a one-line CLAUDE.md
                        holding "@AGENTS.md" would close the gap for
                        Claude Code (same page, "Share one file with
                        other coding tools"). ASSUMPTION: that import
                        is not held back as an external import needing
                        approval; the page does not say whether an
                        added directory counts as outside the working
                        directory.

