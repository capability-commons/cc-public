title:                  Newer, switchable AGENTS.md reading in Claude Code
brief:                  |
                        Claude Code reads CLAUDE.md in every version
                        but reads AGENTS.md only from v2.1.277,
                        through a built-in plugin that can be off, so
                        the chosen file rests on newer vendor
                        behavior.
description:            |
                        Source:
                        https://code.claude.com/docs/en/memory,
                        section "When AGENTS.md support is
                        unavailable", fetched 2026-10-15: not before
                        v2.1.277, not with the plugin disabled, not in
                        some first sessions after an upgrade, and
                        before v2.1.281 not in some Bedrock or
                        no-telemetry sessions. The documented hedge is
                        a CLAUDE.md holding "@AGENTS.md", which
                        neither alternative names. ASSUMPTION: the
                        versions contributors run are not recorded.

