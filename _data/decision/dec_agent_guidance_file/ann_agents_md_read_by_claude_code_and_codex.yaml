title:                  AGENTS.md read by both Claude Code and Codex
brief:                  |
                        AGENTS.md is a more generic name than
                        CLAUDE.md, and both Claude Code and Codex read
                        it, so one file serves either agent with no
                        setup.
description:            |
                        Owner's reason. Will, 2026-10-14T08:42:51Z:
                        "I'd rather AGENTS.md than CLAUDE.md as it's a
                        bit more generic". At 08:50:01Z he briefly
                        chose CLAUDE.md ("let's rename AGENTS.md to
                        CLAUDE.md and at least be internally
                        consistent"), built in 87c602d. At 08:51:24Z:
                        "Apparently OpenAI Codex can also use skills,
                        and both Claude Code and Codex can use
                        AGENTS.md - So that changes my decision",
                        built in 6255160 (pre-squash). Claude Code
                        reads AGENTS.md "without adding a CLAUDE.md,
                        an import, or a setting" from v2.1.277
                        (https://code.claude.com/docs/en/memory,
                        section "AGENTS.md", fetched 2026-10-15). The
                        agents.md site lists many further agents that
                        read the file (https://agents.md/, fetched
                        2026-10-15).

