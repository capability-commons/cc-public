title:                  Root CLAUDE.md no longer admitted by .gitignore
brief:                  |
                        ann_gitignore_still_admits_root_claude_md says
                        .gitignore admits a root CLAUDE.md beside
                        AGENTS.md. It no longer does, so a root
                        CLAUDE.md is ignored like any other unlisted
                        file.
description:            |
                        .gitignore ignores every file (its first rule,
                        "*") and then admits the root files it names
                        under "Project root configuration and
                        documentation": .agents, .claude, .githooks,
                        .gitignore, AGENTS.md, LICENSE, NOTICE,
                        pixi.lock, pyproject.toml and README.md. No
                        line names CLAUDE.md. Found in the review of
                        2026-10-22.

