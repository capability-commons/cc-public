title:                  CLAUDE.md ignored by Codex
brief:                  |
                        Codex does not read CLAUDE.md unless each user
                        adds it to a fallback list in their own
                        config, so with CLAUDE.md a Codex user gets no
                        guidance without a setup step.
description:            |
                        Codex looks for AGENTS.override.md, then
                        AGENTS.md, then the names in
                        project_doc_fallback_filenames in
                        ~/.codex/config.toml. "Filenames not on this
                        list are ignored for instruction discovery."
                        Source:
                        https://learn.chatgpt.com/docs/agent-configuration/agents-md,
                        redirected from
                        https://developers.openai.com/codex/guides/agents-md,
                        fetched 2026-10-15. Will names Codex as an
                        agent to serve (2026-10-14T08:51:24Z).

