title:                  Silent shadowing of AGENTS.md by CLAUDE files
brief:                  |
                        Claude Code skips AGENTS.md without any error
                        when a CLAUDE.md or CLAUDE.local.md is in the
                        working directory or above it, and nothing in
                        the repository checks for this.
description:            |
                        Source:
                        https://code.claude.com/docs/en/memory,
                        section "When Claude Code reads AGENTS.md",
                        fetched 2026-10-15. InstructionsLoaded hooks
                        do not fire for AGENTS.md read this way (same
                        page, "Where AGENTS.md differs from
                        CLAUDE.md"). An interactive session shows an
                        "AGENTS.md loaded" line only when it reads the
                        file, so the missing line is the only sign. A
                        user-level setting, claude-md-and-agents-md,
                        makes Claude Code read both (same page).
                        CLAUDE.local.md is a documented place for
                        personal preferences and is not on the
                        .gitignore whitelist, so review never sees it
                        (repo/.gitignore lines 37, 58-75). The
                        documented remedy is a CLAUDE.md holding
                        "@AGENTS.md" (same page, "Share one file with
                        other coding tools"), which never makes Claude
                        read AGENTS.md twice (same page, "Remove an
                        earlier AGENTS.md workaround"). ASSUMPTION: a
                        stray CLAUDE file can sit above a
                        contributor's clone; no check for one was
                        found by grep, 2026-10-15.

