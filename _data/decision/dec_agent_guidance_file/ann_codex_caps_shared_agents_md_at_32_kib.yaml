title:                  One shared root file, capped at 32 KiB in Codex
brief:                  |
                        Codex cuts the chain of AGENTS.md files at 32
                        KiB by default and drops the rest with no
                        notice to the user, so shared guidance past
                        about seven times its present size has to move
                        into skills.
description:            |
                        Codex concatenates every AGENTS.md from the
                        git root down to the working directory, and no
                        others: openai/codex
                        codex-rs/core/src/agents_md.rs lines 7-18 and
                        189-265 (main branch, fetched 2026-10-15). The
                        default budget is 32 KiB
                        (codex-rs/config/src/config_toml.rs line 75,
                        DEFAULT_PROJECT_DOC_MAX_BYTES); past it the
                        text is truncated with only a tracing warning
                        (agents_md.rs lines 155-165). Each user can
                        change it as project_doc_max_bytes
                        (codex-rs/core/src/config/mod.rs line 952).
                        repo/AGENTS.md is 4602 bytes (wc -c,
                        2026-10-15), about 14% of the budget. Claude
                        Code expands "@path" imports and loads nested
                        AGENTS.md on demand
                        (https://code.claude.com/docs/en/memory, "When
                        Claude Code reads AGENTS.md", fetched
                        2026-10-15). ASSUMPTION: Codex does not expand
                        "@path" imports; no such code was found in
                        agents_md.rs. Skills reach both agents
                        (repo/AGENTS.md lines 57-62). This bounds the
                        "one file for both agents" premise; it does
                        not favor CLAUDE.md, which Codex does not
                        read.

