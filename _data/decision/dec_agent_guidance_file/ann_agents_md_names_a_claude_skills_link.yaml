title:                  Claude-specific skills link in the guidance
brief:                  |
                        AGENTS.md still tells agents that Claude Code
                        reaches the skills only through a
                        .claude/skills link, so the guidance is not
                        free of Claude-specific parts.
description:            |
                        Source: repo/AGENTS.md lines 57-62;
                        .claude/skills is a symbolic link to
                        ../.agents/skills, added in 7f3412f
                        (pre-squash). Git checks a symbolic link out
                        as a text file on Windows unless core.symlinks
                        is on (https://code.claude.com/docs/en/memory,
                        Windows note). README.md#getting-started
                        already rule out Windows as a development
                        environment for this reason. The same link
                        would be needed under CLAUDE.md.

