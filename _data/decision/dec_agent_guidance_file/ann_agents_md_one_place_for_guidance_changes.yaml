title:                  One place to change the agent guidance
brief:                  |
                        With AGENTS.md a change to the guidance is
                        made in one file and reaches both agents.
                        CLAUDE.md would need a second file or an
                        import to serve Codex too.
description:            |
                        The guidance is in repo/AGENTS.md lines 1-93,
                        and the one skill points back to it
                        (.agents/skills/editing-data-items/SKILL.md#editing-data-items).
                        Codex loads AGENTS.md automatically
                        (https://developers.openai.com/codex/learn/best-practices.md,
                        read 2026-10-15). Codex ignores any name not
                        on its fallback list, and that list is set in
                        the user's ~/.codex/config.toml
                        (https://learn.chatgpt.com/docs/agent-configuration/agents-md,
                        fetched 2026-10-15).

