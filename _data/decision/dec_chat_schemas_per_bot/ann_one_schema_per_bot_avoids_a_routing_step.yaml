title:                  One schema keeps the core free of type routing
brief:                  |
                        One schema per bot leaves out the step that
                        picks a type from the first message or by
                        asking, and the state and tests that step
                        needs. If the core takes its schema as a
                        parameter, a later move to several schemas
                        stays local.
description:            |
                        The several-schemas option picks a type from
                        the first message or by asking
                        (opt_several_schemas_per_bot.yaml, brief). The
                        repository asks that a type, field or command
                        be added only when a real instance needs it
                        (AGENTS.md, "Keep it small", lines 217-221).
                        ASSUMPTION: type selection needs its own
                        conversation state and its own tests for a
                        wrong or unclear pick. Holds at ten times the
                        size: yes, because ten bots with one schema
                        each run the same core, while routing logic
                        grows with the number of types a bot serves.

