title:                  Items that need a companion item
brief:                  |
                        Some types cannot be added alone, because the
                        checks require another item to name them. A
                        bot fixed to one schema cannot complete such
                        an item, though it fits a self-contained type
                        such as the first planned instance.
description:            |
                        A new concept must be named by some other
                        item, so the two are made together with cctool
                        batch (AGENTS.md#changing-data-items). batch
                        exists so that items that need each other are
                        made together (src/cctool/edit/edit.py).
                        Initially one schema per bot, eventually maybe
                        more (owner's statement). ASSUMPTION: a member
                        skill profile needs no companion item of
                        another type. Holds at ten times the size:
                        yes, because whether a type needs a companion
                        item is fixed by the checks, not by the number
                        of items.

