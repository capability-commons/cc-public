title:                  Easily recognized bot with one purpose
brief:                  |
                        A bot that serves one type tells a new
                        contributor at once what it is for and needs
                        no step to pick a type. A bot with several
                        types adds that step and the chance of picking
                        the wrong one.
description:            |
                        The several-schemas option picks a type from
                        the first message or by asking
                        (_data/decision/dec_chat_schemas_per_bot/opt_several_schemas_per_bot.yaml,
                        brief). A likely first instance is member
                        skill profiles for a volunteer team
                        (context.md, facts gathered). ASSUMPTION:
                        volunteer contributors do not know the type
                        names of the register. Holds at ten times the
                        size: no, because with ten times as many types
                        a contributor must find the right one of many
                        bots, and one bot that asks becomes easier to
                        learn.

