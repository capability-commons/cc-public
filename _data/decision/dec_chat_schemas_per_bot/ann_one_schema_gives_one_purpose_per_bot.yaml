title:                  One stated purpose per bot
brief:                  |
                        A bot with one schema has one purpose that its
                        notice can state exactly. A bot that serves
                        several types has to describe a broader
                        purpose, or pick a type only after the person
                        has started talking.
description:            |
                        The one-schema option gives each bot one type,
                        and so one schema
                        [_data/decision/dec_chat_schemas_per_bot/opt_one_schema_per_bot.yaml,
                        brief]. The several-schemas option picks a
                        type from the first message or by asking
                        [_data/decision/dec_chat_schemas_per_bot/opt_several_schemas_per_bot.yaml,
                        brief]. The open admission option relies on a
                        notice that a person accepts
                        [_data/decision/dec_chat_signal_admission/opt_admit_anyone_with_consent.yaml,
                        brief]. ISO/IEC 29100 sets out purpose
                        limitation as a privacy principle
                        [_data/register/reg_concern.yaml at
                        entries.concern_privacy.note]. Holds at ten
                        times the size: no, because at ten times the
                        types, one bot per type means many Signal
                        numbers, and a per-type notice inside one bot
                        could serve as well.

