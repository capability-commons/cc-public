title:                  Smaller prompt with one schema per bot
brief:                  |
                        A bot with one schema carries only that schema
                        in its prompt. A bot with several must carry
                        all of them, or a summary of them, until it
                        knows the type, and spends an extra exchange
                        to pick one.
description:            |
                        Schemas range from about 1.3 KB
                        (sch_reg_concern.yaml) to about 27 KB
                        (sch_interface_control_document.yaml), and the
                        45 total about 155 KB (wc -c on _data/schema,
                        2026-10-22). The several-schemas option picks
                        a type from the first message or by asking
                        (_data/decision/dec_chat_schemas_per_bot/opt_several_schemas_per_bot.yaml).
                        ASSUMPTION: once the type is picked, a
                        multi-schema bot can drop the other schemas
                        from its prompt, so the extra cost falls only
                        on the first turns. Holds at ten times the
                        size: yes, because the cost grows with the
                        number of schemas a bot serves, not with the
                        graph.

