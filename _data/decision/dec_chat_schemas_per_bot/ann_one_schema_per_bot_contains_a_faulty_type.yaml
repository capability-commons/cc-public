title:                  Faulty type contained by one schema per bot
brief:                  |
                        With one schema per bot, a faulty schema or a
                        wrong choice of type cannot spill into the
                        capture of other types. Several schemas per
                        bot add a step that picks the type, and that
                        step can pick wrong.
description:            |
                        The one-schema option gives each bot one type
                        and so one schema (opt_one_schema_per_bot,
                        brief). The several-schemas option picks the
                        type from the first message or by asking
                        (opt_several_schemas_per_bot, brief). A step
                        that classifies free text with an LLM
                        sometimes picks the wrong class (ASSUMPTION).
                        Holds at ten times the size: yes, because more
                        types per bot give the picking step more ways
                        to go wrong, while one bot per type only adds
                        processes to run.

