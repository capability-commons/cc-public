title:                  Home of a performance budget
brief:                  |
                        Where is a bound on time or memory stated, so
                        that a measurement can be checked against it?
description:            |
                        A timing over the whole suite varies with the
                        machine and its load, so a budget is measured
                        by tests named for it, run apart from the
                        suite.

