title:                  Budget traced as a need of its own
brief:                  |
                        A budget written as a requirement has its own
                        id, rationale and verification method, so a
                        benchmark's verifies edge points at it. A rule
                        that finds an unverified requirement then
                        finds an unverified budget. A field on another
                        item gives the benchmark nothing of its own to
                        point at.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_budget_as_requirement_reuses_the_trace
                          (the requirement option's brief).
                        - A requirement on dev carries a rationale, a
                          verification_method and a
                          verification_approach
                          [_data/requirement/rqt_rename_keeps_guid.yaml
                          at fields rationale, verification_method and
                          verification_approach].
                        - Also rests on a source stated once in
                          ann_budget_as_requirement_reuses_the_trace
                          (the field on a requirement or member).
                        - Also rests on a source stated once in
                          ann_budget_as_requirement_reuses_the_trace
                          (register entries named by an edge).
                        - WTP asked that runtime profiles be linked
                          through test cases to requirements and
                          interface control documents [owner's
                          statement, 2026-10-25]. Strength: Strong
                          against the field, and it holds at ten times
                          the size. Moderate against the register,
                          whose entries have ids and edges but whose
                          reason for each bound has no slot unless the
                          register adds one.

