title:                  Budget compared against a single run
brief:                  |
                        A timing varies with the machine and its load
                        by about 10 per cent between single runs, so a
                        budget compared against one run fails at
                        random. Only the field option states the
                        statistic compared, such as a median of
                        several runs, as part of the budget itself. A
                        budget that fails at random teaches people to
                        ignore it.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_budget_must_name_its_statistic (suite
                          timing varies with the machine).
                        - Also rests on a source stated once in
                          ann_budget_must_name_its_statistic (10 per
                          cent noise between runs).
                        - Also rests on a source stated once in
                          ann_budget_must_name_its_statistic (the
                          field option names the statistic).
                        - Also rests on a source stated once in
                          ann_budget_must_name_its_statistic (the
                          requirement option names no statistic).
                        - The timing log records the host and the
                          python version beside each run
                          [src/cctool/gate/timing.py at module
                          docstring].
                        - September kept a check out of the gate
                          because a gate that is red until something
                          outside changes teaches people to stop
                          reading it [origin/main:pyproject.toml at
                          the comment on the dependency audit].
                          Strength: weak to moderate. The point is
                          that the statistic and the machine are part
                          of the budget, and the other two options
                          could adopt the same fields. It holds at ten
                          times the size, since more budgets mean more
                          chances of a random failure.

