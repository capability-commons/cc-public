title:                  Budget as a requirement
brief:                  |
                        A budget is a requirement of its own, verified
                        like any other. sch_requirement gains an
                        optional measure, with the quantity, the
                        limit, its unit, the statistic compared and
                        the number of runs, and the qualifier of the
                        statement is composed from it, so that the
                        bound is written once and a rule can compare
                        it with what is measured. A requirement with a
                        measure must have a verifier. A budget field
                        on the constrained item, and a register of
                        budgets, are rejected. Ruled by WTP on
                        2026-10-28, by writing "Uphold
                        opt_budget_as_a_requirement" and approving the
                        measure field.

