title:                  Budget that reuses the requirement and its trace
brief:                  |
                        A budget held as a requirement uses the type,
                        schema, verification fields, trace and
                        evidence that every requirement already has,
                        and the verifies edge this work adds anyway. A
                        register of budgets adds a register, two
                        schemas, an edge and a path from budget to
                        evidence for the same content. A field on the
                        constrained item adds the same field to two
                        schemas.
description:            |
                        Sources:
                        - Each register on dev has a schema for the
                          register and a schema for its entries
                          [_data/schema, sch_reg_concern.yaml and
                          sch_regentry_concern.yaml as one example].
                        - A requirement already carries
                          verification_method and
                          verification_approach
                          [_data/requirement/rqt_edit_refuses_new_failure.yaml
                          at verification_method].
                        - With the requirement option the measure
                          becomes a structured field and the budget is
                          verified by a benchmark test like any other
                          requirement
                          [_data/decision/dec_home_of_a_performance_budget/opt_budget_as_a_requirement.yaml
                          at brief].
                        - The register option makes budgets entries of
                          a register of their own, each naming its
                          target by an edge
                          [_data/decision/dec_home_of_a_performance_budget/opt_budget_register.yaml
                          at brief].
                        - A field on the constrained item touches the
                          schema of both the requirement and the
                          interface member
                          [_data/decision/dec_home_of_a_performance_budget/opt_budget_field_on_the_constrained_item.yaml
                          at brief, _data/schema at
                          sch_requirement.yaml and
                          sch_interface_member.yaml].
                        - A requirement item on dev is 43 to 46 lines
                          [_data/requirement/, by line count].
                        - AGENTS.md asks that a type, relation, field
                          or command be added only when a real
                          instance needs it [AGENTS.md at section Keep
                          it small].
                        - WTP asked that tests link to functional
                          requirements and interface control documents
                          [owner's statement, 2026-10-25]. Strength
                          for concern_maintainability: Moderate. The
                          requirement option adds one field and no new
                          path. The field option is fewer lines per
                          budget, but changes two schemas and gives
                          one item two things to verify. The register
                          adds the most structure. At ten times the
                          budgets the requirement option costs about
                          45 lines each, which is the main cost
                          against it. Strength for concern_simplicity:
                          moderate. The requirement option adds one
                          structured field. The register adds a type,
                          an edge and a path from budget to evidence.
                          The field adds one field in two places. The
                          count does not change at ten times the
                          budgets.

