title:                  Budget that names its statistic
brief:                  |
                        A bound on time can only be checked if it
                        names the statistic and the run count, because
                        single runs vary by about 10 per cent. The
                        budget field states that by its form, and a
                        requirement needs the same structure in its
                        measure field.
description:            |
                        Sources:
                        - A timing over the whole suite varies with
                          the machine and its load, so a budget is
                          measured by tests named for it
                          [_data/decision/dec_home_of_a_performance_budget/dec_home_of_a_performance_budget.yaml
                          at description].
                        - Single runs in the container differ by up to
                          about 10 per cent from noise [measured by
                          Claude in the cloud container, 2026-10-26].
                        - The same commit gate takes about 78 s on
                          atlas with 2 CPUs, while the container has 4
                          CPUs [owner's statements in the gate-speed
                          work, 2026-10-22; measured by Claude in the
                          cloud container, 2026-10-26].
                        - The budget field names the quantity, its
                          unit, the limit and the statistic compared,
                          such as a median of several runs
                          [_data/decision/dec_home_of_a_performance_budget/opt_budget_field_on_the_constrained_item.yaml
                          at brief].
                        - The requirement option has a structured
                          measure field, and its brief does not name a
                          statistic
                          [_data/decision/dec_home_of_a_performance_budget/opt_budget_as_a_requirement.yaml
                          at brief]. Strength: weak. The home matters
                          less than the form, and any of the three can
                          carry the statistic. The point holds at any
                          size, and it grows with the number of
                          budgets compared on more than one machine.

