title:                  Small budget change beside its subject
brief:                  |
                        A budget field changes in a few lines inside
                        the item it bounds, so a reviewer reads the
                        new limit beside the statement it constrains.
                        A new requirement per budget is a change of
                        about 45 lines. A register puts the bound in a
                        file apart from its subject.
description:            |
                        Sources:
                        - Also rests on a source stated once in
                          ann_budget_must_name_its_statistic (the
                          field's quantity, unit, limit and
                          statistic).
                        - Also rests on a source stated once in
                          ann_budget_as_requirement_reuses_the_trace
                          (requirements of 43 to 46 lines).
                        - Also rests on a source stated once in
                          ann_budget_as_requirement_reuses_the_trace
                          (a register of budgets apart from their
                          subjects).
                        - The reviewability measure is the size of a
                          change in lines
                          [_data/register/reg_concern.yaml at
                          entries.concern_reviewability.measure]. Strength:
                          Moderate. At ten times the size the field
                          keeps each change small and local, while a
                          requirement per budget adds about 45 lines
                          each. Later changes to a limit are small in
                          every option, so the gap lies mostly in
                          adding budgets.

