title:                  Grep blind to how a deliberation was settled
brief:                  |
                        A search of the files finds the words but not
                        what the graph says of the item they are in. A
                        hit on an annotation does not say which
                        decision it argues, whether that decision is
                        settled or which option was upheld. The
                        expansion answers that in the same row.
description:            |
                        The search tools of the agent in the session
                        that wrote this are Grep, Glob and Read, which
                        match text in files. An annotation names its
                        decision by an edge, and a ruling names the
                        options it settles by relation_upholds and
                        relation_rejects, so the standing of an option
                        is in another file from the option.

