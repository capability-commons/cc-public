title:                  Text search of the graph
brief:                  |
                        Should cctool find items by the words of their
                        prose, and if so how, given that a coding
                        agent already searches the files with grep?
description:            |
                        Raised by the owner on 2026-10-19: text search
                        should sit beside the SQL, logic, jq and
                        SPARQL query commands, and is worth adding
                        only if it also uses the structure of the
                        graph. It is the search that
                        opt_rulings_retrieved_by_text would use, and
                        the owner expects advocates, design rules and
                        lessons learned to rely on it too.

