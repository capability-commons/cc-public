title:                  No dependency added by full-text search
brief:                  |
                        FTS5 is part of the SQLite that the python of
                        the pixi env already has, so the search adds
                        no package. Learned embeddings through
                        RAGatouille bring torch, faiss, LangChain and
                        LlamaIndex, and torch has no wheel for that
                        python.
description:            |
                        sqlite3 is in the Python standard library; the
                        pixi python has SQLite 3.54.1 with FTS5 and
                        bm25() (device VM, 2026-10-19). RAGatouille
                        0.0.9.post2, its latest release, from
                        2025-05-19, requires torch, colbert-ai,
                        faiss-cpu, langchain and llama-index
                        (https://pypi.org/pypi/ragatouille/json).
                        torch 2.14.1 has wheels for cp310 to cp314
                        only (https://pypi.org/pypi/torch/json). The
                        pixi env is python 3.15.

