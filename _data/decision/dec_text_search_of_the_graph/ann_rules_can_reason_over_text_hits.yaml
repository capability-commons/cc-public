title:                  Rules can reason over text hits
brief:                  |
                        With --text, a Datalog rule can join the items
                        that match a query with any relation of the
                        graph, and follow edges from them recursively.
                        A design rule or a lesson learned can then be
                        found by its words and checked by its edges in
                        one query.
description:            |
                        cctool query datalog --text WORDS adds
                        text_hit(id, field, rank), one row for each
                        item that matches, ranked as cctool query text
                        ranks it. Owner's statement, 2026-10-19: the
                        tools should help "when we start to introduce
                        design rules and lessons-learned". Assumption:
                        such rules will need reach over edges, which
                        SQL gives only through recursive common table
                        expressions.

