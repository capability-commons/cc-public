title:                  Text search costs what query sql costs
brief:                  |
                        A text search takes as long as any query sql,
                        about 9 s on the device VM, because both build
                        the same database from the tree. Grep answers
                        at once.
description:            |
                        Measured on the device VM, 2026-10-20: query
                        sql "SELECT count(*) FROM item" 8.6 s and 8.8
                        s; query text --decision "status field" 8.7 s
                        and 8.8 s. Most of the time is reading the
                        tree and deriving relations with clingo. The
                        point weakens as that reading is made faster.

