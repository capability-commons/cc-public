title:                  Decision an item belongs to, derived once
brief:                  |
                        Which decision an item belongs to, and which
                        options a ruling settles, are now rules in
                        derive.lp only. The checks and the tables of
                        SQL both read them, so the search and the
                        checks cannot disagree on them.
description:            |
                        decision_of and settles moved from
                        src/cc_public/check/check.lp to
                        src/cc_public/graph/derive.lp, and
                        pym_cctool.graph.text reads the derived
                        tables. The same search ran in 1.3 s against
                        1.6 s for the copy in SQL (device VM,
                        2026-10-20), with the same rows.

