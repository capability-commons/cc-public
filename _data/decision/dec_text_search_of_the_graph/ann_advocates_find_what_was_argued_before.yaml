title:                  Advocates finding what was argued before
brief:                  |
                        An advocate can find the arguments already
                        made on a point in other decisions, the
                        rulings an option would go against, and a
                        premise argued for in one decision and against
                        in another. A reviewer then reads fewer
                        repeated arguments.
description:            |
                        The advocate brief asks each advocate not to
                        repeat an argument already made, but gives
                        only the arguments on the decision at hand.
                        Maintainer's statement, 2026-10-19: these
                        tools "should enable us to build better
                        arguments for or against options", and will
                        help "when we start to introduce design rules
                        and lessons-learned".

