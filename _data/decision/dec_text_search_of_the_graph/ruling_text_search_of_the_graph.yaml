title:                  Text search expanded through the graph
brief:                  |
                        Text search ranks items by BM25 in an FTS5
                        table of the database that query sql already
                        builds, adds no dependency, and names for each
                        hit its decision and how it was settled, which
                        grep cannot show. No search would leave agents
                        and advocates to find past arguments and
                        rulings by grep alone. Learned embeddings
                        would bring torch and its stack, which has no
                        wheel for the python of the pixi env, and
                        would rank differently with each model
                        version. Ruled by WTP on 2026-10-23.

