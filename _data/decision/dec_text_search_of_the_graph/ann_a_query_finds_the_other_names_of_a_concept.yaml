title:                  A query finds the other names of a concept
brief:                  |
                        A query that names a concept by one of its
                        preferred or admitted terms also matches its
                        other terms, so a search for regentry finds
                        prose that says register entry. Deprecated
                        terms are left out, because several are
                        ordinary words with other senses.
description:            |
                        The terms come from reg_concept, which holds
                        term_preferred and term_admitted on each entry
                        as ISO 1087 uses them. The terms added are
                        printed, and --exact turns this off.
                        ann_deprecated_terms_have_other_senses gives
                        the reason deprecated terms are not used.
                        Seven concepts have an admitted term today, so
                        the gain is small until more are recorded.

