title:                  Agent that rephrases its own query
brief:                  |
                        Embeddings help most when the person searching
                        cannot guess the words. An agent can run a
                        query again in other words at little cost, and
                        stemming already matches the forms of a word,
                        so matching words leaves less unfound.
description:            |
                        BEIR (Thakur et al. 2021,
                        https://arxiv.org/abs/2104.08663): "BM25
                        remains a strong baseline for zero-shot text
                        retrieval", and late interaction beats it on
                        about half of 18 datasets. item_text uses the
                        porter tokenizer of FTS5. Assumption: an agent
                        tries more than one wording when a search
                        finds little. CoIR
                        (https://arxiv.org/abs/2407.02883) finds BM25
                        weak at matching code to prose, which weakens
                        this point for a diff used as the query.

