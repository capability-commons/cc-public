title:                  BM25 gives the same answer each time
brief:                  |
                        The same tree and the same query give the same
                        ranking, so tests can pin it and a reviewer
                        can rerun what an agent was shown. An
                        embedding model ranks by weights that change
                        with its version.
description:            |
                        bm25() is a function of the counts of terms in
                        the indexed text
                        (https://www.sqlite.org/fts5.html). The tests
                        of the search assert exact hits on a copy of
                        the tree. Assumption: an embedding index
                        rebuilt with another model version ranks
                        differently.

