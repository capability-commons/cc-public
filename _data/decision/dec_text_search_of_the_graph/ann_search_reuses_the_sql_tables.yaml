title:                  SQL tables reused by the search
brief:                  |
                        The search is one FTS5 table in the database
                        query sql already builds, and its expansion is
                        SQL over tables that database already holds:
                        has_type, primary_edge and the derived
                        decision_of and settles. It adds no base
                        relation, so the checks read the tree as fast
                        as before.
description:            |
                        pym_cctool.graph.text is 407 lines: six SQL
                        statements, the code that fills item_text, and
                        the code that widens a query by the terms of a
                        concept (src/cctool/graph/text.py). item_text
                        is filled only when a query is made, by query
                        sql, query text and query logic with --text
                        (src/cctool/cli/querying.py within sql and
                        logic; src/cctool/graph/sql.py within connect;
                        src/cctool/graph/text.py within hits); the
                        facts that the checks use are unchanged.

