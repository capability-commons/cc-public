title:                  SQL tables reused by the search
brief:                  |
                        The search is one FTS5 table in the database
                        query sql already builds, and its expansion is
                        SQL over the has_type and primary_edge tables.
                        It adds no base relation, so the checks read
                        the tree as fast as before.
description:            |
                        pym_cc_public.graph.text is about 250 lines,
                        most of them one SQL statement. item_text is
                        filled only when a query is made; the facts
                        that the checks use are unchanged.

