title:                  The decision an item belongs to is written twice
brief:                  |
                        Which decision an item belongs to is defined
                        in check.lp for the checks, and again in SQL
                        in the search. A change to one that is not
                        made to the other gives the search a different
                        answer from the checks.
description:            |
                        decision_of is a rule in
                        src/cc_public/check/check.lp and a common
                        table expression in pym_cc_public.graph.text.
                        The point weakens if decision_of moves to
                        derive.lp, which fills the derived tables of
                        SQL too.

