title:                  State upgrade computed from an old state that is still changing
brief:                  |
                        Installing at the next step computes each
                        upgraded state off the unit, before the
                        install, and prepare-then-commit does the
                        same. But the old version keeps running, and
                        changing its state, until the step at which
                        the swap takes effect, so a state upgraded
                        early misses the last steps. In the trial,
                        reading the old state from the control thread
                        while the node ran was one of the data races
                        TSan found. The upgrade has to be made from a
                        frozen state, which only quiescing gives off
                        the unit. The other two options must make it
                        on the unit at the swap step, into state
                        allocated beforehand, as the trial's install
                        did.
description:            |
                        Sources:
                        - Runtime control computes each upgraded state
                          off the execution
                          unit, before handing the part over.
                          (_data/decision/dec_how_a_change_set_is_installed/opt_install_on_each_unit_at_its_next_step.yaml at description, step 1;
                          _data/decision/dec_how_a_change_set_is_installed/opt_prepare_then_commit_on_each_unit.yaml at description, step 1)
                        - The old state and version of a swapped node
                          are kept until the
                          new version completes a local step.
                          (_data/requirement/rqt_dynamic_swap_keeps_old_state.yaml at object)
                        - The trial's probe of the upgrade read the
                          old state on the
                          control thread while the node ran; TSan reported the race, and
                          the review's fix is to probe on a copy the unit thread makes.
                          (review of 2026-10-29, CC-017; area report trial-engine, TE-15)
                        - The trial's install upgraded the state on
                          the unit thread at the
                          start of the step, from the state the last step left. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/dynamic.cpp, function
                          install)
                        - A generated upgrade copies unchanged fields
                          and gives added
                          fields their default, and a failed transformer leaves the old
                          state untouched. (Hicks et al. 2001, Dynamic software updating,
                          sections 3.3.2 and 4.1)
                        - Quiescing installs every part, upgrading
                          states, while the
                          touched units wait.
                          (_data/decision/dec_how_a_change_set_is_installed/opt_quiesce_the_units_it_touches.yaml at description, step 3)
                        ASSUMPTION: a generated upgrade of field
                        copies and defaults costs little against a 33
                        ms step, so doing it on the unit is
                        affordable. Strength: strong on the premise of
                        the two options as written; weak on the
                        choice, since the fix is small and already ran
                        in the trial.

