title:                  Install within a unit on a C++17 atomic, not a protocol across hosts
brief:                  |
                        Installing at a unit's next step needs nothing
                        beyond a C++17 atomic pointer and a step
                        counter, the same from one unit on a small
                        target to many on the Orin. Preparing and
                        committing across hosts, or quiescing units on
                        several hosts, needs a coordination protocol
                        carried by each host's runtime control.
                        Whether runtime control uses an outside
                        messaging library is still open, so the
                        atomicity of a change set across hosts could
                        come to rest on that library's delivery and
                        ordering. The cost falls only on change sets
                        that span hosts.
description:            |
                        Sources:
                        - The engine is a new C++17 engine targeting
                          embedded reach.
                          (WTP, 2026-10-28)
                        - The trial's handover was one atomic pointer
                          per unit and an
                          atomic flag for the install. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, functions hook_apply
                          and dynamic_begin)
                        - A part for another host is prepared through
                          that host's runtime
                          control.
                          (_data/decision/dec_how_a_change_set_is_installed/opt_prepare_then_commit_on_each_unit.yaml at description, step 1)
                        - One open option carries runtime control on
                          an existing messaging
                          library.
                          (_data/decision/dec_encoding_of_runtime_control/opt_an_existing_messaging_library.yaml at brief)
                        - Transport libraries are confined to sender
                          and receiver nodes,
                          so a target without them need not build them.
                          (_data/requirement/rqt_transport_confines_library.yaml at object and rationale)
                        ASSUMPTION: a lock-free atomic pointer store
                        is available on the embedded targets in reach.
                        Strength: weak; it bites only for change sets
                        that span hosts, and only if an outside
                        library carries runtime control.

