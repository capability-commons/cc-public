title:                  How a change set is installed
brief:                  |
                        A change set takes effect at the start of a
                        local step, is atomic, and keeps the state of
                        an old version until the new one completes a
                        step. How does the engine install one across
                        the execution units it touches, and when does
                        it free what it takes out?
description:            |
                        The rulings are
                        ruling_change_set_checked_by_both,
                        ruling_swap_at_a_step_with_state_upgrade and
                        ruling_same_step_through_fixed_slots, and the
                        requirements rqt_dynamic_atomic,
                        rqt_dynamic_swap_keeps_old_state and
                        rqt_memory_only_for_change_sets. A step is
                        local to an execution unit, with no step
                        common to the graph
                        (ruling_reading_derived_by_placement). No
                        algorithm for install and swap is written
                        down. The trial implementation of 2026-10-29
                        checked and allocated in the thread of runtime
                        control, installed at the start of the unit's
                        next local step, refused a change set that
                        touched two units, and never freed a removed
                        node (trial process log, phase 3). Its runtime
                        control and dynamic subgraph raced (review of
                        2026-10-29, CC-017). The engine frees what an
                        edge removal takes out, but when, and on which
                        thread, is open (CC-057).

