title:                  Refusal of every change set that spans two execution units
brief:                  |
                        Installing at the next step of one unit only
                        works if a change set touches one unit. Any
                        change to an edge between dynamic nodes of two
                        units touches both, because such an edge is a
                        sender in one unit and a receiver in the
                        other. So a change set that adds a node fed
                        from another unit, or moves a node between
                        units to spread load, is refused, which
                        narrows the ruling that any change set that
                        checks against the running graph may be
                        applied. Where cctool splits a change set
                        instead, the host runs an intermediate graph
                        between the two installs that no variant names
                        and that the checks must also cover. The other
                        two options install across units by design.
description:            |
                        Sources:
                        - A deployment may apply any change set that
                          checks against the
                          resolved graph it is running; WTP ruled this against the
                          recommendation of no switching at first.
                          (_data/decision/dec_runtime_mode_set/ruling_any_change_set_checked_against_the_running_graph.yaml at brief)
                        - A change set adds, moves or removes nodes
                          and edges, with their
                          placement.
                          (_data/interface_control_document/icd_dataflow_change_set.yaml at brief, and at surface.data.artifact.artifact.change_set.content)
                        - The engine carries values only within one
                          execution unit, and a
                          transform inserts a sender and a receiver where an edge's ends
                          are in different units.
                          (_data/decision/dec_how_values_cross_execution_units/ruling_transport_nodes_inserted_by_a_transform.yaml at brief)
                        - Kahn steps are spread by placing nodes on
                          hosts and execution
                          units, and much of the dynamism goes into rewriting the
                          dataflow graph.
                          (_data/decision/dec_spread_of_kahn_steps_across_cores/ruling_placement_on_hosts_and_execution_units.yaml at brief)
                        - The option refuses a change set that touches
                          two units, or has
                          cctool split it where no edge between them changes.
                          (_data/decision/dec_how_a_change_set_is_installed/opt_install_on_each_unit_at_its_next_step.yaml at description)
                        - The trial refused every change set that
                          touched more than one
                          unit, and its log asked for a ruling, since atomicity across
                          units needs a barrier between threads or hosts. (trial process
                          log, phase 3; trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, function build)
                        - A change set names the digest of the graph
                          it applies to and of
                          the one it gives, and every complete variant is checked.
                          (_data/interface_control_document/icd_dataflow_change_set.yaml at surface.data.artifact.artifact.change_set.content;
                          _data/decision/dec_which_resolved_graphs_are_checked/ruling_every_complete_variant_checked.yaml at brief)
                        ASSUMPTION: "moved" in the change-set ICD
                        includes a move from one execution unit to
                        another; if moves stay within a unit, only the
                        new edges between units are lost. Strength:
                        moderate; weak if WTP is content that a change
                        across units needs a new deployment rather
                        than a change set.

