title:                  Quiesce the units it touches
brief:                  |
                        The execution units the change set touches
                        finish their current local step and wait.
                        Runtime control installs every part while they
                        wait, and releases them together. Atomic
                        across units by construction, at the cost of a
                        pause as long as the install, in which those
                        units do not step.
description:            |
                        1. Prepare as in installing at the next step.
                        2. Ask each unit touched to stop at the end of
                          its current local step, and wait until all
                          have, and until the messages in flight
                          between them have arrived.
                        3. Install every part, upgrading states.
                        4. Release the units, which start their next
                          local steps.
                        5. Free what was taken out at once, since no
                          unit is reading it.

