title:                  One-pointer handover that held in the trial, on two conditions
brief:                  |
                        Installing at the next step is the only option
                        that has run. In the trial, a change set built
                        in full off the unit and handed over through
                        one atomic pointer was atomic as the unit saw
                        it, kept the old state on a failed swap, and
                        replayed byte for byte under TSan. Its races
                        and its lost change set came from around the
                        handover: runtime control read the graph the
                        unit was running, a failed swap was put back
                        by rewriting that graph in place, and a second
                        change set silently replaced a first that had
                        not yet been installed. Two conditions fix
                        these: one change set pending per unit, and
                        runtime control keeping its own copy of the
                        installed graph, learning of put-backs from
                        the swap event, and freeing what was taken out
                        only after the unit reports a completed step
                        past the swap's decision. That one install
                        step also fits the ICDs as written, which
                        report one local step for each change set.
description:            |
                        Sources:
                        - The trial built a change set in full on the
                          control thread,
                          stored one pending pointer, and the unit exchanged it at the
                          start of its next step. (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/dynamic.cpp, functions hook_apply
                          and dynamic_begin)
                        - Change-set atomicity, refusal reasons and
                          the put-back of a
                          failed swap with its old state were checked and found sound, and
                          the live variant replayed identically, also under TSan. (review
                          of 2026-10-29, section 2; area report trial-engine, section 5)
                        - The races were the control thread reading
                          the running graph and
                          the unit rewriting it in place in put_back; the fix is to
                          publish the put-back through the same handover. (review of
                          2026-10-29, CC-017)
                        - An apply to a stopped unit replied ok after
                          2 s, and a later
                          apply silently replaced it. (area report trial-engine, TE-18)
                        - The install also built its record row and
                          the new digest on the
                          unit thread, which allocates; the review's fix is to build both
                          before the handover. (area report trial-engine, TE-09)
                        - The trial never freed a removed node or an
                          old version; when, and
                          on which thread, the engine frees is open. (trial process log,
                          phase 3; review of 2026-10-29, CC-057)
                        - The reply to an apply says at which local
                          step it took effect,
                          and a change event names the local step at whose start it took
                          effect.
                          (_data/interface_control_document/icd_dataflow_runtime_control.yaml at surface.data.artifact.artifact.apply.convention;
                          _data/interface_control_document/icd_dataflow_engine_event.yaml at surface.data.artifact.artifact.change.content)
                        ASSUMPTION: since the unit reads the current
                        graph only at the start of a step, a completed
                        step after the swap is decided is a grace
                        period after which nothing on the unit points
                        into what was taken out, so no reclamation
                        scheme beyond the step counter is needed.
                        Strength: strong; it rests on code that ran,
                        and the conditions are close to the review's
                        fixes (CC-017, TE-18) and the option's own
                        rule for freeing, though the review would
                        publish a put-back through the handover rather
                        than learn of it from the event.

