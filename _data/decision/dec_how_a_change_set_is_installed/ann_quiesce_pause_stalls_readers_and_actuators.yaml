title:                  Pause of quiesced units and of the units that wait on them
brief:                  |
                        Quiescing stops the units a change set touches
                        for at least the rest of the longest step
                        among them plus the install. Where crossings
                        wait, the units that read from or write to a
                        stopped unit stall as well. The trial showed
                        this when stopping one unit blocked another
                        while its status still said running. On Patrol
                        a camera step is 33 ms, so one pause can cost
                        a frame and delay any node that drives an
                        actuator. Installing at the start of a unit's
                        next step costs that unit only the swap
                        itself, and the step boundary already gives
                        every Kahn node of the unit the quiescence the
                        1990 paper asks for, in bounded time.
description:            |
                        Sources:
                        - The touched units finish their step and wait
                          while runtime
                          control installs every part, so they do not step for as long as
                          the install takes.
                          (_data/decision/dec_how_a_change_set_is_installed/opt_quiesce_the_units_it_touches.yaml at brief and description)
                        - Stopping u2 left u1 blocked in a lossless
                          send while its status
                          said it was running. (review of 2026-10-29, CC-047; area report
                          trial-engine, TE-18)
                        - In an IEC 61499 plant updated through
                          Erlang, a suspension took
                          about 20 ms of a 100 ms cycle, and the authors warn that
                          suspending a process that drives an actuator can delay a
                          time-critical answer such as stopping a motor. (Prenzel and
                          Provost 2017, Dynamic software updating of IEC 61499
                          implementation using Erlang runtime system, section 4.4)
                        - Patrol runs on an Orin with a camera at 30
                          Hz. (WTP, 2026-10-28)
                        - The trial's install at the start of a step
                          was a pointer
                          exchange plus a copy or upgrade of each swapped state. (trial
                          2c777ab9, src/cctool/dataflow/engine/src/dynamic.cpp, functions
                          dynamic_begin and install)
                        - A node is quiescent when no transaction is
                          in progress at it and
                          none will start. (Kramer and Magee 1990, The evolving
                          philosophers problem, section on node quiescence) The
                          literature note on the paper reads a step boundary as such a
                          point for every Kahn node at once, though not for actor
                          exchanges that span steps.
                        Strength: strong for units that drive
                        actuators; weaker if quiescing were kept for
                        change sets that span units, with the rest
                        installed at the next step.

