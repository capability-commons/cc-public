title:                  Install on each unit at its next step
brief:                  |
                        The thread of runtime control checks the
                        change set and prepares all it needs, then
                        hands each execution unit its part through one
                        atomic pointer, and the unit installs the part
                        at the start of its next local step. A change
                        set touches one unit. What it takes out is
                        freed once the unit has completed a local step
                        after the install.
description:            |
                        1. Runtime control checks the change set
                          against the graph that runs, allocates the
                          nodes, state and buffers it adds, and
                          computes each upgraded state, all off the
                          execution unit.
                        2. It publishes the prepared part with one
                          atomic store.
                        3. At the start of its next local step, the
                          unit swaps the part in, keeps each old
                          version's state, runs the step, and puts the
                          old version back if the new one fails that
                          step.
                        4. When the unit reports a completed step
                          after the install, runtime control frees
                          what was taken out. A change set that
                          touches two units is refused, or split by
                          cctool into one change set per unit where no
                          edge between them changes.

