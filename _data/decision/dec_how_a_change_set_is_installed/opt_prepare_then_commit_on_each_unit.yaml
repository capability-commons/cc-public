title:                  Prepare, then commit on each unit
brief:                  |
                        Two phases. Runtime control prepares the part
                        of every execution unit that the change set
                        touches. Once all are prepared, a commit
                        names, for each unit, the first local step at
                        which its part takes effect, and each unit
                        installs it at that step. A failure before the
                        commit discards every part.
description:            |
                        1. Prepare each unit's part as in installing
                          at the next step, and on another host
                          through that host's runtime control.
                        2. If any part fails its check, discard all of
                          them, and refuse the change set.
                        3. Read each unit's current local step, and
                          commit by naming for each a step far enough
                          ahead that every part is in place first.
                        4. Each unit installs its part at the start of
                          its named step; an edge between two changed
                          units is joined from the later of the two
                          steps.
                        5. Free what was taken out as in installing at
                          the next step.

