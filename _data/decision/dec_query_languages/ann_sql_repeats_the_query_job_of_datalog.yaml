title:                  SQL repeating the query job of logic programs
brief:                  |
                        Logic programs must stay for the checks and
                        already answer joins, counts and recursion, so
                        the SQL command is a second mechanism for a
                        job that logic programs do.
description:            |
                        Tree check and commit check run through
                        cctool.graph.logic.run
                        (src/cctool/check/check.py within _review;
                        src/cctool/commit/change.py within
                        check_trees). The engine is clingo
                        (_data/decision/dec_cross_item_checks_engine/ruling_cross_item_checks_engine.yaml
                        at brief). The SQL path has its own module of
                        108 lines, command, error handling and tests
                        (src/cctool/graph/sql.py;
                        src/cctool/cli/querying.py within sql).
                        Weakened by: the SQL layer is small and adds
                        no package, and it now also holds the FTS5
                        prose table that text search uses (sql.py
                        within SQL_TEXT; text.py within search and
                        hits). Holds at any graph size.

