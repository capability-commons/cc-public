title:                  Silent empty results from the Datalog command
brief:                  |
                        The Datalog command returns an empty result
                        with no error for a misspelled relation, a
                        program with no model or a choice rule, while
                        SQL reports a misspelled table as an error, so
                        a language set without SQL loses that check.
description:            |
                        clingo runs with all warnings off (datalog.py
                        line 291, --warn=none; added in commit
                        6230e98). Before running, the command checks
                        only that some relation is shown (querying.py
                        lines 165-167) and that a shown relation of a
                        known name has its declared arity (datalog.py
                        lines 282-288); an unknown name is not
                        reported. It collects shown atoms and does not
                        count models (datalog.py lines 303-309).
                        Advocate's tests, 2026-10-15, HEAD 89c74d8,
                        clingo 5.8.2: a misspelled relation (tpye_of),
                        a failing integrity constraint and an odd
                        negative loop each returned out: [] with no
                        error; a choice rule and two rules in mutual
                        negation returned one answer set picked by the
                        solver. SQL on tpye_of raised "no such table".
                        clingo is an answer set solver
                        (reg_concept.yaml line 400). At the decision
                        the engine was Souffle, so this dates from
                        6230e98, one day later (ASSUMPTION: Souffle
                        would have reported the misspelled relation;
                        untested). Callers are mainly agents
                        (maintainer's statement,
                        2026-10-14T22:59:35Z), sent to Datalog for
                        recursion (AGENTS.md lines 67-69). Holds at
                        any size. A guard in the Datalog command
                        (warning as error, fail on no model or
                        several) would remove the point against
                        opt_datalog_only.

