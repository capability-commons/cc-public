title:                  Silent empty results from the Datalog command
brief:                  |
                        At 89c74d8 the Datalog command returned an
                        empty result with no error for a misspelled
                        relation, a program with no model or a choice
                        rule, while SQL reported a misspelled table as
                        an error. The logic command now reports each
                        of these as an error, so SQL no longer adds
                        that check.
description:            |
                        At 89c74d8 clingo ran with all warnings off
                        (--warn=none, added in commit 6230e98), and
                        the command collected shown atoms without
                        counting models. Advocate's tests, 2026-10-15,
                        clingo 5.8.2: a misspelled relation (tpye_of),
                        a failing integrity constraint and an odd
                        negative loop each returned out: [] with no
                        error; a choice rule returned one answer set
                        picked by the solver. SQL on tpye_of raised
                        "no such table". Commit 627e2b5 added the
                        guard this annotation asked for: logic.run
                        raises ErrorLogic on any clingo message, a
                        warning included, on no answer set and on a
                        second answer set
                        (src/cc_public/graph/logic.py lines 379-420).
                        Rerun on 2026-10-22 over the tree: the
                        misspelled relation gave "atom does not occur
                        in any rule head", the constraint gave "no
                        answer set" and the choice rule gave "more
                        than one answer set"; SQL still gives "no such
                        table". clingo evaluates answer set programs
                        (reg_concept.yaml lines 549-553). Callers are
                        mainly agents (maintainer's statement,
                        2026-10-14T22:59:35Z). The point against
                        opt_datalog_only now holds only for the
                        history.

