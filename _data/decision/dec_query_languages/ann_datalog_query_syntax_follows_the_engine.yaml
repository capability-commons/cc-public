title:                  Datalog query dialect tied to the engine
brief:                  |
                        Datalog has no engine-neutral syntax, so saved
                        Datalog queries break when the engine changes,
                        while the SQL surface stays the same.
description:            |
                        Commit 6230e98 changed EXAMPLE_DATALOG in
                        src/cc_public/cli/querying.py from Souffle
                        form (".decl out(id:symbol) .output out ...")
                        to clingo form ("#show out/1. out(Id) :- ...")
                        and left EXAMPLE_SQL unchanged. The clingo
                        choice is to be revisited and Souffle may
                        return (ruling_cross_item_checks_engine.yaml
                        lines 13-17; owner's statement,
                        2026-10-14T22:11:54Z). Grows with the count of
                        saved Datalog rules (ASSUMPTION).

