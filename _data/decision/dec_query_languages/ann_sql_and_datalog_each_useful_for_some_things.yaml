title:                  SQL and Datalog each useful for some things
brief:                  |
                        The tooling will need both SQL and Datalog,
                        since each is useful for different things, and
                        Datalog is expected to grow more powerful as
                        the graph grows.
description:            |
                        Owner's statement, 2026-10-13T22:46:52Z: "I
                        think that we are inevitably going to need
                        both SQLite and Datalog. Both are useful,
                        albeit for different things." It answers his
                        SQL question at 22:43:25Z. On Datalog tools:
                        "I am hopeful that this will get VERY powerful
                        as the graph grows" (owner's statement,
                        2026-10-13T21:57:52Z). Decided in commit
                        12f83b7 (pre-squash).

