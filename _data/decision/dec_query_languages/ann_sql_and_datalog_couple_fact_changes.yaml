title:                  Fact changes carried into two adapters
brief:                  |
                        A change to column types, to the engine or to
                        relation names must also be carried into the
                        SQL adapter, a small bounded cost that Datalog
                        alone would not carry.
description:            |
                        Numeric column type (commit 9a4b995) changed
                        sql.py by 14 lines and added MAP_TYPE (sql.py
                        line 41). The move to clingo (commit 6230e98)
                        changed sql.py by 8 lines. primary was renamed
                        primary_edge "since PRIMARY is an SQL keyword"
                        (commit 12f83b7). The change stays inside
                        sql.py (94 lines), imported only by
                        querying.py and tests. Does not grow with
                        graph size.

