title:                  Recursive derived predicates now in derive.lp
brief:                  |
                        The old annotation says that the present
                        derived predicates are non-recursive joins and
                        one negation. Now derive.lp declares 13
                        derived predicates, and downstream is
                        recursive, so not all of them are plain SQL
                        joins.
description:            |
                        src/cctool/graph/derive.lp declares prefix_of,
                        has_type, primary_edge, graph_edge,
                        document_schema, settles, decision_of,
                        node_interface, feeds, downstream, upstream,
                        bears_on and blast_radius (decl lines 34-231).
                        downstream calls itself (lines 183-187), and
                        upstream and blast_radius are built on it
                        (lines 197-198 and 234-240). The one negation
                        is still in primary_edge (line 64). In SQL,
                        downstream would need a recursive query. The
                        measurement in the old annotation covered
                        prefix_of only. Found in the review of
                        2026-10-22.

