title:                  Overlap of the query jobs of SQL and logic programs
brief:                  |
                        clingo counts and SQLite recurses, so neither
                        language covers a job the other cannot, and no
                        item, commit or maintainer's statement names a
                        query only SQL can answer.
description:            |
                        AGENTS.md lines 67-69 send joins and counts to
                        SQL and recursion to logic queries. The check
                        rules count with #count
                        (src/cctool/check/check.lp lines 314 and 602).
                        SQLite has WITH RECURSIVE
                        (https://www.sqlite.org/lang_with.html). This
                        does not deny that both are useful; it denies
                        that their jobs are disjoint.

