title:                  SQLite no longer used by the SQL path alone
brief:                  |
                        The old annotation says that the logic query
                        path uses extract, the engine and derive.lp,
                        and that only the SQL path adds SQLite. Now
                        text search runs on SQLite, and cctool query
                        logic --text takes its text_hit facts from it,
                        so logic programs only would not remove
                        SQLite.
description:            |
                        src/cc_public/graph/text.py imports sqlite3
                        (line 44). search, behind cctool query text,
                        opens its database with
                        cc_public.graph.sql.connect (line 365). hits
                        opens an in-memory SQLite database with an
                        FTS5 table (lines 380-405), and cctool query
                        logic adds its rows as text_hit facts when
                        --text is given (src/cc_public/cli/querying.py
                        lines 213-218). A plain logic query with no
                        --text still runs without SQLite. Found in the
                        review of 2026-10-22.

