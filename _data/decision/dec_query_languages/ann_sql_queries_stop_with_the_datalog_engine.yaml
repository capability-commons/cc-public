title:                  SQL queries stopped by a Datalog engine fault
brief:                  |
                        Each SQL query first runs the Datalog engine
                        to fill the derived tables, so a broken,
                        changed or withdrawn engine stops both
                        languages, and SQL gives no second route.
description:            |
                        sql.connect calls cc_public.graph.datalog.run
                        before it fills any table
                        (src/cc_public/graph/sql.py lines 54-59; at
                        the decision, commit 12f83b7, with souffle as
                        a subprocess raising ErrorDatalog). cctool
                        query sql reports ErrorDatalog as an SQL error
                        (querying.py lines 129-132). clingo is
                        imported at module level (datalog.py line 55;
                        querying.py lines 41-43). At the decision
                        Souffle was a hand-kept binary outside the
                        locked environment
                        (ann_souffle_is_outside_the_locked_environment).
                        Offsetting fact: the checker already needed
                        the engine (commit ba66f33; check.py lines
                        96-99), so this adds no new dependency to the
                        tool as a whole.

