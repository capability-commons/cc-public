title:                  SQL, logic programs, SPARQL and jq in one query group
brief:                  |
                        The tooling offers SQL and logic programs over
                        one set of predicates declared once, SPARQL
                        over the items as RDF triples, and jq over the
                        YAML documents as written, all in one cctool
                        query group. The checks need clingo, so a
                        single language would remove no engine, and
                        each of the others gives a view of the graph
                        that agents already know, two of them by open
                        standards. Two top-level commands would only
                        split one set of shared options. Ruled by
                        William Payne on 2026-10-23.

