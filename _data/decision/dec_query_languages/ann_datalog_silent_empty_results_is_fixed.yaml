title:                  Empty-result faults as errors of the logic command
brief:                  |
                        Commit 627e2b5 "Fix datalog.run so that clingo
                        warnings and no answer set are errors" makes a
                        misspelled relation, a program with no model
                        and a choice rule each an error. At 360ec14
                        the Datalog command no longer returns an empty
                        result for them.
description:            |
                        run() raises ErrorLogic on any clingo message,
                        on no answer set and on a second answer set
                        (src/cc_public/graph/logic.py lines 379-420;
                        the module was datalog.py at 360ec14). cctool
                        query logic reports ErrorLogic as a logic
                        program error (src/cc_public/cli/querying.py
                        lines 221-224). The guard that the annotation
                        said would remove the point against
                        opt_datalog_only is now in place. The lack of
                        a time limit on either evaluator is not
                        changed.

