title:                  Logic command errors on empty-result faults
brief:                  |
                        Commit 627e2b5 "Fix datalog.run so that clingo
                        warnings and no answer set are errors" makes a
                        misspelled relation, a program with no model
                        and a choice rule each an error. At 360ec14
                        the Datalog command no longer returns an empty
                        result for them.
description:            |
                        run() raises ErrorDatalog on any clingo
                        message, on no answer set and on a second
                        answer set (src/cc_public/graph/datalog.py
                        lines 296-337 at 360ec14). cctool query
                        datalog reports ErrorDatalog as a Datalog
                        error (src/cc_public/cli/querying.py line
                        180). The guard that the annotation said would
                        remove the point against opt_datalog_only is
                        now in place. The lack of a time limit on
                        either evaluator is not changed.

