title:                  Datalog numbers now returned as numbers
brief:                  |
                        Commit 0e4408b "Fix cctool query logic so that
                        numbers come back as numbers" turns each value
                        of a column declared a number into an integer
                        and sorts by it. At 360ec14 both languages
                        give a declared number column the same type
                        and order.
description:            |
                        _typed converts the values of each :number
                        column and sorts the rows
                        (src/cc_public/cli/querying.py lines 182-186,
                        268-280 at 360ec14);
                        test_datalog_gives_a_number_column_as_numbers
                        covers it
                        (src/cc_public/cli/_test/test_querying.py line
                        71). A column with no declaration is still a
                        symbol, so an undeclared count still comes
                        back as text.

