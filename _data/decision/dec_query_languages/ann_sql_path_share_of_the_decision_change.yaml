title:                  SQL path as a share of the decision change
brief:                  |
                        The SQL path is about 140 of the 1120 lines
                        added by the change that took this decision, a
                        share that Datalog only would have left out,
                        but the change was too large to read in one
                        sitting either way.
description:            |
                        git show --stat 12f83b7: 1120 insertions, 364
                        deletions, 17 files. SQL-only parts at
                        12f83b7: sql.py (88 lines), querying.py lines
                        107-136, test_querying.py lines 51-63,
                        test_graph.py lines 65-75 (advocate's count).
                        The commit also moves fact extraction
                        (extract.py, 311 lines), adds datalog.py (190
                        lines), renames primary to primary_edge "since
                        PRIMARY is an SQL keyword", adds the schema
                        command and --root, and moves fixtures (commit
                        message). It is dated 22:53:04Z, six minutes
                        after the owner's instruction at 22:46:52Z.
                        The rule to keep each change small enough to
                        read in one sitting came later (a0b3f50,
                        2026-10-14; AGENTS.md lines 91-93).
                        ASSUMPTION: the other 980 or so lines alone
                        are more than one sitting; the owner calls the
                        review burden "huge (and practically
                        impossible)" (owner's statement,
                        2026-10-15T10:59:29Z). No query text is stored
                        in _data (there is no doc folder), so the
                        language set enters later reviews only through
                        the adapter code. Weak and one-time; it does
                        not grow with the graph.

