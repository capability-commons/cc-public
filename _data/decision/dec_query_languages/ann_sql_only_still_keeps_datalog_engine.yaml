title:                  Logic engine kept under SQL only
brief:                  |
                        The checks and the derived predicates are in
                        clingo, so SQL only would hide the logic
                        engine without removing it, or would define
                        the derived predicates a second time in SQL.
description:            |
                        cc_public.graph.logic is imported by twelve
                        modules outside the tests, among them
                        check/check.py (line 50), commit/change.py
                        (line 47), cli/messaging.py (line 39),
                        cli/auditing.py (line 45) and cli/querying.py
                        (line 44). Checks are in check.lp (3551
                        lines). Derived SQL tables come from clingo on
                        derive.lp (sql.py lines 63-68); no SQL
                        definition of a derived predicate exists. So
                        SQL only removes no part that can fail. Grows
                        with the checks.

