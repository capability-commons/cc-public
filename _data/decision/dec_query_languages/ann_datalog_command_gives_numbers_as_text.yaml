title:                  Numbers returned as text by the Datalog command
brief:                  |
                        At 89c74d8, over the one fact set, SQL
                        returned and sorted a number as an integer,
                        while the logic command returned and sorted it
                        as text, so the two languages gave differently
                        typed and ordered results for the same
                        question. A declared number column now comes
                        back as a number; an undeclared one is still
                        text.
description:            |
                        The query group says SQL and logic programs
                        see the same predicates (querying.py within
                        query); a :number column is an integer in SQL
                        (sql.py within MAP_TYPE). At 89c74d8 the
                        Datalog command turned every value into text
                        and sorted rows as text. Advocate's test,
                        2026-10-15: Datalog gave ('10',), ('9',) and a
                        #count over a declared number gave ('203',);
                        SQL gave (9,), (10,). Commit 0e4408b fixed
                        this for declared columns: logic.py still
                        reads each value as text (logic.py within
                        _field), and querying.py converts and sorts
                        the columns declared a number (querying.py
                        within logic and _typed; test at
                        test_querying.py within
                        test_logic_gives_a_number_column_as_numbers).
                        A column with no declaration, such as an
                        undeclared count, still comes back as text,
                        while SQL gives it as a number. Weak: it
                        affects only undeclared numeric columns and
                        ordering, and loses no value. It points at the
                        logic adapter, not at another language set.

