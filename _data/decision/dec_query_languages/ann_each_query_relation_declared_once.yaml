title:                  One declaration of each predicate for both languages
brief:                  |
                        Base predicates are declared once in PREDICATE
                        and derived predicates once in derive.lp, and
                        both languages are built from them, so a
                        change to the facts is made in one place.
description:            |
                        PREDICATE, named RELATION when this was
                        written: src/cc_public/graph/extract.py lines
                        118-159. The logic path reads it (logic.py
                        lines 210-218); SQL builds its tables from it
                        and fills derived tables by running clingo on
                        derive.lp (sql.py lines 52-59). Commit
                        12f83b7: "each is defined once". One command,
                        now cctool query predicates, lists the
                        predicates for both (querying.py lines
                        192-214). The gain grows with the count of
                        predicates. It counts against
                        opt_two_separate_commands only if that means
                        two fact sets (ASSUMPTION: the packet gives
                        only the quoted phrase "One CLI command or two
                        is your call", owner's statement,
                        2026-10-13T22:46:52Z).

