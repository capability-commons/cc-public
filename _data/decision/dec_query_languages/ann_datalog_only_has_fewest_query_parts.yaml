title:                  Fewest query parts under Datalog only
brief:                  |
                        The Datalog query path uses extract, the
                        engine and derive.lp, and the SQL path adds
                        SQLite, so Datalog only has the fewest parts
                        that can fail.
description:            |
                        querying.py lines 169-172; datalog.py lines
                        270-309; sql.py lines 61-75. Weak: sqlite3 is
                        a mature standard library part (3.45.1 here).
                        ASSUMPTION: in-memory SQLite adds few failures
                        in practice; there is no failure data for it
                        in this project.

