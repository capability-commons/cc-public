title:                  No third-party package for SQL
brief:                  |
                        SQL rests on the Python standard library and
                        on public-domain SQLite, so offering it adds
                        no package, maintainer or licence.
description:            |
                        sqlite3 is the only import outside the project
                        that the SQL path adds
                        (src/cc_public/graph/sql.py line 33;
                        querying.py line 34). sqlite3 ships with
                        CPython
                        (https://docs.python.org/3/library/sqlite3.html).
                        SQLite is public domain
                        (https://www.sqlite.org/copyright.html). The
                        project licence is Apache-2.0
                        (pyproject.toml). Holds at any size.

