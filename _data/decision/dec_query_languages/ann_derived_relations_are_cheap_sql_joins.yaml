title:                  Derived relations as cheap SQL joins
brief:                  |
                        The present derived relations are
                        non-recursive joins and one negation, which
                        SQLite computes in a few milliseconds, so SQL
                        as their home would cut the query step of the
                        SQL path from about 89 ms to about 5 ms; the
                        extraction of facts, about 46 ms, stays in
                        every command.
description:            |
                        derive.lp has no recursion; primary_edge uses
                        one negation. Measured by an advocate on
                        2026-10-15 (advperf/m.py): loading facts and
                        computing prefix_of in SQLite took about 5 ms
                        (10 ms at ten times the size) and gave the
                        same 203 rows as clingo. Only prefix_of was
                        prototyped; ASSUMPTION: the other three cost
                        about the same. Speeds queries, not the check
                        gate, which stays in clingo. Recursive queries
                        over much larger graphs are unmeasured.

