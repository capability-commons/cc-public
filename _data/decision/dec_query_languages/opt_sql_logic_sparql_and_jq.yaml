title:                  SQL, logic programs, SPARQL and jq in one query group
brief:                  |
                        Offer SQL, over in-memory SQLite, and logic
                        programs, run by clingo, over one set of
                        predicates declared once; SPARQL, run by
                        Oxigraph, over the items as RDF triples; and
                        jq over the YAML documents as written; all
                        under one cctool query group.

