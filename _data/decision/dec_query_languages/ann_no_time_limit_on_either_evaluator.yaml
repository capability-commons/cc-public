title:                  No time limit on either query evaluator
brief:                  |
                        Each language accepts a query that never ends
                        and neither command has a time limit, so a
                        caller, often an agent, must kill a hung
                        command by hand.
description:            |
                        clingo 5.8.2 did not finish grounding "n(0).
                        n(X+1) :- n(X)." in 5 s; SQLite 3.45.1 did not
                        finish an unbounded WITH RECURSIVE in 5 s
                        (advocate's local tests, 2026-10-15).
                        datalog.run has no time limit (datalog.py
                        lines 290-309); sql.query has no progress
                        handler (sql.py lines 87-94); at the decision
                        the souffle subprocess had no timeout (commit
                        12f83b7). The project is mainly driven by
                        agents (owner's statement,
                        2026-10-14T22:59:35Z). The same gap applies to
                        each single-language alternative, so it argues
                        for a guard, not for a different language set.

