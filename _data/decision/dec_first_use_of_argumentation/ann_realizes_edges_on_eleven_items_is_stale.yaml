title:                  Realization edges now on eleven items
brief:                  |
                        ann_traces_to_decisions_are_coarse says only
                        one item carries a relation_realizes edge. The
                        tree now holds eleven such edges, from python
                        modules, python functions and dataflow nodes.
                        A change still names its ruling only in prose.
description:            |
                        relation_realizes edges are held in
                        src/cctool/__init__.py line 24 (to
                        lco_tooling), in src/cctool/check/check.py
                        lines 37, 120, 154, 200, 239, 320 and 360 (the
                        module and six of its functions, to interface
                        members), and on three nodes of
                        _data/dataflow_graph/dfg_stableflow_smoketest.yaml
                        at lines 61, 76 and 94 (to
                        icd_system_controller, icd_process_controller
                        and icd_printer). No relation in
                        _data/register/reg_relation.yaml runs from a
                        commit to a decision or ruling, so that half
                        of the point still holds. Found in the review
                        of 2026-10-22.

