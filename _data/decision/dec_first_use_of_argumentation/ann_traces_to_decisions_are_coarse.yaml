title:                  Coarse, prose traces from elements to decisions
brief:                  |
                        Decisions were recorded before the relations
                        that tie elements to them. At first only one
                        item carried a relation_realizes edge; there
                        are now eleven, but a change still names its
                        ruling only in prose.
description:            |
                        At 89c74d8 only src/cctool/__init__.py held
                        relation_realizes (grep of src). On the
                        snapshot of 2026-10-23 there are eleven edges:
                        that one, seven in src/cctool/check/check.py
                        within check, review, check_documents,
                        review_documents, columns and wording and in
                        its module docstring, and three in
                        _data/dataflow_graph/dfg_stableflow_smoketest.yaml
                        at dataflow_node.ctrl_sys.edge,
                        dataflow_node.ctrl_proc.edge and
                        dataflow_node.printer.edge. Schemas and
                        registers still cannot hold it: its source
                        must play rol_implementation
                        (reg_relation.yaml at
                        entries.relation_upholds;
                        reg_relation_constraint.yaml at
                        entries.relcon_is_implementation), which only
                        source-file and dataflow node types do
                        (reg_data_item_type.yaml). 6230e98 names the
                        ruling it carries out in its brief and has an
                        empty relation list. No relation runs from a
                        commit to a ruling, and an element reaches a
                        decision only through the component it
                        realizes (reg_relation.yaml). Building those
                        relations is itself tooling work the recorded
                        decisions show is needed, so this does not
                        favor opt_keep_building_tooling as such.

