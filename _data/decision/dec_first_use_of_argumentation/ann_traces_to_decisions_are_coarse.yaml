title:                  Coarse, prose traces from elements to decisions
brief:                  |
                        Decisions were recorded before the relations
                        that tie elements to them. Only one item
                        carries a relation_realizes edge, and a change
                        names its ruling only in prose.
description:            |
                        Only src/cc_public/__init__.py line 24 holds
                        relation_realizes (grep of src at 89c74d8).
                        relation_realizes cannot be held by schemas or
                        registers (reg_relation.yaml lines 343-347).
                        6230e98 names ruling_cross_item_checks_engine
                        in its brief and has "relation: []". No
                        relation runs from a commit or element to the
                        decision it carries out (reg_relation.yaml).
                        Building those relations is itself tooling
                        work the recorded decisions show is needed, so
                        this does not favor opt_keep_building_tooling
                        as such.

