title:                  Tooling growth after the pause
brief:                  |
                        The pause moved tooling effort into
                        argumentation rather than stopping it. In
                        about seven hours the graph gained three item
                        types, five relations and nine checks, some
                        for a relation no item yet uses.
description:            |
                        586a0e5..89c74d8 (16:15Z to 23:41Z): 18
                        commits, 74 files, +3589 -1103, 21 files under
                        src/ (git diff --stat). Types added:
                        type_logical_component, type_ruling,
                        type_decision. Relations added:
                        relation_realizes, relation_is_driven_by,
                        relation_upholds, relation_rejects,
                        relation_is_option_for. Schemas 28 to 31.
                        Checks gained 9 and lost 1; rule relations in
                        all gained 14 and lost 2 (check.dl at 586a0e5
                        against check.lp at 89c74d8). Three rules
                        guard relation_supersedes, which no item uses
                        at 89c74d8 (git grep). The packet frames the
                        decision as a pause of tooling. The review
                        note said "Build only that"
                        (review-2026-10-14.md line 54). Will then
                        asked for groundwork before the capture: "What
                        do we have to do to get there with a firm
                        foundation?" (maintainer's statement,
                        2026-10-14T19:13:35Z). Most of the growth
                        (7db4229 to 89c74d8) came after that question.
                        ASSUMPTION: under opt_keep_building_tooling
                        the same types would have been built without
                        real cases and some reworked later, so the
                        saving lies in where effort went, not how
                        much.

