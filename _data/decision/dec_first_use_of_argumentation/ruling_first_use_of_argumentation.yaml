title:                  Real decisions recorded now
brief:                  |
                        Real decisions about cc-public are recorded
                        now, with advocates, and tooling work goes on
                        beside them, aimed at the gaps they show. Use
                        found those gaps within hours, one wrong
                        mechanism among them, and the first ruling
                        reversed an unrecorded engine choice while its
                        rules were still small enough to port in under
                        an hour. Building tooling first would have
                        added mechanism no real case had tested, and
                        it would not lighten the review load that
                        grows with each decision. Ruled by WTP on
                        2026-10-23.

