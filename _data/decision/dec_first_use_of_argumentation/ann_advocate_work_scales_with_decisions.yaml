title:                  Advocate work growing with every decision
brief:                  |
                        Each decision costs one advocate run per
                        driver plus a merger, a verifier and
                        maintainer review, so text and spend grow with
                        decisions times drivers against one reviewer.
                        The chosen alternative moves the bottleneck to
                        review.
description:            |
                        68 decisions in work/index.txt (18
                        argumentation, 14 item graph, 12 vocabulary,
                        10 tooling, 9 change control, 5 project
                        guidance); 4 to 7 drivers each, 7 for tooling
                        (templates/drivers.txt), about 348 advocate
                        runs plus 136 merger and verifier runs. 208
                        advocate files of 15,772 lines existed by
                        then, before merge (wc, 2026-10-15). On the
                        snapshot of 2026-10-23 the tree holds 130
                        decisions with 1,429 annotations of 74,573
                        lines and 85 rulings (ls and wc of
                        _data/decision). Maintainer's statements:
                        review "in batches of five" and capture "as
                        comprehensively as possible" (2026-10-14);
                        annotations "might quickly explode out of
                        control" (2026-10-14). In the advocate pilot,
                        review took longer than production
                        (notes/advocate-pilot-tooling-language.md line
                        49). A prior attempt failed on too much
                        material to review
                        (memory/cc-public-design-principles.md lines
                        11 and 27). ASSUMPTION: each run costs money;
                        no figure is recorded.

