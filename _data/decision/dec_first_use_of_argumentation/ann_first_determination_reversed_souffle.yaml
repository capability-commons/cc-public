title:                  First determination reversed the Souffle choice
brief:                  |
                        The first real argument overturned an earlier,
                        unrecorded choice of Souffle in favour of
                        clingo. This shows an earlier choice can be
                        reopened and reversed by argument; here the
                        argument, not a change of conditions, reversed
                        it.
description:            |
                        Souffle was chosen on 2026-10-13 for much
                        larger graphs (memory/MEMORY.md, "Checker
                        direction"). Arguments recorded in c7058e3;
                        determination 6c0a949 upheld clingo; checks
                        moved to clingo in 6230e98. Owner's statement
                        2026-10-14T22:11:54Z: "The advocates are right
                        ... (Which means the process is working)." One
                        case shows the function works, not that it
                        works at scale.

