title:                  Rulings made before computed evaluation
brief:                  |
                        Rulings are recorded by hand while the
                        computed evaluation of a deliberation, which
                        the design calls for, does not exist. Many
                        decisions recorded now cannot be checked
                        against their arguments.
description:            |
                        7db4229 brief: the evaluation "is to be
                        computed and never stored, so that the two can
                        be compared when the arguments move". No code
                        under src/ computes it (grep for evaluat,
                        grounded, acceptab, 2026-10-15). The advocate
                        prompt lives outside the repository
                        (scratchpad templates/advocate.md). The review
                        note suggested one decision and building only
                        what it showed was missing
                        (review-2026-10-14.md line 54). This favors
                        building the evaluation next, not
                        opt_keep_building_tooling as stated.

