title:                  Real decisions exercise change over time
brief:                  |
                        Recording real decisions exercises what the
                        maintainer sees as central: a decision that
                        was right can become wrong as conditions
                        change. It also captures the decisions made so
                        far.
description:            |
                        Maintainer's statements: "That sounds like a
                        good step. It also exercises what I think will
                        be an important aspect of this: As conditions
                        change, so decisions that were once the right
                        ones may end up being the wrong ones ..."
                        (2026-10-14T16:11:18Z, after note
                        review-2026-10-14.md suggested pausing
                        tooling); "I'd like to get to the point where
                        we can capture a bunch of the design decisions
                        we made getting to this point"
                        (2026-10-14T19:13:12Z); "please capture all
                        past decisions as comprehensively as possible"
                        (2026-10-14T23:39:41Z).

