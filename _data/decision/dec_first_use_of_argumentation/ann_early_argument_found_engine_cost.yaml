title:                  Running cost found cheaply by early deliberation
brief:                  |
                        The first real deliberation exposed a rule
                        engine kept outside the locked environment
                        while its rules were still small enough to
                        port in under an hour.
description:            |
                        Souffle was kept by hand in a gitignored
                        folder with a copied libffi
                        (ann_souffle_is_outside_the_locked_environment
                        lines 12-27). Ruling 6c0a949 at 22:15Z; port
                        6230e98 at 22:51Z, 28 files, +1199 -1110.
                        Rules ported: 526 lines of check.dl, 226 of
                        change.dl, 87 of derive.dl (git show --stat
                        6230e98). ASSUMPTION: the effort to change a
                        rule engine grows with the number of rules
                        written for it.

