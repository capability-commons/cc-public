title:                  Souffle choice reversed by the first ruling
brief:                  |
                        The first real deliberation overturned an
                        earlier, unrecorded choice of Souffle in favor
                        of clingo. This shows an earlier choice can be
                        reopened and reversed by argument; here the
                        deliberation, not a change of conditions,
                        reversed it.
description:            |
                        Souffle was chosen on 2026-10-13 for much
                        larger graphs (memory/MEMORY.md, "Checker
                        direction"). Arguments recorded in c7058e3;
                        ruling 6c0a949 upheld clingo; checks moved to
                        clingo in 6230e98. Maintainer's statement
                        2026-10-14T22:11:54Z: "The advocates are right
                        ... (Which means the process is working)." One
                        case shows the function works, not that it
                        works at scale.

