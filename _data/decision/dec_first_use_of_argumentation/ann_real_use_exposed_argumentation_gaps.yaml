title:                  Gaps in argumentation found by use
brief:                  |
                        Recording real decisions showed within hours
                        that argumentation lacked needed functions and
                        trace links, and had one wrong mechanism. Only
                        one, a record of a decision's outcome, had
                        been named before the pause.
description:            |
                        The first options (6592fb5, 16:15Z) were about
                        the Python package cc_public, which would not
                        outlive a rewrite (owner's statement
                        2026-10-14T18:15:48Z). Fixed by
                        type_logical_component, r_realizes and
                        lco_tooling (f4cb721). A plain measurement was
                        forced to carry a concern (raised by the owner
                        2026-10-14T18:42:50Z; d03026b). No item
                        recorded an outcome, which
                        review-2026-10-14.md line 50 had already
                        listed as a candidate: type_ruling, r_upholds
                        and r_rejects added (7db4229). No rule said
                        which concerns must speak: r_is_driven_by
                        added (3d7ef5b). A shared premise had to be
                        repeated per concern (owner's statement
                        2026-10-14T21:51:15Z; aa23286). Alternatives
                        as sibling options sharing r_is_about let two
                        decisions about one component count each
                        other's arguments: replaced by type_decision
                        and r_is_option_for (52e3e6d, 1ba2895).
                        r_supersedes widened (89c74d8). The review
                        note had predicted this: a real decision
                        "shows which tooling is actually missing.
                        Build only that." (review-2026-10-14.md line
                        54). ASSUMPTION: more scaffolding would not
                        have surfaced these gaps; no source shows what
                        it would have found.

