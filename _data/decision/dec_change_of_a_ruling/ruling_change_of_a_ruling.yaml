title:                  Record of a change of ruling
brief:                  |
                        A decision has at most one ruling, and a
                        change of ruling edits it in place. Ruled by
                        WTP, who preferred at first to record the
                        ruling on the decision, and chose this so that
                        rulings do not multiply and because git
                        already holds the history (2026-10-19).

