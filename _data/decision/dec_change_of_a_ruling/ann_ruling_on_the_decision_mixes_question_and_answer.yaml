title:                  Ruling on the decision that mixes question and answer
brief:                  |
                        A decision that carries its ruling is both the
                        question and its answer. The commits that
                        change it mix edits to the question with
                        changes of ruling, so they attribute the
                        ruling less clearly, and the outcome is no
                        longer the record of its own that
                        dec_outcome_stored_or_computed settled on.

