title:                  Capacity by kind that keeps outside floods from crowding out faults
brief:                  |
                        Overflows and overruns are bounded by the
                        graph, at most one for each port and one for
                        each local step, but two kinds of event come
                        at a rate an outsider sets: admissions of
                        outside messages, and change events, which the
                        trial's code raises for every apply request
                        that names another graph. In one shared queue,
                        as the header option and the fixed struct
                        have, a flood of these fills the slots a fault
                        needs, and the trial's queue, when full,
                        counts the newest event as lost. Arrays by
                        kind give each kind its own capacity, derived
                        from the lowered graph as
                        ann_events_per_step_bounded_by_graph_and_door
                        proposes for one queue, so an admission can
                        never displace an overflow, and each array
                        holds items of its own size rather than slots
                        as large as the largest payload. A shared
                        queue gets the same protection only with a
                        quota for each kind, which neither of those
                        options states.
description:            |
                        Sources:
                        - Events per local step are bounded by the
                          graph, apart from
                          change requests and outside messages, which runtime control can
                          limit at its door
                          (_data/decision/dec_overflow_of_events_and_recordings/ann_events_per_step_bounded_by_graph_and_door.yaml
                          at brief).
                        - Runtime control reports a refused change
                          event for every apply
                          request that names another graph (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/control.cpp, function handle),
                          read from the code.
                        - Each unit has one ring of 4096 events, and
                          an event that finds
                          it full is counted as lost (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, functions run and
                          EventQueue::push), read from the code.
                        - An event is never dropped
                          (_data/interface_control_document/icd_dataflow_engine_event.yaml
                          at surface.data.artifact.availability).
                        - Capacities are derived by a transform
                          (_data/decision/dec_how_the_capacity_of_a_port_is_set/ruling_capacity_derived_from_maximum_producer_rates.yaml
                          at brief).
                        - Security asks what an attacker can reach;
                          performance counts
                          peak memory (_data/register/reg_concern.yaml at
                          entries.concern_security.question.2 and
                          entries.concern_performance_efficiency.measure.2).
                        ASSUMPTION: runtime control or the sources of
                        outside messages may be reachable by parties
                        that are not trusted. Strength: moderate; a
                        limit at the door of runtime control narrows
                        it under any option, and quotas in one queue
                        would match it.

