title:                  Slot sized for the largest payload, which a new kind can enlarge
brief:                  |
                        Events are readings of a runtime service that
                        the control block passes on, and the ruling on
                        services asks that the control message grow by
                        a rule that keeps nodes built earlier,
                        possibly by a partner and loaded in a live
                        swap, safe to load; the decision names that
                        rule, and the same reasoning holds for a
                        layout of events that nodes read. Under the
                        header option every slot is as large as the
                        largest payload, so a new kind with a larger
                        payload changes the size of every slot and the
                        layout that every reader of events was built
                        against, partners' binaries included. Under a
                        type for each kind, a new kind is a new type
                        that no earlier node declared, and earlier
                        nodes are untouched; the fixed struct never
                        changes its layout, though a new meaning for
                        its integers is invisible to an old reader.
                        Slots with headroom fixed in the first
                        version, or a size field in the header, would
                        meet the rule.
description:            |
                        Sources:
                        - The engine reports events to the control
                          block as readings of a
                          runtime service, and the decision names the rule by which the
                          control message grows
                          (_data/decision/dec_encoding_of_an_engine_event/dec_encoding_of_an_engine_event.yaml
                          at brief and description).
                        - The layout of the control message has a rule
                          for growth, so that
                          nodes built earlier stay safe to load
                          (_data/decision/dec_how_nodes_reach_runtime_services/ruling_services_in_a_control_message.yaml
                          at brief).
                        - A node built earlier, or by a partner, and
                          loaded in a live swap
                          may read fields at the wrong offsets when a shared struct grows
                          (_data/decision/dec_how_nodes_reach_runtime_services/ann_growing_control_message_changes_every_node_interface.yaml
                          at brief).
                        - The header option keeps one queue of slots
                          large enough for the
                          largest payload
                          (_data/decision/dec_encoding_of_an_engine_event/opt_fixed_header_with_a_typed_payload.yaml
                          at brief).
                        - Dependency risk asks what happens if a part
                          taken from a third
                          party is changed or withdrawn (_data/register/reg_concern.yaml at
                          entries.concern_dependency_risk.question.1).
                        ASSUMPTION: some node kinds that read events
                        will come as binaries from partners, which
                        cctool cannot rebuild, so a grown slot leaves
                        the engine waiting on a partner who may no
                        longer rebuild them. Strength: weak to
                        moderate; it depends on partners' nodes
                        reading events, and a slot size stated in the
                        header removes it.

