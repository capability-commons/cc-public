title:                  Named fields for a node that must act on a reported fault
brief:                  |
                        If a reader that must tell a dropped message
                        from an empty one learns of the drop from the
                        faults reported to it, as
                        opt_fault_read_from_the_control_message
                        proposes, and those faults are engine events
                        in the encoding chosen here, the author of an
                        ordinary node writes code that reads an
                        overflow event and reaches a safe state. In
                        the fixed struct the excess and the fail-safe
                        are the fields a and b, whose meanings the
                        trial stated only in a comment of its
                        dictionary entry, and there for overflows and
                        overruns alone, so reading them the wrong way
                        round compiles and looks right. A typed
                        payload or a type for each kind gives named
                        fields from the data dictionary, which the
                        compiler checks and whose changes the upgrade
                        check of the dictionary sees. WTP asked that
                        node authors not carry clever mechanisms.
description:            |
                        Sources:
                        - A reader that must tell absent from empty
                          reads the faults of its
                          inputs in the control message
                          (_data/decision/dec_how_a_reader_tells_absent_from_empty/opt_fault_read_from_the_control_message.yaml
                          at brief); a dropped obstacle list read as empty reads as free
                          space
                          (_data/decision/dec_behavior_when_a_capacity_is_exceeded/ann_truncated_obstacle_list_reads_as_free_space.yaml
                          at brief; review of 2026-10-29, CC-061).
                        - The meanings of a and b were stated in a
                          comment of the trial's
                          dictionary entry for the engine event, for overflows and overruns
                          only (trial 2c777ab9,
                          src/cctool/dataflow/standard/data_dictionary/engine_event_v1.yaml);
                          those for change and swap events are in its process log (trial
                          process log, phase 3), and its reader repeats only the numbers
                          of the kinds, in a table (src/cctool/dataflow/recording.py,
                          function events).
                        - Each type is a versioned item, with a
                          mapping for each field when
                          it is upgraded
                          (_data/decision/dec_form_of_the_data_dictionary/ruling_dictionary_items_with_upgrades.yaml
                          at brief).
                        - WTP wants no clever mechanisms that burden
                          node authors (WTP,
                          2026-10-28).
                        - Safety asks how the design avoids or limits
                          each hazard
                          (_data/register/reg_concern.yaml at
                          entries.concern_safety.question.1).
                        ASSUMPTION: no check compares how a node reads
                        a and b with the meaning stated for each kind.
                        Strength: moderate; it matters where ordinary
                        nodes read events, not where only control
                        blocks and recorders do.

