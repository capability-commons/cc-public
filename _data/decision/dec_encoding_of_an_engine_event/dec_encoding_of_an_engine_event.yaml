title:                  Encoding of an engine event
brief:                  |
                        The engine reports overflows, overruns,
                        admissions, change sets and swaps to the
                        control block of an execution unit, as
                        readings of a runtime service. How is an event
                        encoded?
description:            |
                        icd_dataflow_engine_event states what each
                        kind of event carries and leaves the encoding
                        open. ruling_services_in_a_control_message has
                        each node declare the fields of the control
                        message it reads, and the control message grow
                        by a rule that keeps older nodes safe. The
                        trial implementation of 2026-10-29 used one
                        struct for every event, with a kind and two
                        integers whose meaning depends on the kind
                        (trial process log, phase 3). What happens
                        when events overflow is open in
                        dec_overflow_of_events_and_recordings.

