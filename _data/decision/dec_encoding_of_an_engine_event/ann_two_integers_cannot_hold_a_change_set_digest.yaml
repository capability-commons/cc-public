title:                  Two integers that cannot hold a change set's digest or both versions
brief:                  |
                        The ICD has a change event carry the digest of
                        the change set, and a swap event the old and
                        the new version and whether the new one kept
                        its place. The trial's digests are SHA-256, 32
                        bytes, which two 64-bit fields cannot hold,
                        and a swap needs three values where the struct
                        has two. In the trial's code the change event
                        carried only applied or refused, with a count
                        or a reason, and the swap event one version;
                        the change set itself reached the recording by
                        a side path, the engine writing its text
                        there, which the ruling that the engine
                        records nothing itself now excludes, and that
                        side path is the one whose rows were dropped
                        without a count. A typed payload, in either of
                        the other options, carries what the ICD names.
description:            |
                        Sources:
                        - A change event carries the digest of the
                          change set; a swap event
                          carries the node, the old and new versions, the local step and
                          the outcome
                          (_data/interface_control_document/icd_dataflow_engine_event.yaml
                          at surface.data.artifact.artifact.change.content and
                          surface.data.artifact.artifact.swap.content).
                        - The trial's content digest is SHA-256 of the
                          canonical text
                          (trial 2c777ab9, src/cctool/dataflow/items.py, function digest).
                        - The trial's change event had a for applied
                          or refused and b for
                          the reason, and its swap event a for kept or put back (trial
                          process log, phase 3); in its code the applied change event has
                          the number of nodes in b, the swap reports only one version, and
                          the change set's text goes into the recording from the engine
                          (trial 2c777ab9, src/cctool/dataflow/engine/src/dynamic.cpp,
                          functions install and dynamic_slot), read from the code.
                        - The engine records nothing itself; recording
                          nodes write the log
                          (_data/decision/dec_replay_of_a_run_with_live_changes/ruling_replay_from_a_recorded_log.yaml
                          at brief).
                        - Change and admission rows that the recording
                          could not take were
                          dropped without a count, and replay diverged (review of
                          2026-10-29, CC-015).
                        Strength: strong; the fixed struct fits only
                        if the ICD is cut back to what two integers
                        hold, or if the digest becomes an index into a
                        table that the recording keeps.

