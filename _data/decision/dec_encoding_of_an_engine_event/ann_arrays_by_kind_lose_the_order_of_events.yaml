title:                  Arrays by kind that lose the order of events within a unit
brief:                  |
                        The ICD orders events as they happened within
                        an execution unit, and the trial's code kept
                        that order at no cost in a single queue.
                        Arrays by kind keep it only within a kind: a
                        swap, and an overflow raised by the new
                        version in the same local step, which the
                        trial's code reports in that order, arrive in
                        different arrays, and a reader cannot tell
                        which came first unless each event also
                        carries a sequence number of its unit. The
                        control block has one events output, a
                        recorder takes values of one type, and a port
                        group must share one type, so arrays by kind
                        also mean an output and a recorder for each
                        kind, and a new kind of event adds both. A
                        fixed header with a typed payload in one queue
                        keeps the order and the one port.
description:            |
                        Sources:
                        - Events are ordered as they happened within
                          one execution unit
                          (_data/interface_control_document/icd_dataflow_engine_event.yaml
                          at surface.data.artifact.ordering).
                        - The trial held the events of a unit in one
                          ring and drained them
                          in order (trial 2c777ab9,
                          src/cctool/dataflow/engine/src/runtime.cpp, functions
                          EventQueue::push and EventQueue::drain); a swapped node that
                          overflows in its first local step is reported as a swap, then an
                          overflow (src/cctool/dataflow/engine/src/dynamic.cpp, function
                          dynamic_slot), both read from the code.
                        - The control block of a unit has one output
                          of engine events
                          (_data/interface_control_document/icd_dataflow_control_block.yaml
                          at surface.unit.dataflow_step.output.events), and a recorder
                          records values of one type
                          (_data/interface_control_document/icd_dataflow_recorder.yaml at
                          surface.recorder.dataflow_step.input.recorded).
                        - The ports of a group share one data type
                          (_data/decision/dec_ports_whose_count_comes_from_configuration/ruling_port_groups_sharing_a_type.yaml
                          at brief).
                        - The trial's lowering inserted one recorder
                          for each recorded end
                          (trial 2c777ab9, src/cctool/dataflow/lower.py, function
                          _recorders).
                        Strength: moderate; a sequence number in each
                        event restores the order for eight bytes, but
                        the extra ports and recorders remain.

