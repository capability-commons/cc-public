title:                  Fewest mechanisms without source items
brief:                  |
                        With no items for source files, four types,
                        four schemas, two check rules, the docstring
                        and header readers and the header command all
                        go. By count of mechanisms it is the simplest
                        alternative.
description:            |
                        Types and schemas: _data/register/
                        reg_data_item_type.yaml lines 524-686;
                        _data/schema/sch_python_module.yaml,
                        sch_python_package.yaml,
                        sch_logic_program_file.yaml, sch_file.yaml.
                        Rules: src/cc_public/check/check.lp lines
                        120-131, 202-210. The simplicity advocate
                        notes that source files would then be the one
                        artifact that is not an item, a second concept
                        to explain.

