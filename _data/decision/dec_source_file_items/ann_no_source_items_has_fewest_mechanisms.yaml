title:                  Fewest mechanisms without source items
brief:                  |
                        With no items for source files, seven types,
                        seven schemas, four check rules, the docstring
                        and header readers and the header command all
                        go. By count of mechanisms it is the simplest
                        alternative.
description:            |
                        Types: _data/register/reg_data_item_type.yaml
                        lines 592-783, 1116-1205 and 1395-1430, each
                        with its schema in _data/schema. Rules:
                        src/cctool/check/check.lp lines 281-283,
                        343-346, 440-454, 478-489. The simplicity
                        advocate notes that source files would then be
                        the one artifact that is not an item, a second
                        concept to explain.

