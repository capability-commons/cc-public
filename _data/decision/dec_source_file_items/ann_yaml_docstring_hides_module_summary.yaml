title:                  Module summaries that read "---"
brief:                  |
                        Python tools take the first docstring line as
                        the module summary. Every module docstring
                        here opens with "---", so help, pydoc and
                        editor hover text show "---".
description:            |
                        PEP 257 (https://peps.python.org/pep-0257/).
                        pydoc.synopsis on src/cc_public/check/check.py
                        returns '---' (Python 3.13.16, run by the
                        compatibility advocate on 2026-10-15). The
                        extractor takes a docstring as an item only if
                        it starts with "---"
                        (src/cc_public/graph/extract.py lines
                        323-326). ruff selects no pydocstyle rules
                        (pyproject.toml lines 93-97). Nothing that
                        runs breaks.

