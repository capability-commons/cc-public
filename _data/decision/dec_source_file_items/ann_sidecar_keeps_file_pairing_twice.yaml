title:                  Sidecar pairing kept in two places
brief:                  |
                        A sidecar must name its source file, so the
                        link between item and file is kept twice and
                        needs rules to keep it in step. Each rename,
                        move or removal of a module then touches two
                        files.
description:            |
                        Under the chosen alternative the path is the
                        only link: one function, module_name, derives
                        the id (src/cc_public/graph/extract.py lines
                        243-262), and misplaced_module and
                        unrecorded_module check it
                        (src/cc_public/check/check.lp lines 120-131,
                        202-210). ASSUMPTION: no sidecar design exists
                        in the repository; the sidecar needs a field
                        or path convention naming its file, a rule
                        that the file exists, and a rule that each
                        file has a sidecar. From the maintainability
                        and simplicity advocates.

