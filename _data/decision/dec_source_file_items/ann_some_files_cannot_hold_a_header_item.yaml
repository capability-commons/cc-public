title:                  Files that cannot hold a header item
brief:                  |
                        JSON, Markdown, generated lock files and fixed
                        texts cannot carry an item in a comment
                        header, so they stay outside the graph. A
                        sidecar item can describe any file without
                        touching it.
description:            |
                        cctool header refuses .yaml, .json and .md
                        files (src/cc_public/edit/edit.py lines
                        114-119, 302-304). The header reader needs a
                        comment marker on every line
                        (src/cc_public/graph/extract.py lines 129-141,
                        1043-1069). JSON has no comments (RFC 8259).
                        Of 14 paths outside src and _data, 7 hold no
                        item: AGENTS.md, README.md, LICENSE, NOTICE,
                        pixi.lock,
                        .agents/skills/editing-data-items/SKILL.md and
                        the .claude/skills link. The 6 static files in
                        src/cc_public/web/_static hold none either.
                        pixi.lock is written by pixi. ASSUMPTION: a
                        header added to it by hand is lost when pixi
                        rewrites it. REUSE answers the same problem
                        with a ".license" sidecar
                        (https://reuse.software/spec-3.3/). A mixed
                        scheme, header where possible and sidecar
                        elsewhere, would answer this without dropping
                        the chosen alternative. From the
                        compatibility, flexibility and traceability
                        advocates.

