title:                  Little cost from parsing docstrings
brief:                  |
                        Reading items from module docstrings costs
                        little next to the rest of extraction, so the
                        chosen alternative does not limit how far the
                        graph can grow compared with sidecars.
description:            |
                        Measured by the flexibility advocate on
                        2026-10-15 at HEAD 89c74d8 with Python
                        3.13.16: 129 tracked files, 37 python modules
                        of 7767 lines; documents() over the tree took
                        0.61 s, of which ast.parse of all modules took
                        0.07 s. The extractor walks every file
                        whichever alternative holds the items
                        (src/cc_public/graph/extract.py lines 144-146,
                        199-207). ASSUMPTION: parse time grows about
                        linearly with source size.

