title:                  Little cost from parsing docstrings
brief:                  |
                        Reading items from module docstrings costs
                        little next to the rest of extraction, so the
                        chosen alternative does not limit how far the
                        graph can grow compared with sidecars.
description:            |
                        Measured on 2026-10-22 with Python 3.13.16: 78
                        python modules of 25172 lines; documents()
                        over the tree took about 7.5 s, of which
                        ast.parse took about 0.3 s. The extractor
                        walks every file whichever alternative holds
                        the items (src/cc_public/graph/extract.py
                        lines 426-470). ASSUMPTION: parse time grows
                        about linearly with source size.

