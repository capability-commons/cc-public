title:                  Source items with no edge
brief:                  |
                        The rule makes each source file hold an item
                        but not name the reason it exists. 88 of the
                        96 source items have no edge, and no check
                        reports it, so the decision gives a place for
                        a trace, not the trace.
description:            |
                        96 source items: 68 pym, 10 pyp, 6 pyf, 5 lpf,
                        5 shell and 2 file. Only 8 have an edge:
                        pyp_cctool, pym_cctool.check.check and the six
                        functions in src/cctool/check/check.py.
                        unrecorded_module tests only that an item
                        exists (src/cctool/check/check.lp lines
                        343-346). derive.lp has no rule that lets a
                        module inherit its package's relation_realizes
                        edge (src/cctool/graph/derive.lp). ASSUMPTION:
                        such a rule could use the dotted id. A sidecar
                        would have the same gap. From the traceability
                        advocate.

