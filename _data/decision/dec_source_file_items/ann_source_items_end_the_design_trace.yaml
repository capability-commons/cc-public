title:                  Source items as the end of the trace
brief:                  |
                        Code reaches a logical component, and through
                        it the decisions about it, only if the code is
                        an item. With no source items the trace stops
                        short of the code, and nothing counts the
                        files that nothing calls for.
description:            |
                        r_realizes, the only relation from code to the
                        design, has a domain of the four source item
                        types and a range of t_logical_component
                        (_data/register/reg_relation.yaml lines
                        325-350). Options answer issues that are about
                        a logical component (memory/MEMORY.md,
                        "Issues", commit 1ba2895). The one r_realizes
                        edge is held in a source item: pyp_cc_public
                        realizes lc_tooling (src/cc_public/__init__.py
                        lines 22-27; commit f4cb721). A sidecar would
                        serve as well. From the traceability advocate.

