title:                  Source items as the end of the trace
brief:                  |
                        Code reaches a logical component, and through
                        it the decisions about it, only if the code is
                        an item. With no source items the trace stops
                        short of the code, and nothing counts the
                        files that nothing calls for.
description:            |
                        relation_realizes, the only relation from code
                        to the design, runs from an implementation to
                        a design entity
                        (_data/register/reg_relation.yaml lines
                        379-387). This decision is about a logical
                        component, lco_item_graph
                        (_data/decision/dec_source_file_items/dec_source_file_items.yaml
                        lines 19-22). 11 relation_realizes edges run
                        from functions (6), dataflow nodes (3), a
                        module and a package. A source item holds its
                        own, as pyp_cctool does for lco_tooling
                        (src/cctool/__init__.py lines 22-27). A
                        sidecar would serve as well. From the
                        traceability advocate.

