title:                  A module item with no second file
brief:                  |
                        With its item in the file, a module can be
                        traced, annotated and argued over like any
                        other item, with no second file to keep in
                        step with it.
description:            |
                        Written by an assistant, not by Will:
                        _data/register/reg_data_item_type.yaml lines
                        536-540, type_python_module usage. The same
                        choice was made in the legacy system ("Source
                        items in docstrings, with dotted pym ids",
                        cc-public-stocktake-2026-10-13.md). The rule
                        that every python file holds an item
                        (unrecorded_module) is one of Will's chosen
                        rules (memory/MEMORY.md, commit fd6323a). Made
                        in beb23ab and 6c8d3d5 on 2026-10-13 and in
                        150d0f7 on 2026-10-14; cctool header in
                        29cb646 on 2026-10-14.

