title:                  Three item carriers
brief:                  |
                        The chosen alternative reads items from YAML
                        files, module and function docstrings and
                        comment headers with a per-suffix marker, and
                        the extractor, formatter and editor each carry
                        a branch for each. A sidecar needs only the
                        YAML route.
description:            |
                        Readers: src/cctool/graph/extract.py lines
                        129-141 (marker map, shebang rule) and
                        731-1069. Formatter: _spans, _documented and
                        _span_header, src/cctool/edit/layout.py lines
                        250-446. Editor: header and header_definition,
                        src/cctool/edit/edit.py lines 284-405. The
                        move to clingo in 6230e98 changed the marker
                        and prefix tables. Item headers are about
                        2,700 of 27,888 lines in the 83 .py and .lp
                        files under src (count on 2026-10-22). Commit
                        messages are a fourth carrier
                        (_data/register/reg_data_item_type.yaml lines
                        801-811, type_commit note). The cost grows
                        with file kinds, not with graph size. From the
                        maintainability and simplicity advocates.

