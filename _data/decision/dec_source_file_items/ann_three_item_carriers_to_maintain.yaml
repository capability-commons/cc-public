title:                  Three item carriers
brief:                  |
                        The chosen alternative reads items from YAML
                        files, python docstrings and comment headers
                        with a per-suffix marker, and the extractor,
                        formatter and editor each carry a branch for
                        each. A sidecar needs only the YAML route.
description:            |
                        Readers: src/cc_public/graph/extract.py lines
                        85-97, 186-198, 294-391 (marker map, shebang
                        rule). Formatter: _span_docstring and
                        _span_header, src/cc_public/edit/layout.py
                        lines 148-179, 182-200, 259-321. Editor:
                        header command, src/cc_public/edit/edit.py
                        lines 301-385. The move to clingo in 6230e98
                        changed the marker and prefix tables. Item
                        headers are about 1200 of 8716 lines in the 40
                        .py and .lp files under src (maintainability
                        advocate's count at HEAD 89c74d8). Commit
                        messages are a fourth carrier
                        (reg_data_item_type.yaml, type_commit note).
                        The cost grows with file kinds, not with graph
                        size. From the maintainability and simplicity
                        advocates.

