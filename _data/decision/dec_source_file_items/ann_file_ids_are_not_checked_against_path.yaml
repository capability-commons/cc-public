title:                  Ids of file and shell items not tied to the path
brief:                  |
                        Only items in .py and .lp files get an id
                        checked against their place. The id of a file_
                        or shell_ item is free, so a person keeps its
                        id and its path in step.
description:            |
                        The module_name fact is produced only for .py
                        and .lp files and the classes and functions in
                        them (src/cctool/graph/extract.py within
                        _facts_of_document), and misplaced_module
                        checks only that fact
                        (src/cctool/check/check.lp within
                        misplaced_module). Example:
                        shell_githooks_pre_merge_commit
                        (.githooks/pre-merge-commit). From the
                        simplicity advocate. This narrows the reason;
                        it does not contradict it for items in .py and
                        .lp files.

