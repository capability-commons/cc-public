title:                  file_ ids not checked against the path
brief:                  |
                        Only .py and .lp items get an id derived from
                        and checked against their path. The id of a
                        file_ item is free, so for those items the id
                        and the path are two things a person keeps in
                        step.
description:            |
                        The module_name fact is produced only for .py
                        and .lp files (src/cc_public/graph/extract.py
                        lines 224-226), and misplaced_module checks
                        only that fact (src/cc_public/check/check.lp
                        lines 120-131). Example:
                        shell_githooks_pre_merge_commit
                        (.githooks/pre-merge-commit line 4). From the
                        simplicity advocate. This narrows the reason;
                        it does not contradict it for pym, pyp and lpf
                        items.

