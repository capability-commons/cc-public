title:                  Derived-not-stored ruling recorded only in drafts
brief:                  |
                        The maintainer's earlier ruling that a variant
                        is a base plus transformations, derived and
                        never stored, is recorded only in draft notes,
                        not as a decision in the graph. The variant
                        type option states that rule in its own text,
                        so the record of this decision carries it; the
                        base field option leaves it unstated.
description:            |
                        Sources:
                        - "Will's earlier decision is that variants
                          are a base plus transformation items,
                          derived, not stored."
                          (_sources/cc-patrol-notes/plan.md lines
                          173-174;
                          _sources/cc-patrol-notes/variants.md lines
                          36-37)
                        - No other decision in _data mentions
                          variants. (search of _data for "variant")
                        - The variant type option says "the resolved
                          graph is derived, never stored"; the base
                          field option says nothing about storage.
                          (_data/decision/dec_how_variants_are_held/opt_variant_type_with_operations.yaml
                          lines 11-15;
                          opt_base_field_on_dataflow_graph.yaml lines
                          11-14) Strength: weak; the gap is in the
                          wording of the options and could be closed
                          for either one by its ruling.

