title:                  Parts a new variant type adds
brief:                  |
                        A new type adds a prefix, a schema, a register
                        entry and a folder, each of which a newcomer
                        must learn and every type-wide change must
                        touch. A base field reuses the dataflow graph
                        type, its folder and its checks, and adds none
                        of these.
description:            |
                        Sources:
                        - The proposal is a new type with its own
                          prefix and its own folder under _data.
                          (_sources/cc-patrol-notes/variants.md lines
                          74-75)
                        - A new type needs a prefix held by the prefix
                          form and prefix nearness checks, and a
                          schema named by its type entry. (AGENTS.md
                          lines 116-120, 199-200)
                        - The variants draft lists one type with a
                          base as the alternative.
                          (_sources/cc-patrol-notes/variants.md lines
                          76-78)
                        - "Add a type ... only when a real instance
                          needs it." (AGENTS.md lines 236-237)
                          Assumption: the checks that already run on a
                          graph run unchanged on a resolved one either
                          way. Strength: weak; the parts are
                          bookkeeping and real instances exist, while
                          the split shape of a base field costs every
                          reader of the type.

