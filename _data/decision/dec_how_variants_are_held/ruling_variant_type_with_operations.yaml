title:                  Variant type with operations
brief:                  |
                        A variant type holds a base, a dataflow graph
                        or another variant, and an ordered list of
                        operations; the resolved graph is derived,
                        never stored, and checked, and composing
                        operations gives a tree of variants of one
                        base. Ruled by William Payne on 2026-10-24.
                        The way variants generate product lines, or
                        different software-defined systems, and
                        dataflow simulations used as simulation
                        variants for simulation-backed decisions, is
                        worth decent thought to get right before it is
                        built.

