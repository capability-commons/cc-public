title:                  Variant type with operations
brief:                  |
                        A new type, added when the first variant is
                        ported, holds a base, which is a dataflow
                        graph or another variant, and an ordered list
                        of operations. The resolved graph is derived,
                        never stored, and the checks run on it.
                        Several variants of one base are each defined
                        by the base and their sequence of operations,
                        and since a variant can be the base of
                        another, composing operations gives a tree of
                        variants, much as a generative art tool builds
                        a final product from a graph of operations.
                        This is how product lines, or different
                        software-defined systems, are to be generated
                        from one base, and how dataflow simulations
                        are to be built quickly as simulation variants
                        for simulation-backed decisions.

