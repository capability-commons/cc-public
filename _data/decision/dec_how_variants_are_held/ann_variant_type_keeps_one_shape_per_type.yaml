title:                  One shape per type for checks and readers
brief:                  |
                        A dataflow graph must hold at least one node,
                        and the dataflow checks are only right on a
                        runnable graph. A separate variant type keeps
                        every dataflow graph item whole, so the
                        checks, any other reader and the engine see
                        only complete graphs, and makes "a variant
                        holds no nodes of its own" a schema rule. A
                        base field gives one type two shapes, so every
                        check and reader must first ask which one it
                        has.
description:            |
                        Sources:
                        - The dataflow graph schema requires a node
                          list with at least one entry.
                          (_data/schema/sch_dataflow_graph.yaml at allOf.2.required and allOf.2.properties.dataflow_node)
                        - There are eleven dataflow checks, including
                          input fed twice and unfed input.
                          (src/cctool/check/check.lp)
                        - The Patrol base is not runnable: two
                          decoders feed one analysis branch, so it
                          would fail the input-fed-twice check unless
                          exempt or marked abstract.
                          (_sources/cc-patrol-notes/variants.md lines
                          124-127;
                          _sources/cc-patrol-notes/drawing-lessons.md
                          line 11)
                        - "A variant cannot hold its own nodes
                          directly, only through operations; keeping
                          the types apart keeps that rule simple."
                          (_sources/cc-patrol-notes/variants.md lines
                          74-78)
                        - The checks run on every resolved variant,
                          with failures naming the variant and the
                          operation that introduced the fault.
                          (_sources/cc-patrol-notes/variants.md lines
                          86-89)
                        - The base-field option lets a graph hold
                          operations in place of its own sections.
                          (_data/decision/dec_how_variants_are_held/opt_base_field_on_dataflow_graph.yaml at title and brief)
                        - In the draft, the engine never sees
                          variants; cctool resolves them to plain
                          configurations.
                          (_sources/cc-patrol-notes/variants.md lines
                          92-95)
                        - The draft Patrol tree has six variants,
                          including variants of variants.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 24-34) Strength: strong for
                          maintainability (the draft states the
                          simplification and real instances exist);
                          moderate for functional suitability,
                          simplicity and compatibility (either option
                          can be made to give right results, the type
                          counts are small, and few readers exist
                          yet).

