title:                  Superset-only content of the two drafted abstract graphs
brief:                  |
                        The annotation on abstract graphs at both
                        levels argues that an abstract flag the checks
                        honor is needed on both types, with the Orin
                        variant as its example. Resolved, both drafted
                        abstract items hold surplus alternatives and
                        lack nothing, and two of the four options for
                        knowing a variant's state derive it from the
                        graph with no flag at all.
description:            |
                        Sources:
                        - The annotation speaks of "the need for an
                          abstract flag that the checks honor".
                          (_data/decision/dec_how_variants_are_held/ann_abstract_graphs_at_base_and_variant_level.yaml
                          at brief)
                        - The resolver reports inputs fed twice, and
                          no required input unfed, in the base and in
                          the Orin variant.
                          (_sources/cc-patrol-notes/draft/resolve_sketch.py,
                          run on the Patrol base and the Orin variant,
                          2026-10-25)
                        - Two options derive the state from the graph
                          and state it in no field.
                          (_data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_placeholders_declared_and_state_derived.yaml
                          at brief;
                          _data/decision/dec_how_a_variant_is_known_abstract_or_superset/opt_unfed_required_ports_and_state_derived.yaml
                          at brief)

