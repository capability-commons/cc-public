title:                  Node ids that trace to their graph under a base field
brief:                  |
                        A dataflow node id is formed from the id of
                        the graph that holds it, so the id alone
                        traces a node to its holder. If a variant is a
                        dataflow graph with a base field, that rule
                        holds unchanged for the nodes a variant adds;
                        a new variant type needs the rule widened.
description:            |
                        Sources:
                        - A dataflow node id is the id of the dataflow
                          graph with the node prefix in place of the
                          graph prefix, then the key of the node.
                          (_data/register/reg_data_item_type.yaml at entries.type_dataflow_node.note, pattern at line 1378)
                        - The variant draft proposes a new prefix for
                          a variant and a node id built from the
                          variant's name for a node that variant adds.
                          (_sources/cc-patrol-notes/variants.md lines
                          74, 79-82) Strength: weak; widening the id
                          rule to the variant prefix is a small change
                          that keeps the same trace.

