title:                  Abstract graphs at both base and variant level
brief:                  |
                        Abstractness is not only a property of the
                        base: an intermediate variant is abstract too.
                        So a separate variant type does not remove the
                        need for an abstract flag that the checks
                        honor, and both types would need it; a single
                        type with a base field needs it in one place
                        only.
description:            |
                        Sources:
                        - The draft base graph is marked abstract.
                          (_sources/cc-patrol-notes/draft, base graph
                          file line 21)
                        - The draft Orin variant is also marked
                          abstract, and three variants are built on
                          it. (_sources/cc-patrol-notes/draft, Orin
                          variant file line 19;
                          _sources/cc-patrol-notes/draft/README.md
                          lines 24-34)
                        - Variants of variants are proposed as allowed
                          and acyclic.
                          (_sources/cc-patrol-notes/variants.md lines
                          90-91)
                        - The throwaway resolver resolved all five
                          runnable variants with every required input
                          fed exactly once.
                          (_sources/cc-patrol-notes/draft/README.md
                          lines 36-38, 67) Strength: weak; it shows a
                          shared need, not a result that one option
                          gets wrong.

