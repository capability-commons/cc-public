title:                  Owner repeated in every standalone item
brief:                  |
                        The full notice puts the owner and year into
                        every standalone item. A change of owner
                        touches every standalone file, as under free
                        text, though the fixed shape makes the edit
                        mechanical.
description:            |
                        _data/schema/sch_trait_rights.yaml lines 46-49
                        and 99-110. 122 tracked files hold the
                        identical copyright line (git grep). The year
                        is the year of first publication and does not
                        roll over (lines 100-103). ASSUMPTION: a
                        change of owner, for example to an
                        organization behind capability-commons.org, is
                        possible. Will has not said so.

