title:                  Unresolved mark reported as a failure
brief:                  |
                        The register says an unresolved partner mark
                        is reported as advisory, but the generic
                        reference check reports it as a failure that
                        blocks a commit. The federated case the rule
                        exists for cannot pass the gate.
description:            |
                        reg_protective_mark.yaml lines 43-53
                        (advisory). extract.py lines 62-63 and 442-457
                        read any id_/guid_ pair as a reference.
                        check.lp lines 229-239 report
                        dangling_reference with no exception for
                        marks. Every row is a failure (check.py lines
                        21-24, 84-106). The check exits 1
                        (cli/checking.py lines 46-53), the gate runs
                        it (gate/gate.py line 64), and the pre-commit
                        hook runs the gate. Latent with one mark and
                        no partner. Honoring the rule needs a
                        mark-specific exception that no decision
                        records.

