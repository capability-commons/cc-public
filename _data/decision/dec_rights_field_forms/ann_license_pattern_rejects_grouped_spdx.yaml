title:                  License pattern narrower than SPDX
brief:                  |
                        The license pattern rejects some valid SPDX
                        expressions, such as grouped or DocumentRef
                        forms. The design cannot take in every license
                        expression a partner produces.
description:            |
                        Pattern: ^[A-Za-z0-9.+-]+( (AND|OR|WITH)
                        [A-Za-z0-9.+-]+)*$
                        (_data/schema/sch_trait_rights.yaml line 132).
                        It admits no parentheses and no colon. SPDX
                        allows both
                        (https://spdx.github.io/spdx-spec/v2.3.1/SPDX-license-expressions/).
                        So "(MIT OR Apache-2.0) AND BSD-3-Clause"
                        fails. All 75 YAML items use Apache-2.0, so
                        none is affected today. The fix is one pattern
                        and does not change the option.

