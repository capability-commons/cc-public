title:                  One rights string for item, NOTICE and package
brief:                  |
                        The copyright and license values are the same
                        strings as NOTICE and pyproject.toml use. One
                        form serves all three places, and an item's
                        license can be followed to the project files
                        by that shared string.
description:            |
                        NOTICE reads "Copyright 2026 William Payne".
                        pyproject.toml at project.license gives
                        license = "Apache-2.0". Items carry the same
                        values (_data/schema/sch_trait_rights.yaml at
                        copyright and license; 1639 files hold the
                        identical lines). New standalone items, and
                        the item headers that cctool header writes,
                        copy their rights from the segment item of the
                        tree, segment_cc_public
                        (src/cctool/edit/edit.py within _rights). The
                        schema says a name-only field would have to be
                        assembled into a notice the same way every
                        time (sch_trait_rights.yaml at
                        properties.copyright.description). ASSUMPTION:
                        tools that write NOTICE files will be written;
                        none exists in the snapshot.

