title:                  One rights string for item, NOTICE and package
brief:                  |
                        The copyright and licence values are the same
                        strings as NOTICE and pyproject.toml use. One
                        form serves all three places, and an item's
                        licence can be followed to the project files
                        by that shared string.
description:            |
                        NOTICE line 2 reads "Copyright 2026 William
                        Payne". pyproject.toml line 37 gives license =
                        "Apache-2.0". Items carry the same values
                        (_data/schema/sch_trait_rights.yaml lines 5-6;
                        122 tracked files hold the identical lines at
                        89c74d8). New items copy their rights from
                        file_pyproject (src/cc_public/edit/edit.py
                        lines 940-951). The schema says a name-only
                        field would have to be assembled into a notice
                        the same way every time (sch_trait_rights.yaml
                        lines 105-110). ASSUMPTION: tools that write
                        NOTICE files or headers will be written; none
                        exists at HEAD.

