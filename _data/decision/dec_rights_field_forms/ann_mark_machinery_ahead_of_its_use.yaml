title:                  Mark machinery ahead of its use
brief:                  |
                        The marks part brings a register, two schemas,
                        a data item type and two handling rules, while
                        the register holds one mark. Code reports an
                        unresolved mark as advice, but nothing applies
                        the conjunctive or most-restrictive rule.
description:            |
                        reg_protective_mark.yaml at
                        entries.mark_public is the only table key.
                        sch_reg_protective_mark.yaml,
                        sch_regentry_protective_mark.yaml,
                        reg_data_item_type.yaml at
                        entries.type_protective_mark
                        (type_protective_mark). Outside file headers
                        and tests, src names protective_mark only in a
                        field-name tuple (src/cctool/edit/edit.py
                        within TUPLE_KEY_RIGHTS) and a help-text
                        example (src/cctool/cli/editing.py within
                        set_field). The only mark rule in code is the
                        unresolved_mark advice
                        (src/cctool/check/advise.lp within
                        unresolved_mark). The point is about timing.
                        It falls away if federated partners and many
                        marks arrive. The free text alternative does
                        not address marks, so this is not an argument
                        for it.

