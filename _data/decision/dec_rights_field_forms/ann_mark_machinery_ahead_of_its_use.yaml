title:                  Mark machinery ahead of its use
brief:                  |
                        The marks part brings a register, two schemas,
                        a data item type and two handling rules, while
                        the register holds one mark and no code
                        applies either rule.
description:            |
                        reg_protective_mark.yaml line 67 is the only
                        table key. sch_reg_protective_mark.yaml,
                        sch_regentry_protective_mark.yaml,
                        reg_data_item_type.yaml lines 236-280
                        (t_protective_mark). Outside file headers and
                        tests, src names protective_mark only in a
                        field-name tuple (src/cc_public/edit/edit.py
                        line 98) and a help-text example
                        (src/cc_public/cli/editing.py line 229). The
                        point is about timing. It falls away if
                        federated partners and many marks arrive. The
                        free text alternative does not address marks,
                        so this is not an argument for it.

