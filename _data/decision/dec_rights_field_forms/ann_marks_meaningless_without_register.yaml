protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Marks readable only with this register
brief:                  |
                        A mark is a reference into this repository's
                        register. An item that moves to a partner or
                        another environment without the register keeps
                        the reference but not its meaning.
description:            |
                        Items hold only id_mark and guid_mark;
                        authority and level live in the register
                        (_data/schema/sch_trait_rights.yaml lines
                        38-40, 74-93). An unresolved mark must be
                        treated as more restrictive than any
                        resolvable mark (lines 68-72;
                        _data/register/reg_protective_mark.yaml lines
                        51-53), so a moved mark_public item is no
                        longer public. The repository holds no mapping
                        to an external marking scheme. ASSUMPTION:
                        partners use external schemes, not this
                        register. The free text alternative names no
                        form for marks.

