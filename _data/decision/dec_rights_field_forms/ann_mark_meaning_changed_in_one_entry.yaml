title:                  Mark meaning held in one register entry
brief:                  |
                        A change to what a mark means, such as a new
                        authority or level, is one edit to the
                        register, not one edit per item that carries
                        the mark.
description:            |
                        Authority and level are held once, in the
                        register (_data/schema/sch_trait_rights.yaml
                        lines 38-40; reg_protective_mark.yaml entry
                        mark_public). 122 tracked files carry
                        guid_mark (git grep in the clone). The checker
                        reports a stale or dangling reference
                        (check.lp lines 229-252). Moving an item to a
                        different mark is still one edit per item
                        under either alternative
                        (src/cc_public/cli/editing.py line 229).

