title:                  Mark rules stated in prose but not built
brief:                  |
                        The conjunctive, most-restrictive and
                        unresolved-mark rules are written in several
                        places in prose, and no code applies them.
                        Each copy must be changed by hand and can
                        drift from the checker.
description:            |
                        Stated in _data/schema/sch_trait_rights.yaml
                        lines 26-31, 61-66 and 68-72, and in
                        reg_protective_mark.yaml usage and note
                        blocks. A mark entry holds authority and level
                        as plain values with no ordering. Nothing in
                        src/ reads authority or level or compares
                        marks (git grep for "level", "restrictive",
                        "authority").

