protective_mark:

  - id_mark:            mark_public
    guid_mark:          mark_0c96ccb7b7534574acf6ed42f9deba0f

title:                  Mark rules stated in prose but not built
brief:                  |
                        The conjunctive and most-restrictive rules,
                        and the rule to read an unresolved mark as
                        more restrictive, are written in several
                        places in prose, and no code applies them.
                        Each copy must be changed by hand and can
                        drift from the checker.
description:            |
                        Stated in _data/schema/sch_trait_rights.yaml
                        at description and
                        properties.protective_mark.description, in
                        reg_protective_mark.yaml usage and note
                        blocks, and in the unresolved_mark advice text
                        (src/cctool/check/advise.lp within
                        unresolved_mark). A mark entry holds authority
                        and level as plain names with no ordering
                        (sch_regentry_protective_mark.yaml at
                        properties.authority, properties.level and
                        $defs). Code reports an unresolved mark as
                        advice (advise.lp within unresolved_mark), but
                        nothing in src/ reads authority or level or
                        compares marks (grep for "level",
                        "restrictive", "authority").

