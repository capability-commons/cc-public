title:                  Rights in forms partners already parse
brief:                  |
                        A full notice and an SPDX expression are forms
                        a partner already reads with its own tools.
                        Free text gives a partner nothing to parse.
description:            |
                        The license field holds an SPDX expression
                        (_data/schema/sch_trait_rights.yaml at
                        properties.license). SPDX defines a formal
                        grammar outside this repository
                        (https://spdx.github.io/spdx-spec/v2.3.1/SPDX-license-expressions/,
                        Annex D). The free text alternative states no
                        grammar (packet). Holds at tenfold size, and
                        needs no tool growth on the partner side.

