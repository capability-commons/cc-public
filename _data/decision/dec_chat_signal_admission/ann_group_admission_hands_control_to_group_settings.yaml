title:                  Group admission dependent on group settings
brief:                  |
                        If the bot answers members of a group, then
                        whoever can join the group can use the bot.
                        That control sits in Signal group settings
                        outside the bot, such as group links.
description:            |
                        Under opt_admit_group_members, the bot answers
                        only members of a Signal group that the
                        operator runs [opt_admit_group_members.yaml
                        brief]. Signal group links let people join a
                        group without being added one by one
                        [https://signal.org/blog/group-links/]. Admin
                        approval for people joining by link is an
                        option the group may or may not turn on
                        [https://signal.org/blog/group-links/].
                        Security asks who can read or change what, and
                        how that is enforced [reg_concern.yaml lines
                        159-161]. ASSUMPTION: members of the group see
                        each other's numbers or profiles, so the group
                        also exposes contributors to one another.
                        Holds at ten times the size: yes, because a
                        larger group is more likely to have its link
                        shared or a lax setting changed.

