title:                  Listed contacts only
brief:                  |
                        For now the bot answers only the accounts on a
                        private list that the operator keeps. A list
                        bounds who can drive the model and whose
                        personal data reaches it, keeps admission in
                        the operator's own data rather than in Signal
                        group settings, and is the least admission
                        code, since every contributor already needs a
                        register entry and a license assent. Admitting
                        the members of a Signal group may replace it,
                        depending on feedback from the rest of DTU.
                        Ruled by WTP on 2026-10-23.

