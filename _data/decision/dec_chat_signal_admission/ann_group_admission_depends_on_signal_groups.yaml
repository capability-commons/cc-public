title:                  Group admission dependent on Signal group state
brief:                  |
                        Admitting members of a Signal group means
                        reading the rule from Signal group state
                        through the client. A private list or a notice
                        keeps the rule in the operator's own data.
description:            |
                        The group option answers only the members of a
                        Signal group that the operator runs
                        [_data/decision/dec_chat_signal_admission/opt_admit_group_members.yaml
                        at brief]. The listed contacts option answers
                        only accounts on a private list the operator
                        keeps
                        [_data/decision/dec_chat_signal_admission/opt_admit_listed_contacts.yaml
                        at brief]. The consent option answers anyone
                        who accepts the notice
                        [_data/decision/dec_chat_signal_admission/opt_admit_anyone_with_consent.yaml
                        at brief]. signal-cli releases older than
                        three months may not work correctly because
                        the server may change
                        [https://ftp.fau.de/gentoo/distfiles/72/signal-cli-bin-0.14.1.README.md].
                        ASSUMPTION: the bot learns group membership
                        only through the Signal client it uses, so a
                        change in how that client or the server
                        reports groups changes who is admitted. The
                        list and the notice need only the sender's
                        identity, which the Signal adapter knows for
                        each contributor
                        (_data/logical_component/lco_chat_signal.yaml
                        at brief). Holds at ten times the size: yes,
                        because the dependency is per mechanism, not
                        per member. A larger group widens the effect
                        of a membership read that goes wrong.

