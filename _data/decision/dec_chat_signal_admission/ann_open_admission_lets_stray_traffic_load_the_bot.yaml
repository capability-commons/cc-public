title:                  Open admission that lets stray traffic load the bot
brief:                  |
                        A bot that answers anyone spends model calls
                        and checks on misdirected or stray messages,
                        which competes with the intended contributors.
                        A list or a group bounds the load to known
                        people.
description:            |
                        The open option answers anyone who writes,
                        once they accept the notice
                        (opt_admit_anyone_with_consent, brief). The
                        other options answer only the members of an
                        operator's group or the accounts on a private
                        list (opt_admit_group_members, brief, and
                        opt_admit_listed_contacts, brief). One cctool
                        check took 24.6 s on the development VM
                        (context.md, measured 2026-10-22). A public
                        Signal number receives some misdirected or
                        unsolicited messages (ASSUMPTION). Holds at
                        ten times the size: yes, because stray traffic
                        grows with how widely the number is known,
                        while a list grows only by the operator's
                        choice.

