title:                  Open admission that lets anyone feed the bot
brief:                  |
                        Answering anyone who accepts a notice lets any
                        Signal user who finds the number drive the LLM
                        and propose items, and the bot receives, and
                        may pass to a model, messages from people
                        outside the purpose. A private list of
                        accounts limits processing to people the
                        operator meant to ask, and lets the operator
                        decide, and revoke, who may act.
description:            |
                        The open option answers anyone who writes,
                        once they accept the notice
                        [_data/decision/dec_chat_signal_admission/opt_admit_anyone_with_consent.yaml,
                        brief]. The listed option answers only
                        accounts on a private list that the operator
                        keeps
                        [_data/decision/dec_chat_signal_admission/opt_admit_listed_contacts.yaml,
                        brief]. The adapter knows which Signal account
                        each contributor writes from
                        [_data/logical_component/lco_chat_signal.yaml
                        at brief]. A message sent before the notice is
                        accepted still reaches the bot [ASSUMPTION]. A
                        likely first instance is member skill profiles
                        for a volunteer team [context.md lines 59-60].
                        ISO/IEC 29100 sets out purpose limitation as a
                        privacy principle
                        [_data/register/reg_concern.yaml at
                        entries.concern_privacy.note]. Security covers
                        the authentication of those who act and
                        resistance to deliberate attack
                        [reg_concern.yaml at
                        entries.concern_security.description].
                        ASSUMPTION: accepting a notice proves nothing
                        about who the sender is or what they intend.
                        ASSUMPTION: a phone number used by a bot
                        spreads beyond its first audience over time.
                        Holds at ten times the size: yes, because a
                        larger list is still a list, while an open
                        bot's reach grows with everyone who learns the
                        number, not with the team it serves.

