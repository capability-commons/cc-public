title:                  C++ build needs for tooling-only peers
brief:                  |
                        If the engine lives in cc-public and ships in
                        its one package, a peer that wants only the
                        tooling and the data still takes whatever the
                        engine's build needs. A separate engine
                        repository leaves the tooling package free of
                        C++ build dependencies.
description:            |
                        Sources:
                        - The versioned package holds the tooling, the
                          shared data and
                          the engine
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml).
                        - Under the route accepted for now, a peer
                          builds a release from
                          source
                          (_data/decision/dec_publishing_route/opt_publish_git_tags_only.yaml;
                          owner's statement, 2026-10-22).
                        - The current environment holds no C++
                          compiler or build tool
                          (search of pixi.lock).
                        - Assumption: some peers will use only the
                          tooling and data, as
                          cc-brave1-demo consumed cc-public before any engine existed
                          (_sources/cc-patrol-notes/plan.md line 14).
                        - Strength: weak; all peers are the
                          maintainer's own today, and
                          a binary channel later would remove the build from the peer
                          side.

