title:                  One release for generator and engine
brief:                  |
                        With the engine in cc-public, the generator
                        and the engine it targets are tested and
                        tagged together, so a release cannot pair a
                        generator with an engine it does not match and
                        a peer takes one versioned dependency. In
                        separate repositories they come from two
                        release streams that a peer must keep in step,
                        and a mismatch shows up only when the peer
                        combines them.
description:            |
                        Sources:
                        - The generator writes the .cpp that calls
                          component functions
                          and emits static_asserts the engine build must satisfy
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          35-40 and 100-101).
                        - Under the peer option, cc-public keeps the
                          schedule generator
                          while the engine lives apart
                          (_data/decision/dec_home_of_the_engine_code/opt_engine_code_in_its_own_peer.yaml at brief).
                        - The maintainer chose one versioned package
                          for how peers bring
                          in cc-public (owner's statement, 2026-10-22;
                          _data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml).
                        - Strength: strong for reliability, which sees
                          a class of
                          integration fault removed by construction; moderate for
                          dependency risk, since SemVer on both sides would make the
                          coupling manageable.

