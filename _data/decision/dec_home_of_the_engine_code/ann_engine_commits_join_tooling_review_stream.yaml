title:                  Engine commits in the tooling's review stream
brief:                  |
                        Putting the engine in cc-public adds its C++
                        commits to the stream the maintainer reviews
                        for the tooling, starting with a rearrangement
                        of the tooling's source tree. A separate
                        repository keeps each stream smaller and lets
                        each be reviewed at its own pace, though with
                        one reviewer the total load is the same.
description:            |
                        Sources:
                        - Owner's statement, 2026-10-22: the
                          move "may require us
                          to re-arrange the cc-tool source code a bit."
                        - The previous iteration grew faster than it
                          could be reviewed
                          (AGENTS.md lines 236-237).
                        - The engine is new C++, with dynamic-graph
                          capabilities planned
                          (owner's statements, 2026-10-20 and 2026-10-21; context note,
                          _sources/context.md line 36).
                        - Assumption: the maintainer reviews both
                          cc-public and any
                          engine repository.
                        - Strength: weak; with one reviewer, the split
                          changes how
                          changes are grouped more than how many there are.

