title:                  Upward reference to a private engine
brief:                  |
                        Consumption runs only downward, so cc-public's
                        schedule generator and dataflow checks could
                        not refer to an engine kept in cc-patrol,
                        which consumes cc-public. Keeping it there
                        would need a second copy or an exception to
                        the ruled direction.
description:            |
                        Sources:
                        - A reference may run within a segment or into
                          one it consumes,
                          never upward or sideways
                          (_data/decision/dec_references_across_instances/opt_segments_consume_downward.yaml
                          lines 12-18;
                          _data/decision/dec_references_across_instances/ruling_references_across_instances.yaml
                          lines 12-17).
                        - cc-patrol is private, under Axair's
                          copyright
                          (_sources/cc-patrol-notes/plan.md line 109).
                        - Strength: moderate; it holds if cc-public
                          items must refer to
                          the engine, which the plan for generated schedules implies.

