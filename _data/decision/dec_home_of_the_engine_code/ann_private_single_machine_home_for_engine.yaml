title:                  A private, single-machine home for the engine
brief:                  |
                        cc-patrol is private, local to one machine and
                        has no remote yet, so an engine kept there has
                        one copy that a machine failure loses, and is
                        changed and tested against Patrol alone, out
                        of sight of cc-public's gate and of anyone who
                        reviews cc-public. It would also be missing
                        from the package through which the owner wants
                        peers to use the engine.
description:            |
                        Sources:
                        - cc-patrol is private, under Axair's
                          copyright, local to atlas
                          only, with no remote yet (_sources/cc-patrol-notes/plan.md
                          lines 109 and 112).
                        - cc-public's gate never sees cc-patrol
                          (_sources/cc-patrol-notes/plan.md lines 20-21).
                        - origin
                          (github.com/capability-commons/cc-public)
                          has dev
                          (context note, _sources/context.md line 32).
                        - Owner's statement, 2026-10-22: "How do
                          federated peers
                          use this work? Do they need to bring in some cc-public
                          distribution as a dependency in their repo? That way they can
                          use the engine and all the other tooling also."
                        - Owner's statement, 2026-10-22: chose
                          "Versioned package"
                          for how peers bring in cc-public.
                        - The owner wants the cc-public and cc-patrol
                          boundary clean
                          enough to move either side (_sources/cc-patrol-notes/plan.md
                          lines 112-115).
                        - Strength: strong on backup while cc-patrol
                          has no remote, and
                          on availability to peers; moderate on review and testing,
                          since today only the maintainer reviews and no other engine
                          user exists yet.

