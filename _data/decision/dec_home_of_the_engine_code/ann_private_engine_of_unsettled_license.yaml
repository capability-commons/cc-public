title:                  Engine under a license not yet settled
brief:                  |
                        cc-patrol is private, under a copyright the
                        maintainer intends to assign to another
                        company, with its license not yet settled, so
                        a public generator in cc-public would target
                        an engine that outside partners cannot take
                        and whose terms are unknown. Keeping the
                        engine in cc-public keeps its license that of
                        cc-public.
description:            |
                        Sources:
                        - cc-patrol is private, under Axair's
                          copyright, local to atlas
                          only (_sources/cc-patrol-notes/plan.md line 109).
                        - Copyright is William Payne, who intends to
                          assign Patrol IP to
                          Axair Systems later, with the license still to settle
                          (_sources/cc-patrol-notes/plan.md lines 119-120).
                        - cc-public is licensed Apache-2.0 (LICENSE
                          line 2;
                          pyproject.toml line 40).
                        - The cc-patrol option keeps the engine in
                          cc-patrol
                          (_data/decision/dec_home_of_the_engine_code/opt_engine_code_in_cc_patrol.yaml
                          lines 12-14).
                        - The schedule generator is part of cctool,
                          which generates the
                          frozen C++ schedule (_sources/cc-patrol-notes/variants.md
                          lines 92-95).

