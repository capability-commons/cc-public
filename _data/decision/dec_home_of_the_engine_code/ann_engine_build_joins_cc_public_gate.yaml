title:                  Engine build time in cc-public's gate
brief:                  |
                        With the engine in cc-public, a C++ build and
                        its tests join a commit gate that already
                        takes about 78 s on 2 CPUs, under half of the
                        180 s at which a remote device call dies; in a
                        peer of its own or in cc-patrol the tooling's
                        gate stays as it is. How often cc-public pays
                        depends on the decision on when the gate
                        builds the C++, so this argues for care there
                        as much as against this option, and the
                        engine's run-time speed does not depend on
                        where its source lives.
description:            |
                        Sources:
                        - A code commit takes about 78 s in the gate
                          on atlas, which has
                          2 CPUs (context note, _sources/context.md line 31).
                        - Device tool calls in a remote session die at
                          180 s
                          (_data/decision/dec_growth_policy/ann_small_tree_keeps_gate_in_session_limit.yaml).
                        - The gate runs its stages in a temporary copy
                          of the staged
                          content (src/cctool/gate/gate.py).
                        - Assumption: a C++ build and its tests add
                          tens of seconds or
                          more to a gate that runs them; this is not measured.

