title:                  Second gate and release process for one component
brief:                  |
                        In cc-public the engine shares the one gate,
                        history check and release process, and ships
                        in the one package peers already pin. A peer
                        repository of its own needs a second gate, a
                        second release process and a consuming edge
                        for a component the package is meant to carry.
description:            |
                        Sources:
                        - Owner's statement, 2026-10-22: "I want
                          the engine's C++
                          to live in the cc-public repository - but that may require us
                          to re-arrange the cc-tool source code a bit."
                        - The versioned package holds the tooling, the
                          shared data and
                          the engine
                          (_data/decision/dec_how_peers_get_cc_public/opt_peers_take_a_versioned_package.yaml).

