title:                  Generator and engine in one commit and one gate
brief:                  |
                        The schedule generator writes the C++ that the
                        engine compiles and runs, so a change to one
                        is right only if the other agrees. With the
                        engine in cc-public, one commit changes both,
                        one gate tests them together and one impact
                        listing shows the whole change to a reviewer;
                        elsewhere the same change spans two
                        repositories and a release between them, and
                        the two can disagree without either gate
                        seeing it.
description:            |
                        Sources:
                        - The dataflow engine component covers the C++
                          engine and the
                          generator that turns a resolved dataflow graph into what the
                          engine runs (_data/logical_component/lco_dataflow_engine.yaml at brief).
                        - Generated code includes the engine header
                          and calls component
                          functions through its signature, with slot arrays
                          (_sources/axair-orchestrator/docs/execution_levels.md lines
                          19-26 and 33-52).
                        - cctool resolves a variant and generates the
                          frozen C++
                          schedule from it (_sources/cc-patrol-notes/variants.md lines
                          92-95).
                        - The peer option keeps the dataflow model,
                          its checks and the
                          schedule generator in cc-public and the engine elsewhere
                          (_data/decision/dec_home_of_the_engine_code/opt_engine_code_in_its_own_peer.yaml at brief).
                        - cctool impact lists the items a commit adds,
                          removes, renames
                          or changes and the untouched items linked to them, for review
                          (AGENTS.md#finding-things-out).
                        - Owner's statement, 2026-10-22: "I want
                          the engine's C++
                          to live in the cc-public repository - but that may require us
                          to re-arrange the cc-tool source code a bit."
                        - Strength: strong for maintainability and
                          functional
                          suitability; moderate for reviewability, since how often a
                          change crosses the model and the engine is not yet known.

