title:                  Condition as an ordinary factual annotation
brief:                  |
                        A dated condition is a factual annotation
                        joined by relation_supports. The pattern adds
                        no new kind of item, field or relation.
description:            |
                        relation_supports and relation_challenges
                        constrain their target by
                        relcon_can_be_target_of_an_argument
                        (_data/register/reg_relation.yaml lines
                        235-238 and 267-270), and type_annotation
                        plays rol_can_be_target_of_an_argument
                        (reg_data_item_type.yaml, entry
                        type_annotation at line 432). The checker
                        already separates practical annotations from
                        factual ones (src/cc_public/check/check.lp
                        lines 2698-2707 and 2779-2782).
                        ann_gate_takes_a_minute uses only standard
                        fields and relation_is_about and
                        relation_supports edges.

