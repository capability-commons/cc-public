title:                  Condition as an ordinary factual annotation
brief:                  |
                        A dated condition is a factual annotation
                        joined by r_supports. The pattern adds no new
                        kind of item, field or relation.
description:            |
                        r_supports and r_challenges both have
                        type_annotation in their range
                        (_data/register/reg_relation.yaml lines
                        198-203 and 228-233). The checker already
                        separates practical annotations from factual
                        ones (src/cc_public/check/check.lp lines
                        551-563 and 580-590). ann_gate_takes_a_minute
                        uses only standard fields and r_is_about and
                        r_supports edges.

