title:                  Argument relations now governed by roles, not a range
brief:                  |
                        ann_condition_needs_no_new_mechanism says
                        relation_supports and relation_challenges have
                        type_annotation in their range. Relations have
                        no range now. An annotation may be their
                        target because its type plays
                        rol_can_be_target_of_an_argument.
description:            |
                        relation_supports and relation_challenges
                        (_data/register/reg_relation.yaml at
                        entries.relation_supports and
                        entries.relation_challenges) constrain their
                        source by relcon_is_argument and their target
                        by relcon_can_be_target_of_an_argument.
                        type_annotation plays rol_argument and
                        rol_can_be_target_of_an_argument
                        (reg_data_item_type.yaml at
                        entries.type_annotation). The claim that a
                        condition needs no new kind of item, field or
                        relation still holds. Found in the review of
                        2026-10-22.

