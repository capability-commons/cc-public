title:                  Date of a condition held only in prose
brief:                  |
                        The date and source of a condition live only
                        in its brief, and no check reads them. The
                        graph cannot list stale conditions, so
                        re-measuring depends on a person noticing.
description:            |
                        An annotation has no time field
                        (_data/schema/sch_annotation.yaml at
                        description). The date, machine and tree size
                        of ann_gate_takes_a_minute are in its brief
                        (lines 12-15). No relation links an annotation
                        to a commit or a run
                        (_data/register/reg_relation.yaml, 35 relation
                        entries). No rule in src/cctool/check/check.lp
                        reads a date or an unanswered challenge;
                        relation_challenges appears only at lines
                        1263, 1393, 1493 and 2705, each on a direct
                        edge. The gate time moved between about 2 min
                        and about 75s on 2026-10-14 (memory/MEMORY.md
                        lines 45, 47, 54). On 2026-10-22 it was
                        measured at 2m13s with 577 tests, then 78 s
                        after changes (notes/gate-speed/proposal.md
                        lines 3, 7, 13, 63), against about a minute
                        and about 170 tests in
                        ann_gate_takes_a_minute; still no item
                        challenges it. No check output changed for the
                        ruling of 6c0a949 when 86df114 challenged
                        ann_each_evaluation_pays_a_fixed_cost, an
                        argument in the same decision (the ruling
                        names no premises). ASSUMPTION: re-measuring
                        is manual work.

