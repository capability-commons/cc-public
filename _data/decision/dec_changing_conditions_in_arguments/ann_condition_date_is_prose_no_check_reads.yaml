title:                  Date of a condition held only in prose
brief:                  |
                        The date and source of a condition live only
                        in its brief, and no check reads them. The
                        graph cannot list stale conditions, so
                        re-measuring depends on a person noticing.
description:            |
                        An annotation has no time field
                        (_data/schema/sch_annotation.yaml lines
                        29-31). The date, machine and tree size of
                        ann_gate_takes_a_minute are in its brief
                        (lines 12-15). No relation links an annotation
                        to a commit or a run
                        (_data/register/reg_relation.yaml lines
                        64-464). No rule in
                        src/cc_public/check/check.lp reads a date or
                        an unanswered challenge; r_challenges appears
                        only at lines 434 and 562. The gate time moved
                        between about 2 min and about 75s on
                        2026-10-14 (memory/MEMORY.md lines 45, 47,
                        54), and no item challenges
                        ann_gate_takes_a_minute. No check output
                        changed for the determination of 6c0a949 when
                        86df114 challenged
                        ann_each_evaluation_pays_a_fixed_cost, an
                        argument in the same decision (the
                        determination names no premises). ASSUMPTION:
                        re-measuring is manual work.

