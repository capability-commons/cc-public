title:                  Pattern not followed in the later case
brief:                  |
                        The one later measurement challenges an
                        argument that holds its own condition inside
                        it, and no check tells the two patterns apart.
                        The pattern gives a separate condition only
                        where an author chooses one.
description:            |
                        ann_each_evaluation_pays_a_fixed_cost states
                        "132 of 151 test functions need it" inside an
                        argument that challenges
                        opt_cross_item_checks_in_souffle
                        (_data/decision/dec_cross_item_checks_engine/,
                        lines 12-18 and 27-30).
                        ann_clingo_is_slower_at_this_size challenges
                        that whole annotation (lines 29-32, commit
                        86df114). ann_python_is_fast_enough also
                        carries "for the graph as it is" inline. The
                        checks classify an annotation only by its
                        edges to options (src/cc_public/check/check.lp
                        lines 552-562).

