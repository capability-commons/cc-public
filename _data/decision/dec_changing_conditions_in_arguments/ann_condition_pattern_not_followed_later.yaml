title:                  Pattern not followed in the later case
brief:                  |
                        Later measurements challenge arguments that
                        hold their own condition inside them, and no
                        check tells the two patterns apart. The
                        pattern gives a separate condition only where
                        an author chooses one.
description:            |
                        ann_each_evaluation_pays_a_fixed_cost states
                        "132 of 151 test functions need it" inside an
                        argument that challenges
                        opt_cross_item_checks_in_souffle
                        (_data/decision/dec_cross_item_checks_engine/,
                        lines 12-18 and 27-30).
                        ann_clingo_is_slower_at_this_size challenges
                        that whole annotation (lines 29-32, commit
                        86df114). ann_python_is_fast_enough also
                        carries "for the graph as it is" inline. Since
                        then 187 annotations challenge another
                        annotation, 66 of them marked "Found in the
                        review" (grep over _data), and each names a
                        whole argument. The later gate time of 78 s is
                        stated inside
                        ann_full_gate_lengthens_time_to_a_fix
                        (line 16) and
                        ann_cpp_build_every_commit_near_time_limits
                        (line 14), not as its own annotation. Only
                        three annotations in the tree support another
                        annotation, ann_gate_takes_a_minute among
                        them. The checks classify an annotation only
                        by its edges to options
                        (src/cc_public/check/check.lp lines
                        2698-2707).

