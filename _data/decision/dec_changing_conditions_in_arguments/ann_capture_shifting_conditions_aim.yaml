title:                  Shifting conditions captured for revisiting
brief:                  |
                        The owner wants the system to capture shifting
                        conditions so that a decision can be
                        revisited. An assistant-written rationale adds
                        that a dated condition held apart lets a later
                        measurement challenge it, and that the support
                        it gives falls away with it.
description:            |
                        The aim is the owner's statement,
                        2026-10-14T16:11:18Z: "Our system should be
                        able to capture these sorts of shifting
                        conditions, and the nonmonotonic/defeasible
                        nature of argumentation should enable it." The
                        pattern and the claim that the support falls
                        away were written by an assistant, not by
                        Will, in the description of commit 6592fb5. In
                        commit 86df114 a later measurement was again
                        kept as its own dated annotation, though it
                        challenges an argument rather than supporting
                        one.

