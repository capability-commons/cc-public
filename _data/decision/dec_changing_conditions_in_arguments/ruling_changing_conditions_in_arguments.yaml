title:                  Condition stated inside the argument
brief:                  |
                        A condition is stated with its date and source
                        inside the argument that rests on it, and a
                        later fact that changes it is a factual
                        annotation that challenges that argument. This
                        is what the tree does in nearly every case,
                        and it captures a shifting condition as a
                        defeasible challenge, as an attack on a
                        premise does in ASPIC+. The one condition kept
                        as its own annotation went stale and was never
                        challenged, so its own id bought nothing.
                        Ruled by WTP on 2026-10-23.

