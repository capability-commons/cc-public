title:                  Contributor asked to repeat what they already said
brief:                  |
                        Keeping no transcript forces the contributor
                        to repeat earlier answers whenever the bot
                        needs them again while the item is open.
                        Keeping it until the item lands avoids that,
                        and keeping it longer adds nothing for the
                        contributor.
description:            |
                        The no-transcript option keeps only the draft
                        and its checklist, never the messages
                        (_data/decision/dec_chat_transcript_retention/opt_keep_no_transcript.yaml,
                        brief). The delete-on-landing option keeps a
                        transcript in private until its items land or
                        its draft is dropped
                        (_data/decision/dec_chat_transcript_retention/opt_delete_transcript_on_landing.yaml,
                        brief). The chat core leads the conversation
                        from a checklist, keeps the draft and judges
                        it (_data/logical_component/lco_chat_core.yaml
                        lines 12-17). The readback happens after any
                        automated checks and corrections are applied
                        (owner's statement). The eval is meant to give
                        feedback when information is insufficient,
                        inaccurate or poorly phrased (owner's
                        statement). ASSUMPTION: a correction or an
                        eval finding often needs what the contributor
                        said beyond the field value, such as a
                        qualifier or a remark, and the draft does not
                        hold it. ASSUMPTION: a conversation over a
                        messaging app spans breaks of hours or days,
                        so the contributor does not recall their exact
                        earlier words. ASSUMPTION: once an item lands,
                        a later correction starts from the item
                        itself, so a kept transcript saves the
                        contributor no further effort. The concern
                        asks how much time and attention a task takes
                        a person and how well the design recovers from
                        mistakes (_data/register/reg_concern.yaml
                        lines 251-254). Holds at ten times the size:
                        yes, because each item still has its own open
                        conversation, and the repeat questions grow
                        with the number of items under the
                        no-transcript option.

