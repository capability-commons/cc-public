title:                  Retention period that can be stated and shown
brief:                  |
                        Deleting a transcript when its items land
                        gives a retention rule the project can tell
                        each contributor and show it follows. Keeping
                        every transcript with no end leaves no period
                        to state, and the law asks for one where it
                        applies. The law does not itself name landing
                        as the point of deletion.
description:            |
                        Under the UK GDPR, personal data in
                        identifiable form may be kept for no longer
                        than is necessary for the purposes of the
                        processing [UK GDPR Art 5(1)(e),
                        https://www.legislation.gov.uk/eur/2016/679/chapter/II].
                        The controller must be able to show that it
                        complies with the principles [UK GDPR Art
                        5(2), same URL]. When data are collected from
                        a person, the controller must tell them how
                        long the data will be kept, or the criteria
                        used to set that period [UK GDPR Art 13(2)(a),
                        https://www.legislation.gov.uk/eur/2016/679/article/13].
                        The record of processing must give, where
                        feasible, the envisaged time limits for
                        erasure [UK GDPR Art 30(1)(f),
                        https://www.legislation.gov.uk/eur/2016/679/article/30].
                        Art 5(1)(e) names no fixed period and no
                        event, so it does not by itself require
                        deletion at landing [UK GDPR Art 5(1)(e), same
                        chapter II URL]. The owner believes GDPR
                        forces deletion on landing [owner's
                        statement]. The delete option keeps a
                        transcript until its items land or its draft
                        is dropped
                        [_data/decision/dec_chat_transcript_retention/opt_delete_transcript_on_landing.yaml,
                        brief]. The keep option keeps every
                        transcript, with no end stated
                        [_data/decision/dec_chat_transcript_retention/opt_keep_transcript_privately.yaml,
                        brief]. The no-transcript option keeps only
                        the draft and its checklist
                        [_data/decision/dec_chat_transcript_retention/opt_keep_no_transcript.yaml,
                        brief]. The UK GDPR applies to a controller
                        established in the UK, and to one outside the
                        UK that offers services to people in the UK
                        [UK GDPR Art 3(1) and 3(2),
                        https://www.legislation.gov.uk/eur/2016/679/chapter/I].
                        It does not apply to an individual's purely
                        personal or household activity [UK GDPR Art
                        2(2)(a), same URL]. ASSUMPTION: the maintainer
                        and the team are in the UK or the EU, and the
                        EU GDPR has the same articles, since EUR-Lex
                        could not be opened from here. ASSUMPTION: a
                        bot run for a volunteer team is not a purely
                        personal or household activity. The CCPA binds
                        only a for-profit business that meets a
                        revenue or data-volume threshold
                        [https://cppa.ca.gov/pdf/business_comply.pdf].
                        COPPA binds an operator of a service directed
                        to children under 13, or one with actual
                        knowledge that it collects from such a child
                        [16 CFR 312.2 and 312.3,
                        https://www.ecfr.gov/current/title-16/chapter-I/subchapter-C/part-312/section-312.3].
                        ASSUMPTION: a skills bot for a volunteer team
                        meets neither condition. Holds at ten times
                        the size: yes, because the rule is one event
                        per conversation, while a store kept with no
                        end grows with every conversation and still
                        has no period to state.

