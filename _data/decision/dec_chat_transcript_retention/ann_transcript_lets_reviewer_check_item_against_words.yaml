title:                  Transcript at hand while the item is reviewed
brief:                  |
                        The reviewer of a bot branch can check an item
                        against what the contributor said only while
                        the transcript exists. Keeping it until the
                        item lands gives review its source, and
                        keeping none leaves only the draft to judge.
description:            |
                        An item from a chat is reviewed on the branch
                        of the bot before it lands in two of the three
                        gate options (opt_readback_and_branch_review,
                        opt_branch_review_only). The no-transcript
                        option keeps only the draft and its checklist,
                        never the messages
                        (_data/decision/dec_chat_transcript_retention/opt_keep_no_transcript.yaml,
                        line 12-14). The delete-on-landing option
                        keeps a transcript in private until its items
                        land or its draft is dropped
                        (opt_delete_transcript_on_landing.yaml, line
                        12-14). The keep option keeps every transcript
                        in the private store
                        (opt_keep_transcript_privately.yaml, line
                        12-14). cctool checks form and graph
                        consistency, not whether a value matches what
                        was said (src/cctool/edit/edit.py lines
                        1075-1098). Data in the graph is expected to
                        be almost entirely LLM generated (owner's
                        statement). ASSUMPTION: a conversation over a
                        messaging app can span more than one session,
                        so the LLM needs earlier messages to resolve
                        later answers. ASSUMPTION: a transcript is
                        many times longer than the item it yields, so
                        a reviewer reads it only to spot-check, not in
                        full. Holds at ten times the size: yes for
                        function, because each item still needs its
                        own source text at review, whatever the number
                        of items. For review it holds partly: the
                        transcript stays useful for spot checks of
                        chosen items, but no reviewer reads every
                        transcript at ten times the volume.

