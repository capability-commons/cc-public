title:                  Transcript as the only record of why an item says what it says
brief:                  |
                        A kept transcript is the one record that links
                        an item to what the contributor actually said.
                        Deleting it on landing, or never keeping it,
                        leaves the item with no source to trace back
                        to.
description:            |
                        Data in the graph is expected to be almost
                        entirely LLM generated, with humans mainly
                        inspecting and reviewing (owner's statement).
                        A bot elicits the fields of one item type in
                        conversation and proposes the item through
                        cctool editing commands (context.md, "What is
                        being designed"). A commit item records one
                        change and why it was made
                        (_data/schema/sch_commit.yaml at brief), and
                        its brief is written when the commit is made,
                        here by the bot (ASSUMPTION). The edit
                        commands refuse only an edit that adds a check
                        failure (src/cctool/edit/edit.py, function
                        apply at line 1075), so they do not test an
                        item against what was said.
                        opt_delete_transcript_on_landing deletes the
                        transcript once its items land (its option
                        file), and opt_keep_no_transcript keeps only
                        the draft and its checklist (its option file).
                        Questions about why an item says something
                        tend to arise after it lands, when it is used
                        (ASSUMPTION). Holds at ten times the size:
                        yes, because each item still has exactly one
                        conversation as its source, and storage grows
                        only in the private store.

