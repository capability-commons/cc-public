title:                  Transcripts holding more than the item needs
brief:                  |
                        A transcript holds everything said, including
                        asides and other people mentioned, while the
                        item holds only the schema fields. Keeping
                        every transcript indefinitely holds the most
                        personal data for the longest time.
description:            |
                        A bot elicits the fields of one data item type
                        using the type's JSON Schema [context.md lines
                        4-7]. The keep option holds every transcript
                        in the private store as the record of where an
                        item came from
                        [_data/decision/dec_chat_transcript_retention/opt_keep_transcript_privately.yaml,
                        brief]. The delete option keeps a transcript
                        only until its items land or its draft is
                        dropped
                        [_data/decision/dec_chat_transcript_retention/opt_delete_transcript_on_landing.yaml,
                        brief]. The no-transcript option keeps only
                        the draft and its checklist
                        [_data/decision/dec_chat_transcript_retention/opt_keep_no_transcript.yaml,
                        brief]. A free conversation can carry text
                        beyond the schema fields, such as remarks
                        about third parties [ASSUMPTION]. The privacy
                        concern asks for how long personal data is
                        kept [_data/register/reg_concern.yaml at
                        entries.concern_privacy.question]. Holds at
                        ten times the size: yes, because kept
                        transcripts grow with every conversation, and
                        each removal request then has to search them
                        all.

