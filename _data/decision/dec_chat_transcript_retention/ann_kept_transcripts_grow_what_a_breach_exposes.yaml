title:                  Kept transcripts widening what a breach exposes
brief:                  |
                        Transcripts kept for good build a growing
                        store of raw personal data on the bot's host.
                        Deleting them once the items land bounds that
                        store to work in progress.
description:            |
                        Under opt_keep_transcript_privately, every
                        transcript is kept in the private store
                        [opt_keep_transcript_privately.yaml brief].
                        Under opt_delete_transcript_on_landing, a
                        transcript is kept until its items land or its
                        draft is dropped
                        [opt_delete_transcript_on_landing.yaml brief].
                        A likely first instance holds personal data,
                        now captured from Signal calls and a
                        spreadsheet [context.md lines 59-60]. Security
                        asks what an attacker can reach and what it
                        would cost [reg_concern.yaml lines 159-161].
                        ASSUMPTION: a transcript holds more than the
                        item, such as asides, other people named, and
                        replies the bot did not use. Holds at ten
                        times the size: yes, because the kept store
                        grows with every conversation while the
                        in-progress store stays near the number of
                        open drafts.

