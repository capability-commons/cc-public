title:                  Reviewer left blind without a transcript
brief:                  |
                        Without the messages, a reviewer cannot tell
                        whether the bot recorded what the contributor
                        said, or whether a message steered the bot.
                        Keeping the transcript until landing gives
                        review its evidence.
description:            |
                        Under opt_keep_no_transcript, only the draft
                        and its checklist are kept, never the messages
                        [opt_keep_no_transcript.yaml brief]. The bot
                        leads the conversation and judges and writes
                        the draft itself
                        [_data/logical_component/lco_chat_core.yaml
                        lines 12-17]. Security includes the integrity
                        of data and accountability for actions
                        [reg_concern.yaml lines 147-151]. ASSUMPTION:
                        a message crafted to manipulate the LLM shows
                        in the transcript but may leave no sign in the
                        draft. Holds at ten times the size: yes,
                        because review of each item still needs its
                        source, whatever the number of items.

